<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Big+Shoulders+Display:wght@700;900&family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --velvet-deep: #1c040b;
  --brass: #e2a93b;
  --brass-hi: #ffe7a3;
  --brass-lo: #8a5a12;
  --cream: #fff3d6;
  --ink: #2a0a12;
  --red: #d7263d;
  --dim: #ecd2b4;
  --w: min(78vw, calc(100svh - 22rem), 30rem);
  --disp: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  font-size: 100%;
}
html { height: 100%; }
body {
  min-height: 100%;
  color: var(--cream);
  font-family: 'Chivo Mono', ui-monospace, monospace;
  background-color: var(--velvet-deep);
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 48%, rgba(255, 214, 140, .22), transparent 72%),
    radial-gradient(ellipse 120% 30% at 50% 100%, rgba(0, 0, 0, .75), transparent 70%),
    linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 18%, transparent 80%, rgba(0, 0, 0, .5)),
    repeating-linear-gradient(90deg, #5c1024 0, #3a0815 1.6rem, #2a0510 2.2rem, #4d0d1f 3.2rem, #5c1024 4.4rem);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body.disco { animation: discoBg 1.6s linear infinite; }
@keyframes discoBg { to { filter: hue-rotate(360deg); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 3px; }
main { display: flex; flex-direction: column; align-items: center; gap: .55rem; padding: .7rem 0 6.5rem; min-height: 100svh; }

/* ---------- header ---------- */
.top { width: 100%; max-width: 72rem; padding-inline: 1rem; display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
.sign { line-height: 1; }
.sign small { display: block; font: 700 .72rem/1 var(--disp); letter-spacing: .32em; text-transform: uppercase; color: var(--brass-hi); margin-bottom: .2rem; }
.sign h1 {
  font: 400 clamp(1.9rem, 8vw, 3rem)/1 'Shrikhand', Georgia, serif;
  color: var(--cream);
  text-shadow: 0 .06em 0 var(--red), 0 .12em 0 var(--ink), 0 0 1.2rem rgba(255, 190, 90, .35);
  transform: rotate(-2deg);
}
.hud { display: flex; gap: .4rem; }
.pill {
  min-height: 2.75rem; min-width: 2.75rem; padding: .3rem .8rem;
  display: inline-flex; align-items: center; gap: .35rem;
  border-radius: 999px; border: 2px solid var(--brass);
  background: rgba(20, 3, 8, .75); color: var(--cream);
  font: 900 1.25rem/1 var(--disp); letter-spacing: .04em;
  cursor: pointer;
}
.pill b { font-weight: 900; min-width: 1.2ch; }
.pill.bump { animation: bump .45s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); background: var(--brass); color: var(--ink); } }

/* ---------- tabs (phones) ---------- */
.tabs { display: flex; gap: .3rem; padding: .25rem; border-radius: 999px; background: rgba(20, 3, 8, .7); border: 2px solid var(--brass-lo); }
.tab {
  min-height: 2.75rem; padding: .3rem 1rem; border-radius: 999px; border: 0;
  background: transparent; color: var(--dim);
  font: 900 1.05rem/1 var(--disp); letter-spacing: .07em; text-transform: uppercase; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--brass); color: var(--ink); }

/* ---------- the two wheels ---------- */
.wheels {
  width: 100%;
  display: flex; gap: 1rem;
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-behavior: smooth;
  padding: .3rem 7vw .4rem;
  scrollbar-width: none;
}
.wheels::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 86vw; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: .55rem; }
.ptitle { font: 900 1.05rem/1 var(--disp); letter-spacing: .3em; text-transform: uppercase; color: var(--brass-hi); }
.stage {
  position: relative; width: var(--w); aspect-ratio: 1; flex: none;
  margin-top: .9rem;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.rim {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 calc(var(--w) * .435), rgba(0,0,0,.45) calc(var(--w) * .44), transparent calc(var(--w) * .45)),
    conic-gradient(from 20deg, var(--brass-lo), var(--brass-hi), var(--brass), var(--brass-lo), var(--brass-hi), var(--brass), var(--brass-lo), var(--brass-hi), var(--brass-lo));
  box-shadow: 0 1.2rem 2.5rem rgba(0, 0, 0, .65), 0 0 0 .3rem var(--ink), inset 0 0 0 .2rem rgba(255, 240, 200, .5);
}
.quirk .rim { background:
    radial-gradient(circle, transparent 0 calc(var(--w) * .435), rgba(0,0,0,.45) calc(var(--w) * .44), transparent calc(var(--w) * .45)),
    conic-gradient(from 0deg, #1f6f8b, #9be7ff, #2a9d8f, #135468, #9be7ff, #2a9d8f, #135468, #9be7ff, #1f6f8b); }
canvas.wheel { position: absolute; left: 7%; top: 7%; width: 86%; height: 86%; border-radius: 50%; cursor: grab; }
.stage.dragging canvas.wheel { cursor: grabbing; }
.stage.sneeze canvas.wheel { animation: sneeze .6s ease-out; }
@keyframes sneeze { 20% { transform: scale(1.08) rotate(-4deg); } 40% { transform: scale(.94) rotate(5deg); } 60% { transform: scale(1.03) rotate(-2deg); } }
.bulbs { position: absolute; inset: 0; pointer-events: none; }
.bulb {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--w) * .034); height: calc(var(--w) * .034);
  margin: calc(var(--w) * -.017);
  border-radius: 50%;
  transform: rotate(calc(var(--i) * 15deg)) translateY(calc(var(--w) * -.4675));
  background: #fff8dc;
  box-shadow: 0 0 .5rem .15rem rgba(255, 214, 110, .9);
  animation: chase var(--chase, 2.4s) linear infinite;
  animation-delay: calc(var(--i) * var(--chase, 2.4s) / -6);
}
.stage.spinning { --chase: .5s; }
.stage.won .bulb { animation: blinkAll .32s steps(1) infinite; animation-delay: 0s; }
.stage.jackpot .bulb { animation: rainbow .4s steps(1) infinite; animation-delay: calc(var(--i) * -.05s); }
@keyframes chase { 0%, 45% { background: #fff8dc; box-shadow: 0 0 .5rem .15rem rgba(255, 214, 110, .9); } 50%, 100% { background: #7d4b12; box-shadow: none; } }
@keyframes blinkAll { 0% { background: #fff8dc; box-shadow: 0 0 .7rem .25rem rgba(255, 230, 140, 1); } 50% { background: #7d4b12; box-shadow: none; } }
@keyframes rainbow { 0% { background: #ff4d6d; box-shadow: 0 0 .7rem .2rem #ff4d6d; } 25% { background: #ffd23f; box-shadow: 0 0 .7rem .2rem #ffd23f; } 50% { background: #3bceac; box-shadow: 0 0 .7rem .2rem #3bceac; } 75% { background: #5aa9e6; box-shadow: 0 0 .7rem .2rem #5aa9e6; } }
.pointer {
  position: absolute; left: 50%; top: -3.5%;
  width: 13%; margin-left: -6.5%;
  transform-origin: 50% 18%;
  pointer-events: none;
  filter: drop-shadow(0 .25rem .2rem rgba(0, 0, 0, .55));
  z-index: 3;
}
.pointer svg { display: block; width: 100%; height: auto; }
.hub {
  position: absolute; left: 50%; top: 50%;
  width: 24%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; border: calc(var(--w) * .012) solid var(--brass-hi);
  background: radial-gradient(circle at 38% 32%, #ff5a6e, var(--red) 45%, #7c0f1f);
  color: var(--cream);
  font: 900 calc(var(--w) * .062)/1 var(--disp);
  letter-spacing: .06em;
  text-shadow: 0 .12rem 0 rgba(0, 0, 0, .45);
  box-shadow: 0 .4rem 1rem rgba(0, 0, 0, .55), inset 0 -.3rem .6rem rgba(0, 0, 0, .35);
  cursor: pointer; z-index: 2;
  transition: transform .12s;
}
.quirk .hub { background: radial-gradient(circle at 38% 32%, #5fe0d0, #0f7c74 45%, #07403b); }
.hub:hover { transform: translate(-50%, -50%) scale(1.05); }
.hub:active { transform: translate(-50%, -50%) scale(.95); }
.stage.spinning .hub { cursor: default; filter: saturate(.75) brightness(.9); }
.hat { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%) rotate(-12deg); font-size: calc(var(--w) * .1); z-index: 3; pointer-events: none; filter: drop-shadow(0 .2rem .15rem rgba(0,0,0,.5)); }
.smug { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: calc(var(--w) * .2); z-index: 4; pointer-events: none; animation: smug 2.2s ease-out both; }
@keyframes smug { 0% { transform: translate(-50%, -50%) scale(0); } 15% { transform: translate(-50%, -50%) scale(1.2) rotate(-8deg); } 30%, 80% { transform: translate(-50%, -50%) scale(1) rotate(6deg); } 100% { transform: translate(-50%, -50%) scale(0); } }

/* callout over a wheel (quirk results) */
.callout {
  position: absolute; left: 50%; top: 56%; z-index: 6;
  width: 92%; transform: translate(-50%, -50%);
  background: var(--cream); color: var(--ink);
  border-radius: .9rem; padding: .7rem .8rem .8rem;
  box-shadow: 0 0 0 .25rem var(--brass), 0 0 0 .45rem var(--ink), 0 1rem 2rem rgba(0, 0, 0, .6);
  text-align: center; cursor: pointer;
  animation: callIn .45s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes callIn { from { transform: translate(-50%, -50%) scale(.4) rotate(-8deg); } to { transform: translate(-50%, -50%) scale(1) rotate(0); } }
.callout .ce { font-size: 2.6rem; line-height: 1; }
.callout .ct { font: 900 1.6rem/1.05 var(--disp); letter-spacing: .05em; text-transform: uppercase; color: var(--red); margin-top: .2rem; }
.callout .cl { font-size: .8rem; line-height: 1.4; margin-top: .3rem; color: #4a1a24; }

/* ticker + controls */
.ticker {
  width: min(22rem, 100%); min-height: 3rem;
  display: flex; align-items: center; justify-content: center; gap: .55rem;
  padding: .3rem 1rem;
  border-radius: .7rem;
  background: #140308; border: 3px solid var(--brass);
  box-shadow: inset 0 0 1rem rgba(0, 0, 0, .9), 0 0 0 3px var(--ink);
  font: 900 clamp(1.25rem, 5.6vw, 1.7rem)/1.05 var(--disp);
  letter-spacing: .04em; text-transform: uppercase;
  color: #ffd45e; text-shadow: 0 0 .6rem rgba(255, 190, 60, .7);
}
.quirk .ticker { border-color: #9be7ff; color: #b8f3ff; text-shadow: 0 0 .6rem rgba(120, 220, 255, .7); }
.ticker .e { font-size: 1.1em; text-shadow: none; }
.ticker .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; }
.btn, .chip {
  min-height: 2.75rem; min-width: 2.75rem; padding: .3rem .9rem;
  border-radius: .6rem; border: 2px solid var(--brass);
  background: rgba(20, 3, 8, .75); color: var(--cream);
  font: 700 1.05rem/1 var(--disp); letter-spacing: .06em; text-transform: uppercase;
  cursor: pointer;
}
.chip { border-radius: 999px; border-color: var(--brass-lo); color: var(--dim); }
.chip[aria-pressed="true"] { background: var(--brass); color: var(--ink); border-color: var(--brass-hi); }
.btn:hover { background: rgba(80, 16, 32, .9); }
.hint { font-size: .8rem; color: var(--dim); text-align: center; min-height: 1.2em; padding-inline: 1rem; }

/* ---------- shelf + pets ---------- */
.shelf {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; align-items: center; gap: .6rem;
  min-height: 3.6rem; padding: .45rem 1rem calc(.45rem + env(safe-area-inset-bottom, 0px));
  border: 0; border-top: 3px solid var(--brass);
  background: linear-gradient(#5a3311, #3a1f08);
  box-shadow: 0 -.5rem 1.5rem rgba(0, 0, 0, .55), inset 0 .25rem 0 rgba(255, 220, 160, .18);
  color: var(--cream); cursor: pointer; text-align: left;
}
.shelf .lab { font: 900 .95rem/1 var(--disp); letter-spacing: .2em; text-transform: uppercase; color: var(--brass-hi); flex: none; }
.shelf .items { display: flex; gap: .25rem; overflow: hidden; font-size: 1.6rem; line-height: 1; white-space: nowrap; flex: 1; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
.shelf .items span { filter: drop-shadow(0 .2rem .1rem rgba(0, 0, 0, .5)); display: inline-flex; }
.shelf .items .tart { height: 2.7rem; width: auto; }
.shelf .items .new { animation: wiggle .9s ease-in-out 3; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg) scale(1.15); } 40% { transform: rotate(10deg) scale(1.15); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.tart { display: block; overflow: visible; }
.shelf .empty { font-size: .78rem; color: var(--dim); }
.pets { position: fixed; left: .6rem; bottom: 4.4rem; z-index: 9; display: flex; gap: .3rem; align-items: flex-end; }
.pet { position: relative; border: 0; background: transparent; font-size: 2.2rem; line-height: 1; cursor: pointer; min-width: 2.75rem; min-height: 2.75rem; }
.pet .eyes { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); display: flex; gap: .1rem; pointer-events: none; }
.pet .eyes i { width: .62rem; height: .62rem; border-radius: 50%; background: #fff; border: 1px solid #222; position: relative; }
.pet .eyes i::after { content: ''; position: absolute; width: .3rem; height: .3rem; border-radius: 50%; background: #111; left: .12rem; top: .18rem; animation: look 4s ease-in-out infinite; }
@keyframes look { 0%, 40% { transform: translate(0, 0); } 50%, 70% { transform: translate(.12rem, -.05rem); } 80%, 100% { transform: translate(-.05rem, .08rem); } }
.pet.squeak { animation: squeak .3s ease-out; }
@keyframes squeak { 40% { transform: scale(1.2, .8); } }
.bubble { position: absolute; bottom: 100%; left: 0; white-space: nowrap; background: var(--cream); color: var(--ink); font-size: .75rem; padding: .3rem .5rem; border-radius: .5rem; box-shadow: 0 .2rem .5rem rgba(0,0,0,.4); }

.toast .tart { height: 2.4rem; width: auto; display: inline-block; vertical-align: middle; margin-right: .4rem; }
.toast {
  position: fixed; left: 50%; bottom: 4.6rem; z-index: 25; transform: translateX(-50%);
  max-width: calc(100vw - 2rem);
  padding: .55rem 1rem; border-radius: .8rem;
  background: var(--brass); color: var(--ink); border: 3px solid var(--ink);
  font: 900 1.05rem/1.2 var(--disp); letter-spacing: .04em; text-transform: uppercase; text-align: center;
  box-shadow: 0 .6rem 1.4rem rgba(0, 0, 0, .55);
  animation: toastIn .4s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes toastIn { from { transform: translateX(-50%) translateY(1.5rem) scale(.7); } }

/* ---------- dialogs ---------- */
.veil { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 1rem; background: rgba(14, 2, 6, .74); backdrop-filter: blur(3px); }
.ticket {
  position: relative; width: min(25rem, 100%);
  max-height: calc(100svh - 2rem); overflow-y: auto;
  background: var(--cream); color: var(--ink);
  border-radius: 1rem; padding: 1.1rem 1.1rem 1.2rem;
  box-shadow: 0 0 0 .35rem var(--brass), 0 0 0 .6rem var(--ink), 0 1.5rem 3rem rgba(0, 0, 0, .7);
  text-align: center;
  animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both;
}
.ticket::before { content: ''; position: absolute; inset: .45rem; border: 2px dashed rgba(42, 10, 18, .35); border-radius: .7rem; pointer-events: none; }
@keyframes pop { from { transform: scale(.55) rotate(-6deg); } to { transform: scale(1) rotate(0); } }
.kicker { font: 900 .95rem/1 var(--disp); letter-spacing: .3em; text-transform: uppercase; color: var(--red); margin: .35rem 0 .6rem; }
.shot { position: relative; border-radius: .5rem; overflow: hidden; border: 3px solid var(--ink); background: #2a0a12; aspect-ratio: 16 / 10; display: grid; place-items: center; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .big { font-size: 4.5rem; position: absolute; display: none; }
.shot img[hidden] + .big { display: block; }
.ticket h2 { font: 400 clamp(1.6rem, 7vw, 2.2rem)/1.05 'Shrikhand', Georgia, serif; color: var(--red); margin: .7rem 0 .4rem; }
.ticket p { font-size: .85rem; line-height: 1.45; color: #4a1a24; }
.ticket .by { font-size: .72rem; margin-top: .35rem; color: #6a3a40; }
.acts { display: flex; flex-direction: column; gap: .5rem; margin-top: 1rem; }
.play {
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 3.4rem; border-radius: .8rem;
  background: var(--red); color: var(--cream); border: 3px solid var(--ink); box-shadow: 0 .3rem 0 var(--ink);
  font: 900 1.7rem/1 var(--disp); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; cursor: pointer;
}
.play:hover { background: #e83a51; }
.play:active { transform: translateY(.2rem); box-shadow: 0 .1rem 0 var(--ink); }
.again { min-height: 2.75rem; border-radius: .7rem; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 700 1.1rem/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.again:hover { background: rgba(42, 10, 18, .08); }
.x { position: absolute; right: .55rem; top: .55rem; z-index: 2; width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; background: transparent; color: var(--ink); font-size: 1.3rem; cursor: pointer; }
.trophy-big { position: relative; width: 9rem; height: 9rem; margin: .4rem auto 0; display: grid; place-items: center; }
.trophy-big::before { content: ''; position: absolute; inset: -1.5rem; border-radius: 50%; background: repeating-conic-gradient(rgba(226, 169, 59, .55) 0 10deg, transparent 10deg 20deg); animation: rays 9s linear infinite; mask-image: radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 70%); }
@keyframes rays { to { transform: rotate(360deg); } }
.trophy-big > div { position: relative; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) .15s both; }
.trophy-big .tart { height: 9.5rem; width: auto; animation: wiggle 1s ease-in-out .7s 2; }
.cabinet { width: min(34rem, 100%); text-align: left; }
.cabinet h2 { text-align: center; }
.cabgrid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2rem, 1fr)); gap: .5rem; margin-top: .6rem; }
.cabgrid li { border: 2px solid rgba(42, 10, 18, .25); border-radius: .6rem; padding: .5rem .4rem; text-align: center; background: rgba(255, 255, 255, .5); }
.cabgrid .te { display: flex; justify-content: center; }
.cabgrid .te .tart { height: 4.6rem; width: auto; }
.cabgrid .tn { font: 900 .95rem/1.1 var(--disp); text-transform: uppercase; letter-spacing: .03em; display: block; margin-top: .2rem; }
.cabgrid .td { font-size: .65rem; color: #6a3a40; display: block; margin-top: .15rem; }
.cabgrid li.locked { opacity: .55; background: transparent; border-style: dashed; }
.cabgrid li.locked .te { filter: brightness(0) opacity(.35); }
.cabstats { font-size: .8rem; text-align: center; margin-top: .3rem; color: #4a1a24; }

.rain { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.rain i { position: absolute; font-style: normal; line-height: 1; }
.rain i.cf { width: .55rem; height: .8rem; border-radius: 2px; }
.ball { position: fixed; left: 50%; top: 0; z-index: 8; font-size: 3.4rem; transform: translateX(-50%); pointer-events: none; animation: ballDrop 8s ease-in-out both; }
@keyframes ballDrop { 0% { transform: translate(-50%, -120%); } 12%, 88% { transform: translate(-50%, 2.2rem) rotate(20deg); } 50% { transform: translate(-50%, 2.2rem) rotate(-20deg); } 100% { transform: translate(-50%, -120%); } }

.goose {
  position: fixed; left: 0; bottom: 4.6rem; z-index: 28;
  width: 6.5rem; height: 6.5rem; border: 0; background: transparent; cursor: pointer; padding: 0;
  touch-action: manipulation;
}
.goose svg { width: 100%; height: 100%; animation: waddle .32s ease-in-out infinite alternate; transform-origin: 50% 90%; overflow: visible; }
.goose.caught svg { animation: none; transform: scale(1.1) rotate(-8deg); }
.goose .loot { position: absolute; left: -.6rem; top: 1.2rem; font: 900 .95rem var(--disp); background: var(--cream); color: var(--ink); border: 2px solid var(--ink); border-radius: .5rem; padding: .1rem .35rem; white-space: nowrap; }
@keyframes waddle { from { transform: rotate(-7deg) translateY(0); } to { transform: rotate(7deg) translateY(-.25rem); } }

    id: 'game', title: 'Game Wheel', pal: PAL_GAME, ring: '#e2a93b', deal: dealGames,
    onLand: (w, s) => {
      S.gameSpins++; if (s && s.slug) S.games[s.slug] = (S.games[s.slug] || 0) + 1; save();
      fanfare(); confetti(w.stage);
      addCoins(2);
      setTimeout(() => showGame(s), reduced.matches ? 250 : 650);
    }
  });
  const quirkW = makeWheel($('pQuirk'), {
    id: 'quirk', title: 'Quirky Wheel', pal: PAL_QUIRK, ring: '#9be7ff', deal: dealQuirks, teaseKey: 'jackpot',
    onLand: (w, s) => {
      S.quirkSpins++; save();
      if (!s || !Q[s.key]) return;
      if (s.key !== 'bankrupt' && s.key !== 'goose' && s.key !== 'jackpot') { chime(); confetti(w.stage); }
      $('live').textContent = 'The Quirky Wheel landed on ' + s.name + '.';
      Q[s.key].run(w);
      save();
      setTimeout(checkAch, 900);
    }
  });
  const WHEELS = [gameW, quirkW];
  let active = gameW;
  function setActive(w) { active = w; }

  function showGame(s) {
    if (!s) return;
    $('wName').textContent = s.name;
    $('wDesc').textContent = s.desc || 'A game from the sloppy.live arcade.';
    const by = (s.creators || []).map(c => typeof c === 'string' ? c : c && c.name).filter(Boolean).slice(0, 3);
    $('wBy').hidden = !by.length; $('wBy').textContent = by.length ? 'dreamed up with ' + by.join(', ') : '';
    $('wEmoji').textContent = s.emoji;
    const img = $('wShot'); img.hidden = false; img.onerror = () => { img.hidden = true; };
    img.src = '/screenshots/' + encodeURIComponent(s.slug) + '.jpg';
    $('playBtn').href = '/' + encodeURIComponent(s.slug) + '/';
    $('playBtn').setAttribute('aria-label', 'Play ' + s.name);
    $('live').textContent = 'The Game Wheel picked ' + s.name + '. ' + (s.desc || '');
    openVeil('gameVeil');
  }
  $('againBtn').addEventListener('click', () => { closeVeil('gameVeil'); gameW.spin(); });

  // ---------- cabinet ----------
  function openCabinet() {
    const g = $('cabGrid'); g.textContent = '';
    const fmt = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    const add = (art, n, d, locked) => {
      const li = document.createElement('li'); if (locked) li.className = 'locked';
      li.innerHTML = '<span class="te" aria-hidden="true"></span><span class="tn"></span><span class="td"></span>';
      li.children[0].innerHTML = art; li.children[1].textContent = n; li.children[2].textContent = d;
      g.appendChild(li);
    };
    for (const t of S.trophies) add(ART(t.id, t.n, t.e), t.n, 'won ' + fmt(t.at), false);
    for (const a of ACH) if (!has(a.id)) add(ART(a.id, '?', a.e), '???', a.why, true);
    const left = RANDOM_TROPHIES.filter(t => !has(t[0])).length;
    if (left) add(ART('', '?', '🎁'), left + ' secret trophies', 'Hiding on the Quirky Wheel', true);
    $('cabStats').textContent = `🪙 ${S.coins} coins · 🎡 ${S.spins} spins · 🪿 caught ${S.geese} · 🪨 ${S.rocks} · 🦆 ${S.ducks} · hats ${S.hats.join(' ') || 'none yet'}`;
    openVeil('cabVeil');
  }
  $('shelf').addEventListener('click', openCabinet);
  $('trophyPill').addEventListener('click', openCabinet);
  $('coinPill').addEventListener('click', () => toast('🪙 ' + S.coins + ' coins. A coin shop is coming soon!'));
  $('muteBtn').addEventListener('click', () => setMute(!S.muted));

  // ---------- pools ----------
  function syncChips() { document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.pool === S.pool))); $('nAll').textContent = allGames().length; }
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    if (gameW.state === 'spin') return;
    S.pool = b.dataset.pool; save(); syncChips();
    gameW.setSlices(dealGames());
    $('live').textContent = S.pool === 'all' ? 'All games on the wheel.' : 'Best games on the wheel.';
  }));

  // ---------- tabs / swipe ----------
  const strip = $('wheels');
  function showPanel(i, smooth) {
    const p = WHEELS[i].panel;
    strip.scrollTo({ left: p.offsetLeft - (strip.clientWidth - p.offsetWidth) / 2, behavior: smooth && !reduced.matches ? 'smooth' : 'auto' });
    setTabs(i); setActive(WHEELS[i]);
  }
  function setTabs(i) { $('tabGame').setAttribute('aria-selected', String(i === 0)); $('tabQuirk').setAttribute('aria-selected', String(i === 1)); }
  $('tabGame').addEventListener('click', () => showPanel(0, true));
  $('tabQuirk').addEventListener('click', () => showPanel(1, true));
  let scrollT = 0;
  strip.addEventListener('scroll', () => {
    clearTimeout(scrollT);
    scrollT = setTimeout(() => {
      if (strip.scrollWidth <= strip.clientWidth + 4) return;
      const mid = strip.scrollLeft + strip.clientWidth / 2;
      const i = Math.abs(WHEELS[0].panel.offsetLeft + WHEELS[0].panel.offsetWidth / 2 - mid) < Math.abs(WHEELS[1].panel.offsetLeft + WHEELS[1].panel.offsetWidth / 2 - mid) ? 0 : 1;
      setTabs(i); setActive(WHEELS[i]);
    }, 90);
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (document.querySelector('.veil:not([hidden])')) return;
    const t = e.target;
    if (t && t !== document.body && t.closest && t.closest('button, a, input, select, textarea')) return;
    e.preventDefault(); active.spin();
  });

  // ---------- boot ----------
  setMute(!!S.muted);
  shownCoins = S.coins; $('coins').textContent = S.coins.toLocaleString();
  renderShelf(); renderPets(); renderHats(); syncChips();
  gameW.setSlices(dealGames());
  quirkW.setSlices(dealQuirks());
  WHEELS.forEach(w => w.sizeCanvas());
  const ro = new ResizeObserver(() => WHEELS.forEach(w => w.resize()));
  WHEELS.forEach(w => ro.observe(w.stage));
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('900 20px "Big Shoulders Display"'), document.fonts.ready]).then(() => WHEELS.forEach(w => w.refresh()), () => {});
  const params = new URLSearchParams(location.search);
  if (params.get('wheel') === 'quirky') requestAnimationFrame(() => showPanel(1, false));
  fetch('/app-directory/index.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if (!Array.isArray(list)) return;
      for (const a of list) if (a && a.slug) rowsBy[a.slug] = a;
      const g = list.filter(a => a && a.slug && a.genre === 'games' && !SKIP.has(a.slug)).map(a => a.slug);
      if (g.length > 50) gameSlugs = g;
      syncChips();
      gameW.setSlices(gameW.slices.map(s => gameSlice(s.slug)));
    })
    .catch(() => {});
  window.__ss = { S, gameW, quirkW, Q, showPanel, award, ART, ACH, RANDOM_TROPHIES, openCabinet };
})();
</script>
</body>
</html>
