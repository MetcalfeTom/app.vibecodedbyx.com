<style>
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --velvet-deep: #1c040b;

    radial-gradient(circle, transparent 0 calc(var(--w) * .435), rgba(0,0,0,.45) calc(var(--w) * .44), transparent calc(var(--w) * .45)),

@keyframes chase { 0%, 45% { background: #fff8dc; box-shadow: 0 0 .5rem .15rem rgba(255, 214, 110, .9); } 50%, 100% { background: #7d4b12; box-shadow: none; } }

.bubble { position: absolute; bottom: 100%; left: 0; white-space: nowrap; background: var(--cream); color: var(--ink); font-size: .75rem; padding: .3rem .5rem; border-radius: .5rem; box-shadow: 0 .2rem .5rem rgba(0,0,0,.4); }

@keyframes ballDrop { 0% { transform: translate(-50%, -120%); } 12%, 88% { transform: translate(-50%, 2.2rem) rotate(20deg); } 50% { transform: translate(-50%, 2.2rem) rotate(-20deg); } 100% { transform: translate(-50%, -120%); } }

  function quirkSlice(k) { const q = Q[k]; return { kind: 'quirk', key: k, name: q.label, emoji: q.emoji, bg: q.bg, fg: q.fg }; }
  function dealQuirks() {
    const base = ['c10', 'c25', 'c10', 'trophy', 'jackpot', 'bankrupt'];
    const fun = shuffle(['disco', 'fortune', 'rock', 'again', 'duck', 'sneeze', 'hat', 'trophy']);

  }

  // ---------- games ----------
  const rowsBy = {};
  for (const r of FAV_ROWS) rowsBy[r.slug] = r;
  let gameSlugs = Object.keys(EMO).filter(s => !SKIP.has(s));
  function hashEmoji(slug) { let h = 0; for (const c of slug) h = (h * 31 + c.charCodeAt(0)) | 0; return SPARE[Math.abs(h) % SPARE.length]; }
  function shortName(slug) {
    const r = rowsBy[slug];

    if (!t) t = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  }
  function gameSlice(slug) { const r = rowsBy[slug] || {}; return { kind: 'game', slug, name: shortName(slug), emoji: EMO[slug] || hashEmoji(slug), desc: r.desc || '', creators: r.creators || [] }; }
  function allGames() { return Array.from(new Set(gameSlugs.concat(FAV))).filter(s => !SKIP.has(s)); }
  function dealGames() {
    const src = shuffle((S.pool === 'all' ? allGames() : FAV.filter(s => !SKIP.has(s))).slice());
    return src.slice(0, N).map(gameSlice);
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- a wheel ----------
  const SEG = TAU / N;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  function makeWheel(panel, cfg) {
    const stage = panel.querySelector('.stage'), cv = stage.querySelector('canvas'), ctx = cv.getContext('2d');
    const hub = stage.querySelector('.hub'), pointerEl = stage.querySelector('.pointer');
    const tkE = panel.querySelector('.ticker .e'), tkN = panel.querySelector('.ticker .n');
    for (let i = 0; i < 24; i++) { const b = document.createElement('span'); b.className = 'bulb'; b.style.setProperty('--i', i); stage.querySelector('.bulbs').appendChild(b); }
    const W = { panel, stage, slices: [], theta: -SEG * Math.floor(Math.random() * N), state: 'idle' };
    let anim = null, lastIdx = -1, flap = 0, flapV = 0, face = null, raf = 0, lastT = 0, cssSize = 0, drag = null;

    function sizeCanvas() {
      const r = cv.getBoundingClientRect();
      cssSize = Math.round(r.width);

      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      cv.width = Math.round(cssSize * dpr); cv.height = cv.width;

    }
    function fitLabel(c, text, maxW, maxH, big, small) {
      for (let fs = big; fs >= small; fs -= 1) {
        c.font = `900 ${fs}px "Big Shoulders Display", "Arial Narrow", sans-serif`;
        if (c.measureText(text).width <= maxW) return { lines: [text], fs };
      }
      const words = text.split(' ');
      if (words.length > 1) {
        let best = null;
        for (let k = 1; k < words.length; k++) {
          const a = words.slice(0, k).join(' '), b = words.slice(k).join(' ');
          const score = Math.max(a.length, b.length);
          if (!best || score < best.score) best = { a, b, score };
        }
        for (let fs = big; fs >= small; fs -= 1) {
          c.font = `900 ${fs}px "Big Shoulders Display", "Arial Narrow", sans-serif`;
          if (fs * 2.05 > maxH) continue;
          if (c.measureText(best.a).width <= maxW && c.measureText(best.b).width <= maxW) return { lines: [best.a, best.b], fs };
        }
      }
      c.font = `900 ${small}px "Big Shoulders Display", "Arial Narrow", sans-serif`;
      let t = text;
      while (t.length > 3 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return { lines: [t.trimEnd() + '…'], fs: small };
    }
    function renderFace() {
      if (!cv.width || !W.slices.length) return;
      const S2 = cv.width, R = S2 / 2, cx = R, cy = R;
      face = face || document.createElement('canvas');
      face.width = S2; face.height = S2;
      const c = face.getContext('2d');
      c.clearRect(0, 0, S2, S2);
      for (let i = 0; i < N; i++) {
        const mid = -Math.PI / 2 + i * SEG, s = W.slices[i], col = cfg.pal[i % cfg.pal.length];
        c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, mid - SEG / 2, mid + SEG / 2); c.closePath();
        c.fillStyle = s.bg || col.bg; c.fill();
        const g = c.createRadialGradient(cx, cy, R * .2, cx, cy, R);
        g.addColorStop(0, 'rgba(0,0,0,.18)'); g.addColorStop(.55, 'rgba(0,0,0,0)'); g.addColorStop(.97, 'rgba(255,255,255,.08)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
        c.fillStyle = g; c.fill();
      }
      c.strokeStyle = 'rgba(42,10,18,.55)'; c.lineWidth = Math.max(1, S2 * .005);
      for (let i = 0; i < N; i++) { const a = -Math.PI / 2 + i * SEG + SEG / 2; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.stroke(); }
      const hubR = R * .3;
      for (let i = 0; i < N; i++) {
        const s = W.slices[i], col = cfg.pal[i % cfg.pal.length];
        c.save(); c.translate(cx, cy); c.rotate(-Math.PI / 2 + i * SEG);
        c.font = `${R * .13}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
        c.save(); c.translate(R * .83, 0); c.rotate(Math.PI / 2); c.fillText(s.emoji, 0, 0); c.restore();
        const x1 = R * .72, x0 = hubR + R * .04, maxW = x1 - x0;
        const chord = 2 * (x0 + maxW * .5) * Math.sin(SEG / 2) * .82;
        const fit = fitLabel(c, s.name.toUpperCase(), maxW, chord, Math.round(R * .105), Math.max(8, Math.round(R * .058)));
        c.font = `900 ${fit.fs}px "Big Shoulders Display", "Arial Narrow", sans-serif`;
        c.fillStyle = s.fg || col.fg; c.textAlign = 'right'; c.textBaseline = 'middle';
        if (fit.lines.length === 1) c.fillText(fit.lines[0], x1, 0);
        else { c.fillText(fit.lines[0], x1, -fit.fs * .52); c.fillText(fit.lines[1], x1, fit.fs * .52); }
        c.restore();
      }
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + i * SEG + SEG / 2, px = cx + Math.cos(a) * R * .955, py = cy + Math.sin(a) * R * .955;
        c.beginPath(); c.arc(px, py, S2 * .011, 0, TAU); c.fillStyle = '#ffe7a3'; c.fill(); c.lineWidth = S2 * .004; c.strokeStyle = '#5a3a08'; c.stroke();
      }
      c.beginPath(); c.arc(cx, cy, hubR, 0, TAU); c.lineWidth = S2 * .018; c.strokeStyle = cfg.ring; c.stroke();
      c.beginPath(); c.arc(cx, cy, R - S2 * .003, 0, TAU); c.lineWidth = S2 * .008; c.strokeStyle = 'rgba(42,10,18,.6)'; c.stroke();

    }

    function updateTicker(force) {

      const old = stage.querySelector('.callout'); if (old) old.remove();

    W.setSlices = sl => {

    W.idxAt = idxAt;
    W.sizeCanvas = sizeCanvas;
    return W;
  }

  // ---------- the two wheels ----------
  let hintGone = false;
  function hideHint() { if (!hintGone) { hintGone = true; $('hint').textContent = ''; } }
  const gameW = makeWheel($('pGame'), {
    id: 'game', title: 'Game Wheel', pal: PAL_GAME, ring: '#e2a93b', deal: dealGames,
    onLand: (w, s) => {
      S.gameSpins++; if (s && s.slug) S.games[s.slug] = (S.games[s.slug] || 0) + 1; save();
      fanfare(); confetti(w.stage);
      addCoins(2);
      setTimeout(() => showGame(s), reduced.matches ? 250 : 650);
    }
  });
  const quirkW = makeWheel($('pQuirk'), {
    id: 'quirk', title: 'Quirky Wheel', pal: PAL_QUIRK, ring: '#9be7ff', deal: dealQuirks,
    onLand: (w, s) => {
      S.quirkSpins++; save();
      if (!s || !Q[s.key]) return;
      if (s.key !== 'bankrupt') { chime(); confetti(w.stage); }
      $('live').textContent = 'The Quirky Wheel landed on ' + s.name + '.';

      save();
      setTimeout(checkAch, 900);

  const WHEELS = [gameW, quirkW];
  let active = gameW;
  function setActive(w) { active = w; }

  function showGame(s) {
    if (!s) return;
    $('wName').textContent = s.name;
    $('wDesc').textContent = s.desc || 'A game from the sloppy.live arcade.';
    const by = (s.creators || []).map(c => typeof c === 'string' ? c : c && c.name).filter(Boolean).slice(0, 3);
    $('wBy').hidden = !by.length; $('wBy').textContent = by.length ? 'dreamed up with ' + by.join(', ') : '';
    $('wEmoji').textContent = s.emoji;
    const img = $('wShot'); img.hidden = false; img.onerror = () => { img.hidden = true; };
    img.src = '/screenshots/' + encodeURIComponent(s.slug) + '.jpg';
    $('playBtn').href = '/' + encodeURIComponent(s.slug) + '/';
    $('playBtn').setAttribute('aria-label', 'Play ' + s.name);

  $('againBtn').addEventListener('click', () => { closeVeil('gameVeil'); gameW.spin(); });

  // ---------- cabinet ----------
  function openCabinet() {
    const g = $('cabGrid'); g.textContent = '';
    const fmt = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    const add = (e, n, d, locked) => {
      const li = document.createElement('li'); if (locked) li.className = 'locked';

      li.children[0].textContent = e; li.children[1].textContent = n; li.children[2].textContent = d;

    for (const t of S.trophies) add(t.e, t.n, 'won ' + fmt(t.at), false);

    $('cabStats').textContent = `🪙 ${S.coins} coins · 🎡 ${S.spins} spins · 🪨 ${S.rocks} · 🦆 ${S.ducks} · hats ${S.hats.join(' ') || 'none yet'}`;

  $('shelf').addEventListener('click', openCabinet);
  $('trophyPill').addEventListener('click', openCabinet);
  $('coinPill').addEventListener('click', () => toast('🪙 ' + S.coins + ' coins. A coin shop is coming soon!'));
  $('muteBtn').addEventListener('click', () => setMute(!S.muted));

  // ---------- pools ----------
  function syncChips() { document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.pool === S.pool))); $('nAll').textContent = allGames().length; }
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    if (gameW.state === 'spin') return;
    S.pool = b.dataset.pool; save(); syncChips();
    gameW.setSlices(dealGames());
    $('live').textContent = S.pool === 'all' ? 'All games on the wheel.' : 'Best games on the wheel.';
  }));

  // ---------- tabs / swipe ----------
  const strip = $('wheels');
  function showPanel(i, smooth) {
    const p = WHEELS[i].panel;
    strip.scrollTo({ left: p.offsetLeft - (strip.clientWidth - p.offsetWidth) / 2, behavior: smooth && !reduced.matches ? 'smooth' : 'auto' });

      const i = Math.abs(WHEELS[0].panel.offsetLeft + WHEELS[0].panel.offsetWidth / 2 - mid) < Math.abs(WHEELS[1].panel.offsetLeft + WHEELS[1].panel.offsetWidth / 2 - mid) ? 0 : 1;

  document.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;

    if (t && t !== document.body && t.closest && t.closest('button, a, input, select, textarea')) return;
    e.preventDefault(); active.spin();
  });

  // ---------- boot ----------
  setMute(!!S.muted);
  shownCoins = S.coins; $('coins').textContent = S.coins.toLocaleString();
  renderShelf(); renderPets(); renderHats(); syncChips();
  gameW.setSlices(dealGames());
  quirkW.setSlices(dealQuirks());
  WHEELS.forEach(w => w.sizeCanvas());
  const ro = new ResizeObserver(() => WHEELS.forEach(w => w.resize()));

  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('900 20px "Big Shoulders Display"'), document.fonts.ready]).then(() => WHEELS.forEach(w => w.refresh()), () => {});

  fetch('/app-directory/index.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if (!Array.isArray(list)) return;
      for (const a of list) if (a && a.slug) rowsBy[a.slug] = a;
      const g = list.filter(a => a && a.slug && a.genre === 'games' && !SKIP.has(a.slug)).map(a => a.slug);
      if (g.length > 50) gameSlugs = g;
      syncChips();
      gameW.setSlices(gameW.slices.map(s => gameSlice(s.slug)));
    })
    .catch(() => {});
  window.__ss = { S, gameW, quirkW, Q, showPanel };
})();
</script>
