<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Editor — the haunted IDE</title>
<link rel="canonical" href="https://app.sloppy.live/hex-editor/">
<meta name="description" content="A ghost writes your code and hides a curse in it. Find the haunted line before your candles go out.">
<meta name="theme-color" content="#0e110d">
<link rel="icon" href="https://emojicdn.elk.sh/👻">
<meta property="og:type" content="website">
<meta property="og:title" content="Hex Editor — the haunted IDE">
<meta property="og:description" content="A ghost writes your code and hides a curse in it. Find the haunted line before your candles go out.">
<meta property="og:url" content="https://sloppy.live/hex-editor/">
<meta property="og:image" content="https://sloppy.live/hex-editor/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,500&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=VT323&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e110d;--ink2:#161a14;--fog:#20261d;--bone:#ece4cf;--bone2:#c9c0a8;--dim:#9aa38f;
  --pump:#ff8a1f;--pump2:#ffb066;--ecto:#b6f28a;--blood:#ff6b5e;--line:#3a4234;
  --display:'Pirata One','Iowan Old Style',Georgia,serif;--lore:'Newsreader',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:100%}
body{margin:0;min-height:100vh;color:var(--bone);font-family:var(--lore);background:
  radial-gradient(60rem 30rem at 15% -10%,rgba(255,138,31,.13),transparent 60%),
  radial-gradient(50rem 26rem at 110% 110%,rgba(182,242,138,.08),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),var(--ink)}
body::before{content:"";position:fixed;inset:auto 0 0 0;height:40vh;pointer-events:none;z-index:0;
  background:radial-gradient(40rem 12rem at 20% 100%,rgba(200,210,190,.07),transparent 70%),radial-gradient(36rem 10rem at 80% 100%,rgba(200,210,190,.06),transparent 70%);animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(4%)}}
.skip{position:absolute;left:-999px;top:0;background:var(--pump);color:#1a0f02;padding:.6rem 1rem;z-index:9;font-family:var(--mono)}
.skip:focus{left:1rem;top:1rem}
:focus-visible{outline:3px solid var(--pump2);outline-offset:3px}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:68rem;margin:0 auto;padding:2rem 1rem 3rem}
header.top{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,9vw,4.6rem);line-height:.9;margin:0;letter-spacing:.01em;color:var(--bone);text-shadow:0 0 1.2rem rgba(255,138,31,.35)}
h1 b{color:var(--pump);font-weight:400}
.tag{margin:0 0 .35rem;font-style:italic;font-weight:300;font-size:1.05rem;color:var(--bone2);max-width:26rem}
.candy{margin-left:auto;font-family:var(--mono);font-size:.95rem;padding:.4rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--ink2);white-space:nowrap}
.candy b{color:var(--pump)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.hdr-r .candy{margin-left:0}
.snd{cursor:pointer;min-height:2.75rem;min-width:2.75rem;padding:.3rem .7rem;border:1px solid var(--line);border-radius:999px;background:var(--ink2);color:var(--bone2);font-family:var(--mono);font-size:.85rem}
.snd:hover{border-color:var(--pump)}
.snd[aria-pressed="false"]{color:var(--dim)}

/* ── the menu: six languages ── */
#menu h2{font-family:var(--lore);font-style:italic;font-weight:500;font-size:clamp(1.2rem,3.4vw,1.6rem);margin:.4rem 0 1rem;color:var(--bone)}
.langs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.lang{width:100%;min-height:6.4rem;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:.8rem;align-items:center;padding:.9rem 1rem;border-radius:.6rem;border:1px solid var(--line);background:linear-gradient(160deg,var(--ink2),#10130f);transition:transform .18s,border-color .18s,box-shadow .18s;opacity:0;animation:rise .5s forwards}
.lang:hover{transform:translateY(-2px);border-color:var(--pump);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.45),0 0 0 1px rgba(255,138,31,.25)}
.lang .ic{grid-row:1/4;width:3rem;height:3rem;border-radius:.45rem;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1rem}
.lang .nm{font-family:var(--display);font-size:1.6rem;line-height:1;overflow-wrap:anywhere}
.lang .fl{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.lang .st{font-family:var(--mono);font-size:.8rem;color:var(--bone2)}
.lang .st.done{color:var(--ecto)}
.lang .st.lost{color:var(--blood)}
@keyframes rise{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
.langs li:nth-child(2) .lang{animation-delay:.06s}.langs li:nth-child(3) .lang{animation-delay:.12s}.langs li:nth-child(4) .lang{animation-delay:.18s}.langs li:nth-child(5) .lang{animation-delay:.24s}.langs li:nth-child(6) .lang{animation-delay:.3s}
.again{margin-top:1.2rem;font-family:var(--mono);font-size:.8rem;background:none;border:1px solid var(--line);border-radius:.4rem;padding:.55rem .9rem;color:var(--dim);cursor:pointer;min-height:2.75rem}

/* ── the IDE ── */
#ide{display:grid;grid-template-columns:minmax(0,1fr) 16rem;gap:1rem;align-items:start}
.win{--bg:#1e1e1e;--fg:#dcdcdc;--kw:#569cd6;--st:#d69d85;--cm:#6a9955;--nu:#b5cea8;--pp:#c586c0;--ty:#4ec9b0;--gut:#858585;--bar:#2d2d30;--barfg:#e6e6e6;--hov:rgba(255,255,255,.07);--font:var(--mono);--fs:.92rem;
  border-radius:.55rem;overflow:hidden;border:1px solid var(--line);box-shadow:0 1.2rem 3rem rgba(0,0,0,.55);background:var(--bg);color:var(--fg)}
.bar{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:var(--bar);color:var(--barfg);font-family:var(--mono);font-size:.78rem;min-height:2.3rem}
.bar .dots{display:flex;gap:.35rem}.bar .dots i{width:.7rem;height:.7rem;border-radius:50%;background:currentColor;opacity:.35}
.bar .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu2{display:none;gap:1rem;padding:.2rem .8rem;background:var(--bar2,#aaa);color:#000;font-family:var(--font);font-size:1.1rem}
.menu2 span:first-letter{color:#a00}
.code{list-style:none;margin:0;padding:.6rem 0;font-family:var(--font);font-size:var(--fs);line-height:1.6;overflow-x:auto;min-height:14rem}
.code li{display:block}
.ln{all:unset;box-sizing:border-box;display:flex;width:100%;min-height:2.1rem;align-items:center;cursor:pointer;white-space:pre;padding:0 .9rem 0 0;border-left:3px solid transparent;font-family:var(--font);font-size:var(--fs)}
.ln:focus-visible{outline:3px solid var(--pump2);outline-offset:-3px}
.ln:not([disabled]):hover{background:var(--hov)}
.ln[disabled]{cursor:default}
.ln .no{display:inline-block;min-width:3rem;padding-right:1rem;text-align:right;color:var(--gut);user-select:none;flex:none}
.ln code{font:inherit;white-space:pre}
.ln.miss{animation:miss .5s}
.ln.miss,.ln.was-miss{border-left-color:var(--blood);background:rgba(255,80,70,.12)}
.ln.hit{border-left-color:var(--ecto);background:rgba(160,255,120,.16);animation:hit .7s}
@keyframes miss{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes hit{0%{box-shadow:inset 0 0 0 999px rgba(182,242,138,.55)}100%{box-shadow:inset 0 0 0 999px transparent}}
.k{color:var(--kw);font-weight:600}.s{color:var(--st)}.c{color:var(--cm);font-style:italic}.n{color:var(--nu)}.p{color:var(--pp)}.t{color:var(--ty)}
.caret{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.foot{display:flex;justify-content:space-between;gap:.6rem;padding:.35rem .8rem;background:var(--bar);color:var(--barfg);font-family:var(--mono);font-size:.72rem}

/* per-language skins */
.win[data-lang="py"]{--bg:#f6f1e3;--fg:#1d1d1d;--kw:#b34700;--st:#17692c;--cm:#b3261e;--nu:#1d1d1d;--pp:#7a1fa2;--ty:#7a1fa2;--gut:#6b665a;--bar:#d9d2c0;--barfg:#2a2720;--hov:rgba(0,0,0,.06);--font:'IBM Plex Mono',var(--mono)}
.win[data-lang="c"]{--bg:#050805;--fg:#8dfc8d;--kw:#d6ffd6;--st:#f0ff9a;--cm:#5fb35f;--nu:#8dfc8d;--pp:#a8ffe0;--ty:#d6ffd6;--gut:#4f9a4f;--bar:#0f1a0f;--barfg:#8dfc8d;--hov:rgba(141,252,141,.08);--font:'IBM Plex Mono',var(--mono)}
.win[data-lang="c"] .code{text-shadow:0 0 .35rem rgba(141,252,141,.45)}
.win[data-lang="cs"]{--bg:#1e1e1e;--fg:#dcdcdc;--kw:#6cb4f0;--st:#e0a58f;--cm:#6fb35a;--nu:#b5cea8;--pp:#c586c0;--ty:#4ec9b0;--gut:#9a9a9a;--bar:#68217a;--barfg:#fff;--font:'JetBrains Mono',var(--mono)}
.win[data-lang="cpp"]{--bg:#0000a8;--fg:#ffff55;--kw:#ffffff;--st:#55ffff;--cm:#c0c0c0;--nu:#55ff55;--pp:#55ff55;--ty:#ffffff;--gut:#aaaaff;--bar:#0000a8;--barfg:#fff;--hov:rgba(0,170,170,.35);--font:'VT323',var(--mono);--fs:1.25rem;border-color:#aaa}
.win[data-lang="cpp"] .menu2{display:flex;--bar2:#aaaaaa}
.win[data-lang="cpp"] .bar{justify-content:center;border-top:2px double #fff;margin:.2rem .3rem 0;background:#0000a8}
.win[data-lang="cpp"] .bar .dots{display:none}
.win[data-lang="basic"]{--bg:#352879;--fg:#b8b0ff;--kw:#ffffff;--st:#d8f0ff;--cm:#9fd0ff;--nu:#b8b0ff;--pp:#fff;--ty:#fff;--gut:#9d94e8;--bar:#6c5eb5;--barfg:#fff;--hov:rgba(255,255,255,.1);--font:'VT323',var(--mono);--fs:1.3rem;border:1.4rem solid #6c5eb5;border-radius:.2rem}
.win[data-lang="basic"] .bar{background:#352879;justify-content:center;font-family:'VT323',var(--mono);font-size:1.2rem;letter-spacing:.05em}
.win[data-lang="basic"] .bar .dots{display:none}
.win[data-lang="js"]{--bg:#1b1a17;--fg:#e8e6df;--kw:#f7df1e;--st:#9fe3a1;--cm:#8f8a7d;--nu:#ffb2d8;--pp:#9cc9ff;--ty:#9cc9ff;--gut:#8a867c;--bar:#282723;--barfg:#e8e6df;--font:'Fira Code',var(--mono)}
.win[data-lang="js"] .bar .ttl::before{content:"Sources  ›  ";color:#f7df1e}

/* the ghost */
.side{display:flex;flex-direction:column;gap:.8rem;padding:1rem;border:1px solid var(--line);border-radius:.6rem;background:linear-gradient(180deg,var(--ink2),rgba(14,17,13,.9))}
.ghostbox{display:grid;place-items:center;height:8.5rem}
.ghost{width:6rem;height:auto;filter:drop-shadow(0 0 .9rem rgba(182,242,138,.45));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-.5rem) rotate(-2deg)}}
.ghost .mouth{transition:d .2s}
.ghost.grin .mouth{d:path("M44 84 Q60 100 76 84 Q60 92 44 84Z")}
.ghost.hurt{animation:hurt .5s}
.ghost .hat{transform-box:fill-box;transform-origin:50% 100%}
.ghost.hurt .hat{animation:hatpop .5s}
@keyframes hatpop{40%{translate:0 -7px;rotate:-8deg}}
@keyframes hurt{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.ghost.gone{animation:gone 1.4s forwards}
@keyframes gone{to{transform:translateY(-4rem) scale(.7);opacity:0}}
.say{margin:0;min-height:4.2rem;font-style:italic;font-size:1.08rem;line-height:1.35;color:var(--bone)}
.say::before{content:"“";color:var(--pump);font-family:var(--display);font-size:1.6rem;line-height:0;vertical-align:-.35rem;margin-right:.1rem}
.candles{display:flex;gap:.6rem;align-items:flex-end;height:2.6rem}
.cnd{width:.7rem;height:1.6rem;border-radius:.15rem .15rem .1rem .1rem;background:linear-gradient(90deg,#d9cfb5,#fff6dc 40%,#cbbf9f);position:relative}
.cnd::before{content:"";position:absolute;left:50%;bottom:100%;width:.55rem;height:.9rem;margin-left:-.275rem;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff7c2,#ffb347 45%,#ff6a00 80%);box-shadow:0 0 .8rem .2rem rgba(255,150,40,.55);animation:flick .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.cnd:nth-child(2)::before{animation-delay:.3s}.cnd:nth-child(3)::before{animation-delay:.55s}
.cnd.out::before{background:none;box-shadow:none;animation:none;border-left:1px solid #777;width:0;height:.4rem;margin-left:0;border-radius:0}
@keyframes flick{to{transform:scale(.85,1.08) rotate(3deg)}}
.meta{font-family:var(--mono);font-size:.8rem;color:var(--bone2);display:flex;justify-content:space-between}
.meta b{color:var(--ecto)}
.btn{cursor:pointer;min-height:2.75rem;padding:.55rem 1rem;border-radius:.45rem;font-family:var(--mono);font-size:.85rem;border:1px solid var(--line);background:var(--ink2);color:var(--bone)}
.btn:hover{border-color:var(--pump)}
.btn.go{background:var(--pump);border-color:var(--pump);color:#1a0f02;font-weight:700}
.btn.go:hover{background:var(--pump2)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}

/* the reveal */
.reveal:focus{outline:none}
.reveal{grid-column:1/-1;border:1px solid var(--line);border-radius:.6rem;padding:1.1rem 1.1rem 1.3rem;background:var(--ink2);animation:rise .5s}
.reveal h3{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 .3rem;color:var(--pump)}
.reveal .heard{margin:.7rem 0 0;font-family:var(--mono);font-size:.82rem;color:var(--dim)}
.reveal .heard q{font-family:var(--lore);font-style:italic;font-size:1.15rem;color:var(--pump2);quotes:'“' '”'}
.reveal .why{font-size:1.1rem;line-height:1.5;margin:.2rem 0 1rem;max-width:48rem}
.why code{font-family:var(--mono);font-size:.88em;background:var(--fog);padding:.05em .35em;border-radius:.25rem;color:var(--pump2)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.9rem}
.pair h4{margin:0 0 .4rem;font-family:var(--mono);font-size:.8rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pair h4.bad{color:var(--blood)}.pair h4.good{color:var(--ecto)}
.pair pre{margin:0;padding:.6rem 0;overflow-x:auto;border-radius:.45rem;font-size:var(--fs);line-height:1.55;font-family:var(--font)}
.pair pre span.l{display:block;padding:0 .8rem;border-left:3px solid transparent;white-space:pre}
.pair pre span.l.cur{border-left-color:var(--blood);background:rgba(255,80,70,.14)}
.pair pre span.l.fix{border-left-color:var(--ecto);background:rgba(160,255,120,.13)}
.reveal .row{margin-top:1.1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.flicker .wrap{animation:flk .45s steps(2)}
@keyframes flk{0%{filter:brightness(1)}30%{filter:brightness(.35)}60%{filter:brightness(1.2)}100%{filter:brightness(1)}}

/* haunted autocomplete */
.langs li:nth-child(7) .lang{animation-delay:.36s}
.lang.auto{border-style:dashed}
.lang.auto .ic{font-size:1.4rem}
.lang.auto .nm{font-size:1.4rem;hyphens:auto}
.ln.ro{cursor:default}
.ln.ro:not(.hit):not(.was-miss):hover{background:transparent}
.acpop{--ml:min(calc(3rem + var(--col,0) * 1ch),35%);list-style:none;margin:.2rem 0 .5rem var(--ml);padding:.25rem;max-width:min(40rem,calc(100% - var(--ml) - .8rem));background:var(--bg);color:var(--fg);border:1px solid var(--gut);border-radius:.3rem;box-shadow:0 .7rem 1.6rem rgba(0,0,0,.5);font-family:var(--font);font-size:var(--fs);line-height:1.35;animation:rise .18s}
.acpop:focus{outline:none}
.acpop:focus-visible{outline:3px solid var(--pump2);outline-offset:2px}
.acpop li{display:flex;align-items:center;gap:.6rem;min-height:2.75rem;padding:.3rem .6rem;border-radius:.2rem;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
.acpop li[aria-selected="true"]{background:rgba(255,138,31,.24);box-shadow:inset 3px 0 0 var(--pump)}
.acpop .k{flex:none;width:1.4rem;height:1.4rem;display:grid;place-items:center;border-radius:.2rem;background:var(--kw);color:var(--bg);font-size:.75rem;font-weight:700;font-family:var(--mono)}
.acpop .ot{flex:1;min-width:0}
.acpop .tg{flex:none;font-family:var(--mono);font-size:.72rem;padding:.1rem .5rem;border-radius:1rem;border:1px solid currentColor;white-space:nowrap}
.acall{list-style:none;margin:.9rem 0 0;padding:0;display:grid;gap:.55rem;max-width:52rem}
.acall li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.5rem;padding:.6rem .75rem;border-radius:.45rem;border:1px solid var(--line);background:var(--ink)}
.acall li.me{border-color:var(--pump)}
.acall .mk{font-weight:700;font-size:1.15rem;text-align:center;line-height:1.3}
.acall li.bad .mk{color:var(--blood)}.acall li.good .mk{color:var(--ecto)}
.acall .cd{font-family:var(--mono);font-size:.85rem;color:var(--bone);white-space:pre-wrap;overflow-wrap:anywhere}
.acall .me-t{font-family:var(--mono);font-size:.72rem;color:var(--pump2);margin-left:.5rem;white-space:nowrap}
.acall p{margin:.25rem 0 0;font-size:1rem;line-height:1.45;color:var(--bone2)}
.acall p code{font-family:var(--mono);font-size:.88em;background:var(--fog);padding:.05em .35em;border-radius:.25rem;color:var(--pump2)}
.reveal .sum{font-size:1.1rem;line-height:1.5;margin:.3rem 0 0;max-width:48rem}

/* the candy jar (shared best hauls) */
.jar{margin-top:2.2rem;max-width:34rem;border-top:1px dashed var(--line);padding-top:1.2rem;animation:rise .5s}
.jar h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,5vw,2.4rem);margin:0;color:var(--pump)}
.jar .you{margin:.2rem 0 .8rem;font-family:var(--mono);font-size:.82rem;color:var(--dim)}
.jar .you b{color:var(--bone)}
.jar ol{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;counter-reset:j}
.jar li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:.6rem;padding:.45rem .7rem;border-radius:.4rem;background:var(--ink2);border:1px solid transparent;font-family:var(--mono);font-size:.9rem}
.jar li.me{border-color:var(--pump)}
.jar .rk{color:var(--dim);text-align:right}
.jar li:nth-child(1) .rk{color:var(--pump)}
.jar .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bone)}
.jar .nm2.anon{color:var(--bone2);font-style:italic;font-family:var(--lore);font-size:1.02rem}
.jar .hv{color:var(--ecto);white-space:nowrap}
.jar .empty{font-family:var(--lore);font-style:italic;color:var(--bone2)}

@media (max-width:52rem){
  .acpop{margin-left:.6rem;max-width:calc(100% - 1.2rem)}
  #ide{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1;display:grid;grid-template-columns:5.5rem 1fr;grid-template-rows:auto auto auto;column-gap:.9rem;row-gap:.5rem;padding:.8rem}
  .ghostbox{grid-row:1/3;height:5.5rem}.ghost{width:3.9rem}
  .say{min-height:0;font-size:1rem}
  .candles{height:2rem}
  .side .meta,.side .row{grid-column:1/-1}
  .pair{grid-template-columns:minmax(0,1fr)}
  .candy,.hdr-r{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .lang{opacity:1}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Hex <b>Editor</b></h1>
      <p class="tag">The ghost writes your code. One line in it is cursed. Find it before your candles go out.</p>
    </div>

function choose(i,b){if(!st||st.done)return;var k=curseAt(i);
  if(k>=0){if(st.found.indexOf(k)>=0)return;st.found.push(k);var g=Math.max(1,3-st.miss);st.gained+=g;
    cur.curses[k].lines.forEach(function(j){var x=document.querySelectorAll('#code .ln')[j];x.classList.add('hit');x.setAttribute('aria-label',x.getAttribute('aria-label')+' — cursed: '+cur.curses[k].name);});
    $('found').textContent=st.found.length;mood('hurt');snd('hit');
    if(st.found.length>=cur.curses.length){say((st.miss?pick(LINES.hit):pick(LINES.perfect))+' +'+st.gained+' candy.');end(false);}
    else say(pick(LINES.hit)+' +'+g+' candy. '+pick(LINES.more));}
  else{if(b.classList.contains('was-miss'))return;st.miss++;st.candles--;b.classList.remove('miss');void b.offsetWidth;b.classList.add('miss','was-miss');candles();mood('grin');snd(st.candles<=0?'lost':'out');
    if(st.candles<=0){say(pick(LINES.lost));end(true);}else say(pick(LINES.miss));}}

function candles(){var c=document.querySelectorAll('#candles .cnd'),n=st?st.candles:ac?ac.candles:3;c.forEach(function(x,i){x.classList.toggle('out',i>=n);});$('candles').setAttribute('aria-label',n+' candle'+(n===1?'':'s')+' lit');}

  SAVE.candy+=st.gained;var pb=SAVE.best[cur.id];if(!pb||pb.lost||(!lost&&st.gained>pb.candy))SAVE.best[cur.id]={candy:st.gained,lost:lost&&!st.gained};save();jar();$('candy').textContent=SAVE.candy;
  if(!lost)setTimeout(function(){mood('gone');},700);
  setTimeout(reveal,lost?900:1500);}

function pre(lines,mark,cls,lang){return '<pre>'+lines.map(function(t,i){return '<span class="l'+(mark.indexOf(i)>=0?' '+cls:'')+'">'+(hl(t,lang)||' ')+'</span>';}).join('')+'</pre>';}

  var names=L.curses.map(function(c){return c.name;}).join(' + ');
  r.innerHTML='<h3 id="revH">The curse'+(L.curses.length>1?'s':'')+': '+esc(names)+'</h3>'+
    L.curses.map(function(c){return '<p class="heard">what people say: <q>'+esc(c.heard)+'</q></p><p class="why">'+(L.curses.length>1?'<b>'+esc(c.name)+'.</b> ':'')+c.why+'</p>';}).join('')+
    '<div class="pair win" data-lang="'+L.id+'" style="background:none;border:0;box-shadow:none;color:inherit;overflow:visible">'+
    '<div><h4 class="bad">what the ghost wrote</h4><div class="win" data-lang="'+L.id+'">'+pre(L.code,bad,'cur',L.id)+'</div></div>'+
    '<div><h4 class="good">what we\'d normally write</h4><div class="win" data-lang="'+L.id+'">'+pre(L.good,L.fix,'fix',L.id)+'</div></div></div>'+
    '<div class="row"><button type="button" class="btn go" id="nextL">pick another program</button><button type="button" class="btn" id="retry">let the ghost try again</button></div>';
  r.hidden=false;$('nextL').onclick=menu;$('retry').onclick=function(){open(L);};
  var left=LANGS.filter(function(x){return !SAVE.best[x.id]||SAVE.best[x.id].lost;}).length;
  if(!left)say('every file is clean. '+SAVE.candy+' candy. the IDE is quiet… for now.');
  r.focus({preventScroll:true});into(r);}

/* Haunted autocomplete (marcipopsis: "autocomplete that gives wrong completion", "dangerous options"): a half-written line,

 {lang:'py',file:'users.py',ctx:['def find_user(db, name):'],pre:'    db.execute(',heard:'someone got into my account',opts:[

var ac=null;
LINES.suggest=['let me finish that line for you.','I know exactly what you meant to type.','the top one. everyone takes the top one.','go on. press Tab. I dare you.'];
LINES.acBad=['hehehe. accepted.','thank you for trusting me.','it compiles! …and so does the curse.','tab, tab, tab. my favourite sound.'];

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function acSafe(){return ac.res.filter(function(r){return r.ok;}).length;}
function openAuto(){cur=null;st=null;clearTimeout(typeT);ac={order:shuf(AUTO.map(function(x,i){return i;})),i:0,candles:3,gained:0,res:[],done:false};
  $('menu').hidden=true;$('ide').hidden=false;$('metaL').textContent='safe picks';$('total').textContent=AUTO.length;$('found').textContent='0';candles();
  into($('ide'));acRound();}
function acRound(){var R=AUTO[ac.order[ac.i]],rows=R.ctx.concat([R.pre]);ac.R=R;ac.opts=shuf(R.opts);ac.sel=0;ac.picked=null;ac.popped=false;

  mood('');say(pick(LINES.write));

    d.innerHTML='<span class="no" aria-hidden="true">'+(i+1)+'</span><code></code>';li.appendChild(d);ol.appendChild(li);});
  var codes=ol.querySelectorAll('code'),li=0,ch=0;
  function fin(){clearTimeout(typeT);$('skipT').hidden=true;rows.forEach(function(t,i){codes[i].innerHTML=hl(t,R.lang)+(i===rows.length-1?'<span class="caret" aria-hidden="true"></span>':'');});acPop();}
  if(RM)return fin();
  $('skipT').hidden=false;$('skipT').onclick=fin;
  (function tick(){if(!ac||ac.R!==R||ac.popped)return;var n=3+Math.floor(Math.random()*4);
    while(n-->0&&li<rows.length){if(ch>=rows[li].length){codes[li].innerHTML=hl(rows[li],R.lang);li++;ch=0;continue;}ch++;}
    if(li>=rows.length)return fin();
    codes[li].innerHTML=esc(rows[li].slice(0,ch))+'<span class="caret" aria-hidden="true"></span>';typeT=setTimeout(tick,28);})();}
function acSel(k){ac.sel=k;var p=$('acPop');if(!p)return;p.setAttribute('aria-activedescendant','aco'+k);
  p.querySelectorAll('li').forEach(function(x,i){x.setAttribute('aria-selected',i===k?'true':'false');});}
function acPop(){if(!ac||ac.popped)return;ac.popped=true;var R=ac.R,line=document.querySelector('#code .acl'),ul=document.createElement('ul');
  ul.className='acpop';ul.id='acPop';ul.setAttribute('role','listbox');ul.tabIndex=0;ul.style.setProperty('--col',Math.min(R.pre.length,28));
  ul.setAttribute('aria-label','The ghost suggests how to finish '+(R.pre.trim()?'the line '+R.pre.trim():'the next line')+'. Arrow keys, then Enter, or press 1 to '+ac.opts.length+'.');
  ac.opts.forEach(function(o,k){var x=document.createElement('li');x.id='aco'+k;x.setAttribute('role','option');
    x.innerHTML='<span class="k" aria-hidden="true">'+(k+1)+'</span><span class="ot">'+esc(o.t)+'</span>'+(o.tag?'<span class="tg">★ '+esc(o.tag)+'</span>':'');
    x.addEventListener('click',function(){acPick(k);});x.addEventListener('mousemove',function(){if(ac.sel!==k)acSel(k);});ul.appendChild(x);});
  ul.addEventListener('keydown',function(e){var n=ac.opts.length;
    if(e.key==='ArrowDown'){e.preventDefault();acSel((ac.sel+1)%n);}
    else if(e.key==='ArrowUp'){e.preventDefault();acSel((ac.sel+n-1)%n);}
    else if(e.key==='Enter'||e.key===' '||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();acPick(ac.sel);}
    else if(/^[1-9]$/.test(e.key)&&+e.key<=n){e.preventDefault();acPick(+e.key-1);}});
  line.parentNode.appendChild(ul);acSel(0);ul.focus({preventScroll:true});snd('pop');say(pick(LINES.suggest));mood('grin');setTimeout(function(){if(ac&&ac.picked==null)mood('');},900);}
function acPick(k){if(!ac||ac.picked!=null||ac.done)return;var o=ac.opts[k],R=ac.R,good=!!o.good,line=document.querySelector('#code .acl');ac.picked=k;
  var p=$('acPop');if(p)p.remove();
  line.querySelector('code').innerHTML=hl(R.pre+o.t,R.lang);line.classList.add(good?'hit':'miss');if(!good)line.classList.add('was-miss');
  ac.res.push({f:R.file,ok:good,t:(R.pre+o.t).trim()});
  if(good){ac.gained+=2;SAVE.candy+=2;save();$('candy').textContent=SAVE.candy;$('found').textContent=acSafe();mood('hurt');snd('hit');say(pick(LINES.acGood)+' +2 candy.');}
  else{ac.candles--;candles();mood('grin');snd(ac.candles<=0?'lost':'out');say(ac.candles<=0?pick(LINES.lost):pick(LINES.acBad));}
  setTimeout(acExplain,RM?0:650);}
function acExplain(){if(!ac)return;var R=ac.R,o=ac.opts[ac.picked],good=!!o.good,last=ac.candles<=0||ac.i>=AUTO.length-1,r=$('reveal');
  r.innerHTML='<h3 id="revH">'+(good?'Safe. The ghost is furious.':'Cursed!'+(o.tag?' You took the “'+esc(o.tag)+'” one.':''))+'</h3>'+
    '<p class="heard">'+(good?'what you just saved someone from saying':'what people say when this happens')+': <q>'+esc(R.heard)+'</q></p>'+
    '<ul class="acall">'+R.opts.map(function(x){return '<li class="'+(x.good?'good':'bad')+(x===o?' me':'')+'"><span class="mk" aria-hidden="true">'+(x.good?'✓':'✗')+'</span>'+
      '<div><span class="sr">'+(x.good?'safe':'cursed')+': </span><span class="cd">'+esc((R.pre+x.t).trim())+'</span>'+(x===o?'<span class="me-t">your pick</span>':'')+'<p>'+(x.good||x.bad)+'</p></div></li>';}).join('')+'</ul>'+
    '<div class="row"><button type="button" class="btn go" id="acNext">'+(ac.candles<=0?'the last candle is out · see your haul':last?'see your haul':'next line →')+'</button></div>';
  r.hidden=false;$('acNext').onclick=function(){if(last)acEnd();else{ac.i++;into($('ide'));acRound();}};
  r.focus({preventScroll:true});into(r);}
function acEnd(){if(!ac||ac.done)return;ac.done=true;var safe=acSafe(),lost=ac.candles<=0,pb=SAVE.best.auto,r=$('reveal');
  if(!pb||pb.lost||ac.gained>pb.candy)SAVE.best.auto={candy:ac.gained,lost:lost&&!ac.gained,safe:safe,of:ac.res.length};save();jar();
  var perfect=safe===AUTO.length;
  r.innerHTML='<h3 id="revH">'+(lost?'The candles are out.':perfect?'Not one curse got in.':'You reached the end of the file.')+'</h3>'+
    '<p class="sum">You picked the safe line <b>'+safe+'</b> of '+ac.res.length+' times and earned <b>'+ac.gained+'</b> candy.'+(lost?' The ghost finished the rest of your code for you. Sleep well.':'')+'</p>'+
    '<ul class="acall">'+ac.res.map(function(x){return '<li class="'+(x.ok?'good':'bad')+'"><span class="mk" aria-hidden="true">'+(x.ok?'✓':'✗')+'</span><div><span class="sr">'+(x.ok?'safe':'cursed')+': </span><span class="cd">'+esc(x.f)+' · '+esc(x.t)+'</span></div></li>';}).join('')+'</ul>'+
    '<div class="row"><button type="button" class="btn go" id="nextL">pick another program</button><button type="button" class="btn" id="retry">let the ghost suggest again</button></div>';
  r.hidden=false;$('nextL').onclick=menu;$('retry').onclick=openAuto;
  if(lost)mood('grin');else{mood('hurt');setTimeout(function(){mood('gone');},700);}
  say(lost?'my code now. all of it.':perfect?pick(LINES.perfect):'not bad. I\'ll still be in your IDE tonight.');

  if(!$('skipT').hidden&&(e.key===' '||e.key==='Enter')&&document.activeElement===document.body){e.preventDefault();$('skipT').click();}});

HAULMAX=LANGS.reduce(function(a,L){return a+3*L.curses.length;},0)+2*AUTO.length;window.__HEX.haul=haul;window.__HEX.max=HAULMAX;

<script type="module">
/* The candy jar: everyone's best haul, one row per player (you can only write your own).
   Twitch players show their handle; anonymous ones get a ghostly nickname. No free-text names. */
import supabase from './supabase-config.js';
const T='hex_editor_candy',$=id=>document.getElementById(id);
let me=null,mine=null,max=42;
const SOULS=['wisp','shade','haunt','specter','phantom','banshee','poltergeist','ghoul'];
function who(u){const m=(u&&u.user_metadata)||{},t=m.user_name||m.preferred_username||m.name||m.nickname;
  if(t&&!u.is_anonymous)return {n:String(t).slice(0,25),tw:true};
  let h=0;for(const c of u.id)h=(h*31+c.charCodeAt(0))>>>0;
  return {n:'a nameless '+SOULS[h%SOULS.length]+' #'+String(h%1000).padStart(3,'0'),tw:false};}
async function session(){if(me)return me;let s=(await supabase.auth.getSession()).data.session;
  if(!s){const r=await supabase.auth.signInAnonymously();s=r.data&&r.data.session;}
  if(!s)throw new Error('no session');me=s.user;return me;}
function youLine(h){const y=$('jarYou');y.textContent='';const w=me?who(me):null;
  y.append('your best haul: ');const b=document.createElement('b');b.textContent=h+' of '+max;y.append(b);
  if(!w)y.append(' · beat the ghost once to get in');else if(!w.tw)y.append(' · log in with Twitch in the top bar to put your name on the jar');}
async function load(){const r=await supabase.from(T).select('display_name,haul,twitch,user_id')
    .gt('haul',0).order('haul',{ascending:false}).order('perfect_at',{ascending:true,nullsFirst:false}).order('updated_at',{ascending:true}).limit(10);
  if(r.error)throw r.error;const ol=$('jarList');ol.textContent='';
  if(!r.data.length){const li=document.createElement('li');li.className='empty';li.textContent='the jar is empty. be the first to beat the ghost.';ol.append(li);}
  r.data.forEach((row,i)=>{const li=document.createElement('li');if(me&&row.user_id===me.id)li.className='me';
    const rk=document.createElement('span');rk.className='rk';rk.textContent=(i+1)+'.';
    const nm=document.createElement('span');nm.className='nm2'+(row.twitch?'':' anon');nm.textContent=row.display_name||'a nameless soul';
    const hv=document.createElement('span');hv.className='hv';hv.textContent=row.haul+(row.haul>=max?' 🍬 perfect':' 🍬');
    li.setAttribute('aria-label',(i+1)+'. '+nm.textContent+', '+row.haul+' candy');li.append(rk,nm,hv);ol.append(li);});
  $('jar').hidden=false;}
async function submit(h,m){if(m)max=m;const u=await session(),w=who(u);
  if(!mine){const r=await supabase.from(T).select('id,haul,display_name,twitch,perfect_at').eq('user_id',u.id).limit(1);if(r.error)throw r.error;mine=r.data[0]||{};}
  if(h>0&&(!mine.id||h>mine.haul||w.n!==mine.display_name)){
    const row={display_name:w.n,haul:Math.max(h,mine.haul||0),twitch:w.tw,updated_at:new Date().toISOString()};
    if(row.haul>=max&&!mine.perfect_at)row.perfect_at=row.updated_at;
    const r=mine.id?await supabase.from(T).update(row).eq('id',mine.id).select('id,haul,display_name,twitch,perfect_at')
                   :await supabase.from(T).insert(Object.assign({user_id:u.id},row)).select('id,haul,display_name,twitch,perfect_at');
    if(r.error)throw r.error;mine=r.data[0];}
  youLine(Math.max(h,mine.haul||0));await load();}
window.HEXJAR={submit:(h,m)=>submit(h,m).catch(e=>{console.warn('candy jar',e&&e.message);}),
  load:()=>load().catch(()=>{}),mine:()=>mine,me:()=>me,
  forget:async()=>{if(mine&&mine.id){await supabase.from(T).delete().eq('id',mine.id);mine=null;}}};
// on arrival: read the jar without creating an account; sign in anonymously only once there is candy to put in it
(async()=>{const H=window.__HEX,h=H?H.haul():0;if(H)max=H.max;
  try{const s=(await supabase.auth.getSession()).data.session;if(s)me=s.user;}catch(e){}
  if(h>0)return window.HEXJAR.submit(h,max);
  youLine(0);await load();})().catch(()=>{});
</script>
