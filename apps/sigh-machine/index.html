<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sigh Machine · disappointment, synthesized</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%98%AE%E2%80%8D%F0%9F%92%A8">
  <meta name="description" content="A tone generator for disappointed sighs. Five flavours of weariness, adjustable exhaustion, synthesized fresh every time.">
  <meta property="og:title" content="Sigh Machine — press for disappointment">
  <meta property="og:description" content="Synthesized sighs from mild letdown to cosmic resignation. Adjustable weariness. Someone had to build this.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/vintage%20radio%20with%20a%20tired%20face%20emitting%20visible%20sigh%20cloud%20muted%20colors%20minimal%20poster?width=1200&height=630&seed=7777&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/sigh-machine">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root{ --fog:#e8e4dc; --ink:#3a362e; --dim:#8f887a; --accent:#7a8a9a; --card:#f2efe8; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--fog); color:var(--ink);
      font:300 1.05rem/1.6 'Fraunces', serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; padding:1.6rem 1.1rem 3rem; text-align:center;
    }
    h1{ font:300 clamp(2rem,7vw,3rem)/1.1 'Fraunces', serif; margin:0; }
    h1 em{ color:var(--accent); }
    .tag{ font-style:italic; color:var(--dim); margin:0.4rem 0 1.4rem; }
    .machine{
      background:var(--card); border:1.5px solid #d4cec0; border-radius:16px;
      padding:1.6rem 1.5rem; max-width:26rem; width:100%;
      box-shadow:0 2px 0 rgba(58,54,46,0.05), 0 16px 40px rgba(58,54,46,0.1);
    }
    .sighs{ display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:1.2rem; }
    .sighs button{
      font:400 0.95rem 'Fraunces', serif; cursor:pointer;
      background:#fff; color:var(--ink); border:1.5px solid #d4cec0; border-radius:10px;
      padding:0.8rem 0.6rem; min-height:3.4rem;
      transition:transform 0.1s;
    }
    .sighs button:hover{ border-color:var(--accent); }
    .sighs button:active{ transform:scale(0.97); }
    .sighs button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
    .sighs button small{ display:block; font:400 0.62rem 'IBM Plex Mono', monospace; color:var(--dim); margin-top:0.15rem; }
    .sighs button.wide{ grid-column:1/-1; }
    .knob{ margin:0.7rem 0; text-align:left; }
    .knob label{ font:400 0.68rem 'IBM Plex Mono', monospace; color:var(--dim); letter-spacing:0.1em; text-transform:uppercase; display:flex; justify-content:space-between; }
    .knob label b{ color:var(--ink); }
    input[type=range]{ width:100%; accent-color:var(--accent); min-height:2rem; }
    #cloud{
      font-size:1.6rem; min-height:2.2rem; margin-top:0.8rem;
      opacity:0; transition:opacity 0.4s, transform 1.8s ease-out; display:inline-block;
    }
    #cloud.drift{ opacity:0.7; transform:translateY(-14px); }
    .foot{ margin-top:1.1rem; font-size:0.7rem; color:var(--dim); font-style:italic; }
    @media (prefers-reduced-motion: reduce){ #cloud{ transition:opacity 0.4s; } }
  </style>
</head>
<body>
  <h1>the <em>sigh</em> machine</h1>
  <p class="tag">disappointment, synthesized fresh · no two sighs alike</p>
  <div class="machine">
    <div class="sighs" role="group" aria-label="Sigh flavours">
      <button type="button" data-sigh="mild">mild letdown<small>the email said "per my last"</small></button>
      <button type="button" data-sigh="deep">the deep one<small>from the floor of the soul</small></button>
      <button type="button" data-sigh="passive">passive-aggressive<small>audible on purpose</small></button>
      <button type="button" data-sigh="tired">exhausted<small>it's not even noon</small></button>
      <button type="button" class="wide" data-sigh="cosmic">cosmic resignation<small>the universe heard. it sighed back.</small></button>
    </div>
    <div class="knob">
      <label for="kWeary">weariness <b id="vWeary">50</b>%</label>
      <input type="range" id="kWeary" min="0" max="100" value="50">
    </div>
    <div class="knob">
      <label for="kLen">breath length <b id="vLen">1.8</b>s</label>
      <input type="range" id="kLen" min="8" max="40" value="18">
    </div>
    <span id="cloud" aria-hidden="true"></span>
  </div>
  <p class="foot">a public utility. you're welcome. <span id="count">0</span> sighs released into the world this session.</p>
  <p id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

  <script>
  (function(){
    'use strict';
    var $=function(id){ return document.getElementById(id); };
    var AC=null, count=0;
    function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }

    /* ── the anatomy of a sigh ──
       breath: pink-ish noise through a bandpass whose formant FALLS (the "haaah")
       voice: a soft descending glide underneath, barely voiced, slight tremble
       envelope: swell in, long defeated release. Parameterized per flavour. */
    function noiseBuf(dur){
      var n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
      var last=0;
      for(var i=0;i<n;i++){ var w=Math.random()*2-1; last=(last+0.03*w)/1.03; d[i]=last*4.2; }  // cheap pink
      return b;
    }
    function sigh(p){
      if(!ac()) return null;
      var t=AC.currentTime+0.02;
      var dur=p.dur, out=AC.createGain(); out.gain.value=1; out.connect(AC.destination);
      /* breath */
      var nz=AC.createBufferSource(); nz.buffer=noiseBuf(dur+0.2);
      var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=p.q;
      bp.frequency.setValueAtTime(p.f0,t);
      bp.frequency.exponentialRampToValueAtTime(p.f1,t+dur);
      var ng=AC.createGain();
      ng.gain.setValueAtTime(0.0008,t);
      ng.gain.linearRampToValueAtTime(p.vol,t+dur*p.swell);          // the intake→release turn
      ng.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      nz.connect(bp); bp.connect(ng); ng.connect(out);
      nz.start(t); nz.stop(t+dur+0.25);
      /* voice underneath */
      if(p.voice>0){
        var o=AC.createOscillator(), og=AC.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(p.v0,t);
        o.frequency.exponentialRampToValueAtTime(p.v1,t+dur*0.9);
        var lfo=AC.createOscillator(), lg=AC.createGain();          // the tremble
        lfo.frequency.value=p.tremble; lg.gain.value=p.v0*0.02+p.trembleDepth;
        lfo.connect(lg); lg.connect(o.frequency);
        og.gain.setValueAtTime(0.0008,t);
        og.gain.linearRampToValueAtTime(p.voice,t+dur*p.swell*1.1);
        og.gain.exponentialRampToValueAtTime(0.0008,t+dur*0.95);
        o.connect(og); og.connect(out);
        o.start(t); o.stop(t+dur); lfo.start(t); lfo.stop(t+dur);
      }
      /* optional second exhale (the double sigh of true defeat) */
      if(p.echo){
        setTimeout(function(){ sigh(Object.assign({},p,{ echo:false, vol:p.vol*0.55, voice:p.voice*0.5, dur:p.dur*0.7 })); }, dur*1000+260);
      }
      return dur;
    }
    /* flavour presets — weariness + length knobs modulate on top */
    function params(kind){
      var weary=(+$('kWeary').value)/100;                            // 0..1
      var len=(+$('kLen').value)/10;                                 // 0.8..4s
      var base={
        mild:    { dur:len*0.7, f0:1500, f1:800, q:1.1, vol:0.18, swell:0.3,  v0:260, v1:180, voice:0.02, tremble:5,  trembleDepth:1, echo:false },
        deep:    { dur:len,     f0:1100, f1:420, q:1.4, vol:0.26, swell:0.22, v0:210, v1:110, voice:0.05, tremble:4.2,trembleDepth:2, echo:false },
        passive: { dur:len*0.85,f0:1900, f1:900, q:2.2, vol:0.3,  swell:0.14, v0:300, v1:200, voice:0.04, tremble:6,  trembleDepth:3, echo:false },
        tired:   { dur:len*1.15,f0:900,  f1:380, q:1.2, vol:0.22, swell:0.35, v0:180, v1:95,  voice:0.06, tremble:3.4,trembleDepth:2, echo:false },
        cosmic:  { dur:len*1.4, f0:1300, f1:300, q:1.6, vol:0.28, swell:0.25, v0:230, v1:80,  voice:0.07, tremble:3,  trembleDepth:4, echo:true },
      }[kind];
      /* weariness: lower formants, slower swell, deeper voice drop, more tremble */
      base.f0*=(1-weary*0.25); base.f1*=(1-weary*0.3);
      base.v1*=(1-weary*0.25);
      base.swell=Math.min(0.5,base.swell+weary*0.15);
      base.trembleDepth+=weary*3;
      base.dur*=(1+weary*0.3);
      /* no two sighs alike */
      base.f0*=0.94+Math.random()*0.12; base.v0*=0.95+Math.random()*0.1;
      base.dur*=0.93+Math.random()*0.14;
      return base;
    }
    var CLOUDS={ mild:'😮‍💨', deep:'😮‍💨💭', passive:'😮‍💨🙄', tired:'😮‍💨☕', cosmic:'😮‍💨🌌' };
    var LABELS={ mild:'a mild letdown escapes', deep:'a sigh from the floor of the soul', passive:'a sigh, performed at you', tired:'exhaustion, vocalised', cosmic:'the universe sighs back' };
    document.querySelectorAll('[data-sigh]').forEach(function(b){
      b.addEventListener('click',function(){
        var kind=this.getAttribute('data-sigh');
        var d=sigh(params(kind));
        if(d===null) return;
        count++; $('count').textContent=count;
        $('live').textContent=LABELS[kind];
        var cl=$('cloud');
        cl.textContent=CLOUDS[kind];
        cl.classList.remove('drift'); void cl.offsetWidth; cl.classList.add('drift');
      });
    });
    $('kWeary').addEventListener('input',function(){ $('vWeary').textContent=this.value; });
    $('kLen').addEventListener('input',function(){ $('vLen').textContent=(this.value/10).toFixed(1); });
    window.__sm={ sigh:sigh, params:params, count:function(){return count;} };
  })();
  </script>
</body>
</html>
