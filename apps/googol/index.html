<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Googol — a quiet incremental</title>
<meta name="description" content="Start at one. Buy the successor function. Pass π, 42, Avogadro. Stop at 10¹⁰⁰ — or don't.">
<link rel="icon" href="https://emojicdn.elk.sh/♾️">
<meta property="og:title" content="Googol — a quiet incremental">
<meta property="og:description" content="Start at one. Buy the successor function. Pass π, 42, Avogadro. Stop at 10¹⁰⁰ — or don't.">
<meta property="og:url" content="https://sloppy.live/googol/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/enormous%20thin%20serif%20number%20on%20warm%20paper%20white%20background%2C%20klein%20blue%20accent%2C%20swiss%20minimalist%20poster%20design%2C%20mathematical%20elegance%2C%20lots%20of%20negative%20space.png?width=1200&height=630&nologo=true&seed=1010&model=flux">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Azeret+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f3; --ink:#191817; --faint:#8a867d; --hair:#e3dfd5;
  --blue:#2438ff;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  font-family:'Azeret Mono', monospace;
  background:var(--paper); color:var(--ink);
  min-height:100vh; display:flex; justify-content:center;
}
main{ width:min(40rem,100%); padding:2.5rem 1.2rem 4rem; }
header{ display:flex; justify-content:space-between; align-items:baseline; gap:1rem; }
h1{ font-family:'Instrument Serif', serif; font-weight:400; font-size:1.4rem; letter-spacing:.02em; }
h1 i{ color:var(--blue); font-style:normal; }
.kappa{ font-size:.72rem; color:var(--faint); }
.kappa b{ color:var(--blue); font-weight:500; }

/* the number */
#tap{
  display:block; width:100%; background:none; border:0; cursor:pointer;
  padding:3.2rem 0 1rem; text-align:center;
  font-family:'Instrument Serif', serif; font-weight:400; color:var(--ink);
  line-height:1;
}
#tap:active #num{ transform:scale(.985); }
#num{
  display:inline-block; font-size:clamp(3rem, 13vw, 6.2rem); letter-spacing:-.01em;
  transition:transform .06s ease; overflow-wrap:anywhere;
}
#num sup{ font-size:.38em; vertical-align:super; letter-spacing:0; }
.rates{
  text-align:center; font-size:.72rem; color:var(--faint); letter-spacing:.08em;
  margin-bottom:2.8rem;
}
.rates b{ font-weight:500; color:var(--ink); }
.milestone-toast{
  text-align:center; font-family:'Instrument Serif', serif; font-style:italic;
  font-size:1.05rem; color:var(--blue); min-height:1.6rem; margin-bottom:1.6rem;
  opacity:0; transition:opacity .6s ease;
}
.milestone-toast.show{ opacity:1; }

/* upgrades */
ul.shop{ list-style:none; border-top:1px solid var(--hair); }
ul.shop li{ border-bottom:1px solid var(--hair); }
ul.shop button{
  display:grid; grid-template-columns:1fr auto; gap:.15rem .9rem; align-items:baseline;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font-family:inherit; color:var(--ink);
  padding:.85rem .3rem; min-height:2.75rem;
}
ul.shop button:disabled{ cursor:default; }
ul.shop button:disabled .name, ul.shop button:disabled .cost{ color:var(--hair); }
ul.shop button:disabled .eff{ color:var(--hair); }
ul.shop .name{ font-size:.85rem; font-weight:500; letter-spacing:.02em; }
ul.shop .name .lv{ color:var(--faint); font-weight:300; }
ul.shop .cost{ font-size:.8rem; text-align:right; color:var(--blue); font-weight:500; white-space:nowrap; }
ul.shop .eff{ grid-column:1; font-size:.68rem; color:var(--faint); }
ul.shop button:not(:disabled):hover .name{ color:var(--blue); }

/* footer bits */
.limitrow{ margin-top:2rem; text-align:center; }
#limit{
  font-family:inherit; font-size:.78rem; letter-spacing:.06em;
  background:none; border:1px solid var(--hair); color:var(--faint);
  border-radius:2rem; padding:.6rem 1.3rem; min-height:2.75rem; cursor:pointer;
}
#limit:not(:disabled){ border-color:var(--blue); color:var(--blue); }
#limit:disabled{ cursor:default; }
.milelog{ margin-top:2rem; font-size:.68rem; color:var(--faint); }
.milelog summary{ cursor:pointer; min-height:2.2rem; display:flex; align-items:center; letter-spacing:.08em; }
.milelog li{ margin:.25rem 0 .25rem 1rem; list-style:none; }
.milelog .hit{ color:var(--ink); }
.milelog .hit::before{ content:'— '; color:var(--blue); }
.foot{ margin-top:2.2rem; text-align:center; font-size:.62rem; color:var(--faint); letter-spacing:.08em; }

/* win overlay */
.overlay{
  position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  background:rgba(250,248,243,.96); padding:1rem; text-align:center;
}
.overlay h2{ font-family:'Instrument Serif', serif; font-weight:400; font-size:clamp(2rem,8vw,3.4rem); margin-bottom:.6rem; }
.overlay h2 sup{ font-size:.4em; }
.overlay p{ font-style:italic; font-family:'Instrument Serif', serif; font-size:1.1rem; color:var(--faint); margin-bottom:1.8rem; }
.overlay .row{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }
.overlay button{
  font-family:'Azeret Mono', monospace; font-size:.8rem; letter-spacing:.06em;
  border:1px solid var(--ink); background:none; color:var(--ink);
  border-radius:2rem; padding:.7rem 1.4rem; min-height:2.75rem; cursor:pointer;
}
.overlay button.blue{ background:var(--blue); border-color:var(--blue); color:#fff; }
.hide{ display:none !important; }
button:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
.sr{ position:absolute; left:-999rem; }
@media (prefers-reduced-motion: reduce){ #num{ transition:none; } .milestone-toast{ transition:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>googol<i>.</i></h1>
    <p class="kappa" id="kappa"></p>
  </header>

  <button type="button" id="tap" aria-label="The number. Click to add.">
    <span id="num">1</span>
  </button>
  <p class="rates" id="rates"></p>
  <p class="milestone-toast" id="toast" role="status" aria-live="polite"></p>

  <ul class="shop" id="shop"></ul>

  <div class="limitrow">
    <button type="button" id="limit" disabled>take the limit</button>
  </div>

  <details class="milelog">
    <summary>numbers passed</summary>
    <ul id="milelist"></ul>
  </details>
  <p class="foot">everything counts. saved locally. keys 1–6 buy. cost of a variable = base + 5·its value.</p>
</main>

<div class="overlay hide" id="win">
  <div>
    <h2>10<sup>100</sup></h2>
    <p>a googol. you have counted enough.<br>nobody has ever needed this many.</p>
    <div class="row">
      <button type="button" class="blue" id="win-limit">√ take the limit</button>
      <button type="button" id="win-keep">keep counting</button>
    </div>
  </div>
</div>
<p class="sr" role="status" aria-live="polite" id="announce"></p>

<script>
'use strict';
const LS='googol-v2';
const LS_OLD='googol-v1';
const $=id=>document.getElementById(id);

/* ── the derivative chain: four VARIABLES with linear costs ──────────
   dN/dt = A·mult   dA/dt = B   dB/dt = C   dC/dt = D
   Buying a variable adds +1 to its value. Cost is LINEAR (per chat):
   cost_X = base_X + 5·⌊value_X⌋ — a different base per variable, and
   since the chain itself inflates values, prices track growth naturally. */
const VARS=[
  { k:'A', base:10,   eff:'dN/dt = A · mult' },
  { k:'B', base:50,   eff:'B = dA/dt' },
  { k:'C', base:500,  eff:'C = dB/dt' },
  { k:'D', base:5000, eff:'D = dC/dt' }
];
/* operators keep exponential costs — they do the lifting to 10¹⁰⁰ */
const OPS=[
  { k:'mul', name:'multiplication', eff:'×2 everything', base:500, growth:9 },
  { k:'exp', name:'exponent lever', eff:'×10 everything', base:2e6, growth:80 }
];

function fresh(){
  return { n:1, vals:{A:0,B:0,C:0,D:0}, lv:{mul:0,exp:0}, kappa:0, miles:[], won:false, last:Date.now() };
}
let S=fresh();
(function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS));
    if(raw&&typeof raw.n==='number'){ S=Object.assign(fresh(),raw); return; }
  }catch(e){}
  /* migrate v1 saves: engines → A, d/dt → B, operators + κ carry over */
  try{
    const old=JSON.parse(localStorage.getItem(LS_OLD));
    if(old&&typeof old.n==='number'){
      S=fresh();
      S.n=old.n; S.kappa=old.kappa||0; S.miles=old.miles||[]; S.won=!!old.won;
      const olv=old.lv||{};
      S.vals.A=(olv.add||0)+(olv.succ||0);
      S.vals.B=(olv.ddt||0)*2;
      S.lv.mul=olv.mul||0; S.lv.exp=olv.exp||0;
      S.last=old.last||Date.now();
    }
  }catch(e){}
})();
S.vals=Object.assign({A:0,B:0,C:0,D:0}, S.vals||{});
S.lv=Object.assign({mul:0,exp:0}, S.lv||{});
if(!Array.isArray(S.miles)) S.miles=[];

/* ── math ── */
function mult(){ return Math.pow(2,S.lv.mul)*Math.pow(10,S.lv.exp)*Math.pow(2,S.kappa); }
function clickPower(){ return (1+S.vals.A)*mult(); }
function aps(){ return S.vals.A*mult(); }
function varCost(v){ return v.base + 5*Math.floor(S.vals[v.k]); }
function opCost(o){ return Math.ceil(o.base*Math.pow(o.growth, S.lv[o.k])); }

/* ── milestones ── */
const MILES=[
  [Math.PI,'π — 3.14159… passed'],
  [42,'42 — the answer'],
  [365.25,'365.25 — one year of days'],
  [1729,'1729 — the taxicab number'],
  [86400,'86,400 — seconds in a day'],
  [1e6,'10⁶ — a million. the limit unlocks.'],
  [6.022e23,'6.022×10²³ — Avogadro’s number'],
  [7.5e18,'7.5×10¹⁸ — grains of sand on Earth'],
  [1e80,'10⁸⁰ — atoms in the observable universe'],
  [1e100,'10¹⁰⁰ — a googol.']
];

/* ── formatting ── */
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){ return String(n).split('').map(c=>SUP[c]||c).join(''); }
function fmt(v){
  if(!isFinite(v)) return '∞';
  if(v<1e6){
    return v<100 ? (Math.floor(v)===v?String(v):v.toFixed(v<10?2:1))
                 : Math.floor(v).toLocaleString('en-US');
  }
  const e=Math.floor(Math.log10(v));
  const m=v/Math.pow(10,e);
  return (m>=9.995?'10':m.toFixed(2))+'×10'+sup(m>=9.995?e+1:e);
}
function fmtHtml(v){
  if(!isFinite(v)) return '∞';
  if(v<1e6) return fmt(v);
  const e=Math.floor(Math.log10(v));
  const m=v/Math.pow(10,e);
  return (m>=9.995?'10':m.toFixed(2))+'×10<sup>'+(m>=9.995?e+1:e)+'</sup>';
}

/* ── render ── */
function renderNum(){
  $('num').innerHTML=fmtHtml(S.n);
  $('rates').innerHTML='<b>+'+fmt(clickPower())+'</b> per click · <b>'+fmt(aps())+'</b> per second'
    +'<br><span style="letter-spacing:.14em">A '+fmt(S.vals.A)+' · B '+fmt(S.vals.B)+' · C '+fmt(S.vals.C)+' · D '+fmt(S.vals.D)+'</span>';
}
function renderShop(){
  const ul=$('shop');
  if(!ul.children.length){
    VARS.forEach((v,i)=>{
      const li=document.createElement('li');
      const b=document.createElement('button'); b.type='button'; b.id='buy-'+v.k;
      b.innerHTML='<span class="name">variable '+v.k+' <span class="lv"></span></span><span class="cost"></span><span class="eff">'+v.eff+' · cost = '+v.base+' + 5·'+v.k+' · key '+(i+1)+'</span>';
      b.addEventListener('click',()=>buyVar(v.k));
      li.appendChild(b); ul.appendChild(li);
    });
    OPS.forEach((o,i)=>{
      const li=document.createElement('li');
      const b=document.createElement('button'); b.type='button'; b.id='buy-'+o.k;
      b.innerHTML='<span class="name">'+o.name+' <span class="lv"></span></span><span class="cost"></span><span class="eff">'+o.eff+' · key '+(VARS.length+i+1)+'</span>';
      b.addEventListener('click',()=>buyOp(o.k));
      li.appendChild(b); ul.appendChild(li);
    });
  }
  VARS.forEach(v=>{
    const b=$('buy-'+v.k);
    b.querySelector('.lv').textContent='= '+fmt(Math.floor(S.vals[v.k]));
    b.querySelector('.cost').textContent=fmt(varCost(v));
    b.disabled=S.n<varCost(v);
  });
  OPS.forEach(o=>{
    const b=$('buy-'+o.k);
    b.querySelector('.lv').textContent=S.lv[o.k]?('·'+S.lv[o.k]):'';
    b.querySelector('.cost').textContent=fmt(opCost(o));
    b.disabled=S.n<opCost(o);
  });
  const pend=limitGain();
  $('limit').disabled=pend<=0;
  $('limit').textContent=pend>0?('take the limit → +'+pend+' κ'):'take the limit';
  $('kappa').innerHTML=S.kappa>0?('κ '+S.kappa+' · <b>×'+fmt(Math.pow(2,S.kappa))+'</b> forever'):'';
}
function renderMiles(){
  const ul=$('milelist'); ul.innerHTML='';
  MILES.forEach(([v,label])=>{
    const li=document.createElement('li');
    const hit=S.miles.includes(label);
    li.className=hit?'hit':'';
    li.textContent=hit?label:'· · ·';
    ul.appendChild(li);
  });
}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3400);
  $('announce').textContent=msg;
}

/* ── actions ── */
function gain(v){ S.n+=v; }
$('tap').addEventListener('click',()=>{ gain(clickPower()); renderNum(); checkMiles(); renderShop(); });
function buyVar(k){
  const v=VARS.find(x=>x.k===k);
  const c=varCost(v);
  if(S.n<c) return;
  S.n-=c; S.vals[k]+=1;
  renderNum(); renderShop(); save();
}
function buyOp(k){
  const o=OPS.find(x=>x.k===k);
  const c=opCost(o);
  if(S.n<c) return;
  S.n-=c; S.lv[k]++;
  renderNum(); renderShop(); save();
}
document.addEventListener('keydown',e=>{
  const i=parseInt(e.key,10);
  if(i>=1&&i<=VARS.length) buyVar(VARS[i-1].k);
  else if(i>VARS.length&&i<=VARS.length+OPS.length) buyOp(OPS[i-VARS.length-1].k);
  else if(e.key===' '){ e.preventDefault(); $('tap').click(); }
});
function limitGain(){
  if(S.n<1e6) return 0;
  return Math.max(0, Math.floor(Math.log10(S.n))-5-S.kappa);
}
function takeLimit(){
  const g=limitGain(); if(g<=0) return;
  S.kappa+=g;
  const keepMiles=S.miles, k=S.kappa, won=S.won;
  S=fresh(); S.kappa=k; S.miles=keepMiles; S.won=won;
  $('win').classList.add('hide');
  toast('the limit taken — κ '+k+', ×'+fmt(Math.pow(2,k))+' forever');
  renderAll(); save();
}
$('limit').addEventListener('click',takeLimit);
$('win-limit').addEventListener('click',takeLimit);
$('win-keep').addEventListener('click',()=>$('win').classList.add('hide'));

function checkMiles(){
  for(const [v,label] of MILES){
    if(S.n>=v && !S.miles.includes(label)){
      S.miles.push(label);
      toast(label);
      renderMiles();
      if(v===1e100 && !S.won){ S.won=true; $('win').classList.remove('hide'); }
    }
  }
}

/* ── loop: fixed 10Hz, integrate the chain top-down ── */
function step(dt){
  S.vals.C+=S.vals.D*dt;
  S.vals.B+=S.vals.C*dt;
  S.vals.A+=S.vals.B*dt;
  gain(S.vals.A*mult()*dt);
}
let acc=0, lastT=performance.now();
setInterval(()=>{
  const now=performance.now();
  acc+=Math.min(2000, now-lastT); lastT=now;
  let changed=false;
  while(acc>=100){ step(.1); acc-=100; changed=true; }
  if(changed){ renderNum(); checkMiles(); renderShop(); }
},100);

/* offline progress: integrate the full chain closed-form (cap 8h) */
(function offline(){
  const away=(Date.now()-(S.last||Date.now()))/1000;
  if(away>30 && (S.vals.A>0||S.vals.B>0||S.vals.C>0||S.vals.D>0)){
    const t=Math.min(away, 8*3600);
    const {A,B,C,D}=S.vals;
    /* N gain = ∫A(t) = A t + B t²/2 + C t³/6 + D t⁴/24, then advance the chain */
    const gained=(A*t + B*t*t/2 + C*t*t*t/6 + D*t*t*t*t/24)*mult();
    S.vals.A=A + B*t + C*t*t/2 + D*t*t*t/6;
    S.vals.B=B + C*t + D*t*t/2;
    S.vals.C=C + D*t;
    gain(gained);
    checkMiles();
    toast('while you were gone: +'+fmt(gained));
  }
})();
function save(){ S.last=Date.now(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

function renderAll(){ renderNum(); renderShop(); renderMiles(); }
renderAll();

</script>
</body>
</html>
