<style>
:root{
  --ink:#07030f; --cyan:#19f3ff; --mag:#ff2bd6; --acid:#e4ff1a; --txt:#effaff; --dim:#b4c2ea;
  --hud:4.6rem; --bar:4.4rem;
  --mono:'Martian Mono','Cascadia Mono','Courier New',monospace;
  --disp:'Tektur','Martian Mono','Courier New',monospace;
  --jp:'DotGothic16','Martian Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--txt);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--mono);-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(.5rem,env(safe-area-inset-top)) .75rem max(.5rem,env(safe-area-inset-bottom));
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.col{width:100%;max-width:27rem;margin:0 auto}
#hud{height:var(--hud);display:flex;gap:.45rem;align-items:stretch;flex:0 0 auto}
.box{position:relative;flex:0 0 auto;height:100%;aspect-ratio:1;border:1px solid #2b8fa6;border-radius:.35rem;
  background:linear-gradient(160deg,rgba(25,243,255,.08),rgba(7,3,18,.7) 60%);box-shadow:inset 0 0 .8rem rgba(25,243,255,.12)}
.box .lbl{position:absolute;top:.2rem;left:.35rem;font-size:.625rem;letter-spacing:.14em;color:var(--dim);font-weight:400}
#scoreCol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.15rem;
  text-shadow:0 0 .6rem rgba(255,43,214,.55)}
#score{font-weight:800;font-size:clamp(1.15rem,6.2vw,1.85rem);letter-spacing:-.02em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
#sub{font-size:.66rem;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
#sub b{color:var(--acid);font-weight:800}
#nextMini{flex:0 0 auto;display:flex;flex-direction:column;gap:.3rem;height:100%}
#nextMini .box{height:calc(50% - .15rem)}
#stage{flex:1 1 auto;position:relative;min-height:0}
#bar{height:var(--bar);flex:0 0 auto;display:flex;gap:.4rem;align-items:center}
.b{font:800 .72rem/1 var(--mono);letter-spacing:.08em;color:var(--txt);background:rgba(10,5,26,.78);
  border:1px solid #3aa9c2;border-radius:.5rem;min-height:3.4rem;min-width:2.75rem;padding:.3rem .5rem;cursor:pointer;
  position:relative;overflow:hidden;touch-action:manipulation}
.b.grow{flex:1 1 0}
.b .ic{display:block;font-size:1.1rem;line-height:1.1;margin-bottom:.15rem}
.b:active{transform:translateY(1px);background:rgba(25,243,255,.15)}
.b[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
#fx{position:fixed;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.pop{font:900 clamp(1.6rem,9vw,2.6rem)/1 var(--disp);letter-spacing:.04em;color:#fff;white-space:nowrap;
  text-shadow:-.12rem 0 var(--mag),.12rem 0 var(--cyan),0 0 1.2rem rgba(255,43,214,.8);animation:pop 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
.pop.s{font-size:clamp(.95rem,4.6vw,1.3rem);font-family:var(--mono);font-weight:800;color:var(--acid);text-shadow:0 0 .8rem rgba(228,255,26,.7)}
@keyframes pop{0%{transform:scale(.4) skewX(-12deg)}18%{transform:scale(1.12) skewX(0)}70%{transform:scale(1);opacity:1}100%{transform:scale(1) translateY(-1.4rem);opacity:0}}
#hint{position:fixed;pointer-events:none;text-align:center;font-size:.72rem;line-height:1.6;color:#fff;letter-spacing:.04em;
  text-shadow:0 0 .4rem #000,0 0 .8rem #000;transition:opacity .6s}

#hint kbd{font:inherit;color:var(--acid)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;z-index:5}
.ov[hidden]{display:none}
.card{width:100%;max-width:22rem;text-align:center;padding:1.3rem 1.2rem 1.1rem;border-radius:.8rem;
  background:linear-gradient(170deg,rgba(26,8,52,.9),rgba(7,3,18,.92));border:1px solid rgba(255,43,214,.6);
  box-shadow:0 0 0 1px rgba(25,243,255,.25) inset,0 0 2.5rem rgba(255,43,214,.35);animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(1.2rem) scale(.96)}to{transform:none}}
h1{margin:0;font:900 clamp(2.9rem,15vw,4.2rem)/.86 var(--disp);letter-spacing:.02em;color:#fff;
  text-shadow:-.18rem 0 var(--mag),.18rem 0 var(--cyan),0 0 1.6rem rgba(255,43,214,.9)}
h1 span{display:block;font-weight:400;font-size:.42em;letter-spacing:.55em;margin:.35rem 0 0 .5em;color:var(--acid);text-shadow:0 0 .9rem rgba(228,255,26,.8)}
.jp{font-family:var(--jp);color:var(--cyan);font-size:.9rem;letter-spacing:.3em;margin:.55rem 0 .2rem}
.card p{margin:.55rem 0;font-size:.78rem;line-height:1.55;color:var(--dim)}
.card p strong{color:#fff;font-weight:800}
.go{font:900 1.25rem/1 var(--disp);letter-spacing:.2em;color:#0a0414;background:var(--acid);border:0;border-radius:.45rem;
  padding:.95rem 2.2rem;margin:.6rem 0 .3rem;cursor:pointer;box-shadow:0 0 1.4rem rgba(228,255,26,.55),.2rem .2rem 0 var(--mag);min-height:2.75rem}
.go:active{transform:translate(.1rem,.1rem);box-shadow:0 0 1rem rgba(228,255,26,.5),.1rem .1rem 0 var(--mag)}
.ghostbtn{font:800 .75rem/1 var(--mono);letter-spacing:.1em;color:var(--txt);background:transparent;border:1px solid #3aa9c2;border-radius:.4rem;padding:.7rem 1rem;min-height:2.75rem;cursor:pointer;margin:.2rem}
.credit{font-size:.66rem!important;color:#c49ad8!important;letter-spacing:.12em;margin-top:.8rem!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .8rem;margin:.9rem 0 .4rem;text-align:left;font-size:.72rem;color:var(--dim)}
.stats b{display:block;font-size:1.1rem;color:#fff;font-weight:800}
.big{font:800 2.3rem/1 var(--mono);color:#fff;margin:.4rem 0 0;text-shadow:0 0 1rem rgba(25,243,255,.8)}
.newbest{color:var(--acid);font-weight:800;letter-spacing:.2em;font-size:.75rem;min-height:1em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:560px){
  .card{padding:.8rem 1rem .7rem} h1{font-size:2.5rem} .jp,#howTo{display:none} .card p{margin:.35rem 0} .go{padding:.75rem 2rem;margin:.35rem 0 .2rem}
}
@media (prefers-reduced-motion: reduce){
  .pop,.card{animation-duration:.01s}
  .pop{animation:none}
}

<body>
<main id="app">
  <canvas id="cv" role="application" aria-label="Razis Blocks playfield. Keys: left and right arrows move, up rotates, Z rotates back, down soft drops, space hard drops, C holds, P pauses. On touch: drag to move, tap to rotate, flick down to drop, swipe up to hold."></canvas>
  <div id="ui">
    <header id="hud" class="col">
      <div class="box" id="holdBox" aria-hidden="true"><span class="lbl">HOLD</span></div>
      <div id="scoreCol">
        <output id="score" aria-label="Score">0</output>
        <div id="sub">LV <b id="lv">1</b> · <b id="ln">0</b> LINES</div>
      </div>
      <div class="box" id="nextBox" aria-hidden="true"><span class="lbl">NEXT</span></div>
      <div id="nextMini" aria-hidden="true"><div class="box" id="n2"></div><div class="box" id="n3"></div></div>
    </header>
    <section id="stage" aria-label="Well. Drag to move, tap to rotate, flick down to drop, swipe up to hold."></section>
    <footer id="bar" class="col">
      <button type="button" class="b" id="bPause" aria-label="Pause"><span class="ic" aria-hidden="true">❚❚</span></button>
      <button type="button" class="b grow" id="bHold"><span class="ic" aria-hidden="true">⇅</span>HOLD</button>
    </footer>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <p id="hint" class="off" aria-hidden="true"></p>
  <p id="live" class="sr" aria-live="polite"></p>

  <section class="ov" id="title" role="dialog" aria-modal="true" aria-labelledby="ttl">
    <div class="card">
      <h1 id="ttl">RAZIS<span>BLOCKS</span></h1>
      <p class="jp" aria-hidden="true">ラジス・ブロック</p>
      <p><strong>A cyberpunk falling-block puzzle.</strong> Fill rows to clear them before the stack hits the sky.</p>
      <p id="howTo">Drag to move · tap to rotate · flick down to drop · swipe up to hold</p>
      <button type="button" class="go" id="play">PLAY</button>
      <p id="bestT">BEST 0</p>
      <p class="credit">idea by Flax</p>
    </div>
  </section>

  <section class="ov" id="pause" role="dialog" aria-modal="true" aria-labelledby="pt" hidden>
    <div class="card">
      <h2 id="pt" style="font:900 2rem/1 var(--disp);margin:.2rem 0 .6rem;letter-spacing:.15em">PAUSED</h2>
      <button type="button" class="go" id="resume">RESUME</button><br>
      <button type="button" class="ghostbtn" id="quit">END RUN</button>
    </div>
  </section>

  <section class="ov" id="over" role="dialog" aria-modal="true" aria-labelledby="ot" hidden>
    <div class="card">
      <h2 id="ot" style="font:900 1.6rem/1 var(--disp);margin:.1rem 0;letter-spacing:.12em;color:var(--mag);text-shadow:0 0 1rem rgba(255,43,214,.8)">GRID OVERLOAD</h2>
      <p class="big" id="oScore">0</p>
      <p class="newbest" id="oBest"></p>
      <div class="stats">
        <div>LINES<b id="oLines">0</b></div><div>LEVEL<b id="oLevel">1</b></div>
        <div>BEST COMBO<b id="oCombo">0</b></div><div>BEST SCORE<b id="oHi">0</b></div>
      </div>
      <button type="button" class="go" id="again">AGAIN</button>
    </div>
  </section>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const COLS=10, ROWS=22, HID=2, LOCK=0.5, DAS=0.16, ARR=0.045;
const RMQ=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=RMQ.matches; if(RMQ.addEventListener) RMQ.addEventListener('change',e=>{reduced=e.matches;});
const coarse=matchMedia('(pointer: coarse)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- seeded rng (game logic only) ---------- */
let seed=(Date.now()^0x9e3779b9)>>>0;
function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

/* ---------- pieces (SRS) ---------- */
const BASE=[[4,[[0,1],[1,1],[2,1],[3,1]]],[3,[[0,0],[0,1],[1,1],[2,1]]],[3,[[2,0],[0,1],[1,1],[2,1]]],[2,[[0,0],[1,0],[0,1],[1,1]]],
  [3,[[1,0],[2,0],[0,1],[1,1]]],[3,[[1,0],[0,1],[1,1],[2,1]]],[3,[[0,0],[1,0],[1,1],[2,1]]],[1,[[0,0]]]];
const SH=BASE.map(([n,c])=>{const r=[c];for(let k=1;k<4;k++)r.push(r[k-1].map(([x,y])=>[n-1-y,x]));return r;});
const SIZE=BASE.map(b=>b[0]);
// colour index = type+1 ; 8 = prism
const COL=['#000','#19f3ff','#3f7dff','#ff9a1f','#f2ff2e','#38ff8e','#ff2bd6','#ff3b5c','#ffffff'];
const KJ={'01':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'10':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'12':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'21':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '23':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'32':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'30':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'03':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
const KI={'01':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'10':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'12':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'21':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '23':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'32':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'30':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'03':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};

/* ---------- state ---------- */
const G={board:new Uint8Array(COLS*ROWS),flag:new Uint8Array(COLS*ROWS),phase:'title',paused:false,cur:null,hold:null,holdUsed:false,
  queue:[],bag:[],score:0,shown:0,lines:0,level:1,combo:0,maxCombo:0,b2b:false,fallT:0,lockT:0,lockMoves:0,lowY:0,soft:false,
  anim:null,cleared:false,pieces:0,overT:0,best:+store.get('razis-best',0)||0};
const K={dir:0,das:0,held:{L:false,R:false}};

function fits(t,r,x,y){
  const c=SH[t][r];
  for(let i=0;i<c.length;i++){const cx=x+c[i][0],cy=y+c[i][1];
    if(cx<0||cx>=COLS||cy>=ROWS)return false;
    if(cy>=0&&G.board[cy*COLS+cx])return false;}
  return true;
}
function refill(){while(G.queue.length<5){if(!G.bag.length){G.bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=Math.floor(rnd()*(i+1));[G.bag[i],G.bag[j]]=[G.bag[j],G.bag[i]];}}
  G.queue.push({t:G.bag.pop(),rb:false,ch:-1});}}
function spawn(e){
  const t=e.t, p={t,r:0,x:t===3?4:(t===7?4:3),y:0,rb:!!e.rb,ch:e.ch==null?-1:e.ch};
  if(!fits(t,0,p.x,p.y)){G.cur=p;gameOver();return;}
  if(fits(t,0,p.x,p.y+1))p.y++;
  G.cur=p;G.fallT=0;G.lockT=0;G.lockMoves=0;G.lowY=p.y;G.phase='fall';
}
function spawnNext(){refill();spawn(G.queue.shift());refill();}

function grounded(){const p=G.cur;return !fits(p.t,p.r,p.x,p.y+1);}
function touchLock(){if(grounded()&&G.lockMoves<15){G.lockT=0;G.lockMoves++;}}
function move(dx){
  const p=G.cur;if(!p||G.phase!=='fall')return false;
  if(fits(p.t,p.r,p.x+dx,p.y)){p.x+=dx;touchLock();fxMove();return true;}
  return false;
}
function rotate(dir){
  const p=G.cur;if(!p||G.phase!=='fall'||p.t===3||p.t===7)return false;
  const nr=(p.r+dir+4)%4, tab=(p.t===0?KI:KJ)[''+p.r+nr];
  for(const [kx,ky] of tab){if(fits(p.t,nr,p.x+kx,p.y-ky)){p.x+=kx;p.y-=ky;p.r=nr;touchLock();fxRotate();return true;}}
  return false;
}
function softStep(){
  const p=G.cur;if(!p||G.phase!=='fall')return false;
  if(fits(p.t,p.r,p.x,p.y+1)){p.y++;G.fallT=0;addScore(1);if(p.y>G.lowY){G.lowY=p.y;G.lockMoves=0;G.lockT=0;}return true;}
  return false;
}
function hardDrop(){
  const p=G.cur;if(!p||G.phase!=='fall')return;
  const y0=p.y;while(fits(p.t,p.r,p.x,p.y+1))p.y++;
  addScore(2*(p.y-y0));fxHardDrop(p,y0);lock();
}
function doHold(){
  const p=G.cur;if(!p||G.phase!=='fall'||G.holdUsed)return;
  const e={t:p.t,rb:p.rb,ch:p.ch};G.holdUsed=true;
  if(G.hold){const h=G.hold;G.hold=e;spawn(h);}else{G.hold=e;spawnNext();}
  fxHold();
}
function lock(){
  const p=G.cur,c=SH[p.t][p.r],col=p.rb?8:p.t+1;let above=true;const cells=[];
  for(let i=0;i<c.length;i++){const cx=p.x+c[i][0],cy=p.y+c[i][1];if(cy>=HID)above=false;
    if(cy>=0){G.board[cy*COLS+cx]=col;G.flag[cy*COLS+cx]=(i===p.ch)?1:0;cells.push([cx,cy]);}}
  G.cur=null;G.holdUsed=false;G.pieces++;
  if(above){gameOver();return;}
  fxLock(cells,col);
  G.cleared=false;resolve();
}
function fullRows(){const r=[];for(let y=0;y<ROWS;y++){let f=true;for(let x=0;x<COLS;x++)if(!G.board[y*COLS+x]){f=false;break;}if(f)r.push(y);}return r;}
function resolve(){
  const rows=fullRows();
  if(rows.length){G.phase='fx';G.anim={k:'clear',rows,t:0,dur:.3};scoreClear(rows.length);fxClear(rows);return;}
  if(!G.cleared)G.combo=0;
  spawnNext();
}
function removeRows(rows){
  for(const ry of rows){for(let y=ry;y>0;y--)for(let x=0;x<COLS;x++){G.board[y*COLS+x]=G.board[(y-1)*COLS+x];G.flag[y*COLS+x]=G.flag[(y-1)*COLS+x];}
    for(let x=0;x<COLS;x++){G.board[x]=0;G.flag[x]=0;}}
}
const NAMES=['','CLEAN','DOUBLE','TRIPLE','RAZIS!'];
function scoreClear(n){
  if(!G.cleared){G.cleared=true;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);}
  let pts=[0,100,300,500,800][Math.min(n,4)]*G.level;
  const b2b=n>=4&&G.b2b;if(n>=4){if(b2b)pts*=1.5;G.b2b=true;}else G.b2b=false;
  const mult=1+0.5*(G.combo-1);pts=Math.round(pts*mult);
  addScore(pts);
  const lv=G.level;G.lines+=n;G.level=Math.floor(G.lines/10)+1;
  callout(NAMES[Math.min(n,4)],false);
  if(b2b)callout('BACK-TO-BACK',true);
  if(G.combo>1)callout('COMBO '+G.combo+' · ×'+mult,true);
  if(G.level>lv){callout('LEVEL '+G.level,true);say('Level '+G.level);}
}
function addScore(n){G.score+=n;}
function gravityInt(){return Math.max(0.04,0.85*Math.pow(0.82,G.level-1));}

function newGame(){
  G.board.fill(0);G.flag.fill(0);G.queue=[];G.bag=[];G.hold=null;G.holdUsed=false;G.score=0;G.shown=0;G.lines=0;G.level=1;
  G.combo=0;G.maxCombo=0;G.b2b=false;G.pieces=0;G.anim=null;G.overT=0;G.paused=false;
  refill();spawnNext();showOv(null);hud(true);showHint();
}
function gameOver(){
  G.phase='over';G.overT=0;G.anim=null;K.dir=0;G.soft=false;
  const nb=G.score>G.best;if(nb){G.best=G.score;store.set('razis-best',G.best);}
  $('#oScore').textContent=G.score.toLocaleString('en');$('#oBest').textContent=nb&&G.score>0?'NEW BEST':'';
  $('#oLines').textContent=G.lines;$('#oLevel').textContent=G.level;$('#oCombo').textContent=G.maxCombo;$('#oHi').textContent=G.best.toLocaleString('en');
  fxOver();say('Grid overload. Score '+G.score);
  setTimeout(()=>{if(G.phase==='over')showOv('over');},900);
}

/* ---------- update ---------- */
function update(dt){
  if(G.paused)return;
  if(G.phase==='fall')updFall(dt);
  else if(G.phase==='fx')updFx(dt);
  else if(G.phase==='over')G.overT+=dt;
}

  if(G.phase==='over'&&(e.code==='Enter'||e.code==='Space'||e.code==='KeyR')&&!$('#over').hidden){e.preventDefault();start();return;}

const stage=$('#stage');let P=null;

  P={id:e.pointerId,x0:e.clientX,y0:e.clientY,ax:e.clientX,ay:e.clientY,t0:t,axis:null,h:[[t,e.clientX,e.clientY]]};

    while(x-P.ax>=s&&n++<10){act('R');P.ax+=s;} while(P.ax-x>=s&&n++<10){act('L');P.ax-=s;}}

function endP(e,cancel){
  if(!P||e.pointerId!==P.id)return;

  if(!cancel){
    const dx=x-P.x0,dy=y-P.y0,dist=Math.hypot(dx,dy),dur=t-P.t0;

/* ---------- render ---------- */
const RAIN=[];for(let i=0;i<130;i++)RAIN.push({x:Math.random(),y:Math.random(),l:.5+Math.random()*.8,v:.7+Math.random()*.6});

  const p=G.cur;
  if(p&&(G.phase==='fall'||G.phase==='title')){
    let gy=p.y;while(fits(p.t,p.r,p.x,gy+1))gy++;
    const col=p.rb?8:p.t+1;ctx.strokeStyle=hexA(COL[col],.55);ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    for(const [dx,dy] of SH[p.t][p.r]){const yy=gy+dy;if(yy<HID)continue;ctx.strokeRect(wx+(p.x+dx)*c+2.5,wy+(yy-HID)*c+2.5,c-5,c-5);}
    ctx.setLineDash([]);
    const lk=grounded()?Math.min(1,G.lockT/LOCK):0;
    for(const [dx,dy] of SH[p.t][p.r]){const yy=p.y+dy;if(yy<HID-1)continue;const px=wx+(p.x+dx)*c,py=wy+(yy-HID)*c;
      ctx.drawImage(SPR[col],px-P2,py-P2,S2,S2);
      if(lk>0){ctx.fillStyle='rgba(255,255,255,'+(lk*.35)+')';ctx.fillRect(px+2,py+2,c-4,c-4);}}
  }
  ctx.restore();
  // particles
  ctx.globalCompositeOperation='lighter';
  for(const q of PART){if(!q.on)continue;q.l-=dt;if(q.l<=0){q.on=false;continue;}q.vy+=500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    ctx.globalAlpha=Math.min(1,q.l/q.m*1.5);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // previews
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.phase!=='title'){drawMini(G.hold,L.hold);drawMini(G.queue[0],L.n1);drawMini(G.queue[1],L.n2);drawMini(G.queue[2],L.n3);}
  // flash & glitch
  if(flash>0){ctx.fillStyle='rgba(255,43,214,'+flash*.35+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.5);}
  if(glitch>0){glitch-=dt;
    ctx.setTransform(1,0,0,1,0,0);
    for(let i=0;i<6;i++){const y=Math.random()*cv.height,h=(4+Math.random()*24)*DPR,dx=(Math.random()*2-1)*24*DPR;
      ctx.drawImage(cv,0,y,cv.width,h,dx,y,cv.width,h);}
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.22;
    ctx.fillStyle='#19f3ff';ctx.fillRect(0,Math.random()*cv.height,cv.width,8*DPR);
    ctx.fillStyle='#ff2bd6';ctx.fillRect(0,Math.random()*cv.height,cv.width,14*DPR);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
}

/* ---------- HUD ---------- */
const scoreEl=$('#score'),lvEl=$('#lv'),lnEl=$('#ln');let lastS=-1,lastLv=-1,lastLn=-1;
function hud(force,dt){
  if(force)G.shown=G.score;else G.shown+=(G.score-G.shown)*Math.min(1,(dt||0)*12);
  const s=Math.abs(G.score-G.shown)<1?G.score:Math.round(G.shown);
  if(s!==lastS||force){scoreEl.textContent=s.toLocaleString('en');lastS=s;}
  if(G.level!==lastLv||force){lvEl.textContent=G.level;lastLv=G.level;}
  if(G.lines!==lastLn||force){lnEl.textContent=G.lines;lastLn=G.lines;}
}

/* ---------- title demo stack ---------- */
function demo(){
  const rows=['..........','..........','....6.....','...666..1.','2..33...1.','22233.4.1.','5527744.1.','55277744..','7755.6611.','77.5666113'];
  G.board.fill(0);rows.forEach((r,i)=>{const y=ROWS-rows.length+i;[...r].forEach((ch,x)=>{if(ch!=='.')G.board[y*COLS+x]=+ch;});});
  G.cur={t:5,r:1,x:4,y:8,rb:false,ch:-1};
}

/* ---------- loop ---------- */
const STEP=1/60;let acc=0,last=performance.now();
function frame(now){
  const real=Math.min((now-last)/1000,.25);last=now;acc+=real;
  let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++;}if(n>=8)acc=0;
  if(hintT>0){hintT-=real;if(hintT<=0)hintEl.classList.add('off');}
  hud(false,real);render(real);
  requestAnimationFrame(frame);
}
$('#bestT').textContent='BEST '+G.best.toLocaleString('en');
if(!coarse)$('#howTo').innerHTML='←/→ move · ↑ rotate · ↓ soft drop · Space hard drop · C hold · P pause';
addEventListener('resize',()=>{layout();});
demo();layout();showOv('title');
/*@@HOOK@@*/
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('15px DotGothic16','ラジス').then(()=>{if(G.phase==='title')layout();else buildBg();}).catch(()=>{});}
})();
</script>
