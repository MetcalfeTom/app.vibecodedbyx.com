<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honeycomb Drift</title>
<meta name="description" content="Float inside endless 3D honeycombs: rooms of glass that repeat forever, from Kelvin's foam to the bubbles of the Water Cube.">
<link rel="icon" href="https://emojicdn.elk.sh/💠">
<meta property="og:type" content="website">
<meta property="og:title" content="Honeycomb Drift">
<meta property="og:description" content="Float inside endless 3D honeycombs: rooms of glass that repeat forever.">
<meta property="og:url" content="https://app.sloppy.live/honeycomb-drift/">
<meta property="og:image" content="https://app.sloppy.live/honeycomb-drift/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Azeret+Mono:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060c; --ink:#f3ecdf; --mute:#9a95a8; --line:rgba(243,236,223,.16);
  --acc:#ffb347; --glass:rgba(10,11,22,.62);
  --disp:'Gloock', 'Times New Roman', serif; --mono:'Azeret Mono', ui-monospace, monospace;
}
*{ box-sizing:border-box; }
html, body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
body{ font-family:var(--mono); font-weight:300; -webkit-tap-highlight-color:transparent; }
canvas#gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; cursor:grab; }
canvas#gl.drag{ cursor:grabbing; }
.vig{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55)); }
.brand{ position:fixed; left:max(16px, env(safe-area-inset-left)); top:calc(52px + env(safe-area-inset-top, 0px)); margin:0;
  font:400 .72rem/1 var(--mono); letter-spacing:.32em; text-transform:uppercase; color:var(--mute); pointer-events:none; }
.brand b{ font-weight:600; color:var(--ink); }
.room{ position:fixed; right:max(16px, env(safe-area-inset-right)); top:calc(52px + env(safe-area-inset-top, 0px)); margin:0; text-align:right;
  font:300 .66rem/1.3 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--mute); pointer-events:none; }
.room b{ display:block; font:400 2.2rem/1 var(--disp); letter-spacing:0; color:var(--ink); font-variant-numeric:tabular-nums; }

.plac{ position:fixed; left:max(16px, env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  width:min(26rem, calc(100vw - 32px)); padding:.9rem 1rem .85rem; border:1px solid var(--line); border-radius:2px;
  background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.prow{ display:flex; align-items:center; gap:.6rem; }
.prow .nm{ flex:1; min-width:0; }
.plac h1{ margin:0; font:400 clamp(1.5rem, 5.4vw, 2.1rem)/1.02 var(--disp); letter-spacing:-.01em; }
.cell{ margin:.35rem 0 0; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.cell i{ font-style:normal; color:var(--acc); }
.fact{ margin:.7rem 0 0; font-size:.74rem; line-height:1.55; color:#d6cfc2; max-height:12rem; overflow:hidden; transition:max-height .5s ease, opacity .5s ease, margin .5s ease; }
.fact.gone{ max-height:0; opacity:0; margin:0; }
.btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--ink); font:600 .7rem/1 var(--mono);
  letter-spacing:.14em; text-transform:uppercase; min-width:44px; min-height:44px; padding:0 .8rem; border-radius:2px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem; }
.btn:hover{ border-color:rgba(243,236,223,.45); }
.btn:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
.btn.arr{ font:400 1.6rem/1 var(--disp); padding:0; width:44px; }
.btn[aria-pressed="true"]{ background:var(--acc); color:#120d05; border-color:transparent; }
.tools{ display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; }
.dots{ display:flex; gap:.35rem; align-items:center; margin-left:auto; }
.dots span{ width:6px; height:6px; border-radius:50%; background:rgba(243,236,223,.22); }
.dots span.on{ background:var(--acc); }
.fly{ position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:5.2rem; height:5.2rem;
  border-radius:50%; font-size:.62rem; touch-action:none; user-select:none; -webkit-user-select:none; background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.fly.on{ background:var(--acc); color:#120d05; }
.hint{ position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); margin:0; padding:.6rem .9rem; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink); background:rgba(5,6,12,.55); border:1px solid var(--line); pointer-events:none; text-align:center; line-height:1.7; transition:opacity .8s ease; white-space:nowrap; }
.hint.gone{ opacity:0; }
.err{ position:fixed; inset:0; display:grid; place-items:center; padding:2rem; text-align:center; font:400 1.4rem/1.4 var(--disp); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (max-width:560px){
  .plac{ width:calc(100vw - 32px - 6rem); padding:.7rem .75rem; }
  .fact{ font-size:.68rem; }
  .hint{ white-space:normal; width:min(18rem, 80vw); }
  .room b{ font-size:1.7rem; }
}
@media (hover:hover) and (pointer:fine){ .fly{ display:none; } .plac{ width:min(26rem, calc(100vw - 32px)); } }
@media (prefers-reduced-motion: reduce){ .fact, .hint{ transition:none; } }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="Inside a 3D honeycomb"></canvas>
<div class="vig"></div>
<p class="brand"><b>Honeycomb</b> Drift</p>
<p class="room" aria-hidden="true">rooms crossed<b id="rooms">0</b></p>
<section class="plac" aria-label="Honeycomb">
  <div class="prow">
    <button type="button" class="btn arr" id="prev" aria-label="Previous honeycomb">‹</button>
    <div class="nm"><h1 id="name" aria-live="polite">Kelvin foam</h1><p class="cell" id="cell"></p></div>
    <button type="button" class="btn arr" id="next" aria-label="Next honeycomb">›</button>
  </div>
  <p class="fact" id="fact"></p>
  <div class="tools">
    <button type="button" class="btn" id="drift" aria-pressed="true">drift</button>
    <button type="button" class="btn" id="about" aria-expanded="true" aria-controls="fact">about</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
</section>
<button type="button" class="btn fly" id="fly" aria-label="Hold to fly forward">hold<br>to fly</button>
<p class="hint" id="hint">drag to look around<br>W A S D / arrows to fly · space / shift up &amp; down</p>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ── geometry: the Voronoi cell of each site of a periodic point set ── */
const EPS = 1e-7;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const mulA = (f, A) => [0, 1, 2].map(c => f[0] * A[0][c] + f[1] * A[1][c] + f[2] * A[2][c]);
function boxFaces(s) {
  const v = (x, y, z) => [x * s, y * s, z * s];
  return [
    { n: [1, 0, 0], p: [v(1, -1, -1), v(1, 1, -1), v(1, 1, 1), v(1, -1, 1)] },
    { n: [-1, 0, 0], p: [v(-1, -1, -1), v(-1, -1, 1), v(-1, 1, 1), v(-1, 1, -1)] },
    { n: [0, 1, 0], p: [v(-1, 1, -1), v(-1, 1, 1), v(1, 1, 1), v(1, 1, -1)] },
    { n: [0, -1, 0], p: [v(-1, -1, -1), v(1, -1, -1), v(1, -1, 1), v(-1, -1, 1)] },
    { n: [0, 0, 1], p: [v(-1, -1, 1), v(1, -1, 1), v(1, 1, 1), v(-1, 1, 1)] },
    { n: [0, 0, -1], p: [v(-1, -1, -1), v(-1, 1, -1), v(1, 1, -1), v(1, -1, -1)] },
  ];
}
function clip(faces, n, d) {   // keep dot(n, x) <= d
  const out = [], cap = [];
  let cut = false;
  for (const f of faces) {
    const P = f.p, q = [];
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length], da = dot(n, a) - d, db = dot(n, b) - d;
      if (da <= EPS) q.push(a); else cut = true;
      if ((da < -EPS && db > EPS) || (da > EPS && db < -EPS)) {
        const t = da / (da - db), x = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        q.push(x); cap.push(x);
      }
      if (Math.abs(da) <= EPS) cap.push(a);
    }
    if (q.length >= 3) out.push({ n: f.n, p: q });
  }
  if (!cut) return faces;
  const u = [];
  for (const x of cap) if (!u.some(y => Math.abs(y[0] - x[0]) + Math.abs(y[1] - x[1]) + Math.abs(y[2] - x[2]) < 1e-6)) u.push(x);
  if (u.length >= 3) {
    const c = u.reduce((s, x) => [s[0] + x[0] / u.length, s[1] + x[1] / u.length, s[2] + x[2] / u.length], [0, 0, 0]);
    const e1 = nrm(sub(u[0], c)), e2 = cross(n, e1);
    u.sort((a, b) => { const A = sub(a, c), B = sub(b, c); return Math.atan2(dot(A, e2), dot(A, e1)) - Math.atan2(dot(B, e2), dot(B, e1)); });
    out.push({ n, p: u });
  }
  return out;
}
function voronoi(A, sites) {
  const imgs = [];
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) for (let k = -2; k <= 2; k++)
    for (const s of sites) imgs.push(mulA([s[0] + i, s[1] + j, s[2] + k], A));
  return sites.map(s => {
    const c = mulA(s, A);
    const nb = imgs.map(p => sub(p, c)).filter(r => dot(r, r) > 1e-9).sort((a, b) => dot(a, a) - dot(b, b));
    let F = boxFaces(4);
    for (const r of nb) {
      let far = 0; for (const f of F) for (const x of f.p) far = Math.max(far, dot(x, x));
      if (dot(r, r) / 4 > far + 1e-9) break;
      F = clip(F, nrm(r), Math.sqrt(dot(r, r)) / 2);
    }
    return { c, faces: F };
  });
}

/* ── the honeycombs ── */
const S3 = Math.sqrt(3), I3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
const COMBS = [
  { name: 'Kelvin foam', A: I3, sites: [[0, 0, 0], [.5, .5, .5]], cols: ['#ffb347', '#52c8ff'], cells: ['truncated octahedron'],
    fact: 'Lord Kelvin’s 1887 guess for the perfect foam. Every room has 14 walls, 6 squares and 8 hexagons, and four rooms meet at every corner. For a century nobody could beat it.' },
  { name: 'Cubes', A: I3, sites: [[0, 0, 0]], cols: ['#6ff7c8'], cells: ['cube'],
    fact: 'The only perfectly regular honeycomb our 3D space allows: square walls, eight rooms around every corner. Every other regular solid leaves gaps.' },
  { name: 'Rhombic dodecahedra', A: I3, sites: [[0, 0, 0], [.5, .5, 0], [.5, 0, .5], [0, .5, .5]], cols: ['#ff6f91', '#ffd166', '#3fe0cf', '#9d8cff'], cells: ['rhombic dodecahedron'],
    fact: 'Stack oranges the way a grocer does, then let each one swell until the gaps are gone: this is the shape they turn into. Twelve diamond walls. Garnet crystals grow like this.' },
  { name: 'Hexagonal prisms', A: [[1, 0, 0], [.5, 0, S3 / 2], [0, 1.15, 0]], sites: [[0, 0, 0]], cols: ['#ffbe3d'], cells: ['hexagonal prism'],
    fact: 'A beehive, stacked floor on floor. Six tall rectangles and a hexagon above and below you: the honeycomb that gave all the others their name.' },
  { name: 'Elongated dodecahedra', A: [[1, 0, 0], [0, 0, 1], [0, 2, 0]], sites: [[0, 0, 0], [.5, .5, .5]], cols: ['#c49bff', '#b6f36b'], cells: ['elongated dodecahedron'],
    fact: 'A rhombic dodecahedron stretched with a belt of four hexagons round its middle. One of just five shapes that fill all of space by sliding copies, never turning one.' },
  { name: 'Weaire–Phelan foam', A: I3, sites: [[0, 0, 0], [.5, .5, .5], [.25, 0, .5], [.75, 0, .5], [.5, .25, 0], [.5, .75, 0], [0, .5, .25], [0, .5, .75]],
    cols: ['#ffd166', '#ffd166', '#52c8ff', '#52c8ff', '#46e6a8', '#46e6a8', '#a593ff', '#a593ff'],
    cells: ['dodecahedron', 'dodecahedron', 'tetrakaidecahedron', 'tetrakaidecahedron', 'tetrakaidecahedron', 'tetrakaidecahedron', 'tetrakaidecahedron', 'tetrakaidecahedron'],
    fact: '1993: two kinds of bubble, 12 walls and 14 walls, finally beat Kelvin’s foam with 0.3% less wall. Its soap-film cousin, walls gently curved, wraps the Water Cube swimming arena in Beijing.' },
];
for (const C of COMBS) {
  const A = C.A, det = dot(A[0], cross(A[1], A[2]));
  C.vor = voronoi(A, C.sites);
  C.scale = 2.6 / Math.cbrt(Math.abs(det) / C.sites.length);   // every room about 2.6 m across
  C.B = [cross(A[1], A[2]), cross(A[2], A[0]), cross(A[0], A[1])].map(r => r.map(x => x / det));   // reciprocal rows
}

/* ── renderer ── */
const canvas = document.getElementById('gl');
const coarse = matchMedia('(pointer:coarse)').matches;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err">This needs WebGL, and your browser said no.<br>Try another browser?</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x05060c, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.02, 60);
camera.rotation.order = 'YXZ';

const FAR = 9.6;   // the fog swallows everything past here; the block of rooms reaches further
const shared = { uCur: { value: new THREE.Vector3(1e5, 0, 0) }, uFar: { value: FAR }, uFade: { value: 0 }, uW: { value: 0.03 }, uT: { value: 0 } };
const VERT = `
attribute float dEdge;
uniform vec3 uCur;
varying float vD; varying vec3 vW; varying vec3 vN; varying float vCur;
void main(){
#ifdef USE_INSTANCING
  mat4 im = instanceMatrix;
#else
  mat4 im = mat4(1.0);
#endif
  vec4 w = modelMatrix * im * vec4(position, 1.0);
  vec3 c = (modelMatrix * im * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
  vCur = 1.0 - step(0.05, distance(c, uCur));
  vD = dEdge; vW = w.xyz; vN = normalize(mat3(modelMatrix * im) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const FRAG = `
uniform vec3 uCol; uniform float uFar; uniform float uFade; uniform float uW; uniform float uT;
varying float vD; varying vec3 vW; varying vec3 vN; varying float vCur;
void main(){
  float dist = distance(vW, cameraPosition);
  float fog = pow(clamp(1.0 - dist / uFar, 0.0, 1.0), 2.2);
  float px = vD / max(fwidth(vD), 1e-6);
  float core = exp(-(vD * vD) / (uW * uW));
  float glow = 0.16 * exp(-vD / (uW * 4.0));
  float thin = 1.0 - smoothstep(0.4, 1.4, px);
  float line = max(0.8 * core + glow, thin * 0.6);
  vec3 V = normalize(cameraPosition - vW);
  float graze = 1.0 - abs(dot(V, normalize(vN)));
  float fill = 0.006 + 0.035 * graze * graze * graze;
  float here = vCur * (0.5 + 0.12 * sin(uT * 1.7));
  vec3 col = uCol * (line * (1.0 + here * 0.7) + fill * (1.0 + here * 3.0)) + vec3(1.0, 0.97, 0.9) * core * here * 0.2;
  float a = fog * uFade;
  if (a < 0.002) discard;
  gl_FragColor = vec4(col * a, 1.0);
}`;

function cellGeometry(faces, s) {
  const pos = [], nor = [], ed = [];
  for (const f of faces) {
    const P = f.p.map(v => [v[0] * s, v[1] * s, v[2] * s]), m = P.length;
    const c = P.reduce((q, v) => [q[0] + v[0] / m, q[1] + v[1] / m, q[2] + v[2] / m], [0, 0, 0]);
    for (let i = 0; i < m; i++) {
      const a = P[i], b = P[(i + 1) % m], ab = sub(b, a);
      const h = Math.hypot(...cross(ab, sub(c, a))) / Math.hypot(...ab);   // centre-to-edge distance
      pos.push(...c, ...a, ...b); ed.push(h, 0, 0);
      for (let k = 0; k < 3; k++) nor.push(...f.n);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('dEdge', new THREE.Float32BufferAttribute(ed, 1));
  return g;
}

let comb = null, ci = 0, meshes = [];
function buildComb(i) {
  for (const m of meshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  meshes = [];
  ci = (i + COMBS.length) % COMBS.length; comb = COMBS[ci];
  const A = comb.A, s = comb.scale;
  // the block: every translation whose site lands within reach of the central cell
  const half = Math.hypot(...mulA([.5, .5, .5], A)) * s, reach = FAR + 2.6 + half;
  const ctr = mulA([.5, .5, .5], A).map(x => x * s);
  const R = [0, 1, 2].map(k => Math.ceil(reach * Math.hypot(...comb.B[k]) / s) + 1);
  comb.vor.forEach((cell, si) => {
    const offs = [];
    for (let a = -R[0]; a <= R[0]; a++) for (let b = -R[1]; b <= R[1]; b++) for (let c = -R[2]; c <= R[2]; c++) {
      const p = mulA([comb.sites[si][0] + a, comb.sites[si][1] + b, comb.sites[si][2] + c], A).map(x => x * s);
      if (Math.hypot(p[0] - ctr[0], p[1] - ctr[1], p[2] - ctr[2]) < reach) offs.push(p);
    }
    const mat = new THREE.ShaderMaterial({
      uniforms: { uCol: { value: new THREE.Color(comb.cols[si]) }, ...shared },
      vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthWrite: false, depthTest: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    });
    const mesh = new THREE.InstancedMesh(cellGeometry(cell.faces, s), mat, offs.length);
    const M = new THREE.Matrix4();
    offs.forEach((p, k) => { M.makeTranslation(p[0], p[1], p[2]); mesh.setMatrixAt(k, M); });
    mesh.frustumCulled = false;
    scene.add(mesh); meshes.push(mesh);
  });
  shared.uW.value = 0.012 * s * Math.cbrt(Math.abs(dot(A[0], cross(A[1], A[2]))) / comb.sites.length);
  shared.uFade.value = reduced ? 1 : 0;
  // start in the middle of a room, looking at a wall
  camera.position.set(...mulA(comb.sites[0], A).map(x => x * s));
  camera.position.x += 0.12; camera.position.y += 0.08;
  curKey = ''; ui();
}

/* ── moving around ── */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const keys = new Set();
let yaw = 0.6, pitch = 0.18, drift = !reduced, flyHeld = false, lastTouch = -1e9, rooms = 0, curKey = '', curSite = 0, t = 0;
const vel = new THREE.Vector3(), _f = new THREE.Vector3(), _r = new THREE.Vector3(), _w = new THREE.Vector3();
function wrap() {   // slide the camera back into the central cell: the lattice can't tell the difference
  const p = camera.position, s = comb.scale, A = comb.A;
  const f = comb.B.map(b => Math.floor((p.x * b[0] + p.y * b[1] + p.z * b[2]) / s));
  if (f[0] || f[1] || f[2]) { const d = mulA(f, A); p.x -= d[0] * s; p.y -= d[1] * s; p.z -= d[2] * s; return f; }
  return null;
}
function findCell() {   // the room you're in = the nearest site (that's what a Voronoi cell is)
  const p = camera.position, s = comb.scale, A = comb.A;
  let best = 1e9, bp = null, bs = 0, key = '';
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++)
    comb.sites.forEach((st, si) => {
      const q = mulA([st[0] + a, st[1] + b, st[2] + c], A).map(x => x * s);
      const d = (q[0] - p.x) ** 2 + (q[1] - p.y) ** 2 + (q[2] - p.z) ** 2;
      if (d < best) { best = d; bp = q; bs = si; key = si + ':' + a + ',' + b + ',' + c; }
    });
  shared.uCur.value.set(bp[0], bp[1], bp[2]);
  return { key, si: bs };
}
function step(dt) {
  t += dt; shared.uT.value = t;
  if (shared.uFade.value < 1) shared.uFade.value = Math.min(1, shared.uFade.value + dt * 1.6);
  const idle = t - lastTouch > 5;
  if (drift && idle) { yaw += Math.sin(t * 0.13) * 0.11 * dt; pitch += (Math.sin(t * 0.071) * 0.32 - pitch) * 0.25 * dt; }
  camera.rotation.set(pitch, yaw, 0);
  camera.getWorldDirection(_f); _r.crossVectors(_f, camera.up).normalize();
  _w.set(0, 0, 0);
  if (keys.has('KeyW') || keys.has('ArrowUp') || flyHeld) _w.add(_f);
  if (keys.has('KeyS') || keys.has('ArrowDown')) _w.sub(_f);
  if (keys.has('KeyD') || keys.has('ArrowRight')) _w.add(_r);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) _w.sub(_r);
  if (keys.has('Space') || keys.has('KeyE')) _w.y += 1;
  if (keys.has('ShiftLeft') || keys.has('ShiftRight') || keys.has('KeyQ')) _w.y -= 1;
  const manual = _w.lengthSq() > 0;
  if (manual) _w.normalize().multiplyScalar(2.4);
  else if (drift) _w.copy(_f).multiplyScalar(0.55);
  vel.lerp(_w, 1 - Math.exp(-4 * dt));
  camera.position.addScaledVector(vel, dt);
  const sh = wrap();
  if (sh) curKey = shiftKey(curKey, sh);
  const c = findCell();
  if (c.key !== curKey) { if (curKey) rooms++; curKey = c.key; curSite = c.si; ui(); }
}
function shiftKey(k, f) {   // the same room, renamed after a wrap moved the camera back by f cells
  if (!k) return k;
  const [si, r] = k.split(':'), o = r.split(',').map(Number);
  return si + ':' + (o[0] - f[0]) + ',' + (o[1] - f[1]) + ',' + (o[2] - f[2]);
}

/* ── interface ── */
const $ = id => document.getElementById(id);
const dots = $('dots');
COMBS.forEach(() => dots.appendChild(document.createElement('span')));
let factOpen = true, factTimer = 0;
function ui() {
  const name = comb.cells[curSite] || comb.cells[0], walls = comb.vor[curSite].faces.length;
  $('name').textContent = comb.name;
  $('cell').innerHTML = 'inside a <i>' + name + '</i> · ' + walls + ' walls';
  $('rooms').textContent = rooms;
  document.documentElement.style.setProperty('--acc', comb.cols[curSite]);
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === ci));
  canvas.setAttribute('aria-label', 'Inside a 3D honeycomb of ' + comb.name.toLowerCase() + ', in a ' + name + ' with ' + walls + ' walls');
}
function setFact(open) {
  factOpen = open; $('fact').classList.toggle('gone', !open); $('about').setAttribute('aria-expanded', open ? 'true' : 'false');
}
function go(i) {
  buildComb(i); $('fact').textContent = comb.fact; setFact(true);
  clearTimeout(factTimer); factTimer = setTimeout(() => setFact(false), 14000);
}
$('prev').onclick = () => go(ci - 1);
$('next').onclick = () => go(ci + 1);
$('about').onclick = () => setFact(!factOpen);
$('drift').onclick = function () { drift = !drift; this.setAttribute('aria-pressed', drift ? 'true' : 'false'); };
$('drift').setAttribute('aria-pressed', drift ? 'true' : 'false');

let hintGone = false;
function hideHint() { if (!hintGone) { hintGone = true; $('hint').classList.add('gone'); } }
setTimeout(hideHint, 7000);
if (coarse) $('hint').innerHTML = 'drag to look around<br>hold the button to fly';

let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag');
  lastTouch = t; hideHint();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = 2.6 / Math.max(innerHeight, 400);
  yaw -= (e.clientX - drag.x) * k; pitch -= (e.clientY - drag.y) * k;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
  drag.x = e.clientX; drag.y = e.clientY; lastTouch = t;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('drag'); } };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
const fly = $('fly');
fly.addEventListener('pointerdown', e => { e.preventDefault(); flyHeld = true; fly.classList.add('on'); fly.setPointerCapture(e.pointerId); hideHint(); lastTouch = t; });
const flyOff = () => { flyHeld = false; fly.classList.remove('on'); };
fly.addEventListener('pointerup', flyOff); fly.addEventListener('pointercancel', flyOff); fly.addEventListener('lostpointercapture', flyOff);
fly.addEventListener('contextmenu', e => e.preventDefault());
const MOVE = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyE', 'KeyQ', 'ShiftLeft', 'ShiftRight'];
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  if (MOVE.includes(e.code)) { keys.add(e.code); lastTouch = t; hideHint(); e.preventDefault(); }
  else if (e.code === 'BracketRight' || e.code === 'KeyN') go(ci + 1);
  else if (e.code === 'BracketLeft' || e.code === 'KeyP') go(ci - 1);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); flyOff(); });
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 88 : 75; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
}
addEventListener('resize', resize); resize();

go(0);
let last = performance.now(), frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); renderer.render(scene, camera); frames++;
});
window.__HC = { COMBS, go, step, get comb() { return comb; }, get rooms() { return rooms; }, camera, renderer,
  render() { renderer.render(scene, camera); }, info: () => renderer.info.render, get frames() { return frames; },
  look(y, p) { yaw = y; pitch = p; }, setDrift(v) { drift = v; } };
</script>
</body>
