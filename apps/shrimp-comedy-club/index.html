<style>
:root{
  --night:#160e12; --brick:#3a2028; --brick2:#2c1820; --mortar:#241318;
  --spot:#ffd9a0; --cream:#f2e8d8; --dim:#a08a94; --shrimp:#ff7757; --tie:#0A66C2;
  --good:#7fce6a; --bad:#e85a5a; --edge:#4a2c38;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html,body{height:100%}
body{
  background:var(--night); color:var(--cream); font-family:'IBM Plex Mono',monospace; overflow:hidden;

}

<body>
<header>
  <h1>The Shrimp Comedy Club</h1>
  <p class="tag">terrible jokes nightly · two-drink minimum · the boos are load-bearing</p>
</header>
<canvas id="club" role="img" aria-label="A comedy club stage. A shrimp in a blue tie tells jokes at a microphone while three frogs, a lava lamp on a stool, and a small grumpy dinosaur react from the front row."></canvas>
<div class="deck">
  <button type="button" class="mic" id="nextBtn">🎤 NEXT JOKE</button>
  <button type="button" id="autoBtn" aria-pressed="false">▶ auto set</button>
  <button type="button" id="clapBtn" aria-label="Applaud the shrimp">👏 clap</button>
  <button type="button" id="tomatoBtn" aria-label="Throw a tomato">🍅 tomato</button>
  <button type="button" id="sndBtn" aria-pressed="false">🔇 sound</button>
  <span class="conf">confidence <span class="confbar"><i id="confFill"></i></span></span>
</div>
<div class="sr-only" role="status" aria-live="polite" id="sr"></div>

<script>
'use strict';
/* ============================ [PURE-BEGIN] ============================ */
/* All jokes original — written for this club, quality ratings honest. */
var JOKES=[
  { s:"I told my therapist everyone's watching me.", p:"She said that's just the posture clinic. They ARE.", q:'meh' },
  { s:"I used to work in finance.", p:"Now I'm just shellfish about my assets.", q:'groan' },
  { s:"My doctor says I have terrible posture.", p:"It's not a curl. It's a personal brand.", q:'good' },
  { s:"Why did the burrito plead the fifth?", p:"Insider filling.", q:'good' },
  { s:"I asked the pond for honest feedback.", p:"It said I'm 40% runoff. That's not a joke, that's the audit.", q:'meh' },
  { s:"I bought a standing desk.", p:"I'm still a shrimp. It did nothing.", q:'groan' },
  { s:"People compliment my Windsor knot.", p:"The knot gets the compliments. I get the LinkedIn requests.", q:'meh' },
  { s:"I got endorsed for Slouching on Clinked·in.", p:"By my own chiropractor.", q:'good' },
  { s:"The beach rat asked me for a loan.", p:"I said no. He said 'taking it anyway.' His skills section checks out.", q:'good' },
  { s:"I tried yoga once.", p:"Instructor said 'curl into child's pose.' Way ahead of you. Since birth.", q:'good' },
  { s:"What's a shrimp's favorite meeting?", p:"A stand-up. Attendance optional. Obviously.", q:'groan' },
  { s:"I don't do arm day.", p:"Neither does the dino in the front row. Solidarity.", q:'meh', target:'dino' },
  { s:"The lava lamp and I have a lot in common.", p:"We're both hot messes on a slow cycle.", q:'meh', target:'lamp' },
  { s:"I auditioned for a cooking show.", p:"They said I'd get eaten alive. Yes. That's the format.", q:'good' },
  { s:"My landlord raised my rent.", p:"I live in a tide pool. My landlord is the moon.", q:'good' },
  { s:"I saw the doctor about my shell.", p:"He said it's just a phase. It's MOLTING SEASON, Gerald.", q:'groan', target:'frogs' },
  { s:"Why don't shrimp share their feelings?", p:"We keep everything bottled up. In a lamp. On a stool. Hi, Lars.", q:'meh', target:'lamp' },
  { s:"I wrote all these jokes myself.", p:"You can tell. No one else would take credit.", q:'good' }
];
function makePicker(n, rnd){
  var deck=[];
  return function(){
    if(deck.length===0){
      for(var i=0;i<n;i++) deck.push(i);
      for(var j=deck.length-1;j>0;j--){
        var k=Math.floor(rnd()*(j+1)); var t=deck[j]; deck[j]=deck[k]; deck[k]=t;
      }
    }
    return deck.pop();
  };
}
function confDelta(q){ return q==='good'?10 : q==='meh'?2 : -8; }
function clampConf(c){ return Math.max(0, Math.min(100, c)); }
function postureFor(conf){
  // 0 = full shrimp-curl of despair · 1 = suspiciously aligned
  return clampConf(conf)/100;
}
/* ============================ [PURE-END] ============================ */

var HECKLES={
  groan:{
    dino:["I survived a meteor for THIS?","Boo. My arms are tiny, so this boo is load-bearing.","Put the mic down. Slowly."],
    frogs:["ribbit.","...","*flat croak*"],
    label:'the room goes cold'
  },
  meh:{
    dino:["...heh. No. Wait. Boo.","I've heard worse. From the meteor.","Almost. Like my reach."],
    frogs:["ribbit?","*one polite croak*","hm."],
    label:'scattered croaks'
  },
  good:{
    dino:["OK that one lands. *tries to clap* ...solidarity.","Fine. FINE. That was decent.","*arms wiggle furiously* this is applause."],
    frogs:["RIBBIT!!","*standing croakvation*","REE-BIT!"],
    label:'genuine laughter?!'
  }
};
var SPECIAL={
  dino:"HEY. My arms are a lifestyle.",
  lamp:"*the lamp bubbles indignantly*",
  frogs:"GERALD IS A PRIVATE FROG."
};

var $=function(id){ return document.getElementById(id); };
var canvas=$('club'), ctx=canvas.getContext('2d');
var DPR=Math.min(2, window.devicePixelRatio||1);
function fit(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*DPR; canvas.height=r.height*DPR; }
addEventListener('resize', fit);
function W(){ return canvas.width/DPR; } function H(){ return canvas.height/DPR; }

var S={
  phase:'idle',            // idle | setup | beat | punch | react
  joke:null, typed:'', typeT:0, phaseT:0,
  conf:50, auto:false, tomatoes:[], claps:[],
  heckle:null, heckleFrom:null, reactTier:null,
  lampHeat:0, lampBlobs:[], frogBounce:[0,0,0], dinoArms:0, sway:0,
  jokesTold:0
};
for(var lb=0; lb<4; lb++) S.lampBlobs.push({ y:0.7-lb*0.15, v:0.02+Math.random()*0.02, r:3+Math.random()*2 });
var pick=makePicker(JOKES.length, Math.random);

/* ---------- audio (all synthesized) ---------- */
var AC=null, soundOn=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(type,f0,f1,dur,vol,delay){
  if(!soundOn) return; var c=ac(); if(!c) return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function nz(dur,f,vol,delay){
  if(!soundOn) return; var c=ac(); if(!c) return;
  var t=c.currentTime+(delay||0), len=Math.ceil(c.sampleRate*dur);
  var b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  var s2=c.createBufferSource(); s2.buffer=b;
  var f2=c.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=f;
  var g=c.createGain(); g.gain.value=vol;
  s2.connect(f2); f2.connect(g); g.connect(c.destination); s2.start(t);
}
function rimshot(){
  tone('sine',180,60,0.12,0.4);              // ba
  tone('sine',160,55,0.12,0.4,0.14);         // dum
  nz(0.35,4200,0.22,0.28);                   // tss
}
function croakSnd(pitch,delay){
  if(!soundOn) return; var c=ac(); if(!c) return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(pitch,t); o.frequency.exponentialRampToValueAtTime(pitch*0.7,t+0.18);
  var am=c.createOscillator(); am.type='square'; am.frequency.value=22;
  var amg=c.createGain(); amg.gain.value=0.5;
  am.connect(amg);
  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.16,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  amg.connect(g.gain);
  var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=520; f.Q.value=3;
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+0.25); am.start(t); am.stop(t+0.25);
}
function booSnd(){ tone('sawtooth',220,110,0.7,0.14); tone('sawtooth',180,90,0.8,0.12,0.1); }
function laughSnd(){
  for(var i=0;i<6;i++) tone('sawtooth',300+Math.random()*120,240,0.09,0.1,i*0.09);
  for(var j=0;j<12;j++) nz(0.05,2400+Math.random()*2000,0.05,0.2+Math.random()*0.6);
}

/* ---------- flow ---------- */
function nextJoke(){
  if(S.phase!=='idle' && S.phase!=='react') return;
  S.joke=JOKES[pick()];
  S.phase='setup'; S.typed=''; S.typeT=0; S.phaseT=0;
  S.heckle=null; S.reactTier=null;
  $('sr').textContent='Setup: '+S.joke.s;
}
function punchlineLands(){
  var q=S.joke.q;
  S.reactTier=q;
  S.conf=clampConf(S.conf+confDelta(q));
  S.jokesTold++;
  rimshot();
  var H2=HECKLES[q];
  var from=S.joke.target||( ['dino','frogs'][Math.floor(Math.random()*2)] );
  S.heckleFrom=from==='lamp'?'dino':from;
  if(S.joke.target && SPECIAL[S.joke.target] && Math.random()<0.6){
    S.heckle=SPECIAL[S.joke.target];
  } else {
    var pool=H2[S.heckleFrom==='frogs'?'frogs':'dino'];
    S.heckle=pool[Math.floor(Math.random()*pool.length)];
  }
  setTimeout(function(){
    if(q==='good'){ laughSnd(); S.lampHeat=1; S.frogBounce=[1,1,1]; S.dinoArms=1; }
    else if(q==='meh'){ croakSnd(140,0); S.lampHeat=0.35; S.frogBounce=[0,0.6,0]; }
    else { booSnd(); croakSnd(90,0.3); S.lampHeat=0; S.dinoArms=0.4; }
    for(var i=0;i<3;i++) croakSnd(110+i*30, 0.2+i*0.15*(q==='good'?1:2));
  }, 500);
  updConf();
  $('sr').textContent='Punchline: '+S.joke.p+' — '+HECKLES[q].label;
}
function updConf(){ $('confFill').style.width=S.conf+'%'; }
function throwTomato(){
  S.conf=clampConf(S.conf-6); updConf();
  S.tomatoes.push({ x:W()*(0.2+Math.random()*0.15), y:H()*0.9, vx:60+Math.random()*40, vy:-260-Math.random()*60, t:0, splat:0 });
  nz(0.08,700,0.2);
  $('sr').textContent='Tomato thrown. Confidence '+S.conf+'.';
}
function clap(){
  S.conf=clampConf(S.conf+6); updConf();
  for(var i=0;i<5;i++) nz(0.04,2200+Math.random()*1600,0.09,i*0.07);
  S.claps.push({ t:0 });
  $('sr').textContent='Applause! Confidence '+S.conf+'.';
}

/* ---------- state machine ---------- */
function step(dt){
  S.sway+=dt;
  S.phaseT+=dt;
  if(S.phase==='setup'||S.phase==='punch'){
    var text=S.phase==='setup'?S.joke.s:S.joke.p;
    S.typeT+=dt;
    var chars=Math.floor(S.typeT/0.035);
    S.typed=text.slice(0,chars);
    if(chars>=text.length && S.phaseT>text.length*0.035+0.4){
      if(S.phase==='setup'){ S.phase='beat'; S.phaseT=0; }
      else { S.phase='react'; S.phaseT=0; punchlineLands(); }
    }
  }
  else if(S.phase==='beat'){
    if(S.phaseT>0.9){ S.phase='punch'; S.phaseT=0; S.typed=''; S.typeT=0; }
  }
  else if(S.phase==='react'){
    if(S.phaseT>3.2){
      S.phase='idle'; S.typed=''; S.heckle=null;
      if(S.auto) nextJoke();
    }
  }
  // decay + physics
  S.lampHeat=Math.max(0, S.lampHeat-dt*0.25);
  for(var i2=0;i2<3;i2++) S.frogBounce[i2]=Math.max(0,S.frogBounce[i2]-dt*0.8);
  S.dinoArms=Math.max(0,S.dinoArms-dt*0.5);
  S.lampBlobs.forEach(function(b){
    b.y-=b.v*(0.4+S.lampHeat*3)*dt*3;
    if(b.y<0.12) b.y=0.85;
  });
  for(var t2=S.tomatoes.length-1;t2>=0;t2--){
    var tm=S.tomatoes[t2];
    if(tm.splat>0){ tm.splat+=dt; if(tm.splat>2.2) S.tomatoes.splice(t2,1); continue; }
    tm.t+=dt; tm.x+=tm.vx*dt; tm.y+=tm.vy*dt; tm.vy+=420*dt;
    var sx=W()*0.5, sy2=H()*0.52;
    if(Math.hypot(tm.x-sx,tm.y-sy2)<40 || tm.y>H()*0.92){ tm.splat=0.01; nz(0.1,300,0.25); }
  }
  for(var c2=S.claps.length-1;c2>=0;c2--){ S.claps[c2].t+=dt; if(S.claps[c2].t>1.2) S.claps.splice(c2,1); }
}

/* ---------- drawing ---------- */
function drawShrimp(x,y,scale,posture,now){
  // posture: 0=deep shrimp curl of despair · 1=suspiciously aligned
  var curl=1-posture;
  ctx.save(); ctx.translate(x,y+Math.sin(now/600)*3); ctx.scale(scale,scale);
  ctx.rotate(curl*0.25);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(0,26,26,6,0,0,6.283); ctx.fill();
  ctx.strokeStyle='#ff7757'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-16,12);
  ctx.quadraticCurveTo(-18,-6-8*(1-curl), 0,-12-6*(1-curl));
  ctx.quadraticCurveTo(16+6*curl,-14+16*curl, 18,4+8*curl);
  ctx.stroke();
  ctx.strokeStyle='#d84f2e'; ctx.lineWidth=1.6;
  for(var i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(-14+i*8,-4+curl*5,8,-2.2,-0.7); ctx.stroke(); }
  ctx.fillStyle='#ff7757';
  ctx.beginPath(); ctx.moveTo(-16,15); ctx.lineTo(-26,22); ctx.lineTo(-20,14); ctx.lineTo(-27,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#241c14';
  ctx.beginPath(); ctx.arc(15-6*curl,-6+10*curl,2.6,0,6.283); ctx.fill();
  ctx.strokeStyle='#d84f2e'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(17-6*curl,-10+10*curl); ctx.quadraticCurveTo(26,-20+8*curl,29,-15+8*curl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16-6*curl,-12+10*curl); ctx.quadraticCurveTo(22,-24+8*curl,27,-23+8*curl); ctx.stroke();
  ctx.fillStyle='#0A66C2';
  var tx=14-6*curl, ty=0+10*curl;
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+4,ty+4); ctx.lineTo(tx,ty+8); ctx.lineTo(tx-4,ty+4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx,ty+7); ctx.lineTo(tx+5,ty+17); ctx.lineTo(tx,ty+21); ctx.lineTo(tx-5,ty+17); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawFrog(x,y,i,now){
  var b=S.frogBounce[i];
  var yy=y-Math.abs(Math.sin(now/110+i))*b*22;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+14,16,4,0,0,6.283); ctx.fill();
  ctx.fillStyle=['#4e8a3a','#5fa044','#3d7a30'][i];
  ctx.beginPath(); ctx.ellipse(x,yy,16,12,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x-7,yy-10,4.5,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,yy-10,4.5,0,6.283); ctx.fill();
  ctx.fillStyle='#f2e8d8';
  ctx.beginPath(); ctx.arc(x-7,yy-10,2.6,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,yy-10,2.6,0,6.283); ctx.fill();
  ctx.fillStyle='#241c14';
  ctx.beginPath(); ctx.arc(x-7,yy-10,1.2,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,yy-10,1.2,0,6.283); ctx.fill();
  ctx.strokeStyle='#241c14'; ctx.lineWidth=1.4;
  ctx.beginPath();
  if(b>0.3){ ctx.arc(x,yy+3,5,0.2,2.9); } else { ctx.moveTo(x-4,yy+5); ctx.lineTo(x+4,yy+5); }
  ctx.stroke();
}
function drawLamp(x,y,now){
  var heat=S.lampHeat;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+26,16,4,0,0,6.283); ctx.fill();
  ctx.fillStyle='#6b5138';                                 // stool
  ctx.fillRect(x-14,y+14,28,4); ctx.fillRect(x-10,y+18,3,10); ctx.fillRect(x+7,y+18,3,10);
  ctx.fillStyle='#3a3630';
  ctx.beginPath(); ctx.moveTo(x-10,y+14); ctx.lineTo(x+10,y+14); ctx.lineTo(x+6,y+8); ctx.lineTo(x-6,y+8); ctx.closePath(); ctx.fill();
  var glass=ctx.createLinearGradient(x,y-34,x,y+8);
  glass.addColorStop(0,'rgba(120,40,50,'+(0.5+heat*0.4)+')');
  glass.addColorStop(1,'rgba(255,'+Math.floor(120-heat*60)+',60,'+(0.65+heat*0.3)+')');
  ctx.fillStyle=glass;
  ctx.beginPath(); ctx.moveTo(x-7,y+8); ctx.quadraticCurveTo(x-11,y-20,x-4,y-32);
  ctx.lineTo(x+4,y-32); ctx.quadraticCurveTo(x+11,y-20,x+7,y+8); ctx.closePath(); ctx.fill();
  S.lampBlobs.forEach(function(b){
    ctx.fillStyle='rgba(255,'+Math.floor(180-heat*100)+',80,'+(0.7+heat*0.3)+')';
    ctx.beginPath(); ctx.arc(x+Math.sin(b.y*9)*3, y+8-(40*b.y), b.r*(1+heat*0.5), 0, 6.283); ctx.fill();
  });
  ctx.fillStyle='#3a3630';
  ctx.beginPath(); ctx.moveTo(x-5,y-32); ctx.lineTo(x+5,y-32); ctx.lineTo(x+3,y-38); ctx.lineTo(x-3,y-38); ctx.closePath(); ctx.fill();
  if(heat>0.7){                                            // eruption glow
    ctx.fillStyle='rgba(255,120,60,'+(heat-0.7)+')';
    ctx.beginPath(); ctx.arc(x,y-12,34,0,6.283); ctx.fill();
  }
}
function drawDino(x,y,now){
  var wiggle=Math.sin(now/70)*S.dinoArms*4;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+18,18,4,0,0,6.283); ctx.fill();
  ctx.fillStyle='#5a8a4a';
  ctx.beginPath(); ctx.ellipse(x,y,14,13,0,0,6.283); ctx.fill();      // body
  ctx.beginPath(); ctx.ellipse(x+13,y-11,8,7,0.3,0,6.283); ctx.fill(); // head
  ctx.beginPath(); ctx.moveTo(x-12,y+2); ctx.quadraticCurveTo(x-26,y+4,x-30,y+12); ctx.lineTo(x-22,y+12); ctx.quadraticCurveTo(x-18,y+8,x-10,y+8); ctx.closePath(); ctx.fill(); // tail
  ctx.fillStyle='#4a7a3c';
  ctx.fillRect(x-8,y+10,5,8); ctx.fillRect(x+3,y+10,5,8);             // legs
  // the arms. tiny. load-bearing.
  ctx.strokeStyle='#4a7a3c'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+8,y-2); ctx.lineTo(x+12+wiggle*0.5,y+1+wiggle*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+10,y+1); ctx.lineTo(x+13+wiggle*0.4,y+4-wiggle*0.3); ctx.stroke();
  ctx.fillStyle='#241c14';
  ctx.beginPath(); ctx.arc(x+15,y-12,1.6,0,6.283); ctx.fill();        // grumpy eye
  ctx.strokeStyle='#241c14'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x+11,y-16); ctx.lineTo(x+18,y-15); ctx.stroke();   // brow
  ctx.strokeStyle='rgba(180,220,255,.5)'; ctx.lineWidth=1.4;          // little helmet (he kept it)
  ctx.beginPath(); ctx.arc(x+13,y-12,9.5,3.4,6.1); ctx.stroke();
}
function bubble(x,y,text,flip){
  if(!text) return;
  ctx.font='13px "IBM Plex Mono",monospace';
  var maxW=Math.min(300, W()*0.5);
  var words=String(text).split(' '), lines=[], cur='';
  words.forEach(function(w){
    if(ctx.measureText(cur+' '+w).width>maxW && cur){ lines.push(cur); cur=w; }
    else cur=cur?cur+' '+w:w;
  });
  lines.push(cur);
  var bw=0; lines.forEach(function(l){ bw=Math.max(bw, ctx.measureText(l).width); });
  bw+=22;
  var bh=lines.length*17+14;
  var bx=Math.max(8, Math.min(x-bw/2, W()-bw-8)), by=y-bh;
  ctx.fillStyle='#f2e8d8';
  ctx.beginPath();
  ctx.moveTo(bx+8,by); ctx.lineTo(bx+bw-8,by); ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+8);
  ctx.lineTo(bx+bw,by+bh-8); ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-8,by+bh);
  ctx.lineTo(bx+8,by+bh); ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-8);
  ctx.lineTo(bx,by+8); ctx.quadraticCurveTo(bx,by,bx+8,by);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x-6+(flip?12:0), by+bh); ctx.lineTo(x+(flip?8:-2), by+bh+10); ctx.lineTo(x+8+(flip?12:0), by+bh);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#241318';
  lines.forEach(function(l,i){ ctx.fillText(l, bx+11, by+22+i*17); });
}
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W(),H());
  // brick wall
  ctx.fillStyle='#2c1820'; ctx.fillRect(0,0,W(),H());
  var bw2=46, bh2=20;
  for(var row=0; row*bh2<H()*0.86; row++){
    for(var col=-1; col*bw2<W(); col++){
      var off=(row%2)*bw2/2;
      ctx.fillStyle=(row*7+col)%5===0?'#3d2229':'#3a2028';
      ctx.fillRect(col*bw2+off+1, row*bh2+1, bw2-2, bh2-2);
    }
  }
  // stage floor
  ctx.fillStyle='#241318'; ctx.fillRect(0,H()*0.86,W(),H()*0.14);
  ctx.fillStyle='rgba(255,217,160,.06)'; ctx.fillRect(0,H()*0.86,W(),2);
  // spotlight
  var sx=W()*0.5, sy=H()*0.5;
  var grad=ctx.createRadialGradient(sx,sy,10,sx,sy,H()*0.55);
  grad.addColorStop(0,'rgba(255,217,160,.22)'); grad.addColorStop(1,'rgba(255,217,160,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(sx,sy+40,W()*0.3,H()*0.5,0,0,6.283); ctx.fill();
  // mic stand
  ctx.strokeStyle='#6a5a4a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(sx+50,H()*0.86); ctx.lineTo(sx+50,sy+6); ctx.stroke();
  ctx.fillStyle='#241c14';
  ctx.beginPath(); ctx.arc(sx+50,sy,7,0,6.283); ctx.fill();
  ctx.fillStyle='#4a4440';
  ctx.beginPath(); ctx.arc(sx+50,sy,5,0,6.283); ctx.fill();
  // the comedian
  drawShrimp(sx, sy+8, 1.7, postureFor(S.conf), now);
  // his bubble
  var talking=(S.phase==='setup'||S.phase==='punch'||S.phase==='beat');
  if(talking){
    var text=S.phase==='beat'?S.joke.s+' …':S.typed+(Math.floor(now/300)%2?'▌':'');
    bubble(sx, sy-70, text, false);
  }
  // front row
  var fy=H()*0.84;
  drawFrog(W()*0.18, fy, 0, now);
  drawFrog(W()*0.28, fy, 1, now);
  drawFrog(W()*0.38, fy, 2, now);
  drawLamp(W()*0.62, fy-6, now);
  drawDino(W()*0.78, fy-2, now);
  // heckle bubble
  if(S.phase==='react' && S.heckle){
    var hx=S.heckleFrom==='frogs'?W()*0.28:W()*0.78;
    bubble(hx, fy-56, S.heckle, true);
  }
  // reaction label
  if(S.phase==='react' && S.reactTier){
    ctx.font='16px "Yeseva One",serif'; ctx.textAlign='center';
    ctx.fillStyle=S.reactTier==='good'?'#7fce6a':S.reactTier==='meh'?'#ffd166':'#e85a5a';
    ctx.fillText(HECKLES[S.reactTier].label, W()/2, H()*0.12);
    ctx.textAlign='left';
  }
  // tomatoes
  S.tomatoes.forEach(function(tm){
    if(tm.splat>0){
      ctx.globalAlpha=Math.max(0,1-tm.splat/2.2);
      ctx.fillStyle='#c23b2b';
      ctx.beginPath(); ctx.ellipse(tm.x,tm.y,14,7,0,0,6.283); ctx.fill();
      for(var i=0;i<4;i++){ ctx.beginPath(); ctx.arc(tm.x+Math.sin(i*2.2)*16,tm.y+Math.cos(i*1.7)*8,3,0,6.283); ctx.fill(); }
      ctx.globalAlpha=1;
    } else {
      ctx.font='18px serif'; ctx.fillText('🍅', tm.x-9, tm.y+6);
    }
  });
  // claps float
  S.claps.forEach(function(c){
    ctx.globalAlpha=Math.max(0,1-c.t/1.2);
    ctx.font='20px serif';
    ctx.fillText('👏', W()*0.85, H()*0.5-c.t*60);
    ctx.globalAlpha=1;
  });
  // posture verdict cameo at the extremes
  if(S.conf<=12 || S.conf>=95){
    ctx.save();
    ctx.translate(W()*0.5+120, sy-60); ctx.rotate(0.2);
    ctx.strokeStyle=S.conf<=12?'#e85a5a':'#7fce6a'; ctx.lineWidth=3;
    ctx.strokeRect(-58,-16,116,32);
    ctx.font='13px "IBM Plex Mono",monospace'; ctx.textAlign='center';
    ctx.fillStyle=S.conf<=12?'#e85a5a':'#7fce6a';
    ctx.fillText(S.conf<=12?'CLINIC: CURVED':'SUSPICIOUSLY ALIGNED', 0, 5);
    ctx.textAlign='left';
    ctx.restore();
  }
}
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt); draw(now);
}
fit(); requestAnimationFrame(frame);

/* ---------- controls ---------- */
$('nextBtn').addEventListener('click', function(){ ac(); nextJoke(); });
$('autoBtn').addEventListener('click', function(){
  S.auto=!S.auto;
  this.setAttribute('aria-pressed', String(S.auto));
  this.textContent=S.auto?'⏸ auto set':'▶ auto set';
  if(S.auto && S.phase==='idle') nextJoke();
});
$('clapBtn').addEventListener('click', function(){ ac(); clap(); });
$('tomatoBtn').addEventListener('click', function(){ ac(); throwTomato(); });
$('sndBtn').addEventListener('click', function(){
  soundOn=!soundOn; ac();
  this.setAttribute('aria-pressed', String(soundOn));
  this.textContent=(soundOn?'🔊':'🔇')+' sound';
});
document.addEventListener('keydown', function(e){
  if(e.key===' '||e.key==='Enter'){ if(e.target.tagName!=='BUTTON'){ e.preventDefault(); ac(); nextJoke(); } }
  if(e.key==='c'||e.key==='C') clap();
  if(e.key==='t'||e.key==='T') throwTomato();
});
updConf();
window.__CLUB={ get S(){return S;}, nextJoke:nextJoke, step:step, JOKES:JOKES,
  makePicker:makePicker, confDelta:confDelta, clampConf:clampConf, postureFor:postureFor,
  clap:clap, throwTomato:throwTomato };
</script>
</body>
