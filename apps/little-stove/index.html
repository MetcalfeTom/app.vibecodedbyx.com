<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Stove — cook a cozy dinner at home</title>
<meta name="description" content="Grab it from the fridge, chop it, cook it, salt it. Somebody's waiting for dinner.">
<link rel="icon" href="https://emojicdn.elk.sh/🍳">
<meta property="og:title" content="Little Stove">
<meta property="og:description" content="Grab it from the fridge, chop it, cook it, salt it. Somebody's waiting for dinner.">
<meta property="og:url" content="https://sloppy.live/little-stove/">
<meta property="og:image" content="https://sloppy.live/little-stove/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3e6cf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#f3e6cf; --tile:#e9d6b4; --grout:#dcc39a;
  --wood:#a8693f; --wood2:#8a532f; --board:#e7c38f;
  --ink:#2f2118; --soft:#5a4334; --tomato:#c8462f; --sage:#4f7a52; --butter:#f2c14e;
  --steel:#5d6670; --steel2:#8d97a1; --flame:#ef7b2a;
  --card:#fffaf0;
}
*{ box-sizing:border-box; }
html{ font-size:100%; }
body{ margin:0; min-height:100vh; color:var(--ink); font-family:'DM Mono', ui-monospace, 'Courier New', monospace;
  background:
    linear-gradient(var(--grout) 2px, transparent 2px) 0 0 / 3.2rem 3.2rem,
    linear-gradient(90deg, var(--grout) 2px, transparent 2px) 0 0 / 3.2rem 3.2rem,
    radial-gradient(circle at 30% 10%, #fbf3e3, var(--wall) 60%); }
.skip{ position:absolute; left:-999px; top:0; background:var(--ink); color:#fff; padding:.6rem 1rem; z-index:9; }
.skip:focus{ left:1rem; }
:focus-visible{ outline:3px solid #1d4ed8; outline-offset:2px; }
main{ max-width:62rem; margin:0 auto; padding:1rem clamp(1rem, 3vw, 1.75rem) 2.5rem; }
header.top{ display:flex; align-items:baseline; justify-content:space-between; gap:.5rem 1rem; flex-wrap:wrap; }
h1{ font-family:'Fraunces', Georgia, serif; font-weight:900; font-size:clamp(2rem, 7vw, 3.4rem); margin:0; letter-spacing:-.02em; line-height:1; }
h1 span{ color:var(--tomato); }
.day{ font-size:.85rem; color:var(--soft); }
.order{ margin:.9rem 0 .8rem; background:var(--card); border:2px solid var(--ink); border-radius:1rem; padding:.85rem 1rem; box-shadow:0 .35rem 0 var(--ink); display:grid; gap:.35rem; }
.order p, .order h2{ margin:0; }
.order .who{ font-size:.85rem; color:var(--soft); }
.order h2{ font-family:'Fraunces', Georgia, serif; font-weight:900; font-size:clamp(1.5rem, 5vw, 2.1rem); margin:0; line-height:1.05; }
.needs{ display:flex; flex-wrap:wrap; gap:.4rem; margin:.2rem 0 0; padding:0; list-style:none; }
.needs li{ display:flex; align-items:center; gap:.3rem; font-size:.8rem; border:1.5px solid var(--grout); border-radius:2rem; padding:.15rem .6rem .15rem .25rem; background:#fff; }
.needs li.ok{ border-color:var(--sage); background:#e8f1e4; }
.needs li svg{ width:1.6rem; height:1.6rem; }
.hint{ min-height:1.5rem; margin:.3rem 0 .9rem; font-size:.95rem; font-weight:500; }
.hint b{ color:var(--tomato); }
.kitchen{ display:grid; gap:.7rem; grid-template-columns:1.1fr 1fr; }
.fridge{ grid-column:1 / -1; }
section.area{ background:rgba(255,250,240,.82); border:2px solid var(--ink); border-radius:1rem; padding:.8rem; position:relative; }
section.area h3{ margin:0 0 .5rem; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); font-weight:500; }
/* stove */
.stove{ display:grid; grid-template-columns:1fr; gap:.6rem; }
.hob{ position:relative; height:12rem; border-radius:.8rem; background:linear-gradient(#3a3330, #2a2421); display:grid; place-items:center; overflow:hidden; }
.ring{ position:absolute; bottom:1.1rem; width:9.5rem; height:2.2rem; border-radius:50%; border:3px solid #55504c; }
.hob.hot .ring{ border-color:var(--flame); box-shadow:0 0 1.2rem var(--flame), inset 0 0 .8rem var(--flame); }
.vessel{ position:relative; z-index:1; border:0; background:none; padding:0; cursor:pointer; color:inherit; font:inherit; display:grid; place-items:center; min-width:2.75rem; min-height:2.75rem; }
.vessel svg{ width:11rem; height:9rem; display:block; }
.vessel .stuff{ position:absolute; top:2.1rem; left:50%; transform:translateX(-50%); display:flex; gap:.1rem; flex-wrap:wrap; justify-content:center; width:7rem; }
.vessel .stuff svg{ width:1.5rem; height:1.5rem; }
.vessel.flipping svg{ animation:flipup .5s ease-out; }
@keyframes flipup{ 40%{ transform:translateY(-1.6rem) rotate(-8deg); } 70%{ transform:translateY(.2rem); } }
.steam{ position:absolute; top:.4rem; left:50%; width:5rem; height:3rem; transform:translateX(-50%); pointer-events:none; opacity:0; }
.hob.cooking .steam{ opacity:1; }
.steam i{ position:absolute; bottom:0; width:.6rem; height:.6rem; border-radius:50%; background:rgba(255,255,255,.55); animation:rise 1.6s infinite ease-out; }
.steam i:nth-child(2){ left:40%; animation-delay:.5s; } .steam i:nth-child(3){ left:75%; animation-delay:1s; } .steam i:nth-child(1){ left:10%; }
.hob.burnt .steam i{ background:rgba(60,60,60,.75); }
@keyframes rise{ from{ transform:translateY(0) scale(.6); opacity:.9; } to{ transform:translateY(-2.8rem) scale(1.8); opacity:0; } }
.meter{ position:relative; height:1.2rem; border-radius:1rem; background:#eadcc4; border:2px solid var(--ink); overflow:hidden; }
.meter .zone{ position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg, #9cc596, #9cc596 6px, #b6d6b0 6px, #b6d6b0 12px); }
.meter .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg, #f6d48a, var(--flame)); opacity:.85; }
.meter .tick{ position:absolute; top:-2px; bottom:-2px; width:4px; margin-left:-2px; background:var(--ink); }
.doneness{ display:flex; justify-content:space-between; font-size:.8rem; color:var(--soft); }
.doneness b{ color:var(--ink); }
.stir{ height:.55rem; border-radius:1rem; background:#eadcc4; overflow:hidden; border:1.5px solid var(--ink); }
.stir i{ display:block; height:100%; width:100%; background:var(--sage); transition:width .15s linear; }
.stir.low i{ background:var(--tomato); }
.row{ display:flex; gap:.5rem; flex-wrap:wrap; }
button.btn{ font:inherit; font-weight:500; font-size:.92rem; min-height:2.75rem; min-width:2.75rem; padding:.5rem .95rem; border-radius:.7rem; border:2px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; box-shadow:0 .2rem 0 var(--ink); transition:transform .06s; }
button.btn:active{ transform:translateY(.15rem); box-shadow:0 .05rem 0 var(--ink); }
button.btn:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; }
button.btn.go{ background:var(--tomato); color:#fff; }
button.btn.heat[aria-pressed="true"]{ background:var(--flame); color:var(--ink); }
button.btn.serve{ background:var(--sage); color:#fff; font-size:1.05rem; padding:.6rem 1.4rem; }
/* board */
.boardwrap{ display:grid; gap:.6rem; }
.board{ height:12rem; border-radius:1rem; border:2px solid var(--ink); background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 3px, transparent 3px 22px), var(--board); display:grid; place-items:center; position:relative; overflow:hidden; }
.board .item{ border:0; background:none; padding:0; cursor:pointer; font:inherit; color:inherit; display:grid; justify-items:center; gap:.2rem; min-width:2.75rem; min-height:2.75rem; }
.board .item svg{ width:7rem; height:7rem; display:block; }
.board .item.chop svg{ animation:chop .14s; }
@keyframes chop{ 50%{ transform:scale(.92) rotate(-3deg); } }
.board .empty{ color:#7a5a40; font-size:.85rem; text-align:center; padding:0 1rem; }
.knife{ position:absolute; right:.8rem; top:.6rem; width:2.2rem; opacity:.65; pointer-events:none; }
.cuts{ font-size:.8rem; color:var(--ink); background:rgba(255,255,255,.7); border-radius:1rem; padding:.05rem .55rem; }
/* fridge */
.shelf{ display:grid; grid-template-columns:repeat(auto-fill, minmax(4.6rem, 1fr)); gap:.5rem; }
.food{ font:inherit; font-size:.72rem; color:var(--ink); background:#eef4f6; border:2px solid #9fb3bd; border-radius:.8rem; cursor:pointer; padding:.35rem .2rem .3rem; display:grid; justify-items:center; gap:.1rem; min-height:2.75rem; }
.food svg{ width:2.6rem; height:2.6rem; }
.food:hover{ background:#fff; }
.food.want{ border-color:var(--sage); background:#eaf3e6; }
.gl{ width:1.1rem; height:1.1rem; vertical-align:-.2rem; margin-right:.3rem; }
.needs li .gl{ width:1.1rem; height:1.1rem; margin:0 0 0 .2rem; }
.salt .n{ display:inline-block; min-width:1.2rem; text-align:center; }
/* result */
dialog{ border:2px solid var(--ink); border-radius:1.2rem; padding:1.4rem 1.4rem 1.2rem; max-width:24rem; width:calc(100% - 2rem); background:var(--card); color:var(--ink); box-shadow:0 .5rem 0 var(--ink); }
dialog::backdrop{ background:rgba(47,33,24,.55); }
dialog h2{ font-family:'Fraunces', Georgia, serif; font-weight:900; font-size:2rem; margin:0 0 .2rem; }
.stars{ font-size:2rem; letter-spacing:.15em; color:#b7791f; margin:.2rem 0 .5rem; }
.say{ font-family:'Fraunces', Georgia, serif; font-style:italic; font-weight:300; font-size:1.2rem; margin:.4rem 0 .8rem; }
.notes{ margin:0 0 1rem; padding-left:1.1rem; font-size:.85rem; }
details.book{ margin-top:1.2rem; font-size:.85rem; }
details.book summary{ cursor:pointer; min-height:2.75rem; display:flex; align-items:center; }
details.book ul{ list-style:none; padding:0; margin:.3rem 0 0; display:grid; gap:.3rem; }
details.book li{ display:flex; justify-content:space-between; border-bottom:1px dashed var(--grout); padding:.2rem 0; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (max-width:40rem){
  main{ padding-top:.6rem; }
  .order{ margin:.5rem 0 .4rem; padding:.6rem .75rem; } .order .who{ font-size:.78rem; }
  .needs li{ font-size:.72rem; } .needs li svg{ width:1.3rem; height:1.3rem; }
  .hint{ margin:.2rem 0 .5rem; font-size:.88rem; min-height:2.6rem; }
  section.area{ padding:.55rem; } .hob, .board{ height:8.5rem; }
  .vessel svg{ width:8.5rem; height:7rem; } .vessel .stuff{ top:1.5rem; width:5.5rem; } .vessel .stuff svg{ width:1.1rem; height:1.1rem; }
  .ring{ width:7rem; bottom:.7rem; }
  .board .item svg{ width:4.6rem; height:4.6rem; } .knife{ width:1.6rem; }
  .row{ gap:.35rem; } button.btn{ font-size:.78rem; padding:.4rem .5rem; flex:1 1 40%; } button.btn.serve{ font-size:.95rem; padding:.5rem .8rem; }
  .shelf{ grid-template-columns:repeat(auto-fill, minmax(4rem, 1fr)); gap:.35rem; } .food svg{ width:2.1rem; height:2.1rem; }
  .boardwrap .row .btn{ flex:1 1 100%; }
  .doneness span{ display:none; } .doneness{ justify-content:center; }
  .hob, .board{ height:8rem; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<a class="skip" href="#kitchen">Skip to the kitchen</a>
<main>
  <header class="top">
    <h1>Little <span>Stove</span></h1>
    <p class="day" id="day">dinner 1</p>
  </header>
  <section class="order" aria-labelledby="dish">
    <p class="who" id="who">Tonight you're cooking for your roommate.</p>
    <h2 id="dish">Tomato Soup</h2>
    <ul class="needs" id="needs" aria-label="What goes in"></ul>
  </section>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="kitchen" id="kitchen">
    <section class="area stove" aria-labelledby="h-stove">
      <h3 id="h-stove">Stove</h3>
      <div class="hob" id="hob">
        <div class="ring" aria-hidden="true"></div>
        <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
        <button type="button" class="vessel" id="vessel" aria-label="The pot. Tap to stir"></button>
      </div>
      <div class="meter" id="meter" role="meter" aria-label="How cooked it is" aria-valuemin="0" aria-valuemax="130" aria-valuenow="0"><div class="zone" id="zone"></div><div class="fill" id="fill"></div><div class="tick" id="tick" style="left:0"></div></div>
      <div class="doneness"><span>raw</span><b id="state">empty</b><span>burnt</span></div>
      <div id="stirbox" hidden><div class="doneness"><span>stirred</span><span id="stirtxt">tap the pan to stir</span></div><div class="stir" id="stir"><i></i></div></div>
      <div class="row">
        <button type="button" class="btn heat" id="heat" aria-pressed="false"><svg class="gl" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 q4 4 4 8 a4 4 0 0 1 -8 0 q0 -2 2 -4 q0 2 1.5 2.5 q-1 -3 .5 -6.5z" fill="#ef7b2a" stroke="#2f2118" stroke-width="1.2"/></svg><span id="heattxt">heat: off</span></button>
        <button type="button" class="btn salt" id="salt"><svg class="gl" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6 h6 v8 h-6z" fill="#fff" stroke="#2f2118" stroke-width="1.2"/><path d="M5 6 q0 -4 3 -4 q3 0 3 4z" fill="#8d97a1" stroke="#2f2118" stroke-width="1.2"/><circle cx="7" cy="4" r=".6"/><circle cx="9" cy="4" r=".6"/></svg>salt <span class="n" id="pinch">0</span></button>
        <button type="button" class="btn" id="flip" hidden>flip it</button>
        <button type="button" class="btn serve" id="serve" disabled>serve</button>
      </div>
    </section>
    <section class="area boardwrap" aria-labelledby="h-board">
      <h3 id="h-board">Chopping board</h3>
      <div class="board" id="board"></div>
      <div class="row">
        <button type="button" class="btn go" id="add" disabled>into the pot ➜</button>
        <button type="button" class="btn" id="back" disabled>put back</button>
      </div>
    </section>
    <section class="area fridge" aria-labelledby="h-fridge">
      <h3 id="h-fridge">Fridge &amp; cupboard</h3>
      <div class="shelf" id="shelf"></div>
    </section>
  </div>
  <details class="book" id="book"><summary>Your cookbook</summary><ul id="booklist"></ul></details>
</main>
<dialog id="done" aria-labelledby="dtitle">
  <h2 id="dtitle">Dinner's served</h2>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <p class="sr" id="starsr"></p>
  <p class="say" id="say"></p>
  <ul class="notes" id="dnotes"></ul>
  <div class="row"><button type="button" class="btn go" id="next">next dinner</button></div>
</dialog>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ingredients: cuts = taps to chop (0 = goes in whole), verb for the hint */
var FOOD = {
  tomato: { n:'tomato', cuts:3, c:'#d2412b', d:'#9e2a1a' }, onion: { n:'onion', cuts:4, c:'#c9a1c4', d:'#8d5f88' },
  carrot: { n:'carrot', cuts:4, c:'#ee8a2a', d:'#b45d12' }, pepper: { n:'pepper', cuts:3, c:'#3f9a4a', d:'#26662f' },
  potato: { n:'potato', cuts:4, c:'#c99a5b', d:'#8e6a3a' }, egg: { n:'egg', cuts:1, verb:'crack', c:'#fbf5e8', d:'#c9b99a' },
  bread: { n:'bread', cuts:0, c:'#d9a35e', d:'#9c6a2c' }, pasta: { n:'pasta', cuts:0, c:'#f0cf6e', d:'#b8962f' },
  butter: { n:'butter', cuts:0, c:'#f7dc6f', d:'#c7a937' }, cheese: { n:'cheese', cuts:2, verb:'grate', c:'#f5bd2a', d:'#c08a06' },
  rice: { n:'rice', cuts:0, c:'#f4f0e6', d:'#bfb6a3' }, beans: { n:'beans', cuts:0, c:'#8c3b2e', d:'#5c2219' },
  mushroom: { n:'mushroom', cuts:3, c:'#d8c3a8', d:'#9b8164' }, garlic: { n:'garlic', cuts:3, c:'#f1ece0', d:'#b9ae96' },
  flour: { n:'flour', cuts:0, c:'#f3ead8', d:'#a8957a' }, milk: { n:'milk', cuts:0, c:'#ffffff', d:'#7f98ad' }
};
var ORDER = ['tomato','onion','garlic','carrot','pepper','mushroom','potato','egg','milk','cheese','butter','flour','bread','pasta','rice','beans'];
/* recipes: pot simmers, pan needs stirring; zone = the just-right window on a 0..130 scale */
var RECIPES = [
  { id:'soup', name:'Tomato Soup', pot:'pot', needs:['tomato','tomato','onion','garlic'], zone:[55, 80], salt:2 },
  { id:'pancakes', name:'Pancakes', pot:'pan', flip:true, needs:['flour','egg','milk','butter'], zone:[50, 74], salt:0 },
  { id:'toast', name:'Egg on Toast', pot:'pan', needs:['egg','bread','butter'], zone:[45, 68], salt:1 },
  { id:'stirfry', name:'Veggie Stir-fry', pot:'pan', needs:['carrot','pepper','onion','garlic'], zone:[50, 74], salt:1 },
  { id:'pasta', name:'Buttery Pasta', pot:'pot', needs:['pasta','butter','cheese'], zone:[60, 84], salt:2 },
  { id:'potatoes', name:'Cheesy Potatoes', pot:'pan', needs:['potato','potato','cheese','onion'], zone:[60, 84], salt:2 },
  { id:'rice', name:'Rice & Beans', pot:'pot', needs:['rice','beans','onion','pepper'], zone:[62, 86], salt:1 },
  { id:'mush', name:'Mushroom Toast', pot:'pan', needs:['mushroom','garlic','butter','bread'], zone:[48, 72], salt:1 }
];
var SALTI = '<svg class="gl" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6 h6 v8 h-6z" fill="#fff" stroke="#2f2118" stroke-width="1.2"/><path d="M5 6 q0 -4 3 -4 q3 0 3 4z" fill="#8d97a1" stroke="#2f2118" stroke-width="1.2"/><circle cx="7" cy="4" r=".6"/><circle cx="9" cy="4" r=".6"/></svg>';
var WHO = ['your roommate', 'Grandma', 'your little brother', 'the neighbour who smelled it through the wall', 'yourself, after a long day', 'your best friend', 'Mum', 'Dad', 'the cat (who mostly sniffs)'];

/* ---- little drawings: one svg per ingredient, a chopped version is three pieces ---- */
function ico(id, cut){
  var f = FOOD[id], c = f.c, d = f.d, s = '<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">';
  if (cut){
    if (id === 'egg') return s + '<ellipse cx="20" cy="22" rx="15" ry="11" fill="#fff" stroke="#c9b99a" stroke-width="2"/><circle cx="19" cy="21" r="6" fill="#f5b51c"/><circle cx="17" cy="19" r="1.6" fill="#fde7a0"/></svg>';
    if (id === 'cheese') return s + '<g fill="' + c + '" stroke="' + d + '" stroke-width="1.5"><rect x="6" y="14" width="4" height="14" rx="2"/><rect x="13" y="10" width="4" height="18" rx="2"/><rect x="20" y="16" width="4" height="13" rx="2"/><rect x="27" y="12" width="4" height="16" rx="2"/></g></svg>';
    return s + '<g fill="' + c + '" stroke="' + d + '" stroke-width="2"><path d="M5 24 q5 -9 11 -1 z"/><path d="M15 31 q6 -10 12 0 z"/><path d="M23 20 q6 -9 12 0 z"/></g><g fill="#fff" opacity=".45"><circle cx="9" cy="21" r="1.4"/><circle cx="20" cy="27" r="1.4"/><circle cx="28" cy="17" r="1.4"/></g></svg>';
  }
  var o = 'stroke="' + d + '" stroke-width="2"';
  switch (id){
    case 'tomato': return s + '<circle cx="20" cy="22" r="13" fill="' + c + '" ' + o + '/><path d="M14 11 l6 4 l6 -4 l-3 6 h-6 z" fill="#3f8a3c"/><circle cx="15" cy="18" r="3" fill="#fff" opacity=".35"/></svg>';
    case 'onion': return s + '<path d="M20 5 q2 6 9 11 q6 6 2 13 q-4 6 -11 6 q-7 0 -11 -6 q-4 -7 2 -13 q7 -5 9 -11z" fill="' + c + '" ' + o + '/><path d="M20 12 v20 M14 17 q-2 8 2 15 M26 17 q2 8 -2 15" stroke="' + d + '" stroke-width="1.2" fill="none" opacity=".6"/></svg>';
    case 'garlic': return s + '<path d="M20 6 q3 5 8 9 q6 5 3 12 q-3 7 -11 7 q-8 0 -11 -7 q-3 -7 3 -12 q5 -4 8 -9z" fill="' + c + '" ' + o + '/><path d="M20 14 v19 M15 18 q-1 8 2 14 M25 18 q1 8 -2 14" stroke="' + d + '" stroke-width="1.2" fill="none"/></svg>';
    case 'carrot': return s + '<path d="M9 31 l20 -20 q4 2 2 6 l-20 16 q-3 1 -2 -2z" fill="' + c + '" ' + o + '/><path d="M28 11 q-1 -6 3 -7 M30 13 q4 -4 7 -1 M29 12 q3 -6 6 -5" stroke="#3f8a3c" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
    case 'pepper': return s + '<path d="M11 15 q9 -5 18 0 q3 8 0 15 q-4 6 -9 3 q-5 3 -9 -3 q-3 -7 0 -15z" fill="' + c + '" ' + o + '/><path d="M20 12 v-6 q3 -1 4 2" stroke="#2b5a20" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
    case 'mushroom': return s + '<rect x="16" y="20" width="8" height="13" rx="3" fill="#f2e8d8" ' + o + '/><path d="M5 22 q2 -14 15 -14 q13 0 15 14z" fill="' + c + '" ' + o + '/><circle cx="14" cy="16" r="2" fill="#fff" opacity=".6"/><circle cx="24" cy="13" r="1.6" fill="#fff" opacity=".6"/></svg>';

    case 'bread': return s + '<path d="M7 18 q0 -10 13 -10 q13 0 13 10 q0 3 -3 4 v10 h-20 v-10 q-3 -1 -3 -4z" fill="' + c + '" ' + o + '/><path d="M12 20 h16 v10 h-16z" fill="#f6e3b8"/></svg>';
    case 'pasta': return s + '<path d="M8 12 q4 -4 8 0 t8 0 t8 0 M8 20 q4 -4 8 0 t8 0 t8 0 M8 28 q4 -4 8 0 t8 0 t8 0" stroke="' + d + '" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M8 12 q4 -4 8 0 t8 0 t8 0 M8 20 q4 -4 8 0 t8 0 t8 0 M8 28 q4 -4 8 0 t8 0 t8 0" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
    case 'butter': return s + '<path d="M6 25 l8 -10 h20 l-8 10z" fill="#fff4c2" ' + o + '/><path d="M6 25 h20 v6 h-20z M26 25 l8 -10 v6 l-8 10z" fill="' + c + '" ' + o + '/></svg>';
    case 'cheese': return s + '<path d="M5 28 l26 -14 l4 4 v12 h-30z" fill="' + c + '" ' + o + '/><g fill="' + d + '" opacity=".6"><circle cx="15" cy="26" r="2"/><circle cx="26" cy="22" r="1.6"/><circle cx="29" cy="28" r="1.3"/></g></svg>';
    case 'rice': return s + '<path d="M7 18 h26 q-1 13 -13 15 q-12 -2 -13 -15z" fill="#6f8fb0" ' + o.replace(d, '#3f5a78') + '/><g fill="' + c + '" stroke="' + d + '" stroke-width=".8"><ellipse cx="13" cy="15" rx="2.6" ry="1.4"/><ellipse cx="19" cy="13" rx="2.6" ry="1.4" transform="rotate(30 19 13)"/><ellipse cx="25" cy="15" rx="2.6" ry="1.4" transform="rotate(-20 25 15)"/><ellipse cx="18" cy="17" rx="2.6" ry="1.4"/><ellipse cx="28" cy="18" rx="2.2" ry="1.2"/><ellipse cx="11" cy="18" rx="2.2" ry="1.2"/></g></svg>';
    case 'flour': return s + '<path d="M10 12 q10 -5 20 0 l2 20 q-12 4 -24 0z" fill="' + c + '" ' + o + '/><path d="M12 12 q8 3 16 0" stroke="' + d + '" stroke-width="1.5" fill="none"/><path d="M14 22 h12 v6 h-12z" fill="#d9a35e"/><circle cx="20" cy="8" r="2.2" fill="#fff" stroke="' + d + '" stroke-width="1"/></svg>';
    case 'milk': return s + '<path d="M13 12 l3 -6 h8 l3 6 v22 h-14z" fill="' + c + '" ' + o + '/><path d="M13 18 h14 v8 h-14z" fill="#5d8fc4"/><path d="M16 6 h8" stroke="' + d + '" stroke-width="2"/></svg>';
    case 'beans': return s + '<path d="M9 9 h22 v24 q0 3 -3 3 h-16 q-3 0 -3 -3z" fill="#b8c2c8" stroke="#5d6670" stroke-width="2"/><rect x="9" y="16" width="22" height="11" fill="' + c + '"/><g fill="#e8b49a"><ellipse cx="15" cy="21" rx="2.4" ry="1.5"/><ellipse cx="22" cy="20" rx="2.4" ry="1.5"/><ellipse cx="27" cy="23" rx="2" ry="1.3"/></g></svg>';
  }

}
function vesselSvg(kind, col){
  if (kind === 'pan') return '<svg viewBox="0 0 220 180" aria-hidden="true"><rect x="150" y="104" width="68" height="12" rx="6" fill="#2b2b2b"/><ellipse cx="88" cy="112" rx="78" ry="26" fill="#25282c"/><ellipse cx="88" cy="106" rx="72" ry="22" fill="' + col + '" stroke="#555c63" stroke-width="5"/></svg>';
  return '<svg viewBox="0 0 220 180" aria-hidden="true"><rect x="22" y="58" width="16" height="10" rx="4" fill="#3d444b"/><rect x="182" y="58" width="16" height="10" rx="4" fill="#3d444b"/><path d="M36 60 h148 v70 q0 18 -18 18 h-112 q-18 0 -18 -18z" fill="#8d97a1" stroke="#3d444b" stroke-width="5"/><ellipse cx="110" cy="60" rx="74" ry="14" fill="' + col + '" stroke="#3d444b" stroke-width="5"/><path d="M48 80 v44" stroke="#c4ccd3" stroke-width="6" stroke-linecap="round" opacity=".7"/></svg>';
}

/* ---- tiny sounds (made on the spot, no files) ---- */
var AC = null;
function tick(f, len, type, vol){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.value = f; g.gain.setValueAtTime(vol || .05, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (len || .06)); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (len || .06)); }catch(e){} }

/* ---- state ---- */
var save = { dinners:0, best:{} };
try{ var sv = JSON.parse(localStorage.getItem('little-stove-v1') || 'null'); if (sv && typeof sv === 'object') save = { dinners: +sv.dinners || 0, best: sv.best || {} }; }catch(e){}
function store(){ try{ localStorage.setItem('little-stove-v1', JSON.stringify(save)); }catch(e){} }
var S;
var ASK = (function(){ try{ return new URLSearchParams(location.search).get('dish'); }catch(e){ return null; } })();   /* ?dish=pancakes opens straight on that recipe */
function newDinner(){
  var r = RECIPES[save.dinners % RECIPES.length];
  if (ASK){ RECIPES.forEach(function(x){ if (x.id === ASK) r = x; }); ASK = null; }
  var who = WHO[(save.dinners * 5 + 2) % WHO.length];
  if (save.dinners === 0) who = WHO[0];
  S = { r:r, who:who, board:null, inPot:[], heat:false, cook:0, stir:100, scorch:0, salt:0, side:0, sideA:null, t0:Date.now() };
  $('day').textContent = 'dinner ' + (save.dinners + 1);
  $('who').textContent = "Tonight you're cooking for " + who + '.';
  $('dish').textContent = r.name;
  var z = $('zone'); z.style.left = (r.zone[0] / 130 * 100) + '%'; z.style.width = ((r.zone[1] - r.zone[0]) / 130 * 100) + '%';
  $('stirbox').hidden = r.pot !== 'pan' || !!r.flip; $('flip').hidden = !r.flip; $('flip').disabled = false; $('flip').textContent = 'flip it';
  $('vessel').setAttribute('aria-label', r.flip ? 'The frying pan. Tap to flip' : r.pot === 'pan' ? 'The frying pan. Tap to stir' : 'The pot. Tap to stir');
  $('add').textContent = r.pot === 'pan' ? 'into the pan ➜' : 'into the pot ➜';
  $('heat').setAttribute('aria-pressed', 'false'); $('heattxt').textContent = 'heat: off';
  renderAll(); book();
}
function need(){ /* what's still missing, as a list of ids with counts */
  var left = S.r.needs.slice();
  S.inPot.forEach(function(p){ var i = left.indexOf(p.id); if (i >= 0) left.splice(i, 1); });
  if (S.board){ var j = left.indexOf(S.board.id); if (j >= 0) left.splice(j, 1); }
  return left;
}
function inPotCount(id){ return S.inPot.filter(function(p){ return p.id === id; }).length; }
function renderNeeds(){
  var have = {}, h = '';
  S.r.needs.forEach(function(id){ have[id] = (have[id] || 0) + 1; });
  Object.keys(have).forEach(function(id){
    var n = have[id], got = Math.min(n, inPotCount(id)), f = FOOD[id], prep = f.cuts ? (f.verb ? f.verb + 'ed' : 'chopped') : 'whole';
    if (f.verb === 'crack') prep = 'cracked';
    h += '<li class="' + (got >= n ? 'ok' : '') + '">' + ico(id) + (n > 1 ? n + ' ' : '') + f.n + (n > 1 && !/s$/.test(f.n) ? (f.n === 'tomato' || f.n === 'potato' ? 'es' : 's') : '') + ' <small>(' + prep + ')</small>' + (got >= n ? ' ✓' : '') + '</li>';
  });
  h += '<li>' + SALTI + (S.r.salt ? S.r.salt + ' pinch' + (S.r.salt > 1 ? 'es' : '') : 'no salt') + '</li>';
  $('needs').innerHTML = h;
}
function renderShelf(){
  var want = need(), h = '';
  ORDER.forEach(function(id){ h += '<button type="button" class="food' + (want.indexOf(id) >= 0 ? ' want' : '') + '" data-id="' + id + '" aria-label="' + FOOD[id].n + (want.indexOf(id) >= 0 ? ', in tonight\'s recipe' : '') + '">' + ico(id) + '<span>' + FOOD[id].n + '</span></button>'; });
  $('shelf').innerHTML = h;
}
function renderBoard(){
  var b = S.board, el = $('board');
  if (!b){ el.innerHTML = '<p class="empty">The board is empty. Tap something in the fridge.</p>'; }
  else {
    var f = FOOD[b.id], done = b.cuts >= f.cuts, verb = f.verb || 'chop', lab = !f.cuts ? 'goes in whole' : done ? (verb === 'crack' ? 'cracked' : verb === 'grate' ? 'grated' : 'chopped') + ', ready' : 'tap to ' + verb + ' (' + b.cuts + '/' + f.cuts + ')';
    el.innerHTML = '<svg class="knife" viewBox="0 0 30 80" aria-hidden="true"><rect x="11" y="44" width="8" height="32" rx="3" fill="#6b4226"/><path d="M11 46 v-40 q8 4 8 18 v22z" fill="#cfd6dc" stroke="#5d6670" stroke-width="2"/></svg>' +
      '<button type="button" class="item" id="item" aria-label="' + f.n + ': ' + lab + '">' + ico(b.id, done && f.cuts > 0) + '<span class="cuts">' + lab + '</span></button>';
  }
  $('add').disabled = !b; $('back').disabled = !b;
}
function potColour(){
  var c = S.cook, base = S.r.pot === 'pan' ? [70, 74, 80] : [214, 196, 160];
  if (S.inPot.length){ var tint = S.r.id === 'pancakes' ? [236, 196, 112] : S.r.id === 'soup' ? [200, 70, 45] : S.r.id === 'stirfry' ? [214, 140, 60] : S.r.id === 'rice' ? [196, 150, 110] : [222, 186, 110]; base = tint; }
  var k = c > 100 ? Math.min(1, (c - 100) / 30) : 0, burnt = [45, 35, 30];
  var lift = Math.min(1, c / 80) * .15;
  return 'rgb(' + base.map(function(v, i){ return Math.round((v * (1 - lift) + (i ? 0 : 0)) * (1 - k) + burnt[i] * k); }).join(',') + ')';
}
function renderPot(){
  var v = $('vessel'), stuff = S.r.flip && S.cook > 0 ? '' : S.inPot.map(function(p){ return ico(p.id, p.cut); }).slice(0, 10).join('');
  v.innerHTML = vesselSvg(S.r.pot, potColour()) + '<span class="stuff">' + stuff + '</span>';
}
function stateWord(){
  var c = S.cook, z = S.r.zone;
  if (!S.inPot.length) return 'empty';
  if (S.r.flip) return (S.side ? 'side 2: ' : 'side 1: ') + stateWord0(c, z);
  return stateWord0(c, z);
}
function stateWord0(c, z){
  if (c > 100) return 'burnt!';
  if (c > z[1]) return 'overdone';
  if (c >= z[0]) return 'just right';
  if (c > z[0] * .6) return 'nearly';
  if (c > 2) return 'warming up';
  return 'raw';
}
function renderMeter(){
  var c = Math.min(130, S.cook), pc = c / 130 * 100;
  $('fill').style.width = pc + '%'; $('tick').style.left = pc + '%';
  $('meter').setAttribute('aria-valuenow', Math.round(c)); $('meter').setAttribute('aria-valuetext', stateWord());
  $('state').textContent = stateWord();
  var hob = $('hob'); hob.classList.toggle('hot', S.heat); hob.classList.toggle('cooking', S.heat && S.inPot.length > 0); hob.classList.toggle('burnt', S.cook > 100);
  if (S.r.pot === 'pan' && !S.r.flip){ var st = $('stir'); st.firstChild.style.width = Math.max(0, S.stir) + '%'; st.classList.toggle('low', S.stir < 25); $('stirtxt').textContent = S.stir < 25 ? 'sticking! tap the pan' : 'tap the pan to stir'; }
  $('pinch').textContent = S.salt;
  $('serve').disabled = !S.inPot.length;
}
var lastHint = '';
function hint(){
  var t, b = S.board, left = need(), z = S.r.zone, pot = S.r.pot === 'pan' ? 'pan' : 'pot';
  if (b){ var f = FOOD[b.id]; if (b.cuts < f.cuts) t = 'Tap the <b>' + f.n + '</b> on the board to ' + (f.verb || 'chop') + ' it.'; else t = 'Now slide the ' + f.n + ' <b>into the ' + pot + '</b>.'; }
  else if (left.length) t = 'Grab ' + (/^[aeiou]/.test(FOOD[left[0]].n) ? 'an ' : 'a ') + '<b>' + FOOD[left[0]].n + '</b> from the fridge.';
  else if (!S.heat && S.cook < z[0]) t = 'Everything\'s in. Turn on the <b>heat</b>.';
  else if (S.r.flip && !S.side) t = S.cook < z[0] ? 'Wait for little bubbles on top, then <b>flip it</b>.' : S.cook <= z[1] ? 'Bubbles! <b>Flip it</b> now.' : 'The bottom\'s getting dark, <b>flip it</b>!';
  else if (S.cook < z[0]) t = S.r.flip ? 'Second side cooking, nearly there.' : S.r.pot === 'pan' ? 'Cooking… keep <b>stirring</b> so nothing sticks.' : 'Simmering… add your <b>salt</b> while you wait.';
  else if (S.cook <= z[1]) t = S.salt < S.r.salt ? 'Just right! Salt it (' + S.r.salt + ' pinch' + (S.r.salt > 1 ? 'es' : '') + ') and <b>serve</b>.' : 'Just right! <b>Serve</b> it now.';
  else if (S.cook <= 100) t = 'It\'s going over, <b>serve</b> it quick!';
  else t = 'Oh no, it\'s burning. Serve it anyway, or be brave.';
  if (t !== lastHint){ $('hint').innerHTML = t; lastHint = t; }
}
function renderAll(){ renderNeeds(); renderShelf(); renderBoard(); renderPot(); renderMeter(); hint(); }

/* ---- actions ---- */
$('shelf').addEventListener('click', function(e){
  var b = e.target.closest('.food'); if (!b) return;
  if (S.board){ S.board = { id:b.dataset.id, cuts:0 }; } else S.board = { id:b.dataset.id, cuts:0 };
  tick(520, .05, 'triangle'); renderBoard(); renderShelf(); hint();
  var it = $('item'); if (it) it.focus({ preventScroll:true });
});
$('board').addEventListener('click', function(e){
  var it = e.target.closest('#item'); if (!it || !S.board) return;
  var f = FOOD[S.board.id]; if (S.board.cuts >= f.cuts) return;
  S.board.cuts++; tick(f.verb === 'crack' ? 300 : 900 + Math.random() * 200, .04, 'square', .04);
  renderBoard(); hint(); var n = $('item'); if (n){ n.focus({ preventScroll:true }); if (!RM){ n.classList.add('chop'); } }
});
$('add').addEventListener('click', function(){
  if (!S.board) return; var f = FOOD[S.board.id];
  S.inPot.push({ id:S.board.id, cut:S.board.cuts >= f.cuts && f.cuts > 0, whole:f.cuts > 0 && S.board.cuts < f.cuts });
  S.board = null; tick(180, .12, 'sine', .08); renderAll();
});
$('back').addEventListener('click', function(){ S.board = null; renderAll(); });
$('heat').addEventListener('click', function(){ S.heat = !S.heat; this.setAttribute('aria-pressed', S.heat); $('heattxt').textContent = 'heat: ' + (S.heat ? 'on' : 'off'); tick(S.heat ? 140 : 90, .1, 'sawtooth', .04); renderMeter(); hint(); });
function flip(){ if (!S.r.flip || S.side || !S.inPot.length) return; S.sideA = S.cook; S.cook = 0; S.side = 1; $('flip').disabled = true; $('flip').textContent = 'flipped ✓';
  tick(420, .08, 'triangle', .06); setTimeout(function(){ tick(200, .1, 'sine', .07); }, 160);
  var v = $('vessel'); if (!RM){ v.classList.remove('flipping'); void v.offsetWidth; v.classList.add('flipping'); } renderPot(); renderMeter(); hint(); }
$('flip').addEventListener('click', flip);
$('vessel').addEventListener('click', function(){ if (S.r.flip){ flip(); return; } if (S.r.pot !== 'pan'){ tick(300, .05, 'sine', .04); return; } S.stir = Math.min(100, S.stir + 34); tick(260 + Math.random() * 80, .06, 'triangle', .05); renderMeter(); hint(); });
$('salt').addEventListener('click', function(){ S.salt++; tick(1500, .03, 'square', .03); renderMeter(); hint(); });
$('serve').addEventListener('click', serve);
$('next').addEventListener('click', function(){ $('done').close(); newDinner(); });

/* ---- the clock: cooking only moves while the heat is on and something is in ---- */
var last = performance.now();
function loop(now){
  var dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S && S.heat && S.inPot.length){
    var rate = 7.5;
    if (S.r.pot === 'pan' && !S.r.flip){ S.stir -= 13 * dt; if (S.stir < 0){ S.stir = 0; rate *= 1.8; S.scorch += dt; } }
    S.cook = Math.min(130, S.cook + rate * dt);
    if (S.cook >= 130 && S.heat){ S.heat = false; $('heat').setAttribute('aria-pressed', 'false'); $('heattxt').textContent = 'heat: off'; }
    renderMeter(); hint();
    if ((now | 0) % 9 === 0) renderPot();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- serving: half stars off for each thing that went wrong, told kindly ---- */
function serve(){
  var r = S.r, notes = [], st = 5, left = r.needs.slice(), extra = [];
  S.inPot.forEach(function(p){ var i = left.indexOf(p.id); if (i >= 0) left.splice(i, 1); else extra.push(p.id); });
  if (left.length){ st -= Math.min(2, left.length); notes.push('missing: ' + left.map(function(id){ return FOOD[id].n; }).join(', ')); }
  if (extra.length){ st -= Math.min(1.5, extra.length * .5); notes.push('a surprise in there: ' + extra.map(function(id){ return FOOD[id].n; }).join(', ')); }
  var lumps = S.inPot.filter(function(p){ return p.whole; });
  if (lumps.length){ st -= Math.min(1.5, lumps.length * .5); notes.push('a whole ' + FOOD[lumps[0].id].n + ' went in (' + (FOOD[lumps[0].id].verb || 'chop') + ' it first)'); }
  var z = r.zone;
  function judge(c){ if (c > 100) return [3, 'burnt']; if (c > z[1]) return [c - z[1] > 10 ? 1.5 : .5, 'a bit overdone']; if (c < z[0]) return [z[0] - c > 15 ? 2 : 1, c < z[0] - 15 ? 'still raw in the middle' : 'a little underdone']; return [0, 'cooked just right']; }
  if (r.flip){
    if (!S.side){ var j0 = judge(S.cook); st -= 2 + j0[0] * .5; notes.push('never flipped, so the top is raw batter'); }
    else { var ja = judge(S.sideA), jb = judge(S.cook); st -= (ja[0] + jb[0]) * .6;
      if (!ja[0] && !jb[0]) notes.push('golden on both sides'); else { notes.push('first side: ' + ja[1].replace('still raw in the middle', 'pale and floppy')); notes.push('second side: ' + jb[1].replace('still raw in the middle', 'still gooey')); } }
  } else { var jj = judge(S.cook); st -= jj[0]; notes.push(jj[1]); }
  var sd = S.salt - r.salt;
  if (sd){ st -= Math.abs(sd) > 1 ? 1 : .5; notes.push(sd > 0 ? 'too salty' : S.salt ? 'needs a pinch more salt' : 'no salt at all'); }
  if (S.scorch > 1.5){ st -= .5; notes.push('stuck to the pan a little'); }
  st = Math.max(.5, Math.round(st * 2) / 2);
  var say = st >= 5 ? ['"This is the best thing I\'ve eaten all week."', '"Can you make this every day?"', '"Wow. Seconds, please."'] :
    st >= 4 ? ['"Mmm, really good!"', '"That hit the spot."', '"Cozy. I love it."'] :
    st >= 3 ? ['"Pretty good, honestly."', '"Not bad at all."', '"Tasty! Mostly."'] :
    st >= 2 ? ['"It\'s… food. Thank you."', '"I\'ll eat it. Brave of you."', '"Interesting choice."'] : ['"Let\'s order pizza."', '"I love you, but no."', '"Is it supposed to be black?"'];
  var line = S.who.indexOf('cat') >= 0 ? (st >= 4 ? 'The cat sniffs it and purrs. High praise.' : 'The cat sniffs it and walks away.') : say[save.dinners % say.length];
  var full = Math.floor(st), half = st % 1 ? 1 : 0;
  $('stars').textContent = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - half);
  $('starsr').textContent = st + ' out of 5 stars';
  $('dtitle').textContent = r.name;
  $('say').textContent = line;
  $('dnotes').innerHTML = notes.map(function(n){ return '<li>' + n + '</li>'; }).join('');
  save.best[r.id] = Math.max(save.best[r.id] || 0, st); save.dinners++; store(); book();
  S.heat = false; tick(660, .12, 'sine', .07); setTimeout(function(){ tick(880, .18, 'sine', .07); }, 120);
  var d = $('done'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  $('next').focus();
}
function book(){
  $('booklist').innerHTML = RECIPES.map(function(r){ var b = save.best[r.id]; return '<li><span>' + r.name + '</span><span>' + (b ? b + ' ★' : '—') + '</span></li>'; }).join('');
  $('book').querySelector('summary').textContent = 'Your cookbook · ' + save.dinners + ' dinner' + (save.dinners === 1 ? '' : 's') + ' served';
}
window.__LS = { get S(){ return S; }, save:save, serve:serve };
newDinner();
})();
