<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuition Book</title>
<meta name="description" content="Today’s classes, attendance, fees, lesson plans and student progress reports — one tutor’s book that stays on your device.">
<meta property="og:title" content="Tuition Book">
<meta property="og:description" content="Open to today’s classes, tick attendance, track fees, plan lessons and print a progress report for every student.">
<meta property="og:url" content="https://sloppy.live/tuition-book/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/open%20navy%20cloth-bound%20ledger%20book%20with%20gold%20lettering%20on%20a%20wooden%20desk%2C%20ruled%20pages%20with%20student%20attendance%20ticks%2C%20pencil%20and%20index%20cards%2C%20warm%20morning%20light%2C%20editorial%20illustration.png?width=1200&height=630&seed=6120&nologo=true&model=flux">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://emojicdn.elk.sh/📒">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Red+Hat+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ecdc; --card:#fffdf6; --ink:#1c2541; --ink2:#4a5373; --rule:rgba(70,100,160,.13);
  --line:#d9d0bb; --accent:#a8380f; --cover:#1c2541; --gold:#ecd08e;
  --ok:#1b6b3e; --okbg:#dcefe1; --warn:#6b4700; --warnbg:#f8e8c2; --bad:#8f1b1f; --badbg:#f7dad7;
  --mute:#3d4565; --mutebg:#e4e7f0; --focus:#1a5fd0;
  --serif:'Gloock',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible','Segoe UI',Tahoma,sans-serif;
  --mono:'Red Hat Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(180deg,transparent 0 1.9rem,var(--rule) 1.9rem 2rem);}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:.6rem 1rem;z-index:9}
.skip:focus{left:1rem}

/* cover */
.cover{background:var(--cover);color:var(--gold);padding:1.1rem 1rem 0;position:relative;
  background-image:radial-gradient(circle at 12% 0,rgba(236,208,142,.12),transparent 40%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px);}
.cover-in{max-width:72rem;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.25rem 1.5rem}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0;letter-spacing:.01em}
.cover h1 span{font-size:.55em;vertical-align:.35em;margin-right:.35rem}
.dateline{margin:0 0 .3rem;color:#f4ead0;font-size:1rem}
.dateline b{font-family:var(--serif);font-weight:400;font-size:1.25rem;color:var(--gold)}
.tabs{max-width:72rem;margin:.9rem auto 0;display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#e9e1c8;padding:.55rem 1rem .7rem;min-height:2.75rem;border-radius:.6rem .6rem 0 0;cursor:pointer;
  font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{background:var(--paper);color:var(--ink)}
@media (max-width:30rem){.tabs{gap:0}.tab{padding:.55rem .6rem .7rem;font-size:.92rem}}

main{max-width:72rem;margin:0 auto;padding:1.25rem 1rem 3rem;overflow-wrap:anywhere}
.sample{max-width:72rem;margin:.9rem auto 0;padding:0 1rem}
.sample p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;background:var(--warnbg);color:var(--warn);
  border:1px dashed #b98a2c;border-radius:.6rem;padding:.5rem .9rem}

h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.1;margin:0}
h3{margin:0;font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.spread{justify-content:space-between}
.muted{color:var(--ink2)}
.mono{font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1rem 1.1rem;
  box-shadow:0 1px 0 rgba(28,37,65,.05),0 .6rem 1.4rem -1rem rgba(28,37,65,.35)}
.stack>*+*{margin-top:1rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.75rem;min-width:2.75rem;padding:.4rem .95rem;
  border:1.5px solid var(--ink);background:var(--card);border-radius:.55rem;cursor:pointer;font-weight:700;text-decoration:none}
.btn:hover{background:#f1ead6}
.btn.primary{background:var(--ink);color:#fffdf6}
.btn.primary:hover{background:#2b3760}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(28,37,65,.07)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:2.75rem;padding:.25rem .7rem;font-size:.9rem}

label.f{display:flex;flex-direction:column;gap:.2rem;font-weight:700;font-size:.9rem}
.f input,.f select,.f textarea,input.in,textarea.in,select.in{font-weight:400;font-size:1rem;min-height:2.75rem;padding:.45rem .6rem;border:1.5px solid #b9b09a;
  border-radius:.45rem;background:#fff;width:100%}
textarea.in,.f textarea{min-height:5.2rem;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.8rem}

.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.8rem;font-weight:700;padding:.12rem .55rem;border-radius:99rem;white-space:nowrap;
  background:var(--mutebg);color:var(--mute)}
.chip.paid{background:var(--okbg);color:var(--ok)}
.chip.partial,.chip.due{background:var(--warnbg);color:var(--warn)}
.chip.overdue{background:var(--badbg);color:var(--bad)}
.chip.subj{background:#e8e0f3;color:#4a2f73}

/* today */
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-bottom:.4rem}
.daynav h2{flex:1 1 auto}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;margin:.2rem 0 1.2rem;color:var(--ink2)}
.summary b{color:var(--ink);font-family:var(--mono)}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:1.1rem}
.cls{border-left:.4rem solid var(--accent);padding:0;overflow:hidden}
.cls-head{padding:.9rem 1.1rem .6rem;display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:baseline;border-bottom:1px solid var(--line)}
.time{font-family:var(--mono);font-weight:600;color:var(--accent)}
.cls-body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.cls-sec{padding:.8rem 1.1rem}
.cls-sec+.cls-sec{border-top:1px dashed var(--line)}
.sec-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem;margin:0 0 .5rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);font-weight:700}
.roll{list-style:none;margin:0;padding:0}
.roll li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.3rem .6rem;padding:.3rem 0;border-bottom:1px solid #eee6d4}
.roll li:last-child{border-bottom:0}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;min-width:0}
.who .btn{padding:.2rem .4rem;font-weight:700;text-align:left}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:.55rem;overflow:hidden}
.seg button{border:0;background:var(--card);min-width:2.75rem;min-height:2.75rem;font-weight:700;cursor:pointer;font-family:var(--mono)}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"][data-m="P"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-m="L"]{background:#8a5a00;color:#fff}
.seg button[aria-pressed="true"][data-m="A"]{background:var(--bad);color:#fff}
.checks{list-style:none;margin:0 0 .5rem;padding:0}
.checks li{display:flex;align-items:center;gap:.4rem;min-height:2.75rem}
.checks label{flex:1;display:flex;align-items:center;gap:.6rem;cursor:pointer;min-height:2.75rem}
.checks input[type=checkbox]{width:1.35rem;height:1.35rem;accent-color:var(--ok);flex:none}
.checks li.done label span{text-decoration:line-through;color:var(--ink2)}
.addcheck{display:flex;gap:.4rem}
.addcheck input{flex:1;min-width:0}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.7rem}
.taught{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;min-height:2.75rem;cursor:pointer}
.taught input{width:1.35rem;height:1.35rem;accent-color:var(--ok)}
.empty{text-align:center;padding:2rem 1rem}
.empty p{margin:.3rem 0 1rem}

/* students */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1rem 0}
.toolbar .in{flex:1 1 14rem;width:auto}
.filters{display:flex;flex-wrap:wrap;gap:.35rem}
.filters button{border:1.5px solid var(--ink);background:var(--card);border-radius:99rem;min-height:2.75rem;padding:.2rem .9rem;cursor:pointer;font-weight:700}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:.8rem;list-style:none;margin:0;padding:0}
.stu h3{font-family:var(--serif);font-weight:400;font-size:1.45rem}
.stats{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.4rem 0 .7rem;font-size:.92rem}
.stats b{font-family:var(--mono)}
.feetable{width:100%;border-collapse:collapse;font-size:.95rem}
.feetable th,.feetable td{padding:.4rem .4rem;border-bottom:1px solid #eee6d4;text-align:left;vertical-align:middle}
.feetable td.num{font-family:var(--mono)}
.payform{display:flex;gap:.35rem;flex-wrap:wrap}
.payform input{width:6.5rem;min-height:2.75rem;padding:.3rem .5rem;border:1.5px solid #b9b09a;border-radius:.45rem}
.tablewrap{overflow-x:auto}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
.day{background:rgba(255,253,246,.7);border:1px solid var(--line);border-radius:.7rem;padding:.5rem;min-height:9rem}
.day.is-today{border:2px solid var(--accent)}
.day h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin:.1rem .2rem .5rem}
.slot{display:block;width:100%;text-align:left;border:0;border-left:.3rem solid var(--accent);background:var(--card);border-radius:.4rem;padding:.45rem .5rem;margin-bottom:.4rem;
  cursor:pointer;box-shadow:0 1px 3px rgba(28,37,65,.15);min-height:2.75rem}
.slot:hover{background:#f8f1de}
.slot .mono{font-size:.8rem;color:var(--accent);font-weight:600;display:block}
.slot b{display:block;line-height:1.2}
.slot small{color:var(--ink2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12rem),1fr));gap:.2rem .8rem;border:1px solid var(--line);border-radius:.5rem;padding:.5rem;max-height:14rem;overflow:auto}
.pick label{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;cursor:pointer}
.pick input{width:1.25rem;height:1.25rem}
@media (max-width:52rem){
  .week{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0}
  .day:not(.has){display:none}
}

/* results */
.drop{border:2px dashed #b9b09a;border-radius:.7rem;padding:1rem;text-align:center;background:rgba(255,255,255,.5)}
.drop.over{border-color:var(--accent);background:#fff4e8}
.prev table,.tests table,.marks table{width:100%;border-collapse:collapse;font-size:.95rem}
.prev th,.prev td,.tests th,.tests td,.marks th,.marks td{padding:.4rem .5rem;border-bottom:1px solid #eee6d4;text-align:left}
.prev td.num,.tests td.num{font-family:var(--mono)}
.warnlist{margin:.3rem 0;padding-left:1.2rem}
.note{border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.marks input{width:6rem;min-height:2.75rem;padding:.3rem .5rem;border:1.5px solid #b9b09a;border-radius:.45rem;font-family:var(--mono)}

/* report */
.report{background:#fffef9;border:1px solid var(--line);border-radius:.8rem;padding:1.4rem 1.5rem;position:relative;overflow:hidden}
.report::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.45rem;background:repeating-linear-gradient(180deg,var(--accent) 0 .7rem,#c8653d .7rem 1.4rem)}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:.6rem}
.rep-head h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:.7rem;margin:1rem 0}
.kpi{border:1px solid var(--line);border-radius:.6rem;padding:.6rem .7rem;background:var(--card)}
.kpi small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--ink2);font-weight:700}
.kpi b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.1}
.kpi span{display:block;font-size:.85rem;color:var(--ink2)}
.rep-lines{margin:.4rem 0 1rem;padding-left:1.2rem}
.rep-lines li{margin:.2rem 0}
.chart{width:100%;height:auto;max-width:44rem;display:block;color:var(--ink)}
.rep-table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.6rem}
.rep-table th,.rep-table td{padding:.35rem .45rem;border-bottom:1px solid #eee6d4;text-align:left}
.rep-table td.num{font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem;color:var(--ink2)}
.legend i{display:inline-block;width:1.4rem;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:.3rem}
.legend i.avg{border-top:2px dashed var(--ink2)}
.rep-comment{margin-top:1rem}
.rep-comment p{white-space:pre-wrap;margin:.2rem 0 0}
.pickstu{display:flex;flex-wrap:wrap;gap:.35rem}
.pickstu button{border:1.5px solid var(--ink);background:var(--card);border-radius:.5rem;min-height:2.75rem;padding:.2rem .8rem;cursor:pointer;font-weight:700}
.pickstu button[aria-pressed="true"]{background:var(--ink);color:#fff}

#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fffdf6;
  padding:.6rem 1rem;border-radius:.6rem;max-width:calc(100% - 2rem);box-shadow:0 .5rem 1.5rem rgba(0,0,0,.3);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
footer{max-width:72rem;margin:0 auto;padding:0 1rem 2rem;color:var(--ink2);font-size:.85rem}
#buildstamp{display:block;margin-top:.4rem;font-family:var(--mono);font-size:.7rem;opacity:.75}
#printArea{display:none}
main:focus{outline:none}

.view{animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
.classes>*{animation:rise .4s ease-out both}
.classes>*:nth-child(2){animation-delay:.07s}.classes>*:nth-child(3){animation-delay:.14s}.classes>*:nth-child(4){animation-delay:.21s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .report{border:0;border-radius:0;padding:0 0 0 1rem;break-after:page;box-shadow:none}
  .report:last-child{break-after:auto}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="cover">
  <div class="cover-in">
    <h1><span aria-hidden="true">📒</span>Tuition Book</h1>
    <p class="dateline" id="dateline"></p>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab" data-view="today">Today</button>
    <button type="button" class="tab" data-view="students">Students</button>
    <button type="button" class="tab" data-view="schedule">Schedule</button>
    <button type="button" class="tab" data-view="results">Results</button>
    <button type="button" class="tab" data-view="book">Book</button>
  </nav>
</header>
<div class="sample" id="sampleBar" hidden>
  <p><span><b>Sample book.</b> These students are made up so you can try everything.</span>
  <button type="button" class="btn sm" id="startOwn">Start my own book</button></p>
</div>
<main id="main" tabindex="-1"></main>
<footer>
  Everything stays in this browser on this device — nothing is uploaded. Use <b>Book → Download backup</b> to keep a copy.
  <span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-09-23 · pending</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>
<script id="engine">
(function (root) {
  'use strict';
  /* Tuition Book engine — pure, no DOM, no storage, no network. */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = s => parseYmd(s).getDay();
  const monthOf = s => String(s).slice(0, 7);
  const addMonths = (mk, n) => {
    let [y, m] = mk.split('-').map(Number); m += n;
    while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
    return y + '-' + pad(m);
  };
  const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
  const fromMin = x => { x = ((x % 1440) + 1440) % 1440; return pad(Math.floor(x / 60)) + ':' + pad(x % 60); };
  const round1 = x => Math.round(x * 10) / 10;
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

  let seq = 0;
  const uid = p => (p || 'x') + Date.now().toString(36) + (seq++).toString(36);

  function blank() {
    return { v: 1, settings: { currency: '', dueDay: 10 }, students: [], classes: [],
      attendance: {}, fees: {}, plans: {}, tests: [], sample: false };
  }

  /* ── schedule ── */
  function classesOn(st, day) {
    const d = dow(day);
    return st.classes.filter(c => c.day === d && (!c.from || c.from <= day))
      .sort((a, b) => toMin(a.start) - toMin(b.start) || a.title.localeCompare(b.title));
  }
  function nextClassDay(st, day, limit) {
    for (let i = 1; i <= (limit || 14); i++) { const d = addDays(day, i); if (classesOn(st, d).length) return d; }
    return null;
  }
  const endTime = c => fromMin(toMin(c.start) + (Number(c.dur) || 60));

  /* ── attendance ── */
  const MARKS = ['P', 'L', 'A'];
  const akey = (cid, day) => cid + '|' + day;
  function setAttendance(st, cid, day, sid, mark) {
    const k = akey(cid, day);
    if (!MARKS.includes(mark)) { if (st.attendance[k]) delete st.attendance[k][sid]; return; }
    (st.attendance[k] = st.attendance[k] || {})[sid] = mark;
  }
  const getAttendance = (st, cid, day, sid) => (st.attendance[akey(cid, day)] || {})[sid] || null;
  function attendanceStats(st, sid, upto) {
    const r = { P: 0, L: 0, A: 0, total: 0, rate: null };
    for (const k in st.attendance) {
      const day = k.slice(k.indexOf('|') + 1);
      if (upto && day > upto) continue;
      const m = st.attendance[k][sid];
      if (MARKS.includes(m)) { r[m]++; r.total++; }
    }
    if (r.total) r.rate = round1((r.P + r.L) / r.total * 100);
    return r;
  }

  /* ── fees ── */
  function feeStatus(st, sid, mk, today) {
    const s = st.students.find(x => x.id === sid);
    const cur = monthOf(today);
    const e = (st.fees[sid] || {})[mk];
    const paid = e ? e.paid : 0;
    if (!s || !(Number(s.fee) > 0) || (s.joined && monthOf(s.joined) > mk))
      return { month: mk, due: 0, paid, balance: 0, status: 'none', late: false };
    const due = Number(s.fee);
    const balance = Math.max(0, round1(due - paid));

  const FEE_LABEL = { paid: 'Paid', partial: 'Part-paid', due: 'Due', overdue: 'Overdue', upcoming: 'Upcoming', none: 'No fee' };
  const ATT_LABEL = { P: 'Present', L: 'Late', A: 'Absent' };

  let realToday = E.ymd(new Date());
  let day = realToday;
  let view = 'today';
  let st;
  const ui = { editStudent: null, editClass: null, stuQuery: '', stuFilter: 'all', importPlan: null, importOpts: null,
    manual: null, reportFor: null, openFees: null };

  /* ── storage ── */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); if (!E.validate(o)) return o; }
    } catch (e) { /* storage unavailable or corrupt: fall through */ }
    return E.sample(realToday);
  }
  let saveT = 0, saveWarned = false;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(st)); }
      catch (e) { if (!saveWarned) { saveWarned = true; toast('Could not save in this browser — download a backup from Book.'); } }
    }, 250);
  }
  function commit() { save(); render(); }

  /* ── dom helper ── */
  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(x => append(el, x)); return; }
    el.append(c.nodeType ? c : String(c));
  }
  const $ = s => document.querySelector(s);
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
  }

  /* one arm-then-confirm gate for every destructive action */
  const gate = { btn: null, label: '', timer: 0 };
  function disarm() {
    if (!gate.btn) return;
    gate.btn.textContent = gate.label; gate.btn.classList.remove('armed'); clearTimeout(gate.timer); gate.btn = null;
  }
  function armed(btn, confirmText, fn) {
    if (gate.btn === btn) { disarm(); fn(); return; }
    disarm();
    gate.btn = btn; gate.label = btn.textContent; btn.textContent = confirmText; btn.classList.add('armed');
    gate.timer = setTimeout(disarm, 5000);
  }
  document.addEventListener('click', e => { if (gate.btn && !gate.btn.contains(e.target)) disarm(); }, true);

  const stu = id => st.students.find(s => s.id === id);
  const byName = (a, b) => a.name.localeCompare(b.name);
  const longDate = d => E.parseYmd(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const shortDate = d => d ? E.parseYmd(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—';
  const money = x => E.money(st, x);
  function feeChip(f, extra) {
    return h('span', { class: 'chip ' + f.status }, FEE_LABEL[f.status] + (extra || ''));
  }
  function studentFee(sid) {
    const cur = E.feeStatus(st, sid, E.monthOf(realToday), realToday);
    const owed = E.outstanding(st, sid, realToday);
    return { cur, owed };
  }
  function feeBadge(sid) {
    const { cur, owed } = studentFee(sid);
    if (cur.status === 'none') return h('span', { class: 'chip' }, 'No fee');
    if (owed.amount > 0) {
      const late = owed.months.some(m => E.feeStatus(st, sid, m, realToday).status === 'overdue');
      return h('span', { class: 'chip ' + (late ? 'overdue' : 'due') }, (late ? 'Overdue ' : 'Due ') + money(owed.amount));
    }
    return feeChip(cur);
  }
  function go(v, focus) {
    view = v;
    render();
    if (focus !== false) $('#main').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* ── render ── */
  function render() {
    disarm();
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
    $('#sampleBar').hidden = !st.sample;
    const dl = $('#dateline'); dl.textContent = '';
    dl.append(h('b', null, longDate(realToday)));
    const n = E.classesOn(st, realToday).length;
    dl.append(' · ' + (n ? n + ' class' + (n > 1 ? 'es' : '') + ' today' : 'no classes today'));
    const main = $('#main'); main.textContent = '';
    const fn = { today: viewToday, students: viewStudents, schedule: viewSchedule, results: viewResults, book: viewBook }[view] || viewToday;
    const node = fn(); node.classList.add('view'); main.append(node);
  }

  /* ════ TODAY ════ */
  function viewToday() {
    const list = E.classesOn(st, day);
    const isToday = day === realToday;
    const wrap = h('section', { 'aria-labelledby': 'dayTitle' });
    wrap.append(h('div', { class: 'daynav' },
      h('h2', { id: 'dayTitle' }, isToday ? 'Today’s classes' : longDate(day)),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', 'aria-label': 'Previous day', onclick: () => { day = E.addDays(day, -1); render(); } }, '‹'),
        isToday ? null : h('button', { type: 'button', class: 'btn', onclick: () => { day = realToday; render(); } }, 'Back to today'),
        h('button', { type: 'button', class: 'btn', 'aria-label': 'Next day', onclick: () => { day = E.addDays(day, 1); render(); } }, '›'))));
    const pupils = new Set(); list.forEach(c => c.students.forEach(s => pupils.add(s)));
    const owing = st.students.filter(s => E.outstanding(st, s.id, realToday).months.some(m => E.feeStatus(st, s.id, m, realToday).status === 'overdue')).length;
    const planned = list.filter(c => { const p = E.getPlan(st, c.id, day); return p.objective || p.activities || p.checklist.length; }).length;
    wrap.append(h('p', { class: 'summary' },
      h('span', null, isToday ? '' : longDate(day).split(' ')[0] + ' · ', h('b', null, String(list.length)), ' class' + (list.length === 1 ? '' : 'es')),
      h('span', null, h('b', null, String(pupils.size)), ' student' + (pupils.size === 1 ? '' : 's')),
      list.length ? h('span', null, h('b', null, planned + '/' + list.length), ' planned') : null,
      owing ? h('button', { type: 'button', class: 'btn ghost sm', onclick: () => { ui.stuFilter = 'fees'; go('students'); } }, h('b', null, String(owing)), ' with overdue fees →') : null));
    if (!list.length) {
      const next = E.nextClassDay(st, day);
      wrap.append(h('div', { class: 'card empty' },
        h('h3', null, 'No classes on ' + (isToday ? 'today' : longDate(day))),
        h('p', { class: 'muted' }, st.classes.length ? 'Enjoy the gap — or plan ahead.' : 'Add your weekly classes and they will show up here each day.'),
        h('div', { class: 'row', style: 'justify-content:center' },
          next ? h('button', { type: 'button', class: 'btn primary', onclick: () => { day = next; render(); } }, 'Next class: ' + longDate(next)) : null,
          h('button', { type: 'button', class: 'btn', onclick: () => { ui.editClass = 'new'; go('schedule'); } }, '+ Add a class'))));
      return wrap;
    }
    const grid = h('div', { class: 'classes' });
    list.forEach(c => grid.append(classCard(c)));
    wrap.append(grid);
    return wrap;
  }

  function classCard(c) {
    const card = h('article', { class: 'card cls', 'aria-labelledby': 'ct-' + c.id, 'data-class': c.id });
    const kids = c.students.map(stu).filter(Boolean).sort(byName);
    const marked = kids.filter(s => E.getAttendance(st, c.id, day, s.id)).length;
    card.append(h('div', { class: 'cls-head' },
      h('span', { class: 'time' }, c.start + '–' + E.endTime(c)),
      h('h3', { id: 'ct-' + c.id }, c.title),
      c.subject ? h('span', { class: 'chip subj' }, c.subject) : null));
    const body = h('div', { class: 'cls-body' });
    // attendance
    const att = h('section', { class: 'cls-sec', 'aria-label': 'Attendance for ' + c.title });
    const counter = h('span', { class: 'att-count' }, marked + '/' + kids.length + ' marked');
    att.append(h('h4', { class: 'sec-title' }, h('span', null, 'Attendance · ', counter),
      kids.length ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => {
        kids.forEach(s => { if (!E.getAttendance(st, c.id, day, s.id)) E.setAttendance(st, c.id, day, s.id, 'P'); });
        commit(); toast('Everyone unmarked is now present.');
      } }, 'Mark rest present') : null));
    if (!kids.length) att.append(h('p', { class: 'muted' }, 'No students in this class yet — add them in Schedule.'));
    const roll = h('ul', { class: 'roll' });
    kids.forEach(s => {
      const cur = E.getAttendance(st, c.id, day, s.id);
      const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Attendance for ' + s.name });
      ['P', 'L', 'A'].forEach(m => seg.append(h('button', { type: 'button', 'data-m': m, 'aria-pressed': String(cur === m), title: ATT_LABEL[m],
        'aria-label': ATT_LABEL[m], onclick: () => {
          const now = E.getAttendance(st, c.id, day, s.id);
          E.setAttendance(st, c.id, day, s.id, now === m ? null : m);
          save();
          seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(E.getAttendance(st, c.id, day, s.id) === b.dataset.m)));
          counter.textContent = kids.filter(k => E.getAttendance(st, c.id, day, k.id)).length + '/' + kids.length + ' marked';
        } }, m)));
      const { owed } = studentFee(s.id);
      roll.append(h('li', null,
        h('span', { class: 'who' },
          h('button', { type: 'button', class: 'btn ghost', onclick: () => { ui.editStudent = s.id; ui.openFees = s.id; go('students'); } }, s.name),
          owed.amount > 0 ? feeBadge(s.id) : null),
        seg));
    });
    att.append(roll);
    body.append(att);
    body.append(planSection(c));
    card.append(body);
    return card;
  }

  function planSection(c) {
    const sec = h('section', { class: 'cls-sec', 'aria-label': 'Lesson plan for ' + c.title });
    const p = E.getPlan(st, c.id, day);
    const empty = !p.objective && !p.activities && !p.homework && !p.checklist.length;
    const last = empty ? E.lastPlan(st, c.id, day) : null;
    const prog = E.checkProgress(p);
    sec.append(h('h4', { class: 'sec-title' }, h('span', null, 'Lesson plan' + (prog.total ? ' · ' + prog.done + '/' + prog.total + ' ticked' : '')),
      last ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { E.copyPlan(st, c.id, last.day, day); commit(); toast('Copied the plan from ' + shortDate(last.day) + '.'); } }, 'Copy plan from ' + shortDate(last.day)) : null));
    const field = (key, label, tag) => {
      const id = 'pl-' + key + '-' + c.id;
      const input = h(tag || 'textarea', { id, class: 'in', value: p[key], rows: tag ? null : 3, maxlength: 2000,
        placeholder: key === 'objective' ? 'What should students be able to do by the end?' : key === 'activities' ? 'Warm-up, teaching, practice… one per line' : 'What to do before next class',
        oninput: e => { E.setPlan(st, c.id, day, { [key]: e.target.value }); save(); } });
      return h('label', { class: 'f', for: id }, label, input);
    };
    sec.append(h('div', { class: 'plan-grid' }, field('objective', 'Objectives'), field('activities', 'Activities')));
    // checklist
    const listId = 'ck-' + c.id;
    sec.append(h('p', { class: 'f', style: 'margin:.8rem 0 .3rem', id: listId + '-l' }, 'Checklist'));
    const ul = h('ul', { class: 'checks', 'aria-labelledby': listId + '-l' });
    p.checklist.forEach((item, i) => {
      const cid = listId + '-' + i;
      ul.append(h('li', { class: item.done ? 'done' : '' },
        h('label', { for: cid }, h('input', { type: 'checkbox', id: cid, checked: item.done, onchange: () => { E.toggleCheck(st, c.id, day, i); commit(); } }), h('span', null, item.text)),
        h('button', { type: 'button', class: 'btn ghost sm', 'aria-label': 'Remove “' + item.text + '”', onclick: () => { E.removeCheck(st, c.id, day, i); commit(); } }, '✕')));
    });
    sec.append(ul);
    const addIn = h('input', { class: 'in', type: 'text', maxlength: 120, placeholder: 'Add a to-do, e.g. print worksheets', 'aria-label': 'New checklist item for ' + c.title });
    sec.append(h('form', { class: 'addcheck', onsubmit: e => {
      e.preventDefault();
      if (E.addCheck(st, c.id, day, addIn.value)) { commit(); const again = document.querySelector('[data-class="' + c.id + '"] .addcheck input'); if (again) again.focus(); }
    } }, addIn, h('button', { type: 'submit', class: 'btn' }, 'Add')));
    sec.append(h('div', { class: 'plan-grid', style: 'margin-top:.7rem' }, field('homework', 'Homework', 'input')));
    const tid = 'taught-' + c.id;
    sec.append(h('label', { class: 'taught', for: tid }, h('input', { type: 'checkbox', id: tid, checked: p.done, onchange: e => { E.setPlan(st, c.id, day, { done: e.target.checked }); save(); } }), 'Lesson taught'));
    return sec;
  }

  /* ════ STUDENTS ════ */
  function viewStudents() {
    const wrap = h('section', { 'aria-labelledby': 'stuTitle' });
    wrap.append(h('div', { class: 'row spread' }, h('h2', { id: 'stuTitle' }, 'Students'),
      h('button', { type: 'button', class: 'btn primary', onclick: () => { ui.editStudent = 'new'; render(); } }, '+ Add student')));
    if (ui.editStudent) wrap.append(studentEditor(ui.editStudent));
    const q = h('input', { class: 'in', type: 'search', placeholder: 'Search by name or level', 'aria-label': 'Search students', value: ui.stuQuery,
      oninput: e => { ui.stuQuery = e.target.value; drawList(); } });
    const filt = h('div', { class: 'filters', role: 'group', 'aria-label': 'Filter students' });
    [['all', 'All'], ['fees', 'Fees owed'], ['att', 'Attendance under 75%']].forEach(([k, l]) => filt.append(h('button', { type: 'button', 'aria-pressed': String(ui.stuFilter === k),
      onclick: e => { ui.stuFilter = k; filt.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); drawList(); } }, l)));
    wrap.append(h('div', { class: 'toolbar' }, q, filt));
    const count = h('p', { class: 'muted', 'aria-live': 'polite' });
    const ul = h('ul', { class: 'slist' });
    wrap.append(count, ul);
    function drawList() {
      ul.textContent = '';
      const term = ui.stuQuery.trim().toLowerCase();
      const rows = st.students.slice().sort(byName).filter(s => {
        if (term && !(s.name.toLowerCase().includes(term) || (s.level || '').toLowerCase().includes(term))) return false;
        if (ui.stuFilter === 'fees') return E.outstanding(st, s.id, realToday).amount > 0;
        if (ui.stuFilter === 'att') { const a = E.attendanceStats(st, s.id, realToday); return a.rate != null && a.rate < 75; }
        return true;
      });
      count.textContent = rows.length + ' of ' + st.students.length + ' student' + (st.students.length === 1 ? '' : 's');
      if (!st.students.length) ul.append(h('li', { class: 'card empty' }, h('h3', null, 'No students yet'), h('p', { class: 'muted' }, 'Add them one by one, or import a marks CSV in Results and add the new names from there.')));
      rows.forEach(s => {
        const a = E.attendanceStats(st, s.id, realToday);
        const cls = st.classes.filter(c => c.students.includes(s.id));
        ul.append(h('li', { class: 'card stu', 'data-stu': s.id },
          h('div', { class: 'row spread' }, h('h3', null, s.name), feeBadge(s.id)),
          h('p', { class: 'stats' },
            s.level ? h('span', null, s.level) : null,
            h('span', null, 'Attendance ', h('b', null, a.rate == null ? '—' : a.rate + '%')),
            h('span', null, h('b', null, String(cls.length)), ' class' + (cls.length === 1 ? '' : 'es'))),
          h('div', { class: 'row' },
            h('button', { type: 'button', class: 'btn sm', onclick: () => { ui.reportFor = s.id; go('results'); } }, 'Report'),
            h('button', { type: 'button', class: 'btn sm', onclick: () => { ui.editStudent = s.id; ui.openFees = s.id; render(); $('#main').scrollIntoView(); } }, 'Fees & details'))));
      });
    }
    drawList();
    return wrap;
  }

  function studentEditor(id) {
    const isNew = id === 'new';
    const s = isNew ? { name: '', level: '', fee: '', guardian: '', notes: '', joined: realToday } : stu(id);
    if (!s) { ui.editStudent = null; return h('div'); }
    const card = h('section', { class: 'card stack', 'aria-labelledby': 'edTitle', style: 'margin:1rem 0' });
    card.append(h('h3', { id: 'edTitle' }, isNew ? 'New student' : s.name));
    const f = {
      name: h('input', { maxlength: 60, value: s.name, autocomplete: 'off' }),
      level: h('input', { maxlength: 40, value: s.level || '', placeholder: 'e.g. Grade 9' }),
      fee: h('input', { type: 'number', min: 0, step: 'any', inputmode: 'decimal', value: s.fee || '', placeholder: '0 = no fee' }),
      joined: h('input', { type: 'date', value: s.joined || '' }),
      guardian: h('input', { maxlength: 80, value: s.guardian || '', placeholder: 'Parent / guardian name' }),
      notes: h('textarea', { maxlength: 1000, value: s.notes || '', rows: 2 })
    };
    const err = h('p', { class: 'note bad', role: 'alert', hidden: true });
    card.append(h('form', { class: 'stack', onsubmit: e => {
      e.preventDefault();
      const name = f.name.value.trim();
      if (!name) { err.textContent = 'A name is needed.'; err.hidden = false; f.name.focus(); return; }
      const fee = Number(f.fee.value || 0);
      if (!(fee >= 0)) { err.textContent = 'Monthly fee must be 0 or more.'; err.hidden = false; f.fee.focus(); return; }
      const rec = isNew ? { id: E.uid('s'), comment: '' } : s;
      Object.assign(rec, { name: name.slice(0, 60), level: f.level.value.trim().slice(0, 40), fee: Math.round(fee * 100) / 100,
        joined: f.joined.value || realToday, guardian: f.guardian.value.trim().slice(0, 80), notes: f.notes.value.slice(0, 1000) });
      if (isNew) st.students.push(rec);
      ui.editStudent = isNew ? null : rec.id;
      commit(); toast(isNew ? rec.name + ' added.' : 'Saved.');
    } },
    h('div', { class: 'grid2' },
      h('label', { class: 'f' }, 'Name', f.name), h('label', { class: 'f' }, 'Level / grade', f.level),
      h('label', { class: 'f' }, 'Monthly fee' + (st.settings.currency ? ' (' + st.settings.currency + ')' : ''), f.fee), h('label', { class: 'f' }, 'Joined', f.joined),
      h('label', { class: 'f' }, 'Guardian', f.guardian)),
    h('label', { class: 'f' }, 'Notes', f.notes), err,
    h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary' }, isNew ? 'Add student' : 'Save details'),
      h('button', { type: 'button', class: 'btn ghost', onclick: () => { ui.editStudent = null; render(); } }, 'Close'),
      isNew ? null : h('button', { type: 'button', class: 'btn danger', style: 'margin-left:auto', onclick: e => armed(e.currentTarget, 'Tap again to delete ' + s.name, () => {
        st.students = st.students.filter(x => x.id !== s.id);
        st.classes.forEach(c => { c.students = c.students.filter(x => x !== s.id); });
        st.tests.forEach(t => { delete t.marks[s.id]; });
        for (const k in st.attendance) delete st.attendance[k][s.id];
        delete st.fees[s.id];
        ui.editStudent = null; commit(); toast(s.name + ' removed with their records.');
      }) }, 'Delete student'))));
    if (!isNew) card.append(feeSection(s));
    setTimeout(() => { if (isNew) f.name.focus(); }, 0);
    return card;
  }

  function feeSection(s) {
    const sec = h('section', { 'aria-labelledby': 'feeT' });
    sec.append(h('h4', { class: 'sec-title', id: 'feeT' }, 'Fees · last six months'));
    if (!(Number(s.fee) > 0)) { sec.append(h('p', { class: 'muted' }, 'No monthly fee set — add one above to track payments.')); return sec; }
    const owed = E.outstanding(st, s.id, realToday);
    sec.append(h('p', { class: owed.amount > 0 ? 'note warn' : 'note ok' }, owed.amount > 0 ? 'Outstanding: ' + money(owed.amount) + ' (' + owed.months.map(E.fmtMonth).join(', ') + ')' : 'All fees paid up to date.'));
    const tb = h('tbody');
    E.feeHistory(st, s.id, realToday, 6).reverse().forEach(f => {
      const amt = h('input', { type: 'number', min: 0, step: 'any', inputmode: 'decimal', 'aria-label': 'Amount received for ' + E.fmtMonth(f.month), placeholder: String(f.balance || '') });
      tb.append(h('tr', { 'data-month': f.month },
        h('td', null, E.fmtMonth(f.month)),
        h('td', null, feeChip(f)),
        h('td', { class: 'num' }, money(f.paid) + ' / ' + money(f.due)),
        h('td', null, f.status === 'paid' ? h('button', { type: 'button', class: 'btn sm ghost', onclick: e => armed(e.currentTarget, 'Tap again to clear', () => { E.clearPayments(st, s.id, f.month); commit(); }) }, 'Clear')
          : h('form', { class: 'payform', onsubmit: e => {
            e.preventDefault();
            const v = amt.value === '' ? f.balance : Number(amt.value);
            if (!E.recordPayment(st, s.id, f.month, v, realToday)) { toast('Enter an amount above 0.'); amt.focus(); return; }
            commit(); toast('Recorded ' + money(v) + ' for ' + E.fmtMonth(f.month) + '.');
          } }, amt, h('button', { type: 'submit', class: 'btn sm' }, 'Record'))),
      ));
    });
    sec.append(h('div', { class: 'tablewrap' }, h('table', { class: 'feetable' },
      h('thead', null, h('tr', null, h('th', null, 'Month'), h('th', null, 'Status'), h('th', null, 'Paid'), h('th', null, 'Payment'))), tb)));
    sec.append(h('p', { class: 'muted', style: 'font-size:.85rem' }, 'Leave the amount empty to record the full balance. Fees count as overdue after day ' + st.settings.dueDay + ' of the month.'));
    return sec;
  }

  /* ════ SCHEDULE ════ */
  function viewSchedule() {
    const wrap = h('section', { 'aria-labelledby': 'schTitle' });
    wrap.append(h('div', { class: 'row spread' }, h('h2', { id: 'schTitle' }, 'Weekly schedule'),

      h('thead', null, h('tr', null, ['Date', 'Test', 'Subject', 'Mark', '%', 'Class avg'].map(x => h('th', null, x)))),
      h('tbody', null, p.tests.map(t => h('tr', null, h('td', null, shortDate(t.date)), h('td', null, t.title), h('td', null, t.subject),
        h('td', { class: 'num' }, t.score + '/' + t.max), h('td', { class: 'num' }, t.pct + '%'), h('td', { class: 'num' }, t.sat > 1 ? t.classAvg + '%' : '—')))))));
    if (p.subjects.length > 1) node.append(h('p', { class: 'muted', style: 'margin:.6rem 0 0' }, 'By subject: ' + p.subjects.map(x => x.subject + ' ' + x.avg + '%').join(' · ')));
    if (!onScreen && s.comment) node.append(h('div', { class: 'rep-comment' }, h('b', null, 'Tutor’s note'), h('p', null, s.comment)));
    return node;
  }

  function chart(p) {
    const NS = 'http://www.w3.org/2000/svg';
    const W = 560, H = 200, L = 36, R = 12, T = 12, B = 30;
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Score percentages over ' + p.tests.length + ' tests: ' + p.tests.map(t => t.title + ' ' + t.pct + '%').join(', '));
    const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.append(e); return e; };
    const x = i => L + (p.tests.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (p.tests.length - 1));
    const y = v => T + (100 - v) / 100 * (H - T - B);
    [0, 50, 100].forEach(v => {
      el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'currentColor', 'stroke-opacity': v === 0 ? .5 : .15 });
      const t = el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'currentColor', 'fill-opacity': .7 }); t.textContent = v + '%';
    });
    const avg = p.tests.filter(t => t.sat > 1);
    if (avg.length > 1) el('polyline', { points: p.tests.map((t, i) => t.sat > 1 ? x(i) + ',' + y(t.classAvg) : null).filter(Boolean).join(' '), fill: 'none', stroke: '#4a5373', 'stroke-width': 2, 'stroke-dasharray': '5 4' });
    el('polyline', { points: p.tests.map((t, i) => x(i) + ',' + y(t.pct)).join(' '), fill: 'none', stroke: '#a8380f', 'stroke-width': 3, 'stroke-linejoin': 'round' });
    p.tests.forEach((t, i) => {
      el('circle', { cx: x(i), cy: y(t.pct), r: 5, fill: '#fffef9', stroke: '#a8380f', 'stroke-width': 2.5 });
      const lab = el('text', { x: x(i), y: H - 10, 'text-anchor': i === 0 ? 'start' : i === p.tests.length - 1 ? 'end' : 'middle', 'font-size': 11, fill: 'currentColor', 'fill-opacity': .75 });
      lab.textContent = shortDate(t.date);
    });
    const wrap = h('figure', { style: 'margin:0 0 .5rem' }, svg,
      h('figcaption', { class: 'legend' }, h('span', null, h('i', { 'aria-hidden': 'true' }), 'Score %'), avg.length > 1 ? h('span', null, h('i', { class: 'avg', 'aria-hidden': 'true' }), 'Class average') : null));
    return wrap;
  }

  function printReports(ids) {
    const area = $('#printArea'); area.textContent = '';
    ids.forEach(id => area.append(reportNode(id, false)));
    try { window.print(); } catch (e) { toast('Printing is blocked here — use Copy as text instead.'); }
  }
  function copyText(t) {
    const done = ok => toast(ok ? 'Report copied.' : 'Copy was blocked — select the report and copy it by hand.');
    let settled = false;
    const finish = ok => { if (!settled) { settled = true; done(ok); } };
    try {
      navigator.clipboard.writeText(t).then(() => finish(true), () => finish(false));
      setTimeout(() => finish(false), 900);
    } catch (e) { finish(false); }
  }

  /* ════ BOOK (settings + backup) ════ */
  function viewBook() {
    const wrap = h('section', { class: 'stack', 'aria-labelledby': 'bkT' });
    wrap.append(h('h2', { id: 'bkT' }, 'Book settings & backup'));
    const cur = h('input', { maxlength: 4, value: st.settings.currency, placeholder: 'e.g. ₹ $ € £' });
    const dueDay = h('input', { type: 'number', min: 1, max: 28, value: st.settings.dueDay });
    wrap.append(h('form', { class: 'card stack', onsubmit: e => {
      e.preventDefault();
      const d = Math.round(Number(dueDay.value));
      if (!(d >= 1 && d <= 28)) { toast('Due day must be 1–28.'); dueDay.focus(); return; }
      st.settings.currency = cur.value.trim().slice(0, 4); st.settings.dueDay = d; commit(); toast('Settings saved.');
    } }, h('h3', null, 'Fees'),
      h('div', { class: 'grid2' }, h('label', { class: 'f' }, 'Currency symbol', cur), h('label', { class: 'f' }, 'Fees are due by day', dueDay)),
      h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary' }, 'Save settings'))));
    const imp = h('input', { type: 'file', accept: '.json,application/json', id: 'bkFile', class: 'sr' });
    const msg = h('p', { 'aria-live': 'polite' });
    let pending = null;
    const replaceBtn = h('button', { type: 'button', class: 'btn danger', hidden: true, onclick: e => armed(e.currentTarget, 'Tap again — this replaces the whole book', () => {
      st = pending; pending = null; commit(); toast('Backup restored.');
    }) }, 'Replace my book with this backup');
    imp.addEventListener('change', () => {
      const fl = imp.files[0]; if (!fl) return;
      const r = new FileReader();
      r.onload = () => {
        let o; try { o = JSON.parse(String(r.result)); } catch (e) { o = null; }
        const why = E.validate(o);
        if (why) { msg.className = 'note bad'; msg.textContent = 'Not restored: ' + why + '.'; replaceBtn.hidden = true; return; }
        pending = o; o.sample = false;
        msg.className = 'note warn'; msg.textContent = 'Backup has ' + o.students.length + ' students, ' + o.classes.length + ' classes and ' + o.tests.length + ' tests.';
        replaceBtn.hidden = false;
      };
      r.readAsText(fl);
    });
    wrap.append(h('section', { class: 'card stack', 'aria-labelledby': 'bkB' }, h('h3', { id: 'bkB' }, 'Backup'),
      h('p', { class: 'muted' }, 'Your book lives only in this browser. Download a backup now and then — and use it to move the book to another device.'),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => saveFile('tuition-book-' + realToday + '.json', JSON.stringify(st, null, 1), 'application/json') }, 'Download backup'),
        h('label', { for: 'bkFile', class: 'btn' }, 'Restore from backup…'), imp),
      msg, replaceBtn));
    wrap.append(h('section', { class: 'card stack', 'aria-labelledby': 'bkS' }, h('h3', { id: 'bkS' }, 'Start over'),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: e => armed(e.currentTarget, 'Tap again to load the sample', () => { st = E.sample(realToday); day = realToday; commit(); toast('Sample book loaded.'); }) }, 'Load the sample book'),
        h('button', { type: 'button', class: 'btn danger', onclick: e => armed(e.currentTarget, 'Tap again to erase everything', () => { st = E.blank(); day = realToday; commit(); toast('Book erased — a fresh start.'); }) }, 'Erase everything'))));
    return wrap;
  }

  /* ── boot ── */
  st = load();
  view = 'today'; // the book always opens on today's classes
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  $('#startOwn').addEventListener('click', e => armed(e.currentTarget, 'Tap again — clears the sample', () => {
    st = E.blank(); ui.reportFor = null; commit(); toast('Fresh book. Add a student or a class to begin.'); go('students', false);
  }));
  render();
  save();

  window.__TB = {
    get state() { return st; }, engine: E, render, go,
    setToday(d) { realToday = d; day = d; render(); },
    reset(s) { st = s; render(); },
    get view() { return view; }, get day() { return day; },
    flush() { clearTimeout(saveT); localStorage.setItem(KEY, JSON.stringify(st)); }
  };
})();

</script>
</body>
</html>
