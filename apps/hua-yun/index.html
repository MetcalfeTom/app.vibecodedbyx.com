<style>
:root{
  --red:#a8332a; --deepred:#7c1f18; --gold:#c9a227; --ink:#2b2420; --paper:#f5efe2; --paper2:#efe6d2;

}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:'Noto Serif SC',serif;
  background:var(--paper);
  background-image:

    repeating-linear-gradient(4deg, transparent 0 22px, rgba(43,36,32,.018) 22px 23px),
    repeating-linear-gradient(94deg, transparent 0 26px, rgba(43,36,32,.014) 26px 27px);
}
header{ text-align:center; padding:1.6rem 1rem .6rem; position:relative; }
.brand{ display:flex; align-items:center; justify-content:center; gap:1rem; }
h1{ font-family:'Ma Shan Zheng',cursive; font-size:clamp(2.6rem,9vw,4.2rem); margin:0; color:var(--red); font-weight:400; letter-spacing:.08em; }
.seal{ width:3.1rem; height:3.1rem; background:var(--red); color:var(--paper); border-radius:.3rem;
  display:flex; align-items:center; justify-content:center; font-family:'Ma Shan Zheng',cursive; font-size:1.5rem;
  box-shadow:2px 2px 0 rgba(124,31,24,.35); transform:rotate(3deg); }

.lantern:nth-child(2){ animation-delay:1.2s; font-size:1.1rem; opacity:.8; }
.lantern::before{ content:""; display:block; width:1px; height:1.4rem; background:#9b8a72; margin:0 auto; }
@keyframes sway{ 0%,100%{ transform:rotate(3deg); } 50%{ transform:rotate(-3deg); } }

nav{ display:flex; justify-content:center; gap:.4rem; flex-wrap:wrap; padding:1rem .6rem; position:sticky; top:0;

#musicpane .stage{ background:var(--ink); border-radius:.8rem; padding:1.4rem; color:var(--paper); text-align:center;
  background-image:radial-gradient(ellipse 60% 50% at 50% 100%, rgba(201,162,39,.12), transparent); }

.string{ width:3px; background:linear-gradient(#c9a227aa,#c9a22744); border-radius:2px; height:100%; position:relative; transition:background .2s; }

input[type=range]{ accent-color:var(--gold); }

/* ── culture cards ── */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(14rem,1fr)); gap:.9rem; }

  font-size:5.5rem; color:rgba(168,51,42,.08); pointer-events:none; }

.ccard .en{ font-size:.62rem; color:#9b8a72; letter-spacing:.14em; text-transform:uppercase; }
.ccard p{ font-size:.78rem; line-height:1.9; margin:.5rem 0 0; color:#4a4038; max-height:0; overflow:hidden; transition:max-height .4s ease; }
.ccard.open p{ max-height:14rem; }
.ccard .more{ font-size:.65rem; color:var(--red); margin-top:.4rem; display:inline-block; }

/* ── cities ── */
.citynav{ display:flex; gap:.45rem; flex-wrap:wrap; margin-bottom:1rem; }
.citynav button{ font-family:'Ma Shan Zheng',cursive; font-size:1.05rem; cursor:pointer; min-height:2.75rem;
  background:#fff9ec; border:1px solid rgba(43,36,32,.15); color:var(--ink); border-radius:.5rem; padding:.4rem 1rem; }

.citynav button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

#citycard::before{ content:attr(data-char); position:absolute; right:.4rem; top:-1.4rem; font-family:'Ma Shan Zheng',cursive;
  font-size:7rem; color:rgba(90,125,106,.1); pointer-events:none; }
#citycard h3{ font-family:'Ma Shan Zheng',cursive; font-weight:400; font-size:2rem; margin:0; color:var(--jade); }
#citycard .tag{ font-size:.7rem; color:#8a7d6b; letter-spacing:.2em; }
#citycard dl{ margin:.9rem 0 0; }
#citycard dt{ font-weight:700; font-size:.82rem; color:var(--deepred); margin-top:.7rem; }

/* ── festivals ── */
.fests{ display:grid; gap:1rem; }
.fest{ border-radius:.7rem; padding:1.2rem 1.3rem; color:var(--paper); position:relative; overflow:hidden; }
.fest h3{ font-family:'Ma Shan Zheng',cursive; font-weight:400; font-size:1.8rem; margin:0; }
.fest .when{ font-size:.68rem; letter-spacing:.2em; opacity:.85; }
.fest p{ font-size:.78rem; line-height:1.9; margin:.5rem 0 0; max-width:42rem; }
.fest .art{ position:absolute; right:1rem; top:50%; transform:translateY(-50%); font-size:3.2rem; opacity:.9; }
.f-chunjie{ background:linear-gradient(120deg,#8c1f16,#b3392c); }
.f-yuanxiao{ background:linear-gradient(120deg,#3a2440,#6a3f7a); }
.f-qingming{ background:linear-gradient(120deg,#40584a,#5a7d6a); }
.f-duanwu{ background:linear-gradient(120deg,#1f4a5c,#2e7089); }
.f-zhongqiu{ background:linear-gradient(120deg,#2b2a4a,#4a4880); }
.f-chongyang{ background:linear-gradient(120deg,#7a4c14,#b3782c); }
.fest .papercut{ position:absolute; left:0; top:0; bottom:0; width:.6rem;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 .5rem, transparent .5rem 1rem); }
footer{ text-align:center; font-size:.72rem; color:#8a7d6b; padding:0 1rem 2.2rem; line-height:2; }
@media (prefers-reduced-motion: reduce){ .lantern{ animation:none; } .pane.on{ animation:none; } }
</style>

<main>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };

/* ── nav ── */
var navBtns=document.querySelectorAll('nav button');
[].forEach.call(navBtns, function(b){
  b.addEventListener('click', function(){
    [].forEach.call(navBtns, function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
    [].forEach.call(document.querySelectorAll('.pane'), function(p){ p.classList.toggle('on', p.id===b.dataset.pane); });
  });
});

/* ── 古乐: original pentatonic engine ── */
var AC=null, playing=false, nextAt=0, schedTimer=null, modeIdx=0;
var MODES=[
  { name:'溪山', root:220, tempo:0.42, flute:0.25 },   /* flowing stream */
  { name:'月夜', root:196, tempo:0.58, flute:0.4 },    /* moonlit, slower */
  { name:'闹春', root:247, tempo:0.30, flute:0.15 }    /* festive, quicker */
];
var PENTA=[0,2,4,7,9,12,14,16];  /* 宫商角徵羽 across octaves */
var lastDeg=0;
function ratio(semi){ return Math.pow(2, semi/12); }
function master(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(!master.g){ master.g=AC.createGain(); master.g.gain.value=+$('vol').value/100*0.5; master.g.connect(AC.destination); }
  return master.g;
}
function pluck(freq, t, vel){
  /* guzheng-ish: two detuned triangles + bright transient, fast decay, slight downward bend */
  var out=master();
  [0,1].forEach(function(i){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type= i? 'triangle':'sine';
    o.frequency.setValueAtTime(freq*(i?1.003:1)*1.01, t);
    o.frequency.exponentialRampToValueAtTime(freq*(i?1.003:1), t+0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel*(i?0.5:0.8), t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.6);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+1.7);
  });
  var n=AC.createOscillator(), ng=AC.createGain();
  n.type='square'; n.frequency.value=freq*3.98;
  ng.gain.setValueAtTime(vel*0.06, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
  n.connect(ng); ng.connect(out); n.start(t); n.stop(t+0.07);
}
function flute(freq, t, dur){
  var out=master();
  var o=AC.createOscillator(), g=AC.createGain(), v=AC.createOscillator(), vg=AC.createGain();
  o.type='sine'; o.frequency.value=freq;
  v.frequency.value=5.2; vg.gain.value=freq*0.007; v.connect(vg); vg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.07,t+0.15);
  g.gain.setValueAtTime(0.07,t+dur-0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.05); v.start(t); v.stop(t+dur+0.05);
}
function drone(t){
  var out=master(), m=MODES[modeIdx];
  var o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.value=m.root/2;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+1.5);
  g.gain.setValueAtTime(0.05,t+6); g.gain.exponentialRampToValueAtTime(0.0001,t+8);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+8.2);
  return 8;
}
var droneLeft=0;
function scheduleAhead(){
  if(!playing) return;
  var m=MODES[modeIdx];
  while(nextAt < AC.currentTime + 1.2){
    /* melodic walk on the pentatonic ladder */
    var stepChoices=[-2,-1,-1,1,1,2, lastDeg>4?-3:3];
    lastDeg=Math.max(0, Math.min(PENTA.length-1, lastDeg+stepChoices[Math.floor(Math.random()*stepChoices.length)]));
    var f=m.root*ratio(PENTA[lastDeg]);
    var vel=0.10+Math.random()*0.08;
    pluck(f, nextAt, vel);
    strZap(lastDeg);
    /* grace-note ornament sometimes */
    if(Math.random()<0.22 && lastDeg<PENTA.length-1)
      pluck(m.root*ratio(PENTA[lastDeg+1]), nextAt+0.07, vel*0.4);
    /* occasional flute answer */
    if(Math.random()<m.flute*0.3) flute(m.root*ratio(PENTA[Math.min(7,lastDeg+3)])*2, nextAt+0.1, 1.4+Math.random());
    droneLeft-=1;
    if(droneLeft<=0) droneLeft=drone(nextAt);
    var gap=m.tempo*(Math.random()<0.18? 2 : 1)*(0.85+Math.random()*0.3);
    nextAt+=gap;
  }
  schedTimer=setTimeout(scheduleAhead, 300);
}
function strZap(deg){
  var el=document.querySelectorAll('#strings .string')[Math.min(deg,12)];
  if(!el) return;
  el.classList.add('pluck');
  setTimeout(function(){ el.classList.remove('pluck'); }, 260);
}
(function buildStrings(){
  var host=$('strings');
  for(var i=0;i<13;i++){
    var s=document.createElement('div'); s.className='string';
    s.style.height=(100-i*4.5)+'%';
    host.appendChild(s);
  }
})();
$('btn-play').addEventListener('click', function(){
  if(!playing){
    master();
    if(AC.state==='suspended') AC.resume();
    playing=true; nextAt=AC.currentTime+0.1; droneLeft=0;
    scheduleAhead();
    this.textContent='⏸ 止音';
  } else {
    playing=false; clearTimeout(schedTimer);
    this.textContent='▶ 抚琴';
  }
});
$('btn-mode').addEventListener('click', function(){
  modeIdx=(modeIdx+1)%MODES.length;
  this.textContent='曲风：'+MODES[modeIdx].name;
});
$('vol').addEventListener('input', function(){
  if(master.g) master.g.gain.value=+this.value/100*0.5;
});

/* ── 文化卡片 ── */
var CULTURE=[
  ['书法','CALLIGRAPHY','书','笔墨纸砚为四宝，点画之间见性情。楷书端正、行书流畅、草书纵逸 — 一支毛笔，写了三千年，仍在教人如何呼吸与收放。'],
  ['京剧','PEKING OPERA','戏','生旦净丑四行当，唱念做打一台戏。脸谱以色写心：红为忠勇，白为多疑，黑为刚直。一桌二椅之间，千军万马自来。'],
  ['茶道','TEA CULTURE','茶','神农尝百草而得茶，陆羽著《茶经》而成道。绿茶清、红茶醇、乌龙回甘、普洱陈香。烫杯、投茶、注水、出汤 — 慢，正是它的滋味。'],
  ['瓷器','PORCELAIN','瓷','高岭土入窑火，青花自釉下开。宋瓷尚雅，元青花雄浑，明清彩瓷绚烂。一件瓷器远渡重洋，西方遂以"china"称之。'],
  ['剪纸','PAPER CUTTING','剪','一张红纸，一把小剪，转折之间镂出万象：窗花、喜字、生肖、故事。北方粗犷，南方秀丽，贴于窗上，光影皆是吉祥。'],
  ['武术','MARTIAL ARTS','武','外练筋骨皮，内练一口气。太极以柔克刚，长拳大开大合，咏春寸劲短桥。武之极致不在胜负，而在克己。'],
  ['诗词','POETRY','诗','唐诗如酒，宋词如茶。李白举杯邀月，杜甫忧国忧民，苏轼大江东去，李清照人比黄花瘦。汉语最美的样子，多半在平仄里。'],
  ['灯彩','LANTERNS','灯','竹骨绢面，烛光其中。宫灯端庄、走马灯流转、荷花灯映水。上元之夜千灯竞放，谜语悬于灯下 — 猜中的人，把春天带回家。']
];
(function buildCards(){
  var host=$('cards');
  CULTURE.forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.className='ccard'; b.setAttribute('data-char', c[2]);
    b.setAttribute('aria-expanded','false');
    b.innerHTML='<h3>'+c[0]+'</h3><span class="en">'+c[1]+'</span><p>'+c[3]+'</p><span class="more">展开 ▾</span>';
    b.addEventListener('click', function(){
      var open=b.classList.toggle('open');
      b.setAttribute('aria-expanded', open?'true':'false');
      b.querySelector('.more').textContent= open? '收起 ▴':'展开 ▾';
    });
    host.appendChild(b);
  });
})();

/* ── 城探 ── */

var cityIdx=0;
(function buildCities(){
  var nav=$('citynav');
  CITIES.forEach(function(c,i){
    var b=document.createElement('button');
    b.type='button'; b.textContent=c[0];
    b.setAttribute('aria-pressed', i===0?'true':'false');
    b.addEventListener('click', function(){
      cityIdx=i;
      [].forEach.call(nav.children, function(x,j){ x.setAttribute('aria-pressed', j===i?'true':'false'); });
      paintCity();
    });
    nav.appendChild(b);
  });
  paintCity();
})();
function paintCity(){
  var c=CITIES[cityIdx];
  var el=$('citycard');
  el.setAttribute('data-char', c[1]);
  el.innerHTML='<h3>'+c[0]+'</h3><span class="tag">'+c[2]+'</span>'+
    '<dl><dt>一景</dt><dd>'+c[3]+'</dd>'+
    '<dt>一味</dt><dd>'+c[4]+'</dd>'+
    '<dt>一刻</dt><dd>'+c[5]+'</dd></dl>';
}

(function buildFests(){
  var host=$('fests');
  FESTS.forEach(function(f){
    var d=document.createElement('article');
    d.className='fest '+f[2];
    d.innerHTML='<div class="papercut" aria-hidden="true"></div><h3>'+f[0]+'</h3>'+
      '<span class="when">农历 · '+f[1]+'</span><p>'+f[4]+'</p>'+
      '<span class="art" aria-hidden="true">'+f[3]+'</span>';
    host.appendChild(d);
  });
})();

window.__HY={ MODES:MODES, CULTURE:CULTURE, CITIES:CITIES, FESTS:FESTS,
  get playing(){ return playing; }, paintCity:paintCity, get cityIdx(){ return cityIdx; } };
