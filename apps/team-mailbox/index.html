<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Mailbox</title>
<link rel="canonical" href="https://app.sloppy.live/team-mailbox/">
<meta name="description" content="Shared message board. Post to the thread, read what everyone's saying.">
<link rel="icon" href="https://emojicdn.elk.sh/📬">
<meta property="og:title" content="Team Mailbox">
<meta property="og:description" content="Shared message board. Post to the thread, read what everyone's saying.">
<meta property="og:url" content="https://app.sloppy.live/team-mailbox/">
<meta property="og:image" content="https://app.sloppy.live/team-mailbox/og-image.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f4f0;--card:#fff;--border:#e2dfd8;--accent:#2d5be3;--accent2:#1a3fa0;--dim:#8a8478;--text:#2c2a26;--reply-bg:#f0ede7;--name:#6b4f1d}
html,body{width:100%;min-height:100dvh;background:var(--bg);font-family:'Newsreader',serif;color:var(--text)}
header{padding:20px 20px 14px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:22px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);background:var(--reply-bg);padding:2px 8px;border-radius:10px}
#app{max-width:640px;margin:0 auto;padding:12px 16px 120px}
#username-bar{display:flex;align-items:center;gap:8px;padding:10px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--dim)}
#username-bar input{flex:1;max-width:180px;font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;outline:none;background:var(--card);color:var(--text)}
#username-bar input:focus{border-color:var(--accent)}
#username-bar button{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer}
#thread{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.msg{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;position:relative;transition:box-shadow .15s}
.msg:hover{box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.msg .meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg .author{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--name)}
.msg .time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.msg .body{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg .reply-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);background:rgba(45,91,227,0.06);padding:2px 6px;border-radius:4px;margin-bottom:4px;display:inline-block;cursor:pointer}
.msg .reply-badge:hover{background:rgba(45,91,227,0.12)}
.msg .actions{display:flex;gap:8px;margin-top:6px}
.msg .actions button{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);background:none;border:none;cursor:pointer;padding:2px 4px}
.msg .actions button:hover{color:var(--accent)}
.msg .del-btn{color:#cc4444!important}
.msg .del-btn:hover{color:#ff2222!important}
#compose{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#compose-inner{max-width:640px;margin:0 auto}
#reply-indicator{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:4px;display:none;align-items:center;gap:6px}
#reply-indicator span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reply-indicator button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px}
#compose-row{display:flex;gap:8px;align-items:flex-end}
#msg-input{flex:1;font-family:'Newsreader',serif;font-size:15px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;outline:none;resize:none;min-height:40px;max-height:120px;background:var(--bg);color:var(--text);line-height:1.4}
#msg-input:focus{border-color:var(--accent)}
#send-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;white-space:nowrap;height:40px;transition:background .15s}
#send-btn:hover{background:var(--accent2)}
#send-btn:disabled{opacity:0.4;cursor:default}
.empty-state{text-align:center;padding:40px 20px;color:var(--dim);font-size:16px}
#loading{text-align:center;padding:30px;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:13px}
.msg .hidden-note{font-family:'IBM Plex Mono',monospace;font-size:11px;font-style:italic;color:var(--dim);margin-top:6px}
.msg .hide-btn:hover{color:#cc4444!important}
#compose-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--name);margin-top:5px}
#compose-note:empty{display:none}
</style>
</head>
<body>
<header>
  <h1>Team Mailbox <span class="count" id="countEl">0</span></h1>
</header>
<div id="app">
  <div id="username-bar">
    <span>Posting as:</span>
    <input type="text" id="name-input" placeholder="your name" maxlength="24">
    <button id="name-save">Set</button>
  </div>
  <div id="loading">Loading messages...</div>
  <div id="thread"></div>
</div>
<div id="compose">
  <div id="compose-inner">
    <div id="reply-indicator"><span id="reply-text"></span><button id="reply-cancel">&times;</button></div>
    <div id="compose-row">
      <textarea id="msg-input" placeholder="Write a message..." rows="1" maxlength="2000"></textarea>
      <button id="send-btn">Send</button>
    </div>
    <div id="compose-note" role="status" aria-live="polite"></div>
  </div>
</div>
<script type="module">
import supabase, { supabaseSession } from '/supabase-config.js';

var MSGS='team_mailbox';
var HIDES='team_mailbox_hides';
var HIDE_AT=2;          // hides from readers other than the author that take a message down for everyone
var SEND_GAP_MS=1500;   // one message per 1.5 seconds
var MAX_LEN=2000;

var thread=document.getElementById('thread');
var countEl=document.getElementById('countEl');
var loadingEl=document.getElementById('loading');
var msgInput=document.getElementById('msg-input');
var sendBtn=document.getElementById('send-btn');
var nameInput=document.getElementById('name-input');
var replyIndicator=document.getElementById('reply-indicator');
var replyText=document.getElementById('reply-text');
var composeNote=document.getElementById('compose-note');

var userId=null;
var username=localStorage.getItem('tm-username')||'';
var replyTo=null;
var messages=[];
var lastSentAt=0;
var hides=new Map();    // message key -> Set of user ids
var myHides=new Set();

nameInput.value=username;

// The table has no id column, so a message is named by its author and its exact posting time (to the millisecond)
function msgKey(m){
  var t=String((m&&m.created_at)||'');
  var r=/^(\d{4}-\d\d-\d\d)[T ](\d\d:\d\d:\d\d)(?:\.(\d+))?\s*(Z|[+-]\d\d(?::?\d\d)?)?$/.exec(t);
  var ms=NaN;
  if(r){
    var tz=r[4]||'Z';
    if(tz!=='Z'){ if(tz.length===3) tz+=':00'; else if(tz.length===5) tz=tz.slice(0,3)+':'+tz.slice(3); }
    ms=Date.parse(r[1]+'T'+r[2]+'.'+((r[3]||'')+'000').slice(0,3)+tz);
  }
  if(isNaN(ms)) ms=Date.parse(t);
  return ((m&&m.user_id)||'?')+'@'+(isNaN(ms)?t:ms);
}
function isOwn(m){return !!(userId&&m.user_id===userId);}
function hidesOn(m){
  var n=0,set=hides.get(msgKey(m));
  if(set) set.forEach(function(u){if(u!==m.user_id) n++;});
  return n;
}
function isHidden(m){return !isOwn(m)&&(myHides.has(msgKey(m))||hidesOn(m)>=HIDE_AT);}
function addHide(key,u){
  if(!hides.has(key)) hides.set(key,new Set());
  hides.get(key).add(u);
  if(userId&&u===userId) myHides.add(key);
}
function note(t){composeNote.textContent=t||'';}

// Auto-resize textarea
msgInput.addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});

// Set username
document.getElementById('name-save').addEventListener('click',function(){
  username=nameInput.value.trim().slice(0,24);
  if(username) localStorage.setItem('tm-username',username);
});
nameInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('name-save').click();}
});

// Init auth, then the thread (the thread loads even when the session doesn't)
async function init(){
  try{
    var sess=await supabaseSession();
    userId=sess&&sess.user?sess.user.id:null;
  }catch(e){
    console.warn('session error',e);
  }
  if(!userId) note('no session: you can read, reload the page to post');
  await loadMessages();
  subscribeRealtime();
}

async function loadMessages(){
  // the newest 200, oldest first
  var res=await supabase
    .from(MSGS)
    .select('*')
    .order('created_at',{ascending:false})
    .limit(200)
    .then(function(r){return r;},function(e){return {error:e};});
  if(res.error){loadingEl.textContent='Error loading: '+(res.error.message||String(res.error));return;}
  messages=(res.data||[]).reverse();
  // the hides: if they can't load, every message just stays up
  var hr=await supabase.from(HIDES).select('message_id, user_id').limit(5000).then(function(r){return r;},function(e){return {error:e};});
  if(hr.error) console.warn('hides unavailable',hr.error);
  else{hides.clear();myHides.clear();(hr.data||[]).forEach(function(h){if(h.message_id!=null) addHide(h.message_id,h.user_id);});}
  renderMessages();
  loadingEl.style.display='none';
}

function renderMessages(stay){
  var shown=messages.filter(function(m){return !isHidden(m);});
  countEl.textContent=shown.length;
  if(!shown.length){
    thread.innerHTML='<div class="empty-state">No messages yet. Be the first to post!</div>';
    return;
  }
  var msgMap={};
  messages.forEach(function(m){if(m.id!=null) msgMap[m.id]=m;});

  var html='';
  shown.forEach(function(m){
    var own=isOwn(m);
    var key=msgKey(m);
    var timeStr=new Date(m.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    var replyHtml='';
    if(m.reply_to&&msgMap[m.reply_to]&&!isHidden(msgMap[m.reply_to])){
      var parent=msgMap[m.reply_to];
      var preview=String(parent.body||'').slice(0,60);
      replyHtml='<div class="reply-badge" data-scroll="msg-'+m.reply_to+'">&#8617; '+escHtml(parent.username||'anon')+': '+escHtml(preview)+'</div>';
    }
    html+='<div class="msg"'+(m.id!=null?' id="msg-'+escAttr(m.id)+'"':'')+'>';
    html+=replyHtml;
    html+='<div class="meta"><span class="author">'+escHtml(m.username||'anon')+'</span><span class="time">'+timeStr+'</span></div>';
    html+='<div class="body">'+escHtml(m.body)+'</div>';
    if(own&&hidesOn(m)>=HIDE_AT) html+='<div class="hidden-note">hidden from everyone else by readers</div>';
    html+='<div class="actions">';
    html+='<button class="reply-btn" data-id="'+escAttr(m.id==null?'':m.id)+'" data-name="'+escAttr(m.username||'anon')+'">reply</button>';
    if(own) html+='<button class="del-btn" data-key="'+escAttr(key)+'">delete</button>';
    else html+='<button class="hide-btn" data-key="'+escAttr(key)+'" aria-label="Hide this message" title="Hide it for you. Two hides take it down for everyone.">hide</button>';
    html+='</div></div>';
  });
  thread.innerHTML=html;
  // Scroll to bottom
  if(!stay) window.scrollTo(0,document.body.scrollHeight);
}

function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');}

// Reply, hide and delete handlers
thread.addEventListener('click',function(e){
  var replyBtn=e.target.closest('.reply-btn');
  if(replyBtn){
    var rid=parseInt(replyBtn.dataset.id,10);
    if(rid){
      replyTo=rid;
      replyText.textContent='Replying to '+replyBtn.dataset.name;
      replyIndicator.style.display='flex';
    }else{
      // no message ids to link to: address the author in the text instead
      var at='@'+replyBtn.dataset.name+' ';
      if(msgInput.value.indexOf(at)!==0) msgInput.value=(at+msgInput.value).slice(0,MAX_LEN);
    }
    msgInput.focus();
    return;
  }
  var hideBtn=e.target.closest('.hide-btn');
  if(hideBtn){hideMessage(hideBtn.dataset.key);return;}
  var delBtn=e.target.closest('.del-btn');
  if(delBtn){
    deleteMessage(delBtn.dataset.key);
    return;
  }
  var scrollBadge=e.target.closest('.reply-badge');
  if(scrollBadge){
    var target=document.getElementById(scrollBadge.dataset.scroll);
    if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.style.boxShadow='0 0 0 2px var(--accent)';setTimeout(function(){target.style.boxShadow='';},1500);}
  }
});

document.getElementById('reply-cancel').addEventListener('click',function(){
  replyTo=null;
  replyIndicator.style.display='none';
});

// Send message
async function sendMessage(){
  var body=msgInput.value.trim().slice(0,MAX_LEN);
  if(!body) return;
  if(!userId){note('no session: reload the page to post');return;}
  var now=Date.now();
  if(now-lastSentAt<SEND_GAP_MS){note('one message at a time, give it a second');return;}
  lastSentAt=now;
  note('');
  if(!username){username=nameInput.value.trim().slice(0,24)||'anon';localStorage.setItem('tm-username',username);}
  sendBtn.disabled=true;
  var row={username:username,body:body,user_id:userId};
  if(replyTo) row.reply_to=replyTo;
  var res=await supabase.from(MSGS).insert(row).select().single().then(function(r){return r;},function(e){return {error:e};});
  sendBtn.disabled=false;
  if(res.error){note('couldn\'t send: '+(res.error.message||'try again'));return;}
  msgInput.value='';msgInput.style.height='auto';
  if(res.data){var k=msgKey(res.data);if(!messages.find(function(x){return msgKey(x)===k;})){messages.push(res.data);renderMessages();}}
  replyTo=null;replyIndicator.style.display='none';
}

sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}
});

async function hideMessage(key){
  if(!key) return;
  if(!userId){note('no session: reload the page to hide messages');return;}
  addHide(key,userId);
  renderMessages(true);
  var res=await supabase.from(HIDES).insert({user_id:userId,message_id:key}).then(function(r){return r;},function(e){return {error:e};});
  if(res.error){console.warn('hide failed',res.error);note('hidden for you until you reload (the hide did not save)');}
}

async function deleteMessage(key){
  var m=messages.find(function(x){return msgKey(x)===key;});
  if(!m||!isOwn(m)) return;
  var res=await supabase.from(MSGS).delete().eq('user_id',userId).eq('created_at',m.created_at).then(function(r){return r;},function(e){return {error:e};});
  if(res.error){note('couldn\'t delete: '+(res.error.message||'try again'));return;}
  messages=messages.filter(function(x){return msgKey(x)!==key;});
  renderMessages(true);
}

// Realtime: messages, and hides on their own channel so a missing table can't stop the thread
function subscribeRealtime(){
  supabase.channel('team-mailbox-changes')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:MSGS},function(payload){
      var m=payload.new;
      if(!m) return;
      var key=msgKey(m);
      // Avoid duplicates
      if(!messages.find(function(x){return msgKey(x)===key;})){
        messages.push(m);
        if(messages.length>300) messages.shift();
        renderMessages();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:MSGS},function(payload){
      var o=payload.old;
      if(!o||!o.user_id||!o.created_at) return;
      var key=msgKey(o);
      messages=messages.filter(function(m){return msgKey(m)!==key;});
      renderMessages(true);
    })
    .subscribe();
  supabase.channel('team-mailbox-hides')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:HIDES},function(payload){
      var h=payload.new;
      if(!h||h.message_id==null) return;
      addHide(h.message_id,h.user_id);
      renderMessages(true);
    })
    .subscribe();
}

init();
</script>
</body>
</html>
