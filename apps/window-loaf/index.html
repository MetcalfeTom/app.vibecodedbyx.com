<style>
:root{

}
*{box-sizing:border-box;}
html{font-size:100%;}
body{margin:0; min-height:100vh; min-height:100dvh; color:var(--cream); font-family:'Martian Mono',ui-monospace,monospace; font-weight:300;
  background:radial-gradient(120% 80% at 10% 0%, #5a3226 0%, var(--plum) 38%, var(--night) 75%);

<body>
<header>
  <h1>Window Loaf</h1>
  <p id="hint">tap the cat</p>

  </div>
  <div class="bar" id="coats" role="group" aria-label="coat">

    <button type="button" class="sw" data-coat="black" aria-pressed="false" aria-label="black" style="--a:#4a4250;--b:#17131a"></button>
    <button type="button" class="sw" data-coat="grey" aria-pressed="false" aria-label="grey tabby" style="--a:#b9bcc4;--b:#5e626d"></button>
    <button type="button" class="sw" data-coat="calico" aria-pressed="false" aria-label="calico" style="--a:#f6efe6;--b:#e8924a;--c:#2c2630"></button>
    <button type="button" class="sw" data-coat="white" aria-pressed="false" aria-label="snow white" style="--a:#ffffff;--b:#cfc6be"></button>
    <input id="nm" type="text" maxlength="14" value="Mewo" spellcheck="false" autocomplete="off" aria-label="the cat's name, carved into the sill">
  </div>
  <p id="say" aria-live="polite"></p>
  <div class="bar">
    <button id="gif" type="button">🎞 make a gif</button>
  </div>
</main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <div class="card">
    <h2 id="sheet-h">your loaf, looping</h2>
    <div class="bar mood" role="group" aria-label="what the cat does in the gif">
      <button type="button" class="ghost md" data-m="0" aria-pressed="true">😴 asleep</button>
      <button type="button" class="ghost md" data-m="1" aria-pressed="false">👁 judging me</button>
    </div>
    <img id="gifimg" alt="A looping GIF of the sleeping ginger loaf cat on its snowy windowsill">
    <div class="bar">
      <a id="gifdl" class="btn" download="window-loaf.gif" href="#">⬇ save gif</a>
      <button id="gifshare" type="button" hidden>📤 share</button>
      <button id="gifclose" type="button" class="ghost">close</button>
    </div>
    <p class="tip">On a phone you can also press and hold the gif to save it.</p>
  </div>
</div>

  g.moveTo(254,hy+4); g.lineTo(266,hy+20); g.lineTo(246,hy+22); g.lineTo(250,hy+34); g.lineTo(232,hy+32); g.closePath(); g.fill();

function ear(g,x,y,side,turn,fur){
  g.save(); g.translate(x,y); g.rotate(side*(-.08)-turn*.42); g.scale(1-turn*.18,1);
  g.fillStyle=fur; g.beginPath(); g.moveTo(-20*side,8); g.lineTo(-12*side,-38); g.lineTo(20*side,-6); g.closePath(); g.fill();
  g.fillStyle=C.ear; g.beginPath(); g.moveTo(-12*side,2); g.lineTo(-9*side,-28); g.lineTo(10*side,-6); g.closePath(); g.fill();
  g.strokeStyle='rgba(255,240,220,.85)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(-6*side,-4); g.lineTo(-10*side,-16); g.moveTo(-2*side,-4); g.lineTo(-4*side,-14); g.stroke();
  g.restore();
}
function eye(g,x,y,o,wide,side){

  g.fillStyle=C.pupil; g.beginPath(); g.ellipse(x+side*1,y+1,wide?4.5:2.2,wide?7:7.5,0,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(x-3,y-2.5,1.8,0,7); g.fill();
  g.restore();
  g.lineWidth=2.6; g.beginPath();
  if(wide){ g.ellipse(x,y,rx,Math.max(ry,1),0,0,7); }
  else { var ly=y-14+14*(1-o*.55); g.moveTo(x-11,ly); g.lineTo(x+11,ly); }

}

/* ---------- live view ---------- */
var dpr=1, T0=performance.now(), now=0;
var LV={earAt:-99, tailAt:-99, whiskAt:-99, nEar:3+Math.random()*4, nTail:5+Math.random()*5, nWhisk:2+Math.random()*4,
  judgeAt:-99, wideAt:-99, pokes:[], bub:'', bubAt:-99, earTo:-99};
function fit(){ var r=cv.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2.5); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
function liveState(){
  var s={earL:0, tail:0, whisk:0, eyeR:0, eyeL:0, wide:false, bub:'', bubA:0};
  if(!RM){
    if(now>LV.nEar){ LV.earAt=now; LV.nEar=now+5+Math.random()*7; }
    if(now>LV.nTail){ LV.tailAt=now; LV.nTail=now+6+Math.random()*8; }
    if(now>LV.nWhisk){ LV.whiskAt=now; LV.nWhisk=now+3+Math.random()*6; }
  }
  s.earL=Math.max(env(now-LV.earAt,.18,.5,.35), env(now-LV.earTo,.12,.9,.4));
  s.tail=bump(now-LV.tailAt,0,.9);
  s.whisk=bump(now-LV.whiskAt,0,.35);
  var w=env(now-LV.wideAt,.12,1.5,.6);
  if(w>0){ s.eyeR=s.eyeL=w; s.wide=true; s.earL=Math.max(s.earL,w*.6); }
  else s.eyeR=env(now-LV.judgeAt,.25,1.4,.45);
  s.bub=LV.bub; s.bubA=env(now-LV.bubAt,.15,1.3,.4);
  return s;
}
function frame(ts){
  now=(ts-T0)/1000;
  ctx.setTransform(cv.width/W,0,0,cv.height/W,0,0);
  scene(ctx, RM?0:now%L, liveState());
  requestAnimationFrame(frame);
}
var LINES=['…','really?','I was asleep.','…mrr.','no.','five more hours.'];
function poke(){
  $('hint').classList.add('gone');
  LV.pokes=LV.pokes.filter(function(p){ return now-p<6; }); LV.pokes.push(now);
  if(LV.pokes.length>=3){ LV.pokes=[]; LV.wideAt=now; LV.judgeAt=-99; LV.bub='mrrp!'; LV.bubAt=now; say('Both eyes. You have its full attention now.'); chirp(); return; }
  LV.judgeAt=now; LV.bub=LINES[(Math.random()*LINES.length)|0]; LV.bubAt=now+.2;
  say('It opens one eye and judges you.');
}
function say(t){ $('say').textContent=t; clearTimeout(say.k); say.k=setTimeout(function(){ $('say').textContent=''; },3500); }
function sceneXY(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]; }
cv.addEventListener('pointerdown',function(e){ var p=sceneXY(e), x=p[0], y=p[1];
  var onCat=((x-200)*(x-200))/(104*104)+((y-290)*(y-290))/(80*80)<1 || ((x-200)*(x-200))/(62*62)+((y-222)*(y-222))/(62*62)<1;
  if(onCat) poke(); else { LV.earTo=now; }   /* a tap anywhere else: the listening ear turns toward it */
});
cv.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); poke(); } });

/* a tiny 'mrrp': two quick rising squeaks */
var AC=null;
function chirp(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running') AC.resume();
  var t=AC.currentTime+.02;
  [0,.13].forEach(function(d,i){ var o=AC.createOscillator(), gn=AC.createGain(), fl=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.setValueAtTime(520+i*90,t+d); o.frequency.exponentialRampToValueAtTime(900+i*140,t+d+.09); o.frequency.exponentialRampToValueAtTime(700,t+d+.16);
    fl.type='lowpass'; fl.frequency.value=2400; gn.gain.setValueAtTime(0,t+d); gn.gain.linearRampToValueAtTime(.16,t+d+.02); gn.gain.exponentialRampToValueAtTime(.001,t+d+.18);
    o.connect(fl); fl.connect(gn); gn.connect(AC.destination); o.start(t+d); o.stop(t+d+.2); });
  }catch(e){} }

/* ---------- GIF maker (my own encoder: one loop, 50 frames at 8/100 s, a palette built from the frames, unchanged pixels left transparent) ---------- */
var GS=320, NF=50, DELAY=8;
/* GJ: the judging gif, one eye opens a third of the way in and shuts again before the loop comes round */
var GJ=false;
function gifState(t){ var u=t/L; return {earL:bump(u,.22,.36), tail:bump(u,.55,.78), whisk:bump(u,.86,.93), eyeR:GJ?env(t-1.2,.25,1.5,.45):0, eyeL:0, wide:false,
  bub:GJ?'…':'', bubA:GJ?env(t-1.4,.15,1.2,.3):0}; }
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function makeGif(prog, done){
  var oc=document.createElement('canvas'); oc.width=oc.height=GS;
  var g=oc.getContext('2d',{willReadFrequently:true}), frames=[], hist=new Uint32Array(32768), f=0;
  function render(){ var t0=performance.now();
    while(f<NF&&performance.now()-t0<30){
      g.setTransform(GS/W,0,0,GS/W,0,0); var t=f/NF*L; scene(g,t,gifState(t));
      var d=g.getImageData(0,0,GS,GS).data; frames.push(d);
      for(var i=0;i<d.length;i+=8) hist[(d[i]>>3)<<10|(d[i+1]>>3)<<5|d[i+2]>>3]++;
      f++; }
    prog(f/NF*.4);
    if(f<NF) return setTimeout(render,0);
    palette(); }
  var pal=[], cache=new Int16Array(32768).fill(-1);
  function near(r,g2,b){ var best=0, bd=1e9; for(var k=0;k<pal.length;k++){ var p=pal[k], dr=p[0]-r, dg=p[1]-g2, db=p[2]-b, dd=dr*dr*3+dg*dg*4+db*db*2; if(dd<bd){ bd=dd; best=k; } } return best; }
  function palette(){
    Object.keys(C).forEach(function(k){ if(typeof C[k]==='string'&&C[k][0]==='#') pal.push(hex(C[k])); });
    var bins=[]; for(var i=0;i<32768;i++) if(hist[i]) bins.push(i);
    bins.sort(function(a,b){ return hist[b]-hist[a]; });
    for(var j=0;j<bins.length&&pal.length<255;j++){ var k=bins[j], c=[(k>>10)<<3|4,(k>>5&31)<<3|4,(k&31)<<3|4], ok=true;
      for(var q=0;q<pal.length;q++){ var p=pal[q]; if(Math.abs(p[0]-c[0])+Math.abs(p[1]-c[1])+Math.abs(p[2]-c[2])<10){ ok=false; break; } }
      if(ok) pal.push(c); }
    while(pal.length<256) pal.push([0,0,0]);   /* entry 255 is the transparent one */
    f=0; setTimeout(encode,0); }
  var out=[], prev=null;
  function bytes(a){ out.push(new Uint8Array(a)); }
  function u16(v){ return [v&255,v>>8&255]; }
  function encode(){
    if(f===0){
      var head=[71,73,70,56,57,97].concat(u16(GS),u16(GS),[0xF7,0,0]); bytes(head);
      var ct=new Uint8Array(768); for(var i=0;i<256;i++){ ct[i*3]=pal[i][0]; ct[i*3+1]=pal[i][1]; ct[i*3+2]=pal[i][2]; } out.push(ct);
      bytes([0x21,0xFF,0x0B,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0]);   /* NETSCAPE2.0: loop forever */
    }
    var t0=performance.now();
    while(f<NF&&performance.now()-t0<30){
      var d=frames[f], n=GS*GS, idx=new Uint8Array(n), shown=new Uint8Array(n);
      for(var p=0,o=0;p<n;p++,o+=4){ var key=(d[o]>>3)<<10|(d[o+1]>>3)<<5|d[o+2]>>3, c=cache[key];
        if(c<0){ c=near((d[o]>>3)<<3|4,(d[o+1]>>3)<<3|4,(d[o+2]>>3)<<3|4); cache[key]=c; }
        shown[p]=c; idx[p]=prev&&prev[p]===c?255:c; }
      prev=shown; frames[f]=null;
      bytes([0x21,0xF9,4,0x05].concat(u16(DELAY),[255,0]));   /* keep the last frame, 255 = see-through */
      bytes([0x2C,0,0,0,0].concat(u16(GS),u16(GS),[0]));
      var lz=lzw(idx,8), blk=[8];
      for(var s=0;s<lz.length;s+=255){ var e=Math.min(lz.length,s+255); blk.push(e-s); for(var q=s;q<e;q++) blk.push(lz[q]); }

}
/* GIF LZW, variable code size from 9 bits, clear when the table hits 4096 */
function lzw(ix, min){
  var clear=1<<min, eoi=clear+1, size=min+1, next=eoi+1, tab=new Map(), out=[], cur=0, nb=0;
  function emit(c){ cur|=c<<nb; nb+=size; while(nb>=8){ out.push(cur&255); cur>>>=8; nb-=8; } }
  emit(clear);
  var pre=ix[0];
  for(var i=1;i<ix.length;i++){ var k=ix[i], key=pre<<8|k, c=tab.get(key);
    if(c!==undefined){ pre=c; continue; }
    emit(pre);
    if(next===4096){ emit(clear); next=eoi+1; size=min+1; tab.clear(); }
    else { if(next>=(1<<size)) size++; tab.set(key,next++); }
    pre=k; }
  emit(pre); emit(eoi);
  if(nb>0) out.push(cur&255);
  return out;
}

var gifURL=null, gifBlob=null;
function build(){ var b=$('gif'); if(b.disabled) return;
  b.disabled=true; b.textContent='🎞 making it… 0%'; $('gifimg').style.opacity=.35;
  makeGif(function(p){ b.textContent='🎞 making it… '+Math.round(p*100)+'%'; $('sheet-h').textContent='making it… '+Math.round(p*100)+'%'; }, function(blob){

    gifBlob=blob; gifURL=URL.createObjectURL(blob);
    $('gifimg').src=gifURL; $('gifdl').href=gifURL;
    var fn=(NAME.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'window-loaf')+'.gif'; $('gifdl').download=fn;

}

(function(){ var st={}; try{ st=JSON.parse(localStorage.getItem('window-loaf')||'{}')||{}; }catch(e){}
  var h=location.hash.slice(1).split('/'); if(h[0]&&COATS[decodeURIComponent(h[0])]){ st.coat=decodeURIComponent(h[0]); if(h[1]) st.name=decodeURIComponent(h[1]).slice(0,14); }
  setCoat(st.coat||'ginger'); if(st.name){ NAME=st.name; $('nm').value=NAME; } })();
