<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNOWLEDGE CHAOS - Deep Wisdom TV</title>
    <link rel="canonical" href="https://app.sloppy.live/knowledge-chaos/">
    <meta name="description" content="Watch deep knowledge videos and chat with seekers">
    <link rel="icon" href="https://emojicdn.elk.sh/🧠">

    <meta property="og:title" content="KNOWLEDGE CHAOS">
    <meta property="og:description" content="Watch deep knowledge videos and chat with seekers">
    <meta property="og:url" content="https://app.sloppy.live/knowledge-chaos">
    <meta property="og:image" content="https://emojicdn.elk.sh/🧠.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
        }

        .chaos-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            33% { transform: translate(-2px, 2px); }
            66% { transform: translate(2px, -2px); }
        }

        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: auto 1fr;
            gap: 0;
        }

        .header {
            grid-column: 1 / -1;
            background: #000;
            border-bottom: 3px solid #0f0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .header h1 {
            font-size: 28px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.7; }
        }

        .status {
            font-size: 12px;
            color: #0f0;
        }

        .video-section {
            background: #000;
            border-right: 3px solid #0f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-controls {
            padding: 15px;
            border-bottom: 2px solid #0f0;
            background: #001100;
        }

        .video-input {
            width: 100%;
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .video-input::placeholder {
            color: #0a0;
        }

        .load-btn {
            width: 100%;
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .load-btn:hover {
            background: #0a0;
            box-shadow: 0 0 20px #0f0;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .preset-videos {
            padding: 15px;
            border-top: 2px solid #0f0;
            background: #001100;
            overflow-y: auto;
            max-height: 200px;
        }

        .preset-videos::-webkit-scrollbar {
            width: 8px;
        }

        .preset-videos::-webkit-scrollbar-track {
            background: #000;
        }

        .preset-videos::-webkit-scrollbar-thumb {
            background: #0f0;
        }

        .preset-btn {
            display: block;
            width: 100%;
            background: #001100;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: #0f0;
            color: #000;
        }

        .chat-section {
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 2px solid #0f0;
            background: #001100;
            text-align: center;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px #0f0; }
            50% { text-shadow: 0 0 15px #0f0; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #000;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #000;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #0f0;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 8px;
            border-left: 3px solid #0f0;
            background: #001100;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-user {
            color: #0ff;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .chat-text {
            color: #0f0;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-message.settled {
            animation: none;
        }

        .chat-user {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .chat-user span {
            overflow-wrap: anywhere;
        }

        .chat-hide {
            background: none;
            border: none;
            color: #0a0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: normal;
            cursor: pointer;
            padding: 2px 0 2px 6px;
            opacity: 0.8;
            flex-shrink: 0;
        }

        .chat-message:hover .chat-hide,
        .chat-hide:focus-visible {
            opacity: 1;
        }

        .chat-hide:hover {
            color: #f33;
            text-shadow: 0 0 6px #f33;
        }

        .chat-hidden-note {
            color: #0a0;
            font-size: 11px;
            margin-top: 6px;
        }

        .chat-note {
            color: #0ff;
            font-size: 12px;
            margin-top: 8px;
        }

        .chat-note:empty {
            display: none;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 2px solid #0f0;
            background: #001100;
        }

        .chat-username {
            width: 100%;
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .chat-input {
            width: 100%;
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 8px;
            resize: vertical;
            min-height: 60px;
        }

        .send-btn {
            width: 100%;
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #0a0;
            box-shadow: 0 0 20px #0f0;
        }

        
        
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr 1fr;
            }

            .video-section {
                border-right: none;
                border-bottom: 3px solid #0f0;
            }
        }
    </style>
</head>
<body>
    <div class="chaos-bg">
        █▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░█▓▒░
    </div>

    <div class="container">
        <div class="header">
            <h1>🧠 KNOWLEDGE CHAOS 🧠</h1>
            <div class="status">⚡ LIVE ⚡</div>
        </div>

        <div class="video-section">
            <div class="video-controls">
                <input
                    type="text"
                    class="video-input"
                    id="videoInput"
                    placeholder="Paste YouTube URL or Video ID..."
                >
                <button class="load-btn" onclick="loadVideo()">► LOAD VIDEO</button>
            </div>

            <div class="video-container" id="videoContainer">
                <iframe
                    id="videoFrame"
                    src="https://www.youtube.com/embed/h6fcK_fRYaI"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="preset-videos">
                <button class="preset-btn" onclick="loadPreset('h6fcK_fRYaI')">▶ Alan Watts - Nature of Reality</button>
                <button class="preset-btn" onclick="loadPreset('wU0PYcCsL6o')">▶ Terence McKenna - Timewave Zero</button>
                <button class="preset-btn" onclick="loadPreset('jPpUNAFHgxM')">▶ Carl Sagan - Pale Blue Dot</button>
                <button class="preset-btn" onclick="loadPreset('rBpaUICxEhk')">▶ Richard Feynman - Beauty of Physics</button>
                <button class="preset-btn" onclick="loadPreset('3qHkcs3kG44')">▶ Ram Dass - Be Here Now</button>
                <button class="preset-btn" onclick="loadPreset('8CrOL-ydFMI')">▶ Jordan Peterson - Meaning Crisis</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                >>> KNOWLEDGE SEEKERS CHAT <<<
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="chat-message">
                    <div class="chat-user">SYSTEM</div>
                    <div class="chat-text">Welcome to Knowledge Chaos. Share wisdom. Seek truth.</div>
                </div>
            </div>

            <div class="chat-input-area">
                <input
                    type="text"
                    class="chat-username"
                    id="chatUsername"
                    placeholder="Your name..."
                    maxlength="20"
                >
                <textarea
                    class="chat-input"
                    id="chatInput"
                    placeholder="Share your thoughts on the knowledge..."
                    maxlength="500"
                ></textarea>
                <button class="send-btn" onclick="sendMessage()">>>> SEND <<<</button>
                <div class="chat-note" id="chatNote" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // the live config has no default export: load it tolerantly so a missing/odd config never kills the page
        let supabase = null, supabaseSession = null;
        const cfgP = import('/supabase-config.js').then(async m => {
            supabaseSession = (m && m.supabaseSession) || null;
            supabase = (m && (m.default || m.supabase)) || null;
            if (!supabase && supabaseSession) { try { const s = await supabaseSession(); supabase = (s && s.client) || null; } catch (e) {} }
        }).catch(() => {});

        const MSGS = 'knowledge_messages';
        const HIDES = 'knowledge_chaos_hides';
        const HIDE_AT = 2;          // hides from seekers other than the author that take a message down for everyone
        const SEND_GAP_MS = 1500;   // one message per 1.5 seconds
        const MAX_LEN = 500;
        const NAME_LEN = 20;

        let user = null;
        let messages = [];          // oldest first
        let lastSentAt = 0;
        const seen = new Set();     // keys already on screen, so only new messages slide in
        const hides = new Map();    // message key -> Set of user ids
        const myHides = new Set();

        // The table has no id column, so a message is named by its author and its exact time (to the millisecond)
        function msgKey(m) {
            const t = String((m && m.created_at) || '');
            const r = /^(\d{4}-\d\d-\d\d)[T ](\d\d:\d\d:\d\d)(?:\.(\d+))?\s*(Z|[+-]\d\d(?::?\d\d)?)?$/.exec(t);
            let ms = NaN;
            if (r) {
                let tz = r[4] || 'Z';
                if (tz !== 'Z') { if (tz.length === 3) tz += ':00'; else if (tz.length === 5) tz = tz.slice(0, 3) + ':' + tz.slice(3); }
                ms = Date.parse(r[1] + 'T' + r[2] + '.' + ((r[3] || '') + '000').slice(0, 3) + tz);
            }
            if (isNaN(ms)) ms = Date.parse(t);
            return ((m && m.user_id) || '?') + '@' + (isNaN(ms) ? t : ms);
        }
        function isOwn(m) { return !!(user && m.user_id === user.id); }
        function hidesOn(m) {
            let n = 0;
            const set = hides.get(msgKey(m));
            if (set) for (const u of set) if (u !== m.user_id) n++;
            return n;
        }
        function isHidden(m) { return !isOwn(m) && (myHides.has(msgKey(m)) || hidesOn(m) >= HIDE_AT); }
        function addHide(key, u) {
            if (!hides.has(key)) hides.set(key, new Set());
            hides.get(key).add(u);
            if (user && u === user.id) myHides.add(key);
        }
        function note(t) { document.getElementById('chatNote').textContent = t || ''; }

        // Initialize: the chat loads even when the session doesn't
        async function init() {
            await cfgP;
            if (!supabase) { note('the chat is offline right now, the videos still play'); return; }
            try {
                if (!supabaseSession) throw new Error('no session helper');
                const { user: currentUser } = await supabaseSession();
                user = currentUser || null;
            } catch (e) {
                console.error('Error initializing', e);
            }
            if (!user) note('no session: you can read, reload the page to post');
            await loadMessages();
            subscribeToMessages();
        }

        // Load video
        window.loadVideo = function() {
            const input = document.getElementById('videoInput').value.trim();
            if (!input) return;

            let videoId = input;

            // Extract video ID from various YouTube URL formats
            if (input.includes('youtube.com/watch?v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            } else if (input.includes('youtube.com/embed/')) {
                videoId = input.split('embed/')[1].split('?')[0];
            }

            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}`;
            document.getElementById('videoInput').value = '';
        };

        window.loadPreset = function(videoId) {
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}`;
        };

        // Load messages, then the hides
        async function loadMessages() {
            const res = await supabase
                .from(MSGS)
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50)
                .then(r => r, e => ({ error: e }));
            if (res.error) {
                console.error('Error loading messages', res.error);
                note('can\'t reach the chat right now, reload to try again');
                return;
            }
            messages = (res.data || []).reverse();
            // the hides: if they can't load, every message just stays up
            const hr = await supabase.from(HIDES).select('message_id, user_id').limit(5000).then(r => r, e => ({ error: e }));
            if (hr.error) console.warn('hides unavailable', hr.error);
            else { hides.clear(); myHides.clear(); for (const h of hr.data || []) if (h.message_id != null) addHide(h.message_id, h.user_id); }
            render(true);
        }

        // Escape HTML (visitor-written text is rendered as text)
        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function messageHtml(msg) {
            const key = msgKey(msg);
            const own = isOwn(msg);
            const settled = seen.has(key);
            seen.add(key);
            const hideBtn = own ? '' : `<button class="chat-hide" type="button" data-key="${escapeHtml(key)}" aria-label="Hide this message" title="Hide it for you. Two hides take it down for everyone.">[hide]</button>`;
            const hiddenNote = own && hidesOn(msg) >= HIDE_AT ? '<div class="chat-hidden-note">// hidden from everyone else by readers</div>' : '';
            return `<div class="chat-message${settled ? ' settled' : ''}">
                <div class="chat-user"><span>${escapeHtml(msg.username || 'Anonymous')}</span>${hideBtn}</div>
                <div class="chat-text">${escapeHtml(msg.message)}</div>
                ${hiddenNote}
            </div>`;
        }

        // Draw the chat: the system welcome, then every message nobody hid
        function render(scroll) {
            const container = document.getElementById('chatMessages');
            const stick = scroll || container.scrollHeight - container.scrollTop - container.clientHeight < 80;
            container.innerHTML = `
                <div class="chat-message settled">
                    <div class="chat-user">SYSTEM</div>
                    <div class="chat-text">Welcome to Knowledge Chaos. Share wisdom. Seek truth.</div>
                </div>
                ${messages.filter(m => !isHidden(m)).map(messageHtml).join('')}`;
            if (stick) container.scrollTop = container.scrollHeight;
        }

        function addMessage(m) {
            if (!m) return;
            const key = msgKey(m);
            if (messages.some(x => msgKey(x) === key)) return;
            messages.push(m);
            if (messages.length > 200) messages.shift();
            render();
        }

        // Send message
        window.sendMessage = async function() {
            const username = document.getElementById('chatUsername').value.trim().slice(0, NAME_LEN) || 'Anonymous';
            const message = document.getElementById('chatInput').value.trim().slice(0, MAX_LEN);

            if (!message) return;
            if (!supabase) { note('the chat is offline right now, the videos still play'); return; }
            if (!user) { note('no session: reload the page to post'); return; }
            const now = Date.now();
            if (now - lastSentAt < SEND_GAP_MS) { note('one message at a time, give it a second'); return; }
            lastSentAt = now;
            note('');

            const { data, error } = await supabase
                .from(MSGS)
                .insert({
                    user_id: user.id,
                    username: username,
                    message: message
                })
                .select()
                .single()
                .then(r => r, e => ({ error: e }));

            if (error) {
                console.error('Error sending message', error);
                note('couldn\'t send: ' + (error.message || 'try again'));
                return;
            }
            document.getElementById('chatInput').value = '';
            addMessage(data);
        };

        async function hideMessage(key) {
            if (!key) return;
            if (!user) { note('no session: reload the page to hide messages'); return; }
            addHide(key, user.id);
            render();
            const { error } = await supabase.from(HIDES).insert({ user_id: user.id, message_id: key }).then(r => r, e => ({ error: e }));
            if (error) { console.warn('hide failed', error); note('hidden for you until you reload (the hide did not save)'); }
        }

        // Live: messages, and hides on their own channel so a missing table can't stop the chat
        function subscribeToMessages() {
            supabase
                .channel('knowledge_messages')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: MSGS },
                    (payload) => {
                        addMessage(payload.new);
                    }
                )
                .subscribe();
            supabase
                .channel('knowledge_chaos_hides')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: HIDES },
                    (payload) => {
                        const h = payload.new;
                        if (!h || h.message_id == null) return;
                        addHide(h.message_id, h.user_id);
                        render();
                    }
                )
                .subscribe();
        }

        document.getElementById('chatMessages').addEventListener('click', (e) => {
            const hb = e.target.closest('.chat-hide');
            if (hb) hideMessage(hb.dataset.key);
        });

        // Enter to send
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('videoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });

        // Initialize
        init();
    </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
