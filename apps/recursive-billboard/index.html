<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BILLBOARD™ — The Ad That Advertises Itself</title>
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%AA%A7" />

<meta name="description" content="An advertisement for an advertisement for an advertisement. Every billboard only sells you the next identical billboard. There is no product. There is only the ad." />
<meta property="og:type" content="website" />
<meta property="og:title" content="BILLBOARD™ — The Ad That Advertises Itself" />
<meta property="og:description" content="An infinite ad loop. Each billboard advertises another identical billboard. No product, forever." />
<meta property="og:url" content="https://sloppy.live/recursive-billboard/" />
<meta property="og:image" content="https://image.pollinations.ai/prompt/an%20infinite%20droste%20billboard%2C%20a%20billboard%20showing%20a%20billboard%20showing%20a%20billboard%2C%20bold%20advertising%2C%20surreal%2C%20vanishing%20point?width=1200&height=630&nologo=true&seed=404" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0a10;font-family:'Space Mono',monospace;color:#fff}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:2;}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:.7rem .9rem;background:linear-gradient(180deg,rgba(8,8,16,.66),transparent);}
  .brand{font-family:'Bungee',cursive;font-size:clamp(.85rem,3vw,1.15rem);letter-spacing:.02em;
    color:#ffe14d;text-shadow:0 2px 0 #b8860b,0 0 18px rgba(255,225,77,.4);}
  .serial{text-align:right;font-family:'Space Mono',monospace;}
  .serial .lab{font-size:.52rem;letter-spacing:.22em;color:#9aa3c7;text-transform:uppercase;}
  .serial .num{font-family:'Anton',sans-serif;font-size:clamp(1.2rem,5vw,2rem);letter-spacing:.04em;line-height:1;color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,.25);}
  .serial .depth{font-size:.56rem;color:#ff6f91;letter-spacing:.1em;margin-top:.15rem;}

  .bottom{position:absolute;bottom:0;left:0;right:0;padding:.7rem .9rem 1rem;
    background:linear-gradient(0deg,rgba(8,8,16,.72),transparent);display:flex;flex-direction:column;gap:.55rem;align-items:center;}
  .cta{pointer-events:auto;font-family:'Anton',sans-serif;letter-spacing:.06em;font-size:clamp(1.1rem,4.4vw,1.6rem);
    color:#0a0a10;background:#ffe14d;border:0;border-radius:999px;padding:.55rem 1.6rem;cursor:pointer;
    box-shadow:0 0 0 4px rgba(255,225,77,.25),0 8px 22px rgba(0,0,0,.5);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 0 9px rgba(255,225,77,.12),0 8px 22px rgba(0,0,0,.5);}}
  .cta:hover{filter:brightness(1.06);} .cta:active{transform:scale(.97);}
  .cta:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  .fine{font-size:.56rem;color:#8e96bd;letter-spacing:.04em;text-align:center;max-width:34rem;line-height:1.5;}
  .row{display:flex;gap:.5rem;align-items:center;pointer-events:auto;}
  .mini{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.08em;color:#cdd3ee;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:.34rem .5rem;cursor:pointer;min-height:2rem;}
  .mini:hover{background:rgba(255,255,255,.14);} .mini:focus-visible{outline:2px solid #ffe14d;outline-offset:2px;}

  /* marquee fine print */
  .marquee{position:absolute;bottom:0;left:0;right:0;overflow:hidden;white-space:nowrap;
    background:#111;border-top:1px solid rgba(255,255,255,.1);padding:.18rem 0;font-size:.56rem;color:#7d85ad;letter-spacing:.1em;}
  .marquee span{display:inline-block;padding-left:100%;animation:scroll 26s linear infinite;}
  @keyframes scroll{to{transform:translateX(-100%)}}

  @media (prefers-reduced-motion: reduce){ .cta{animation:none} .marquee span{animation:none;padding-left:0} }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
  <canvas id="cv" role="img" aria-label="An infinite recursive billboard: a billboard advertising an identical billboard, advertising another, forever. There is no product — only the advertisement. Click to descend further into the ad."></canvas>

  <div class="hud">
    <div class="top">
      <div class="brand" aria-hidden="true">BILLBOARD™</div>
      <div class="serial">
        <div class="lab">Now advertising · Ad №</div>
        <div class="num" id="serial">000000001</div>
        <div class="depth" id="depth" aria-live="polite">▾ 0 levels descended</div>
      </div>
    </div>

    <div class="bottom">
      <div class="fine" id="fine"></div>
      <button class="cta" id="cta" type="button">LEARN MORE ▸</button>
      <div class="row">
        <button class="mini" id="skip" type="button">✕ Skip ad (5)</button>
        <button class="mini" id="mute" type="button" aria-pressed="false">♪ on</button>
        <span class="sr-only" id="live" role="status" aria-live="polite"></span>
      </div>
    </div>
  </div>
  <div class="marquee" aria-hidden="true"><span>★ AS SEEN INSIDE ITSELF ★ NO PRODUCT FOUND, PLEASE SEE NEXT BILLBOARD ★ 100% AD, 0% CONTENT ★ TERMS APPLY TO THE TERMS ★ YOU CANNOT BUY THE BILLBOARD, THE BILLBOARD BUYS YOU ★ AWARD: BEST BILLBOARD ABOUT A BILLBOARD ★ </span></div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('cv'), X=cv.getContext('2d');
  var serialEl=document.getElementById('serial'), depthEl=document.getElementById('depth'),
      fineEl=document.getElementById('fine'), cta=document.getElementById('cta'),
      skip=document.getElementById('skip'), muteBtn=document.getElementById('mute'), live=document.getElementById('live');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W,H,cx,cy,maxDim,DPR;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
    X.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2; cy=H*0.46; maxDim=Math.max(W,H);
  }
  resize(); window.addEventListener('resize',resize);

  // state
  var t=0, baseSpeed=reduce?0:0.12, lunge=0, serial=1, depth=0, hue=44;
  var FINES=[
    'There is no product. There is only the advertisement.',
    'This billboard is brought to you by another billboard.',
    'Side effects of viewing may include viewing more billboards.',
    'Offer expires never. Product remains forever unavailable.',
    'You are the 1,000,000th viewer of this exact billboard.'
  ];
  fineEl.textContent=FINES[0];

  function fmtSerial(n){ return ('000000000'+n).slice(-9); }
  function setSerial(){ serialEl.textContent=fmtSerial(serial); }

  // draw one billboard panel of side s centered at (px,py). Identical at every level → seamless Droste.
  function drawPanel(px,py,s){
    if(s<7) return;
    var half=s/2, x=px-half, y=py-half;
    // panel body (glossy)
    var g=X.createLinearGradient(x,y,x,y+s);
    g.addColorStop(0,'hsl('+hue+',85%,62%)'); g.addColorStop(0.5,'hsl('+hue+',80%,52%)'); g.addColorStop(1,'hsl('+((hue+18)%360)+',75%,42%)');
    X.fillStyle=g; X.fillRect(x,y,s,s);
    // gloss sweep
    X.fillStyle='rgba(255,255,255,.10)'; X.beginPath(); X.moveTo(x,y); X.lineTo(x+s,y); X.lineTo(x+s*0.45,y+s); X.lineTo(x,y+s*0.6); X.closePath(); X.fill();
    // outer trim
    X.strokeStyle='rgba(10,8,20,.55)'; X.lineWidth=Math.max(1,s*0.012); X.strokeRect(x,y,s,s);

    var dec = s<maxDim*2.6 && s>26; // only render text/decor in the readable band
    if(dec){
      // top brand band
      var band=s*0.135;
      X.fillStyle='rgba(10,10,22,.82)'; X.fillRect(x,y,s,band);
      X.fillStyle='#ffe14d'; X.textAlign='left'; X.textBaseline='middle';
      X.font='700 '+(band*0.52)+'px Bungee, sans-serif';
      X.fillText('BILLBOARD™', x+s*0.04, y+band*0.5);
      X.fillStyle='#fff'; X.textAlign='right'; X.font='400 '+(band*0.34)+'px "Space Mono", monospace';
      X.fillText('★ AD INSIDE', x+s*0.96, y+band*0.5);

      // headline (in the upper ring, above the slot)
      X.fillStyle='#10101e'; X.textAlign='center'; X.textBaseline='alphabetic';
      X.font='400 '+(s*0.072)+'px Anton, sans-serif';
      X.fillText('THE AD THAT', cx, y+band+s*0.085);
      X.fillText('ADVERTISES ITSELF', cx, y+band+s*0.165);

      // bottom CTA band
      var cy2=y+s-band*1.1;
      var pw=s*0.5, ph=band*0.78, prx=cx-pw/2;
      X.fillStyle='#ffe14d'; roundRect(prx,cy2,pw,ph,ph*0.5); X.fill();
      X.fillStyle='#10101e'; X.textAlign='center'; X.textBaseline='middle';
      X.font='400 '+(ph*0.5)+'px Anton, sans-serif';
      X.fillText('LEARN MORE ▸', cx, cy2+ph*0.52);
      // sub
      X.fillStyle='rgba(10,10,22,.8)'; X.font='700 '+(s*0.026)+'px "Space Mono", monospace';
      X.fillText('now showing: another billboard™', cx, y+s-band*1.35);

      // inner picture frame around the central slot (the next 0.5x panel sits exactly here)
      var fs=s*0.5;
      X.strokeStyle='#10101e'; X.lineWidth=Math.max(2,s*0.02);
      X.strokeRect(cx-fs/2, cy-fs/2, fs, fs);
      X.strokeStyle='rgba(255,255,255,.5)'; X.lineWidth=Math.max(1,s*0.006);
      X.strokeRect(cx-fs/2+s*0.02, cy-fs/2+s*0.02, fs-s*0.04, fs-s*0.04);
      // "now playing" tab
      X.fillStyle='#10101e'; var tw=s*0.16, thh=s*0.03;
      X.fillRect(cx-tw/2, cy-fs/2-thh, tw, thh);
      X.fillStyle='#ffe14d'; X.font='700 '+(thh*0.7)+'px "Space Mono", monospace'; X.textBaseline='middle';
      X.fillText('▶ LIVE', cx, cy-fs/2-thh*0.45);
    } else if(s>26){
      // not in readable band but still big: keep the inner frame so the recursion reads as nested screens
      var fs2=s*0.5; X.strokeStyle='rgba(10,8,20,.5)'; X.lineWidth=Math.max(1,s*0.02);
      X.strokeRect(cx-fs2/2, cy-fs2/2, fs2, fs2);
    }
  }
  function roundRect(x,y,w,h,r){ X.beginPath(); X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r); X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath(); }

  var last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/1000,0.05); last=now;
    var sp=baseSpeed+lunge; lunge*=Math.pow(0.12,dt); if(lunge<0.001)lunge=0;
    t+=sp*dt;
    while(t>=1){ t-=1; descend(true); }
    hue=(hue+dt*3)%360;

    X.clearRect(0,0,W,H);
    // background = darkened panel hue so screen edges are always covered
    X.fillStyle='hsl('+hue+',60%,16%)'; X.fillRect(0,0,W,H);
    // draw recursion: biggest level overflows screen, halve inward
    var scale=Math.pow(2,t);
    var s=maxDim*2*scale; // always >= 2*maxDim → covers screen even at t=0
    while(s>5){ drawPanel(cx,cy,s); s*=0.5; }

    requestAnimationFrame(loop);
  }

  function descend(fromZoom){
    serial++; depth++;
    setSerial();
    depthEl.textContent='▾ '+depth.toLocaleString()+' level'+(depth===1?'':'s')+' descended';
    fineEl.textContent=FINES[serial%FINES.length];
    if(!fromZoom){ t=0; } // a manual skip jumps a level
    if(depth%5===0) live.textContent='Still no product. '+depth+' billboards deep.';
  }

  // interactions
  function lungeIn(n){ lunge=Math.min(2.2, lunge+(n||1.1)); ensureAudio(); sndWhoosh(); }
  cv.addEventListener('pointerdown',function(e){ e.preventDefault(); lungeIn(1.0); });
  cta.addEventListener('click',function(){ lungeIn(1.3); });
  document.addEventListener('keydown',function(e){ if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); lungeIn(1.1); } });
  skip.addEventListener('click',function(){ ensureAudio(); sndDing(); descend(false); });

  // fake "skip ad" countdown that resets forever
  var skipN=5;
  setInterval(function(){ skipN--; if(skipN<=0) skipN=5; skip.textContent='✕ Skip ad ('+skipN+')'; },1000);

  // ---- audio ----
  var AC=null,muted=false;
  function ensureAudio(){ if(AC||muted)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} if(AC&&AC.state==='suspended')AC.resume(); }
  function sndWhoosh(){ if(!AC||muted)return; var t0=AC.currentTime;
    var b=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    var s=AC.createBufferSource(); s.buffer=b; var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(300,t0); f.frequency.exponentialRampToValueAtTime(2400,t0+0.28); f.Q.value=0.8;
    var g=AC.createGain(); g.gain.setValueAtTime(0.16,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.3);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0); s.stop(t0+0.31); }
  function sndDing(){ if(!AC||muted)return; var t0=AC.currentTime; [880,1320].forEach(function(fr,i){ var o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.value=fr; g.gain.setValueAtTime(0.0001,t0+i*0.05); g.gain.linearRampToValueAtTime(0.14,t0+i*0.05+0.01); g.gain.exponentialRampToValueAtTime(0.001,t0+i*0.05+0.3);
    o.connect(g); g.connect(AC.destination); o.start(t0+i*0.05); o.stop(t0+i*0.05+0.32); }); }
  muteBtn.addEventListener('click',function(){ muted=!muted; muteBtn.textContent=muted?'♪ off':'♪ on'; muteBtn.setAttribute('aria-pressed',muted?'true':'false'); });

  setSerial();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
