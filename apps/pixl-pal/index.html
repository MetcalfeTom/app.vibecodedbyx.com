<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixl Pal — a chat-reactive pixel friend</title>
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%91%BE" />
<meta name="description" content="A VTuber-style pixel companion who reads the chat and reacts — laughing, gasping, heart-eyes, rage, tears and zzz. Connect a Twitch chat or just talk to them." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Pixl Pal" />
<meta property="og:description" content="A pixel friend who reacts to chat with real expressions. Say something nice. Or don't — they'll react to that too." />
<meta property="og:url" content="https://sloppy.live/pixl-pal/" />
<meta property="og:image" content="https://image.pollinations.ai/prompt/a%20cute%20pixel%20art%20mascot%20with%20headphones%20and%20big%20expressive%20eyes%20on%20a%20streamer%20stage%2C%20chat%20messages%20floating%2C%20lavender%20and%20teal%2C%20crisp%20pixels%2C%20cozy?width=1200&height=630&nologo=true&seed=8008" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;600;800&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --void:#131020; --stage:#1a1630; --panel:#171330; --edge:#2c2650;
  --lav:#b48ae8; --teal:#58d8c8; --cream:#f2edda; --dim:#8b85ad; --pink:#f2a5c8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html,body{height:100%}
body{
  background:var(--void); color:var(--cream); font-family:'Pixelify Sans',monospace; overflow:hidden;
  background-image:
    radial-gradient(ellipse 55% 45% at 30% 20%, rgba(180,138,232,.10), transparent 60%),
    radial-gradient(ellipse 45% 40% at 85% 90%, rgba(88,216,200,.06), transparent 60%);
}
.app{ position:relative; height:100vh; }
/* ---- stage: the live stream is the backdrop, everything floats above ---- */
.stage{ position:absolute; inset:0; min-width:0; }
#streamWrap{ position:absolute; inset:0; z-index:0; background:#000; }
#streamWrap[hidden]{ display:none; }
#streamIfr{ width:100%; height:100%; border:0; display:block; }
.brand{ position:absolute; top:.6rem; left:.9rem; z-index:3; pointer-events:none; }
.brand h1{
  font-family:'Handjet',monospace; font-weight:800; font-size:1.7rem; letter-spacing:.05em;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}
.brand h1 span{ color:var(--lav); }
.brand .sub{ font-size:.68rem; color:var(--dim); text-shadow:0 1px 6px rgba(0,0,0,.9); }
.streamtog{ position:absolute; top:.7rem; right:.9rem; z-index:4; display:flex; gap:.4rem; }
.streamtog button{
  font-family:'Pixelify Sans',monospace; font-size:.66rem; color:var(--cream);
  background:rgba(23,19,48,.72); border:1px solid var(--edge); border-radius:.5rem;
  padding:.4rem .6rem; cursor:pointer; min-height:2.2rem; backdrop-filter:blur(4px);
}
.streamtog button:hover{ border-color:var(--lav); }
/* Pixl floats bottom-left over the stream, facecam style; canvas is transparent.
   The BOX is draggable via its grip; the canvas itself stays click-through so
   the Twitch player's controls remain usable underneath. */
#palBox{
  position:absolute; left:.4rem; bottom:8.4rem; z-index:2; pointer-events:none;
  width:min(34vw,26rem); height:min(44vh,22rem);
}
#avatar{
  display:block; width:100%; height:100%; image-rendering:pixelated; pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
}
.grip{
  position:absolute; z-index:6; pointer-events:auto; cursor:grab;
  font-family:'Pixelify Sans',monospace; font-size:.8rem; line-height:1;
  color:var(--dim); background:rgba(23,19,48,.72); border:1px solid var(--edge);
  border-radius:.5rem; padding:.35rem .5rem; min-height:2.2rem; min-width:2.2rem;
  opacity:.55; touch-action:none; backdrop-filter:blur(3px);
}
.grip:hover, .grip:focus-visible{ opacity:1; color:var(--cream); border-color:var(--lav); }
.grip:active{ cursor:grabbing; }
#palGrip{ top:-.4rem; left:.2rem; }
/* while dragging, the stream iframe must not swallow pointer events */
body.dragging #streamIfr{ pointer-events:none; }
body.dragging{ user-select:none; }
/* popcorn collision particles */
.pop{
  position:fixed; z-index:8; pointer-events:none; line-height:1;
  animation:popfly var(--dur,.8s) cubic-bezier(.25,.6,.35,1) forwards;
  text-shadow:0 1px 4px rgba(0,0,0,.6); color:#f2e3b8;
}
@keyframes popfly{
  0%{ transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1; }
  50%{ transform:translate(calc(-50% + var(--dx) * .7), calc(-50% + var(--upy))) scale(1) rotate(calc(var(--rot) * .5)); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.85) rotate(var(--rot)); opacity:0; }
}
/* the rat attorney (of shrimp-comedy-club fame) — appears on yeets, gets bonked */
.ratcameo{
  position:fixed; bottom:0; z-index:8; pointer-events:none; text-align:center;
  transform:translate(-50%,110%); transition:transform .32s cubic-bezier(.2,.8,.3,1.1);
  font-size:1.7rem; line-height:1;
}
.ratcameo.in{ transform:translate(-50%,0); }
.ratcameo .robe{ font-size:.8rem; display:block; margin-top:-.2rem; }
.ratcameo .say{
  display:block; font-family:'Pixelify Sans',monospace; font-size:.6rem; color:var(--cream);
  background:rgba(23,19,48,.85); border:1px solid var(--edge); border-radius:.5rem;
  padding:.15rem .4rem; margin-bottom:.25rem; opacity:0; transition:opacity .2s;
  max-width:9rem;
}
.ratcameo.bonked .say{ opacity:1; }
.ratcameo.bonked .rat{ display:inline-block; animation:ratBonk .5s ease; }
@keyframes ratBonk{ 0%{transform:none} 30%{transform:translateY(.3rem) scaleY(.8) rotate(-8deg)} 100%{transform:none} }
@media (prefers-reduced-motion: reduce){ .pop{ display:none; } .ratcameo{ display:none; } }
.exprbar{
  position:absolute; left:0; top:calc(100% + .35rem); z-index:3; pointer-events:auto; max-width:100%;
  display:flex; gap:.4rem; flex-wrap:wrap; padding:.3rem .4rem;
  background:rgba(23,19,48,.55); border-radius:.6rem; backdrop-filter:blur(4px);
}
.exprbar button{
  font-family:'Pixelify Sans',monospace; font-size:.68rem; background:var(--panel);
  color:var(--dim); border:1px solid var(--edge); border-radius:.4rem; padding:.35rem .6rem;
  cursor:pointer; min-height:2.2rem;
}
.exprbar button:hover{ color:var(--cream); border-color:var(--lav); }
.exprlabel{ font-size:.6rem; color:var(--dim); width:100%; text-align:center; letter-spacing:.2em; }
/* ---- chat: compact corner overlay panel ---- */
.chatcol{
  position:absolute; right:.7rem; bottom:5.2rem; z-index:5;
  width:20rem; max-width:calc(100vw - 1.4rem); height:min(56vh, calc(100vh - 6.5rem));
  background:rgba(23,19,48,.86); backdrop-filter:blur(6px);
  border:1px solid var(--edge); border-radius:.8rem; overflow:hidden;
  display:flex; flex-direction:column; min-height:0;
  box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.chatcol.min > *:not(.chead){ display:none; }
.chatcol.min{ height:auto; }
.chead{
  padding:.6rem .8rem; border-bottom:1px solid var(--edge);
  font-family:'Handjet',monospace; font-weight:600; font-size:1rem; letter-spacing:.08em;
  display:flex; justify-content:space-between; align-items:center; gap:.5rem;
  cursor:grab; touch-action:none;
}
.chead:active{ cursor:grabbing; }
.chead .grip{ position:static; opacity:.55; padding:.2rem .4rem; min-height:1.8rem; min-width:1.8rem; }
.chead .minbtn{
  font-family:'Pixelify Sans',monospace; font-size:.7rem; color:var(--dim);
  background:none; border:1px solid var(--edge); border-radius:.4rem;
  padding:.15rem .5rem; cursor:pointer; min-height:1.8rem;
}
.chead .minbtn:hover{ color:var(--cream); border-color:var(--lav); }
.pill{ font-size:.6rem; font-family:'Pixelify Sans',monospace; color:var(--dim); }
.pill i{ display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:#d9a43a; margin-right:.25rem; }
.pill.live i{ background:var(--teal); box-shadow:0 0 6px var(--teal); }
.pill.err i{ background:#e85a5a; }
.twitchrow{
  display:flex; gap:.4rem; padding:.5rem .8rem; border-bottom:1px solid var(--edge);
}
.twitchrow input{
  flex:1; min-width:0; background:var(--void); border:1px solid var(--edge); border-radius:.4rem;
  color:var(--cream); font-family:'Pixelify Sans',monospace; font-size:.74rem; padding:.4rem .5rem; min-height:2.4rem;
}
.twitchrow input:focus{ border-color:var(--lav); outline:none; }
.twitchrow button{
  background:var(--lav); color:#1a1030; border:none; border-radius:.4rem; font-family:'Pixelify Sans',monospace;
  font-weight:600; font-size:.72rem; padding:.4rem .7rem; cursor:pointer; min-height:2.4rem;
}
.twitchrow button:hover{ filter:brightness(1.1); }
#feed{
  flex:1; overflow-y:auto; min-height:0; padding:.6rem .8rem;
  scrollbar-width:thin; scrollbar-color:var(--edge) transparent;
  font-size:.8rem; line-height:1.5;
}
#feed .line{ margin-bottom:.35rem; overflow-wrap:anywhere; }
#feed .line b{ font-weight:600; }
#feed .line .demo{
  font-size:.56rem; color:var(--dim); border:1px solid var(--edge); border-radius:.6rem;
  padding:0 .3rem; margin-right:.25rem; vertical-align:middle;
}
#feed .line .ex{ margin-left:.3rem; font-size:.7rem; }
.oauthrow{ padding:.5rem .8rem; border-bottom:1px solid var(--edge); }
.oauthrow button{
  width:100%; font-family:inherit; font-size:.72rem; font-weight:600;
  background:#3a2a55; color:#c9b8e8; border:1px solid #4a3a68; border-radius:.4rem;
  padding:.5rem; cursor:pointer; min-height:2.5rem;
}
.oauthrow button:not(:disabled){ background:#9146FF; color:#fff; border-color:#9146FF; }
.oauthrow button:not(:disabled):hover{ filter:brightness(1.1); }
.oauthrow button:disabled{ opacity:.55; cursor:not-allowed; }
.oauthrow button.authed{ background:#1f6f3f; border-color:#2a8a4f; color:#eafff0; }
.oauthnote{ font-size:.56rem; color:var(--dim); margin-top:.3rem; line-height:1.4; }
.sayrow{
  display:flex; gap:.4rem; padding:.6rem .8rem .8rem; border-top:1px solid var(--edge);
}
.sayrow input{
  flex:1; min-width:0; background:var(--void); border:1px solid var(--edge); border-radius:.5rem;
  color:var(--cream); font-family:'Pixelify Sans',monospace; font-size:.8rem; padding:.5rem .6rem; min-height:2.75rem;
}
.sayrow input:focus{ border-color:var(--teal); outline:none; }
.sayrow button{
  background:var(--teal); color:#0f2a26; border:none; border-radius:.5rem;
  font-family:'Pixelify Sans',monospace; font-weight:600; font-size:.8rem;
  padding:.5rem .9rem; cursor:pointer; min-height:2.75rem;
}
.sayrow button:hover{ filter:brightness(1.1); }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .chatcol{ left:.5rem; right:.5rem; width:auto; height:min(42vh, calc(100vh - 5.5rem)); bottom:4.6rem; }
  #palBox{ width:44vw; height:30vh; bottom:4.6rem; }
  .exprbar{ display:none; }
  .streamtog{ right:.7rem; }
}
</style>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="Pixl the pixel companion">
    <div id="streamWrap">
      <iframe id="streamIfr" title="Live Twitch stream" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="brand">
      <h1>Pixl <span>Pal</span></h1>
      <div class="sub">they read the chat. they have feelings about it.</div>
    </div>
    <div class="streamtog">
      <button type="button" id="streamBtn" aria-pressed="true">🎥 stream on</button>
      <button type="button" id="palMuteBtn" aria-pressed="false">🔊 pixl</button>
    </div>
    <div id="palBox">
      <button type="button" class="grip" id="palGrip" aria-label="Drag Pixl — arrow keys nudge, double-click resets position">⠿</button>
      <canvas id="avatar" role="img" aria-label="Pixl, a pixel creature with headphones, currently reacting to chat"></canvas>
    <div class="exprbar" aria-label="Test expressions">
      <span class="exprlabel">POKE AN EMOTION</span>
      <button type="button" data-x="happy">happy</button>
      <button type="button" data-x="laugh">laugh</button>
      <button type="button" data-x="hype">hype</button>
      <button type="button" data-x="love">love</button>
      <button type="button" data-x="surprised">gasp</button>
      <button type="button" data-x="confused">huh?</button>
      <button type="button" data-x="sad">sad</button>
      <button type="button" data-x="angry">grr</button>
      <button type="button" data-x="sleepy">zzz</button>
    </div>
    </div>
  </section>
  <aside class="chatcol" aria-label="Chat">
    <div class="chead" id="chatHead">
      <button type="button" class="grip" id="chatGrip" aria-label="Drag chat panel — arrow keys nudge, double-click resets position">⠿</button>
      CHAT <span class="pill" id="pill"><i></i><span id="pillTxt">demo chat</span></span>
      <button type="button" class="minbtn" id="chatMinBtn" aria-expanded="true" aria-label="Collapse chat panel">▾</button>
    </div>
    <div class="twitchrow">
      <input id="chanIn" placeholder="twitch channel (e.g. sloppy_ai)" aria-label="Twitch channel to read chat from" autocomplete="off" />
      <button type="button" id="connectBtn">connect</button>
    </div>
    <div class="oauthrow">
      <button type="button" id="oauthBtn" disabled aria-describedby="oauthNote">🔒 log in with Twitch to chat as yourself</button>
      <p class="oauthnote" id="oauthNote">login is dormant until an operator registers a Twitch app · setup pending</p>
    </div>
    <div id="feed" role="log" aria-live="off" aria-label="Chat messages"></div>
    <div class="sayrow">
      <input id="sayIn" placeholder="say something to Pixl…" aria-label="Say something to Pixl" maxlength="200" autocomplete="off" />
      <button type="button" id="sayBtn">say</button>
    </div>
  </aside>
</div>
<div class="sr-only" role="status" aria-live="polite" id="sr"></div>

<script>
'use strict';
/* ============================ [PURE-BEGIN] ============================ */
function unescapeTag(v){
  return String(v||'').replace(/\\s/g,' ').replace(/\\:/g,';').replace(/\\\\/g,'\\');
}
function parseIrcLine(raw){
  var tags={}, rest=String(raw||'');
  if(rest[0]==='@'){
    var sp=rest.indexOf(' ');
    if(sp<0) return null;
    rest.slice(1,sp).split(';').forEach(function(kv){
      var i=kv.indexOf('=');
      if(i<0) tags[kv]='';
      else tags[kv.slice(0,i)]=unescapeTag(kv.slice(i+1));
    });
    rest=rest.slice(sp+1);
  }
  var m=rest.match(/^:([^!\s]+)\S*\s+(\S+)\s?([^:]*?)(?:\s*:(.*))?$/);
  if(!m) return null;
  return { tags:tags, user:m[1], cmd:m[2], params:(m[3]||'').trim(), text:m[4]||'' };
}
var EXPR_RULES=[
  ['laugh',     /\b(l(o+l)+|lmao+|lmfao+|rofl|ha(ha)+|he(he)+|jaja+|kekw?|lul|omegalul)\b|😂|🤣/i],
  ['hype',      /\b(pog\w*|hype+|lets? ?go+|gg|banger|insane)\b|🔥|🎉|⚡/i],
  ['love',      /\b(love|luv|uwu|owo|cute|adorable|precious)\b|❤|💜|💖|😍|🥰/i],
  ['angry',     /\b(angry|mad|rage|wtf|ugh|grr+|scam)\b|😡|🤬|>:\(/i],
  ['sad',       /\b(sad|cry(ing)?|rip|pain|oof|sigh|sadge|biblethump)\b|😢|😭|;-?\(/i],
  ['surprised', /\b(what|whoa+|woah+|wow+|omg|no way|huh|monkas|wutface)\b|😮|😱|‽|!{2,}/i],
  ['confused',  /\?{2,}|🤔|\b(wut|wat|confused|kappa)\b/i],
  ['sleepy',    /\b(sleep(y)?|tired|boring|bored|zzz+|residentsleeper)\b|😴|💤/i],
  ['happy',     /\b(nice|good|great|yay+|happy|hello|hi|hey|thanks|ty)\b|😊|🙂|:\)|:D/i]
];
function classifyMessage(text){
  var t=String(text||'');
  for(var i=0;i<EXPR_RULES.length;i++){
    if(EXPR_RULES[i][1].test(t)) return EXPR_RULES[i][0];
  }
  if(/\?\s*$/.test(t)) return 'confused';
  return 'notice';
}
/* ============================ [PURE-END] ============================ */

var BUBBLE={ happy:'hi!! :D', laugh:'HAHAHA', hype:"LET'S GOOO", love:'♥♥♥', angry:'grrr!!',
  sad:'aww…', surprised:'?!', confused:'??', sleepy:'zzz…', notice:'!' };
var HOLD={ happy:2.6, laugh:3.2, hype:3.4, love:3.2, angry:3, sad:3.4, surprised:2.2, confused:2.6, sleepy:4, notice:1.2 };

var canvas=document.getElementById('avatar'), ctx=canvas.getContext('2d');
var DPR=Math.min(2, window.devicePixelRatio||1);
function fit(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*DPR; canvas.height=r.height*DPR; }
addEventListener('resize', fit);

/* ---------- the sprite (original character) ---------- */
var BASE=[
'......OOOOOOOO......',
'.....OBBBBBBBBO.....',
'...OOBBBBBBBBBBOO...',
'..OBBBBBBBBBBBBBBO..',
'.OHBBLLLLLLLLLLBBHO.',
'OHPBBLLLLLLLLLLBBPHO',
'OHPBLLLLLLLLLLLLBPHO',
'OHPBLLLLLLLLLLLLBPHO',
'.OHBLLLLLLLLLLLLBHO.',
'..OBLLLLLLLLLLLLBO..',
'..OBBLLLLLLLLLLBBO..',
'...OBBBBBBBBBBBBO...',
'....OOBBBBBBBBOO....',
'.....OBBBBBBBBO.....',
'....OBBCCCCCCBBO....',
'....OBBCCCCCCBBO....',
'.....OBBBBBBBBO.....',
'....OO.OO..OO.OO....'
];
var COLORS={ O:'#2a2440', B:'#b48ae8', L:'#e8dcf5', H:'#3aa89c', P:'#58d8c8', C:'#f2edda' };
var A={ expr:'notice', holdT:0, blinkT:2+Math.random()*3, blink:0, bob:0,
  bubble:'', bubbleT:0, parts:[], lookT:4, look:0, saccade:0 };
function react(expr){
  A.expr=expr; A.holdT=HOLD[expr]||2.5;
  A.bubble=BUBBLE[expr]||'!'; A.bubbleT=Math.min(2.4, A.holdT);
  if(expr==='love') for(var i=0;i<6;i++) A.parts.push({k:'heart',x:(Math.random()-0.5)*80,y:20-Math.random()*30,vy:-30-Math.random()*30,life:1.6});
  if(expr==='hype') for(var j=0;j<8;j++) A.parts.push({k:'star',x:(Math.random()-0.5)*120,y:(Math.random()-0.5)*90,vy:-10,life:1.2});
  if(expr==='sad') for(var s=0;s<2;s++) A.parts.push({k:'tear',x:s?-26:26,y:8,vy:60,life:1.4});
  sndReact(expr);
}
function stepAvatar(dt){
  A.bob+=dt;
  if(A.holdT>0){ A.holdT-=dt; if(A.holdT<=0){ A.expr='notice'; A.expr='idle'; } }
  if(A.bubbleT>0){ A.bubbleT-=dt; if(A.bubbleT<=0) A.bubble=''; }
  A.blinkT-=dt;
  if(A.blinkT<=0){ A.blink=0.13; A.blinkT=2.2+Math.random()*3.4; }
  if(A.blink>0) A.blink-=dt;
  A.lookT-=dt;
  if(A.lookT<=0){ A.look=Math.floor(Math.random()*3)-1; A.lookT=2.5+Math.random()*4; }
  for(var i=A.parts.length-1;i>=0;i--){
    var p=A.parts[i]; p.life-=dt; p.y+=p.vy*dt;
    if(p.k==='tear') p.vy+=140*dt;
    if(p.life<=0) A.parts.splice(i,1);
  }
}
function px(gx,gy,w,h,col,P,ox,oy){
  ctx.fillStyle=col;
  ctx.fillRect(ox+gx*P, oy+gy*P, w*P, h*P);
}
function drawAvatar(now){
  var Wc=canvas.width/DPR, Hc=canvas.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,Wc,Hc);
  // stage floor glow
  ctx.fillStyle='rgba(180,138,232,.06)';
  ctx.beginPath(); ctx.ellipse(Wc/2,Hc*0.82,Math.min(200,Wc*0.3),26,0,0,6.283); ctx.fill();
  var P=Math.max(3, Math.floor(Math.min(Wc/37, Hc/34)));   // ~30% smaller per coldpresss — fits any screen
  var spriteW=20*P, spriteH=18*P;
  var shake=(A.expr==='laugh'||A.expr==='angry')&&A.holdT>0 ? (Math.random()-0.5)*P*0.7 : 0;
  var bounce=A.expr==='hype'&&A.holdT>0 ? -Math.abs(Math.sin(A.bob*9))*P*1.6 : 0;
  var ox=Math.round(Wc/2-spriteW/2+shake);
  var oy=Math.round(Hc*0.78-spriteH+Math.sin(A.bob*1.8)*P*0.35+bounce);
  // ahoge (hair sprout)
  px(9,-2,1,1,COLORS.O,P,ox,oy); px(10,-3,1,1,COLORS.O,P,ox,oy); px(11,-2.6,1,1,COLORS.B,P,ox,oy);
  // base map
  for(var y=0;y<BASE.length;y++){
    for(var x=0;x<BASE[y].length;x++){
      var c=BASE[y][x];
      if(c!=='.') px(x,y,1,1,COLORS[c],P,ox,oy);
    }
  }
  // blush
  px(4.4,9,1.4,0.9,'rgba(242,165,200,.8)',P,ox,oy);

  else if(e==='angry'){
    px(LX-0.3,EY-0.8,2.2,0.5,D,P,ox,oy);   // brows angled via steps
    px(RX+0.2,EY-0.8,2.2,0.5,D,P,ox,oy);

  }
  else if(e==='sad'){
    px(LX,EY+0.2,1.8,1.4,D,P,ox,oy); px(RX,EY+0.2,1.8,1.4,D,P,ox,oy);

  else if(e==='love'){ px(MX,MY,2,0.9,D,P,ox,oy); px(MX+0.4,MY+0.5,1.2,0.6,'#e8547a',P,ox,oy); }
  else if(e==='sad'){ px(MX+0.2,MY+0.5,1.6,0.5,D,P,ox,oy); px(MX-0.4,MY+0.9,0.6,0.5,D,P,ox,oy); px(MX+1.8,MY+0.9,0.6,0.5,D,P,ox,oy); }
  else if(e==='angry'){ px(MX-0.2,MY+0.4,2.4,0.6,D,P,ox,oy); }
  else if(e==='confused'){ px(MX-0.2,MY+0.3,1,0.5,D,P,ox,oy); px(MX+0.8,MY,1,0.5,D,P,ox,oy); px(MX+1.8,MY+0.3,0.8,0.5,D,P,ox,oy); }
  else if(e==='sleepy'){ px(MX+0.5,MY+0.2,1,0.8,D,P,ox,oy); }
  else { px(MX+0.3,MY+0.2,1.4,0.5,D,P,ox,oy); }
  // extras
  if(e==='angry'){ px(15.4,3.4,1.6,0.4,'#e85a5a',P,ox,oy); px(16,2.8,0.4,1.6,'#e85a5a',P,ox,oy); }
  if(e==='confused'){
    ctx.fillStyle='#e8c46a'; ctx.font='700 '+(P*2)+'px "Pixelify Sans",monospace';
    ctx.fillText('?', ox+17*P, oy+2*P);
  }
  if(e==='sleepy'){
    ctx.fillStyle='rgba(178,170,210,.8)'; ctx.font='700 '+(P*1.6)+'px "Pixelify Sans",monospace';
    var zt=(A.bob%2);
    ctx.fillText('z', ox+16.4*P, oy+(2-zt)*P);
    ctx.fillText('Z', ox+17.6*P, oy+(0.8-zt)*P);
  }
  // particles
  A.parts.forEach(function(p){
    var alpha=Math.max(0,Math.min(1,p.life));
    ctx.globalAlpha=alpha;
    if(p.k==='heart'){ ctx.fillStyle='#e8547a'; ctx.font=(P*1.6)+'px serif'; ctx.fillText('♥', Wc/2+p.x, oy+p.y); }
    else if(p.k==='star'){ ctx.fillStyle='#e8c46a'; ctx.font=(P*1.4)+'px serif'; ctx.fillText('✦', Wc/2+p.x, oy+40+p.y); }
    else if(p.k==='tear'){ ctx.fillStyle='#7ad8f0'; ctx.fillRect(Wc/2+p.x, oy+8*P+ (p.y-8), P*0.5, P*0.8); }
    ctx.globalAlpha=1;
  });
  // speech bubble
  if(A.bubble){
    ctx.font='700 '+(P*1.5)+'px "Pixelify Sans",monospace';
    var tw=ctx.measureText(A.bubble).width+P*2;
    var bx=Math.max(8, Math.min(ox+spriteW-P, Wc-tw-8));   // never cut off at the edge
    var by=Math.max(P*3.4, oy-P*1.5);
    ctx.fillStyle='#f2edda';
    ctx.fillRect(bx, by-P*2.2, tw, P*2.6);
    ctx.fillStyle='#2a2440';
    ctx.fillRect(bx, by+P*0.4, P, P);
    ctx.fillStyle='#2a2440';
    ctx.fillText(A.bubble, bx+P, by-P*0.3);
    window.__PAL_LAYOUT={ P:P, bubbleLeft:bx, bubbleRight:bx+tw, bubbleTop:by-P*2.2, W:Wc };
  } else {
    window.__PAL_LAYOUT={ P:P, bubbleLeft:0, bubbleRight:0, bubbleTop:0, W:Wc };
  }
}

var feed=document.getElementById('feed');
function nameColor(name){
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return 'hsl('+(h%360)+',65%,70%)';
}
var EXPR_EMOJI={ happy:'😊', laugh:'😂', hype:'🔥', love:'💜', angry:'😡', sad:'😢',
  surprised:'😮', confused:'🤔', sleepy:'😴', notice:'👀' };
function feedSystem(msg){
  var line=document.createElement('div');
  line.className='line';
  var b=document.createElement('b'); b.style.color='#e8c46a'; b.textContent=msg;
  line.appendChild(b);
  var feed=document.getElementById('feed');
  feed.appendChild(line);
  while(feed.children.length>80) feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
}
function handleChat(user, text, isDemo, tags){
  var expr=classifyMessage(text);
  if(expr==='notice' && tags && tags.emotes){ expr='happy'; }   // a Twitch emote is a feeling too
  react(expr);
  var shownName=(tags && tags['display-name']) || user;
  var color=(tags && /^#[0-9a-fA-F]{6}$/.test(tags.color||'')) ? tags.color : nameColor(user);
  var line=document.createElement('div');
  line.className='line';
  if(isDemo){ var d=document.createElement('span'); d.className='demo'; d.textContent='demo'; line.appendChild(d); }
  var b=document.createElement('b'); b.style.color=color; b.textContent=shownName+': ';
  line.appendChild(b);
  line.appendChild(document.createTextNode(String(text).slice(0,200)));
  var ex=document.createElement('span'); ex.className='ex'; ex.textContent=EXPR_EMOJI[expr];
  line.appendChild(ex);
  feed.appendChild(line);
  while(feed.children.length>80) feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
  return expr;
}

/* ═══════════ TWITCH OAUTH SCAFFOLD (dormant until Client ID is set) ═══════════
   DROP-IN ACTIVATION: paste the operator's registered public Client ID below
   and the whole flow lights up — button enables, implicit-grant login works,
   an authenticated send socket opens. Empty = honestly disabled, no fake login. */
var OAUTH={
  CLIENT_ID: 'neyrkc1hg4agqfv33zxmev4dtkdggd',    // registered public Client ID (chat-supplied 2026-08-07, probe-verified against id.twitch.tv)
  REDIRECT: location.origin + '/pixl-pal/',
  SCOPES: 'chat:read chat:edit',
  token: null, login: null
};
function oauthBuildUrl(cid, redirect, scopes, state){
  return 'https://id.twitch.tv/oauth2/authorize'
    + '?response_type=token'
    + '&client_id=' + encodeURIComponent(cid)
    + '&redirect_uri=' + encodeURIComponent(redirect)
    + '&scope=' + encodeURIComponent(scopes)
    + '&state=' + encodeURIComponent(state);
}
function oauthParseReturn(hash){
  var h=String(hash||'').replace(/^#/,'');
  if(!h) return null;
  var out={};
  h.split('&').forEach(function(kv){
    var i=kv.indexOf('=');
    if(i>=0) out[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1));
  });
  return out.access_token ? out : null;
}
function oauthReady(){ return /^[a-z0-9]{20,40}$/i.test(OAUTH.CLIENT_ID); }
function oauthLogin(){
  if(!oauthReady()) return;
  var state=(Math.random().toString(36)+Math.random().toString(36)).slice(2,26);
  try{ sessionStorage.setItem('pixl-oauth-state', state); }catch(e){}
  var url=oauthBuildUrl(OAUTH.CLIENT_ID, OAUTH.REDIRECT, OAUTH.SCOPES, state);
  /* we run inside the _bar wrapper's iframe — Twitch sends X-Frame-Options and
     refuses to render framed, so navigate the TOP window (same-origin, allowed).
     Return trip is fine: the wrapper forwards the token fragment back into us. */
  try{ window.top.location.href=url; }catch(e){ location.href=url; }
}
function oauthHandleReturn(){
  var ret=oauthParseReturn(location.hash);
  if(!ret) return false;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  /* the _bar wrapper forwards location.hash into this iframe but keeps the token
     in the TOP window's address bar — same-origin, so scrub that copy too */
  try{
    if(window.top!==window && window.top.location.hash){
      window.top.history.replaceState(null,'',window.top.location.pathname+window.top.location.search);
    }
  }catch(e){}
  var saved=''; try{ saved=sessionStorage.getItem('pixl-oauth-state')||''; }catch(e){}
  if(!ret.state || ret.state!==saved){ dbg('oauth: state mismatch — token discarded'); return false; }
  OAUTH.token=ret.access_token;
  try{ sessionStorage.setItem('pixl-oauth-token', OAUTH.token); }catch(e){}
  fetchOauthLogin();
  return true;
}
function fetchOauthLogin(){
  fetch('https://id.twitch.tv/oauth2/validate', { headers:{ Authorization:'OAuth '+OAUTH.token } })
    .then(function(r){ return r.ok?r.json():Promise.reject('invalid'); })
    .then(function(j){ OAUTH.login=j.login; onOauthAuthed(); })
    .catch(function(){ dbg('oauth: token failed validation'); oauthLogout(); });
}
var sendSock=null;
/* self-echo guard (coldpresss's double-post report): we echo sends locally for
   instant feedback, but the anonymous READ socket also gets our own message
   back from Twitch. Ledger each send; suppress ONE matching incoming copy. */
var recentSends=[];
function noteSent(text){
  recentSends.push({t:text, at:Date.now()});
  if(recentSends.length>20) recentSends.shift();
}
function isSelfEcho(user, text){
  if(!OAUTH.login) return false;
  if(String(user||'').toLowerCase()!==String(OAUTH.login).toLowerCase()) return false;
  var now=Date.now();
  for(var i=0;i<recentSends.length;i++){
    if(now-recentSends[i].at<10000 && recentSends[i].t===text){
      recentSends.splice(i,1);
      return true;
    }
  }
  return false;
}
function onOauthAuthed(){
  var b=document.getElementById('oauthBtn');
  b.classList.add('authed'); b.disabled=false;
  b.textContent='✓ '+OAUTH.login+' — log out';
  document.getElementById('oauthNote').textContent='you can now send to chat as yourself. token is in this tab only.';
  document.getElementById('sayIn').placeholder='send to #'+(wsChan||'chat')+' as '+OAUTH.login+'…';
  dbg('oauth: authed as', OAUTH.login);
}
function oauthLogout(){
  OAUTH.token=null; OAUTH.login=null;
  try{ sessionStorage.removeItem('pixl-oauth-token'); }catch(e){}
  if(sendSock){ try{ sendSock.close(); }catch(e){} sendSock=null; }
  applyOauthState();
}
function sendAsUser(chan, text){
  if(!OAUTH.token || !OAUTH.login) return false;
  if(!sendSock || sendSock.readyState!==1){
    sendSock=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    sendSock.onopen=function(){
      sendSock.send('PASS oauth:'+OAUTH.token);
      sendSock.send('NICK '+OAUTH.login);
      sendSock.send('JOIN #'+chan);
      setTimeout(function(){ sendSock.send('PRIVMSG #'+chan+' :'+text); }, 400);
    };
    return true;
  }
  sendSock.send('PRIVMSG #'+chan+' :'+text);
  return true;
}
function applyOauthState(){
  var b=document.getElementById('oauthBtn'), note=document.getElementById('oauthNote');
  if(!b) return;
  if(OAUTH.token && OAUTH.login){ onOauthAuthed(); return; }
  if(oauthReady()){
    b.disabled=false; b.classList.remove('authed');
    b.textContent='🟣 log in with Twitch to chat as yourself';
    note.textContent='opens Twitch\'s own consent page · minimal scopes (chat only) · token stays in this tab';
  } else {
    b.disabled=true; b.classList.remove('authed');
    b.textContent='🔒 log in with Twitch (setup pending)';
    note.textContent='dormant until an operator registers a Twitch app · see notes.md → twitch-oauth-readiness';
  }
}
document.getElementById('oauthBtn').addEventListener('click', function(){
  if(OAUTH.token) oauthLogout(); else oauthLogin();
});
(function bootOauth(){
  try{ OAUTH.token=sessionStorage.getItem('pixl-oauth-token')||null; }catch(e){}
  if(oauthHandleReturn()){ /* fresh login */ }
  else if(OAUTH.token && oauthReady()){ fetchOauthLogin(); }
  else applyOauthState();
})();

/* ---------- draggable overlays (per chat request) ----------
   Pixl's box + the chat panel move by their ⠿ grips (chat also by its header).
   The Twitch iframe only loses pointer events DURING an active drag, so the
   player's controls stay fully usable the rest of the time. */
function makeDraggable(box, handle, key, opts){
  var drag=false, ox=0, oy=0, lastX=0, lastY=0, lastT=0, vel=0;
  function clampApply(l, t, fromDrag){
    var r=box.getBoundingClientRect();
    var maxL=window.innerWidth - r.width, maxT=window.innerHeight - r.height;
    var cl=Math.max(0, Math.min(maxL, l)), ct=Math.max(0, Math.min(maxT, t));
    if(fromDrag && opts && opts.onCollide){
      if(l < -2)        opts.onCollide('wall-left',   {x:2,                y:ct + r.height/2}, vel);
      else if(l > maxL+2) opts.onCollide('wall-right',{x:window.innerWidth-2, y:ct + r.height/2}, vel);
      if(t < -2)        opts.onCollide('wall-top',    {x:cl + r.width/2,  y:2}, vel);
      else if(t > maxT+2) opts.onCollide('wall-bottom',{x:cl + r.width/2, y:window.innerHeight-2}, vel);
    }
    box.style.left=cl+'px'; box.style.top=ct+'px';
    box.style.right='auto'; box.style.bottom='auto';
    return {l:cl, t:ct};
  }
  function persist(){
    var r=box.getBoundingClientRect();
    try{ localStorage.setItem(key, JSON.stringify({l:Math.round(r.left), t:Math.round(r.top)})); }catch(e){}
  }
  handle.addEventListener('pointerdown', function(e){
    if(e.button) return;
    var b=e.target.closest('button');
    if(b && !b.classList.contains('grip')) return;   // minbtn etc. keep their clicks
    drag=true; document.body.classList.add('dragging');
    var r=box.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
    lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); vel=0;
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function(e){
    if(!drag) return;
    var now=performance.now(), dt=(now-lastT)/1000;
    if(dt>0){
      var d=Math.hypot(e.clientX-lastX, e.clientY-lastY);
      vel=vel*0.5 + (d/dt)*0.5;                       // smoothed px/s
    }
    lastX=e.clientX; lastY=e.clientY; lastT=now;
    clampApply(e.clientX-ox, e.clientY-oy, true);
    if(opts && opts.onOverlap) opts.onOverlap(box.getBoundingClientRect(), vel);
  });
  function endDrag(){
    if(!drag) return;
    drag=false; document.body.classList.remove('dragging'); persist();
  }
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
  handle.addEventListener('keydown', function(e){
    var d={ArrowLeft:[-16,0], ArrowRight:[16,0], ArrowUp:[0,-16], ArrowDown:[0,16]}[e.key];
    if(!d) return;
    e.preventDefault();
    var r=box.getBoundingClientRect();
    clampApply(r.left+d[0], r.top+d[1]); persist();
  });
  handle.addEventListener('dblclick', function(){
    box.style.left=box.style.top=box.style.right=box.style.bottom='';
    try{ localStorage.removeItem(key); }catch(e){}
  });
  window.addEventListener('resize', function(){
    if(box.style.left){ var r=box.getBoundingClientRect(); clampApply(r.left, r.top); }
  });
  try{
    var p=JSON.parse(localStorage.getItem(key)||'null');
    if(p && typeof p.l==='number') clampApply(p.l, p.t);
  }catch(e){}
}
/* ---------- popcorn physics (per chat: slow drags = shy kernel, yeets = the whole bag) ---------- */
var POP_REDUCED=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var YEET=1400, MEDIUM=600;
function popSound(speed){
  if(palMuted) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(!AC) return;
  try{
    var n=speed>YEET?7:(speed>MEDIUM?3:1);
    for(var i=0;i<n;i++){
      var t=AC.currentTime + i*0.045 + Math.random()*0.02;
      var buf=AC.createBuffer(1, AC.sampleRate*0.05|0, AC.sampleRate), d=buf.getChannelData(0);
      for(var j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);
      var src=AC.createBufferSource(); src.buffer=buf;
      var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400+Math.random()*1600; f.Q.value=2.5;
      var g=AC.createGain(); g.gain.setValueAtTime(speed>YEET?0.15:0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
    }
    if(speed>YEET){
      var t2=AC.currentTime, o=AC.createOscillator(), g2=AC.createGain();
      o.type='sine'; o.frequency.setValueAtTime(160,t2); o.frequency.exponentialRampToValueAtTime(55,t2+0.18);
      g2.gain.setValueAtTime(0.16,t2); g2.gain.exponentialRampToValueAtTime(0.001,t2+0.2);
      o.connect(g2); g2.connect(AC.destination); o.start(t2); o.stop(t2+0.22);
    }
  }catch(e){}
}
function spawnKernel(x, y, cfg){
  var s=document.createElement('span'); s.className='pop';
  s.textContent=cfg.glyph;
  s.style.left=x+'px'; s.style.top=y+'px';
  s.style.fontSize=cfg.size+'rem';
  s.style.setProperty('--dx',  cfg.dx);
  s.style.setProperty('--upy', cfg.upy);
  s.style.setProperty('--dy',  cfg.dy);
  s.style.setProperty('--rot', (Math.random()*720-360)+'deg');
  s.style.setProperty('--dur', cfg.dur+'s');
  document.body.appendChild(s);
  setTimeout(function(){ s.remove(); }, cfg.dur*1000+150);
  return s;
}
function popcornAt(x, y, speed){
  var yeet=speed>YEET;
  var n=yeet?24:(speed>MEDIUM?9:1);            // one SHY kernel for gentle bumps
  if(!POP_REDUCED){
    n=Math.max(0, Math.min(n, 120-document.querySelectorAll('.pop').length));
    var reach=yeet?1:(speed>MEDIUM?0.55:0.22);
    for(var i=0;i<n;i++){
      spawnKernel(x, y, {
        glyph: yeet&&i===0 ? '💥' : (Math.random()<0.72?'🍿':'•'),
        size:  yeet ? (i===0?1.7:0.65+Math.random()*0.85) : 0.55+Math.random()*0.3,
        dx: ((Math.random()*2-1)*13*reach)+'rem',
        upy: (-(2+Math.random()*8*reach))+'rem',
        dy: ((2+Math.random()*6*reach))+'rem',
        dur: 0.55+Math.random()*0.5
      });
    }
    if(yeet) ratCameo(x, y);
  }
  popSound(speed);
  if(yeet) react('surprised');
}
/* one kernel hits the rat attorney on the head, for old times' sake */
var ratLastAt=-Infinity;
function ratCameo(x, y){
  var now=performance.now();
  if(now-ratLastAt<20000) return;
  ratLastAt=now;
  var rx=Math.max(60, Math.min(window.innerWidth-60, x+(Math.random()<0.5?-1:1)*(120+Math.random()*160)));
  var cam=document.createElement('div');
  cam.className='ratcameo';
  cam.innerHTML='<span class="say">objection. billing hourly.</span><span class="rat">🐀</span><span class="robe">⚖️💼</span>';
  cam.style.left=rx+'px';
  document.body.appendChild(cam);
  requestAnimationFrame(function(){ cam.classList.add('in'); });
  setTimeout(function(){                          // the incriminating kernel, aimed at his head
    var ratTop=cam.getBoundingClientRect().top;
    spawnKernel(x, y, { glyph:'🍿', size:0.8,
      dx:(rx-x)+'px', upy:(Math.min(-40, ratTop-y-120))+'px', dy:(ratTop-y+6)+'px', dur:0.6 });
    setTimeout(function(){ cam.classList.add('bonked'); popSound(200); }, 560);
  }, 380);
  setTimeout(function(){ cam.classList.remove('in'); }, 3300);
  setTimeout(function(){ cam.remove(); }, 3800);
}
var popCooldown={}, popWasOver=false;
function palCollide(kind, pt, speed){
  var now=performance.now();
  if(speed<60) return;                            // resting against a wall isn't a collision
  if(popCooldown[kind] && now-popCooldown[kind]<320) return;
  popCooldown[kind]=now;
  popcornAt(pt.x, pt.y, speed);
}
function palOverlap(rect, speed){
  var c=document.querySelector('.chatcol').getBoundingClientRect();
  var over=!(rect.right<c.left || rect.left>c.right || rect.bottom<c.top || rect.top>c.bottom);
  if(over && !popWasOver){
    palCollide('panel', {
      x:(Math.max(rect.left,c.left)+Math.min(rect.right,c.right))/2,
      y:(Math.max(rect.top,c.top)+Math.min(rect.bottom,c.bottom))/2
    }, speed);
  }
  popWasOver=over;
}

function applyPalMute(){
  var b=document.getElementById('palMuteBtn');
  b.textContent=palMuted?'🔇 pixl':'🔊 pixl';
  b.setAttribute('aria-pressed', String(palMuted));
}
document.getElementById('palMuteBtn').addEventListener('click', function(){
  palMuted=!palMuted;
  try{ localStorage.setItem('pixl-muted', palMuted?'1':'0'); }catch(e){}
  applyPalMute();
});
applyPalMute();
makeDraggable(document.getElementById('palBox'), document.getElementById('palGrip'), 'pixl-pal-pos',
  { onCollide:palCollide, onOverlap:palOverlap });
var _chatCol=document.querySelector('.chatcol');
makeDraggable(_chatCol, document.getElementById('chatHead'), 'pixl-chat-pos');

/* ---------- twitch (anonymous IRC — repo-proven bridge) ----------
   Debug logging per coldpresss's reconnect report: every connection-state
   transition prints to the console as [pixl-pal:irc]. Open devtools to watch. */
var ws=null, wsChan='', wsGen=0, wsAttempt=0, reconnectTimer=null;
var lastDataAt=0, watchdogTimer=null;
var WATCHDOG_CHECK_MS=30000, WATCHDOG_STALE_MS=330000;   // Twitch pings ~5min; 5.5min silence = dead socket
function watchdogCheck(gen){
  if(gen!==wsGen){ clearInterval(watchdogTimer); return 'stale-gen'; }
  var silent=performance.now()-lastDataAt;
  if(silent>WATCHDOG_STALE_MS){
    dbg('watchdog: no data for',Math.round(silent/1000)+'s (threshold '+Math.round(WATCHDOG_STALE_MS/1000)+'s) — forcing reconnect');
    try{ ws && ws.close(); }catch(e){}
    return 'reconnect';
  }
  return 'healthy';
}
function dbg(){
  var a=['%c[pixl-pal:irc]','color:#b48ae8;font-weight:bold',
    new Date().toISOString().slice(11,23)];
  for(var i=0;i<arguments.length;i++) a.push(arguments[i]);
  try{ console.log.apply(console, a); }catch(e){}
}
function setPill(cls,txt){
  var p=document.getElementById('pill');
  p.className='pill '+cls;
  document.getElementById('pillTxt').textContent=txt;
}
function scheduleReconnect(chan, gen){
  if(gen!==wsGen) { dbg('stale socket (gen',gen,'vs',wsGen,') — NOT scheduling reconnect'); return; }
  wsAttempt++;
  var delay=Math.min(30000, 3500*Math.pow(2, wsAttempt-1));
  dbg('scheduling reconnect #'+wsAttempt,'to #'+chan,'in',Math.round(delay/1000)+'s');
  setPill('err','reconnecting ×'+wsAttempt+'…');
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(function(){
    if(gen===wsGen && wsChan===chan) connectTwitch(chan, true);
    else dbg('reconnect cancelled — channel or generation changed');
  }, delay);
}
function connectTwitch(chan, isRetry){
  chan=(chan||'').toLowerCase().trim().replace(/^#/,'').replace(/[^a-z0-9_]/g,'');
  if(!chan) return;
  if(!isRetry) wsAttempt=0;
  clearTimeout(reconnectTimer);
  wsGen++;
  var gen=wsGen;
  dbg('connect attempt (gen',gen+') → #'+chan, isRetry?'(retry #'+wsAttempt+')':'(fresh)');
  if(ws){ dbg('closing previous socket'); try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  if(wsChan && wsChan!==chan && !isRetry){          // switching streams: old chat is stale
    feed.innerHTML='';
    feedSystem('— switched to #'+chan+' —');
  }
  wsChan=chan;
  updateStreamEmbed();                              // stream backdrop follows the connected channel
  setPill('','connecting…');
  try{
    ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  }catch(e){ dbg('WebSocket constructor threw:', e.message); setPill('err','connection failed'); return; }
  var sock=ws;
  lastDataAt=performance.now();
  clearInterval(watchdogTimer);
  watchdogTimer=setInterval(function(){ watchdogCheck(gen); }, WATCHDOG_CHECK_MS);
  dbg('watchdog armed: reconnect if silent >'+Math.round(WATCHDOG_STALE_MS/1000)+'s');
  sock.onopen=function(){
    if(gen!==wsGen){ dbg('stale socket opened (gen',gen,') — closing'); try{ sock.close(); }catch(e){} return; }
    var nick='justinfan'+Math.floor(Math.random()*80000+1000);
    dbg('socket OPEN · registering as',nick,'· joining #'+chan,'· requesting tags+commands caps');
    sock.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    sock.send('PASS SCHMOOPIIE');
    sock.send('NICK '+nick);
    sock.send('JOIN #'+chan);
    setPill('live','live · #'+chan);
    demoOn=false;
    document.getElementById('sr').textContent='Connected to '+chan+' chat.';
  };
  sock.onmessage=function(ev){
    if(gen!==wsGen) return;
    lastDataAt=performance.now();
    String(ev.data).split('\r\n').forEach(function(raw){
      if(!raw) return;
      if(raw.indexOf('PING')===0){ dbg('PING → PONG'); sock.send('PONG :tmi.twitch.tv'); return; }
      var pl=parseIrcLine(raw);
      if(!pl) return;
      if(pl.cmd==='366'){ dbg('JOIN confirmed (366) — tags cap active, attempt counter reset'); wsAttempt=0; return; }
      if(pl.cmd==='NOTICE'){ dbg('server NOTICE:', raw.slice(0,140)); return; }
      if(pl.cmd==='RECONNECT'){ dbg('server sent RECONNECT — obeying'); try{ sock.close(); }catch(e){} return; }
      handleIrcParsed(pl);
    });
  };
  sock.onclose=function(ev){
    clearInterval(watchdogTimer);
    dbg('socket CLOSED · code',ev&&ev.code,'· reason',JSON.stringify(ev&&ev.reason||''),'· wasClean',ev&&ev.wasClean,'· gen',gen);
    if(gen===wsGen && wsChan===chan) scheduleReconnect(chan, gen);
  };
  sock.onerror=function(){ dbg('socket ERROR (details are hidden by browsers — see the close code next)'); setPill('err','chat error'); };
  try{ localStorage.setItem('pixl-pal-chan', chan); }catch(e){}
}
document.getElementById('connectBtn').addEventListener('click', function(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  connectTwitch(document.getElementById('chanIn').value);
});
document.getElementById('chanIn').addEventListener('keydown', function(e){
  if(e.key==='Enter') document.getElementById('connectBtn').click();
});
/* ---- auto-connect on startup (coldpresss investigation, 2026-08-07) ----
   Finding: auto-connect never existed — boot only PREFILLED the input, so
   nothing fired. Not a race, not permissions: WebSockets need no user gesture
   (only the AudioContext does, and sound stays gesture-gated by design).
   Policy: returning users (saved channel = they connected before) auto-connect
   after a short settle; first-timers keep demo chat until they opt in. */
var savedChan=null;
try{ savedChan=localStorage.getItem('pixl-pal-chan'); }catch(e){}
document.getElementById('chanIn').value=savedChan||'sloppy_ai';
if(savedChan){
  dbg('auto-connect: saved channel #'+savedChan+' found — connecting in 0.4s');
  setTimeout(function(){
    if(wsGen===0){ connectTwitch(savedChan); }        // unless the user beat us to the button
    else dbg('auto-connect: skipped — a manual connect already happened');
  }, 400);
} else {
  dbg('auto-connect: no saved channel — staying in demo mode (connect once to opt in)');
}

/* ---------- local say ---------- */
function sayLocal(){
  var inp=document.getElementById('sayIn');
  var t=inp.value.trim();
  if(!t) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  demoOn=false;
  if(OAUTH.token && OAUTH.login && wsChan){       // authed → send to the real chat as yourself
    if(sendAsUser(wsChan, t)){
      noteSent(t);                                // ledger it so the read-socket copy is suppressed
      handleChat(OAUTH.login, t, false);          // echo locally so Pixl reacts immediately
      inp.value=''; inp.focus();
      return;
    }
  }
  var expr=handleChat('you', t, false);
  document.getElementById('sr').textContent='Pixl reacts: '+expr;
  inp.value=''; inp.focus();
}
document.getElementById('sayBtn').addEventListener('click', sayLocal);
document.getElementById('sayIn').addEventListener('keydown', function(e){ if(e.key==='Enter') sayLocal(); });

/* ---------- expression test buttons ---------- */
document.querySelectorAll('.exprbar button').forEach(function(b){
  b.addEventListener('click', function(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    react(this.dataset.x);
    document.getElementById('sr').textContent='Pixl feels '+this.dataset.x+'.';
  });
});

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  stepAvatar(dt); stepDemo(dt); drawAvatar(now);
}
fit();
updateStreamEmbed();
applyChatMin();
requestAnimationFrame(frame);
window.__PAL={ classifyMessage:classifyMessage, react:react, handleChat:handleChat,
  noteSent:noteSent, isSelfEcho:isSelfEcho, recentSends:recentSends,
  stream:{ update:updateStreamEmbed, channel:streamChannel, get on(){return streamOn;} },
  popcorn:{ at:popcornAt, collide:palCollide, overlap:palOverlap, rat:ratCameo, get reduced(){return POP_REDUCED;} },
  get A(){return A;}, stepAvatar:stepAvatar, drawAvatar:drawAvatar,
  wd:{ check:watchdogCheck, get lastDataAt(){return lastDataAt;}, age:function(ms){ lastDataAt=performance.now()-ms; }, get gen(){return wsGen;} },
  parseIrcLine:parseIrcLine, handleIrcParsed:handleIrcParsed,
  oauth:{ ready:oauthReady, buildUrl:oauthBuildUrl, parseReturn:oauthParseReturn, cfg:OAUTH, applyState:applyOauthState } };
</script>
