<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overfed · a clicker fish you will ruin with love</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%90%A1">
  <meta name="description" content="Feed the little fish. Upgrade the tank. Keep feeding past every warning until boss music plays from inside the aquarium. This is your fault.">
  <meta property="og:title" content="Overfed — feed the fish. no, stop. STOP.">
  <meta property="og:description" content="A clicker fish that grows into a boss monster when overfed, with upgrading tanks and underwater boss music. You were warned.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/cute%20pufferfish%20transforming%20into%20giant%20monster%20cracked%20aquarium%20glass%20dramatic%20red%20lighting%20game%20poster?width=1200&height=630&seed=3131&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/overfed">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --deep:#0a1622; --glass:#12283a; --ink:#dcecf4; --dim:#6f8fa0; --pellet:#e8a13e; --coin:#e8d05a; --danger:#e83e4e; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--deep); color:var(--ink);
      font:400 0.95rem/1.55 'IBM Plex Mono', monospace;
      display:flex; flex-direction:column; align-items:center;
      padding:1.3rem 1rem 3rem;
      background-image:radial-gradient(ellipse 46rem 26rem at 50% -8%, rgba(62,168,232,0.08), transparent 60%);
      transition:background-color 0.8s;
    }
    body.bossmode{ background-color:#1c0a10; }
    header{ text-align:center; margin-bottom:0.8rem; }
    h1{ font:400 clamp(2rem,7vw,3rem)/1 'Chewy', cursive; margin:0; color:#7ec8e8; }
    body.bossmode h1{ color:var(--danger); }
    .tag{ font-size:0.72rem; color:var(--dim); margin:0.25rem 0 0; }
    .hud{
      display:flex; gap:0.9rem; flex-wrap:wrap; justify-content:center;
      font-size:0.72rem; color:var(--dim); margin-bottom:0.7rem;
    }
    .hud b{ color:var(--coin); }
    .stage-wrap{ position:relative; width:min(40rem,96vw); }
    canvas{
      display:block; width:100%; height:auto; aspect-ratio:640/420;
      border-radius:10px; cursor:pointer;
    }
    .meterrow{ margin:0.6rem 0; }
    .meter{
      height:0.85rem; background:#0d1c2a; border:1.5px solid #234; border-radius:99px; overflow:hidden;
    }
    .meter i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#3ea8e8,#7ec8e8); transition:width 0.2s; }
    .meter.overfeed i{ background:linear-gradient(90deg,#e8a13e,var(--danger)); }
    .meterlabel{ font-size:0.62rem; color:var(--dim); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:0.2rem; display:flex; justify-content:space-between; }
    .meterlabel .warn{ color:var(--danger); font-weight:600; }
    .row{ display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.5rem; }
    .btn{
      flex:1; min-width:10rem; cursor:pointer;
      font:400 1.15rem 'Chewy', cursive;
      background:#173048; color:var(--ink); border:2px solid #2a4a66; border-radius:10px;
      padding:0.7rem 1rem; min-height:3.4rem;
    }
    .btn:hover{ border-color:#7ec8e8; }
    .btn:active{ transform:scale(0.98); }
    .btn:disabled{ opacity:0.4; cursor:default; }
    .btn:focus-visible{ outline:3px solid var(--coin); outline-offset:2px; }
    .btn small{ display:block; font:400 0.62rem 'IBM Plex Mono', monospace; color:var(--dim); }
    .btn.feedbtn{ background:#1c3a2a; border-color:#2e5a40; }
    .btn.feedbtn:hover{ border-color:var(--pellet); }
    #musicNote{ font-size:0.66rem; color:var(--dim); text-align:center; margin-top:0.6rem; }
    body.bossmode #musicNote{ color:var(--danger); }
    .toast{
      position:fixed; left:50%; bottom:1rem; transform:translateX(-50%);
      background:#0d1c2a; border:1.5px solid #7ec8e8; color:var(--ink);
      font-size:0.75rem; padding:0.55rem 1rem; border-radius:8px; max-width:92vw;
      opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:9;
    }
    .toast.show{ opacity:1; }
    @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">OVERFED</h1>
    <p class="tag" id="tagline">a small fish · a small tank · your total inability to stop</p>
  </header>
  <div class="hud">
    <span>coins <b id="hCoins">0</b></span>
    <span>tank <b id="hTank">fishbowl</b></span>
    <span>fish <b id="hStage">fry</b></span>
    <span id="hBoss" hidden style="color:var(--danger)">⚠ BOSS <b id="hBossT">30</b>s</span>
  </div>
  <div class="stage-wrap">
    <canvas id="cv" width="640" height="420" role="application"
      aria-label="The aquarium. Click or tap the tank to drop a food pellet. The fish eats, grows, and produces coins. Overfeeding has consequences the game warned you about."></canvas>
    <div class="meterrow">
      <div class="meterlabel"><span id="growLabel">GROWTH</span><span id="warnLabel"></span></div>
      <div class="meter" id="meter"><i id="meterFill"></i></div>
    </div>
    <div class="row">
      <button class="btn feedbtn" id="feedBtn" type="button">🍤 FEED<small>tap the tank works too</small></button>
      <button class="btn" id="tankBtn" type="button">🛒 UPGRADE TANK<small id="tankCost">—</small></button>
      <button class="btn" id="museBtn" type="button">🔇 SOUND<small>boss music is muffled by water. correctly.</small></button>
    </div>
    <p id="musicNote">the tank is calm. the fish is small. nothing is wrong yet.</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function(){
    'use strict';
    var W=640, H=420;
    var cv=document.getElementById('cv'), X=cv.getContext('2d');
    var $=function(id){ return document.getElementById(id); };
    var toast=$('toast'), toastT=null;
    function say(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ toast.classList.remove('show'); },2800); }

    var TANKS=[
      { n:'fishbowl',        cap:1, cost:0,    w:0.42, glass:'#7ec8e8' },
      { n:'starter tank',    cap:2, cost:60,   w:0.62, glass:'#7ee8c8' },
      { n:'show aquarium',   cap:3, cost:420,  w:0.82, glass:'#c8a2e8' },
      { n:'public exhibit',  cap:4, cost:2400, w:0.95, glass:'#e8d05a' },
    ];
    var STAGES=['fry','goldfish','chonk','leviathan-in-training','THE MISTAKE'];
    var st={ coins:0, growth:0, stage:0, tank:0, overfeed:0, boss:false, bossT:0, rebuilt:0 };
    var KEY='overfed-v1';
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s) st=Object.assign(st,s,{boss:false,bossT:0,overfeed:Math.min(s.overfeed||0,99)}); }catch(e){}
    function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

    var fish={ x:W/2, y:H/2, vx:0.4, face:1, wig:0, mouth:0 };
    var pellets=[], bubbles=[], quake=0;

    /* ── audio: calm bubbles vs BOSS MUSIC — all routed through the WATER
       (a lowpass at 700Hz + wobble), because the band is inside the tank ── */
    var AC=null, muted=true, water=null, bossLoop=null;
    function ac(){
      if(!AC){ try{
        AC=new (window.AudioContext||window.webkitAudioContext)();
        water=AC.createBiquadFilter(); water.type='lowpass'; water.frequency.value=700; water.Q.value=1.2;
        var wob=AC.createOscillator(), wg=AC.createGain();
        wob.frequency.value=0.4; wg.gain.value=90;
        wob.connect(wg); wg.connect(water.frequency); wob.start();
        water.connect(AC.destination);
      }catch(e){} }
      if(AC&&AC.state==='suspended') AC.resume();
      return AC;
    }
    function tone(f0,f1,t0,dur,vol,type){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(f0,t0);
      if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
      g.gain.setValueAtTime(0.0008,t0); g.gain.linearRampToValueAtTime(vol,t0+0.006);
      g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
      o.connect(g); g.connect(water);
      o.start(t0); o.stop(t0+dur+0.03);
    }
    function plop(){ if(muted||!ac()) return; tone(420,180,AC.currentTime,0.12,0.08,'sine'); }
    function chomp(){ if(muted||!ac()) return; tone(160,90,AC.currentTime,0.09,0.09,'square'); }
    function coinSnd(){ if(muted||!ac()) return; tone(880,1320,AC.currentTime,0.1,0.05,'triangle'); }
    /* THE BOSS LOOP: driving eighth-note bass riff in E-minor + alarm lead +
       kick thump, scheduled bar by bar, drowned to 700Hz like the whole
       orchestra rented space behind the fish. */
    function startBossMusic(){
      if(muted||!ac()||bossLoop) return;
      var bpm=138, beat=60/bpm, bar=0, RIFF=[82.4,82.4,123.5,82.4,98,82.4,146.8,130.8];
      bossLoop=setInterval(function(){
        if(!AC) return;
        var t0=AC.currentTime+0.02;
        for(var i=0;i<8;i++){
          var t=t0+i*beat/2;
          tone(RIFF[i],RIFF[i],t,beat/2*0.9,0.16,'sawtooth');            // the riff
          if(i%2===0) tone(55,38,t,0.11,0.22,'sine');                     // kick thump
        }
        if(bar%2===1){ tone(659,622,t0,beat*1.4,0.07,'square'); }         // alarm lead, bent
        if(bar%4===3){ tone(41.2,41.2,t0,beat*3.8,0.2,'sawtooth'); }      // low drone bar
        bar++;
      }, beat*4*1000);
    }
    function stopBossMusic(){ if(bossLoop){ clearInterval(bossLoop); bossLoop=null; } }
    $('museBtn').addEventListener('click',function(){
      muted=!muted; ac();
      this.innerHTML=(muted?'🔇':'🔊')+' SOUND<small>boss music is muffled by water. correctly.</small>';
      if(!muted&&st.boss) startBossMusic();
      if(muted) stopBossMusic();
    });

    /* ── feeding ── */
    function feed(){
      if(st.boss) return;
      var mx=fish.x+(Math.random()*2-1)*120;
      pellets.push({ x:Math.max(30,Math.min(W-30,mx)), y:26, vy:0 });
      plop();
    }
    $('feedBtn').addEventListener('click',feed);
    cv.addEventListener('pointerdown',feed);

    function maxGrowth(){ return TANKS[st.tank].cap; }
    function eat(){
      chomp();
      st.coins+=1+st.stage*2+st.rebuilt;
      coinSnd();
      if(st.stage>=4){                       // fully grown everywhere: overfeeding begins
        st.overfeed=Math.min(100,st.overfeed+4);
        if(st.overfeed>=100&&!st.boss) goBoss();
      } else if(st.stage<maxGrowth()){
        st.growth+=8;
        if(st.growth>=100){ st.growth=0; st.stage++; say('it grew. '+STAGES[st.stage]+' now. it looks… hungrier.'); }
      } else {
        say('the '+TANKS[st.tank].n+' is too small for more growth. upgrade — or keep feeding anyway. see what happens.');
        st.overfeed=Math.min(100,st.overfeed+2);
        if(st.overfeed>=60&&st.tank<3) say('⚠ it is pressing against the glass.');
        if(st.overfeed>=100&&!st.boss) goBoss();
      }
      save();
    }
    /* ── the transformation ── */
    function goBoss(){
      st.boss=true; st.bossT=30; quake=40;
      document.body.classList.add('bossmode');
      $('title').textContent='YOU DID THIS';
      $('tagline').textContent='the fish remembers every pellet';
      $('hBoss').hidden=false;
      $('musicNote').textContent='♪ boss music is playing from inside the aquarium (muffled, as physics demands) ♪';
      startBossMusic();
      say('🎺 THE MISTAKE AWAKENS. survive its tantrum.');
    }
    function endBoss(){
      st.boss=false; st.overfeed=0; st.stage=2; st.growth=0;
      st.coins+=500+st.rebuilt*250; st.rebuilt++;
      stopBossMusic();
      document.body.classList.remove('bossmode');
      $('title').textContent='OVERFED';
      $('tagline').textContent='a small fish · a small tank · your total inability to stop';
      $('hBoss').hidden=true;
      $('musicNote').textContent='the tank is calm again. the fish pretends nothing happened. (+'+(500+((st.rebuilt-1)*250))+' coins in glass-damage insurance)';
      say('it… shrank back. the insurance paid out. you will do this again, won\'t you.');
      save();
    }
    /* ── tank shop ── */
    $('tankBtn').addEventListener('click',function(){
      var next=TANKS[st.tank+1];
      if(!next||st.coins<next.cost) return;
      st.coins-=next.cost; st.tank++;
      say('new home: '+next.n+'. the fish looks pleased. too pleased.');
      save();
    });

    /* ── sim ── */
    function stepSim(dt){
      fish.wig+=dt*(3+st.stage+(st.boss?6:0));
      var speed=(20+st.stage*8)*(st.boss?4:1);
      fish.x+=fish.vx*speed*dt*(st.boss?3:1);
      if(fish.x<90+st.stage*10){ fish.vx=Math.abs(fish.vx); fish.face=1; if(st.boss) quake=Math.max(quake,14); }
      if(fish.x>W-90-st.stage*10){ fish.vx=-Math.abs(fish.vx); fish.face=-1; if(st.boss) quake=Math.max(quake,14); }
      fish.y=H/2+Math.sin(fish.wig*0.6)*(st.boss?60:24);
      fish.mouth=Math.max(0,fish.mouth-dt*4);
      for(var i=pellets.length-1;i>=0;i--){
        var p=pellets[i];
        p.vy=Math.min(60,p.vy+50*dt); p.y+=p.vy*dt;
        var s=30+st.stage*22;
        if(Math.abs(p.x-fish.x)<s&&Math.abs(p.y-fish.y)<s*0.7){ pellets.splice(i,1); fish.mouth=1; eat(); }
        else if(p.y>H-24){ pellets.splice(i,1); }
      }
      if(Math.random()<dt*3) bubbles.push({ x:20+Math.random()*(W-40), y:H-20, r:1+Math.random()*3, v:14+Math.random()*20 });
      for(var b=bubbles.length-1;b>=0;b--){ bubbles[b].y-=bubbles[b].v*dt; if(bubbles[b].y<16) bubbles.splice(b,1); }
      if(st.boss){
        st.bossT-=dt;
        if(Math.random()<dt*2) quake=Math.max(quake,10);
        if(st.bossT<=0) endBoss();
      }
      quake=Math.max(0,quake-dt*30);
    }
    /* ── draw ── */
    function drawFish(){
      var s=16+st.stage*14+(st.boss?18:0);
      X.save(); X.translate(fish.x,fish.y); X.scale(fish.face,1);
      var body=st.boss?'#5a1c28':['#e8a13e','#e8853e','#c86a3e','#a05a4e','#7a3a4e'][st.stage];
      // tail
      X.fillStyle=body;
      X.beginPath(); X.moveTo(-s*0.9,0); X.lineTo(-s*1.5,-s*0.55); X.lineTo(-s*1.5,s*0.55); X.closePath(); X.fill();
      // body
      X.beginPath(); X.ellipse(0,0,s,s*0.66,0,0,6.283); X.fill();
      // belly
      X.fillStyle='rgba(255,255,255,0.18)';
      X.beginPath(); X.ellipse(s*0.1,s*0.22,s*0.7,s*0.3,0,0,6.283); X.fill();
      // spikes past stage 3 / boss
      if(st.stage>=3||st.boss){
        X.fillStyle=st.boss?'#e83e4e':'#8a4a3e';
        var nS=st.boss?7:4;
        for(var i=0;i<nS;i++){
          var a=-1.1+i*(2.2/(nS-1));
          X.beginPath();
          X.moveTo(Math.cos(a)*s*0.8, Math.sin(a)*s*0.55);
          X.lineTo(Math.cos(a)*(s*0.8+10+(st.boss?8:0)), Math.sin(a)*(s*0.55+10));
          X.lineTo(Math.cos(a+0.25)*s*0.75, Math.sin(a+0.25)*s*0.5);
          X.closePath(); X.fill();
        }
      }
      // eye
      X.fillStyle='#fff'; X.beginPath(); X.arc(s*0.45,-s*0.18,s*0.18,0,6.283); X.fill();
      X.fillStyle=st.boss?'#e83e4e':'#132'; X.beginPath(); X.arc(s*0.5,-s*0.18,s*(st.boss?0.12:0.08),0,6.283); X.fill();
      // mouth
      X.fillStyle='#0a0a12';
      X.beginPath(); X.ellipse(s*0.85,s*0.1,s*0.14+fish.mouth*s*0.2,s*0.1+fish.mouth*s*0.24,0,0,6.283); X.fill();
      if(st.boss){ // teeth
        X.fillStyle='#fff';
        X.fillRect(s*0.72,s*0.02,4,6); X.fillRect(s*0.86,s*0.04,4,7); X.fillRect(s*0.98,s*0.02,4,6);
      }
      X.restore();
    }
    function draw(){
      X.save();
      if(quake>0){ X.translate((Math.random()-0.5)*quake*0.4,(Math.random()-0.5)*quake*0.4); }
      var T=TANKS[st.tank];
      // room
      X.fillStyle=st.boss?'#170a10':'#0d1420'; X.fillRect(-20,-20,W+40,H+40);
      // tank water sized by tier
      var tw=W*T.w, tx=(W-tw)/2;
      var g=X.createLinearGradient(0,0,0,H);
      g.addColorStop(0,st.boss?'#3a1622':'#16344a'); g.addColorStop(1,st.boss?'#200a14':'#0d2030');
      X.fillStyle=g; X.fillRect(tx,20,tw,H-40);
      // glass + cracks under overfeed
      X.strokeStyle=T.glass; X.lineWidth=4; X.strokeRect(tx,20,tw,H-40);
      if(st.overfeed>40||st.boss){
        X.strokeStyle='rgba(255,255,255,0.5)'; X.lineWidth=1.5;
        var cracks=Math.floor((st.boss?100:st.overfeed)/22);
        for(var c=0;c<cracks;c++){
          var cx=tx+((c*97)%tw), cy=30+((c*61)%80);
          X.beginPath(); X.moveTo(cx,cy); X.lineTo(cx-9,cy+16); X.lineTo(cx+4,cy+30); X.stroke();
        }
      }
      // sand + plant
      X.fillStyle='#3a3226'; X.fillRect(tx,H-40,tw,18);
      X.strokeStyle='#2e6a4a'; X.lineWidth=3;
      X.beginPath(); X.moveTo(tx+40,H-40);
      X.quadraticCurveTo(tx+30+Math.sin(fish.wig)*6,H-90,tx+44,H-120); X.stroke();
      // clamp fish inside tank
      fish.x=Math.max(tx+50,Math.min(tx+tw-50,fish.x));
      for(var b=0;b<bubbles.length;b++){
        var bb=bubbles[b];
        if(bb.x>tx&&bb.x<tx+tw){ X.beginPath(); X.arc(bb.x,bb.y,bb.r,0,6.283); X.strokeStyle='rgba(200,230,255,0.35)'; X.lineWidth=1; X.stroke(); }
      }
      X.fillStyle='#e8a13e';
      for(var p=0;p<pellets.length;p++){ X.beginPath(); X.arc(pellets[p].x,pellets[p].y,4,0,6.283); X.fill(); }
      drawFish();
      X.restore();
    }
    /* ── HUD paint + loop ── */
    function paint(){
      $('hCoins').textContent=st.coins;
      $('hTank').textContent=TANKS[st.tank].n;
      $('hStage').textContent=st.boss?'THE MISTAKE':STAGES[st.stage];
      var next=TANKS[st.tank+1];
      $('tankBtn').disabled=!next||st.coins<next.cost;
      $('tankCost').textContent=next?(next.n+' · '+next.cost+' coins'):'this is the biggest tank money buys';
      var over=st.stage>=maxGrowth()||st.stage>=4;
      $('meter').classList.toggle('overfeed', over);
      $('growLabel').textContent=over?'OVERFEED':'GROWTH';
      $('warnLabel').textContent=over&&st.overfeed>40?'⚠ THE GLASS IS COMPLAINING':'';
      $('warnLabel').className=over&&st.overfeed>40?'warn':'';
      $('meterFill').style.width=(st.boss?100:(over?st.overfeed:st.growth))+'%';
      if(st.boss) $('hBossT').textContent=Math.ceil(st.bossT);
    }
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/1000,0.05); last=now;
      stepSim(dt); draw(); paint();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    setInterval(save,8000);
    window.__of={ st:st, feed:feed, eat:eat, goBoss:goBoss, endBoss:endBoss, TANKS:TANKS, fish:fish, pellets:pellets, stepSim:stepSim };
  })();
  </script>
</body>
</html>
