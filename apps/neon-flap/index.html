<style>
:root{--ink:#0d0718;--cyan:#3dfcd8;--pink:#ff3fb4;--gold:#ffc861;--dim:rgba(240,228,255,.66)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--ink)}
body{min-height:100dvh;display:grid;place-items:center;padding:10px 0;font-family:'Orbitron',ui-monospace,monospace;color:#fff;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(90% 60% at 50% 105%,#4a1340 0%,#1a0b2c 48%,#0a0512 100%)}
.stage{position:relative;width:min(94vw,calc((100dvh - 20px)*9/16));aspect-ratio:9/16;container-type:inline-size;border-radius:18px;overflow:hidden;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,63,180,.28),0 20px 60px rgba(0,0,0,.6),0 0 70px rgba(255,63,180,.16)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:3.4cqw 3.8cqw;pointer-events:none}
.best{font-size:max(10px,3cqw);letter-spacing:.24em;color:var(--dim)}
.best b{color:var(--gold);font-weight:900}
.snd{pointer-events:auto;font:500 max(10px,2.9cqw) 'Orbitron',monospace;letter-spacing:.14em;color:var(--dim);background:rgba(13,7,24,.5);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:.5em .9em;cursor:pointer}
.btns{display:flex;gap:2cqw}
.snd[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.snd:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.score{position:absolute;top:9%;left:0;right:0;text-align:center;font-weight:900;font-size:15cqw;line-height:1;color:#fff;pointer-events:none;opacity:0;
  text-shadow:0 0 .12em var(--pink),0 0 .4em rgba(255,63,180,.6),0 .05em 0 #5a1040}
.score.on{opacity:1}
.score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqw;
  background:linear-gradient(180deg,rgba(13,7,24,.18) 0%,rgba(13,7,24,.62) 55%,rgba(13,7,24,.86) 100%);transition:opacity .35s,visibility .35s}
.panel.gone{opacity:0;visibility:hidden;pointer-events:none}
.panel>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.panel>*:nth-child(2){animation-delay:.08s}.panel>*:nth-child(3){animation-delay:.16s}.panel>*:nth-child(4){animation-delay:.24s}.panel>*:nth-child(5){animation-delay:.32s}.panel>*:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{font-family:'Monoton',cursive;font-weight:400;font-size:17cqw;line-height:.95;color:#ffe9f6;margin-top:28cqw;
  text-shadow:0 0 .06em #fff,0 0 .18em var(--pink),0 0 .5em rgba(255,63,180,.7)}
.logo span{display:block}
.logo span+span{color:#e6fffb;text-shadow:0 0 .06em #fff,0 0 .18em var(--cyan),0 0 .5em rgba(61,252,216,.6)}
.tag{margin:3cqw 0 5cqw;font-size:4cqw;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 12px rgba(255,200,97,.5)}
.skin{font:500 3cqw 'Orbitron',monospace;letter-spacing:.16em;color:#e6fffb;background:rgba(13,7,24,.45);border:1px solid rgba(61,252,216,.4);border-radius:99px;padding:.6em 1.2em;margin-bottom:5cqw;cursor:pointer}
.skin:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn{font:900 4.6cqw 'Orbitron',monospace;letter-spacing:.2em;color:#1a0718;background:linear-gradient(180deg,#ffe0f2,#ff6cc6);border:0;border-radius:99px;padding:1.05em 2.1em;cursor:pointer;
  box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 26px rgba(255,63,180,.6),0 6px 0 #7a1458;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 18px rgba(255,63,180,.5),0 3px 0 #7a1458}
.hint{margin-top:6cqw;font-size:3.1cqw;letter-spacing:.3em;color:var(--dim);animation:blink 1.6s ease-in-out infinite}
.hint2{margin-top:2.5cqw;font-size:2.7cqw;letter-spacing:.08em;line-height:1.7;color:rgba(240,228,255,.5);max-width:70cqw}
@keyframes blink{50%{opacity:.35}}
.splat{font-family:'Monoton',cursive;font-size:13cqw;color:#ffe9f6;text-shadow:0 0 .2em var(--pink),0 0 .5em rgba(255,63,180,.7)}
.big{font-weight:900;font-size:21cqw;line-height:1.05;color:#fff;text-shadow:0 0 .15em rgba(61,252,216,.8)}
.new{font-size:3.4cqw;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 12px rgba(255,200,97,.7);margin-top:1cqw;animation:blink .8s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;width:100%;margin:4.5cqw 0 3cqw}
.stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:2.6cqw 1cqw}
.stats dt{font-size:2.4cqw;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.stats dd{font-weight:900;font-size:5.4cqw;margin-top:1cqw}
.reached{font-size:2.9cqw;letter-spacing:.12em;color:var(--dim);margin-bottom:4.5cqw}
.reached b{color:var(--cyan);font-weight:500}
.board{width:100%;margin:0 0 5cqw;text-align:left}
.board h2{font:500 2.5cqw 'Orbitron',monospace;letter-spacing:.3em;color:var(--dim);margin-bottom:1.6cqw;text-align:center}
.board ol{list-style:none;counter-reset:r}
.board li{display:flex;gap:2.4cqw;align-items:baseline;font-size:3.2cqw;padding:.9cqw 2.4cqw;border-radius:8px;counter-increment:r}
.board li::before{content:counter(r);width:4cqw;color:var(--dim);font-size:2.6cqw}
.board li[data-rank]::before{content:attr(data-rank)}
.board li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .s{font-weight:900;color:var(--gold)}
.board li.me{background:rgba(61,252,216,.14);box-shadow:inset 0 0 0 1px rgba(61,252,216,.4)}
.board .msg{font-size:2.7cqw;color:var(--dim);text-align:center;padding:1cqw 0}
.post{display:flex;gap:2cqw;margin:0 0 4cqw;width:100%}
.post input{flex:1;min-width:0;font:500 max(16px,3.4cqw) 'Orbitron',monospace;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:.6em 1em}
.post input:focus{outline:2px solid var(--cyan);outline-offset:1px}
.btn.sm{font-size:3.3cqw;padding:.8em 1.3em;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 16px rgba(255,63,180,.5),0 4px 0 #7a1458}
.today{margin-top:4cqw;font-size:2.8cqw;letter-spacing:.1em;color:var(--dim)}
.today b{color:var(--gold)}
@media (max-width:600px) and (orientation:portrait){body{padding:0;place-items:stretch}.stage{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.panel>*,.hint,.new{animation:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Neon Flap: tap, click or press space to flap">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="hud"><span class="best">BEST <b id="best">0</b></span><span class="btns"><button type="button" class="snd" id="mus" aria-pressed="true">♪ MUSIC</button><button type="button" class="snd" id="snd" aria-pressed="true">SOUND</button></span></div>
  <div class="score" id="score" aria-live="polite">0</div>
  <section class="panel" id="title">
    <h1 class="logo"><span>NEON</span><span>FLAP</span></h1>
    <p class="tag">the flappier bird</p>
    <button type="button" class="skin" id="skinBtn">◂ PIGEON ▸</button>
    <button type="button" class="btn" id="play">FLAP IN</button>
    <p class="hint">tap · space · ↑</p>
    <p class="hint2">at 5 the pipes wake up. at 10 they learn to fly.</p>
    <p class="today" id="today" hidden></p>
  </section>
  <section class="panel gone" id="over" aria-live="polite">
    <p class="splat">SPLAT</p>
    <p class="big" id="oScore">0</p>
    <p class="new" id="oNew" hidden>★ new best ★</p>
    <p class="new" id="oUnlock" hidden></p>
    <dl class="stats"><div><dt>best</dt><dd id="oBest">0</dd></div><div><dt>flaps</dt><dd id="oFlaps">0</dd></div><div><dt>all-time flaps</dt><dd id="oLife">0</dd></div></dl>
    <p class="reached">reached <b id="oStage">the quiet pipes</b></p>
    <div class="board" id="board"><h2>TODAY'S FLOCK</h2><ol id="boardList"></ol><p class="msg" id="boardMsg">loading the flock…</p></div>
    <form class="post" id="postF" hidden><input id="nm" maxlength="16" placeholder="your pigeon name" autocomplete="nickname" aria-label="Your name for the board"><button type="submit" class="btn sm">POST</button></form>
    <button type="button" class="btn" id="retry">FLAP AGAIN</button>
  </section>
</main>
<script>
(function(){
'use strict';
var W=360,H=640,GROUND=H-74,STEP=1/120,PW=58;
function $(id){return document.getElementById(id);}
var cv=$('c'),g=cv.getContext('2d'),stageEl=$('stage'),sc=1,skyG=null,groundG=null;
function fit(){var r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));sc=cv.width/W;
  var nh=r.width>0?Math.max(560,Math.min(820,Math.round(W*r.height/r.width))):640;if(nh!==H){H=nh;GROUND=H-74;skyG=groundG=null;}}
window.addEventListener('resize',fit);fit();
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- sound: all synthesized ---------- */
var AC=null,master=null,noiseBuf=null,soundOn=store.get('neonFlap.snd','1')==='1';
function audioInit(){if(AC||!soundOn)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;var comp=AC.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=6;master.connect(comp);comp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.4),AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function tone(type,f0,f1,dur,vol,delay){if(!AC||!soundOn)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(vol,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(v);v.connect(master);o.start(t);o.stop(t+dur+.03);}
function noise(f0,f1,dur,vol,q){if(!AC||!soundOn)return;var t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.Q.value=q||1.2;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(master);s.start(t);s.stop(t+dur+.03);}
var musOn=store.get('neonFlap.mus','1')==='1',mus=null,musBus=null;
function reed(m,t,dur,vol,glide){if(!AC)return;var f=440*Math.pow(2,(m-69)/12),v=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.Q.value=.6;
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(vol,t+.03);v.gain.setValueAtTime(vol,t+Math.max(.03,dur-.04));v.gain.exponentialRampToValueAtTime(.0001,t+dur+.07);
  [[1-.0035,'sawtooth',.5],[1+.0035,'sawtooth',.5],[.5,'square',.22]].forEach(function(r){var o=AC.createOscillator(),og=AC.createGain();o.type=r[1];o.frequency.setValueAtTime(f*r[0],t);
    if(glide)o.frequency.exponentialRampToValueAtTime(f*r[0]*glide,t+dur);og.gain.value=r[2];o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.1);});
  lp.connect(v);v.connect(musBus);}
var MEL=[[[79,.5],[76,.25],[77,.25],[79,.5],[84,.5]],[[84,.5],[83,.25],[81,.25],[79,1]],[[77,.5],[74,.25],[76,.25],[77,.5],[83,.5]],[[83,.5],[81,.25],[79,.25],[77,1]],
  [[74,.5],[77,.5],[79,.5],[83,.5]],[[81,.5],[79,.5],[77,.5],[74,.5]],[[76,.5],[79,.5],[72,.5],[76,.5]],[[72,.5],[67,.5],[72,.5],[0,.5]],
  [[81,.5],[77,.25],[79,.25],[81,.5],[84,.5]],[[86,.5],[84,.5],[81,.5],[77,.5]],[[79,.5],[76,.25],[77,.25],[79,.5],[84,.5]],[[79,.5],[76,.5],[72,1]],
  [[74,.25],[76,.25],[77,.25],[79,.25],[81,.5],[83,.5]],[[84,.5],[83,.5],[79,1]],[[76,.5],[79,.5],[84,.5],[79,.5]],[[84,.5],[72,.5],[72,.5],[0,.5]]];
var CH={C:[48,43,[60,64,67]],G7:[43,50,[59,62,65]],F:[41,48,[60,65,69]]};
var PROG=['C','C','G7','G7','G7','G7','C','C','F','F','C','C','G7','G7','C','C'];
function musStart(){if(!AC||!musOn)return;if(!musBus){musBus=AC.createGain();musBus.gain.value=.2;musBus.connect(master);}
  musStop();mus={bar:0,t:AC.currentTime+.08};mus.iv=setInterval(musTick,60);musTick();}
function musStop(){if(mus){clearInterval(mus.iv);mus=null;}}
function musTick(){if(!mus||!AC)return;var beat=60/(120+stageN*9);
  while(mus.t<AC.currentTime+.35){var b=mus.bar%16,c=CH[PROG[b]],t=mus.t,x=0;
    reed(c[0],t,beat*.4,.5);reed(c[1],t+beat,beat*.4,.45);
    [.5,1.5].forEach(function(o){c[2].forEach(function(m){reed(m,t+beat*o,beat*.22,.18);});});
    MEL[b].forEach(function(n){if(n[0])reed(n[0],t+x*beat,n[1]*beat*.86,.42);x+=n[1];});
    mus.bar++;mus.t+=beat*2;}}
function musWheeze(){if(!AC||!musOn||!musBus)return;var t=AC.currentTime+.02;reed(69,t,1.1,.5,.62);reed(64,t,1.1,.35,.6);reed(45,t,1.2,.4,.7);}
function toggleMus(){musOn=!musOn;store.set('neonFlap.mus',musOn?'1':'0');musUI();if(!musOn)musStop();else{audioInit();if(state==='play')musStart();}}
function musUI(){var b=$('mus');b.setAttribute('aria-pressed',String(musOn));b.setAttribute('aria-label',musOn?'Music on':'Music off');}
var SFX={
  flap:function(k){noise(1300+k*110,380,.14,.34,1.1);tone('sine',170,80,.09,.13);},
  point:function(){tone('square',880,0,.06,.05);tone('square',1320,0,.09,.05,.06);},
  feather:function(){[1047,1319,1568,2093].forEach(function(f,i){tone('triangle',f,0,.12,.08,i*.045);});},
  hit:function(){noise(5200,160,.7,1.1,.45);tone('sine',120,30,.6,.6);tone('triangle',70,24,.8,.4,.02);tone('square',170,48,.32,.12);},
  bacock:function(){tone('sawtooth',640,430,.1,.08,.05);tone('square',900,330,.28,.07,.17);tone('sine',450,300,.28,.1,.17);},
  siren:function(){for(var i=0;i<4;i++)tone('square',i%2?880:620,i%2?880:620,.13,.045,i*.15);},
  whoosh:function(){noise(300,2600,.45,.22,.7);},
  honk:function(){tone('square',420,330,.2,.08,.04);tone('sawtooth',424,332,.2,.05,.04);tone('square',400,300,.26,.08,.3);tone('sawtooth',404,302,.26,.05,.3);},
  caw:function(){tone('sawtooth',720,520,.24,.09,.06);noise(1800,900,.24,.2,3);},
  mine:function(){tone('sawtooth',1300,900,.14,.08,.04);tone('sawtooth',1500,700,.3,.08,.2);},
  ching:function(){[2093,2637,3136].forEach(function(f,i){tone('triangle',f,0,.3,.07,.05+i*.06);});},
  charge:function(){tone('square',520,1500,.28,.035);},
  laser:function(){tone('sawtooth',2200,180,.26,.09);noise(6000,1200,.2,.25,.8);},
  coo:function(){tone('sine',420,300,.18,.09);tone('sine',380,290,.22,.08,.2);},
  stage:function(){[523,659,784,1047].forEach(function(f,i){tone('sawtooth',f,f*1.01,.36,.04,i*.07);});}
};

/* ---------- the world ---------- */

var ST=[{at:0,speed:162,gap:164,space:226,name:''},{at:5,speed:170,gap:158,space:224,name:'THE PIPES WOKE UP'},{at:10,speed:176,gap:154,space:222,name:'THE PIPES GREW WINGS'},
  {at:20,speed:184,gap:150,space:204,name:'FLOCK SEASON'},{at:27,speed:186,gap:152,space:214,name:'THE PIPES GOT LASERS'},{at:35,speed:192,gap:148,space:198,name:'EVERYTHING FLAPS'}];

var SK={pigeon:{name:'PIGEON',at:0,tail:'#6d7484',band:'#2c2f37',body:['#c9ced8','#9aa1b0','#5e6574'],neck:['#8a7ab0','#5e4c86','#3c8a74','rgba(142,150,166,0)'],head:['#b7bdc9','#6c7383'],beak:'#3a3230',cere:'#ece6dc',eye:'#f08a2a',feet:'#c46c72',prim:['#8a92a2','#5b6272','#2a2d34'],cov:['#b9bfcb','#858d9c'],bar:'#34373f',feath:['#7a6a9c','#aeb5c2','#8a92a2']},

  else if(state==='over'&&overT>.5){start();flap();}}

window.addEventListener('keydown',function(e){if(e.repeat)return;if(e.target&&e.target.closest&&e.target.closest('input'))return;if(e.target&&e.target.closest&&e.target.closest('button')&&(e.code==='Space'||e.code==='Enter'))return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();press();}else if(e.code==='KeyM')toggleSnd();else if(e.code==='KeyN')toggleMus();});
function go(){audioInit();if(AC&&AC.state==='suspended')AC.resume();start();flap();}
$('play').addEventListener('click',go);$('skinBtn').addEventListener('click',function(){audioInit();sel=SKK[(SKK.indexOf(sel)+1)%SKK.length];skinUI();bird.wingT=0;bird.sq=.8;SFX.flap(1);});skinUI();$('retry').addEventListener('click',go);
function toggleSnd(){soundOn=!soundOn;store.set('neonFlap.snd',soundOn?'1':'0');sndUI();if(soundOn){audioInit();if(state==='play')musStart();}else musStop();}
function sndUI(){var b=$('snd');b.setAttribute('aria-pressed',String(soundOn));b.setAttribute('aria-label',soundOn?'Sound on':'Sound off');}
$('snd').addEventListener('click',toggleSnd);sndUI();$('mus').addEventListener('click',toggleMus);musUI();
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play'){paused=true;musStop();}});
/* ---------- today's flock: one shared board per UTC day ---------- */
var crowned=false,DB=null,me=null,rows=null,myName=store.get('neonFlap.name',''),posting=false;
function dayKey(){return new Date().toISOString().slice(0,10);}
function postedBest(){return +store.get('neonFlap.posted.'+dayKey(),'0')||0;}
function cleanName(v){return String(v||'').replace(/\s+/g,' ').trim().slice(0,16);}
function dbReady(){if(DB||!window.__nfDB)return;DB=window.__nfDB;
  DB.supabaseSession().then(function(r){me=r.user;var m=(me&&me.user_metadata)||{};
    if(!myName&&me&&!me.is_anonymous){var n=cleanName(m.preferred_username||m.nickname||m.name||m.full_name);if(n){myName=n;store.set('neonFlap.name',n);}}
    $('nm').value=myName;}).catch(function(){});
  loadBoard();}
window.addEventListener('nfdb',dbReady);dbReady();
setTimeout(function(){if(!DB){rows=null;boardMsg('the flock board is offline right now');}},9000);
function boardMsg(t){var m=$('boardMsg');m.textContent=t||'';m.hidden=!t;}
function loadBoard(){if(!DB)return;
  DB.supabase.from('neon_flap_scores').select('score,name,user_id').eq('day',dayKey()).order('score',{ascending:false}).limit(80).then(function(res){
    if(res.error)throw res.error;var seen={},out=[];(res.data||[]).forEach(function(r){var k=r.user_id||r.name;if(!seen[k]){seen[k]=1;out.push(r);}});rows=out;renderBoard();
  }).catch(function(){boardMsg('the flock board is offline right now');});}
function renderBoard(){var ol=$('boardList');ol.textContent='';if(!rows)return;
  var myId=me&&me.id,mine=-1,i;for(i=0;i<rows.length;i++)if(rows[i].user_id&&rows[i].user_id===myId){mine=i;break;}
  var show=rows.slice(0,5).map(function(r,j){return[r,j];});if(mine>=5)show.push([rows[mine],mine]);
  show.forEach(function(p){var li=document.createElement('li'),n=document.createElement('span'),s=document.createElement('span');
    n.className='n';n.textContent=cleanName(p[0].name)||'pigeon';s.className='s';s.textContent=p[0].score|0;li.appendChild(n);li.appendChild(s);
    if(p[1]===mine)li.className='me';if(p[1]>=5)li.setAttribute('data-rank',p[1]+1);ol.appendChild(li);});
  boardMsg(rows.length?'':'nobody has flapped today. be the first pigeon.');
  crowned=!!(rows[0]&&myId&&rows[0].user_id===myId);
  var top=rows[0],td=$('today');if(top){td.textContent='';td.appendChild(document.createTextNode('today’s top pigeon: '+(cleanName(top.name)||'pigeon')+' '));var b=document.createElement('b');b.textContent=top.score|0;td.appendChild(b);td.hidden=false;}}
function plausible(sc,t){return sc>0&&sc<=t*1.6+2&&sc<1000;}
function afterRun(){if(rows)renderBoard();if(DB&&!rows)loadBoard();
  if(!DB||!plausible(score,runT)||score<=postedBest())return;
  var run={score:score,flaps:flaps,secs:Math.round(runT),stage:stageN,day:dayKey()};
  if(myName)postRun(run,myName);else{$('postF').hidden=false;$('postF').run=run;}}
function postRun(run,name){if(posting)return;posting=true;boardMsg('posting your run…');
  var go=me?Promise.resolve({user:me}):DB.supabaseSession();
  go.then(function(r){me=r.user;var row={score:run.score,name:name,flaps:run.flaps,secs:run.secs,stage:run.stage,day:run.day,user_id:me.id};
    return DB.supabase.from('neon_flap_scores').insert([row]);}).then(function(res){posting=false;if(res&&res.error)throw res.error;
    if(run.day===dayKey())store.set('neonFlap.posted.'+run.day,String(Math.max(postedBest(),run.score)));$('postF').hidden=true;loadBoard();
  }).catch(function(){posting=false;boardMsg('could not post, the flock board is offline');});}
$('postF').addEventListener('submit',function(e){e.preventDefault();var n=cleanName($('nm').value);if(!n){$('nm').focus();return;}
  myName=n;store.set('neonFlap.name',n);$('nm').blur();if(this.run)postRun(this.run,n);});

window.__nf={get fl(){return fl;},flipNow:function(){flipWarn('WRONG WAY!');},setLife:function(v){life=v;skinUI();},pick:function(k){sel=k;skinUI();},get mus(){return mus?{bar:mus.bar}:null;},get ac(){return AC?AC.state:null;},get state(){return state;},get deadT(){return deadT;},get score(){return score;},get stageN(){return stageN;},bird:bird,get pipes(){return pipes;},get items(){return items;},start:start,flap:flap,
  setScore:function(v){score=v;stageN=stageOf(v);$('score').textContent=v;},step:function(n){for(var i=0;i<n;i++)update(STEP);render();}};
})();
</script>
