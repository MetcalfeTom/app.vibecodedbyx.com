<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triple Cubed — a word board for two teammates</title>
<meta name="description" content="Team up with a quiet genius on a 15×15 letter board and chase the legend: one word across three triple-word squares, ×27.">
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%8E%B2">
<meta property="og:title" content="Triple Cubed">
<meta property="og:description" content="You and a silent genius teammate, one board, one dream: a word across three triple squares. ×27.">
<meta property="og:url" content="https://sloppy.live/triple-cubed/">
<meta property="og:image" content="https://sloppy.live/triple-cubed/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Spline+Sans+Mono:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0d3b2f; --felt2:#0a2e25; --sq:#13493a; --line:#0b3328;
  --tile:#f3e8cf; --tile2:#e2d2ad; --ink:#2a1f16; --cream:#efe6d2; --mute:#9fb8ac;
  --tw:#b8364a; --dw:#d98a8f; --tl:#2b84a0; --dl:#8cc3d4; --brass:#e7b75a; --pend:#ffe7a3; --bad:#ff8a7a; --good:#9be3b0;
  --disp:"Gloock", "Georgia", serif; --mono:"Spline Sans Mono", ui-monospace, "Courier New", monospace;
  --bw:min(94vw, 64vh, 600px);
}
*{ box-sizing:border-box; }
html{ font-size:100%; }
body{
  margin:0; min-height:100vh; color:var(--cream); font-family:var(--mono); font-weight:300;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.06), transparent 60%),
    repeating-radial-gradient(circle at 30% 40%, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--felt), var(--felt2));
  padding:max(.6rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
}
main{ max-width:40rem; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:.7rem; }
header{ width:var(--bw); display:flex; align-items:flex-end; justify-content:space-between; gap:.6rem; }
h1{ font-family:var(--disp); font-weight:400; font-size:clamp(1.6rem, 6vw, 2.3rem); margin:0; line-height:1; letter-spacing:.01em; }
h1 sup{ font-size:.5em; color:var(--brass); vertical-align:.9em; margin-left:.05em; }
.score{ text-align:right; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); line-height:1.4; }
.score b{ display:block; font-family:var(--disp); font-weight:400; font-size:1.7rem; letter-spacing:0; color:var(--cream); line-height:1; }
.mate{ width:var(--bw); display:flex; align-items:center; gap:.55rem; min-height:2.2rem; font-size:.75rem; }
.mate .who{ font-family:var(--disp); font-size:1.05rem; color:var(--brass); }
.mrack{ display:flex; gap:3px; }
.mrack span{ width:1.35rem; height:1.35rem; display:grid; place-items:center; border-radius:3px; background:var(--tile2); color:var(--ink); font-family:var(--disp); font-size:.85rem; text-transform:uppercase; box-shadow:0 1px 0 rgba(0,0,0,.35); }
.msay{ flex:1; min-width:0; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.msay.think::after{ content:'…'; animation:dots 1s steps(3) infinite; display:inline-block; width:1.2em; text-align:left; overflow:hidden; vertical-align:bottom; }
@keyframes dots{ from{ width:0; } to{ width:1.2em; } }

.board{
  width:var(--bw); aspect-ratio:1; display:grid; grid-template-columns:repeat(15, 1fr); gap:2px; padding:4px;
  background:var(--line); border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
.cell{
  position:relative; border:0; padding:0; margin:0; border-radius:3px; background:var(--sq); color:rgba(255,255,255,.75);
  font:700 calc(var(--bw) * .016)/1 var(--mono); letter-spacing:.02em; display:grid; place-items:center; cursor:pointer; overflow:hidden;
}
.cell.T{ background:var(--tw); } .cell.D, .cell.S{ background:var(--dw); color:#3b1418; } .cell.t{ background:var(--tl); } .cell.d{ background:var(--dl); color:#0e3542; }
.cell.S::before{ content:'★'; font-size:calc(var(--bw) * .035); color:#3b1418; }
.cell.T.live{ box-shadow:inset 0 0 0 2px var(--brass), 0 0 10px rgba(231,183,90,.55); }
.cell:focus-visible{ outline:3px solid var(--brass); outline-offset:1px; z-index:2; }
.tile, .cell .tile{
  position:absolute; inset:1px; border-radius:3px; background:linear-gradient(160deg, var(--tile), var(--tile2)); color:var(--ink);
  display:grid; place-items:center; font-family:var(--disp); font-weight:400; font-size:calc(var(--bw) * .043); text-transform:uppercase;
  box-shadow:0 1px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6);
}
.tile i{ position:absolute; right:8%; bottom:4%; font:700 calc(var(--bw) * .014)/1 var(--mono); font-style:normal; color:#6a5a45; }
.cell .tile.pend{ background:linear-gradient(160deg, #fff6d6, var(--pend)); box-shadow:0 0 0 2px var(--brass), 0 2px 6px rgba(0,0,0,.4); }
.cell .tile.new{ animation:land .5s ease-out; box-shadow:0 0 0 2px rgba(155,227,176,.85); }
@keyframes land{ from{ transform:scale(1.35); } to{ transform:scale(1); } }

.status{ width:var(--bw); min-height:1.4rem; text-align:center; font-size:.8rem; color:var(--mute); }
.status.ok{ color:var(--good); } .status.bad{ color:var(--bad); }
.rack{ display:flex; gap:.4rem; justify-content:center; min-height:3.3rem; }
.rt{
  position:relative; width:clamp(2.6rem, 11vw, 3.3rem); height:clamp(2.6rem, 11vw, 3.3rem); border:0; padding:0; border-radius:6px; cursor:pointer;
  background:linear-gradient(160deg, var(--tile), var(--tile2)); color:var(--ink); font-family:var(--disp); font-size:clamp(1.4rem, 6vw, 1.8rem); text-transform:uppercase;
  box-shadow:0 3px 0 #b49d72, 0 6px 12px rgba(0,0,0,.35); transition:transform .12s, opacity .15s;
}
.rt i{ position:absolute; right:.3rem; bottom:.2rem; font:700 .62rem/1 var(--mono); font-style:normal; color:#6a5a45; }
.rt.sel{ transform:translateY(-.45rem); box-shadow:0 0 0 3px var(--brass), 0 10px 16px rgba(0,0,0,.4); }
.rt.used{ opacity:.18; pointer-events:none; }
.rt.swap{ background:linear-gradient(160deg, #f7c9c0, #e3a497); }
.rt:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; }
.btns{ display:flex; gap:.45rem; flex-wrap:wrap; justify-content:center; }
.btn{
  font:500 .78rem/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--cream); background:rgba(0,0,0,.22);
  border:1px solid rgba(239,230,210,.25); border-radius:999px; min-height:2.75rem; padding:0 1.05rem; cursor:pointer;
}
.btn.go{ background:var(--brass); color:#2a1d07; border-color:transparent; font-weight:700; }
.btn:disabled{ opacity:.4; cursor:default; }
.btn:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; }
.foot{ font-size:.66rem; color:var(--mute); text-align:center; line-height:1.6; max-width:var(--bw); }
#buildstamp{ opacity:.55; font-size:.6rem; }

.banner{ position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:20; }
.banner div{ font-family:var(--disp); font-size:clamp(2.4rem, 12vw, 5.5rem); color:var(--brass); text-shadow:0 4px 0 #6b4b12, 0 0 40px rgba(231,183,90,.6); animation:pop 2.6s ease-out forwards; text-align:center; line-height:1; }
.banner small{ display:block; font-family:var(--mono); font-size:.25em; color:var(--cream); letter-spacing:.2em; margin-top:.6rem; text-shadow:none; }
@keyframes pop{ 0%{ transform:scale(.4); opacity:0; } 15%{ transform:scale(1.08); opacity:1; } 80%{ opacity:1; } 100%{ transform:scale(1); opacity:0; } }

dialog{ border:0; border-radius:14px; background:#f3e8cf; color:var(--ink); max-width:min(26rem, 92vw); padding:1.4rem 1.4rem 1.1rem; font-family:var(--mono); box-shadow:0 30px 80px rgba(0,0,0,.6); }
dialog::backdrop{ background:rgba(4,20,15,.7); }
dialog h2{ font-family:var(--disp); font-weight:400; font-size:2rem; margin:0 0 .4rem; }
dialog p{ font-size:.82rem; line-height:1.55; margin:.4rem 0; }
dialog .btn{ color:var(--ink); border-color:rgba(42,31,22,.35); background:transparent; }
dialog .btn.go{ background:var(--ink); color:var(--tile); }
.big{ font-family:var(--disp); font-size:3rem; line-height:1; }
@media (prefers-reduced-motion: reduce){ .cell .tile.new, .banner div, .msay.think::after{ animation:none; } .banner div{ opacity:1; } .rt{ transition:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Triple Cubed<sup>27</sup></h1>
    <div class="score" aria-live="polite">team score<b id="score">0</b><span id="bagn">98 in the bag</span></div>
  </header>
  <section class="mate" aria-label="Your teammate">
    <span class="who">Two</span>
    <span class="mrack" id="mrack" aria-label="Two's tiles"></span>
    <span class="msay" id="msay" role="status" aria-live="polite">unpacking the dictionary…</span>
  </section>
  <div class="board" id="board" role="grid" aria-label="Board, 15 by 15"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="rack" id="rack" role="group" aria-label="Your tiles"></div>
  <div class="btns">
    <button type="button" class="btn go" id="play" disabled>play</button>
    <button type="button" class="btn" id="recall">recall</button>
    <button type="button" class="btn" id="shuffle">shuffle</button>
    <button type="button" class="btn" id="swap" title="Trade some tiles for new ones; it uses your turn">swap</button>
    <button type="button" class="btn" id="pass">pass</button>
  </div>
  <p class="foot">You and Two share one score. Two never gives hints, it just sets things up.<br>The dream: one word along an edge across all three gold squares, ×27.<br><button type="button" class="btn" id="newgame" style="min-height:2.2rem;margin-top:.4rem">new game</button><br><span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-10-02 · c7a3da2ee</span></p>
</main>
<div class="banner" id="banner" hidden></div>
<dialog id="over" aria-labelledby="overh">
  <h2 id="overh">Game over</h2>
  <p class="big" id="overs">0</p>
  <p id="overt"></p>
  <p style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem"><button type="button" class="btn go" id="again">play again</button></p>
</dialog>
<script src="engine.js"></script>
<script>
(function () {
  var N = TC.N, $ = function (id) { return document.getElementById(id); };
  var KEY = 'triple-cubed-v1', BEST = 'triple-cubed-best';
  var S = null, pend = [], sel = -1, swapMode = false, swapSel = {}, busy = false;
  var ALLW = null, trie = null, longs = null, ready = false;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function isWord(w) { return ALLW ? ALLW.has(w) : false; }

  /* ── the dictionary: front-coded lists, one word per line ── */
  function unpack(txt) { var out = [], prev = '', ls = txt.split('\n'); for (var k = 0; k < ls.length; k++) { var l = ls[k]; if (!l) continue; prev = prev.slice(0, l.charCodeAt(0) - 48) + l.slice(1); out.push(prev); } return out; }
  function loadDict() {
    $('msay').textContent = 'unpacking the dictionary…';
    Promise.all(['words.fc', 'ai.fc'].map(function (f) { return fetch(f).then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.text(); }); }))
      .then(function (t) {
        var all = unpack(t[0]), ai = unpack(t[1]);
        ALLW = new Set(all); trie = new TC.Trie(ai); longs = all.filter(function (w) { return w.length === N; });
        ready = true; say(S.log.length ? 'back at the table.' : 'your move. the star is in the middle.'); preview(); render();
        if (S.turn === 1 && !S.over) setTimeout(partner, 400);
      })
      .catch(function () { $('msay').textContent = 'couldn\'t load the dictionary'; status('The word list didn\'t load. Check your connection and reload.', 'bad'); });
  }

  /* ── a game ── */
  function fresh() {
    var bag = []; Object.keys(TC.BAG).forEach(function (l) { for (var k = 0; k < TC.BAG[l]; k++) bag.push(l); });
    for (var i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = bag[i]; bag[i] = bag[j]; bag[j] = x; }
    return { board: new Array(N * N).fill(''), bag: bag, racks: [bag.splice(0, 7), bag.splice(0, 7)], score: 0, turn: 0, passes: 0, log: [], over: false, cubes: 0, last: [] };
  }
  function save() { store(KEY, JSON.stringify(S)); }
  try { S = JSON.parse(store(KEY) || 'null'); } catch (e) { S = null; }
  if (!S || !S.board || S.board.length !== N * N || S.over) S = fresh();
  function best() { try { return JSON.parse(store(BEST) || '{}') || {}; } catch (e) { return {}; } }

  /* ── drawing ── */
  var cells = [], boardEl = $('board');
  for (var i = 0; i < N * N; i++) {
    var b = document.createElement('button'), p = TC.prem(i);
    b.type = 'button'; b.className = 'cell' + (p === '*' ? ' S' : p !== '.' ? ' ' + p : ''); b.dataset.i = i;
    b.setAttribute('aria-label', 'row ' + (((i / N) | 0) + 1) + ' column ' + (i % N + 1) + ({ T: ', triple word', D: ', double word', t: ', triple letter', d: ', double letter', '*': ', start, double word' }[p] || ''));
    boardEl.appendChild(b); cells.push(b);
  }
  var LBL = { T: '3W', D: '2W', t: '3L', d: '2L' };
  function tileHtml(l, cls) { return '<span class="tile' + (cls ? ' ' + cls : '') + '">' + l + '<i>' + TC.VAL[l] + '</i></span>'; }
  function render() {
    var pmap = {}; pend.forEach(function (p) { pmap[p.i] = p.l; });
    var lastSet = {}; (S.last || []).forEach(function (i) { lastSet[i] = 1; });
    var live = {}; if (ready) TC.EDGES.forEach(function (e) { if (TC.edgeOpen(S.board, e) && e.cells.some(function (c) { return S.board[c]; })) [0, TC.MID, N - 1].forEach(function (k) { live[e.cells[k]] = 1; }); });
    for (var i = 0; i < N * N; i++) {
      var c = cells[i], L = S.board[i] || pmap[i], p = TC.prem(i);
      var html = L ? tileHtml(L, pmap[i] ? 'pend' : lastSet[i] ? 'new' : '') : (LBL[p] || '');
      if (c._h !== html) { c.innerHTML = html; c._h = html; }
      c.classList.toggle('live', !!live[i] && !L);
      c.setAttribute('aria-label', c.getAttribute('aria-label').replace(/: .*$/, '') + (L ? ': ' + L.toUpperCase() : ''));
    }
    var rack = $('rack'), used = {}; pend.forEach(function (p) { used[p.r] = 1; });
    rack.innerHTML = S.racks[0].map(function (l, k) {
      return '<button type="button" class="rt' + (used[k] ? ' used' : '') + (k === sel ? ' sel' : '') + (swapSel[k] ? ' swap' : '') + '" data-k="' + k + '" aria-pressed="' + (k === sel || !!swapSel[k]) + '" aria-label="' + l.toUpperCase() + ', ' + TC.VAL[l] + ' points">' + l + '<i>' + TC.VAL[l] + '</i></button>';
    }).join('');
    $('mrack').innerHTML = S.racks[1].map(function (l) { return '<span>' + l + '</span>'; }).join('');
    $('score').textContent = S.score; $('bagn').textContent = S.bag.length + ' in the bag';
    var mine = S.turn === 0 && !S.over && !busy && ready;
    $('play').disabled = !mine || (!pend.length && !swapMode);
    $('play').textContent = swapMode ? 'swap ' + Object.keys(swapSel).length : 'play';
    ['recall', 'shuffle', 'pass', 'swap'].forEach(function (id) { $(id).disabled = !mine; });
    $('swap').textContent = swapMode ? 'cancel' : 'swap';
  }
  function status(t, cls) { var s = $('status'); s.textContent = t || ''; s.className = 'status' + (cls ? ' ' + cls : ''); }
  function say(t, think) { var m = $('msay'); m.textContent = t; m.classList.toggle('think', !!think); }
  function preview() {
    if (swapMode) { status('tap the tiles to trade, then press swap ' + Object.keys(swapSel).length); return; }
    if (!pend.length || !ready) { status(''); return; }
    var e = TC.evaluate(S.board, pend, isWord);
    if (e.ok) status(e.words.map(function (w) { return w.w.toUpperCase(); }).join(' + ') + ' · ' + e.score + (e.mult >= 27 ? ' · ×27!!' : e.mult >= 9 ? ' · ×9' : '') + (e.bingo ? ' · all seven +' + TC.BINGO : ''), 'ok');
    else status(e.err, 'bad');
  }

  /* ── your moves ── */
  boardEl.addEventListener('click', function (ev) {
    var c = ev.target.closest('.cell'); if (!c || S.turn !== 0 || S.over || busy || swapMode) return;
    var i = +c.dataset.i, at = pend.findIndex(function (p) { return p.i === i; });
    if (at >= 0) { var back = pend.splice(at, 1)[0]; sel = back.r; }
    else if (!S.board[i]) {
      if (sel < 0) { status('pick a tile from your rack first'); return; }
      pend.push({ i: i, l: S.racks[0][sel], r: sel }); sel = -1;
    }
    render(); preview();
  });
  $('rack').addEventListener('click', function (ev) {
    var t = ev.target.closest('.rt'); if (!t) return; var k = +t.dataset.k;
    if (swapMode) { if (swapSel[k]) delete swapSel[k]; else swapSel[k] = 1; render(); preview(); return; }
    sel = sel === k ? -1 : k; render();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || S.turn !== 0 || busy || swapMode) return;
    var k = ev.key.toLowerCase();
    if (k === 'enter' && pend.length) { $('play').click(); return; }
    if (k === 'escape' || k === 'backspace') { if (k === 'backspace' && pend.length) { var b = pend.pop(); sel = b.r; } else { sel = -1; } render(); preview(); return; }
    if (!/^[a-z]$/.test(k)) return;
    var r = S.racks[0], j = -1;
    for (var x = 0; x < r.length; x++) if (r[x] === k && x !== sel && !pend.some(function (p) { return p.r === x; })) { j = x; break; }
    if (j >= 0) { sel = j; render(); }
  });
  $('recall').onclick = function () { pend = []; sel = -1; render(); preview(); };
  $('shuffle').onclick = function () { pend = []; sel = -1; var r = S.racks[0]; for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = r[i]; r[i] = r[j]; r[j] = x; } save(); render(); preview(); };
  $('swap').onclick = function () { pend = []; sel = -1; swapMode = !swapMode; swapSel = {}; render(); preview(); };
  $('pass').onclick = function () { if (!confirmPass()) return; pend = []; sel = -1; S.passes++; S.log.push({ who: 0, pass: 1 }); endTurn(); };
  var passArm = 0; function confirmPass() { if (Date.now() - passArm < 2500) return true; passArm = Date.now(); status('press pass again to skip your turn'); return false; }
  $('play').onclick = function () {
    if (swapMode) {
      var ks = Object.keys(swapSel).map(Number); if (!ks.length) return;
      if (S.bag.length < ks.length) { status('the bag only has ' + S.bag.length + ' tiles left', 'bad'); return; }
      var out = ks.map(function (k) { return S.racks[0][k]; });
      S.racks[0] = S.racks[0].filter(function (l, k) { return !swapSel[k]; });
      draw(0); S.bag = S.bag.concat(out); shuffleBag();
      swapMode = false; swapSel = {}; S.passes++; S.log.push({ who: 0, swap: out.length }); status('traded ' + out.length + ' tile' + (out.length > 1 ? 's' : ''));
      endTurn(); return;
    }
    var e = TC.evaluate(S.board, pend, isWord); if (!e.ok) { status(e.err, 'bad'); return; }
    commit(0, pend.map(function (p) { return { i: p.i, l: p.l }; }), e);
    pend = []; sel = -1; endTurn();
  };
  function shuffleBag() { for (var i = S.bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = S.bag[i]; S.bag[i] = S.bag[j]; S.bag[j] = x; } }
  function draw(who) { var r = S.racks[who]; while (r.length < 7 && S.bag.length) r.push(S.bag.pop()); }
  function commit(who, placed, e) {
    var rack = S.racks[who];
    placed.forEach(function (p) { S.board[p.i] = p.l; rack.splice(rack.indexOf(p.l), 1); });
    draw(who); S.score += e.score; S.passes = 0; S.last = placed.map(function (p) { return p.i; });
    S.log.push({ who: who, w: e.main.w, s: e.score, m: e.mult });
    if (e.mult >= 27) { S.cubes++; cheer('×27', 'triple cubed · ' + e.score + ' points'); }
    else if (e.mult >= 9) cheer('×9', 'triple squared · ' + e.score);
    else if (e.bingo) cheer('all seven!', '+' + TC.BINGO + ' · ' + e.score);
    if (who === 0) status(e.main.w.toUpperCase() + ' for ' + e.score, 'ok');
  }
  function cheer(big, small) { var b = $('banner'); b.innerHTML = '<div>' + big + '<small>' + small + '</small></div>'; b.hidden = false; clearTimeout(cheer.t); cheer.t = setTimeout(function () { b.hidden = true; }, 2700); }
  function endTurn() {
    var who = S.turn;
    if (!S.racks[who].length && !S.bag.length) return finish();
    if (S.passes >= 4) return finish();
    S.turn = 1 - who; save(); render();
    if (S.turn === 1) setTimeout(partner, 450);
  }
  function finish() {
    var left = S.racks[0].concat(S.racks[1]).reduce(function (a, l) { return a + TC.VAL[l]; }, 0);
    S.score -= left; S.over = true; save(); render();
    var B = best(), was = B.score || 0; B.score = Math.max(was, S.score); B.cubes = (B.cubes || 0) + S.cubes; B.games = (B.games || 0) + 1; store(BEST, JSON.stringify(B));
    $('overs').textContent = S.score;
    $('overt').textContent = (left ? left + ' points of tiles were left over. ' : '') + (S.score > was ? 'A new team best!' : 'Team best: ' + was + '.') + (S.cubes ? ' And you hit ×27. Legends.' : ' The ×27 is still out there.');
    try { $('over').showModal(); } catch (e) { $('over').setAttribute('open', ''); }
  }
  $('again').onclick = function () { try { $('over').close(); } catch (e) {} newGame(); };
  $('newgame').onclick = function () { if (!S.over && S.log.length && !confirmNew()) return; newGame(); };
  var newArm = 0; function confirmNew() { if (Date.now() - newArm < 2500) return true; newArm = Date.now(); status('press new game again to start over'); return false; }
  function newGame() { S = fresh(); pend = []; sel = -1; swapMode = false; swapSel = {}; save(); say('fresh board. your move.'); status(''); render(); }

  /* ── Two: a quiet genius who sets things up ── */
  function partner() {
    if (S.over || S.turn !== 1 || !ready) return;
    busy = true; say('thinking', true); render();
    setTimeout(function () {
      var mv = choose(); busy = false;
      if (mv) { commit(1, mv.m, mv.e); say('played ' + mv.e.main.w.toUpperCase() + ' · ' + mv.e.score + '.'); }
      else if (S.bag.length >= 7) { var out = S.racks[1].splice(0, 7); draw(1); S.bag = S.bag.concat(out); shuffleBag(); S.passes++; S.log.push({ who: 1, swap: 7 }); S.last = []; say('traded its tiles.'); }
      else { S.passes++; S.log.push({ who: 1, pass: 1 }); S.last = []; say('passed.'); }
      endTurn();
    }, 60);
  }
  /* how good the four edges look for a ×27: open ones are worth keeping, letters that still fit a long word are
     progress, and an edge your own rack can finish right now is the whole point (Two knows your tiles, it never says) */
  function canFinish(f, rack) {
    for (var h = 0; h < f.hits.length; h++) {
      var w = f.hits[h], need = {}, ok = true;
      for (var k = 0; k < TC.N; k++) if (!f.pat[k]) need[w[k]] = (need[w[k]] || 0) + 1;
      for (var l in need) if (rack.filter(function (x) { return x === l; }).length < need[l]) { ok = false; break; }
      if (ok) return w;
    }
    return '';
  }
  function edgeValue(board, rack) {
    var v = 0;
    TC.EDGES.forEach(function (e) {
      if (!TC.edgeOpen(board, e)) return;
      v += 12;
      var f = TC.edgeFits(board, e, longs, isWord, 400);
      if (f.n < 0) return;
      if (f.n === 0) { v -= 18; return; }
      v += 4 * f.fixed + Math.min(14, 2 * Math.log2(1 + f.n));
      if (f.empty <= TC.RACK && rack && canFinish(f, rack)) v += 90;
    });
    return v;
  }
  function choose() {
    var ms = TC.moves(S.board, S.racks[1], trie, isWord), list = [];
    for (var k = 0; k < ms.length; k++) { var e = TC.evaluate(S.board, ms[k], isWord); if (e.ok && e.mult < 27) list.push({ m: ms[k], e: e }); }
    if (!list.length) return null;
    var edgeSet = {}; TC.EDGES.forEach(function (e) { e.cells.forEach(function (c) { edgeSet[c] = 1; }); });
    list.sort(function (a, b) { return b.e.score - a.e.score; });
    var pool = list.slice(0, 40).concat(list.filter(function (x) { return x.m.some(function (p) { return edgeSet[p.i]; }); }).slice(0, 60));
    var you = S.racks[0], base = edgeValue(S.board, you), bestM = null, bestV = -1e9;
    pool.forEach(function (x) {
      var b = S.board.slice(); x.m.forEach(function (p) { b[p.i] = p.l; });
      var v = x.e.score + 1.4 * (edgeValue(b, you) - base);
      if (v > bestV) { bestV = v; bestM = x; }
    });
    return bestM;
  }

  render(); loadDict();
  window.__TC = { S: function () { return S; }, isWord: isWord, choose: function () { return choose(); }, partner: partner, ready: function () { return ready; }, trie: function () { return trie; }, render: render, pend: function (p) { pend = p; render(); preview(); } };
})();
</script>
