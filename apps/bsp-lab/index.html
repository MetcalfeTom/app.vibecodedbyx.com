<style>

  font-family:'IBM Plex Mono', monospace; background:none; color:var(--cyan);

<body>
<main>
  <header>
    <h1>BSP<span>·LAB</span></h1>

  <div class="drop" id="drop">

<span class="stamp" id="stamp"></span>
<script>
'use strict';
const VER = 'v1.1 · 561bbd9';
document.getElementById('stamp').textContent = VER;
const $ = id => document.getElementById(id);

/* ═══════════════ v30 BSP PARSER — from the public spec ═══════════════
   GoldSrc BSP version 30. Header: int32 version, then 15 lump directory
   entries of {int32 nOffset, int32 nLength} = 4 + 15*8 = 124 bytes.
   All integers little-endian. Struct sizes per lump are noted inline.  */
const LUMP = [
  ['ENTITIES', null], ['PLANES', 20], ['TEXTURES', null], ['VERTICES', 12],
  ['VISIBILITY', null], ['NODES', 24], ['TEXINFO', 40], ['FACES', 20],
  ['LIGHTING', null], ['CLIPNODES', 8], ['LEAVES', 28], ['MARKSURFACES', 2],
  ['EDGES', 4], ['SURFEDGES', 4], ['MODELS', 64],
];
function parseEntities(text){
  const ents = [];
  const re = /\{([^}]*)\}/g; let m;
  while((m = re.exec(text))){
    const kv = {};
    const pr = /"([^"]*)"\s*"([^"]*)"/g; let p;
    while((p = pr.exec(m[1]))) kv[p[1]] = p[2];
    if(Object.keys(kv).length) ents.push(kv);
  }
  return ents;
}
function parseBSP(buf){
  if(buf.byteLength < 124) throw new Error('file too small to hold a v30 header (need 124 bytes, got '+buf.byteLength+')');
  const dv = new DataView(buf);
  const version = dv.getInt32(0, true);
  if(version !== 30) throw new Error('not a v30 GoldSrc BSP — header says version '+version+
    (version===29?' (Quake / HL alpha)':version>=19&&version<=21?' (looks like a Source VBSP — different format entirely)':''));
  const lumps = LUMP.map((l, i) => {
    const off = dv.getInt32(4 + i*8, true), len = dv.getInt32(8 + i*8, true);
    if(off < 0 || len < 0 || off+len > buf.byteLength)
      throw new Error('lump '+i+' ('+l[0]+') runs past the end of the file — corrupt map');
    return { name:l[0], off, len, structSize:l[1], count: l[1] ? Math.floor(len/l[1]) : null };
  });
  const L = i => lumps[i];
  const f32 = (o)=>dv.getFloat32(o,true), i32=(o)=>dv.getInt32(o,true),
        u32=(o)=>dv.getUint32(o,true), i16=(o)=>dv.getInt16(o,true), u16=(o)=>dv.getUint16(o,true);

  /* LUMP 0 — entities: null-terminated ASCII of {"key" "value"} blocks */
  let entText = '';
  { const b = new Uint8Array(buf, L(0).off, L(0).len);
    const end = b.indexOf(0);
    entText = new TextDecoder('ascii').decode(end>=0 ? b.subarray(0,end) : b); }
  const entities = parseEntities(entText);

  /* LUMP 1 — planes: {vec3 normal, float dist, int32 type} = 20b */
  const planes = [];
  for(let i=0;i<L(1).count;i++){ const o=L(1).off+i*20;
    planes.push({ nx:f32(o), ny:f32(o+4), nz:f32(o+8), dist:f32(o+12), type:i32(o+16) }); }

  /* LUMP 2 — textures: uint32 count, uint32 offsets[count], then miptex
     headers {char name[16], uint32 w, h, offsets[4]} = 40b each */
  const textures = [];
  if(L(2).len >= 4){
    const base = L(2).off, n = u32(base);
    for(let i=0;i<n;i++){
      const rel = i32(base+4+i*4);
      if(rel < 0){ textures.push({ name:'(missing)', w:0, h:0, embedded:false }); continue; }
      const o = base + rel;
      if(o+40 > base+L(2).len){ textures.push({ name:'(clipped)', w:0, h:0, embedded:false }); continue; }
      let name='';
      for(let k=0;k<16;k++){ const c=dv.getUint8(o+k); if(!c) break; name+=String.fromCharCode(c); }
      textures.push({ name, w:u32(o+16), h:u32(o+20), embedded:u32(o+24)!==0 });
    }
  }

  /* LUMP 3 — vertices: vec3 = 12b */
  const nv = L(3).count, vx=new Float32Array(nv), vy=new Float32Array(nv), vz=new Float32Array(nv);
  for(let i=0;i<nv;i++){ const o=L(3).off+i*12; vx[i]=f32(o); vy[i]=f32(o+4); vz[i]=f32(o+8); }

  /* LUMP 12 — edges: {uint16 v0, uint16 v1} = 4b (edge 0 is never used directly) */
  const ne = L(12).count, e0=new Uint16Array(ne), e1=new Uint16Array(ne);
  for(let i=0;i<ne;i++){ const o=L(12).off+i*4; e0[i]=u16(o); e1[i]=u16(o+2); }

  /* LUMP 13 — surfedges: int32, sign = edge direction */
  const ns = L(13).count, surfedges = new Int32Array(ns);
  for(let i=0;i<ns;i++) surfedges[i] = i32(L(13).off+i*4);

  /* LUMP 7 — faces: {u16 plane, u16 side, u32 firstEdge, u16 nEdges,
     u16 texinfo, u8 styles[4], u32 lightOfs} = 20b */
  const faces = [];
  for(let i=0;i<L(7).count;i++){ const o=L(7).off+i*20;
    faces.push({ plane:u16(o), side:u16(o+2), firstEdge:u32(o+4), nEdges:u16(o+8), texinfo:u16(o+10) }); }

  /* LUMP 6 — texinfo (40b), LUMP 14 — models (64b) — counts + model 0 bbox */
  const models = [];
  for(let i=0;i<L(14).count;i++){ const o=L(14).off+i*64;
    models.push({ mins:[f32(o),f32(o+4),f32(o+8)], maxs:[f32(o+12),f32(o+16),f32(o+20)],
      visLeafs:i32(o+52), firstFace:i32(o+56), nFaces:i32(o+60) }); }

  /* LUMP 10 — leaves (28b): count + contents histogram */
  let solidLeaves=0, emptyLeaves=0;
  for(let i=0;i<L(10).count;i++){ const c=i32(L(10).off+i*28);
    if(c===-1) emptyLeaves++; else if(c===-2) solidLeaves++; }

  return { version, lumps, entities, entText, planes, textures,
    verts:{x:vx,y:vy,z:vz,count:nv}, edges:{a:e0,b:e1,count:ne}, surfedges, faces, models,
    counts:{ nodes:L(5).count, clipnodes:L(9).count, leaves:L(10).count,
      marksurfaces:L(11).count, texinfo:L(6).count, lightingBytes:L(8).len, visBytes:L(4).len },
    stats:{ solidLeaves, emptyLeaves } };
}
/* face → vertex loop via surfedges (sign picks edge direction) — spec §FACES */
function facePolygon(bsp, face){
  const out = [];
  for(let k=0;k<face.nEdges;k++){
    const s = bsp.surfedges[face.firstEdge+k];
    out.push(s >= 0 ? bsp.edges.a[s] : bsp.edges.b[-s]);
  }
  return out;
}

/* ═══════════════ demo map synthesizer — a v30 cube room, built in memory ═══════════════ */
function buildDemoBSP(){
  const S = 256, chunks = [];
  const w32=v=>{ const b=new ArrayBuffer(4); new DataView(b).setInt32(0,v,true); return b; };
  const wf32=v=>{ const b=new ArrayBuffer(4); new DataView(b).setFloat32(0,v,true); return b; };
  const w16=v=>{ const b=new ArrayBuffer(2); new DataView(b).setInt16(0,v,true); return b; };
  const cat=arrs=>{ const n=arrs.reduce((a,b)=>a+b.byteLength,0); const out=new Uint8Array(n);
    let o=0; for(const a of arrs){ out.set(new Uint8Array(a),o); o+=a.byteLength; } return out.buffer; };
  /* entities */
  const entText = '{\n"classname" "worldspawn"\n"message" "BSP LAB DEMO CHAMBER"\n"wad" "\\valve\\halflife.wad"\n}\n'+
    '{\n"classname" "info_player_start"\n"origin" "0 0 -220"\n"angles" "0 90 0"\n}\n'+
    '{\n"classname" "light"\n"origin" "0 0 200"\n"_light" "255 158 44 200"\n}\n'+
    '{\n"classname" "light_environment"\n"origin" "0 8 250"\n"_light" "255 244 214 120"\n"message" "skylight crack"\n}\n ';
  const entBuf = new TextEncoder().encode(entText).buffer;
  /* vertices: 8 cube corners */
  const V = [[-S,-S,-S],[S,-S,-S],[S,S,-S],[-S,S,-S],[-S,-S,S],[S,-S,S],[S,S,S],[-S,S,S],
    /* skylight crack: thin jagged loop lying in the ceiling plane (z = +S) */
    [-120,-8,S],[-40,18,S],[40,-14,S],[120,10,S],[120,22,S],[40,-2,S],[-40,30,S],[-120,4,S]];
  const vertBuf = cat(V.flatMap(v=>[wf32(v[0]),wf32(v[1]),wf32(v[2])]));
  /* faces as corner loops; face 6 is the crack — an 8-edge ceiling sliver */
  const loops = [[0,1,2,3],[7,6,5,4],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0],
    [8,9,10,11,12,13,14,15]];
  const edges=[[0,0]], eKey={}, surf=[], faceRecs=[];   // edge 0 reserved per spec
  loops.forEach((loop, fi)=>{
    const first = surf.length;
    for(let k=0;k<loop.length;k++){
      const a=loop[k], b=loop[(k+1)%loop.length], key=a+'_'+b, rkey=b+'_'+a;
      if(eKey[rkey]!==undefined) surf.push(-eKey[rkey]);
      else { eKey[key]=edges.length; surf.push(edges.length); edges.push([a,b]); }
    }
    faceRecs.push({ plane:Math.min(fi,5), firstEdge:first, nEdges:loop.length });
  });
  const edgeBuf = cat(edges.flatMap(e=>[w16(e[0]),w16(e[1])]));
  const surfBuf = cat(surf.map(w32));
  const faceBuf = cat(faceRecs.flatMap(f=>[w16(f.plane),w16(0),w32(f.firstEdge),w16(f.nEdges),w16(0),w32(0),w32(-1&0xffffffff)]));
  /* planes: 6 axis walls {normal, dist, type} */
  const P = [[0,0,-1,S,2],[0,0,1,S,2],[0,-1,0,S,1],[1,0,0,S,0],[0,1,0,S,1],[-1,0,0,S,0]];
  const planeBuf = cat(P.flatMap(p=>[wf32(p[0]),wf32(p[1]),wf32(p[2]),wf32(p[3]),w32(p[4])]));
  /* one texinfo (40b zeros + miptex 0) + textures lump with 1 miptex header */
  const texinfoBuf = new ArrayBuffer(40);
  const mip = new ArrayBuffer(40); { const d=new DataView(mip);
    'LABCRETE'.split('').forEach((c,i)=>d.setUint8(i,c.charCodeAt(0)));
    d.setUint32(16,64,true); d.setUint32(20,64,true); }
  const texBuf = cat([w32(1), w32(8), mip]);
  /* one model spanning everything */
  const model = cat([wf32(-S),wf32(-S),wf32(-S), wf32(S),wf32(S),wf32(S), wf32(0),wf32(0),wf32(0),
    w32(0),w32(0),w32(0),w32(0), w32(1), w32(0), w32(7)]);
  /* one node, two leaves, 6 marksurfaces, one clipnode */
  const node = cat([w32(0), w16(-1), w16(-2), w16(-S),w16(-S),w16(-S), w16(S),w16(S),w16(S), w16(0), w16(7)]);
  const leaves = cat([ w32(-2),w32(-1), w16(0),w16(0),w16(0),w16(0),w16(0),w16(0), w16(0),w16(0), w32(0),
                       w32(-1),w32(-1), w16(-S),w16(-S),w16(-S),w16(S),w16(S),w16(S), w16(0),w16(7), w32(0) ]);
  const marks = cat([w16(0),w16(1),w16(2),w16(3),w16(4),w16(5),w16(6)]);
  const clip = cat([w32(0), w16(-1), w16(-2)]);
  const empty = new ArrayBuffer(0);
  const lumpData = [entBuf, planeBuf, texBuf, vertBuf, empty, node, texinfoBuf, faceBuf,
                    empty, clip, leaves, marks, edgeBuf, surfBuf, model];
  /* assemble: header then lumps */
  let off = 124;
  const dir = [];
  for(const d of lumpData){ dir.push([off, d.byteLength]); off += d.byteLength; }
  const head = new ArrayBuffer(124); { const d=new DataView(head);
    d.setInt32(0,30,true);
    dir.forEach((e,i)=>{ d.setInt32(4+i*8,e[0],true); d.setInt32(8+i*8,e[1],true); }); }
  return cat([head, ...lumpData]);
}

/* ═══════════════ viewer ═══════════════ */
let BSP=null, CAM={ az:0.8, el:0.5, dist:1.6, cx:0, cy:0, cz:0, r:100 };
let showEnts=false, idleSpin=true;
const view = $('view'), vctx = view.getContext('2d');
let VW=0, VH=0;
function vresize(){
  const r = view.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  VW=r.width; VH=r.height;
  view.width=Math.round(VW*dpr); view.height=Math.round(VH*dpr);
  vctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', vresize);
function fitCam(){
  if(!BSP) return;
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  const {x,y,z,count}=BSP.verts;
  for(let i=0;i<count;i++){
    mn[0]=Math.min(mn[0],x[i]); mn[1]=Math.min(mn[1],y[i]); mn[2]=Math.min(mn[2],z[i]);
    mx[0]=Math.max(mx[0],x[i]); mx[1]=Math.max(mx[1],y[i]); mx[2]=Math.max(mx[2],z[i]);
  }
  if(count===0){ mn=[-1,-1,-1]; mx=[1,1,1]; }
  CAM.cx=(mn[0]+mx[0])/2; CAM.cy=(mn[1]+mx[1])/2; CAM.cz=(mn[2]+mx[2])/2;
  CAM.r=Math.max(1, Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2])/2);
  CAM.az=0.8; CAM.el=0.5; CAM.dist=1.6;
}
function project(px,py,pz){
  /* GoldSrc is z-up: orbit az around z, tilt el */
  const dx=px-CAM.cx, dy=py-CAM.cy, dz=pz-CAM.cz;
  const ca=Math.cos(CAM.az), sa=Math.sin(CAM.az);
  const x1=dx*ca-dy*sa, y1=dx*sa+dy*ca;
  const ce=Math.cos(CAM.el), se=Math.sin(CAM.el);
  const yv=-dz*ce + y1*se;
  const zv= dz*se + y1*ce;
  const D = CAM.r*CAM.dist*2.2;
  const pers = D/(D+zv+CAM.r*0.001);
  return { x: VW/2 + x1*pers*(Math.min(VW,VH)/(CAM.r*2.3)),
           y: VH/2 + yv*pers*(Math.min(VW,VH)/(CAM.r*2.3)),
           d: zv };
}
function drawView(t){
  vctx.clearRect(0,0,VW,VH);
  if(!BSP){ return; }
  if(BSP.demo){
    /* the skylight: a vertical shaft of light falling from the ceiling crack */
    const CR = [[-120,-8],[-40,18],[40,-14],[120,10]];
    for(let i=0;i<CR.length-1;i++){
      const t1=project(CR[i][0],CR[i][1],256),  t2=project(CR[i+1][0],CR[i+1][1],256);
      const b1=project(CR[i][0],CR[i][1],-254), b2=project(CR[i+1][0],CR[i+1][1],-254);
      vctx.fillStyle='rgba(255,244,214,0.055)';
      vctx.beginPath(); vctx.moveTo(t1.x,t1.y); vctx.lineTo(t2.x,t2.y);
      vctx.lineTo(b2.x,b2.y); vctx.lineTo(b1.x,b1.y); vctx.closePath(); vctx.fill();
    }
    vctx.fillStyle='rgba(255,244,214,0.09)';
    vctx.beginPath();
    [[-130,-8],[130,10],[130,36],[-130,18]].forEach((p,i)=>{
      const q=project(p[0],p[1],-254);
      i ? vctx.lineTo(q.x,q.y) : vctx.moveTo(q.x,q.y);
    });
    vctx.closePath(); vctx.fill();
  }
  const {x,y,z}=BSP.verts, {a,b,count}=BSP.edges;
  const step = count>24000 ? Math.ceil(count/24000) : 1;
  vctx.lineWidth=1;
  let drawn=0;
  for(let i=1;i<count;i+=step){
    const p1=project(x[a[i]],y[a[i]],z[a[i]]);
    const p2=project(x[b[i]],y[b[i]],z[b[i]]);
    const depth=Math.max(0.12, Math.min(1, 1 - ((p1.d+p2.d)/2)/(CAM.r*2.2)*0.5 - 0.1));
    vctx.strokeStyle='rgba(255,158,44,'+(0.16+0.5*depth)+')';
    vctx.beginPath(); vctx.moveTo(p1.x,p1.y); vctx.lineTo(p2.x,p2.y); vctx.stroke();
    drawn++;
  }
  if(showEnts){
    vctx.font='9px "IBM Plex Mono"'; vctx.textAlign='left';
    for(const e of BSP.entities){
      if(!e.origin) continue;
      const [ox,oy,oz]=e.origin.split(/\s+/).map(Number);
      if([ox,oy,oz].some(v=>!isFinite(v))) continue;
      const p=project(ox,oy,oz);
      vctx.fillStyle='rgba(95,192,224,0.9)';
      vctx.beginPath(); vctx.arc(p.x,p.y,2.6,0,Math.PI*2); vctx.fill();
      vctx.fillStyle='rgba(95,192,224,0.55)';
      vctx.fillText(e.classname||'?', p.x+4, p.y-3);
    }
  }
  $('viewhud').textContent = (step>1?('every '+step+'th of '):'')+BSP.edges.count.toLocaleString()+' edges · drag to orbit · wheel zooms';
}
let dragging=false, lx=0, ly=0;
view.addEventListener('pointerdown', e=>{ dragging=true; idleSpin=false; lx=e.clientX; ly=e.clientY; view.setPointerCapture(e.pointerId); view.style.cursor='grabbing'; });
view.addEventListener('pointermove', e=>{ if(!dragging) return;
  CAM.az += (e.clientX-lx)*0.008; CAM.el = Math.max(-1.4, Math.min(1.4, CAM.el+(e.clientY-ly)*0.006));
  lx=e.clientX; ly=e.clientY; });
view.addEventListener('pointerup', ()=>{ dragging=false; view.style.cursor='grab'; });
view.addEventListener('wheel', e=>{ e.preventDefault(); idleSpin=false;
  CAM.dist=Math.max(0.5, Math.min(5, CAM.dist+e.deltaY*0.0016)); }, { passive:false });
$('resetBtn').addEventListener('click', ()=>{ fitCam(); idleSpin=true; });
$('entBtn').addEventListener('click', function(){ showEnts=!showEnts; this.setAttribute('aria-pressed', String(showEnts)); });

/* ═══════════════ UI panels ═══════════════ */
let tab='lumps', entSel=null;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderPanel(){
  const q = $('search').value.trim().toLowerCase();
  const P = $('panel');
  if(!BSP){ P.innerHTML=''; return; }
  if(tab==='lumps'){
    let h='<table><tr><th>#</th><th>lump</th><th class="num">offset</th><th class="num">bytes</th><th class="num">count</th></tr>';
    BSP.lumps.forEach((l,i)=>{
      if(q && !l.name.toLowerCase().includes(q)) return;
      h+='<tr><td>'+i+'</td><td>'+l.name+'</td><td class="num">'+l.off.toLocaleString()+
         '</td><td class="num">'+l.len.toLocaleString()+'</td><td class="num">'+(l.count===null?'—':l.count.toLocaleString())+'</td></tr>';
    });
    P.innerHTML=h+'</table>';
  } else if(tab==='ents'){
    if(entSel!==null && BSP.entities[entSel]){
      const e=BSP.entities[entSel];
      let h='<div class="crumb"><a id="backEnts">← all entities</a> · #'+entSel+'</div><table class="kv">';
      for(const k in e) h+='<tr><td>'+esc(k)+'</td><td>'+esc(e[k])+'</td></tr>';
      P.innerHTML=h+'</table>';
      document.getElementById('backEnts').addEventListener('click', ()=>{ entSel=null; renderPanel(); });
      return;
    }
    let h='<table><tr><th>#</th><th>classname</th><th>targetname / notes</th></tr>';
    BSP.entities.forEach((e,i)=>{
      const cls=e.classname||'(none)';
      const extra=e.targetname||e.message||e.origin||'';
      if(q && !(cls+' '+extra).toLowerCase().includes(q)) return;
      h+='<tr class="entrow" data-i="'+i+'"><td>'+i+'</td><td>'+esc(cls)+'</td><td>'+esc(extra)+'</td></tr>';
    });
    P.innerHTML=h+'</table>';
    P.querySelectorAll('.entrow').forEach(r=>r.addEventListener('click', ()=>{ entSel=+r.dataset.i; renderPanel(); }));
  } else {
    let h='<table><tr><th>texture</th><th class="num">size</th><th>data</th></tr>';
    BSP.textures.forEach(tx=>{
      if(q && !tx.name.toLowerCase().includes(q)) return;
      h+='<tr><td>'+esc(tx.name)+'</td><td class="num">'+tx.w+'×'+tx.h+
         '</td><td>'+(tx.embedded?'<span class="badge emb">embedded</span>':'<span class="badge wad">in WAD</span>')+'</td></tr>';
    });
    P.innerHTML=h+'</table>';
  }
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{
  tab=b.dataset.tab; entSel=null;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', String(x===b)));
  renderPanel();
}));
$('search').addEventListener('input', renderPanel);

/* ═══════════════ load flow ═══════════════ */
function showError(msg){ $('err').textContent='✖ '+msg; $('err').classList.remove('hide'); }
function loadBuffer(buf, label, isDemo){
  $('err').classList.add('hide');
  try{
    BSP = parseBSP(buf);
    BSP.demo = !!isDemo;
  }catch(e){ BSP=null; $('results').classList.add('hide'); showError(e.message); return; }
  $('results').classList.remove('hide');
  vresize(); fitCam(); idleSpin=true; entSel=null;
  const c=BSP.counts;
  $('fileinfo').innerHTML='<b>'+esc(label)+'</b> · v'+BSP.version+' · '+(buf.byteLength/1024).toFixed(1)+' KB — parsed clean';
  $('geostats').textContent = BSP.verts.count.toLocaleString()+' verts · '+BSP.edges.count.toLocaleString()+' edges · '+BSP.faces.length.toLocaleString()+' faces';
  $('viewhud').textContent='';
  renderPanel();
  const wads=(BSP.entities[0]&&BSP.entities[0].wad)?' · wads: '+BSP.entities[0].wad.split(';').filter(Boolean).length:'';
  $('search').placeholder='filter · '+BSP.entities.length+' entities · '+BSP.textures.length+' textures'+wads;
}
/* ── remote map via ?url= — explicit consent, https-only, capped ──
   The URL is never auto-fetched: the host is shown and the user must click.
   Fetched bytes are only ever parsed as data (bounds-checked), never executed. */
const MAX_REMOTE_BYTES = 64*1024*1024;
function remoteUrlFromLocation(search){
  const u = new URLSearchParams(search).get('url');
  if(!u) return null;
  let p;
  try{ p = new URL(u); }catch(e){ return { error:'the url parameter is not a valid URL' }; }
  if(p.protocol !== 'https:') return { error:'remote maps must be served over https' };
  return { url:p.href, host:p.hostname };
}
async function fetchRemote(url){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 30000);
  let res;
  try{
    res = await fetch(url, { signal:ctl.signal });
  }catch(e){
    throw new Error('fetch failed — the host must allow cross-origin requests (CORS). '+
      'Hosts like raw.githubusercontent.com send the right headers; most game mirrors do not.');
  } finally { clearTimeout(to); }
  if(!res.ok) throw new Error('host answered '+res.status+' '+(res.statusText||''));
  const len = Number(res.headers && res.headers.get && res.headers.get('content-length'));
  if(isFinite(len) && len > MAX_REMOTE_BYTES) throw new Error('file is '+(len/1048576).toFixed(0)+' MB — cap is 64 MB');
  const buf = await res.arrayBuffer();
  if(buf.byteLength > MAX_REMOTE_BYTES) throw new Error('file exceeds the 64 MB cap');
  return buf;
}
{
  const rq = remoteUrlFromLocation(location.search);
  if(rq && rq.error){ showError('?url= ignored: '+rq.error); }
  else if(rq){
    $('urlhost').textContent = rq.host;
    $('urlbar').classList.remove('hide');
    $('urlGo').addEventListener('click', async ()=>{
      $('urlGo').disabled = true; $('urlGo').textContent = 'fetching…';
      try{
        const buf = await fetchRemote(rq.url);
        $('urlbar').classList.add('hide');
        loadBuffer(buf, rq.url.split('/').pop() || rq.host);
      }catch(e){
        $('urlbar').classList.add('hide');
        showError('remote map: '+e.message);
      }
    });
    $('urlNo').addEventListener('click', ()=>$('urlbar').classList.add('hide'));
  }
}
$('file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  f.arrayBuffer().then(b=>loadBuffer(b, f.name)).catch(err=>showError('could not read file: '+err.message));
});
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev, e=>{ e.preventDefault(); $('drop').classList.add('hot'); }));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev, e=>{ e.preventDefault(); $('drop').classList.remove('hot'); }));
$('drop').addEventListener('drop', e=>{
  const f=e.dataTransfer.files[0]; if(!f) return;
  f.arrayBuffer().then(b=>loadBuffer(b, f.name)).catch(err=>showError('could not read file: '+err.message));
});
$('demoBtn').addEventListener('click', ()=>loadBuffer(buildDemoBSP(), 'demo_chamber.bsp (synthesized in memory)', true));

/* loop */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(idleSpin && BSP) CAM.az += dt*0.15;
  drawView(now/1000);
  requestAnimationFrame(frame);
}
vresize();
requestAnimationFrame(t=>{ lastT=t; frame(t); });
</script>
