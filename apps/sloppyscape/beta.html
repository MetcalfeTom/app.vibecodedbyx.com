    ctxEl.style.left=Math.min(px, innerWidth-r.width-6)+'px';
    ctxEl.style.top =Math.min(py, innerHeight-r.height-6)+'px';
  }
  canvas.addEventListener('contextmenu', function(e){
    e.preventDefault();
    var t=tileAt(e);
    if(t.x<0||t.y<0||t.x>=W||t.y>=H){ hideMenu(); return; }
    var hit=props.find(function(p){ return p.x===t.x && p.y===t.y; });
    var sp=spotAt(t);
    var gI2=groundAt(t.x,t.y);
    var items=[];
    if(gI2){
      items.push({label:'Take <b>'+(ITEMS[gI2.id]?ITEMS[gI2.id].nm:'item')+(gI2.n>1?' ×'+gI2.n:'')+'</b>', act:function(){ goTake(gI2); }});
      items.push({label:'Examine <b>'+(ITEMS[gI2.id]?ITEMS[gI2.id].nm:'item')+'</b>', act:function(){ log(ITEMS[gI2.id]?ITEMS[gI2.id].ex:'A mystery.','ex'); }});
      items.push({label:'Walk here', act:function(){ walkTo(t.x,t.y); }});
      items.push({label:'Cancel', act:null});
      showMenu(e.clientX, e.clientY, items);
      return;
    }
    if(keeperAt(marta,t)){
      items.push({label:'Talk-to <b>Marta the Cook</b>', act:function(){ requestKeeperTalk(marta); }});
      items.push({label:'Trade <b>Marta the Cook</b>', act:function(){ openShop('marta', e.clientX, e.clientY); }});
      items.push({label:'Examine <b>Marta the Cook</b>', act:function(){ log('You examine Marta.','me'); log('Flour on her apron, authority in her ladle.','ex'); }});
    } else if(keeperAt(bram,t)){
      items.push({label:'Talk-to <b>Bram the Trader</b>', act:function(){ requestKeeperTalk(bram); }});
      items.push({label:'Trade <b>Bram the Trader</b>', act:function(){ openShop('bram', e.clientX, e.clientY); }});
      items.push({label:'Examine <b>Bram the Trader</b>', act:function(){ log('You examine Bram.','me'); log('A beard that negotiates before he does.','ex'); }});
    } else if(keeperAt(torva,t)){
      items.push({label:'Talk-to <b>Torva the Smith</b>', act:function(){ requestKeeperTalk(torva); }});
      items.push({label:'Examine <b>Torva the Smith</b>', act:function(){ log('You examine Torva.','me'); log('Soot on her sleeves, a furnace in her plans.','ex'); }});
    } else if(keeperAt(harl,t)){
      items.push({label:'Talk-to <b>Sergeant Harl</b>', act:function(){ requestKeeperTalk(harl); }});
      items.push({label:'Examine <b>Sergeant Harl</b>', act:function(){ log('You examine Sergeant Harl.','me'); log('Every scar has a lesson. He\'ll tell you all of them.','ex'); }});
    } else if(dummyAt(t)){
      items.push({label:'Attack <b>Training dummy</b>', act:function(){ goDo('fight', dummy); }});
      items.push({label:'Examine <b>Training dummy</b>', act:function(){ log('You examine the dummy.','me'); log(EXAMINE.dummy[Math.floor(Math.random()*EXAMINE.dummy.length)],'ex'); }});
    } else if(saltAt(t)){
      items.push({label:'Talk-to <b>Old Salt</b>', act:requestSaltTalk});
      items.push({label:'Examine <b>Old Salt</b>', act:function(){ log('You examine Old Salt.','me'); log('Half beard, half storm coat, all opinions about hulls.','ex'); }});
    } else if(ratAt(t)){
      items.push({label:'Slap <b>Beach Rat</b>', act:function(){ goDo('fight', rat); }});
      items.push({label:'Examine <b>Beach Rat</b>', act:function(){ log('You examine the beach rat.','me'); log('It has the confidence of an animal that has never been slapped.','ex'); }});
    } else if(nedAt(t)){
      items.push({label:'Talk-to <b>Fisherman Ned</b>', act:requestNedTalk});
      items.push({label:'Examine <b>Fisherman Ned</b>', act:function(){ log('You examine Fisherman Ned.','me'); log('He smells of pond and patience.','ex'); }});
    } else if(timAt(t)){
      items.push({label:'Talk-to <b>Tutorial Tim</b>', act:requestTalk});
      items.push({label:'Examine <b>Tutorial Tim</b>', act:function(){ log('You examine Tutorial Tim.','me'); log('A man who was, until recently, a goblin. The tiny hat survived the transformation.','ex'); }});
    } else if(sp){
      items.push({label:'Fish <b>Fishing spot</b>', act:function(){ goDo('fish', sp); }});
      items.push({label:'Examine <b>Fishing spot</b>', act:function(){ log(EXAMINE.spot[Math.floor(Math.random()*EXAMINE.spot.length)],'ex'); }});
    } else if(hit){
      var NM={yew:'Yew tree', tree:'Tree', rock:'Rock', fire:'Campfire', board:'Quest board', boat:'Boat', cottage:'Cottage', sign:'Signpost', wall:'Wall', swall:'Castle wall', range:'Range', counter:'Counter', shelf:'Shelf', barrel:'Barrel', table:'Table', throne:'Throne', bed:'Bed', ladder:'Ladder'};
      var nm=NM[hit.kind]||'Thing';
      if(hit.kind==='rock') nm = hit.v===2 ? 'Iron rock' : 'Copper rock';
      if(!hit.down){
        if(hit.kind==='tree'||hit.kind==='yew') items.push({label:'Chop down <b>'+nm+'</b>', act:function(){ goDo('chop', hit); }});
        if(hit.kind==='rock') items.push({label:'Mine <b>'+nm+'</b>', act:function(){ goDo('mine', hit); }});
        if(hit.kind==='fire'||hit.kind==='range') items.push({label:'Cook <b>at '+nm+'</b>', act:function(){ goDo('cook', hit); }});
        if(hit.kind==='throne') items.push({label:'Sit on <b>'+nm+'</b>', act:function(){ log('You sit. Briefly, you understand power. Then you get up.','me','player'); }});
        if(hit.kind==='board') items.push({label:'Read <b>'+nm+'</b>', act:openQuests});
        if(hit.kind==='boat') items.push({label:((zone==='lummy'&&!save.boatFixed)?'Inspect':'Sail')+' <b>'+nm+'</b>', act:function(){ trySail(hit); }});
        if(hit.kind==='ladder') items.push({label:(zone==='cave'?'Climb-up':'Climb-down')+' <b>'+nm+'</b>', act:function(){ tryClimb(hit); }});
        if(hit.kind==='sign') items.push({label:'Read <b>'+nm+'</b>', act:function(){ readSign(hit); }});
      }
      items.push({label:'Examine <b>'+nm+'</b>', act:function(){ examineProp(hit); }});
      items.push({label:'Walk here', act:function(){ walkTo(hit.x,hit.y); }});
    } else {
      items.push({label:'Walk here', act:function(){ walkTo(t.x,t.y); }});
    }
    items.push({label:'Cancel', act:null});
    showMenu(e.clientX, e.clientY, items);
  });
  // the browser menu never escapes: swallow contextmenu on the options
  // container itself AND document-wide (chatbox, HUD, everything)
  ctxEl.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('pointerdown', function(e){ if(!ctxEl.contains(e.target) && e.target!==canvas) hideMenu(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') hideMenu(); });
  addEventListener('blur', hideMenu);

  // ---------- loop ----------
  var last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    // butterflies drift (mainland only)
    if(zone==='main') flies.forEach(function(f){
      f.flap+=dt*14;
      f.a+=(Math.random()-0.5)*dt*3;
      f.x+=Math.cos(f.a)*f.sp*dt; f.y+=Math.sin(f.a)*f.sp*dt;
      if(f.x<TILE*4||f.x>(W-4)*TILE) f.a=Math.PI-f.a;
      if(f.y<TILE*4||f.y>(H-4)*TILE) f.a=-f.a;
    });
    step(dt);
    if(zone==='main'){ timUpdate(dt); nedUpdate(dt); }
    else if(zone==='lummy'){ saltUpdate(dt); ratUpdate(dt); keeperUpdate(marta,dt,1); keeperUpdate(bram,dt,1); }
    else { keeperUpdate(torva,dt,1); keeperUpdate(harl,dt,1); }
    draw(now,dt);
  }
  // snap camera to player at boot
  view.x=player.px-innerWidth/2; view.y=player.py-innerHeight/2;
  requestAnimationFrame(frame);

  // ---- draggable panels (inisso): inventory + chat, grab the ⠿ header ----
  function makeDraggable(panel, bar, key){
    if(!panel||!bar) return;
    function apply(x,y){
      x=Math.max(0, Math.min(innerWidth-80, x));
      y=Math.max(0, Math.min(innerHeight-40, y));
      panel.style.left=x+'px'; panel.style.top=y+'px';
      panel.style.right='auto'; panel.style.bottom='auto';
      return {x:x,y:y};
    }
    if(save[key] && typeof save[key].x==='number'){ apply(save[key].x, save[key].y); }
    var drag=null;
    bar.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var r=panel.getBoundingClientRect();
      drag={ dx:e.clientX-r.left, dy:e.clientY-r.top };
      panel.classList.add('dragging');
      bar.setPointerCapture && bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove', function(e){
      if(!drag) return;
      save[key]=apply(e.clientX-drag.dx, e.clientY-drag.dy);
    });
    function end(){ if(!drag) return; drag=null; panel.classList.remove('dragging'); persist(); }
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
    addEventListener('resize', function(){
      if(save[key] && typeof save[key].x==='number'){ save[key]=apply(save[key].x, save[key].y); }
    });
  }
  makeDraggable(document.getElementById('side'), document.getElementById('sideBar'), 'panelPos');
  makeDraggable(document.querySelector('.chatbox'), document.getElementById('chatBar'), 'chatPos');

  // ---- resizable chat panel (edges + corners); inventory stays fixed-size ----
  (function makeChatResizable(){
    var panel=document.querySelector('.chatbox'); if(!panel) return;
    var logEl=panel.querySelector('.log');
    var MINW=200, MINH=110;
    function maxW(){ return Math.round(innerWidth*0.92); }
    function maxH(){ return Math.round(innerHeight*0.7); }
    function applySize(w,h){
      w=Math.max(MINW, Math.min(maxW(), w));
      h=Math.max(MINH, Math.min(maxH(), h));
      panel.style.width=w+'px'; panel.style.height=h+'px';
      if(logEl) logEl.style.height='auto';
      return {w:w,h:h};
    }
    if(save.chatSize && save.chatSize.w){ applySize(save.chatSize.w, save.chatSize.h); }
    ['n','s','e','w','ne','nw','se','sw'].forEach(function(dir){
      var h=document.createElement('div'); h.className='rz rz-'+dir; h.setAttribute('aria-hidden','true');
      panel.appendChild(h);
      var st=null;
      h.addEventListener('pointerdown', function(e){
        e.preventDefault(); e.stopPropagation();
        var r=panel.getBoundingClientRect();
        // switch to absolute left/top coords so N/W edges can move the panel
        panel.style.left=r.left+'px'; panel.style.top=r.top+'px';
        panel.style.right='auto'; panel.style.bottom='auto';
        st={ x:e.clientX, y:e.clientY, w:r.width, h:r.height, l:r.left, t:r.top };
        h.setPointerCapture && h.setPointerCapture(e.pointerId);
      });
      h.addEventListener('pointermove', function(e){
        if(!st) return;
        var dx=e.clientX-st.x, dy=e.clientY-st.y;
        var w=st.w, hh=st.h, l=st.l, t=st.t;
        if(dir.indexOf('e')>=0) w=st.w+dx;
        if(dir.indexOf('s')>=0) hh=st.h+dy;
        if(dir.indexOf('w')>=0){ w=st.w-dx; l=st.l+dx; }
        if(dir.indexOf('n')>=0){ hh=st.h-dy; t=st.t+dy; }
        var sz=applySize(w,hh);
        // if clamped on a W/N drag, pin the opposite edge
        if(dir.indexOf('w')>=0) l=st.l+(st.w-sz.w);
        if(dir.indexOf('n')>=0) t=st.t+(st.h-sz.h);
        panel.style.left=Math.max(0,l)+'px'; panel.style.top=Math.max(0,t)+'px';
        save.chatSize=sz;
        save.chatPos={x:Math.max(0,l), y:Math.max(0,t)};
      });
      function end(){ if(!st) return; st=null; persist(); }
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
    });
  })();

  function setOutlines(on){
    save.outlines=on; persist();
    var b=document.getElementById('outlineBtn');
    if(b){ b.setAttribute('aria-pressed', on?'true':'false'); b.textContent='🟡 item outlines: '+(on?'ON':'OFF'); }
  }
  document.getElementById('outlineBtn').addEventListener('click', function(){ setOutlines(!save.outlines); });
  document.addEventListener('keydown', function(e){
    if((e.key==='h'||e.key==='H') && !e.repeat && e.target && e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA'){
      setOutlines(!save.outlines);
    }
  });
  setOutlines(save.outlines);

  // ---- chat channel tabs (All / World / Local / Player / NPC) ----
  function setChatTab(f){
    // freeze the panel's current height so filtering (fewer/more visible
    // lines) can never change the panel size — only the resize handles can
    var cb=document.querySelector('.chatbox');
    if(cb){ var r=cb.getBoundingClientRect(); if(r.height>0) cb.style.height=r.height+'px'; }
    save.chatTab=f; persist();
    logEl.setAttribute('data-f', f);
    document.querySelectorAll('#ctabs .ctab').forEach(function(t){
      t.setAttribute('aria-selected', t.dataset.f===f ? 'true':'false');
    });
    logEl.scrollTop=logEl.scrollHeight;
  }
  document.querySelectorAll('#ctabs .ctab').forEach(function(t){
    t.addEventListener('click', function(){ setChatTab(t.dataset.f); });
  });
  setChatTab(['all','system','world','local','player','npc'].includes(save.chatTab)?save.chatTab:'all');

  renderSkills(); renderInv(); renderQuests(); renderEquip(); updLetters();
  document.getElementById('tabPack').addEventListener('click', function(){ setPanelTab('pack'); });
  document.getElementById('tabEquip').addEventListener('click', function(){ setPanelTab('equip'); });
  setZone(save.zone, null);   // drops the player into the right world (Lummy for new souls)
  log('Welcome to SloppyScape.','sys');
  if(zone==='lummy'){
    log('This is Lummy — the town before the island. A castle rises at its centre.','sys');
    log('Marta cooks in the castle kitchen; Bram trades in the house east of the walls.','sys');
    log('Follow the dirt path south to the dock. Old Salt is fussing over a leaky boat.','sys');
    log('A ladder east of the castle leads down to the tutors\' cave.','sys');
    log('A stick lies on the beach. The rat doesn\'t know what\'s coming.','sys');
  } else {
    log('Chop trees. Mine rocks. Fish the churning spots. Cook at the campfire.','sys');
    log('The quest board near spawn has work for you. 🪙 awaits.','sys');
    log('A man in a tiny hat patrols the yew grove. Talk to him — he has gifts.','sys');
    log('A pond glitters inland. Fisherman Ned has a net with your name on it.','sys');
    log('⛵ A boat at the south dock sails back to Lummy, if you\'re homesick.','sys');
  }
})();
