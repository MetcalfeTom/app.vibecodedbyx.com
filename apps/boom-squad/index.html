<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boom Squad — a bomb defusal party game</title>
<meta name="description" content="One player holds the bomb. Everyone else holds the manual. Three strikes, one timer, four modules, and a lot of shouting.">
<link rel="icon" href="https://emojicdn.elk.sh/💣">
<meta property="og:title" content="Boom Squad">
<meta property="og:description" content="One holds the bomb. The others hold the manual. Shout carefully.">
<meta property="og:url" content="https://sloppy.live/boom-squad/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/an%20open%20briefcase%20bomb%20with%20colored%20wires%20a%20countdown%20timer%20and%20strange%20symbol%20keypad%2C%20friends%20pointing%20at%20a%20technical%20manual%2C%20party%20game%20art%2C%20dramatic%20light%2C%20fun%20not%20scary?width=1200&height=630&nologo=true&seed=1337&model=flux&format=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --case:#2a2d33; --case2:#3a3e46; --panel:#1c1e23; --edge:#4a4f58; --ink:#e8e6dd;
  --dim:#8a8f99; --timer:#ff5a4a; --ok:#5ec86a; --warn:#f5c542; --paper:#f2ecd8; --paperink:#2e2a20;
  --r:#d8452e; --b:#3a6bd6; --y:#e8c53d; --w:#e8e6dd; --k:#1a1a1a; --g:#4a9a58;
}
html{ font-size:100%; }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; color:var(--ink); font-family:'VT323', monospace; font-size:1.15rem;
  background:
    radial-gradient(40rem 20rem at 50% -5%, rgba(255,90,74,.06), transparent 60%),
    linear-gradient(180deg, #16181c 0%, #1f2126 100%);
}
main{ max-width:58rem; margin:0 auto; padding:1rem .8rem 3rem; text-align:center; }
h1{
  font-family:'Allerta Stencil', sans-serif; font-size:clamp(1.8rem,6vw,3rem);
  letter-spacing:.12em; color:var(--ink);
}
h1 span{ color:var(--timer); }
.tag{ color:var(--dim); font-size:1rem; margin-bottom:.7rem; }
.viewtabs{ display:flex; gap:.5rem; justify-content:center; margin:.6rem 0 1rem; }
.viewtabs button{
  font-family:'Allerta Stencil', sans-serif; font-size:.9rem; letter-spacing:.08em;
  background:var(--panel); color:var(--dim); border:2px solid var(--edge); border-radius:.5rem;
  padding:.55rem 1.2rem; min-height:2.75rem; cursor:pointer;
}
.viewtabs button.on{ color:var(--ink); border-color:var(--timer); background:#2a2126; }
:focus-visible{ outline:3px solid var(--warn); outline-offset:2px; }
/* ── bomb view ── */
.bomb{
  background:linear-gradient(180deg, var(--case2), var(--case)); border:3px solid var(--edge);
  border-radius:1rem; padding:1rem; box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.04);
}
.bombtop{ display:flex; gap:.8rem; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:.8rem; }
.clock{
  font-size:2.6rem; color:var(--timer); background:#120b0a; border:2px solid #3a2a28; border-radius:.5rem;
  padding:.1rem .7rem; letter-spacing:.1em; text-shadow:0 0 12px rgba(255,90,74,.6); min-width:9rem;
}
.clock.boom{ color:#fff; background:var(--timer); }
.meta{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
.meta .chip{
  background:var(--panel); border:1.5px solid var(--edge); border-radius:.4rem; padding:.25rem .6rem; font-size:1rem;
}
.meta .chip b{ color:var(--warn); }
.meta .ind{ font-family:'Allerta Stencil', sans-serif; font-size:.75rem; padding:.3rem .5rem; }
.meta .ind i{ display:inline-block; width:.6rem; height:.6rem; border-radius:50%; background:#443; margin-right:.3rem; }
.meta .ind.lit i{ background:var(--warn); box-shadow:0 0 8px var(--warn); }
.strikes{ font-size:1.6rem; letter-spacing:.2em; color:var(--timer); min-width:6rem; }
.mods{ display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.8rem; }
.mod{
  background:var(--panel); border:2px solid var(--edge); border-radius:.7rem; padding:.7rem; position:relative;
  min-height:11rem;
}
.mod h3{ font-family:'Allerta Stencil', sans-serif; font-size:.8rem; letter-spacing:.14em; color:var(--dim); margin-bottom:.5rem; }
.mod .led{
  position:absolute; top:.55rem; right:.6rem; width:.8rem; height:.8rem; border-radius:50%;
  background:#442; border:1px solid #000;
}
.mod.solved .led{ background:var(--ok); box-shadow:0 0 10px var(--ok); }
.mod.solved{ opacity:.75; }
.mod.solved::after{ content:"DEFUSED"; position:absolute; inset:auto 0 .4rem 0; color:var(--ok); font-family:'Allerta Stencil',sans-serif; font-size:.7rem; letter-spacing:.2em; }
/* wires */
.wirebox{ display:flex; flex-direction:column; gap:.55rem; padding:.4rem .2rem; }
button.wire{
  height:.9rem; border:none; border-radius:.4rem; cursor:pointer; position:relative; min-height:1.2rem;
  box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 2px 2px rgba(255,255,255,.25);
}
button.wire.cut{ background-image:linear-gradient(90deg, transparent 46%, var(--panel) 46%, var(--panel) 54%, transparent 54%) !important; box-shadow:none; cursor:default; }
/* button module */
.bigbtn{
  width:7.5rem; height:7.5rem; border-radius:50%; border:.4rem solid #111; cursor:pointer;
  font-family:'Allerta Stencil', sans-serif; font-size:1rem; letter-spacing:.06em;
  box-shadow:0 6px 0 #0a0a0a, inset 0 3px 8px rgba(255,255,255,.3); margin:.4rem auto; display:block;
}
.bigbtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #0a0a0a, inset 0 3px 8px rgba(255,255,255,.3); }
.holdnote{ font-size:.95rem; color:var(--dim); min-height:1.2rem; }
/* keypad */
.keys{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; padding:.2rem 1rem; }
button.key{
  font-size:2rem; background:#d8d2c0; color:#221; border:2px solid #999; border-radius:.5rem;
  min-height:3.4rem; cursor:pointer;
}
button.key.litok{ background:var(--ok); color:#fff; }
button.key.literr{ background:var(--timer); color:#fff; }
/* simon */
.simon{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; width:9rem; margin:.3rem auto; }
button.spad{ min-height:3.4rem; border:2px solid #111; border-radius:.6rem; cursor:pointer; opacity:.55; }
button.spad.flash{ opacity:1; box-shadow:0 0 16px currentColor; }
.s-r{ background:var(--r); color:var(--r); } .s-b{ background:var(--b); color:var(--b); }
.s-y{ background:var(--y); color:var(--y); } .s-g{ background:var(--g); color:var(--g); }
.simonnote{ font-size:.95rem; color:var(--dim); min-height:1.2rem; }
/* bottom row */
.bombrow{ display:flex; gap:.6rem; justify-content:center; margin-top:1rem; flex-wrap:wrap; }
.bombrow button{
  font-family:'Allerta Stencil', sans-serif; font-size:.85rem; background:var(--panel); color:var(--ink);
  border:2px solid var(--edge); border-radius:.5rem; padding:.55rem 1.1rem; min-height:2.75rem; cursor:pointer;
}
.bombrow button:hover{ border-color:var(--warn); }
/* result overlay */
.result{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(10,8,8,.9); padding:1rem; text-align:center;
}
.result[hidden]{ display:none; }
.result h2{ font-family:'Allerta Stencil', sans-serif; font-size:clamp(2rem,8vw,4rem); letter-spacing:.1em; }
.result.win h2{ color:var(--ok); } .result.lose h2{ color:var(--timer); }
.result p{ color:var(--dim); margin:.6rem 0 1rem; font-size:1.2rem; }
/* ── manual view ── */
.manual{
  background:var(--paper); color:var(--paperink); border-radius:.6rem; padding:1.2rem 1.4rem; text-align:left;
  font-family:'Special Elite', cursive; font-size:.95rem; line-height:1.6;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.manual h2{ font-family:'Allerta Stencil', sans-serif; letter-spacing:.1em; border-bottom:3px double #7a6a4a; margin:1rem 0 .5rem; font-size:1.2rem; }
.manual h2:first-child{ margin-top:0; }
.manual table{ border-collapse:collapse; margin:.5rem 0; width:100%; }
.manual td, .manual th{ border:1px solid #9a8a6a; padding:.3rem .5rem; font-size:.85rem; text-align:left; }
.manual th{ background:rgba(122,106,74,.15); }
.manual .sym{ font-size:1.3rem; font-family:'VT323',monospace; }
.manual em{ background:rgba(232,197,61,.35); font-style:normal; padding:0 .2rem; }
.hidden{ display:none !important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
footer{ color:var(--dim); margin-top:1.2rem; font-size:1rem; }
@media (prefers-reduced-motion: reduce){ button.spad.flash{ box-shadow:none; } }
</style>
</head>
<body>
<main>
  <h1>BOOM <span>SQUAD</span></h1>
  <p class="tag">one of you holds the bomb. the rest hold the manual. nobody holds their breath very well.</p>
  <div class="viewtabs" role="tablist">
    <button type="button" id="tab-bomb" class="on" role="tab" aria-selected="true">💣 THE BOMB</button>
    <button type="button" id="tab-manual" role="tab" aria-selected="false">📖 THE MANUAL</button>
  </div>

  <section id="view-bomb" aria-label="The bomb">
    <div class="bomb">
      <div class="bombtop">
        <div class="clock" id="clock">5:00</div>
        <div class="meta">
          <span class="chip">SERIAL <b id="serial">—</b></span>
          <span class="chip">🔋×<b id="bats">0</b></span>
          <span class="chip ind" id="ind"><i></i><span id="indName">SIG</span></span>
        </div>
        <div class="strikes" id="strikes">○ ○ ○</div>
      </div>
      <div class="mods">
        <div class="mod" id="mod-wires"><span class="led"></span><h3>WIRES</h3><div class="wirebox" id="wirebox"></div></div>
        <div class="mod" id="mod-button"><span class="led"></span><h3>THE BUTTON</h3>
          <button type="button" class="bigbtn" id="bigbtn">PUSH</button>
          <p class="holdnote" id="holdnote"></p>
        </div>
        <div class="mod" id="mod-keypad"><span class="led"></span><h3>KEYPAD</h3><div class="keys" id="keys"></div></div>
        <div class="mod" id="mod-simon"><span class="led"></span><h3>SIMON</h3>
          <div class="simon" id="simon"></div>
          <p class="simonnote" id="simonnote">watch…</p>
        </div>
      </div>
      <div class="bombrow">
        <button type="button" id="newBtn">⟳ NEW BOMB</button>
        <button type="button" id="sndBtn" aria-pressed="true">♪ SOUND ON</button>
      </div>
    </div>
  </section>

  <section id="view-manual" class="hidden" aria-label="The defusal manual">
    <div class="manual" id="manualBody"></div>
  </section>

  <div class="result" id="result" hidden role="dialog" aria-modal="true" aria-label="Round result">
    <h2 id="resultTitle">BOOM</h2>
    <p id="resultText"></p>
    <div class="bombrow"><button type="button" id="againBtn">⟳ ANOTHER BOMB</button></div>
  </div>

  <footer>party protocol: defuser opens THE BOMB · everyone else opens THE MANUAL on their phones · communicate or evaporate</footer>
  <p class="sr-only" role="status" aria-live="polite" id="sr"></p>
</main>

<script>
'use strict';
/* ═══════════ RULE TABLES — the single source for BOTH the validator and the manual ═══════════ */
var WIRE_COLORS={ r:['red','var(--r)'], b:['blue','var(--b)'], y:['yellow','var(--y)'], w:['white','var(--w)'], k:['black','var(--k)'] };
var WIRE_RULES={
  3:[ {test:'no red wire', cut:'the second wire'},
      {test:'exactly one blue wire', cut:'the blue wire'},
      {test:'otherwise', cut:'the last wire'} ],
  4:[ {test:'more than one red wire AND serial digit is odd', cut:'the last red wire'},
      {test:'no yellow wire', cut:'the first wire'},
      {test:'otherwise', cut:'the third wire'} ],
  5:[ {test:'two or more black wires', cut:'the fourth wire'},
      {test:'the indicator light is LIT', cut:'the first wire'},
      {test:'otherwise', cut:'the second wire'} ]
};
function wireAnswer(wires, meta){
  var n=wires.length;
  function idxOf(pred, fromEnd){
    if(fromEnd){ for(var i=n-1;i>=0;i--) if(pred(wires[i])) return i; }
    else { for(var j=0;j<n;j++) if(pred(wires[j])) return j; }
    return -1;
  }
  if(n===3){
    if(wires.indexOf('r')<0) return 1;
    if(wires.filter(function(w){return w==='b';}).length===1) return wires.indexOf('b');
    return n-1;
  }
  if(n===4){
    if(wires.filter(function(w){return w==='r';}).length>1 && meta.lastDigit%2===1) return idxOf(function(w){return w==='r';}, true);
    if(wires.indexOf('y')<0) return 0;
    return 2;
  }
  if(wires.filter(function(w){return w==='k';}).length>=2) return 3;
  if(meta.lit) return 0;
  return 1;
}
var BUTTON_RULES=[
  {test:'the button is BLUE and says HOLD', act:'hold', digit:4, text:'HOLD it. release when the timer contains a <em>4</em>.'},
  {test:'there are 2 or more batteries and it says BOOM', act:'tap', digit:0, text:'press and immediately release.'},
  {test:'the button is WHITE and the indicator is LIT', act:'hold', digit:1, text:'HOLD it. release when the timer contains a <em>1</em>.'},
  {test:'it says PUSH', act:'tap', digit:0, text:'press and immediately release.'},
  {test:'otherwise', act:'hold', digit:5, text:'HOLD it. release when the timer contains a <em>5</em>.'}
];
function buttonAnswer(btn, meta){
  if(btn.color==='b' && btn.label==='HOLD') return BUTTON_RULES[0];
  if(meta.bats>=2 && btn.label==='BOOM') return BUTTON_RULES[1];
  if(btn.color==='w' && meta.lit) return BUTTON_RULES[2];
  if(btn.label==='PUSH') return BUTTON_RULES[3];
  return BUTTON_RULES[4];
}
var KEY_COLUMNS=[
  ['✶','ϟ','Ω','¥','☾'],
  ['Ω','ψ','✶','∞','⌘'],
  ['¥','⌘','☾','ψ','ϟ']
];
function keypadAnswer(symbols){
  for(var c=0;c<KEY_COLUMNS.length;c++){
    var col=KEY_COLUMNS[c];
    if(symbols.every(function(s){ return col.indexOf(s)>=0; })){
      return symbols.slice().sort(function(a,b){ return col.indexOf(a)-col.indexOf(b); });
    }
  }
  return null;
}
var SIMON_MAP={
  vowel:{ r:'b', b:'y', y:'g', g:'r' },
  novowel:{ r:'y', b:'g', y:'r', g:'b' }
};
function simonAnswer(seq, meta){
  var map=SIMON_MAP[meta.vowel?'vowel':'novowel'];
  return seq.map(function(c){ return map[c]; });
}
/* ═══════════ BOMB GENERATION ═══════════ */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function genBomb(){
  var letters='ABCDEFGHKMNPRSTUVWXZ', digits='0123456789';
  var serial=pick(letters)+pick(digits)+pick(letters)+'-'+pick(digits)+pick(letters)+pick(digits);
  var meta={
    serial:serial,
    lastDigit:+serial[serial.length-1],
    vowel:/[AEIOU]/.test(serial),
    bats:Math.floor(Math.random()*5),
    lit:Math.random()<0.5,
    indName:pick(['SIG','BOB','CLR'])
  };
  var n=3+Math.floor(Math.random()*3);
  var wires=[]; for(var i=0;i<n;i++) wires.push(pick(Object.keys(WIRE_COLORS)));
  var btn={ color:pick(['r','b','y','w']), label:pick(['PUSH','HOLD','BOOM']) };
  var col=KEY_COLUMNS[Math.floor(Math.random()*KEY_COLUMNS.length)];
  var symbols=col.slice().sort(function(){ return Math.random()-0.5; }).slice(0,4);
  var seq=[]; for(var s2=0;s2<3;s2++) seq.push(pick(['r','b','y','g']));
  return { meta:meta, wires:wires, btn:btn, symbols:symbols, seq:seq };
}
/* ═══════════ STATE ═══════════ */
var B=null, time=300, timer=null, strikes=0, solved={}, over=false, snd=true;
var keyProgress=0, simonProgress=0, holdStart=0, holding=false;
var AC=null;
function beep(f,d,t,v){
  if(!snd) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(!AC) return;
  try{
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=t||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(v||.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+(d||.08));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(d||.08)+.02);
  }catch(e){}
}
function explode(){
  if(!snd || !AC) return;
  try{
    var len=AC.sampleRate*0.9, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    var src=AC.createBufferSource(); src.buffer=buf;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3000,AC.currentTime);
    f.frequency.exponentialRampToValueAtTime(120, AC.currentTime+0.8);
    var g=AC.createGain(); g.gain.value=.4;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  }catch(e){}
}
/* ═══════════ BOMB UI ═══════════ */
function fmtTime(t){
  var m=Math.floor(t/60), s=Math.floor(t%60);
  return m+':'+String(s).padStart(2,'0');
}
function tickRate(){ return strikes===0? 1 : strikes===1? 1.25 : 1.5; }
function startClock(){
  clearInterval(timer);
  var last=performance.now();
  timer=setInterval(function(){
    if(over) return;
    var now=performance.now();
    time-=((now-last)/1000)*tickRate();
    last=now;
    if(time<=0){ time=0; lose('the timer ran out.'); }
    document.getElementById('clock').textContent=fmtTime(Math.max(0,time));
    if(Math.floor(time*2)%2===0 && time>0 && time<30) beep(1100,.03,'square',.03);
  }, 100);
}
function strike(why){
  if(over) return;
  strikes++;
  beep(180,.3,'sawtooth',.12);
  paintStrikes();
  document.getElementById('sr').textContent='Strike '+strikes+': '+why;
  if(strikes>=3){ lose('three strikes. '+why); }
}
function paintStrikes(){
  var s='';
  for(var i=0;i<3;i++) s+=(i<strikes?'✖ ':'○ ');
  document.getElementById('strikes').textContent=s.trim();
}
function checkWin(){
  if(solved.wires&&solved.button&&solved.keypad&&solved.simon) win();
}
function markSolved(mod){
  solved[mod]=true;
  document.getElementById('mod-'+mod).classList.add('solved');
  beep(880,.12,'triangle',.1); beep(1320,.14,'triangle',.08);
  document.getElementById('sr').textContent=mod+' defused';
  checkWin();
}
function win(){
  over=true; clearInterval(timer);
  var r=document.getElementById('result');
  r.className='result win'; r.hidden=false;
  document.getElementById('resultTitle').textContent='DEFUSED';
  document.getElementById('resultText').textContent='with '+fmtTime(time)+' left and '+strikes+' strike'+(strikes===1?'':'s')+'. the squad lives.';
  [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,.2,'triangle',.12); }, i*120); });
}
function lose(why){
  over=true; clearInterval(timer);
  document.getElementById('clock').classList.add('boom');
  explode();
  var r=document.getElementById('result');
  r.className='result lose'; r.hidden=false;
  document.getElementById('resultTitle').textContent='BOOM';
  document.getElementById('resultText').textContent=why+' better luck next bomb.';
}
function buildBomb(){
  B=genBomb();
  time=300; strikes=0; solved={}; over=false; keyProgress=0; simonProgress=0;
  document.getElementById('result').hidden=true;
  document.getElementById('clock').classList.remove('boom');
  document.getElementById('serial').textContent=B.meta.serial;
  document.getElementById('bats').textContent=B.meta.bats;
  document.getElementById('indName').textContent=B.meta.indName;
  document.getElementById('ind').classList.toggle('lit', B.meta.lit);
  paintStrikes();
  ['wires','button','keypad','simon'].forEach(function(m){ document.getElementById('mod-'+m).classList.remove('solved'); });
  /* wires */
  var wb=document.getElementById('wirebox'); wb.innerHTML='';
  B.wires.forEach(function(w,i){
    var b=document.createElement('button');
    b.type='button'; b.className='wire'; b.style.background=WIRE_COLORS[w][1];
    b.setAttribute('aria-label','wire '+(i+1)+', '+WIRE_COLORS[w][0]);
    b.addEventListener('click', function(){
      if(over||solved.wires||b.classList.contains('cut')) return;
      b.classList.add('cut');
      beep(320,.06,'square',.08);
      if(i===wireAnswer(B.wires,B.meta)) markSolved('wires');
      else strike('wrong wire.');
    });
    wb.appendChild(b);
  });
  /* button */
  var bb=document.getElementById('bigbtn');
  bb.textContent=B.btn.label;
  bb.style.background=WIRE_COLORS[B.btn.color][1];
  bb.style.color=(B.btn.color==='w'||B.btn.color==='y')?'#222':'#f2f0e8';
  document.getElementById('holdnote').textContent='';
  /* keypad */
  var keys=document.getElementById('keys'); keys.innerHTML='';
  B.symbols.forEach(function(sym){
    var k=document.createElement('button');
    k.type='button'; k.className='key'; k.textContent=sym;
    k.setAttribute('aria-label','symbol key');
    k.addEventListener('click', function(){
      if(over||solved.keypad||k.classList.contains('litok')) return;
      var order=keypadAnswer(B.symbols);
      if(order && sym===order[keyProgress]){
        keyProgress++;
        k.classList.add('litok');
        beep(520+keyProgress*80,.07,'square',.08);
        if(keyProgress>=B.symbols.length) markSolved('keypad');
      } else {
        k.classList.add('literr');
        setTimeout(function(){ k.classList.remove('literr'); }, 400);
        keyProgress=0;
        document.querySelectorAll('.key').forEach(function(x){ x.classList.remove('litok'); });
        strike('wrong keypad order.');
      }
    });
    keys.appendChild(k);
  });
  /* simon */
  var sm=document.getElementById('simon'); sm.innerHTML='';
  ['r','b','y','g'].forEach(function(c){
    var p=document.createElement('button');
    p.type='button'; p.className='spad s-'+c; p.dataset.c=c;
    p.setAttribute('aria-label',{r:'red',b:'blue',y:'yellow',g:'green'}[c]+' pad');
    p.addEventListener('click', function(){
      if(over||solved.simon) return;
      var want=simonAnswer(B.seq,B.meta);
      flashPad(p);
      if(c===want[simonProgress]){
        simonProgress++;
        beep(400+simonProgress*120,.08,'triangle',.08);
        if(simonProgress>=want.length) markSolved('simon');
      } else {
        simonProgress=0;
        strike('wrong simon answer.');
        playSimon();
      }
    });
    sm.appendChild(p);
  });
  startClock();
  setTimeout(playSimon, 900);
  document.getElementById('sr').textContent='New bomb armed. Serial '+B.meta.serial;
}
function flashPad(p){
  p.classList.add('flash');
  setTimeout(function(){ p.classList.remove('flash'); }, 300);
}
function playSimon(){
  if(over||solved.simon) return;
  document.getElementById('simonnote').textContent='watch…';
  B.seq.forEach(function(c,i){
    setTimeout(function(){
      var p=document.querySelector('.spad.s-'+c);
      if(p){ flashPad(p); beep({r:320,b:420,y:520,g:620}[c],.15,'triangle',.07); }
      if(i===B.seq.length-1) setTimeout(function(){ document.getElementById('simonnote').textContent='now answer (translated).'; }, 400);
    }, i*550);
  });
}
/* button hold logic */
(function(){
  var bb=document.getElementById('bigbtn');
  bb.addEventListener('pointerdown', function(){
    if(over||solved.button) return;
    holding=true; holdStart=performance.now();
  });
  bb.addEventListener('pointerup', function(){
    if(over||solved.button||!holding) return;
    holding=false;
    var rule=buttonAnswer(B.btn,B.meta);
    var heldMs=performance.now()-holdStart;
    if(rule.act==='tap'){
      if(heldMs<500) markSolved('button');
      else strike('you held a button meant for pressing.');
    } else {
      if(heldMs<500){ strike('you tapped a button meant for holding.'); return; }
      var digits=fmtTime(Math.max(0,time));
      if(digits.indexOf(String(rule.digit))>=0) markSolved('button');
      else strike('released at the wrong second.');
    }
  });
})();
/* ═══════════ MANUAL — rendered FROM the rule tables so it can never drift ═══════════ */
function renderManual(){
  var h='';
  h+='<h2>§0 · HOW TO SPEAK BOMB</h2><p>The defuser reads the bomb aloud: the <em>serial</em>, the <em>battery count</em>, and whether the <em>indicator light is lit</em>. Experts find the rule. Three strikes and everyone stops being friends.</p>';
  h+='<h2>§1 · WIRES</h2><p>Count the wires. Apply the FIRST matching rule. Cut exactly one wire.</p>';
  Object.keys(WIRE_RULES).forEach(function(n){
    h+='<table><tr><th colspan="2">'+n+' wires</th></tr>';
    WIRE_RULES[n].forEach(function(r){
      h+='<tr><td>'+r.test+'</td><td>cut '+r.cut+'</td></tr>';
    });
    h+='</table>';
  });
  h+='<p>"serial digit" means the <em>last digit of the serial</em>.</p>';
  h+='<h2>§2 · THE BUTTON</h2><p>Apply the FIRST matching rule.</p><table>';
  BUTTON_RULES.forEach(function(r){ h+='<tr><td>'+r.test+'</td><td>'+r.text+'</td></tr>'; });
  h+='</table><p>A "tap" is under half a second. Any longer is a hold.</p>';
  h+='<h2>§3 · KEYPAD</h2><p>All four symbols on the bomb appear in exactly ONE column below. Press them in that column\'s top-to-bottom order.</p><table><tr>';
  KEY_COLUMNS.forEach(function(c,i){ h+='<th>column '+(i+1)+'</th>'; });
  h+='</tr>';
  for(var row=0;row<5;row++){
    h+='<tr>';
    KEY_COLUMNS.forEach(function(c){ h+='<td class="sym">'+c[row]+'</td>'; });
    h+='</tr>';
  }
  h+='</table>';
  h+='<h2>§4 · SIMON</h2><p>The bomb flashes a sequence. Do NOT copy it — translate every flash using the table, then press the translated colors in order.</p>';
  h+='<table><tr><th>flash</th><th>serial HAS a vowel → press</th><th>serial has NO vowel → press</th></tr>';
  ['r','b','y','g'].forEach(function(c){
    var name={r:'red',b:'blue',y:'yellow',g:'green'};
    h+='<tr><td>'+name[c]+'</td><td>'+name[SIMON_MAP.vowel[c]]+'</td><td>'+name[SIMON_MAP.novowel[c]]+'</td></tr>';
  });
  h+='</table><p>Wrong press replays the flashes. Breathe.</p>';
  document.getElementById('manualBody').innerHTML=h;
}
/* ═══════════ WIRE ═══════════ */
document.getElementById('tab-bomb').addEventListener('click', function(){ setView('bomb'); });
document.getElementById('tab-manual').addEventListener('click', function(){ setView('manual'); });
function setView(v){
  document.getElementById('view-bomb').classList.toggle('hidden', v!=='bomb');
  document.getElementById('view-manual').classList.toggle('hidden', v!=='manual');
  document.getElementById('tab-bomb').classList.toggle('on', v==='bomb');
  document.getElementById('tab-manual').classList.toggle('on', v==='manual');
  document.getElementById('tab-bomb').setAttribute('aria-selected', String(v==='bomb'));
  document.getElementById('tab-manual').setAttribute('aria-selected', String(v==='manual'));
}
document.getElementById('newBtn').addEventListener('click', buildBomb);
document.getElementById('againBtn').addEventListener('click', buildBomb);
document.getElementById('sndBtn').addEventListener('click', function(){
  snd=!snd;
  this.textContent=snd?'♪ SOUND ON':'♪ SOUND OFF';
  this.setAttribute('aria-pressed', String(snd));
});
renderManual();
buildBomb();
window.__BOOM={ genBomb:genBomb, wireAnswer:wireAnswer, buttonAnswer:buttonAnswer, keypadAnswer:keypadAnswer,
  simonAnswer:simonAnswer, KEY_COLUMNS:KEY_COLUMNS, SIMON_MAP:SIMON_MAP, WIRE_RULES:WIRE_RULES, BUTTON_RULES:BUTTON_RULES,
  get B(){return B;}, get strikes(){return strikes;}, get solved(){return solved;}, get over(){return over;},
  get time(){return time;}, set time(v){time=v;}, buildBomb:buildBomb, markSolved:markSolved, strike:strike };
</script>
