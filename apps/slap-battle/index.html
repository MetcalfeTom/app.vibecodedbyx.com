<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Slap Battle</title>
<meta name="description" content="Swipe at your rival. The faster the flick, the harder the slap. Take on Yuki, or a friend on the same screen.">
<link rel="icon" href="https://emojicdn.elk.sh/👋">
<meta property="og:title" content="Slap Battle">
<meta property="og:description" content="Faster flick, harder slap. Take on Yuki, or a friend on one screen.">
<meta property="og:url" content="https://app.sloppy.live/slap-battle/">
<meta property="og:image" content="https://app.sloppy.live/slap-battle/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5ecd9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5ecd9; --ink:#17110e; --red:#e0262f; --gold:#ffc83a;
  --p1:#ff7aa8; --p2:#4fb0e6;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --mono:'DotGothic16',ui-monospace,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--mono);color:var(--ink);background-color:var(--paper);
  background-image:
    radial-gradient(rgba(23,17,14,.12) 1.1px,transparent 1.7px),
    radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(120,70,30,.2));
  background-size:7px 7px,100% 100%;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
}
#game{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,2vw,20px);align-items:start;
  padding:clamp(12px,2.4vh,22px) clamp(16px,3vw,32px) 0;position:relative;z-index:3}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side.r{align-items:flex-end}
.bar{position:relative;width:100%;height:clamp(18px,3vh,26px);border:3px solid var(--ink);background:#2c231d;
  transform:skewX(-18deg);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.side.r .bar{transform:skewX(18deg);box-shadow:-4px 4px 0 var(--ink)}
.fill,.ghost{position:absolute;top:0;bottom:0;left:0;width:100%}
.side.r .fill,.side.r .ghost{left:auto;right:0}
.ghost{background:#fff;transition:width .6s ease .4s}
.fill{background:var(--gold);transition:width .16s ease-out}
.fill.low{background:#ff8a2a}
.fill.crit{background:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.5)}}
.name{font-family:var(--display);font-size:clamp(15px,3.2vw,24px);display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.side.r .name{flex-direction:row-reverse}
.name .hp{font-family:var(--mono);font-size:.72em;opacity:.75}
.name .tag{font-family:var(--mono);font-size:.55em;background:var(--ink);color:var(--paper);padding:1px 6px}
.vs{font-family:var(--display);font-size:clamp(22px,5vw,40px);color:var(--red);line-height:1;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:rotate(-6deg);padding-top:4px}

/* ---------- arena ---------- */
.arena{flex:1;position:relative;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;cursor:grab}
.arena:active{cursor:grabbing}
.fighter{position:relative;display:grid;place-items:center;min-height:0}
.fighter::before{content:"";position:absolute;inset:-30%;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-conic-gradient(from 0deg,var(--ink) 0 1.2deg,transparent 1.2deg 7deg);
  -webkit-mask:radial-gradient(circle,transparent 26%,#000 27%,#000 55%,transparent 72%);
          mask:radial-gradient(circle,transparent 26%,#000 27%,#000 55%,transparent 72%);
  animation:spin 40s linear infinite}
.fighter::after{content:"";position:absolute;width:min(60%,300px);aspect-ratio:1;border-radius:50%;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle,var(--glow) 0,transparent 68%);pointer-events:none}
.fighter.p1{--glow:var(--p1)} .fighter.p2{--glow:var(--p2)}
.fighter.turn::before{opacity:.13} .fighter.turn::after{opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.char{position:relative;z-index:1;font-size:clamp(92px,24vmin,210px);line-height:1;
  filter:drop-shadow(6px 7px 0 rgba(23,17,14,.22));animation:idle 1.8s ease-in-out infinite;transition:opacity .3s,filter .3s}
.fighter.p2 .char{animation-delay:-.9s}
.fighter.wait .char{opacity:.55;filter:grayscale(.6) drop-shadow(6px 7px 0 rgba(23,17,14,.15))}
@keyframes idle{50%{transform:translateY(-8px) rotate(2deg)}}
.fighter.hit .char{animation:hit .5s ease-out}
@keyframes hit{
  0%{transform:translate(0) rotate(0);filter:brightness(2.4) drop-shadow(0 0 0 #fff)}
  20%{transform:translate(var(--kx,-26px),-6px) rotate(var(--kr,-18deg))}
  45%{transform:translate(calc(var(--kx,-26px) * -.4),0) rotate(calc(var(--kr,-18deg) * -.4))}
  100%{transform:translate(0) rotate(0)}}
.fighter.p1.hit{--kx:-30px;--kr:-18deg} .fighter.p2.hit{--kx:30px;--kr:18deg}
.fighter.lunge .char{animation:lunge .32s ease-out}
.fighter.p1.lunge{--lx:40px} .fighter.p2.lunge{--lx:-40px}
@keyframes lunge{40%{transform:translateX(var(--lx)) scale(1.12)}}
.fighter.down .char{animation:none;transform:rotate(var(--dr,-80deg)) translateY(30%);opacity:.8;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.fighter.p2.down{--dr:80deg}

/* ---------- FX ---------- */
.fx{position:absolute;pointer-events:none;z-index:5;transform:translate(-50%,-50%);display:grid;place-items:center;
  filter:drop-shadow(4px 4px 0 var(--ink));animation:pop .95s cubic-bezier(.2,1.4,.4,1) forwards}
.fx .burst{position:absolute;width:var(--bs,190px);aspect-ratio:1;background:#fff;
  clip-path:polygon(50% 0,58% 30%,82% 8%,70% 37%,100% 30%,75% 52%,98% 72%,68% 66%,72% 96%,52% 72%,32% 100%,34% 68%,4% 80%,26% 55%,0 34%,31% 38%,18% 10%,42% 29%)}
.fx .word{position:relative;font-family:var(--display);font-size:var(--ws,54px);line-height:.9;color:var(--gold);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--red);transform:rotate(var(--rot,-8deg));white-space:nowrap}
.fx .kata{position:absolute;bottom:88%;right:-4%;font-family:var(--display);font-size:calc(var(--ws,54px) * .46);color:var(--red);-webkit-text-stroke:0;text-shadow:2px 2px 0 var(--ink);transform:rotate(12deg)}
.fx .dmg{position:absolute;top:calc(50% + var(--ws,54px) * .75);font-family:var(--mono);font-size:26px;color:var(--red);background:var(--ink);padding:0 8px;white-space:nowrap}
.fx .dmg small{color:var(--paper);font-size:.6em;margin-left:6px;opacity:.8}
.fx .crit{position:absolute;bottom:calc(50% + var(--ws,54px) * .6);font-family:var(--display);font-size:18px;background:var(--red);color:#fff;padding:2px 10px;transform:rotate(-4deg);white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}18%{transform:translate(-50%,-50%) scale(1.12)}
  30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-62%) scale(1);opacity:0}}
.hand{position:absolute;z-index:4;pointer-events:none;font-size:clamp(60px,14vmin,120px);line-height:1;transform:translate(-50%,-50%)}
.hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  font-family:var(--display);font-size:clamp(16px,3.4vw,24px);background:var(--paper);border:3px solid var(--ink);padding:6px 14px;
  box-shadow:4px 4px 0 var(--ink);white-space:nowrap;animation:hintIn 1.3s ease forwards}
@keyframes hintIn{0%{opacity:0;transform:translate(-50%,-30%)}12%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}

/* ---------- banner ---------- */
.banner{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 4px);z-index:3;transform:translateX(-50%) rotate(-2deg);
  background:var(--ink);color:var(--paper);font-family:var(--display);font-size:clamp(16px,3.6vw,26px);
  padding:10px 22px;white-space:nowrap;box-shadow:5px 5px 0 var(--red);text-align:center;pointer-events:none;transition:box-shadow .2s}
.banner.p2{box-shadow:5px 5px 0 var(--p2)}
.banner .arrow{display:inline-block;animation:nudge .5s ease-in-out infinite alternate}
.banner.p2 .arrow{animation-name:nudgeL}
@keyframes nudge{to{transform:translateX(8px)}} @keyframes nudgeL{to{transform:translateX(-8px)}}
.banner .sub{display:block;font-family:var(--mono);font-size:.55em;opacity:.8;margin-top:3px}
.banner .sub[hidden]{display:none}

/* ---------- overlays ---------- */
.over{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
  background:rgba(245,236,217,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.over[hidden]{display:none}
.card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px}
.title{font-family:var(--display);font-size:clamp(46px,13vw,110px);line-height:.88;color:var(--gold);letter-spacing:-.01em;
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--red);transform:rotate(-4deg)}
.jp{font-family:var(--display);color:var(--red);font-size:clamp(16px,3.6vw,24px);letter-spacing:.3em;margin-top:-4px}
.lede{font-size:clamp(15px,3.4vw,19px);max-width:30ch;line-height:1.35}
.lede b{font-family:var(--display);font-weight:400}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
.btn{font:inherit;font-family:var(--display);font-size:clamp(16px,3.6vw,21px);color:var(--ink);background:#fff;
  border:3px solid var(--ink);padding:12px 20px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn.main{background:var(--gold)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--p2);outline-offset:3px}
.btn small{display:block;font-family:var(--mono);font-size:.62em;opacity:.7;margin-top:2px}
.ko{font-family:var(--display);font-size:clamp(70px,20vw,170px);line-height:.85;color:var(--red);
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(3) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.ko + .winner{font-size:clamp(70px,16vmin,130px);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;font-size:clamp(13px,3vw,16px)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:1.5em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .char,.fighter::before,.banner .arrow{animation:none!important}
  .fx{animation-duration:.01s;animation-delay:.9s}
}
</style>
</head>
<body>
<div id="game">
  <div class="hud">
    <div class="side l">
      <div class="bar" aria-hidden="true"><div class="ghost" id="ghost1"></div><div class="fill" id="fill1"></div></div>
      <div class="name"><span id="n1">Sakura</span><span class="hp" id="hp1">100</span></div>
    </div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="side r">
      <div class="bar" aria-hidden="true"><div class="ghost" id="ghost2"></div><div class="fill" id="fill2"></div></div>
      <div class="name"><span id="n2">Yuki</span><span class="hp" id="hp2">100</span><span class="tag" id="cpuTag" hidden>CPU</span></div>
    </div>
  </div>

  <div class="arena" id="arena" aria-label="Arena: swipe toward your opponent to slap">
    <div class="fighter p1 turn" id="f1"><div class="char" id="c1">🧚‍♀️</div></div>
    <div class="fighter p2 wait" id="f2"><div class="char" id="c2">👸</div></div>
  </div>

  <div class="banner" id="banner" aria-hidden="true"><span id="bannerText">SAKURA · SWIPE <span class="arrow">→</span></span><span class="sub" id="bannerSub">faster flick = harder slap</span></div>

  <div class="over" id="startOver">
    <div class="card">
      <h1 class="title">SLAP<br>BATTLE</h1>
      <div class="jp" aria-hidden="true">平手打ち</div>
      <p class="lede">Swipe toward your rival. <b>The faster the flick, the harder the slap.</b></p>
      <div class="btns">
        <button class="btn main" id="play1">1 Player<small>Sakura vs Yuki</small></button>
        <button class="btn" id="play2">2 Players<small>one screen, take turns</small></button>
      </div>
    </div>
  </div>

  <div class="over" id="endOver" hidden>
    <div class="card">
      <div class="ko" aria-hidden="true">K.O.!</div>
      <div class="winner" id="winChar" aria-hidden="true"></div>
      <h2 class="lede" id="winText"></h2>
      <div class="stats" id="stats"></div>
      <div class="btns">
        <button class="btn main" id="again">Rematch</button>
        <button class="btn" id="menu">Change mode</button>
      </div>
    </div>
  </div>

  <div class="sr" id="sr" aria-live="polite"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const game = $('game'), arena = $('arena');
  const F = [null, { el: $('f1'), c: $('c1'), fill: $('fill1'), ghost: $('ghost1'), hp: $('hp1'), name: 'Sakura', emoji: '🧚‍♀️' },
                   { el: $('f2'), c: $('c2'), fill: $('fill2'), ghost: $('ghost2'), hp: $('hp2'), name: 'Yuki',   emoji: '👸' }];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = { mode: 1, turn: 1, live: false, lock: false, hp: [0, 100, 100], max: [0, 100, 100],
              speeds: [null, [], []], best: [0, 0, 0], slaps: [0, 0, 0], crits: [0, 0, 0] };
  window.__slap = { S, F };

  // ---------- sound ----------
  let ac = null, noiseBuf = null;
  function audio() {
    if (ac) return ac;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    } catch (e) { ac = null; }
    return ac;
  }
  function slapSound(p) { // p: 0..1 strength
    if (!ac) return;
    const t = ac.currentTime;
    const n = ac.createBufferSource(); n.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400 + p * 1800; bp.Q.value = 0.7;
    const g = ac.createGain(); g.gain.setValueAtTime(0.35 + p * 0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    n.connect(bp).connect(g).connect(ac.destination); n.start(t);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
    const og = ac.createGain(); og.gain.setValueAtTime(0.2 + p * 0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 0.2);
  }
  function bell() {
    if (!ac) return;
    const t = ac.currentTime;
    [880, 1318].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.12); g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.12 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.9);
      o.connect(g).connect(ac.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 1);
    });
  }

  // ---------- HUD ----------
  function drawHp(p) {
    const pct = Math.max(0, S.hp[p] / S.max[p] * 100);
    F[p].fill.style.width = pct + '%';
    F[p].ghost.style.width = pct + '%';
    F[p].hp.textContent = Math.ceil(S.hp[p]);
    F[p].fill.classList.toggle('low', pct <= 50 && pct > 25);
    F[p].fill.classList.toggle('crit', pct <= 25);
  }
  function isCpu(p) { return S.mode === 1 && p === 2; }
  function setTurn(p) {
    S.turn = p;
    [1, 2].forEach(i => { F[i].el.classList.toggle('turn', i === p); F[i].el.classList.toggle('wait', i !== p); });
    const b = $('banner');
    b.classList.toggle('p2', p === 2);
    $('bannerText').innerHTML = isCpu(p) ? 'YUKI WINDS UP…'
      : p === 1 ? 'SAKURA · SWIPE <span class="arrow">→</span>' : '<span class="arrow">←</span> SWIPE · YUKI';
    $('bannerSub').hidden = S.slaps[1] + S.slaps[2] >= 2;
    if (isCpu(p)) cpuTurn();
  }
  function say(t) { $('sr').textContent = t; }

  // ---------- swipe input (pointer events: touch, pen and mouse) ----------
  let tr = null;
  arena.addEventListener('pointerdown', e => {
    audio();
    if (!S.live || S.lock || isCpu(S.turn)) return;
    tr = { id: e.pointerId, pts: [[e.clientX, e.clientY, e.timeStamp]] };
    try { arena.setPointerCapture(e.pointerId); } catch (_) {}
  });
  arena.addEventListener('pointermove', e => {
    if (!tr || e.pointerId !== tr.id) return;
    const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (ev.length ? ev : [e]).forEach(c => tr.pts.push([c.clientX, c.clientY, c.timeStamp || e.timeStamp]));
    if (tr.pts.length > 400) tr.pts.splice(1, 100);
  });
  arena.addEventListener('pointerup', e => {
    if (!tr || e.pointerId !== tr.id) return;
    tr.pts.push([e.clientX, e.clientY, e.timeStamp]);
    const pts = tr.pts; tr = null;
    judge(pts);
  });
  arena.addEventListener('pointercancel', () => { tr = null; });

  // peak horizontal speed (px/s) over any ~40-90 ms stretch of the stroke, so a pause before the flick costs nothing
  function peakSpeed(pts, dir) {
    let best = 0;
    for (let i = 1; i < pts.length; i++) {
      for (let j = i - 1; j >= 0; j--) {
        const dt = pts[i][2] - pts[j][2];
        if (dt > 90) break;
        if (dt < 40) continue;
        const v = (pts[i][0] - pts[j][0]) * dir / (dt / 1000);
        if (v > best) best = v;
      }
    }
    if (!best && pts.length > 1) { // stroke shorter than 40 ms: use the whole thing
      const a = pts[0], z = pts[pts.length - 1], dt = Math.max(16, z[2] - a[2]);
      best = Math.max(0, (z[0] - a[0]) * dir / (dt / 1000));
    }
    return best;
  }

  function judge(pts) {
    const a = pts[0], z = pts[pts.length - 1];
    const dx = z[0] - a[0], dy = z[1] - a[1];
    const need = S.turn === 1 ? 1 : -1;
    if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return hint(S.turn === 1 ? 'swipe → toward Yuki' : 'swipe ← toward Sakura');
    if (Math.abs(dx) < Math.abs(dy) * 0.7) return hint('sideways! ' + (need > 0 ? '→' : '←'));
    if (Math.sign(dx) !== need) return hint(need > 0 ? 'other way →' : '← other way');
    slap(S.turn, peakSpeed(pts, need));
  }

  function hint(t) {
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = t;
    arena.appendChild(h); setTimeout(() => h.remove(), 1300);
  }

  // ---------- the slap ----------
  const WORDS = [['pat.', 'ペチ'], ['SLAP!', 'バシッ'], ['SMACK!!', 'ビシッ'], ['KA-POW!!!', 'ドカッ']];
  function avg(p) { const s = S.speeds[p]; return s.length ? s.reduce((x, y) => x + y, 0) / s.length : 0; }

  function slap(p, speed) {
    const q = 3 - p;
    const mine = avg(p);
    // critical = you out-slapped your own usual by 35%+ (fair on any device); the CPU just gets lucky sometimes
    const crit = isCpu(p) ? Math.random() < 0.1 : (S.speeds[p].length >= 2 && speed > mine * 1.35);
    S.speeds[p].push(speed);
    let dmg = speed / 340;
    dmg *= 0.85 + Math.random() * 0.3;
    if (crit) dmg *= 1.5;
    dmg = Math.max(2, Math.round(dmg));
    S.slaps[p]++; if (crit) S.crits[p]++;
    S.best[p] = Math.max(S.best[p], dmg);
    S.hp[q] = Math.max(0, S.hp[q] - dmg);
    S.lock = true;

    const tier = dmg < 5 ? 0 : dmg < 9 ? 1 : dmg < 14 ? 2 : 3;
    const pow = Math.min(1, dmg / 18);
    flyHand(p, () => {
      slapSound(pow);
      drawHp(q);
      F[q].el.classList.remove('hit'); void F[q].el.offsetWidth; F[q].el.classList.add('hit');
      setTimeout(() => F[q].el.classList.remove('hit'), 520);
      boom(q, tier, dmg, speed, crit);
      shake(4 + dmg * 1.1);
      say(`${F[p].name} slaps ${F[q].name} for ${dmg}${crit ? ', critical' : ''}. ${F[q].name} has ${S.hp[q]} left.`);
      if (S.hp[q] <= 0) return ko(p);
      setTimeout(() => { S.lock = false; setTurn(q); }, 650);
    });
    F[p].el.classList.remove('lunge'); void F[p].el.offsetWidth; F[p].el.classList.add('lunge');
    setTimeout(() => F[p].el.classList.remove('lunge'), 340);
  }

  function center(el) {
    const r = el.getBoundingClientRect(), g = arena.getBoundingClientRect();
    return [r.left + r.width / 2 - g.left, r.top + r.height / 2 - g.top];
  }
  function flyHand(p, done) {
    const [x0, y0] = center(F[p].c), [x1, y1] = center(F[3 - p].c);
    const h = document.createElement('div'); h.className = 'hand'; h.textContent = p === 1 ? '🫲' : '🫱';
    h.style.left = x0 + 'px'; h.style.top = y0 + 'px';
    arena.appendChild(h);
    const dur = reduced ? 1 : 170;
    const anim = h.animate([
      { transform: 'translate(-50%,-50%) scale(.7) rotate(0deg)', opacity: .4 },
      { transform: `translate(calc(-50% + ${x1 - x0}px), calc(-50% + ${y1 - y0}px)) scale(1.25) rotate(${p === 1 ? 25 : -25}deg)`, opacity: 1 }
    ], { duration: dur, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' });
    anim.onfinish = () => { done(); h.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).onfinish = () => h.remove(); };
  }
  function boom(q, tier, dmg, speed, crit) {
    const [cx, cy] = center(F[q].c), cr = F[q].c.getBoundingClientRect();
    const x = cx + (q === 2 ? -0.62 : 0.62) * cr.width, y = cy - 0.22 * cr.height; // on the cheek facing the attacker
    const d = document.createElement('div'); d.className = 'fx';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    const s = 0.7 + tier * 0.22 + (crit ? 0.2 : 0);
    d.style.setProperty('--ws', Math.round(46 * s) + 'px');
    d.style.setProperty('--bs', Math.round(150 * s) + 'px');
    d.style.setProperty('--rot', (Math.random() * 16 - 8).toFixed(1) + 'deg');
    const [w, k] = WORDS[tier];
    d.innerHTML = `<div class="burst"></div><div class="word">${w}<span class="kata">${k}</span></div>` +
      `<div class="dmg">-${dmg}<small>${Math.round(speed)} px/s</small></div>` + (crit ? '<div class="crit">CRITICAL!</div>' : '');
    arena.appendChild(d);
    setTimeout(() => d.remove(), 1000);
  }
  function shake(a) {
    if (reduced) return;
    a = Math.min(a, 24);
    const k = [];
    for (let i = 0; i < 6; i++) { const f = a * (1 - i / 6); k.push({ transform: `translate(${(Math.random() * 2 - 1) * f}px,${(Math.random() * 2 - 1) * f}px)` }); }
    k.push({ transform: 'translate(0,0)' });
    game.animate(k, { duration: 320, easing: 'ease-out' });
  }

  // ---------- CPU Yuki: matches your energy, a little softer on average ----------
  let cpuTimer = 0;
  function cpuTurn() {
    clearTimeout(cpuTimer);
    cpuTimer = setTimeout(() => {
      if (!S.live || S.turn !== 2 || S.mode !== 1) return;
      const yours = avg(1) || 2300;
      const speed = Math.max(900, Math.min(7000, yours * (0.72 + Math.random() * 0.4)));
      slap(2, speed);
    }, 750 + Math.random() * 700);
  }

  // ---------- K.O. ----------
  function ko(w) {
    const l = 3 - w;
    S.live = false;
    F[l].el.classList.remove('turn', 'wait'); F[l].el.classList.add('down');
    F[w].el.classList.remove('wait'); F[w].el.classList.add('turn');
    $('banner').hidden = true;
    bell();
    setTimeout(() => {
      $('winChar').textContent = F[w].emoji;
      const cpuWon = isCpu(w);
      $('winText').textContent = S.mode === 1 ? (cpuWon ? 'Yuki wins. Flick faster next time!' : 'You beat Yuki!') : `${F[w].name} wins!`;
      const st = [['slaps', S.slaps[w]], ['hardest', S.best[w]], ['criticals', S.crits[w]]];
      if (S.mode === 1) { st[0] = ['your slaps', S.slaps[1]]; st[1] = ['your hardest', S.best[1]]; st[2] = ['your criticals', S.crits[1]]; }
      $('stats').innerHTML = st.map(([k, v]) => `<div><b>${v}</b>${k}</div>`).join('');
      $('endOver').hidden = false;
      $('again').focus();
      say($('winText').textContent);
    }, 1300);
  }

  // ---------- flow ----------
  function start(mode) {
    audio();
    S.mode = mode;
    S.max = [0, 100, mode === 1 ? 100 : 120]; // in 2P Yuki gets extra health because Sakura always swings first
    S.hp = S.max.slice();
    S.speeds = [null, [], []]; S.best = [0, 0, 0]; S.slaps = [0, 0, 0]; S.crits = [0, 0, 0];
    S.live = true; S.lock = false;
    clearTimeout(cpuTimer);
    $('cpuTag').hidden = mode !== 1;
    [1, 2].forEach(p => { F[p].el.classList.remove('down', 'hit', 'lunge'); drawHp(p); });
    arena.querySelectorAll('.fx,.hand,.hint').forEach(n => n.remove());
    $('startOver').hidden = true; $('endOver').hidden = true; $('banner').hidden = false;
    setTurn(1);
    say(mode === 1 ? 'Sakura versus Yuki. Your turn: swipe right, fast.' : 'Two players. Sakura first: swipe right.');
  }
  $('play1').onclick = () => start(1);
  $('play2').onclick = () => start(2);
  $('again').onclick = () => start(S.mode);
  $('menu').onclick = () => { $('endOver').hidden = true; $('startOver').hidden = false; $('play1').focus(); };
  [1, 2].forEach(drawHp);
  $('play1').focus({ preventScroll: true });
})();
</script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
