<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corgi Machine — fetch a corgi, survive the husky</title>
<meta name="description" content="Press the button, get a fresh corgi. But first: the husky at the front desk has opinions about you.">
<link rel="icon" href="https://emojicdn.elk.sh/🐕">
<meta property="og:title" content="Corgi Machine">
<meta property="og:description" content="Press the button, get a fresh corgi. But first the front-desk husky roasts you.">
<meta property="og:url" content="https://sloppy.live/corgi-machine/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/adorable%20corgi%20in%20a%20tiny%20crown%20sitting%20at%20a%20dog%20show%20podium%2C%20red%20rosette%20ribbons%2C%20warm%20cream%20background%2C%20a%20smug%20husky%20judge%20watching%2C%20soft%20studio%20light?width=1200&height=630&nologo=true&seed=1101&model=flux&format=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ranchers&family=Short+Stack&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7ecd9; --card:#fffaf1; --ink:#3a2c1e; --red:#c8402e; --gold:#d99a2b;
  --husky:#5f6f83; --edge:#e2cfae; --sky:#bcd8e8;
}
html{ font-size:100%; }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; color:var(--ink); font-family:'Short Stack', cursive;
  background:
    radial-gradient(40rem 20rem at 85% -5%, rgba(188,216,232,.5), transparent 60%),
    radial-gradient(34rem 18rem at 5% 105%, rgba(217,154,43,.18), transparent 60%),
    var(--cream);
}
main{ max-width:46rem; margin:0 auto; padding:1.2rem 1rem 3rem; }
header{ text-align:center; }
h1{
  font-family:'Ranchers', cursive; font-weight:400; font-size:clamp(2.2rem,7vw,3.6rem);
  color:var(--red); letter-spacing:.02em;
  text-shadow:0 2px 0 #fff, 0 4px 0 rgba(200,64,46,.25);
}
.tag{ font-size:.9rem; color:#7a6a52; }
/* husky desk */
.desk{
  display:flex; gap:.9rem; align-items:flex-start; margin:1.1rem 0 .9rem;
  background:var(--card); border:2px solid var(--edge); border-radius:1.1rem; padding:.9rem 1rem;
  box-shadow:0 4px 0 rgba(160,120,60,.15);
}
.husky{ flex:0 0 4.6rem; }
.husky svg{ width:4.6rem; height:4.6rem; display:block; }
.husky .plate{ font-size:.6rem; text-align:center; color:#7a6a52; margin-top:.2rem; letter-spacing:.06em; }
.bubble{
  position:relative; flex:1; background:#fff; border:2px solid var(--edge); border-radius:.9rem;
  padding:.6rem .8rem; font-size:.95rem; line-height:1.45; min-height:3.4rem;
}
.bubble::before{
  content:""; position:absolute; left:-.65rem; top:1.1rem; border:.55rem solid transparent;
  border-right-color:var(--edge);
}
.bubble.snark{ animation:snarkpop .3s ease; }
@keyframes snarkpop{ 40%{ transform:scale(1.03) rotate(-.5deg); } }
/* the machine */
.machine{ text-align:center; }
button.fetchbtn{
  font-family:'Ranchers', cursive; font-size:1.4rem; letter-spacing:.03em;
  background:var(--red); color:#fff7ee; border:none; border-radius:1rem;
  padding:.8rem 1.6rem; min-height:3.2rem; cursor:pointer;
  box-shadow:0 5px 0 #8a2a1c; transition:transform .08s;
}
button.fetchbtn:hover{ transform:translateY(-2px); }
button.fetchbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #8a2a1c; }
button.fetchbtn:disabled{ opacity:.6; cursor:wait; }
:focus-visible{ outline:3px solid var(--husky); outline-offset:3px; }
.frame{
  margin:1rem auto 0; max-width:32rem; background:var(--card); border:2px solid var(--edge);
  border-radius:1.2rem; padding:.9rem; box-shadow:0 6px 0 rgba(160,120,60,.15);
}
.portrait{
  position:relative; width:100%; aspect-ratio:1/1; border-radius:.8rem; overflow:hidden;
  background:repeating-linear-gradient(45deg, #f1e4cb 0 12px, #ede0c4 12px 24px);
  display:flex; align-items:center; justify-content:center;
}
.portrait img{ width:100%; height:100%; object-fit:cover; display:block; }
.portrait .wait{
  position:absolute; inset:0; display:flex; flex-direction:column; gap:.5rem;
  align-items:center; justify-content:center; text-align:center; padding:1rem;
  background:rgba(247,236,217,.92); font-size:.95rem;
}
.portrait .wait .paw{ font-size:2.4rem; animation:pace 1.2s ease-in-out infinite alternate; }
@keyframes pace{ from{ transform:translateX(-1.2rem) rotate(-8deg);} to{ transform:translateX(1.2rem) rotate(8deg);} }
.portrait .wait[hidden]{ display:none; }
.caption{ margin-top:.6rem; font-size:.95rem; }
.caption b{ font-family:'Ranchers', cursive; font-weight:400; color:var(--red); font-size:1.15rem; }
.caption .deets{ color:#7a6a52; font-size:.8rem; }
/* ribbon gallery */
.gallery{ display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
.gallery img{
  width:4.2rem; height:4.2rem; object-fit:cover; border-radius:.6rem; border:2px solid var(--edge);
  cursor:pointer; transition:transform .1s;
}
.gallery img:hover{ transform:scale(1.08) rotate(-2deg); border-color:var(--gold); }
footer{ text-align:center; margin-top:1.4rem; color:#7a6a52; font-size:.8rem; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (prefers-reduced-motion: reduce){
  .portrait .wait .paw{ animation:none; }
  .bubble.snark{ animation:none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>CORGI MACHINE</h1>
    <p class="tag">unlimited corgis · one (1) judgmental husky between you and them</p>
  </header>

  <section class="desk" aria-label="Front desk husky">
    <div class="husky" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path d="M18 30 L30 8 L42 26 Z" fill="#5f6f83"/><path d="M82 30 L70 8 L58 26 Z" fill="#5f6f83"/>
        <path d="M22 28 L30 14 L38 27 Z" fill="#8fa0b5"/><path d="M78 28 L70 14 L62 27 Z" fill="#8fa0b5"/>
        <ellipse cx="50" cy="55" rx="34" ry="32" fill="#5f6f83"/>
        <path d="M50 26 C30 26 20 44 22 60 C30 50 40 46 50 46 C60 46 70 50 78 60 C80 44 70 26 50 26 Z" fill="#5f6f83"/>
        <ellipse cx="50" cy="62" rx="24" ry="22" fill="#f2f5f8"/>
        <circle cx="38" cy="50" r="5.5" fill="#fff"/><circle cx="62" cy="50" r="5.5" fill="#fff"/>
        <circle cx="38.5" cy="50.5" r="3" fill="#57b0e0"/><circle cx="61.5" cy="50.5" r="3" fill="#57b0e0"/>
        <circle cx="39.3" cy="49.5" r="1" fill="#123"/><circle cx="60.7" cy="49.5" r="1" fill="#123"/>
        <path d="M33 42 L44 45" stroke="#4a5a6e" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M67 42 L56 45" stroke="#4a5a6e" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="50" cy="63" rx="5" ry="4" fill="#2b3542"/>
        <path d="M50 67 Q50 72 44 73 M50 67 Q50 72 56 73" stroke="#2b3542" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="plate">BLIZZARD · QA DEPT.</div>
    </div>
    <div class="bubble" id="bubble" role="status" aria-live="polite">the corgis are in the back. talk to me first.</div>
  </section>

  <div class="machine">
    <button type="button" class="fetchbtn" id="fetchBtn">FETCH ME A CORGI</button>
  </div>

  <div class="frame">
    <div class="portrait">
      <img id="corgiImg" alt="" hidden>
      <div class="wait" id="wait" hidden>
        <span class="paw" aria-hidden="true">🐾</span>
        <span id="waitTxt">warming up the corgi chamber…</span>
      </div>
      <div id="empty" aria-hidden="true" style="font-size:3.2rem">🐕</div>
    </div>
    <div class="caption" id="caption" hidden>
      <b id="corgiName"></b><br>
      <span class="deets" id="corgiDeets"></span>
    </div>
  </div>

  <div class="gallery" id="gallery" aria-label="This session's corgis"></div>

  <footer>corgis rendered by pollinations.ai · the husky's opinions are his own</footer>
  <p class="sr-only" role="status" aria-live="polite" id="sr"></p>
</main>

<script>
'use strict';
/* ═══════════ PURE ═══════════ */
var ROASTS=[
  "oh look who's back. the corgi budget is not infinite, you know.",
  "you again? blink twice if the corgis are holding you hostage.",
  "fetching. unlike you, I actually work out.",
  "a corgi? bold choice for someone with your posture.",
  "you have the click-per-minute rate of a sleepy goldfish. fine, one corgi.",
  "I graduated top of my sled team and THIS is my job now. one corgi, coming up.",
  "the last user said 'please'. just saying.",
  "your search history is 90% dog pictures. I respect it. I also judge it.",
  "fine. but this counts as your cardio for today.",
  "one corgi for the person who definitely has unread emails. coming up.",
  "you want short legs and big ears? at least you know your type.",
  "I could fetch you a corgi, or you could fetch some self-awareness. corgi it is.",
  "processing… much like your life decisions, this may take a moment.",
  "the corgi will love you unconditionally. someone has to.",
  "you pressed the button like it owes you money. relax. corgi incoming.",
  "another corgi enjoyer who thinks huskies are 'too much'. I heard that.",
  "your enthusiasm is adorable. misplaced, but adorable.",
  "I hope this corgi appreciates that I skipped my nap for this.",
  "you know these corgis aren't real, right? …neither is your gym membership.",
  "certified fresh corgi for a certifiably chaotic human. hold.",
  "the committee (me) has reviewed your request. verdict: whatever. corgi granted.",
  "may your corgi be fluffier than your excuses.",
  "loading corgi. do NOT press the button again. I know you were about to.",
  "you're lucky the corgis like you, because my professional opinion is unprintable.",
  "somewhere a wolf ancestor weeps at what I do for a living. one corgi.",
  "I'd roast you harder but corporate said be nice to repeat customers.",
  "big day for you huh. clicking buttons. living the dream.",
  "the corgi is doing its hair. unlike some of us it cares about presentation.",
  "your aura says 'needs a nap'. the corgi agrees. fetching anyway.",
  "this is my 4,000th corgi today. my sled dreams are dead. enjoy.",
];
var WAITS=[
  "the corgi is doing its makeup…","pollinating pixels…","brushing the floof to regulation standard…",
  "the corgi is negotiating its appearance fee…","rendering ears. this takes time. they're enormous…",
  "first-time corgis take a minute — the oven is cold…","teaching the corgi to sit still…",
  "quality inspection in progress. I have standards…"
];
var POSES=['sitting proudly','mid-zoomies action shot','loafing like fresh bread','head tilt of maximum confusion','sploot on cool tiles','standing on hind legs begging'];
var OUTFITS=['wearing a tiny crown','in a knitted sweater','with a bandana','in a raincoat and little boots','with a bow tie','wearing round glasses'];
var SCENES=['in a sunlit meadow','at a cozy coffee shop','on a beach at golden hour','in an autumn leaf pile','in a flower garden','at a birthday party with balloons'];
var NAME_A=['Sir','Lady','Captain','Professor','Baron','Duchess','Agent','Doctor'];
var NAME_B=['Biscuit','Waffles','Stumpy','Peanut','Loaf','Nugget','Pancake','Crumpet','Mochi','Butterbean'];
var NAME_C=['the Third','of the Low Lands','Von Floof','the Unbothered','MD','Esq.','the Snacc','of Zoomington'];
function pick(arr, r){ return arr[Math.floor(r*arr.length)%arr.length]; }
function comboFor(r1,r2,r3){
  var pi=Math.floor(r1*POSES.length)%POSES.length;
  var oi=Math.floor(r2*OUTFITS.length)%OUTFITS.length;
  var si=Math.floor(r3*SCENES.length)%SCENES.length;
  return { pose:POSES[pi], outfit:OUTFITS[oi], scene:SCENES[si], seed:1000+pi*100+oi*10+si };
}
function corgiUrl(c){
  var prompt='adorable pembroke welsh corgi dog, '+c.pose+', '+c.outfit+', '+c.scene+', warm soft light, high quality photo';
  return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)
    +'?width=768&height=768&seed='+c.seed+'&nologo=true&model=flux';
}
function corgiName(r1,r2,r3){
  return pick(NAME_A,r1)+' '+pick(NAME_B,r2)+' '+pick(NAME_C,r3);
}
/* ═══════════ WIRE ═══════════ */
var els={
  bubble:document.getElementById('bubble'), btn:document.getElementById('fetchBtn'),
  img:document.getElementById('corgiImg'), wait:document.getElementById('wait'),
  waitTxt:document.getElementById('waitTxt'), empty:document.getElementById('empty'),
  caption:document.getElementById('caption'), name:document.getElementById('corgiName'),
  deets:document.getElementById('corgiDeets'), gallery:document.getElementById('gallery'),
  sr:document.getElementById('sr')
};
var lastRoast=-1, waitTimer=null, fetchToken=0;
function speak(text){
  els.bubble.textContent=text;
  els.bubble.classList.remove('snark'); void els.bubble.offsetWidth; els.bubble.classList.add('snark');
}
function roast(){
  var i;
  do{ i=Math.floor(Math.random()*ROASTS.length); }while(i===lastRoast && ROASTS.length>1);
  lastRoast=i;
  speak(ROASTS[i]);
}
function startWaitQuips(){
  var wi=Math.floor(Math.random()*WAITS.length);
  els.waitTxt.textContent=WAITS[wi];
  clearInterval(waitTimer);
  waitTimer=setInterval(function(){
    wi=(wi+1)%WAITS.length;
    els.waitTxt.textContent=WAITS[wi];
  }, 6000);
}
function fetchCorgi(){
  var token=++fetchToken;
  roast();
  var c=comboFor(Math.random(),Math.random(),Math.random());
  var name=corgiName(Math.random(),Math.random(),Math.random());
  var url=corgiUrl(c);
  els.btn.disabled=true;
  els.empty.hidden=true;
  els.wait.hidden=false;
  startWaitQuips();
  els.sr.textContent='Fetching a corgi: '+name;
  var img=new Image();
  var done=false;
  var giveUp=setTimeout(function(){
    if(done || token!==fetchToken) return;
    done=true;
    clearInterval(waitTimer);
    els.wait.hidden=true;
    els.empty.hidden=false;
    els.btn.disabled=false;
    speak("the corgi chamber jammed. not my fault. press it again, gently this time.");
  }, 95000);
  img.onload=function(){
    if(done || token!==fetchToken) return;
    done=true; clearTimeout(giveUp); clearInterval(waitTimer);
    els.img.src=url;
    els.img.alt='AI-generated corgi: '+c.pose+', '+c.outfit+', '+c.scene;
    els.img.hidden=false;
    els.wait.hidden=true;
    els.caption.hidden=false;
    els.name.textContent=name;
    els.deets.textContent=c.pose+' · '+c.outfit+' · '+c.scene;
    els.btn.disabled=false;
    els.btn.textContent='FETCH ANOTHER';
    els.sr.textContent='Corgi arrived: '+name;
    speak(pick([
      "ugh. fine. it IS pretty cute.",
      "here. don't get fur on the upholstery.",
      "delivered. tip jar's empty as usual.",
      "behold: "+name+". I did all the work.",
      "acceptable floof levels achieved. you're welcome."
    ], Math.random()));
    var th=document.createElement('img');
    th.src=url; th.alt='';
    th.title=name;
    th.addEventListener('click', function(){
      els.img.src=url;
      els.img.hidden=false;
      els.name.textContent=name;
      els.deets.textContent=c.pose+' · '+c.outfit+' · '+c.scene;
      els.caption.hidden=false;
    });
    els.gallery.prepend(th);
    while(els.gallery.children.length>10) els.gallery.lastChild.remove();
  };
  img.onerror=function(){
    if(done || token!==fetchToken) return;
    done=true; clearTimeout(giveUp); clearInterval(waitTimer);
    els.wait.hidden=true;
    els.empty.hidden=false;
    els.btn.disabled=false;
    speak("the corgi oven is down. management (also me) apologizes for nothing. try again.");
    els.sr.textContent='The corgi failed to load. Try again.';
  };
  img.src=url;
}
els.btn.addEventListener('click', fetchCorgi);
window.__CORGI={ ROASTS:ROASTS, comboFor:comboFor, corgiUrl:corgiUrl, corgiName:corgiName,
  fetchCorgi:fetchCorgi, roast:roast, speak:speak };
</script>
</body>
</html>
