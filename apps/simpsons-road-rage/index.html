<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Springfield Road Rush</title>
    <meta
      name="description"
      content="Drive the pink sedan through Springfield, grab donuts before your shift ends and dodge the buses."
    />
    <meta property="og:title" content="Springfield Road Rush" />
    <meta
      property="og:description"
      content="Hop in the Pink Sedan, drift past blocky Springfield landmarks, and grab donuts before the timer runs out."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.sloppy.live/simpsons-road-rage/" />
    <meta property="og:image" content="https://app.sloppy.live/simpsons-road-rage/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Springfield Road Rush" />
    <meta name="twitter:description" content="Grab donuts before your shift ends. Dodge the buses." />
    <meta name="twitter:image" content="https://app.sloppy.live/simpsons-road-rage/og-image.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fdda42" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --yellow: #ffd90f;
        --pink: #ff6fae;
        --ink: #1d1b33;
        --cream: #fff8e1;
        --display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
        --body: "Fredoka", "Trebuchet MS", sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #8fd3ff; color: var(--ink); font-family: var(--body); }
      canvas { display: block; }

      /* HUD: three small chips, nothing else on screen while driving */
      .hud { position: fixed; top: 14px; left: 14px; display: flex; gap: 8px; z-index: 5; pointer-events: none; }
      .chip { background: var(--cream); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px 1px;
        box-shadow: 0 4px 0 var(--ink); text-align: center; min-width: 72px; }
      .chip .label { display: block; font-size: 0.64rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
      .chip .value { display: inline-block; font-family: var(--display); font-size: 1.55rem; line-height: 1.05; }
      .chip.mute { pointer-events: auto; cursor: pointer; font-size: 1.3rem; min-width: 0; padding: 4px 10px; font-family: inherit; color: var(--ink); }
      .chip.low .value { color: #e0262f; animation: pulse 0.5s ease-in-out infinite alternate; }
      @keyframes pulse { to { transform: scale(1.14); } }

      .toast { position: fixed; top: 86px; left: 50%; z-index: 5; transform: translate(-50%, -6px); opacity: 0;
        font-family: var(--display); font-size: clamp(20px, 4vw, 30px); color: var(--yellow); white-space: nowrap;
        -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
        pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* start / shift-over card */
      .card-wrap { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(ellipse at center, rgba(143, 211, 255, 0.15), rgba(29, 27, 51, 0.5)); }
      .card-wrap[hidden] { display: none; }
      .card { width: min(430px, 100%); max-height: calc(100dvh - 32px); overflow: auto; display: grid; gap: 12px; text-align: center;
        background: var(--cream); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 10px 0 var(--ink); padding: 22px 22px 18px;
        animation: cardIn 0.45s cubic-bezier(0.2, 1.4, 0.4, 1); }
      @keyframes cardIn { from { transform: translateY(30px) scale(0.92); opacity: 0; } }
      .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 8vw, 50px); line-height: 0.95;
        color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); transform: rotate(-2deg); }
      .card p { margin: 0; line-height: 1.4; }
      .keys { font-size: 0.88rem; opacity: 0.7; }
      .big { font-family: var(--display); font-size: 1.5rem; color: #fff; background: var(--pink); -webkit-text-stroke: 1px var(--ink);
        border: 3px solid var(--ink); border-radius: 14px; padding: 10px 18px 5px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
      .big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
      button:focus-visible, input:focus-visible { outline: 3px solid #2a7fff; outline-offset: 3px; }
      .board { text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
      .board h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 1.1rem; letter-spacing: 0.04em; }
      .leaderboard-list { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: 0.95rem; margin-top: 4px; }
      .leaderboard-list .rank { opacity: 0.45; }
      .leaderboard-list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .leaderboard-list .score { font-family: var(--display); }
      .save { display: flex; gap: 8px; }
      .save[hidden] { display: none; }
      .save input { flex: 1; min-width: 0; font: inherit; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 10px; }
      .save button { font-family: var(--display); font-size: 1.05rem; border: 3px solid var(--ink); border-radius: 12px; background: var(--yellow); padding: 6px 14px 2px; cursor: pointer; }
      .muted { opacity: 0.65; font-size: 0.86rem; }
      .error { color: #b00020; font-weight: 600; font-size: 0.9rem; }
      .success { color: #056608; font-weight: 600; font-size: 0.9rem; }
      #submitMsg:empty { display: none; }

      /* touch controls */
      .touch-controls { position: fixed; bottom: 18px; right: 20px; display: none; gap: 10px; pointer-events: none; }
      .touch-controls button { width: 58px; height: 58px; border-radius: 16px; border: 3px solid var(--ink); background: var(--cream);
        color: var(--ink); font-size: 1.4rem; font-weight: 600; box-shadow: 0 4px 0 var(--ink); pointer-events: auto; }
      .touch-stick { position: fixed; bottom: 18px; left: 20px; width: 120px; height: 120px; border-radius: 50%;
        border: 3px solid rgba(29, 27, 51, 0.5); background: rgba(255, 248, 225, 0.45); pointer-events: auto; touch-action: none; display: none; }
      .touch-stick::after { content: ""; position: absolute; width: 56px; height: 56px; border-radius: 50%; background: var(--cream);
        border: 3px solid var(--ink); top: 50%; left: 50%; transform: translate(-50%, -50%); }
      @media (hover: none) { .touch-controls, .touch-stick { display: block; } .touch-controls { display: flex; } }
      @media (max-width: 480px) { .chip { min-width: 62px; padding: 3px 8px 0; } .chip .value { font-size: 1.3rem; } .toast { top: 76px; } }
      @media (prefers-reduced-motion: reduce) { .card, .chip.low .value { animation: none; } }
    </style>
  </head>
  <body>
    <div class="hud" id="hud">
      <div class="chip" id="timeChip"><span class="label">Shift</span><span class="value" id="timer">75</span></div>
      <div class="chip"><span class="label">Donuts</span><span class="value" id="donuts">0</span></div>
      <div class="chip"><span class="label">Speed</span><span class="value" id="speed">0</span></div>
      <button class="chip mute" id="muteBtn" aria-pressed="false" aria-label="Sound on (M to mute)" title="Sound (M)">🔊</button>
    </div>
    <div class="toast" id="message" role="status" aria-live="polite"></div>

    <div class="touch-stick" id="touchStick" aria-hidden="true"></div>
    <div class="touch-controls" id="touchButtons">
      <button id="boostBtn" aria-label="Turbo">▲</button>
      <button id="brakeBtn" aria-label="Brake">⭕</button>
      <button id="resetBtn" aria-label="Back to the start">⟳</button>
    </div>

    <div class="card-wrap" id="cardWrap">
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
        <h1 id="cardTitle">Springfield Road Rush</h1>
        <p id="cardLede">Grab donuts before your shift ends. Every donut buys two more seconds. Buses hurt.</p>
        <p class="keys" id="keysHint">WASD or arrows to drive · Space for turbo · brake while turning to drift</p>
        <form class="save" id="submitCard" hidden>
          <input id="playerName" maxlength="24" placeholder="Your name" aria-label="Your name" autocomplete="nickname" />
          <button id="submitScoreBtn" type="submit">Save</button>
        </form>
        <div id="submitMsg" class="muted" aria-live="polite"></div>
        <button class="big" id="startBtn" type="button">Start shift</button>
        <div class="board">
          <h2>Top deliveries</h2>
          <p class="muted" id="lbStatus">Loading…</p>
          <div id="leaderboard" class="leaderboard-list"></div>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
          "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/"
        }
      }
    </script>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      const SUPABASE_URL = 'https://yjyxteqzhhmtrgcaekgz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqeXh0ZXF6aGhtdHJnY2Fla2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczNTg3NDIsImV4cCI6MjA3MjkzNDc0Mn0.G8SRde7IN2QFW1EnASM8IS32IUYR2eenCCjdDdioiBU';
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function ensureSession() {
        const { data: sess } = await supabase.auth.getSession();
        if (!sess?.session) {
          const { error } = await supabase.auth.signInAnonymously();
          if (error) throw new Error(`Auth failed: ${error.message}`);
        }
      }

      const TABLE = 'simpsons_road_rage_scores';
      const DONUT_COUNT = 30;

      async function loadLeaderboard() {
        const lb = document.getElementById('leaderboard');
        const status = document.getElementById('lbStatus');
        status.textContent = 'Loading…';
        lb.innerHTML = '';
        try {
          await ensureSession();
          const { data, error } = await supabase
            .from(TABLE)
            .select('name, score, user_id')
            .order('score', { ascending: false })
            .limit(80);
          if (error) throw error;
          // only 30 donuts exist per shift, so anything above that is not a real run; one line per player
          const seen = new Set();
          const rows = (data || []).filter((r) => r.score > 0 && r.score <= DONUT_COUNT && !seen.has(r.user_id) && seen.add(r.user_id)).slice(0, 8);
          if (!rows.length) {
            status.textContent = 'No deliveries yet. Be the first!';
            return;
          }
          status.textContent = '';
          rows.forEach((row, idx) => {
            [[`${idx + 1}.`, 'rank'], [row.name || 'Anonymous', 'name'], [`${row.score} 🍩`, 'score']].forEach(([t, c]) => {
              const d = document.createElement('div');
              d.className = c;
              d.textContent = t;
              lb.appendChild(d);
            });
          });
        } catch (e) {
          console.error(e);
          status.textContent = 'Could not load the leaderboard right now.';
        }
      }

      async function submitScore(name, score) {
        const msg = document.getElementById('submitMsg');
        msg.className = 'muted';
        msg.textContent = 'Saving…';
        try {
          await ensureSession();
          const { data: { user } } = await supabase.auth.getUser();
          if (!user?.id) throw new Error('No user');
          const cleanName = (name || '').toString().trim().slice(0, 24) || 'Anonymous';
          const { error } = await supabase
            .from(TABLE)
            .insert({ name: cleanName, score: Math.max(0, Math.floor(score)), user_id: user.id });
          if (error) throw error;
          msg.className = 'success';
          msg.textContent = 'Saved! Look for your name below.';
          state.saved = true;
          document.getElementById('submitCard').hidden = true;
          try { localStorage.setItem('srr_name', cleanName); } catch (_) {}
          await loadLeaderboard();
        } catch (e) {
          console.error('Submit failed', e);
          msg.className = 'error';
          msg.textContent = 'Could not save score. Please try again.';
        }
      }
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 80, 220);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
      camera.position.set(0, 12, 18);

      const orbit = new OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.target.set(0, 3, 0);
      orbit.maxDistance = 200;
      orbit.maxPolarAngle = Math.PI / 2.1;
      orbit.enablePan = false;
      orbit.dampingFactor = 0.08;
      orbit.autoRotate = true; // slow fly-around behind the start / shift-over card
      orbit.autoRotateSpeed = 0.7;

      const hemiLight = new THREE.HemisphereLight(0xfff7a6, 0x3a4a6f, 2.1);
      scene.add(hemiLight);

      const sun = new THREE.DirectionalLight(0xfff4dc, 2.6);
      sun.position.set(-80, 120, 60);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.04;
      sun.shadow.camera.left = -120;
      sun.shadow.camera.right = 120;
      sun.shadow.camera.top = 120;
      sun.shadow.camera.bottom = -120;
      scene.add(sun);

      const world = new THREE.Group();
      scene.add(world);

      const textures = createTextures();

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), textures.grass);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      world.add(ground);

      const road = buildRoadNetwork();
      world.add(road);

      const buildings = buildBuildings();
      world.add(buildings);

      const donutsGroup = new THREE.Group();
      world.add(donutsGroup);
      populateDonuts();

      const trafficGroup = new THREE.Group();
      world.add(trafficGroup);
      spawnTraffic();

      const car = buildCar();
      world.add(car.mesh);

      const dustGroup = new THREE.Group();
      world.add(dustGroup);
      const skidGroup = new THREE.Group();
      world.add(skidGroup);

      const clock = new THREE.Clock();
      let elapsed = 0;
      const TOTAL_TIME = 75;

      const keyState = {};
      document.addEventListener("keydown", (e) => (keyState[e.code] = true));
      document.addEventListener("keyup", (e) => (keyState[e.code] = false));

      const touchStick = document.getElementById("touchStick");
      const boostBtn = document.getElementById("boostBtn");
      const brakeBtn = document.getElementById("brakeBtn");
      const resetBtn = document.getElementById("resetBtn");
      setupTouchControls();

      const timerEl = document.getElementById("timer");
      const donutsEl = document.getElementById("donuts");
      const speedEl = document.getElementById("speed");
      const messageEl = document.getElementById("message");
      const submitCard = document.getElementById('submitCard');
      const submitBtn = document.getElementById('submitScoreBtn');
      const nameInput = document.getElementById('playerName');
      submitCard.addEventListener('submit', (e) => {
        e.preventDefault();
        if (state.saved) return;
        submitBtn.disabled = true;
        submitScore(nameInput.value, state.donuts).finally(() => (submitBtn.disabled = false));
      });
      try { nameInput.value = localStorage.getItem('srr_name') || ''; } catch (_) {}

      const cardWrap = document.getElementById('cardWrap');
      const startBtn = document.getElementById('startBtn');
      const timeChip = document.getElementById('timeChip');
      if (matchMedia('(hover: none)').matches) {
        document.getElementById('keysHint').textContent = 'Left pad drives · ▲ turbo · ⭕ brake (brake + turn to drift) · ⟳ back to start';
      }
      let toastTimer = 0;
      function toast(text) {
        messageEl.textContent = text;
        messageEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => messageEl.classList.remove('show'), 1800);
      }

      // ---- sound: engine that follows your speed, donut chomp, bus honk, end-of-shift jingle ----
      const sfx = { ac: null, muted: false, eng: null };
      try { sfx.muted = localStorage.getItem('srr_muted') === '1'; } catch (_) {}
      const muteBtn = document.getElementById('muteBtn');
      function drawMute() {
        muteBtn.textContent = sfx.muted ? '🔇' : '🔊';
        muteBtn.setAttribute('aria-pressed', String(sfx.muted));
        muteBtn.setAttribute('aria-label', sfx.muted ? 'Sound off (M to unmute)' : 'Sound on (M to mute)');
      }
      function toggleMute() {
        sfx.muted = !sfx.muted;
        try { localStorage.setItem('srr_muted', sfx.muted ? '1' : '0'); } catch (_) {}
        if (sfx.ac) sfx.master.gain.setTargetAtTime(sfx.muted ? 0 : 0.8, sfx.ac.currentTime, 0.05);
        drawMute();
      }
      muteBtn.addEventListener('click', toggleMute);
      document.addEventListener('keydown', (e) => { if (e.code === 'KeyM' && e.target !== nameInput) toggleMute(); });
      drawMute();
      function audioOn() {
        if (sfx.ac) { sfx.ac.resume?.(); return; }
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          sfx.ac = ac;
          sfx.master = ac.createGain();
          sfx.master.gain.value = sfx.muted ? 0 : 0.8;
          sfx.master.connect(ac.destination);
          const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
          o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = -1200;
          lp.type = 'lowpass'; lp.frequency.value = 500; lp.Q.value = 3;
          g.gain.value = 0;
          o1.connect(lp); o2.connect(lp); lp.connect(g).connect(sfx.master);
          o1.start(); o2.start();
          sfx.eng = { o1, o2, lp, g };
        } catch (_) { sfx.ac = null; }
      }
      function engineTick(speed, boosting, on) {
        if (!sfx.eng) return;
        const t = sfx.ac.currentTime, e = sfx.eng, f = 38 + speed * 2.1 + (boosting ? 18 : 0);
        e.o1.frequency.setTargetAtTime(f, t, 0.08);
        e.o2.frequency.setTargetAtTime(f, t, 0.08);
        e.lp.frequency.setTargetAtTime(380 + speed * 22 + (boosting ? 500 : 0), t, 0.1);
        e.g.gain.setTargetAtTime(on ? 0.05 + Math.min(speed, 60) / 60 * 0.05 : 0, t, 0.12);
      }
      function blip(freqs, type, len, vol, gap) {
        if (!sfx.ac) return;
        const t0 = sfx.ac.currentTime;
        freqs.forEach((f, i) => {
          const o = sfx.ac.createOscillator(), g = sfx.ac.createGain(), t = t0 + i * gap;
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + len);
          o.connect(g).connect(sfx.master);
          o.start(t); o.stop(t + len + 0.02);
        });
      }
      const chomp = (combo) => blip([660 * Math.pow(1.06, Math.min(combo, 12)), 990 * Math.pow(1.06, Math.min(combo, 12))], 'square', 0.09, 0.12, 0.06);
      function honk() {
        if (!sfx.ac) return;
        const t = sfx.ac.currentTime;
        [311, 392].forEach((f) => {
          const o = sfx.ac.createOscillator(), g = sfx.ac.createGain();
          o.type = 'square'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
          g.gain.setValueAtTime(0.09, t + 0.32); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
          o.connect(g).connect(sfx.master); o.start(t); o.stop(t + 0.42);
        });
        blip([90, 55], 'sine', 0.2, 0.3, 0.05);
      }

      function startShift() {
        audioOn();
        state.donuts = 0;
        state.combo = 0;
        state.bestCombo = 0;
        state.saved = false;
        state.gameOverShown = false;
        elapsed = 0;
        donutsGroup.clear();
        populateDonuts();
        resetCar();
        camera.position.set(0, 8, -13);
        orbit.target.set(0, 2.5, 0);
        orbit.autoRotate = false;
        donutsEl.textContent = '0';
        timeChip.classList.remove('low');
        cardWrap.hidden = true;
        clock.getDelta();
        state.playing = true;
        toast('Go go go! 🍩');
      }
      startBtn.addEventListener('click', startShift);

      function endShift() {
        state.playing = false;
        engineTick(0, false, false);
        blip([784, 659, 523, 392], 'triangle', 0.35, 0.16, 0.16);
        state.gameOverShown = true;
        Object.keys(keyState).forEach((k) => (keyState[k] = false));
        document.getElementById('cardTitle').textContent = 'Shift over!';
        document.getElementById('cardLede').textContent =
          state.donuts > 0 ? `${state.donuts} donut${state.donuts === 1 ? '' : 's'} delivered · best combo ${state.bestCombo}` : 'Not a single donut? Homer would be ashamed.';
        document.getElementById('keysHint').hidden = true;
        document.getElementById('submitMsg').textContent = '';
        submitCard.hidden = state.donuts <= 0;
        startBtn.textContent = 'Drive again';
        cardWrap.hidden = false;
        orbit.autoRotate = true;
        loadLeaderboard();
        (state.donuts > 0 && !nameInput.value ? nameInput : startBtn).focus({ preventScroll: true });
      }

      const state = {
        donuts: 0,
        bestCombo: 0,
        combo: 0,
        timeBonus: 0,
        playing: false,
        saved: false,
        gameOverShown: false,
        skidTimer: 0,
      };

      function buildCar() {
        const group = new THREE.Group();
        group.castShadow = true;

        const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.1, 5), textures.carBodyPink);
        body.position.y = 1.2;
        body.castShadow = true;
        group.add(body);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.9, 2.4), textures.carRoofYellow);
        roof.position.set(0, 1.9, -0.4);
        roof.castShadow = true;
        group.add(roof);

        const bumper = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.6, 0.6), textures.carBumper);
        bumper.position.set(0, 0.8, 2.4);
        group.add(bumper);

        const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 20);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
        const wheelPositions = [
          [-1.4, 0.6, 1.8],
          [1.4, 0.6, 1.8],
          [-1.4, 0.6, -1.8],
          [1.4, 0.6, -1.8],
        ];
        wheelPositions.forEach((pos) => {
          const wheel = new THREE.Mesh(wheelGeo, wheelMat);
          wheel.position.set(...pos);
          wheel.castShadow = true;
          group.add(wheel);
        });

        const carState = {
          mesh: group,
          velocity: new THREE.Vector3(),
          direction: new THREE.Vector3(0, 0, 1),
          speed: 0,
          targetSpeed: 0,
          heading: 0,
        };
        return carState;
      }

      function createTextures() {
        const textures = {};

        textures.grass = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          const shades = ["#7ed957", "#6bc149", "#8ae36c"];
          ctx.fillStyle = "#6fc148";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < 200; i++) {
            ctx.fillStyle = shades[(Math.random() * shades.length) | 0];
            const size = Math.random() * 12 + 4;
            ctx.globalAlpha = 0.25;
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, size, size);
          }
          ctx.globalAlpha = 1;
        });

        textures.road = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          ctx.fillStyle = "#44424a";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#2f2d36";
          ctx.fillRect(0, canvas.height / 2 - 6, canvas.width, 12);
          ctx.strokeStyle = "#f5f5dc";
          ctx.lineWidth = 4;
          for (let x = 0; x < canvas.width; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x + 16, canvas.height / 2);
            ctx.lineTo(x + 48, canvas.height / 2);
            ctx.stroke();
          }
        }, 256, 256);

        textures.sidewalk = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          ctx.fillStyle = "#c9c3c3";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = "#9e9898";
          ctx.lineWidth = 4;
          ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
        }, 128, 128);

        textures.building = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          ctx.fillStyle = "#f9a1a1";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#8c3353";
          for (let y = 12; y < canvas.height; y += 24) {
            for (let x = 12; x < canvas.width; x += 24) {
              ctx.fillRect(x, y, 14, 18);
            }
          }
        });

        textures.nuclear = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          ctx.fillStyle = "#ffe066";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ff6b6b";
          ctx.beginPath();
          ctx.moveTo(canvas.width / 2, 10);
          ctx.lineTo(canvas.width - 10, canvas.height - 10);
          ctx.lineTo(10, canvas.height - 10);
          ctx.closePath();
          ctx.fill();
        });

        textures.carBodyPink = new THREE.MeshStandardMaterial({ color: 0xff89c7, roughness: 0.4, metalness: 0.1 });
        textures.carRoofYellow = new THREE.MeshStandardMaterial({ color: 0xffe066, roughness: 0.35 });
        textures.carBumper = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

        textures.donut = makeCanvasTexture((ctx) => {
          const { canvas } = ctx;
          ctx.fillStyle = "#fdd09f";
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2 - 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ff6b9a";
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2 - 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fce4ec";
          for (let i = 0; i < 40; i++) {
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 4, 8);
          }
          ctx.globalCompositeOperation = "destination-out";
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
        }, 128, 128);

        textures.bus = new THREE.MeshStandardMaterial({ color: 0xfcbf49, roughness: 0.5 });

        // Skid texture (dark twin stripes with soft edges)
        {
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < 2; i++) {
            const y = 20 + i * 20;
            const grad = ctx.createLinearGradient(0, y - 10, 0, y + 10);
            grad.addColorStop(0, 'rgba(20,20,20,0)');
            grad.addColorStop(0.2, 'rgba(20,20,20,0.5)');
            grad.addColorStop(0.5, 'rgba(20,20,20,0.9)');
            grad.addColorStop(0.8, 'rgba(20,20,20,0.5)');
            grad.addColorStop(1, 'rgba(20,20,20,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(8, y - 10, canvas.width - 16, 20);
          }
          const tex = new THREE.CanvasTexture(canvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 8;
          textures.skidMap = tex;
        }

        return textures;
      }

      function makeCanvasTexture(drawFn, width = 256, height = 256) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        drawFn(ctx);
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.anisotropy = 16;
        texture.colorSpace = THREE.SRGBColorSpace;
        return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
      }

      // each surface gets its own texture copy: cloning a material shares its map, so a shared repeat
      // made the north-south road squash its lane dashes into stripes and every building share one window size
      function texMat(base, rx, ry, rot = 0) {
        const m = base.clone();
        m.map = base.map.clone();
        m.map.repeat.set(rx, ry);
        m.map.rotation = rot;
        m.map.needsUpdate = true;
        return m;
      }

      function buildRoadNetwork() {
        const group = new THREE.Group();
        const straight = new THREE.Mesh(new THREE.BoxGeometry(400, 0.2, 18), texMat(textures.road, 20, 1));
        straight.position.y = 0.11;
        straight.receiveShadow = true;
        group.add(straight);

        const vertical = new THREE.Mesh(new THREE.BoxGeometry(18, 0.2, 400), texMat(textures.road, 20, 1, Math.PI / 2));
        vertical.position.y = 0.12;
        vertical.receiveShadow = true;
        group.add(vertical);

        // sidewalks stop at the crossing instead of running over the other road
        const segLen = 185, segMid = 200 - segLen / 2;
        const walkX = texMat(textures.sidewalk, segLen / 6, 1);
        const walkZ = texMat(textures.sidewalk, 1, segLen / 6);
        [-1, 1].forEach((side) => {
          [-1, 1].forEach((half) => {
            const h = new THREE.Mesh(new THREE.BoxGeometry(segLen, 0.4, 6), walkX);
            h.position.set(half * segMid, 0.2, side * 12);
            h.receiveShadow = true;
            group.add(h);
            const v = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, segLen), walkZ);
            v.position.set(side * 12, 0.2, half * segMid);
            v.receiveShadow = true;
            group.add(v);
          });
        });

        return group;
      }

      function buildBuildings() {
        const group = new THREE.Group();
        const rng = THREE.MathUtils.seededRandom(1337);
        const buildingPositions = [];
        const ranges = [
          [-180, -60],
          [60, 180],
        ];
        ranges.forEach(([minX, maxX]) => {
          for (let x = minX; x <= maxX; x += 18) {
            for (let z = -180; z <= 180; z += 30) {
              if (Math.abs(z) < 24) continue;
              buildingPositions.push(new THREE.Vector3(x + (Math.random() - 0.5) * 6, 0, z + (Math.random() - 0.5) * 6));
            }
          }
        });

        buildingPositions.forEach((pos, idx) => {
          const height = THREE.MathUtils.randFloat(12, 32);
          const width = THREE.MathUtils.randFloat(8, 18);
          const depth = THREE.MathUtils.randFloat(8, 18);
          const geo = new THREE.BoxGeometry(width, height, depth);
          const mat = texMat(textures.building, width / 8, height / 8);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(pos.x, height / 2, pos.z);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          group.add(mesh);

          if (idx % 12 === 0) {
            const billboard = new THREE.Mesh(new THREE.BoxGeometry(width * 0.6, height * 0.4, 1), textures.nuclear);
            billboard.position.set(pos.x, height + 2, pos.z);
            group.add(billboard);
          }
        });

        const plantTowers = new THREE.Group();
        for (let i = 0; i < 2; i++) {
          const tower = new THREE.Mesh(
            new THREE.CylinderGeometry(10, 6, 28, 24),
            new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.6 })
          );
          tower.position.set(-40 + i * 20, 14, -80);
          tower.castShadow = true;
          tower.receiveShadow = true;
          plantTowers.add(tower);
        }
        group.add(plantTowers);

        return group;
      }

      // pink-frosted donuts with sprinkles that stand up, spin and bob so you can spot them from afar
      var donutKit = null; // var, not let: built on first use: populateDonuts() runs before this part of the script
      function makeDonutKit() {
      const sprinkleTex = (() => {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 64;
        const x = c.getContext('2d');
        x.fillStyle = '#ff6fae';
        x.fillRect(0, 0, 256, 64);
        const cols = ['#fff5a0', '#7fd6ff', '#ffffff', '#9cff8a', '#ff9f43'];
        for (let i = 0; i < 90; i++) {
          x.save();
          x.translate(Math.random() * 256, Math.random() * 64);
          x.rotate(Math.random() * Math.PI);
          x.fillStyle = cols[i % cols.length];
          x.fillRect(-4, -1.2, 8, 2.4);
          x.restore();
        }
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      })();
      const donutGeo = new THREE.TorusGeometry(1.2, 0.45, 14, 36);
      const doughMat = new THREE.MeshStandardMaterial({ color: 0xe0a15a, roughness: 0.85 });
      const frostMat = new THREE.MeshStandardMaterial({ map: sprinkleTex, roughness: 0.3, emissive: 0x401028 });
      return { donutGeo, doughMat, frostMat };
      }

      function populateDonuts() {
        const { donutGeo, doughMat, frostMat } = donutKit || (donutKit = makeDonutKit());
        for (let i = 0; i < DONUT_COUNT; i++) {
          const donut = new THREE.Group();
          const dough = new THREE.Mesh(donutGeo, doughMat);
          dough.castShadow = true;
          donut.add(dough);
          [-1, 1].forEach((side) => { // frosted on both faces so it reads pink from any angle while it spins
            const frost = new THREE.Mesh(donutGeo, frostMat);
            frost.scale.set(1.02, 1.02, 0.72);
            frost.position.z = side * 0.16;
            donut.add(frost);
          });
          const angle = Math.random() * Math.PI * 2;
          const radius = THREE.MathUtils.randFloat(20, 140);
          donut.position.set(Math.cos(angle) * radius, 2.4, Math.sin(angle) * radius);
          donut.rotation.y = Math.random() * Math.PI * 2;
          donut.userData.phase = Math.random() * 6.28;
          donutsGroup.add(donut);
        }
      }

      function spinDonuts(delta, t) {
        donutsGroup.children.forEach((d) => {
          d.rotation.y += delta * 1.8;
          d.position.y = 2.4 + Math.sin(t * 2.2 + d.userData.phase) * 0.35;
        });
      }

      function spawnTraffic() {
        const busGeo = new THREE.BoxGeometry(4, 3, 10);
        for (let i = 0; i < 6; i++) {
          const bus = new THREE.Mesh(busGeo, textures.bus);
          bus.position.set(-150 + i * 60, 1.6, i % 2 === 0 ? 6 : -6);
          bus.castShadow = true;
          bus.userData = {
            speed: THREE.MathUtils.randFloat(14, 22) * (i % 2 === 0 ? 1 : -1),
          };
          trafficGroup.add(bus);
        }
      }

      function setupTouchControls() {
        if (!matchMedia("(hover: none)").matches) return;
        touchStick.addEventListener("touchstart", (event) => {
          const touch = event.touches[0];
          touchStick.dataset.startX = touch.clientX;
          touchStick.dataset.startY = touch.clientY;
          event.preventDefault();
        });

        touchStick.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          const startX = parseFloat(touchStick.dataset.startX || "0");
          const startY = parseFloat(touchStick.dataset.startY || "0");
          const dx = (touch.clientX - startX) / 45;
          const dy = (touch.clientY - startY) / 45;
          keyState["ArrowUp"] = dy < -0.3;
          keyState["ArrowDown"] = dy > 0.3;
          keyState["ArrowLeft"] = dx < -0.3;
          keyState["ArrowRight"] = dx > 0.3;
          event.preventDefault();
        });

        touchStick.addEventListener("touchend", () => {
          keyState["ArrowUp"] = keyState["ArrowDown"] = keyState["ArrowLeft"] = keyState["ArrowRight"] = false;
        });

        boostBtn.addEventListener("touchstart", (event) => {
          event.preventDefault();
          keyState["Space"] = true;
        });
        boostBtn.addEventListener("touchend", () => (keyState["Space"] = false));

        brakeBtn.addEventListener("touchstart", (event) => {
          event.preventDefault();
          keyState["ArrowDown"] = true;
        });
        brakeBtn.addEventListener("touchend", () => (keyState["ArrowDown"] = false));

        resetBtn.addEventListener("touchstart", (event) => {
          event.preventDefault();
          resetCar();
        });
      }

      function resetCar() {
        car.mesh.position.set(0, 0, 0);
        car.mesh.rotation.set(0, 0, 0);
        car.velocity.set(0, 0, 0);
        car.speed = 0;
        car.heading = 0;
        if (state.playing) toast("Back on the road!");
      }

      function updateCar(delta) {
        const forward = new THREE.Vector3(Math.sin(car.heading), 0, Math.cos(car.heading));
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0));

        // More punchy acceleration and much stronger braking
        const accel = keyState["ArrowUp"] || keyState["KeyW"] ? 80 : 0;
        const brake = keyState["ArrowDown"] || keyState["KeyS"] ? 120 : 0;
        const boost = keyState["Space"] ? 12 : 0;
        const brakingActive = brake > 0;

        const turn = (keyState["ArrowLeft"] || keyState["KeyA"] ? 1 : 0) - (keyState["ArrowRight"] || keyState["KeyD"] ? 1 : 0);
        // Turning state used in both yaw and drift sections
        const turningActive = (keyState["ArrowLeft"] || keyState["KeyA"] || keyState["ArrowRight"] || keyState["KeyD"]);

        const topSpeed = 60;
        const targetSpeed = Math.max(0, Math.min(topSpeed, car.speed + (accel + boost - brake) * delta));
        // Snappier response towards target speed
        car.speed = THREE.MathUtils.damp(car.speed, targetSpeed, 9.0, delta);

        // Smaller base turn radius; much tighter when braking (handbrake feel)
        const speedNorm = Math.min(1, car.speed / topSpeed);
        let turnGain = THREE.MathUtils.lerp(4.1, 2.0, speedNorm); // slightly reduced base turn rate
        if (brakingActive && turningActive) turnGain *= 1.6; // toned-down extra yaw while braking
        car.heading += turn * delta * turnGain;
        car.heading = THREE.MathUtils.euclideanModulo(car.heading, Math.PI * 2);

        // Drifting: when braking while turning, reduce traction so velocity doesn't align with heading quickly
        const desiredVel = forward.clone().multiplyScalar(car.speed);
        const gripRate = (brakingActive && turningActive) ? 1.6 : 6.5; // lower = more slide; stronger drift when braking
        const lerpT = 1 - Math.exp(-gripRate * delta);
        car.velocity.lerp(desiredVel, lerpT);
        const movement = car.velocity.clone().multiplyScalar(delta);
        car.mesh.position.add(movement);
        car.mesh.rotation.y = car.heading;

        // Visual skid marks when drifting (brake + turn + slip)
        state.skidTimer -= delta;
        if (brakingActive && turningActive && car.velocity.length() > 1) {
          const velDir = car.velocity.clone().normalize();
          const slip = 1 - Math.max(-1, Math.min(1, velDir.dot(forward.clone().normalize())));
          if (slip > 0.12 && state.skidTimer <= 0) {
            spawnSkidMarks(car.mesh.position, forward, right, car.heading, Math.min(1, slip * 2));
            state.skidTimer = 0.045; // throttle spawning
          }
        }

        car.mesh.position.x = THREE.MathUtils.clamp(car.mesh.position.x, -190, 190);
        car.mesh.position.z = THREE.MathUtils.clamp(car.mesh.position.z, -190, 190);

        // car.velocity already updated via drift model

        camera.position.lerp(
          car.mesh.position
            .clone()
            .add(new THREE.Vector3(Math.sin(car.heading) * -12, 7 + boost * 0.1, Math.cos(car.heading) * -12)),
          0.08
        );
        orbit.target.lerp(car.mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0)), 0.12);

        speedEl.textContent = Math.round(car.speed).toString();
        engineTick(car.speed, boost > 0, true);
      }

      function updateTraffic(delta) {
        trafficGroup.children.forEach((bus) => {
          bus.position.z += bus.userData.speed * delta;
          if (bus.position.z > 200) bus.position.z = -200;
          if (bus.position.z < -200) bus.position.z = 200;
        });
      }

      function checkCollisions(delta) {
        const carPos = car.mesh.position;
        donutsGroup.children.slice().forEach((donut) => {
          if (donut.position.distanceTo(carPos) < 3) {
            donutsGroup.remove(donut);
            state.donuts += 1;
            chomp(state.combo);
            state.combo += 1;
            state.bestCombo = Math.max(state.bestCombo, state.combo);
            elapsed = Math.max(0, elapsed - 2);
            toast(state.combo > 1 ? `🍩 +2s · combo ×${state.combo}` : "🍩 +2s");
          }
        });

        trafficGroup.children.forEach((bus) => {
          if (bus.position.distanceTo(carPos) < 4.5) {
            if (car.speed > 4 && clock.elapsedTime - (state.lastHonk || -9) > 1.2) { honk(); state.lastHonk = clock.elapsedTime; }
            car.speed *= 0.4;
            if (state.combo || car.speed > 4) toast("D'oh! Watch the buses");
            state.combo = 0;
            spawnDustEffect(bus.position);
          }
        });

        donutsEl.textContent = `${state.donuts}`;
      }

      function spawnDustEffect(position) {
        const dust = new THREE.Mesh(
          new THREE.SphereGeometry(THREE.MathUtils.randFloat(1, 2), 10, 10),
          new THREE.MeshStandardMaterial({ color: 0xf2b880, transparent: true, opacity: 0.6 })
        );
        dust.position.copy(position).add(new THREE.Vector3(0, 1.4, 0));
        dust.userData = { life: 0.7 };
        dustGroup.add(dust);
      }

      function updateDust(delta) {
        for (let i = dustGroup.children.length - 1; i >= 0; i--) {
          const dust = dustGroup.children[i];
          dust.userData.life -= delta;
          dust.material.opacity = Math.max(0, dust.userData.life / 0.7);
          dust.scale.multiplyScalar(1 + delta * 2);
          if (dust.userData.life <= 0) {
            dustGroup.remove(dust);
            dust.geometry.dispose();
            dust.material.dispose();
          }
        }
      }

      function spawnSkidMarks(carPos, forward, right, heading, strength = 1) {
        const base = carPos.clone().add(forward.clone().multiplyScalar(-1.7));
        const offsets = [-0.9, 0.9];
        offsets.forEach((off) => {
          const pos = base.clone().add(right.clone().multiplyScalar(off));
          const geo = new THREE.PlaneGeometry(1.2 + strength * 0.8, 0.28);
          const mat = new THREE.MeshBasicMaterial({
            map: textures.skidMap,
            transparent: true,
            opacity: Math.min(0.9, 0.4 + strength * 0.5),
            depthWrite: false,
          });
          mat.polygonOffset = true;
          mat.polygonOffsetFactor = -1;
          const skid = new THREE.Mesh(geo, mat);
          skid.position.set(pos.x, 0.06, pos.z);
          skid.rotation.x = -Math.PI / 2; // lay flat
          skid.rotation.y = heading; // align with car
          skid.userData = { life: 0.9 };
          skidGroup.add(skid);
        });

        // Cap total skid marks to avoid perf issues
        const MAX_SKIDS = 220;
        while (skidGroup.children.length > MAX_SKIDS) {
          const old = skidGroup.children.shift();
          if (old) {
            old.geometry.dispose();
            old.material.dispose();
          }
        }
      }

      function updateSkids(delta) {
        for (let i = skidGroup.children.length - 1; i >= 0; i--) {
          const skid = skidGroup.children[i];
          skid.userData.life -= delta;
          const life = skid.userData.life;
          const mat = skid.material;
          mat.opacity = Math.max(0, Math.min(1, life / 0.9));
          if (life <= 0) {
            skidGroup.remove(skid);
            skid.geometry.dispose();
            mat.dispose();
          }
        }
      }

      function resetIfOutOfBounds() {
        if (Math.abs(car.mesh.position.x) > 198 || Math.abs(car.mesh.position.z) > 198) {
          resetCar();
        }
      }

      function animate() {
        const delta = Math.min(clock.getDelta(), 0.033);
        if (state.playing) {
          elapsed += delta;
          const timeLeft = Math.max(0, TOTAL_TIME - elapsed);
          timerEl.textContent = timeLeft < 10 ? timeLeft.toFixed(1) : Math.ceil(timeLeft);
          timeChip.classList.toggle('low', timeLeft < 10);
          if (timeLeft <= 0) {
            if (!state.gameOverShown) endShift();
          }
        }

        if (state.playing) {
          updateCar(delta);
          updateTraffic(delta);
          checkCollisions(delta);
          updateDust(delta);
          updateSkids(delta);
          resetIfOutOfBounds();
        }

        spinDonuts(delta, clock.elapsedTime);
        orbit.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();

      // Initialize leaderboard once scene boots
      loadLeaderboard();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
