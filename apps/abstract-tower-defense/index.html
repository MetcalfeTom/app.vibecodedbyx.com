  <style>
    :root { --cyan: #0ff; --mag: #f0f; --yel: #ff0; --grn: #0f0; --bg: #0a0a0f; --line: #1a1a2e; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    .hud-value { color: var(--cyan); text-shadow: 0 0 10px rgba(0,255,255,.5); font-weight: 700; }

    .stage { position: relative; flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
    #gameCanvas { display: block; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; box-shadow: 0 0 40px rgba(0,255,255,.1); touch-action: manipulation; }
    .hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #9ab;
      background: rgba(10,10,15,.8); border: 1px solid #234; padding: 5px 12px; border-radius: 4px; pointer-events: none; white-space: nowrap; transition: opacity .6s; }
    .hint.gone { opacity: 0; }

      font-size: clamp(16px, 3.4vw, 26px); letter-spacing: 6px; color: var(--cyan); text-shadow: 0 0 24px rgba(0,255,255,.8); white-space: nowrap; }
    .toast small { display: block; font-size: .45em; letter-spacing: 3px; color: #f80; text-shadow: 0 0 12px rgba(255,136,0,.8); margin-top: 6px; }
    .toast.show { animation: toast 1.9s ease forwards; }
    @keyframes toast { 0% { opacity: 0; letter-spacing: 16px; } 15%, 70% { opacity: 1; letter-spacing: 6px; } 100% { opacity: 0; } }

    .panel { position: absolute; z-index: 5; min-width: 176px; background: rgba(8,10,18,.94); border: 1px solid var(--pc, var(--cyan)); border-radius: 6px;
      padding: 9px 10px; box-shadow: 0 0 24px rgba(0,0,0,.6), 0 0 14px color-mix(in srgb, var(--pc, #0ff) 35%, transparent); font-family: 'Share Tech Mono', monospace; font-size: 13px; }
    .panel[hidden] { display: none; }
    .panel .ttl { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--pc, var(--cyan)); display: flex; justify-content: space-between; gap: 10px; }
    .panel .stats { color: #9ab; margin: 6px 0 8px; line-height: 1.35; }

    .panel .up { border: 1px solid var(--grn); color: var(--grn); }
    .panel .up:disabled { border-color: #333; color: #555; cursor: not-allowed; }
    .panel .sell { border: 1px solid #f55; color: #f77; }

    .bar { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
    .tower-btn { background: rgba(255,255,255,.03); border: 1px solid #333; border-radius: 8px; padding: 8px 16px; color: #888; font-family: 'Orbitron', sans-serif;
      font-size: 10px; cursor: pointer; transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .tower-btn .key { position: absolute; top: 3px; left: 6px; font-size: 8px; color: #555; }
    .tower-btn:hover { border-color: var(--tc); color: var(--tc); box-shadow: 0 0 20px color-mix(in srgb, var(--tc) 25%, transparent); }
    .tower-btn.selected { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 10%, transparent); color: var(--tc); }
    .tower-btn.disabled { opacity: .35; }
    .tower-icon { font-size: 18px; color: var(--tc); }
    .tower-cost { color: var(--yel); font-size: 9px; }
    .controls { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
    .control-btn { background: none; border: 1px solid #333; border-radius: 4px; padding: 8px 16px; color: #777; font-family: 'Orbitron', sans-serif; font-size: 10px;
      letter-spacing: 2px; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .control-btn.start { border-color: var(--grn); color: var(--grn); }
    .control-btn.start:hover:not(:disabled) { background: rgba(0,255,0,.1); box-shadow: 0 0 20px rgba(0,255,0,.3); }
    .control-btn.start:disabled { border-color: #333; color: #555; cursor: default; }
    .control-btn.on { border-color: var(--mag); color: var(--mag); box-shadow: 0 0 14px rgba(255,0,255,.3); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 18px; text-align: center; padding: 20px; }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 2rem; color: var(--mag); text-shadow: 0 0 30px rgba(255,0,255,.8); letter-spacing: 8px; }
    .overlay p { color: #777; font-size: 12px; letter-spacing: 2px; }
    .overlay p b { color: var(--cyan); font-size: 1.6em; }
    .overlay button { background: none; border: 2px solid var(--cyan); color: var(--cyan); padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 3px; cursor: pointer; }
    .overlay button:hover { background: rgba(0,255,255,.1); box-shadow: 0 0 30px rgba(0,255,255,.5); }
    .mute { position: fixed; right: 12px; bottom: 12px; background: none; border: 1px solid #333; color: #777; border-radius: 4px; padding: 5px 8px; font-size: 14px; cursor: pointer; }

    @media (max-width: 700px) {
      #game-container { padding: 8px 10px; gap: 8px; }
      h1 { font-size: .95rem; letter-spacing: 2px; }
      .hud { gap: 14px; font-size: 10px; }
      .tower-btn { padding: 7px 11px; font-size: 9px; }
      .tower-btn .key { display: none; }
      .controls { flex-direction: row; padding-right: 46px; }
      .control-btn { padding: 8px 9px; letter-spacing: 0; }
      .hint { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { .toast.show { animation-duration: .01s; } .hud-value.bump { animation: none; } }

<body>
  <div id="game-container">
    <h1>ABSTRACT DEFENSE</h1>
    <div class="hud" aria-live="off">
      <div class="hud-item"><span class="hud-label">WAVE</span><span class="hud-value" id="wave">1</span></div>
      <div class="hud-item"><span class="hud-label">CORE</span><span class="hud-value health" id="health">20</span></div>
      <div class="hud-item"><span class="hud-label">CREDITS</span><span class="hud-value credits" id="credits">250</span></div>
      <div class="hud-item"><span class="hud-label">BEST</span><span class="hud-value best" id="best">–</span></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="gameCanvas" aria-label="Battlefield: tap dark space to build, tap a tower to upgrade or sell it"></canvas>
      <div class="hint" id="hint">tap dark space to build · tap a tower to upgrade</div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="panel" id="panel" hidden>
        <div class="ttl"><span id="pName">BASIC</span><span id="pLvl">LV 1</span></div>
        <div class="stats" id="pStats"></div>
        <div class="row"><button class="up" id="pUp">UPGRADE</button><button class="sell" id="pSell">SELL</button></div>
      </div>
    </div>

    <div class="bar">
      <button class="tower-btn selected" data-tower="basic" style="--tc:#0ff"><span class="key">1</span><span class="tower-icon">▲</span><span>BASIC</span><span class="tower-cost">50c</span></button>
      <button class="tower-btn" data-tower="rapid" style="--tc:#0f0"><span class="key">2</span><span class="tower-icon">▲▲</span><span>RAPID</span><span class="tower-cost">100c</span></button>
      <button class="tower-btn" data-tower="sniper" style="--tc:#f0f"><span class="key">3</span><span class="tower-icon">◆</span><span>SNIPER</span><span class="tower-cost">150c</span></button>
      <button class="tower-btn" data-tower="frost" style="--tc:#6cf"><span class="key">4</span><span class="tower-icon">⬢</span><span>FROST</span><span class="tower-cost">120c</span></button>
      <div class="controls">
        <button class="control-btn start" id="startWave">START WAVE</button>
        <button class="control-btn" id="speedBtn" aria-pressed="false">SPEED 1×</button>
        <button class="control-btn" id="mapBtn" title="Change map (before wave 1)">MAP: S-BEND</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="gameOver" role="dialog" aria-labelledby="goTitle">
    <h2 id="goTitle">SYSTEM FAILURE</h2>
    <p>WAVES SURVIVED <b id="finalWave">0</b></p>
    <p id="bestLine"></p>
    <button id="restartBtn">REINITIALIZE</button>
  </div>
  <button class="mute" id="muteBtn" aria-label="Mute sound" aria-pressed="false">🔊</button>

<script>
(() => {
  // ---------- world: fixed 800×500, scaled to fit, so towers and the path never drift apart ----------
  const W = 800, H = 500;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let scale = 1, rot = false;
  // tall phone screens get the board turned 90°, so the path runs top → bottom and fills the screen
  function resize() {
    const r = stage.getBoundingClientRect();
    const flatFit = Math.min(r.width / W, r.height / H), tallFit = Math.min(r.width / H, r.height / W);
    rot = tallFit > flatFit * 1.15;
    scale = Math.min(rot ? tallFit : flatFit, 1100 / W);
    const cw = (rot ? H : W) * scale, ch = (rot ? W : H) * scale;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const k = scale * dpr;
    if (rot) ctx.setTransform(0, k, -k, 0, H * k, 0); // world (x,y) → screen (H−y, x)
    else ctx.setTransform(k, 0, 0, k, 0, 0);
    if (sel) placePanel();
  }
  const toCss = (x, y) => (rot ? [(H - y) * scale, x * scale] : [x * scale, y * scale]);
  function label(text, x, y) { // text stays upright even on the turned board
    if (!rot) return ctx.fillText(text, x, y);
    ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2); ctx.fillText(text, 0, 0); ctx.restore();
  }

  const MAPS = [
    { name: 'S-BEND', hp: 1, path: [[0, 150], [200, 150], [200, 350], [400, 350], [400, 150], [600, 150], [600, 350], [800, 350]] },
    { name: 'BOLT', hp: 1.1, path: [[0, 70], [320, 70], [320, 430], [520, 430], [520, 170], [800, 170]] },
    { name: 'SPIRAL', hp: 1.5, path: [[0, 60], [740, 60], [740, 440], [60, 440], [60, 200], [560, 200], [560, 320], [300, 320]] },
  ];
  let mapIdx = 0;
  try { mapIdx = Math.min(MAPS.length - 1, Math.max(0, +localStorage.getItem('atd_map') || 0)); } catch (_) {}
  let PATH, SEGS, PATH_LEN, EXIT;
  function buildPath() {
    PATH = MAPS[mapIdx].path; SEGS = []; PATH_LEN = 0; EXIT = PATH[PATH.length - 1];
    for (let i = 0; i < PATH.length - 1; i++) {
      const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1], len = Math.hypot(x2 - x1, y2 - y1);
      SEGS.push({ x1, y1, x2, y2, len, at: PATH_LEN });
      PATH_LEN += len;
    }
  }
  buildPath();
  function pointAt(d) {
    for (const s of SEGS) if (d <= s.at + s.len) { const t = (d - s.at) / s.len; return [s.x1 + (s.x2 - s.x1) * t, s.y1 + (s.y2 - s.y1) * t]; }
    return PATH[PATH.length - 1].slice();
  }

  const TYPES = {
    basic:  { name: 'BASIC',  range: 110, dmg: 1,    rate: 36,  color: '#00ffff', cost: 50,  speed: 9 },
    rapid:  { name: 'RAPID',  range: 90,  dmg: 0.5,  rate: 12,  color: '#00ff00', cost: 100, speed: 11 },
    sniper: { name: 'SNIPER', range: 210, dmg: 3.5,  rate: 110, color: '#ff00ff', cost: 150, beam: true },
    frost:  { name: 'FROST',  range: 85,  dmg: 0.3,  rate: 45,  color: '#66ccff', cost: 120, pulse: true },
  };
  const MAX_LV = 3;
  const stat = (t) => { const b = TYPES[t.type], k = t.lv - 1; return { range: b.range * Math.pow(1.1, k), dmg: b.dmg * Math.pow(1.45, k), rate: Math.round(b.rate * Math.pow(0.88, k)) }; };
  const slowOf = (t) => 0.35 + 0.1 * (t.lv - 1); // frost: 35/45/55% slower
  const upCost = (t) => Math.round(TYPES[t.type].cost * 0.7 * t.lv);
  const sellValue = (t) => Math.round(t.spent * 0.6);

  // ---------- state ----------
  let G, sel = null, ghost = null, speedMul = 1, tick = 0;
  let best = 0;
  const bestKey = () => mapIdx ? 'atd_best_' + MAPS[mapIdx].name : 'atd_best';
  try { best = +localStorage.getItem(bestKey()) || 0; } catch (_) {}
  function fresh() {
    return { wave: 1, health: 20, credits: 250, waveActive: false, gameOver: false, selType: 'basic',
             towers: [], enemies: [], shots: [], beams: [], rings: [], parts: [], floats: [], queue: [], spawnT: 0 };
  }
  G = fresh();

  const $ = (id) => document.getElementById(id);
  const waveEl = $('wave'), healthEl = $('health'), creditsEl = $('credits'), bestEl = $('best');
  const startBtn = $('startWave'), mapBtn = $('mapBtn'), speedBtn = $('speedBtn'), panel = $('panel'), hint = $('hint'), toastEl = $('toast');
  const towerBtns = document.querySelectorAll('.tower-btn');

  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  let lastHud = '';
  function hud() {
    const k = G.wave + '|' + G.health + '|' + G.credits + '|' + best;
    if (k === lastHud) return;
    const [w0, h0, c0] = lastHud.split('|');
    lastHud = k;
    waveEl.textContent = G.wave;
    healthEl.textContent = G.health;
    creditsEl.textContent = G.credits;
    bestEl.textContent = best || '–';
    if (h0 && +h0 !== G.health) bump(healthEl);
    if (c0 && +c0 < G.credits) bump(creditsEl);
    towerBtns.forEach((b) => b.classList.toggle('disabled', G.credits < TYPES[b.dataset.tower].cost));
    startBtn.disabled = G.waveActive;
    mapBtn.disabled = !(G.wave === 1 && !G.waveActive);
    if (sel) drawPanel();
  }
  function toast(big, small) {
    toastEl.innerHTML = big + (small ? `<small>${small}</small>` : '');
    toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
  }

  // ---------- sound ----------
  const au = { ac: null, muted: false, last: {} };
  try { au.muted = localStorage.getItem('atd_muted') === '1'; } catch (_) {}
  function audio() { if (!au.ac) { try { au.ac = new (window.AudioContext || window.webkitAudioContext)(); au.out = au.ac.createGain(); au.out.gain.value = au.muted ? 0 : 0.5; au.out.connect(au.ac.destination); } catch (_) {} } else au.ac.resume?.(); }
  function tone(f1, f2, len, type, vol, key, gapMs) {
    if (!au.ac || au.muted) return;
    const now = performance.now();
    if (key && now - (au.last[key] || 0) < (gapMs || 60)) return;
    if (key) au.last[key] = now;
    const t = au.ac.currentTime, o = au.ac.createOscillator(), g = au.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(au.out); o.start(t); o.stop(t + len + 0.02);
  }
  const SND = {
    basic: () => tone(880, 440, 0.07, 'square', 0.05, 'basic', 70),
    rapid: () => tone(1400, 900, 0.035, 'square', 0.03, 'rapid', 55),
    sniper: () => tone(2400, 200, 0.22, 'sawtooth', 0.07, 'sniper', 90),
    frost: () => tone(520, 1560, 0.16, 'triangle', 0.05, 'frost', 90),
    pop: () => tone(520, 1300, 0.08, 'triangle', 0.08, 'pop', 40),
    leak: () => tone(140, 60, 0.35, 'sawtooth', 0.14, 'leak', 150),
    build: () => tone(300, 900, 0.12, 'triangle', 0.1),
    up: () => { tone(500, 1000, 0.1, 'triangle', 0.1); setTimeout(() => tone(750, 1500, 0.14, 'triangle', 0.1), 90); },
    wave: () => { tone(220, 440, 0.25, 'sawtooth', 0.06); setTimeout(() => tone(330, 660, 0.3, 'sawtooth', 0.06), 160); },
  };
  const muteBtn = $('muteBtn');
  function drawMute() { muteBtn.textContent = au.muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', String(au.muted)); muteBtn.setAttribute('aria-label', au.muted ? 'Unmute sound' : 'Mute sound'); }
  muteBtn.onclick = () => { au.muted = !au.muted; if (au.out) au.out.gain.value = au.muted ? 0 : 0.5; try { localStorage.setItem('atd_muted', au.muted ? '1' : '0'); } catch (_) {} drawMute(); };
  drawMute();

  // ---------- waves ----------
  function buildWave(w) {
    const n = 5 + w * 3, q = [];
    for (let i = 0; i < n; i++) {
      if (w >= 5 && w % 5 === 0 && i >= n - 2) q.push('tank');
      else if (w >= 3 && i % 3 === 2) q.push('runner');
      else q.push('dot');
    }
    return q;
  }
  function waveTag(w) { return w >= 5 && w % 5 === 0 ? 'TANKS INBOUND' : w === 3 ? 'RUNNERS APPEAR' : ''; }
  function startWave() {
    if (G.waveActive || G.gameOver) return;
    audio();
    G.waveActive = true;
    G.queue = buildWave(G.wave);
    G.spawnT = 0;
    toast('WAVE ' + G.wave, waveTag(G.wave));
    SND.wave();
    hud();
  }
  function spawn(kind) {
    const w = G.wave;
    const hp = (2 + 1.6 * w) * (1 + Math.max(0, w - 6) * 0.1) * MAPS[mapIdx].hp;
    const sp = Math.min(2.6, 1 + 0.08 * w);
    const E = { kind, d: 0, x: PATH[0][0], y: PATH[0][1], hp, max: hp, speed: sp, r: 10 + Math.random() * 4, color: ['#ff0033', '#ff3366', '#ff1a1a'][Math.random() * 3 | 0], reward: Math.round(8 + w * 1.5), hit: 0 };
    if (kind === 'runner') Object.assign(E, { hp: hp * 0.55, max: hp * 0.55, speed: sp * 1.7, r: 7, color: '#ff0' });
    if (kind === 'tank') Object.assign(E, { hp: hp * 6, max: hp * 6, speed: sp * 0.55, r: 18, color: '#f80', reward: E.reward * 5 });
    G.enemies.push(E);
  }

  // ---------- simulation (fixed 60 Hz) ----------
  function step() {
    tick++;
    if (G.waveActive && G.queue.length && --G.spawnT <= 0) {
      const k = G.queue.shift();
      spawn(k);
      G.spawnT = k === 'runner' ? 26 : k === 'tank' ? 70 : 40;
    }
    for (const e of G.enemies) {
      e.d += e.speed * (e.slowT > 0 ? e.slowF : 1);
      if (e.slowT > 0) e.slowT--;
      [e.x, e.y] = pointAt(e.d);
      if (e.hit > 0) e.hit--;
    }
    for (let i = G.enemies.length - 1; i >= 0; i--) {
      const e = G.enemies[i];
      if (e.d >= PATH_LEN) {
        G.enemies.splice(i, 1);
        G.health = Math.max(0, G.health - (e.kind === 'tank' ? 3 : 1));
        burst(EXIT[0] >= W ? W - 4 : EXIT[0], EXIT[1], '#f00', 12);
        SND.leak();
        flashT = 18;
      }
    }
    for (const t of G.towers) {
      const s = stat(t);
      t.cd--;
      let target = null, far = -1;
      for (const e of G.enemies) {
        if (e.hp <= 0) continue;
        if ((e.x - t.x) ** 2 + (e.y - t.y) ** 2 <= s.range * s.range && e.d > far) { far = e.d; target = e; } // "first": furthest along the path
      }
      if (!target) continue;
      t.angle = Math.atan2(target.y - t.y, target.x - t.x) + Math.PI / 2;
      if (t.cd > 0) continue;
      t.cd = s.rate;
      const b = TYPES[t.type];
      if (b.pulse) { // frost: chip damage + slow on everything in range
        G.rings.push({ x: t.x, y: t.y, r: 8, max: s.range, life: 18 });
        for (const e of G.enemies) {
          if (e.hp <= 0 || (e.x - t.x) ** 2 + (e.y - t.y) ** 2 > s.range * s.range) continue;
          damage(e, s.dmg, b.color);
          const f = 1 - slowOf(t) * (e.kind === 'tank' ? 0.5 : 1);
          if (!(e.slowT > 0) || f < e.slowF) e.slowF = f;
          e.slowT = 75;
        }
      } else if (b.beam) { // sniper: instant hit, no more whiffing at moving targets
        G.beams.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 12, color: b.color });
        damage(target, s.dmg, b.color);
      } else {
        G.shots.push({ x: t.x, y: t.y, tgt: target, tx: target.x, ty: target.y, dmg: s.dmg, speed: b.speed, color: b.color });
      }
      SND[t.type]();
    }
    for (let i = G.shots.length - 1; i >= 0; i--) {
      const p = G.shots[i];
      const alive = p.tgt && p.tgt.hp > 0 && G.enemies.includes(p.tgt);
      if (alive) { p.tx = p.tgt.x; p.ty = p.tgt.y; } // homing
      const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
      if (dist <= p.speed + (alive ? p.tgt.r * 0.5 : 0)) {
        if (alive) damage(p.tgt, p.dmg, p.color);
        G.shots.splice(i, 1);
      } else { p.x += dx / dist * p.speed; p.y += dy / dist * p.speed; }
    }
    for (let i = G.enemies.length - 1; i >= 0; i--) {
      const e = G.enemies[i];
      if (e.hp > 0) continue;
      G.enemies.splice(i, 1);
      G.credits += e.reward;
      burst(e.x, e.y, e.color, e.kind === 'tank' ? 40 : 15);
      G.floats.push({ x: e.x, y: e.y - e.r, text: '+' + e.reward, life: 50 });
      SND.pop();
    }
    for (let i = G.beams.length - 1; i >= 0; i--) if (--G.beams[i].life <= 0) G.beams.splice(i, 1);
    for (let i = G.rings.length - 1; i >= 0; i--) { const q = G.rings[i]; q.r += (q.max - q.r) * 0.25; if (--q.life <= 0) G.rings.splice(i, 1); }
    for (let i = G.parts.length - 1; i >= 0; i--) { const q = G.parts[i]; q.x += q.vx; q.y += q.vy; q.vx *= 0.96; q.vy *= 0.96; q.life -= 0.03; if (q.life <= 0) G.parts.splice(i, 1); }
    for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.y -= 0.6; if (--f.life <= 0) G.floats.splice(i, 1); }

    if (G.waveActive && !G.queue.length && !G.enemies.length) {
      G.waveActive = false;
      const cleared = G.wave;
      G.wave++;
      G.credits += 25;
      if (cleared > best) { best = cleared; try { localStorage.setItem(bestKey(), best); } catch (_) {} }
      toast('WAVE ' + cleared + ' CLEARED', '+25 credits');
    }
    if (G.health <= 0 && !G.gameOver) gameOver();
  }
  function damage(e, d, color) { e.hp -= d; e.hit = 6; burst(e.x, e.y, color, 3); }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 1 + Math.random() * 3; G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color, size: 1.5 + Math.random() * 2.5 }); }
    if (G.parts.length > 600) G.parts.splice(0, G.parts.length - 600);
  }
  function gameOver() {
    G.gameOver = true;
    const survived = G.wave - 1;
    $('finalWave').textContent = survived;
    $('bestLine').textContent = survived >= best && survived > 0 ? 'NEW BEST' : best ? 'BEST ' + best : '';
    $('gameOver').classList.add('show');
    $('restartBtn').focus();
    closePanel();
  }

  // ---------- drawing ----------
  let flashT = 0;
  function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,255,255,.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 25; x < W; x += 25) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 25; y < H; y += 25) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // path + flowing centre line
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); PATH.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.strokeStyle = 'rgba(100,100,150,.1)'; ctx.lineWidth = 60; ctx.stroke();
    ctx.strokeStyle = '#161628'; ctx.lineWidth = 40; ctx.stroke();
    ctx.setLineDash([6, 14]); ctx.lineDashOffset = -tick * 0.6;
    ctx.strokeStyle = 'rgba(255,0,80,.18)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
    // core at the exit
    const pulse = 0.5 + 0.5 * Math.sin(tick * 0.08);
    ctx.fillStyle = flashT > 0 ? `rgba(255,0,0,${0.25 + flashT / 40})` : `rgba(255,0,255,${0.12 + pulse * 0.1})`;
    if (EXIT[0] >= W) ctx.fillRect(W - 6, EXIT[1] - 20, 6, 40);
    else { ctx.beginPath(); ctx.arc(EXIT[0], EXIT[1], 18 + pulse * 3, 0, 6.283); ctx.fill(); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(EXIT[0], EXIT[1], 26 + pulse * 4, 0, 6.283); ctx.stroke(); }
    if (flashT > 0) flashT--;

    // ghost / selection ranges
    if (ghost && !sel) {
      const b = TYPES[G.selType], okPlace = canPlace(ghost.x, ghost.y) === true;
      ctx.strokeStyle = okPlace ? b.color + '66' : '#f336';
      ctx.fillStyle = okPlace ? b.color + '10' : '#f331';
      ctx.beginPath(); ctx.arc(ghost.x, ghost.y, b.range, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 0.45;
      drawTower({ x: ghost.x, y: ghost.y, type: G.selType, lv: 1, angle: 0 }, okPlace ? null : '#ff3333');
      ctx.globalAlpha = 1;
    }
    if (sel) {
      const s = stat(sel), b = TYPES[sel.type];
      ctx.strokeStyle = b.color + '88'; ctx.fillStyle = b.color + '12'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sel.x, sel.y, s.range, 0, 6.283); ctx.fill(); ctx.stroke();
    }

    for (const t of G.towers) drawTower(t);

    for (const e of G.enemies) {
      ctx.save();
      ctx.shadowColor = e.color; ctx.shadowBlur = e.kind === 'tank' ? 26 : 16;
      ctx.fillStyle = e.hit > 0 ? '#fff' : e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
      if (e.slowT > 0) { ctx.shadowBlur = 0; ctx.strokeStyle = '#bfeaff'; ctx.lineWidth = 2; ctx.globalAlpha = Math.min(1, e.slowT / 20); ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
      if (e.kind === 'tank') { ctx.shadowBlur = 0; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.55, 0, 6.283); ctx.stroke(); }
      ctx.restore();
      if (e.hp < e.max) {
        const w = Math.max(24, e.r * 2);
        const f = Math.max(0, e.hp / e.max);
        if (rot) { // keep the bar above the enemy on the turned board
          ctx.fillStyle = '#333'; ctx.fillRect(e.x - e.r - 11, e.y - w / 2, 3, w);
          ctx.fillStyle = e.color; ctx.fillRect(e.x - e.r - 11, e.y + w / 2 - w * f, 3, w * f);
        } else {
          ctx.fillStyle = '#333'; ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w, 3);
          ctx.fillStyle = e.color; ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w * f, 3);
        }
      }
    }
    for (const p of G.shots) { ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.283); ctx.fill(); }
    ctx.shadowBlur = 0;
    for (const q of G.rings) {
      ctx.globalAlpha = q.life / 18 * 0.8; ctx.strokeStyle = '#66ccff'; ctx.lineWidth = 2; ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.stroke();
    }
    for (const b of G.beams) {
      ctx.globalAlpha = b.life / 12;
      ctx.strokeStyle = b.color; ctx.lineWidth = 1 + b.life / 4; ctx.shadowColor = b.color; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    for (const q of G.parts) { ctx.globalAlpha = q.life; ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    ctx.globalAlpha = 1;
    ctx.font = '12px "Share Tech Mono", monospace'; ctx.textAlign = 'center';
    for (const f of G.floats) { ctx.globalAlpha = Math.min(1, f.life / 20); ctx.fillStyle = '#ff0'; label(f.text, f.x, f.y); }
    ctx.globalAlpha = 1;
  }
  function drawTower(t, tint) {
    const b = TYPES[t.type], col = tint || b.color, sz = 1 + (t.lv - 1) * 0.14;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.strokeStyle = col + '44'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 17 * sz, 0, 6.283); ctx.stroke();
    for (let i = 0; i < t.lv; i++) { ctx.fillStyle = col; ctx.beginPath(); rot ? ctx.arc(22 * sz, 6 - i * 6, 1.8, 0, 6.283) : ctx.arc(-6 + i * 6, 22 * sz, 1.8, 0, 6.283); ctx.fill(); } // level pips
    ctx.rotate(t.angle || 0);
    ctx.shadowColor = col; ctx.shadowBlur = 15; ctx.fillStyle = col;
    ctx.beginPath();
    if (t.type === 'frost') { for (let i = 0; i < 6; i++) { const a = i * 1.0472; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * 14 * sz, Math.sin(a) * 14 * sz); } }
    else if (t.type === 'sniper') { ctx.moveTo(0, -15 * sz); ctx.lineTo(12 * sz, 0); ctx.lineTo(0, 15 * sz); ctx.lineTo(-12 * sz, 0); }
    else { ctx.moveTo(0, -15 * sz); ctx.lineTo(12 * sz, 12 * sz); ctx.lineTo(-12 * sz, 12 * sz); }
    ctx.closePath(); ctx.fill();
    if (t.type === 'frost') { ctx.shadowBlur = 0; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < 3; i++) { const a = i * 1.0472; ctx.moveTo(Math.cos(a) * 8 * sz, Math.sin(a) * 8 * sz); ctx.lineTo(-Math.cos(a) * 8 * sz, -Math.sin(a) * 8 * sz); } ctx.stroke(); }
    if (t.type === 'rapid') { ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.moveTo(0, -3 * sz); ctx.lineTo(5 * sz, 8 * sz); ctx.lineTo(-5 * sz, 8 * sz); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

  // ---------- building, selecting, upgrading ----------
  function onPath(x, y) {
    for (const s of SEGS) {
      const dx = s.x2 - s.x1, dy = s.y2 - s.y1, t = Math.max(0, Math.min(1, ((x - s.x1) * dx + (y - s.y1) * dy) / (dx * dx + dy * dy)));
      if (Math.hypot(x - (s.x1 + t * dx), y - (s.y1 + t * dy)) < 34) return true;
    }
    return false;
  }
  function canPlace(x, y) {
    if (x < 14 || y < 14 || x > W - 14 || y > H - 14) return 'too close to the edge';
    if (onPath(x, y)) return "can't build on the path";
    if (G.towers.some((t) => Math.hypot(t.x - x, t.y - y) < 36)) return 'too close to another tower';
    if (G.credits < TYPES[G.selType].cost) return 'need ' + TYPES[G.selType].cost + 'c';
    return true;
  }
  function toWorld(e) {
    const r = canvas.getBoundingClientRect(), X = (e.clientX - r.left) / scale, Y = (e.clientY - r.top) / scale;
    return rot ? { x: Y, y: H - X } : { x: X, y: Y };
  }
  function towerAt(x, y) { const r = Math.max(20, 15 / scale); return G.towers.find((t) => Math.hypot(t.x - x, t.y - y) < r); } // fingers get a bigger hit area on small screens

  canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { ghost = toWorld(e); canvas.style.cursor = towerAt(ghost.x, ghost.y) ? 'pointer' : 'crosshair'; } });
  canvas.addEventListener('pointerleave', () => { ghost = null; });
  canvas.addEventListener('click', (e) => {
    if (G.gameOver) return;
    audio();
    const p = toWorld(e), t = towerAt(p.x, p.y);
    if (t) { sel === t ? closePanel() : openPanel(t); return; }
    if (sel) { closePanel(); return; }
    const ok = canPlace(p.x, p.y);
    if (ok !== true) { G.floats.push({ x: p.x, y: p.y, text: ok, life: 60 }); return; }
    const b = TYPES[G.selType];
    G.towers.push({ x: p.x, y: p.y, type: G.selType, lv: 1, angle: 0, cd: 0, spent: b.cost });
    G.credits -= b.cost;
    burst(p.x, p.y, b.color, 10);
    SND.build();
    hint.classList.add('gone');
    hud();
  });

  function openPanel(t) { sel = t; panel.hidden = false; drawPanel(); placePanel(); }
  function closePanel() { sel = null; panel.hidden = true; }
  function drawPanel() {
    const t = sel, b = TYPES[t.type], s = stat(t);
    panel.style.setProperty('--pc', b.color);
    $('pName').textContent = b.name;
    $('pLvl').textContent = 'LV ' + t.lv + (t.lv === MAX_LV ? ' MAX' : '');
    let next = '';
    if (t.lv < MAX_LV) { const n = stat({ type: t.type, lv: t.lv + 1 }); next = ` <i>→ ${n.dmg.toFixed(1)}</i>`; }
    $('pStats').innerHTML = `DMG <b>${s.dmg.toFixed(1)}</b>${next} · RNG <b>${Math.round(s.range)}</b><br>FIRE <b>${(60 / s.rate).toFixed(1)}/s</b>` + (b.pulse ? ` · SLOW <b>${Math.round(slowOf(t) * 100)}%</b>` : '');
    const up = $('pUp');
    if (t.lv >= MAX_LV) { up.textContent = 'MAXED'; up.disabled = true; }
    else { up.textContent = 'UPGRADE ' + upCost(t) + 'c'; up.disabled = G.credits < upCost(t); }
    $('pSell').textContent = 'SELL +' + sellValue(t) + 'c';
  }
  function placePanel() {
    const cr = canvas.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const pw = panel.offsetWidth || 180, ph = panel.offsetHeight || 90;
    const [tx, ty] = toCss(sel.x, sel.y);
    let x = cr.left - sr.left + tx + 26, y = cr.top - sr.top + ty - ph / 2;
    if (x + pw > sr.width - 4) x = cr.left - sr.left + tx - pw - 26;
    x = Math.max(4, Math.min(x, sr.width - pw - 4));
    y = Math.max(4, Math.min(y, sr.height - ph - 4));
    panel.style.left = x + 'px'; panel.style.top = y + 'px';
  }
  function upgrade() {
    if (!sel || sel.lv >= MAX_LV || G.credits < upCost(sel)) return;
    const c = upCost(sel);
    G.credits -= c; sel.spent += c; sel.lv++;
    burst(sel.x, sel.y, TYPES[sel.type].color, 18);
    SND.up();
    hud(); drawPanel(); placePanel();
  }
  function sell() {
    if (!sel) return;
    G.credits += sellValue(sel);
    burst(sel.x, sel.y, '#ff0', 12);
    G.towers.splice(G.towers.indexOf(sel), 1);
    closePanel(); hud();
  }
  $('pUp').onclick = upgrade;
  $('pSell').onclick = sell;

  function pickType(type) {
    G.selType = type;
    towerBtns.forEach((b) => b.classList.toggle('selected', b.dataset.tower === type));
    closePanel();
  }
  towerBtns.forEach((b) => b.addEventListener('click', () => pickType(b.dataset.tower)));
  startBtn.onclick = startWave;
  function toggleSpeed() { speedMul = speedMul === 1 ? 2 : 1; speedBtn.textContent = 'SPEED ' + speedMul + '×'; speedBtn.classList.toggle('on', speedMul === 2); speedBtn.setAttribute('aria-pressed', String(speedMul === 2)); }
  speedBtn.onclick = toggleSpeed;
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === '1') pickType('basic'); else if (k === '2') pickType('rapid'); else if (k === '3') pickType('sniper'); else if (k === '4') pickType('frost');
    else if (k === ' ' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); startWave(); }
    else if (k === 'f') toggleSpeed();
    else if (k === 'u') upgrade();
    else if (k === 's' && sel) sell();
    else if (k === 'escape') closePanel();
  });

  function setMap(i) {
    mapIdx = (i + MAPS.length) % MAPS.length; buildPath();
    try { localStorage.setItem('atd_map', mapIdx); best = +localStorage.getItem(bestKey()) || 0; } catch (_) {}
    mapBtn.textContent = 'MAP: ' + MAPS[mapIdx].name;
    G = fresh(); lastHud = ''; closePanel(); hud();
  }
  mapBtn.onclick = () => { if (G.wave === 1 && !G.waveActive) { setMap(mapIdx + 1); toast('MAP ' + MAPS[mapIdx].name, MAPS[mapIdx].hp > 1 ? 'longer path · tougher enemies' : 'the classic'); } };
  mapBtn.textContent = 'MAP: ' + MAPS[mapIdx].name;
  $('restartBtn').onclick = () => { G = fresh(); lastHud = ''; closePanel(); $('gameOver').classList.remove('show'); pickType('basic'); hud(); };

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000) * speedMul;
    last = now;
    let n = 0;
    while (acc >= 1 / 60 && n < 10) { if (!G.gameOver) step(); acc -= 1 / 60; n++; }
    hud();
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  hud();
  window.__td = { get G() { return G; }, step, TYPES, stat, openPanel, upgrade, sell, startWave, resize };
  requestAnimationFrame(frame);
})();
</script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
