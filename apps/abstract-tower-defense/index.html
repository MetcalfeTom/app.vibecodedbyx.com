<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Abstract Tower Defense — Build Towers, Hold the Core</title>
  <link rel="canonical" href="https://app.sloppy.live/abstract-tower-defense/">
  <meta name="description" content="Build five kinds of neon towers, pick a specialisation for each, and hold the core against shields, splitters, healers and a boss every 10th wave. Three maps to beat.">
  <link rel="icon" href="https://emojicdn.elk.sh/🔺">

  <meta property="og:description" content="Defend with triangles. Destroy the circles. Topple a boss every 10 waves.">
  <meta property="og:url" content="https://app.sloppy.live/abstract-tower-defense/">
  <meta property="og:image" content="https://app.sloppy.live/abstract-tower-defense/og-image.png">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --cyan: #0ff; --mag: #f0f; --yel: #ff0; --grn: #0f0; --vio: #a7f; --bg: #0a0a0f; --line: #1a1a2e; --dim: #8a8a9a; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Orbitron', sans-serif; background: radial-gradient(ellipse at 50% 40%, #10101c 0%, var(--bg) 70%); color: #fff; height: 100vh; height: 100dvh; overflow: hidden; }
    #game-container { display: flex; flex-direction: column; align-items: center; height: 100%; gap: 8px;
      padding: 10px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); } /* keep buttons clear of the iPhone home bar / notch */
    h1 { font-size: 1.15rem; font-weight: 400; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 20px rgba(0,255,255,.5); }
    .hud { display: flex; gap: 26px; font-size: 12px; letter-spacing: 2px; flex-wrap: wrap; justify-content: center; }
    .hud-item { display: flex; align-items: center; gap: 8px; }
    .hud-label { color: var(--dim); }
    .hud-value { color: var(--cyan); text-shadow: 0 0 10px rgba(0,255,255,.5); font-weight: 700; display: inline-block; }
    .hud-value.health { color: var(--mag); text-shadow: 0 0 10px rgba(255,0,255,.5); }
    .hud-value.credits { color: var(--yel); text-shadow: 0 0 10px rgba(255,255,0,.5); }
    .hud-value.best { color: #999; text-shadow: none; }
    .hud-value.bump { animation: bump .35s ease-out; }
    .hud-value.hurt { animation: hurt .5s ease-out; }
    @keyframes bump { 40% { transform: scale(1.35); } }
    @keyframes hurt { 30% { transform: scale(1.5); color: #f33; } }

    .preview { display: flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--dim); min-height: 18px; flex-wrap: wrap; justify-content: center; }
    .preview .pv-w { letter-spacing: 1px; }
    .preview .pv-i { display: inline-flex; align-items: center; gap: 3px; color: #cfd6e6; }
    .preview .pv-i svg { display: block; }
    .preview .pv-boss { color: #ff4466; text-shadow: 0 0 10px rgba(255,34,68,.7); font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; }
    .preview .pv-new { color: var(--yel); font-size: 11px; }

    .stage { position: relative; flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
    #gameCanvas { display: block; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; box-shadow: 0 0 40px rgba(0,255,255,.1); touch-action: manipulation; }
    .hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #9ab;
      background: rgba(10,10,15,.8); border: 1px solid #234; padding: 5px 12px; border-radius: 4px; pointer-events: none; white-space: nowrap; transition: opacity .6s; }
    .hint.gone { opacity: 0; }
    .toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; opacity: 0;
      font-size: clamp(16px, 3.4vw, 26px); letter-spacing: 6px; color: var(--cyan); text-shadow: 0 0 24px rgba(0,255,255,.8); white-space: nowrap; z-index: 4; }
    .toast small { display: block; font-size: .45em; letter-spacing: 3px; color: #f80; text-shadow: 0 0 12px rgba(255,136,0,.8); margin-top: 6px; }
    .toast.big { font-size: clamp(20px, 4.6vw, 36px); font-weight: 900; }
    .toast.boss { color: #ff3355; text-shadow: 0 0 28px rgba(255,40,80,.9); }
    .toast.show { animation: toast 1.9s ease forwards; }
    .toast.show.big { animation: toastBig 2.3s cubic-bezier(.2,.9,.3,1.2) forwards; }
    @keyframes toast { 0% { opacity: 0; letter-spacing: 16px; } 15%, 70% { opacity: 1; letter-spacing: 6px; } 100% { opacity: 0; } }
    @keyframes toastBig { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 24%, 72% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.04); } }

    .bossbar { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: min(460px, 88%); z-index: 3; pointer-events: none; text-align: center; }
    .bossbar .bn { font-size: 11px; letter-spacing: 4px; color: #ff4466; text-shadow: 0 0 12px rgba(255,34,68,.8); margin-bottom: 4px; }
    .bossbar .bb { position: relative; height: 10px; border: 1px solid #ff2244; background: rgba(40,0,10,.75); border-radius: 2px; overflow: hidden; box-shadow: 0 0 16px rgba(255,34,68,.45); }
    .bossbar .bb i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff2244, #ff6680); transition: width .15s linear; }
    .bossbar .bb i.sh { background: rgba(255,255,255,.85); bottom: auto; height: 3px; }
    .bossbar.in { animation: bossIn .6s ease-out; }
    @keyframes bossIn { 0% { opacity: 0; transform: translate(-50%, -14px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

    .card { position: absolute; z-index: 6; left: 50%; top: 14%; transform: translateX(-50%); width: min(360px, 92%); background: rgba(8,10,18,.96); border: 1px solid var(--yel);
      border-radius: 8px; padding: 14px; box-shadow: 0 0 30px rgba(255,255,0,.2), 0 10px 40px rgba(0,0,0,.7); display: grid; grid-template-columns: 52px 1fr; gap: 6px 14px; align-items: center; animation: cardIn .35s cubic-bezier(.2,.9,.3,1.3); }
    .card[hidden] { display: none; }
    .card.low { top: auto; bottom: 12px; }
    .card .ci { grid-row: span 2; width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid #333; border-radius: 50%; background: radial-gradient(circle, rgba(255,40,80,.15), transparent 70%); }
    .card small { display: block; font-size: 10px; letter-spacing: 3px; color: var(--yel); }
    .card b { display: block; font-size: 18px; letter-spacing: 3px; margin-top: 2px; }
    .card p { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #bcc6d6; line-height: 1.35; }
    .card button { grid-column: 1 / -1; min-height: 44px; margin-top: 6px; background: none; border: 1px solid var(--yel); color: var(--yel); border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 3px; cursor: pointer; }
    .card button:hover { background: rgba(255,255,0,.08); }
    @keyframes cardIn { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.94); } }

    .panel { position: absolute; z-index: 5; min-width: 184px; max-width: min(264px, 92vw); background: rgba(8,10,18,.95); border: 1px solid var(--pc, var(--cyan)); border-radius: 6px;
      padding: 9px 10px; box-shadow: 0 0 24px rgba(0,0,0,.6), 0 0 14px color-mix(in srgb, var(--pc, #0ff) 35%, transparent); font-family: 'Share Tech Mono', monospace; font-size: 13px; }
    .panel[hidden] { display: none; }
    .panel .ttl { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--pc, var(--cyan)); display: flex; justify-content: space-between; gap: 10px; }
    .panel .stats { color: #9ab; margin: 6px 0 8px; line-height: 1.4; }
    .panel .stats b { color: #fff; font-weight: 400; }
    .panel .stats i { color: var(--grn); font-style: normal; }
    .panel .stats .note { color: var(--pc); }
    .panel .stats .dim { color: #778; }
    .panel .row { display: flex; gap: 6px; }
    .panel button { flex: 1; font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 1px; padding: 7px 6px; min-height: 36px; border-radius: 4px; cursor: pointer; background: none; }
    .panel .up { border: 1px solid var(--grn); color: var(--grn); }
    .panel .up:disabled { border-color: #333; color: #555; cursor: not-allowed; }
    .panel .sell { border: 1px solid #f55; color: #f77; }
    .specs { margin-bottom: 8px; }
    .specs[hidden] { display: none; }
    .specs .sh { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px; color: var(--yel); margin-bottom: 6px; }
    .panel .spec { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; min-height: 48px; margin-bottom: 6px; border: 1px solid color-mix(in srgb, var(--pc) 55%, #222);
      color: #fff; padding: 7px 9px; background: color-mix(in srgb, var(--pc) 6%, transparent); transition: background .15s, box-shadow .15s; }
    .panel .spec * { pointer-events: none; }
    .panel .spec:hover:not(:disabled) { background: color-mix(in srgb, var(--pc) 16%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--pc) 40%, transparent); }
    .panel .spec .sn { font-size: 11px; letter-spacing: 2px; color: var(--pc); font-weight: 700; }
    .panel .spec .sc { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--yel); }
    .panel .spec .sd { grid-column: 1 / -1; font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 0; color: #aab4c4; line-height: 1.3; }
    .panel .spec kbd { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #778; border: 1px solid #334; border-radius: 3px; padding: 0 4px; margin-right: 6px; }
    .panel .spec:disabled { opacity: .45; cursor: not-allowed; }

    .bar { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
    .tower-btn { background: rgba(255,255,255,.03); border: 1px solid #333; border-radius: 8px; padding: 8px 14px; min-height: 48px; min-width: 76px; color: #999; font-family: 'Orbitron', sans-serif;
      font-size: 10px; cursor: pointer; transition: all .2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; }
    .tower-btn .key { position: absolute; top: 3px; left: 6px; font-size: 8px; color: #777; }
    .tower-btn:hover { border-color: var(--tc); color: var(--tc); box-shadow: 0 0 20px color-mix(in srgb, var(--tc) 25%, transparent); }
    .tower-btn.selected { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 10%, transparent); color: var(--tc); }
    .tower-btn.disabled { opacity: .35; }
    .tower-icon { font-size: 18px; line-height: 1; color: var(--tc); }
    .tower-cost { color: var(--yel); font-size: 9px; }
    .controls { display: grid; grid-template-columns: auto auto; grid-template-rows: 1fr 1fr; gap: 6px; }
    .control-btn { background: none; border: 1px solid #333; border-radius: 4px; padding: 6px 14px; min-height: 34px; color: var(--dim); font-family: 'Orbitron', sans-serif; font-size: 10px;
      letter-spacing: 2px; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .control-btn * { pointer-events: none; }
    .control-btn.start { grid-row: span 2; border-color: var(--grn); color: var(--grn); min-width: 150px; font-size: 11px; }
    .control-btn.start:hover:not(:disabled) { background: rgba(0,255,0,.1); box-shadow: 0 0 20px rgba(0,255,0,.3); }
    .control-btn.start:disabled { border-color: #333; color: #777; cursor: default; }
    .control-btn.start.early { border-color: var(--yel); color: var(--yel); animation: earlyGlow 1.4s ease-in-out infinite; }
    .control-btn.start.early b { display: block; font-size: 12px; margin-top: 3px; }
    .control-btn.start.early:hover { background: rgba(255,255,0,.08); }
    @keyframes earlyGlow { 50% { box-shadow: 0 0 18px rgba(255,255,0,.35); } }
    .control-btn.on { border-color: var(--mag); color: var(--mag); box-shadow: 0 0 14px rgba(255,0,255,.3); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 18px; text-align: center; padding: 20px; }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 2rem; color: var(--mag); text-shadow: 0 0 30px rgba(255,0,255,.8); letter-spacing: 8px; }
    .overlay p { color: #888; font-size: 12px; letter-spacing: 2px; }
    .overlay p b { color: var(--cyan); font-size: 1.6em; }
    .overlay button { background: none; border: 2px solid var(--cyan); color: var(--cyan); padding: 15px 40px; min-height: 48px; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 3px; cursor: pointer; }
    .overlay button:hover { background: rgba(0,255,255,.1); box-shadow: 0 0 30px rgba(0,255,255,.5); }
    .mute { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); background: none; border: 1px solid #333; color: #999; border-radius: 4px; width: 44px; height: 44px; font-size: 16px; cursor: pointer; z-index: 7; }

    @media (max-width: 700px) {
      #game-container { gap: 6px; padding: 6px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
      h1 { font-size: .9rem; letter-spacing: 3px; }
      .hud { gap: 12px; font-size: 11px; letter-spacing: 1px; }
      .hud-item { gap: 5px; }
      .preview { font-size: 12px; gap: 8px; }
      .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; max-width: 520px; }
      .tower-btn { padding: 6px 2px; min-width: 0; min-height: 52px; font-size: 10px; letter-spacing: 0; }
      .tower-btn .key { display: none; }
      .tower-cost { font-size: 10px; }
      .controls { grid-column: 1 / -1; display: flex; flex-direction: row; gap: 6px; padding-right: 50px; }
      .control-btn { min-height: 44px; padding: 4px 8px; letter-spacing: 0; flex: 1; }
      .control-btn.start { flex: 1.8; min-width: 0; }
      .control-btn.start.early b { display: inline; margin: 0 0 0 4px; font-size: 11px; }
      .control-btn .mlab { display: none; }
      .hint { font-size: 12px; }
      .panel { font-size: 13px; }
      .panel .row button { min-height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toast.show, .toast.show.big { animation: toast .01s linear forwards; opacity: 1; }
      .hud-value.bump, .hud-value.hurt, .control-btn.start.early, .card, .bossbar.in { animation: none; }
    }

    /* world board: best wave per player per map */
    .hud-world { background: none; border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; margin: -6px -8px; font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; min-height: 44px; }
    .hud-world:hover { border-color: #333; }
    .hud-value.world { color: #fc6; text-shadow: 0 0 10px rgba(255,204,102,.45); }
    .board { width: min(360px, 92vw); font-family: 'Share Tech Mono', monospace; }
    .board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 3px; color: #fc6; border-bottom: 1px solid #332; padding-bottom: 6px; }
    .board-list { list-style: none; margin: 6px 0 0; padding: 0; min-height: 60px; }
    .board-list li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; padding: 4px 6px; font-size: 14px; color: #bbc; text-align: left; }
    .board-list li b { color: var(--cyan); font-weight: 400; }
    .board-list li:first-child { color: #fc6; }
    .board-list li.me { background: rgba(255,0,255,.12); color: #fff; outline: 1px solid rgba(255,0,255,.4); }
    .board-list li.gap { color: #556; justify-content: center; display: block; text-align: center; padding: 0; }
    .board-list .empty { display: block; color: #667; text-align: center; padding: 14px 0; }
    .board-msg { min-height: 1.2em; margin-top: 8px; color: #9ab !important; letter-spacing: 1px !important; font-family: 'Share Tech Mono', monospace; }
    .board-name { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
    .board-name[hidden] { display: none; }
    @media (max-width: 380px) { .hud { gap: 7px; letter-spacing: 0; } }
    @media (max-width: 700px) { .hud { gap: 10px; } .hud-world { padding: 6px 4px; margin: -6px -4px; } .hud-world .hud-label { font-size: 0; letter-spacing: 0; } .hud-world .hud-label::before { content: '🏆'; font-size: 12px; } }
    .overlay { overflow-y: auto; }
    @media (max-height: 760px) { .overlay { justify-content: flex-start; gap: 10px; } .overlay h2 { font-size: 1.4rem; } .board-list li { padding: 2px 6px; font-size: 13px; } }
    .board-name input { flex: 1; min-width: 0; min-height: 44px; background: #05050a; border: 1px solid #444; color: #fff; padding: 0 10px; font: 16px 'Share Tech Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
    .board-name input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
    .overlay .board-name button { padding: 0 16px; min-height: 44px; }
    .board-tabs { display: flex; gap: 6px; justify-content: center; }
    .overlay .board-tabs button { padding: 0 12px; min-height: 44px; font-size: 10px; letter-spacing: 2px; border-color: #334; color: #889; }
    .overlay .board-tabs button[aria-selected="true"] { border-color: #fc6; color: #fc6; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "VideoGame", "name": "Abstract Tower Defense", "description": "Build five kinds of neon towers, pick a specialisation for each, and hold the core against shields, splitters, healers and a boss every 10th wave. Three maps to beat.", "url": "https://app.sloppy.live/abstract-tower-defense/", "image": "https://app.sloppy.live/abstract-tower-defense/og-image.png", "isAccessibleForFree": true, "inLanguage": "en", "gamePlatform": "Web browser", "genre": "Tower defense"}</script>

<body>
  <div id="game-container">
    <h1>ABSTRACT DEFENSE</h1>
    <div class="hud" aria-live="off">
      <div class="hud-item"><span class="hud-label">WAVE</span><span class="hud-value" id="wave">1</span></div>
      <div class="hud-item"><span class="hud-label">CORE</span><span class="hud-value health" id="health">20</span></div>
      <div class="hud-item"><span class="hud-label">CREDITS</span><span class="hud-value credits" id="credits">250</span></div>
      <div class="hud-item"><span class="hud-label">BEST</span><span class="hud-value best" id="best">–</span></div>
      <button type="button" class="hud-item hud-world" id="worldBtn" aria-label="World board: the best waves on this map"><span class="hud-label">WORLD</span><span class="hud-value world" id="world">–</span></button>
    </div>
    <div class="preview" id="preview" aria-label="Next wave"></div>

    <div class="stage" id="stage">
      <canvas id="gameCanvas" aria-label="Battlefield: tap dark space to build, tap a tower to upgrade or sell it"></canvas>
      <div class="hint" id="hint">tap dark space to build · tap a tower to upgrade</div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="bossbar" id="bossBar" hidden><div class="bn" id="bossName">BOSS</div><div class="bb"><i id="bossHp" style="width:100%"></i><i class="sh" id="bossSh" style="width:0"></i></div></div>
      <div class="card" id="card" role="dialog" aria-labelledby="cardName" hidden>
        <div class="ci" id="cardIcon"></div>
        <div><small>NEW ENEMY</small><b id="cardName">RUNNER</b></div>
        <p id="cardText"></p>
        <button id="cardBtn">GOT IT</button>
      </div>
      <div class="panel" id="panel" hidden>
        <div class="ttl"><span id="pName">BASIC</span><span id="pLvl">LV 1</span></div>
        <div class="stats" id="pStats"></div>
        <div class="specs" id="pSpecs" hidden>
          <div class="sh">CHOOSE A PATH · LV 4</div>
          <button class="spec" id="pA"><span class="sn"><kbd>A</kbd><span class="snt">TWIN</span></span><span class="sc">0c</span><span class="sd">…</span></button>
          <button class="spec" id="pB"><span class="sn"><kbd>B</kbd><span class="snt">OVERCHARGE</span></span><span class="sc">0c</span><span class="sd">…</span></button>
        </div>
        <div class="row"><button class="up" id="pUp">UPGRADE</button><button class="sell" id="pSell">SELL</button></div>
      </div>
    </div>

    <div class="bar">
      <button class="tower-btn selected" data-tower="basic" style="--tc:#0ff"><span class="key">1</span><span class="tower-icon">▲</span><span>BASIC</span><span class="tower-cost">50c</span></button>
      <button class="tower-btn" data-tower="rapid" style="--tc:#0f0"><span class="key">2</span><span class="tower-icon">▲▲</span><span>RAPID</span><span class="tower-cost">100c</span></button>
      <button class="tower-btn" data-tower="sniper" style="--tc:#f0f"><span class="key">3</span><span class="tower-icon">◆</span><span>SNIPER</span><span class="tower-cost">150c</span></button>
      <button class="tower-btn" data-tower="frost" style="--tc:#6cf"><span class="key">4</span><span class="tower-icon">⬢</span><span>FROST</span><span class="tower-cost">120c</span></button>
      <button class="tower-btn" data-tower="splash" style="--tc:#a7f"><span class="key">5</span><span class="tower-icon">◉</span><span>SPLASH</span><span class="tower-cost">140c</span></button>
      <div class="controls">
        <button class="control-btn start" id="startWave">START WAVE</button>
        <button class="control-btn" id="speedBtn" aria-pressed="false">SPEED 1×</button>
        <button class="control-btn" id="mapBtn" title="Change map (before wave 1)"><span class="mlab">MAP: </span><span id="mapName">S-BEND</span></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="gameOver" role="dialog" aria-labelledby="goTitle">
    <h2 id="goTitle">SYSTEM FAILURE</h2>
    <p>WAVES SURVIVED <b id="finalWave">0</b></p>
    <p id="goStats"></p>
    <p id="bestLine"></p>
    <div class="board" id="goBoard" hidden>
      <div class="board-head"><span>WORLD BOARD</span><span id="goBoardMap"></span></div>
      <ol class="board-list" id="goList"></ol>
      <form class="board-name" id="nameForm" hidden>
        <label class="sr-only" for="nameIn">Your callsign</label>
        <input id="nameIn" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="CALLSIGN">
        <button type="submit">POST</button>
      </form>
      <p class="board-msg" id="goMsg" aria-live="polite"></p>
    </div>
    <button id="restartBtn">REINITIALIZE</button>
  </div>
  <div class="overlay" id="boardDlg" role="dialog" aria-modal="true" aria-labelledby="bdTitle">
    <h2 id="bdTitle" style="color:#fc6;text-shadow:0 0 30px rgba(255,204,102,.6)">WORLD BOARD</h2>
    <div class="board-tabs" role="tablist" id="bdTabs"></div>
    <div class="board"><ol class="board-list" id="bdList"></ol><p class="board-msg" id="bdMsg" aria-live="polite"></p></div>
    <button id="bdClose">BACK TO THE GRID</button>
  </div>
  <button class="mute" id="muteBtn" aria-label="Mute sound" aria-pressed="false">🔊</button>

<script>
(() => {
  // ---------- world: fixed 800×500, scaled to fit, so towers and the path never drift apart ----------
  const W = 800, H = 500;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
  let RM = mqRM.matches;
  const PHONE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
  let PMUL = 1, MAXP = 420;
  function motionPrefs() { PMUL = RM ? 0.35 : PHONE ? 0.6 : 1; MAXP = RM ? 100 : PHONE ? 220 : 420; }
  motionPrefs();
  try { mqRM.addEventListener('change', (e) => { RM = e.matches; motionPrefs(); }); } catch (_) {}
  let scale = 1, rot = false;
  // tall phone screens get the board turned 90°, so the path runs top → bottom and fills the screen
  function resize() {
    const r = stage.getBoundingClientRect();
    const flatFit = Math.min(r.width / W, r.height / H), tallFit = Math.min(r.width / H, r.height / W);
    rot = tallFit > flatFit * 1.15;
    scale = Math.min(rot ? tallFit : flatFit, 1100 / W);
    const cw = (rot ? H : W) * scale, ch = (rot ? W : H) * scale;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const k = scale * dpr;
    if (rot) ctx.setTransform(0, k, -k, 0, H * k, 0); // world (x,y) → screen (H−y, x)
    else ctx.setTransform(k, 0, 0, k, 0, 0);
    if (sel) placePanel();
  }
  const toCss = (x, y) => (rot ? [(H - y) * scale, x * scale] : [x * scale, y * scale]);
  function label(text, x, y) { // text stays upright even on the turned board
    if (!rot) return ctx.fillText(text, x, y);
    ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2); ctx.fillText(text, 0, 0); ctx.restore();
  }

  const MAPS = [
    { name: 'S-BEND', hp: 1, path: [[0, 150], [200, 150], [200, 350], [400, 350], [400, 150], [600, 150], [600, 350], [800, 350]] },
    { name: 'BOLT', hp: 1.1, path: [[0, 70], [320, 70], [320, 430], [520, 430], [520, 170], [800, 170]] },
    { name: 'SPIRAL', hp: 1.5, path: [[0, 60], [740, 60], [740, 440], [60, 440], [60, 200], [560, 200], [560, 320], [300, 320]] },
  ];
  let mapIdx = 0;
  try { mapIdx = Math.min(MAPS.length - 1, Math.max(0, +localStorage.getItem('atd_map') || 0)); } catch (_) {}
  let PATH, SEGS, PATH_LEN, EXIT;
  function buildPath() {
    PATH = MAPS[mapIdx].path; SEGS = []; PATH_LEN = 0; EXIT = PATH[PATH.length - 1];
    for (let i = 0; i < PATH.length - 1; i++) {
      const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1], len = Math.hypot(x2 - x1, y2 - y1);
      SEGS.push({ x1, y1, x2, y2, len, at: PATH_LEN });
      PATH_LEN += len;
    }
  }
  buildPath();
  function pointAt(d) {
    if (d <= 0) return PATH[0].slice();
    for (const s of SEGS) if (d <= s.at + s.len) { const t = (d - s.at) / s.len; return [s.x1 + (s.x2 - s.x1) * t, s.y1 + (s.y2 - s.y1) * t]; }
    return PATH[PATH.length - 1].slice();
  }

  // ---------- towers ----------
  const TYPES = {
    basic:  { name: 'BASIC',  range: 110, dmg: 1,    rate: 36,  color: '#00ffff', cost: 50,  speed: 9 },
    rapid:  { name: 'RAPID',  range: 90,  dmg: 0.5,  rate: 12,  color: '#00ff00', cost: 100, speed: 11 },
    sniper: { name: 'SNIPER', range: 210, dmg: 3.5,  rate: 110, color: '#ff00ff', cost: 150, beam: true },
    frost:  { name: 'FROST',  range: 85,  dmg: 0.3,  rate: 45,  color: '#66ccff', cost: 120, pulse: true },
    splash: { name: 'SPLASH', range: 125, dmg: 1.5,  rate: 84,  color: '#aa77ff', cost: 140, shell: true, blast: 44 },
  };
  const ORDER = ['basic', 'rapid', 'sniper', 'frost', 'splash'];
  // LV3 → LV4 is a choice between two specialisations
  const SPECS = {
    basic:  { a: { name: 'TWIN', desc: 'fires two bolts at the two leading enemies' }, b: { name: 'OVERCHARGE', desc: 'every 3rd bolt is a charged shot: triple damage' } },
    rapid:  { a: { name: 'SHRED', desc: 'hits strip armour (up to +30% damage taken) and deal triple damage to shields' }, b: { name: 'CHAIN', desc: 'every bolt arcs to 2 more enemies for 60%' } },
    sniper: { a: { name: 'PIERCE', desc: 'the beam goes through every enemy in a long line' }, b: { name: 'EXECUTE', desc: 'finishes off enemies under 20% health; bosses take double' } },
    frost:  { a: { name: 'FREEZE', desc: 'every 3rd pulse freezes enemies solid for a moment' }, b: { name: 'BRITTLE', desc: 'chilled enemies take +30% damage from every tower' } },
    splash: { a: { name: 'CLUSTER', desc: 'each shell scatters 4 bomblets around the blast' }, b: { name: 'NAPALM', desc: 'shells leave a burning patch for 3 seconds' } },
  };
  const MAX_LV = 4;
  const stat = (t) => { const b = TYPES[t.type], k = t.lv - 1; return { range: b.range * Math.pow(1.1, k), dmg: b.dmg * Math.pow(1.45, k), rate: Math.round(b.rate * Math.pow(0.88, k)) }; };
  const slowOf = (t) => Math.min(0.6, 0.35 + 0.1 * (t.lv - 1)); // frost: 35/45/55/60% slower
  const blastOf = (t) => TYPES.splash.blast * (1 + 0.07 * (t.lv - 1));
  const upCost = (t) => Math.round(TYPES[t.type].cost * (t.lv >= 3 ? TUNE.spec : 0.7 * t.lv));
  const sellValue = (t) => Math.round(t.spent * 0.6);

  // ---------- enemies ----------
  const DOTC = ['#ff0033', '#ff3366', '#ff1a1a'];
  const KINDS = {
    dot:      { hpK: 1,    spK: 1,    gap: 40,  core: 1, rw: 1 },
    runner:   { hpK: 0.55, spK: 1.7,  gap: 26,  core: 1, rw: 1,   r: 7,  color: '#ffff00' },
    tank:     { hpK: 6,    spK: 0.55, gap: 70,  core: 3, rw: 5,   r: 18, color: '#ff8800' },
    shield:   { hpK: 0.8,  spK: 0.9,  gap: 44,  core: 1, rw: 1.6, r: 12, color: '#ff3366', shK: 1 },
    splitter: { hpK: 1.2,  spK: 0.95, gap: 44,  core: 1, rw: 1.2, r: 13, color: '#ff4fd8' },
    mini:     { hpK: 0.35, spK: 1.35, gap: 20,  core: 1, rw: 0.3, r: 6,  color: '#ff4fd8' },
    healer:   { hpK: 1.4,  spK: 0.85, gap: 50,  core: 1, rw: 2,   r: 12, color: '#ff9ecf' },
    boss:     { hpK: 16,   spK: 0.36, gap: 120, core: 10, rw: 30, r: 26, color: '#ff2244' },
  };
  const CARDS = {
    runner:   ['RUNNER', 'Small and fast. Rapid and frost towers keep up with it.'],
    tank:     ['TANK', 'Six times the armour and slow. Costs 3 core if it gets through.'],
    shield:   ['SHIELDED', 'The white hexagon soaks hits before its health. Rapid SHRED rips shields apart.'],
    splitter: ['SPLITTER', 'Pops into two fast little pieces. Splash towers love the cleanup.'],
    healer:   ['HEALER', 'Pulses to heal everything around it. Kill it first: snipers reach it from afar.'],
    boss:     ['BOSS', 'Every 10th wave. Watch its bar up top: it takes 10 core if it reaches the end.'],
  };
  const BOSSES = ['MONOLITH', 'CARAPACE', 'BROODMOTHER', 'NULL CROWN'];
  const bossName = (w) => { const t = Math.max(1, Math.round(w / 10)); return BOSSES[(t - 1) % BOSSES.length] + (t > BOSSES.length ? ' ' + 'I'.repeat(Math.ceil(t / BOSSES.length)) : ''); };
  // balance knobs (tuned with a greedy bot through window.__td.TUNE)
  const TUNE = { hp0: 2, hp1: 1.6, hpq: 0.2, hpx: 1.06, hpxFrom: 12, rw0: 8, rw1: 1.5, rwKnee: 6, rw2: 0.5, clear: 25, spec: 2.2 };
  const hpBase = (w) => (TUNE.hp0 + TUNE.hp1 * w) * (1 + Math.max(0, w - 6) * TUNE.hpq) * Math.pow(TUNE.hpx, Math.max(0, w - TUNE.hpxFrom)) * MAPS[mapIdx].hp;
  const rewardAt = (w) => TUNE.rw0 + TUNE.rw1 * Math.min(w, TUNE.rwKnee) + TUNE.rw2 * Math.max(0, w - TUNE.rwKnee);
  const gapMul = (w) => Math.max(0.65, 1 - 0.012 * w);

  // ---------- state ----------
  let G, sel = null, ghost = null, speedMul = 1, tick = 0;
  let best = 0;
  const bestKey = () => mapIdx ? 'atd_best_' + MAPS[mapIdx].name : 'atd_best';
  try { best = +localStorage.getItem(bestKey()) || 0; } catch (_) {}
  function fresh() {
    return { wave: 1, health: 20, credits: 250, waveActive: false, gameOver: false, selType: G ? G.selType : 'basic',
             towers: [], enemies: [], shots: [], shells: [], fires: [], zaps: [], beams: [], rings: [], parts: [], floats: [],
             queue: [], spawnT: 0, owed: 0, boss: null, kills: 0, steps: 0 };
  }
  G = fresh();

  const $ = (id) => document.getElementById(id);
  const waveEl = $('wave'), healthEl = $('health'), creditsEl = $('credits'), bestEl = $('best');
  const startBtn = $('startWave'), mapBtn = $('mapBtn'), speedBtn = $('speedBtn'), panel = $('panel'), hint = $('hint'), toastEl = $('toast');
  const previewEl = $('preview'), bossBar = $('bossBar'), bossHpEl = $('bossHp'), bossShEl = $('bossSh'), card = $('card');
  const towerBtns = document.querySelectorAll('.tower-btn');

  function anim(el, cls) { if (RM) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  const earlyBonus = () => { let s = 0, n = 0; for (const e of G.enemies) { if (n++ >= 12) break; s += e.reward; } return Math.round(s * 0.3); };
  const canCallEarly = () => G.waveActive && !G.queue.length && G.enemies.length > 0 && !G.gameOver;
  let lastHud = '';
  function hud() {
    const eb = canCallEarly() ? earlyBonus() : -1, left = G.queue.length + G.enemies.length;
    const k = G.wave + '|' + G.health + '|' + G.credits + '|' + best + '|' + G.waveActive + '|' + eb + '|' + (eb < 0 && G.waveActive ? left : 0);
    if (k === lastHud) return;
    const [w0, h0, c0] = lastHud.split('|');
    lastHud = k;
    waveEl.textContent = G.wave;
    healthEl.textContent = G.health;
    creditsEl.textContent = G.credits;
    bestEl.textContent = best || '–';
    if (h0 && +h0 > G.health) anim(healthEl, 'hurt');
    if (c0 && +c0 < G.credits) anim(creditsEl, 'bump');
    if (w0 && +w0 !== G.wave) anim(waveEl, 'bump');
    towerBtns.forEach((b) => b.classList.toggle('disabled', G.credits < TYPES[b.dataset.tower].cost));
    if (!G.waveActive) { startBtn.textContent = 'START WAVE'; startBtn.disabled = G.gameOver; startBtn.classList.remove('early'); }
    else if (eb >= 0) { startBtn.innerHTML = 'CALL EARLY <b>+' + eb + 'c</b>'; startBtn.disabled = false; startBtn.classList.add('early'); }
    else { startBtn.textContent = 'WAVE ' + G.wave + ' · ' + left + ' LEFT'; startBtn.disabled = true; startBtn.classList.remove('early'); }
    startBtn.title = eb >= 0 ? 'Start the next wave now for bonus credits (Space)' : 'Start wave (Space)';
    mapBtn.disabled = !(G.wave === 1 && !G.waveActive);
    preview(G.waveActive ? G.wave + 1 : G.wave);
    if (sel) drawPanel();
  }
  function toast(big, small, cls) {
    toastEl.innerHTML = big + (small ? `<small>${small}</small>` : '');
    toastEl.className = 'toast' + (cls ? ' ' + cls : '');
    void toastEl.offsetWidth; toastEl.classList.add('show');
  }

  // ---------- wave preview strip (inline SVG icons match the canvas shapes) ----------
  const ICOL = { dot: '#ff1a3a', runner: '#ffff00', tank: '#ff8800', shield: '#ff3366', splitter: '#ff4fd8', healer: '#ff9ecf', boss: '#ff2244' };
  const hexPath = (cx, cy, r) => { let d = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1); } return d + 'Z'; };
  function icon(k, s) {
    const c = ICOL[k] || ICOL.dot; let g;
    if (k === 'runner') g = `<path d="M1.5 8H8" stroke="${c}" stroke-opacity=".45" stroke-width="2.4"/><circle cx="10.5" cy="8" r="3.6" fill="${c}"/>`;
    else if (k === 'tank') g = `<circle cx="8" cy="8" r="7" fill="${c}"/><circle cx="8" cy="8" r="3.6" fill="none" stroke="#0a0a0f" stroke-width="1.6"/>`;
    else if (k === 'shield') g = `<circle cx="8" cy="8" r="4" fill="${c}"/><path d="${hexPath(8, 8, 7)}" fill="none" stroke="#ffffff" stroke-width="1.3"/>`;
    else if (k === 'splitter') g = `<path d="M7 2.2A5.8 5.8 0 0 0 7 13.8Z" fill="${c}"/><path d="M9 2.2A5.8 5.8 0 0 1 9 13.8Z" fill="${c}"/>`;
    else if (k === 'healer') g = `<circle cx="8" cy="8" r="6.6" fill="${c}"/><path d="M8 4.4V11.6M4.4 8H11.6" stroke="#0a0a0f" stroke-width="2.2"/>`;
    else if (k === 'boss') g = `<path d="M8 .8L15.2 8L8 15.2L.8 8Z" fill="${c}"/><circle cx="8" cy="8" r="3" fill="#0a0a0f"/>`;
    else g = `<circle cx="8" cy="8" r="5.6" fill="${c}"/>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">${g}</svg>`;
  }
  const PV_ORDER = ['dot', 'runner', 'shield', 'splitter', 'healer', 'tank'];
  const PV_NAME = { dot: 'drones', runner: 'runners', shield: 'shielded', splitter: 'splitters', healer: 'healers', tank: 'tanks' };
  let lastPv = 0;
  function preview(w) {
    if (w === lastPv) return;
    lastPv = w;
    const c = {}; for (const k of buildWave(w)) c[k] = (c[k] || 0) + 1;
    let h = `<span class="pv-w">NEXT · W${w}</span>`, said = [];
    for (const k of PV_ORDER) if (c[k]) { h += `<span class="pv-i" title="${PV_NAME[k]}">${icon(k, 14)}${c[k]}</span>`; said.push(c[k] + ' ' + PV_NAME[k]); }
    if (c.boss) { h += `<span class="pv-i pv-boss">${icon('boss', 16)}${bossName(w)}</span>`; said.push('boss ' + bossName(w)); }
    const nu = Object.keys(c).filter((k) => CARDS[k] && !seen.has(k) && !metRun.has(k));
    if (nu.length) h += '<span class="pv-new">NEW!</span>';
    previewEl.innerHTML = h;
    previewEl.setAttribute('aria-label', 'Next wave ' + w + ': ' + said.join(', '));
  }

  // ---------- sound ----------
  const au = { ac: null, muted: false, last: {} };
  try { au.muted = localStorage.getItem('atd_muted') === '1'; } catch (_) {}
  function audio() {
    if (!au.ac) {
      try {
        au.ac = new (window.AudioContext || window.webkitAudioContext)();
        au.out = au.ac.createGain(); au.out.gain.value = au.muted ? 0 : 0.5;
        const comp = au.ac.createDynamicsCompressor(); au.out.connect(comp).connect(au.ac.destination); // stacked booms never clip
      } catch (_) {}
    } else if (au.ac.state !== 'running') au.ac.resume?.();
  }
  function gate(key, gapMs) { if (!key) return true; const now = performance.now(); if (now - (au.last[key] || 0) < (gapMs || 60)) return false; au.last[key] = now; return true; }
  function tone(f1, f2, len, type, vol, key, gapMs) {
    if (!au.ac || au.muted || !gate(key, gapMs)) return;
    const t = au.ac.currentTime, o = au.ac.createOscillator(), g = au.ac.createGain(), v = 0.94 + Math.random() * 0.12;
    o.type = type; o.frequency.setValueAtTime(f1 * v, t); o.frequency.exponentialRampToValueAtTime(f2 * v, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(au.out); o.start(t); o.stop(t + len + 0.02);
  }
  function noise(len, vol, f1, f2, key, gapMs) {
    if (!au.ac || au.muted || !gate(key, gapMs)) return;
    if (!au.nb) { const n = au.ac.sampleRate; au.nb = au.ac.createBuffer(1, n, au.ac.sampleRate); const d = au.nb.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
    const t = au.ac.currentTime, s = au.ac.createBufferSource(), f = au.ac.createBiquadFilter(), g = au.ac.createGain();
    s.buffer = au.nb; f.type = 'lowpass'; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f).connect(g).connect(au.out); s.start(t); s.stop(t + len + 0.02);
  }
  const later = (ms, fn) => setTimeout(fn, ms);
  const SND = {
    basic: () => tone(880, 440, 0.07, 'square', 0.05, 'basic', 70),
    rapid: () => tone(1400, 900, 0.035, 'square', 0.03, 'rapid', 55),
    sniper: () => tone(2400, 200, 0.22, 'sawtooth', 0.07, 'sniper', 90),
    frost: () => tone(520, 1560, 0.16, 'triangle', 0.05, 'frost', 90),
    freeze: () => { tone(1800, 2700, 0.22, 'triangle', 0.06, 'freeze', 120); noise(0.18, 0.05, 6000, 2000, 'frz', 120); },
    splash: () => tone(170, 80, 0.14, 'triangle', 0.1, 'splash', 90),
    boom: () => { noise(0.28, 0.16, 1600, 90, 'boom', 70); tone(110, 40, 0.22, 'sine', 0.12, 'thump', 70); },
    zap: () => tone(2200, 600, 0.06, 'sawtooth', 0.03, 'zap', 70),
    exec: () => tone(300, 1900, 0.1, 'square', 0.05, 'exec', 90),
    shieldBreak: () => { tone(1900, 500, 0.14, 'square', 0.05, 'shb', 70); noise(0.1, 0.06, 8000, 3000, 'shbn', 70); },
    heal: () => tone(660, 990, 0.22, 'sine', 0.045, 'heal', 220),
    pop: () => tone(520, 1300, 0.08, 'triangle', 0.08, 'pop', 40),
    leak: () => { tone(140, 60, 0.35, 'sawtooth', 0.14, 'leak', 150); noise(0.3, 0.12, 900, 60, 'leakn', 150); },
    build: () => tone(300, 900, 0.12, 'triangle', 0.1),
    up: () => { tone(500, 1000, 0.1, 'triangle', 0.1); later(90, () => tone(750, 1500, 0.14, 'triangle', 0.1)); },
    spec: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => later(i * 55, () => tone(f, f * 1.5, 0.16, 'triangle', 0.08))); },
    wave: () => { tone(220, 440, 0.25, 'sawtooth', 0.06); later(160, () => tone(330, 660, 0.3, 'sawtooth', 0.06)); },
    early: () => { tone(700, 1400, 0.09, 'square', 0.05); later(80, () => tone(1050, 2100, 0.12, 'square', 0.05)); },
    clear: () => { [523, 659, 784, 1047].forEach((f, i) => later(i * 90, () => tone(f, f, 0.28, 'triangle', 0.07))); },
    card: () => { tone(880, 1320, 0.12, 'triangle', 0.07); later(110, () => tone(1320, 1320, 0.16, 'triangle', 0.06)); },
    boss: () => { tone(90, 180, 0.55, 'sawtooth', 0.1); later(500, () => tone(90, 180, 0.55, 'sawtooth', 0.1)); later(1000, () => tone(70, 50, 0.8, 'sawtooth', 0.12)); },
    bossDown: () => { noise(1.1, 0.35, 3000, 50); tone(420, 38, 1.1, 'sawtooth', 0.13); later(300, () => SND.clear()); },

    const nx = (v) => (n ? ` <i>→ ${v}</i>` : '');
    panel.style.setProperty('--pc', b.color);
    $('pName').textContent = b.name + (sp ? ' · ' + sp.name : '');
    $('pLvl').textContent = 'LV ' + t.lv + (t.lv === MAX_LV ? ' MAX' : '');
    let h = `DMG <b>${s.dmg.toFixed(1)}</b>${nx(n && n.dmg.toFixed(1))} · RNG <b>${Math.round(s.range)}</b><br>`;
    if (b.pulse) h += `SLOW <b>${Math.round(slowOf(t) * 100)}%</b>${nx(n && Math.round(slowOf({ lv: t.lv + 1 }) * 100) + '%')} · PULSE <b>${rate(s)}</b>`;
    else if (b.shell) h += `AREA <b>${Math.round(blastOf(t))}</b> · FIRE <b>${rate(s)}</b><br><span class="note">+30% vs chilled enemies</span>`;
    else h += `FIRE <b>${rate(s)}</b>${nx(n && rate(n))}`;
    if (sp) h += `<br><span class="note">${sp.desc}</span>`;
    h += `<br><span class="dim">DAMAGE DEALT ${fmt(t.dealt || 0)}</span>`;
    $('pStats').innerHTML = h;
    const choose = t.lv === MAX_LV - 1, c = upCost(t);
    pSpecs.hidden = !choose; pUp.hidden = choose;
    if (choose) {
      for (const [btn, key] of [[pA, 'a'], [pB, 'b']]) {
        const o = SPECS[t.type][key];
        btn.querySelector('.snt').textContent = o.name;
        btn.querySelector('.sd').textContent = o.desc;
        btn.querySelector('.sc').textContent = c + 'c';
        btn.disabled = G.credits < c;
      }
    } else if (t.lv >= MAX_LV) { pUp.textContent = 'MAXED'; pUp.disabled = true; }
    else { pUp.textContent = 'UPGRADE ' + c + 'c'; pUp.disabled = G.credits < c; }
    $('pSell').textContent = 'SELL +' + sellValue(t) + 'c';
  }
  function placePanel() {
    const cr = canvas.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const pw = panel.offsetWidth || 190, ph = panel.offsetHeight || 100;
    const [tx, ty] = toCss(sel.x, sel.y);
    let x = cr.left - sr.left + tx + 26, y = cr.top - sr.top + ty - ph / 2;
    if (x + pw > sr.width - 4) x = cr.left - sr.left + tx - pw - 26;
    x = Math.max(4, Math.min(x, sr.width - pw - 4));
    y = Math.max(4, Math.min(y, sr.height - ph - 4));
    panel.style.left = x + 'px'; panel.style.top = y + 'px';
  }
  function levelUp(t) {
    if (!t || t.lv >= MAX_LV - 1 || G.credits < upCost(t)) return false;
    const c = upCost(t);
    G.credits -= c; t.spent += c; t.lv++;
    burst(t.x, t.y, TYPES[t.type].color, 18); ring(t.x, t.y, 34, TYPES[t.type].color, 16, 2);
    return true;
  }
  function specialise(t, key) {
    if (!t || t.lv !== MAX_LV - 1 || (key !== 'a' && key !== 'b') || G.credits < upCost(t)) return false;
    const c = upCost(t), col = TYPES[t.type].color;
    G.credits -= c; t.spent += c; t.lv = MAX_LV; t.spec = key;
    burst(t.x, t.y, col, 30, 4); burst(t.x, t.y, '#ffffff', 10, 3);
    ring(t.x, t.y, 50, col, 22, 3); ring(t.x, t.y, 80, '#ffffff', 28, 1.5);
    G.floats.push({ x: t.x, y: t.y - 26, text: SPECS[t.type][key].name, life: 60, color: col });
    return true;
  }
  function upgrade() {
    if (!sel) return;
    if (sel.lv === MAX_LV - 1) { anim(pSpecs, 'bump'); return; }
    if (!levelUp(sel)) return;
    SND.up(); hud(); drawPanel(); placePanel();
  }
  function chooseSpec(key) {
    if (!specialise(sel, key)) return;
    SND.spec(); hud(); drawPanel(); placePanel();
  }
  function sell() {
    if (!sel) return;
    G.credits += sellValue(sel);
    burst(sel.x, sel.y, '#ffff00', 12);
    G.towers.splice(G.towers.indexOf(sel), 1);
    closePanel(); hud();
  }
  pUp.onclick = upgrade;
  pA.onclick = () => chooseSpec('a');
  pB.onclick = () => chooseSpec('b');
  $('pSell').onclick = sell;

  function pickType(type) {
    G.selType = type;
    towerBtns.forEach((b) => b.classList.toggle('selected', b.dataset.tower === type));
    closePanel();
  }
  towerBtns.forEach((b) => b.addEventListener('click', () => pickType(b.dataset.tower)));
  startBtn.onclick = go;
  function toggleSpeed() { speedMul = speedMul >= 3 ? 1 : speedMul + 1; speedBtn.textContent = 'SPEED ' + speedMul + '×'; speedBtn.classList.toggle('on', speedMul > 1); speedBtn.setAttribute('aria-pressed', String(speedMul > 1)); }
  speedBtn.onclick = toggleSpeed;
  // mouse/tap clicks don't park focus on a button, so Space still means START WAVE afterwards
  // (it used to re-press the last clicked button: another UPGRADE, or MAP again, wiping the towers). Tab focus still works.
  document.querySelectorAll('.bar button, .panel button, .card button, #muteBtn').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return; // Ctrl+S / Ctrl+F are the browser's, not SELL / SPEED
    const k = e.key.toLowerCase();
    if (boardOpen) { if (k === 'escape') bdClose(); return; }
    if (cardOpen) { if (k === ' ' || k === 'enter' || k === 'escape') { e.preventDefault(); nextCard(); } return; }
    const n = ORDER[+k - 1];
    if (n && k >= '1' && k <= '5') pickType(n);
    else if (k === ' ' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); go(); }
    else if (k === 'f') toggleSpeed();
    else if (k === 'u') upgrade();
    else if ((k === 'a' || k === 'b') && sel) chooseSpec(k);
    else if (k === 's' && sel) sell();
    else if (k === 'm') toggleMute();
    else if (k === 'escape') closePanel();
  });

  function setMap(i) {
    mapIdx = (i + MAPS.length) % MAPS.length; buildPath();
    try { localStorage.setItem('atd_map', mapIdx); best = +localStorage.getItem(bestKey()) || 0; } catch (_) {}
    $('mapName').textContent = MAPS[mapIdx].name;
    G = fresh(); lastHud = ''; lastPv = 0; metRun.clear(); closePanel(); hud();
    worldTop();
  }
  mapBtn.onclick = () => { if (G.wave === 1 && !G.waveActive) { setMap(mapIdx + 1); toast('MAP ' + MAPS[mapIdx].name, MAPS[mapIdx].hp > 1 ? 'longer path · tougher enemies' : 'the classic'); } };
  $('mapName').textContent = MAPS[mapIdx].name;
  $('restartBtn').onclick = () => { G = fresh(); lastHud = ''; lastPv = 0; metRun.clear(); closePanel(); bossBar.hidden = true; $('gameOver').classList.remove('show'); $('goBoard').hidden = true; pickType('basic'); hud(); };


  // ---------- world board: each player's best wave per map, in supabase atd_scores ----------
  let dbP = null, me = null, boardOpen = false, pendingRun = null, bdMap = 0;
  const getDb = () => dbP || (dbP = window.__atdDb ? Promise.resolve(window.__atdDb)
    : import('/supabase-config.js').then(m => ({ db: m.default, session: m.supabaseSession })));
  async function whoAmI() {
    if (me) return me;
    const { session } = await getDb();
    const { user } = await session();
    const md = (user && user.user_metadata) || {};
    const tw = user && !user.is_anonymous ? cleanName(md.preferred_username || md.nickname || md.name || md.full_name) : '';
    return (me = { id: user && user.id, twitch: tw });
  }
  const cleanName = s => String(s || '').replace(/[^\w .\-]/g, '').trim().slice(0, 16);
  const storedName = () => { try { return cleanName(localStorage.getItem('atd_name')); } catch (_) { return ''; } };
  // only waves a real game can reach: every wave takes a few seconds of play, even called early
  const okRow = r => r && Number.isInteger(r.wave) && r.wave >= 1 && r.wave <= 300 && Number.isInteger(r.secs) && r.wave <= r.secs / 4 + 3;
  async function fetchBoard(map) {
    const { db } = await getDb();
    const { data, error } = await db.from('atd_scores').select('wave, kills, towers, secs, name, user_id, created_at')
      .eq('map', map).order('wave', { ascending: false }).order('created_at', { ascending: true }).limit(300);
    if (error) throw error;
    const seen = new Set(), rows = [];
    for (const r of data || []) { if (!okRow(r) || seen.has(r.user_id)) continue; seen.add(r.user_id); rows.push(r); }
    return rows;
  }
  function renderBoard(list, rows, myId) {
    list.textContent = '';
    if (!rows.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'NO ONE YET. BE THE FIRST.'; list.appendChild(li); return; }
    const mine = rows.findIndex(r => r.user_id && r.user_id === myId);
    const show = rows.slice(0, 10).map((r, i) => [r, i]);
    if (mine >= 10) show.push(null, [rows[mine], mine]);
    for (const x of show) {
      const li = document.createElement('li');
      if (!x) { li.className = 'gap'; li.textContent = '···'; list.appendChild(li); continue; }
      const [r, i] = x;
      if (i === mine) li.className = 'me';
      const rank = document.createElement('span'), nm = document.createElement('span'), wv = document.createElement('b');
      rank.textContent = '#' + (i + 1);
      nm.textContent = cleanName(r.name) || 'ANON';
      wv.textContent = 'WAVE ' + r.wave;
      li.append(rank, nm, wv);
      li.setAttribute('aria-label', 'Rank ' + (i + 1) + ', ' + nm.textContent + ', wave ' + r.wave + (i === mine ? ', you' : ''));
      list.appendChild(li);
    }
  }
  async function postRun(run, name) {
    const { db } = await getDb();
    const u = await whoAmI();
    if (!u.id) throw new Error('no session');
    const { error } = await db.from('atd_scores').insert([{ ...run, name, user_id: u.id }]);
    if (error) throw error;
    try { localStorage.setItem('atd_posted_' + run.map, run.wave); } catch (_) {}
  }
  const postedBest = map => { try { return +localStorage.getItem('atd_posted_' + map) || 0; } catch (_) { return 0; } };
  let goSeq = 0;
  async function boardOnGameOver(survived) {
    const my = ++goSeq, map = MAPS[mapIdx].name;
    const run = { map, wave: survived, kills: G.kills, towers: G.towers.length, secs: Math.round(G.steps / 60) };
    const msg = $('goMsg'), list = $('goList'), form = $('nameForm');
    $('goBoard').hidden = false;
    $('goBoardMap').textContent = map;
    form.hidden = true;
    pendingRun = null;
    list.textContent = '';
    msg.textContent = 'CONNECTING…';
    const worth = survived >= 3 && survived > postedBest(map) && okRow(run);
    try {
      const u = await whoAmI();
      if (my !== goSeq) return;
      const name = u.twitch || storedName();
      if (worth && name) { await postRun(run, name); msg.textContent = 'POSTED AS ' + name.toUpperCase(); }
      else if (worth) { pendingRun = run; form.hidden = false; msg.textContent = 'NAME YOURSELF TO POST WAVE ' + survived; }
      else msg.textContent = survived < 3 ? 'SURVIVE 3 WAVES TO MAKE THE BOARD' : 'YOUR POSTED BEST HERE: WAVE ' + postedBest(map);
      const rows = await fetchBoard(map);
      if (my !== goSeq) return;
      renderBoard(list, rows, u.id);
      worldShow(map, rows);
    } catch (e) { if (my === goSeq) msg.textContent = 'WORLD BOARD OFFLINE. YOUR RUN STILL COUNTS HERE.'; }
  }
  $('nameForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = cleanName($('nameIn').value);
    if (!name) { $('goMsg').textContent = 'LETTERS OR NUMBERS, PLEASE'; $('nameIn').focus(); return; }
    if (!pendingRun) return;
    const run = pendingRun, btn = $('nameForm').querySelector('button');
    btn.disabled = true;
    try {
      await postRun(run, name);
      try { localStorage.setItem('atd_name', name); } catch (_) {}
      pendingRun = null;
      $('nameForm').hidden = true;
      $('goMsg').textContent = 'POSTED AS ' + name.toUpperCase();
      const rows = await fetchBoard(run.map);
      renderBoard($('goList'), rows, me && me.id);
      worldShow(run.map, rows);
      $('restartBtn').focus();
    } catch (err) { $('goMsg').textContent = 'COULD NOT POST. TRY AGAIN IN A MOMENT.'; }
    btn.disabled = false;
  });
  // the HUD's WORLD number: the record on the map you are playing
  function worldShow(map, rows) { if (map === MAPS[mapIdx].name) $('world').textContent = rows.length ? rows[0].wave : '–'; }
  function worldTop() { const map = MAPS[mapIdx].name; fetchBoard(map).then(rows => worldShow(map, rows), () => {}); }
  function bdLoad(i) {
    bdMap = i;
    [...$('bdTabs').children].forEach((b, k) => b.setAttribute('aria-selected', k === i));
    const map = MAPS[i].name;
    $('bdList').textContent = '';
    $('bdMsg').textContent = 'CONNECTING…';
    Promise.all([fetchBoard(map), whoAmI()]).then(([rows, u]) => {
      if (bdMap !== i) return;
      renderBoard($('bdList'), rows, u.id);
      worldShow(map, rows);
      const pb = postedBest(map);
      $('bdMsg').textContent = pb ? 'YOUR POSTED BEST: WAVE ' + pb : 'SURVIVE 3 WAVES TO GET ON IT';
    }, () => { if (bdMap === i) $('bdMsg').textContent = 'WORLD BOARD OFFLINE'; });
  }
  MAPS.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.textContent = m.name;
    b.onclick = () => bdLoad(i);
    $('bdTabs').appendChild(b);
  });
  function bdOpen() {
    if (G.gameOver) return;
    boardOpen = true;
    $('boardDlg').classList.add('show');
    bdLoad(mapIdx);
    $('bdClose').focus();
  }
  function bdClose() { boardOpen = false; $('boardDlg').classList.remove('show'); $('worldBtn').focus(); }
  $('worldBtn').onclick = bdOpen;
  $('bdClose').onclick = bdClose;
  $('boardDlg').addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); bdClose(); } }, true);
  worldTop();

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (slowmo > 0) slowmo--;
    acc += dt * speedMul * (slowmo > 0 ? 0.3 : 1);
    let n = 0;
    while (acc >= 1 / 60 && n < 12) { if (!G.gameOver && !cardOpen && !boardOpen && !api.hold) step(); acc -= 1 / 60; n++; }
    if (acc > 0.2) acc = 0;
    hud();
    if (G.boss) { bossHpEl.style.width = (100 * Math.max(0, G.boss.hp / G.boss.max)).toFixed(1) + '%'; bossShEl.style.width = (G.boss.shMax ? 100 * G.boss.sh / G.boss.shMax : 0).toFixed(1) + '%'; }
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  hud();
  const api = {
    get G() { return G; }, step, TYPES, SPECS, KINDS, stat, openPanel, upgrade, sell, startWave, callEarly, go, resize, build, canPlace, onPath,
    levelUp, specialise, chooseSpec, upCost, TUNE, buildWave, earlyBonus, canCallEarly, pointAt, setMap, hpBase,
    draw, get PATH_LEN() { return PATH_LEN; }, get map() { return mapIdx; }, get cardOpen() { return cardOpen; },
    noCards() { cardsOff = true; cardQ = []; card.hidden = true; cardOpen = false; }, hold: false, W, H, gameOver, bdOpen, okRow,
  };
  window.__td = api;
  requestAnimationFrame(frame);
})();
</script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
