<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Watching World · the game was abandoned. something stayed.</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%91%81">
  <meta name="description" content="Explore the dark rooms of an abandoned game world. The eyes in the walls don't watch your character — they watch your cursor. They watch YOU.">
  <meta property="og:title" content="The Watching World — it knows where your mouse is">
  <meta property="og:description" content="An abandoned game. Empty corridors. Eyes that track your cursor from the darkness. Find the one that's dreaming all of it.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/giant%20eye%20in%20darkness%20abandoned%20video%20game%20corridor%20glitch%20dark%20liminal%20horror%20poster?width=1200&height=630&seed=1313&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/watching-world">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root{ --void:#050508; --ink:#c8c4d4; --dim:#5a5668; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--void); color:var(--ink);
      font:400 1rem/1.5 'IBM Plex Mono', monospace;
      display:flex; flex-direction:column; align-items:center;
      padding:1.2rem 1rem 2.5rem;
    }
    header{ text-align:center; margin-bottom:0.7rem; }
    h1{ font:400 clamp(1.6rem,5.5vw,2.4rem)/1.15 'Cormorant Garamond', serif; margin:0; letter-spacing:0.14em; }
    .tag{ font-size:0.68rem; color:var(--dim); margin:0.25rem 0 0; font-style:italic; }
    .stage{ position:relative; width:min(56rem,96vw); border:1px solid #1a1826; border-radius:8px; overflow:hidden; }
    canvas{ display:block; width:100%; height:auto; aspect-ratio:900/560; cursor:none; }
    .hud{
      display:flex; gap:1rem; justify-content:center; font-size:0.66rem; color:var(--dim); margin-top:0.6rem; flex-wrap:wrap;
    }
    .hud b{ color:var(--ink); }
    .touchrow{ display:none; gap:0.5rem; width:min(56rem,96vw); margin-top:0.6rem; }
    .touchrow button{ flex:1; min-height:3.2rem; font:400 1rem 'IBM Plex Mono', monospace; background:#0d0c14; color:var(--ink); border:1px solid #26243a; border-radius:8px; touch-action:none; }
    @media (pointer:coarse){ .touchrow{ display:flex; } canvas{ cursor:default; } }
    .foot{ margin-top:0.6rem; font-size:0.64rem; color:var(--dim); text-align:center; max-width:40rem; }
    .foot kbd{ background:#0d0c14; border:1px solid #26243a; border-radius:4px; padding:0.05rem 0.35rem; }
    @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>THE WATCHING WORLD</h1>
    <p class="tag">the game was abandoned years ago. the servers stayed on. something in here still renders.</p>
  </header>
  <div class="stage">
    <canvas id="cv" width="900" height="560" role="application"
      aria-label="A dark abandoned game world. Move with WASD or arrow keys. Your mouse cursor is a small light — and the eyes in the walls follow it, not your character. Find the room where the great eye waits."></canvas>
  </div>
  <div class="hud">
    <span id="hRoom">—</span>
    <span>eyes met <b id="hEyes">0</b></span>
    <span id="hSound">🔇 <kbd>M</kbd> for sound</span>
  </div>
  <div class="touchrow">
    <button id="tstick" type="button">◈ DRAG TO WALK</button>
  </div>
  <p class="foot"><kbd>WASD</kbd>/<kbd>←↑↓→</kbd> walk · the cursor is your other light · the eyes do not watch the character. they watch the cursor. they watch you.</p>
  <p id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

  <script>
  (function(){
    'use strict';
    var W=900, H=560;
    var cv=document.getElementById('cv'), X=cv.getContext('2d');
    var $=function(id){ return document.getElementById(id); };
    var reduceMotion=false;
    try{ reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

    /* ═══ the abandoned world: rooms as wall rectangles on a 2700×1680 map ═══ */
    var MW=2700, MH=1680;
    var WALLS=[
      // outer shell
      {x:0,y:0,w:MW,h:40},{x:0,y:MH-40,w:MW,h:40},{x:0,y:0,w:40,h:MH},{x:MW-40,y:0,w:40,h:MH},
      // spawn hall (NW) → corridor east
      {x:40,y:520,w:560,h:40},{x:760,y:520,w:200,h:40},{x:40,y:40,w:0,h:0},
      {x:560,y:40,w:40,h:280},{x:560,y:440,w:40,h:120},
      // arcade (NE quadrant)
      {x:960,y:40,w:40,h:340},{x:960,y:500,w:40,h:60},{x:960,y:520,w:640,h:40},
      {x:1720,y:520,w:400,h:40},{x:2120,y:40,w:40,h:520},
      // plaza (center) borders
      {x:600,y:960,w:460,h:40},{x:1200,y:960,w:400,h:40},
      {x:560,y:560,w:40,h:180},{x:560,y:860,w:40,h:140},
      {x:1600,y:560,w:40,h:200},{x:1600,y:880,w:40,h:120},
      // library (SW)
      {x:40,y:960,w:420,h:40},{x:560,y:1000,w:40,h:280},{x:560,y:1400,w:40,h:240},
      {x:200,y:1160,w:240,h:30},{x:200,y:1320,w:240,h:30},{x:200,y:1480,w:240,h:30},
      // the pit (SE) jagged blocks
      {x:1600,y:1000,w:40,h:240},{x:1600,y:1360,w:40,h:280},
      {x:1800,y:1160,w:120,h:120},{x:2080,y:1300,w:160,h:100},{x:1900,y:1480,w:120,h:80},
      // observatory (E) — the great eye's room
      {x:2160,y:560,w:40,h:300},{x:2160,y:1000,w:40,h:300},
      // arcade cabinets
      {x:1100,y:150,w:80,h:60},{x:1240,y:150,w:80,h:60},{x:1380,y:150,w:80,h:60},{x:1520,y:150,w:80,h:60},
      // plaza fountain (dry)
      {x:1040,y:700,w:140,h:100},
    ];
    var ROOMS=[
      {x:40,y:40,w:520,h:480, n:'the spawn hall', sub:'the tutorial sign has nothing left to teach'},
      {x:1000,y:40,w:1120,h:480, n:'the arcade', sub:'four cabinets. every high score is yours now.'},
      {x:600,y:560,w:1000,h:400, n:'the plaza', sub:'the fountain ran out of particles'},
      {x:40,y:1000,w:520,h:640, n:'the library', sub:'debug text drifts like dust'},
      {x:1640,y:1000,w:1020,h:640, n:'the pit', sub:'textures were never assigned here'},
      {x:2200,y:560,w:460,h:440, n:'the observatory', sub:'it has been waiting for a cursor'},
    ];
    /* small eyes embedded in walls: {x,y,r, open, blink} — pupils track the MOUSE */
    var EYES=[
      {x:600,y:300,r:16},{x:300,y:540,r:13},{x:980,y:420,r:15},{x:1300,y:540,r:14},
      {x:1620,y:700,r:16},{x:580,y:1100,r:14},{x:440,y:1180,r:12},{x:1140,y:980,r:15},
      {x:1820,y:1140,r:16},{x:2100,y:1280,r:13},{x:2180,y:800,r:17},{x:1060,y:820,r:12},
      {x:2140,y:300,r:15},{x:340,y:980,r:13},{x:1680,y:1400,r:14},
    ];
    EYES.forEach(function(e){ e.open=0; e.met=false; e.blink=Math.random()*6; });
    /* ── the library's floating memories: nostalgic dev fragments that fade
       when approached — you can read them from across the room, but walk
       toward one and it withdraws like a thing half-remembered. ── */
    var FRAGMENTS=[
      '// day one: everything is possible',
      "// sarah's idea. it worked!!",
      'v0.1 changelog: added jumping. felt like flying.',
      '// placeholder music: steve\'s demo tape (it stayed)',
      'TODO(old): give the npc a name — maybe Ollie?',
      '// the fountain looked better in the mockup. love it anyway',
      '// remember to thank the beta testers',
      'note: players keep hugging the walls. leave the walls.',
      '// this function is ugly and I am proud of it',
      '// last commit before launch. deep breath.',
      'idea (3am): what if the world missed us back',
      '// ship it',
    ].map(function(t,i){
      return { t:t, x:120+(i%3)*160+((i*37)%60), y:1060+Math.floor(i/3)*140+((i*53)%50), ph:i*1.3, a:0 };
    });
    /* THE great eye */
    var GREAT={x:2430,y:780,r:85,open:0,dilate:0,closed:false,closing:0};

    var P={ x:300, y:300, vx:0, vy:0, spd:170 };
    var mouse={ x:W/2, y:H/2, wx:300, wy:300 };            // screen + world coords
    var cam={ x:0, y:0 };
    var eyesMet=0, ended=false;

    /* ── audio: drone + whispers, gesture-gated ── */
    var AC=null, muted=true, droneG=null;
    function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
    function startDrone(){
      if(!ac()||droneG) return;
      droneG=AC.createGain(); droneG.gain.value=0;
      droneG.gain.setTargetAtTime(0.05, AC.currentTime, 1.5);
      [41.2,55,82.4].forEach(function(f,i){
        var o=AC.createOscillator(), g=AC.createGain();
        o.type=i===1?'triangle':'sine'; o.frequency.value=f;
        var lfo=AC.createOscillator(), lg=AC.createGain();
        lfo.frequency.value=0.05+i*0.03; lg.gain.value=f*0.01;
        lfo.connect(lg); lg.connect(o.frequency);
        g.gain.value=[0.5,0.3,0.2][i];
        o.connect(g); g.connect(droneG);
        o.start(); lfo.start();
      });
      var flt=AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=240;
      droneG.connect(flt); flt.connect(AC.destination);
    }
    function whisper(){
      if(muted||!AC) return;
      var t=AC.currentTime;
      var len=Math.floor(AC.sampleRate*0.5), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*i/len),2);
      var s=AC.createBufferSource(); s.buffer=b;
      var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400+Math.random()*1800; f.Q.value=3;
      var g=AC.createGain();
      g.gain.setValueAtTime(0.0008,t); g.gain.linearRampToValueAtTime(0.035,t+0.1);
      g.gain.exponentialRampToValueAtTime(0.0008,t+0.5);
      s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
    }
    document.addEventListener('keydown',function(e){
      if(e.key==='m'||e.key==='M'){
        muted=!muted;
        if(!muted){ startDrone(); if(droneG) droneG.gain.setTargetAtTime(0.05,AC.currentTime,0.5); $('hSound').textContent='🔊 the hum of an empty server'; }
        else { if(droneG) droneG.gain.setTargetAtTime(0,AC.currentTime,0.3); $('hSound').innerHTML='🔇 <kbd>M</kbd> for sound'; }
      }
    });

    /* ── input ── */
    var keys={};
    document.addEventListener('keydown',function(e){
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){ keys[e.code]=true; e.preventDefault(); }
    });
    document.addEventListener('keyup',function(e){ keys[e.code]=false; });
    cv.addEventListener('pointermove',function(e){
      var r=cv.getBoundingClientRect();
      mouse.x=(e.clientX-r.left)*(W/r.width);
      mouse.y=(e.clientY-r.top)*(H/r.height);
    });
    var stick=$('tstick'), tin={on:false,tx:0,ty:0};
    stick.addEventListener('pointerdown',function(e){ this.setPointerCapture(e.pointerId); tin.on=true; this._sx=e.clientX; this._sy=e.clientY; });
    stick.addEventListener('pointermove',function(e){ if(!tin.on) return; tin.tx=Math.max(-1,Math.min(1,(e.clientX-this._sx)/40)); tin.ty=Math.max(-1,Math.min(1,(e.clientY-this._sy)/40)); });
    stick.addEventListener('pointerup',function(){ tin.on=false; tin.tx=0; tin.ty=0; });

    function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
    var curRoom=null;
    function step(dt){
      if(ended) return;
      var mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+(tin.on?tin.tx:0);
      var my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+(tin.on?tin.ty:0);
      var l=Math.hypot(mx,my)||1;
      P.x+=mx/l*P.spd*dt*Math.min(1,Math.hypot(mx,my));
      var box={x:P.x-10,y:P.y-10,w:20,h:20};
      for(var i=0;i<WALLS.length;i++){ var wl=WALLS[i]; if(wl.w&&hit(box,wl)){ P.x = mx>0 ? wl.x-10 : wl.x+wl.w+10; box.x=P.x-10; } }
      P.y+=my/l*P.spd*dt*Math.min(1,Math.hypot(mx,my));
      box={x:P.x-10,y:P.y-10,w:20,h:20};
      for(var j=0;j<WALLS.length;j++){ var wl2=WALLS[j]; if(wl2.w&&hit(box,wl2)){ P.y = my>0 ? wl2.y-10 : wl2.y+wl2.h+10; box.y=P.y-10; } }
      P.x=Math.max(50,Math.min(MW-50,P.x)); P.y=Math.max(50,Math.min(MH-50,P.y));
      /* camera follows player */
      cam.x+=((P.x-W/2)-cam.x)*Math.min(1,dt*4);
      cam.y+=((P.y-H/2)-cam.y)*Math.min(1,dt*4);
      cam.x=Math.max(0,Math.min(MW-W,cam.x)); cam.y=Math.max(0,Math.min(MH-H,cam.y));
      mouse.wx=mouse.x+cam.x; mouse.wy=mouse.y+cam.y;
      /* room detection */
      var rNow=null;
      for(var r=0;r<ROOMS.length;r++){ var rm=ROOMS[r]; if(P.x>rm.x&&P.x<rm.x+rm.w&&P.y>rm.y&&P.y<rm.y+rm.h) rNow=rm; }
      if(rNow&&rNow!==curRoom){ curRoom=rNow; $('hRoom').textContent=rNow.n; $('live').textContent=rNow.n+' — '+rNow.sub; }
      /* small eyes: open when the CURSOR is near-ish but close when it comes too close */
      EYES.forEach(function(e){
        var d=Math.hypot(mouse.wx-e.x, mouse.wy-e.y);
        var want=(d<420&&d>90)?1:0;                        // skittish: stared at too directly, they shut
        e.open+=(want-e.open)*Math.min(1,dt*3);
        e.blink-=dt;
        if(e.blink<0){ e.blink=3+Math.random()*5; e.open*=0.1; }
        if(want>0.5&&!e.met){ e.met=true; eyesMet++; $('hEyes').textContent=eyesMet; whisper(); }
      });
      /* library fragments: visible from afar, withdrawing when approached */
      FRAGMENTS.forEach(function(fr){
        var dP=Math.hypot(P.x-fr.x, P.y-fr.y);
        var dC=Math.hypot(mouse.wx-fr.x, mouse.wy-fr.y);
        var d=Math.min(dP,dC);
        var want=d>150 ? 0.38 : 0.38*Math.max(0,(d-40)/110);   // gone by 40px, full past 150px
        fr.a+=(want-fr.a)*Math.min(1,dt*2.5);                   // gentle, unhurried fade
      });
      /* the great eye: opens with proximity, dilates as cursor nears its center */
      var gd=Math.hypot(P.x-GREAT.x, P.y-GREAT.y);
      var gWant=gd<520?1:0;
      GREAT.open+=(gWant-GREAT.open)*Math.min(1,dt*1.2);
      var cd=Math.hypot(mouse.wx-GREAT.x, mouse.wy-GREAT.y);
      GREAT.dilate+=((cd<300?1-cd/300:0)-GREAT.dilate)*Math.min(1,dt*3);
      if(!GREAT.closed&&GREAT.open>0.8&&cd<GREAT.r*0.5){
        GREAT.closed=true;
        $('live').textContent='You touched the great eye with your cursor. It closes. The world can finally stop rendering.';
        whisper(); setTimeout(whisper,300); setTimeout(whisper,700);
        setTimeout(function(){ ended=true; },2400);
      }
      if(GREAT.closed) GREAT.closing=Math.min(1,GREAT.closing+dt*0.4);
    }

    /* ── draw ── */
    function drawEye(sx,sy,r,open,px,py,dilate,ghost){
      if(open<0.03) return;
      X.save();
      X.translate(sx,sy);
      var h=r*open;
      X.beginPath(); X.ellipse(0,0,r,h,0,0,6.283);
      X.fillStyle=ghost?'rgba(220,214,232,0.92)':'rgba(200,196,214,0.85)';
      X.fill();
      var a=Math.atan2(py-sy,px-sx);
      var reach=Math.min(r*0.4, Math.hypot(px-sx,py-sy)*0.05);
      var pr=r*(0.32+(dilate||0)*0.22);
      X.beginPath(); X.arc(Math.cos(a)*reach, Math.sin(a)*reach*open, pr*open, 0, 6.283);
      X.fillStyle='#0a0a10'; X.fill();
      X.beginPath(); X.arc(Math.cos(a)*reach-pr*0.25, Math.sin(a)*reach*open-pr*0.25, pr*0.2*open, 0, 6.283);
      X.fillStyle='rgba(255,255,255,0.7)'; X.fill();
      X.restore();
    }
    var t=0;
    function draw(dt){
      t+=dt;
      X.fillStyle='#050508'; X.fillRect(0,0,W,H);
      X.save(); X.translate(-cam.x,-cam.y);
      /* floor: faint grid, missing-texture checker in the pit */
      X.strokeStyle='rgba(60,56,80,0.16)'; X.lineWidth=1;
      var gx0=Math.floor(cam.x/80)*80, gy0=Math.floor(cam.y/80)*80;
      for(var gx=gx0;gx<cam.x+W+80;gx+=80){ X.beginPath(); X.moveTo(gx,cam.y); X.lineTo(gx,cam.y+H); X.stroke(); }
      for(var gy=gy0;gy<cam.y+H+80;gy+=80){ X.beginPath(); X.moveTo(cam.x,gy); X.lineTo(cam.x+W,gy); X.stroke(); }
      for(var cx2=1640;cx2<2660;cx2+=80){ for(var cy2=1000;cy2<1640;cy2+=80){
        if(((cx2+cy2)/80)%2===0){ X.fillStyle='rgba(160,40,160,0.06)'; X.fillRect(cx2,cy2,80,80); } } }
      /* abandoned set dressing */
      X.font='italic 15px "Cormorant Garamond", serif'; X.fillStyle='rgba(140,134,160,0.4)';
      X.fillText('press any key to begin', 160, 200);
      X.fillText('(no key will begin it)', 175, 222);
      X.fillStyle='rgba(140,134,160,0.28)'; X.font='11px "IBM Plex Mono", monospace';
      X.fillText('HIGH SCORE 000000', 1220, 130);
      X.fillText('INSERT COIN — slot removed in patch 1.7', 1150, 320);
      X.fillText('ERR: npc_wave.anim not found', 830, 700);
      X.fillText('TODO: water', 1075, 760);
      X.font='italic 14px "Cormorant Garamond", serif';
      FRAGMENTS.forEach(function(fr){
        if(fr.a<0.01) return;
        X.fillStyle='rgba(168,160,190,'+fr.a+')';
        var fx=fr.x+Math.sin(t*0.3+fr.ph)*7, fy=fr.y+Math.sin(t*0.22+fr.ph*1.7)*5;
        X.fillText(fr.t, fx, fy);
      });
      X.font='11px "IBM Plex Mono", monospace';
      /* frozen NPC in plaza */
      X.fillStyle='rgba(150,146,168,0.5)';
      X.fillRect(880,780,18,34); X.fillRect(884,766,10,12);
      X.fillRect(898,772,12,4);                           // the wave, forever mid-wave
      /* walls */
      for(var i2=0;i2<WALLS.length;i2++){
        var wl3=WALLS[i2]; if(!wl3.w) continue;
        X.fillStyle='#12101c'; X.fillRect(wl3.x,wl3.y,wl3.w,wl3.h);
        X.fillStyle='rgba(90,86,110,0.25)'; X.fillRect(wl3.x,wl3.y,wl3.w,2);
      }
      /* small eyes */
      EYES.forEach(function(e){ drawEye(e.x,e.y,e.r,e.open,mouse.wx,mouse.wy,0,false); });
      /* the great eye */
      if(!ended){
        var gOpen=GREAT.open*(1-GREAT.closing);
        drawEye(GREAT.x,GREAT.y,GREAT.r,gOpen,mouse.wx,mouse.wy,GREAT.dilate,true);
        if(GREAT.open>0.1&&!GREAT.closed){
          X.strokeStyle='rgba(220,214,232,'+(0.12*GREAT.open)+')';
          for(var l2=0;l2<12;l2++){
            var la=l2/12*6.283+t*0.05;
            X.beginPath(); X.moveTo(GREAT.x+Math.cos(la)*(GREAT.r+18), GREAT.y+Math.sin(la)*(GREAT.r*GREAT.open+18));
            X.lineTo(GREAT.x+Math.cos(la)*(GREAT.r+34), GREAT.y+Math.sin(la)*(GREAT.r*GREAT.open+34)); X.stroke();
          }
        }
      }
      /* player */
      X.fillStyle='#c8c4d4'; X.fillRect(P.x-7,P.y-10,14,20);
      X.fillStyle='#050508'; X.fillRect(P.x-3,P.y-6,2,3); X.fillRect(P.x+1,P.y-6,2,3);
      X.restore();
      /* ── darkness: two lights carve it — the player's and the cursor's ── */
      var dk=X.createRadialGradient(P.x-cam.x,P.y-cam.y,30,P.x-cam.x,P.y-cam.y,190);
      dk.addColorStop(0,'rgba(5,5,8,0)'); dk.addColorStop(1,'rgba(5,5,8,0.97)');
      X.fillStyle=dk; X.fillRect(0,0,W,H);
      var mk=X.createRadialGradient(mouse.x,mouse.y,6,mouse.x,mouse.y,110);
      X.save(); X.globalCompositeOperation='destination-out';
      mk.addColorStop(0,'rgba(0,0,0,0.5)'); mk.addColorStop(1,'rgba(0,0,0,0)');
      X.fillStyle=mk;
      X.beginPath(); X.arc(mouse.x,mouse.y,110,0,6.283); X.fill();
      X.restore();
      /* cursor: a tiny watched dot */
      X.beginPath(); X.arc(mouse.x,mouse.y,3,0,6.283);
      X.fillStyle='rgba(230,226,240,0.9)'; X.fill();
      X.beginPath(); X.arc(mouse.x,mouse.y,7,0,6.283);
      X.strokeStyle='rgba(230,226,240,0.3)'; X.stroke();
      if(ended){
        X.fillStyle='rgba(5,5,8,0.86)'; X.fillRect(0,0,W,H);
        X.fillStyle='#c8c4d4'; X.textAlign='center';
        X.font='italic 30px "Cormorant Garamond", serif';
        X.fillText('the world stopped watching.', W/2, H/2-16);
        X.font='13px "IBM Plex Mono", monospace';
        X.fillStyle='#5a5668';
        X.fillText('you met '+eyesMet+' of '+EYES.length+' eyes on the way · you can go now · (or refresh, and be watched again)', W/2, H/2+22);
        X.textAlign='left';
      }
    }
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/1000,0.05); last=now;
      step(dt); draw(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__ww={ P:P, mouse:mouse, EYES:EYES, GREAT:GREAT, step:step, ROOMS:ROOMS, eyesMet:function(){return eyesMet;}, ended:function(){return ended;}, keys:keys, FRAGMENTS:FRAGMENTS };
  })();
  </script>
