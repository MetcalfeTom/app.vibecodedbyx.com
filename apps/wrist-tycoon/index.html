<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wrist Tycoon · an empire on a watch face</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%E2%8C%9A">
  <meta name="description" content="A business tycoon that lives on a watch face: add ventures with hourly rates and watch your net worth climb every tick of the second hand.">
  <meta property="og:title" content="Wrist Tycoon — your empire, at a glance">
  <meta property="og:description" content="Add businesses, set hourly rates, and watch the income counter climb live on an elegant watch face.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/luxury%20smartwatch%20face%20gold%20numerals%20rising%20money%20counter%20dark%20elegant%20product%20photo?width=1200&height=630&seed=8899&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/wrist-tycoon">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root{ --strap:#14110c; --case:#2a251c; --face:#0d0b07; --gold:#d4af5a; --ink:#efe8d8; --dim:#8a8168; --up:#6ec98a; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--strap); color:var(--ink);
      font:400 1rem/1.55 'IBM Plex Mono', monospace;
      display:flex; flex-direction:column; align-items:center;
      padding:1.6rem 1rem 3rem;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 40px, rgba(212,175,90,0.02) 40px 41px),
        radial-gradient(ellipse 40rem 20rem at 50% -6%, rgba(212,175,90,0.06), transparent 60%);
    }
    header{ text-align:center; margin-bottom:1.1rem; }
    h1{ font:400 clamp(1.7rem,6vw,2.5rem)/1 'Marcellus', serif; color:var(--gold); margin:0; letter-spacing:0.08em; }
    .tag{ font-size:0.72rem; color:var(--dim); margin:0.3rem 0 0; }
    /* the watch */
    .watch{ position:relative; margin:0.4rem 0 1.2rem; }
    .band{ position:absolute; left:50%; transform:translateX(-50%); width:7.5rem; height:4rem; background:linear-gradient(90deg,#0d0b07,#1c1812,#0d0b07); border:1px solid #322c20; }
    .band.top{ bottom:100%; border-radius:1rem 1rem 0 0; }
    .band.bot{ top:100%; border-radius:0 0 1rem 1rem; }
    .case{
      position:relative; width:min(21rem,84vw); aspect-ratio:1;
      border-radius:50%; padding:0.8rem;
      background:radial-gradient(circle at 32% 26%, #4a4232, var(--case) 55%, #17130c);
      box-shadow:0 14px 44px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,240,200,0.15);
    }
    .crown{ position:absolute; right:-0.55rem; top:44%; width:0.7rem; height:1.6rem; border-radius:0.25rem; background:linear-gradient(180deg,#4a4232,#241f15); }
    .dial{
      position:relative; width:100%; height:100%; border-radius:50%;
      background:radial-gradient(circle at 50% 34%, #16130b, var(--face) 70%);
      border:2px solid #3c3524;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden; text-align:center;
    }
    .dial::before{
      content:''; position:absolute; inset:6%;
      border-radius:50%; border:1px dashed rgba(212,175,90,0.25);
    }
    .tickring span{
      position:absolute; left:50%; top:50%; width:2px; height:7px; background:rgba(212,175,90,0.5);
      transform-origin:50% 0;
    }
    .clock{ font:300 0.72rem 'IBM Plex Mono', monospace; color:var(--dim); letter-spacing:0.2em; }
    .worth{
      font:500 clamp(1.5rem,6.4vw,2.2rem)/1.1 'IBM Plex Mono', monospace; color:var(--gold);
      margin:0.25rem 0 0.1rem; font-variant-numeric:tabular-nums;
      text-shadow:0 0 18px rgba(212,175,90,0.35);
    }
    .rate{ font-size:0.72rem; color:var(--up); }
    .complication{ font-size:0.62rem; color:var(--dim); margin-top:0.45rem; letter-spacing:0.12em; }
    /* ledger */
    main{ width:min(24rem,94vw); }
    .card{ background:#171410; border:1px solid #322c20; border-radius:10px; padding:1rem 1.1rem; margin-bottom:0.8rem; }
    .card h2{ font:400 0.95rem 'Marcellus', serif; color:var(--gold); margin:0 0 0.6rem; letter-spacing:0.12em; }
    .addrow{ display:flex; gap:0.45rem; flex-wrap:wrap; }
    .addrow input{
      background:var(--face); border:1px solid #322c20; border-radius:6px; color:var(--ink);
      font:400 0.85rem 'IBM Plex Mono', monospace; padding:0.5rem 0.7rem; min-height:2.75rem;
    }
    #bizName{ flex:2; min-width:9rem; }
    #bizRate{ flex:1; min-width:6rem; }
    .addrow input:focus{ outline:none; border-color:var(--gold); }
    .addrow button{
      font:400 0.9rem 'Marcellus', serif; letter-spacing:0.1em; cursor:pointer;
      background:var(--gold); color:var(--face); border:none; border-radius:6px;
      padding:0.5rem 1rem; min-height:2.75rem;
    }
    .addrow button:focus-visible, .biz button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
    .biz{
      display:flex; justify-content:space-between; align-items:center; gap:0.5rem;
      border-top:1px dashed #322c20; padding:0.5rem 0; font-size:0.85rem;
    }
    .biz:first-of-type{ border-top:none; }
    .biz .nm b{ color:var(--ink); font-weight:500; }
    .biz .nm{ color:var(--dim); font-size:0.72rem; }
    .biz .earned{ color:var(--up); font-size:0.72rem; }
    .biz button{
      background:transparent; border:1px solid #4a3a2a; color:var(--dim); border-radius:6px;
      cursor:pointer; font-size:0.7rem; padding:0.3rem 0.6rem; min-height:2.4rem;
    }
    .biz button:hover{ color:#c46a5a; border-color:#c46a5a; }
    .empty{ color:var(--dim); font-style:italic; font-size:0.8rem; }
    .presets{ display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.6rem; }
    .presets button{
      font-size:0.68rem; cursor:pointer; background:transparent; color:var(--dim);
      border:1px dashed #4a3a2a; border-radius:99px; padding:0.3rem 0.7rem; min-height:2.4rem;
    }
    .presets button:hover{ color:var(--gold); border-color:var(--gold); }
    @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } .worth{ text-shadow:none; } }
  </style>
</head>
<body>
  <header>
    <h1>WRIST TYCOON</h1>
    <p class="tag">an empire small enough for a watch face · income climbs with the second hand</p>
  </header>
  <div class="watch">
    <div class="band top" aria-hidden="true"></div>
    <div class="band bot" aria-hidden="true"></div>
    <div class="case">
      <div class="crown" aria-hidden="true"></div>
      <div class="dial" role="status" aria-label="Watch face showing live net worth">
        <div class="tickring" id="ticks" aria-hidden="true"></div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="worth" id="worth">$0.00</div>
        <div class="rate" id="rateLine">＋$0.00/hr</div>
        <div class="complication" id="comp">NO VENTURES · ADD ONE BELOW</div>
      </div>
    </div>
  </div>
  <main>
    <div class="card">
      <h2>FOUND A VENTURE</h2>
      <div class="addrow">
        <label for="bizName" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Business name</label>
        <input id="bizName" maxlength="32" placeholder="artisanal ice cubes">
        <label for="bizRate" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hourly rate in dollars</label>
        <input id="bizRate" inputmode="decimal" placeholder="$/hr">
        <button id="add" type="button">FOUND</button>
      </div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h2>THE PORTFOLIO</h2>
      <div id="ledger"><p class="empty">the wrist is bare. found something.</p></div>
    </div>
  </main>
  <p id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

  <script>
  (function(){
    'use strict';
    var $=function(id){ return document.getElementById(id); };
    /* tick ring */
    for(var i=0;i<60;i++){
      var t=document.createElement('span');
      t.style.transform='rotate('+(i*6)+'deg) translateY(-'+($('ticks').parentNode.clientWidth/2-10||130)+'px)';
      if(i%5===0){ t.style.height='11px'; t.style.background='rgba(212,175,90,0.8)'; }
      $('ticks').appendChild(t);
    }
    var KEY='wrist-tycoon-v1';
    var st={ biz:[], banked:0, bankedAt:Date.now() };   // biz: {n, rate, since}
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.biz) st=s; }catch(e){}
    function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

    function totalRate(){ return st.biz.reduce(function(a,b){ return a+b.rate; },0); }
    function earnedBy(b,now){ return b.rate*(now-b.since)/3600000; }
    function worth(now){
      return st.banked + st.biz.reduce(function(a,b){ return a+earnedBy(b,now); },0);
    }
    function fmt(v){ return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

    function paintLedger(){
      var lg=$('ledger');
      if(!st.biz.length){ lg.innerHTML='<p class="empty">the wrist is bare. found something.</p>'; return; }
      lg.innerHTML='';
      st.biz.forEach(function(b,i){
        var row=document.createElement('div'); row.className='biz';
        var nm=document.createElement('span'); nm.className='nm';
        nm.innerHTML='<b></b><br>'+fmt(b.rate)+'/hr · <span class="earned" id="e'+i+'"></span>';
        nm.querySelector('b').textContent=b.n;
        var del=document.createElement('button'); del.type='button'; del.textContent='divest';
        del.setAttribute('aria-label','Divest '+b.n);
        del.addEventListener('click',function(){
          var now=Date.now();
          st.banked+=earnedBy(b,now);            // earnings honoured on exit
          st.biz.splice(i,1);
          save(); paintLedger();
          $('live').textContent=b.n+' divested. Earnings banked.';
        });
        row.appendChild(nm); row.appendChild(del);
        lg.appendChild(row);
      });
    }
    function addBiz(n,rate){
      if(!n||!(rate>0)||st.biz.length>=12) return;
      st.biz.push({ n:n, rate:rate, since:Date.now() });
      save(); paintLedger();
      $('live').textContent=n+' founded at '+fmt(rate)+' per hour.';
    }
    $('add').addEventListener('click',function(){
      var n=$('bizName').value.trim(), r=parseFloat($('bizRate').value);
      addBiz(n||'unnamed venture', r);
      $('bizName').value=''; $('bizRate').value='';
    });
    $('bizRate').addEventListener('keydown',function(e){ if(e.key==='Enter') $('add').click(); });
    var PRESETS=[['artisanal ice cubes',18],['subscription rock resale',42],['haunted airbnb',120],['pigeon logistics',75],['soup futures',260]];
    PRESETS.forEach(function(p){
      var b=document.createElement('button'); b.type='button'; b.textContent=p[0]+' · $'+p[1]+'/hr';
      b.addEventListener('click',function(){ addBiz(p[0],p[1]); });
      $('presets').appendChild(b);
    });

    /* the climb: rAF so the counter visibly rises every frame */
    function tick(){
      var now=Date.now();
      $('worth').textContent=fmt(worth(now));
      $('rateLine').textContent='＋'+fmt(totalRate())+'/hr · '+fmt(totalRate()/3600)+'/s';
      var d=new Date(now);
      $('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(x){ return String(x).padStart(2,'0'); }).join(':');
      $('comp').textContent=st.biz.length?st.biz.length+' VENTURE'+(st.biz.length===1?'':'S')+' · SINCE '+new Date(Math.min.apply(null,st.biz.map(function(b){return b.since;}))).toLocaleDateString():'NO VENTURES · ADD ONE BELOW';
      st.biz.forEach(function(b,i){ var e=$('e'+i); if(e) e.textContent='earned '+fmt(earnedBy(b,now)); });
      requestAnimationFrame(tick);
    }
    paintLedger();
    requestAnimationFrame(tick);
    setInterval(save,10000);
  })();
  </script>
</body>
</html>
