<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cucumber Court</title>
<meta name="description" content="A tiny chaotic cucumber courtroom: run the courthouse maze, repeat the judge's exhibits from memory, and tap rowdy cucumbers in the jury box. Three modes, silly verdicts.">

<meta property="og:url" content="https://sloppy.live/cucumber-court/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://image.pollinations.ai/prompt/cute%20cartoon%20cucumber%20judge%20with%20a%20white%20wig%20and%20a%20wooden%20gavel%20in%20a%20warm%20wooden%20courtroom%2C%20flat%20vector%20illustration%2C%20playful%2C%20green%20and%20walnut%20brown%20and%20cream?width=1200&height=630&seed=4111&nologo=true&model=flux">
<link rel="icon" href="https://emojicdn.elk.sh/🥒">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Mali:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--wood:#5a3a22;--wood2:#3b2515;--cream:#f6ecd4;--cream2:#e8d9b6;--green:#5da33a;--green2:#2e6b1f;--gold:#e0b04a;--red:#c9432f;--ink:#221a12;--muted:#7a6a55;--white:#fffaf0;
  --display:'Titan One','Arial Black',Impact,sans-serif;--body:'Mali','Comic Sans MS',cursive,sans-serif;}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;min-height:100vh;background:var(--wood);color:var(--cream);font-family:var(--body);line-height:1.45;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 46px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 9px),radial-gradient(900px 500px at 50% -10%,rgba(224,176,74,.22),transparent 60%)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:.4rem}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:var(--ink);padding:.5rem 1rem;z-index:9}
.skip:focus{left:1rem;top:1rem}
main{max-width:40rem;margin:0 auto;padding:1.25rem 1rem 3rem;display:grid;gap:1rem}
header{text-align:center}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,9vw,3.8rem);line-height:1;color:var(--green);text-shadow:0 4px 0 var(--green2),0 8px 0 rgba(0,0,0,.35);letter-spacing:.01em}
header p{margin:.4rem 0 0;font-style:italic;color:var(--cream2)}
.bench{background:var(--cream);color:var(--ink);border-radius:1rem;padding:1rem;box-shadow:0 10px 0 var(--wood2),0 16px 30px rgba(0,0,0,.35);border:3px solid var(--gold)}
h2{margin:0 0 .5rem;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--green2)}
.modes{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.mode{display:grid;justify-items:center;gap:.35rem;padding:.9rem .5rem;min-height:2.75rem;background:var(--white);border:3px solid var(--wood);border-radius:.9rem;font:inherit;color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 5px 0 var(--wood)}
.mode:hover,.mode:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 var(--wood)}
.mode strong{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--green2)}
.mode small{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.25}
.mode svg{width:3.4rem;height:3.4rem}
.btn{min-height:2.75rem;min-width:2.75rem;padding:.4rem .9rem;background:var(--green);color:var(--white);border:0;border-radius:.7rem;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--green2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green2)}
.btn.ghost{background:var(--cream2);color:var(--ink);box-shadow:0 4px 0 #bfae88}
.btn.ghost:active{box-shadow:0 2px 0 #bfae88}
.topbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.hud{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-weight:600;font-size:1rem}
.hud b{color:var(--green2)}
.howto{margin:0 0 .6rem;padding:.5rem .7rem;background:var(--cream2);border-radius:.6rem;font-size:.9rem}
.howto kbd{font-family:ui-monospace,monospace;background:var(--white);border:1px solid #bfae88;border-bottom-width:3px;border-radius:.3rem;padding:0 .35rem;font-size:.85em}
.msg{min-height:1.5em;margin:.5rem 0 0;font-weight:600;color:var(--green2)}
.msg.bad{color:var(--red)}
/* maze */
#maze{display:block;width:100%;max-width:100%;aspect-ratio:1;background:var(--cream2);border-radius:.6rem;border:3px solid var(--wood);touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,2.9rem);grid-template-rows:repeat(2,2.9rem);gap:.3rem;justify-content:center;margin-top:.6rem}
.pad .btn{padding:0;font-size:1.3rem}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
/* memory */
.exhibits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.ex{display:grid;justify-items:center;gap:.2rem;min-height:5rem;padding:.5rem .3rem;background:var(--white);border:3px solid var(--wood);border-radius:.8rem;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .1s,background .1s;box-shadow:0 4px 0 var(--wood)}
.ex svg{width:2.6rem;height:2.6rem}
.ex.lit{background:var(--gold);transform:scale(1.06)}
.ex.good{background:#cfeec0}
.ex.wrong{background:#f4c9c2}
.ex:disabled{cursor:default;opacity:.85}
/* mayhem */
.jury{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;background:var(--wood);padding:.6rem;border-radius:.8rem;border:3px solid var(--wood2)}
.seat{position:relative;min-height:4.4rem;background:#8a5a34;border:0;border-bottom:.45rem solid var(--wood2);border-radius:.6rem .6rem .3rem .3rem;cursor:pointer;padding:0;overflow:hidden}
.seat svg{position:absolute;left:50%;bottom:0;width:3rem;height:3.4rem;transform:translate(-50%,110%);transition:transform .12s}
.seat.cuke svg.c,.seat.judge svg.j{transform:translate(-50%,6%)}
.seat.bonk{background:#b7783f}
.seat .key{position:absolute;left:.3rem;top:.2rem;font-size:.7rem;font-weight:600;color:#e8d9b6;opacity:.8}
.timer{height:.7rem;background:var(--cream2);border-radius:.4rem;overflow:hidden;margin:.5rem 0}
.timer i{display:block;height:100%;background:var(--red);width:100%;transition:width .2s linear}
/* verdict */
.verdict{text-align:center;padding:.6rem}
.verdict .big{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--red);margin:.2rem 0}
.verdict .score{font-size:1.2rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.6rem}
footer{text-align:center;font-size:.8rem;color:var(--cream2)}
#buildstamp{display:block;margin-top:.3rem;font-family:ui-monospace,monospace;font-size:.6rem;opacity:.7}
@media (max-width:30rem){.modes{grid-template-columns:1fr}.mode{grid-template-columns:3.4rem 1fr;justify-items:start;text-align:left}.mode svg{grid-row:span 2}.mode small{text-align:left}}
@media (prefers-reduced-motion:reduce){.mode,.ex,.seat svg{transition:none}}
</style>
</head>

<header>

      <button type="button" class="mode" data-mode="memory"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="16" height="20" rx="3" fill="#fffaf0" stroke="#5a3a22" stroke-width="3"/><rect x="27" y="9" width="16" height="20" rx="3" fill="#e0b04a" stroke="#5a3a22" stroke-width="3"/><rect x="16" y="19" width="16" height="20" rx="3" fill="#5da33a" stroke="#5a3a22" stroke-width="3"/></svg><strong>Memory</strong><small>The judge shows exhibits in order. Repeat them. It gets longer.</small></button>
      <button type="button" class="mode" data-mode="mayhem"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="30" width="36" height="12" rx="3" fill="#8a5a34" stroke="#3b2515" stroke-width="3"/><ellipse cx="16" cy="24" rx="6" ry="10" fill="#5da33a" stroke="#2e6b1f" stroke-width="2"/><ellipse cx="34" cy="26" rx="6" ry="9" fill="#5da33a" stroke="#2e6b1f" stroke-width="2"/><circle cx="14" cy="21" r="1.5" fill="#221a12"/><circle cx="18" cy="21" r="1.5" fill="#221a12"/><circle cx="32" cy="23" r="1.5" fill="#221a12"/><circle cx="36" cy="23" r="1.5" fill="#221a12"/></svg><strong>Mayhem</strong><small>Rowdy cucumbers pop up in the jury box. Tap them. Never tap the judge.</small></button>
    </div>
  </div>

  <div id="play" hidden>
    <div class="topbar">
      <button type="button" class="btn ghost" id="back">← modes</button>
      <div class="hud" id="hud" role="status" aria-live="polite"></div>
    </div>
    <p class="howto" id="howto"></p>
    <div id="mazeWrap" hidden>
      <canvas id="maze" width="440" height="440" role="application" aria-label="Courthouse maze. Move the cucumber with the arrow keys, W A S D, or the on-screen pad. Collect three exhibits and reach the witness stand."></canvas>
      <div class="pad" aria-label="Move" role="group">
        <button type="button" class="btn u" data-d="0,-1" aria-label="Move up">↑</button>
        <button type="button" class="btn l" data-d="-1,0" aria-label="Move left">←</button>
        <button type="button" class="btn d" data-d="0,1" aria-label="Move down">↓</button>
        <button type="button" class="btn r" data-d="1,0" aria-label="Move right">→</button>
      </div>
    </div>
    <div id="memWrap" hidden>
      <div class="exhibits" id="exhibits" role="group" aria-label="Exhibits"></div>
    </div>
    <div id="mayWrap" hidden>
      <div class="timer" aria-hidden="true"><i id="tbar"></i></div>
      <div class="jury" id="jury" role="group" aria-label="Jury box seats"></div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div id="result" class="verdict" hidden>
      <div>The court finds the defendant…</div>
      <div class="big" id="vtext"></div>
      <div class="score" id="vscore"></div>
      <div class="row"><button type="button" class="btn" id="again">play again</button><button type="button" class="btn ghost" id="other">other modes</button></div>
    </div>
  </div>
</section>

<footer>No cucumbers were harmed. Everything here is pretend, including the law.
