<span class="stamp" id="stamp"></span>
<script>
/* ══════════════ tiny-c : a C-subset interpreter (pure, testable) ══════════════
   lexer → Pratt parser → tree-walk evaluator. No dependencies. Values are
   tagged {v:number, f:boolean(isFloat)} so int/float division + printf behave.
   Exposed: runC(source, {stdin}) -> {ok, output, error} */
'use strict';

/* ---------- preprocessor: strip #include, apply simple #define NAME literal ---------- */
function preprocess(src){
  const macros = {};
  const lines = src.split('\n').map(line => {
    const t = line.trim();
    if(t.startsWith('#')){
      const dm = t.match(/^#\s*define\s+([A-Za-z_]\w*)\s+(.+)$/);
      if(dm) macros[dm[1]] = dm[2].trim();
      return ''; // drop all preprocessor lines from token stream
    }
    return line;
  });
  return { text: lines.join('\n'), macros };
}

/* ---------- lexer ---------- */
const KEYWORDS = new Set(['int','char','float','double','long','short','unsigned','signed','void',
  'if','else','while','for','do','return','break','continue','sizeof','const','struct','static']);
const TYPEWORDS = new Set(['int','char','float','double','long','short','unsigned','signed','void','const','static']);

function lex(src, macros){
  const toks = [];
  let i = 0, line = 1;
  const n = src.length;
  const isId = c => /[A-Za-z_]/.test(c);
  const isIdN = c => /[A-Za-z0-9_]/.test(c);
  const isD = c => c >= '0' && c <= '9';
  while(i < n){
    let c = src[i];
    if(c === '\n'){ line++; i++; continue; }
    if(c === ' ' || c === '\t' || c === '\r'){ i++; continue; }
    if(c === '/' && src[i+1] === '/'){ while(i < n && src[i] !== '\n') i++; continue; }
    if(c === '/' && src[i+1] === '*'){ i += 2; while(i < n && !(src[i]==='*'&&src[i+1]==='/')){ if(src[i]==='\n')line++; i++; } i += 2; continue; }
    // number
    if(isD(c) || (c === '.' && isD(src[i+1]))){
      let s = i; let isFloat = false;
      if(c === '0' && (src[i+1] === 'x' || src[i+1] === 'X')){
        i += 2; while(i < n && /[0-9a-fA-F]/.test(src[i])) i++;
        toks.push({ t:'num', v: parseInt(src.slice(s,i),16), f:false, line }); continue;
      }
      while(i < n && isD(src[i])) i++;
      if(src[i] === '.'){ isFloat = true; i++; while(i < n && isD(src[i])) i++; }
      if(src[i] === 'e' || src[i] === 'E'){ isFloat = true; i++; if(src[i]==='+'||src[i]==='-')i++; while(i<n&&isD(src[i]))i++; }
      while(i < n && /[fFlLuU]/.test(src[i])){ if(src[i]==='f'||src[i]==='F') isFloat = true; i++; }
      toks.push({ t:'num', v: isFloat ? parseFloat(src.slice(s,i)) : parseInt(src.slice(s,i),10), f:isFloat, line }); continue;
    }
    // char literal
    if(c === "'"){
      i++; let ch;
      if(src[i] === '\\'){ ch = escChar(src[i+1]); i += 2; }
      else { ch = src.charCodeAt(i); i++; }
      if(src[i] === "'") i++; else throw cerr("unterminated char literal", line);
      toks.push({ t:'num', v:ch, f:false, line }); continue;
    }
    // string literal
    if(c === '"'){
      i++; let s = '';
      while(i < n && src[i] !== '"'){
        if(src[i] === '\\'){ s += String.fromCharCode(escChar(src[i+1])); i += 2; }
        else { s += src[i]; i++; }
      }
      if(src[i] !== '"') throw cerr("unterminated string", line);
      i++; toks.push({ t:'str', v:s, line }); continue;
    }
    // identifier / keyword
    if(isId(c)){
      let s = i; while(i < n && isIdN(src[i])) i++;
      let word = src.slice(s, i);
      if(macros[word] !== undefined){
        // re-lex the macro body inline (numbers/chars/strings/identifiers only)
        const sub = lex(macros[word], {});
        for(const mt of sub){ if(mt.t !== 'eof'){ mt.line = line; toks.push(mt); } }
        continue;
      }
      toks.push({ t: KEYWORDS.has(word) ? 'kw' : 'id', v:word, line }); continue;
    }
    // operators / punctuation (longest match first)
    const three = src.substr(i,3);
    if(['<<=','>>=','...'].includes(three)){ toks.push({t:'op',v:three,line}); i+=3; continue; }
    const two = src.substr(i,2);
    if(['==','!=','<=','>=','&&','||','++','--','+=','-=','*=','/=','%=','&=','|=','^=','<<','>>','->'].includes(two)){
      toks.push({t:'op',v:two,line}); i+=2; continue;
    }
    if('+-*/%=<>!&|^~?:.,;(){}[]'.includes(c)){ toks.push({t:'op',v:c,line}); i++; continue; }
    throw cerr("unexpected character '"+c+"'", line);
  }
  toks.push({ t:'eof', v:'<eof>', line });
  return toks;
}
function escChar(c){
  switch(c){ case 'n':return 10; case 't':return 9; case 'r':return 13; case '0':return 0;
    case '\\':return 92; case "'":return 39; case '"':return 34; case 'a':return 7; case 'b':return 8;
    case 'f':return 12; case 'v':return 11; default: return c.charCodeAt(0); }
}
function cerr(msg, line){ const e = new Error(msg); e.cline = line; e.compile = true; return e; }

/* ---------- parser (Pratt) ---------- */
function parse(toks){
  let p = 0;
  const peek = () => toks[p];
  const next = () => toks[p++];
  const at = (t,v) => toks[p].t === t && (v === undefined || toks[p].v === v);
  const eat = (t,v) => { if(!at(t,v)) throw cerr("expected "+(v||t)+" but got '"+peek().v+"'", peek().line); return next(); };
  const isType = () => at('kw') && TYPEWORDS.has(peek().v);

  function parseType(){
    let parts = [];
    while(isType()){ parts.push(next().v); }
    if(!parts.length) throw cerr("expected a type", peek().line);
    let stars = 0; while(at('op','*')){ next(); stars++; }
    const base = parts.filter(x => x!=='const' && x!=='static' && x!=='unsigned' && x!=='signed').pop() || 'int';
    const isFloat = base === 'float' || base === 'double';
    return { base, isFloat, ptr: stars };
  }
  function program(){
    const decls = [];
    while(!at('eof')){
      decls.push(topLevel());
    }
    return { type:'Program', decls };
  }
  function topLevel(){
    const ty = parseType();
    const name = eat('id').v;
    if(at('op','(')){ // function
      next();
      const params = [];
      if(!at('op',')')){
        do {
          if(at('kw','void') && toks[p+1] && toks[p+1].v === ')'){ next(); break; }
          const pty = parseType();
          const pname = at('id') ? next().v : ('_a'+params.length);
          // array param → pointer, ignore dims
          while(at('op','[')){ next(); while(!at('op',']')) next(); eat('op',']'); }
          params.push({ ty:pty, name:pname });
        } while(at('op',',') && next());
      }
      eat('op',')');
      if(at('op',';')){ next(); return { type:'Proto', name }; } // forward decl → ignore
      const body = block();
      return { type:'Func', ret:ty, name, params, body };
    }
    // global var declaration (possibly comma list)
    const d = finishVarDecl(ty, name);
    eat('op',';');
    return d;
  }
  function finishVarDecl(ty, firstName){
    const decls = [];
    let name = firstName;
    while(true){
      let arr = null, init = null;
      if(at('op','[')){ next(); arr = at('op',']') ? null : expr(); eat('op',']'); }
      if(at('op','=')){ next();
        if(at('op','{')){ next(); const items=[]; if(!at('op','}')){ do{ items.push(assign()); }while(at('op',',')&&!(toks[p+1]&&toks[p+1].v==='}')&&next()); } if(at('op',',')) next(); eat('op','}'); init={type:'ArrLit',items}; }
        else init = assign();
      }
      decls.push({ name, arr, init });
      if(at('op',',')){ next(); name = eat('id').v; continue; }
      break;
    }
    return { type:'VarDecl', ty, decls };
  }
  function block(){
    eat('op','{');
    const stmts = [];
    while(!at('op','}') && !at('eof')) stmts.push(statement());
    eat('op','}');
    return { type:'Block', stmts };
  }
  function statement(){
    if(at('op','{')) return block();
    if(isType()){ const ty = parseType(); const name = eat('id').v; const d = finishVarDecl(ty, name); eat('op',';'); return d; }
    if(at('kw','if')){ next(); eat('op','('); const c = expr(); eat('op',')'); const th = statement(); let el=null; if(at('kw','else')){ next(); el = statement(); } return {type:'If',c,th,el}; }
    if(at('kw','while')){ next(); eat('op','('); const c = expr(); eat('op',')'); const b = statement(); return {type:'While',c,b}; }
    if(at('kw','do')){ next(); const b = statement(); eat('kw','while'); eat('op','('); const c = expr(); eat('op',')'); eat('op',';'); return {type:'DoWhile',c,b}; }
    if(at('kw','for')){ next(); eat('op','(');
      let init=null; if(!at('op',';')){ if(isType()){ const ty=parseType(); const nm=eat('id').v; init=finishVarDecl(ty,nm); } else init={type:'ExprStmt',e:expr()}; } eat('op',';');
      let cond = at('op',';') ? null : expr(); eat('op',';');
      let post = at('op',')') ? null : expr(); eat('op',')');
      const b = statement(); return {type:'For',init,cond,post,b};
    }
    if(at('kw','return')){ next(); let e = at('op',';') ? null : expr(); eat('op',';'); return {type:'Return',e}; }
    if(at('kw','break')){ next(); eat('op',';'); return {type:'Break'}; }
    if(at('kw','continue')){ next(); eat('op',';'); return {type:'Continue'}; }
    if(at('op',';')){ next(); return {type:'Empty'}; }
    const e = expr(); eat('op',';'); return {type:'ExprStmt',e};
  }
  // expression precedence
  function expr(){ let e = assign(); while(at('op',',')){ next(); e = {type:'Comma',a:e,b:assign()}; } return e; }
  function assign(){
    const left = ternary();
    if(at('op') && ['=','+=','-=','*=','/=','%=','&=','|=','^=','<<=','>>='].includes(peek().v)){
      const op = next().v; const right = assign(); return {type:'Assign',op,left,right};
    }
    return left;
  }
  function ternary(){ let c = binary(0); if(at('op','?')){ next(); const a = assign(); eat('op',':'); const b = assign(); return {type:'Ternary',c,a,b}; } return c; }
  const BINOPS = [
    ['||'], ['&&'], ['|'], ['^'], ['&'], ['==','!='], ['<','>','<=','>='], ['<<','>>'], ['+','-'], ['*','/','%']
  ];
  function binary(lvl){
    if(lvl >= BINOPS.length) return unary();
    let left = binary(lvl+1);
    while(at('op') && BINOPS[lvl].includes(peek().v)){
      const op = next().v; const right = binary(lvl+1);
      left = (op==='&&'||op==='||') ? {type:'Logical',op,left,right} : {type:'Binary',op,left,right};
    }
    return left;
  }
  function unary(){
    if(at('op') && ['+','-','!','~','*','&'].includes(peek().v)){ const op = next().v; return {type:'Unary',op,e:unary()}; }
    if(at('op','++') || at('op','--')){ const op = next().v; return {type:'Update',op,prefix:true,e:unary()}; }
    if(at('kw','sizeof')){ next(); if(at('op','(')){ next(); if(isType()){ parseType(); eat('op',')'); return {type:'Num',v:4,f:false}; } const e=expr(); eat('op',')'); return {type:'Num',v:4,f:false}; } unary(); return {type:'Num',v:4,f:false}; }
    return postfix();
  }
  function postfix(){
    let e = primary();
    while(true){
      if(at('op','(')){ next(); const args=[]; if(!at('op',')')){ do{ args.push(assign()); }while(at('op',',')&&next()); } eat('op',')'); e = {type:'Call',callee:e,args}; }
      else if(at('op','[')){ next(); const idx = expr(); eat('op',']'); e = {type:'Index',arr:e,idx}; }
      else if(at('op','++')||at('op','--')){ const op = next().v; e = {type:'Update',op,prefix:false,e}; }
      else break;
    }
    return e;
  }
  function primary(){
    if(at('num')){ const t = next(); return {type:'Num',v:t.v,f:t.f}; }
    if(at('str')){ const t = next(); return {type:'Str',v:t.v}; }
    if(at('id')){ return {type:'Ident',name:next().v}; }
    if(at('op','(')){ next(); if(isType()){ const ty=parseType(); eat('op',')'); return {type:'Cast',ty,e:unary()}; } const e = expr(); eat('op',')'); return e; }
    throw cerr("unexpected '"+peek().v+"'", peek().line);
  }
  return program();
}

/* ---------- evaluator ---------- */
const RET = Symbol('ret'), BRK = Symbol('brk'), CONT = Symbol('cont');
function mk(v, f){ return { v, f:!!f }; }

function interpret(ast, io){
  const funcs = {};
  const globals = new Map();
  let ops = 0;
  const OP_CAP = 8_000_000;
  const tick = () => { if(++ops > OP_CAP) throw new Error("execution exceeded "+OP_CAP+" operations (infinite loop?)"); };

  for(const d of ast.decls){
    if(d.type === 'Func') funcs[d.name] = d;
    else if(d.type === 'VarDecl') declVars(d, { scopes:[globals], globals });
  }
  if(!funcs.main) throw new Error("no main() function found");

  function declVars(node, env){
    const scope = env.scopes[env.scopes.length-1];
    for(const dd of node.decls){
      if(dd.arr !== undefined && dd.arr !== null || (dd.init && dd.init.type === 'ArrLit')){
        let size = dd.arr ? evalExpr(dd.arr, env).v : 0;
        const arr = [];
        if(dd.init && dd.init.type === 'ArrLit'){
          dd.init.items.forEach(it => { const val = evalExpr(it, env); arr.push(coerce(val, node.ty)); });
        }
        size = Math.max(size, arr.length);
        for(let k = arr.length; k < size; k++) arr.push(mk(0, node.ty.isFloat));
        arr.isArray = true; arr.elemFloat = node.ty.isFloat;
        scope.set(dd.name, { arr });
      } else {
        let val = dd.init ? coerce(evalExpr(dd.init, env), node.ty) : mk(0, node.ty.isFloat);
        scope.set(dd.name, { val, ty:node.ty });
      }
    }
  }
  function coerce(val, ty){
    if(!ty || !val) return val;
    if(val.str !== undefined || val.isArray || val.arr || val.fn) return val; // pointers/strings/arrays pass through
    if(ty.ptr) return val;
    if(ty.isFloat) return mk(val.v, true);
    return mk(Math.trunc(val.v), false);
  }

  function lookup(env, name){
    for(let i = env.scopes.length-1; i >= 0; i--) if(env.scopes[i].has(name)) return env.scopes[i].get(name);
    if(env.globals.has(name)) return env.globals.get(name);
    return null;
  }

  function callFunc(name, argVals, callerEnv){
    const b = BUILTINS[name];
    if(b) return b(argVals, io);
    const fn = funcs[name];
    if(!fn) throw new Error("undefined function '"+name+"'");
    const frame = new Map();
    fn.params.forEach((param, i) => {
      const a = argVals[i] !== undefined ? argVals[i] : mk(0);
      frame.set(param.name, { val: coerce(a.arr ? a : a, param.ty), ty:param.ty, ...(a.arr?{arr:a.arr}:{}) });
      if(a.arr) frame.set(param.name, { arr:a.arr });
    });
    const env = { scopes:[frame], globals };
    const r = execBlock(fn.body, env);
    if(r && r.sig === RET) return r.val !== undefined ? r.val : mk(0, fn.ret.isFloat);
    return mk(0, fn.ret.isFloat);
  }

  function execBlock(node, env){
    env.scopes.push(new Map());
    try {
      for(const s of node.stmts){ const r = execStmt(s, env); if(r) return r; }
    } finally { env.scopes.pop(); }
    return null;
  }
  function execStmt(s, env){
    tick();
    switch(s.type){
      case 'Block': return execBlock(s, env);
      case 'VarDecl': declVars(s, env); return null;
      case 'ExprStmt': evalExpr(s.e, env); return null;
      case 'Empty': return null;
      case 'If': if(truthy(evalExpr(s.c, env))) return execStmt(s.th, env); else if(s.el) return execStmt(s.el, env); return null;
      case 'While': while(truthy(evalExpr(s.c, env))){ tick(); const r = execStmt(s.b, env); if(r){ if(r.sig===BRK) break; if(r.sig===CONT) continue; return r; } } return null;
      case 'DoWhile': do{ tick(); const r = execStmt(s.b, env); if(r){ if(r.sig===BRK) break; if(r.sig===CONT) continue; return r; } }while(truthy(evalExpr(s.c, env))); return null;
      case 'For': {
        env.scopes.push(new Map());
        try{
          if(s.init) execStmt(s.init.type==='VarDecl'?s.init:{type:'ExprStmt',e:s.init.e||s.init}, env);
          while(s.cond ? truthy(evalExpr(s.cond, env)) : true){

            if(s.post) evalExpr(s.post, env);

      }
      case 'Return': return { sig:RET, val: s.e ? evalExpr(s.e, env) : undefined };
      case 'Break': return { sig:BRK };
      case 'Continue': return { sig:CONT };
      default: throw new Error("cannot execute statement "+s.type);
    }
  }

  function truthy(val){ return (val.v|0) !== 0 || (val.f && val.v !== 0); }

  function lvalue(node, env){
    if(node.type === 'Ident'){ const cell = lookup(env, node.name); if(!cell) throw new Error("undefined variable '"+node.name+"'"); return { get:()=>cell.val, set:(x)=>{ cell.val = cell.ty ? coerce(x, cell.ty) : x; } }; }
    if(node.type === 'Index'){ const base = lookup(env, node.arr.name); const arr = base && base.arr ? base.arr : (evalExpr(node.arr, env).arr); if(!arr) throw new Error("indexing a non-array"); const i = evalExpr(node.idx, env).v|0; return { get:()=>arr[i]||mk(0), set:(x)=>{ arr[i] = mk(x.v, arr.elemFloat); } }; }

  function evalExpr(node, env){

      }
      case 'Unary': {

        if(node.op === '*') return evalExpr(node.e, env); // deref → identity (minimal)

      case 'Index': { const arr = evalExpr(node.arr, env); const i = evalExpr(node.idx, env).v|0; if(arr && arr.isArray) return arr[i]||mk(0); if(arr && arr.str!==undefined) return mk(arr.str.charCodeAt(i)||0,false); throw new Error("indexing a non-array"); }

        return callFunc(name, args, env) || mk(0);
      }
      default: throw new Error("cannot evaluate "+node.type);
    }
  }

  function applyBin(op, a, b){
    const isF = a.f || b.f;
    const x = a.v, y = b.v;
    switch(op){
      case '+': return mk(x+y, isF);
      case '-': return mk(x-y, isF);
      case '*': return mk(x*y, isF);
      case '/': if(y === 0 && !isF) throw new Error("integer division by zero"); return mk(isF ? x/y : Math.trunc(x/y), isF);

      case '>>': return mk((x|0) >> (y|0), false);
      case '&': return mk((x|0) & (y|0), false);
      case '|': return mk((x|0) | (y|0), false);
      case '^': return mk((x|0) ^ (y|0), false);
      case '==': return mk(x===y?1:0, false);
      case '!=': return mk(x!==y?1:0, false);
      case '<': return mk(x<y?1:0, false);
      case '>': return mk(x>y?1:0, false);
      case '<=': return mk(x<=y?1:0, false);
      case '>=': return mk(x>=y?1:0, false);
      default: throw new Error("unknown operator "+op);
    }
  }

  // run main()
  const rv = callFunc('main', [], { scopes:[], globals });
  return rv ? (rv.v|0) : 0;
}

/* ---------- builtins ---------- */
function argToStr(a){
  if(a === undefined) return '';
  if(a.str !== undefined) return a.str;
  if(a.isArray) return a.map(x => String.fromCharCode(x.v)).join('').replace(/\0.*$/,'');
  return String(a.v);
}
const MATH1 = { sqrt:Math.sqrt, sin:Math.sin, cos:Math.cos, tan:Math.tan, exp:Math.exp, log:Math.log, log10:Math.log10, fabs:Math.abs, floor:Math.floor, ceil:Math.ceil, round:Math.round, abs:(x)=>Math.abs(x) };
const BUILTINS = {
  printf(args, io){ const s = doFormat(args); io.out(s); return mk(s.length, false); },
  puts(args, io){ io.out(argToStr(args[0]) + '\n'); return mk(0,false); },
  putchar(args, io){ io.out(String.fromCharCode(args[0].v|0)); return mk(args[0].v|0,false); },
  puts_(args,io){ return mk(0,false); },
  pow(args){ return mk(Math.pow(args[0].v, args[1].v), true); },
  atoi(args){ return mk(parseInt(argToStr(args[0]),10)||0, false); },
  strlen(args){ return mk(argToStr(args[0]).length, false); },
  rand(){ return mk(Math.floor(Math.random()*32768), false); },   // note: pseudo, unseeded
  srand(){ return mk(0,false); },
};
Object.keys(MATH1).forEach(k => { BUILTINS[k] = (args)=> mk(MATH1[k](args[0].v), k!=='abs'); });

function doFormat(args){
  const fmt = argToStr(args[0]);
  let ai = 1, out = '';
  for(let i = 0; i < fmt.length; i++){
    if(fmt[i] !== '%'){ out += fmt[i]; continue; }
    // parse %[flags][width][.prec][len]conv
    let j = i+1, spec = '%';
    while('-+ 0#'.includes(fmt[j])){ spec += fmt[j++]; }
    while(fmt[j] >= '0' && fmt[j] <= '9'){ spec += fmt[j++]; }
    if(fmt[j] === '.'){ spec += fmt[j++]; while(fmt[j] >= '0' && fmt[j] <= '9') spec += fmt[j++]; }
    while('lhLqjzt'.includes(fmt[j])){ j++; } // consume length modifiers
    const conv = fmt[j];
    if(conv === '%'){ out += '%'; i = j; continue; }
    const a = args[ai++];
    out += fmtOne(spec, conv, a);
    i = j;
  }
  return out;
}
function fmtOne(spec, conv, a){
  const m = spec.match(/^%([-+ 0#]*)(\d*)(?:\.(\d+))?$/) || [ ,'','',undefined];
  const flags = m[1]||'', width = m[2]?parseInt(m[2]):0, prec = m[3]!==undefined?parseInt(m[3]):undefined;
  let s;
  const num = a ? a.v : 0;
  switch(conv){
    case 'd': case 'i': s = String(Math.trunc(num)); break;
    case 'u': s = String(Math.trunc(num) >>> 0); break;
    case 'f': case 'F': s = (num).toFixed(prec===undefined?6:prec); break;
    case 'e': case 'E': s = (num).toExponential(prec===undefined?6:prec); if(conv==='E')s=s.toUpperCase(); break;
    case 'g': case 'G': s = String(prec!==undefined ? Number(num.toPrecision(prec||1)) : num); break;
    case 'x': s = (Math.trunc(num)>>>0).toString(16); break;
    case 'X': s = (Math.trunc(num)>>>0).toString(16).toUpperCase(); break;
    case 'o': s = (Math.trunc(num)>>>0).toString(8); break;
    case 'c': s = String.fromCharCode(num|0); break;
    case 's': s = argToStr(a); if(prec!==undefined) s = s.slice(0,prec); break;
    case 'p': s = '0x'+(Math.trunc(num)>>>0).toString(16); break;
    default: return spec + conv;
  }
  // sign flags for numeric
  if('difFeEgG'.includes(conv) && num >= 0){ if(flags.includes('+')) s = '+'+s; else if(flags.includes(' ')) s = ' '+s; }
  if(width > s.length){
    const pad = width - s.length;
    if(flags.includes('-')) s = s + ' '.repeat(pad);
    else if(flags.includes('0') && 'diouxXfeEgG'.includes(conv)){
      if(/^[+\- ]/.test(s)) s = s[0] + '0'.repeat(pad) + s.slice(1);
      else s = '0'.repeat(pad) + s;
    }
    else s = ' '.repeat(pad) + s;
  }
  return s;
}

/* ---------- public entry ---------- */
function runC(source, opts){
  opts = opts || {};
  let output = '';
  const io = { out: (s)=>{ output += s; if(output.length > 200000) throw new Error("output limit exceeded (200k chars)"); } };
  try {
    const { text, macros } = preprocess(source);
    const toks = lex(text, macros);
    const ast = parse(toks);
    const code = interpret(ast, io);
    return { ok:true, output, exit:code, error:null };
  } catch(e){
    const where = e.cline ? (" (line "+e.cline+")") : '';
    return { ok:false, output, exit:null, error: (e.compile?"compile error":"runtime error") + where + ": " + e.message };
  }
}

<script>
'use strict';

const $ = id => document.getElementById(id);

const EXAMPLES = {

  fizzbuzz: '#include <stdio.h>\n\nint main() {\n    for (int i = 1; i <= 20; i++) {\n        if (i % 15 == 0)      printf("FizzBuzz\\n");\n        else if (i % 3 == 0)  printf("Fizz\\n");\n        else if (i % 5 == 0)  printf("Buzz\\n");\n        else                  printf("%d\\n", i);\n    }\n    return 0;\n}\n',

function termLine(cls, text){
