<style>
:root{ --ink:#2b1a2e; --gold:#ffd36b; --pink:#ff9fb4; --rose:#ff6f93; --cream:#fff6f0; --night:#2a1d46; --lav:#c9b8ff; }
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0; min-height:100vh; min-height:100dvh; color:#f6efff; font-family:'M PLUS Rounded 1c',ui-rounded,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,211,107,.18), transparent 16rem),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2.2rem, transparent 2.2rem 4.4rem),
    linear-gradient(175deg,#1d1534 0%,#2a1d46 55%,#41284f 100%);
  display:flex; flex-direction:column; align-items:center; padding:0 1rem 1.4rem;}
header{width:min(100%,30rem); display:flex; align-items:flex-end; justify-content:space-between; gap:.6rem; padding:.9rem .2rem .5rem;}
h1{margin:0; font:400 clamp(1.7rem,7vw,2.3rem)/1 'Mochiy Pop One',sans-serif; color:var(--pink); text-shadow:0 3px 0 #6a2a4a;}
h1 small{display:block; font:800 .78rem 'M PLUS Rounded 1c',sans-serif; color:var(--lav); letter-spacing:.06em; margin-top:.35rem; text-shadow:none;}
#score{font-weight:800; font-size:.85rem; color:var(--gold); text-align:right; min-height:1.2em;}
#stage{position:relative; width:min(100%,30rem); aspect-ratio:1; border-radius:1.6rem; overflow:hidden; box-shadow:0 0 0 4px #fff3, 0 14px 40px #0008;}
canvas{display:block; width:100%; height:100%; touch-action:manipulation; cursor:pointer;}
canvas:focus-visible{outline:4px solid var(--gold); outline-offset:-4px;}
#say{width:min(100%,30rem); min-height:2.6em; margin:.55rem 0 .2rem; text-align:center; font-weight:800; font-size:.92rem; color:#ffe3ec;}
.who{width:min(100%,30rem); display:flex; flex-wrap:wrap; gap:.4rem; padding:.2rem .1rem .45rem;}
button{font:800 .92rem 'M PLUS Rounded 1c',ui-rounded,sans-serif; border:0; cursor:pointer; color:var(--ink); -webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:3px solid var(--gold); outline-offset:3px;}
.chip{flex:1 0 auto; min-height:2.75rem; padding:.45rem .8rem; border-radius:999px; background:#ffffff1a; color:#f6efff; box-shadow:inset 0 0 0 2px #ffffff2e;}
.chip[aria-pressed="true"]{background:var(--pink); color:var(--ink); box-shadow:0 4px 0 #a8426a;}
.tabs{width:min(100%,30rem); display:flex; gap:.4rem; margin:.2rem 0 .5rem;}
.tab{flex:1; min-height:2.6rem; border-radius:.9rem; background:#ffffff14; color:#e9dcff; box-shadow:inset 0 0 0 2px #ffffff22;}
.tab[aria-selected="true"]{background:#fff6f0; color:var(--ink); box-shadow:0 4px 0 #b9a3d6;}
#items{width:min(100%,30rem); display:grid; grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr)); gap:.45rem;}
.it{min-height:3.5rem; border-radius:1rem; background:#fff6f0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1rem; padding:.35rem .3rem; box-shadow:0 4px 0 #b9a3d6; transition:transform .12s;}
.it b{font:400 1.35rem/1 'Mochiy Pop One',sans-serif;}
.it span{font-size:.72rem; line-height:1.1;}
.it[aria-pressed="true"]{background:var(--gold); box-shadow:0 4px 0 #b8862a, 0 0 0 3px #fff inset;}
.it:active{transform:translateY(3px);}
.row{width:min(100%,30rem); display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; margin-top:.8rem;}
.soft{min-height:2.75rem; padding:.5rem 1.1rem; border-radius:999px; background:#ffffff1a; color:#f6efff; box-shadow:inset 0 0 0 2px #ffffff30;}
.lane{display:inline-block; margin-top:.9rem; padding:.6rem; font-weight:800; font-size:.85rem; color:#e9dcff; opacity:.75; text-decoration:none;}
.lane:hover,.lane:focus-visible{opacity:1; text-decoration:underline;}
.panel{width:min(100%,30rem); display:flex; flex-direction:column; align-items:center;}
.panel>*{width:100%;}
.panel .lane{width:auto;}
@media (min-width:860px) and (min-height:560px){
  body{display:grid; grid-template-columns:auto minmax(18rem,26rem); justify-content:center; align-items:start; column-gap:2.2rem; padding-top:.4rem;}
  header{grid-column:1/-1; width:100%;}
  #stage{width:min(36rem, calc(100vh - 8.5rem), calc(100vw - 33rem)); width:min(36rem, calc(100dvh - 8.5rem), calc(100vw - 33rem));}
  .panel{margin-top:-.4rem;}
}
.cam{background:var(--gold); color:var(--ink); box-shadow:0 4px 0 #b8862a;}
.err{color:#ffb4c4; font-weight:800; text-align:center; margin:.5rem 0 0;}
#flash{position:fixed; inset:0; background:#fff; z-index:50; pointer-events:none; animation:fl .38s ease-out forwards;}
@keyframes fl{from{opacity:.9;} to{opacity:0;}}
dialog{border:0; border-radius:1.4rem; padding:1rem; width:min(94vw,40rem); max-height:94vh; overflow:auto; background:#2a1d46; color:#f6efff; box-shadow:0 0 0 3px #ffffff33, 0 20px 60px #000a;}

#photoCap{text-align:center; font-weight:800; font-size:.88rem; color:#e9dcff; margin:.9rem 0 .4rem;}
.prow{display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center;}
.soft.dark{background:#ffffff1f;}
#save{background:var(--pink); color:var(--ink); box-shadow:0 4px 0 #a8426a;}
@media (prefers-reduced-motion: reduce){ .it{transition:none;} #flash{animation:none; opacity:0;} #photoImg{transform:none;} }
</style>

<body>
<header>
  <h1>Dress-Up Lane<small>the whole gang · Mewo judges</small></h1>
  <p id="score" aria-live="polite"></p>
</header>
<div id="stage"><canvas id="cv" tabindex="0" role="img" aria-label="A little dressing room with fairy lights. One of the neighbours from Fairylight Lane stands on a round stage in the outfit you picked, and Mewo the loaf cat sits in the judge's corner. Pick a neighbour, then tap clothes and things to hold to put them on or take them off."></canvas></div>
<div class="panel">
<p id="say" aria-live="polite">pick a neighbour, then dress them up</p>
<div class="who" role="group" aria-label="who to dress" id="who"></div>
<div class="tabs" role="tablist" aria-label="clothes">
  <button class="tab" role="tab" id="t-h" aria-selected="true" aria-controls="items" data-s="h">🎩 hats</button>
  <button class="tab" role="tab" id="t-n" aria-selected="false" aria-controls="items" data-s="n">🧣 neck</button>
  <button class="tab" role="tab" id="t-f" aria-selected="false" aria-controls="items" data-s="f">👓 face</button>
  <button class="tab" role="tab" id="t-x" aria-selected="false" aria-controls="items" data-s="x">🎈 hold</button>
</div>
<div id="items" role="tabpanel" aria-labelledby="t-h"></div>
<div class="row">
  <button class="soft" id="rand" type="button">🎲 surprise me</button>
  <button class="soft" id="bare" type="button">🧺 take it all off</button>
  <button class="soft cam" id="snap" type="button">📸 group photo</button>
</div>
<p id="photoErr" class="err" role="alert" hidden>The camera jammed. Try again in a second.</p>
<a class="lane" href="/fairylight-lane/">🏮 back to Fairylight Lane</a>
</div>
<div id="flash" hidden></div>
<dialog id="photo" aria-labelledby="photoT">
  <h2 id="photoT">📸 photo day on the lane</h2>
  <img id="photoImg" alt="A polaroid of the whole gang on the snowy lane at night in their outfits: Nero in the middle, Wan-kun on the left, Bnuy on the right, Poppo on a lamp post and Mewo in front saying delete this.">
  <p id="photoCap"></p>
  <div class="prow"><button class="soft dark" id="save" type="button">💾 save picture</button><button class="soft dark" id="share" type="button" hidden>📤 share</button><button class="soft dark" id="photoClose" type="button">close</button></div>
</dialog>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var cv=$('cv'), ctx=cv.getContext('2d'), W=400;
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var K={ink:'#2b1a2e', fur:'#fff8f3', earIn:'#ffb6c8', cap:'#e8414f', blush:'#ff9fb4',
  tan:'#f0a457', tanHi:'#ffc27a', cream:'#fff4e2', hair:'#2b2338', hairHi:'#5d4f80', skin:'#ffe9dc', hood:'#3d3552'};
var COATS={ginger:{}, black:{hi:'#4f4656', c:'#2e2833', lo:'#16121a', stripe:null, bib:'#3b3442', ear:'#b98585', eye:'#f2c14e'},
  grey:{hi:'#c3c6ce', c:'#9195a0', lo:'#5e626d', stripe:'#4a4d57', bib:'#eef0f2'},
  calico:{hi:'#ffffff', c:'#f3ece2', lo:'#cdbfae', stripe:null, bib:'#ffffff', eye:'#e9b84a', patch:['#e8924a','#2e2833']},
  white:{hi:'#ffffff', c:'#f2ede7', lo:'#cfc6bd', stripe:null, bib:'#ffffff', eye:'#86c9f0', ear:'#f4b0aa'}};
var M={hi:'#f7b874', c:'#e8924a', lo:'#b8622c', stripe:'#a9541f', bib:'#fbe6c8', ear:'#f2a49c', eye:'#a6d86a'};
var now=0, T0=performance.now(), LWF=1;

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function env(age,up,hold,down){ if(age<0) return 0; var v=age<up?age/up:age<up+hold?1:age<up+hold+down?1-(age-up-hold)/down:0; return v*v*(3-2*v); }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function line(g,w,c){ g.lineWidth=w*LWF; g.strokeStyle=c||K.ink; g.lineJoin='round'; g.lineCap='round'; g.stroke(); }
function heart(g,x,y,r,c){ g.fillStyle=c; g.beginPath(); g.moveTo(x,y+r*.9); g.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.7,y-r*1.4,x,y-r*.5); g.bezierCurveTo(x+r*.7,y-r*1.4,x+r*1.6,y-r*.2,x,y+r*.9); g.fill(); }
function sparkle(g,x,y,r,a,c){ g.globalAlpha=a; g.fillStyle=c||'#fff'; g.beginPath(); g.moveTo(x,y-r); g.quadraticCurveTo(x,y,x+r,y); g.quadraticCurveTo(x,y,x,y+r); g.quadraticCurveTo(x,y,x-r,y); g.quadraticCurveTo(x,y,x,y-r); g.fill(); g.globalAlpha=1; }
function star(g,x,y,r,c){ g.beginPath(); for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } g.closePath(); g.fillStyle=c; g.fill(); }
function eyeSpark(g,x,y,rx,ry,c0,c1){ g.save(); g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.clip();
  var eg=g.createLinearGradient(0,y-ry,0,y+ry); eg.addColorStop(0,c0); eg.addColorStop(1,c1); g.fillStyle=eg; g.fillRect(x-rx-1,y-ry-1,rx*2+2,ry*2+2);
  g.fillStyle='#1c0b06'; g.beginPath(); g.ellipse(x,y+1,rx*.55,ry*.62,0,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.ellipse(x-rx*.35,y-ry*.38,rx*.38,ry*.32,-.3,0,7); g.fill(); g.beginPath(); g.arc(x+rx*.35,y+ry*.4,rx*.18,0,7); g.fill(); g.restore();
  g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); line(g,2.2); }
function happyEyes(g,x,y,w){ g.beginPath(); g.moveTo(x-w,y+3); g.quadraticCurveTo(x,y-w,x+w,y+3); line(g,3); }
function sleepEyes(g,x,y,w){ g.beginPath(); g.moveTo(x-w,y-1); g.quadraticCurveTo(x,y+5,x+w,y-1); line(g,2.6); }

/* ---------- names and Mewo's coat come from the sibling apps (one origin) ---------- */
var NM={w:'Wan-kun', m:'Mewo', b:'Bnuy', n:'Nero', p:'Poppo'}, PUPHAT=false;
function readStreet(){
  try{ var pn=localStorage.getItem('wan-wan-pup-name'); if(pn) NM.w=pn.slice(0,12); }catch(e){}
  var coat='ginger';
  try{ var wl=JSON.parse(localStorage.getItem('window-loaf')); if(wl){ if(COATS[wl.coat]) coat=wl.coat; if(wl.name) NM.m=String(wl.name).slice(0,14); } }catch(e){}
  try{ var bn=localStorage.getItem('bunny-post-name'); if(bn) NM.b=bn.slice(0,10); }catch(e){}
  try{ PUPHAT=localStorage.getItem('wan-wan-pup-hat')==='1'; }catch(e){}
  Object.assign(M,COATS[coat]);
}

/* ---------- the clothes ---------- */
var ITEMS={
 h:[{k:'beanie',e:'🧶',n:'knit beanie'},{k:'crown',e:'👑',n:'crown'},{k:'flowers',e:'🌸',n:'flower crown'},{k:'tophat',e:'🎩',n:'top hat'},
    {k:'santa',e:'🎅',n:'santa hat'},{k:'party',e:'🎉',n:'party hat'},{k:'bigbow',e:'🎀',n:'big bow'},{k:'catears',e:'🐱',n:'cat ears'},{k:'halo',e:'😇',n:'halo'}],
 n:[{k:'scarf',e:'🧣',n:'long scarf'},{k:'bell',e:'🔔',n:'bell collar'},{k:'bowtie',e:'🎀',n:'bow tie'},{k:'pearls',e:'📿',n:'pearls'}],
 f:[{k:'round',e:'👓',n:'round glasses'},{k:'shades',e:'😎',n:'cool shades'},{k:'hearts',e:'💖',n:'heart shades'},{k:'monocle',e:'🧐',n:'monocle'},{k:'stars',e:'✨',n:'star stickers'}],
 x:[{k:'balloon',e:'🎈',n:'heart balloon'},{k:'bouquet',e:'💐',n:'flowers'},{k:'fish',e:'🐟',n:'a fish'},{k:'wand',e:'🪄',n:'star wand'},{k:'lantern',e:'🏮',n:'lantern'},{k:'sign',e:'🪧',n:'Mewo fan sign'}]};
var SLOTS=['h','n','f','x'];
var INAME={}; SLOTS.forEach(function(s){ ITEMS[s].forEach(function(it){ INAME[it.k]=it.n; }); });
var WHO=['w','m','b','n','p'];
var O={w:{h:'',n:'',f:'',x:''},m:{h:'',n:'',f:'',x:''},b:{h:'',n:'',f:'',x:''},n:{h:'',n:'',f:'',x:''},p:{h:'',n:'',f:'',x:''}};
var S={cur:'w', tab:'h', pop:{h:-9,n:-9,f:-9,x:-9}, tapAt:-9, judgeAt:-9, judge:'', paws:0, sub:'', subAt:-9, bub:'', bubAt:-9, sparks:[], hatNo:0, swap:-9};

function load(){ try{ var d=JSON.parse(localStorage.getItem('dress-up-lane')); if(d&&d.o) WHO.forEach(function(w){ var o=d.o[w]; if(o) SLOTS.forEach(function(s){ if(typeof o[s]==='string'&&(o[s]===''||INAME[o[s]])) O[w][s]=o[s]; }); });
  if(d&&WHO.indexOf(d.cur)>=0) S.cur=d.cur; }catch(e){}
  if(PUPHAT) O.w.h='beanie'; }
function save(){ try{ localStorage.setItem('dress-up-lane',JSON.stringify({o:O,cur:S.cur})); }catch(e){} }

/* ---------- where things go on each neighbour: head units (head half-width 34, centre 0,0) ---------- */
/* x,y,u: stage position and pixels per head unit; top: crown of the head; ey/edx: eyes; ny/nw: neck; side: drawn in profile */
var A={w:{x:200,y:206,u:2.3,top:-29,ey:-2,edx:13,ny:27,nw:24},
       m:{x:200,y:214,u:2.3,top:-28,ey:-1,edx:13,ny:26,nw:24},
       b:{x:200,y:207,u:1.94,top:-29.5,ey:2.3,edx:12.5,ny:25,nw:20},
       n:{x:200,y:242,u:3.24,top:-31.6,ey:4.7,edx:11.1,ny:30,nw:23},
       p:{x:244.8,y:161.4,u:1.5,top:-34,ey:-4.5,edx:9,ny:38,nw:24,nx:-14,side:1}};

/* ---------- the neighbours, big ---------- */
function wanHead(g,cx,cy,m,talk,hat){
  [-1,1].forEach(function(s){ g.beginPath(); g.moveTo(cx+s*30,cy-14); g.quadraticCurveTo(cx+s*30,cy-40,cx+s*22,cy-46); g.quadraticCurveTo(cx+s*12,cy-36,cx+s*8,cy-26); g.closePath(); g.fillStyle=K.tan; g.fill(); line(g,3);
    g.beginPath(); g.moveTo(cx+s*25,cy-18); g.quadraticCurveTo(cx+s*25,cy-34,cx+s*21,cy-38); g.quadraticCurveTo(cx+s*15,cy-30,cx+s*13,cy-24); g.closePath(); g.fillStyle='#ffb3b8'; g.fill(); });
  g.beginPath(); g.ellipse(cx,cy,34,29,0,0,7); var hg=g.createLinearGradient(0,cy-29,0,cy+29); hg.addColorStop(0,K.tanHi); hg.addColorStop(1,K.tan); g.fillStyle=hg; g.fill();
  g.save(); g.clip(); g.fillStyle=K.cream; g.beginPath(); g.ellipse(cx-12,cy+18,20,16,0,0,7); g.ellipse(cx+12,cy+18,20,16,0,0,7); g.fill(); g.restore();
  g.beginPath(); g.ellipse(cx,cy,34,29,0,0,7); line(g,3);
  if(!hat){ g.save(); g.translate(cx+20,cy-26); g.rotate(.4); g.fillStyle='#e8414f'; [-1,1].forEach(function(s){ g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(s*4,-8,s*13,-8,s*12,0); g.bezierCurveTo(s*12,5,s*4,5,0,0); g.fill(); line(g,1.8); }); g.beginPath(); g.arc(0,0,3,0,7); g.fill(); line(g,1.8); g.restore(); }
  g.fillStyle=K.blush; g.globalAlpha=.7; g.beginPath(); g.ellipse(cx-22,cy+8,7,4,0,0,7); g.ellipse(cx+22,cy+8,7,4,0,0,7); g.fill(); g.globalAlpha=1;
  if(m==='happy'){ happyEyes(g,cx-13,cy-2,7); happyEyes(g,cx+13,cy-2,7); }
  else { eyeSpark(g,cx-13,cy-2,7,9,'#3b1a10','#8a4524'); eyeSpark(g,cx+13,cy-2,7,9,'#3b1a10','#8a4524'); }
  g.fillStyle='#3b1a10'; g.beginPath(); g.ellipse(cx,cy+8,4,2.6,0,0,7); g.fill();
  if(talk||m==='happy'){ g.beginPath(); g.moveTo(cx-5,cy+12); g.quadraticCurveTo(cx,cy+12+(talk?10:6),cx+5,cy+12); g.closePath(); g.fillStyle='#7a2a22'; g.fill(); line(g,1.8); }
  else { g.beginPath(); g.moveTo(cx-6,cy+12); g.quadraticCurveTo(cx-3,cy+15,cx,cy+12); g.quadraticCurveTo(cx+3,cy+15,cx+6,cy+12); line(g,1.8); }
}
function mewoHead(g,cx,cy,m){
  [-1,1].forEach(function(s){ g.beginPath(); g.moveTo(cx+s*30,cy-6); g.lineTo(cx+s*24,cy-42); g.quadraticCurveTo(cx+s*21,cy-46,cx+s*17,cy-42); g.lineTo(cx+s*4,cy-26); g.closePath(); g.fillStyle=M.patch&&s<0?M.patch[0]:M.c; g.fill(); line(g,3);
    g.beginPath(); g.moveTo(cx+s*24,cy-12); g.lineTo(cx+s*21,cy-34); g.lineTo(cx+s*10,cy-24); g.closePath(); g.fillStyle=M.ear; g.fill(); });
  g.beginPath(); g.ellipse(cx,cy,34,28,0,0,7); var hg=g.createRadialGradient(cx-8,cy-14,4,cx,cy,40); hg.addColorStop(0,M.hi); hg.addColorStop(.7,M.c); hg.addColorStop(1,M.lo); g.fillStyle=hg; g.fill();
  g.save(); g.clip(); if(M.patch){ g.fillStyle=M.patch[0]; g.beginPath(); g.ellipse(cx-20,cy-16,16,12,-.3,0,7); g.fill(); g.fillStyle=M.patch[1]; g.beginPath(); g.ellipse(cx+19,cy-21,12,8,.35,0,7); g.fill(); }
  g.fillStyle=M.bib; g.beginPath(); g.ellipse(cx,cy+22,24,13,0,0,7); g.fill();
  if(M.stripe){ g.strokeStyle=M.stripe; g.lineWidth=3*LWF; g.lineCap='round'; [-6,0,6].forEach(function(d){ g.beginPath(); g.moveTo(cx+d,cy-27); g.lineTo(cx+d*.9,cy-19); g.stroke(); }); }
  g.restore();
