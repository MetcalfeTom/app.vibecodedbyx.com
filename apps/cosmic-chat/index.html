<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://emojicdn.elk.sh data:; connect-src 'self' https://*.supabase.co; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';">
    <title>The Wormhole Garden - Chat Through the Void</title>
    <link rel="canonical" href="https://app.sloppy.live/cosmic-chat/">
    <meta name="description" content="A cosmic chat where reality bends and stars whisper secrets">
    <link rel="icon" href="https://emojicdn.elk.sh/🌀">

    <meta property="og:title" content="The Wormhole Garden">
    <meta property="og:description" content="A cosmic chat where reality bends and stars whisper secrets">
    <meta property="og:url" content="https://app.sloppy.live/cosmic-chat">
    <meta property="og:image" content="https://emojicdn.elk.sh/🌀.png">

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes wormhole {
            0% { transform: scale(1) rotate(0deg); opacity: 0.2; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.4; }
            100% { transform: scale(1) rotate(360deg); opacity: 0.2; }
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #000;
            color: #0f0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .wormhole-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin-left: -300px;
            margin-top: -300px;
            border: 3px solid rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            animation: wormhole 20s infinite linear;
            z-index: 1;
        }

        .wormhole-bg::before,
        .wormhole-bg::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            margin-left: -200px;
            margin-top: -200px;
            border: 2px solid rgba(255, 0, 255, 0.2);
            border-radius: 50%;
            animation: wormhole 15s infinite linear reverse;
        }

        .wormhole-bg::after {
            width: 200px;
            height: 200px;
            margin-left: -100px;
            margin-top: -100px;
            border-color: rgba(0, 255, 255, 0.3);
            animation-duration: 10s;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: pulse 3s infinite;
        }

        .container {
            position: relative;
            z-index: 3;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8a2be2;
            border-radius: 15px;
            position: relative;
        }

        .cosmic-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 60px;
            margin-bottom: 20px;
        }

        .wormhole-icon {
            animation: spin 10s linear infinite;
        }

        .apple-icon {
            animation: drift 3s ease-in-out infinite;
        }

        .star-icon {
            animation: pulse 2s ease-in-out infinite;
        }

        .header h1 {
            font-size: 36px;
            color: #8a2be2;
            text-shadow: 0 0 10px #8a2be2, 0 0 20px #ff00ff;
            margin-bottom: 10px;
        }

        .header p {
            color: #0f0;
            font-size: 14px;
            opacity: 0.8;
        }

        .warning {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid #8b0000;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #ff6b6b;
            animation: pulse 4s infinite;
        }

        .chat-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #8a2be2;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            max-height: 400px;
            padding-right: 10px;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #8a2be2;
            border-radius: 4px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(138, 43, 226, 0.1);
            border-left: 3px solid #8a2be2;
            border-radius: 8px;
            animation: drift 3s ease-in-out infinite;
        }

        .message.corrupted {
            border-left-color: #8b0000;
            background: rgba(139, 0, 0, 0.1);
            animation: glitch 0.3s infinite;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .username {
            color: #ff00ff;
            font-weight: bold;
        }

        .timestamp {
            color: #666;
        }

        .message-text {
            color: #0f0;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-text.corrupted-text {
            color: #ff6b6b;
        }

        .message-meta {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .void-hide {
            background: none;
            border: none;
            color: #c38bff;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            padding: 0 2px;
        }

        .void-hide:hover,
        .void-hide:focus-visible {
            color: #ff00ff;
            text-shadow: 0 0 8px #ff00ff;
        }

        .void-hidden-note {
            margin-top: 8px;
            font-size: 11px;
            color: #ff6b6b;
        }

        .void-note {
            margin-top: 10px;
            font-size: 12px;
            color: #ff00ff;
        }

        .void-note:empty {
            display: none;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .username-input {
            width: 150px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8a2be2;
            border-radius: 8px;
            color: #ff00ff;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8a2be2;
            border-radius: 8px;
            color: #0f0;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }

        .send-btn {
            padding: 12px 24px;
            background: #8a2be2;
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #9932cc;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8a2be2;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            color: #ff00ff;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: #0f0;
            opacity: 0.8;
        }

        
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .cosmic-icons {
                font-size: 40px;
                gap: 15px;
            }

            .input-area {
                flex-direction: column;
            }

            .username-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="wormhole-bg"></div>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="header">
            <div class="cosmic-icons">
                <span class="wormhole-icon">🌀</span>
                <span class="apple-icon">🍎</span>
                <span class="star-icon">⭐</span>
            </div>
            <h1>THE WORMHOLE GARDEN</h1>
            <p>Where dimensions collapse and messages drift through the void</p>
            <div class="warning">
                ⚠️ WARNING: Reality is unstable here. Some messages may become... corrupted.
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="messageCount">0</div>
                <div class="stat-label">TRANSMISSIONS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="corruptedCount">0</div>
                <div class="stat-label">CORRUPTED</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="voidStrength">█████░░░░░</div>
                <div class="stat-label">VOID STRENGTH</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages"></div>

            <div class="input-area">
                <input type="text"
                       class="username-input"
                       id="username"
                       placeholder="Cosmic Name"
                       maxlength="20">
                <input type="text"
                       class="message-input"
                       id="messageInput"
                       placeholder="Whisper into the void..."
                       maxlength="500">
                <button class="send-btn" onclick="sendMessage()">TRANSMIT</button>
            </div>
            <div class="void-note" id="voidNote" role="status" aria-live="polite"></div>
        </div>
    </div>

    <script type="module">
        import supabase, { supabaseSession } from '/supabase-config.js';

        const MSGS = 'cosmic_messages';
        const HIDES = 'cosmic_chat_hides';
        const HIDE_AT = 2;          // hides from travelers other than the author that take a message down for everyone
        const MAX_LEN = 500;
        const NAME_LEN = 20;

        let user = null;
        const messages = [];        // oldest first
        const nodes = new Map();    // message key -> its element on screen
        const looks = new Map();    // message key -> { corrupted, text }, so a message keeps its glitch
        const hides = new Map();    // message key -> Set of user ids
        const myHides = new Set();

        // The table has no id column, so a message is named by its author and its exact time (to the millisecond)
        function msgKey(m) {
            const t = String((m && m.created_at) || '');
            const r = /^(\d{4}-\d\d-\d\d)[T ](\d\d:\d\d:\d\d)(?:\.(\d+))?\s*(Z|[+-]\d\d(?::?\d\d)?)?$/.exec(t);
            let ms = NaN;
            if (r) {
                let tz = r[4] || 'Z';
                if (tz !== 'Z') { if (tz.length === 3) tz += ':00'; else if (tz.length === 5) tz = tz.slice(0, 3) + ':' + tz.slice(3); }
                ms = Date.parse(r[1] + 'T' + r[2] + '.' + ((r[3] || '') + '000').slice(0, 3) + tz);
            }
            if (isNaN(ms)) ms = Date.parse(t);
            return ((m && m.user_id) || '?') + '@' + (isNaN(ms) ? t : ms);
        }
        function isOwn(m) { return !!(user && m.user_id === user.id); }
        function hidesOn(m) {
            let n = 0;
            const set = hides.get(msgKey(m));
            if (set) for (const u of set) if (u !== m.user_id) n++;
            return n;
        }
        function isHidden(m) { return !isOwn(m) && (myHides.has(msgKey(m)) || hidesOn(m) >= HIDE_AT); }
        function addHide(key, u) {
            if (!hides.has(key)) hides.set(key, new Set());
            hides.get(key).add(u);
            if (user && u === user.id) myHides.add(key);
        }
        function note(t) { document.getElementById('voidNote').textContent = t || ''; }

        // Initialize: the void loads even when the session doesn't
        async function init() {
            try {
                const { user: currentUser } = await supabaseSession();
                user = currentUser || null;
            } catch (e) {
                console.error('Error initializing', e);
            }
            if (!user) note('no session: you can read, reload the page to transmit');
            await loadMessages();
            subscribeToMessages();
            updateVoidStrength();
        }

        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Corrupt text (dark twist)
        function corruptText(text) {
            const glitchChars = ['█', '▓', '▒', '░', '◆', '◇', '◈', '✦', '✧', '⚠', '☠', '⚡'];
            let corrupted = '';
            for (let i = 0; i < text.length; i++) {
                if (Math.random() < 0.15) {
                    corrupted += glitchChars[Math.floor(Math.random() * glitchChars.length)];
                } else {
                    corrupted += text[i];
                }
            }
            return corrupted;
        }

        // Load messages, then the hides
        async function loadMessages() {
            const res = await supabase
                .from(MSGS)
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50)
                .then(r => r, e => ({ error: e }));
            if (res.error) {
                console.error('Error loading messages', res.error);
                note('the void is unreachable right now, reload to try again');
                return;
            }
            // the hides: if they can't load, every message just stays up
            const hr = await supabase.from(HIDES).select('message_id, user_id').limit(5000).then(r => r, e => ({ error: e }));
            if (hr.error) console.warn('hides unavailable', hr.error);
            else { hides.clear(); myHides.clear(); for (const h of hr.data || []) if (h.message_id != null) addHide(h.message_id, h.user_id); }
            (res.data || []).reverse().forEach(addMessage);
        }

        // Escape HTML (visitor-written text is rendered as text)
        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function updateStats() {
            let corrupted = 0;
            for (const key of nodes.keys()) if (looks.get(key) && looks.get(key).corrupted) corrupted++;
            document.getElementById('messageCount').textContent = nodes.size;
            document.getElementById('corruptedCount').textContent = corrupted;
        }

        function addMessage(msg) {
            if (!msg) return;
            const key = msgKey(msg);
            if (messages.some(m => msgKey(m) === key)) return;
            messages.push(msg);
            if (messages.length > 200) {
                const old = messages.shift();
                const el = nodes.get(msgKey(old));
                if (el) { el.remove(); nodes.delete(msgKey(old)); }
            }
            if (!isHidden(msg)) displayMessage(msg);
            updateStats();
        }

        // Display message
        function displayMessage(msg) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const key = msgKey(msg);

            if (!looks.has(key)) {
                const corrupted = !!msg.is_corrupted || Math.random() < 0.15;
                looks.set(key, { corrupted, text: corrupted ? corruptText(String(msg.message || '')) : msg.message });
            }
            const look = looks.get(key);
            const own = isOwn(msg);
            const hideBtn = own ? '' : `<button class="void-hide" type="button" data-key="${escapeHtml(key)}" aria-label="Hide this message" title="Hide it for you. Two hides take it down for everyone.">hide</button>`;

            messageDiv.className = 'message' + (look.corrupted ? ' corrupted' : '');
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="username">${escapeHtml(msg.username || 'Anonymous Void Traveler')}</span>
                    <span class="message-meta"><span class="timestamp">${new Date(msg.created_at).toLocaleTimeString()}</span>${hideBtn}</span>
                </div>
                <div class="message-text ${look.corrupted ? 'corrupted-text' : ''}">${escapeHtml(look.text)}</div>
                <div class="void-hidden-note" hidden>hidden from everyone else by readers</div>
            `;
            if (own && hidesOn(msg) >= HIDE_AT) messageDiv.querySelector('.void-hidden-note').hidden = false;

            messagesContainer.appendChild(messageDiv);
            nodes.set(key, messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // A message got a hide: take it off the screen, or tell its author
        function refresh(key) {
            const m = messages.find(x => msgKey(x) === key);
            const el = nodes.get(key);
            if (!m || !el) return;
            if (isHidden(m)) { el.remove(); nodes.delete(key); }
            else if (isOwn(m) && hidesOn(m) >= HIDE_AT) el.querySelector('.void-hidden-note').hidden = false;
            updateStats();
        }

        async function hideMessage(key) {
            if (!key) return;
            if (!user) { note('no session: reload the page to hide messages'); return; }
            addHide(key, user.id);
            refresh(key);
            const { error } = await supabase.from(HIDES).insert({ user_id: user.id, message_id: key }).then(r => r, e => ({ error: e }));
            if (error) { console.warn('hide failed', error); note('hidden for you until you reload (the hide did not save)'); }
        }

        // Rate limiting
        let lastMessageTime = 0;
        const MESSAGE_COOLDOWN = 1500; // 1.5 seconds between messages

        // Send message
        window.sendMessage = async function() {
            const messageInput = document.getElementById('messageInput');
            const usernameInput = document.getElementById('username');
            const message = messageInput.value.trim().slice(0, MAX_LEN);
            const username = usernameInput.value.trim().slice(0, NAME_LEN) || 'Anonymous Void Traveler';

            if (!message) return;
            if (!user) { note('no session: reload the page to transmit'); return; }

            // Rate limiting
            const now = Date.now();
            if (now - lastMessageTime < MESSAGE_COOLDOWN) {
                note('the void needs a second between transmissions');
                return;
            }
            lastMessageTime = now;
            note('');

            const isCorrupted = Math.random() < 0.2; // 20% chance of corruption

            const { data, error } = await supabase
                .from(MSGS)
                .insert({
                    user_id: user.id,
                    username: username,
                    message: message,
                    is_corrupted: isCorrupted
                })
                .select()
                .single()
                .then(r => r, e => ({ error: e }));

            if (error) {
                console.error('Error sending message', error);
                note('the transmission was lost: ' + (error.message || 'try again'));
                return;
            }
            messageInput.value = '';
            addMessage(data);
        };

        // Live: new messages, and hides on their own channel so a missing table can't stop the chat
        function subscribeToMessages() {
            supabase
                .channel('cosmic_messages')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: MSGS },
                    (payload) => {
                        addMessage(payload.new);
                    }
                )
                .subscribe();
            supabase
                .channel('cosmic_chat_hides')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: HIDES },
                    (payload) => {
                        const h = payload.new;
                        if (!h || h.message_id == null) return;
                        addHide(h.message_id, h.user_id);
                        refresh(h.message_id);
                    }
                )
                .subscribe();
        }

        // Update void strength indicator
        function updateVoidStrength() {
            setInterval(() => {
                const strength = Math.floor(Math.random() * 10) + 1;
                const filled = '█'.repeat(strength);
                const empty = '░'.repeat(10 - strength);
                document.getElementById('voidStrength').textContent = filled + empty;
            }, 3000);
        }

        document.getElementById('messages').addEventListener('click', (e) => {
            const hb = e.target.closest('.void-hide');
            if (hb) hideMessage(hb.dataset.key);
        });

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
                sendMessage();
            }
        });

        // Initialize everything
        createStars();
        init();
    </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
