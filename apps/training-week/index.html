<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Week — a calm weekly scheduler</title>
<meta name="description" content="Plan your training week in a minute: sessions, durations, goals, and a satisfying tick when they're done. Calm by design, saved in your browser.">
<meta property="og:title" content="Training Week — a calm weekly scheduler">
<meta property="og:description" content="Weekly sessions, durations, goals, completion ticks. Calm, mobile-friendly, yours.">
<meta property="og:url" content="https://sloppy.live/training-week/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/minimal%20calm%20weekly%20planner%20on%20cream%20paper%2C%20sage%20green%20checkmarks%2C%20soft%20morning%20light%2C%20a%20water%20bottle%20and%20running%20shoes%2C%20flat%20editorial%20illustration.png?width=1200&height=630&seed=5150&nologo=true">
<link rel="icon" href="https://emojicdn.elk.sh/🗓️">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Albert+Sans:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7f4ed; --card:#fdfcf8; --line:#e3ddce; --ink:#33312a; --dim:#8d8878;
  --sage:#6f8f6a; --sage-soft:#e8efe5; --clay:#c07856; --done:#4f7a4a;
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:var(--cream); color:var(--ink);
  font-family:'Albert Sans', sans-serif; font-weight:300;
}
main{ max-width:46rem; margin:0 auto; padding:1.2rem 1rem 4rem; }
header{ padding:1.2rem 0 .2rem; }
h1{
  font-family:'Instrument Serif', serif; font-weight:400; font-style:italic;
  font-size:clamp(2.2rem, 7vw, 3.2rem); margin:0; line-height:1;
}
h1 b{ color:var(--sage); font-weight:400; }
.week-line{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; margin-top:.5rem; }
#week-label{ font-size:.85rem; color:var(--dim); }
#week-progress{ flex:1; min-width:9rem; height:.5rem; background:#ece7da; border-radius:1rem; overflow:hidden; }
#week-progress div{ height:100%; width:0%; background:var(--sage); border-radius:1rem; transition:width .5s ease; }
#week-stats{ font-size:.75rem; color:var(--dim); }
#week-stats b{ color:var(--done); font-weight:700; }

#goal-row{ margin-top:.9rem; }
#weekly-goal{
  width:100%; border:none; border-bottom:1px dashed var(--line); background:transparent;
  font-family:'Instrument Serif', serif; font-style:italic; font-size:1.05rem; color:var(--ink);
  padding:.4rem .1rem; min-height:2.4rem;
}
#weekly-goal::placeholder{ color:#b9b2a0; }
#weekly-goal:focus-visible{ outline:none; border-bottom-color:var(--sage); }

form#add{
  display:grid; grid-template-columns:6.4rem 1fr 5rem auto; gap:.5rem; margin-top:1.1rem;
  background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:.6rem;
}
@media (max-width:34rem){ form#add{ grid-template-columns:1fr 1fr; } form#add input[name=title]{ grid-column:span 2; } }
form#add select, form#add input, form#add button{
  font-family:inherit; font-size:.85rem; border:1px solid var(--line); border-radius:.5rem;
  background:#fff; color:var(--ink); padding:.5rem .6rem; min-height:2.75rem;
}
form#add input::placeholder{ color:#b9b2a0; }
form#add button{
  background:var(--sage); color:#fff; border-color:var(--sage); font-weight:500; cursor:pointer;
}
form#add button:hover{ filter:brightness(1.06); }
:focus-visible{ outline:3px solid var(--clay); outline-offset:2px; }
.form-hint{ font-size:.68rem; color:var(--dim); margin:.35rem .2rem 0; }

#days{ display:flex; flex-direction:column; gap:.7rem; margin-top:1.2rem; list-style:none; padding:0; }
.day{
  background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:.65rem .8rem;
}
.day.today{ border-color:var(--sage); box-shadow:0 2px 10px rgba(111,143,106,.12); }
.day h2{
  font-family:'Instrument Serif', serif; font-style:italic; font-weight:400;
  font-size:1.1rem; margin:0; display:flex; justify-content:space-between; align-items:baseline;
}
.day h2 .mins{ font-family:'Albert Sans', sans-serif; font-size:.68rem; color:var(--dim); font-style:normal; }
.day.today h2::after{ content:'today'; font-family:'Albert Sans',sans-serif; font-size:.6rem; font-style:normal;
  color:var(--sage); border:1px solid var(--sage); border-radius:1rem; padding:.1rem .5rem; margin-left:.5rem; }
.sessions{ list-style:none; margin:.4rem 0 0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
.sess{
  display:flex; gap:.6rem; align-items:center; border:1px solid var(--line); border-radius:.6rem;
  padding:.45rem .55rem; background:#fff; transition:opacity .3s, background .3s;
}
.sess.done{ background:var(--sage-soft); border-color:#ccdcc7; }
.sess.done .t{ text-decoration:line-through; color:var(--dim); }
.tickbtn{
  width:2.75rem; height:2.75rem; min-width:2.75rem; border-radius:.55rem; cursor:pointer;
  border:1.5px solid var(--line); background:#fff; font-size:1.1rem; color:transparent;
}
.sess.done .tickbtn{ background:var(--sage); border-color:var(--sage); color:#fff; }
.sess .body{ flex:1; min-width:0; }
.sess .t{ font-weight:500; font-size:.92rem; }
.sess .meta{ font-size:.7rem; color:var(--dim); line-height:1.5; }
.sess .meta i{ color:var(--clay); font-style:normal; }
.delbtn{
  width:2.75rem; height:2.75rem; min-width:2.75rem; border:none; background:none; color:#c9c2b0;
  font-size:1rem; cursor:pointer; border-radius:.5rem;
}
.delbtn:hover{ color:var(--clay); background:#f6ede7; }
.rest{ font-size:.75rem; color:#b9b2a0; font-style:italic; margin:.35rem 0 0; }
footer{ margin-top:2rem; font-size:.7rem; color:var(--dim); line-height:1.8; text-align:center; }
footer b{ color:var(--sage); font-weight:500; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
<header>
  <h1>training <b>week</b></h1>
  <div class="week-line">
    <span id="week-label">week of —</span>
    <div id="week-progress" role="progressbar" aria-label="Week completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
    <span id="week-stats">0 of 0 · 0 min done</span>
  </div>
  <div id="goal-row">
    <label for="weekly-goal" class="form-hint">this week's intention</label>
    <input id="weekly-goal" type="text" maxlength="120" placeholder="e.g. show up four times, keep it easy…">
  </div>
</header>

<form id="add">
  <select name="day" aria-label="Day of week">
    <option value="0">monday</option><option value="1">tuesday</option><option value="2">wednesday</option>
    <option value="3">thursday</option><option value="4">friday</option><option value="5">saturday</option>
    <option value="6">sunday</option>
  </select>
  <input name="title" type="text" maxlength="60" placeholder="session — e.g. easy run, upper body…" required aria-label="Session name">
  <input name="mins" type="number" min="5" max="480" step="5" value="45" aria-label="Duration in minutes">
  <button type="submit">add</button>
  <p class="form-hint" style="grid-column:1/-1; margin:0 .2rem;">optional goal for this session: <input name="goal" type="text" maxlength="80" placeholder="e.g. conversational pace · 3×8 comfortable" style="border:none; border-bottom:1px dashed var(--line); border-radius:0; background:transparent; width:60%; min-height:2rem; padding:.2rem;" aria-label="Session goal (optional)"></p>
</form>

<ol id="days" aria-label="Your training week"></ol>

<footer>
  your plan repeats weekly · ticks reset each monday, the plan stays ·
  everything lives in <b>your browser only</b> — nothing is uploaded, no account, no streaks, no guilt.
</footer>
</main>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

/* ── storage ── */
var K_PLAN='training-week-plan-v1', K_DONE='training-week-done-v1', K_GOAL='training-week-goal-v1';
function load(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ── week identity (monday-based ISO-ish key) ── */
function weekKey(d){
  d=d||new Date();
  var m=new Date(d); var wd=(m.getDay()+6)%7; m.setDate(m.getDate()-wd); m.setHours(0,0,0,0);
  return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0');
}
function weekLabel(){
  var k=weekKey(), d=new Date(k+'T00:00:00');
  return 'week of '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

var plan=load(K_PLAN,null);
if(!plan){
  plan=[
    { id:'ex1', day:0, title:'easy run', mins:40, goal:'conversational pace' },
    { id:'ex2', day:2, title:'strength — full body', mins:50, goal:'leave two reps in the tank' },
    { id:'ex3', day:5, title:'long walk or ride', mins:75, goal:'no phone, just weather' }
  ];
  save(K_PLAN,plan);
}
var doneAll=load(K_DONE,{});
var goals=load(K_GOAL,{});
function doneMap(){ var wk=weekKey(); if(!doneAll[wk]) doneAll[wk]={}; return doneAll[wk]; }

/* ── render ── */
function render(){
  $('week-label').textContent=weekLabel();
  $('weekly-goal').value=goals[weekKey()]||'';
  var dm=doneMap();
  var ol=$('days'); ol.innerHTML='';
  var today=(new Date().getDay()+6)%7;
  var total=0, doneN=0, minsDone=0, minsTotal=0;
  for(var d=0;d<7;d++){
    var sess=plan.filter(function(s){ return s.day===d; });
    var li=document.createElement('li');
    li.className='day'+(d===today?' today':'');
    var dayMins=sess.reduce(function(a,s){ return a+s.mins; },0);
    li.innerHTML='<h2>'+DAYS[d]+' <span class="mins">'+(dayMins? dayMins+' min planned':'')+'</span></h2>';
    if(!sess.length){
      li.innerHTML+='<p class="rest">rest — also part of the plan.</p>';
    } else {
      var ul=document.createElement('ul'); ul.className='sessions';
      sess.forEach(function(s){
        total++; minsTotal+=s.mins;
        var isDone=!!dm[s.id];
        if(isDone){ doneN++; minsDone+=s.mins; }
        var row=document.createElement('li');
        row.className='sess'+(isDone?' done':'');
        row.dataset.id=s.id;
        row.innerHTML='<button type="button" class="tickbtn" aria-pressed="'+isDone+'" aria-label="Mark '+s.title.replace(/"/g,'')+' as '+(isDone?'not done':'done')+'">✓</button>'
          +'<span class="body"><span class="t"></span><span class="meta">'+s.mins+' min'+(s.goal?' · <i></i>':'')+'</span></span>'
          +'<button type="button" class="delbtn" aria-label="Remove '+s.title.replace(/"/g,'')+'">✕</button>';
        row.querySelector('.t').textContent=s.title;
        if(s.goal) row.querySelector('.meta i').textContent=s.goal;
        row.querySelector('.tickbtn').addEventListener('click', function(){
          var m=doneMap();
          if(m[s.id]) delete m[s.id]; else m[s.id]=true;
          save(K_DONE,doneAll); render();
        });
        row.querySelector('.delbtn').addEventListener('click', function(){
          plan=plan.filter(function(p){ return p.id!==s.id; });
          save(K_PLAN,plan); render();
        });
        ul.appendChild(row);
      });
      li.appendChild(ul);
    }
    ol.appendChild(li);
  }
  var pct=total? Math.round(doneN/total*100):0;
  $('week-progress').firstElementChild.style.width=pct+'%';
  $('week-progress').setAttribute('aria-valuenow',pct);
  $('week-stats').innerHTML='<b>'+doneN+'</b> of '+total+' · <b>'+minsDone+'</b>/'+minsTotal+' min done';
}

/* ── add ── */
$('add').addEventListener('submit', function(e){
  e.preventDefault();
  var f=this;
  var title=f.title.value.trim(); if(!title) return;
  plan.push({ id:'s'+Date.now().toString(36)+Math.floor(Math.random()*999),
    day:+f.day.value, title:title.slice(0,60),
    mins:Math.max(5,Math.min(480,+f.mins.value||45)),
    goal:f.goal.value.trim().slice(0,80) });
  save(K_PLAN,plan);
  f.title.value=''; f.goal.value='';
  render();
});
$('weekly-goal').addEventListener('input', function(){
  goals[weekKey()]=this.value.slice(0,120);
  save(K_GOAL,goals);
});

render();
window.__TW={ render:render, weekKey:weekKey, get plan(){ return plan; }, doneMap:doneMap };
})();
</script>
</body>
</html>
