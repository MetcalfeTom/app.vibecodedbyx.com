  var lean=(t>.4&&t<.9)?Math.max(0,Math.sin((t-.4)*Math.PI/.16))*.25:0, talk=env(now-S.bub.p.at,.05,1.7,.15);

  g.beginPath(); g.moveTo(-9,-6); g.lineTo(-22,-2); g.lineTo(-20,-9); g.lineTo(-8,-13); g.closePath(); g.fillStyle='#7d86a8'; g.fill(); line(g,2.2);
  g.beginPath(); g.ellipse(0,-12,14,11,-.15,0,7); var bg=g.createLinearGradient(0,-23,0,-1); bg.addColorStop(0,'#c3c9e3'); bg.addColorStop(1,'#8d96b8'); g.fillStyle=bg; g.fill(); line(g,2.4);
  g.beginPath(); g.ellipse(8,-19,6.5,6,0,0,7); var ng=g.createLinearGradient(3,-24,13,-14); ng.addColorStop(0,'#7fd6a6'); ng.addColorStop(1,'#b48ae0'); g.fillStyle=ng; g.fill();
  g.save(); g.translate(bob,0); g.beginPath(); g.arc(11,-27,7.5,0,7); g.fillStyle='#c3c9e3'; g.fill(); line(g,2.4);
  g.fillStyle='#ff9a4a'; g.beginPath(); g.arc(13,-28,3,0,7); g.fill(); g.fillStyle='#1c0b06'; g.beginPath(); g.arc(13.4,-28,1.6,0,7); g.fill(); sparkle(g,12.4,-29.4,1.2,1);
  g.beginPath(); g.moveTo(17.5,-28); g.lineTo(23,-25.5); g.lineTo(17.5,-24.5); g.closePath(); g.fillStyle='#ffcf8a'; g.fill(); line(g,1.4);
  if(talk>0&&Math.sin(now*20)>0){ g.beginPath(); g.moveTo(17.5,-24.5); g.lineTo(22,-22); line(g,1.4); }
  g.fillStyle=K.blush; g.globalAlpha=.7; g.beginPath(); g.ellipse(9,-23,3,1.8,0,0,7); g.fill(); g.globalAlpha=1; g.restore();
  g.save(); g.translate(-4,-14); g.rotate(-.5-wa); g.beginPath(); g.ellipse(-9,0,11,5,0,0,7); g.fillStyle='#b3bad8'; g.fill(); line(g,2); g.restore();
  g.beginPath(); g.moveTo(-3,-2); g.lineTo(-5,3); g.moveTo(3,-2); g.lineTo(2,3); line(g,2,'#e5788a');
  g.restore(); }

function sceneXY(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]; }
cv.addEventListener('pointermove',function(e){ if(!S.brush) return; var p=sceneXY(e); brushAt(p[0],p[1]); });
['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev,function(){ S.bp.down=false; }); });
cv.addEventListener('pointerdown',function(e){ var p=sceneXY(e), x=p[0], y=p[1];
  if(S.brush){ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(er){} S.bp.x=x; S.bp.y=y; S.bp.down=true; return; }
  if(S.bed){ if(x>120&&x<280&&y>230&&y<370){ speak('n','shhh… they just fell asleep.',null,1.6); } return; }
  if(x>262&&x<392&&y>36&&y<104){ if(ppOn()){ if(now-S.bub.p.at>2) ppTalk(); } else ppVisit(); return; }
  if(x<140&&y>220&&y<370) pat('w');
  else if(x>258&&y>100&&y<190) pat('m');
  else if(x>280&&y>230&&y<380) pat('b');

});
