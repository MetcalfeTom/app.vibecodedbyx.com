<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fursona Ref Sheet Maker</title>
  <meta name="description" content="Snap on ears and a tail, drag your colors onto every part, and download your fursona's ref sheet.">
  <link rel="icon" href="https://emojicdn.elk.sh/🐾">
  <meta property="og:title" content="Fursona Ref Sheet Maker">
  <meta property="og:description" content="Pick the ears, pick the tail, choose every single color. Download your ref sheet.">
  <meta property="og:url" content="https://app.sloppy.live/fursona-ref-sheet/">
  <meta property="og:image" content="https://app.sloppy.live/fursona-ref-sheet/og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f3ebdc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Sometype+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3ebdc; --paper2: #fbf6ec; --ink: #2d2233; --soft: #7b6f73; --tomato: #ff5d47; --teal: #1f8a8a; --tape: rgba(255, 214, 102, .75);
      --display: 'Bagel Fat One', 'Cooper Black', serif; --mono: 'Sometype Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mono); color: var(--ink); min-height: 100vh; min-height: 100dvh;
      background: radial-gradient(circle, rgba(45, 34, 51, .13) 1px, transparent 1.4px) 0 0 / 22px 22px, var(--paper);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
    header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4.6vw, 46px); line-height: .95; letter-spacing: -.5px; }
    h1 span { color: var(--tomato); }
    header p { font-size: 13px; color: var(--soft); }

    /* ---------- the sheet ---------- */
    .sheet { position: relative; background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 6px; box-shadow: 7px 7px 0 var(--ink); padding: 16px 18px 18px; animation: drop .6s cubic-bezier(.2, 1.4, .4, 1) both; }
    .sheet::before, .sheet::after { content: ''; position: absolute; width: 86px; height: 24px; background: var(--tape); top: -12px; transform: rotate(-4deg); }
    .sheet::before { left: 22px; } .sheet::after { right: 22px; transform: rotate(5deg); }
    @keyframes drop { from { opacity: 0; transform: translateY(-18px) rotate(-1.5deg); } }
    .sheet-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px dashed rgba(45, 34, 51, .3); padding-bottom: 8px; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 2px; background: var(--ink); color: var(--paper2); padding: 3px 7px; border-radius: 3px; }
    #nameOut { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; word-break: break-word; }
    #speciesOut { font-size: 14px; color: var(--soft); }
    .sheet-body { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(150px, 1fr); gap: 12px; align-items: center; }
    #oc { width: 100%; height: auto; display: block; max-height: 64vh; touch-action: manipulation; }
    #oc [data-r] { cursor: pointer; transition: filter .15s; }
    #oc .hl { filter: brightness(1.18) saturate(1.2) drop-shadow(0 0 5px rgba(255, 93, 71, .9)); }
    #oc.pop { animation: pop .35s ease; }
    #oc .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.08); } }
    @keyframes pop { 40% { transform: scale(1.025) rotate(-.6deg); } }
    .pal { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .pal li { display: flex; align-items: center; gap: 10px; }
    .pal button.chip { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); flex: none; cursor: pointer; transition: transform .15s; }
    .pal button.chip:hover { transform: scale(1.1); }
    .pal li.hl .chip { transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255, 93, 71, .6); }
    .pal .lbl { font-size: 12px; line-height: 1.25; }
    .pal .lbl b { display: block; font-size: 13px; }
    .pal .lbl i { font-style: normal; color: var(--soft); text-transform: uppercase; }
    .pal li.off { opacity: .35; }

    /* ---------- tools ---------- */
    .tools { display: flex; flex-direction: column; gap: 14px; }
    .box { background: var(--paper2); border: 2px solid var(--ink); border-radius: 6px; padding: 12px 12px 13px; animation: rise .5s ease both; }
    .box:nth-child(2) { animation-delay: .07s; } .box:nth-child(3) { animation-delay: .14s; } .box:nth-child(4) { animation-delay: .21s; } .box:nth-child(5) { animation-delay: .28s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .box h2 { font-size: 11px; letter-spacing: 2.5px; font-weight: 700; margin-bottom: 9px; display: flex; justify-content: space-between; gap: 8px; }
    .box h2 small { font-weight: 400; letter-spacing: 0; color: var(--soft); font-size: 11px; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 7px; }
    .sw { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ink); cursor: grab; touch-action: none; transition: transform .12s; position: relative; }
    .sw:hover { transform: translateY(-2px) scale(1.07); }
    .sw.brush { box-shadow: 0 0 0 3px var(--paper2), 0 0 0 5.5px var(--tomato); }
    .sw.custom { background: conic-gradient(#ff5d47, #ffd166, #7bd389, #3bb3c4, #6a6ff0, #d46ad9, #ff5d47); overflow: hidden; }
    .sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button, .actions button { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: transform .12s, background .12s; }
    .chips button:hover, .actions button:hover { transform: translateY(-1px); }
    .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper2); }
    .presets button { border-style: dashed; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .fields label { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
    .fields input { font-family: var(--mono); font-size: 14px; padding: 7px 9px; border: 2px solid var(--ink); border-radius: 5px; background: var(--paper); color: var(--ink); min-width: 0; width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .go { background: var(--tomato); color: #fff; }
    button:focus-visible, input:focus-visible, .sw:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
    .hint { font-size: 12px; color: var(--soft); margin-top: 8px; min-height: 1.3em; }
    .ghost { position: fixed; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); pointer-events: none; z-index: 50; transform: translate(-50%, -115%); box-shadow: 3px 3px 0 var(--ink); }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); background: var(--ink); color: var(--paper2); padding: 9px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    @media (max-width: 860px) {
      .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 12px; }
      .sheet-body { grid-template-columns: minmax(0, 1fr) 128px; gap: 6px; }
      .sheet { padding: 12px 12px 14px; box-shadow: 5px 5px 0 var(--ink); }
      #oc { max-height: 52vh; }
      .pal button.chip { width: 30px; height: 30px; }
      .pal .lbl { font-size: 11px; } .pal .lbl b { font-size: 11.5px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Fursona <span>Ref Sheet</span></h1>
      <p>snap on ears &amp; a tail · drag colors onto any part</p>
    </header>

    <section class="sheet" id="sheet" aria-label="Your ref sheet">
      <div class="sheet-head"><span class="tag">REF SHEET</span><h2 id="nameOut">Your OC</h2><span id="speciesOut">wolf</span></div>
      <div class="sheet-body">
        <svg id="oc" viewBox="0 -18 360 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your character"></svg>
        <ul class="pal" id="pal" aria-label="Color palette, tap a color to change it"></ul>
      </div>
    </section>

    <div class="tools">
      <section class="box" aria-labelledby="hColors">
        <h2 id="hColors">COLORS <small>drag onto a part · or tap one, then tap parts</small></h2>
        <div class="swatches" id="swatches"></div>
        <p class="hint" id="hint" aria-live="polite"></p>
      </section>
      <section class="box" aria-labelledby="hEars"><h2 id="hEars">EARS</h2><div class="chips" id="ears"></div></section>
      <section class="box" aria-labelledby="hTail"><h2 id="hTail">TAIL</h2><div class="chips" id="tails"></div></section>
      <section class="box" aria-labelledby="hMore"><h2 id="hMore">HAIR · MARKINGS · EXTRAS</h2><div class="chips" id="hair"></div><div class="chips" id="marks" style="margin-top:8px"></div><div class="chips" id="extras" style="margin-top:8px"></div></section>
      <section class="box" aria-labelledby="hInfo">
        <h2 id="hInfo">ABOUT <small>start from a preset</small></h2>
        <div class="chips presets" id="presets" style="margin-bottom:10px"></div>
        <div class="fields">
          <label>NAME <input id="nameIn" maxlength="24" value="Your OC" autocomplete="off"></label>
          <label>SPECIES <input id="speciesIn" maxlength="28" value="wolf" autocomplete="off"></label>
        </div>
      </section>
      <div class="actions">
        <button class="go" id="dl">⬇ Download PNG</button>
        <button id="share">🔗 Copy link</button>
        <button id="rand">🎲 Random</button>
        <button id="undo" aria-label="Undo">↶ Undo</button>
      </div>
    </div>
  </div>
  <input type="color" id="picker" class="sr" aria-label="Pick a color for the selected part" tabindex="-1">
  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const OUT = '#2d2233';
  const REGIONS = [['main', 'Main fur'], ['belly', 'Belly & muzzle'], ['hair', 'Hair'], ['eyes', 'Eyes'], ['nose', 'Nose'], ['mark', 'Markings'], ['tailtip', 'Tail tip'], ['horns', 'Horns'], ['wings', 'Wings'], ['accent', 'Bandana']];
  const EXTRA_C = { horns: '#f2e3a6', wings: '#5d4b7a', accent: '#ff5d47' };
  const circ = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;

  // ---------- the base, drawn left-side-only and mirrored ----------
  const HEAD = 'M102 150C102 100 140 82 180 82C220 82 258 100 258 150C258 170 252 185 244 195L262 205L238 210L250 222L222 218C210 226 196 230 180 230C164 230 150 226 138 218L110 222L122 210L98 205L116 195C108 185 102 170 102 150Z';
  const MUZZLE = 'M142 196C142 172 160 164 180 164C200 164 218 172 218 196C218 214 200 224 180 224C160 224 142 214 142 196Z';
  const MASK = 'M100 132C140 116 220 116 260 132C262 160 238 174 212 170C198 164 188 162 180 166C172 162 162 164 148 170C122 174 98 160 100 132Z';
  const NOSE = 'M166 176Q180 168 194 176Q190 190 180 192Q170 190 166 176Z';
  const TORSO = 'M140 222C128 254 122 300 128 346L232 346C238 300 232 254 220 222Z';
  const BELLY = 'M150 230Q180 246 210 230C216 262 214 300 206 326L198 318L192 332L186 320L180 336L174 320L168 332L162 318L154 326C146 300 144 262 150 230Z';
  const LEG = 'M134 334C128 372 130 410 136 444L176 444C178 410 180 372 182 340Z';
  const FOOT = 'M124 450C124 440 136 434 152 434C168 434 180 440 180 450C180 458 168 462 152 462C136 462 124 458 124 450Z';
  const ARM = 'M142 232C118 244 104 284 106 318C107 332 124 334 126 320C126 296 132 272 146 256Z';
  const PAW = circ(116, 322, 13);
  const toes = (d) => `<path d="${d}" fill="none" stroke="${OUT}" stroke-width="2.2" stroke-linecap="round" pointer-events="none"/>`;
  const PAW_TOES = toes('M111 328v6M119 328v6'), FOOT_TOES = toes('M143 452v7M152 453v8M161 452v7');
  const SOCK_LEG = 'M100 406h90v70h-90Z', SOCK_ARM = 'M92 298h52v50h-52Z';
  const mx = (d) => d.replace(/([ML])(-?[\d.]+) /g, (_, c, x) => c + (360 - x) + ' '); // mirror a simple M/L polygon
  const W2 = (...ds) => ds.map((d) => d + mx(d)).join('');
  const STRIPES = {
    head: 'M173 83L180 108L187 83Z' + W2('M146 90L160 112L156 88Z', 'M100 156L128 164L101 170Z', 'M104 180L126 184L108 190Z'),
    torso: W2('M126 256L152 266L128 274Z', 'M126 290L150 298L126 306Z', 'M127 322L148 328L128 336Z'),
    arm: 'M104 262L128 270L102 278Z' + 'M103 292L126 298L104 306Z',
    leg: 'M128 358L154 366L128 374Z' + 'M129 390L152 398L130 406Z' + 'M132 422L152 428L133 436Z',
    tail: Array.from({ length: 9 }, (_, i) => { const x = 226 + i * 17; return `M${x} 380L${x + 10} 380L${x + 70} 170L${x + 60} 170Z`; }).join(''),
  };
  const SPOTS = {
    head: circ(126, 126, 6) + circ(118, 142, 4) + circ(236, 120, 5) + circ(246, 134, 6) + circ(172, 96, 4),
    torso: circ(136, 272, 7) + circ(142, 300, 5) + circ(226, 284, 6) + circ(218, 316, 5) + circ(138, 330, 4),
    arm: circ(116, 272, 5) + circ(112, 298, 4),
    leg: circ(146, 372, 6) + circ(160, 400, 4) + circ(144, 420, 5),
    tail: Array.from({ length: 24 }, (_, i) => circ(236 + (i % 6) * 22 + (i / 6 & 1) * 11, 186 + (i / 6 | 0) * 44 + (i % 3) * 6, 6)).join(''),
  };
  const pat = (key) => [{ k: 'stripes', d: STRIPES[key] }, { k: 'spots', d: SPOTS[key] }];

  const EARS = {
    pointy: { label: 'Pointy', outer: 'M118 122C110 96 104 66 108 36C130 50 152 72 166 98Z', inner: 'M124 110C120 90 116 70 118 54C132 66 146 80 154 98Z', tip: circ(108, 36, 24) },
    cat: { label: 'Cat', outer: 'M116 116C112 100 112 80 116 62C132 70 150 84 162 100Z', inner: 'M122 106C120 94 120 82 122 74C134 80 144 88 152 100Z', tip: circ(116, 62, 18) },
    tufted: { label: 'Lynx tufts', outer: 'M116 116C112 100 112 80 116 62C132 70 150 84 162 100Z', inner: 'M122 106C120 94 120 82 122 74C134 80 144 88 152 100Z', tip: circ(116, 62, 18), tuft: 'M114 68L106 30L118 50L122 22L130 62Z' },
    round: { label: 'Round', outer: circ(120, 96, 30), inner: circ(122, 98, 17), tip: circ(100, 70, 24) },
    floppy: { label: 'Floppy', outer: 'M128 102C100 94 78 126 80 168C82 202 106 210 116 188C122 168 124 140 140 114Z', tip: circ(88, 204, 30), front: true },
    bunny: { label: 'Bunny', outer: 'M142 100C118 70 106 22 120 -2C138 -10 160 38 164 94Z', inner: 'M144 88C128 64 120 28 126 10C136 6 152 44 154 86Z', tip: circ(118, -6, 26) },
  };
  const TAILS = {
    none: { label: 'None' },
    short: { label: 'Short', d: 'M222 318C246 312 262 300 262 284C276 300 270 330 228 340Z', tip: circ(264, 290, 15) },
    medium: { label: 'Medium', d: 'M222 320C262 318 284 290 278 246C300 278 298 336 228 344Z', tip: circ(282, 252, 26) },
    long: { label: 'Long', d: 'M222 322C296 330 322 270 306 190C338 240 344 346 230 348Z', tip: circ(312, 196, 32) },
    fluffy: { label: 'Fluffy', d: 'M220 316C270 330 318 300 312 214C346 244 356 326 306 352C280 364 250 358 226 346Z', tip: circ(322, 222, 42) },
  };
  const HAIR = {
    tuft: { label: 'Tuft', d: 'M148 96C150 78 162 70 172 56C174 70 180 72 190 58C194 72 202 76 208 64C214 78 214 88 212 98C194 88 166 88 148 96Z' },
    swoop: { label: 'Swoop', d: 'M130 110C138 78 176 64 216 78C238 88 250 108 248 128C232 110 210 102 188 106C174 108 158 116 148 128C144 120 138 114 130 110Z' },
    none: { label: 'None' },
  };
  const WING = 'M146 244C120 214 80 186 34 178C44 200 46 222 40 244C58 236 70 240 78 256C88 246 102 246 112 260C120 252 132 252 140 262Z';
  const WING_BONES = 'M140 240L40 182M140 244L76 252M140 248L110 258';
  const HORN = 'M146 98C132 84 126 62 134 42C140 62 152 78 166 88Z';
  const BANDANA = 'M130 214C158 236 202 236 230 214L236 232C224 242 212 248 200 252L180 290L160 252C148 248 136 242 124 232Z', BANDANA_FOLD = 'M166 254Q180 262 194 254';
  const EXTRAS = [['horns', 'Horns'], ['wings', 'Wings'], ['bandana', 'Bandana'], ['glasses', 'Glasses']];
  const MARKS = [['stripes', 'Stripes'], ['spots', 'Spots'], ['ears', 'Ear tips'], ['socks', 'Socks'], ['mask', 'Mask'], ['tail', 'Tail tip']];

  const PRESETS = {
    Wolf: { ears: 'pointy', tail: 'long', hair: 'tuft', marks: { ears: true, socks: false, mask: false, tail: true }, c: { main: '#8a8f9c', belly: '#ebe7e1', hair: '#5d6270', eyes: '#f2b632', nose: '#2d2233', mark: '#4b4f5c', tailtip: '#4b4f5c' } },
    Fox: { ears: 'pointy', tail: 'fluffy', hair: 'swoop', marks: { ears: true, socks: true, mask: false, tail: true }, c: { main: '#e0762f', belly: '#fff4e6', hair: '#b85420', eyes: '#3f8f5a', nose: '#2d2233', mark: '#3a2a2e', tailtip: '#fff4e6' } },
    Cat: { ears: 'cat', tail: 'long', hair: 'tuft', marks: { ears: false, socks: true, mask: false, tail: false }, c: { main: '#3b3440', belly: '#f3efe8', hair: '#2a242e', eyes: '#9bd84a', nose: '#f28fa0', mark: '#f3efe8', tailtip: '#f3efe8' } },
    Bunny: { ears: 'bunny', tail: 'short', hair: 'swoop', marks: { ears: true, socks: false, mask: false, tail: true }, c: { main: '#f5efe6', belly: '#ffffff', hair: '#e8cfb3', eyes: '#d94f70', nose: '#f7a1b5', mark: '#c9b39a', tailtip: '#ffffff' } },
    Dog: { ears: 'floppy', tail: 'medium', hair: 'tuft', marks: { ears: true, socks: false, mask: false, tail: false }, c: { main: '#c68a4f', belly: '#f6e7d1', hair: '#8a5a2f', eyes: '#6b3f1f', nose: '#2d2233', mark: '#7a4b25', tailtip: '#f6e7d1' } },
    Raccoon: { ears: 'round', tail: 'fluffy', hair: 'none', marks: { ears: false, socks: true, mask: true, tail: true }, c: { main: '#8c8a8f', belly: '#dcd8d3', hair: '#6a686e', eyes: '#c77dff', nose: '#2d2233', mark: '#2d2233', tailtip: '#2d2233' } },
    Tiger: { ears: 'round', tail: 'long', hair: 'tuft', marks: { stripes: true, spots: false, ears: true, socks: false, mask: false, tail: true }, c: { main: '#f08a24', belly: '#fff6e8', hair: '#d9661a', eyes: '#f2c14e', nose: '#e07a8a', mark: '#2d2233', tailtip: '#2d2233' } },
    Dragon: { ears: 'pointy', tail: 'long', hair: 'none', extra: { horns: true, wings: true }, marks: { spots: true, ears: false, socks: false, mask: false, tail: true, stripes: false }, c: { main: '#3aa17e', belly: '#f2e3a6', hair: '#2c6e58', eyes: '#f2c14e', nose: '#1f4d3e', mark: '#2c6e58', tailtip: '#2c6e58', horns: '#f2e3a6', wings: '#6d4fa8', accent: '#ff5d47' } },
    Lynx: { ears: 'tufted', tail: 'short', hair: 'tuft', marks: { ears: true, socks: false, mask: false, tail: true }, c: { main: '#d4a373', belly: '#fbf1e2', hair: '#a8774a', eyes: '#3bb3c4', nose: '#e07a8a', mark: '#2d2233', tailtip: '#2d2233' } },
  };
  const SWATCHES = ['#2d2233', '#4b4f5c', '#8a8f9c', '#ebe7e1', '#ffffff', '#fff4e6', '#f6e7d1', '#d4a373', '#c68a4f', '#8a5a2f', '#5a3a22', '#e0762f',
    '#ffb347', '#f2b632', '#fff176', '#9bd84a', '#3f8f5a', '#1f8a8a', '#3bb3c4', '#8fd3ff', '#3a5bd9', '#6a4fd9', '#c77dff', '#f7a1b5',
    '#e07a8a', '#d94f70', '#ff5d47', '#b3202c'];

  // ---------- state ----------
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let S = Object.assign(clone(PRESETS.Wolf), { name: 'Your OC', species: 'wolf', extra: {} });
  S.c = Object.assign({}, EXTRA_C, S.c);
  const hist = [];
  const save = () => { try { localStorage.setItem('fursona_sheet', JSON.stringify(S)); } catch (_) {} };
  function commit(fn) { hist.push(JSON.stringify(S)); if (hist.length > 60) hist.shift(); fn(); save(); render(); }
  function valid(o) {
    return o && EARS[o.ears] && TAILS[o.tail] && HAIR[o.hair] && o.c && REGIONS.every(([r]) => /^#[0-9a-f]{6}$/i.test(o.c[r])) && o.marks;
  }

  // ---------- drawing ----------
  const svg = document.getElementById('oc');
  let clipN = 0;
  const f = (r) => `fill="${S.c[r]}" data-r="${r}"`;
  const ol = (d, w = 3.4) => `<path d="${d}" fill="none" stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`;
  // a filled part, its marking overlays clipped to it, then its outline again on top so markings never eat the line
  function part(d, r, o = {}) {
    let s = `<path d="${d}" ${f(r)}/>`;
    const on = (o.marks || []).filter((m) => S.marks[m.k]);
    if (on.length) {
      const id = 'k' + clipN++;

  }
  const both = (fn) => fn() + `<g transform="matrix(-1 0 0 1 360 0)">${fn()}</g>`;
  function ear() {

    s += both(() => part(ARM, 'main', { marks: [...pat('arm'), { k: 'socks', d: SOCK_ARM }] }) + part(PAW, 'main', { marks: [{ k: 'socks', d: SOCK_ARM }] }) + PAW_TOES);

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const pal = $('pal'), hint = $('hint'), picker = $('picker');
  function used(r) {

    if (r === 'horns' || r === 'wings') return !!(S.extra || {})[r];

      `<li data-r="${r}" class="${used(r) ? '' : 'off'}"><button class="chip" data-r="${r}" style="background:${S.c[r]}" aria-label="${label}: ${S.c[r]}, tap to change"></button><span class="lbl"><b>${label}</b><i>${S.c[r]}</i></span></li>`).join('');

  function chips(id, set, key) {

    $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) commit(() => { S[key] = b.dataset.v; }); });
  }
  chips('ears', EARS, 'ears'); chips('tails', TAILS, 'tail'); chips('hair', Object.fromEntries(Object.entries(HAIR).map(([k, o]) => [k, { label: 'Hair: ' + o.label }])), 'hair');
  $('extras').innerHTML = EXTRAS.map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('');
  $('extras').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) commit(() => { S.extra = Object.assign({}, S.extra, { [b.dataset.v]: !(S.extra || {})[b.dataset.v] }); }); });
  $('marks').innerHTML = MARKS.map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('');
  $('marks').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) commit(() => { S.marks[b.dataset.v] = !S.marks[b.dataset.v]; }); });
  $('presets').innerHTML = Object.keys(PRESETS).map((k) => `<button data-v="${k}">${k}</button>`).join('');
  $('presets').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    commit(() => { const p = clone(PRESETS[b.dataset.v]); p.c = Object.assign({}, EXTRA_C, p.c); p.extra = p.extra || {}; Object.assign(S, p); if (!S.species || Object.keys(PRESETS).some((k) => k.toLowerCase() === S.species.toLowerCase())) S.species = b.dataset.v.toLowerCase(); });
    svg.classList.remove('pop'); void svg.getBoundingClientRect(); svg.classList.add('pop');
  });
  let typing;
  $('nameIn').addEventListener('input', (e) => { clearTimeout(typing); S.name = e.target.value; $('nameOut').textContent = S.name || 'Unnamed'; typing = setTimeout(save, 300); });

  // ---------- coloring: drag a swatch onto a part, or pick a brush and tap parts ----------
  let brush = null, hl = null;
  const sw = $('swatches');
  sw.innerHTML = SWATCHES.map((c) => `<button class="sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('') +
    '<label class="sw custom" title="Any color"><span class="sr">Custom color</span><input type="color" id="custom" value="#ff5d47"></label>';
  function setColor(r, c) {
    if (!r || S.c[r] === c) return;
    commit(() => { S.c[r] = c; });
    const name = REGIONS.find((x) => x[0] === r)[1];
    hint.textContent = name + ' → ' + c;
    if (!used(r)) hint.textContent += ' (turn on ' + (r === 'hair' ? 'a hair style' : 'a marking') + ' to see it)';
  }
  function highlight(r) {

    S.marks = { stripes: Math.random() < 0.2, spots: Math.random() < 0.15, ears: Math.random() < 0.5, socks: Math.random() < 0.45, mask: Math.random() < 0.2, tail: Math.random() < 0.6 };
    const main = wild ? hsl(h, 55 + Math.random() * 30, 45 + Math.random() * 20) : hsl(20 + Math.random() * 25, 20 + Math.random() * 45, 25 + Math.random() * 50);
    const hh = wild ? h : 30;
    S.c = { main, belly: hsl(hh, 40, 88 + Math.random() * 8), hair: hsl((hh + (wild ? 40 : 0)) % 360, 45, 30 + Math.random() * 20), eyes: hsl(Math.random() * 360, 70, 50),
      nose: pick(['#2d2233', '#f28fa0', '#e07a8a', '#5a3a22']), mark: hsl((hh + (wild ? 180 : 0)) % 360, wild ? 55 : 20, 18 + Math.random() * 25), tailtip: Math.random() < 0.5 ? '#fbf6ec' : hsl(hh, 30, 20), horns: pick(['#f2e3a6', '#e8e0d0', '#5a3a22', '#2d2233']), wings: hsl((hh + 200) % 360, 40, 35), accent: hsl(Math.random() * 360, 75, 55) };

  // share link: the whole sheet lives in the URL hash
  function encode() {
    const p = new URLSearchParams({ e: S.ears, t: S.tail, h: S.hair, m: MARKS.filter(([k]) => S.marks[k]).map(([k]) => k).join('.'), x: EXTRAS.filter(([k]) => (S.extra || {})[k]).map(([k]) => k).join('.'), c: REGIONS.map(([r]) => S.c[r].slice(1)).join('.'), n: S.name, s: S.species });

  };

  // PNG export: character SVG + palette drawn on a canvas with the page's fonts
  $('dl').onclick = async () => {
    const btn = $('dl'); btn.disabled = true;
    try {
      await document.fonts.ready;
      const W = 1200, H = 800, c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.fillStyle = '#fbf6ec'; x.fillRect(0, 0, W, H);
      x.fillStyle = 'rgba(45,34,51,.1)';
      for (let i = 11; i < W; i += 22) for (let j = 11; j < H; j += 22) { x.beginPath(); x.arc(i, j, 1.2, 0, 7); x.fill(); }
      x.strokeStyle = OUT; x.lineWidth = 5; x.strokeRect(14, 14, W - 28, H - 28);
      const src = new XMLSerializer().serializeToString(svg);

      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
      await img.decode();

      x.fillStyle = OUT; x.fillRect(48, 44, 150, 34);
      x.fillStyle = '#fbf6ec'; x.font = '700 18px "Sometype Mono", monospace'; x.textBaseline = 'middle'; x.fillText('REF SHEET', 66, 62);
      x.fillStyle = OUT; x.textBaseline = 'alphabetic';
      let fs = 70; x.font = `${fs}px "Bagel Fat One", serif`;
      while (x.measureText(S.name || 'Unnamed').width > W - 290 && fs > 30) x.font = `${fs -= 4}px "Bagel Fat One", serif`;
      x.fillText(S.name || 'Unnamed', 220, 90);
      x.fillStyle = '#7b6f73'; x.font = '26px "Sometype Mono", monospace'; x.fillText(S.species || '', 222, 128);
      const rows = REGIONS.filter(([r]) => used(r));
      const top = 200, gap = Math.min(82, 540 / rows.length);
      rows.forEach(([r, label], i) => {
        const y = top + i * gap;
        x.fillStyle = S.c[r]; x.beginPath(); x.arc(680, y, 28, 0, 7); x.fill(); x.lineWidth = 4; x.strokeStyle = OUT; x.stroke();
        x.fillStyle = OUT; x.font = '700 26px "Sometype Mono", monospace'; x.fillText(label, 728, y - 2);
        x.fillStyle = '#7b6f73'; x.font = '22px "Sometype Mono", monospace'; x.fillText(S.c[r].toUpperCase(), 728, y + 26);
      });
      const parts = [EARS[S.ears].label + ' ears', TAILS[S.tail].label === 'None' ? 'no tail' : TAILS[S.tail].label.toLowerCase() + ' tail'];
      x.fillStyle = OUT; x.font = '20px "Sometype Mono", monospace'; x.fillText(parts.join(' · '), 652, H - 48);

      a.href = URL.createObjectURL(blob);
      a.download = ((S.name || 'fursona').replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') || 'fursona') + '-ref-sheet.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Ref sheet downloaded');
    } catch (err) {
      console.error(err);
      toast("Couldn't make the PNG — try a screenshot");
    } finally { btn.disabled = false; }
  };

  // ---------- boot: shared link > saved sheet > wolf preset ----------
  const fromHash = decode(location.hash);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('fursona_sheet')); } catch (_) {}
  if (fromHash) S = fromHash;
  else if (saved && saved.c) { saved.c = Object.assign({}, EXTRA_C, saved.c); saved.extra = saved.extra || {}; if (valid(saved)) S = Object.assign(S, saved); }
  render();
  window.__ref = { get S() { return S; }, setColor, render, encode, decode, undo };
})();
