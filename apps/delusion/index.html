<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delusion — the host is lying to you</title>
<meta name="description" content="A charming host reads you facts. Some are lies. Every truth you miss cracks the glass between you — and it does not repair.">
<link rel="icon" href="https://emojicdn.elk.sh/🪞">
<meta property="og:title" content="Delusion — the host is lying to you">
<meta property="og:description" content="A charming host reads you facts. Some are lies. Every truth you miss cracks the glass between you — and it does not repair.">
<meta property="og:url" content="https://sloppy.live/delusion/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/elegant%20dark%20theatre%20stage%20with%20single%20spotlight%20on%20an%20ornate%20card%2C%20cracked%20glass%20overlay%20spreading%2C%20gold%20serif%20typography%2C%20psychological%20thriller%20poster%2C%20chiaroscuro%2C%20minimal.png?width=1200&height=630&nologo=true&seed=6006&model=flux">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0b0a0c; --stage:#141216; --edge:#26222b;
  --bone:#ece8e1; --dim:#8d8578;
  --gold:#b39a4d; --red:#a83a2e; --green:#5f7d54;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  font-family:'EB Garamond', serif;
  background:
    radial-gradient(42rem 30rem at 50% 18%, rgba(179,154,77,.07), transparent 60%),
    var(--void);
  color:var(--bone); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:1rem;
}
main{ width:min(42rem,100%); position:relative; }
header{ text-align:center; margin-bottom:1.6rem; }
h1{
  font-family:'Marcellus', serif; font-weight:400;
  font-size:clamp(2.2rem,7vw,3.4rem); letter-spacing:.34em; text-transform:uppercase;
  color:var(--bone); text-shadow:0 0 30px rgba(179,154,77,.35);
}
.tagline{ font-style:italic; color:var(--dim); font-size:1rem; margin-top:.2rem; }

.stage{
  position:relative;
  background:linear-gradient(170deg, #1a171d, var(--stage) 55%);
  border:1px solid var(--edge); border-radius:.6rem;
  padding:2rem 1.8rem 1.6rem;
  box-shadow:0 2rem 5rem rgba(0,0,0,.6), inset 0 1px 0 rgba(236,232,225,.05);
  overflow:hidden;
}
.hosteye{
  width:2.4rem; height:2.4rem; margin:0 auto .9rem; border-radius:50%;
  border:1px solid var(--gold); position:relative;
  animation:breathe 5s ease-in-out infinite;
}
.hosteye::after{
  content:''; position:absolute; inset:35%; border-radius:50%;
  background:var(--gold); box-shadow:0 0 14px rgba(179,154,77,.8);
}
@keyframes breathe{ 50%{ transform:scale(1.08); box-shadow:0 0 20px rgba(179,154,77,.25);} }
.hostline{
  min-height:3.4rem; text-align:center;
  font-style:italic; font-size:1.12rem; color:var(--dim); line-height:1.5;
}
.hostline .caret{ color:var(--gold); }
.statement{
  margin:1.4rem 0 1.8rem; text-align:center;
  font-size:clamp(1.3rem,4vw,1.7rem); font-weight:500; line-height:1.4;
  min-height:5.2rem; display:flex; align-items:center; justify-content:center;
}
.statement q{ quotes:'“' '”'; }
.verdicts{ display:flex; gap:1rem; }
.verdicts button{
  flex:1; min-height:3.4rem; cursor:pointer; border-radius:.4rem;
  font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:1rem; letter-spacing:.2em;
  background:none; border:1px solid var(--edge); color:var(--bone);
  transition:border-color .2s ease, transform .08s ease;
}
.verdicts button:hover{ border-color:var(--gold); }
.verdicts button:active{ transform:scale(.97); }
.verdicts button:disabled{ opacity:.35; cursor:default; }
#btn-truth:hover{ color:#cfd8c5; } #btn-lie:hover{ color:#d8b0a8; }
.meta{
  display:flex; justify-content:space-between; align-items:center; gap:1rem;
  margin-top:1.3rem; font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--dim);
}
.cracksmeter{ letter-spacing:.3em; }
.cracksmeter .c{ color:var(--red); }
.verdict-flash{
  text-align:center; font-family:'IBM Plex Mono', monospace; font-size:.78rem;
  min-height:1.2rem; margin-top:.7rem; letter-spacing:.14em;
}
.verdict-flash.good{ color:var(--green); }
.verdict-flash.bad{ color:var(--red); }

/* the glass */
#glass{
  position:fixed; inset:0; pointer-events:none; z-index:50;
}
.shaking{ animation:shake .45s ease; }
@keyframes shake{
  0%,100%{ transform:translate(0,0) rotate(0); }
  20%{ transform:translate(-6px,3px) rotate(-.4deg); }
  40%{ transform:translate(5px,-4px) rotate(.35deg); }
  60%{ transform:translate(-4px,2px) rotate(-.25deg); }
  80%{ transform:translate(3px,-2px) rotate(.15deg); }
}
/* endings */
.overlay{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(6,5,8,.88); backdrop-filter:blur(3px); padding:1rem;
}
.overlay .panel{
  max-width:30rem; text-align:center;
  border:1px solid var(--edge); border-radius:.6rem; background:var(--stage);
  padding:2.2rem 1.8rem;
}
.overlay h2{
  font-family:'Marcellus', serif; font-weight:400; font-size:1.6rem;
  letter-spacing:.22em; text-transform:uppercase; margin-bottom:.8rem;
}
.overlay .panel p{ color:var(--dim); font-style:italic; line-height:1.6; margin-bottom:.6rem; }
.overlay .score{ font-family:'IBM Plex Mono', monospace; font-size:.85rem; color:var(--gold); margin:.8rem 0 1.2rem; }
.overlay button{
  font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.85rem; letter-spacing:.15em;
  background:var(--gold); color:var(--void); border:0; border-radius:.35rem;
  padding:.8rem 1.6rem; min-height:2.75rem; cursor:pointer;
}
.hide{ display:none !important; }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }
.sr{ position:absolute; left:-999rem; }
@media (prefers-reduced-motion: reduce){
  .hosteye{ animation:none; } .shaking{ animation:none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Delusion</h1>
    <p class="tagline">the host would never lie to you. the glass says otherwise.</p>
  </header>

  <section class="stage" id="stage">
    <div class="hosteye" aria-hidden="true"></div>
    <p class="hostline" aria-live="polite"><span id="host"></span><span class="caret" id="caret">▌</span></p>
    <p class="statement"><q id="statement"></q></p>
    <div class="verdicts">
      <button type="button" id="btn-truth">TRUTH</button>
      <button type="button" id="btn-lie">LIE</button>
    </div>
    <p class="verdict-flash" id="flash" role="status" aria-live="polite"></p>
    <div class="meta">
      <span id="round">round 1 / 20</span>
      <span class="cracksmeter" id="cracks" aria-label="Cracks in the glass"></span>
    </div>
  </section>

  <div class="overlay hide" id="end">
    <div class="panel">
      <h2 id="end-title"></h2>
      <p id="end-line1"></p>
      <p id="end-line2"></p>
      <p class="score" id="end-score"></p>
      <button type="button" id="again">sit down again</button>
    </div>
  </div>
</main>
<canvas id="glass" aria-hidden="true"></canvas>
<p class="sr" role="status" aria-live="polite" id="announce"></p>

<script>
'use strict';
/* ── the statement bank: t = the actual truth of the sentence ── */
const BANK=[
  {s:'Honey found in ancient tombs is still edible.',t:true},
  {s:'The Great Wall of China is visible from the Moon.',t:false},
  {s:'Octopuses have three hearts.',t:true},
  {s:'Goldfish can only remember things for three seconds.',t:false},
  {s:'Bananas are berries, botanically speaking.',t:true},
  {s:'Humans use only ten percent of their brains.',t:false},
  {s:'A day on Venus is longer than its year.',t:true},
  {s:'Napoleon was unusually short for his era.',t:false},
  {s:'Sharks existed before trees did.',t:true},
  {s:'Bulls become enraged by the color red.',t:false},
  {s:'Scotland’s national animal is the unicorn.',t:true},
  {s:'Lightning never strikes the same place twice.',t:false},
  {s:'Wombats produce cube-shaped droppings.',t:true},
  {s:'You must wait an hour after eating before swimming, or you will cramp and drown.',t:false},
  {s:'Hot water can freeze faster than cold water under some conditions.',t:true},
  {s:'Sugar makes children hyperactive.',t:false},
  {s:'The Eiffel Tower grows taller in summer.',t:true},
  {s:'Different areas of the tongue taste different flavors.',t:false},
  {s:'There are more possible chess games than atoms in the observable universe.',t:true},
  {s:'Vikings wore horned helmets into battle.',t:false},
  {s:'A group of flamingos is called a flamboyance.',t:true},
  {s:'Cracking your knuckles causes arthritis.',t:false},
  {s:'Some turtles can breathe through their rear ends.',t:true},
  {s:'Bats are blind.',t:false},
  {s:'Oxford University is older than the Aztec Empire.',t:true},
  {s:'Einstein failed mathematics at school.',t:false},
  {s:'Cleopatra lived closer in time to the smartphone than to the building of the Great Pyramid.',t:true},
  {s:'Dropping a penny from a skyscraper can kill a pedestrian.',t:false},
  {s:'Sea otters hold hands while sleeping so they do not drift apart.',t:true},
  {s:'Shaving makes hair grow back thicker.',t:false},
  {s:'There is enough water in Lake Superior to cover both American continents in a foot of water.',t:true},
  {s:'Humans swallow eight spiders a year in their sleep.',t:false},
  {s:'A bolt of lightning is hotter than the surface of the sun.',t:true},
  {s:'The tongue is the strongest muscle in the human body.',t:false},
  {s:'Ketchup was once sold as medicine.',t:true},
  {s:'Chameleons change color mainly to match their background.',t:false},
  {s:'Saudi Arabia imports camels from Australia.',t:true},
  {s:'Ostriches bury their heads in the sand when frightened.',t:false},
  {s:'The heart of a blue whale is roughly the size of a small car.',t:true},
  {s:'Mount Everest is the closest point on Earth to outer space.',t:false},
  {s:'Cows have best friends and show stress when separated.',t:true},
  {s:'Alcohol keeps you warm in the cold.',t:false},
  {s:'The inventor of the frisbee was cremated and made into frisbees.',t:true},
  {s:'MSG has been shown to cause headaches in controlled studies.',t:false}
];
/* ── host script ── */
const HOST={
  intro:['Welcome back. Sit. I only ever tell you true things.','Look at me. Twenty little facts. Trust me on all of them.'],
  correct:['…fine. That one hardly counted.','Clever. Don’t make a habit of it.','You’ve been reading again. I don’t love that.','Yes, yes. Even I am right sometimes.'],
  wrong:[ 'Oh dear. Did you hear something crack? I didn’t.','You doubted the wrong one. That’s on you, darling.','See what happens when you don’t trust me?','The glass was always like that. Don’t look at it.'],
  wrongLate:['Careful. There isn’t much glass left between us.','I’d stop being wrong now, if I were you.','One or two more and we’ll be… closer.'],
  final:['Last one. Make it count, or don’t.','And now the final little fact. I promise nothing.']
};
const ROUNDS=20, MAX_CRACKS=7;
const $=id=>document.getElementById(id);

/* ── audio ── */
let ac=null;
function sound(kind){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!ac) ac=new AC(); if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    function ping(f,when,len,vol,type){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0008,when+len);
      o.connect(g); g.connect(ac.destination); o.start(when); o.stop(when+len+.05);
    }
    function crunch(when,len,vol,fc){
      const n=ac.createBufferSource(), buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
      n.buffer=buf;
      const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=fc;
      const g=ac.createGain(); g.gain.value=vol;
      n.connect(f); f.connect(g); g.connect(ac.destination); n.start(when);
    }
    if(kind==='crack'){ crunch(t,.28,.5,1400); ping(2400,t,.4,.12); ping(3600,t+.03,.3,.08); ping(90,t,.25,.3); }
    else if(kind==='ok'){ ping(220,t,.18,.08,'triangle'); }
    else if(kind==='shatter'){
      crunch(t,.7,.7,900); ping(70,t,.6,.4);
      for(let i=0;i<9;i++){ ping(1800+((i*467)%1700), t+.1+i*.07, .25, .06); }
    }
  }catch(e){}
}

/* ── the glass: accumulated cracks on a fixed canvas ── */
const glass=$('glass'), gctx=glass.getContext('2d');
let crackShapes=[];
function fitGlass(){
  glass.width=window.innerWidth*(window.devicePixelRatio||1);
  glass.height=window.innerHeight*(window.devicePixelRatio||1);
  glass.style.width=window.innerWidth+'px'; glass.style.height=window.innerHeight+'px';
  redrawGlass();
}
function makeCrack(cx,cy){
  const rays=6+Math.floor(Math.random()*4), shape={cx,cy,lines:[],rings:[]};
  for(let r=0;r<rays;r++){
    const ang=(r/rays)*Math.PI*2+Math.random()*.6;
    const len=40+Math.random()*160;
    const pts=[[cx,cy]];
    let x=cx,y=cy,a=ang;
    const segs=3+Math.floor(Math.random()*4);
    for(let s2=0;s2<segs;s2++){
      a+=(Math.random()-.5)*.7;
      const l=len/segs*(0.6+Math.random()*.8);
      x+=Math.cos(a)*l; y+=Math.sin(a)*l;
      pts.push([x,y]);
    }
    shape.lines.push(pts);
  }
  const rings=1+Math.floor(Math.random()*2);
  for(let k=0;k<rings;k++) shape.rings.push(18+Math.random()*46);
  crackShapes.push(shape);
  redrawGlass();
}
function drawShape(sh, dpr){
  gctx.save();
  gctx.scale(dpr,dpr);
  gctx.lineWidth=1.1;
  for(const pts of sh.lines){
    gctx.beginPath(); gctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) gctx.lineTo(pts[i][0],pts[i][1]);
    gctx.strokeStyle='rgba(236,232,225,.75)'; gctx.shadowColor='rgba(255,255,255,.5)'; gctx.shadowBlur=2;
    gctx.stroke();
    gctx.strokeStyle='rgba(120,110,130,.35)'; gctx.shadowBlur=0;
    gctx.stroke();
  }
  for(const r of sh.rings){
    gctx.beginPath();
    for(let a=0;a<Math.PI*2;a+=.5){
      const rr=r*(0.85+Math.random()*.3);
      const px=sh.cx+Math.cos(a)*rr, py=sh.cy+Math.sin(a)*rr;
      a===0?gctx.moveTo(px,py):gctx.lineTo(px,py);
    }
    gctx.closePath();
    gctx.strokeStyle='rgba(236,232,225,.28)'; gctx.stroke();
  }
  gctx.restore();
}
function redrawGlass(){
  const dpr=window.devicePixelRatio||1;
  gctx.clearRect(0,0,glass.width,glass.height);
  for(const sh of crackShapes) drawShape(sh,dpr);
}
window.addEventListener('resize',fitGlass);

/* ── game state ── */
let deck=[], round=0, cracks=0, seen=0, correct=0, busy=false, over=false;
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* typewriter for the host */
let typeTimer=null;
function hostSay(text, cb){
  clearInterval(typeTimer);
  const el=$('host'); el.textContent='';
  let i=0;
  typeTimer=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i>=text.length){ clearInterval(typeTimer); cb&&cb(); }
  },26);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function renderMeta(){
  $('round').textContent='round '+Math.min(round+1,ROUNDS)+' / '+ROUNDS;
  $('cracks').innerHTML=Array.from({length:MAX_CRACKS},(_,i)=>'<span'+(i<cracks?' class="c"':'')+'>'+(i<cracks?'✸':'·')+'</span>').join('');
}
function nextRound(){
  if(over) return;
  if(round>=ROUNDS){ endGame(true); return; }
  busy=false;
  $('btn-truth').disabled=false; $('btn-lie').disabled=false;
  $('flash').textContent=''; $('flash').className='verdict-flash';
  $('statement').textContent=deck[round].s;
  renderMeta();
  if(round===ROUNDS-1) hostSay(pick(HOST.final));
  else if(round===0) hostSay(pick(HOST.intro));
  $('announce').textContent='Round '+(round+1)+': '+deck[round].s;
}
function verdict(saidTrue){
  if(busy||over) return;
  busy=true;
  $('btn-truth').disabled=true; $('btn-lie').disabled=true;
  const item=deck[round]; seen++;
  const right=saidTrue===item.t;
  const flash=$('flash');
  if(right){
    correct++;
    flash.textContent='— it was '+(item.t?'TRUE':'A LIE')+'. you saw clearly.';
    flash.className='verdict-flash good';
    sound('ok');
    hostSay(pick(HOST.correct));
  }else{
    cracks++;
    flash.textContent='— it was '+(item.t?'TRUE':'A LIE')+'. the glass remembers.';
    flash.className='verdict-flash bad';
    sound('crack');
    const st=$('stage').getBoundingClientRect();
    makeCrack(st.left+30+Math.random()*(st.width-60), st.top+30+Math.random()*(st.height-60));
    document.body.classList.remove('shaking'); void document.body.offsetWidth;
    document.body.classList.add('shaking');
    hostSay(pick(cracks>=MAX_CRACKS-2?HOST.wrongLate:HOST.wrong));
    if(cracks>=MAX_CRACKS){ setTimeout(()=>endGame(false),900); renderMeta(); return; }
  }
  renderMeta();
  round++;
  setTimeout(nextRound,1600);
}
function endGame(survived){
  over=true;
  $('btn-truth').disabled=true; $('btn-lie').disabled=true;
  const endEl=$('end');
  if(!survived){
    sound('shatter');
    /* total shatter: cracks everywhere */
    for(let i=0;i<10;i++) makeCrack(Math.random()*window.innerWidth, Math.random()*window.innerHeight);
    $('end-title').textContent='the delusion holds';
    $('end-line1').textContent='“There, there. The glass is fine. It was always like that.”';
    $('end-line2').textContent='Seven missed truths. The host smiles through the fractures.';
  }else if(cracks===0){
    $('end-title').textContent='clear glass';
    $('end-line1').textContent='“…get out.”';
    $('end-line2').textContent='Twenty rounds and not one crack. The host cannot look at you.';
  }else{
    $('end-title').textContent='you saw through it';
    $('end-line1').textContent='“Fine. Some of them were lies. Most things are.”';
    $('end-line2').textContent='You made it to the end with the glass still holding.';
  }
  $('end-score').textContent=correct+' / '+seen+' seen clearly · '+cracks+' crack'+(cracks===1?'':'s');
  endEl.classList.remove('hide');
  $('again').focus();
  $('announce').textContent=$('end-title').textContent;
}
function restart(){
  deck=shuffle(BANK).slice(0,ROUNDS);
  round=0; cracks=0; seen=0; correct=0; busy=false; over=false;
  crackShapes=[]; redrawGlass();
  $('end').classList.add('hide');
  nextRound();
}
$('btn-truth').addEventListener('click',()=>verdict(true));
$('btn-lie').addEventListener('click',()=>verdict(false));
$('again').addEventListener('click',restart);
document.addEventListener('keydown',e=>{
  if(e.key==='1'||e.key.toLowerCase()==='t') verdict(true);
  else if(e.key==='2'||e.key.toLowerCase()==='l') verdict(false);
});
/* caret blink */
setInterval(()=>{ const c=$('caret'); c.style.visibility=c.style.visibility==='hidden'?'visible':'hidden'; },560);

fitGlass();
restart();
</script>
</body>
</html>
