<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judgement Rock · one button. one sigh.</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%AA%A8">
  <meta name="description" content="A rock. A button. A recorded sigh of profound disappointment, played from an actual audio file. That's the whole app. That's the point.">
  <meta property="og:title" content="Judgement Rock — press the button">
  <meta property="og:description" content="One button plays one recorded sigh. The rock judges you. Minimalism has never been this disappointed.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/single%20grey%20rock%20on%20pedestal%20one%20red%20button%20museum%20minimal%20beige%20gallery%20poster?width=1200&height=630&seed=1111&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/judgement-rock">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root{ --gallery:#ece7db; --ink:#38332a; --dim:#948c7a; --btn:#b8544a; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--gallery); color:var(--ink);
      font:300 1.05rem/1.6 'Fraunces', serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; padding:1.6rem 1.2rem 3rem; text-align:center;
    }
    h1{ font:300 clamp(1.9rem,6.5vw,2.7rem)/1.1 'Fraunces', serif; margin:0 0 0.2rem; }
    .tag{ font-style:italic; color:var(--dim); margin:0 0 2rem; }
    .rock{ font-size:clamp(5rem,20vw,8.5rem); line-height:1; filter:drop-shadow(0 12px 18px rgba(56,51,42,0.3)); user-select:none; }
    .rock.heave{ animation:heave 2.4s ease-in-out; }
    @keyframes heave{ 0%,100%{ transform:scale(1); } 28%{ transform:scale(1.05,1.08); } 62%{ transform:scale(0.985,0.96); } }
    .plaque{
      font:400 0.62rem 'IBM Plex Mono', monospace; color:var(--dim); letter-spacing:0.16em; text-transform:uppercase;
      border:1px solid #cfc7b4; padding:0.35rem 0.9rem; margin:1rem 0 2rem; background:#f4f0e6;
    }
    #sighBtn{
      font:400 1.35rem 'Fraunces', serif; cursor:pointer; color:#fff;
      background:radial-gradient(circle at 35% 30%, #d4685c, var(--btn) 70%);
      border:none; border-radius:99px;
      padding:1rem 2.6rem; min-height:3.6rem;
      box-shadow:0 5px 0 #7e352d, 0 12px 30px rgba(184,84,74,0.35);
      transition:transform 0.08s;
    }
    #sighBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #7e352d; }
    #sighBtn:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }
    .foot{ margin-top:2rem; font-size:0.7rem; color:var(--dim); max-width:26rem; }
    .foot a{ color:var(--dim); }
    @media (prefers-reduced-motion: reduce){ .rock.heave{ animation:none; } }
  </style>
</head>
<body>
  <h1>judgement rock</h1>
  <p class="tag">it has one opinion and one way to express it</p>
  <div class="rock" id="rock" aria-hidden="true">🪨</div>
  <p class="plaque">"UNTITLED (DISAPPOINTMENT)" · MIXED FEELINGS ON STONE · 2026</p>
  <button id="sighBtn" type="button">press for sigh</button>
  <p class="foot">the sigh is a recorded audio file (<a href="sigh.wav">sigh.wav</a>, 2.4s) — performed by our own synthesizer in a single take, released CC0. no rocks were consulted. sighs played: <span id="n">0</span></p>
  <p id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

  <script>
  (function(){
    'use strict';
    var n=0;
    var btn=document.getElementById('sighBtn');
    btn.addEventListener('click',function(){
      var a=new Audio('sigh.wav');            // the static file, fresh instance = overlapping sighs allowed
      a.play().catch(function(){ document.getElementById('live').textContent='The sigh file failed to load. The rock is disappointed about that too.'; });
      n++;
      document.getElementById('n').textContent=n;
      document.getElementById('live').textContent='The rock sighs. ('+n+')';
      var r=document.getElementById('rock');
      r.classList.remove('heave'); void r.offsetWidth; r.classList.add('heave');
      if(n===10) btn.textContent='press for sigh (it remembers all 10)';
      if(n===25) btn.textContent='press for sigh (seek help)';
    });
  })();
  </script>
</body>
</html>
