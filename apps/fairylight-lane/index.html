<style>
:root{ --ink:#2b1a2e; --gold:#ffd36b; --pink:#ff9fb4; --cream:#fff6f0; --night:#221a44; --lav:#c9b8ff; }
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0; min-height:100vh; min-height:100dvh; color:#f3eeff; font-family:'M PLUS Rounded 1c',ui-rounded,sans-serif;
  background:
    radial-gradient(circle at 80% 6%, rgba(255,211,107,.16), transparent 13rem),
    radial-gradient(circle at 12% 90%, rgba(255,159,180,.14), transparent 15rem),
    linear-gradient(175deg,#16122e 0%,#221a44 55%,#352552 100%);
  display:flex; flex-direction:column; align-items:center; padding:0 1rem 1.4rem;}
header{width:min(100%,34rem); display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.8rem .2rem .4rem;}
h1{margin:0; font-family:'Mochiy Pop One','M PLUS Rounded 1c',sans-serif; font-weight:400; font-size:clamp(1.5rem,6.5vw,2.3rem); color:#ffe7b0; text-shadow:0 3px 0 #0e0a20;}
h1 small{display:block; font-size:.42em; color:var(--pink); letter-spacing:.3em; margin-top:-.1rem;}
#bed{font:800 1.05rem 'M PLUS Rounded 1c',ui-rounded,sans-serif; color:#ffe7b0; background:#0e0a20aa; border:0; border-radius:999px; min-width:2.75rem; min-height:2.75rem; cursor:pointer;}
#bed[aria-pressed="true"]{background:#2a2158; box-shadow:0 0 0 2px #ffe7b0 inset;}
#bed:focus-visible{outline:4px solid var(--gold); outline-offset:3px;}
.hr{display:flex; gap:.5rem; align-items:center;}
#lit{margin:0; font-weight:800; font-size:.9rem; color:#ffe7b0; background:#0e0a20aa; border-radius:999px; padding:.4rem .8rem; white-space:nowrap;}
main{width:min(100%,34rem); display:flex; flex-direction:column; align-items:center; gap:.7rem;}
#stage{width:100%; max-width:min(34rem, calc(100dvh - 12rem)); aspect-ratio:1/1; min-width:16rem;}
#cv{width:100%; height:100%; display:block; border-radius:28px; touch-action:manipulation; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  box-shadow:0 0 0 5px #ffe7b0, 0 18px 40px rgba(5,0,20,.6);}
#cv:focus-visible{outline:4px solid var(--gold); outline-offset:6px;}
#say{min-height:1.3rem; margin:0; font-weight:800; font-size:.9rem; color:#ffe7b0; text-align:center;}
.doors{display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; width:max-content; max-width:calc(100vw - 2rem);}
.doors button{font:800 .95rem 'M PLUS Rounded 1c',ui-rounded,sans-serif; color:#2b1a2e; background:#f3eeff; border:0; border-radius:999px; min-height:2.75rem;
  padding:.45rem 1rem; cursor:pointer; box-shadow:0 4px 0 #8a78c0; transition:transform .1s, box-shadow .1s;}
.doors button:active{transform:translateY(3px); box-shadow:0 1px 0 #8a78c0;}
.doors button[aria-pressed="true"]{background:var(--gold); box-shadow:0 4px 0 #b8862a;}

#cT{margin:0; font:400 1.25rem 'Mochiy Pop One',sans-serif; color:#ffe7b0;}
#cJ{color:var(--pink); letter-spacing:.2em; font-size:.8rem;}

  border-radius:999px; min-height:2.9rem; padding:.55rem 1.3rem; box-shadow:0 5px 0 #b8862a;}
.go:active{transform:translateY(4px); box-shadow:0 1px 0 #b8862a;}
button.go{border:0; cursor:pointer;}

#cv.roll:active{cursor:grabbing;}
@media (prefers-reduced-motion: reduce){ .doors button, #card{transition:none; animation:none;} }

<body>
<header>
  <h1>Fairylight Lane<small>あかり通り</small></h1>
  <div class="hr"><button type="button" id="bed" aria-pressed="false" aria-label="bedtime: tuck the lane in" title="bedtime">🌙</button><p id="lit" aria-live="polite">💡 0 / 8</p></div>
</header>
<main>
  <div id="stage">
    <canvas id="cv" tabindex="0" role="img" aria-label="A snowy street at night with four houses under strings of fairy lights. Wan-kun the shiba puppy peeks out of a round window in a pink house, Bnuy the mail bunny stands at her carrot-roofed post hutch, Nero waves from the top window of a tall lavender house, and Mewo the cat loafs on a snowy windowsill. Poppo the pigeon sits on the light wire, and his little pigeon house stands on a pole above the pink house."></canvas>
  </div>
  <p id="say" aria-live="polite">Everyone on the lane is home tonight. Knock on a window.</p>
  <div class="doors" role="group" aria-label="the houses on the lane">
    <button type="button" data-k="w" aria-pressed="false">🐶 <span class="nmw">Wan-kun</span></button>
    <button type="button" data-k="b" aria-pressed="false">🐰 <span class="nmb">Bnuy</span></button>
    <button type="button" data-k="n" aria-pressed="false">🖤 Nero</button>
    <button type="button" data-k="m" aria-pressed="false">🐱 <span class="nmm">Mewo</span></button>
    <button type="button" data-k="c" aria-pressed="false">🐦 Poppo</button>
    <button type="button" data-k="s" aria-pressed="false">⛄ Snowman</button>
  </div>
  <section id="card" hidden aria-live="polite">
    <div class="cHead"><h2 id="cT"></h2><span id="cJ"></span></div>
    <p id="cP"></p>
    <ul id="cGoals"></ul>
    <a id="cGo" class="go" href="/">go in →</a>
    <button type="button" id="snDown" class="go" hidden>knock it down, start over 💨</button>
  </section>
</main>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var cv=$('cv'), ctx=cv.getContext('2d'), W=400, RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var K={ink:'#2b1a2e', fur:'#fff8f3', furLo:'#efdcd6', earIn:'#ffb6c8', cap:'#e8414f', blush:'#ff9fb4',
  tan:'#f0a457', tanHi:'#ffc27a', cream:'#fff4e2', hair:'#2b2338', hairHi:'#5d4f80', skin:'#ffe9dc', hood:'#3d3552', hoodHi:'#5a5175'};
/* Mewo's coat comes from Window Loaf's saved coat */
var COATS={ginger:{}, black:{hi:'#4f4656', c:'#2e2833', lo:'#16121a', stripe:null, bib:'#3b3442', ear:'#b98585', eye:'#f2c14e'},
  grey:{hi:'#c3c6ce', c:'#9195a0', lo:'#5e626d', stripe:'#4a4d57', bib:'#eef0f2'},
  calico:{hi:'#ffffff', c:'#f3ece2', lo:'#cdbfae', stripe:null, bib:'#ffffff', eye:'#e9b84a', patch:['#e8924a','#2e2833']},
  white:{hi:'#ffffff', c:'#f2ede7', lo:'#cfc6bd', stripe:null, bib:'#ffffff', eye:'#86c9f0', ear:'#f4b0aa'}};
var M={hi:'#f7b874', c:'#e8924a', lo:'#b8622c', stripe:'#a9541f', bib:'#fbe6c8', ear:'#f2a49c', eye:'#a6d86a'};
var now=0, T0=performance.now();

function lerp(a,b,t){ return a+(b-a)*t; }

function env(age,up,hold,down){ if(age<0) return 0; var v=age<up?age/up:age<up+hold?1:age<up+hold+down?1-(age-up-hold)/down:0; return v*v*(3-2*v); }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function eyeSpark(g,x,y,rx,ry,c0,c1){ g.save(); g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.clip();
  var eg=g.createLinearGradient(0,y-ry,0,y+ry); eg.addColorStop(0,c0); eg.addColorStop(1,c1); g.fillStyle=eg; g.fillRect(x-rx-1,y-ry-1,rx*2+2,ry*2+2);
  g.fillStyle='#1c0b06'; g.beginPath(); g.ellipse(x,y+1,rx*.55,ry*.62,0,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.ellipse(x-rx*.35,y-ry*.38,rx*.38,ry*.32,-.3,0,7); g.fill(); g.beginPath(); g.arc(x+rx*.35,y+ry*.4,rx*.18,0,7); g.fill(); g.restore();

function sleepEyes(g,x,y,w){ g.beginPath(); g.moveTo(x-w,y-1); g.quadraticCurveTo(x,y+5,x+w,y-1); line(g,2.6); }

/* ---------- what the other apps remember (all apps share one origin) ---------- */
var ST={friend:0, treats:0, pup:'Wan-kun', coat:'ginger', cat:'Mewo', loaf:false, bun:'Bnuy', issues:0, heads:[], photo:false, been:{}};
function readStreet(){
  try{ ST.friend=+(localStorage.getItem('wan-wan-pup-friend')||'').split('/')[0]||0; }catch(e){}
  try{ ST.treats=+localStorage.getItem('wan-wan-pup-treats')||0; }catch(e){}
  try{ var pn=localStorage.getItem('wan-wan-pup-name'); if(pn) ST.pup=pn.slice(0,12); }catch(e){}
  try{ var wl=JSON.parse(localStorage.getItem('window-loaf')); if(wl){ ST.loaf=true; if(COATS[wl.coat]) ST.coat=wl.coat; if(wl.name) ST.cat=String(wl.name).slice(0,14); } }catch(e){}
  try{ var bn=localStorage.getItem('bunny-post-name'); if(bn) ST.bun=bn.slice(0,10); }catch(e){}
  try{ var co=JSON.parse(localStorage.getItem('bunny-post-coorier')); if(co){ ST.issues=+co.n||0; ST.heads=(co.old||[]).filter(function(h){ return typeof h==='string'&&h.length<90; }); } }catch(e){}
  try{ var nh=JSON.parse(localStorage.getItem('nero-house')); if(nh&&nh.photo) ST.photo=true; }catch(e){}
  try{ var ln=JSON.parse(localStorage.getItem('fairylight-lane')); if(ln&&ln.been) ST.been=ln.been; }catch(e){}
  M={hi:'#f7b874', c:'#e8924a', lo:'#b8622c', stripe:'#a9541f', bib:'#fbe6c8', ear:'#f2a49c', eye:'#a6d86a'}; Object.assign(M,COATS[ST.coat]);
}
function saveLane(){ try{ localStorage.setItem('fairylight-lane',JSON.stringify({been:ST.been, done:LANE.done, seen:LANE.seen, sn:{n:SN.n, d:SN.d}})); }catch(e){} }

/* each house has two bulbs on the wire: one for going in, one for something you did in there */
var HOUSE={
  w:{app:'wan-wan-pup', t:'Wan Wan Pup', j:'ワンワン', em:'🐶', p:function(){ return ST.pup+' is a tiny shiba with sparkly eyes who barks at everything, mostly at the cat across the lane.'; },
     goals:function(){ return [[ST.been.w||ST.treats>0||ST.friend>0,'go in and say hi'],[ST.friend>=5,'make him friends with '+ST.cat+(ST.friend>0&&ST.friend<5?' ('+ST.friend+'/5 arguments)':'')]]; }},
  b:{app:'bunny-post', t:'Bunny Post', j:'ぴょん便', em:'🐰', p:function(){ return ST.bun+' carries notes between the dog and the cat, and you decide what she tells them.'; },
     goals:function(){ return [[ST.been.b||ST.issues>0,'go in and say hi'],[ST.issues>0,'finish a mail round'+(ST.issues?' ('+ST.issues+' so far)':'')]]; }},
  n:{app:'nero-house', t:"Nero's House", j:'ネロのおうち', em:'🖤', p:function(){ return 'Nero owns all of them and loves them all. Pat, brush, spoil, and put the whole pile to bed.'; },
     goals:function(){ return [[!!ST.been.n||ST.photo,'go in and say hi'],[ST.photo,'earn all 15 hearts for the family photo']]; }},
  m:{app:'window-loaf', t:'Window Loaf', j:'まどねこ', em:'🐱', p:function(){ return ST.cat+' is a sleepy loaf on a snowy windowsill. Poke her, get judged, keep it as a GIF.'; },
     goals:function(){ return [[!!ST.been.m||ST.loaf,'go in and say hi'],[ST.coat!=='ginger'||ST.cat!=='Mewo','give her a new coat or a name']]; }}
};
var ORDER=['w','b','n','m'], BULBC={w:'#ff9fb4', b:'#ffb37a', n:'#d9b8ff', m:'#ffd36b'};
function bulbsOn(){ var on=[]; ORDER.forEach(function(k){ HOUSE[k].goals().forEach(function(gl){ on.push(!!gl[0]); }); }); return on; }

/* ---------- state ---------- */
var S={ sel:'', selAt:-9, tap:{w:-9,b:-9,n:-9,m:-9,p:-9}, bub:{w:{txt:'',at:-9},b:{txt:'',at:-9},n:{txt:'',at:-9},m:{txt:'',at:-9},p:{txt:'',at:-9}}, sub:{txt:'',at:-9},
  li:{w:0,b:0,n:0,m:0,p:0}, newAt:[], flakes:[], blinkAt:-9, nBlink:2, star:-9, idleAt:6, lightAt:[], lastTap:-9 };
var LANE={done:false, partyAt:-99, seen:[]};
/* bedtime: from 22:00 to 6:00 (or after you tap the moon) the lane sleeps; a knock wakes one house for a bit */
var BED={force:null, k:0, dawn:-99}; S.cur={w:0,n:0,m:0};
function asleep(){ if(BED.force!==null) return BED.force; var h=new Date().getHours(); return h>=22||h<6; }
function dozing(k){ return BED.k>.5&&now-S.tap[k]>9; }
try{ var ln0=JSON.parse(localStorage.getItem('fairylight-lane')); if(ln0&&ln0.done) LANE.done=true; if(ln0&&Array.isArray(ln0.seen)) LANE.seen=ln0.seen; }catch(e){}
for(var i=0;i<70;i++) S.flakes.push({x:Math.random()*400, y:Math.random()*400, r:.8+Math.random()*1.8, v:10+Math.random()*18, ph:Math.random()*6});

/* ---------- sky + far roofs ---------- */
var STARS=[[30,30],[86,58],[132,22],[176,64],[214,30],[262,58],[298,22],[392,92],[78,118],[112,98],[318,84],[160,110]];
function sky(g){
  var sg=g.createLinearGradient(0,0,0,340); sg.addColorStop(0,'#141033'); sg.addColorStop(.6,'#2a2158'); sg.addColorStop(1,'#46336e'); g.fillStyle=sg; g.fillRect(0,0,400,400);
  STARS.forEach(function(s,i){ var tw=.5+.5*Math.sin(now*1.7+i*2.1); g.globalAlpha=.45+.45*tw; g.fillStyle='#fff8dc'; g.fillRect(s[0],s[1],2,2); }); g.globalAlpha=1;
  /* moon */
  g.save(); g.globalAlpha=.35; var mg=g.createRadialGradient(356,50,10,356,50,46); mg.addColorStop(0,'#fff4c4'); mg.addColorStop(1,'rgba(255,244,196,0)'); g.fillStyle=mg; g.fillRect(300,0,100,100); g.restore();
  g.beginPath(); g.arc(356,50,17,0,7); g.fillStyle='#fff4c4'; g.fill(); g.fillStyle='#ecdca0'; g.beginPath(); g.arc(350,46,4,0,7); g.arc(362,57,3,0,7); g.fill();
  /* shooting star when the lane is lit */
  var st=now-S.star; if(st>=0&&st<1.2){ var p=st/1.2, x=lerp(60,250,p), y=lerp(30,90,p); g.globalAlpha=1-p; g.strokeStyle='#fff8dc'; g.lineWidth=2; g.beginPath(); g.moveTo(x,y); g.lineTo(x-40,y-12); g.stroke(); sparkle(g,x,y,5,1-p); g.globalAlpha=1; }
  var dw=env(now-BED.dawn,1.2,2.6,2.2); if(dw>0){ g.save(); g.globalAlpha=dw*.9; var dg=g.createLinearGradient(0,60,0,220); dg.addColorStop(0,'rgba(255,170,190,0)'); dg.addColorStop(.6,'rgba(255,160,150,.55)'); dg.addColorStop(1,'#ffc77a'); g.fillStyle=dg; g.fillRect(0,60,400,160); g.restore(); }
  /* far roofs */
  g.fillStyle='#231a48'; g.beginPath(); g.moveTo(0,200); [[0,170],[30,170],[30,150],[58,132],[86,150],[86,160],[120,160],[120,184],[170,184],[170,150],[196,128],[222,150],[300,150],[300,120],[318,120],[318,136],[344,136],[370,116],[400,136],[400,200]].forEach(function(p){ g.lineTo(p[0],p[1]); }); g.closePath(); g.fill();
  g.fillStyle='#ffd36b'; g.globalAlpha=.55; [[40,160],[100,170],[180,160],[260,158],[384,150]].forEach(function(w){ g.fillRect(w[0],w[1],6,8); }); g.globalAlpha=1;
}

/* ---------- the houses ---------- */
function glow(g,x,y,r,c,a){ g.save(); g.globalAlpha=a; var gg=g.createRadialGradient(x,y,2,x,y,r); gg.addColorStop(0,c); gg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gg; g.fillRect(x-r,y-r,r*2,r*2); g.restore(); }
function selGlow(g,k,x,y,r){ var a=S.sel===k?.55+.15*Math.sin(now*4):0; if(a>0) glow(g,x,y,r,'#ffe7b0',a); }
function snowCap(g,pts){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); for(var j=pts.length-1;j>=0;j--) g.lineTo(pts[j][0]+(j%2?2:-2),pts[j][1]+6+(j%2)*3); g.closePath(); g.fillStyle='#f4f7ff'; g.fill(); line(g,2); }

function houseW(g){ selGlow(g,'w',57,240,90);
  g.beginPath(); g.moveTo(4,206); g.lineTo(57,150); g.lineTo(110,206); g.closePath(); g.fillStyle='#e8648c'; g.fill(); line(g,3);
  snowCap(g,[[14,196],[57,152],[100,196]]);
  g.fillStyle='#ffc2d4'; g.fillRect(14,204,86,130); g.fillStyle='#f3a9c0'; g.fillRect(14,314,86,20); g.beginPath(); g.rect(14,204,86,130); line(g,3);

  g.beginPath(); g.arc(57,244,28,0,7); g.fillStyle='#fff'; g.fill(); line(g,3);
  g.save(); g.beginPath(); g.arc(57,244,23,0,7); g.clip(); var wg=g.createRadialGradient(57,238,4,57,244,26); wg.addColorStop(0,'#fff1c4'); wg.addColorStop(1,'#ffc86e'); g.fillStyle=wg; g.fillRect(30,216,56,56);
  var pa=env(now-S.tap.w,.08,.7,.25), bob=Math.sin(now*2.2)*1.5-pa*5; g.save(); g.translate(57,256+bob); g.scale(.5,.5); wanHead(g,0,0,pa>0?'happy':'',env(now-S.bub.w.at,.05,.45,.1)>0&&Math.sin(now*24)>0); g.restore(); curtain(g,30,216,54,56,S.cur.w,'#8aa8e6','#6280c2'); g.restore();
  g.beginPath(); g.arc(57,244,23,0,7); line(g,2.4);
  if(ST.friend>=5){ heart(g,76,226,6,'#ff6f9a'); g.beginPath(); g.moveTo(76,231.4); g.bezierCurveTo(66.4,224.8,71.8,217.6,76,223); g.bezierCurveTo(80.2,217.6,85.6,224.8,76,231.4); line(g,1.6); }
  /* name plaque + door with a bone wreath */
  rr(g,26,278,62,14,6); g.fillStyle='#fff6f0'; g.fill(); line(g,2); label(g,ST.pup,57,286,9,'#b03a6a');
  rr(g,42,296,30,38,9); g.fillStyle='#c96a5a'; g.fill(); line(g,2.6); g.fillStyle=K.ink; g.beginPath(); g.arc(66,316,2,0,7); g.fill();
  bone(g,57,306,.55);
}

function snPuff(x,y,n,sp,h){ if(RM&&!h) return; for(var i=0;i<n;i++){ if(SN.puffs.length>90) SN.puffs.shift(); var a=-Math.PI*Math.random(), v=(20+Math.random()*40)*sp;
  SN.puffs.push({x:x+(Math.random()-.5)*8,y:y,vx:h?(Math.random()-.5)*16:Math.cos(a)*v,vy:h?-18-Math.random()*14:Math.sin(a)*v-10,r:h===1?3+Math.random()*1.5:h===2?2.5+Math.random()*2:1.4+Math.random()*2.4*sp,t0:now+(h?i*.18:0),life:h?1.6:.5+Math.random()*.5,h:h||0}); } }
function snThrow(k,fx,fy,tx,ty,dur,cb,delay,a1){ SN.fly.push({k:k,fx:fx,fy:fy,tx:tx,ty:ty,t0:now+(delay||0),dur:RM?.05:dur,cb:cb,h:k==='fish'?0:46,a0:k==='bone'?-3:k==='scarf'?-2:0,a1:a1||0}); }
function snGot(d){ SN.d=Math.max(SN.d,d); saveLane(); snAria(); if(S.sel==='s') snCard(); }

/* the neighbours come out one after another */
function snDeco(){ var nt=BED.k>.5, L=nt?SNL.night:SNL.day, t=0; SN.mode='deco'; zoomOut(); S.sel='s'; snCard(); S.idleAt=now+40; SN.wake=now;
  S.tap.n=now; speak('n',L.go,null,1.8); hum(); say(nt?'Shh… the neighbours are waking up to help.':'The neighbours are coming out to help!');
  var Q=function(dt,fn){ t+=dt; SN.q.push([now+t,fn]); };
  Q(1.9,function(){ S.tap.w=now; S.idleAt=now+30; speak('w',L.w[0],L.w[1],1.9); yip(3,1.15);
    snThrow('bone',57,236,SX-SR[1]-7,SC[1]-5,.8,function(){ SN.b=1; },0,.5); snThrow('bone',57,236,SX+SR[1]+7,SC[1]-6,.8,function(){ SN.b=2; },.22,-.6); snThrow('bone',57,236,SX+36,SG-4,1,function(){ SN.b=3; snGot(1); },.5,1.15); });
  Q(2.4,function(){ S.tap.b=now; speak('b',L.b[0],L.b[1],1.9); squeak(); snThrow('carrot',172,300,SX+1,SC[2]+1,.75,function(){ snGot(2); },0,.12); });
  Q(2.3,function(){ S.tap.n=now; speak('n',L.n[0],null,1.5); hum(); snThrow('scarf',248,206,SX,SC[2]+SR[2]-3,.9,function(){ snGot(3); }); });
  Q(1.6,function(){ S.tap.n=now; speak('n',L.n[1],null,1.5); snPuff(SX,SC[2]-14,3,1,1); });
  Q(1.8,function(){ S.tap.m=now; speak('m',L.m[0],L.m[1],1.6); mrr(); });
  Q(1.8,function(){ snThrow('fish',350,262,SX-6,SC[2]-SR[2]+2.5,.55,function(){ snGot(4); S.tap.m=now; speak('m',L.m[2],L.m[3],1.6); mrr(); },0,-.6); });
  Q(2.3,function(){ PO.fx=PO.x; PO.fy=PO.y; PO.tx=SX+3; PO.ty=SC[2]-SR[2]+(BED.k>.5?-5:1); PO.t0=now; PO.dur=RM?.01:1.1; PO.home=false; PO.say=0; PO.dir=PO.tx<PO.x?-1:1; if(!RM) flap(); SN.po=now+14; });
  Q(1.2,function(){ S.tap.p=now; speak('p',L.p[0],L.p[1],2.2); coo(); snGot(5); });
  Q(2.6,function(){ SN.mode=''; SN.wake=now; chime(); snPuff(SX,SC[1]-10,6,1,2); S.sel='s'; snCam(1.5,SX,SC[1]); snCard(); say(L.end); }); }

/* input: chip, key 7, the snow, the snowman */
function snCard(){ var done=snDone(), ul=$('cGoals'), G;
  document.querySelectorAll('.doors button').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.k==='s'?'true':'false'); });
  $('cT').textContent=done?'The Snowman':'Snow Day'; $('cJ').textContent='ゆきだるま';
  if(SN.n<3){ $('cP').textContent='Drag across the snow to roll a snowball, or keep tapping the snow (keys: space or arrows). Three balls, then the neighbours come out. ⛄ again to stop.'; G=[[SN.n>=1,'roll the base'],[SN.n>=2,'roll the middle'],[SN.n>=3,'roll the head'],[false,'then the neighbours help']]; }
  else if(done){ $('cP').textContent='You rolled him and the whole lane dressed him: bone arms from '+ST.pup+', a carrot nose from '+ST.bun+", Nero's own scarf, a fish clip from "+ST.cat+' (she denies it). Poppo says he is engaged. He stays out here, even at bedtime.'; G=[]; }
  else { $('cP').textContent='The neighbours are dressing him up…';
    G=[[SN.d>=1,'🦴 bone arms from '+ST.pup],[SN.d>=2,'🥕 a carrot nose from '+ST.bun],[SN.d>=3,"🧣 Nero's own scarf"],[SN.d>=4,'🐟 a fish clip from '+ST.cat+' (she denies it)'],[SN.d>=5,'💍 engaged, says Poppo']].filter(function(x){ return x[0]; }); }
  ul.textContent=''; G.forEach(function(gl){ var li=document.createElement('li'); li.textContent=(SN.n<3?(gl[0]?'⛄ ':'○ '):'')+gl[1]; if(gl[0]) li.className='on'; ul.appendChild(li); });
  $('cGo').hidden=true; $('snDown').hidden=!done; $('card').hidden=false; }
function snAria(){ cv.setAttribute('aria-label',SNA+(snDone()?' In the snow in front of the houses stands a snowman with bone arms, a carrot nose, a pink scarf and a little blue fish clip.':SN.n>0?' A half-built snowman stands in the snow.':'')); }
function snRollOn(x){ if(SN.n>=3) return; ac(); SN.mode='roll'; S.sel='s'; cv.classList.add('roll'); if(SN.g<=0&&!SN.lift){ SN.bx=x!=null?clamp(x,160,250):SX-112; SN.rot=0; }
  snCam(1.6,250,300); snCard(); S.idleAt=now+25; crunch(.15); var ae=document.activeElement; if(ae&&ae.dataset&&ae.dataset.k==='s') try{ cv.focus({preventScroll:true}); }catch(e){}
  say(['Roll the base: drag across the snow, or keep tapping.','Now the middle: a bit smaller. Keep rolling.','Last one: the head.'][SN.n]); }
function snOff(){ if(SN.mode==='roll'){ SN.mode=''; SN.drag=null; SN.v=0; } cv.classList.remove('roll'); }
function snowTap(){ ac();
  if(SN.mode==='roll'){ zoomOut(); say('Your snowball waits in the snow. Tap ⛄ to keep rolling.'); return; }
  if(SN.mode==='deco'||SN.mode==='wait'){ S.sel='s'; snCard(); return; }
  if(SN.n>=3){ var T=BED.k>.5?SNTN:SNT, l=T[SN.tl++%T.length]; SN.wob=now; SN.wake=now; crunch(.2); S.sel='s'; snCam(1.5,SX,SC[1]); snCard(); S.idleAt=now+18;
    S.tap[l[0]]=now; speak(l[0],l[1],l[2],2); ({p:coo,w:function(){ yip(2,1.1); },m:mrr,b:squeak,n:hum})[l[0]]();
    say(BED.k>.5?'The snowman is asleep in his nightcap. Tap “knock it down” to start over.':'Your snowman. Tap “knock it down” below to roll a new one.'); return; }
  snRollOn(); }
function snStep(x,y){ ac(); if(SN.mode==='deco'||SN.mode==='wait'||SN.n>=3){ crunch(.25); snPuff(x,y,5,.7); SN.trail.push({x:x,y:clamp(y,338,396),r:6,t:now,f:1}); if(SN.trail.length>90) SN.trail.shift(); return; } snRollOn(x); }
function snKnock(){ ac(); if(!snDone()||SN.mode) return; for(var i=0;i<3;i++) snPuff(SX,SC[i],12,1.6); whoosh();
  snThrow('bone',SX-SR[1]-7,SC[1]-5,57,236,.9,null,.1); snThrow('bone',SX+SR[1]+7,SC[1]-6,57,236,.9,null,.2); snThrow('bone',SX+36,SG-4,57,236,.9,function(){ S.tap.w=now; speak('w','WAN!! my bones!!','(he got them back. best night ever)',1.6); yip(2,1.25); },.3);
  SN.n=0; SN.d=0; SN.b=0; SN.g=0; SN.trail=[]; saveLane(); snAria(); zoomOut(); SN.mode='roll'; S.sel='s'; cv.classList.add('roll'); SN.bx=SX-112; SN.rot=0; snCard(); say('Poof! Roll a new base: drag across the snow.');
  SN.q.push([now+1.6,function(){ if(SN.mode==='roll') snCam(1.6,250,300); }]); }
function snHit(x,y){ if(SN.n>0&&Math.abs(x-SX)<SR[0]+5&&y>SC[SN.n-1]-SR[SN.n-1]-6&&y<SG+5) return 's'; if(y>=342&&CAM.gz<1.05) return 'snow'; return ''; }
function snUp(e){ if(SN.mode!=='roll') return false; var d=SN.drag; SN.drag=null; if(SN.lift) return true;
  var s=sceneXY(e), p=toWorld(s[0],s[1]), r=snR(SN.n,SN.g/SNEED[SN.n]);
  if(d&&d.m>=8) return true; if(p[1]<SG-2*r-10&&hit(p[0],p[1])!=='s') return false;
  snPush(Math.abs(p[0]-SN.bx)<r+10?SN.dir:(p[0]>SN.bx?1:-1)); return true; }
function snKey(e){ if(SN.mode!=='roll') return false; var k=e.key, dir=k==='ArrowLeft'?-1:k==='ArrowRight'?1:(k===' '||k==='Enter'||k==='7')?SN.dir:0; if(!dir) return false; e.preventDefault(); snPush(dir); return true; }
cv.addEventListener('pointerdown',function(e){ if(SN.mode!=='roll') return; ac(); var s=sceneXY(e); SN.drag={x:s[0],y:s[1],m:0}; try{ cv.setPointerCapture(e.pointerId); }catch(er){} });
cv.addEventListener('pointermove',function(e){ var d=SN.drag; if(SN.mode!=='roll'||!d) return; var s=sceneXY(e), dx=(s[0]-d.x)/CAM.z, dy=(s[1]-d.y)/CAM.z; d.x=s[0]; d.y=s[1]; d.m+=Math.hypot(dx,dy)*CAM.z;
  if(d.m<8||SN.lift) return; SN.v=0; snMove(Math.abs(dx)>=Math.abs(dy)*.5?dx:SN.dir*Math.hypot(dx,dy)*.8); });
cv.addEventListener('pointercancel',function(){ SN.drag=null; });
$('snDown').addEventListener('click',snKnock);

/* snow sounds: a soft crunch, a plop, a whoosh (noise through a filter) */
var SNZ=null;
function snNoise(a){ if(!SNZ){ var n=Math.floor(a.sampleRate*.8); SNZ=a.createBuffer(1,n,a.sampleRate); var d=SNZ.getChannelData(0); for(var i=0;i<n;i++) d[i]=Math.random()*2-1; } return SNZ; }
function crunch(v,at,hz){ var a=AC; if(!a||!v) return; try{ for(var k=0;k<2;k++){ var t=a.currentTime+.01+(at||0)+k*.028, src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), dur=.04+Math.random()*.05;
    src.buffer=snNoise(a); f.type='bandpass'; f.frequency.value=hz?hz*(.8+Math.random()*.4):800+Math.random()*1500; f.Q.value=1.1;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*(k?.3:.55),t+.004); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f); f.connect(g); g.connect(a.destination); src.start(t,Math.random()*.6,dur+.02); } }catch(e){} }
function plop(){ tone('sine',240,90,.2,.09); crunch(.35); crunch(.2,.06); }
function whoosh(){ var a=AC; if(!a) return; try{ var t=a.currentTime+.01, src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); src.buffer=snNoise(a); f.type='lowpass';
  f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(240,t+.6); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.65);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t,0,.7); }catch(e){} }

/* ---------- loop ---------- */
var last=0;
function draw(g,dt){ var sc=cv.width/W, e=1-Math.exp(-5*dt);
  CAM.x+=(CAM.gx-CAM.x)*e; CAM.y+=(CAM.gy-CAM.y)*e; CAM.z+=(CAM.gz-CAM.z)*e;
  g.setTransform(sc,0,0,sc,0,0); g.save(); g.translate(200,200); g.scale(CAM.z,CAM.z); g.translate(-CAM.x,-CAM.y);
  BED.k+=((asleep()?1:0)-BED.k)*(1-Math.exp(-2.5*dt)); ['w','n','m'].forEach(function(k){ S.cur[k]+=((dozing(k)?1:0)-S.cur[k])*(1-Math.exp(-7*dt)); });
  sky(g); coopDraw(g); houseW(g); houseB(g); houseN(g); houseM(g); veil(g,-200,534); wires(g); street(g); veil(g,334,300); snDraw(g,dt); poppo(g); zzz(g); g.restore();
  snow(g,dt); ['w','b','n','m','p'].forEach(function(k){ bubble(g,k); }); subtitle(g); }
function fit(){ var r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2.5); cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); }
function frame(ts){ var t=(ts-T0)/1000, dt=clamp(t-now,0,.05); now=t; idle(); draw(ctx,dt); requestAnimationFrame(frame); }
function sceneXY(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]; }
function hit(x,y){ if(Math.hypot(x-356,y-50)<28) return 'moon'; if(Math.abs(x-PO.x)<24&&y>PO.y-36&&y<PO.y+12) return 'p'; if(Math.abs(x-CX)<28&&y>CY-38&&y<CY+20) return 'c'; var sh=snHit(x,y); if(sh) return sh;
  for(var i=0;i<BULBXY.length;i++){ var b=BULBXY[i]; if(b&&Math.abs(x-b[0])<12&&Math.abs(y-b[1])<14) return 'l'; }
  if(y>140&&y<346){ if(x<106) return 'w'; if(x<196) return y>200?'b':''; if(x<302) return y>100?'n':''; return 'm'; } return ''; }
cv.addEventListener('pointerup',function(e){ if(snUp(e)) return; var s=sceneXY(e), p=toWorld(s[0],s[1]), k=hit(p[0],p[1]); if(k==='s') snowTap(); else if(k==='snow') snStep(p[0],p[1]); else if(k==='p') gossip(); else if(k==='c') coop(); else if(k==='l') chase(); else if(k==='moon') tuck(); else if(k) knock(k); else if(CAM.gz>1) zoomOut(); });
cv.addEventListener('keydown',function(e){ if(snKey(e)) return; if(e.key==='Escape'||e.key==='0'){ zoomOut(); return; } if(e.key==='z'||e.key==='Z'){ tuck(); return; } var k={'1':'w','2':'b','3':'n','4':'m','5':'p','6':'c','7':'s'}[e.key]; if(!k) return; e.preventDefault(); if(k==='s') snowTap(); else if(k==='p') gossip(); else if(k==='c') coop(); else knock(k); });
document.querySelectorAll('.doors button').forEach(function(b){ b.addEventListener('click',function(){ if(b.dataset.k==='c') coop(); else if(b.dataset.k==='s') snowTap(); else knock(b.dataset.k); }); });
$('bed').addEventListener('click',tuck);
addEventListener('resize',fit);
addEventListener('pageshow',function(e){ if(!e.persisted) return; readStreet(); names(); updLit(); if(S.sel==='s') snCard(); else if(S.sel&&HOUSE[S.sel]) select(S.sel); });
function names(){ document.querySelectorAll('.nmw').forEach(function(s){ s.textContent=ST.pup; }); document.querySelectorAll('.nmb').forEach(function(s){ s.textContent=ST.bun; }); document.querySelectorAll('.nmm').forEach(function(s){ s.textContent=ST.cat; }); }
var wasDone=LANE.done; readStreet(); names(); fit(); updLit(); snAria();
if(asleep()){ BED.k=1; S.cur={w:1,n:1,m:1}; say("It's late. Everyone on the lane is asleep. Knock softly."); }
else if(wasDone) say('Every light on the lane is on. Knock anyway, they like visitors.');
bedBtn(); setTimeout(function(){ speak('n',BED.k>.5?'welcome home… shh!':'welcome home!',null,1.8); },700);
requestAnimationFrame(frame);
window.__LANE={S:S, ST:ST, CAM:CAM, zoomOut:zoomOut, knock:knock, gossip:gossip, chase:chase, party:party, read:readStreet, upd:updLit, bed:BED, tuck:tuck, coop:coop, PO:PO, SN:SN, snowTap:snowTap, snKnock:snKnock};
})();
</script>
