<style>
  :root {
    --parchment-0: #f2dfb4;
    --parchment-1: #e6cf9b;
    --parchment-2: #d7b981;
    --parchment-edge: #9c7240;
    --ink: #2a1808;
    --ink-soft: #5a3a20;
    --gold: #9e7332;
    --gold-light: #c69a52;
    --wax: #9a1a1e;
    --wax-mid: #b02c2c;
    --wax-hi: #e15656;
    --wax-lo: #48040a;
    --wax-emb: #2e0204;
    --hint: #8a6840;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    height: 100%;
    color: var(--ink);
    font-family: 'IM Fell English', 'EB Garamond', serif;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(130, 80, 30, 0.35), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(90, 50, 20, 0.4), transparent 55%),
      radial-gradient(ellipse at 50% 50%, var(--parchment-0), var(--parchment-2) 80%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Parchment grain overlay (paper fibers) */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      radial-gradient(ellipse at 12% 18%, rgba(80, 40, 10, 0.18), transparent 28%),
      radial-gradient(ellipse at 84% 62%, rgba(100, 50, 15, 0.14), transparent 22%),
      radial-gradient(ellipse at 44% 88%, rgba(70, 30, 5, 0.12), transparent 25%);
    mix-blend-mode: multiply;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      repeating-linear-gradient(7deg, rgba(120, 80, 30, 0.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(97deg, rgba(60, 30, 5, 0.025) 0 1px, transparent 1px 4px);
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 28px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flourish {
    width: 100%;
    max-width: 520px;
    color: var(--gold);
    opacity: 0.85;
    margin: 12px 0;
    flex-shrink: 0;
  }
  .flourish svg { width: 100%; height: auto; display: block; }

  h1.title {
    font-family: 'UnifrakturCook', serif;
    font-weight: 700;
    font-size: clamp(40px, 7vw, 76px);
    color: var(--ink);
    text-align: center;
    line-height: 1;
    letter-spacing: 0.01em;
    text-shadow:
      0 0 0.5px var(--ink-soft),
      1px 1px 0 rgba(0,0,0,0.08);
    position: relative;
    margin: 12px 0 6px;
  }
  h1.title .amp { color: var(--wax); font-size: 0.7em; vertical-align: 0.1em; margin: 0 0.06em; }

  .subtitle {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(15px, 2vw, 19px);
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }
  .subtitle::before, .subtitle::after {
    content: '❦';
    color: var(--wax);
    font-style: normal;
    margin: 0 0.6em;
    font-size: 0.85em;
  }

  .parchment {
    width: 100%;
    max-width: 640px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(230, 210, 170, 0.95), transparent 65%),
      radial-gradient(ellipse at 10% 100%, rgba(180, 140, 80, 0.25), transparent 55%),
      radial-gradient(ellipse at 50% 50%, #f6e3b6, #e6ce96 75%);
    box-shadow:
      inset 0 0 40px rgba(120, 70, 20, 0.28),
      inset 0 0 120px rgba(150, 90, 30, 0.18),
      0 6px 30px rgba(60, 30, 5, 0.35),
      0 1px 2px rgba(60, 30, 5, 0.4);
    border: 1px solid rgba(120, 70, 20, 0.5);
    border-radius: 3px;
    padding: 50px 42px 60px;
    position: relative;
    margin-top: 8px;
  }
  .parchment::before,
  .parchment::after {
    content: '';
    position: absolute;
    width: 42px; height: 42px;
    background: radial-gradient(circle at 30% 30%, rgba(120, 70, 15, 0.55), rgba(100, 50, 8, 0) 70%);
    pointer-events: none;
  }
  .parchment::before { top: -8px; left: -8px; }
  .parchment::after { bottom: -8px; right: -8px; }

  /* Stains */
  .stain {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.28;
  }
  .stain.s1 { width: 80px; height: 48px; top: 8%; right: 6%; background: radial-gradient(ellipse, rgba(90, 50, 10, 0.5), transparent 70%); transform: rotate(-18deg); }
  .stain.s2 { width: 55px; height: 35px; bottom: 22%; left: 4%; background: radial-gradient(ellipse, rgba(70, 30, 5, 0.45), transparent 72%); transform: rotate(28deg); }
  .stain.s3 { width: 18px; height: 18px; top: 32%; left: 8%; background: radial-gradient(circle, rgba(30, 15, 5, 0.7), transparent 60%); }
  .stain.s4 { width: 8px; height: 8px; top: 24%; left: 12%; background: rgba(30, 15, 5, 0.6); }

  .plate {
    font-family: 'IM Fell English SC', 'IM Fell English', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 32px;
    opacity: 0.75;
  }
  .plate::before, .plate::after { content: '·'; margin: 0 0.6em; color: var(--wax); }

  .insult-wrap {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 38px;
    perspective: 800px;
  }

  .insult {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 4.2vw, 38px);
    color: var(--ink);
    text-align: center;
    line-height: 1.35;
    letter-spacing: 0.005em;
    padding: 0 10px;
    text-shadow:
      0 0 0.2px var(--ink-soft),
      0.8px 0.8px 0 rgba(60, 30, 8, 0.15);
    transition: opacity 0.22s ease, transform 0.35s ease, filter 0.22s;
    will-change: opacity, transform;
  }
  .insult.fading {
    opacity: 0;
    transform: translateY(-6px) rotateX(12deg);
    filter: blur(2px);
  }
  .insult.appearing {
    animation: ink-appear 0.7s ease;
  }
  @keyframes ink-appear {
    0% { opacity: 0; transform: translateY(10px) rotateX(-14deg); filter: blur(3px); }
    50% { filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg); filter: blur(0); }
  }

  .seal-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
  }

  .seal-btn {
    width: 172px; height: 172px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    position: relative;
    filter: drop-shadow(3px 6px 5px rgba(60, 0, 0, 0.45));
    transition: transform 0.15s ease, filter 0.15s;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .seal-btn:hover { filter: drop-shadow(2px 4px 10px rgba(180, 40, 40, 0.55)); }
  .seal-btn:active { transform: translateY(2px) scale(0.97); }
  .seal-btn.pressing .seal-svg { animation: seal-press 0.6s ease; }
  @keyframes seal-press {
    0% { transform: scale(1) rotate(0deg); }
    20% { transform: scale(0.94) rotate(-1.5deg); }
    40% { transform: scale(0.98) rotate(2.5deg); }
    60% { transform: scale(1.02) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .seal-svg { transform-origin: center; display: block; }

  .seal-btn .cracks {
    opacity: 0;
    transition: opacity 0.1s;
  }
  .seal-btn.pressing .cracks { animation: crack-flash 0.6s ease; }
  @keyframes crack-flash {
    0% { opacity: 0; }
    12% { opacity: 0.9; }
    70% { opacity: 0.8; }
    100% { opacity: 0; }
  }

  .seal-label {
    font-family: 'IM Fell English SC', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--wax);
    text-transform: uppercase;
    opacity: 0.85;
    animation: pulse-label 2.6s ease-in-out infinite;
  }
  @keyframes pulse-label {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }

  .particle {
    position: absolute;
    width: 6px; height: 6px;
    background: radial-gradient(circle at 30% 30%, var(--wax-hi), var(--wax) 65%, var(--wax-lo));
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(180, 40, 40, 0.6);
  }

  .tools {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .tools button {
    background: transparent;
    border: 1px solid rgba(120, 70, 20, 0.55);
    color: var(--ink);
    font-family: 'IM Fell English SC', serif;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.18s;
    background-color: rgba(255, 240, 210, 0.3);
  }
  .tools button:hover {
    background-color: rgba(200, 160, 100, 0.3);
    border-color: var(--wax);
    color: var(--wax);
  }
  .tools button.active { color: var(--wax); border-color: var(--wax); }
  .tools .copied { color: var(--gold); border-color: var(--gold); }

  .history {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px dashed rgba(120, 70, 20, 0.4);
    font-size: 14px;
    color: var(--ink-soft);
    max-height: 180px;
    overflow: auto;
  }
  .history .h-title {
    font-family: 'IM Fell English SC', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--hint);
    margin-bottom: 8px;
    text-align: center;
    opacity: 0.7;
  }
  .history ul { list-style: none; padding: 0; }
  .history li {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    padding: 6px 0;
    border-bottom: 1px dotted rgba(120, 70, 20, 0.15);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color 0.15s, transform 0.15s;
  }
  .history li:hover { color: var(--ink); transform: translateX(4px); }
  .history li::before { content: '— '; color: var(--wax); opacity: 0.6; }

  .foot {
    margin-top: 18px;
    font-family: 'IM Fell English SC', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--hint);
    text-align: center;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .foot kbd {
    font-family: 'IM Fell English SC', serif;
    padding: 1px 6px;
    border: 1px solid rgba(120, 70, 20, 0.5);
    border-radius: 2px;
    margin: 0 2px;
    background: rgba(255, 240, 210, 0.4);
  }

  @media (max-width: 600px) {
    main { padding: 28px 14px 60px; }
    .parchment { padding: 34px 22px 44px; }
    .seal-btn { width: 140px; height: 140px; }
    .insult-wrap { min-height: 140px; margin-bottom: 24px; }
  }

  /* Thy tale, a play (pushedbutton's daughter's idea, 2026-10-13) */
  [hidden] { display: none !important; }
  .modes { display: flex; gap: 4px; margin: 2px 0 18px; padding: 4px; border: 1px solid rgba(120, 70, 20, 0.45); border-radius: 999px; background: rgba(255, 240, 210, 0.35); }
  .modes button { font: 14px/1 'IM Fell English SC', serif; letter-spacing: 0.12em; color: var(--ink-soft); background: transparent; border: 0; border-radius: 999px; padding: 11px 18px; min-height: 42px; cursor: pointer; }
  .modes button[aria-selected="true"] { background: var(--wax); color: #f6e3b6; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
  .modes button:focus-visible, .q-go:focus-visible, .q-small:focus-visible, .tools button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  body.playmode .foot { display: none; }
  .quill .plate { margin-bottom: 10px; }
  .q-lab { display: block; font-style: italic; color: var(--ink-soft); text-align: center; margin: 4px auto 16px; max-width: 30em; line-height: 1.5; font-size: 17px; }
  #tale { display: block; width: 100%; min-height: 150px; resize: vertical; font: 17px/1.55 'IM Fell English', serif; color: var(--ink); background: rgba(255, 248, 228, 0.6); border: 1px solid rgba(120, 70, 20, 0.5); border-radius: 2px; padding: 12px 14px; box-shadow: inset 0 1px 6px rgba(120, 70, 20, 0.18); }
  #tale::placeholder { color: #8a6840; opacity: 0.85; font-style: italic; }
  #tale:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .q-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 2px 20px; }
  .q-small { background: none; border: 0; color: var(--wax); font: italic 16px 'IM Fell English', serif; text-decoration: underline dotted; text-underline-offset: 3px; padding: 8px 0; cursor: pointer; }
  .q-count { font: 12px 'IM Fell English SC', serif; letter-spacing: 0.1em; color: #7a5a30; }
  .q-go { display: block; margin: 0 auto; font: 700 22px/1 'UnifrakturCook', serif; color: #f6e3b6; background: radial-gradient(circle at 35% 30%, var(--wax-hi), var(--wax) 55%, var(--wax-lo)); border: 0; border-radius: 999px; padding: 16px 32px 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(72, 4, 10, 0.4), inset 0 -3px 0 rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
  .q-go:active { transform: translateY(2px) scale(0.98); }
  .q-go:disabled { opacity: 0.65; cursor: wait; }
  .q-status { min-height: 1.6em; text-align: center; font-style: italic; color: var(--ink-soft); margin: 14px 0 0; font-size: 16px; }
  .q-status.busy::before { content: '🪶 '; display: inline-block; animation: q-dip 1.2s ease-in-out infinite; }
  @keyframes q-dip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-24deg) translateY(2px); } }
  .q-status.err { color: var(--wax); }
  .play { margin-top: 22px; border-top: 1px solid rgba(120, 70, 20, 0.4); padding-top: 26px; font-size: 18px; line-height: 1.6; }
  .play > * { animation: ink-appear 0.7s ease both; }
  .p-title { font: 700 clamp(25px, 6.4vw, 36px)/1.15 'UnifrakturCook', serif; text-align: center; color: var(--ink); margin-bottom: 6px; }
  .p-h { font: 15px 'IM Fell English SC', serif; letter-spacing: 0.22em; text-align: center; color: var(--wax); margin: 24px 0 8px; }
  .p-dp { list-style: none; text-align: center; }
  .p-dp li { margin: 3px 0; }
  .p-dp .p-who { display: inline; }
  .p-who { font-family: 'IM Fell English SC', serif; letter-spacing: 0.06em; color: var(--wax); }
  .p-set { text-align: center; font-style: italic; color: var(--ink-soft); margin-bottom: 14px; }
  .p-sp { margin: 12px 0; }
  .p-sp .p-who { display: block; text-align: center; font-size: 15px; letter-spacing: 0.16em; }
  .p-sp .p-say { display: block; white-space: pre-line; padding-left: 0.4em; }
  .p-dir { font-style: italic; color: var(--ink-soft); margin: 12px 0 12px 2.4em; }
  .p-fin { font: 700 24px 'UnifrakturCook', serif; text-align: center; color: var(--wax); margin-top: 28px; }
  .p-sp.reading, .p-dir.reading, .p-h.reading, .p-title.reading { background: rgba(198, 154, 82, 0.24); box-shadow: 0 0 0 6px rgba(198, 154, 82, 0.24); border-radius: 2px; }
  .p-note { text-align: center; font-size: 14px; font-style: italic; color: #7a5a30; margin-top: 10px; }
  @media (max-width: 600px) {
    .modes button { padding: 11px 13px; font-size: 13px; letter-spacing: 0.08em; }
    .play { font-size: 17px; }
    .p-dir { margin-left: 1.2em; }
  }
  @media print {
    body::before, body::after, main > *:not(#quill), #quill > *:not(#play) { display: none !important; }
    #quill { box-shadow: none; border: 0; background: none; padding: 0; }
    .play { border: 0; margin: 0; padding: 0; }
    .play > * { animation: none; }
  }
</style>
</head>
<body>
<main>
  <!-- Top flourish -->
  <div class="flourish" aria-hidden="true">
    <svg viewBox="0 0 520 24">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M10,12 L180,12"/>
        <path d="M180,12 C198,4 208,20 222,12 C236,4 248,20 260,12"/>
        <path d="M260,12 C272,4 284,20 298,12 C312,4 322,20 340,12"/>
        <path d="M340,12 L510,12"/>
        <circle cx="260" cy="12" r="2.5" fill="currentColor"/>
        <path d="M200,12 m-5,-5 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0" stroke-width="0.8" opacity="0.6"/>
        <path d="M320,12 m-5,-5 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0" stroke-width="0.8" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <h1 class="title">The Bard's<span class="amp">·</span>Insult</h1>
  <p class="subtitle">a compendium of bardly barbs &amp; Elizabethan slanders</p>

  <nav class="modes" role="tablist" aria-label="What the Bard does">
    <button type="button" role="tab" id="tabInsult" aria-selected="true" aria-controls="parchment">⚔ Insults</button>
    <button type="button" role="tab" id="tabPlay" aria-selected="false" aria-controls="quill">🪶 Thy tale, a play</button>
  </nav>

  <article class="parchment" id="parchment">
    <div class="stain s1"></div>
    <div class="stain s2"></div>
    <div class="stain s3"></div>
    <div class="stain s4"></div>

    <div class="plate">CERTIFIED BY THE GLOBE · ANNO MMXXVI</div>

    <div class="insult-wrap">
      <div class="insult" id="insult">Thou artless beetle-headed flap-dragon!</div>
    </div>

    <div class="seal-area">
      <button class="seal-btn" id="sealBtn" aria-label="Press wax seal for new insult">
        <svg class="seal-svg" id="sealSvg" viewBox="-100 -100 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="waxGrad" cx="0.34" cy="0.3" r="0.85">
              <stop offset="0%" stop-color="#f27272"/>
              <stop offset="22%" stop-color="#d63434"/>
              <stop offset="55%" stop-color="#a01818"/>
              <stop offset="85%" stop-color="#5c0808"/>
              <stop offset="100%" stop-color="#380404"/>
            </radialGradient>
            <radialGradient id="embGrad" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stop-color="#c12828"/>
              <stop offset="80%" stop-color="#7a0a0a"/>
              <stop offset="100%" stop-color="#3a0202"/>
            </radialGradient>
            <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
              <feOffset dx="1" dy="2"/>
              <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
              <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Outer wax blob (irregular scalloped) -->
          <path id="waxBlob"
            d="M -82,-6 Q -88,-34 -66,-54 Q -70,-78 -44,-80 Q -28,-92 -4,-82 Q 16,-90 40,-80 Q 58,-86 72,-66 Q 90,-58 86,-34 Q 94,-14 84,8 Q 92,28 74,44 Q 78,68 54,74 Q 42,92 18,82 Q -2,90 -22,82 Q -46,88 -60,66 Q -82,58 -82,34 Q -92,14 -82,-6 Z"
            fill="url(#waxGrad)"
            filter="url(#waxShadow)"/>

          <!-- Subtle wax drips -->
          <circle cx="-72" cy="52" r="6" fill="#8a1010" opacity="0.9"/>

<script>
(() => {
  // Classic Shakespearean Insult Kit word lists
  const ADJ1 = [
    'artless','bawdy','beslubbering','bootless','churlish','cockered','clouted','craven','currish',
    'dankish','dissembling','droning','errant','fawning','fobbing','froward','frothy','gleeking',
    'goatish','gorbellied','impertinent','infectious','jarring','loggerheaded','lumpish','mammering',
    'mangled','mewling','paunchy','pribbling','puking','puny','qualling','rank','reeky','roguish',
    'ruttish','saucy','spleeny','spongy','surly','tottering','unmuzzled','vain','venomed','villainous',
    'warped','wayward','weedy','yeasty'
  ];
  const ADJ2 = [
    'base-court','bat-fowling','beef-witted','beetle-headed','boil-brained','clapper-clawed',
    'clay-brained','common-kissing','crook-pated','dismal-dreaming','dizzy-eyed','doghearted',
    'dread-bolted','earth-vexing','elf-skinned','fat-kidneyed','fen-sucked','flap-mouthed',
    'fly-bitten','folly-fallen','fool-born','full-gorged','guts-griping','half-faced','hasty-witted',
    'hedge-born','hell-hated','idle-headed','ill-breeding','ill-nurtured','knotty-pated',
    'milk-livered','motley-minded','onion-eyed','plume-plucked','pottle-deep','pox-marked',
    'reeling-ripe','rough-hewn','rude-growing','rump-fed','shard-borne','sheep-biting','spur-galled',
    'swag-bellied','tardy-gaited','tickle-brained','toad-spotted','urchin-snouted','weather-bitten'
  ];
  const NOUNS = [
    'apple-john','baggage','barnacle','bladder','boar-pig','bugbear','bum-bailey','canker-blossom',
    'clack-dish','clotpole','coxcomb','codpiece','death-token','dewberry','flap-dragon','flax-wench',
    'flirt-gill','foot-licker','fustilarian','giglet','gudgeon','haggard','harpy','hedge-pig',
    'horn-beast','hugger-mugger','jolthead','lewdster','lout','maggot-pie','malt-worm','mammet',
    'measle','minnow','miscreant','moldwarp','mumble-news','nut-hook','pigeon-egg','pignut',
    'puttock','pumpion','ratsbane','scut','skainsmate','strumpet','varlet','vassal','whey-face',
    'wagtail'
  ];

  const FRAMES = [
    'Thou {a1} {a2} {n}!',
    'Thou {a1} {a2} {n}!',
    'Thou {a1} {a2} {n}!',
    'Thou art a {a1} {a2} {n}!',
    'Away, thou {a1} {a2} {n}!',
    'Avaunt, you {a1} {a2} {n}!',
    'Hence, thou {a1} {a2} {n}!',
    'Begone, thou {a1} {a2} {n}!',
    'Out, thou {a1} {a2} {n}!',
    'I do defy thee, thou {a1} {a2} {n}!',
    'Methinks thee a {a1} {a2} {n}.',
    'Thou craven {a2} {n}!'
  ];

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  let lastInsult = '';
  function generateInsult() {
    let out;
    let tries = 0;
    do {
      const frame = pick(FRAMES);
      out = frame
        .replace('{a1}', pick(ADJ1))
        .replace('{a2}', pick(ADJ2))
        .replace('{n}', pick(NOUNS));
      tries++;
    } while (out === lastInsult && tries < 6);
    lastInsult = out;
    return out;
  }

  const insultEl = document.getElementById('insult');
  const sealBtn = document.getElementById('sealBtn');
  const copyBtn = document.getElementById('copyBtn');
  const muteBtn = document.getElementById('muteBtn');
  const newBtn = document.getElementById('newBtn');
  const historyList = document.getElementById('historyList');

  const history = [];
  function addToHistory(text) {
    history.unshift(text);
    if (history.length > 6) history.pop();
    historyList.innerHTML = history.slice(1).map((t) =>
      `<li tabindex="0" data-text="${t.replace(/"/g,'&quot;')}">${t}</li>`
    ).join('');
    historyList.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        insultEl.textContent = li.dataset.text;
      });
    });
  }
  addToHistory(insultEl.textContent);

  let animating = false;
  function swapInsult() {
    if (animating) return;
    animating = true;
    insultEl.classList.add('fading');
    setTimeout(() => {
      const next = generateInsult();
      insultEl.textContent = next;
      insultEl.classList.remove('fading');
      insultEl.classList.add('appearing');
      addToHistory(next);
      setTimeout(() => {
        insultEl.classList.remove('appearing');
        animating = false;
      }, 700);
    }, 200);
  }

  // --- Wax particles ---
  function spawnParticles() {
    const rect = sealBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2 + window.scrollX;
    const cy = rect.top + rect.height / 2 + window.scrollY;
    const n = 14 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const a = Math.random() * Math.PI * 2;
      const v = 60 + Math.random() * 90;
      const dx = Math.cos(a) * v;
      const dy = Math.sin(a) * v - 30;
      const size = 4 + Math.random() * 6;
      p.style.left = (cx - size / 2) + 'px';
      p.style.top = (cy - size / 2) + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.position = 'absolute';
      document.body.appendChild(p);
      const startTime = performance.now();
      const life = 700 + Math.random() * 400;
      function step(t) {
        const dt = (t - startTime);
        const prog = dt / life;
        if (prog >= 1) {
          p.remove();
          return;
        }
        const x = cx + dx * prog * (1 - prog * 0.3);
        const y = cy + dy * prog + 180 * prog * prog; // gravity
        p.style.left = (x - size / 2) + 'px';
        p.style.top = (y - size / 2) + 'px';
        p.style.opacity = String(1 - prog);
        p.style.transform = `rotate(${prog * 420}deg)`;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }

  // --- Audio ---
  let audioCtx = null;
  let muted = false;
  function ensureAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playCrack() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;

    // Bass thump
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.connect(og).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.25);

    // Noise crack
    const nlen = Math.floor(ctx.sampleRate * 0.25);
    const buf = ctx.createBuffer(1, nlen, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < nlen; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 2.2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.34, t + 0.008);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1200, t);
    bp.frequency.exponentialRampToValueAtTime(420, t + 0.2);
    bp.Q.value = 0.9;
    noise.connect(bp).connect(ng).connect(ctx.destination);
    noise.start(t); noise.stop(t + 0.3);
  }

  function playQuill() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;
    const nlen = Math.floor(ctx.sampleRate * 0.55);
    const buf = ctx.createBuffer(1, nlen, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < nlen; i++) {
      const env = Math.pow(1 - i / nlen, 1.3);
      d[i] = (Math.random() * 2 - 1) * env * (0.5 + 0.5 * Math.sin(i * 0.002));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(0.12, t + 0.08);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800;
    noise.connect(hp).connect(ng).connect(ctx.destination);
    noise.start(t); noise.stop(t + 0.6);
  }

  // --- Seal click ---
  function pressSeal() {
    if (animating) return;
    sealBtn.classList.add('pressing');
    spawnParticles();
    playCrack();
    setTimeout(() => {
      playQuill();
      swapInsult();
    }, 260);
    setTimeout(() => sealBtn.classList.remove('pressing'), 650);
  }
  sealBtn.addEventListener('click', pressSeal);

  // Copy
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(insultEl.textContent).then(() => {
      const orig = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = orig;
        copyBtn.classList.remove('copied');
      }, 1400);
    }).catch(() => {
      copyBtn.textContent = 'Oops';
      setTimeout(() => copyBtn.textContent = 'Copy', 1400);
    });
  });

  // Mute toggle
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '♪ Off' : '♪ On';
    muteBtn.classList.toggle('active', muted);
  });

  // "Again" button — same as pressing seal
  newBtn.addEventListener('click', pressSeal);

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || document.body.classList.contains('playmode')) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      pressSeal();
    } else if (e.key === 'c' || e.key === 'C') {
      copyBtn.click();
    } else if (e.key === 'm' || e.key === 'M') {
      muteBtn.click();
    }
  });

  // Initial insult (fresh one on load)
  insultEl.textContent = generateInsult();
  addToHistory(insultEl.textContent);
})();
</script>
<script>
/* THY TALE, A PLAY (pushedbutton's daughter, 2026-10-13: "give your app a story or script and it would Shakespearise it,
   using shakespearian language and stage direction"). The Bard's ghost is Pollinations' text model; when it doesn't answer,
   his apprentice (a small word-swapper in this file) writes a rough copy so the page never comes back empty. */
(() => {
  const $ = (id) => document.getElementById(id);
  const tabI = $('tabInsult'), tabP = $('tabPlay'), insultCard = $('parchment'), quill = $('quill');
  const tale = $('tale'), go = $('makePlay'), st = $('qstatus'), play = $('play'), tools = $('playTools'), count = $('taleCount');
  const MAX = 3000;

  function setMode(on, fromUser) {
    document.body.classList.toggle('playmode', on);
    insultCard.hidden = on; quill.hidden = !on;
    tabI.setAttribute('aria-selected', String(!on)); tabP.setAttribute('aria-selected', String(on));
    tabI.tabIndex = on ? -1 : 0; tabP.tabIndex = on ? 0 : -1;
    if (fromUser) {
      try { history.replaceState(null, '', on ? '#play' : location.pathname + location.search); } catch (e) {}
      (on ? tabP : tabI).focus();
    }
  }
  tabI.addEventListener('click', () => { stopReading(); setMode(false, true); });
  tabP.addEventListener('click', () => setMode(true, true));
  [tabI, tabP].forEach((t) => t.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setMode(t === tabI, true); }
  }));
  if (/^#play/.test(location.hash)) setMode(true, false);

  const SAMPLES = [
    'Mum burned the toast. Dad opened every window. The dog ate the toast anyway.',
    'Lily: Can we get a cat?\nDad: No.\nLily: What about a very small cat?\nDad: ...Fine. A small one.\n(Lily runs off to tell Grandma.)',
    'On Friday afternoon the office printer jammed. Gary hit it once. It printed forty copies of a lasagne recipe and nobody knows whose it is.',
    'I lost my phone for an hour and found it in the fridge, next to the butter. I have no memory of putting it there.',
    'My little brother built a sandcastle. A wave knocked it down. He built it again, bigger, and named it Wave Proof Castle. The next wave knocked that one down too.'
  ];
  let sampleI = Math.floor(Math.random() * SAMPLES.length);
  $('taleSample').addEventListener('click', () => { tale.value = SAMPLES[sampleI++ % SAMPLES.length]; onInput(); tale.focus(); });
  function onInput() { count.textContent = tale.value.length + ' / ' + MAX; }
  tale.addEventListener('input', onInput);
  tale.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); make(false); } });
  try { const d = localStorage.getItem('bard-tale'); if (d) { tale.value = d.slice(0, MAX); } } catch (e) {}
  onInput();

  const SYS = [
    "You are the ghost of William Shakespeare, a playful dramatist. Rewrite the user's story or script as a short play in Shakespeare's style.",
    'Keep its characters, events and their order; do not change what happens or how it ends. You may add stage directions, asides, a Chorus and comic flourishes.',
    'Use Early Modern English: thou, thee, thy, thine, art, dost, doth, hath, prithee, forsooth, methinks, anon, ere, wherefore. Use rich metaphors, some lines in loose iambic pentameter, and end each scene with a rhyming couplet.',
    'Write stage directions the way Shakespeare did: Enter, Exit, Exeunt, Aside, Within, Flourish, Alarum, Re-enter. Keep it family-friendly.',
    'Use the names from the story; give unnamed people fitting titles such as A WEARY MOTHER or THE PRINTER. Animals and objects may speak if it is funny.',
    'Write 1 to 3 scenes and 10 to 40 speeches in total, longer for longer stories. Always write in English.',
    'Reply with JSON only, in exactly this shape: {"title": "The Most Lamentable Comedy of ...", "persons": [{"name": "LILY", "desc": "a daughter who desireth a cat"}], "scenes": [{"heading": "ACT I. SCENE I.", "setting": "A kitchen. Morning.", "lines": [{"dir": "Enter LILY and her FATHER."}, {"who": "LILY", "say": "Good father, hear me..."}]}]}',
    'Each item in "lines" is either {"dir": "..."} for a stage direction or {"who": "NAME", "say": "..."} for a speech; put verse line breaks inside "say" as \\n.'
  ].join(' ');

  /* reasoning_effort 'low' matters: without it the free model thinks until it runs out of room and returns no content at all */
  async function askBard(text, again) {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 75000);
    try {
      const res = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'openai', jsonMode: true, reasoning_effort: 'low', referrer: 'sloppy.live', seed: Math.floor(Math.random() * 1e6),
          messages: [
            { role: 'system', content: SYS },
            { role: 'user', content: 'The tale:\n' + text + (again ? '\n\n(Write a fresh take with new wording and new jokes.)' : '') }
          ]
        })
      });
      if (!res.ok) throw new Error('the ghost answered ' + res.status);
      const j = await res.json();
      const c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      const playObj = tidy(parseLoose(c));
      if (!playObj) throw new Error('the ghost wrote gibberish');
      return playObj;
    } finally { clearTimeout(tm); }
  }

  function parseLoose(c) {
    if (!c) return null;
    if (typeof c === 'object') return c;
    const a = c.indexOf('{'), b = c.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(c.slice(a, b + 1)); } catch (e) { return null; }
  }

  const str = (v, n) => (typeof v === 'string' ? v : v == null ? '' : String(v)).replace(/\s+$/g, '').slice(0, n || 2000);
  function tidy(p) {
    if (!p || !Array.isArray(p.scenes)) return null;
    const out = { title: str(p.title, 160) || 'A Tale Most Strange', persons: [], scenes: [] };
    (Array.isArray(p.persons) ? p.persons : []).slice(0, 24).forEach((q) => {
      if (q && (q.name || typeof q === 'string')) out.persons.push({ name: str(q.name || q, 60).toUpperCase(), desc: str(q.desc, 160) });
    });
    p.scenes.slice(0, 6).forEach((sc, i) => {
      if (!sc || !Array.isArray(sc.lines)) return;
      const lines = [];
      sc.lines.slice(0, 80).forEach((l) => {
        if (!l) return;
        if (typeof l === 'string') { lines.push({ dir: str(l, 400) }); return; }
        if (l.dir || l.direction || l.stage) lines.push({ dir: str(l.dir || l.direction || l.stage, 400) });
        else if (l.say || l.text || l.line) lines.push({ who: str(l.who || l.speaker || l.name || '', 60).toUpperCase(), say: str(l.say || l.text || l.line, 1600) });
      });
      if (lines.length) out.scenes.push({ heading: str(sc.heading, 60) || ('SCENE ' + (i + 1) + '.'), setting: str(sc.setting, 200), lines });
    });
    return out.scenes.length ? out : null;
  }

  /* the apprentice: a rough copy without the ghost */
  const SWAPS = [
    [/\byou're\b/gi, 'thou art'], [/\byou are\b/gi, 'thou art'], [/\bare you\b/gi, 'art thou'], [/\byou were\b/gi, 'thou wert'],
    [/\bdo you\b/gi, 'dost thou'], [/\bdid you\b/gi, 'didst thou'], [/\bhave you\b/gi, 'hast thou'], [/\bcan you\b/gi, 'canst thou'],
    [/\b(to|with|for|at|from|of|by|tell|told|give|gave|thank|love|see|saw|help|call|ask|need|want|like|hate|miss|let|bless) you\b/gi, '$1 thee'],
    [/\byourself\b/gi, 'thyself'], [/\byours\b/gi, 'thine'], [/\byour\b/gi, 'thy'], [/\byou\b/gi, 'thou'],
    [/\bdon't\b/gi, 'do not'], [/\bcan't\b/gi, 'cannot'], [/\bwon't\b/gi, 'will not'], [/\bisn't\b/gi, 'is not'], [/\bI'm\b/g, 'I am'],
    [/\bit's\b/gi, "'tis"], [/\bit was\b/gi, "'twas"], [/\bhas\b/gi, 'hath'], [/\bdoes\b/gi, 'doth'],
    [/\byes\b/gi, 'aye'], [/\bno\b/gi, 'nay'], [/\b(hello|hi|hey)\b/gi, 'good morrow'], [/\b(goodbye|bye)\b/gi, 'farewell'],
    [/\b(okay|ok)\b/gi, 'very well'], [/\bmaybe\b/gi, 'perchance'], [/\bplease\b/gi, 'prithee'], [/\breally\b/gi, 'verily'],
    [/\bbefore\b/gi, 'ere'], [/\boften\b/gi, 'oft'], [/\bnothing\b/gi, 'naught'], [/\bwhy\b/gi, 'wherefore'], [/\bsoon\b/gi, 'anon'],
    [/\b(mom|mum|mommy|mummy)\b/gi, 'mother'], [/\b(dad|daddy)\b/gi, 'father'], [/\bkids\b/gi, 'children'], [/\bphone\b/gi, 'speaking-glass'],
    [/\bfridge\b/gi, 'cold larder'], [/\bprinter\b/gi, 'printing press'], [/\bcar\b/gi, 'carriage'], [/\btoast\b/gi, 'bread most burnt']
  ];
  function bardify(t) {
    let x = t;
    SWAPS.forEach(([re, to]) => { x = x.replace(re, function (m) { const r = m.replace(re, to); return /^[A-Z]/.test(m) ? r.charAt(0).toUpperCase() + r.slice(1) : r; }); });
    return x;
  }
  function apprentice(text) {
    const rows = text.split(/\n+/).map((r) => r.trim()).filter(Boolean);
    const scriptRe = /^([A-Za-z][\w .'-]{0,24}?)\s*[:–—-]\s+(.+)$/;
    const isScript = rows.filter((r) => scriptRe.test(r)).length >= Math.max(2, rows.length / 2);
    const lines = [], who = [];
    if (isScript) {
      rows.forEach((r) => {
        const m = r.match(scriptRe);
        if (!m) { lines.push({ dir: bardify(r.replace(/^[(\[]|[)\]]$/g, '')) }); return; }
        const name = m[1].trim().toUpperCase();
        if (who.indexOf(name) < 0) who.push(name);
        let say = m[2];
        const asides = [];
        say = say.replace(/\(([^)]{1,80})\)/g, (z, a) => { asides.push(a); return ''; }).trim();
        const nice = name.charAt(0) + name.slice(1).toLowerCase();
        asides.forEach((a) => lines.push({ dir: bardify(a.toLowerCase().indexOf(nice.toLowerCase()) === 0 ? a : nice + ' ' + a) }));
        if (say) lines.push({ who: name, say: bardify(say) });
      });
    } else {
      who.push('CHORUS');
      (text.match(/[^.!?]+[.!?]*/g) || [text]).map((x) => x.trim()).filter(Boolean).slice(0, 30)
        .forEach((x) => lines.push({ who: 'CHORUS', say: bardify(x) }));
    }
    lines.unshift({ dir: 'Enter ' + who.join(', ') + '.' });
    lines.push({ dir: 'Exeunt.' });
    const hero = (isScript ? who[0] : (text.match(/\b[A-Z][a-z]{2,}\b/) || ['a Day'])[0]);
    return {
      title: 'The Most Excellent History of ' + (hero.charAt(0) + hero.slice(1).toLowerCase()),
      persons: who.map((n) => ({ name: n, desc: n === 'CHORUS' ? 'who telleth the tale' : '' })),
      scenes: [{ heading: 'ACT I. SCENE I.', setting: 'A place much like thine own.', lines }],
      rough: true
    };
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  let shown = null;
  function render(p) {
    shown = p;
    play.textContent = '';
    let k = 0;
    const add = (e) => { e.style.animationDelay = Math.min(k++ * 70, 2400) + 'ms'; play.appendChild(e); return e; };
    add(el('h2', 'p-title', p.title));
    if (p.persons.length) {
      add(el('h3', 'p-h', 'Dramatis Personae'));
      const ul = add(el('ul', 'p-dp'));
      p.persons.forEach((q) => { const li = el('li'); li.appendChild(el('span', 'p-who', q.name)); if (q.desc) li.appendChild(document.createTextNode(', ' + q.desc)); ul.appendChild(li); });
    }
    p.scenes.forEach((sc) => {
      add(el('h3', 'p-h', sc.heading));
      if (sc.setting) add(el('p', 'p-set', sc.setting));
      sc.lines.forEach((l) => {
        if (l.dir != null) { add(el('p', 'p-dir', '[' + l.dir.replace(/^\[|\]$/g, '') + ']')); return; }
        const sp = add(el('p', 'p-sp'));
        if (l.who) { sp.appendChild(el('span', 'p-who', l.who)); sp.dataset.who = l.who; }
        sp.appendChild(el('span', 'p-say', l.say.replace(/\\n/g, '\n')));
      });
    });
    add(el('p', 'p-fin', 'Finis'));
    if (p.rough) add(el('p', 'p-note', "This is the apprentice's rough copy. The Bard's ghost was away; press Another take in a minute for the real thing."));
    play.hidden = false; tools.hidden = false;
  }
  function asText(p) {
    const out = [p.title.toUpperCase(), ''];
    if (p.persons.length) { out.push('DRAMATIS PERSONAE'); p.persons.forEach((q) => out.push(q.name + (q.desc ? ', ' + q.desc : ''))); out.push(''); }
    p.scenes.forEach((sc) => {
      out.push(sc.heading + (sc.setting ? ' ' + sc.setting : ''), '');
      sc.lines.forEach((l) => { if (l.dir != null) out.push('[' + l.dir.replace(/^\[|\]$/g, '') + ']', ''); else out.push((l.who ? l.who + '. ' : '') + l.say.replace(/\\n/g, '\n'), ''); });
    });
    out.push('FINIS');
    return out.join('\n');
  }

  const WAIT = ['The Bard dips his quill…', 'Counting syllables on his fingers…', 'Finding a rhyme for that…', 'Hiring a bear, just in case…', 'Blotting the ink…', 'Rehearsing the Chorus…'];
  let busy = false;
  async function make(again) {
    stopReading();
    const text = tale.value.trim();
    if (!text) { st.className = 'q-status err'; st.textContent = 'The Bard needs a tale first. Write a few lines, or try a sample.'; tale.focus(); return; }
    if (busy) return;
    busy = true; go.disabled = true; $('playAgain').disabled = true;
    try { localStorage.setItem('bard-tale', text); } catch (e) {}
    let w = 0;
    st.className = 'q-status busy'; st.textContent = WAIT[0];
    const ticker = setInterval(() => { st.textContent = WAIT[++w % WAIT.length]; }, 2600);
    let p = null, why = '';
    try { p = await askBard(text, again); } catch (e) { why = e && e.name === 'AbortError' ? 'the ghost took too long' : 'the ghost could not be reached'; }
    clearInterval(ticker);
    if (!p) { p = apprentice(text); st.className = 'q-status err'; st.textContent = 'Alas, ' + why + '. Here is a rough copy instead.'; }
    else { st.className = 'q-status'; st.textContent = 'Thy play is writ.'; }
    render(p);
    busy = false; go.disabled = false; $('playAgain').disabled = false;
    if (again || matchMedia('(max-width: 600px)').matches) play.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  /* 🔊 read aloud: every character gets their own voice (or at least their own pitch and pace); the narrator reads the
     stage directions a little lower and quieter. The line being read lights up and scrolls into view. */
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const readBtn = $('playRead');
  let reading = false, items = [], qi = 0, cast = {}, castN = 0, guard = 0, fails = 0;
  if (synth) readBtn.hidden = false;
  function voiceFor(who) {
    if (!cast[who]) {
      const all = synth.getVoices(), en = all.filter((v) => /^en/i.test(v.lang)), vs = en.length ? en : all, k = castN++;
      cast[who] = { voice: vs.length ? vs[(k * 3 + 1) % vs.length] : null, pitch: [1, 0.7, 1.4, 0.88, 1.2, 0.6, 1.55][k % 7], rate: [1, 0.9, 1.08, 0.95, 1.04][k % 5] };
    }
    return cast[who];
  }
  function mark(node) {
    play.querySelectorAll('.reading').forEach((n) => n.classList.remove('reading'));
    if (node) { node.classList.add('reading'); try { node.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }
  }
  function stopReading() {
    if (!synth) return;
    reading = false; clearTimeout(guard); synth.cancel(); mark(null); readBtn.textContent = '🔊 Read aloud';
  }
  function nextLine() {
    clearTimeout(guard);
    if (!reading) return;
    const it = items[qi++];
    if (!it) { stopReading(); return; }
    mark(it.node);
    const u = new SpeechSynthesisUtterance(it.text);
    if (it.who) { const c = voiceFor(it.who); if (c.voice) u.voice = c.voice; u.pitch = c.pitch; u.rate = c.rate; }
    else { const n = voiceFor('~narrator'); if (n.voice) u.voice = n.voice; u.pitch = 0.8; u.rate = 1.06; u.volume = 0.8; }
    let done = false;
    const on = () => { if (done) return; done = true; nextLine(); };
    u.onend = on;
    u.onerror = (e) => {
      if (done) return;
      if (e && e.error !== 'interrupted' && e.error !== 'canceled' && ++fails >= 2 && qi <= 2) { done = true; stopReading(); st.className = 'q-status err'; st.textContent = 'Alas, this browser hath no voice to read with.'; return; }
      on();
    };
    /* some engines never fire onend: move on after a generous guess of the line's length */
    guard = setTimeout(on, Math.max(7000, it.text.length * 140));
    synth.speak(u);
  }
  function readAloud() {
    if (!synth || !shown) return;
    if (reading) { stopReading(); return; }
    cast = {}; castN = 0; voiceFor('~narrator');
    items = [];
    play.querySelectorAll('.p-title, .p-h, .p-set, .p-dir, .p-sp').forEach((n) => {
      if (n.classList.contains('p-h') && /personae/i.test(n.textContent)) return;
      if (n.classList.contains('p-sp')) { const say = n.querySelector('.p-say'); if (say && say.textContent.trim()) items.push({ node: n, who: n.dataset.who || 'SOMEONE', text: say.textContent }); }
      else items.push({ node: n, text: n.textContent.replace(/^\[|\]$/g, '') });
    });
    qi = 0; fails = 0; reading = true; readBtn.textContent = '■ Stop';
    synth.cancel(); nextLine();
  }
  readBtn.addEventListener('click', readAloud);
  if (synth) synth.addEventListener && synth.addEventListener('voiceschanged', () => {});
  go.addEventListener('click', () => make(false));
  $('playAgain').addEventListener('click', () => make(true));
  $('playPrint').addEventListener('click', () => { try { window.print(); } catch (e) {} });
  $('playCopy').addEventListener('click', async () => {
    if (!shown) return;
    const b = $('playCopy');
    try { await navigator.clipboard.writeText(asText(shown)); b.textContent = 'Copied'; }
    catch (e) { b.textContent = 'Copy failed'; }
    setTimeout(() => { b.textContent = 'Copy'; }, 1600);
  });
})();
</script>
</body>
</html>
