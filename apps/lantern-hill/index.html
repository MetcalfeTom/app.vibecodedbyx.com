<style>

#title{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.6);transition:opacity 1.2s}

<body>
<canvas id="c" aria-label="Sakurahime, a 3D Japanese town at dusk under a giant weeping cherry tree. Drag to look around, pinch or scroll to zoom."></canvas>
<div id="vig"></div>
<div id="title"><h1>Sakura<span>hime</span></h1><p>A little Japanese town that lives under one giant weeping cherry. Drag to look around, pinch or scroll to zoom.</p></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// seeded randomness so the town is the same on every visit
let seed = 7;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2 });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#e7a487');
scene.fog = new THREE.Fog('#6e5a86', 60, 200);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

const MOON_A = -2.38; // direction of the moon from the town centre: left of the castle and the trunk from the start view
const offMoon = a => Math.abs(Math.atan2(Math.sin(a - MOON_A), Math.cos(a - MOON_A)));
// sky: a big sphere with a dusk gradient painted into its vertex colours
{
  const g = new THREE.SphereGeometry(200, 24, 16), p = g.attributes.position, col = [];
  const top = new THREE.Color('#1b1838'), mid = new THREE.Color('#6e5a86'), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 200;
    if (h < 0.08) c.copy(HORIZON); else if (h < 0.3) c.copy(HORIZON).lerp(mid, (h - 0.08) / 0.22); else c.copy(mid).lerp(top, Math.min(1, (h - 0.3) / 0.4));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  const sp = [];
  for (let i = 0; i < 260; i++) { const a = rnd() * Math.PI * 2, h = 0.35 + rnd() * 0.6; sp.push(Math.cos(a) * 190 * Math.sqrt(1 - h * h), h * 190, Math.sin(a) * 190 * Math.sqrt(1 - h * h)); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: '#fff4e0', size: 1.1, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 })));
  // the moon hangs low over the lake, in the one gap of the weeping curtain (bereonion: "i cant see any moon")
  const moon = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: '#fbe9c8', fog: false }));
  moon.position.set(Math.cos(MOON_A) * 170, 27, -6 + Math.sin(MOON_A) * 170); moon.lookAt(0, 20, -6); scene.add(moon);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({ color: '#fbe9c8', fog: false, transparent: true, opacity: 0.18, depthWrite: false }));
  halo.position.copy(moon.position).multiplyScalar(1.01); halo.lookAt(0, 20, -6); scene.add(halo);
  // a silver path on the water toward it
  const path = new THREE.Mesh(new THREE.PlaneGeometry(5, 120), new THREE.MeshBasicMaterial({ color: '#f3e6cf', transparent: true, opacity: 0.22, depthWrite: false }));
  path.rotation.set(-Math.PI / 2, 0, -MOON_A - Math.PI / 2); path.position.set(Math.cos(MOON_A) * 98, -0.66, -6 + Math.sin(MOON_A) * 98); scene.add(path);
}

scene.add(new THREE.HemisphereLight('#b9a8e8', '#4a3a3a', 1.6));
const sun = new THREE.DirectionalLight('#ffb98a', 2.4);
sun.position.set(30, 22, 25); sun.castShadow = true; sun.shadow.mapSize.setScalar(1024);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, far: 120 });
scene.add(sun);

// materials: one per colour, flat shaded
const mats = {};
const M = (c) => mats[c] || (mats[c] = new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9 }));
const GLOW = {};
const G = (c) => GLOW[c] || (GLOW[c] = new THREE.MeshBasicMaterial({ color: c }));
function add(geo, mat, x, y, z, ry = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const box = (w, h, d, c, x, y, z, ry, p) => add(new THREE.BoxGeometry(w, h, d), M(c), x, y + h / 2, z, ry, p);

// a hipped roof: a squashed four-sided pyramid with a wider, flatter eave under it
function roof(w, d, x, y, z, ry = 0, c = '#3c3f4f', p = scene) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g);
  const eave = add(new THREE.ConeGeometry(0.75, 0.32, 4, 1, true), M(c), 0, 0.16, 0, Math.PI / 4, g);
  eave.scale.set(w * 1.02, 1, d * 1.02); eave.material = M(c); eave.material.side = THREE.DoubleSide;
  const cap = add(new THREE.ConeGeometry(0.62, 1, 4), M(c), 0, 0.5 + 0.2, 0, Math.PI / 4, g);
  cap.scale.set(w * 0.9, Math.min(w, d) * 0.55, d * 0.9);
  return g;
}

// a red paper lantern that glows
const lanterns = [];
function lantern(x, y, z, s = 1) {
  const l = add(new THREE.SphereGeometry(0.22 * s, 8, 6), G('#ff9a4a'), x, y, z);
  l.scale.y = 1.25; l.castShadow = false; lanterns.push(l);
  add(new THREE.CylinderGeometry(0.12 * s, 0.12 * s, 0.06, 8), M('#1a1414'), x, y + 0.3 * s, z).castShadow = false;
  return l;
}

// a machiya tea house: dark wood below, white plaster above, grey tile roof
function house(x, z, ry, w = 3, d = 3.4, floors = 2) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  box(w, 1.6, d, '#5b3a2a', 0, 0, 0, 0, g);
  if (floors > 1) {
    roof(w + 0.6, d + 0.6, 0, 1.6, 0, 0, '#3c3f4f', g);
    box(w * 0.9, 1.2, d * 0.9, '#efe2c8', 0, 1.75, 0, 0, g);
    for (let i = -1; i <= 1; i++) box(0.08, 1.0, 0.06, '#5b3a2a', i * w * 0.28, 1.85, d * 0.45 + 0.02, 0, g);
    roof(w + 0.7, d + 0.7, 0, 2.95, 0, 0, '#34374a', g);
  } else roof(w + 0.7, d + 0.7, 0, 1.6, 0, 0, '#34374a', g);
  // a warm doorway curtain (noren) and a lit window
  box(w * 0.4, 0.55, 0.05, rnd() < 0.5 ? '#2c4a7a' : '#7a2c3a', 0, 0.85, d / 2 + 0.03, 0, g);
  const win = add(new THREE.PlaneGeometry(w * 0.32, 0.5), G('#ffc77a'), w * 0.27, 0.8, d / 2 + 0.03, 0, g);
  win.castShadow = false;
  return g;
}

function sakura(x, y, z, s = 1) {
  add(new THREE.CylinderGeometry(0.12 * s, 0.2 * s, 1.6 * s, 6), M('#4a3028'), x, y + 0.8 * s, z);
  const pinks = ['#f2b6c6', '#f7c9d4', '#e99ab0'];
  for (let i = 0; i < 4; i++) {
    const r = (0.8 + rnd() * 0.5) * s, b = new THREE.IcosahedronGeometry(r, 0);
    add(b, M(pinks[i % 3]), x + (rnd() - 0.5) * 1.4 * s, y + (1.8 + rnd() * 0.8) * s, z + (rnd() - 0.5) * 1.4 * s, rnd() * 3);
  }
}

function torii(x, y, z, ry = 0, s = 1) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; g.scale.setScalar(s); scene.add(g);
  const red = '#d8452f';
  add(new THREE.CylinderGeometry(0.13, 0.15, 2.4, 8), M(red), -0.9, 1.2, 0, 0, g);
  add(new THREE.CylinderGeometry(0.13, 0.15, 2.4, 8), M(red), 0.9, 1.2, 0, 0, g);
  box(2.3, 0.16, 0.24, red, 0, 1.85, 0, 0, g);
  const top = box(2.9, 0.2, 0.34, '#1f1a1a', 0, 2.35, 0, 0, g);
  box(2.6, 0.12, 0.3, red, 0, 2.22, 0, 0, g);
  top.scale.set(1, 1, 1);
  return g;
}

function stoneLantern(x, y, z) {
  const st = '#8d8a94';
  box(0.35, 0.5, 0.35, st, x, y, z);
  box(0.55, 0.3, 0.55, st, x, y + 0.5, z);
  const l = add(new THREE.BoxGeometry(0.28, 0.22, 0.28), G('#ffcf7a'), x, y + 0.91, z); l.castShadow = false;
  add(new THREE.ConeGeometry(0.5, 0.35, 4), M(st), x, y + 1.2, z, Math.PI / 4);
}

// ---- the island, the river and the lake round it ----
const ISLE = { x: 0, z: -6, r: 36 }, RIV = [13, 19];
// two halves of a round island, cut by the river; edges jittered so it isn't a perfect coin
function islandHalf(north) {
  const zc = north ? RIV[0] : RIV[1], te = Math.asin((zc - ISLE.z) / ISLE.r);
  // the circle where z = zc sits at angles te and PI - te; north sweeps the long way round, south the short arc
  const a0 = north ? Math.PI - te : te, a1 = north ? te + Math.PI * 2 : Math.PI - te, N = north ? 48 : 16;
  const sh = new THREE.Shape();
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = a0 + (a1 - a0) * t, wob = Math.sin(t * Math.PI) * (Math.sin(a * 5) * 0.03 + Math.sin(a * 11 + 1) * 0.02);
    const rr = ISLE.r * (1 + wob), x = ISLE.x + Math.cos(a) * rr, z = ISLE.z + Math.sin(a) * rr;
    i ? sh.lineTo(x, -z) : sh.moveTo(x, -z);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 3, bevelEnabled: false, curveSegments: 1 });
  g.rotateX(-Math.PI / 2); g.translate(0, -3, 0);
  const m = new THREE.Mesh(g, [M(north ? '#5a6b4a' : '#4f5f43'), M('#6a5a50')]);
  m.receiveShadow = true; scene.add(m);
}
islandHalf(true); islandHalf(false);
// the lake all round, and the river through the middle
const lake = add(new THREE.CircleGeometry(260, 48), new THREE.MeshStandardMaterial({ color: '#2b3f68', roughness: 0.3, metalness: 0.15 }), 0, -0.7, 0);
lake.rotation.x = -Math.PI / 2; lake.castShadow = false;
const water = add(new THREE.BoxGeometry(80, 0.6, 6), new THREE.MeshStandardMaterial({ color: '#2e4f7a', roughness: 0.25, metalness: 0.1 }), 0, -0.55, 16);
water.castShadow = false;
// stone banks along the river
box(70, 0.6, 0.6, '#7d7a80', 0, -0.55, 12.7); box(70, 0.6, 0.6, '#7d7a80', 0, -0.55, 19.3);
// the street: pale stone from the bridge up to the hill
box(3, 0.04, 14, '#b9ab98', 0, 0, 5.5);

// red arched bridge over the river
{
  const red = '#d8452f';
  for (let i = 0; i <= 12; i++) {
    const t = i / 12 - 0.5, z = 16 + t * 8.4, y = 0.25 + Math.cos(t * Math.PI) * 0.9;
    box(2.6, 0.18, 0.72, '#7a5238', 0, y, z);
    if (i % 2 === 0) { box(0.14, 0.9, 0.14, red, -1.3, y, z); box(0.14, 0.9, 0.14, red, 1.3, y, z); }
  }
  for (const sx of [-1.3, 1.3]) for (let i = 0; i < 12; i++) {
    const t0 = i / 12 - 0.5, t1 = (i + 1) / 12 - 0.5, z0 = 16 + t0 * 8.4, z1 = 16 + t1 * 8.4;
    const y0 = 1.05 + Math.cos(t0 * Math.PI) * 0.9, y1 = 1.05 + Math.cos(t1 * Math.PI) * 0.9;
    const r = add(new THREE.BoxGeometry(0.16, 0.12, Math.hypot(z1 - z0, y1 - y0)), M(red), sx, (y0 + y1) / 2, (z0 + z1) / 2);
    r.rotation.x = -Math.atan2(y1 - y0, z1 - z0);
  }
  lantern(-1.3, 1.95, 11.9); lantern(1.3, 1.95, 11.9); lantern(-1.3, 1.95, 20.1); lantern(1.3, 1.95, 20.1);
}

// the street of tea houses
for (let i = 0; i < 4; i++) {
  const z = 10 - i * 3.9;
  house(-4.2, z, Math.PI / 2, 3, 3.4, i % 3 === 1 ? 1 : 2);
  house(4.2, z, -Math.PI / 2, 3, 3.4, i % 2 === 0 ? 2 : 1);
  lantern(-2.3, 1.9, z + 1.2); lantern(2.3, 1.9, z - 1.2);
}
for (const [x, z] of [[-9, 6], [9, 8], [-10, -1], [10, 1], [-7, 12], [7, 12.2]]) sakura(x, 0, z, 1.1);
house(-12, 9, 0.3, 3.4, 3.4, 1); house(12.5, 6, -0.4, 3.2, 3.6, 2); house(-14, 2, 0.6); house(14, -2, -0.5, 3, 3, 1);

// the hill: three stone terraces
const HILL = { x: 0, z: -16 };
const tiers = [[16, 3], [11, 6.2], [6.5, 9.4]];
let prevH = 0;
for (const [r, h] of tiers) {
  const t = add(new THREE.CylinderGeometry(r, r + 0.9, h - prevH + 0.4, 10), M('#86828c'), HILL.x, prevH - 0.2 + (h - prevH + 0.4) / 2, HILL.z, 0.31);
  const top = add(new THREE.CylinderGeometry(r - 0.15, r - 0.15, 0.18, 10), M('#5d7049'), HILL.x, h + 0.09, HILL.z, 0.31);
  top.castShadow = false;
  prevH = h;
}
// stone stairs up the front of the hill with a row of red gates
{
  const steps = 40;
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1), z = -1.5 - t * 13.2, y = t * 9.4;
    box(2.2, y + 0.02, 0.36, '#a39d98', 0, 0, z); // solid steps down to the ground, no floating slabs
  }
  for (let i = 0; i < 7; i++) {
    const t = 0.04 + i * 0.12, z = -1.5 - t * 13.2, y = t * 9.4;
    torii(0, y, z, 0, 1.15);
  }
  stoneLantern(-1.7, 0, -0.6); stoneLantern(1.7, 0, -0.6);
}
// shrine on the first terrace, pagoda on the second
{
  const g = new THREE.Group(); g.position.set(-8.5, 3, -12); g.rotation.y = 0.5; scene.add(g);
  box(4.2, 0.4, 3.6, '#7d7a80', 0, 0, 0, 0, g);
  box(3.2, 1.8, 2.6, '#a7372b', 0, 0.4, 0, 0, g);
  roof(4.6, 4, 0, 2.2, 0, 0, '#2f3b3a', g);
  lantern(-1.1, 1.7, 1.55, g); lantern(1.1, 1.7, 1.55, g);
  stoneLantern(-6.2, 3, -9.2); stoneLantern(-10.6, 3, -9.6);
  sakura(9, 3, -10, 1.2); sakura(-11, 3, -17, 1.2); sakura(10.5, 6.2, -16, 0.9);
}
{
  const g = new THREE.Group(); g.position.set(6.4, 6.2, -16.5); scene.add(g);
  let w = 2.8, y = 0;
  for (let i = 0; i < 5; i++) {
    box(w * 0.7, 0.85, w * 0.7, i === 0 ? '#a7372b' : '#b8462f', 0, y, 0, 0, g);
    roof(w * 1.35, w * 1.35, 0, y + 0.85, 0, 0, '#2f3340', g);
    y += 1.3; w *= 0.86;
  }
  add(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 6), M('#c9a24a'), 0, y + 1.0, 0, 0, g);
  for (let i = 0; i < 5; i++) add(new THREE.TorusGeometry(0.2, 0.04, 4, 10), M('#c9a24a'), 0, y + 0.4 + i * 0.3, 0, 0, g).rotation.x = Math.PI / 2;
}
// the castle keep on top: sloped stone base, white walls, dark layered roofs
{
  const g = new THREE.Group(); g.position.set(-1, 9.4, -18); g.rotation.y = 0.12; scene.add(g);
  const base = add(new THREE.CylinderGeometry(3.4, 4.3, 1.8, 4, 1), M('#7a7680'), 0, 0.9, 0, Math.PI / 4, g);
  base.scale.set(1.15, 1, 1);
  let w = 5.6, d = 4.6, y = 1.8;
  for (let i = 0; i < 3; i++) {
    box(w, 1.5, d, '#f1ebe0', 0, y, 0, 0, g);
    for (let k = -1; k <= 1; k++) { const wi = add(new THREE.PlaneGeometry(0.5, 0.45), G(i === 0 ? '#ffc77a' : '#2a2a35'), k * w * 0.3, y + 0.9, d / 2 + 0.02, 0, g); wi.castShadow = false; }
    roof(w + 1.2, d + 1.2, 0, y + 1.5, 0, 0, '#2a2d38', g);
    y += 2.1; w *= 0.74; d *= 0.74;
  }
  // golden fish on the roof ridge
  for (const sx of [-0.9, 0.9]) add(new THREE.ConeGeometry(0.16, 0.6, 5), M('#e3b23c'), sx, y + 0.35, 0, 0, g).rotation.z = sx > 0 ? -0.5 : 0.5;
}
// the great weeping cherry (bereonion): one colossal trunk behind the castle, its crown a pink dome over
// the whole town, and long blossom strands hanging down all round the edge like a curtain
{
  const bark = '#4e342b', barkHi = '#64443a', TR = { x: -2, z: -40 };
  let x = TR.x, y = -1, z = TR.z, r = 6.5;
  for (let i = 0; i < 8; i++) {
    const h = 4.4, nx = x + Math.sin(i * 1.4) * 0.9, nz = z + Math.cos(i * 1.2) * 0.4 + 0.5;
    const seg = add(new THREE.CylinderGeometry(r * 0.9, r, h + 0.4, 9), M(i % 2 ? bark : barkHi), (x + nx) / 2, y + h / 2, (z + nz) / 2, i * 0.6);
    seg.rotation.z = (nx - x) * 0.12; seg.castShadow = false;
    x = nx; z = nz; y += h; r *= 0.9;
  }
  for (let i = 0; i < 9; i++) { // root flare
    const a = i / 9 * Math.PI * 2, root = add(new THREE.CylinderGeometry(0.6, 2.4, 9, 6), M(bark), TR.x + Math.cos(a) * 6, 0.6, TR.z + Math.sin(a) * 6);
    root.rotation.set(Math.sin(a) * 1.25, 0, -Math.cos(a) * 1.25); root.castShadow = false;
  }
  // the crown: a dome of blossom clumps, one instanced mesh
  const DOME = { x: 0, z: -6, R: 67.6, cy: -17.6 }, RIM = 50;
  const clumps = [];
  for (let i = 0; i < 900; i++) {
    const rr = Math.sqrt(rnd()) * RIM, a = rnd() * Math.PI * 2;
    const cx = DOME.x + Math.cos(a) * rr, cz = DOME.z + Math.sin(a) * rr;
    clumps.push([cx, DOME.cy + Math.sqrt(DOME.R * DOME.R - rr * rr) + (rnd() - 0.5) * 3, cz, 2.6 + rnd() * 2.6]);
  }
  // boughs from the trunk top out to the crown
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.2, rr = 18 + rnd() * 14, ex = DOME.x + Math.cos(a) * rr, ez = DOME.z + Math.sin(a) * rr;
    const ey = DOME.cy + Math.sqrt(DOME.R * DOME.R - rr * rr) - 2, len = Math.hypot(ex - x, ey - y, ez - z);
    const b = add(new THREE.CylinderGeometry(0.8, 2.2, len, 7), M(bark), (x + ex) / 2, (y + ey) / 2, (z + ez) / 2);
    b.lookAt(ex, ey, ez); b.rotateX(Math.PI / 2); b.castShadow = false;
  }
  // weeping strands: chains of small blossom clumps hanging from the rim all round
  const strands = [];
  // bereonion: strands in the middle too, and a real mix of sizes
  const strand = (rr, a, bottom, size) => {
    const top = DOME.cy + Math.sqrt(DOME.R * DOME.R - Math.min(rr, 66) ** 2) - 1;
    const sx = DOME.x + Math.cos(a) * rr, sz = DOME.z + Math.sin(a) * rr;
    for (let yy = top; yy > bottom; yy -= (1.0 + rnd() * 0.4) * size) strands.push([sx + Math.cos(a) * (top - yy) * 0.05, yy, sz + Math.sin(a) * (top - yy) * 0.05, size * (0.75 + rnd() * 0.4)]);
  };
  for (let i = 0; i < 120; i++) { // the curtain round the rim: short tassels to long ropes
    const size = rnd() < 0.25 ? 1.5 + rnd() * 0.6 : 0.5 + rnd() * 0.7;
    const a = i / 120 * Math.PI * 2 + rnd() * 0.04, rr = RIM - 4 + rnd() * 6, bottom = rnd() < 0.3 ? 16 + rnd() * 10 : 2 + rnd() * 10;
    if (offMoon(a) > 0.3) strand(rr, a, bottom, size); // the moon window stays open
  }
  for (let i = 0, n = 0; n < 60 && i < 400; i++) { // inner strands: inside the camera's circle, off the street, above the rooftops
    const rr = 6 + Math.sqrt(rnd()) * 16, a = rnd() * Math.PI * 2, x = DOME.x + Math.cos(a) * rr, z = DOME.z + Math.sin(a) * rr;
    if (Math.abs(x) < 5) continue;
    const overHill = Math.hypot(x - HILL.x, z - HILL.z) < 18 ? 15 : 0;
    strand(rr, a, overHill + 13 + rnd() * 8, rnd() < 0.3 ? 0.7 + rnd() * 0.2 : 0.4 + rnd() * 0.3); n++;
  }
  const pinks = ['#f2b6c6', '#f7c9d4', '#e99ab0', '#f4a9bf', '#eab0c4'].map(c => new THREE.Color(c));
  const mk = (list, geo, stretch = 1) => {
    const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.9 }), list.length);
    const d = new THREE.Object3D();
    list.forEach((c, k) => { d.position.set(c[0], c[1], c[2]); d.rotation.set(0, k * 1.7, 0); d.scale.set(c[3], c[3] * stretch, c[3]); d.updateMatrix(); im.setMatrixAt(k, d.matrix); im.setColorAt(k, pinks[k % 5]); });
    im.computeBoundingSphere(); scene.add(im); return im;
  };
  mk(clumps, new THREE.IcosahedronGeometry(1, 0));
  mk(strands, new THREE.IcosahedronGeometry(0.75, 0), 1.7); // stretched so the beads read as hanging strands
  // shimenawa rope round the trunk, with white paper zigzags
  const rope = add(new THREE.TorusGeometry(6.9, 0.6, 6, 22), M('#d9c38a'), TR.x, 6, TR.z); rope.rotation.x = Math.PI / 2;
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, sd = add(new THREE.PlaneGeometry(0.7, 2), M('#f4f1ea'), TR.x + Math.cos(a) * 7.2, 4.6, TR.z + Math.sin(a) * 7.2, -a + Math.PI / 2); sd.material.side = THREE.DoubleSide; }
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + 0.3, rr = 30 + rnd() * 10; lantern(DOME.x + Math.cos(a) * rr, DOME.cy + Math.sqrt(DOME.R * DOME.R - rr * rr) - 5, DOME.z + Math.sin(a) * rr, 2.2); }
}
// background: three mountain ranges across the lake, nearer = darker, further = paler, plus low mist
[[78, '#3d3660', 16, 22, 14], [118, '#57507c', 22, 34, 12], [165, '#7d6e98', 30, 50, 10]].forEach(([dist, col, hMin, hMax, n]) => {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rnd() * 0.3, h = hMin + rnd() * (hMax - hMin), rad = h * (0.9 + rnd() * 0.6);
    if (offMoon(a) < 0.32) continue; // no peak in front of the moon
    const m = add(new THREE.ConeGeometry(rad, h, 5 + (i % 3)), M(col), Math.cos(a) * dist, h / 2 - 1, Math.sin(a) * dist - 6, rnd());
    m.castShadow = m.receiveShadow = false;
  }
});
for (const [rr, y, op] of [[70, 2, 0.22], [100, 5, 0.18]]) {
  const mist = add(new THREE.CylinderGeometry(rr, rr, 6, 40, 1, true), new THREE.MeshBasicMaterial({ color: '#e7b39b', transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false }), 0, y, -6);
  mist.castShadow = false;
}
// lantern light: two warm point lights, along the street and on the hill
const pl1 = new THREE.PointLight('#ff9a4a', 30, 18, 1.6); pl1.position.set(0, 2.5, 6); scene.add(pl1);
const pl2 = new THREE.PointLight('#ff9a4a', 22, 14, 1.6); pl2.position.set(0, 7, -9); scene.add(pl2);
// reflections of the bridge lanterns: short streaks on the water
for (const [x, z] of [[-1.3, 13.4], [1.3, 13.2], [-1.3, 18.7], [1.3, 18.9]]) {
  const s = add(new THREE.PlaneGeometry(0.25, 1.4), new THREE.MeshBasicMaterial({ color: '#ff9a4a', transparent: true, opacity: 0.45 }), x, -0.23, z);
  s.rotation.x = -Math.PI / 2; s.castShadow = false;
}

// falling blossom petals
const PETALS = matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : 260;
const petalMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.14, 0.1), new THREE.MeshBasicMaterial({ color: '#f7c9d4', side: THREE.DoubleSide, transparent: true, opacity: 0.9 }), PETALS);
petalMesh.frustumCulled = false; scene.add(petalMesh);
const petals = [];
for (let i = 0; i < PETALS; i++) petals.push({ x: (rnd() - 0.5) * 40, y: rnd() * 14, z: (rnd() - 0.5) * 40 - 2, s: 0.4 + rnd() * 0.6, p: rnd() * 6 });
const dummy = new THREE.Object3D();

// camera: drag to orbit, scroll or pinch to zoom, drifts on its own when left alone
const view = { yaw: 0.45, pitch: 0.3, dist: 40, ty: 7, tz: -6 };
const goal = { ...view };
let idle = 0, dragging = false, lx = 0, ly = 0;
const pts = new Map();
let pinch0 = 0, dist0 = 0;
const title = document.getElementById('title');
function touched() { idle = 0; title.classList.add('dim'); }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); dragging = true; lx = e.clientX; ly = e.clientY; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = goal.dist; } touched(); });
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0 > 0) goal.dist = THREE.MathUtils.clamp(dist0 * pinch0 / d, 14, 42); return; }
  goal.yaw -= (e.clientX - lx) * 0.006; goal.pitch = THREE.MathUtils.clamp(goal.pitch + (e.clientY - ly) * 0.004, 0.08, 1.25);
  lx = e.clientX; ly = e.clientY; touched();
});
const up = e => { pts.delete(e.pointerId); if (!pts.size) dragging = false; pinch0 = 0; if (pts.size === 1) { const [a] = [...pts.values()]; lx = a[0]; ly = a[1]; } };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); goal.dist = THREE.MathUtils.clamp(goal.dist * (1 + Math.sign(e.deltaY) * 0.08), 14, 42); touched(); }, { passive: false });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') goal.yaw += 0.15; else if (e.key === 'ArrowRight') goal.yaw -= 0.15; else if (e.key === 'ArrowUp') goal.dist = Math.max(14, goal.dist - 3); else if (e.key === 'ArrowDown') goal.dist = Math.min(42, goal.dist + 3); else return; touched(); });

function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.85 ? 66 : 50;
  if (!fit.done) { goal.dist = view.dist = camera.aspect < 0.85 ? 42 : 40; fit.done = 1; } // phones start further back
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();

let last = 0, time = 0;
renderer.setAnimationLoop(ms => {
  const dt = Math.min(0.05, last ? (ms - last) / 1000 : 0.016); last = ms; time += dt; idle += dt;
  if (!dragging && idle > 4) goal.yaw += dt * 0.05;
  const k = 1 - Math.exp(-6 * dt);
  for (const key of ['yaw', 'pitch', 'dist']) view[key] += (goal[key] - view[key]) * k;
  camera.position.set(-3 + Math.sin(view.yaw) * Math.cos(view.pitch) * view.dist, view.ty + Math.sin(view.pitch) * view.dist, view.tz + Math.cos(view.yaw) * Math.cos(view.pitch) * view.dist);
  camera.lookAt(-3, view.ty, view.tz);
  for (let i = 0; i < PETALS; i++) {
    const p = petals[i];
    p.y -= dt * 0.6 * p.s; p.x += dt * (0.5 + Math.sin(time * 0.7 + p.p) * 0.4); p.z += Math.cos(time * 0.9 + p.p) * dt * 0.3;
    if (p.y < 0) { if (i % 2) { p.y = 12 + rnd() * 3; p.x = (rnd() - 0.5) * 40 - 8; p.z = (rnd() - 0.5) * 40 - 2; } else { p.y = 20 + rnd() * 14; p.x = (rnd() - 0.5) * 70; p.z = -6 + (rnd() - 0.5) * 70; } }
    dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(time * p.s * 2 + p.p, time * p.s + p.p, 0); dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
  const flick = 1 + Math.sin(time * 7.3) * 0.04 + Math.sin(time * 13.1) * 0.03;
  pl1.intensity = 30 * flick; pl2.intensity = 22 * flick;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
