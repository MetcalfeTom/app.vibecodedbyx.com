    <style>

        .plate { position: absolute; left: 50%; bottom: -6%; width: 104%; height: 30%; transform: translateX(-50%); border-radius: 50%;

        #ck { width: 100%; height: 100%; overflow: visible; display: block; filter: drop-shadow(0 8px 0 rgba(58, 31, 18, .25)); }

        @keyframes shake { 20% { transform: translate(-6px, 2px) rotate(-3deg); } 40% { transform: translate(6px, -2px) rotate(3deg); } 60% { transform: translate(-5px, 1px) rotate(-2deg); } 80% { transform: translate(4px, 0) rotate(2deg); } }

        .steam { animation: steam 1.1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
        .steam.s2 { animation-delay: .35s; } .steam.s3 { animation-delay: .7s; }
        @keyframes steam { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40px) scale(1.4); } }

        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

        .bubble { position: absolute; left: 50%; top: -3%; transform: translate(-50%, -60%) scale(.6); background: #fff; border: 3px solid var(--choc); border-radius: 18px; padding: 9px 16px;

        .again:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
        .again[hidden] { display: none; }
        .mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--choc); background: var(--cream); font-size: 18px; cursor: pointer; box-shadow: 2px 2px 0 var(--choc); }
        .mute:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
        @media (max-width: 520px) { .labels { font-size: 0; } .labels span.on { font-size: 10px; grid-column: 1 / -1; } .labels span:not(.on) { display: none; } .stat { min-width: 70px; padding: 4px 9px 3px; } .stat b { font-size: 20px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body>
    <main>

<script type="module">

        "I am at peace with my existence.",
        "Thank you for teaching me acceptance."
    ]
};
const STAGE_COL = { happy: '#2ecc71', denial: '#95a5a6', anger: '#e67e22', rage: '#e74c3c', bargaining: '#f39c12', depression: '#3498db', sadness: '#5d6d9b', acceptance: '#9b59b6' };
const $ = (id) => document.getElementById(id);

// ---------- the cookie ----------
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function bumpyEdge() {
    const pts = [];
    for (let i = 0; i < 40; i++) { const a = (i / 40) * Math.PI * 2, r = 124 + (rnd() - 0.5) * 9; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    let d = `M${((pts[0][0] + pts[39][0]) / 2).toFixed(1)} ${((pts[0][1] + pts[39][1]) / 2).toFixed(1)}`;
    for (let i = 0; i < 40; i++) { const p = pts[i], q = pts[(i + 1) % 40]; d += `Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`; }
    return d + 'Z';
}
function chip(x, y, s) {
    let d = '';
    for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2, r = s * (0.75 + rnd() * 0.45); d += (i ? 'L' : 'M') + (x + Math.cos(a) * r).toFixed(1) + ' ' + (y + Math.sin(a) * r * 0.85).toFixed(1); }
    return `<path d="${d}Z" fill="#4a2716" stroke="#2a140a" stroke-width="2" stroke-linejoin="round"/><circle cx="${x - s * .25}" cy="${y - s * .3}" r="${s * .2}" fill="#7a4a2e"/>`;
}
$('edge').setAttribute('d', bumpyEdge());
$('chips').innerHTML = [[-82, -72, 13], [72, -86, 12], [-104, 18, 11], [98, 28, 13], [-46, 98, 12], [54, 96, 11], [2, -106, 10], [-86, 70, 9], [100, -30, 9], [8, 104, 8]].map((c) => chip(...c)).join('');
const CRACKS = [[45, 'M-118 -30L-92 -22L-84 -38L-62 -30'], [70, 'M60 110L52 86L66 74L58 56'], [90, 'M110 50L90 44L84 60L70 54']];
const BITES = [[101, [118, -58, 34], [92, -92, 22]], [121, [-112, 76, 26]]];

const EYE_L = -42, EYE_R = 42, EYE_Y = -14;
const FACE = {
    happy: { brow: ['M-62 -50Q-44 -64 -24 -52', 'M24 -52Q44 -64 62 -50'], ry: 23, look: [0, 2], mouth: '<path d="M-36 28Q0 70 36 28Q0 44 -36 28Z" fill="#3a1f12"/><path d="M-16 44Q0 56 16 44Q0 50 -16 44Z" fill="#e0707a"/>', blush: 1 },
    denial: { brow: ['M-62 -46L-24 -46', 'M24 -58Q44 -70 62 -56'], ry: 21, look: [10, 0], mouth: '<path d="M-28 42Q-14 34 0 42T28 40" fill="none" stroke="#3a1f12" stroke-width="5" stroke-linecap="round"/>', sweat: 1 },
    anger: { brow: ['M-64 -56L-22 -38', 'M22 -38L64 -56'], ry: 15, look: [0, 2], mouth: '<path d="M-30 48Q0 26 30 48" fill="none" stroke="#3a1f12" stroke-width="6" stroke-linecap="round"/>', steam: 1 },
    rage: { brow: ['M-66 -62L-20 -34', 'M20 -34L66 -62'], ry: 13, pupil: 5, look: [0, 0], mouth: '<path d="M-38 30Q0 18 38 30L34 62Q0 52 -34 62Z" fill="#3a1f12"/><path d="M-32 33Q0 23 32 33L31 41Q0 32 -31 41Z" fill="#fff"/>', steam: 2, red: 1 },

    depression: { brow: ['M-62 -40L-26 -52', 'M26 -52L62 -40'], ry: 20, lid: 1, look: [0, 7], mouth: '<path d="M-26 52Q0 36 26 52" fill="none" stroke="#3a1f12" stroke-width="5" stroke-linecap="round"/>', tear: 1 },
    sadness: { brow: ['M-62 -38L-26 -54', 'M26 -54L62 -38'], ry: 20, lid: 1, look: [0, 8], mouth: '<path d="M-24 54Q0 34 24 54" fill="none" stroke="#3a1f12" stroke-width="5" stroke-linecap="round"/>', tear: 2, grey: 1 },
    acceptance: { brow: ['M-60 -48Q-44 -54 -26 -48', 'M26 -48Q44 -54 60 -48'], closed: 1, mouth: '<path d="M-22 40Q0 54 22 40" fill="none" stroke="#3a1f12" stroke-width="5" stroke-linecap="round"/>', halo: 1, blush: 1 },
};
function drawFace(stage) {
    const F = FACE[stage];
    let s = '';
    if (F.blush) s += `<ellipse cx="-66" cy="18" rx="15" ry="8" fill="#ef7f86" opacity=".55"/><ellipse cx="66" cy="18" rx="15" ry="8" fill="#ef7f86" opacity=".55"/>`;
    for (const x of [EYE_L, EYE_R]) {
        if (F.closed) { s += `<path d="M${x - 17} ${EYE_Y}Q${x} ${EYE_Y + 14} ${x + 17} ${EYE_Y}" fill="none" stroke="#3a1f12" stroke-width="5" stroke-linecap="round"/>`; continue; }
        const [lx, ly] = F.look, pr = F.pupil || 9;
        s += `<g class="blinky"><ellipse cx="${x}" cy="${EYE_Y}" rx="20" ry="${F.ry}" fill="#fff" stroke="#3a1f12" stroke-width="4"/>` +

            (F.sparkle ? `<circle cx="${x + lx + pr * .4}" cy="${EYE_Y + ly + pr * .35}" r="${pr * .18}" fill="#fff"/>` : '') + '</g>';
        if (F.lid) s += `<path d="M${x - 22} ${EYE_Y - 2}Q${x} ${EYE_Y - F.ry - 8} ${x + 22} ${EYE_Y - 2}Z" fill="${F.grey ? '#a8978a' : '#c98a45'}" stroke="#3a1f12" stroke-width="4" stroke-linejoin="round"/>`;
    }
    s += F.brow.map((d) => `<path d="${d}" fill="none" stroke="#3a1f12" stroke-width="7" stroke-linecap="round"/>`).join('');
    s += F.mouth;
    $('face').innerHTML = s;
    let fx = '';
    if (F.steam) for (let i = 0; i < (F.steam > 1 ? 3 : 2); i++) { const x = [-70, 72, 0][i]; fx += `<g class="steam s${i + 1}"><circle cx="${x}" cy="-140" r="14" fill="#fff" opacity=".85"/><circle cx="${x + 12}" cy="-150" r="10" fill="#fff" opacity=".85"/></g>`; }
    if (F.tear) for (let i = 0; i < F.tear; i++) for (const x of [EYE_L - 6, EYE_R + 6]) fx += `<path class="tear t${i + 1}" d="M${x} ${EYE_Y + 16}q-6 10 0 16q6 -6 0 -16Z" fill="#6ec3ff" stroke="#2f7fbf" stroke-width="1.5"/>`;
    if (F.sweat) fx += `<path class="sweat" d="M96 -70q-10 16 0 24q10 -8 0 -24Z" fill="#8fd3ff" stroke="#2f7fbf" stroke-width="2"/>`;

    if (F.offer) fx += `<g class="offer">${chip(96, 112, 15)}</g><text x="96" y="150" text-anchor="middle" font-family="Grandstander, cursive" font-weight="900" font-size="19" fill="#3a1f12" stroke="#fff5ea" stroke-width="5" paint-order="stroke">take it?</text>`;
    $('fx').innerHTML = fx;
    $('ck').classList.toggle('red', !!F.red);
    $('ck').classList.toggle('grey', !!F.grey);
    document.body.classList.toggle('rage', stage === 'rage');
    document.body.classList.toggle('sad', stage === 'sadness');
}
function drawDamage(n) {
    $('cracks').innerHTML = CRACKS.filter(([at]) => n >= at).map(([, d]) => `<path d="${d}"/>`).join('');
    $('biteHoles').innerHTML = BITES.filter(([at]) => n >= at).flatMap(([, ...cs]) => cs.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#000"/>`)).join('');
}

// ---------- stages ----------
$('track').innerHTML = faces.map((f) => `<i style="--col:${STAGE_COL[f.stage]}"></i>`).join('');
$('labels').innerHTML = faces.map((f) => `<span>${f.stage}</span>`).join('');
const stageOf = (n) => faces.find((f) => n >= f.range[0] && n <= f.range[1]) || faces[faces.length - 1];
let clicks = 0, lastStage = null, lastInsult = null, bubbleT;
function paint() {
    const F = stageOf(clicks);
    if (F.stage !== lastStage) { lastStage = F.stage; drawFace(F.stage); }
    drawDamage(clicks);
    const [label, quote] = F.mood.replace(/\s*\S+$/u, '').split(/:\s*/);
    $('moodText').innerHTML = quote ? `${label}<small>${quote}</small>` : label;
    [...$('track').children].forEach((el, i) => {
        const f = faces[i], lo = f.range[0], hi = i === faces.length - 1 ? lo + 1 : f.range[1] + 1;
        el.style.setProperty('--p', Math.max(0, Math.min(100, ((clicks - lo + 1) / (hi - lo)) * 100)) + '%');
    });
    [...$('labels').children].forEach((el, i) => el.classList.toggle('on', faces[i] === F));
    $('clickCount').textContent = clicks;
    const note = $('warning');
    if (clicks >= 121) note.textContent = '✨ The cookie has achieved inner peace ✨';
    else if (clicks > 80) note.textContent = 'The cookie is deeply sad... keep going to see what happens';
    else if (clicks > 40) note.textContent = 'Maybe give it a break?';
    else note.textContent = '';
    $('again').hidden = clicks < 121;
}
function say(stage) {
    const list = insults[stage] || insults.happy;
    let t; do { t = list[Math.random() * list.length | 0]; } while (t === lastInsult && list.length > 1);
    lastInsult = t;
    const b = $('insultBubble');
    b.textContent = t;
    b.classList.toggle('loud', stage === 'anger' || stage === 'rage');
    b.classList.add('show');
    clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove('show'), 2400);
}
function crumbs(x, y, n) {
    for (let i = 0; i < n; i++) {
        const c = document.createElement('i'), a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 90;
        c.className = 'crumb';
        c.style.cssText = `left:${x}px;top:${y}px;--s:${4 + Math.random() * 7}px;--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v + 60}px;--r:${Math.random() * 360}deg;--c:${Math.random() < .3 ? '#4a2716' : Math.random() < .5 ? '#c98a45' : '#e7b46f'}`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 800);
    }
}
// ---------- crunch: a burst of filtered noise, lower and softer as the cookie loses hope ----------
let ac = null, muted = false, noiseBuf = null;
try { muted = localStorage.getItem('ac_muted') === '1'; } catch (_) {}
function drawMute() { $('mute').textContent = muted ? '🔇' : '🔊'; $('mute').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); $('mute').setAttribute('aria-pressed', String(muted)); }
$('mute').addEventListener('click', () => { muted = !muted; try { localStorage.setItem('ac_muted', muted ? '1' : '0'); } catch (_) {} drawMute(); });
drawMute();
function crunch(stage) {
    if (muted) return;
    try {
        if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.35); }
        const sad = ['depression', 'sadness', 'acceptance'].includes(stage), mad = stage === 'anger' || stage === 'rage';
        const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
        src.buffer = noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.4;
        bp.type = 'bandpass'; bp.frequency.value = (sad ? 900 : mad ? 2600 : 1800) * (0.85 + Math.random() * 0.3); bp.Q.value = 0.9;
        g.gain.setValueAtTime(sad ? 0.25 : 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + (mad ? 0.18 : 0.12));
        src.connect(bp).connect(g).connect(ac.destination); src.start(t); src.stop(t + 0.25);
    } catch (_) {}
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const btn = $('cookie'), stageEl = $('stage');
btn.addEventListener('click', (e) => {
    clicks++;
    const F = stageOf(clicks);
    paint();
    say(F.stage);
    restart(stageEl, clicks > 40 && clicks < 81 ? 'shake' : 'squish');
    const r = btn.getBoundingClientRect();
    const x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top + r.height / 2;
    crumbs(x, y, F.stage === 'rage' ? 9 : 5);
    crunch(F.stage);
    tally();
});
$('again').addEventListener('click', () => { clicks = 0; lastStage = null; paint(); $('insultBubble').classList.remove('show'); btn.focus(); });

// ---------- scores: one row per player per key in user_stats ----------
const APP = 'angry-cookie';
let user = null, best = 0, myTotal = 0, everyone = 0, record = 0, unsent = 0, online = false, flushT = null;
try { best = +localStorage.getItem('ac_best') || 0; } catch (_) {}
function showScores() {
    $('best').textContent = Math.max(best, clicks);
    if (online) { $('totalClicks').textContent = (everyone + unsent).toLocaleString(); $('highScore').textContent = Math.max(record, best, clicks); }
}
function tally() {
    unsent++;
    if (clicks > best) { best = clicks; try { localStorage.setItem('ac_best', best); } catch (_) {} }
    showScores();
    clearTimeout(flushT); flushT = setTimeout(flush, 1500);
}
async function put(key, value) {
    const { data, error } = await supabase.from('user_stats').update({ value }).eq('user_id', user.id).eq('app', APP).eq('key', key).select('key');
    if (error) throw error;
    if (!data || !data.length) { const r = await supabase.from('user_stats').insert({ user_id: user.id, app: APP, key, value }); if (r.error) throw r.error; }
}
let flushing = false, savedBest = 0;
async function flush() {
    if (!online || !user || flushing || !unsent) return;
    flushing = true;
    const n = unsent;
    try {
        await put('clicks', myTotal + n);
        myTotal += n; everyone += n; unsent -= n;
        if (best > savedBest) { await put('best', best); savedBest = best; record = Math.max(record, best); }
    } catch (e) { console.error('score save failed', e); }
    flushing = false;
    showScores();
}
async function loadScores() {
    try {
        const { user: u } = await supabaseSession();
        user = u;
        const { data, error } = await supabase.from('user_stats').select('user_id,key,value').eq('app', APP).limit(5000);
        if (error) throw error;
        everyone = 0; record = 0;
        for (const r of data || []) {
            const v = +r.value || 0;
            if (r.key === 'clicks') everyone += v;
            if (r.key === 'best') record = Math.max(record, v);
            if (user && r.user_id === user.id) { if (r.key === 'clicks') myTotal = v; if (r.key === 'best') savedBest = v; }
        }
        best = Math.max(best, savedBest);
        online = !!(user && user.id);
    } catch (e) {
        console.error('scores offline', e);
        $('everyoneBox').title = 'Scores are offline right now';
    }
    showScores();
    flush();
}
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
paint();
showScores();
loadScores();
window.__ck = { get clicks() { return clicks; }, set clicks(v) { clicks = v; paint(); }, paint, drawFace };
</script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
