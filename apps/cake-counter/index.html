<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cake Counter — bake the cake each customer describes</title>
<meta name="description" content="Customers walk up and describe their dream cake. Stack the layers, pick the frosting, add the cherry, and serve it before they lose patience.">
<meta name="theme-color" content="#3a2418">
<meta property="og:type" content="website">
<meta property="og:title" content="Cake Counter">
<meta property="og:description" content="Customers describe their dream cake. Bake it before they lose patience.">
<meta property="og:url" content="https://sloppy.live/cake-counter/">
<meta property="og:image" content="https://sloppy.live/cake-counter/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://sloppy.live/cake-counter/">
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%8E%82">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,900;1,9..144,300&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2418;--cream:#fff6ea;--paper:#fbe9d4;--rasp:#c2255c;--rasp2:#e0527f;--pist:#8fb573;--butter:#ffd166;--sky:#8ecae6;--wood:#b9794a;--muted:#7a5a48}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;background:var(--paper);overflow-x:hidden;
  background-image:repeating-linear-gradient(90deg,var(--rasp) 0 2.2rem,var(--cream) 2.2rem 4.4rem);background-size:100% 3.2rem;background-repeat:no-repeat}
.wrap{max-width:68rem;margin:0 auto;padding:3.6rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.awning{position:absolute;left:0;right:0;top:3.2rem;height:.9rem;background:radial-gradient(circle at 50% 0,var(--rasp) 0 .55rem,transparent .6rem) 0 0/2.2rem .9rem repeat-x,radial-gradient(circle at 50% 0,var(--cream) 0 .55rem,transparent .6rem) 1.1rem 0/2.2rem .9rem repeat-x;pointer-events:none}
header{display:flex;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap;margin:.6rem 0 .8rem}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0;letter-spacing:-.02em;color:var(--rasp)}
h1 span{font-weight:300;font-style:italic;color:var(--ink)}
.hud{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:.2rem .7rem;min-height:2rem}
.chip b{font-size:.95rem}
.chip.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
.shop{position:relative;border:3px solid var(--ink);border-radius:1.2rem;overflow:hidden;background:linear-gradient(180deg,#f9dec3,#f0c7a3);box-shadow:5px 5px 0 var(--ink);aspect-ratio:5/4}
.shop::before{content:"";position:absolute;inset:0 0 38% 0;background:repeating-linear-gradient(90deg,transparent 0 3.6rem,rgba(58,36,24,.06) 3.6rem 3.7rem)}
.scene{position:absolute;inset:0}
.scene::before{content:"";position:absolute;inset:0 0 30% 0;pointer-events:none;background:linear-gradient(112deg,transparent 30%,rgba(255,244,214,.42) 44%,rgba(255,244,214,.18) 58%,transparent 70%),radial-gradient(120% 90% at 85% 0%,rgba(255,236,196,.5),transparent 60%)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 110% at 55% 35%,transparent 55%,rgba(58,36,24,.2))}
.counter::before{content:"";position:absolute;left:0;right:0;top:.7rem;height:1.4rem;z-index:1;background:linear-gradient(180deg,rgba(58,36,24,.38),transparent)}
.counter{box-shadow:inset 0 2px 0 rgba(255,226,190,.35)}
.counter{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,#8a4f2c 0 .7rem,#c68a5c .7rem,#b9794a 60%,#a86a3f);border-top:3px solid var(--ink)}
.counter::after{content:"";position:absolute;inset:.7rem 0 0;background:repeating-linear-gradient(90deg,transparent 0 4rem,rgba(58,36,24,.12) 4rem 4.15rem)}
#who{position:absolute;left:3%;bottom:30%;width:36%;height:62%;overflow:visible;transition:transform .75s cubic-bezier(.3,1.25,.5,1),opacity .45s}
#who.away{transform:translateX(-150%);opacity:0}
#who.leave{transform:translateX(-150%);opacity:0;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .6s .2s}
#who.snap,#cake.snap{transition:none}
#who .body{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
#who.hop .body{animation:hop .5s ease-in-out 2}
#who.shake .body{animation:shake .12s linear 5}
#who .eye{animation:blink 4.3s infinite;transform-box:fill-box;transform-origin:center}
#who .led{animation:led 1.1s steps(2) infinite}
#who .fh{animation:fh 1.5s ease-out infinite;transform-box:fill-box}
#who .fh+.fh{animation-delay:.6s}
.bubble{position:absolute;z-index:2;left:38%;right:3%;top:5%;background:#fff;border:2.5px solid var(--ink);border-radius:1rem;padding:.6rem .8rem;font-size:.88rem;line-height:1.45;box-shadow:3px 3px 0 var(--ink);min-height:4rem;transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1);transform-origin:0 30%}
.bubble.hide{opacity:0;transform:scale(.88)}
.bubble.long{font-size:.8rem}
.bubble::before{content:"";position:absolute;left:-.8rem;top:1.6rem;border:.45rem solid transparent;border-right:.8rem solid var(--ink);border-left-width:0}
.bubble b{color:var(--rasp);font-weight:700}
.nm{font-size:.64rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.15rem}
.emo{font-size:1.35em;vertical-align:-.12em}
.miss{display:block;margin-top:.35rem;font-size:.72rem;color:var(--muted)}
.bubble .meta{display:flex;justify-content:space-between;align-items:center;margin-top:.45rem;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bubble.done .meta{display:none}
.pat{flex:1;max-width:9rem;height:.55rem;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-left:.6rem}
.pat i{display:block;height:100%;width:100%;background:var(--pist);transition:background .5s}
.pat i.lo{animation:throb .6s ease-in-out infinite}
#cake{position:absolute;left:36%;width:60%;bottom:6%;height:58%;overflow:visible;transition:transform .75s cubic-bezier(.5,0,.8,.4),opacity .6s .15s}
#cake.taken{transform:translateX(-70%);opacity:0}
#cake .flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.tray{background:var(--cream);border:3px solid var(--ink);border-radius:1.2rem;box-shadow:5px 5px 0 var(--ink);padding:.8rem}
.tabs{display:flex;gap:.3rem;margin-bottom:.7rem;flex-wrap:wrap}
.tabs button{flex:1 1 auto;font:inherit;font-size:.78rem;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:.7rem;min-height:2.75rem;padding:0 .5rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:.45rem;min-height:9.6rem;align-content:start}
.opt{font:inherit;font-size:.74rem;line-height:1.15;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:.8rem;min-height:4.4rem;min-width:0;padding:.35rem .2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-align:center;overflow-wrap:anywhere;hyphens:manual}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt[aria-pressed="true"]{background:var(--butter)}
.opt:disabled{opacity:.4;cursor:default;box-shadow:none}
.opt svg{width:2rem;height:1.6rem;flex:none}
.acts{display:flex;gap:.5rem;margin-top:.8rem}
.btn{font:inherit;font-size:.85rem;font-weight:700;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:999px;min-height:2.9rem;padding:0 1rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.serve{flex:1;background:var(--rasp);color:#fff;font-family:Fraunces,Georgia,serif;font-size:1.15rem;font-weight:900;letter-spacing:.02em}
.btn.xl{flex:0 1 auto;min-height:3.4rem;padding:0 1.8rem;font-size:1.3rem}
.btn:disabled{opacity:.45;cursor:default}
.pop{position:absolute;z-index:3;left:50%;top:52%;transform:translate(-50%,-50%);font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(1.4rem,4vw,2.2rem);color:var(--rasp);text-shadow:2px 2px 0 #fff,4px 4px 0 var(--ink);pointer-events:none;white-space:nowrap;opacity:0;text-align:center;line-height:1.05}
.pop small{display:block;margin-top:.3rem;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.5em;font-weight:700;letter-spacing:.06em;color:var(--ink);text-shadow:1px 1px 0 #fff}
.pop.on{animation:popup 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
.pop.on.res{animation-duration:2.5s}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(58,36,24,.55);padding:1rem;overflow-y:auto}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:1.3rem;box-shadow:6px 6px 0 var(--ink);padding:1.3rem 1.4rem;max-width:26rem;width:100%;text-align:center;animation:rise .45s cubic-bezier(.2,1.4,.4,1) both}
.card h2{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:2rem;margin:0 0 .3rem;color:var(--rasp);line-height:1.05}
.card p{margin:.45rem 0;font-size:.86rem;line-height:1.5}
.card .big{font-family:Fraunces,Georgia,serif;font-size:2.6rem;font-weight:900;margin:.2rem 0;line-height:1.1}
.card .row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.card .row+.row{margin-top:.6rem}
.card ul{list-style:none;padding:0;margin:.6rem 0;text-align:left;font-size:.8rem}
.card li{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px dashed rgba(58,36,24,.3);padding:.25rem 0}
.card li span:last-child{white-space:nowrap}
.card .hero{display:block;width:12rem;max-width:70%;height:auto;aspect-ratio:200/140;margin:-.3rem auto .3rem}
.card .sub{font-size:.74rem;color:var(--muted)}
.card .review{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:1.1rem;line-height:1.35;margin-top:.9rem}
.card .new{color:var(--rasp)}
.stars{color:#d38b12;letter-spacing:.08em}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem;font-size:.7rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--rasp);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(1rem) scale(.96)}}
@keyframes bob{50%{transform:translateY(-.25rem)}}
@keyframes hop{50%{transform:translateY(-1rem)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes led{50%{opacity:.35}}
@keyframes fh{from{transform:translateY(4px);opacity:0}30%{opacity:1}to{transform:translateY(-12px);opacity:0}}
@keyframes flick{to{transform:scale(.82,1.14)}}
@keyframes throb{50%{opacity:.45}}
@keyframes bump{40%{transform:scale(1.18)}}
@media (min-width:821px){
  .tray{align-self:stretch;display:flex;flex-direction:column}
  .opts{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(5.4rem,auto);min-height:11.3rem;gap:.55rem}
  .opt{font-size:.78rem;gap:.35rem}.opt svg{width:2.6rem;height:2.1rem}
  .tray .sum{margin-top:auto}
}
.sum{font-size:.74rem;line-height:1.45;color:var(--muted);margin:.8rem 0 0;padding:.5rem .7rem;border:2px dashed rgba(58,36,24,.35);border-radius:.7rem;min-height:2.6rem}
.sum b{color:var(--ink)}
@media (max-width:820px){
  .sum{display:none}
  .wrap{padding-top:3.4rem}
  header{margin:.45rem 0 .6rem;gap:.3rem .8rem}
  h1{font-size:1.8rem}
  .hud{font-size:.72rem;gap:.35rem}
  .chip{padding:.1rem .55rem;min-height:1.8rem}
  .game{grid-template-columns:minmax(0,1fr);gap:.8rem}
  .shop{aspect-ratio:auto;display:flex;flex-direction:column}
  .shop::before{inset:0}
  .bubble,.bubble.long{position:relative;left:auto;right:auto;top:auto;margin:.6rem .6rem 0;font-size:.8rem;padding:.5rem .65rem;min-height:7.8rem;transform-origin:15% 100%}
  .bubble.long{font-size:.75rem}
  .bubble::before{left:3.4rem;top:auto;bottom:-.85rem;border:.45rem solid transparent;border-top:.8rem solid var(--ink);border-bottom-width:0}
  .scene{position:relative;inset:auto;height:clamp(12rem,29vh,16rem)}
  #who{left:3%;bottom:22%;width:34%;height:82%}
  .counter{height:32%}
  #cake{left:36%;width:61%;bottom:5%;height:86%}
  .tray{padding:.65rem}
  .tabs{margin-bottom:.55rem}
  .opts{grid-template-columns:repeat(4,minmax(0,1fr));min-height:8.45rem;gap:.4rem}
  .opt{min-height:4rem;font-size:.68rem}
  .acts{margin-top:.65rem}
}
@media (max-width:360px){.hud .lbl{display:none}}
@media (min-width:821px) and (max-width:1100px){.bubble{font-size:.8rem}.bubble.long{font-size:.74rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pop.on{opacity:1}}
/* v1.1: streak chip, order tags, the usual, shop upgrades */
.chip.streak{background:var(--butter)}
.bubble[data-tag]::after{content:attr(data-tag);position:absolute;top:-.95rem;right:.9rem;background:var(--rasp);color:#fff;border:2px solid var(--ink);border-radius:.45rem;padding:.05rem .5rem;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transform:rotate(2deg);box-shadow:2px 2px 0 var(--ink)}
.bubble[data-kind="vip"]{border-color:#1f1a1c;background:linear-gradient(#fff,#fff8e4)}
.bubble[data-kind="vip"]::after{background:#1f1a1c;color:var(--butter)}
.bubble[data-kind="usual"]::after{background:var(--pist);color:var(--ink)}
.remind{font:inherit;font-size:.72rem;font-weight:700;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:999px;min-height:2.2rem;padding:0 .7rem;margin-left:.3rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.remind:active{transform:translate(2px,2px);box-shadow:none}
.card .ups{margin:.9rem 0 .2rem;text-align:left}
.card .ups h3{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:1rem;margin:0 0 .35rem}
.card .ups li{align-items:center}
.card .ups small{display:block;color:var(--muted);font-size:.7rem}
.card .ups .btn{min-height:2.4rem;font-size:.75rem;padding:0 .8rem}
.card .ups .own{font-weight:700;color:var(--pist)}
.card .usual{background:var(--cream);border:2px dashed var(--ink);border-radius:.7rem;padding:.4rem .6rem}
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<div class="wrap" id="wrap">
<header>
  <h1>Cake <span>Counter</span></h1>
  <div class="hud" aria-label="Shop status">
    <span class="chip">Day <b id="day">1</b></span>
    <span class="chip"><span class="lbl">Customer</span> <b id="cust">1</b>/5</span>
    <span class="chip"><span aria-hidden="true">🪙</span><b id="coins">0</b><span class="sr"> coins</span></span>
    <span class="chip streak" id="stk" hidden><span aria-hidden="true">🔥</span><b id="streak">×2</b><span class="sr"> perfect cakes in a row</span></span>
  </div>
</header>
<main class="game">
  <section class="shop" aria-label="The shop counter">
    <div class="bubble hide" id="bubble" aria-live="polite">
      <div class="nm" id="nm"></div>
      <div id="order">Opening the shop…</div>
      <div class="meta"><span id="mood">patience</span><span class="pat" aria-hidden="true"><i id="pat"></i></span></div>
    </div>
    <div class="scene">
      <svg id="who" class="away" viewBox="0 0 120 170" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
      <div class="counter" aria-hidden="true"></div>
      <svg id="cake" viewBox="0 0 200 170" preserveAspectRatio="xMidYMax meet" role="img" aria-label="An empty cake stand"></svg>
      <div class="pop" id="pop" aria-hidden="true"></div>
    </div>
  </section>
  <section class="tray" aria-label="Build the cake">
    <div class="tabs" role="tablist" aria-label="Cake parts" id="tabs"></div>
    <div class="opts" id="opts" role="tabpanel"></div>
    <p class="sum" id="sum" aria-hidden="true"></p>
    <div class="acts">
      <button type="button" class="btn" id="undo">↶ Undo</button>
      <button type="button" class="btn" id="bin" aria-label="Start this cake over">🗑</button>
      <button type="button" class="btn serve" id="serve" disabled>Serve 🔔</button>
    </div>
  </section>
</main>
<footer><span>Read the order, build the cake, hit Serve. Keys: 1–4 switch tabs, Backspace undoes, Enter serves.</span><span id="buildstamp" role="note" aria-label="Build information">build v1.2 · 2026-09-28 · dev</span></footer>
</div>
<div class="panel" id="panel" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="card"></div></div>
<div class="sr" aria-live="polite" id="live"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var NS='http://www.w3.org/2000/svg',INK='#3a2418';
/* ---------- the pantry ---------- */
var FLAV={vanilla:{n:'vanilla',c:'#f4dca2'},choc:{n:'chocolate',c:'#6b3e26'},straw:{n:'strawberry',c:'#f3a3b9'},matcha:{n:'matcha',c:'#a8c77c'},velvet:{n:'red velvet',c:'#a8323e'},lemon:{n:'lemon',c:'#f7e37a'}};
var FROST={white:{n:'white',c:'#fdf8f0'},pink:{n:'pink',c:'#f7b3c7'},blue:{n:'blue',c:'#a9d3f0'},mint:{n:'mint',c:'#bfe7cf'},lav:{n:'lavender',c:'#cfb8ec'},choc:{n:'chocolate',c:'#5b3223'},yellow:{n:'yellow',c:'#fde28e'}};
var DRIP={none:{n:'no drip',c:null},choc:{n:'chocolate drip',c:'#3b2014'},caramel:{n:'caramel drip',c:'#c47a2c'},berry:{n:'berry drip',c:'#a8244c'}};
var TOPS={sprinkles:{n:'sprinkles'},cherry:{n:'a cherry'},straws:{n:'strawberries'},blue:{n:'blueberries'},flower:{n:'a sugar flower'},stars:{n:'gold stars'},candles:{n:'candles'}};
var TLAB={sprinkles:'sprinkles',cherry:'cherry',straws:'straw&shy;berries',blue:'blue&shy;berries',flower:'sugar flower',stars:'gold stars'};
function blank(){return {layers:[],frost:null,drip:'none',tops:{},candles:0};}
var cake=blank(),hist=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function chance(p){return Math.random()<p;}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* ---------- drawing the cake (3/4 view, naked sides so the layers show) ---------- */
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function shade(h,f){var n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function m(v){return Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));}return 'rgb('+m(r)+','+m(g)+','+m(b)+')';}
function rng(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
var CX=100,RX=62,RY=17,LH=26;
var GU=0;
function grad(defs,id,type,at,stops){at.id=id;var q=el(type,at,defs);stops.forEach(function(s){el('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]==null?1:s[2]},q);});return 'url(#'+id+')';}

  if(k==='rush'&&c===2)later(260,function(){popUp('Rush hour!','double coins · less patience');sfx.bell();});
  if(k==='vip')later(260,function(){popUp('VIP!','the food critic, in person');});
  var tok=G.tok=(G.tok||0)+1;later(750,function(){if(G.phase!=='arrive'||tok!==G.tok)return;$('nm').textContent=ch.name;$('order').innerHTML=k==='usual'?usualHTML():G.req.html;b.classList.toggle('long',k!=='usual'&&G.req.text.length>175);b.classList.remove('hide');
    G.phase='wait';$('serve').disabled=false;moodUI(true);});}
function usualHTML(){return '<span class="emo" aria-hidden="true">☕</span> “Good to see you again. <b>The usual</b>, please.” <button type="button" class="remind" id="remind">Remind me?</button>';}
$('order').addEventListener('click',function(e){if(!e.target.closest('#remind')||G.phase!=='wait'||G.kind!=='usual'||G.remind)return;G.remind=true;G.pat=Math.max(.08,G.pat-.3);moodUI();sfx.huff();
  $('order').innerHTML='<span class="emo" aria-hidden="true">🙄</span> “You forgot? Fine: ”'+G.req.html;$('bubble').classList.toggle('long',G.req.text.length>150);say(G.ch.name+' repeats the order: '+G.req.text);});
var MOODT={happy:'happy',ok:'waiting',impatient:'tapping foot…',angry:'fuming!'};
function moodUI(force){var p=Math.max(0,G.pat),i=$('pat');i.style.width=(p*100).toFixed(1)+'%';i.style.background=p>.5?'var(--pist)':p>.25?'var(--butter)':'var(--rasp)';i.classList.toggle('lo',p<=.25);
  var m=p>.6?'happy':p>.35?'ok':p>.15?'impatient':'angry';
  if(m!==G.mood||force){G.mood=m;if(G.phase==='wait')drawWho(G.ch,m);}
  var mt=$('mood');if(Date.now()>toastUntil&&mt.textContent!==MOODT[m])mt.textContent=MOODT[m];}
var lastT=0;
function loop(t){var dt=lastT?Math.min(.1,(t-lastT)/1000):0;lastT=t;
  if(G.phase==='wait'&&!G.freeze&&$('panel').hidden&&G.grace>0){G.grace-=dt*G.speed;if(Date.now()>toastUntil)$('mood').textContent=G.grace>0?'humming along ♪':MOODT[G.mood];}
  else if(G.phase==='wait'&&!G.freeze&&$('panel').hidden){G.pat-=dt*G.speed/G.dur;if(G.pat<=0){G.pat=0;moodUI();walkOff();}else moodUI();}
  requestAnimationFrame(loop);}
var WORDS=["That's not my cake",'Hmm…','Close!','PERFECT!'],EMO=['😠','😐','😊','😍'],REACT=['mad','meh','pleased','love'];
var LINES=[["That's not my cake.","I'm speechless. Not in a good way.",'Is this a prank?'],["Hmm. That's… a cake.",'Did you hear me at all?','Bold choices.'],["So close! I'll take it.",'Nearly! Tasty though.','Not quite, but lovely.'],['This is EXACTLY it!','You read my mind!',"I could cry. It's perfect."]];
var WALK=["Forget it! I'm going elsewhere.","I've been waiting for AGES!",'Too slow! Hmph.'];
function serve(){if(G.phase!=='wait')return;if(!cake.layers.length){flash('Add a layer first!');sfx.huff();return;}
  var R=grade(G.req,cake);R.tip=R.acc>=.75?Math.round(G.pat*6*(G.up.jar?1.5:1)):0;R.gain=Math.round(10*R.acc)+R.tip;R.bon=[];
  if(G.kind==='rush'||G.kind==='vip'){R.gain*=2;R.bon.push(G.kind==='rush'?'rush ×2':'VIP ×2');}
  if(G.kind==='vip'&&R.stars===3){R.gain+=15;R.bon.push('rave +15');}
  if(G.kind==='usual'&&R.stars===3&&!G.remind){R.gain+=8;R.bon.push('remembered +8');}
  if(R.stars===3){G.streak++;var sb=G.streak>=2?Math.min(10,(G.streak-1)*2):0;if(sb){R.gain+=sb;R.bon.push('streak ×'+G.streak+' +'+sb);}}else G.streak=0;
  finish(R);}
function walkOff(){if(G.phase!=='wait')return;G.streak=0;finish({acc:0,stars:0,gain:0,tip:0,miss:[],list:[],walk:true});}
function finish(R){G.phase='react';G.last=R;$('serve').disabled=true;var ch=G.ch,st=R.stars,w=$('who');
  drawWho(ch,R.walk?'mad':REACT[st]);w.classList.remove('hop','shake');void w.getBoundingClientRect();w.classList.add(!R.walk&&st>=2?'hop':'shake');
  var line=R.walk?pick(WALK):(st===3&&chance(.5)?ch.love:st===0&&chance(.5)?ch.mad:pick(LINES[st]));
  var extra=(R.walk?'Walked out. No coins.':st===3?'All '+R.list.length+' wishes granted'+(R.tip?' · tip +'+R.tip:'')+'.':'Missed: '+R.miss.join(', ')+'.')+(R.bon&&R.bon.length?' '+R.bon.join(' · ')+'.':'');
  $('order').innerHTML='<span class="emo" aria-hidden="true">'+(R.walk?'😤':EMO[st])+'</span> '+esc(line)+'<span class="miss">'+esc(extra)+'</span>';
  var b=$('bubble');b.classList.add('done');b.classList.remove('long','hide');
  popUp(R.walk?'Too slow!':WORDS[st],'★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st)+' +'+R.gain+' 🪙');
  if(R.walk||st===0)sfx.huff();else if(st===1)sfx.coin(2);else{sfx.ding();later(260,function(){sfx.coin(Math.ceil(R.gain/3));});}
  G.coins+=R.gain;G.today.coins+=R.gain;G.today.stars+=st;G.today.log.push({n:ch.name,i:ch.id,k:G.kind,s:st,g:R.gain,w:!!R.walk});G.cust++;
  if(!R.walk&&G.kind!=='vip'&&G.kind!=='usual'){var q=JSON.parse(JSON.stringify(G.req));G.book[ch.id]={req:q,day:G.day};}
  save();hud();countUp(G.coins);
  say(R.walk?ch.name+' walked out.':st+' of 3 stars, plus '+R.gain+' coins.');
  if(!G.hold)later(2700,leave);}
function leave(){if(G.phase!=='react')return;G.phase='leave';var served=G.last&&!G.last.walk,w=$('who');$('bubble').classList.add('hide');
  w.classList.remove('hop','shake');w.classList.add('leave');if(served)$('cake').classList.add('taken');
  later(900,function(){if(G.phase!=='leave')return;if(G.cust>=5)endDay();else nextCustomer();});}
var REVIEWS=[{s:1,q:['I asked for a cake and received a situation.',"The bell rang. I wish it hadn't."]},{s:2,q:['Ambitious. Confusing. Sticky.','Some of the cakes were cakes.']},{s:3,q:['Solid work. One cake winked at me.','Good, not great. Like a Tuesday.']},{s:4,q:['Delightful. Mostly listens to its customers.','I left humming. And sticky.']},{s:5,q:['I have tasted heaven and it had layers.','Flawless. I ate my notes.']}];
var EOD=null;
function endDay(){G.phase='eod';resetCake();$('bubble').classList.add('hide');$('who').classList.add('snap','away');
  var D=G.today,b=lsGet('cake.best'),isNew=D.coins>0&&(!b||D.coins>(b.coins|0));
  if(isNew)lsSet('cake.best',{coins:D.coins,day:G.day});
  var fr=D.stars/15,ri=fr>=.9?4:fr>=.7?3:fr>=.5?2:fr>=.3?1:0,vip=D.log.filter(function(x){return x.k==='vip';})[0];
  if(vip)ri=vip.s===3?Math.max(ri,3):vip.s<2||vip.w?Math.min(ri,1):ri;
  var cand=D.log.filter(function(x){return x.i&&!x.w&&x.s>=2&&x.k!=='vip'&&x.k!=='usual'&&G.book[x.i];}),nx=cand.length?pick(cand):null;if(nx)G.nu=nx.i;save();
  EOD={isNew:isNew,b:b,rv:REVIEWS[ri],q:pick(REVIEWS[ri].q),vip:vip,nx:nx};eodCard();sfx.ding();}
function eodCard(){var D=G.today,E=EOD,b=E.b,isNew=E.isNew,rv=E.rv,walks=D.log.filter(function(x){return x.w;}).length;
  var rows=D.log.map(function(x){return '<li><span>'+esc(x.n)+'</span><span>'+(x.w?'walked out':'<span class="stars">'+'★★★'.slice(0,x.s)+'☆☆☆'.slice(0,3-x.s)+'</span>')+' +'+x.g+'</span></li>';}).join('');
  card('<h2 id="pTitle">Day '+G.day+' done!</h2><p class="big"><span aria-hidden="true">🪙</span> '+D.coins+'<span class="sr"> coins</span></p><p class="sub">earned today · '+D.stars+'/15 stars'+(walks?' · '+walks+' walked out':'')+'</p><ul>'+rows+'</ul>'+
    '<p class="review">“'+(E.vip?(E.vip.s===3?'I came in person. I am still thinking about that cake.':E.vip.w?'I waited. And waited. I have left.':'I came in person. I will not be coming back.'):E.q)+'”</p><p class="sub"><span class="stars" aria-label="'+rv.s+' of 5">'+'★★★★★'.slice(0,rv.s)+'☆☆☆☆☆'.slice(0,5-rv.s)+'</span> Mona Gâteau, food critic</p>'+
    (E.nx?'<p class="sub usual"><b>'+esc(E.nx.n)+'</b> loved their cake and will be back tomorrow for <b>the usual</b>. Remember it?</p>':'')+
    '<div class="ups"><h3>Shop upgrades</h3><ul>'+UPS.map(function(u){return '<li><span>'+u.n+'<small>'+u.d+'</small></span><span>'+(G.up[u.k]?'<span class="own">✓ yours</span>':'<button type="button" class="btn" data-go="buy" data-k="'+u.k+'"'+(G.coins<u.c?' disabled':'')+'>🪙 '+u.c+'</button>')+'</span></li>';}).join('')+'</ul></div>'+
    '<p class="sub">'+(isNew?'<b class="new">New best day!</b>':'Best day: '+(b?(b.coins|0)+' coins (day '+(b.day|0)+')':'none yet'))+'</p>'+
    '<div class="row"><button type="button" class="btn serve xl" data-go="next">Open day '+(G.day+1)+' →</button></div>');}
/* keys: 1-4 tabs, Backspace undo, Enter serve (buttons reached by keyboard keep their own Enter) */
document.addEventListener('keydown',function(e){if(!$('panel').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  var a=document.activeElement,btn=a&&a.tagName==='BUTTON',kv=false;try{kv=btn&&a.matches(':focus-visible');}catch(x){}
  if(e.key>='1'&&e.key<='4'&&e.key.length===1){var inTabs=a&&a.closest&&a.closest('#tabs');tab=TABS[+e.key-1].k;tabsUI();if(inTabs)$('tab-'+tab).focus();e.preventDefault();}
  else if(e.key==='Backspace'){e.preventDefault();undo();}
  else if(e.key==='Enter'){if(kv)return;e.preventDefault();serve();}});
tabsUI();render();intro();requestAnimationFrame(loop);
window.__cake={cake:function(){return cake;},apply:apply,render:render,gen:genOrder,grade:grade,checks:checks,solveReq:solveReq,cast:CAST,drawWho:drawWho,drawCake:drawCake,
  solve:function(){if(!G.req)return;hist.push(snap());cake=solveReq(G.req);render();},
  set:function(c){cake=c;render();},
  wrongify:function(){hist.push(snap());if(cake.layers.length<3)cake.layers.push(cake.layers[cake.layers.length-1]==='choc'?'lemon':'choc');else cake.layers.pop();render();},
  serve:serve,drain:function(s){if(G.phase!=='wait')return;G.pat=Math.max(0,G.pat-s/G.dur);moodUI();if(G.pat<=0)walkOff();},
  hold:function(v){G.hold=!!v;G.freeze=!!v;},speed:function(v){G.speed=v||1;},
  start:function(day){lsSet('cake.save',null);closeCard();fresh();G.day=day||1;startDay();},next:nextCustomer,mona:MONA,
  leap:function(day,cust){closeCard();G.day=day;G.cust=cust;G.today=G.today||newToday();nextCustomer();},
  resume:function(){closeCard();resume();},endDay:endDay,intro:intro,state:function(){return G;},
  info:function(){var L=G.last;return 'day='+G.day+' cust='+G.cust+' phase='+G.phase+' coins='+G.coins+' pat='+G.pat.toFixed(2)+(L?' acc='+L.acc.toFixed(2)+' stars='+L.stars+' gain='+L.gain+(L.walk?' WALK':''):'');}};
})();
</script>
