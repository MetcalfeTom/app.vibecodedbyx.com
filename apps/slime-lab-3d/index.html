<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Lab 3D — mix goo under real light</title>
<meta name="description" content="A real-3D slime kitchen: orbit the bowl, pour glue, watch activator drips splash, sprinkle mix-ins and stir — then poke the wobbling blob you made.">
<link rel="icon" href="https://emojicdn.elk.sh/🧪">
<meta property="og:title" content="Slime Lab 3D — mix goo under real light">
<meta property="og:description" content="Orbit a spot-lit mixing bowl in full 3D. Pour, drip, sprinkle, stir — then poke the wobbling blob you made.">
<meta property="og:url" content="https://sloppy.live/slime-lab-3d/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/3d%20render%20of%20a%20glossy%20ceramic%20mixing%20bowl%20full%20of%20bright%20green%20slime%20on%20a%20wooden%20table%20under%20a%20single%20warm%20spotlight%2C%20dark%20moody%20room%2C%20dramatic%20shadows%2C%20cute%20laboratory%20props%2C%20octane%20render.png?width=1200&height=630&nologo=true&seed=3333&model=flux">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171225; --panel:rgba(20,15,34,.82); --edge:rgba(255,255,255,.14);
  --txt:#f2ecff; --dim:#9b8fc0; --pink:#ff5fa2; --lime:#8be05a; --sun:#ffc21a;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{ background:#0b0716; color:var(--txt); font-family:'IBM Plex Mono', monospace; overflow:hidden; }
main{ position:fixed; inset:0; }
canvas{ display:block; }
h1{
  position:fixed; top:.7rem; left:50%; transform:translateX(-50%);
  font-family:'Titan One', cursive; font-weight:400; font-size:clamp(1.2rem,3.4vw,1.9rem);
  letter-spacing:.05em; pointer-events:none; z-index:5; white-space:nowrap;
  color:var(--lime); text-shadow:0 0 18px rgba(139,224,90,.45), 2px 2px 0 #0b0716;
}
h1 span{ color:var(--pink); text-shadow:0 0 18px rgba(255,95,162,.45), 2px 2px 0 #0b0716; }
.hint{
  position:fixed; left:50%; bottom:1rem; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--edge); border-radius:2rem;
  font-size:.78rem; padding:.5rem 1rem; z-index:5; text-align:center;
  backdrop-filter:blur(6px); transition:opacity .5s; max-width:92vw;
}
.hint.gone{ opacity:0; }
.bench{
  position:fixed; top:4rem; left:.8rem; z-index:5; display:flex; flex-direction:column; gap:.55rem;
  background:var(--panel); border:1px solid var(--edge); border-radius:.8rem;
  padding:.7rem; backdrop-filter:blur(6px); width:11.5rem;
}
.bench h2{ font-size:.62rem; letter-spacing:.18em; color:var(--dim); font-weight:700; }
.row{ display:flex; gap:.35rem; flex-wrap:wrap; }
button{ font-family:'IBM Plex Mono', monospace; cursor:pointer; }
.sw{ width:2.75rem; height:2.75rem; border-radius:50%; border:2px solid var(--edge); }
.sw[aria-pressed="true"]{ border-color:var(--txt); box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--txt); }
.chip{
  background:rgba(255,255,255,.06); color:var(--txt); border:1px solid var(--edge);
  border-radius:2rem; font-size:.72rem; min-height:2.75rem; padding:.3rem .7rem;
}
.chip[aria-pressed="true"]{ background:rgba(139,224,90,.25); border-color:var(--lime); }
.mix{
  font-family:'Titan One', cursive; font-size:.95rem; letter-spacing:.05em;
  background:var(--pink); color:#fff; border:0; border-radius:.7rem; min-height:3rem;
  box-shadow:0 4px 0 #a63368, 0 0 24px rgba(255,95,162,.35);
}
.mix:active{ transform:translateY(3px); box-shadow:0 1px 0 #a63368; }
.tools{ position:fixed; top:4rem; right:.8rem; z-index:5; display:flex; flex-direction:column; gap:.45rem; }
.tools button{
  background:var(--panel); color:var(--txt); border:1px solid var(--edge); border-radius:.6rem;
  min-width:2.75rem; min-height:2.75rem; font-size:1rem; backdrop-filter:blur(6px);
}
.stamp{
  position:fixed; right:.7rem; bottom:.7rem; z-index:5; pointer-events:none;
  font-size:.6rem; color:var(--dim); background:var(--panel); border:1px solid var(--edge);
  border-radius:.4rem; padding:.15rem .45rem;
}
:focus-visible{ outline:3px solid var(--sun); outline-offset:2px; }
@media (max-width:40rem){ .bench{ width:10rem; padding:.55rem; } }
@media (prefers-reduced-motion: reduce){ .hint{ transition:none; } }
</style>
</head>
<body>
<main>
  <h1>SLIME LAB <span>3D</span></h1>
  <canvas id="cv" role="application" aria-label="3D slime kitchen. Drag empty space to orbit, scroll to zoom. Follow the hint bar to pour, drip, sprinkle and stir; then poke your slime."></canvas>
  <div class="bench" role="group" aria-label="Recipe bench">
    <h2>PIGMENT</h2><div class="row" id="swatchRow"></div>
    <h2>MIX-INS</h2><div class="row" id="chipRow"></div>
    <h2>BOWL · <span id="batchCount"></span></h2><div class="row" id="bowlRow"></div>
    <button class="mix" id="mixBtn" type="button">🥣 NEW BATCH</button>
  </div>
  <div class="tools">
    <button id="muteBtn" type="button" aria-pressed="false" aria-label="Toggle sound">🔊</button>
    <button id="autoBtn" type="button" aria-label="Auto-complete current step" title="auto-complete step (Enter)">⏭</button>
  </div>
  <div class="hint" id="hint">🌀 drag to orbit · scroll to zoom · press NEW BATCH to start mixing</div>
  <span class="stamp" id="stamp"></span>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const VER = 'v1.4 · 0d415fa';
document.getElementById('stamp').textContent = VER;

/* ============ recipe ============ */
const PIGMENTS = [0x8be05a, 0xff5fa2, 0x4aa8ff, 0xa06bff, 0xffc21a, 0x35d6b1];
const ADDINS = [
  { key:'beads', name:'🫧 beads' },
  { key:'stars', name:'⭐ stars' },
  { key:'glitter', name:'✨ glitter' },
];
const recipe = { pigment:0, addins:{ beads:true, stars:false, glitter:true } };
const GLUE_COL = 0xf3ead9;

/* 3-tier bowls: mix batches to unlock */
const BOWLS = {
  plastic:{ name:'🥣 Plastic', need:0, bubbles:'manual', motor:false, stirMul:0.85 },
  glass:  { name:'🔥 Glass',   need:3, bubbles:'auto',   motor:false, stirMul:1.3 },
  mixer:  { name:'⚡ Mixer',   need:7, bubbles:'none',   motor:true,  stirMul:1 },
};
const OMEGA_MAX = 22;
let PROG = { batches:0, bowl:'plastic' };
try{
  const s = JSON.parse(localStorage.getItem('slime-lab-3d-progress-v1'));
  if(s && BOWLS[s.bowl]) PROG = { batches:Math.max(0, s.batches|0), bowl:s.bowl };
}catch(e){}
if(PROG.batches < BOWLS[PROG.bowl].need) PROG.bowl='plastic';
function saveProg(){ try{ localStorage.setItem('slime-lab-3d-progress-v1', JSON.stringify(PROG)); }catch(e){} }

/* ============ pure-ish stage machine ============ */
const STIR_NEED = Math.PI*2*2.2;
let MIX = null;   // {stage, level, actLevel, sprinkles, stir, ...}
function freshBatch(){
  MIX = { stage:0, level:0, actLevel:0, sprinkles:0, stir:0, stirVel:0,
    pouring:false, stirring:false, lastAng:null, dripT:0,
    bowl:BOWLS[PROG.bowl], motor:false, omega:0, whirl:0, hintT:0 };
  applyBowl(PROG.bowl);
  setHint(stageHint());
  resetMixScene();
}
function stageHint(){
  if(MIX && MIX.stage===3){
    if(MIX.bowl.motor) return '⚡ hold on the bowl to run the mixer — watch the g-force';
    if(MIX.bowl.bubbles==='manual') return '🥄 stir circles on the goo — steer the spoon over bubbles to pop them';
    return '🥄 drag circles on the goo to stir — the heat pops bubbles for you';
  }
  return ['🍯 hold on the bowl to pour glue','💧 hold on the bowl to drip activator',
          '✨ tap the bowl 3× to sprinkle mix-ins','🥄 stir'][MIX?MIX.stage:0];
}
function advMix(n){ MIX.stage=n; MIX.pouring=false; setHint(stageHint()); sBlip(0.3+n*0.1); }
function autoStep(){
  if(!MIX){ freshBatch(); return; }
  if(MIX.stage===0){ MIX.level=1; advMix(1); }
  else if(MIX.stage===1){ MIX.actLevel=1; advMix(2); }
  else if(MIX.stage===2){ while(MIX.sprinkles<3) doSprinkle(); }
  else MIX.stir = STIR_NEED;
}

/* ============ three.js scene ============ */
const cvEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas:cvEl, antialias:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0716);
scene.fog = new THREE.Fog(0x0b0716, 16, 34);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);

/* lights — one warm spot casting real dynamic shadows */
scene.add(new THREE.HemisphereLight(0x8a7fb0, 0x1a1030, 0.35));
const spot = new THREE.SpotLight(0xffd9a0, 1.35, 40, 0.62, 0.45, 1.2);
spot.position.set(-5, 11, 4);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0008;
scene.add(spot); spot.target.position.set(0,0.8,0); scene.add(spot.target);
const fill = new THREE.PointLight(0x6a5fc0, 0.35, 30);
fill.position.set(6, 4, -5); scene.add(fill);

/* table */
const table = new THREE.Mesh(
  new THREE.CylinderGeometry(14, 14, 0.4, 48),
  new THREE.MeshStandardMaterial({ color:0x6b4a2e, roughness:0.85, metalness:0.05 }));
table.position.y = -0.2; table.receiveShadow = true; scene.add(table);
const mat2 = new THREE.Mesh(
  new THREE.CylinderGeometry(4.2, 4.2, 0.06, 48),
  new THREE.MeshStandardMaterial({ color:0x9a86c8, roughness:0.95 }));
mat2.position.y = 0.03; mat2.receiveShadow = true; scene.add(mat2);

/* procedural environment map — without one, roughness/reflectivity are nearly
   invisible (nothing to reflect in a black room). 6 tiny canvas faces:
   dark violet room with a warm lamp blotch matching the spotlight. */
function makeEnv(){
  const faces = [];
  for(let f=0; f<6; f++){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,64);
    g.addColorStop(0,'#241a3e'); g.addColorStop(1,'#0b0716');
    x.fillStyle = g; x.fillRect(0,0,64,64);
    if(f===2){                       // +Y: ceiling glow above
      const r = x.createRadialGradient(24,32,2,24,32,30);
      r.addColorStop(0,'rgba(255,217,160,0.95)'); r.addColorStop(1,'rgba(255,217,160,0)');
      x.fillStyle = r; x.fillRect(0,0,64,64);
    }
    if(f===1){                       // -X: warm side splash where the lamp hangs
      const r = x.createRadialGradient(32,20,2,32,20,26);
      r.addColorStop(0,'rgba(255,190,120,0.55)'); r.addColorStop(1,'rgba(255,190,120,0)');
      x.fillStyle = r; x.fillRect(0,0,64,64);
    }
    faces.push(c);
  }
  const tex = new THREE.CubeTexture(faces);
  tex.needsUpdate = true;
  return tex;
}
const ENV = makeEnv();
/* micro-scuff noise → normal map (procedural: noise + streak scratches, Sobel height→normal) */
function makeScuffNormal(){
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0,0,S,S);
  const img = x.getImageData(0,0,S,S);
  for(let i=0;i<img.data.length;i+=4){
    const v = 128 + (Math.random()*2-1)*10;
    img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;
  }
  x.putImageData(img,0,0);
  for(let i=0;i<90;i++){                       // scuff streaks
    const sx=Math.random()*S, sy=Math.random()*S, a=Math.random()*Math.PI, l=4+Math.random()*18;
    const v = Math.random()<0.5 ? 88 : 168;
    x.strokeStyle = 'rgba('+v+','+v+','+v+',0.3)';
    x.lineWidth = 0.6+Math.random();
    x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+Math.cos(a)*l, sy+Math.sin(a)*l); x.stroke();
  }
  const h = x.getImageData(0,0,S,S).data;
  const out = x.createImageData(S,S);
  const H = (px,py)=>h[(((py+S)%S)*S+((px+S)%S))*4];
  for(let py=0;py<S;py++) for(let px=0;px<S;px++){
    const dx=(H(px+1,py)-H(px-1,py))/255, dy=(H(px,py+1)-H(px,py-1))/255;
    const i=(py*S+px)*4;
    out.data[i]=128+dx*127; out.data[i+1]=128+dy*127; out.data[i+2]=255; out.data[i+3]=255;
  }
  x.putImageData(out,0,0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,2);
  return t;
}

/* three tier bowls (lathe) */
const BOWL_R = 2.0, BOWL_H = 1.6;
const prof = [];
[[0,0.04],[0.9,0.06],[1.5,0.28],[1.88,0.85],[2.02,1.45],[2.06,1.6],[1.96,1.6],[1.9,1.42],[1.6,0.8],[1.15,0.42],[0.35,0.3],[0,0.3]]
  .forEach(p=>prof.push(new THREE.Vector2(p[0], p[1])));
function tierGroup(){ const g = new THREE.Group(); scene.add(g); return g; }
/* — plastic, user spec v2: subsurf-style hi-res lathe, SMOOTH shading,
     beveled rim + a pour SPOUT (rim vertices pulled outward + down-curled
     in an angular window — lathe alone can't spout, it's symmetric) — */
const gPlastic = tierGroup();
{
  const profP = [];   // beveled rim profile (kept from previous spec)
  [[0,0.04],[0.9,0.06],[1.5,0.28],[1.88,0.85],[2.02,1.45],
   [2.05,1.54],[2.06,1.60],[2.02,1.63],[1.97,1.62],[1.93,1.55],
   [1.9,1.42],[1.6,0.8],[1.15,0.42],[0.35,0.3],[0,0.3]]
    .forEach(p=>profP.push(new THREE.Vector2(p[0], p[1])));
  const geoP = new THREE.LatheGeometry(profP, 48);   // "subsurf": high radial resolution
  const SPOUT_A = Math.PI/4, SPOUT_W = 0.42;         // spout angle + angular half-width
  const pp = geoP.attributes.position;
  for(let i=0;i<pp.count;i++){
    const x = pp.getX(i), y = pp.getY(i), z = pp.getZ(i);
    const r = Math.hypot(x,z);
    if(r < 1.5 || y < 1.3) continue;
    let da = Math.abs(Math.atan2(z,x) - SPOUT_A);
    if(da > Math.PI) da = Math.PI*2 - da;
    if(da > SPOUT_W) continue;
    const w = Math.cos(da/SPOUT_W*Math.PI/2);        // smooth angular falloff
    const h = Math.min(1, (y-1.3)/0.3);              // only the lip region
    const f = 1 + 0.24*w*w*h;                        // pull the lip outward
    pp.setX(i, x/r*r*f); pp.setZ(i, z/r*r*f);
    pp.setY(i, y - 0.09*w*w*h*(r>1.95?1:0.4));       // curl the spout down
  }
  geoP.computeVertexNormals();                        // smooth shading spec
  /* fresh material per spec — nothing inherited from earlier tiers.
     IOR 1.46 → F0 = ((1.46−1)/(1.46+1))² ≈ 0.035; r128 has no .ior,
     and its reflectivity maps F0 = 0.16·r² → r = √(0.035/0.16) ≈ 0.47 */
  const m = new THREE.Mesh(geoP,
    new THREE.MeshPhysicalMaterial({ color:0xa8d3be, roughness:0.45, metalness:0,
      reflectivity:0.47, flatShading:false, side:THREE.DoubleSide,
      envMap:ENV, envMapIntensity:0.55,
      normalMap:makeScuffNormal(), normalScale:new THREE.Vector2(0.18, 0.18) }));
  m.castShadow = m.receiveShadow = true; gPlastic.add(m);
}
/* — heated glass: transparent walls + pulsing orange coil glow — */
const gGlass = tierGroup();
let coil = null, coilLight = null;
{
  const m = new THREE.Mesh(new THREE.LatheGeometry(prof, 56),
    new THREE.MeshPhysicalMaterial({ color:0xdff2f9, roughness:0.06, metalness:0, transparent:true, opacity:0.32, side:THREE.DoubleSide,
      envMap:ENV, envMapIntensity:0.9 }));
  m.castShadow = false; m.receiveShadow = true; gGlass.add(m);
  coil = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.09, 10, 40),
    new THREE.MeshStandardMaterial({ color:0x50200a, emissive:0xff6a22, emissiveIntensity:1.2, roughness:0.6 }));
  coil.rotation.x = Math.PI/2; coil.position.y = 0.12; gGlass.add(coil);
  coilLight = new THREE.PointLight(0xff8a30, 0.9, 7);
  coilLight.position.set(0, 0.6, 0); gGlass.add(coilLight);
}
/* — electric mixer: steel bowl, base unit, arm + whisk — */
const gSteel = tierGroup();
let whisk = null, led = null;
{
  const m = new THREE.Mesh(new THREE.LatheGeometry(prof, 56),
    new THREE.MeshStandardMaterial({ color:0xcfd3dd, roughness:0.3, metalness:0.85, side:THREE.DoubleSide,
      envMap:ENV, envMapIntensity:1.2 }));
  m.castShadow = m.receiveShadow = true; gSteel.add(m);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.7, 0.35, 32),
    new THREE.MeshStandardMaterial({ color:0x3a3f52, roughness:0.5, metalness:0.4 }));
  base.position.y = 0.05; base.receiveShadow = base.castShadow = true; gSteel.add(base);
  led = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8),
    new THREE.MeshStandardMaterial({ color:0x222222, emissive:0x113311, emissiveIntensity:1 }));
  led.position.set(2.2, 0.28, 0.8); gSteel.add(led);
  const armV = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.6, 0.3),
    new THREE.MeshStandardMaterial({ color:0x565b70, roughness:0.4, metalness:0.6 }));
  armV.position.set(2.6, 2.3, 0); armV.castShadow = true; gSteel.add(armV);
  const armH = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.28, 0.3),
    new THREE.MeshStandardMaterial({ color:0x565b70, roughness:0.4, metalness:0.6 }));
  armH.position.set(1.25, 4.5, 0); armH.castShadow = true; gSteel.add(armH);
  whisk = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.3, 8),
    new THREE.MeshStandardMaterial({ color:0x9aa0b4, roughness:0.3, metalness:0.8 }));
  shaft.position.y = 2.75; whisk.add(shaft);
  for(let i=0;i<3;i++){
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.03, 8, 20),
      new THREE.MeshStandardMaterial({ color:0xb8bdcf, roughness:0.25, metalness:0.85 }));
    loop.rotation.y = i*Math.PI/3; loop.position.y = 1.12; loop.castShadow = true; whisk.add(loop);
  }
  gSteel.add(whisk);
}
function applyBowl(key){
  gPlastic.visible = key==='plastic';
  gGlass.visible = key==='glass';
  gSteel.visible = key==='mixer';
}
applyBowl(PROG.bowl);

/* liquid disc with CPU wave */
const LIQ_SEG = 48;
const liqGeo = new THREE.CircleGeometry(1, LIQ_SEG);
liqGeo.rotateX(-Math.PI/2);
const liqBase = liqGeo.attributes.position.array.slice();
const liqMat = new THREE.MeshStandardMaterial({ color:GLUE_COL, roughness:0.35, metalness:0.02 });
const liquid = new THREE.Mesh(liqGeo, liqMat);
liquid.receiveShadow = true; liquid.visible = false; scene.add(liquid);
function liqLevelY(){ return 0.38 + (MIX ? (MIX.level*0.55 + MIX.actLevel*0.14) : 0.69)*1.0; }
function liqRadiusAt(y){ return 0.85 + (y/BOWL_H)*1.05; }
function wallYAt(r){ return Math.max(0, (r-0.9)/1.16*BOWL_H); }   // inner-wall height at radius r

/* bottle + dropper + spoon */
function makeBottle(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.36,1.1,20),
    new THREE.MeshStandardMaterial({ color:0xfdfaf2, roughness:0.5 }));
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,0.34,14),
    new THREE.MeshStandardMaterial({ color:0xffb62e, roughness:0.5 }));
  cap.position.y = -0.7; body.castShadow = cap.castShadow = true;
  g.add(body); g.add(cap); return g;
}
const bottle = makeBottle(); bottle.position.set(0, 4.1, 0); bottle.visible=false; scene.add(bottle);
const dropper = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,0.8,14),
  new THREE.MeshStandardMaterial({ color:0xbfe4f2, roughness:0.35 }));
dropper.castShadow = true; dropper.position.set(0, 4.0, 0); dropper.visible=false; scene.add(dropper);
const spoon = new THREE.Group();
{
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,2.4,10),
    new THREE.MeshStandardMaterial({ color:0x8a6b4a, roughness:0.7 }));
  handle.position.y = 1.3; handle.rotation.z = 0.35;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 12),
    new THREE.MeshStandardMaterial({ color:0xa5825c, roughness:0.65 }));
  head.scale.set(1, 0.45, 0.75);
  handle.castShadow = head.castShadow = true;
  spoon.add(handle); spoon.add(head);
}
spoon.visible = false; scene.add(spoon);

/* pour stream */
const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 1, 10, 1, true),
  new THREE.MeshStandardMaterial({ color:GLUE_COL, roughness:0.3 }));
stream.visible = false; scene.add(stream);

/* pools: drips, ripples, sprinkles, bubbles */
const drips=[], ripples=[], sprinkles=[], bubbles=[];
const dripGeo = new THREE.SphereGeometry(0.09, 10, 8);
const dripMat = new THREE.MeshStandardMaterial({ color:0xbfe4f2, roughness:0.2 });
const ripGeo = new THREE.RingGeometry(0.85, 1, 32); ripGeo.rotateX(-Math.PI/2);
function spawnDrip(x, z){
  const m = new THREE.Mesh(dripGeo, dripMat); m.castShadow = true;
  m.position.set(x, 3.6, z); m.userData.vy = -1.5;
  scene.add(m); drips.push(m);
}
function spawnRipple(x, z, y){
  const m = new THREE.Mesh(ripGeo, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.6, side:THREE.DoubleSide }));
  m.position.set(x, y+0.012, z); m.scale.setScalar(0.12); m.userData.t = 0;
  scene.add(m); ripples.push(m);
}
const beadGeo = new THREE.SphereGeometry(0.09, 10, 8);
const starGeo = new THREE.OctahedronGeometry(0.11);
const glitGeo = new THREE.TetrahedronGeometry(0.06);
function doSprinkle(){
  if(!MIX || MIX.stage!==2) return;
  MIX.sprinkles++;
  const kinds = [];
  if(recipe.addins.beads) kinds.push('bd');
  if(recipe.addins.stars) kinds.push('st');
  if(recipe.addins.glitter) kinds.push('gl');
  if(!kinds.length) kinds.push('gl');
  for(let i=0;i<10;i++){
    const k = kinds[i%kinds.length];
    const geo = k==='bd'?beadGeo:k==='st'?starGeo:glitGeo;
    const col = k==='bd'?0xffe3ef:k==='st'?0xffd24a:0xffffff;
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:col, roughness:0.25, metalness:k==='gl'?0.6:0.1 }));
    m.castShadow = true;
    const a = Math.random()*Math.PI*2, r = Math.random()*liqRadiusAt(liqLevelY())*0.8;
    m.position.set(Math.cos(a)*r, 3.4+Math.random()*0.8, Math.sin(a)*r);
    m.userData = { vy:-(1+Math.random()), rest:false, ang:a, rad:r, spin:Math.random()*2 };
    scene.add(m); sprinkles.push(m);
  }
  sCrunch();
  if(MIX.sprinkles>=3) advMix(3);
}
function spawnBubble(){
  const y = liqLevelY(), r = liqRadiusAt(y)*0.8;
  const a = Math.random()*Math.PI*2, d = Math.random()*r;
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05+Math.random()*0.05, 8, 6),
    new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.5, roughness:0.1 }));
  m.position.set(Math.cos(a)*d, y+0.03, Math.sin(a)*d);
  m.userData.age = 0; scene.add(m); bubbles.push(m);
}

/* blob (post-mix) */
let blob = null;
function makeBlob(){
  const col = PIGMENTS[recipe.pigment];
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.95, 36, 28),
    new THREE.MeshStandardMaterial({ color:col, roughness:0.18, metalness:0.02 }));
  m.castShadow = true;
  const deco = new THREE.Group();
  const kinds = [];
  if(recipe.addins.beads) kinds.push(['bd',beadGeo,0xffe3ef]);
  if(recipe.addins.stars) kinds.push(['st',starGeo,0xffd24a]);
  if(recipe.addins.glitter) kinds.push(['gl',glitGeo,0xffffff]);
  kinds.forEach(k=>{
    for(let i=0;i<10;i++){
      const d = new THREE.Mesh(k[1], new THREE.MeshStandardMaterial({ color:k[2], roughness:0.25, metalness:k[0]==='gl'?0.6:0.1 }));
      const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() :
        new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
      d.position.copy(v.multiplyScalar(0.9));
      deco.add(d);
    }
  });
  m.add(deco);
  m.position.set(0, 3, 2.4);
  m.userData = { vx:0, vy:0, vz:0.8, sx:1, sy:1, sxv:0, syv:0, held:false };
  scene.add(m);
  return m;
}

/* ============ camera orbit (custom) ============ */
const CAM = { az:0.7, el:0.5, dist:9.5, tx:0, ty:1.1, tz:0 };
function applyCam(){
  const e = Math.max(0.12, Math.min(1.35, CAM.el));
  camera.position.set(
    CAM.tx + Math.cos(CAM.az)*Math.cos(e)*CAM.dist,
    CAM.ty + Math.sin(e)*CAM.dist,
    CAM.tz + Math.sin(CAM.az)*Math.cos(e)*CAM.dist);
  camera.lookAt(CAM.tx, CAM.ty, CAM.tz);
}
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize(); applyCam();

/* ============ input ============ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pointerMode = null;   // 'orbit' | 'pour' | 'stir' | 'blob'
let last = {x:0, y:0};
let pinch0 = 0;
function setNDC(e){
  ndc.x = (e.clientX/window.innerWidth)*2-1;
  ndc.y = -(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(ndc, camera);
}
function liquidHit(e){
  setNDC(e);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -liqLevelY());
  const pt = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, pt) ? pt : null;
}
function overBowl(pt){ return pt && Math.hypot(pt.x, pt.z) < BOWL_R*1.35; }
cvEl.addEventListener('pointerdown', e=>{
  audioInit();
  last.x = e.clientX; last.y = e.clientY;
  const pt = liquidHit(e);
  if(blob){
    setNDC(e);
    const hit = ray.intersectObject(blob, true);
    if(hit.length){ pointerMode='blob'; blob.userData.held=true; blob.userData.hx=hit[0].point.x; sSquish(0.5); pokeBlob(); cvEl.setPointerCapture(e.pointerId); return; }
  }
  if(MIX && overBowl(pt)){
    if(MIX.stage<=1){ MIX.pouring = true; pointerMode='pour'; }
    else if(MIX.stage===2){ doSprinkle(); pointerMode='orbit'; }
    else if(MIX.bowl.motor){ MIX.motor = true; pointerMode='pour'; }
    else { pointerMode='stir'; MIX.stirring=true; MIX.lastAng = Math.atan2(pt.z, pt.x); }
  } else pointerMode='orbit';
  cvEl.setPointerCapture(e.pointerId);
});
cvEl.addEventListener('pointermove', e=>{
  const dx = e.clientX-last.x, dy = e.clientY-last.y;
  last.x = e.clientX; last.y = e.clientY;
  if(pointerMode==='orbit'){
    CAM.az += dx*0.006; CAM.el += dy*0.005; applyCam();
  } else if(pointerMode==='stir' && MIX && MIX.stirring){
    const pt = liquidHit(e);
    if(pt){
      spoonTarget.copy(pt);
      const a = Math.atan2(pt.z, pt.x);
      if(MIX.lastAng!==null){
        let d = a-MIX.lastAng;
        while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2;
        MIX.stir += Math.abs(d)*MIX.bowl.stirMul; MIX.stirVel = Math.min(1, Math.abs(d)*9);
      }
      MIX.lastAng = a;
    }
  } else if(pointerMode==='blob' && blob){
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -blob.position.y);
    setNDC(e);
    const pt = new THREE.Vector3();
    if(ray.ray.intersectPlane(plane, pt)){
      blob.userData.vx = (pt.x-blob.position.x)*14;
      blob.userData.vz = (pt.z-blob.position.z)*14;
      blob.position.x += (pt.x-blob.position.x)*0.4;
      blob.position.z += (pt.z-blob.position.z)*0.4;
    }
  }
});
function endPointer(){
  if(MIX){ MIX.pouring=false; MIX.stirring=false; MIX.motor=false; MIX.lastAng=null; }
  if(blob) blob.userData.held=false;
  pointerMode=null;
}
cvEl.addEventListener('pointerup', endPointer);
cvEl.addEventListener('pointercancel', endPointer);
cvEl.addEventListener('wheel', e=>{
  e.preventDefault();
  CAM.dist = Math.max(4.5, Math.min(18, CAM.dist + e.deltaY*0.01));
  applyCam();
}, { passive:false });
cvEl.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinch0) { CAM.dist = Math.max(4.5, Math.min(18, CAM.dist + (pinch0-d)*0.02)); applyCam(); }
    pinch0 = d;
  }
}, { passive:true });
cvEl.addEventListener('touchend', ()=>{ pinch0=0; });
function pokeBlob(){
  blob.userData.syv -= 2.6; blob.userData.sxv += 1.4;
}

/* ============ mix scene lifecycle ============ */
const spoonTarget = new THREE.Vector3(0.8, 0, 0);
function resetMixScene(){
  if(blob){ scene.remove(blob); blob=null; }
  [drips, ripples, sprinkles, bubbles].forEach(arr=>{ arr.forEach(m=>scene.remove(m)); arr.length=0; });
  liquid.visible = false;
  liqMat.color.set(GLUE_COL);
}
function finishMix(){
  const leftover = MIX.bowl.bubbles==='manual' ? bubbles.length : 0;
  MIX = null;
  bottle.visible = dropper.visible = spoon.visible = stream.visible = false;
  sprinkles.forEach(m=>scene.remove(m)); sprinkles.length=0;
  bubbles.forEach(m=>scene.remove(m)); bubbles.length=0;
  liquid.visible = false;
  PROG.batches++; saveProg();
  blob = makeBlob();
  for(let i=0;i<leftover;i++){   // trapped air rides the slime
    const bb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6),
      new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.4, roughness:0.1 }));
    const v = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
    bb.position.copy(v.multiplyScalar(0.75));
    blob.add(bb);
  }
  sSquish(1);
  const unlocked = Object.keys(BOWLS).find(k=>BOWLS[k].need===PROG.batches);
  buildBowls();
  setHint(unlocked ? '🔓 '+BOWLS[unlocked].name+' unlocked — pick it on the bench!'
    : leftover>0 ? '😬 '+leftover+' air bubble'+(leftover===1?'':'s')+' got trapped in your slime… · NEW BATCH to retry'
    : '🫠 poke it! drag it! orbit around it! · NEW BATCH to mix again');
  setTimeout(()=>document.getElementById('hint').classList.add('gone'), 7000);
}

/* ============ animate ============ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastT = performance.now();
function animate(now){
  const dt = Math.min(0.033, (now-lastT)/1000); lastT = now;
  const t = now/1000;

  if(MIX){
    const y = liqLevelY(), r = liqRadiusAt(y);
    /* stage progress */
    if(MIX.pouring && MIX.stage===0){
      MIX.level = Math.min(1, MIX.level + dt/1.7);
      if(MIX.level>=1) advMix(1);
    } else if(MIX.pouring && MIX.stage===1){
      MIX.actLevel = Math.min(1, MIX.actLevel + dt/1.3);
      MIX.dripT += dt;
      if(MIX.dripT>0.12){ MIX.dripT=0; spawnDrip((Math.random()-.5)*r*1.6, (Math.random()-.5)*r*1.6); }
      if(MIX.actLevel>=1) advMix(2);
    }
    /* tools visibility + pose */
    bottle.visible = MIX.stage===0;
    dropper.visible = MIX.stage===1;
    spoon.visible = MIX.stage===3 && !MIX.bowl.motor;
    stream.visible = MIX.pouring && MIX.stage===0;
    bottle.rotation.z = MIX.pouring ? 2.4 : 0.4 + Math.sin(t*0.8)*0.05;
    dropper.rotation.z = MIX.pouring ? 0.5 : 0.15;
    if(stream.visible){
      const top = 3.6, bot = y;
      stream.position.set(0, (top+bot)/2, 0);
      stream.scale.y = (top-bot);
    }
    /* liquid mesh */
    liquid.visible = MIX.level>0 || MIX.actLevel>0;
    if(liquid.visible){
      liquid.position.y = y;
      liquid.scale.setScalar(r);
      const m = Math.min(1, MIX.stir/STIR_NEED);
      const from = new THREE.Color(MIX.actLevel>0.05 && m<0.4 ? 0xcfe8f2 : GLUE_COL);
      liqMat.color.copy(from.lerp(new THREE.Color(PIGMENTS[recipe.pigment]), m));
      /* CPU wave — amplitude keyed to stirring */
      const pos = liqGeo.attributes.position;
      const amp = 0.015 + MIX.stirVel*0.06;
      const vort = MIX.bowl.motor ? (MIX.omega/OMEGA_MAX)*0.5 : 0;
      for(let i=0;i<pos.count;i++){
        const bx = liqBase[i*3], bz = liqBase[i*3+2];
        const rd = Math.min(1, Math.hypot(bx,bz));
        pos.setY(i, Math.sin(bx*6 + t*4 + bz*4)*amp + Math.sin(bz*7 - t*3)*amp*0.6
          - vort*(1-rd)*(1-rd));
      }
      pos.needsUpdate = true;
      if(coil && gGlass.visible){
        const pulse = 0.8 + 0.5*Math.sin(t*5);
        coil.material.emissiveIntensity = pulse*1.4;
        if(coilLight) coilLight.intensity = pulse;
      }
      /* stirring: bubbles + decay */
      if(MIX.stage===3){
        MIX.stirVel *= Math.max(0, 1-5*dt);
        if(MIX.bowl.bubbles!=='none' && Math.random()<dt*2 && bubbles.length<8 && m<0.95) spawnBubble();
        /* electric mixer: hold = motor, whisk spins, vortex forms, g-force live */
        if(MIX.bowl.motor){
          MIX.omega = Math.max(0, Math.min(OMEGA_MAX, MIX.omega + (MIX.motor? 15*dt : -24*dt)));
          MIX.whirl += MIX.omega*dt;
          MIX.stir += MIX.omega*dt*0.30;
          MIX.stirVel = MIX.omega/OMEGA_MAX;
          if(whisk) whisk.rotation.y = MIX.whirl;
          if(led) led.material.emissive.set(MIX.motor ? 0x2bff5a : 0x113311);
          const gF = MIX.omega*MIX.omega*2/9.8*0.22;
          MIX.hintT += dt;
          if(MIX.omega>0.5 && MIX.hintT>0.2){
            MIX.hintT = 0;
            setHint('⚡ mixer '+Math.round(Math.min(1,MIX.stir/STIR_NEED)*100)+'% · '+gF.toFixed(1)+' g'+(gF>3.6?' ⚠ overspin':''));
          }
          if(gF>3.6 && Math.random()<0.3){   // goo flings off the rim
            const a = Math.random()*Math.PI*2, rr = liqRadiusAt(y);
            const m2 = new THREE.Mesh(dripGeo, new THREE.MeshStandardMaterial({ color:PIGMENTS[recipe.pigment], roughness:0.3 }));
            m2.castShadow = true;
            m2.position.set(Math.cos(a)*rr, y+0.1, Math.sin(a)*rr);
            m2.userData = { vy:1.4, vx:Math.cos(a)*3.2, vz:Math.sin(a)*3.2 };
            scene.add(m2); drips.push(m2);
          }
        }
        if(MIX.stir>=STIR_NEED){ finishMix(); requestAnimationFrame(animate); return; }
      }
    }
    /* spoon follows */
    if(spoon.visible){
      const rr = Math.hypot(spoonTarget.x, spoonTarget.z);
      const cl = Math.min(rr, r*0.8) / (rr||1);
      spoon.position.set(spoonTarget.x*cl, y-0.1, spoonTarget.z*cl);
    }
  }

  /* drips: fall → splash the goo, OR catch the inner wall and slide down it */
  for(let i=drips.length-1;i>=0;i--){
    const d = drips[i], ud = d.userData;
    const surf = liquid.visible ? liquid.position.y : 0.12;
    if(ud.slide){
      d.position.y -= dt*0.5;                       // viscous crawl down the ceramic
      const wr = 0.9 + (Math.max(0.05,d.position.y)/BOWL_H)*1.16 - 0.06;
      d.position.x = Math.cos(ud.a)*wr;
      d.position.z = Math.sin(ud.a)*wr;
      d.scale.set(0.75, 1.6, 0.75);                 // streak shape
      if(d.position.y <= surf+0.04){
        spawnRipple(d.position.x*0.94, d.position.z*0.94, surf);
        sDrip();
        scene.remove(d); drips.splice(i,1);
      }
      continue;
    }
    ud.vy -= 9.8*dt;
    d.position.y += ud.vy*dt;
    d.position.x += (ud.vx||0)*dt; d.position.z += (ud.vz||0)*dt;
    const rr = Math.hypot(d.position.x, d.position.z);
    const lr = liqRadiusAt(surf);
    if(rr > lr && rr <= 2.02 && d.position.y <= wallYAt(rr)){
      ud.slide = true; ud.a = Math.atan2(d.position.z, d.position.x); ud.vy = 0;
      sBlip(0.12);
    } else if(d.position.y <= surf && rr <= lr){
      spawnRipple(d.position.x, d.position.z, surf);
      sDrip();
      scene.remove(d); drips.splice(i,1);
    } else if(d.position.y <= 0.08){
      spawnRipple(d.position.x, d.position.z, 0.05);
      scene.remove(d); drips.splice(i,1);
    }
  }
  /* ripples expand + fade */
  for(let i=ripples.length-1;i>=0;i--){
    const rp = ripples[i];
    rp.userData.t += dt;
    const k = rp.userData.t/0.7;
    rp.scale.setScalar(0.12 + k*0.9);
    rp.material.opacity = 0.6*(1-k);
    if(k>=1){ scene.remove(rp); rp.material.dispose(); ripples.splice(i,1); }
  }
  /* sprinkles fall, rest on goo, swirl while stirring */
  const liqY = liquid.visible ? liquid.position.y : null;
  for(const s of sprinkles){
    if(!s.userData.rest){
      s.userData.vy -= 9.8*dt;
      s.position.y += s.userData.vy*dt;
      s.rotation.x += dt*3; s.rotation.z += dt*2;
      const floor = (liqY!==null && Math.hypot(s.position.x, s.position.z) < liqRadiusAt(liqY)) ? liqY+0.05 : 0.08;
      if(s.position.y <= floor){
        s.position.y = floor; s.userData.rest = true;
        if(liqY!==null && floor>0.2) spawnRipple(s.position.x, s.position.z, liqY);
      }
    } else if(MIX && MIX.stage===3){
      const w = 0.4 + MIX.stirVel*3;
      s.userData.ang += w*dt;
      const rr = Math.min(s.userData.rad, liqRadiusAt(liqY||0.4)*0.85);
      s.position.x = Math.cos(s.userData.ang)*rr;
      s.position.z = Math.sin(s.userData.ang)*rr;
      if(liqY!==null) s.position.y = liqY+0.05;
      s.rotation.y += (REDUCED?0:dt*2);
    }
  }
  /* bubbles rise; heated glass pops them by itself, plastic needs the spoon */
  for(let i=bubbles.length-1;i>=0;i--){
    const b = bubbles[i];
    b.userData.age += dt;
    b.position.y += dt*0.08;
    b.scale.setScalar(1 + Math.min(1.4, b.userData.age*0.4));
    let popped = MIX && MIX.bowl.bubbles==='auto' && b.userData.age>1.1;
    if(!popped && MIX && MIX.bowl.bubbles==='manual' && MIX.stage===3 && spoon.visible){
      const dx=b.position.x-spoon.position.x, dz=b.position.z-spoon.position.z;
      if(Math.hypot(dx,dz) < 0.42) popped = true;
    }
    if(popped){
      spawnRipple(b.position.x, b.position.z, b.position.y-0.02);
      sBlip(0.15);
      scene.remove(b); bubbles.splice(i,1);
    }
  }
  /* blob physics: bounce, wobble, roam the table */
  if(blob){
    const u = blob.userData;
    if(!u.held){
      u.vy -= 9.8*dt;
      blob.position.x += u.vx*dt; blob.position.y += u.vy*dt; blob.position.z += u.vz*dt;
      const R = 0.95*u.sy;
      if(blob.position.y < R){
        blob.position.y = R;
        if(Math.abs(u.vy) > 1.2){ u.syv -= Math.min(2.5, Math.abs(u.vy)*0.3); sSquish(Math.min(1, Math.abs(u.vy)/8)); }
        u.vy = Math.abs(u.vy)*0.35;
        if(u.vy<0.6) u.vy=0;
        u.vx*=0.92; u.vz*=0.92;
      }
      const rr = Math.hypot(blob.position.x, blob.position.z);
      if(rr > 3.4){ const nx=blob.position.x/rr, nz=blob.position.z/rr;
        blob.position.x=nx*3.4; blob.position.z=nz*3.4;
        const dot=u.vx*nx+u.vz*nz; u.vx-=1.6*dot*nx; u.vz-=1.6*dot*nz; sSquish(0.3); }
    }
    /* squash-stretch springs */
    u.sxv += (1-u.sx)*60*dt; u.sxv *= Math.max(0,1-6*dt);
    u.syv += (1-u.sy)*60*dt; u.syv *= Math.max(0,1-6*dt);
    u.sx = Math.max(0.4, u.sx + u.sxv*dt*6);
    u.sy = Math.max(0.4, u.sy + u.syv*dt*6);
    blob.scale.set(u.sx, u.sy, u.sx);
  }

  /* idle camera drift before first interaction */
  if(!REDUCED && idleDrift){ CAM.az += dt*0.06; applyCam(); }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
let idleDrift = true;
cvEl.addEventListener('pointerdown', ()=>{ idleDrift=false; }, { once:true });

/* ============ audio (tiny synth) ============ */
let AC=null, master=null, muted=false;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.75; master.connect(AC.destination);
  }catch(e){}
}
function noiseBuf(sec){
  const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function sSquish(i){
  if(!AC) return; i=Math.max(0.1,Math.min(1,i));
  const t0=AC.currentTime, src=AC.createBufferSource(); src.buffer=noiseBuf(0.25);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.3;
  f.frequency.setValueAtTime(500*i+200,t0); f.frequency.exponentialRampToValueAtTime(90,t0+0.18);
  const g=AC.createGain(); g.gain.setValueAtTime(0.001,t0);
  g.gain.exponentialRampToValueAtTime(0.3*i,t0+0.012); g.gain.exponentialRampToValueAtTime(0.001,t0+0.22);
  src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0+0.3);
}
function sDrip(){
  if(!AC) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(900+Math.random()*300,t0);
  o.frequency.exponentialRampToValueAtTime(300,t0+0.08);
  g.gain.setValueAtTime(0.001,t0); g.gain.exponentialRampToValueAtTime(0.12,t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.001,t0+0.1);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.12);
}
function sBlip(i){
  if(!AC) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(400+i*400,t0);
  g.gain.setValueAtTime(0.001,t0); g.gain.exponentialRampToValueAtTime(0.14,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t0+0.12);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.14);
}
function sCrunch(){
  if(!AC) return;
  const t0=AC.currentTime;
  for(let j=0;j<5;j++){
    const st=t0+j*0.03, src=AC.createBufferSource(); src.buffer=noiseBuf(0.04);
    const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=2000+Math.random()*2000;
    const g=AC.createGain(); g.gain.setValueAtTime(0.08,st); g.gain.exponentialRampToValueAtTime(0.001,st+0.03);
    src.connect(f); f.connect(g); g.connect(master); src.start(st); src.stop(st+0.05);
  }
}

/* ============ UI ============ */
const $ = id => document.getElementById(id);
function setHint(txt){ const h=$('hint'); h.textContent=txt; h.classList.remove('gone'); }
function buildSwatches(){
  const row=$('swatchRow'); row.innerHTML='';
  PIGMENTS.forEach((c,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='sw';
    b.style.background='#'+c.toString(16).padStart(6,'0');
    b.setAttribute('aria-label','pigment '+(i+1));
    b.setAttribute('aria-pressed', String(recipe.pigment===i));
    b.addEventListener('click',()=>{ recipe.pigment=i;
      row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      if(blob) blob.material.color.set(PIGMENTS[i]);
    });
    row.appendChild(b);
  });
}
function buildChips(){
  const row=$('chipRow'); row.innerHTML='';
  ADDINS.forEach(a=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.textContent=a.name;
    b.setAttribute('aria-pressed', String(!!recipe.addins[a.key]));
    b.addEventListener('click',()=>{ recipe.addins[a.key]=!recipe.addins[a.key];
      b.setAttribute('aria-pressed', String(recipe.addins[a.key])); });
    row.appendChild(b);
  });
}
$('mixBtn').addEventListener('click', ()=>{ audioInit(); freshBatch(); });
$('autoBtn').addEventListener('click', ()=>{ audioInit(); autoStep(); });
$('muteBtn').addEventListener('click', function(){
  muted=!muted; this.textContent=muted?'🔇':'🔊';
  this.setAttribute('aria-pressed', String(muted));
  if(master) master.gain.setTargetAtTime(muted?0:0.75, AC.currentTime, 0.03);
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  if(e.key==='m'||e.key==='M') $('muteBtn').click();
  if(e.key==='r'||e.key==='R'){ audioInit(); freshBatch(); }
  if(e.key==='Enter'){ audioInit(); autoStep(); }
});
function buildBowls(){
  const row=$('bowlRow'); row.innerHTML='';
  Object.keys(BOWLS).forEach(k=>{
    const bd=BOWLS[k], locked = PROG.batches < bd.need;
    const b=document.createElement('button'); b.type='button'; b.className='chip'; b.disabled=locked;
    b.textContent = locked ? '🔒 '+(bd.need-PROG.batches)+' more' : bd.name;
    b.style.opacity = locked ? 0.45 : 1;
    b.setAttribute('aria-pressed', String(!locked && PROG.bowl===k));
    b.setAttribute('aria-label', bd.name+(locked?' — locked, mix '+(bd.need-PROG.batches)+' more batches':''));
    b.addEventListener('click', ()=>{ if(locked) return; PROG.bowl=k; saveProg(); buildBowls(); if(!MIX) applyBowl(k); });
    row.appendChild(b);
  });
  $('batchCount').textContent = PROG.batches+' mixed';
}
buildSwatches(); buildChips(); buildBowls();
requestAnimationFrame(t=>{ lastT=t; animate(t); });
</script>
