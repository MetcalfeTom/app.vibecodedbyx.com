<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Pinball — neon rubber-duck table</title>
<meta name="description" content="A neon pinball table where the bumpers are glowing rubber ducks. Flippers on the arrow keys, three balls, no external assets.">
<meta property="og:title" content="Duck Pinball — neon rubber-duck table">
<meta property="og:description" content="Three glowing rubber-duck bumpers, real flipper physics, and a plunger on Space. Quack.">
<meta property="og:url" content="https://sloppy.live/duck-pinball/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/neon%20pinball%20table%20with%20glowing%20rubber%20duck%20bumpers%2C%20cyan%20and%20magenta%20on%20black%2C%20retro%20arcade%2C%20flat%20illustration?width=1200&height=630&seed=7742&nologo=true&model=flux">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='10' r='5' fill='%23ffd83e'/%3E%3Ccircle cx='11' cy='6' r='3' fill='%23ffd83e'/%3E%3Crect x='13' y='5' width='3' height='2' fill='%23ff8a3e'/%3E%3Ccircle cx='11.6' cy='5.2' r='.8' fill='%23111'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07070f; --panel:#10101d; --line:#232338;
  --ink:#eef0ff; --ink2:#8d90b3;
  --cyan:#3ee8ff; --mag:#ff3ea8; --duck:#ffd83e; --beak:#ff8a3e;
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
  background:
    radial-gradient(34rem 22rem at 85% -8%, rgba(62,232,255,.08), transparent 60%),
    radial-gradient(30rem 20rem at 8% 108%, rgba(255,62,168,.08), transparent 60%),
    var(--bg);
  display:flex; flex-direction:column; align-items:center;
  padding:1rem .7rem 2.2rem;
}
main{ width:100%; max-width:30rem; display:flex; flex-direction:column; gap:.7rem; }
header{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
header h1{
  margin:0; font-size:1.5rem; letter-spacing:-.02em;
  color:var(--cyan); text-shadow:0 0 1.2rem rgba(62,232,255,.5);
}
h1 .m{ color:var(--mag); text-shadow:0 0 1.2rem rgba(255,62,168,.5); }
#hud{ margin-left:auto; display:flex; gap:1rem; font-size:.8rem; color:var(--ink2); }
#hud b{ color:var(--ink); font-size:1rem; }
#tablewrap{ position:relative; }
#table{
  width:100%; aspect-ratio:420/640; display:block;
  background:var(--panel); border:2px solid var(--line); border-radius:.9rem;
}
#status{ font-size:.72rem; color:var(--ink2); min-height:1.1rem; margin:0; }
#controls{ display:flex; gap:.5rem; flex-wrap:wrap; }
#controls button{
  font-family:inherit; font-size:.75rem; font-weight:700; min-height:2.75rem;
  padding:.4rem .8rem; border-radius:.6rem; cursor:pointer;
  background:transparent; color:var(--ink); border:2px solid var(--line);
}
#controls button:hover{ border-color:var(--cyan); }
#controls button:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
#keys{ font-size:.68rem; color:var(--ink2); line-height:1.7; }
#keys kbd{
  border:1px solid var(--line); border-radius:.3rem; padding:.05rem .35rem;
  background:var(--panel); font-family:inherit;
}
/* touch zones (coarse pointers) */
#touchpads{ display:none; }
@media (pointer:coarse){
  #touchpads{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  #touchpads button{
    min-height:3.4rem; font-family:inherit; font-weight:700; font-size:.85rem;
    background:transparent; color:var(--ink); border:2px solid var(--line);
    border-radius:.7rem; cursor:pointer;
  }
  #touchpads button:active{ border-color:var(--mag); color:var(--mag); }
}
footer{ text-align:center; font-size:.68rem; color:var(--ink2); margin-top:.3rem; line-height:1.7; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
<header>
  <h1>DUCK<span class="m">·</span>PINBALL</h1>
  <div id="hud">
    <span>score <b id="score">0</b></span>
    <span>ball <b id="balls">1/3</b></span>
    <span>best <b id="best">0</b></span>
  </div>
</header>

<div id="tablewrap">
  <canvas id="table" width="420" height="640" role="application"
    aria-label="Pinball table. Left and right arrow keys flip, Space launches the ball, R resets the game."></canvas>
</div>
<p id="status" role="status" aria-live="polite">press Space to launch the duck hunt.</p>

<div id="touchpads" aria-hidden="false">
  <button type="button" id="t-left" aria-label="Left flipper">◀ FLIP</button>
  <button type="button" id="t-launch" aria-label="Launch ball">● LAUNCH</button>
  <button type="button" id="t-right" aria-label="Right flipper">FLIP ▶</button>
</div>

<div id="controls">
  <button type="button" id="reset">↺ reset game</button>
  <button type="button" id="mute" aria-pressed="false">♪ sound: on</button>
</div>
<p id="keys"><kbd>←</kbd>/<kbd>→</kbd> flippers · <kbd>Space</kbd> launch · <kbd>R</kbd> reset · <kbd>M</kbd> mute</p>

<footer>everything drawn and synthesized in-page — no external assets · vote on sloppy.live if the ducks earn it<br>
<span id="buildstamp" role="note" aria-label="Build information" style="font-size:.62rem;opacity:.65;">build v1.0 · 2026-08-19 · pending</span></footer>
</main>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var cv=$('table'), cx=cv.getContext('2d');
var KEY='duck-pinball-best-v1';

/* ── table geometry (420x640) ── */
var WALLS=[
  /* outer shell */
  [[12,90],[12,560]], [[12,90],[52,28]], [[52,28],[150,12]], [[150,12],[270,12]],
  [[270,12],[368,28]], [[368,28],[408,90]], [[408,90],[408,560]],
  /* launch lane inner wall */
  [[376,150],[376,556]],
  /* top lane deflector guiding launched balls left */
  [[376,150],[340,66]],
  /* bottom funnels to flippers */
  [[12,560],[146,614]], [[408,560],[376,556]], [[376,556],[274,614]],
  /* slingshot walls */
  [[70,470],[120,540]], [[120,540],[70,520]], [[70,520],[70,470]],
  [[350,470],[300,540]], [[300,540],[350,520]], [[350,520],[350,470]]
];
var BUMPERS=[
  { x:140, y:170, r:27 }, { x:280, y:170, r:27 }, { x:210, y:280, r:27 }
];
var FLIP={
  left:  { px:146, py:614, len:64, rest:0.52, up:-0.42, ang:0.52, target:0.52, dir:1 },
  right: { px:274, py:614, len:64, rest:Math.PI-0.52, up:Math.PI+0.42, ang:Math.PI-0.52, target:Math.PI-0.52, dir:-1 }
};
var G={ score:0, ball:1, best:0, over:false, inPlay:false,
  b:{ x:393, y:540, vx:0, vy:0, r:9 }, flash:[0,0,0], muted:false };
try{ G.best=+localStorage.getItem(KEY)||0; }catch(e){}

/* ── audio: tiny synth, born on demand ── */
function quack(freq, dur){
  if(G.muted) return;
  try{
    var a=quack.ac||(quack.ac=new (window.AudioContext||window.webkitAudioContext)());
    var o=a.createOscillator(), g2=a.createGain();
    o.type='square'; o.frequency.setValueAtTime(freq, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*0.55, a.currentTime+dur);
    g2.gain.setValueAtTime(0.05, a.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g2); g2.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.02);
  }catch(e){}
}

/* ── physics ── */
function flipTip(f){
  return [ f.px+Math.cos(f.ang)*f.len, f.py+Math.sin(f.ang)*f.len ];
}
function collideSeg(b, x1,y1,x2,y2, e, surfVel){
  var dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  var t=L2? Math.max(0, Math.min(1, ((b.x-x1)*dx+(b.y-y1)*dy)/L2)) : 0;
  var cxp=x1+t*dx, cyp=y1+t*dy;
  var nx=b.x-cxp, ny=b.y-cyp, d=Math.sqrt(nx*nx+ny*ny);
  var pad=b.r+4;
  if(d>=pad || d===0) return false;
  nx/=d; ny/=d;
  b.x=cxp+nx*pad; b.y=cyp+ny*pad;
  var sv=surfVel? surfVel(t) : [0,0];
  var rvx=b.vx-sv[0], rvy=b.vy-sv[1];
  var dot=rvx*nx+rvy*ny;
  if(dot<0){
    b.vx-=(1+e)*dot*nx;
    b.vy-=(1+e)*dot*ny;
  }
  return true;
}
var OMEGA=22;
function step(dt){
  if(!G.inPlay) return;
  var b=G.b;
  /* flipper angles chase their targets */
  ['left','right'].forEach(function(k){
    var f=FLIP[k];
    var d=f.target-f.ang;
    var mv=Math.sign(d)*Math.min(Math.abs(d), OMEGA*dt);
    f.ang+=mv; f.avel=mv/dt||0;
  });
  var sub=3, h=dt/sub;
  for(var s=0;s<sub;s++){
    b.vy+=900*h;
    b.x+=b.vx*h; b.y+=b.vy*h;
    WALLS.forEach(function(w){ collideSeg(b, w[0][0],w[0][1],w[1][0],w[1][1], 0.55); });
    /* slingshot kick zones are just walls with the same restitution — bumpers do the shouting */
    BUMPERS.forEach(function(bp,i){
      var dx=b.x-bp.x, dy=b.y-bp.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<bp.r+b.r && d>0){
        var nx=dx/d, ny=dy/d;
        b.x=bp.x+nx*(bp.r+b.r);
        b.y=bp.y+ny*(bp.r+b.r);
        var dot=b.vx*nx+b.vy*ny;
        if(dot<0){ b.vx-=2*dot*nx; b.vy-=2*dot*ny; }
        b.vx+=nx*260; b.vy+=ny*260;
        G.score+=100; G.flash[i]=1;
        quack(300+i*60, 0.12);
        hud();
      }
    });
    ['left','right'].forEach(function(k){
      var f=FLIP[k], tip=flipTip(f);
      collideSeg(b, f.px, f.py, tip[0], tip[1], 0.35, function(t){
        var rx=(f.px+ (tip[0]-f.px)*t)-f.px, ry=(f.py+(tip[1]-f.py)*t)-f.py;
        return [ -f.avel*ry, f.avel*rx ];
      });
    });
    /* drain */
    if(b.y>648+b.r){ drain(); return; }
  }
  /* cap runaway speed */
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(sp>1100){ b.vx*=1100/sp; b.vy*=1100/sp; }
}
function drain(){
  G.inPlay=false;
  quack(160, 0.3);
  if(G.ball>=3){
    G.over=true;
    if(G.score>G.best){ G.best=G.score; try{ localStorage.setItem(KEY, String(G.best)); }catch(e){} }
    say('game over — '+G.score+' points. R starts a new hunt.');
  }else{
    G.ball++;
    resetBall();
    say('ball drained — '+(4-G.ball)+' left. Space to launch.');
  }
  hud();
}
function resetBall(){ G.b={ x:393, y:540, vx:0, vy:0, r:9 }; }
function launch(){
  if(G.over || G.inPlay) return;
  resetBall();
  G.b.vy=-(920+Math.random()*140);
  G.inPlay=true;
  quack(520, 0.1);
  say('duck hunt live — flip!');
}
function resetGame(){
  G.score=0; G.ball=1; G.over=false; G.inPlay=false;
  resetBall(); hud();
  say('fresh table. Space to launch.');
}
function hud(){
  $('score').textContent=G.score;
  $('balls').textContent=Math.min(G.ball,3)+'/3';
  $('best').textContent=G.best;
}
function say(t){ $('status').textContent=t; }

/* ── input ── */
function setFlip(k, up){
  var f=FLIP[k];
  f.target=up? f.up : f.rest;
  if(up) quack(700,0.05);
}
addEventListener('keydown', function(e){
  if(e.code==='ArrowLeft'){ e.preventDefault(); setFlip('left', true); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); setFlip('right', true); }
  else if(e.code==='Space'){ e.preventDefault(); launch(); }
  else if(e.key==='r'||e.key==='R'){ resetGame(); }
  else if(e.key==='m'||e.key==='M'){ $('mute').click(); }
});
addEventListener('keyup', function(e){
  if(e.code==='ArrowLeft') setFlip('left', false);
  else if(e.code==='ArrowRight') setFlip('right', false);
});
[['t-left','left'],['t-right','right']].forEach(function(p){
  var el=$(p[0]);
  ['pointerdown','touchstart'].forEach(function(ev){ el.addEventListener(ev, function(e){ e.preventDefault(); setFlip(p[1], true); }); });
  ['pointerup','pointercancel','touchend'].forEach(function(ev){ el.addEventListener(ev, function(){ setFlip(p[1], false); }); });
});
$('t-launch').addEventListener('click', launch);
$('reset').addEventListener('click', resetGame);
$('mute').addEventListener('click', function(){
  G.muted=!G.muted;
  this.setAttribute('aria-pressed', String(G.muted));
  this.textContent=G.muted? '♪ sound: off':'♪ sound: on';
});

/* ── render ── */
function duck(x,y,r,glow){
  cx.save();
  cx.shadowColor='rgba(255,216,62,'+(0.5+glow*0.5)+')';
  cx.shadowBlur=14+glow*18;
  cx.fillStyle=glow>0.4? '#fff3b0' : 'var(--duck)';
  cx.fillStyle=glow>0.4? '#fff3b0' : '#ffd83e';
  cx.beginPath(); cx.arc(x, y+r*0.18, r*0.82, 0, 7); cx.fill();          /* body */
  cx.beginPath(); cx.arc(x+r*0.34, y-r*0.42, r*0.5, 0, 7); cx.fill();    /* head */
  cx.fillStyle='#ff8a3e';
  cx.fillRect(x+r*0.72, y-r*0.58, r*0.5, r*0.3);                          /* beak */
  cx.fillStyle='#101018';
  cx.beginPath(); cx.arc(x+r*0.42, y-r*0.52, r*0.1, 0, 7); cx.fill();     /* eye */
  cx.strokeStyle='rgba(255,216,62,.8)'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.stroke();                     /* bumper ring */
  cx.restore();
}
function draw(){
  cx.clearRect(0,0,420,640);
  /* glow walls */
  cx.save();
  cx.strokeStyle='#3ee8ff'; cx.lineWidth=3; cx.shadowColor='rgba(62,232,255,.55)'; cx.shadowBlur=10;
  WALLS.forEach(function(w){
    cx.beginPath(); cx.moveTo(w[0][0],w[0][1]); cx.lineTo(w[1][0],w[1][1]); cx.stroke();
  });
  cx.restore();
  BUMPERS.forEach(function(bp,i){
    duck(bp.x, bp.y, bp.r, G.flash[i]);
    G.flash[i]=Math.max(0, G.flash[i]-0.06);
  });
  /* flippers */
  ['left','right'].forEach(function(k){
    var f=FLIP[k], tip=flipTip(f);
    cx.save();
    cx.strokeStyle='#ff3ea8'; cx.lineWidth=10; cx.lineCap='round';
    cx.shadowColor='rgba(255,62,168,.6)'; cx.shadowBlur=14;
    cx.beginPath(); cx.moveTo(f.px,f.py); cx.lineTo(tip[0],tip[1]); cx.stroke();
    cx.restore();
  });
  /* ball */
  if(G.inPlay || !G.over){
    cx.save();
    cx.fillStyle='#eef0ff'; cx.shadowColor='rgba(238,240,255,.8)'; cx.shadowBlur=12;
    cx.beginPath(); cx.arc(G.b.x, G.b.y, G.b.r, 0, 7); cx.fill();
    cx.restore();
  }
  if(G.over){
    cx.fillStyle='rgba(7,7,15,.72)'; cx.fillRect(0,0,420,640);
    cx.fillStyle='#ff3ea8'; cx.font='700 34px ui-monospace, monospace'; cx.textAlign='center';
    cx.fillText('GAME OVER', 210, 300);
    cx.fillStyle='#3ee8ff'; cx.font='700 18px ui-monospace, monospace';
    cx.fillText(G.score+' PTS · R TO RESET', 210, 336);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05, (t-last)/1000||0.016);
  last=t;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
hud();
requestAnimationFrame(loop);
window.__DP={ G:G, FLIP:FLIP, BUMPERS:BUMPERS, WALLS:WALLS, step:step, launch:launch,
  resetGame:resetGame, drain:drain, setFlip:setFlip, collideSeg:collideSeg };
})();
</script>
</body>
</html>
