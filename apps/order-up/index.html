<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Up! — the diner ticket to-do list</title>
<meta name="description" content="Your to-dos are diner tickets on the kitchen rail. Done? Ring the bell and slam it on the spike.">
<link rel="icon" href="https://emojicdn.elk.sh/🛎️?style=apple&size=64">
<meta property="og:title" content="Order Up!">
<meta property="og:description" content="Your to-dos are diner tickets on the kitchen rail. Done? Ring the bell and slam it on the spike.">
<meta property="og:url" content="https://app.sloppy.live/order-up/">
<meta property="og:image" content="https://app.sloppy.live/order-up/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#e9e2d0; --tile2:#d9d0b8; --grout:#bfb398;
  --steel:#9aa3a8; --steel-hi:#e6ecef; --steel-lo:#5d666b;
  --paper:#fffbe9; --paper-old:#f3dfa2; --ink:#20304f; --pencil:#3b3b45;
  --red:#d6342b; --mint:#7fc8b2; --chrome:#c9d1d4; --counter:#1d6f6a; --counter-hi:#2a8f88;
  --rowh:176px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Kalam',cursive; color:var(--ink);
  background:
    linear-gradient(rgba(255,255,255,.0),rgba(0,0,0,.08)),
    conic-gradient(from 90deg at 2px 2px, var(--grout) 90deg, transparent 0) 0 0/44px 44px,
    linear-gradient(45deg, var(--tile) 25%, var(--tile2) 25% 50%, var(--tile) 50% 75%, var(--tile2) 75%) 0 0/88px 88px;
  min-height:100vh; display:flex; flex-direction:column;
}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:1.7rem clamp(1rem,4vw,2.5rem) .4rem;flex-wrap:wrap}
h1{font-family:'Shrikhand',cursive;font-weight:400;margin:0;font-size:clamp(2.4rem,8vw,4.6rem);line-height:.9;color:var(--red);
  text-shadow:3px 3px 0 #fff, 6px 6px 0 rgba(32,48,79,.18);transform:rotate(-3deg);transform-origin:left bottom;animation:sign .7s cubic-bezier(.2,1.6,.4,1) both}
h1 small{display:block;font-family:'Courier Prime',monospace;font-size:.78rem;font-weight:700;letter-spacing:.32em;color:var(--ink);text-shadow:none;margin:.5rem 0 0 .2rem}
@keyframes sign{from{transform:rotate(-12deg) scale(.6)}}
.board{font-family:'Courier Prime',monospace;font-weight:700;background:#1b1b1f;color:#f6efd8;padding:.45rem .8rem;border-radius:.35rem;box-shadow:inset 0 0 0 3px #3a3a42, 0 6px 14px rgba(0,0,0,.2);font-size:.85rem;letter-spacing:.06em;text-align:right;line-height:1.35}
.board b{color:var(--mint);font-size:1.4rem}

main{flex:1;padding:0 clamp(.6rem,3vw,2rem) 1rem;display:flex;flex-direction:column;gap:.6rem}
/* the rail: rows of steel bars, tickets hang from them */
#rail{position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 .9rem;padding:0 .6rem;min-height:var(--rowh);
  background:repeating-linear-gradient(to bottom, transparent 0 6px, var(--steel-hi) 6px 8px, var(--steel) 8px 13px, var(--steel-lo) 13px 16px, transparent 16px var(--rowh));
  border-radius:.4rem}
#rail:empty::after{content:'the rail is empty — the kitchen is calm';position:absolute;left:50%;top:58px;transform:translateX(-50%);white-space:nowrap;font-family:'Courier Prime',monospace;font-size:.95rem;color:#7a705a;letter-spacing:.04em}
.tk{position:relative;width:148px;height:calc(var(--rowh) - 14px);margin-top:4px;flex:0 0 auto;cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;text-align:left;
  transform-origin:50% 8px;transform:rotate(var(--r,0deg));animation:slidein .5s cubic-bezier(.2,1.3,.4,1) both;transition:transform .2s}
.tk:hover{transform:rotate(calc(var(--r,0deg) * -1)) translateY(2px)}
.tk:focus-visible{outline:none}
.tk:focus-visible .slip{box-shadow:0 0 0 4px var(--red), 0 8px 14px rgba(0,0,0,.18)}
@keyframes slidein{from{transform:translateX(60vw) rotate(14deg);opacity:0}}
.clip{position:absolute;left:50%;top:0;width:34px;height:16px;transform:translateX(-50%);z-index:2;border-radius:3px 3px 6px 6px;
  background:linear-gradient(var(--steel-hi),var(--chrome) 40%,var(--steel-lo));box-shadow:0 2px 2px rgba(0,0,0,.25)}
.slip{position:absolute;inset:9px 0 0 0;background:var(--pp,var(--paper));padding:16px 10px 10px;display:flex;flex-direction:column;
  box-shadow:0 8px 14px rgba(0,0,0,.18);clip-path:polygon(0 0,100% 0,100% 94%,92% 100%,84% 95%,76% 100%,68% 95%,60% 100%,52% 95%,44% 100%,36% 95%,28% 100%,20% 95%,12% 100%,4% 95%,0 100%);
  background-image:repeating-linear-gradient(to bottom, transparent 0 22px, rgba(32,48,79,.13) 22px 23px);background-position:0 40px}
.slip .no{font-family:'Courier Prime',monospace;font-weight:700;font-size:.72rem;display:flex;justify-content:space-between;color:var(--red);border-bottom:1.5px dashed rgba(214,52,43,.5);padding-bottom:3px;margin-bottom:4px}
.slip .txt{font-size:1.06rem;line-height:23px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;word-break:break-word;color:var(--ink)}
.stamp{position:absolute;right:6px;bottom:16px;font-family:'Courier Prime',monospace;font-weight:700;font-size:.7rem;letter-spacing:.08em;color:var(--red);border:2px solid var(--red);padding:0 4px;transform:rotate(-12deg);opacity:.75;border-radius:3px}
.tk.old .slip{--pp:var(--paper-old)}
.tk.rush .slip .no{color:#fff;background:var(--red);border-color:var(--red);margin:-16px -10px 4px;padding:3px 10px}
.tk.flying{animation:none;transition:transform .55s cubic-bezier(.5,-.3,.6,1),opacity .55s;pointer-events:none;z-index:9}
.tk.gone{animation:none;transition:transform .3s,opacity .3s;transform:translateY(-30px) rotate(-30deg) scale(.6);opacity:0}

/* counter: pad + bell + spike */
.counter{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(var(--counter-hi),var(--counter) 30%);padding:.8rem clamp(.8rem,3vw,2rem) calc(.8rem + env(safe-area-inset-bottom));
  box-shadow:0 -6px 0 #e9eef0, 0 -9px 0 var(--steel), 0 -14px 24px rgba(0,0,0,.12);display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap}
form{flex:1 1 280px;display:flex;gap:.5rem;align-items:stretch}
.pad{flex:1;position:relative;background:var(--paper);border-radius:3px;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:rotate(-.6deg)}
.pad::before{content:'GUEST CHECK';position:absolute;left:10px;top:4px;font-family:'Courier Prime',monospace;font-weight:700;font-size:.62rem;letter-spacing:.2em;color:var(--red)}
.pad input{width:100%;border:0;background:transparent;font:700 1.15rem 'Kalam',cursive;color:var(--ink);padding:18px 10px 6px;outline:none}
.pad:focus-within{box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 3px #fff,0 0 0 6px var(--red)}
.pad input::placeholder{color:#9a917c;font-weight:400}
.rushbtn{border:2px solid #fff;background:transparent;color:#fff;font:700 .78rem 'Courier Prime',monospace;letter-spacing:.06em;padding:0 .7rem;border-radius:.4rem;cursor:pointer}
.rushbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.send{border:0;border-radius:.4rem;background:#fff;color:var(--counter);font:400 1.15rem 'Shrikhand',cursive;padding:0 1rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.send:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.spikebox{display:flex;align-items:flex-end;gap:.8rem}
#bell{width:62px;height:52px;border:0;background:none;cursor:pointer;padding:0;position:relative}
#bell svg{width:100%;height:100%;overflow:visible}
#bell.ding svg{animation:ding .45s}
@keyframes ding{20%{transform:rotate(-10deg) translateY(-3px)}50%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
#spike{position:relative;width:74px;height:104px;border:0;background:none;cursor:pointer;padding:0}
#spike .nail{position:absolute;left:50%;bottom:12px;width:34px;height:96px;transform:translateX(-30%);overflow:visible} /* a safety spike: the top bends over into a hook with a rounded tip (Tatum) */
#spike .base{position:absolute;left:50%;bottom:0;width:62px;height:14px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--steel-hi),var(--steel-lo));box-shadow:0 3px 0 rgba(0,0,0,.25)}
#spike .stack{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:66px;z-index:1;display:flex;flex-direction:column-reverse;align-items:center}
#spike .stack i{display:block;width:58px;height:4px;margin-top:-1px;background:var(--paper);border-radius:1px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
#spike .stack i:nth-child(3n){transform:rotate(4deg) translateX(3px);background:var(--paper-old)}
#spike .stack i:nth-child(3n+1){transform:rotate(-3deg) translateX(-2px)}
#spike .count{position:absolute;left:-10px;top:10px;z-index:2;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font:700 .85rem 'Courier Prime',monospace;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#spike.thunk{animation:thunk .25s}
@keyframes thunk{40%{transform:translateY(4px) scaleY(.94)}}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.2rem 0 .6rem}
.tools button{font:700 .78rem 'Courier Prime',monospace;letter-spacing:.04em;background:rgba(255,255,255,.55);color:var(--ink);border:1.5px solid rgba(32,48,79,.35);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.tools button:focus-visible{outline:3px solid var(--red)}
.hint{font-family:'Courier Prime',monospace;font-size:.8rem;color:#6d6450;text-align:center;margin:.2rem 0 0;transition:opacity .6s}
.hint[hidden]{display:none}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) rotate(-4deg) scale(.6);font:400 clamp(2.6rem,10vw,5rem) 'Shrikhand',cursive;color:var(--red);text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.15);pointer-events:none;opacity:0;z-index:20}
.toast.on{animation:toast 1s ease-out}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) rotate(-4deg) scale(.6)}20%{opacity:1;transform:translateX(-50%) rotate(-4deg) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) rotate(-4deg) translateY(-30px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
dialog{border:0;border-radius:.5rem;padding:0;max-width:min(92vw,360px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(29,40,50,.45)}
.dlg{background:var(--paper);padding:1rem 1.1rem 1.1rem;background-image:repeating-linear-gradient(to bottom, transparent 0 26px, rgba(32,48,79,.12) 26px 27px)}
.dlg h2{font:700 .85rem 'Courier Prime',monospace;letter-spacing:.16em;color:var(--red);margin:0 0 .5rem}
.dlg textarea{width:100%;min-height:5.5rem;border:1.5px dashed rgba(32,48,79,.35);background:rgba(255,255,255,.5);font:700 1.1rem 'Kalam',cursive;color:var(--ink);padding:.4rem;resize:vertical}
.dlg .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.dlg .row button{flex:1 1 auto;font:700 .85rem 'Courier Prime',monospace;border-radius:.35rem;padding:.55rem .6rem;cursor:pointer;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.dlg .row .up{background:var(--counter);border-color:var(--counter);color:#fff}
.dlg .row .del{border-color:var(--red);color:var(--red)}
.dlg .row button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:520px){
  :root{--rowh:156px}
  .tk{width:calc(50% - .5rem)}
  #rail{gap:0 .9rem;padding:0 .2rem}
  .board{font-size:.75rem}
  .spikebox{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Order Up!<small>THE KITCHEN RAIL · EST. TODAY</small></h1>
  <div class="board" aria-live="polite"><span id="onRail">0 on the rail</span><br>spiked today <b id="today">0</b></div>
</header>
<main>
  <p class="hint" id="hint">write a ticket below · tap a ticket when it's done</p>
  <div id="rail" role="list" aria-label="Tickets on the rail"></div>
  <div class="tools">
    <button type="button" id="clearSpike">empty the spike</button>
  </div>
</main>
<div class="counter">
  <form id="f" autocomplete="off">
    <label class="pad"><span class="sr">New ticket</span><input id="inp" maxlength="120" placeholder="what's the order?" enterkeyhint="send"></label>
    <button type="button" class="rushbtn" id="rush" aria-pressed="false" title="mark it RUSH">RUSH</button>
    <button class="send" type="submit">fire!</button>
  </form>
  <div class="spikebox">
    <button id="bell" type="button" aria-label="Ring the bell: spike the oldest ticket">
      <svg viewBox="0 0 62 52" aria-hidden="true"><rect x="27" y="2" width="8" height="7" rx="3" fill="#5d666b"/><path d="M8 40 C8 18 20 8 31 8 C42 8 54 18 54 40 Z" fill="url(#bg)"/><ellipse cx="22" cy="22" rx="5" ry="9" fill="#fff" opacity=".55" transform="rotate(30 22 22)"/><rect x="2" y="40" width="58" height="8" rx="4" fill="#3a3a42"/><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f7e39b"/><stop offset=".5" stop-color="#e2b84a"/><stop offset="1" stop-color="#a87b1f"/></linearGradient></defs></svg>
    </button>
    <button id="spike" type="button" aria-label="The spike: tap to pull the last ticket back onto the rail">
      <span class="stack" id="stack"></span><svg class="nail" viewBox="0 0 34 96" aria-hidden="true"><defs><linearGradient id="stl" x1="0" x2="1"><stop offset="0" stop-color="#5d666b"/><stop offset=".45" stop-color="#e6ecef"/><stop offset="1" stop-color="#9aa3a8"/></linearGradient></defs><path d="M10 96 V24 Q10 6 21 6 Q31 6 31 16 Q31 23 25 24" fill="none" stroke="url(#stl)" stroke-width="4.5" stroke-linecap="round"/><path d="M9 92 V26 Q9 9 18 7" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/><circle cx="25" cy="24" r="3.2" fill="#c9d1d4" stroke="#5d666b" stroke-width="1"/></svg><span class="base"></span><span class="count" id="cnt">0</span>
    </button>
  </div>
</div>
<div class="toast" id="toast" aria-hidden="true">ORDER UP!</div>
<div class="sr" id="say" aria-live="assertive"></div>
<dialog id="dlg"><form method="dialog" class="dlg">
  <h2 id="dlgNo">TICKET #000</h2>
  <label class="sr" for="dlgTxt">Ticket text</label>
  <textarea id="dlgTxt" maxlength="120"></textarea>
  <div class="row">
    <button value="up" class="up" type="submit">🛎 order up</button>
    <button value="save" type="submit">keep it</button>
    <button value="rush" type="submit" id="dlgRush">rush</button>
    <button value="86" class="del" type="submit" title="86 = cancel the order">86 it</button>
  </div>
</form></dialog>
<script>
(function(){
  const KEY = 'order-up-v1';
  const $ = id => document.getElementById(id);
  let S = { n: 0, rail: [], spike: [] };
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && Array.isArray(j.rail)) S = Object.assign(S, j); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const say = t => { $('say').textContent = ''; setTimeout(() => { $('say').textContent = t; }, 30); };
  const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const ago = t => { const h = (Date.now() - t) / 36e5; return h < 1 ? Math.max(1, Math.round(h * 60)) + 'm' : h < 48 ? Math.round(h) + 'h' : Math.round(h / 24) + 'd'; };
  const tilt = id => ((id * 7919) % 9 - 4) * 0.6;

  // sound: a little counter bell, the paper thunk
  let AC = null;
  const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; };
  function bell() {
    const a = ac(); if (!a) return; const t = a.currentTime;
    [[2093, 1], [2637, .45], [5280, .18], [3136, .25]].forEach(([f, g]) => {
      const o = a.createOscillator(), v = a.createGain(); o.type = 'sine'; o.frequency.value = f;
      v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.16 * g, t + .004); v.gain.exponentialRampToValueAtTime(.0001, t + 1.6 * (f > 4000 ? .4 : 1));
      o.connect(v).connect(a.destination); o.start(t); o.stop(t + 1.7);
    });
  }
  function thunk(delay) {
    const a = ac(); if (!a) return; const t = a.currentTime + (delay || 0);
    const len = .12, b = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = 900; v.gain.value = .5;
    s.connect(f).connect(v).connect(a.destination); s.start(t);
  }
  function paper() {
    const a = ac(); if (!a) return; const t = a.currentTime;
    const len = .18, b = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length) * .6;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = 'highpass'; f.frequency.value = 2500; v.gain.value = .18;
    s.connect(f).connect(v).connect(a.destination); s.start(t);
  }

  function render(newId) {
    const rail = $('rail'); rail.textContent = '';
    S.rail.forEach(tk => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'tk'; b.setAttribute('role', 'listitem');
      b.dataset.id = tk.id; b.style.setProperty('--r', tilt(tk.id) + 'deg');
      const age = Date.now() - tk.t;
      if (age > 864e5) b.classList.add('old');
      if (tk.rush) b.classList.add('rush');
      if (tk.id !== newId) b.style.animation = 'none';
      b.setAttribute('aria-label', `Ticket ${tk.id}${tk.rush ? ', rush' : ''}: ${tk.txt}. Written ${ago(tk.t)} ago. Tap to open.`);
      b.innerHTML = '<span class="clip"></span><span class="slip"><span class="no"><span></span><span></span></span><span class="txt"></span></span>';
      const no = b.querySelector('.no').children; no[0].textContent = '#' + String(tk.id).padStart(3, '0'); no[1].textContent = tk.rush ? 'RUSH!' : hhmm(tk.t);
      b.querySelector('.txt').textContent = tk.txt;
      if (age > 864e5) { const st = document.createElement('span'); st.className = 'stamp'; st.textContent = age > 3 * 864e5 ? 'STALE' : 'AGING ' + ago(tk.t); b.querySelector('.slip').appendChild(st); }
      b.addEventListener('click', () => openTk(tk.id));
      rail.appendChild(b);
    });
    const today = S.spike.filter(s => s.done >= dayStart()).length;
    $('today').textContent = today; $('cnt').textContent = S.spike.length;
    $('onRail').textContent = S.rail.length + (S.rail.length === 1 ? ' ticket' : ' tickets') + ' on the rail';
    const st = $('stack'); st.textContent = '';
    for (let i = 0; i < Math.min(S.spike.length, 18); i++) st.appendChild(document.createElement('i'));
    $('clearSpike').hidden = !S.spike.length;
    $('hint').hidden = S.n > 2 && S.spike.length > 0;
  }

  // fire a new ticket
  let rush = false;
  $('rush').addEventListener('click', () => { rush = !rush; $('rush').setAttribute('aria-pressed', rush); });
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    const txt = $('inp').value.trim(); if (!txt) { $('inp').focus(); return; }
    const tk = { id: ++S.n, txt, t: Date.now(), rush };
    if (rush) S.rail.unshift(tk); else S.rail.push(tk);
    rush = false; $('rush').setAttribute('aria-pressed', 'false');
    $('inp').value = ''; save(); render(tk.id); paper(); say(`Ticket ${tk.id} is on the rail.`);
  });

  // order up: the ticket flies onto the spike
  function orderUp(id) {
    const i = S.rail.findIndex(t => t.id === id); if (i < 0) return;
    const tk = S.rail[i], el = document.querySelector(`.tk[data-id="${id}"]`), sp = $('spike');
    bell(); $('bell').classList.remove('ding'); void $('bell').offsetWidth; $('bell').classList.add('ding');
    const tt = $('toast'); tt.classList.remove('on'); void tt.offsetWidth; tt.classList.add('on');
    const finish = () => {
      S.rail.splice(S.rail.indexOf(tk), 1); tk.done = Date.now(); S.spike.push(tk); save(); render();
      sp.classList.remove('thunk'); void sp.offsetWidth; sp.classList.add('thunk');
      say(`Order up! Ticket ${tk.id} is on the spike.`);
    };
    if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const a = el.getBoundingClientRect(), b = sp.getBoundingClientRect();
      el.classList.add('flying');
      el.style.transform = `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px, ${b.top + 20 - (a.top + a.height / 2)}px) rotate(${(id % 2 ? 1 : -1) * 70}deg) scale(.32)`;
      el.style.opacity = '.2';
      thunk(.5); setTimeout(finish, 520);
    } else { thunk(); finish(); }
  }
  $('bell').addEventListener('click', () => {
    if (!S.rail.length) { bell(); $('bell').classList.remove('ding'); void $('bell').offsetWidth; $('bell').classList.add('ding'); say('Nothing on the rail.'); return; }
    orderUp(S.rail[0].id);
  });
  // tap the spike: pull the last ticket back
  $('spike').addEventListener('click', () => {
    const tk = S.spike.pop(); if (!tk) return;
    delete tk.done; S.rail.unshift(tk); save(); render(tk.id); paper(); say(`Ticket ${tk.id} is back on the rail.`);
  });
  $('clearSpike').addEventListener('click', () => {
    if (!S.spike.length) return;
    const b = $('clearSpike');
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = `bin all ${S.spike.length}? tap again`; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'empty the spike'; }, 3000); return; }
    S.spike = []; b.dataset.sure = ''; b.textContent = 'empty the spike'; save(); render(); say('The spike is empty.');
  });

  // open a ticket: order up, edit, rush, 86
  let cur = null;
  function openTk(id) {
    const tk = S.rail.find(t => t.id === id); if (!tk) return;
    cur = id; $('dlgNo').textContent = 'TICKET #' + String(id).padStart(3, '0') + ' · ' + hhmm(tk.t);
    $('dlgTxt').value = tk.txt; $('dlgRush').textContent = tk.rush ? 'no rush' : 'rush';
    if ($('dlg').showModal) { $('dlg').showModal(); $('dlg').querySelector('.up').focus(); } else orderUp(id);
  }
  $('dlg').addEventListener('close', () => {
    const v = $('dlg').returnValue, tk = S.rail.find(t => t.id === cur); if (!tk) return;
    const txt = $('dlgTxt').value.trim(); if (txt) tk.txt = txt;
    if (v === 'up') { save(); render(); orderUp(tk.id); return; }
    if (v === 'rush') { tk.rush = !tk.rush; S.rail.splice(S.rail.indexOf(tk), 1); if (tk.rush) S.rail.unshift(tk); else S.rail.push(tk); }
    if (v === '86') {
      const el = document.querySelector(`.tk[data-id="${tk.id}"]`);
      S.rail.splice(S.rail.indexOf(tk), 1); save(); say(`Ticket ${tk.id} 86'd.`);
      if (el) { el.classList.add('gone'); setTimeout(render, 300); } else render();
      return;
    }
    save(); render();
  });

  // first visit: three tickets to show how it works
  if (!S.n) {
    const now = Date.now();
    S.rail = [{ id: 1, txt: 'tap me when it’s done', t: now - 6e5 }, { id: 2, txt: 'water the basil', t: now - 3e5 }, { id: 3, txt: 'call grandma back', t: now - 9e4, rush: true }];
    S.rail.unshift(S.rail.pop()); S.n = 3; save();
  }
  render();
  setInterval(render, 60000);
})();
</script>
</body>
