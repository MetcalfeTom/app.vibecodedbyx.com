<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sloppy Slack — the pond, professionally</title>
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%AA%B7" />
<meta name="description" content="Real-time chat for pond professionals — dark as the deep end. Persistent channels, DMs, threaded ripples, creature identities." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Sloppy Slack" />
<meta property="og:description" content="Real-time pond chat: persistent channels, DMs, threads. Join as a creature. The deep end is dark now." />
<meta property="og:url" content="https://sloppy.live/sloppy-slack/" />
<meta property="og:image" content="https://image.pollinations.ai/prompt/a%20dark%20mode%20workplace%20chat%20app%20underwater%20in%20a%20midnight%20pond%2C%20lily%20pads%2C%20glowing%20green%20accents%2C%20frogs%20chatting%20in%20threads%2C%20deep%20charcoal%20and%20lily%20green%2C%20soft%20ui%20illustration?width=1200&height=630&nologo=true&seed=6002" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --deep:#070c0a; --panel:#0e1a14; --panel2:#0a1410; --edge:#1a2f24;
  --lily:#8ad973; --lily-deep:#3f7a30; --cream:#eae4d2; --dim:#93ac99;
  --coral:#ff8265; --ripple:rgba(127,206,106,.22); --bright:#f6f1e2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html,body{height:100%}
body{
  background:var(--deep); color:var(--cream); font-family:'Sora',sans-serif; overflow:hidden;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 0%, rgba(127,206,106,.05), transparent 60%),
    radial-gradient(ellipse 50% 35% at 90% 100%, rgba(255,119,87,.04), transparent 60%);
}
.app{ display:grid; grid-template-columns:16rem minmax(0,1fr); height:100vh; }
.app.collapsed{ grid-template-columns:minmax(0,1fr); }
.app.collapsed .side{ display:none; }
.app.threaded{ grid-template-columns:16rem minmax(0,1fr) 20rem; }
.app.collapsed.threaded{ grid-template-columns:minmax(0,1fr) 20rem; }
/* ---- sidebar ---- */
.side{
  background:var(--panel2); border-right:1px solid var(--edge);
  display:flex; flex-direction:column; min-height:0;
}
.wshead{ padding:1rem 1rem .8rem; border-bottom:1px solid var(--edge); }
.wshead h1{ font-size:1.05rem; font-weight:800; letter-spacing:-.02em; }
.wshead h1 span{ color:var(--lily); }
.wshead .sub{ font-size:.62rem; color:var(--dim); font-family:'IBM Plex Mono',monospace; margin-top:.15rem; }
.conn{ display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:#d9a43a; margin-right:.3rem; vertical-align:middle; }
.conn.live{ background:var(--lily); box-shadow:0 0 6px var(--lily); }
.conn.dead{ background:var(--coral); }
.chead{
  display:flex; justify-content:space-between; align-items:center;
  padding:.8rem 1rem .25rem; font-size:.6rem; letter-spacing:.18em; color:var(--dim);
  font-family:'IBM Plex Mono',monospace;
}
.chead button{
  background:none; border:1px solid var(--edge); color:var(--dim); border-radius:.3rem;
  width:1.6rem; height:1.6rem; cursor:pointer; font-size:.9rem; line-height:1;
}
.chead button:hover{ color:var(--lily); border-color:var(--lily); }
.lists{ flex:1; overflow-y:auto; min-height:0; scrollbar-width:thin; scrollbar-color:var(--edge) transparent; }
.lists ul{ list-style:none; padding:.15rem .5rem .4rem; }
.lists li button{
  display:flex; justify-content:space-between; align-items:center; width:100%; gap:.4rem;
  background:none; border:none; color:var(--dim); font-family:'Sora',sans-serif;
  font-size:.82rem; text-align:left; padding:.4rem .6rem; border-radius:.4rem; cursor:pointer; min-height:2.2rem;
}
.lists li button:hover{ background:rgba(127,206,106,.07); color:var(--cream); }
.lists li button.active{ background:var(--lily-deep); color:#eaf5e4; font-weight:600; }
.lists li button .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.unread{
  background:var(--coral); color:#fff; font-size:.6rem; font-weight:800;
  border-radius:.8rem; padding:.05rem .4rem; font-family:'IBM Plex Mono',monospace; flex-shrink:0;
}
.dmempty{ font-size:.64rem; color:var(--dim); font-style:italic; padding:.1rem 1.1rem .4rem; }
.floaters{ border-top:1px solid var(--edge); padding:.6rem 1rem .8rem; }
.floaters .fhead{ font-size:.6rem; letter-spacing:.18em; color:var(--dim); font-family:'IBM Plex Mono',monospace; margin-bottom:.35rem; }
#floatList{ display:flex; flex-wrap:wrap; gap:.3rem; }
#floatList button{
  background:none; border:none; font-size:1.05rem; cursor:pointer; padding:.1rem;
  border-radius:.3rem; min-width:1.8rem; min-height:1.8rem;
}
#floatList button:hover{ background:rgba(127,206,106,.12); }
.me{
  border-top:1px solid var(--edge); padding:.55rem 1rem; display:flex; gap:.5rem; align-items:center;
  background:rgba(0,0,0,.2);
}
.me .mav{ font-size:1.25rem; }
.me .mname{ font-size:.74rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.me button{
  background:none; border:1px solid var(--edge); color:var(--dim); border-radius:.3rem;
  font-size:.6rem; padding:.25rem .5rem; cursor:pointer; font-family:'IBM Plex Mono',monospace; min-height:1.8rem;
}
.me button:hover{ color:var(--lily); border-color:var(--lily); }
/* ---- main ---- */
.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.mhead{
  padding:.75rem 1.1rem; border-bottom:1px solid var(--edge); background:var(--panel);
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
}
#sbBtn{
  background:none; border:1px solid var(--edge); color:var(--cream);
  border-radius:.4rem; padding:.3rem .55rem; cursor:pointer; font-size:.85rem; min-height:2.2rem;
}
#sbBtn:hover{ border-color:var(--lily); color:var(--lily); }
.mhead h2{ font-size:.98rem; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mhead h2 .hash{ color:var(--lily); margin-right:.15rem; }
.mhead .topic{ font-size:.68rem; color:var(--dim); font-style:italic; flex:1; min-width:8rem; }
#log{
  flex:1; overflow-y:auto; padding:.9rem 1.1rem; min-height:0; scrollbar-width:thin;
  scrollbar-color:var(--edge) transparent;
}
.day{
  text-align:center; font-size:.6rem; color:var(--dim); font-family:'IBM Plex Mono',monospace;
  letter-spacing:.14em; margin:.9rem 0 .5rem; position:relative;
}
.day::before,.day::after{ content:""; position:absolute; top:50%; width:32%; height:1px; background:var(--edge); }
.day::before{ left:0; } .day::after{ right:0; }
.msg{ display:flex; gap:.7rem; padding:.26rem .4rem; border-radius:.4rem; position:relative; }
.msg:hover{ background:rgba(255,255,255,.03); }
.msg .av{ font-size:1.45rem; width:2.1rem; text-align:center; flex-shrink:0; line-height:1.4; }
.msg.compact .av{ visibility:hidden; font-size:.6rem; }
.msg .body{ min-width:0; flex:1; }
.msg .who{ font-size:.8rem; font-weight:800; color:var(--bright); }
.msg .who time{ font-size:.62rem; color:#9db5a2; font-weight:400; font-family:'IBM Plex Mono',monospace; margin-left:.45rem; }
.msg .txt{ font-size:.88rem; font-weight:400; line-height:1.6; color:var(--bright); overflow-wrap:anywhere; white-space:pre-wrap; }
.msg.mine .who{ color:var(--lily); }
.replyBtn{
  position:absolute; top:.15rem; right:.4rem; display:none;
  background:var(--panel); border:1px solid var(--edge); color:var(--dim);
  font-size:.62rem; border-radius:.35rem; padding:.18rem .45rem; cursor:pointer; min-height:1.6rem;
  font-family:'IBM Plex Mono',monospace;
}
.msg:hover .replyBtn, .replyBtn:focus-visible{ display:inline-block; }
.replyBtn:hover{ color:var(--lily); border-color:var(--lily); }
.tchip{
  display:inline-flex; align-items:center; gap:.3rem; margin-top:.25rem;
  background:none; border:1px solid var(--edge); color:var(--lily);
  font-size:.64rem; border-radius:.4rem; padding:.2rem .5rem; cursor:pointer; min-height:1.7rem;
  font-family:'IBM Plex Mono',monospace;
}
.tchip:hover{ border-color:var(--lily); background:rgba(127,206,106,.08); }
@keyframes rippleIn{ from{ box-shadow:0 0 0 0 var(--ripple); } to{ box-shadow:0 0 0 14px rgba(127,206,106,0); } }
.msg.fresh{ animation:rippleIn .9s ease-out; }
.ripplebar{ min-height:1.15rem; padding:0 1.3rem; font-size:.64rem; color:var(--dim); font-style:italic; }
.composer{ padding:.4rem 1.1rem .9rem; }
.crow{
  display:flex; gap:.6rem; align-items:flex-end;
  background:var(--panel); border:1px solid var(--edge); border-radius:.8rem; padding:.45rem .55rem;
}
.crow:focus-within{ border-color:var(--lily-deep); }
.crow textarea{
  flex:1; background:none; border:none; color:var(--cream); font-family:'Sora',sans-serif;
  font-size:.88rem; font-weight:300; resize:none; max-height:8rem; min-height:1.4rem; outline:none; line-height:1.5;
}
.crow .sendbtn{
  background:var(--lily-deep); border:none; color:#eaf5e4; font-size:1.05rem;
  width:2.75rem; height:2.75rem; border-radius:50%; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:transform .1s;
}
.crow .sendbtn:hover{ background:var(--lily); color:#0a1410; }
.crow .sendbtn:active{ transform:scale(.92); }
.crow .sendbtn:disabled{ opacity:.5; cursor:wait; }
:focus-visible{ outline:3px solid var(--lily); outline-offset:2px; }
/* ---- thread panel ---- */
.thread{
  background:var(--panel2); border-left:1px solid var(--edge);
  display:none; flex-direction:column; min-height:0;
}
.app.threaded .thread{ display:flex; }
.thead{
  padding:.75rem 1rem; border-bottom:1px solid var(--edge); background:var(--panel);
  display:flex; justify-content:space-between; align-items:center;
}
.thead h3{ font-size:.85rem; font-weight:800; }
.thead h3 span{ color:var(--lily); }
.thead button{
  background:none; border:1px solid var(--edge); color:var(--dim); border-radius:.35rem;
  width:1.9rem; height:1.9rem; cursor:pointer; font-size:.85rem;
}
.thead button:hover{ color:var(--coral); border-color:var(--coral); }
#tparent{ padding:.7rem 1rem .5rem; border-bottom:1px dashed var(--edge); }
#tlog{ flex:1; overflow-y:auto; padding:.6rem 1rem; min-height:0; scrollbar-width:thin; }
.thread .composer{ padding:.4rem .9rem .9rem; }
/* overlays */
.ov{
  position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
  background:rgba(4,9,7,.75); padding:1rem;
}
.ov[hidden]{ display:none; }
.card{
  background:var(--panel); border:1px solid var(--edge); border-radius:.9rem;
  max-width:22rem; width:100%; padding:1.4rem 1.5rem;
}
.card h3{ font-size:1rem; font-weight:800; margin-bottom:.7rem; }
.card label{ display:block; font-size:.66rem; color:var(--dim); font-family:'IBM Plex Mono',monospace; margin:.6rem 0 .2rem; }
.card input{
  width:100%; background:var(--panel2); border:1px solid var(--edge); border-radius:.5rem;
  color:var(--cream); font-family:'Sora',sans-serif; font-size:.85rem; padding:.5rem .6rem; min-height:2.4rem;
}
.card input:focus{ border-color:var(--lily-deep); outline:none; }
.card .row{ display:flex; gap:.6rem; margin-top:1rem; }
.card .row button{
  flex:1; border-radius:.5rem; border:1px solid var(--edge); background:none; color:var(--dim);
  font-family:'Sora',sans-serif; font-size:.8rem; padding:.55rem; cursor:pointer; min-height:2.75rem;
}
.card .row button.primary{ background:var(--lily-deep); color:#eaf5e4; font-weight:600; border:none; }
.card .row button.primary:hover{ background:var(--lily); color:#0a1410; }
.card .err{ color:var(--coral); font-size:.68rem; min-height:1rem; margin-top:.4rem; }
@media (max-width:900px){
  .app.threaded{ grid-template-columns:16rem minmax(0,1fr); }
  .app.collapsed.threaded{ grid-template-columns:minmax(0,1fr); }
  .thread{ position:fixed; inset:0 0 0 22%; z-index:16; box-shadow:-6px 0 24px rgba(0,0,0,.5); }
}
@media (max-width:760px){
  .app, .app.threaded{ grid-template-columns:minmax(0,1fr); }
  .side{ position:fixed; inset:0 26% 0 0; z-index:15; transform:translateX(-105%); transition:transform .2s; box-shadow:4px 0 24px rgba(0,0,0,.5); }
  .side.open{ transform:none; }
  .app.collapsed .side{ display:flex; }
  .thread{ inset:0; }
}
@media (prefers-reduced-motion: reduce){ .msg.fresh{ animation:none; } .side{ transition:none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Channels, direct messages, creatures">
    <div class="wshead">
      <h1>Sloppy <span>Slack</span></h1>
      <div class="sub"><span class="conn" id="conn"></span><span id="connTxt">surfacing…</span></div>
    </div>
    <div class="lists">
      <div class="chead"><span>PONDS</span><button type="button" id="addChan" aria-label="Create a new channel">＋</button></div>
      <ul id="chanList" role="list"></ul>
      <div class="chead"><span>DIRECT RIPPLES</span></div>
      <p class="dmempty" id="dmEmpty">click a floater below to whisper</p>
      <ul id="dmList" role="list"></ul>
    </div>
    <div class="floaters">
      <div class="fhead">FLOATING NOW · <span id="floatCount">0</span></div>
      <div id="floatList" aria-label="Creatures online — click one to open a direct message"></div>
    </div>
    <div class="me">
      <span class="mav" id="meAv">🐸</span>
      <span class="mname" id="meName">…</span>
      <button type="button" id="renameBtn">rename</button>
    </div>
  </aside>

  <main class="main">
    <div class="mhead">
      <button type="button" id="sbBtn" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
      <h2 id="chanName">…</h2>
      <span class="topic" id="chanTopic"></span>
    </div>
    <div id="log" role="log" aria-live="polite" aria-label="Messages"></div>
    <div class="ripplebar" id="typing" aria-hidden="true"></div>
    <div class="composer">
      <div class="crow">
        <textarea id="input" rows="1" placeholder="release a ripple…" aria-label="Message" maxlength="500"></textarea>
        <button type="button" class="sendbtn" id="send" aria-label="Send message">🪷</button>
      </div>
    </div>
  </main>

  <aside class="thread" id="threadPane" aria-label="Thread">
    <div class="thead">
      <h3><span>🧵</span> Thread</h3>
      <button type="button" id="tClose" aria-label="Close thread">✕</button>
    </div>
    <div id="tparent"></div>
    <div id="tlog" role="log" aria-live="polite" aria-label="Thread replies"></div>
    <div class="composer">
      <div class="crow">
        <textarea id="tinput" rows="1" placeholder="ripple in this thread…" aria-label="Thread reply" maxlength="500"></textarea>
        <button type="button" class="sendbtn" id="tsend" aria-label="Send thread reply">🪷</button>
      </div>
    </div>
  </aside>
</div>

<div class="ov" id="chanOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="chanOvT">
    <h3 id="chanOvT">Dig a new pond</h3>
    <label for="ncName">name (lowercase, dashes)</label>
    <input id="ncName" maxlength="24" placeholder="deep-end" autocomplete="off" />
    <label for="ncTopic">topic</label>
    <input id="ncTopic" maxlength="80" placeholder="what ripples here?" autocomplete="off" />
    <p class="err" id="ncErr"></p>
    <div class="row">
      <button type="button" id="ncCancel">nevermind</button>
      <button type="button" class="primary" id="ncGo">dig it</button>
    </div>
  </div>
</div>
<div class="ov" id="nameOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="nameOvT">
    <h3 id="nameOvT">Who floats here?</h3>
    <label for="nmName">your creature name</label>
    <input id="nmName" maxlength="28" autocomplete="off" />
    <label for="nmAv">avatar (one emoji)</label>
    <input id="nmAv" maxlength="4" autocomplete="off" />
    <p class="err" id="nmErr"></p>
    <div class="row">
      <button type="button" id="nmCancel">nevermind</button>
      <button type="button" class="primary" id="nmGo">float on</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm";
const SB_URL='https://yjyxteqzhhmtrgcaekgz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqeXh0ZXF6aGhtdHJnY2Fla2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczNTg3NDIsImV4cCI6MjA3MjkzNDc0Mn0.G8SRde7IN2QFW1EnASM8IS32IUYR2eenCCjdDdioiBU';
const supabase=createClient(SB_URL, SB_KEY);
const $=id=>document.getElementById(id);

/* ---------- creature identity ---------- */
const AVS=['🐸','🦆','🐌','🦩','🪲','🦐','🐟','🦞','🐢','🦫','🦉','🪿'];
const FIRST=['Gerald','Bernard','Waverly','Tessa','Duckworth','Marlow','Sedge','Ripple','Puddle','Fen','Bog','Reed','Murk','Lily','Algae'];
const SUFFIX=['of the Shallows','(Pre-legs)','the Damp','from Accounts','Esq.','the Unmolted','of Runoff','· Thought Leader','the Patient','(on lily leave)'];
let ME=null;
try{ ME=JSON.parse(localStorage.getItem('sloppy-slack-id')||'null'); }catch(e){}
if(!ME || !ME.name || !ME.avatar){
  ME={ name: FIRST[Math.floor(Math.random()*FIRST.length)]+' '+SUFFIX[Math.floor(Math.random()*SUFFIX.length)],
       avatar: AVS[Math.floor(Math.random()*AVS.length)] };
  try{ localStorage.setItem('sloppy-slack-id', JSON.stringify(ME)); }catch(e){}
}
function showMe(){ $('meAv').textContent=ME.avatar; $('meName').textContent=ME.name; }
showMe();

/* ---------- state ---------- */
let session=null, channels=[], current=null, unread={}, sendCool=0, lastDay='', lastAuthor=null, lastTime=0;
let dms={};            // channel -> {name, avatar, unread}
let dmNames={};        // persisted labels for dm partners
try{ dmNames=JSON.parse(localStorage.getItem('sloppy-slack-dmnames')||'{}'); }catch(e){}
let threadIndex={};    // parentKey -> {count, replies:[]}
let openThread=null;   // {key, msg}
const DEFAULT_CHANNELS=[
  ['the-shallows','start here · water is warm · no predators before noon'],
  ['bread-ventures','duck startup talk · series A(nas) only'],
  ['molting-support','a safe space for shell talk'],
  ['deep-end','serious business · ties required (shrimp exempt, ironically)']
];
const SBNAME='the pond hears you';
function setConn(state,txt){
  $('conn').className='conn'+(state==='live'?' live':state==='dead'?' dead':'');
  $('connTxt').textContent=txt;
}
const msgKey=m=>((m.created_at||'')+'_'+(m.user_id||'')).replace(/[^0-9a-zA-Z:._+-]/g,'');
const isDm=ch=>ch&&ch.startsWith('dm:');
const isThread=ch=>ch&&ch.startsWith('t:');
const dmChannelFor=uid=>'dm:'+[session.user.id,uid].sort().join(':');
const dmOther=ch=>ch.slice(3).split(':').find(u=>u!==session.user.id);

/* ---------- auth ---------- */
async function auth(){
  const { data:{ session:s } } = await supabase.auth.getSession();
  if(s){ session=s; return; }
  const { data, error } = await supabase.auth.signInAnonymously();
  if(error) throw error;
  session=data.session;
}

/* ---------- sidebar rendering ---------- */
function renderChannels(){
  const ul=$('chanList'); ul.innerHTML='';
  channels.forEach(ch=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.type='button';
    b.className=current===ch.name?'active':'';
    b.innerHTML='<span class="nm"># '+ch.name+'</span>'+(unread[ch.name]?'<span class="unread">'+unread[ch.name]+'</span>':'');
    b.addEventListener('click',()=>{ pick(ch.name); mobileClose(); });
    li.appendChild(b); ul.appendChild(li);
  });
  renderDms();
}
function renderDms(){
  const ul=$('dmList'); ul.innerHTML='';
  const keys=Object.keys(dms);
  $('dmEmpty').style.display=keys.length?'none':'block';
  keys.forEach(ch=>{
    const d=dms[ch];
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.type='button';
    b.className=current===ch?'active':'';
    b.innerHTML='<span class="nm">'+(d.avatar||'👤')+' '+(d.name||'a creature')+'</span>'+
      (d.unread?'<span class="unread">'+d.unread+'</span>':'');
    b.addEventListener('click',()=>{ pick(ch); mobileClose(); });
    li.appendChild(b); ul.appendChild(li);
  });
}
function ensureDm(ch, name, avatar){
  if(!dms[ch]) dms[ch]={ name:null, avatar:null, unread:0 };
  if(name){ dms[ch].name=name; dms[ch].avatar=avatar||dms[ch].avatar; dmNames[ch]={name,avatar}; 
    try{ localStorage.setItem('sloppy-slack-dmnames', JSON.stringify(dmNames)); }catch(e){} }
  else if(dmNames[ch]){ dms[ch].name=dmNames[ch].name; dms[ch].avatar=dmNames[ch].avatar; }
}

/* ---------- channels + dms loading ---------- */
async function loadChannels(){
  const { data, error } = await supabase.from('sloppyslack_channels').select('name,topic').order('created_at',{ascending:true}).limit(60);
  if(error) throw error;
  const seen=new Set();
  channels=(data||[]).filter(c=>{ if(!c.name||seen.has(c.name)) return false; seen.add(c.name); return true; });
  if(channels.length===0){
    for(const [name,topic] of DEFAULT_CHANNELS){
      await supabase.from('sloppyslack_channels').insert({ name, topic, creature:'The Pond', user_id:session.user.id });
    }
    return loadChannels();
  }
  renderChannels();
}
async function loadDms(){
  const { data } = await supabase.from('sloppyslack_messages')
    .select('channel,creature,avatar,user_id,created_at')
    .like('channel','dm:%'+session.user.id+'%')
    .order('created_at',{ascending:false}).limit(200);
  (data||[]).forEach(m=>{
    ensureDm(m.channel, m.user_id!==session.user.id?m.creature:null, m.user_id!==session.user.id?m.avatar:null);
  });
  renderDms();
}

/* ---------- messages + threads ---------- */
function headerFor(ch){
  if(isDm(ch)){
    const d=dms[ch]||{};
    $('chanName').innerHTML='<span class="hash">@</span>'+(d.name||'a creature');
    $('chanTopic').textContent='a direct ripple · not actually private (it’s a pond)';
  } else {
    const c=channels.find(x=>x.name===ch);
    $('chanName').innerHTML='<span class="hash">#</span>'+ch;
    $('chanTopic').textContent=c&&c.topic?c.topic:'';
  }
}
async function pick(name){
  current=name;
  if(isDm(name)){ ensureDm(name); dms[name].unread=0; }
  else unread[name]=0;
  closeThread();
  headerFor(name);
  renderChannels();
  $('log').innerHTML=''; lastDay=''; lastAuthor=null; threadIndex={};
  const { data } = await supabase.from('sloppyslack_messages')
    .select('channel,body,creature,avatar,user_id,created_at')
    .eq('channel',name).order('created_at',{ascending:false}).limit(100);
  if(!isDm(name)){
    const { data:tdata } = await supabase.from('sloppyslack_messages')
      .select('channel,body,creature,avatar,user_id,created_at')
      .like('channel','t:'+name+':%')
      .order('created_at',{ascending:true}).limit(300);
    (tdata||[]).forEach(r=>{
      const key=r.channel.slice(('t:'+name+':').length);
      if(!threadIndex[key]) threadIndex[key]={count:0, replies:[]};
      threadIndex[key].count++; threadIndex[key].replies.push(r);
    });
  }
  (data||[]).reverse().forEach(m=>addMsg(m,false));
  $('log').scrollTop=$('log').scrollHeight;
}
function addMsg(m, fresh){
  const log=$('log');
  const d=new Date(m.created_at||Date.now());
  const dayStr=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  if(dayStr!==lastDay){
    lastDay=dayStr; lastAuthor=null;
    const dv=document.createElement('div'); dv.className='day'; dv.textContent=dayStr;
    log.appendChild(dv);
  }
  const compact=(m.user_id&&m.user_id===lastAuthor && (d-lastTime)<5*60*1000);
  lastAuthor=m.user_id; lastTime=d;
  const key=msgKey(m);
  const row=document.createElement('div');
  row.className='msg'+(compact?' compact':'')+(session&&m.user_id===session.user.id?' mine':'')+(fresh?' fresh':'');
  row.dataset.key=key;
  const t=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  row.innerHTML='<div class="av">'+(m.avatar||'🐸')+'</div><div class="body">'+
    (compact?'':'<div class="who"></div>')+'<div class="txt"></div><div class="chipslot"></div></div>';
  if(!compact){
    row.querySelector('.who').textContent=m.creature||'unnamed creature';
    const tm=document.createElement('time'); tm.textContent=t;
    row.querySelector('.who').appendChild(tm);
  }
  row.querySelector('.txt').textContent=m.body||'';
  if(!isDm(current)){
    const rb=document.createElement('button');
    rb.type='button'; rb.className='replyBtn'; rb.textContent='🧵 reply';
    rb.setAttribute('aria-label','Reply in thread');
    rb.addEventListener('click',()=>openThreadFor(key, m));
    row.appendChild(rb);
    updateChip(row, key, m);
  }
  const nearBottom=log.scrollHeight-log.scrollTop-log.clientHeight<120;
  log.appendChild(row);
  if(fresh===false || nearBottom) log.scrollTop=log.scrollHeight;
}
function updateChip(row, key, m){
  const slot=row.querySelector('.chipslot'); if(!slot) return;
  const ti=threadIndex[key];
  slot.innerHTML='';
  if(ti && ti.count>0){
    const c=document.createElement('button');
    c.type='button'; c.className='tchip';
    c.textContent='🧵 '+ti.count+(ti.count===1?' reply':' replies');
    c.addEventListener('click',()=>openThreadFor(key, m));
    slot.appendChild(c);
  }
}
function threadRow(r){
  const div=document.createElement('div');
  div.className='msg'+(session&&r.user_id===session.user.id?' mine':'');
  div.innerHTML='<div class="av">'+(r.avatar||'🐸')+'</div><div class="body"><div class="who"></div><div class="txt"></div></div>';
  div.querySelector('.who').textContent=r.creature||'unnamed creature';
  const tm=document.createElement('time');
  tm.textContent=new Date(r.created_at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  div.querySelector('.who').appendChild(tm);
  div.querySelector('.txt').textContent=r.body||'';
  return div;
}
function openThreadFor(key, m){
  openThread={ key, msg:m, channel:current };
  $('app').classList.add('threaded');
  const tp=$('tparent'); tp.innerHTML='';
  tp.appendChild(threadRow(m));
  const tl=$('tlog'); tl.innerHTML='';
  ((threadIndex[key]||{}).replies||[]).forEach(r=>tl.appendChild(threadRow(r)));
  tl.scrollTop=tl.scrollHeight;
  $('tinput').focus();
}
function closeThread(){
  openThread=null;
  $('app').classList.remove('threaded');
}
$('tClose').addEventListener('click', closeThread);

/* ---------- sending ---------- */
async function sendTo(channel, inputEl, btnEl){
  const body=inputEl.value.trim();
  if(!body || !session || !channel) return;
  if(Date.now()<sendCool) return;
  sendCool=Date.now()+1200;
  btnEl.disabled=true;
  inputEl.value=''; inputEl.style.height='auto';
  const { error } = await supabase.from('sloppyslack_messages').insert({
    channel, body:body.slice(0,500), creature:ME.name, avatar:ME.avatar, user_id:session.user.id
  });
  btnEl.disabled=false;
  if(error){
    inputEl.value=body;
    setConn('dead','ripple failed — try again');
    setTimeout(()=>setConn('live','live · '+SBNAME),1800);
  }
  inputEl.focus();
}
const send=()=>sendTo(current, $('input'), $('send'));
const sendThread=()=>{ if(openThread) sendTo('t:'+openThread.channel+':'+openThread.key, $('tinput'), $('tsend')); };

/* ---------- realtime ---------- */
let typers={}, typeTimer=null, rt=null, lastTypeSent=0;
function handleInsert(m){
  const mine=session && m.user_id===session.user.id;
  if(isThread(m.channel)){
    const rest=m.channel.slice(2);
    const i=rest.indexOf(':');
    const orig=rest.slice(0,i), key=rest.slice(i+1);
    if(!threadIndex[key]) threadIndex[key]={count:0, replies:[]};
    threadIndex[key].count++; threadIndex[key].replies.push(m);
    if(orig===current){
      const row=$('log').querySelector('[data-key="'+key.replace(/"/g,'')+'"]');
      if(row) updateChip(row, key, null) || (row.__m && updateChip(row,key,row.__m));
      if(row){ // rebuild chip with a parent stub for click-through
        const parentStub={ created_at:key.split('_')[0], user_id:key.split('_')[1],
          body:row.querySelector('.txt').textContent,
          creature:(row.querySelector('.who')||{}).firstChild? row.querySelector('.who').firstChild.textContent:'', 
          avatar:row.querySelector('.av').textContent };
        updateChip(row, key, parentStub);
      }
    }
    if(openThread && openThread.key===key){
      $('tlog').appendChild(threadRow(m));
      $('tlog').scrollTop=$('tlog').scrollHeight;
    }
    return;
  }
  if(isDm(m.channel)){
    if(m.channel.indexOf(session.user.id)<0) return;   // not my whisper
    ensureDm(m.channel, mine?null:m.creature, mine?null:m.avatar);
    if(m.channel===current){ addMsg(m,true); headerFor(current); }
    else if(!mine){ dms[m.channel].unread=(dms[m.channel].unread||0)+1; }
    renderDms();
    return;
  }
  if(m.channel===current){ addMsg(m,true); }
  else if(!mine){ unread[m.channel]=(unread[m.channel]||0)+1; renderChannels(); }
}
function initRealtime(){
  rt=supabase.channel('sloppyslack-rt', { config:{ broadcast:{ self:false }, presence:{ key: session.user.id } } });
  rt.on('postgres_changes', { event:'INSERT', schema:'public', table:'sloppyslack_messages' }, p=>handleInsert(p.new));
  rt.on('postgres_changes', { event:'INSERT', schema:'public', table:'sloppyslack_channels' }, p=>{
    const c=p.new;
    if(c.name && !channels.some(x=>x.name===c.name)){ channels.push({name:c.name,topic:c.topic}); renderChannels(); }
  });
  rt.on('broadcast', { event:'typing' }, ({payload})=>{
    if(payload.channel!==current) return;
    typers[payload.name]=Date.now();
    showTypers();
  });
  rt.on('presence', { event:'sync' }, ()=>{
    const st=rt.presenceState();
    const seen=new Map();
    Object.values(st).forEach(arr=>arr.forEach(p=>{ if(p.name&&p.uid) seen.set(p.uid, p); }));
    $('floatCount').textContent=seen.size;
    const fl=$('floatList'); fl.innerHTML='';
    [...seen.values()].slice(0,24).forEach(p=>{
      const b=document.createElement('button');
      b.type='button'; b.textContent=p.avatar; b.title=p.name+' — click to whisper';
      b.setAttribute('aria-label','Direct message '+p.name);
      b.addEventListener('click',()=>{
        if(p.uid===session.user.id) return;
        const ch=dmChannelFor(p.uid);
        ensureDm(ch, p.name, p.avatar);
        renderDms(); pick(ch); mobileClose();
      });
      fl.appendChild(b);
    });
  });
  rt.subscribe(status=>{
    if(status==='SUBSCRIBED'){
      setConn('live','live · '+SBNAME);
      rt.track({ name:ME.name, avatar:ME.avatar, uid:session.user.id });
    }
    else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setConn('dead','current lost — rejoining…');
  });
}
function showTypers(){
  const now=Date.now();
  const names=Object.keys(typers).filter(n=>now-typers[n]<3200);
  $('typing').textContent=names.length?names.slice(0,2).join(' & ')+(names.length>2?' & others':'')+' '+(names.length>1?'are':'is')+' rippling…':'';
  clearTimeout(typeTimer);
  if(names.length) typeTimer=setTimeout(showTypers,1000);
}
function announceTyping(){
  if(!rt || Date.now()-lastTypeSent<1800) return;
  lastTypeSent=Date.now();
  rt.send({ type:'broadcast', event:'typing', payload:{ name:ME.name, channel:current } });
}

/* ---------- UI wiring ---------- */
function mobileClose(){ if(innerWidth<=760) $('side').classList.remove('open'); }
$('send').addEventListener('click', send);
$('tsend').addEventListener('click', sendThread);
[['input',send],['tinput',sendThread]].forEach(([id,fn])=>{
  $(id).addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); fn(); }
    else if(id==='input') announceTyping();
  });
  $(id).addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,128)+'px';
  });
});
$('sbBtn').addEventListener('click', function(){
  if(innerWidth<=760){
    const open=$('side').classList.toggle('open');
    this.setAttribute('aria-expanded', String(open));
  } else {
    const collapsed=$('app').classList.toggle('collapsed');
    this.setAttribute('aria-expanded', String(!collapsed));
    try{ localStorage.setItem('sloppy-slack-sb', collapsed?'1':''); }catch(e){}
  }
});
try{ if(localStorage.getItem('sloppy-slack-sb')==='1' && innerWidth>760){ $('app').classList.add('collapsed'); $('sbBtn').setAttribute('aria-expanded','false'); } }catch(e){}
$('addChan').addEventListener('click', ()=>{ $('ncErr').textContent=''; $('chanOv').hidden=false; $('ncName').focus(); });
$('ncCancel').addEventListener('click', ()=>{ $('chanOv').hidden=true; });
$('ncGo').addEventListener('click', async ()=>{
  const name=($('ncName').value||'').toLowerCase().trim().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,24);
  const topic=($('ncTopic').value||'').trim().slice(0,80);
  if(name.length<2){ $('ncErr').textContent='a pond needs a longer name.'; return; }
  if(channels.some(c=>c.name===name)){ $('ncErr').textContent='that pond already exists. swim there.'; return; }
  const { error } = await supabase.from('sloppyslack_channels').insert({ name, topic, creature:ME.name, user_id:session.user.id });
  if(error){ $('ncErr').textContent='the digging failed. soil too rocky.'; return; }
  if(!channels.some(c=>c.name===name)) channels.push({name,topic});
  $('chanOv').hidden=true; $('ncName').value=''; $('ncTopic').value='';
  pick(name);
});
$('renameBtn').addEventListener('click', ()=>{
  $('nmName').value=ME.name; $('nmAv').value=ME.avatar; $('nmErr').textContent='';
  $('nameOv').hidden=false; $('nmName').focus();
});
$('nmCancel').addEventListener('click', ()=>{ $('nameOv').hidden=true; });
$('nmGo').addEventListener('click', ()=>{
  const name=($('nmName').value||'').trim().slice(0,28);
  const av=($('nmAv').value||'').trim().slice(0,4)||'🐸';
  if(name.length<2){ $('nmErr').textContent='even tadpoles have names.'; return; }
  ME={ name, avatar:av };
  try{ localStorage.setItem('sloppy-slack-id', JSON.stringify(ME)); }catch(e){}
  showMe();
  if(rt) rt.track({ name:ME.name, avatar:ME.avatar, uid:session.user.id });
  $('nameOv').hidden=true;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(!$('chanOv').hidden || !$('nameOv').hidden){ $('chanOv').hidden=true; $('nameOv').hidden=true; }
    else closeThread();
  }
});

/* ---------- boot ---------- */
(async function(){
  try{
    setConn('','surfacing…');
    await auth();
    await loadChannels();
    await loadDms();
    await pick(channels[0].name);
    initRealtime();
  }catch(e){
    setConn('dead','the pond is unreachable — refresh to retry');
  }
  window.__SLACK={ get session(){return session;}, get channels(){return channels;}, get current(){return current;},
    get dms(){return dms;}, get threadIndex(){return threadIndex;}, supabase, send, pick, ME, msgKey };
})();
</script>
