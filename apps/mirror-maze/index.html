<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Maze — neon laser puzzles</title>
<meta name="description" content="Rotate neon mirrors to bend a laser onto every target. Six hand-built levels, keyboard and touch, no external assets.">
<meta property="og:title" content="Mirror Maze — neon laser puzzles">
<meta property="og:description" content="Bend the beam. Six solvable levels of rotating mirrors, walls, and glowing targets.">
<meta property="og:url" content="https://sloppy.live/mirror-maze/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/neon%20laser%20beam%20bouncing%20off%20mirrors%20in%20dark%20maze%2C%20cyan%20and%20magenta%20glow%2C%20retro%20arcade%20puzzle%2C%20flat%20illustration?width=1200&height=630&seed=8181&nologo=true&model=flux">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a14'/%3E%3Cpath d='M2 8h6l4-4' stroke='%233ee8ff' stroke-width='1.6'/%3E%3Cpath d='M6 10l4-4' stroke='%23ff3ea8' stroke-width='1.8'/%3E%3Ccircle cx='13' cy='3' r='2' fill='none' stroke='%235aff9d' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a14; --panel:#12121f; --line:#26263c;
  --ink:#eef0ff; --ink2:#8d90b3;
  --cyan:#3ee8ff; --mag:#ff3ea8; --amber:#ffb023; --green:#5aff9d;
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
  background:
    radial-gradient(34rem 22rem at 12% -8%, rgba(62,232,255,.07), transparent 60%),
    radial-gradient(30rem 20rem at 92% 108%, rgba(255,62,168,.07), transparent 60%),
    var(--bg);
  display:flex; flex-direction:column; align-items:center;
  padding:1rem .7rem 2.2rem;
}
main{ width:100%; max-width:30rem; display:flex; flex-direction:column; gap:.7rem; }
header{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
header h1{
  margin:0; font-size:1.5rem; letter-spacing:-.02em;
  color:var(--cyan); text-shadow:0 0 1.2rem rgba(62,232,255,.5);
}
h1 .m{ color:var(--mag); text-shadow:0 0 1.2rem rgba(255,62,168,.5); }
#hud{ margin-left:auto; font-size:.8rem; color:var(--ink2); }
#hud b{ color:var(--ink); }
#board{
  width:100%; display:block; aspect-ratio:1;
  background:var(--panel); border:2px solid var(--line); border-radius:.9rem;
  touch-action:manipulation;
}
#status{ font-size:.74rem; color:var(--ink2); min-height:1.15rem; margin:0; }
#status.win{ color:var(--green); font-weight:700; }
#controls{ display:flex; gap:.5rem; flex-wrap:wrap; }
#controls button{
  font-family:inherit; font-size:.75rem; font-weight:700; min-height:2.75rem;
  padding:.4rem .8rem; border-radius:.6rem; cursor:pointer;
  background:transparent; color:var(--ink); border:2px solid var(--line);
}
#controls button:hover{ border-color:var(--cyan); }
#controls button[disabled]{ opacity:.35; cursor:default; }
#controls button:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
#next{ border-color:var(--green); color:var(--green); }
#keys{ font-size:.68rem; color:var(--ink2); line-height:1.7; }
#keys kbd{
  border:1px solid var(--line); border-radius:.3rem; padding:.05rem .35rem;
  background:var(--panel); font-family:inherit;
}
footer{ text-align:center; font-size:.68rem; color:var(--ink2); margin-top:.3rem; line-height:1.7; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
<header>
  <h1>MIRROR<span class="m">·</span>MAZE</h1>
  <div id="hud">level <b id="lvl">1</b>/6 · solved <b id="prog">0</b></div>
</header>

<canvas id="board" width="448" height="448" role="application"
  aria-label="Mirror maze. Arrow keys move the cursor, Space rotates the selected mirror, R resets the level. Tap a mirror to rotate it."></canvas>
<p id="status" role="status" aria-live="polite">bend the beam onto every ring. tap a mirror, or arrows + Space.</p>

<div id="controls">
  <button type="button" id="reset">↺ reset level</button>
  <button type="button" id="prev" aria-label="Previous level">‹ prev</button>
  <button type="button" id="next" aria-label="Next level" disabled>next ›</button>
</div>
<p id="keys"><kbd>←→↑↓</kbd> cursor · <kbd>Space</kbd> rotate · <kbd>R</kbd> reset · <kbd>N</kbd> next</p>

<footer>drawn and computed entirely in-page — no external assets · vote on sloppy.live if the beam bends you back<br>
<span id="buildstamp" role="note" aria-label="Build information" style="font-size:.62rem;opacity:.65;">build v1.0 · 2026-08-19 · 9426c38a2</span></footer>
</main>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var KEY='mirror-maze-v1';
var cvB=$('board'), cxB=cvB.getContext('2d');

/* ── levels: . empty, # wall, /\ rotatable mirrors, >^v< emitter, T target ── */
var LEVELS=[
  ['....T',
   '.....',
   '>...\\',
   '.....',
   '.....'],
  ['>.../.',
   '......',
   '......',
   '......',
   '.T..\\.',
   '......'],
  ['>./#..',
   '......',
   '......',
   '../..T'],
  ['>../..',
   '......',
   '...T..',
   '......',
   '...\\.T'],
  ['.\\.\\..T',
   '.......',
   '.......',
   '>..\\...',
   '.......',
   '.....\\.'],
  ['.......',
   '.......',
   '..\\../.',
   '.......',
   '..T./..',
   '#....T.',
   '>.\\....']
];

/* ── pure beam tracer: grid (array of char arrays) → { path, lit } ── */
function traceOn(grid){
  var H=grid.length, W2=grid[0].length;
  var er=-1, ec=-1, dr=0, dc=0;
  for(var r=0;r<H;r++) for(var c=0;c<W2;c++){
    var ch=grid[r][c];
    if(ch==='>'){ er=r; ec=c; dr=0; dc=1; }
    else if(ch==='<'){ er=r; ec=c; dr=0; dc=-1; }
    else if(ch==='^'){ er=r; ec=c; dr=-1; dc=0; }
    else if(ch==='v'){ er=r; ec=c; dr=1; dc=0; }
  }
  var path=[[er,ec]], lit={}, r2=er, c2=ec, steps=0;
  while(steps++<500){
    r2+=dr; c2+=dc;
    if(r2<0||r2>=H||c2<0||c2>=W2) break;
    var ch2=grid[r2][c2];
    if(ch2==='#'){ break; }
    path.push([r2,c2]);
    if(ch2==='T') lit[r2+','+c2]=true;
    else if(ch2==='/'){ var t=dr; dr=-dc; dc=-t; }
    else if(ch2==='\\'){ var t2=dr; dr=dc; dc=t2; }
  }
  return { path:path, lit:lit };
}
function targets(grid){
  var out=[];
  grid.forEach(function(row,r){ row.forEach(function(ch,c){ if(ch==='T') out.push([r,c]); }); });
  return out;
}
function isSolved(grid){
  var tr=traceOn(grid);
  return targets(grid).every(function(t){ return tr.lit[t[0]+','+t[1]]; });
}

/* ── state ── */
var G={ level:0, grid:[], cur:[0,0], solved:false, done:{} };
try{
  var saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved && saved.done) G.done=saved.done;
  if(saved && typeof saved.level==='number' && saved.level>=0 && saved.level<LEVELS.length) G.level=saved.level;
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ done:G.done, level:G.level })); }catch(e){} }

function loadLevel(i){
  G.level=Math.max(0, Math.min(LEVELS.length-1, i));
  G.grid=LEVELS[G.level].map(function(row){ return row.split(''); });
  G.cur=firstMirror();
  G.solved=false;
  save(); hud(); draw();
  say('level '+(G.level+1)+' — bend the beam onto every ring.');
}
function firstMirror(){
  for(var r=0;r<G.grid.length;r++)
    for(var c=0;c<G.grid[0].length;c++)
      if(G.grid[r][c]==='/'||G.grid[r][c]==='\\') return [r,c];
  return [0,0];
}
function rotate(r,c){
  if(G.solved) return;
  var ch=G.grid[r][c];
  if(ch==='/') G.grid[r][c]='\\';
  else if(ch==='\\') G.grid[r][c]='/';
  else return;
  checkWin();
  draw();
}
function checkWin(){
  if(isSolved(G.grid)){
    G.solved=true;
    G.done[G.level]=true;
    save(); hud();
    $('next').disabled = G.level>=LEVELS.length-1;
    say('⚡ every ring lit! '+(G.level<LEVELS.length-1? 'N for the next maze.':'all six mazes solved — mirror master.'), true);
  }
}
function hud(){
  $('lvl').textContent=G.level+1;
  $('prog').textContent=Object.keys(G.done).length;
  $('prev').disabled=G.level<=0;
  $('next').disabled=!(G.solved && G.level<LEVELS.length-1) && !G.done[G.level] || G.level>=LEVELS.length-1;
}
function say(t, win){
  $('status').textContent=t;
  $('status').className=win?'win':'';
}

/* ── render ── */
function draw(){
  var H=G.grid.length, W2=G.grid[0].length;
  var cell=Math.floor(448/Math.max(H,W2));
  var ox=Math.floor((448-W2*cell)/2), oy=Math.floor((448-H*cell)/2);
  cxB.clearRect(0,0,448,448);
  /* grid dots */
  cxB.fillStyle='#1d1d30';
  for(var r=0;r<=H;r++) for(var c=0;c<=W2;c++)
    cxB.fillRect(ox+c*cell-1, oy+r*cell-1, 2, 2);
  var tr=traceOn(G.grid);
  /* beam */
  cxB.save();
  cxB.strokeStyle=G.solved? '#5aff9d':'#3ee8ff';
  cxB.lineWidth=3;
  cxB.shadowColor=G.solved? 'rgba(90,255,157,.8)':'rgba(62,232,255,.8)';
  cxB.shadowBlur=12;
  cxB.beginPath();
  tr.path.forEach(function(p,i){
    var x=ox+p[1]*cell+cell/2, y=oy+p[0]*cell+cell/2;
    if(i===0) cxB.moveTo(x,y); else cxB.lineTo(x,y);
  });
  cxB.stroke();
  cxB.restore();
  /* cells */
  for(var r3=0;r3<H;r3++) for(var c3=0;c3<W2;c3++){
    var ch=G.grid[r3][c3];
    var x=ox+c3*cell, y=oy+r3*cell, m=cell/2;
    if(ch==='#'){
      cxB.fillStyle='#2c2c44';
      cxB.fillRect(x+3,y+3,cell-6,cell-6);
      cxB.strokeStyle='#414163'; cxB.lineWidth=2;
      cxB.strokeRect(x+3,y+3,cell-6,cell-6);
    }else if(ch==='/'||ch==='\\'){
      cxB.save();
      cxB.strokeStyle='#ff3ea8'; cxB.lineWidth=4; cxB.lineCap='round';
      cxB.shadowColor='rgba(255,62,168,.7)'; cxB.shadowBlur=10;
      cxB.beginPath();
      if(ch==='/'){ cxB.moveTo(x+7,y+cell-7); cxB.lineTo(x+cell-7,y+7); }
      else{ cxB.moveTo(x+7,y+7); cxB.lineTo(x+cell-7,y+cell-7); }
      cxB.stroke();
      cxB.restore();
    }else if(ch==='>'||ch==='<'||ch==='^'||ch==='v'){
      cxB.save();
      cxB.fillStyle='#ffb023'; cxB.shadowColor='rgba(255,176,35,.7)'; cxB.shadowBlur=10;
      cxB.beginPath();
      if(ch==='>'){ cxB.moveTo(x+8,y+8); cxB.lineTo(x+cell-8,y+m); cxB.lineTo(x+8,y+cell-8); }
      else if(ch==='<'){ cxB.moveTo(x+cell-8,y+8); cxB.lineTo(x+8,y+m); cxB.lineTo(x+cell-8,y+cell-8); }
      else if(ch==='^'){ cxB.moveTo(x+8,y+cell-8); cxB.lineTo(x+m,y+8); cxB.lineTo(x+cell-8,y+cell-8); }
      else{ cxB.moveTo(x+8,y+8); cxB.lineTo(x+m,y+cell-8); cxB.lineTo(x+cell-8,y+8); }
      cxB.closePath(); cxB.fill();
      cxB.restore();
    }else if(ch==='T'){
      var on=tr.lit[r3+','+c3];
      cxB.save();
      cxB.strokeStyle=on? '#5aff9d':'#3a5a4a';
      cxB.lineWidth=4;
      if(on){ cxB.shadowColor='rgba(90,255,157,.8)'; cxB.shadowBlur=14; }
      cxB.beginPath(); cxB.arc(x+m,y+m,m-9,0,7); cxB.stroke();
      if(on){ cxB.fillStyle='rgba(90,255,157,.35)'; cxB.beginPath(); cxB.arc(x+m,y+m,m-14,0,7); cxB.fill(); }
      cxB.restore();
    }
  }
  /* cursor */
  var cu=G.cur;
  cxB.strokeStyle='rgba(238,240,255,.7)';
  cxB.lineWidth=2;
  cxB.setLineDash([5,4]);
  cxB.strokeRect(ox+cu[1]*cell+2, oy+cu[0]*cell+2, cell-4, cell-4);
  cxB.setLineDash([]);
  G._geom={ cell:cell, ox:ox, oy:oy };
}

/* ── input ── */
addEventListener('keydown', function(e){
  var H=G.grid.length, W2=G.grid[0].length;
  if(e.code==='ArrowLeft'){ e.preventDefault(); G.cur[1]=Math.max(0,G.cur[1]-1); draw(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); G.cur[1]=Math.min(W2-1,G.cur[1]+1); draw(); }
  else if(e.code==='ArrowUp'){ e.preventDefault(); G.cur[0]=Math.max(0,G.cur[0]-1); draw(); }
  else if(e.code==='ArrowDown'){ e.preventDefault(); G.cur[0]=Math.min(H-1,G.cur[0]+1); draw(); }
  else if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); rotate(G.cur[0],G.cur[1]); }
  else if(e.key==='r'||e.key==='R'){ loadLevel(G.level); }
  else if(e.key==='n'||e.key==='N'){ if(!$('next').disabled) loadLevel(G.level+1); }
});
cvB.addEventListener('pointerdown', function(e){
  var rect=cvB.getBoundingClientRect();
  var sc=448/rect.width;
  var gx=(e.clientX-rect.left)*sc, gy=(e.clientY-rect.top)*sc;
  var g2=G._geom;
  if(!g2) return;
  var c=Math.floor((gx-g2.ox)/g2.cell), r=Math.floor((gy-g2.oy)/g2.cell);
  if(r>=0 && r<G.grid.length && c>=0 && c<G.grid[0].length){
    G.cur=[r,c];
    rotate(r,c);
    draw();
  }
});
$('reset').addEventListener('click', function(){ loadLevel(G.level); });
$('prev').addEventListener('click', function(){ if(G.level>0) loadLevel(G.level-1); });
$('next').addEventListener('click', function(){ if(!this.disabled) loadLevel(G.level+1); });

loadLevel(G.level);
window.__MM={ G:G, LEVELS:LEVELS, traceOn:traceOn, targets:targets, isSolved:isSolved,
  loadLevel:loadLevel, rotate:rotate, KEY:KEY };
})();
</script>
</body>
</html>
