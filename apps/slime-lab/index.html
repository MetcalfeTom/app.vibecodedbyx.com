<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Lab — mix it, squish it, snap it</title>
<meta name="description" content="Mix glues and activators, stir in glitter and charms, then squish, stretch and fling a slime that jiggles and snaps like the real thing.">
<link rel="icon" href="https://emojicdn.elk.sh/🫠">
<meta property="og:title" content="Slime Lab — mix it, squish it, snap it">
<meta property="og:description" content="Mix your own slime recipe, then poke, stretch and fling it. Every recipe squishes and sounds different.">
<meta property="og:url" content="https://sloppy.live/slime-lab/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/cute%20craft%20lab%20table%20with%20a%20giant%20glossy%20green%20slime%20blob%20being%20stretched%20by%20hands%2C%20glitter%20jars%2C%20glue%20bottles%2C%20pastel%20sticker%20illustration%20style%2C%20playful%2C%20bright.png?width=1200&height=630&nologo=true&seed=6161&model=flux">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Slackey&family=Varela+Round&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf3e3; --paper:#fffdf7; --ink:#33254a; --ink-soft:#6b5a8a;
  --pink:#ff5fa2; --lime:#7ac93c; --aqua:#35d6b1; --sun:#ffc21a; --grape:#a06bff;
  --shadow:4px 4px 0 var(--ink);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:var(--cream);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,95,162,.10), transparent 32%),
    radial-gradient(circle at 88% 90%, rgba(122,201,60,.12), transparent 34%),
    repeating-linear-gradient(0deg, transparent 0 26px, rgba(51,37,74,.045) 26px 27px),
    repeating-linear-gradient(90deg, transparent 0 26px, rgba(51,37,74,.045) 26px 27px);
  color:var(--ink);
  font-family:'Varela Round', sans-serif;
  min-height:100vh;
}
main{ max-width:68rem; margin:0 auto; padding:1rem 1rem 2.5rem; }
header.lab{ text-align:center; padding:.9rem 0 .6rem; }
h1{
  font-family:'Slackey', cursive; font-weight:400;
  font-size:clamp(2.1rem, 6vw, 3.6rem); letter-spacing:.04em; line-height:1;
}
h1 .g{ color:var(--lime); text-shadow:3px 3px 0 var(--ink); }
h1 .p{ color:var(--pink); text-shadow:3px 3px 0 var(--ink); }
.tag{ font-size:.95rem; color:var(--ink-soft); margin-top:.45rem; }
.layout{ display:grid; grid-template-columns: 19rem 1fr; gap:1rem; align-items:start; margin-top:.8rem; }
@media (max-width: 54rem){ .layout{ grid-template-columns:1fr; } .stage-wrap{ order:-1; } }

.bench{ display:flex; flex-direction:column; gap:.8rem; }
.card{
  background:var(--paper); border:3px solid var(--ink); border-radius:.9rem;
  box-shadow:var(--shadow); padding:.7rem .75rem;
}
.card h2{
  font-family:'Slackey', cursive; font-weight:400; font-size:.82rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
  margin-bottom:.55rem; display:flex; align-items:center; gap:.4rem;
}
.card h2 .dot{ width:.55rem; height:.55rem; border-radius:50%; background:var(--pink); border:2px solid var(--ink); }
.optrow{ display:grid; grid-template-columns:1fr 1fr; gap:.45rem; }
.optrow.three{ grid-template-columns:1fr 1fr 1fr; }
button.opt{
  font-family:'Varela Round', sans-serif; font-size:.8rem; color:var(--ink);
  background:#f4ecdd; border:2.5px solid var(--ink); border-radius:.6rem;
  min-height:2.75rem; padding:.35rem .3rem; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1rem;
  transition:transform .1s, background .15s;
}
button.opt .em{ font-size:1.1rem; line-height:1; }
button.opt:hover{ transform:translateY(-2px); }
button.opt[aria-pressed="true"]{ background:var(--sun); box-shadow:2px 2px 0 var(--ink); }
.doserow{ display:flex; align-items:center; gap:.6rem; }
input[type=range]{
  flex:1; appearance:none; -webkit-appearance:none; height:2.75rem; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{ height:.7rem; border-radius:.35rem; border:2.5px solid var(--ink); background:linear-gradient(90deg, var(--aqua), var(--pink)); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:1.5rem; height:1.5rem; border-radius:50%; background:var(--paper); border:3px solid var(--ink); margin-top:-.48rem; box-shadow:2px 2px 0 var(--ink); }
input[type=range]::-moz-range-track{ height:.7rem; border-radius:.35rem; border:2.5px solid var(--ink); background:linear-gradient(90deg, var(--aqua), var(--pink)); }
input[type=range]::-moz-range-thumb{ width:1.3rem; height:1.3rem; border-radius:50%; background:var(--paper); border:3px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
.doselabel{ font-family:'Space Mono', monospace; font-size:.72rem; width:5.4rem; text-align:right; color:var(--ink-soft); }
.swatches{ display:flex; gap:.45rem; flex-wrap:wrap; }
button.swatch{
  width:2.75rem; height:2.75rem; border-radius:50%; border:3px solid var(--ink);
  cursor:pointer; transition:transform .1s;
}
button.swatch:hover{ transform:scale(1.08); }
button.swatch[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.chips{ display:flex; gap:.45rem; flex-wrap:wrap; }
button.chip{
  font-family:'Varela Round', sans-serif; font-size:.78rem; color:var(--ink);
  background:#f4ecdd; border:2.5px solid var(--ink); border-radius:2rem;
  min-height:2.75rem; padding:.3rem .75rem; cursor:pointer; display:inline-flex; align-items:center; gap:.35rem;
}
button.chip[aria-pressed="true"]{ background:var(--aqua); box-shadow:2px 2px 0 var(--ink); }
.mixbtn{
  font-family:'Slackey', cursive; font-size:1.15rem; letter-spacing:.06em; color:var(--paper);
  background:var(--pink); border:3px solid var(--ink); border-radius:.9rem;
  min-height:3.2rem; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .1s, box-shadow .1s;
}
.mixbtn:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
.mixbtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }

.stage-wrap{ display:flex; flex-direction:column; gap:.7rem; }
.stage{
  position:relative; border:3px solid var(--ink); border-radius:1rem; overflow:hidden;
  box-shadow:var(--shadow); background:#efe6f7; touch-action:none;
  height:min(70vh, 34rem); min-height:20rem;
}
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hint{
  position:absolute; left:50%; top:.85rem; transform:translateX(-50%);
  background:var(--paper); border:2.5px solid var(--ink); border-radius:2rem;
  font-size:.8rem; padding:.35rem .9rem; box-shadow:3px 3px 0 var(--ink);
  transition:opacity .6s; pointer-events:none; white-space:nowrap;
}
.hint.gone{ opacity:0; }
.readout{
  display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;
  background:var(--paper); border:3px solid var(--ink); border-radius:.9rem;
  box-shadow:var(--shadow); padding:.55rem .8rem;
}
.meter{ display:flex; align-items:center; gap:.35rem; font-family:'Space Mono', monospace; font-size:.68rem; letter-spacing:.03em; }
.pips{ display:flex; gap:.18rem; }
.pip{ width:.55rem; height:.9rem; border:2px solid var(--ink); border-radius:.2rem; background:#eee4d2; }
.pip.on{ background:var(--lime); }
.soundtag{
  margin-left:auto; font-family:'Space Mono', monospace; font-size:.7rem;
  background:var(--ink); color:var(--cream); border-radius:.5rem; padding:.3rem .55rem;
}
.mutebtn{
  font-size:1rem; background:var(--paper); border:2.5px solid var(--ink); border-radius:.6rem;
  min-width:2.75rem; min-height:2.75rem; cursor:pointer;
}
:focus-visible{ outline:3px solid var(--grape); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){
  button.opt, .mixbtn, button.swatch{ transition:none; }
}
@media (max-width: 40rem){
  .readout{ padding:.45rem .55rem; gap:.45rem; }
  .soundtag{ margin-left:0; width:100%; text-align:center; }
}
</style>
</head>
<body>
<main>
  <header class="lab">
    <h1><span class="g">SLIME</span> <span class="p">LAB</span></h1>
    <p class="tag">mix a recipe · then squish, stretch &amp; fling it — every batch feels and sounds different</p>
  </header>

  <div class="layout">
    <div class="bench">
      <section class="card" aria-labelledby="h-glue">
        <h2 id="h-glue"><span class="dot" style="background:var(--sun)"></span>Glue base</h2>
        <div class="optrow" id="glueRow" role="group" aria-label="Choose a glue base"></div>
      </section>

      <section class="card" aria-labelledby="h-act">
        <h2 id="h-act"><span class="dot" style="background:var(--aqua)"></span>Activator</h2>
        <div class="optrow three" id="actRow" role="group" aria-label="Choose an activator"></div>
        <div class="doserow" style="margin-top:.6rem">
          <input type="range" id="dose" min="0" max="100" value="55" aria-label="Activator dose">
          <span class="doselabel" id="doseLabel">dose 55%</span>
        </div>
      </section>

      <section class="card" aria-labelledby="h-pig">
        <h2 id="h-pig"><span class="dot" style="background:var(--pink)"></span>Pigment</h2>
        <div class="swatches" id="swatchRow" role="group" aria-label="Choose a pigment color"></div>
      </section>

      <section class="card" aria-labelledby="h-add">
        <h2 id="h-add"><span class="dot" style="background:var(--grape)"></span>Add-ins</h2>
        <div class="chips" id="chipRow" role="group" aria-label="Toggle add-ins"></div>
      </section>

      <button class="mixbtn" id="mixBtn" type="button">🥣 MIX A FRESH BATCH</button>
    </div>

    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv" role="application" aria-label="Slime play area. Drag the slime to stretch it, tap to poke it, fling it to throw it."></canvas>
        <div class="hint" id="hint">👆 drag to stretch · tap to poke · fling to throw</div>
      </div>
      <div class="readout" role="status" aria-live="polite" aria-label="Slime properties">
        <span class="meter">STRETCH <span class="pips" id="mStretch"></span></span>
        <span class="meter">SNAP <span class="pips" id="mSnap"></span></span>
        <span class="meter">WOBBLE <span class="pips" id="mWobble"></span></span>
        <span class="meter">CRUNCH <span class="pips" id="mCrunch"></span></span>
        <span class="soundtag" id="soundTag">sound: wet squelch</span>
        <button class="mutebtn" id="muteBtn" type="button" aria-pressed="false" aria-label="Toggle sound">🔊</button>
      </div>
    </div>
  </div>
</main>

<script>
'use strict';
/* ============================== RECIPE ============================== */
const GLUES = {
  white:{ name:'White PVA', em:'🥛', alpha:.96, gloss:.35, dampMul:1.00, note:'classic · opaque' },
  clear:{ name:'Clear',     em:'💧', alpha:.58, gloss:.95, dampMul:0.97, note:'glassy · jiggly' },
  pearl:{ name:'Pearl',     em:'🦪', alpha:.82, gloss:.75, dampMul:1.05, note:'shimmery' },
  glow: { name:'Glow',      em:'🌟', alpha:.85, gloss:.55, dampMul:1.00, note:'glows soft' },
};
const ACTS = {
  borax:  { name:'Borax',   em:'🧂', stiffMul:1.35, stretchMul:0.72, bounce:.34, pitchMul:1.30 },
  contact:{ name:'Contact', em:'👁️', stiffMul:0.80, stretchMul:1.55, bounce:.22, pitchMul:0.85 },
  starch: { name:'Starch',  em:'🧴', stiffMul:1.00, stretchMul:1.00, bounce:.45, pitchMul:1.00 },
};
const PIGMENTS = [
  { name:'lime',       c:'#7ac93c' }, { name:'bubblegum', c:'#ff5fa2' },
  { name:'blueberry',  c:'#4aa8ff' }, { name:'grape',     c:'#a06bff' },
  { name:'sunny',      c:'#ffc21a' }, { name:'seafoam',   c:'#35d6b1' },
];
const ADDINS = [
  { key:'glitter', name:'glitter', em:'✨' },
  { key:'beads',   name:'foam beads', em:'🫧' },
  { key:'charms',  name:'charms', em:'🦄' },
];
const CHARM_EMOJI = ['🦄','🍓','⭐','🌙','🍬'];

const recipe = { glue:'white', act:'borax', dose:0.55, pigment:1, addins:{ glitter:true, beads:false, charms:false } };
let P = {}; // derived physics/sound params

function derive(){
  const g = GLUES[recipe.glue], a = ACTS[recipe.act], cure = recipe.dose;
  P = {
    stiff: (38 + cure*115) * a.stiffMul,          // perimeter spring k
    damp:  (0.80 + cure*0.11) * g.dampMul,        // per-frame velocity keep (pow dt*60)
    stretchMax: (3.3 - cure*1.7) * a.stretchMul,  // × radius before grip slips
    slump: Math.pow(1-cure, 1.6),                 // puddle-droop when resting
    bounce: a.bounce * (0.5 + cure*0.8),
    wobbleK: 5 + cure*10*a.stiffMul,              // squash-spring freq
    pitch: (0.55 + cure*1.05) * a.pitchMul,       // sound brightness
    wet: 1-cure,
    alpha: g.alpha, gloss: g.gloss,
    color: PIGMENTS[recipe.pigment].c,
    glitter: recipe.addins.glitter || recipe.glue==='pearl',
    beads: recipe.addins.beads,
    charms: recipe.addins.charms,
    glow: recipe.glue==='glow',
  };
  P.damp = Math.min(0.94, P.damp);
  updateReadout();
}

/* ============================== UI ============================== */
const $ = id => document.getElementById(id);
function buildOpts(rowId, obj, key, onPick){
  const row = $(rowId); row.innerHTML='';
  Object.keys(obj).forEach(k=>{
    const b = document.createElement('button');
    b.type='button'; b.className='opt';
    b.innerHTML = '<span class="em" aria-hidden="true">'+obj[k].em+'</span>'+obj[k].name;
    b.setAttribute('aria-pressed', String(recipe[key]===k));
    b.addEventListener('click', ()=>{ recipe[key]=k;
      row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true'); onPick(); });
    row.appendChild(b);
  });
}
function buildSwatches(){
  const row = $('swatchRow'); row.innerHTML='';
  PIGMENTS.forEach((p,i)=>{
    const b = document.createElement('button');
    b.type='button'; b.className='swatch'; b.style.background=p.c;
    b.setAttribute('aria-label', p.name); b.setAttribute('aria-pressed', String(recipe.pigment===i));
    b.addEventListener('click', ()=>{ recipe.pigment=i;
      row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true'); applyTweak(); });
    row.appendChild(b);
  });
}
function buildChips(){
  const row = $('chipRow'); row.innerHTML='';
  ADDINS.forEach(a=>{
    const b = document.createElement('button');
    b.type='button'; b.className='chip';
    b.innerHTML='<span aria-hidden="true">'+a.em+'</span>'+a.name;
    b.setAttribute('aria-pressed', String(!!recipe.addins[a.key]));
    b.addEventListener('click', ()=>{ recipe.addins[a.key]=!recipe.addins[a.key];
      b.setAttribute('aria-pressed', String(recipe.addins[a.key])); applyTweak(); });
    row.appendChild(b);
  });
}
function pipHTML(n){ let s=''; for(let i=0;i<5;i++) s+='<span class="pip'+(i<n?' on':'')+'"></span>'; return s; }
function updateReadout(){
  $('mStretch').innerHTML = pipHTML(Math.round(Math.min(5, (P.stretchMax-1)/4.2*5+0.6)));
  $('mSnap').innerHTML    = pipHTML(Math.round(Math.min(5, recipe.dose*ACTS[recipe.act].stiffMul*5)));
  $('mWobble').innerHTML  = pipHTML(Math.round(Math.min(5, (P.damp-0.78)/0.16*5)));
  $('mCrunch').innerHTML  = pipHTML(P.beads?4:(P.glitter?1:0));
  let tag;
  if(P.beads) tag = 'crunchy sizzle';
  else if(P.wet>0.62) tag = 'wet squelch · low';
  else if(P.wet>0.35) tag = 'gooey plap';
  else if(ACTS[recipe.act].pitchMul>1.1) tag = 'rubbery SNAP · high';
  else tag = 'bouncy thwip';
  $('soundTag').textContent = 'sound: '+tag;
}
$('dose').addEventListener('input', e=>{
  recipe.dose = e.target.value/100;
  $('doseLabel').textContent = 'dose '+e.target.value+'%';
  applyTweak(false);
});
function applyTweak(pulse=true){ derive(); refreshDecor(); if(pulse){ blob.syv -= 2.2; sSquish(0.35); } }
$('mixBtn').addEventListener('click', ()=>{ audioInit(); derive(); freshBatch(); });

/* ============================== CANVAS / PHYSICS ============================== */
const cv = $('cv'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, matY=0;
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  matY = H - Math.max(46, H*0.14);
}
window.addEventListener('resize', resize); resize();

const N = 30;
const blob = { cx:0, cy:0, vx:0, vy:0, r:0, sx:1, sy:1, sxv:0, syv:0, pts:[], grounded:false };
let decor = { glitter:[], beads:[], charms:[] };
let MIX = null;               // interactive mixing session
let MIXBUF = null, MIXBUFX = null;   // offscreen backdrop copy for the glass refraction pass
const STIR_NEED = Math.PI*2*2.2;   // ~2.2 full spoon turns
const GLUE_LIQ = { white:'#f7f2e9', clear:'#d7ecf4', pearl:'#f3eaf7', glow:'#eaffdc' };
const MIX_HINTS = [
  '🍯 press & hold to pour the glue to the line',
  '💧 hold to drizzle the activator on top',
  '✨ tap 3× to sprinkle pigment + add-ins',
  '🥄 drag circles in the bowl to stir it all together',
];
const TILT = 0.30;   // third-person camera tilt: ellipse ry/rx ratio (fake-3D, no engine needed)
function mixGeo(){
  const r = baseR();
  const bw = r*2.5, bh = r*1.6, bx = W/2, by = matY, topY = by - bh;
  const maxLiq = bh*0.60, actH = bh*0.16;
  const glueH = MIX.level*maxLiq, actHc = MIX.actLevel*actH;
  const rx = bw/2, ry = rx*TILT;
  // bowl profile: half-width at height h above the base (curved glass bowl)
  const hwAt = h => bw*0.30 + (rx - bw*0.30)*Math.pow(Math.max(0,Math.min(1,h/bh)), 0.85);
  const liqH = glueH + actHc;
  const srx = hwAt(liqH), sry = srx*TILT;
  return { bx, by, bw, bh, topY, maxLiq, actH, glueH, actHc, rx, ry, hwAt, srx, sry,
    surfaceY: by - liqH, cy: by - bh*0.4 };
}
function updateMixHint(){
  $('hint').textContent = MIX_HINTS[MIX.stage] + '  (Enter = auto)';
  $('hint').classList.remove('gone');
}
function advMix(n){
  MIX.stage = n; MIX.pouring = false;
  bedGain(0);
  sSquish(0.25);
  if(n===3) sMix();
  updateMixHint();
}
function sprinkle(p){
  const g = mixGeo();
  MIX.sprinkles++;
  const cxs = Math.max(g.bx-g.bw*0.34, Math.min(g.bx+g.bw*0.34, p.x));
  const kinds = ['pig','pig','pig'];
  if(P.glitter) kinds.push('gl','gl','gl','gl');
  if(P.beads) kinds.push('bd','bd','bd');
  for(let i=0;i<8+Math.floor(Math.random()*5);i++){
    const k = kinds[Math.floor(Math.random()*kinds.length)];
    MIX.parts.push({ k, x:cxs+(Math.random()-.5)*g.bw*0.4, y:g.topY-30-Math.random()*26,
      vy:40+Math.random()*80, rest:false, eoff:Math.random()*0.9-0.25 });
  }
  if(P.charms) MIX.parts.push({ k:'ch', em:CHARM_EMOJI[MIX.sprinkles%CHARM_EMOJI.length],
    x:cxs+(Math.random()-.5)*g.bw*0.3, y:g.topY-40, vy:60, rest:false, eoff:Math.random()*0.6-0.15 });
  sCrunch(0.35);
  if(MIX.sprinkles>=3) advMix(3);
}

function baseR(){ return Math.max(52, Math.min(96, Math.min(W,H)*0.16)); }
function buildBlob(dropIn){
  blob.r = baseR();
  blob.cx = W/2; blob.cy = dropIn ? -blob.r*1.5 : matY - blob.r - 4;
  blob.vx = 0; blob.vy = dropIn ? 60 : 0;
  blob.sx = 1; blob.sy = 1; blob.sxv = 0; blob.syv = 0;
  blob.pts = [];
  for(let i=0;i<N;i++){
    const a = i/N*Math.PI*2;
    blob.pts.push({ a, x:blob.cx+Math.cos(a)*blob.r, y:blob.cy+Math.sin(a)*blob.r, vx:0, vy:0 });
  }
  refreshDecor();
}
function refreshDecor(){
  const rnd = Math.random;
  decor.glitter = []; decor.beads = []; decor.charms = [];
  if(P.glitter) for(let i=0;i<42;i++) decor.glitter.push({ a:rnd()*Math.PI*2, d:Math.sqrt(rnd())*0.88, ph:rnd()*Math.PI*2, sp:1.5+rnd()*3 });
  if(P.beads)   for(let i=0;i<16;i++) decor.beads.push({ a:rnd()*Math.PI*2, d:Math.sqrt(rnd())*0.78, r:2.5+rnd()*2.5 });
  if(P.charms)  for(let i=0;i<5;i++)  decor.charms.push({ a:i/5*Math.PI*2+rnd()*0.5, d:0.35+rnd()*0.3, em:CHARM_EMOJI[i], rot:(rnd()-.5)*0.9 });
}
function freshBatch(){
  MIX = { stage:0, level:0, actLevel:0, sprinkles:0, parts:[],
    stir:0, stirVel:0, pouring:false, stirring:false, lastAng:null,
    px:W/2, py:0, halfTurns:0 };
  updateMixHint();
}
function finishMix(){
  MIX = null;
  bedGain(0);
  buildBlob(false);
  blob.syv = -3.2; blob.sxv = 1.8;   // birth wobble
  sSquish(0.9);
  if(P.beads) sCrunch(0.5);
  $('hint').textContent = '👆 drag to stretch · tap to poke · fling to throw';
  setTimeout(()=>$('hint').classList.add('gone'), 3500);
}

/* pointer */
const grab = { on:false, x:0, y:0, px:0, py:0, vx:0, vy:0, t0:0, moved:0, gi:-1 };
function evPos(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
cv.addEventListener('pointerdown', e=>{
  audioInit();
  if(MIX){
    const p = evPos(e); MIX.px = p.x; MIX.py = p.y;
    if(MIX.stage<=1){ MIX.pouring = true; }
    else if(MIX.stage===2){ sprinkle(p); }
    else { const g = mixGeo(); MIX.stirring = true; MIX.lastAng = Math.atan2(p.y-g.cy, p.x-g.bx); }
    cv.setPointerCapture(e.pointerId);
    return;
  }
  const p = evPos(e);
  const d = Math.hypot(p.x-blob.cx, p.y-blob.cy);
  if(d < blob.r*Math.max(blob.sx,blob.sy)*1.35){
    grab.on = true; grab.x = grab.px = p.x; grab.y = grab.py = p.y;
    grab.vx = grab.vy = 0; grab.t0 = performance.now(); grab.moved = 0;
    let best = 0, bd = 1e9;
    blob.pts.forEach((pt,i)=>{ const dd = Math.hypot(p.x-pt.x, p.y-pt.y); if(dd<bd){ bd=dd; best=i; } });
    grab.gi = best;
    cv.setPointerCapture(e.pointerId);
    $('hint').classList.add('gone');
  }
});
cv.addEventListener('pointermove', e=>{
  if(MIX){
    const p = evPos(e); MIX.px = p.x; MIX.py = p.y;
    if(MIX.stage===3 && MIX.stirring){
      const g = mixGeo();
      const a = Math.atan2(p.y-g.cy, p.x-g.bx);
      if(MIX.lastAng!==null){
        let d = a - MIX.lastAng;
        while(d>Math.PI) d -= Math.PI*2;
        while(d<-Math.PI) d += Math.PI*2;
        MIX.stir += Math.abs(d);
        MIX.stirVel = Math.min(1, Math.abs(d)*9);
        const ht = Math.floor(MIX.stir/Math.PI);
        if(ht > MIX.halfTurns){ MIX.halfTurns = ht; sSquish(0.14 + 0.1*Math.min(1,MIX.stir/STIR_NEED)); }
      }
      MIX.lastAng = a;
    }
    return;
  }
  if(!grab.on) return; const p = evPos(e);
  grab.moved += Math.hypot(p.x-grab.x, p.y-grab.y);
  grab.x = p.x; grab.y = p.y;
});
function endGrab(fling){
  if(!grab.on) return;
  grab.on = false;
  const dt = performance.now()-grab.t0;
  const stretch = Math.hypot(grab.x-blob.cx, grab.y-blob.cy)/blob.r;
  if(dt < 200 && grab.moved < 12){
    // poke: radial dent + squish
    const ang = Math.atan2(grab.y-blob.cy, grab.x-blob.cx);
    blob.pts.forEach(pt=>{
      const w = Math.exp(-Math.pow(angDist(pt.a, ang)/0.8, 2));
      pt.vx -= Math.cos(ang)*260*w; pt.vy -= Math.sin(ang)*260*w;
    });
    sSquish(0.7);
    if(P.beads) sCrunch(0.6);
  } else {
    if(fling){ blob.vx += grab.vx*0.75; blob.vy += grab.vy*0.75; }
    const snapI = Math.min(1, (stretch-1)/Math.max(0.4, P.stretchMax-1));
    if(snapI > 0.15){ sSnap(snapI); blob.sxv += (Math.random()-.5)*3; blob.syv -= snapI*2.5; }
    else sSquish(0.3+snapI);
    if(P.beads && snapI>0.1) sCrunch(snapI);
  }
  stretchGain(0);
}
cv.addEventListener('pointerup', ()=>{
  if(MIX){ MIX.pouring=false; MIX.stirring=false; MIX.lastAng=null; return; }
  endGrab(true);
});
cv.addEventListener('pointercancel', ()=>{
  if(MIX){ MIX.pouring=false; MIX.stirring=false; MIX.lastAng=null; return; }
  endGrab(false);
});
function angDist(a,b){ let d = Math.abs(a-b)%(Math.PI*2); return d>Math.PI ? Math.PI*2-d : d; }

/* sim */
let last = performance.now();
function step(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  const G = 1500;

  if(MIX){
    if(MIX.pouring && MIX.stage===0){
      MIX.level = Math.min(1, MIX.level + dt/1.6);
      bedGain(0.09, 300);
      if(MIX.level>=1) advMix(1);
    } else if(MIX.pouring && MIX.stage===1){
      MIX.actLevel = Math.min(1, MIX.actLevel + dt/1.1);
      bedGain(0.07, 850);
      if(MIX.actLevel>=1) advMix(2);
    } else if(MIX.stage===3){
      MIX.stirVel *= Math.max(0, 1-6*dt);
      bedGain(MIX.stirVel*0.08, 480);
    } else {
      bedGain(0);
    }
    // falling sprinkles settle onto the tilted surface ellipse
    const g = mixGeo();
    const landY = p => {
      const u = Math.max(-1, Math.min(1, (p.x-g.bx)/Math.max(1,g.srx)));
      return g.surfaceY + (p.eoff||0)*g.sry*Math.sqrt(Math.max(0, 1-u*u)) - 2;
    };
    for(const p of MIX.parts){
      if(!p.rest){
        p.vy += 900*dt; p.y += p.vy*dt;
        if(p.y >= landY(p)){ p.y = landY(p); p.rest = true; }
      } else { p.y = Math.min(p.y, landY(p)); }
    }
    if(MIX.stage===3 && MIX.stir >= STIR_NEED){ finishMix(); }
    else { drawMix(now/1000); requestAnimationFrame(step); return; }
  }

  // pointer velocity (smoothed)
  if(grab.on){
    const ivx = (grab.x-grab.px)/Math.max(dt,0.001), ivy = (grab.y-grab.py)/Math.max(dt,0.001);
    grab.vx += (ivx-grab.vx)*0.25; grab.vy += (ivy-grab.vy)*0.25;
    grab.px = grab.x; grab.py = grab.y;
  }

  // center
  if(grab.on){
    blob.vx += (grab.x-blob.cx)*4.5*dt*60*0.06;
    blob.vy += (grab.y-blob.cy)*4.5*dt*60*0.06;
    blob.vx *= 0.86; blob.vy *= 0.86;
    // grip slip when overstretched
    const s = Math.hypot(grab.x-blob.cx, grab.y-blob.cy)/blob.r;
    if(s > P.stretchMax){
      const snapI = Math.min(1, s/3.2);
      grab.on = false; sSnap(snapI); stretchGain(0);
      blob.pts.forEach(pt=>{ pt.vx *= 0.4; pt.vy *= 0.4; });
      blob.syv -= snapI*3; blob.sxv += snapI*2;
    } else {
      stretchGain(Math.min(1, Math.hypot(grab.vx,grab.vy)/900) * Math.min(1, s/1.4));
    }
  } else {
    blob.vy += G*dt;
  }
  blob.cx += blob.vx*dt; blob.cy += blob.vy*dt;

  // walls + floor for center
  const rx = blob.r*blob.sx, ry = blob.r*blob.sy;
  if(blob.cx < rx*0.8){ blob.cx = rx*0.8; blob.vx = Math.abs(blob.vx)*P.bounce; if(Math.abs(blob.vx)>60) sSquish(Math.min(1,Math.abs(blob.vx)/900)); }
  if(blob.cx > W-rx*0.8){ blob.cx = W-rx*0.8; blob.vx = -Math.abs(blob.vx)*P.bounce; if(Math.abs(blob.vx)>60) sSquish(Math.min(1,Math.abs(blob.vx)/900)); }
  if(blob.cy < -blob.r*2.5) blob.cy = -blob.r*2.5;
  blob.grounded = false;
  if(blob.cy > matY - ry){
    const impact = blob.vy;
    blob.cy = matY - ry; blob.grounded = true;
    if(impact > 140){
      blob.vy = -impact*P.bounce;
      blob.syv -= Math.min(3.5, impact/450);
      sSquish(Math.min(1, impact/1100));
      if(P.beads) sCrunch(Math.min(1, impact/1400)*0.7);
    } else { blob.vy = 0; }
    blob.vx *= (1 - Math.min(0.9, 3*dt*(1+P.wet*2)));
  }

  // squash/stretch springs (jello wobble) + slump
  let txs = 1, tys = 1;
  if(blob.grounded && !grab.on && Math.abs(blob.vx)<40){
    txs = 1 + P.slump*0.55; tys = 1 - P.slump*0.38;
  }
  const wk = P.wobbleK, wd = 2.2 + P.wet*4;
  blob.sxv += (txs-blob.sx)*wk*dt*8; blob.sxv *= Math.max(0, 1-wd*dt);
  blob.syv += (tys-blob.sy)*wk*dt*8; blob.syv *= Math.max(0, 1-wd*dt);
  blob.sx = Math.max(0.35, blob.sx + blob.sxv*dt*6);
  blob.sy = Math.max(0.35, blob.sy + blob.syv*dt*6);

  // perimeter points
  const k = P.stiff, dampF = Math.pow(P.damp, dt*60);
  for(let i=0;i<N;i++){
    const pt = blob.pts[i];
    const tx = blob.cx + Math.cos(pt.a)*blob.r*blob.sx;
    const ty = blob.cy + Math.sin(pt.a)*blob.r*blob.sy;
    pt.vx += (tx-pt.x)*k*dt; pt.vy += (ty-pt.y)*k*dt;
    const pn = blob.pts[(i+1)%N], pp = blob.pts[(i-1+N)%N];
    pt.vx += ((pn.x+pp.x)/2 - pt.x)*60*dt; pt.vy += ((pn.y+pp.y)/2 - pt.y)*60*dt;
    pt.vy += G*0.10*P.slump*dt; // droopy sag for undercured goo
    if(grab.on){
      const w = Math.exp(-Math.pow(angDist(pt.a, blob.pts[grab.gi].a)/0.75, 2));
      pt.vx += (grab.x-pt.x)*k*1.6*w*dt; pt.vy += (grab.y-pt.y)*k*1.6*w*dt;
    }
    pt.vx *= dampF; pt.vy *= dampF;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    if(pt.y > matY){ pt.y = matY; pt.vy *= -0.15; pt.vx *= 0.9; }
    if(pt.x < 4){ pt.x = 4; pt.vx = Math.abs(pt.vx)*0.3; }
    if(pt.x > W-4){ pt.x = W-4; pt.vx = -Math.abs(pt.vx)*0.3; }
  }

  draw(now/1000);
  requestAnimationFrame(step);
}

/* ============================== RENDER ============================== */
function drawRoom(){
  const wall = ctx.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,'#f3e9fb'); wall.addColorStop(1,'#e4d6f2');
  ctx.fillStyle = wall; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(51,37,74,0.05)';
  for(let x=20;x<W;x+=46) for(let y=18;y<matY-10;y+=46) ctx.fillRect(x,y,3,3);
  // mat
  ctx.fillStyle = '#c9b3e6'; ctx.fillRect(0, matY, W, H-matY);
  ctx.fillStyle = '#b89ede'; ctx.fillRect(0, matY, W, 6);
  ctx.strokeStyle = 'rgba(51,37,74,0.12)'; ctx.lineWidth = 1;
  // third-person tilt: mat grid fans toward the viewer + depth-compressed rows
  const vpx = W/2;
  for(let x=0;x<=W;x+=34){ ctx.beginPath(); ctx.moveTo(x, matY+8); ctx.lineTo(vpx+(x-vpx)*1.22, H); ctx.stroke(); }
  for(let i=1;i<=3;i++){
    const k=i/3, y=matY+8+(H-matY-8)*k*k;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}
function lerpColor(h1, h2, k){
  const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16);
  const r = Math.round((a>>16) + (((b>>16)-(a>>16))*k));
  const g = Math.round(((a>>8)&255) + ((((b>>8)&255)-((a>>8)&255))*k));
  const bl = Math.round((a&255) + (((b&255)-(a&255))*k));
  return 'rgb('+r+','+g+','+bl+')';
}
function bowlPath(g){
  ctx.beginPath();
  ctx.moveTo(g.bx-g.rx, g.topY);
  ctx.bezierCurveTo(g.bx-g.rx, g.topY+g.bh*0.62, g.bx-g.bw*0.34, g.by, g.bx, g.by);
  ctx.bezierCurveTo(g.bx+g.bw*0.34, g.by, g.bx+g.rx, g.topY+g.bh*0.62, g.bx+g.rx, g.topY);
}
function drawMix(t){
  drawRoom();
  const g = mixGeo();
  const m = Math.min(1, MIX.stir/STIR_NEED);          // stir blend 0..1
  const liq = GLUE_LIQ[recipe.glue];
  const stage = MIX.stage;
  const wob = (stage===3 && MIX.stirVel>0.05 && !REDUCED) ? Math.sin(t*22)*0.015*MIX.stirVel : 0;
  // color of whatever is on top right now (activator floats until stirred in)
  const topCol = (MIX.actLevel>0.05 && m<0.5) ? lerpColor('#cfe8f2', P.color, m*2) : lerpColor(liq, P.color, m);
  ctx.save();
  ctx.translate(g.bx, g.by); ctx.rotate(wob); ctx.translate(-g.bx, -g.by);

  /* refractive glass pass — screen-space "shader": the backdrop is re-drawn
     through the bowl silhouette in strips with edge-heavy lens displacement
     and center magnification, so the glass visibly bends what's behind it */
  const rgn = { x: Math.max(0, g.bx-g.rx-24), y: Math.max(0, g.topY-14), w: g.bw+48, h: g.bh+22 };
  if(!MIXBUF){ MIXBUF = document.createElement('canvas'); MIXBUFX = MIXBUF.getContext('2d'); }
  const bufW = Math.ceil(rgn.w*DPR), bufH = Math.ceil(rgn.h*DPR);
  if(MIXBUF.width!==bufW || MIXBUF.height!==bufH){ MIXBUF.width=bufW; MIXBUF.height=bufH; }
  MIXBUFX.clearRect(0,0,bufW,bufH);
  MIXBUFX.drawImage(cv, rgn.x*DPR, rgn.y*DPR, bufW, bufH, 0, 0, bufW, bufH);
  ctx.save();
  bowlPath(g); ctx.closePath(); ctx.clip();
  const STRIPS = 36;
  for(let i=0;i<STRIPS;i++){
    const u = (i+0.5)/STRIPS*2-1;                 // -1..1 across the bowl
    const dx0 = g.bx - g.rx + i*(g.bw/STRIPS);
    const sw = g.bw/STRIPS + 1;
    const shift = u*u*u*11 - u*4.5;               // lens displacement, strongest at the walls
    const stretch = 1 + 0.10*(1-u*u);             // center magnification
    const sxb = (dx0 + shift - rgn.x)*DPR, syb = 0;
    ctx.drawImage(MIXBUF,
      Math.max(0, Math.min(bufW-sw*DPR, sxb)), syb, sw*DPR, bufH,
      dx0, rgn.y + (1-stretch)*rgn.h*0.5, sw, rgn.h*stretch);
  }
  ctx.restore();

  /* bowl shadow on the mat */
  ctx.fillStyle = 'rgba(51,37,74,0.16)';
  ctx.beginPath(); ctx.ellipse(g.bx, g.by+4, g.bw*0.42, 7, 0, 0, Math.PI*2); ctx.fill();

  /* glass body tint */
  bowlPath(g); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();

  /* liquid layers seen through the glass side (slightly magnified by the glass) */
  ctx.save();
  bowlPath(g); ctx.closePath(); ctx.clip();
  ctx.translate(g.bx,0); ctx.scale(1.045,1); ctx.translate(-g.bx,0);
  const glueTop = g.by - g.glueH;
  const wave = x => Math.sin(t*5 + x*0.08)*2 + (m>0 ? Math.sin(t*13 + x*0.15)*5*m*(0.3+MIX.stirVel) : 0);
  if(MIX.level>0){
    ctx.fillStyle = lerpColor(liq, P.color, m);
    ctx.beginPath();
    ctx.moveTo(g.bx-g.rx, glueTop + wave(-g.rx));
    for(let x=-g.rx; x<=g.rx; x+=10) ctx.lineTo(g.bx+x, glueTop + wave(x));
    ctx.lineTo(g.bx+g.rx, g.by); ctx.lineTo(g.bx-g.rx, g.by);
    ctx.closePath(); ctx.fill();
  }
  if(MIX.actLevel>0){
    ctx.fillStyle = hexA('#cfe8f2', 0.92*(1-m*0.85));
    ctx.beginPath();
    ctx.moveTo(g.bx-g.rx, g.surfaceY + wave(-g.rx)*0.7);
    for(let x=-g.rx; x<=g.rx; x+=10) ctx.lineTo(g.bx+x, g.surfaceY + wave(x)*0.7);
    ctx.lineTo(g.bx+g.rx, glueTop+3); ctx.lineTo(g.bx-g.rx, glueTop+3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(51,37,74,'+(0.28*(1-m))+')'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let x=-g.rx; x<=g.rx; x+=10){
      const y = glueTop + wave(x)*0.8;
      x===-g.rx ? ctx.moveTo(g.bx+x, y) : ctx.lineTo(g.bx+x, y);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* looking INTO the bowl: back rim, inner wall, liquid surface disc */
  // back rim arc (behind everything at the mouth)
  ctx.strokeStyle = 'rgba(51,37,74,0.5)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(g.bx, g.topY, g.rx, g.ry, 0, Math.PI, Math.PI*2); ctx.stroke();
  // interior wall between back rim and the liquid surface
  if(g.surfaceY > g.topY+2){
    ctx.fillStyle = 'rgba(51,37,74,0.12)';
    ctx.beginPath();
    ctx.ellipse(g.bx, g.topY, g.rx*0.98, g.ry*0.98, 0, Math.PI, Math.PI*2);
    ctx.lineTo(g.bx+g.srx, g.surfaceY);
    ctx.ellipse(g.bx, g.surfaceY, g.srx, g.sry, 0, 0, Math.PI, true);
    ctx.closePath(); ctx.fill();
  }
  // the surface itself — an ellipse disc you look down onto
  if(MIX.level>0 || MIX.actLevel>0){
    ctx.fillStyle = lerpColor(topCol, '#ffffff', 0.16);
    ctx.beginPath(); ctx.ellipse(g.bx, g.surfaceY, g.srx, g.sry, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(51,37,74,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
    // swirl streaks ON the tilted surface while stirring
    if(m>0 && m<0.97){
      ctx.strokeStyle = hexA(liq==='#f7f2e9'?'#ffffff':liq, 0.6*(1-m));
      ctx.lineWidth = 3;
      for(let i=0;i<3;i++){
        const sa = t*3.2 + i*2.1 + m*5;
        const rr = 0.72 - i*0.2;
        ctx.beginPath();
        ctx.ellipse(g.bx, g.surfaceY, g.srx*rr, g.sry*rr, 0, sa, sa+2.1);
        ctx.stroke();
      }
    }
    // pour splash ripples where the stream lands
    if(MIX.pouring && stage<=1){
      const sx = Math.max(g.bx-g.srx*0.7, Math.min(g.bx+g.srx*0.7, MIX.px));
      for(let i=0;i<2;i++){
        const rr = ((t*1.6)+i*0.5) % 1;
        ctx.strokeStyle = 'rgba(255,255,255,'+(0.55*(1-rr))+')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(sx, g.surfaceY, g.srx*0.3*rr+3, (g.srx*0.3*rr+3)*TILT, 0, 0, Math.PI*2); ctx.stroke();
      }
    }
  }

  /* sprinkles: fall from above, rest ON the surface ellipse, swirl in while stirring */
  for(let i=0;i<MIX.parts.length;i++){
    const p = MIX.parts[i];
    const jx = p.rest && m>0 ? Math.sin(t*4+i*1.7)*g.srx*0.14*m : 0;
    const jy = p.rest && m>0 ? Math.cos(t*4+i*1.7)*g.sry*0.14*m : 0;
    const al = p.k==='ch' ? 1 : 1-m*0.6;
    if(p.k==='pig'){ ctx.fillStyle = hexA(P.color, al); ctx.fillRect(p.x+jx-2, p.y+jy-2, 4, 4); }
    else if(p.k==='gl'){ ctx.fillStyle = 'rgba(255,255,255,'+(0.95*al)+')'; ctx.fillRect(p.x+jx-1.6, p.y+jy-1.6, 3.2, 3.2); }
    else if(p.k==='bd'){ ctx.fillStyle = 'rgba(255,255,255,'+(0.85*al)+')'; ctx.beginPath(); ctx.arc(p.x+jx, p.y+jy, 3.3, 0, Math.PI*2); ctx.fill(); }
    else { ctx.font='17px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.globalAlpha = al; ctx.fillText(p.em, p.x+jx, p.y+jy); ctx.globalAlpha = 1; }
  }

  /* fill targets as dashed depth ellipses */
  ctx.strokeStyle = 'rgba(51,37,74,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
  if(stage===0){
    const hw = g.hwAt(g.maxLiq);
    ctx.beginPath(); ctx.ellipse(g.bx, g.by-g.maxLiq, hw, hw*TILT, 0, 0, Math.PI*2); ctx.stroke();
  } else if(stage===1){
    const hw = g.hwAt(g.maxLiq+g.actH);
    ctx.beginPath(); ctx.ellipse(g.bx, g.by-g.maxLiq-g.actH, hw, hw*TILT, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.setLineDash([]);

  /* pouring stream from the tool down into the mouth */
  if(MIX.pouring && stage<=1){
    const sx = Math.max(g.bx-g.srx*0.7, Math.min(g.bx+g.srx*0.7, MIX.px));
    ctx.fillStyle = stage===0 ? liq : 'rgba(207,232,242,0.9)';
    const sw = stage===0 ? 7 : 4;
    ctx.fillRect(sx-sw/2, g.topY-46, sw, Math.max(0, g.surfaceY-(g.topY-46)));
    for(let i=0;i<3;i++){
      const dy = g.surfaceY - ((t*260+i*37) % 30);
      ctx.beginPath(); ctx.ellipse(sx+(i-1)*4, dy, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  /* tools */
  ctx.lineCap='round';
  const toolX = Math.max(g.bx-g.bw*0.3, Math.min(g.bx+g.bw*0.3, MIX.px));
  if(stage===0){ // glue bottle
    ctx.save();
    ctx.translate(toolX, g.topY-58); ctx.rotate(MIX.pouring?0.9:0.45);
    ctx.fillStyle = '#fffdf7'; ctx.strokeStyle = 'rgba(51,37,74,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-14,-52,28,52,7) : ctx.rect(-14,-52,28,52); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffb62e'; ctx.fillRect(-6,-2,12,14); ctx.strokeRect(-6,-2,12,14);
    ctx.fillStyle = 'rgba(51,37,74,0.7)'; ctx.font='700 10px "Space Mono",monospace'; ctx.textAlign='center';
    ctx.save(); ctx.rotate(-Math.PI/2); ctx.fillText('GLUE', 26, 2); ctx.restore();
    ctx.restore();
  } else if(stage===1){ // activator dropper
    ctx.save();
    ctx.translate(toolX, g.topY-56); ctx.rotate(MIX.pouring?0.65:0.3);
    ctx.fillStyle = '#dff2f9'; ctx.strokeStyle = 'rgba(51,37,74,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-9,-42,18,42,6) : ctx.rect(-9,-42,18,42); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#35d6b1'; ctx.fillRect(-5,-1,10,10); ctx.strokeRect(-5,-1,10,10);
    ctx.restore();
  } else if(stage===2){ // shaker
    const shake = (!REDUCED && MIX.parts.some(p=>!p.rest)) ? Math.sin(t*40)*3 : 0;
    ctx.save();
    ctx.translate(toolX+shake, g.topY-64);
    ctx.fillStyle = '#f4ecdd'; ctx.strokeStyle = 'rgba(51,37,74,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-13,-30,26,38,6) : ctx.rect(-13,-30,26,38); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(51,37,74,0.7)';
    for(let i=-1;i<=1;i++) ctx.beginPath(), ctx.arc(i*7, 12, 1.8, 0, Math.PI*2), ctx.fill();
    ctx.restore();
  } else { // spoon dips into the tilted surface, projected onto the ellipse
    let dx = MIX.px - g.bx, dy = MIX.py - g.surfaceY;
    const u = dx/Math.max(1,g.srx*0.62), v = dy/Math.max(1,g.sry*0.62);
    const n = Math.hypot(u,v);
    if(n>1){ dx/=n; dy/=n; }
    const spx = g.bx + dx, spy = g.surfaceY + dy;
    ctx.strokeStyle = '#8a6b4a'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(spx+g.bw*0.2, Math.max(6, g.topY-62)); ctx.lineTo(spx, spy-4); ctx.stroke();
    ctx.fillStyle = '#a5825c';
    ctx.beginPath(); ctx.ellipse(spx, spy+3, 9, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(51,37,74,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  }

  /* fresnel edges: faint chromatic fringe hugging the glass walls */
  ctx.save();
  bowlPath(g); ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(140,220,255,0.22)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(g.bx-g.rx+3, g.topY+4); ctx.bezierCurveTo(g.bx-g.rx+3, g.topY+g.bh*0.62, g.bx-g.bw*0.34, g.by-3, g.bx, g.by-3); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,150,210,0.16)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(g.bx+g.rx-3, g.topY+4); ctx.bezierCurveTo(g.bx+g.rx-3, g.topY+g.bh*0.62, g.bx+g.bw*0.34, g.by-3, g.bx, g.by-3); ctx.stroke();
  ctx.restore();

  /* front rim + glass silhouette on top of everything */
  ctx.strokeStyle = 'rgba(51,37,74,0.78)'; ctx.lineWidth = 3.5; ctx.lineJoin='round';
  bowlPath(g); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(g.bx, g.topY, g.rx, g.ry, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(g.bx-g.rx*0.86, g.topY+g.bh*0.2); ctx.quadraticCurveTo(g.bx-g.rx*0.8, g.topY+g.bh*0.62, g.bx-g.bw*0.2, g.by-8); ctx.stroke();
  ctx.restore();

  /* progress label */
  ctx.fillStyle = 'rgba(51,37,74,0.85)';
  ctx.font = '700 13px "Space Mono", monospace'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const pct = v => Math.round(v*100)+'%';
  const labels = [
    GLUES[recipe.glue].name.toLowerCase()+' glue · '+pct(MIX.level),
    ACTS[recipe.act].name.toLowerCase()+' activator · '+pct(MIX.actLevel),
    'sprinkle '+PIGMENTS[recipe.pigment].name+' + add-ins · '+MIX.sprinkles+'/3',
    'stir · '+pct(Math.min(1, MIX.stir/STIR_NEED)),
  ];
  ctx.fillText(labels[stage], g.bx, Math.max(20, g.topY-80));
}
function draw(t){
  drawRoom();

  // shadow
  const shw = blob.r*blob.sx*1.15, shy = Math.max(0.25, 1-Math.max(0,(matY-blob.cy-blob.r))/300);
  ctx.fillStyle = 'rgba(51,37,74,'+(0.18*shy)+')';
  ctx.beginPath(); ctx.ellipse(blob.cx, matY+7, shw*shy+10, 8, 0, 0, Math.PI*2); ctx.fill();

  // blob path through midpoints
  ctx.save();
  ctx.beginPath();
  const pts = blob.pts;
  let mx = (pts[N-1].x+pts[0].x)/2, my = (pts[N-1].y+pts[0].y)/2;
  ctx.moveTo(mx,my);
  for(let i=0;i<N;i++){
    const a = pts[i], b = pts[(i+1)%N];
    ctx.quadraticCurveTo(a.x, a.y, (a.x+b.x)/2, (a.y+b.y)/2);
  }
  ctx.closePath();
  if(P.glow){ ctx.shadowColor = P.color; ctx.shadowBlur = 34; }
  const light = shade(P.color, 45), dark = shade(P.color, -38);
  const gr = ctx.createRadialGradient(blob.cx-blob.r*0.35, blob.cy-blob.r*0.45, blob.r*0.1, blob.cx, blob.cy, blob.r*1.5);
  gr.addColorStop(0, hexA(light, P.alpha));
  gr.addColorStop(0.55, hexA(P.color, P.alpha));
  gr.addColorStop(1, hexA(dark, Math.min(1,P.alpha+0.04)));
  ctx.fillStyle = gr; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = hexA(dark, 0.85); ctx.lineWidth = 3; ctx.stroke();
  ctx.clip();

  // inclusions ride the deformation
  const px = (a,d)=>({ x: blob.cx + Math.cos(a)*blob.r*blob.sx*d, y: blob.cy + Math.sin(a)*blob.r*blob.sy*d });
  decor.beads.forEach(bd=>{
    const p = px(bd.a, bd.d);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(p.x, p.y, bd.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(51,37,74,0.15)';
    ctx.beginPath(); ctx.arc(p.x+1, p.y+1, bd.r*0.5, 0, Math.PI*2); ctx.fill();
  });
  decor.glitter.forEach(gl=>{
    const p = px(gl.a, gl.d);
    const tw = REDUCED ? 0.7 : 0.4+0.6*Math.abs(Math.sin(t*gl.sp+gl.ph));
    ctx.fillStyle = 'rgba(255,255,255,'+(0.9*tw)+')';
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(gl.ph+t*(REDUCED?0:0.6));
    ctx.fillRect(-1.6,-1.6,3.2,3.2); ctx.restore();
  });
  ctx.font = '22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  decor.charms.forEach(ch=>{
    const p = px(ch.a, ch.d);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ch.rot); ctx.globalAlpha = 0.95; ctx.fillText(ch.em, 0, 0); ctx.restore();
  });

  // gloss highlight
  ctx.fillStyle = 'rgba(255,255,255,'+(P.gloss*0.5)+')';
  ctx.beginPath();
  ctx.ellipse(blob.cx-blob.r*0.35*blob.sx, blob.cy-blob.r*0.42*blob.sy, blob.r*0.34*blob.sx, blob.r*0.18*blob.sy, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,'+(P.gloss*0.35)+')';
  ctx.beginPath(); ctx.arc(blob.cx+blob.r*0.25*blob.sx, blob.cy-blob.r*0.15*blob.sy, blob.r*0.07, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ============================== SOUND ============================== */
let AC=null, master=null, muted=false, stretchSrc=null, stretchG=null, stretchF=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.8; master.connect(AC.destination);
    // continuous stretch bed
    const buf = noiseBuf(2);
    stretchSrc = AC.createBufferSource(); stretchSrc.buffer = buf; stretchSrc.loop = true;
    stretchF = AC.createBiquadFilter(); stretchF.type='bandpass'; stretchF.Q.value = 2.5;
    stretchG = AC.createGain(); stretchG.gain.value = 0;
    stretchSrc.connect(stretchF); stretchF.connect(stretchG); stretchG.connect(master);
    stretchSrc.start();
  }catch(e){ AC=null; }
}
function noiseBuf(sec){
  const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return b;
}
function stretchGain(v){
  if(!AC||!stretchG) return;
  stretchF.frequency.setTargetAtTime(180+P.pitch*260, AC.currentTime, 0.05);
  stretchG.gain.setTargetAtTime(v*0.10, AC.currentTime, 0.06);
}
/* pour/stir bed reuses the looped noise (glue=low glug, activator=high trickle, stir=mid slosh) */
function bedGain(v, f){
  if(!AC||!stretchG) return;
  if(f) stretchF.frequency.setTargetAtTime(f, AC.currentTime, 0.05);
  stretchG.gain.setTargetAtTime(v, AC.currentTime, 0.06);
}
function sSquish(i){
  if(!AC) return; i = Math.max(0.08, Math.min(1,i));
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf(0.3);
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.4;
  const f0 = (240 + 420*P.pitch) * (0.7+i*0.5);
  f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, f0*0.28), t+0.16+P.wet*0.12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.35*i, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.2+P.wet*0.15);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+0.4);
  if(P.wet>0.45){ // bubbly squelch blips for undercured goo
    const nb = 1+Math.floor(Math.random()*3);
    for(let j=0;j<nb;j++){
      const o = AC.createOscillator(), og = AC.createGain();
      const st = t + 0.02 + Math.random()*0.12;
      o.type='sine';
      o.frequency.setValueAtTime(120+Math.random()*160, st);
      o.frequency.exponentialRampToValueAtTime(60, st+0.07);
      og.gain.setValueAtTime(0.001, st);
      og.gain.exponentialRampToValueAtTime(0.10*i*P.wet, st+0.008);
      og.gain.exponentialRampToValueAtTime(0.001, st+0.08);
      o.connect(og); og.connect(master); o.start(st); o.stop(st+0.1);
    }
  }
}
function sSnap(i){
  if(!AC) return; i = Math.max(0.15, Math.min(1,i));
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square';
  const f0 = 170*P.pitch*(1+i*0.8);
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(45, f0*0.22), t+0.09);
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.30*i, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.11);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.13);
  const src = AC.createBufferSource(); src.buffer = noiseBuf(0.1);
  const f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value = 900+900*P.pitch;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.16*i, t); ng.gain.exponentialRampToValueAtTime(0.001, t+0.05);
  src.connect(f); f.connect(ng); ng.connect(master); src.start(t); src.stop(t+0.1);
}
function sCrunch(i){
  if(!AC) return; i = Math.max(0.1, Math.min(1,i));
  const t = AC.currentTime, n = 5+Math.floor(Math.random()*4);
  for(let j=0;j<n;j++){
    const st = t + j*(0.015+Math.random()*0.03);
    const src = AC.createBufferSource(); src.buffer = noiseBuf(0.04);
    const f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value = 1800+Math.random()*2600;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.12*i*(0.5+Math.random()*0.5), st);
    g.gain.exponentialRampToValueAtTime(0.001, st+0.03);
    src.connect(f); f.connect(g); g.connect(master); src.start(st); src.stop(st+0.05);
  }
}
function sMix(){
  if(!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf(0.9);
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(220, t);
  f.frequency.linearRampToValueAtTime(700, t+0.4);
  f.frequency.linearRampToValueAtTime(180, t+0.85);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(0.16, t+0.15);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.9);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+1);
}
$('muteBtn').addEventListener('click', function(){
  muted = !muted;
  this.textContent = muted ? '🔇' : '🔊';
  this.setAttribute('aria-pressed', String(muted));
  if(master) master.gain.setTargetAtTime(muted?0:0.8, AC.currentTime, 0.03);
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
  if(e.key==='m'||e.key==='M') $('muteBtn').click();
  if(e.key==='r'||e.key==='R'){ audioInit(); derive(); freshBatch(); }
  if(e.key==='Enter' && MIX){ // keyboard fallback: complete the current step
    audioInit();
    if(MIX.stage===0){ MIX.level=1; advMix(1); }
    else if(MIX.stage===1){ MIX.actLevel=1; advMix(2); }
    else if(MIX.stage===2){ while(MIX.sprinkles<3) sprinkle({x:W/2, y:0}); }
    else MIX.stir = STIR_NEED;
  }
});

/* ============================== BOOT ============================== */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
buildOpts('glueRow', GLUES, 'glue', ()=>applyTweak());
buildOpts('actRow', ACTS, 'act', ()=>applyTweak());
buildSwatches(); buildChips();
derive();
buildBlob(true);
setTimeout(()=>$('hint').classList.add('gone'), 6000);
requestAnimationFrame(t=>{ last=t; step(t); });
</script>
