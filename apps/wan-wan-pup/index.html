  g.beginPath(); g.moveTo(hx-86,hy+6); g.bezierCurveTo(hx-90,hy-60,hx-40,hy-84,hx,hy-84); g.bezierCurveTo(hx+40,hy-84,hx+90,hy-60,hx+86,hy+6);
  g.bezierCurveTo(hx+92,hy+30,hx+80,hy+56,hx+58,hy+64); g.quadraticCurveTo(hx,hy+82,hx-58,hy+64); g.bezierCurveTo(hx-80,hy+56,hx-92,hy+30,hx-86,hy+6); g.closePath(); line(g,4.5);
  /* eyebrow dots */
  g.fillStyle=K.cream; g.beginPath(); g.ellipse(hx-36,hy-30,8,5,-.2,0,7); g.ellipse(hx+36,hy-30,8,5,.2,0,7); g.fill();
  /* munching cheeks */
  var puff=munchA?3+Math.abs(Math.sin((t-P.munch)*16))*5:0;
  /* blush with little lines */
  g.fillStyle=K.blush; g.globalAlpha=.55+.3*happyA; g.beginPath(); g.ellipse(hx-56,hy+22,15+puff*.6,9+puff*.4,0,0,7); g.ellipse(hx+56,hy+22,15+puff*.6,9+puff*.4,0,0,7); g.fill(); g.globalAlpha=1;
  g.beginPath(); [-62,-56,-50].forEach(function(d){ g.moveTo(hx+d,hy+26); g.lineTo(hx+d+5,hy+18); g.moveTo(hx-d,hy+26); g.lineTo(hx-d+5,hy+18); }); line(g,1.8,'#e0607e');
  /* eyes */
  var blink=env(t-P.blinkAt,.05,.04,.08);
  if(!RM&&t>P.nBlink){ P.blinkAt=t; P.nBlink=t+2.5+Math.random()*3.5; }
  var lk=[(P.look[0]-hx)/200,(P.look[1]-hy)/200]; lk=[Math.max(-1,Math.min(1,lk[0]))*4,Math.max(-1,Math.min(1,lk[1]))*4];
  var excited=P.flying!=null||t-P.zoom<1.4&&t-P.zoom>=0;
  if(bangA>.5){ xEye(g,hx-36,hy); xEye(g,hx+36,hy); }
  else if(happyA>.3||munchA){ happyEye(g,hx-36,hy,munchA?1:0); happyEye(g,hx+36,hy,munchA?1:0); }
  else { eye(g,hx-36,hy,blink,lk,excited); eye(g,hx+36,hy,blink,lk,excited); }
  /* nose + mouth */
  g.beginPath(); g.moveTo(hx-8,hy+22); g.quadraticCurveTo(hx,hy+17,hx+8,hy+22); g.quadraticCurveTo(hx+3,hy+30,hx,hy+30); g.quadraticCurveTo(hx-3,hy+30,hx-8,hy+22); g.fillStyle=K.nose; g.fill();
  g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(hx-2,hy+21,2.5,1.4,0,0,7); g.fill();
  var open=Math.max(barkA, bangA>.5?.7:0, P.flying?Math.min(1,(t-P.flying.t)/P.flying.d)*.8:0, munchA?Math.abs(Math.sin((t-P.munch)*16))*.35:0);
  if(open>.08){ g.beginPath(); g.moveTo(hx-11,hy+33); g.quadraticCurveTo(hx,hy+33+24*open,hx+11,hy+33); g.closePath(); g.fillStyle='#7a2a22'; g.fill(); line(g,2.6);
    g.save(); g.clip(); g.fillStyle=K.tongue; g.beginPath(); g.ellipse(hx,hy+33+20*open,9,8*open+2,0,0,7); g.fill(); g.restore(); }
  g.beginPath(); g.moveTo(hx,hy+30); g.lineTo(hx,hy+33); g.moveTo(hx-12,hy+31); g.quadraticCurveTo(hx-6,hy+38,hx,hy+33); g.quadraticCurveTo(hx+6,hy+38,hx+12,hy+31); line(g,2.6);
  g.restore();
  g.restore();
}
function ear(g,x,y,side,up,flop){
  g.save(); g.translate(x,y); g.rotate(side*(.18-up*.12)+flop);
  g.beginPath(); g.moveTo(-26,14); g.quadraticCurveTo(-18-side*2,-30-up*6,side*4,-46-up*8); g.quadraticCurveTo(18+side*4,-24,28,14); g.closePath();
  g.fillStyle=K.tan; g.fill(); line(g,4);
  g.beginPath(); g.moveTo(-15,10); g.quadraticCurveTo(-10,-18,side*3,-32-up*6); g.quadraticCurveTo(10,-14,16,10); g.closePath(); g.fillStyle=K.ear; g.fill();
  g.restore();
}
function eye(g,x,y,blink,lk,ex){
  var ry=21*(1-blink);
  if(ry<3){ g.beginPath(); g.moveTo(x-15,y+2); g.quadraticCurveTo(x,y+8,x+15,y+2); line(g,3.5); return; }
  g.save(); g.beginPath(); g.ellipse(x,y,17,ry,0,0,7); g.clip();
  var eg=g.createLinearGradient(0,y-ry,0,y+ry); eg.addColorStop(0,K.eye0); eg.addColorStop(.55,'#5a2a18'); eg.addColorStop(1,K.eye1); g.fillStyle=eg; g.fillRect(x-20,y-24,40,48);
  g.fillStyle='rgba(255,190,120,.55)'; g.beginPath(); g.ellipse(x+lk[0],y+ry*.55+lk[1],11,6,0,0,7); g.fill();
  g.fillStyle='#1c0b06'; g.beginPath(); g.ellipse(x+lk[0],y+lk[1],8,11*(ry/21),0,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.ellipse(x-6+lk[0]*.5,y-8+lk[1]*.5,6.5,7.5,-.3,0,7); g.fill();
  g.beginPath(); g.arc(x+6+lk[0]*.5,y+7+lk[1]*.5,3,0,7); g.fill();
  if(ex){ sparkle(g,x+5+lk[0]*.5,y-9,6+Math.sin(now*14)*1.5,1); }
  g.restore();
  g.beginPath(); g.ellipse(x,y,17,ry,0,0,7); line(g,3);
  g.beginPath(); g.moveTo(x-19,y-ry*.7); g.quadraticCurveTo(x,y-ry-5,x+19,y-ry*.7); line(g,4.5);
}
function xEye(g,x,y){ g.beginPath(); g.moveTo(x-10,y-10); g.lineTo(x+10,y+10); g.moveTo(x+10,y-10); g.lineTo(x-10,y+10); line(g,4.5); }
function happyEye(g,x,y,shut){
  g.beginPath(); if(shut){ g.moveTo(x-14,y-4); g.lineTo(x+2,y+2); g.lineTo(x-14,y+8); }
  else { g.moveTo(x-15,y+5); g.quadraticCurveTo(x,y-14,x+15,y+5); }
  line(g,4.5);
}

/* ---------- what happens ---------- */
var BARKS=['wan!','wan wan!','ワン!','arf!','wan♪'];
function say(t){ $('say').textContent=t; }
function tossTreat(){
  if(P.flying) return;
  P.jarAt=now; P.tiltTo=-.12; P.wagTo=.9;
  P.flying={t:now, d:RM?.35:.62, x0:58, y0:240, x1:200, y1:212, h:110};
  say('incoming treat…');
  setTimeout(catchIt, (P.flying.d*1000)|0);
}
function catchIt(){
  P.flying=null; P.treats++; $('count').textContent='🦴 '+P.treats; try{ localStorage.setItem('wan-wan-pup-treats',P.treats); }catch(e){} P.hop=now; P.munch=now+.05;
  for(var i=0;i<7;i++) P.crumbs.push({x:194+Math.random()*12,y:214,vx:(Math.random()-.5)*90,vy:-30-Math.random()*50,t:now});
  say('nom nom nom'); nomNom();
  setTimeout(function(){ P.tiltTo=0;
    if(P.treats%5===0){ zoomies(); learn(); return; }
    var nk=learn(); if(nk){ bark('wan!',1.15); P.happy=now; hearts(5); P.sparks=[]; for(var i=0;i<10;i++){ var a=i/10*6.283; P.sparks.push({x:200,y:200,vx:Math.cos(a),vy:Math.sin(a),t:now}); }
      say(NAME+' learned a trick: '+nk.name+(/!$/.test(nk.name)?'':'!')+' press ✨ trick'); setTimeout(function(){ P.wagTo=.3; },2200); return; }
    bark(BARKS[(Math.random()*BARKS.length)|0], 1+Math.random()*.15); P.happy=now; hearts(4);
    var nx=null; TRICKS.forEach(function(k){ if(!nx&&k.at>P.treats) nx=k; });
    say((P.treats===1?NAME+' loves you now':['best treat ever','more?','tail is at full speed','good pup, '+NAME,NAME+' did a little hop'][(Math.random()*5)|0])
      +(nx?' · '+(nx.at-P.treats)+' more '+(nx.at-P.treats===1?'treat':'treats')+' and he learns '+nx.name:''));
    setTimeout(function(){ P.wagTo=.3; },2200);
  },1100);
}
function zoomies(){ P.zoom=now; P.happy=now+.6; P.wagTo=1; bark('WAN WAN!',1.12,2); hearts(8);
  for(var i=0;i<14;i++){ var a=i/14*6.283; P.sparks.push({x:200,y:220,vx:Math.cos(a),vy:Math.sin(a),t:now}); }
  say('ZOOMIES! that was treat number '+P.treats);
  setTimeout(function(){ P.wagTo=.3; },2600); }
/* v1.2 tricks: Wan-kun learns paw at 3 treats, roll over at 7 and bang! (plays dead) at 12; ✨ trick does them in turn */
var TRICKS=[{at:3,name:'paw'},{at:7,name:'roll over'},{at:12,name:'bang!'}];
function learn(){ var n=0; TRICKS.forEach(function(k){ if(P.treats>=k.at) n++; }); var fresh=n>P.learned; P.learned=n; $('trick').hidden=!n; return fresh?TRICKS[n-1]:null; }
function doTrick(){ if(!P.learned||P.flying) return; var k=TRICKS[P.ti%P.learned]; P.ti++;
  if(k.name==='paw'){ P.pawAt=now; P.tiltTo=.12; bark('wan♪',1.05); say(NAME+' gives you a paw'); setTimeout(function(){ P.tiltTo=0; },1300); }
  else if(k.name==='roll over'){ P.rollAt=now; P.wagTo=.9; setTimeout(function(){ bark('wan!',1.1); hearts(3); say('a perfect roll. he wants a treat for that'); P.wagTo=.3; },1100); }
  else { P.bangAt=now; bark('bang!',.9); P.bub='bang!'; say(NAME+' is… very dramatic'); setTimeout(function(){ bark('wan wan!',1.12,2); P.happy=now; hearts(4); say('back from the dead for a treat'); },2000); } }
function hearts(n){ for(var i=0;i<n;i++) P.hearts.push({x:150+Math.random()*100,y:110,t:now+i*.12}); }
function patPup(){ P.happy=now; P.tiltTo=(Math.random()<.5?-1:1)*.16; P.wagTo=.8; hearts(2);
  bark(['wan?','kyun~','wan!'][(Math.random()*3)|0], 1.08);
  say(NAME+' leans into your hand');
  setTimeout(function(){ P.tiltTo=0; P.wagTo=.3; },1400); }
function bark(txt,pitch,n){ P.bub=txt; P.barkAt=now; if(now-P.mewoAt>2.5){ P.mewoAt=now+.35; P.mewoTxt=['…','shh.','really?','…'][(Math.random()*4)|0]; } yip(n||(/wan wan/i.test(txt)?2:1),pitch); }

/* a tiny 'wan': a buzzy tone that leaps up and drops, through two vowel-ish filters */
var AC=null;
function yip(n,pitch){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running') AC.resume();
  for(var k=0;k<n;k++){ var t=AC.currentTime+.02+k*.17, o=AC.createOscillator(), g=AC.createGain(), f1=AC.createBiquadFilter(), f2=AC.createBiquadFilter(), mix=AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(560*pitch,t); o.frequency.linearRampToValueAtTime(1020*pitch,t+.035); o.frequency.exponentialRampToValueAtTime(640*pitch,t+.13);
    f1.type='bandpass'; f1.frequency.setValueAtTime(900,t); f1.frequency.linearRampToValueAtTime(1300,t+.05); f1.Q.value=4;
    f2.type='bandpass'; f2.frequency.value=2300; f2.Q.value=6;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.5,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.connect(f1); o.connect(f2); f1.connect(mix); f2.connect(mix); mix.gain.value=1.4; mix.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.17); }
  }catch(e){} }

/* v1.2 (pochinia: "a silly munch sound whenever he eats"): six chomps, each a crunchy noise tick plus a squeaky little 'nyam'
   that wobbles up and down, a bit faster and higher every time, with a happy 'mm~' hum at the end */
function nomNom(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running') AC.resume();
  var t0=AC.currentTime+.04, sr=AC.sampleRate, nb=AC.createBuffer(1,Math.round(sr*.05),sr), d=nb.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  for(var k=0;k<6;k++){ var t=t0+k*.155-k*k*.004, up=1+k*.05+Math.random()*.06;
    var ns=AC.createBufferSource(); ns.buffer=nb; var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200+Math.random()*1400; bp.Q.value=1.2;
    var ng=AC.createGain(); ng.gain.value=.55; ns.connect(bp); bp.connect(ng); ng.connect(AC.destination); ns.start(t);
    var o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(430*up,t+.02); o.frequency.linearRampToValueAtTime(720*up,t+.06); o.frequency.exponentialRampToValueAtTime(380*up,t+.12);
    f.type='lowpass'; f.frequency.value=1800; g.gain.setValueAtTime(0,t+.02); g.gain.linearRampToValueAtTime(.22,t+.035); g.gain.exponentialRampToValueAtTime(.001,t+.13);
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(t+.02); o.stop(t+.14); }
  var te=t0+6*.155-.1, h=AC.createOscillator(), hg=AC.createGain(), vib=AC.createOscillator(), vg=AC.createGain();
  h.type='sine'; h.frequency.setValueAtTime(520,te); h.frequency.linearRampToValueAtTime(660,te+.25); vib.frequency.value=9; vg.gain.value=18; vib.connect(vg); vg.connect(h.frequency);
  hg.gain.setValueAtTime(0,te); hg.gain.linearRampToValueAtTime(.12,te+.05); hg.gain.exponentialRampToValueAtTime(.001,te+.32);
  h.connect(hg); hg.connect(AC.destination); h.start(te); vib.start(te); h.stop(te+.34); vib.stop(te+.34);
  }catch(e){} }
function sceneXY(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]; }
cv.addEventListener('pointermove',function(e){ P.look=sceneXY(e); });
cv.addEventListener('pointerdown',function(e){ var p=sceneXY(e); P.look=p;
  if(p[0]<100&&p[1]>230&&p[1]<345) tossTreat();
  else if(p[0]>22&&p[0]<134&&p[1]>24&&p[1]<128){ P.mewoAt=now; P.mewoTxt='mrrp.'; say('the cat across the street opens one eye at you'); }
  else if((p[0]-200)*(p[0]-200)/(95*95)+(p[1]-230)*(p[1]-230)/(130*130)<1) patPup();
  else { P.tiltTo=(p[0]<200?-1:1)*.12; setTimeout(function(){ P.tiltTo=0; },900); } });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); patPup(); } else if(e.key==='t'||e.key==='T') tossTreat(); else if(e.key==='k'||e.key==='K') doTrick(); });
$('treat').addEventListener('click',tossTreat);
$('trick').addEventListener('click',doTrick);
try{ var tv=+localStorage.getItem('wan-wan-pup-treats')||0; if(tv>0){ P.treats=tv; $('count').textContent='🦴 '+tv; learn(); } }catch(e){}
try{ var sv=localStorage.getItem('wan-wan-pup-name'); if(sv){ NAME=sv; $('nm').value=sv; } }catch(e){}
$('nm').addEventListener('input',function(){ NAME=this.value.trim().slice(0,12)||'Wan-kun'; try{ localStorage.setItem('wan-wan-pup-name',NAME); }catch(e){} });
$('nm').addEventListener('keydown',function(e){ if(e.key==='Enter') this.blur(); });
$('pat').addEventListener('click',patPup);

function fit(){ var r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2.5); cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); }
function frame(ts){ now=(ts-T0)/1000;
  P.crumbs=P.crumbs.filter(function(c){ return now-c.t<.9; }); P.hearts=P.hearts.filter(function(h){ return now-h.t<1.4; }); P.sparks=P.sparks.filter(function(s){ return now-s.t<.8; });
  ctx.setTransform(cv.width/W,0,0,cv.height/W,0,0); draw(ctx); requestAnimationFrame(frame); }
K.pink='#ff7f9f'; K.deep='#b8452f';
window.addEventListener('resize',fit); fit(); requestAnimationFrame(frame);
})();
