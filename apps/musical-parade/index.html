<header class="top">
  <h1>Musical Parade</h1>
  <p class="sub">Build the band. Every marcher adds a part to the song.</p>
</header>
<main>
  <div id="styles" class="styles" role="radiogroup" aria-label="Band style">
    <button type="button" role="radio" data-s="march" aria-checked="true">🎺 Brass march</button>
    <button type="button" role="radio" data-s="jazz" aria-checked="false" tabindex="-1">🎷 Jazz second line</button>
    <button type="button" role="radio" data-s="carnival" aria-checked="false" tabindex="-1">💃 Carnival samba</button>
    <button type="button" role="radio" data-s="neon" aria-checked="false" tabindex="-1">🕹️ Synthwave</button>
  </div>
  <section class="stage" aria-label="Parade street">
    <canvas id="street" role="img" aria-label="An empty street with a drum major waiting for a band."></canvas>
    <button type="button" id="strike" class="strike" hidden>▶ Strike up the band</button>
    <div id="toast" class="toast" aria-hidden="true"></div>
  </section>
  <section aria-label="Recruit marchers">
    <div id="roster" class="roster"></div>
  </section>
  <section class="ctrl" aria-label="Parade controls">
    <button type="button" id="playBtn" class="pill go" aria-pressed="false">▶ March</button>
    <label class="tempo"><span>tempo</span><input type="range" id="tempo" min="84" max="150" step="2" value="112"><output id="bpmOut" for="tempo">112</output></label>
    <label class="tempo"><span>volume</span><input type="range" id="vol" min="0" max="100" step="5" value="75"><output id="volOut" for="vol">75</output></label>
    <button type="button" id="homeBtn" class="pill">↩ Send one home</button>
    <button type="button" id="rndBtn" class="pill">🎲 Surprise band</button>
    <button type="button" id="shareBtn" class="pill">🔗 Share band</button>
    <button type="button" id="clearBtn" class="pill ghost">Disband</button>
  </section>
  <p id="status" class="status">No band yet. Tap an instrument to recruit your first marcher.</p>
</main>
<footer><span>Tap a marcher on the street to send them home · keys 1–8 add players · space marches</span><span id="buildstamp" role="note" aria-label="Build information">build v1.2.1 · 2026-09-28 · 500eaa87a</span></footer>

  for(k in c){ev=EV[k][s];if(!ev)continue;for(j=0;j<ev.length;j++){if(snd){try{pl(k)(t,ev[j],c[k],d);}catch(er){}}VQ.push({t:t,k:k,e:ev[j]});}}

  G.fillStyle=S.neon?'#2c1d52':'#e9d6b0';G.fillRect(0,base,VW,22);G.fillStyle=S.neon?'rgba(61,224,255,.18)':'rgba(29,42,68,.12)';for(j=Math.floor(st.scroll/40)-1;j<=Math.ceil((st.scroll+VW)/40)+1;j++)G.fillRect(j*40-st.scroll,base,1.5,22);
  lamps();crowd(p,exc);
  if(S.neon){G.fillStyle='#ff3fb4';G.fillRect(0,base+22,VW,2.5);G.fillStyle='#1a1036';G.fillRect(0,base+24.5,VW,VH-base-24);G.strokeStyle='rgba(61,224,255,.4)';G.lineWidth=1;G.beginPath();
    for(var k=1;base+24+k*k*1.7<VH;k++){var ly=base+24+k*k*1.7;G.moveTo(0,ly);G.lineTo(VW,ly);}
    var sp=48,o0=st.scroll%sp;for(var xi=-VW;xi<VW*2;xi+=sp){var bx=xi-o0;G.moveTo(VW/2+(bx-VW/2)*.3,base+25);G.lineTo(bx,VH);}G.stroke();}
  else{  G.fillStyle='#b99d6c';G.fillRect(0,base+22,VW,4);G.fillStyle='#d6bf93';G.fillRect(0,base+26,VW,VH-base-26);
  G.fillStyle='rgba(120,90,50,.13)';for(var r=0;r*14<VH-base-30;r++){var off=(r&1)*12,y=base+30+r*14,i0=Math.floor((st.scroll-off)/24)-1;for(var i=i0;i*24+off-st.scroll<VW+24;i++){rr(G,i*24+off-st.scroll,y,20,10,4);G.fill();}}}}
function variety(){var s={};band.forEach(function(m){if(!m.gone)s[m.type]=1;});return Object.keys(s).length;}

/* ---------- particles ---------- */
var NOTES=[],CONF=[];
function burst(x,y,n){if(RM)return;for(var i=0;i<n;i++)CONF.push({x:x,y:y,vx:(Math.random()-.5)*240,vy:-150-Math.random()*170,r:Math.random()*6,vr:(Math.random()-.5)*12,c:CROWD[i%8],l:2.6});}
function fire(q,now){if(q.k==='lead'){LEADER.hit=now;return;}if(q.e&&q.e.sh&&!q.e.acc&&!q.e.crash)return;if(q.k==='loop'){if(alive().length>=6)burst(VW*(.2+Math.random()*.6),VH-170,16);return;}
  var ms=band.filter(function(m){return m.type===q.k&&!m.gone;});
  ms.forEach(function(m){m.hit=now;m.alt=!m.alt;if(q.k==='bone')m.sl=q.e.d;});
  if(q.e.d!==undefined&&ms.length&&q.e.len>=2&&NOTES.length<40&&!RM){var m=ms[0];var P=STY[st.style].T[m.type];NOTES.push({x:m.x+16*m.k,y:m.y-84*m.k,vx:-10,vy:-30,l:1.3,c:st.style==='jazz'?P.plume:P.coat,ch:q.e.len>=4?'♫':'♪'});}}

/* ---------- loop ---------- */
var last=perf();
function frame(){var now=perf(),dt=Math.min(.05,now-last);last=now;
  if(st.playing&&st.clk==='p'&&A&&A.state==='running')anchor(pos(),'a');
  var p=pos(),dp=p-st.lastPos;st.lastPos=p;if(dp<0||dp>8)dp=0;var dx=dp/4*STRIDE;st.scroll+=dx;
  if(st.playing){var tv=vnow();VQ=VQ.filter(function(q){if(q.t>tv)return true;fire(q,now);return false;});}
  band.forEach(function(m){if(m.gone){m.x-=dx+60*dt;m.y+=8*dt;}else{m.x+=(m.tx-m.x)*Math.min(1,dt*2.6);m.y+=(m.ty-m.y)*Math.min(1,dt*4);}m.slc+=(m.sl-m.slc)*Math.min(1,dt*14);});
  band=band.filter(function(m){return !(m.gone&&(m.x<-60||now-m.wave>14));});
  LEADER.x+=(LEADER.tx-LEADER.x)*Math.min(1,dt*2.6);LEADER.y+=(LEADER.ty-LEADER.y)*Math.min(1,dt*4);
  NOTES.forEach(function(q){q.x+=q.vx*dt-dx;q.y+=q.vy*dt;q.l-=dt;});NOTES=NOTES.filter(function(q){return q.l>0;});
  CONF.forEach(function(q){q.vy+=300*dt;q.x+=q.vx*dt-dx;q.y+=q.vy*dt;q.r+=q.vr*dt;q.l-=dt;});CONF=CONF.filter(function(q){return q.l>0&&q.y<VH+10;});
  st.hint+=((alive().length?0:1)-st.hint)*Math.min(1,dt*3);
  draw(p,now);requestAnimationFrame(frame);}
function draw(p,now){G.setTransform(SCL*DPR,0,0,SCL*DPR,0,0);scene(p,now);
  var list=band.slice();list.push(LEADER);list.sort(function(a,b){return a.y-b.y||a.x-b.x;});
  list.forEach(function(m){var mv=Math.abs(m.tx-m.x)>3||m.gone,go=st.playing||mv,ph=st.playing&&!m.gone?p/4:now*2;marcher(G,m,m.x,m.y,m.k,ph,go,now);});
  G.textAlign='center';G.font='700 17px Georgia,serif';NOTES.forEach(function(q){G.globalAlpha=Math.min(1,q.l);G.fillStyle=q.c;G.fillText(q.ch,q.x,q.y);});G.globalAlpha=1;
  CONF.forEach(function(q){G.save();G.translate(q.x,q.y);G.rotate(q.r);G.fillStyle=q.c;G.globalAlpha=Math.min(1,q.l);G.fillRect(-3,-1.8,6,3.6);G.restore();});G.globalAlpha=1;
  if(st.hint>.02){G.globalAlpha=st.hint;var hy=Math.max(70,VH-300);G.fillStyle='rgba(255,250,240,.9)';rr(G,VW/2-178,hy-38,356,80,16);G.fill();G.strokeStyle=INK;G.lineWidth=2;G.stroke();G.font='34px Shrikhand,Georgia,serif';G.fillStyle=INK;G.fillText('Recruit your band!',VW/2+2,hy+2);G.fillStyle=RED;G.fillText('Recruit your band!',VW/2,hy);
    G.font='15px "Fragment Mono",monospace';G.fillStyle=INK;G.fillText('tap an instrument below  ↓',VW/2,hy+28);G.globalAlpha=1;}}

/* ---------- UI ---------- */
var tt=0;function toast(s){var e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},2600);say(s);}
function say(s){$('live').textContent=s;}
function setStyle(sy,quiet){if(!STY[sy])return;var ch=sy!==st.style,S=STY[sy];st.style=sy;buildSong(sy);
  SB.forEach(function(b){var on=b.getAttribute('data-s')===sy;b.setAttribute('aria-checked',on?'true':'false');b.tabIndex=on?0:-1;});
  if(ch){st.bpm=S.bpm;$('tempo').value=S.bpm;$('bpmOut').textContent=S.bpm;
    if(st.playing){st.aS=st.step;st.aT=st.nt;st.s0=Math.ceil(st.step/4)*4;}else st.s0=Math.ceil(st.pp);
    ORDER.forEach(function(k){if(TY[k].cv)icon(TY[k].cv,k);});
    if(!quiet){toast(S.hello);if(alive().length)burst(VW*.7,VH-190,20);}}
  update();}
function update(){var a=alive(),n=a.length,c={},v,S=STY[st.style];a.forEach(function(m){c[m.type]=(c[m.type]||0)+1;});v=Object.keys(c).length;
  ORDER.forEach(function(k){var T=TY[k];T.badge.hidden=!c[k];T.badge.textContent=c[k]||'';T.btn.setAttribute('aria-label','Add '+T.name+(c[k]?' ('+c[k]+' marching)':''));});
  $('status').textContent=n?n+' marcher'+(n>1?'s':'')+' · '+v+' of 8 instruments'+(v===8?' · full band!':''):'No band yet. Tap an instrument to recruit your first marcher.';
  cv.setAttribute('aria-label',n?'A '+S.lead+' leading a '+S.name.toLowerCase()+' of '+n+' marchers down a festive street: '+ORDER.filter(function(k){return c[k];}).map(function(k){return c[k]+' '+TY[k].label.toLowerCase();}).join(', ')+'.':'An empty street with a '+S.lead+' waiting for a band.');
  var pb=$('playBtn');pb.textContent=st.playing?'❚❚ Halt':'▶ March';pb.setAttribute('aria-pressed',st.playing?'true':'false');
  try{history.replaceState(null,'',n?'#band='+a.map(function(m){return TY[m.type].k;}).join('')+'&bpm='+st.bpm+(st.style!=='march'?'&style='+st.style:''):location.pathname+location.search);}catch(e){}
  if(v===8&&!st.full){st.full=true;toast('Full band! Every instrument is marching.');for(var i=0;i<5;i++)burst(VW*(.12+i*.19),VH-180,24);if(A&&st.clk==='a'&&A.state==='running')cheer(A.currentTime+.05);}
  if(v<8)st.full=false;}
function icon(c,k){var x=c.getContext('2d'),tb=k==='tuba',sc=tb?.74:1.3;x.clearRect(0,0,96,96);x.save();x.translate(tb?40:38,tb?100:136);marcher(x,{type:k,skin:'#d9a07a',hit:-9,alt:false,slc:4},0,0,sc,0,false,0);x.restore();}
ORDER.forEach(function(k,i){var b=document.createElement('button'),c=document.createElement('canvas'),l=document.createElement('span'),n=document.createElement('span');
  b.type='button';b.className='inst';b.style.setProperty('--i',i);c.width=96;c.height=96;c.setAttribute('aria-hidden','true');l.textContent=TY[k].label;n.className='n';n.hidden=true;n.setAttribute('aria-hidden','true');
  b.appendChild(c);b.appendChild(l);b.appendChild(n);b.addEventListener('click',function(){if(add(k))start();});$('roster').appendChild(b);TY[k].btn=b;TY[k].badge=n;TY[k].cv=c;icon(c,k);});
var SB=[].slice.call(document.querySelectorAll('#styles [role=radio]'));
SB.forEach(function(b,i){b.addEventListener('click',function(){setStyle(b.getAttribute('data-s'));});
  b.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'||e.key==='ArrowDown'?1:e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:0;if(!d)return;e.preventDefault();var nb=SB[(i+d+SB.length)%SB.length];nb.focus();setStyle(nb.getAttribute('data-s'));});});
$('playBtn').addEventListener('click',toggle);
$('strike').addEventListener('click',start);
$('homeBtn').addEventListener('click',function(){var a=alive();if(!a.length){toast('Nobody to send home yet.');return;}sendHome(a[a.length-1]);});
$('clearBtn').addEventListener('click',function(){var a=alive();if(!a.length)return;a.forEach(function(m){sendHome(m,true);});toast('Band dismissed. Thanks for marching!');});
$('rndBtn').addEventListener('click',function(){var k=0,room=MAX-alive().length;if(!room){toast('The street is full. Tap a marcher to send them home.');return;}
  var pick=ORDER.slice().sort(function(){return Math.random()-.5;}).slice(0,Math.min(room,6));pick.forEach(function(t){if(add(t,true))k++;});start();toast('Surprise! '+k+' new marchers joined.');});
$('shareBtn').addEventListener('click',function(){if(!alive().length){toast('Recruit a band first!');return;}var u=location.href;
  if(navigator.share){navigator.share({title:'My Musical Parade',text:'Hear my marching band!',url:u}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('Link copied. Send your band to a friend!');},function(){toast('Copy the link from the address bar.');});}
  else toast('Copy the link from the address bar.');});
$('vol').addEventListener('input',function(){VOL=this.value/100;$('volOut').textContent=this.value;if(M&&A){try{M.gain.setTargetAtTime(VOL,A.currentTime,.03);}catch(e){M.gain.value=VOL;}}});
$('tempo').addEventListener('input',function(){st.bpm=+this.value;$('bpmOut').textContent=st.bpm;if(st.playing){st.aS=st.step;st.aT=st.nt;}update();});
cv.addEventListener('click',function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
  var a=alive().sort(function(p,q){return q.y-p.y;});for(var i=0;i<a.length;i++){var m=a[i];if(Math.abs(x-m.x)<17*m.k&&y>m.y-98*m.k&&y<m.y+6){sendHome(m);return;}}
  if(Math.abs(x-LEADER.x)<18&&y>LEADER.y-100&&y<LEADER.y+6)toggle();});
document.addEventListener('keydown',function(e){var tg=e.target&&e.target.tagName;if(tg==='INPUT'||e.altKey||e.ctrlKey||e.metaKey)return;var n=+e.key;
  if(n>=1&&n<=8){if(add(ORDER[n-1]))start();e.preventDefault();}else if(e.key==='Backspace'||e.key==='Delete'){sendHome(alive().slice(-1)[0]);e.preventDefault();}else if(e.key===' '&&tg!=='BUTTON'){toggle();e.preventDefault();}});
document.addEventListener('visibilitychange',function(){if(!A||st.clk!=='a'||!st.playing)return;try{if(document.hidden)A.suspend();else A.resume();}catch(e){}});
function resize(){var r=cv.getBoundingClientRect();if(!r.width)return;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);SCL=Math.min(r.width/560,r.height/380);VW=r.width/SCL;VH=r.height/SCL;
  layout();band.forEach(function(m){if(!m.gone){m.y=m.ty;}});LEADER.x=LEADER.tx;LEADER.y=LEADER.ty;}
window.addEventListener('resize',resize);resize();
(function(){var h=location.hash,mb=/band=([a-z]{1,16})/.exec(h),mt=/bpm=(\d{2,3})/.exec(h),ms=/style=(march|jazz|carnival|neon)/.exec(h),K={};ORDER.forEach(function(k){K[TY[k].k]=k;});
  if(ms)setStyle(ms[1],true);
  if(mt){var b=Math.max(84,Math.min(150,+mt[1]));b-=b%2;st.bpm=b;$('tempo').value=b;$('bpmOut').textContent=b;}
  if(mb){mb[1].split('').forEach(function(ch){if(K[ch])add(K[ch],true);});band.forEach(function(m){m.x=m.tx;});if(alive().length){$('strike').hidden=false;say('A shared band of '+alive().length+' is ready. Press strike up the band.');}}
  update();})();
window.__mp={st:st,band:function(){return band;},alive:alive,add:add,sendHome:sendHome,setup:setup,PLAY:PLAY,EV:EV,sched:sched,pos:pos,setStyle:setStyle,STY:STY,pl:pl,buildSong:buildSong,loop:function(){return LOOP;},start:start,stop:stop,dims:function(){return {VW:VW,VH:VH};},VQ:function(){return VQ;},TY:TY,ORDER:ORDER};
requestAnimationFrame(frame);
})();
