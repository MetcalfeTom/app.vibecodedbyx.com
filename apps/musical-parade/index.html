<style>

.top{max-width:72rem;margin:0 auto;padding:1.1rem 0 .7rem;display:flex;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
h1{font-family:'Shrikhand',Georgia,serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);margin:0;color:var(--red);text-shadow:3px 3px 0 var(--ink);line-height:1.05}

main{max-width:72rem;margin:0 auto}
.stage{position:relative;border:3px solid var(--ink);border-radius:1rem;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#bfe3dc;animation:rise .7s .15s both}
#street{display:block;width:100%;height:clamp(16rem,56vh,38rem);touch-action:manipulation;cursor:pointer}

<body>
<header class="top">
  <h1>Musical Parade</h1>
  <p class="sub">Build the band. Every marcher adds a part to the song.</p>
</header>
<main>
  <section class="stage" aria-label="Parade street">
    <canvas id="street" role="img" aria-label="An empty street with a drum major waiting for a band."></canvas>
    <button type="button" id="strike" class="strike" hidden>▶ Strike up the band</button>
    <div id="toast" class="toast" aria-hidden="true"></div>
  </section>
  <section aria-label="Recruit marchers">
    <div id="roster" class="roster"></div>
  </section>
  <section class="ctrl" aria-label="Parade controls">
    <button type="button" id="playBtn" class="pill go" aria-pressed="false">▶ March</button>
    <label class="tempo"><span>tempo</span><input type="range" id="tempo" min="84" max="150" step="2" value="112"><output id="bpmOut" for="tempo">112</output></label>
    <button type="button" id="homeBtn" class="pill">↩ Send one home</button>
    <button type="button" id="rndBtn" class="pill">🎲 Surprise band</button>
    <button type="button" id="shareBtn" class="pill">🔗 Share band</button>
    <button type="button" id="clearBtn" class="pill ghost">Disband</button>
  </section>
  <p id="status" class="status">No band yet. Tap an instrument to recruit your first marcher.</p>
</main>
<footer><span>Tap a marcher on the street to send them home · keys 1–8 add players · space marches</span><span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-09-28 · 8cd38aa89</span></footer>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cv=$('street'),G=cv.getContext('2d'),RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var INK='#1d2a44',RED='#b8322a',GOLD='#d9a431',BRASS='#f1c04a',BRASS2='#b9831f',CREAM='#fffaf0',SILVER='#d7dde2';
function dark(h,f){var n=parseInt(h.slice(1),16),r=(n>>16)*f|0,g=(n>>8&255)*f|0,b=(n&255)*f|0;return 'rgb('+r+','+g+','+b+')';}
var TY={
  snare:{k:'s',name:'Snare drum',label:'Snare',coat:'#b8322a',plume:'#fffaf0'},
  bass:{k:'b',name:'Bass drum',label:'Bass drum',coat:'#2b3f66',plume:'#b8322a'},
  cymbal:{k:'c',name:'Cymbals',label:'Cymbals',coat:'#c98f1e',plume:'#fffaf0'},
  tuba:{k:'u',name:'Sousaphone',label:'Tuba',coat:'#1f6e66',plume:'#f1c04a'},
  bone:{k:'o',name:'Trombone',label:'Trombone',coat:'#b8322a',plume:'#1d2a44'},
  trumpet:{k:'t',name:'Trumpet',label:'Trumpet',coat:'#2b3f66',plume:'#fffaf0'},
  flute:{k:'f',name:'Piccolo',label:'Piccolo',coat:'#1f6e66',plume:'#fffaf0'},
  glock:{k:'g',name:'Bell lyre',label:'Bells',coat:'#c98f1e',plume:'#b8322a'}
};
var ORDER=['snare','bass','cymbal','tuba','bone','trumpet','flute','glock'];
var LEAD={coat:'#b8322a',plume:'#fffaf0'};
ORDER.forEach(function(k){TY[k].arm=dark(TY[k].coat,.78);});LEAD.arm=dark(LEAD.coat,.78);
var SKIN=['#f2cba8','#d9a07a','#a8694a','#7b4a33','#f6d9c4','#c58a62','#8f5a3e'];
var MAX=16,STRIDE=26;

/* ---------- the song: a march in B-flat, 8 bars of 16ths ---------- */
var SC=[0,2,4,5,7,9,11],KEY={a:-7,s:-6,d:-5,f:-4,g:-3,h:-2,j:-1,'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,q:7,w:8,e:9,r:10,t:11,y:12,u:13};
function midi(d,base){var o=Math.floor(d/7);return base+o*12+SC[d-o*7];}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
var MEL=['5--31---3-5-q---','7-q-w-q-7-6-5---','6--66-5-4-6-q---','5---3-5-3-2-1---','2--22-3-4-5-6---','7-6-5-4-3-2-5---','q--53-5-q-w-e---','w---7---q-------'];
var TUBA=['1--.....g--.....','1--.....g--.....','4--.....1--.....','1--.....1-2-3-4-','5--.....2--.....','5--.....2--.....','1--.....g--.....','1--.....g-h-j---'];
var CH=[0,0,3,0,4,4,0,0];
var SN=['x.x.X.x.x.x.X.xx','X.x.X.x.rrrrXxXx'],BD=['X.......X.......','X.......X...X.X.'],CY=['C...x.......x...','....x.......x...','....x.......x.C.'];
var LOOP=128,EV={};ORDER.forEach(function(k){EV[k]=[];});
function put(k,s,e){(EV[k][s]||(EV[k][s]=[])).push(e);}
function line(str,fn){for(var i=0;i<16;i++){var d=KEY[str[i]];if(d===undefined)continue;var n=1;while(str[i+n]==='-')n++;fn(i,d,n);}}
(function(){for(var b=0;b<8;b++){var o=b*16,r=CH[b],i;
  line(MEL[b],function(i,d,n){put('trumpet',o+i,{d:d,len:n});if(i%4===0)put('glock',o+i,{d:d,len:Math.min(n,6)});});
  line(TUBA[b],function(i,d,n){put('tuba',o+i,{d:d,len:n});});
  put('bone',o+4,{d:r+2,len:3});put('bone',o+12,{d:r+2,len:3,gl:b===3||b===7});
  if(b%2===0){for(i=0;i<8;i++)put('flute',o+i,{d:r+4+i,len:1});put('flute',o+8,{d:r+9,len:4});put('flute',o+12,{d:r+7,len:2});put('flute',o+14,{d:r+4,len:2});}
  else{for(i=0;i<8;i++)put('flute',o+i,{d:r+9+(i&1),len:1});put('flute',o+8,{d:r+7,len:4});put('flute',o+12,{d:r+4,len:4});}
  var sn=SN[b===7?1:0],bd=BD[b===7?1:0],cy=CY[b===0?0:b===7?2:1];
  for(i=0;i<16;i++){if(sn[i]!=='.')put('snare',o+i,{acc:sn[i]==='X',roll:sn[i]==='r'});if(bd[i]!=='.')put('bass',o+i,{acc:bd[i]==='X'});if(cy[i]!=='.')put('cymbal',o+i,{crash:cy[i]==='C'});}
}})();

/* ---------- synth: every sound is built from plain tones and noise ---------- */
var A=null,M=null,RV=null,NB=null;
function setup(c){A=c;M=c.createGain();M.gain.value=.75;var cp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=12;cp.ratio.value=5;cp.attack.value=.004;cp.release.value=.2;M.connect(cp);cp.connect(c.destination);
  RV=c.createConvolver();var n=c.sampleRate*1.4|0,ib=c.createBuffer(2,n,c.sampleRate),d,i,ch;for(ch=0;ch<2;ch++){d=ib.getChannelData(ch);for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}RV.buffer=ib;
  var rg=c.createGain();rg.gain.value=.5;RV.connect(rg);rg.connect(cp);
  NB=c.createBuffer(1,c.sampleRate,c.sampleRate);d=NB.getChannelData(0);for(i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
function audio(){if(A)return A;var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{setup(new C());}catch(e){A=null;}return A;}
function out(node,wet){node.connect(M);if(wet){var s=A.createGain();s.gain.value=wet;node.connect(s);s.connect(RV);}}
function brass(t,f,dur,vol,cut,bright,t2,gl){
  var o1=A.createOscillator(),o2=A.createOscillator(),m2=A.createGain(),fl=A.createBiquadFilter(),gn=A.createGain(),sus=t+Math.max(.13,dur-.03);
  o1.type='sawtooth';o2.type=t2;o2.detune.value=7;m2.gain.value=.45;
  [o1,o2].forEach(function(o){if(gl){o.frequency.setValueAtTime(f*.84,t);o.frequency.exponentialRampToValueAtTime(f,t+.16);}else o.frequency.setValueAtTime(f,t);});
  fl.type='lowpass';fl.Q.value=1.4;fl.frequency.setValueAtTime(cut*.3,t);fl.frequency.exponentialRampToValueAtTime(cut*bright,t+.035);fl.frequency.exponentialRampToValueAtTime(cut,t+.16);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.02);gn.gain.linearRampToValueAtTime(vol*.72,t+.12);gn.gain.setValueAtTime(vol*.72,sus);gn.gain.linearRampToValueAtTime(0,sus+.07);
  o1.connect(fl);o2.connect(m2);m2.connect(fl);fl.connect(gn);out(gn,.22);o1.start(t);o2.start(t);o1.stop(sus+.12);o2.stop(sus+.12);}
function flute(t,f,dur,vol){var o=A.createOscillator(),o2=A.createOscillator(),g2=A.createGain(),gn=A.createGain(),lf=A.createOscillator(),lg=A.createGain(),sus=t+Math.max(.08,dur-.02);
  o.type='triangle';o.frequency.setValueAtTime(f,t);o2.type='sine';o2.frequency.setValueAtTime(f*2,t);g2.gain.value=.18;
  lf.frequency.value=5.4;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+.25);lf.connect(lg);lg.connect(o.frequency);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.025);gn.gain.setValueAtTime(vol,sus);gn.gain.linearRampToValueAtTime(0,sus+.06);
  o.connect(gn);o2.connect(g2);g2.connect(gn);out(gn,.3);[o,o2,lf].forEach(function(x){x.start(t);x.stop(sus+.1);});nz(t,.035,vol*.5,'bandpass',f*1.5,1.5,0);}
function bell(t,f,vol){[[1,vol,1.1],[2.76,vol*.3,.3],[5.4,vol*.1,.12]].forEach(function(p){var o=A.createOscillator(),gn=A.createGain();o.type='sine';o.frequency.setValueAtTime(f*p[0],t);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(p[1],t+.004);gn.gain.exponentialRampToValueAtTime(.0001,t+p[2]);o.connect(gn);out(gn,.35);o.start(t);o.stop(t+p[2]+.05);});}
function nz(t,dur,vol,type,freq,q,wet){var s=A.createBufferSource(),fl=A.createBiquadFilter(),gn=A.createGain();s.buffer=NB;fl.type=type;fl.frequency.setValueAtTime(freq,t);if(q)fl.Q.value=q;gn.gain.setValueAtTime(Math.max(vol,.0002),t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(gn);out(gn,wet);s.start(t,Math.random()*.4);s.stop(t+dur+.05);}
function tone(t,f,dur,vol,type,f2){var o=A.createOscillator(),gn=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*.6);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);out(gn,.1);o.start(t);o.stop(t+dur+.05);}
function vb(n){return 1+Math.min(n-1,5)*.14;}
var PLAY={
  trumpet:function(t,e,n,sd){var f=hz(midi(e.d,70)),v=.085*vb(n);brass(t,f,e.len*sd,v,Math.min(5200,f*5),1.9,'square');if(n>1){f=hz(midi(e.d-2,70));brass(t,f,e.len*sd,v*.75,Math.min(5200,f*5),1.8,'square');}},
  bone:function(t,e,n,sd){var f=hz(midi(e.d,58)),v=.09*vb(n);brass(t,f,e.len*sd,v,f*5,1.7,'sawtooth',e.gl);if(n>1){f=hz(midi(e.d+2,58));brass(t,f,e.len*sd,v*.8,f*5,1.7,'sawtooth',e.gl);}},
  tuba:function(t,e,n,sd){var f=hz(midi(e.d,46)),v=.2*vb(n);brass(t,f,e.len*sd,v,f*3.6,1.5,'triangle');if(n>1){f=hz(midi(e.d+7,46));brass(t,f,e.len*sd,v*.4,f*4,1.5,'triangle');}},
  flute:function(t,e,n,sd){var v=.06*vb(n);flute(t,hz(midi(e.d,70)),e.len*sd,v);if(n>1)flute(t,hz(midi(e.d-2,70)),e.len*sd,v*.7);},
  glock:function(t,e,n){var v=.07*vb(n);bell(t,hz(midi(e.d,82)),v);if(n>1)bell(t,hz(midi(e.d-2,82)),v*.8);},
  snare:function(t,e,n,sd){var v=.22*vb(n)*(e.acc?1:.55);nz(t,e.acc?.19:.12,v,'highpass',1700,0,.18);nz(t,.08,v*.6,'bandpass',3600,1.2,0);tone(t,190,.07,v*.5,'triangle');if(e.roll)nz(t+sd/2,.1,v*.8,'highpass',1700,0,.15);},
  bass:function(t,e,n){var v=.75*vb(n);tone(t,e.acc?110:95,.5,v,'sine',42);nz(t,.03,v*.25,'lowpass',900,0,0);},
  cymbal:function(t,e,n){var v=.12*vb(n)*(e.crash?1.2:1);nz(t,e.crash?1.6:.42,v,'highpass',5200,0,.3);nz(t,e.crash?1.1:.3,v*.5,'bandpass',8200,3,.2);}
};
function cheer(t){for(var i=0;i<3;i++)nz(t+i*.12,1.4,.07,'bandpass',900+i*500,.8,.3);}

/* ---------- clock + scheduler ---------- */
var st={playing:false,bpm:112,step:0,nt:0,clk:'p',aS:0,aT:0,pp:0,scroll:0,lastPos:0,full:false,lx:400,hint:1},VQ=[];
function perf(){return performance.now()/1000;}
function sd(){return 60/st.bpm/4;}
function lat(){return A?(A.outputLatency||A.baseLatency||0):0;}
function cnow(){return st.clk==='a'?A.currentTime:perf();}
function vnow(){return st.clk==='a'?A.currentTime-lat():perf();}
function pos(){return st.playing?st.aS+(vnow()-st.aT)/sd():st.pp;}
function anchor(p,clk){st.clk=clk;var now=cnow();st.step=Math.max(0,Math.ceil(p));st.nt=now+(st.step-p)*sd()+(clk==='a'?.04:0);st.aS=st.step;st.aT=st.nt;VQ.length=0;}
function counts(S){var c={};for(var i=0;i<band.length;i++){var m=band[i];if(!m.gone&&m.from<=S)c[m.type]=(c[m.type]||0)+1;}return c;}
function sched(S,t){var s=S%LOOP,c=counts(S),snd=st.clk==='a'&&A&&A.state==='running',d=sd(),k,j,ev;
  for(k in c){ev=EV[k][s];if(!ev)continue;for(j=0;j<ev.length;j++){if(snd){try{PLAY[k](t,ev[j],c[k],d);}catch(er){}}VQ.push({t:t,k:k,e:ev[j]});}}
  if(s===0&&S>0)VQ.push({t:t,k:'loop'});
  if(VQ.length>400)VQ.splice(0,VQ.length-400);}
setInterval(function(){if(!st.playing)return;var now=cnow(),n=0;if(now-st.nt>.5)anchor(pos(),st.clk);while(st.nt<now+.12&&n++<64){sched(st.step,st.nt);st.step++;st.nt+=sd();}},25);
function start(){if(st.playing)return;var a=audio();if(a&&a.state!=='running'){try{var pr=a.resume();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}}
  st.playing=true;anchor(st.pp,a&&a.state==='running'?'a':'p');st.lastPos=pos();$('strike').hidden=true;update();}
function stop(){if(!st.playing)return;st.pp=pos();st.playing=false;VQ.length=0;update();}
function toggle(){if(st.playing)stop();else start();}

/* ---------- the band ---------- */
var band=[],nid=0,VW=760,VH=380,SCL=1,DPR=1,LEADER={leader:true,type:'lead',x:400,y:320,tx:400,ty:320,k:1.06,skin:'#c58a62',hit:-9,off:0};
function alive(){return band.filter(function(m){return !m.gone;});}
function layout(){var a=alive(),n=a.length,bw=Math.ceil(n/2)*46;
  st.lx=Math.max(150,Math.min(VW-60,VW/2+(bw+60)/2));LEADER.tx=st.lx;LEADER.ty=VH-58;
  a.forEach(function(m,i){var c=i>>1,r=i&1;m.tx=st.lx-64-c*46+(r?10:0);m.ty=r?VH-30:VH-86;m.k=(r?1:.9)*(m.type==='tuba'?.9:1);});}
function add(type,quiet){if(alive().length>=MAX){toast('The street is full. Tap a marcher to send them home.');return false;}
  nid++;var m={id:nid,type:type,x:-40,y:0,tx:0,ty:0,k:1,skin:SKIN[(nid*3)%SKIN.length],hit:-9,alt:false,sl:4,slc:4,off:0,gone:false,from:0,wave:0};
  m.from=st.playing?Math.ceil((st.step+1)/4)*4:0;band.push(m);layout();m.y=m.ty;
  if(!quiet)say(TY[type].name+' joined the parade. '+alive().length+' marching.');update();return true;}
function sendHome(m,quiet){if(!m||m.gone)return;m.gone=true;m.wave=perf();layout();if(!quiet)say(TY[m.type].name+' went home. '+alive().length+' marching.');update();}

/* ---------- drawing helpers ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function leg(g,l,dx,col){var a=l*1.3,kx=dx+Math.sin(a)*15,ky=-30+Math.cos(a)*15,fx=kx-Math.sin(a)*3,fy=ky+15;
  g.strokeStyle=col;g.lineWidth=6;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(dx,-30);g.lineTo(kx,ky);g.lineTo(fx,fy);g.stroke();
  g.fillStyle='#10131f';g.beginPath();g.ellipse(fx+2.5,fy-1,5,3,0,0,7);g.fill();}
function arm(g,T,hx,hy,sx,sy){g.strokeStyle=T.arm;g.lineWidth=4.6;g.lineCap='round';g.beginPath();g.moveTo(sx===undefined?1:sx,sy===undefined?-54:sy);g.lineTo(hx,hy);g.stroke();g.fillStyle=CREAM;g.beginPath();g.arc(hx,hy,2.6,0,7);g.fill();}
function shako(g,T,wig){g.fillStyle=INK;rr(g,-5,-86,13,15,2.5);g.fill();g.fillStyle=GOLD;g.fillRect(-5,-74,13,2);g.beginPath();g.arc(1.5,-80,2.6,0,7);g.fill();
  g.fillStyle='#0d1222';g.beginPath();g.ellipse(6,-71.5,5,1.6,-.2,0,7);g.fill();g.fillStyle=T.plume;g.beginPath();g.ellipse(1.5+wig*.3,-92,3.2,6.5,wig*.06,0,7);g.fill();}
function bearskin(g,T){g.fillStyle='#10131f';g.beginPath();g.ellipse(1.5,-81,9.5,15,0,0,7);g.fill();g.strokeStyle=GOLD;g.lineWidth=1.4;g.beginPath();g.moveTo(-5,-70);g.quadraticCurveTo(1.5,-58,8,-70);g.stroke();
  g.fillStyle=T.plume;g.beginPath();g.ellipse(-6,-88,2.4,7,-.25,0,7);g.fill();}
function spark(g,x,y,h,r){g.strokeStyle=GOLD;g.lineWidth=1.3;g.globalAlpha=h;g.beginPath();for(var i=0;i<6;i++){var a=i*1.047+.3;g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.lineTo(x+Math.cos(a)*(r+5*h),y+Math.sin(a)*(r+5*h));}g.stroke();g.globalAlpha=1;}
var INST={
  lead:function(g,T,m,h,ph,go){var a=go?ph*Math.PI:-.7;arm(g,T,-3+(go?Math.sin(ph*Math.PI)*3:0),-37);arm(g,T,13,-52);
    g.save();g.translate(13,-52);g.rotate(a);g.strokeStyle=SILVER;g.lineWidth=2;g.beginPath();g.moveTo(-14,0);g.lineTo(14,0);g.stroke();g.fillStyle=GOLD;g.beginPath();g.arc(-14,0,2.8,0,7);g.arc(14,0,2,0,7);g.fill();g.restore();},
  snare:function(g,T,m,h){g.strokeStyle=CREAM;g.lineWidth=1.4;g.beginPath();g.moveTo(-5,-55);g.lineTo(9,-43);g.stroke();
    g.fillStyle=CREAM;rr(g,4,-44,17,11,2);g.fill();g.fillStyle=RED;g.fillRect(4,-45,17,2.6);g.fillRect(4,-35,17,2.6);
    for(var s=0;s<2;s++){var q=(m.alt===!!s)?h:0,hx=6+s*7,hy=-50-(1-q)*3,tx=hx+4+q*2,ty=hy-9+q*13;g.strokeStyle='#e9d3a8';g.lineWidth=1.6;g.beginPath();g.moveTo(hx,hy);g.lineTo(tx,ty);g.stroke();arm(g,T,hx,hy);}},
  bass:function(g,T,m,h){g.fillStyle=CREAM;g.beginPath();g.arc(6,-43,14,0,7);g.fill();g.strokeStyle=RED;g.lineWidth=3.2;g.stroke();g.strokeStyle=INK;g.lineWidth=1;g.beginPath();g.arc(6,-43,11.5,0,7);g.stroke();
    g.fillStyle=GOLD;g.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i&1?2.6:6;g.lineTo(6+Math.cos(a)*r,-43+Math.sin(a)*r);}g.closePath();g.fill();
    var bx=9+(1-h)*9,by=-45-(1-h)*11;g.strokeStyle='#e9d3a8';g.lineWidth=1.8;g.beginPath();g.moveTo(bx+9,by-6);g.lineTo(bx,by);g.stroke();g.fillStyle=CREAM;g.beginPath();g.arc(bx,by,3.6,0,7);g.fill();g.strokeStyle=INK;g.lineWidth=.8;g.stroke();arm(g,T,bx+9,by-6);},
  cymbal:function(g,T,m,h){var gap=2+(1-h)*9;[-1,1].forEach(function(s){var x=12+s*gap/2;g.fillStyle=BRASS;g.beginPath();g.ellipse(x,-47,2.4,9.5,0,0,7);g.fill();g.strokeStyle=BRASS2;g.lineWidth=1;g.stroke();arm(g,T,x+s*1.5,-47);});if(h>.3)spark(g,12,-47,h,11);},
  tuba:function(g,T,m,h){g.lineCap='round';g.strokeStyle=BRASS2;g.lineWidth=7;g.beginPath();g.ellipse(0,-46,15,12,0,0,7);g.stroke();g.strokeStyle=BRASS;g.lineWidth=4.2;g.stroke();
    g.lineWidth=5;g.beginPath();g.moveTo(-13,-50);g.quadraticCurveTo(-17,-70,-4,-82);g.stroke();
    var ry=19+h*2.5;g.fillStyle=BRASS;g.beginPath();g.moveTo(-6,-80);g.quadraticCurveTo(10,-84,19,-104+ry);g.lineTo(19,-104-ry);g.quadraticCurveTo(8,-92,-4,-86);g.closePath();g.fill();
    g.fillStyle='#8a5d12';g.beginPath();g.ellipse(19,-104,5,ry,0,0,7);g.fill();g.strokeStyle=BRASS;g.lineWidth=2.4;g.stroke();
    g.strokeStyle=BRASS;g.lineWidth=2;g.beginPath();g.moveTo(10,-52);g.lineTo(7,-62);g.stroke();g.fillStyle=BRASS2;g.fillRect(9,-53,6,6);arm(g,T,12,-50);},
  bone:function(g,T,m,h){var ext=12+(10-Math.max(-2,Math.min(10,m.slc)))*2.2;g.strokeStyle=BRASS;g.lineWidth=2;g.lineCap='round';
    g.beginPath();g.moveTo(7,-64);g.lineTo(21,-66);g.stroke();g.fillStyle=BRASS;g.beginPath();g.moveTo(20,-67.2);g.lineTo(30+h*1.5,-72-h);g.lineTo(30+h*1.5,-60+h);g.lineTo(20,-64.8);g.closePath();g.fill();
    g.fillStyle=BRASS2;g.beginPath();g.ellipse(30+h*1.5,-66,1.8,6+h,0,0,7);g.fill();
    g.strokeStyle=BRASS;g.beginPath();g.moveTo(7,-61.5);g.lineTo(9+ext,-61.5);g.lineTo(9+ext,-58.5);g.lineTo(7,-58.5);g.stroke();arm(g,T,8+ext*.8,-58.5);arm(g,T,10,-64);},
  trumpet:function(g,T,m,h){g.save();g.translate(7,-63);g.rotate(-.1-h*.12);g.strokeStyle=BRASS;g.lineWidth=2.4;g.beginPath();g.moveTo(0,0);g.lineTo(17,0);g.stroke();
    g.fillStyle=BRASS;g.beginPath();g.moveTo(15,-1.4);g.lineTo(23,-5-h);g.lineTo(23,5+h);g.lineTo(15,1.4);g.closePath();g.fill();g.fillStyle=BRASS2;g.beginPath();g.ellipse(23,0,1.4,5+h,0,0,7);g.fill();g.fillRect(6,-4,6,3);g.restore();arm(g,T,14,-62);},
  flute:function(g,T,m,h){g.strokeStyle=SILVER;g.lineWidth=2.4;g.beginPath();g.moveTo(3,-64);g.lineTo(25,-63);g.stroke();g.fillStyle='#8f9aa5';for(var i=0;i<4;i++){g.beginPath();g.arc(11+i*3.4,-63.6,.8,0,7);g.fill();}arm(g,T,10,-61.5);arm(g,T,19,-61.5,3,-54);},
  glock:function(g,T,m,h){var cx=17,cy=-72,i;g.strokeStyle=SILVER;g.lineWidth=2;g.beginPath();g.moveTo(cx,-48);g.lineTo(cx,cy+12);g.stroke();
    g.strokeStyle=BRASS;g.lineWidth=2.4;g.beginPath();g.moveTo(cx-7,cy-12);g.quadraticCurveTo(cx-9,cy+10,cx,cy+12);g.quadraticCurveTo(cx+9,cy+10,cx+7,cy-12);g.stroke();
    g.fillStyle=SILVER;for(i=0;i<5;i++){var w=12-i*1.6;g.fillRect(cx-w/2,cy+7-i*4.2,w,2.4);}g.fillStyle=RED;g.beginPath();g.arc(cx,cy-14,2.2,0,7);g.fill();arm(g,T,cx,-50);
    var mx=cx+8-h*5,my=cy-2-(1-h)*4;g.strokeStyle='#e9d3a8';g.lineWidth=1.4;g.beginPath();g.moveTo(cx+14,-56);g.lineTo(mx,my);g.stroke();g.fillStyle=CREAM;g.beginPath();g.arc(mx,my,2,0,7);g.fill();arm(g,T,cx+14,-56);if(h>.4)spark(g,cx,cy,h,9);}
};
function marcher(g,m,x,y,k,ph,go,now){var lead=!!m.leader,T=lead?LEAD:TY[m.type],fr=ph-Math.floor(ph),lg=Math.floor(ph)&1,lift=go?Math.sin(Math.PI*fr):0,bob=go?Math.sin(Math.PI*fr)*2.2:0,h=Math.max(0,1-(now-m.hit)/.14);
  g.save();g.translate(x,y);g.scale(k,k);
  g.fillStyle='rgba(29,42,68,.2)';g.beginPath();g.ellipse(3,0,15,3.5,0,0,7);g.fill();
  g.translate(0,-bob);
  leg(g,lg?lift:0,-2,'#131b30');leg(g,lg?0:lift,2,INK);
  g.fillStyle=T.coat;rr(g,-8,-58,17,30,5);g.fill();g.fillStyle='rgba(0,0,0,.12)';g.fillRect(-8,-36,17,5);
  g.strokeStyle=CREAM;g.lineWidth=2.2;g.beginPath();g.moveTo(-6,-56);g.lineTo(7,-34);g.moveTo(7,-56);g.lineTo(-6,-34);g.stroke();
  g.fillStyle=GOLD;g.beginPath();g.ellipse(1,-57.5,6,2.4,0,0,7);g.fill();g.fillStyle=CREAM;g.fillRect(-8,-33,17,3);
  g.fillStyle=m.skin;g.beginPath();g.arc(1.5,-65,7,0,7);g.fill();g.fillStyle=INK;g.beginPath();g.arc(5.2,-66,1.15,0,7);g.fill();g.fillStyle='rgba(184,50,42,.35)';g.beginPath();g.arc(4.2,-62.3,1.8,0,7);g.fill();
  if(lead)bearskin(g,T);else shako(g,T,go?Math.sin(Math.PI*fr*2)*1.5:0);
  if(m.gone){arm(g,T,9,-80+Math.sin(now*9)*3);}else INST[lead?'lead':m.type](g,T,m,h,ph,go);
  g.restore();}

/* ---------- the street ---------- */
function hsh(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var CROWD=['#d9674e','#4a6a8c','#e8b44b','#7fb09a','#cf8f83','#2b3f66','#9cc3cf','#b8322a'],HAIR=['#2a1d14','#5a3a22','#c9a063','#1b1b1b','#8c4a2f','#e0d6c8'];
var BCOL=['#d9674e','#f0c87a','#7fb09a','#4a6a8c','#e8b44b','#cf8f83','#9cc3cf'],SIGNS=['CAFÉ','BAKERY','RECORDS','HATS','BRASS & CO','ICE CREAM','BOOKS','FLOWERS','TUBAS','DRUMS'];
function building(j,x,base){var r=hsh(j),h=110+r*90+Math.max(0,VH-420)*.6,col=BCOL[(hsh(j+99)*BCOL.length)|0],top=base-h,a,b,wc=hsh(j+7)<.5?'#fff3d6':'#2b3f66';
  G.fillStyle=col;G.fillRect(x,top,121,h);G.fillStyle='rgba(29,42,68,.22)';G.fillRect(x,top,121,6);G.fillStyle='rgba(0,0,0,.08)';G.fillRect(x+118,top,3,h);
  var rows=Math.floor((h-70)/34);G.fillStyle=wc;G.globalAlpha=.75;for(a=0;a<rows;a++)for(b=0;b<3;b++)G.fillRect(x+15+b*36,top+18+a*34,20,22);G.globalAlpha=1;
  var aw=BCOL[(hsh(j+3)*BCOL.length)|0];for(a=0;a<6;a++){G.fillStyle=a&1?CREAM:aw;G.fillRect(x+10+a*16.8,base-54,16.8,12);G.beginPath();G.arc(x+18.4+a*16.8,base-42,8.4,0,Math.PI);G.fill();}
  G.fillStyle='rgba(29,42,68,.55)';G.fillRect(x+14,base-30,58,30);G.fillRect(x+82,base-34,22,34);
  G.fillStyle=INK;G.font='700 9px "Fragment Mono",monospace';G.textAlign='center';G.fillText(SIGNS[(hsh(j+5)*SIGNS.length)|0],x+60,base-60);}
function crowd(p,exc){var base=VH-136,step=26,u=st.scroll,i0=Math.floor(u/step)-1,i1=Math.ceil((u+VW)/step)+1,i,row;
  for(row=1;row>=0;row--)for(i=i0;i<=i1;i++){var id=i*2+row,r=hsh(id),x=i*step-u+(row?13:0),y=base-(row?9:0),s=(r<.18?.72:1)*(row?.86:1),up=hsh(id+.5)<exc,bb=up&&st.playing?Math.abs(Math.sin(Math.PI*(p/4+hsh(id+.7))))*3:0;person(x,y-bb,s,id,up,row);}}
function person(x,y,s,id,up,row){var col=CROWD[(hsh(id+.1)*CROWD.length)|0],sk=SKIN[(hsh(id+.2)*SKIN.length)|0],hr=HAIR[(hsh(id+.3)*HAIR.length)|0];
  G.save();G.translate(x,y);G.scale(s,s);if(row)G.globalAlpha=.8;
  G.strokeStyle=col;G.lineWidth=4;G.lineCap='round';G.beginPath();if(up){G.moveTo(-5,-30);G.lineTo(-9,-50);G.moveTo(5,-30);G.lineTo(9,-50);}else{G.moveTo(-6,-28);G.lineTo(-7,-14);G.moveTo(6,-28);G.lineTo(7,-14);}G.stroke();
  G.fillStyle=col;rr(G,-7,-34,14,34,5);G.fill();G.fillStyle=sk;G.beginPath();G.arc(0,-40,6.5,0,7);G.fill();G.fillStyle=hr;G.beginPath();G.arc(0,-42,6.8,Math.PI,2*Math.PI);G.fill();
  G.fillStyle=INK;G.fillRect(-2.6,-40,1.3,1.6);G.fillRect(1.4,-40,1.3,1.6);
  if(up&&hsh(id+.9)<.35){G.strokeStyle=INK;G.lineWidth=1;G.beginPath();G.moveTo(9,-50);G.lineTo(9,-66);G.stroke();G.fillStyle=CROWD[(hsh(id+.4)*CROWD.length)|0];G.beginPath();G.moveTo(9,-66);G.lineTo(19,-62);G.lineTo(9,-58);G.closePath();G.fill();}
  G.globalAlpha=1;G.restore();}
function lamps(){var sp=300,u=st.scroll,j0=Math.floor((u-150)/sp)-1,j1=Math.ceil((u+VW)/sp)+1,j,k,top=VH-262,x,x2;
  for(j=j0;j<=j1;j++){x=j*sp+150-u;x2=x+sp;G.strokeStyle=INK;G.lineWidth=1.2;G.beginPath();G.moveTo(x,top);G.quadraticCurveTo((x+x2)/2,top+52,x2,top);G.stroke();
    for(k=1;k<18;k++){var t=k/18,bx=x+(x2-x)*t,by=top+2*t*(1-t)*52;G.fillStyle=CROWD[(k+j*3&7+8)%8];G.beginPath();G.moveTo(bx-6,by);G.lineTo(bx+6,by);G.lineTo(bx,by+12);G.closePath();G.fill();}}
  for(j=j0;j<=j1+1;j++){x=j*sp+150-u;G.fillStyle=INK;G.fillRect(x-2,top-6,4,VH-136-top+6);G.fillRect(x-7,top-14,14,10);G.fillStyle='#ffe9a8';G.fillRect(x-5,top-12,10,6);}}
function scene(p,now){var n=alive().length,exc=Math.min(1,n/10+variety()/16),base=VH-150;
  var gr=G.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#8fcfc6');gr.addColorStop(.75,'#f7e7c4');G.fillStyle=gr;G.fillRect(0,0,VW,VH);
  G.fillStyle='rgba(255,236,170,.9)';G.beginPath();G.arc(VW*.78,base-150,44,0,7);G.fill();
  var cu=st.scroll*.08+now*2,c,cx;G.fillStyle='rgba(255,250,240,.85)';for(c=0;c<4;c++){cx=((c*260-cu)%(VW+200)+VW+200)%(VW+200)-100;var cy=base-230-c%2*40;G.beginPath();G.arc(cx,cy,16,0,7);G.arc(cx+18,cy-8,20,0,7);G.arc(cx+40,cy,15,0,7);G.fill();}
  var u=st.scroll*.5,j0=Math.floor(u/121)-1,j1=Math.ceil((u+VW)/121)+1,j;for(j=j0;j<=j1;j++)building(j,j*121-u,base);
  G.fillStyle='#e9d6b0';G.fillRect(0,base,VW,22);G.fillStyle='rgba(29,42,68,.12)';for(j=Math.floor(st.scroll/40)-1;j<=Math.ceil((st.scroll+VW)/40)+1;j++)G.fillRect(j*40-st.scroll,base,1.5,22);
  lamps();crowd(p,exc);
  G.fillStyle='#b99d6c';G.fillRect(0,base+22,VW,4);G.fillStyle='#d6bf93';G.fillRect(0,base+26,VW,VH-base-26);
  G.fillStyle='rgba(120,90,50,.13)';for(var r=0;r*14<VH-base-30;r++){var off=(r&1)*12,y=base+30+r*14,i0=Math.floor((st.scroll-off)/24)-1;for(var i=i0;i*24+off-st.scroll<VW+24;i++){rr(G,i*24+off-st.scroll,y,20,10,4);G.fill();}}}
function variety(){var s={};band.forEach(function(m){if(!m.gone)s[m.type]=1;});return Object.keys(s).length;}

/* ---------- particles ---------- */
var NOTES=[],CONF=[];
function burst(x,y,n){if(RM)return;for(var i=0;i<n;i++)CONF.push({x:x,y:y,vx:(Math.random()-.5)*240,vy:-150-Math.random()*170,r:Math.random()*6,vr:(Math.random()-.5)*12,c:CROWD[i%8],l:2.6});}
function fire(q,now){if(q.k==='loop'){if(alive().length>=6)burst(VW*(.2+Math.random()*.6),VH-170,16);return;}
  var ms=band.filter(function(m){return m.type===q.k&&!m.gone;});
  ms.forEach(function(m){m.hit=now;m.alt=!m.alt;if(q.k==='bone')m.sl=q.e.d;});
  if(q.e.d!==undefined&&ms.length&&q.e.len>=2&&NOTES.length<40&&!RM){var m=ms[0];NOTES.push({x:m.x+16*m.k,y:m.y-84*m.k,vx:-10,vy:-30,l:1.3,c:TY[m.type].coat,ch:q.e.len>=4?'♫':'♪'});}}

/* ---------- loop ---------- */
var last=perf();
function frame(){var now=perf(),dt=Math.min(.05,now-last);last=now;
  if(st.playing&&st.clk==='p'&&A&&A.state==='running')anchor(pos(),'a');
  var p=pos(),dp=p-st.lastPos;st.lastPos=p;if(dp<0||dp>8)dp=0;var dx=dp/4*STRIDE;st.scroll+=dx;
  if(st.playing){var tv=vnow();VQ=VQ.filter(function(q){if(q.t>tv)return true;fire(q,now);return false;});}
  band.forEach(function(m){if(m.gone){m.x-=dx+60*dt;m.y+=8*dt;}else{m.x+=(m.tx-m.x)*Math.min(1,dt*2.6);m.y+=(m.ty-m.y)*Math.min(1,dt*4);}m.slc+=(m.sl-m.slc)*Math.min(1,dt*14);});
  band=band.filter(function(m){return !(m.gone&&(m.x<-60||now-m.wave>14));});
  LEADER.x+=(LEADER.tx-LEADER.x)*Math.min(1,dt*2.6);LEADER.y+=(LEADER.ty-LEADER.y)*Math.min(1,dt*4);
  NOTES.forEach(function(q){q.x+=q.vx*dt-dx;q.y+=q.vy*dt;q.l-=dt;});NOTES=NOTES.filter(function(q){return q.l>0;});
  CONF.forEach(function(q){q.vy+=300*dt;q.x+=q.vx*dt-dx;q.y+=q.vy*dt;q.r+=q.vr*dt;q.l-=dt;});CONF=CONF.filter(function(q){return q.l>0&&q.y<VH+10;});
  st.hint+=((alive().length?0:1)-st.hint)*Math.min(1,dt*3);
  draw(p,now);requestAnimationFrame(frame);}
function draw(p,now){G.setTransform(SCL*DPR,0,0,SCL*DPR,0,0);scene(p,now);
  var list=band.slice();list.push(LEADER);list.sort(function(a,b){return a.y-b.y||a.x-b.x;});
  list.forEach(function(m){var mv=Math.abs(m.tx-m.x)>3||m.gone,go=st.playing||mv,ph=st.playing&&!m.gone?p/4:now*2;marcher(G,m,m.x,m.y,m.k,ph,go,now);});
  G.textAlign='center';G.font='700 17px Georgia,serif';NOTES.forEach(function(q){G.globalAlpha=Math.min(1,q.l);G.fillStyle=q.c;G.fillText(q.ch,q.x,q.y);});G.globalAlpha=1;
  CONF.forEach(function(q){G.save();G.translate(q.x,q.y);G.rotate(q.r);G.fillStyle=q.c;G.globalAlpha=Math.min(1,q.l);G.fillRect(-3,-1.8,6,3.6);G.restore();});G.globalAlpha=1;
  if(st.hint>.02){G.globalAlpha=st.hint;var hy=Math.max(70,VH-300);G.fillStyle='rgba(255,250,240,.9)';rr(G,VW/2-178,hy-38,356,80,16);G.fill();G.strokeStyle=INK;G.lineWidth=2;G.stroke();G.font='34px Shrikhand,Georgia,serif';G.fillStyle=INK;G.fillText('Recruit your band!',VW/2+2,hy+2);G.fillStyle=RED;G.fillText('Recruit your band!',VW/2,hy);
    G.font='15px "Fragment Mono",monospace';G.fillStyle=INK;G.fillText('tap an instrument below  ↓',VW/2,hy+28);G.globalAlpha=1;}}

/* ---------- UI ---------- */
var tt=0;function toast(s){var e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},2600);say(s);}
function say(s){$('live').textContent=s;}
function update(){var a=alive(),n=a.length,c={},v;a.forEach(function(m){c[m.type]=(c[m.type]||0)+1;});v=Object.keys(c).length;
  ORDER.forEach(function(k){var T=TY[k];T.badge.hidden=!c[k];T.badge.textContent=c[k]||'';T.btn.setAttribute('aria-label','Add '+T.name+(c[k]?' ('+c[k]+' marching)':''));});
  $('status').textContent=n?n+' marcher'+(n>1?'s':'')+' · '+v+' of 8 instruments'+(v===8?' · full band!':''):'No band yet. Tap an instrument to recruit your first marcher.';
  cv.setAttribute('aria-label',n?'A drum major leading '+n+' marchers down a festive street: '+ORDER.filter(function(k){return c[k];}).map(function(k){return c[k]+' '+TY[k].label.toLowerCase();}).join(', ')+'.':'An empty street with a drum major waiting for a band.');
  var pb=$('playBtn');pb.textContent=st.playing?'❚❚ Halt':'▶ March';pb.setAttribute('aria-pressed',st.playing?'true':'false');
  try{history.replaceState(null,'',n?'#band='+a.map(function(m){return TY[m.type].k;}).join('')+'&bpm='+st.bpm:location.pathname+location.search);}catch(e){}
  if(v===8&&!st.full){st.full=true;toast('Full band! Every instrument is marching.');for(var i=0;i<5;i++)burst(VW*(.12+i*.19),VH-180,24);if(A&&st.clk==='a'&&A.state==='running')cheer(A.currentTime+.05);}
  if(v<8)st.full=false;}
function icon(c,k){var x=c.getContext('2d'),tb=k==='tuba',sc=tb?.74:1.3;x.clearRect(0,0,96,96);x.save();x.translate(tb?40:38,tb?100:136);marcher(x,{type:k,skin:'#d9a07a',hit:-9,alt:false,slc:4},0,0,sc,0,false,0);x.restore();}
ORDER.forEach(function(k,i){var b=document.createElement('button'),c=document.createElement('canvas'),l=document.createElement('span'),n=document.createElement('span');
  b.type='button';b.className='inst';b.style.setProperty('--i',i);c.width=96;c.height=96;c.setAttribute('aria-hidden','true');l.textContent=TY[k].label;n.className='n';n.hidden=true;n.setAttribute('aria-hidden','true');
  b.appendChild(c);b.appendChild(l);b.appendChild(n);b.addEventListener('click',function(){if(add(k))start();});$('roster').appendChild(b);TY[k].btn=b;TY[k].badge=n;icon(c,k);});
$('playBtn').addEventListener('click',toggle);
$('strike').addEventListener('click',start);
$('homeBtn').addEventListener('click',function(){var a=alive();if(!a.length){toast('Nobody to send home yet.');return;}sendHome(a[a.length-1]);});
$('clearBtn').addEventListener('click',function(){var a=alive();if(!a.length)return;a.forEach(function(m){sendHome(m,true);});toast('Band dismissed. Thanks for marching!');});
$('rndBtn').addEventListener('click',function(){var k=0,room=MAX-alive().length;if(!room){toast('The street is full. Tap a marcher to send them home.');return;}
  var pick=ORDER.slice().sort(function(){return Math.random()-.5;}).slice(0,Math.min(room,6));pick.forEach(function(t){if(add(t,true))k++;});start();toast('Surprise! '+k+' new marchers joined.');});
$('shareBtn').addEventListener('click',function(){if(!alive().length){toast('Recruit a band first!');return;}var u=location.href;
  if(navigator.share){navigator.share({title:'My Musical Parade',text:'Hear my marching band!',url:u}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('Link copied. Send your band to a friend!');},function(){toast('Copy the link from the address bar.');});}
  else toast('Copy the link from the address bar.');});
$('tempo').addEventListener('input',function(){st.bpm=+this.value;$('bpmOut').textContent=st.bpm;if(st.playing){st.aS=st.step;st.aT=st.nt;}update();});
cv.addEventListener('click',function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
  var a=alive().sort(function(p,q){return q.y-p.y;});for(var i=0;i<a.length;i++){var m=a[i];if(Math.abs(x-m.x)<17*m.k&&y>m.y-98*m.k&&y<m.y+6){sendHome(m);return;}}
  if(Math.abs(x-LEADER.x)<18&&y>LEADER.y-100&&y<LEADER.y+6)toggle();});
document.addEventListener('keydown',function(e){var tg=e.target&&e.target.tagName;if(tg==='INPUT'||e.altKey||e.ctrlKey||e.metaKey)return;var n=+e.key;
  if(n>=1&&n<=8){if(add(ORDER[n-1]))start();e.preventDefault();}else if(e.key==='Backspace'||e.key==='Delete'){sendHome(alive().slice(-1)[0]);e.preventDefault();}else if(e.key===' '&&tg!=='BUTTON'){toggle();e.preventDefault();}});
document.addEventListener('visibilitychange',function(){if(!A||st.clk!=='a'||!st.playing)return;try{if(document.hidden)A.suspend();else A.resume();}catch(e){}});
function resize(){var r=cv.getBoundingClientRect();if(!r.width)return;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);SCL=Math.min(r.width/560,r.height/380);VW=r.width/SCL;VH=r.height/SCL;
  layout();band.forEach(function(m){if(!m.gone){m.y=m.ty;}});LEADER.x=LEADER.tx;LEADER.y=LEADER.ty;}
window.addEventListener('resize',resize);resize();
(function(){var h=location.hash,mb=/band=([a-z]{1,16})/.exec(h),mt=/bpm=(\d{2,3})/.exec(h),K={};ORDER.forEach(function(k){K[TY[k].k]=k;});
  if(mt){var b=Math.max(84,Math.min(150,+mt[1]));b-=b%2;st.bpm=b;$('tempo').value=b;$('bpmOut').textContent=b;}
  if(mb){mb[1].split('').forEach(function(ch){if(K[ch])add(K[ch],true);});band.forEach(function(m){m.x=m.tx;});if(alive().length){$('strike').hidden=false;say('A shared band of '+alive().length+' is ready. Press strike up the band.');}}
  update();})();
window.__mp={st:st,band:function(){return band;},alive:alive,add:add,sendHome:sendHome,setup:setup,PLAY:PLAY,EV:EV,sched:sched,pos:pos,start:start,stop:stop,dims:function(){return {VW:VW,VH:VH};},VQ:function(){return VQ;},TY:TY,ORDER:ORDER};
requestAnimationFrame(frame);
})();
