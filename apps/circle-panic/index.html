<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Circle Panic · one click, exponential regret</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%94%B4">
  <meta name="description" content="Click once: a circle spawns two more, which spawn two more. Watch the exponential bloom and slam the panic button before your tab melts.">
  <meta property="og:title" content="Circle Panic — one click, exponential regret">
  <meta property="og:description" content="Every circle recursively spawns two more. There is a panic button. You will need it.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/exploding%20colorful%20circles%20fractal%20bloom%20on%20black%20emergency%20red%20button%20minimal%20poster?width=1200&height=630&seed=2222&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/circle-panic">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --void:#0c0a12; --ink:#efeaf4; --dim:#8a8496; --panic:#e8352e; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; overflow:hidden; }
    body{ background:var(--void); color:var(--ink); font:400 1rem/1.5 'Space Mono', monospace; }
    #cv{ position:fixed; inset:0; width:100vw; height:100vh; cursor:crosshair; }
    .hud{
      position:fixed; top:0.9rem; left:50%; transform:translateX(-50%);
      display:flex; gap:1rem; align-items:center; z-index:3; flex-wrap:wrap; justify-content:center;
      background:rgba(12,10,18,0.8); border:1px solid #2a2438; border-radius:99px;
      padding:0.4rem 1.1rem; font-size:0.75rem; color:var(--dim); pointer-events:none;
    }
    .hud b{ color:var(--ink); font-size:0.95rem; }
    h1{
      position:fixed; left:50%; top:44%; transform:translate(-50%,-50%);
      font:400 clamp(1.6rem,5vw,2.6rem) 'Bungee', sans-serif; color:var(--dim);
      margin:0; z-index:2; pointer-events:none; text-align:center; transition:opacity 0.4s;
    }
    h1 small{ display:block; font:400 0.8rem 'Space Mono', monospace; margin-top:0.5rem; }
    h1.gone{ opacity:0; }
    #panic{
      position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%);
      z-index:4; cursor:pointer;
      font:400 1.3rem 'Bungee', sans-serif; color:#fff;
      background:radial-gradient(circle at 35% 30%, #ff6a5e, var(--panic) 70%);
      border:4px solid #7a120e; border-radius:50%;
      width:7rem; height:7rem; min-height:2.75rem;
      box-shadow:0 6px 0 #7a120e, 0 0 34px rgba(232,53,46,0.45);
      transition:transform 0.08s;
    }
    #panic:active{ transform:translateX(-50%) translateY(5px); box-shadow:0 1px 0 #7a120e; }
    #panic:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
    #panic.throb{ animation:throb 0.5s ease-in-out infinite; }
    @keyframes throb{ 50%{ box-shadow:0 6px 0 #7a120e, 0 0 60px rgba(232,53,46,0.9); } }
    @media (prefers-reduced-motion: reduce){ #panic.throb{ animation:none; } }
  </style>
</head>
<body>
  <canvas id="cv" aria-label="Circle field. Click or tap anywhere to spawn a recursively multiplying circle."></canvas>
  <h1 id="title">CLICK ANYWHERE<small>each circle spawns two more. there is a panic button. you will need it.</small></h1>
  <div class="hud"><span>circles <b id="hCount">0</b></span><span>spawn rate <b id="hRate">0</b>/s</span><span>generation <b id="hGen">0</b></span></div>
  <button id="panic" type="button" aria-label="Panic button: stop and clear all circles">PANIC</button>
  <p id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

  <script>
  (function(){
    'use strict';
    var cv=document.getElementById('cv'), X=cv.getContext('2d');
    var DPR=Math.min(2, window.devicePixelRatio||1);
    function fit(){ cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; X.setTransform(DPR,0,0,DPR,0,0); }
    fit(); addEventListener('resize', fit);

    var circles=[];              // {x,y,r,hue,gen,born}
    var epoch=0, spawned=0, rateWin=[], maxGen=0;   /* epoch token: panic invalidates ALL in-flight blooms, no re-arm race */
    var MAX=4000;                // hard ceiling — the panic button's silent bodyguard
    var reduceMotion=false;
    try{ reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

    var sleep=function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

    /* THE async loop: every circle, after a breath, begets two.
       Recursion depth = generation; each child schedules its own children. */
    async function bloom(x,y,r,hue,gen,myEpoch){
      if(myEpoch!==epoch||circles.length>=MAX) return;
      var c={ x:x, y:y, r:r, hue:hue, gen:gen, born:performance.now() };
      circles.push(c); spawned++; rateWin.push(performance.now());
      maxGen=Math.max(maxGen,gen);
      await sleep(260+Math.random()*340);
      if(myEpoch!==epoch) return;   /* woke into a post-panic world — stand down */
      for(var i=0;i<2;i++){
        var a=Math.random()*6.283, d=r*1.6+Math.random()*90;
        var nx=Math.min(innerWidth-8,Math.max(8,x+Math.cos(a)*d));
        var ny=Math.min(innerHeight-8,Math.max(8,y+Math.sin(a)*d));
        bloom(nx, ny, Math.max(3,r*(0.82+Math.random()*0.22)), (hue+24+Math.random()*40)%360, gen+1, myEpoch);
      }
    }

    cv.addEventListener('pointerdown', function(e){
      document.getElementById('title').classList.add('gone');
      bloom(e.clientX, e.clientY, 22+Math.random()*14, Math.random()*360, 1, epoch);
    });

    var panic=document.getElementById('panic');
    panic.addEventListener('click', function(){
      epoch++;                 // every in-flight bloom carries the old epoch and dies on wake
      circles=[]; rateWin=[]; maxGen=0;
      panic.classList.remove('throb');
      document.getElementById('live').textContent='Panic: all circles stopped and cleared.';
      document.getElementById('title').classList.remove('gone');
    });

    function draw(){
      X.fillStyle='rgba(12,10,18,0.28)';
      X.fillRect(0,0,innerWidth,innerHeight);
      var now=performance.now();
      for(var i=0;i<circles.length;i++){
        var c=circles[i];
        var age=(now-c.born)/1000;
        var wob=reduceMotion?1:(1+Math.sin(age*3+c.gen)*0.06);
        X.beginPath();
        X.arc(c.x, c.y, c.r*Math.min(1,age*4)*wob, 0, 6.283);
        X.fillStyle='hsla('+c.hue+',85%,'+(62-Math.min(20,c.gen*1.4))+'%,0.8)';
        X.fill();
        X.beginPath();
        X.arc(c.x, c.y, c.r*Math.min(1,age*4)*wob*0.55, 0, 6.283);
        X.fillStyle='hsla('+((c.hue+40)%360)+',90%,75%,0.5)';
        X.fill();
      }
      while(rateWin.length&&rateWin[0]<now-1000) rateWin.shift();
      document.getElementById('hCount').textContent=circles.length+(circles.length>=MAX?' (MAX)':'');
      document.getElementById('hRate').textContent=rateWin.length;
      document.getElementById('hGen').textContent=maxGen;
      panic.classList.toggle('throb', circles.length>150&&!reduceMotion);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
