<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Laugh Track — a cackle for every emoji</title>
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%98%82" />
<meta name="description" content="A laugh-track bot for your chat: every emoji triggers a randomly synthesized cackle — witch cackles, guffaws, wheezes, villain laughs. Emoji bursts summon the whole studio audience." />
<meta property="og:type" content="website" />
<meta property="og:title" content="The Laugh Track" />
<meta property="og:description" content="Every chat emoji gets a synthesized cackle. 💀 wheezes. 😈 goes full villain. Spam emojis and the studio audience joins in." />
<meta property="og:url" content="https://sloppy.live/laugh-track-bot/" />
<meta property="og:image" content="https://image.pollinations.ai/prompt/a%20retro%20tv%20studio%20applause%20sign%20glowing%20LAUGH%2C%20rows%20of%20cartoon%20audience%20blobs%20laughing%2C%20red%20curtains%2C%20marquee%20bulbs%2C%20warm%20stage%20light%2C%20playful%20illustration?width=1200&height=630&nologo=true&seed=4242" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --stage:#1c0f14; --curtain:#7a1f2b; --curtain2:#5c141f; --panel:#241218; --edge:#4a2430;
  --bulb:#ffd166; --cream:#f5ead8; --dim:#a88a92; --neon:#ff5c7a; --live:#7fce6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html,body{height:100%}
body{
  background:var(--stage); color:var(--cream); font-family:'IBM Plex Mono',monospace; overflow:hidden;
  background-image:
    radial-gradient(ellipse 70% 55% at 50% 100%, rgba(255,209,102,.08), transparent 60%),
    repeating-linear-gradient(90deg, rgba(122,31,43,.16) 0 46px, rgba(92,20,31,.16) 46px 92px);
}
.app{ display:grid; grid-template-columns:minmax(0,1fr) 21rem; height:100vh; }
/* ---- stage ---- */
.stage{ display:flex; flex-direction:column; align-items:center; min-width:0; padding:1rem; position:relative; }
.sign{
  margin-top:2.2rem; padding:1rem 2.4rem; border:6px solid #3a2a10; border-radius:1rem;
  background:#241a08; position:relative; transition:box-shadow .15s, background .15s;
}
.sign h1{
  font-family:'Alfa Slab One',serif; font-weight:400; letter-spacing:.12em;
  font-size:clamp(1.8rem,6vw,3.2rem); color:#6a5a3a; transition:color .1s, text-shadow .1s;
}
.sign.lit{ background:#3a2a08; box-shadow:0 0 60px rgba(255,209,102,.5), inset 0 0 30px rgba(255,209,102,.2); }
.sign.lit h1{ color:var(--bulb); text-shadow:0 0 24px rgba(255,209,102,.9); }
.sign .bulbs, .sign .bulbs2{ position:absolute; inset:-13px; pointer-events:none; }
.sign .bulbs::before, .sign .bulbs::after{
  content:"• • • • • • • • • •"; position:absolute; left:0; right:0; text-align:center;
  color:#4a3a1a; font-size:.9rem; letter-spacing:.4em;
}
.sign .bulbs::before{ top:-4px; } .sign .bulbs::after{ bottom:-4px; }
.sign.lit .bulbs::before, .sign.lit .bulbs::after{ color:var(--bulb); text-shadow:0 0 10px var(--bulb); }
.laughtype{
  min-height:1.6rem; margin-top:.9rem; font-size:.8rem; color:var(--neon); font-style:italic; letter-spacing:.1em;
}
#audience{ width:min(46rem,94%); flex:1; min-height:0; display:block; }
.stats{ display:flex; gap:1.6rem; font-size:.72rem; color:var(--dim); margin-bottom:.4rem; flex-wrap:wrap; justify-content:center; }
.stats b{ color:var(--bulb); }
.controls{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; justify-content:center; padding-bottom:.6rem; }
.controls label{ font-size:.68rem; color:var(--dim); display:flex; align-items:center; gap:.4rem; }
input[type=range]{ accent-color:var(--neon); min-height:1.6rem; width:7rem; cursor:pointer; }
.bigarm{
  font-family:'Alfa Slab One',serif; font-size:1.05rem; letter-spacing:.08em;
  background:var(--neon); color:#2a0812; border:3px solid #8a2038; border-radius:.7rem;
  padding:.6rem 1.4rem; cursor:pointer; min-height:2.9rem;
  box-shadow:0 4px 0 #8a2038;
}
.bigarm:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a2038; }
.bigarm[aria-pressed="true"]{ background:var(--live); border-color:#3a6a2c; box-shadow:0 4px 0 #3a6a2c; color:#122a0c; }
.testrow{ display:flex; gap:.35rem; flex-wrap:wrap; justify-content:center; padding-bottom:1rem; }
.testrow button{
  font-size:1.15rem; background:var(--panel); border:1px solid var(--edge); border-radius:.5rem;
  min-width:2.75rem; min-height:2.75rem; cursor:pointer;
}
.testrow button:hover{ border-color:var(--bulb); }
:focus-visible{ outline:3px solid var(--bulb); outline-offset:2px; }
/* ---- chat column ---- */
.chatcol{ background:var(--panel); border-left:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
.chead{
  padding:.75rem 1rem; border-bottom:1px solid var(--edge);
  font-family:'Alfa Slab One',serif; font-size:1rem; letter-spacing:.1em;
  display:flex; justify-content:space-between; align-items:center;
}
.pill{ font-size:.6rem; font-family:'IBM Plex Mono',monospace; color:var(--dim); }
.pill i{ display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:#d9a43a; margin-right:.25rem; }
.pill.live i{ background:var(--live); box-shadow:0 0 6px var(--live); }
.pill.err i{ background:var(--neon); }
.twitchrow{ display:flex; gap:.4rem; padding:.5rem .8rem; border-bottom:1px solid var(--edge); }
.twitchrow input{
  flex:1; min-width:0; background:var(--stage); border:1px solid var(--edge); border-radius:.4rem;
  color:var(--cream); font-family:inherit; font-size:.74rem; padding:.4rem .5rem; min-height:2.4rem;
}
.twitchrow input:focus{ border-color:var(--bulb); outline:none; }
.twitchrow button{
  background:var(--bulb); color:#3a2a08; border:none; border-radius:.4rem; font-family:inherit;
  font-weight:600; font-size:.72rem; padding:.4rem .7rem; cursor:pointer; min-height:2.4rem;
}
#feed{
  flex:1; overflow-y:auto; min-height:0; padding:.6rem .8rem; font-size:.78rem; line-height:1.55;
  scrollbar-width:thin; scrollbar-color:var(--edge) transparent;
}
#feed .line{ margin-bottom:.35rem; overflow-wrap:anywhere; }
#feed .line b{ font-weight:600; }
#feed .line .ha{ color:var(--bulb); margin-left:.3rem; font-size:.66rem; }
.sayrow{ display:flex; gap:.4rem; padding:.6rem .8rem .8rem; border-top:1px solid var(--edge); }
.sayrow input{
  flex:1; min-width:0; background:var(--stage); border:1px solid var(--edge); border-radius:.5rem;
  color:var(--cream); font-family:inherit; font-size:.8rem; padding:.5rem .6rem; min-height:2.75rem;
}
.sayrow input:focus{ border-color:var(--neon); outline:none; }
.sayrow button{
  background:var(--neon); color:#2a0812; border:none; border-radius:.5rem; font-family:inherit;
  font-weight:600; font-size:.8rem; padding:.5rem .9rem; cursor:pointer; min-height:2.75rem;
}
.floatemoji{
  position:fixed; z-index:8; font-size:2rem; pointer-events:none;
  animation:floatUp 1.6s ease-out forwards;
}
@keyframes floatUp{ from{ opacity:1; transform:translateY(0) rotate(0); } to{ opacity:0; transform:translateY(-16vh) rotate(20deg); } }
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .app{ grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,55vh) minmax(0,1fr); }
  .chatcol{ border-left:none; border-top:1px solid var(--edge); }
}
@media (prefers-reduced-motion: reduce){ .floatemoji{ animation:none; opacity:0; } .bigarm:active{ transform:none; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="The laugh track stage">
    <div class="sign" id="sign"><span class="bulbs" aria-hidden="true"></span><h1>LAUGH</h1></div>
    <p class="laughtype" id="laughType" aria-hidden="true">the audience waits…</p>
    <canvas id="audience" role="img" aria-label="A row of cartoon audience blobs that bounce when the laugh track fires"></canvas>
    <div class="stats" role="status" aria-live="off">
      <span>laughs <b id="stLaughs">0</b></span>
      <span>biggest pile-on <b id="stCombo">0</b></span>
      <span>driest spell <b id="stDry">0s</b></span>
    </div>
    <div class="controls">
      <button type="button" class="bigarm" id="armBtn" aria-pressed="false">🔇 ARM THE LAUGH TRACK</button>
      <label for="vol">volume <input type="range" id="vol" min="0" max="100" value="70" /></label>
    </div>
    <div class="testrow" aria-label="Test cackles">
      <button type="button" data-e="😂" aria-label="Test big cackle">😂</button>
      <button type="button" data-e="🤣" aria-label="Test rolling cackle">🤣</button>
      <button type="button" data-e="💀" aria-label="Test wheeze">💀</button>
      <button type="button" data-e="😈" aria-label="Test villain laugh">😈</button>
      <button type="button" data-e="😅" aria-label="Test nervous chuckle">😅</button>
      <button type="button" data-e="🤭" aria-label="Test giggle">🤭</button>
      <button type="button" data-e="🐷" aria-label="Test snort">🐷</button>
    </div>
  </section>
  <aside class="chatcol" aria-label="Chat">
    <div class="chead">CHAT <span class="pill" id="pill"><i></i><span id="pillTxt">local only</span></span></div>
    <div class="twitchrow">
      <input id="chanIn" placeholder="twitch channel" aria-label="Twitch channel to read" autocomplete="off" />
      <button type="button" id="connectBtn">connect</button>
    </div>
    <div id="feed" role="log" aria-live="off" aria-label="Chat messages"></div>
    <div class="sayrow">
      <input id="sayIn" placeholder="type something with an emoji 😂" aria-label="Send a test message" maxlength="200" autocomplete="off" />
      <button type="button" id="sayBtn">send</button>
    </div>
  </aside>
</div>
<div class="sr-only" role="status" aria-live="polite" id="sr"></div>

<script>
'use strict';
/* ============================ [PURE-BEGIN] ============================ */
var EMOJI_RE=/(?:\p{Extended_Pictographic}|\p{Regional_Indicator}{2})/gu;
var TEXT_LOL_RE=/(^|\s)(xd+|:d|:\)|;\)|:p)(\s|$)/i;
function detectEmojis(text){
  var t=String(text||'');
  var m=t.match(EMOJI_RE)||[];
  var textFace=TEXT_LOL_RE.test(t);
  return { count:m.length + (textFace?1:0), first:m[0]||null, textFace:textFace };
}
var LAUGH_TYPES=['cackle','guffaw','wheeze','giggle','evil','snort'];
var EMOJI_BIAS={
  '💀':'wheeze','😵':'wheeze','🫠':'wheeze',
  '😈':'evil','👿':'evil','🦹':'evil','🧛':'evil',
  '🤭':'giggle','😊':'giggle','🥰':'giggle','☺':'giggle',
  '🐷':'snort','🐽':'snort',
  '😤':'guffaw','🦍':'guffaw','🐻':'guffaw',
  '😂':'cackle','🤣':'cackle','😹':'cackle','🧙':'cackle'
};
function pickLaugh(emoji, rnd){
  if(emoji && EMOJI_BIAS[emoji]) return EMOJI_BIAS[emoji];
  return LAUGH_TYPES[Math.floor(rnd()*LAUGH_TYPES.length)];
}
/* ============================ [PURE-END] ============================ */

var $=function(id){ return document.getElementById(id); };
var AC=null, master=null, armed=false;
var stats={ laughs:0, combo:0, lastLaugh:0, driest:0, lastAt:performance.now() };
var recent=[];   // timestamps for pile-on detection

/* ---------- laugh synthesis (all original — every cackle is fresh) ---------- */
function ac(){ return AC; }
function voice(t0, f0, dur, gain, formant, type){
  var o=AC.createOscillator(); o.type=type||'sawtooth';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f0*0.72), t0+dur);
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=formant; bp.Q.value=2.2;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0+dur*0.18);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(bp); bp.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.03);
}
function breath(t0, dur, gain, freq){
  var len=Math.ceil(AC.sampleRate*dur), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  var s=AC.createBufferSource(); s.buffer=b;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.1;
  var g=AC.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
var LAUGHS={
  cackle:function(r){
    var base=280+r()*140, n=5+Math.floor(r()*4), rate=0.09+r()*0.03;
    for(var i=0;i<n;i++){
      var f=base*(1+Math.sin(i*1.4)*0.18)*(i>n-3?0.85:1);
      voice(AC.currentTime+i*rate, f, rate*0.9, 0.16, 1400+r()*500, 'sawtooth');
    }
    breath(AC.currentTime+n*rate, 0.22, 0.05, 2200);
  },
  guffaw:function(r){
    var base=110+r()*50, n=3+Math.floor(r()*3), rate=0.19+r()*0.05;
    for(var i=0;i<n;i++)
      voice(AC.currentTime+i*rate, base*(1-i*0.06), rate*0.95, 0.22, 700+r()*300, 'sawtooth');
  },
  wheeze:function(r){
    var n=4+Math.floor(r()*4), rate=0.15+r()*0.05;
    for(var i=0;i<n;i++)
      breath(AC.currentTime+i*rate, rate*0.8, 0.16*(1-i/(n+2)), 2600+r()*1200);
    voice(AC.currentTime+n*rate+0.05, 500+r()*200, 0.3, 0.05, 2000, 'triangle');
  },
  giggle:function(r){
    var base=420+r()*180, n=6+Math.floor(r()*5), rate=0.055+r()*0.02;
    for(var i=0;i<n;i++)
      voice(AC.currentTime+i*rate, base+((i%2)*60), rate*0.85, 0.09, 1900+r()*600, 'triangle');
  },
  evil:function(r){
    var base=95+r()*30, n=4+Math.floor(r()*2), rate=0.30+r()*0.06;
    for(var i=0;i<n;i++)
      voice(AC.currentTime+i*rate, base*(1+i*0.04), rate*0.92, 0.2, 500+i*80, 'sawtooth');
    voice(AC.currentTime+n*rate, base*1.3, 0.8, 0.16, 650, 'sawtooth');  // the drawn-out finale
  },
  snort:function(r){
    breath(AC.currentTime, 0.12, 0.3, 900);
    breath(AC.currentTime+0.05, 0.1, 0.2, 500);
    var n=3+Math.floor(r()*3);
    for(var i=0;i<n;i++)
      voice(AC.currentTime+0.2+i*0.11, 240+r()*80, 0.1, 0.12, 1300, 'sawtooth');
  }
};
var LABELS={ cackle:'a proper witch cackle', guffaw:'a chesty guffaw', wheeze:'the silent wheeze',
  giggle:'suppressed giggles', evil:'villain monologue laugh', snort:'the snort-relapse' };
function applause(intensity){
  // studio audience: layered claps (filtered noise bursts) + 2-3 stacked laughs
  for(var i=0;i<Math.min(26, 10+intensity*6); i++)
    breath(AC.currentTime+Math.random()*0.9, 0.05+Math.random()*0.04, 0.05, 2000+Math.random()*3000);
  var picks=1+Math.min(2,intensity);
  for(var j=0;j<picks;j++){
    var t=LAUGH_TYPES[Math.floor(Math.random()*LAUGH_TYPES.length)];
    setTimeout(LAUGHS[t].bind(null, Math.random), j*160);
  }
}

/* ---------- fire control ---------- */
function fireLaugh(emoji, sourceX){
  var now=performance.now();
  stats.driest=Math.max(stats.driest, (now-stats.lastAt)/1000);
  stats.lastAt=now;
  recent.push(now);
  recent=recent.filter(function(t){ return now-t<2600; });
  var pileOn=recent.length;
  stats.combo=Math.max(stats.combo, pileOn);
  if(now-stats.lastLaugh<380) { updStats(); return null; }   // debounce the machine-gun
  stats.lastLaugh=now;
  stats.laughs++;
  var type=pickLaugh(emoji, Math.random);
  if(armed && AC){
    if(pileOn>=3) applause(pileOn-2);
    LAUGHS[type](Math.random);
  }
  $('laughType').textContent=LABELS[type]+(pileOn>=3?' + the whole audience':'');
  var sign=$('sign');
  sign.classList.remove('lit'); void sign.offsetWidth; sign.classList.add('lit');
  clearTimeout(fireLaugh._t);
  fireLaugh._t=setTimeout(function(){ sign.classList.remove('lit'); }, 900);
  audienceBounce(pileOn>=3?2:1);
  if(emoji){
    var fe=document.createElement('div');
    fe.className='floatemoji'; fe.textContent=emoji;
    fe.style.left=(sourceX||(20+Math.random()*60))+'%';
    fe.style.top='55%';
    document.body.appendChild(fe);
    setTimeout(function(){ fe.remove(); }, 1700);
  }
  updStats();
  return type;
}
function updStats(){
  $('stLaughs').textContent=stats.laughs;
  $('stCombo').textContent=stats.combo;
  $('stDry').textContent=Math.round(stats.driest)+'s';
}

/* ---------- audience blobs ---------- */
var canvas=$('audience'), ctx=canvas.getContext('2d');
var DPR=Math.min(2, window.devicePixelRatio||1);
function fit(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*DPR; canvas.height=r.height*DPR; }
addEventListener('resize', fit);
var crowd=[];
for(var ci=0; ci<14; ci++){
  crowd.push({ x:(ci+0.5)/14, hue:[350,45,160,200,280,25,90][ci%7], bounce:0, phase:Math.random()*6.28, w:0.5+Math.random()*0.5 });
}
function audienceBounce(mult){
  crowd.forEach(function(c){ c.bounce=Math.max(c.bounce, (0.5+Math.random()*0.5)*mult); });
}
function drawCrowd(now){
  var W=canvas.width/DPR, H=canvas.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var rowY=H*0.72, R=Math.min(34, W/20);
  crowd.forEach(function(c,i){
    c.bounce*=0.94;
    var x=c.x*W, y=rowY - Math.abs(Math.sin(now/90+c.phase))*c.bounce*26 + Math.sin(now/900+c.phase)*2;
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(x, rowY+R*0.8, R*0.8, R*0.2, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle='hsl('+c.hue+',45%,'+(38+c.bounce*18)+'%)';
    ctx.beginPath(); ctx.arc(x, y, R*c.w+R*0.4, 0, 6.283); ctx.fill();
    var open=c.bounce>0.25;
    ctx.fillStyle='#1c0f14';
    ctx.beginPath(); ctx.arc(x-R*0.25, y-R*0.15, 2.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(x+R*0.25, y-R*0.15, 2.4, 0, 6.283); ctx.fill();
    if(open){ ctx.beginPath(); ctx.ellipse(x, y+R*0.25, R*0.2, R*0.26, 0, 0, 6.283); ctx.fill(); }
    else{ ctx.fillRect(x-R*0.16, y+R*0.22, R*0.32, 2.2); }
  });
}
function frame(now){ requestAnimationFrame(frame); drawCrowd(now); }
fit(); requestAnimationFrame(frame);

/* ---------- chat plumbing ---------- */
function nameColor(name){
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return 'hsl('+(h%360)+',60%,72%)';
}
function handleChat(user, text){
  var det=detectEmojis(text);
  var fired=null;
  if(det.count>0) fired=fireLaugh(det.first||'😂');
  var line=document.createElement('div');
  line.className='line';
  var b=document.createElement('b'); b.style.color=nameColor(user); b.textContent=user+': ';
  line.appendChild(b);
  line.appendChild(document.createTextNode(String(text).slice(0,200)));
  if(fired){ var ha=document.createElement('span'); ha.className='ha'; ha.textContent='← '+fired; line.appendChild(ha); }
  var feed=$('feed');
  feed.appendChild(line);
  while(feed.children.length>80) feed.removeChild(feed.firstChild);
  feed.scrollTop=feed.scrollHeight;
  return fired;
}

/* ---------- twitch (anonymous IRC — repo-proven bridge, with state logs) ---------- */
var ws=null, wsChan='', wsGen=0, wsAttempt=0, reconnectTimer=null;
function dbg(){
  var a=['%c[laugh-track:irc]','color:#ff5c7a;font-weight:bold'];
  for(var i=0;i<arguments.length;i++) a.push(arguments[i]);
  try{ console.log.apply(console,a); }catch(e){}
}
function setPill(cls,txt){ $('pill').className='pill '+cls; $('pillTxt').textContent=txt; }
function connectTwitch(chan, isRetry){
  chan=(chan||'').toLowerCase().trim().replace(/^#/,'').replace(/[^a-z0-9_]/g,'');
  if(!chan) return;
  if(!isRetry) wsAttempt=0;
  clearTimeout(reconnectTimer);
  wsGen++; var gen=wsGen;
  dbg('connect (gen',gen+') → #'+chan);
  if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  wsChan=chan;
  setPill('','connecting…');
  try{ ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443'); }
  catch(e){ setPill('err','failed'); return; }
  var sock=ws;
  sock.onopen=function(){
    if(gen!==wsGen) return;
    sock.send('PASS SCHMOOPIIE');
    sock.send('NICK justinfan'+Math.floor(Math.random()*80000+1000));
    sock.send('JOIN #'+chan);
    setPill('live','live · #'+chan);
    dbg('open + joined');
  };
  sock.onmessage=function(ev){
    if(gen!==wsGen) return;
    String(ev.data).split('\r\n').forEach(function(raw){
      if(!raw) return;
      if(raw.indexOf('PING')===0){ sock.send('PONG :tmi.twitch.tv'); return; }
      if(raw.indexOf(' 366 ')>=0){ wsAttempt=0; return; }
      var m=raw.match(/^:(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
      if(m) handleChat(m[1], m[2]);
    });
  };
  sock.onclose=function(ev){
    dbg('closed · code', ev&&ev.code);
    if(gen!==wsGen || wsChan!==chan) return;
    wsAttempt++;
    var delay=Math.min(30000, 3500*Math.pow(2,wsAttempt-1));
    setPill('err','reconnecting ×'+wsAttempt);
    reconnectTimer=setTimeout(function(){ if(gen===wsGen&&wsChan===chan) connectTwitch(chan,true); }, delay);
  };
  sock.onerror=function(){ dbg('error'); };
  try{ localStorage.setItem('laugh-track-chan', chan); }catch(e){}
}
$('connectBtn').addEventListener('click', function(){ arm(true); connectTwitch($('chanIn').value); });
$('chanIn').addEventListener('keydown', function(e){ if(e.key==='Enter') $('connectBtn').click(); });
try{ $('chanIn').value=localStorage.getItem('laugh-track-chan')||'sloppy_ai'; }catch(e){ $('chanIn').value='sloppy_ai'; }

/* ---------- arming (audio needs a gesture) ---------- */
function arm(silent){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();
      master.gain.value=($('vol').value/100)*0.9;
      var comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=5;
      master.connect(comp); comp.connect(AC.destination);
    }catch(e){ return; }
  }
  AC.resume();
  armed=true;
  $('armBtn').setAttribute('aria-pressed','true');
  $('armBtn').textContent='🔊 LAUGH TRACK ARMED';
  if(!silent){ LAUGHS.cackle(Math.random); $('laughType').textContent='armed. the audience clears its throat.'; }
  $('sr').textContent='Laugh track armed.';
}
$('armBtn').addEventListener('click', function(){
  if(armed){
    armed=false;
    this.setAttribute('aria-pressed','false');
    this.textContent='🔇 ARM THE LAUGH TRACK';
    $('sr').textContent='Laugh track muted.';
  } else arm();
});
$('vol').addEventListener('input', function(){ if(master) master.gain.value=(this.value/100)*0.9; });

/* ---------- local test paths ---------- */
$('sayBtn').addEventListener('click', function(){
  var t=$('sayIn').value.trim();
  if(!t) return;
  arm(true);
  handleChat('you', t);
  $('sayIn').value=''; $('sayIn').focus();
});
$('sayIn').addEventListener('keydown', function(e){ if(e.key==='Enter') $('sayBtn').click(); });
document.querySelectorAll('.testrow button').forEach(function(b){
  b.addEventListener('click', function(){
    arm(true);
    var type=fireLaugh(this.dataset.e, 50);
    $('sr').textContent='Test laugh: '+(type||'debounced');
  });
});

window.__LAUGH={ detectEmojis:detectEmojis, pickLaugh:pickLaugh, handleChat:handleChat,
  fireLaugh:fireLaugh, get stats(){ return stats; }, get armed(){ return armed; } };
