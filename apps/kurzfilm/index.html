<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurzfilm — make a short video in your browser</title>
<meta name="description" content="Type captions, pick a look and a beat, hit record — download a real video, made entirely in your browser.">
<link rel="icon" href="https://emojicdn.elk.sh/🎬">
<meta property="og:title" content="Kurzfilm — make a short video in your browser">
<meta property="og:description" content="Type captions, pick a look and a beat, hit record — download a real video, made entirely in your browser.">
<meta property="og:url" content="https://sloppy.live/kurzfilm/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/vertical%20phone%20video%20editor%20interface%20dark%20film%20studio%2C%20amber%20safelight%20glow%2C%20REC%20red%20dot%2C%20bold%20caption%20text%20on%20gradient%20background%2C%20minimal%20editorial%20design%2C%20flat%20illustration.png?width=1200&height=630&nologo=true&seed=2404&model=flux">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,800&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210; --panel:#1d1a17; --edge:#2e2924;
  --ink:#ece5da; --dim:#948a7c;
  --amber:#e8a63c; --red:#e14b3a; --green:#7fb069;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  font-family:'Bricolage Grotesque', sans-serif;
  background:
    radial-gradient(60rem 30rem at 85% -10%, rgba(232,166,60,.07), transparent 60%),
    radial-gradient(40rem 30rem at 0% 110%, rgba(225,75,58,.05), transparent 60%),
    var(--bg);
  color:var(--ink); min-height:100vh;
}
main{ max-width:64rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
header{ margin-bottom:1.2rem; }
h1{ font-weight:800; font-size:clamp(2rem,6vw,3rem); line-height:1; letter-spacing:-.02em; }
h1 .cut{ color:var(--amber); }
.tagline{ color:var(--dim); font-weight:300; font-size:.95rem; margin-top:.25rem; }

.layout{ display:grid; grid-template-columns:minmax(0,19rem) minmax(0,1fr); gap:1.5rem; align-items:start; }
@media (max-width:46rem){ .layout{ grid-template-columns:1fr; } .viewfinder{ margin:0 auto; } }

/* viewfinder */
.viewfinder{
  position:relative; width:100%; max-width:19rem;
  border:2px solid var(--edge); border-radius:.6rem; overflow:hidden;
  background:#000; box-shadow:0 1.2rem 3rem rgba(0,0,0,.5);
}
.viewfinder canvas{ display:block; width:100%; height:auto; }
.osd{
  position:absolute; inset:0; pointer-events:none;
  font-family:'VT323', monospace; font-size:1.15rem; color:#fff;
  text-shadow:0 0 4px rgba(0,0,0,.8);
}
.osd .tc{ position:absolute; top:.5rem; right:.7rem; }
.osd .rec{ position:absolute; top:.5rem; left:.7rem; display:none; align-items:center; gap:.35rem; color:#ff5b4a; }
.osd .rec .dot{ width:.6rem; height:.6rem; border-radius:50%; background:#ff5b4a; animation:blink 1s steps(2) infinite; }
.viewfinder.recording .rec{ display:flex; }
@keyframes blink{ 50%{ opacity:.15; } }

/* panels */
.panel{ background:var(--panel); border:1px solid var(--edge); border-radius:.6rem; padding:1rem; margin-bottom:1rem; }
.panel h2{ font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.14em; color:var(--amber); margin-bottom:.7rem; }
label{ display:block; font-weight:300; font-size:.8rem; color:var(--dim); margin:.6rem 0 .25rem; }
textarea{
  width:100%; min-height:6.5rem; resize:vertical;
  background:#12100e; color:var(--ink); border:1px solid var(--edge); border-radius:.4rem;
  font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:1rem; padding:.6rem .7rem;
}
textarea:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible{
  outline:3px solid var(--amber); outline-offset:2px;
}
select, input[type=range]{ width:100%; }
select{
  background:#12100e; color:var(--ink); border:1px solid var(--edge); border-radius:.4rem;
  font-family:inherit; font-size:.95rem; padding:.55rem .6rem; min-height:2.75rem;
}
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
.dur-val{ font-family:'VT323', monospace; color:var(--amber); font-size:1.2rem; }

.buttons{ display:flex; gap:.8rem; }
.buttons button{
  flex:1; min-height:3.2rem; border-radius:.5rem; cursor:pointer;
  font-family:'Bricolage Grotesque', sans-serif; font-weight:800; font-size:1.05rem;
  border:1px solid var(--edge); transition:transform .08s ease;
}
.buttons button:active{ transform:scale(.97); }
#btn-preview{ background:#26221d; color:var(--ink); }
#btn-record{ background:var(--red); color:#fff; border-color:transparent; }
#btn-record.armed{ background:#8c2c20; }
.buttons button:disabled{ opacity:.4; cursor:default; }

/* support check */
.checks{ list-style:none; font-size:.85rem; }
.checks li{ display:flex; justify-content:space-between; gap:.6rem; padding:.3rem 0; border-bottom:1px dashed var(--edge); font-weight:300; }
.checks li:last-child{ border-bottom:0; }
.checks .ok{ color:var(--green); font-weight:600; }
.checks .no{ color:var(--red); font-weight:600; }
.checks .val{ font-family:'VT323', monospace; font-size:1rem; color:var(--amber); text-align:right; overflow-wrap:anywhere; }
.verdict{ margin-top:.6rem; font-size:.9rem; font-weight:600; }
.verdict.good{ color:var(--green); } .verdict.bad{ color:var(--red); }

/* output */
#output{ text-align:center; }
#output video{ width:100%; max-width:14rem; border-radius:.5rem; border:1px solid var(--edge); margin:.5rem auto; display:block; }
#dl{
  display:inline-block; margin-top:.4rem; padding:.7rem 1.2rem; min-height:2.75rem;
  background:var(--amber); color:#141210; font-weight:800; text-decoration:none; border-radius:.5rem;
}
.status{ font-size:.85rem; color:var(--dim); margin-top:.6rem; min-height:1.2rem; }
.status.err{ color:var(--red); font-weight:600; }
.hide{ display:none !important; }
@media (prefers-reduced-motion: reduce){ .osd .rec .dot{ animation:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kurz<span class="cut">film</span></h1>
    <p class="tagline">type captions · pick a look and a beat · record a real video file — all in your browser, nothing uploaded</p>
  </header>

  <div class="layout">
    <div>
      <div class="viewfinder" id="viewfinder">
        <canvas id="cv" width="720" height="1280" role="img" aria-label="Video preview canvas showing your captions"></canvas>
        <div class="osd" aria-hidden="true">
          <span class="rec"><span class="dot"></span>REC</span>
          <span class="tc" id="tc">00:00:00</span>
        </div>
      </div>
      <section class="panel" id="output-panel" style="margin-top:1rem">
        <h2>Output</h2>
        <div id="output"><p class="status" id="out-status">record to get a downloadable video</p></div>
      </section>
    </div>

    <div>
      <section class="panel">
        <h2>Captions</h2>
        <textarea id="captions" aria-label="Captions, one per line">POV: your AI just
shipped a video editor
inside one HTML file
no uploads. no servers.
🎬 made on sloppy.live</textarea>
        <div class="row2">
          <div>
            <label for="dur">length — <span class="dur-val" id="dur-val">10s</span></label>
            <input type="range" id="dur" min="4" max="20" value="10" step="1">
          </div>
          <div>
            <label for="bg">look</label>
            <select id="bg">
              <option value="dusk">Dusk — drifting gradients</option>
              <option value="noir">Noir — grain &amp; light beam</option>
              <option value="horizon">Horizon — neon grid</option>
              <option value="paper">Paper — bauhaus shapes</option>
            </select>
          </div>
        </div>
        <label for="audio">soundtrack (synthesized live)</label>
        <select id="audio">
          <option value="beat">Lo-fi beat</option>
          <option value="arp">Arp bounce</option>
          <option value="drone">Warm drone</option>
          <option value="none">Silent</option>
        </select>
      </section>

      <section class="panel">
        <div class="buttons">
          <button type="button" id="btn-preview">▶ Preview</button>
          <button type="button" id="btn-record">● Record</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <h2>Can your browser do this?</h2>
        <ul class="checks" id="checks"></ul>
        <p class="verdict" id="verdict"></p>
      </section>
    </div>
  </div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=720, H=1280;

/* ── capability check — this IS the feasibility answer, per device ── */
const support={ capture:false, recorder:false, mime:'', audioMux:false };
(function(){
  const list=$('checks');
  function row(name, ok, val){
    const li=document.createElement('li');
    const l=document.createElement('span'); l.textContent=name;
    const r=document.createElement('span'); r.className=ok?'ok':'no';
    r.textContent=val!==undefined?'':(ok?'✓ yes':'✗ no');
    if(val!==undefined){ r.className='val'; r.textContent=val; }
    li.appendChild(l); li.appendChild(r); list.appendChild(li);
  }
  support.capture=typeof cv.captureStream==='function';
  support.recorder=typeof window.MediaRecorder==='function';
  const AC=window.AudioContext||window.webkitAudioContext;
  let audioDestOK=false;
  if(AC){ try{ audioDestOK=typeof AC.prototype.createMediaStreamDestination==='function'; }catch(e){} }
  support.audioMux=audioDestOK;
  if(support.recorder){
    const cands=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    support.mime=cands.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })||'';
  }
  row('canvas.captureStream()', support.capture);
  row('MediaRecorder', support.recorder);
  row('WebAudio → recordable track', support.audioMux);
  row('best format', !!support.mime, support.mime||'none');
  const v=$('verdict');
  if(support.capture&&support.recorder&&support.mime){
    v.textContent='✓ verdict: yes — this browser can render, caption, score and export video locally.'+(support.audioMux?'':' (video only, audio muxing unavailable)');
    v.className='verdict good';
  }else{
    v.textContent='✗ verdict: this browser can preview but not export. Try Chrome/Firefox, or Safari 14.1+.';
    v.className='verdict bad';
  }
})();

/* ── timeline state ── */
let playing=false, recording=false, t0=0, elapsed=0;
function getCaptions(){ return $('captions').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,20); }
function getDur(){ return parseInt($('dur').value,10); }
$('dur').addEventListener('input',()=>{ $('dur-val').textContent=getDur()+'s'; });

/* ── backgrounds ── */
const BG={
  dusk(t){
    const g=ctx.createLinearGradient(0,0,0,H);
    const h1=(t*12)%360, h2=(h1+70)%360;
    g.addColorStop(0,'hsl('+h1+',48%,16%)'); g.addColorStop(1,'hsl('+h2+',55%,8%)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(let i=0;i<3;i++){
      const x=W/2+Math.sin(t*.4+i*2.1)*260, y=H*.28+i*340+Math.cos(t*.3+i)*90;
      const r=ctx.createRadialGradient(x,y,0,x,y,340);
      r.addColorStop(0,'hsla('+((h1+i*40)%360)+',70%,55%,.22)'); r.addColorStop(1,'transparent');
      ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    }
  },
  noir(t){
    ctx.fillStyle='#0c0b0a'; ctx.fillRect(0,0,W,H);
    const bx=W/2+Math.sin(t*.5)*220;
    const g=ctx.createLinearGradient(bx-260,0,bx+260,H);
    g.addColorStop(0,'transparent'); g.addColorStop(.5,'rgba(236,229,218,.10)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(let i=0;i<130;i++){ ctx.fillRect(Math.random()*W,Math.random()*H,2,2); }
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.fillRect(0,0,W,60); ctx.fillRect(0,H-60,W,60);
  },
  horizon(t){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#12041f'); g.addColorStop(.55,'#3a0f3d'); g.addColorStop(.62,'#c2452e'); g.addColorStop(.68,'#12041f'); g.addColorStop(1,'#05010a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const hy=H*.62;
    ctx.strokeStyle='rgba(232,120,220,.5)'; ctx.lineWidth=2;
    for(let i=0;i<12;i++){
      const p=((t*.25+i/12)%1), y=hy+p*p*(H-hy);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    for(let i=-6;i<=6;i++){
      ctx.beginPath(); ctx.moveTo(W/2+i*40,hy); ctx.lineTo(W/2+i*220,H); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,190,90,.9)';
    ctx.beginPath(); ctx.arc(W/2,hy-140,90,0,Math.PI*2); ctx.fill();
  },
  paper(t){
    ctx.fillStyle='#f2ecdf'; ctx.fillRect(0,0,W,H);
    const cols=['#cf3722','#20509e','#e2ae19'];
    for(let i=0;i<5;i++){
      const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W, y=((t*.04+i*.23)%1.2-.1)*H;
      ctx.fillStyle=cols[i%3]+'33';
      if(i%3===0){ ctx.beginPath(); ctx.arc(x,y,120,0,Math.PI*2); ctx.fill(); }
      else if(i%3===1){ ctx.fillRect(x-90,y-90,180,180); }
      else{ ctx.beginPath(); ctx.moveTo(x,y-110); ctx.lineTo(x+110,y+90); ctx.lineTo(x-110,y+90); ctx.closePath(); ctx.fill(); }
    }
  }
};

/* ── caption drawing ── */
function wrap(text, maxW){
  const words=text.split(' '), lines=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test;
  }
  if(line) lines.push(line);
  return lines;
}
function drawCaption(t, dur){
  const caps=getCaptions();
  if(!caps.length) return;
  const per=dur/caps.length;
  const idx=Math.min(Math.floor(t/per), caps.length-1);
  const local=(t-idx*per)/per;                      // 0..1 within this caption
  const pop=Math.min(1, local*6);                   // fast pop-in
  const ease=1-Math.pow(1-pop,3);
  const dark=$('bg').value==='paper';
  ctx.save();
  ctx.translate(W/2, H*.5 + (1-ease)*40);
  ctx.scale(.9+ease*.1,.9+ease*.1);
  ctx.globalAlpha=ease;
  ctx.font='800 64px "Bricolage Grotesque", sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const lines=wrap(caps[idx], W-140);
  const lh=76, startY=-(lines.length-1)*lh/2;
  lines.forEach((ln,i)=>{
    ctx.fillStyle=dark?'rgba(25,22,16,.16)':'rgba(0,0,0,.45)';
    ctx.fillText(ln, 4, startY+i*lh+4);
    ctx.fillStyle=dark?'#191610':'#ffffff';
    ctx.fillText(ln, 0, startY+i*lh);
  });
  ctx.restore();
  // progress dots
  ctx.save();
  const dotY=H-80, gap=28, x0=W/2-(caps.length-1)*gap/2;
  caps.forEach((_,i)=>{
    ctx.beginPath(); ctx.arc(x0+i*gap, dotY, i===idx?9:5, 0, Math.PI*2);
    ctx.fillStyle=i===idx?(dark?'#cf3722':'#e8a63c'):(dark?'rgba(25,22,16,.35)':'rgba(255,255,255,.35)');
    ctx.fill();
  });
  ctx.restore();
}

/* ── render loop ── */
function timecode(s){
  const mm=String(Math.floor(s/60)).padStart(2,'0');
  const ss=String(Math.floor(s%60)).padStart(2,'0');
  const ff=String(Math.floor((s%1)*30)).padStart(2,'0');
  return mm+':'+ss+':'+ff;
}
function frame(now){
  const dur=getDur();
  if(playing||recording){
    elapsed=(now-t0)/1000;
    if(elapsed>=dur){
      if(recording){ stopRecording(); }
      else{ playing=false; stopAudio(); elapsed=0; }
    }
  }
  const t=Math.min(elapsed,dur);
  BG[$('bg').value](playing||recording?t:performance.now()/1000*.4);
  drawCaption(t, dur);
  $('tc').textContent=timecode(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── audio: synthesized loops routed to speakers AND a recordable stream ── */
let ac=null, audioDest=null, master=null, schedTimer=null, stopFns=[];
function ensureAudio(){
  if(ac) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  ac=new AC();
  master=ac.createGain(); master.gain.value=.6;
  master.connect(ac.destination);
  if(support.audioMux){ audioDest=ac.createMediaStreamDestination(); master.connect(audioDest); }
}
function tone(freq, t, len, type, vol, dest){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.2, t); g.gain.exponentialRampToValueAtTime(.001, t+len);
  o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+len+.05);
}
function noiseHit(t, len, freq, vol){
  const buf=ac.createBuffer(1, ac.sampleRate*len, ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ac.createBufferSource(); s.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.2;
  const g=ac.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function startAudio(kind){
  if(kind==='none') return;
  ensureAudio(); if(!ac) return;
  if(ac.state==='suspended') ac.resume();
  const t0a=ac.currentTime+.05;
  if(kind==='drone'){
    [110,164.8,220,277].forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=i%2?'triangle':'sine'; o.frequency.value=f;
      const lfo=ac.createOscillator(), lg=ac.createGain();
      lfo.frequency.value=.08+i*.03; lg.gain.value=1.5; lfo.connect(lg); lg.connect(o.detune);
      g.gain.setValueAtTime(0,t0a); g.gain.linearRampToValueAtTime(.09,t0a+1.2);
      o.connect(g); g.connect(master); o.start(t0a); lfo.start(t0a);
      stopFns.push(()=>{ try{ g.gain.linearRampToValueAtTime(0,ac.currentTime+.3); o.stop(ac.currentTime+.4); lfo.stop(ac.currentTime+.4);}catch(e){} });
    });
    return;
  }
  // scheduled patterns (beat / arp): lookahead scheduler
  let step=0, next=t0a;
  const bpm=kind==='beat'?84:132, spb=60/bpm/2;  // eighth notes
  const scale=[220,261.6,293.7,329.6,392,440,523.3];
  schedTimer=setInterval(()=>{
    if(!ac) return;
    while(next<ac.currentTime+.25){
      if(kind==='beat'){
        if(step%4===0) tone(55,next,.28,'sine',.55);                    // kick-ish
        if(step%8===4) noiseHit(next,.18,1800,.25);                     // snare-ish
        if(step%2===1) noiseHit(next,.05,7000,.08);                     // hat
        if(step%8===0) tone(110,next,.5,'triangle',.18);
        if(step%8===6) tone(87.3,next,.4,'triangle',.15);
      }else{ // arp
        tone(scale[[0,2,4,6,4,2][step%6]],next,.22,'square',.07);
        if(step%4===0) tone(scale[0]/2,next,.4,'triangle',.12);
      }
      next+=spb; step++;
    }
  },60);
  stopFns.push(()=>{ clearInterval(schedTimer); schedTimer=null; });
}
function stopAudio(){ stopFns.forEach(f=>f()); stopFns=[]; }

/* ── preview ── */
$('btn-preview').addEventListener('click',()=>{
  if(recording) return;
  stopAudio();
  playing=true; t0=performance.now(); elapsed=0;
  startAudio($('audio').value);
  setStatus('previewing '+getDur()+'s…');
});

/* ── record ── */
let rec=null, chunks=[];
function setStatus(msg, err){ const s=$('status'); s.textContent=msg; s.className='status'+(err?' err':''); }
$('btn-record').addEventListener('click',()=>{
  if(recording) { stopRecording(); return; }
  if(!support.capture||!support.recorder||!support.mime){ setStatus('this browser can’t export — see the check panel below', true); return; }
  try{
    ensureAudio();
    const stream=cv.captureStream(30);
    const useAudio=$('audio').value!=='none'&&audioDest;
    if(useAudio) audioDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
    rec=new MediaRecorder(stream,{ mimeType:support.mime, videoBitsPerSecond:5000000 });
    chunks=[];
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onerror=e=>{ setStatus('recorder error: '+(e.error&&e.error.name||'unknown'), true); cleanupRec(); };
    rec.onstop=finishRecording;
    recording=true; t0=performance.now(); elapsed=0;
    $('viewfinder').classList.add('recording');
    $('btn-record').textContent='■ Stop'; $('btn-record').classList.add('armed');
    $('btn-preview').disabled=true;
    startAudio($('audio').value);
    rec.start(250);
    setStatus('recording '+getDur()+'s @720×1280 · '+support.mime.split(';')[0]);
  }catch(err){
    setStatus('could not start recording: '+err.message, true);
    cleanupRec();
  }
});
function stopRecording(){ if(rec&&rec.state!=='inactive') rec.stop(); }
function cleanupRec(){
  recording=false; elapsed=0; stopAudio();
  $('viewfinder').classList.remove('recording');
  $('btn-record').textContent='● Record'; $('btn-record').classList.remove('armed');
  $('btn-preview').disabled=false;
}
function finishRecording(){
  cleanupRec();
  if(!chunks.length){ setStatus('recording produced no data — try again or another browser', true); return; }
  const type=support.mime.split(';')[0];
  const blob=new Blob(chunks,{type});
  const url=URL.createObjectURL(blob);
  const ext=type.includes('mp4')?'mp4':'webm';
  const out=$('output'); out.innerHTML='';
  const vid=document.createElement('video');
  vid.controls=true; vid.playsInline=true; vid.src=url;
  const a=document.createElement('a');
  a.id='dl'; a.href=url; a.download='kurzfilm-'+Date.now()+'.'+ext;
  a.textContent='⬇ download '+ext+' ('+(blob.size/1024/1024).toFixed(1)+' MB)';
  const note=document.createElement('p'); note.className='status';
  note.textContent='rendered locally — nothing left your device';
  out.appendChild(vid); out.appendChild(a); out.appendChild(note);
  setStatus('done ✓');
}
</script>
</body>
