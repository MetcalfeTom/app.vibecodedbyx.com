<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Lantern — find the door that sings back</title>
<meta name="description" content="A lantern hums a tiny melody. Five doors each sing their own. Choose the door that matches — wrong doors rearrange themselves — and one opens into a dream.">
<meta property="og:title" content="Dream Lantern — find the door that sings back">
<meta property="og:description" content="Listen to the lantern. Question the doors. Wrong ones wander. The right one opens somewhere impossible.">
<meta property="og:url" content="https://sloppy.live/dream-lantern/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/glowing%20paper%20lantern%20floating%20before%20five%20mysterious%20doors%20in%20indigo%20night%2C%20stars%2C%20dreamy%20soft%20illustration.png?width=1200&height=630&seed=5353&nologo=true">
<link rel="icon" href="https://emojicdn.elk.sh/🏮">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{ --night:#0d0b1e; --night2:#1a1638; --ink:#e8e2f4; --dim:#8f86ad; --gold:#ffd98a; --rose:#e8a0c8; --teal:#7adcd0; }
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:'Marcellus',serif; overflow-x:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 110%, #2b2450 0%, var(--night2) 45%, var(--night) 100%);
}
#stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
main{ position:relative; z-index:1; max-width:56rem; margin:0 auto; padding:1.4rem 1rem 3rem; text-align:center; }
h1{ font-size:clamp(1.7rem,5.5vw,2.6rem); font-weight:400; margin:.3rem 0 0; letter-spacing:.12em; }
.sub{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--dim); font-size:1rem; margin:.3rem 0 1rem; }

/* lantern */
#lantern{
  background:none; border:none; cursor:pointer; font-size:3.4rem; line-height:1; padding:.4rem;
  filter:drop-shadow(0 0 18px rgba(255,217,138,.65));
  animation:floaty 5s ease-in-out infinite; min-height:2.75rem;
}
#lantern:focus-visible{ outline:3px solid var(--gold); outline-offset:4px; border-radius:1rem; }
#lantern.flicker{ animation:flick .5s ease-in-out 2, floaty 5s ease-in-out infinite; }
@keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
@keyframes flick{ 0%,100%{ filter:drop-shadow(0 0 18px rgba(255,217,138,.65)); } 50%{ filter:drop-shadow(0 0 4px rgba(255,217,138,.2)); opacity:.6; } }
.lanternhint{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:.9rem; color:var(--gold); min-height:1.3rem; margin:.2rem 0 1.2rem; }

/* doors */
#doors{ display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; perspective:800px; }
.door{
  width:7.2rem; height:11rem; cursor:pointer; border:none; border-radius:3.4rem 3.4rem .4rem .4rem; position:relative;
  background:linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), inset 0 0 24px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.5);
  transition:transform .5s cubic-bezier(.3,1.4,.4,1), opacity .5s;
  font-family:'Marcellus',serif; color:rgba(255,255,255,.85);
}
.door:focus-visible{ outline:3px solid var(--teal); outline-offset:3px; }
.door .knob{ position:absolute; right:.9rem; top:52%; width:.55rem; height:.55rem; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }
.door .rune{ font-size:1.7rem; display:block; margin-top:2.4rem; opacity:.9; }
.door .dn{ font-size:.62rem; letter-spacing:.3em; display:block; margin-top:.7rem; color:rgba(255,255,255,.55); }
.door.singing{ transform:translateY(-10px) scale(1.04); box-shadow:inset 0 0 0 3px rgba(255,255,255,.3), 0 16px 30px rgba(0,0,0,.55), 0 0 30px rgba(122,220,208,.25); }
.door.wrong{ animation:doorshake .5s ease; }
@keyframes doorshake{ 0%,100%{ transform:translateX(0) rotate(0); } 25%{ transform:translateX(-7px) rotate(-1.5deg); } 75%{ transform:translateX(7px) rotate(1.5deg); } }
.door.opening{ transform:rotateY(-70deg) translateZ(30px); transform-origin:left center; opacity:0; }
#status{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.05rem; color:var(--dim); min-height:1.6rem; margin:1.1rem 0 .4rem; }
#attempts{ font-size:.68rem; letter-spacing:.25em; color:var(--dim); }

/* dream world */
#dream{ position:fixed; inset:0; z-index:10; display:none; overflow:hidden;
  background:linear-gradient(180deg,#2b1a4a 0%,#4a2a6a 30%,#8a4a8a 55%,#e88aa0 78%,#ffd98a 100%); }
#dream.on{ display:block; animation:dreamin 2.4s ease both; }
@keyframes dreamin{ from{ opacity:0; filter:blur(14px); } to{ opacity:1; filter:blur(0); } }
.isle{ position:absolute; border-radius:50% 50% 40% 40%; background:#1d1436;
  box-shadow:0 -4px 0 #3a2a5a inset; animation:floaty 7s ease-in-out infinite; }
.isle::after{ content:"🌸"; position:absolute; top:-1.1rem; left:50%; transform:translateX(-50%); font-size:1.2rem; }
#dream .msg{ position:absolute; left:0; right:0; top:14%; text-align:center; }
#dream h2{ font-family:'Marcellus',serif; font-weight:400; font-size:clamp(1.6rem,5vw,2.6rem); letter-spacing:.15em; margin:0;
  color:#fff6e8; text-shadow:0 0 24px rgba(255,217,138,.6); }
#dream p{ font-family:'Cormorant Garamond',serif; font-style:italic; color:#ffe8f0; font-size:1.1rem; }
#dream button{ font-family:'Marcellus',serif; font-size:.85rem; letter-spacing:.15em; cursor:pointer; min-height:2.75rem;
  background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:2rem; padding:.6rem 1.6rem; margin-top:.8rem; }
#dream button:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
footer{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--dim); font-size:.85rem; margin-top:1.6rem; line-height:1.8; }
@media (max-width:560px){ .door{ width:5.6rem; height:9rem; } .door .rune{ margin-top:1.8rem; } }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition-duration:.01s !important; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <h1>DREAM LANTERN</h1>
  <p class="sub">the lantern hums a melody only one door knows</p>
  <button type="button" id="lantern" aria-label="Play the lantern's melody">🏮</button>
  <p class="lanternhint" id="lanternhint">click the lantern to hear its song</p>
  <div id="doors" role="group" aria-label="Five singing doors"></div>
  <p id="status" aria-live="polite">choose the door whose song matches the lantern's</p>
  <p id="attempts"></p>
  <footer>wrong doors don't punish — they wander, and the search rearranges itself<br>found somewhere impossible? vote on sloppy.live</footer>
</main>

<div id="dream" role="dialog" aria-modal="true" aria-hidden="true" aria-label="The dream world">
  <div class="msg">
    <h2>THE DREAM OPENS</h2>
    <p id="dreamline"></p>
    <button type="button" id="btn-deeper">dream deeper — the doors learn your ear</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };

/* ── starfield ── */
(function(){
  var cv=$('stars'), cx=cv.getContext('2d');
  function size(){ cv.width=innerWidth; cv.height=innerHeight; }
  size(); addEventListener('resize', size);
  var stars=[]; for(var i=0;i<110;i++) stars.push([Math.random(),Math.random(),Math.random()*1.4+0.4,Math.random()*6]);
  (function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    var t=performance.now()/1000;
    stars.forEach(function(s){
      cx.globalAlpha=0.35+0.4*Math.abs(Math.sin(t*0.6+s[3]));
      cx.fillStyle='#fff';
      cx.fillRect(s[0]*cv.width, s[1]*cv.height, s[2], s[2]);
    });
    cx.globalAlpha=1;
    requestAnimationFrame(tick);
  })();
})();

/* ── audio: music-box notes ── */
var AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
var PENT=[0,2,4,7,9,12,14];
function noteF(deg){ return 440*Math.pow(2,(PENT[deg]-9)/12)*1.5; }
function bell(f,t,vol){
  var A=ac();
  [[1,1],[2.76,0.28],[5.4,0.09]].forEach(function(h){
    var o=A.createOscillator(), g=A.createGain();
    o.type='sine'; o.frequency.value=f*h[0];
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime((vol||0.12)*h[1],t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
    o.connect(g); g.connect(A.destination); o.start(t); o.stop(t+1.4);
  });
}
function playMelody(mel, done){
  var A=ac(), t=A.currentTime+0.06;
  mel.forEach(function(deg,i){ bell(noteF(deg), t+i*0.34); });
  if(done) setTimeout(done, mel.length*340+250);
}

/* ── round state ── */
var DOOR_HUES=[[ '#4a3a7a','#2a1f4a'],['#7a3a5a','#4a1f38'],['#2a5a5a','#173a3a'],['#7a5a2a','#4a3517'],['#3a4a7a','#1f2a4a']];
var RUNES=['✦','☾','❀','♒','✧'];
var G={ round:1, target:null, doors:[], correct:-1, attempts:0, locked:false, unlocked:false };

function randMelody(){
  var m=[Math.floor(Math.random()*4)];
  for(var i=1;i<5;i++){
    var step=[-2,-1,1,1,2][Math.floor(Math.random()*5)];
    m.push(Math.max(0,Math.min(6,m[i-1]+step)));
  }
  return m;
}
function perturb(mel, changes){
  var m=mel.slice(), idxs=[];
  while(idxs.length<changes){
    var i=1+Math.floor(Math.random()*(m.length-1));
    if(idxs.indexOf(i)<0) idxs.push(i);
  }
  idxs.forEach(function(i){
    var d;
    do{ d=Math.max(0,Math.min(6,m[i]+(Math.random()<0.5?-2:2))); }while(d===mel[i]);
    m[i]=d;
  });
  return m;
}
function sameMel(a,b){ return a.join(',')===b.join(','); }

function newRound(){
  G.target=randMelody();
  G.correct=Math.floor(Math.random()*5);
  G.attempts=0; G.locked=false; G.unlocked=false;
  var changes=Math.max(1, 3-Math.floor((G.round-1)/2));   /* decoys get closer as rounds deepen */
  G.doors=[];
  for(var i=0;i<5;i++){
    if(i===G.correct) G.doors.push(G.target.slice());
    else{
      var d;
      do{ d=perturb(G.target, changes); }while(sameMel(d,G.target));
      G.doors.push(d);
    }
  }
  paintDoors();
  $('status').textContent= G.round===1? 'choose the door whose song matches the lantern’s'
    : 'round '+G.round+' — the wrong doors sing more convincingly now';
  $('attempts').textContent='';
}
function paintDoors(){
  var host=$('doors'); host.innerHTML='';
  G.doors.forEach(function(mel,i){
    var b=document.createElement('button');
    b.type='button'; b.className='door';
    b.style.setProperty('--c1', DOOR_HUES[i%5][0]);
    b.style.setProperty('--c2', DOOR_HUES[i%5][1]);
    b.setAttribute('aria-label','Door '+(i+1)+' — listen to its song');
    b.dataset.i=i;
    b.innerHTML='<span class="rune" aria-hidden="true">'+RUNES[i%5]+'</span><span class="dn">DOOR '+(i+1)+'</span><span class="knob" aria-hidden="true"></span>';
    b.addEventListener('click', function(){ chooseDoor(i, b); });
    host.appendChild(b);
  });
}
function shuffleDoors(){
  /* wrong choice: the doors wander — melodies re-seat behind new positions */
  var order=[0,1,2,3,4];
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=order[i]; order[i]=order[j]; order[j]=t; }
  var newDoors=order.map(function(o){ return G.doors[o]; });
  G.correct=order.indexOf(G.correct);
  G.doors=newDoors;
  paintDoors();
}
function chooseDoor(i, el){
  if(G.locked||G.unlocked) return;
  G.locked=true;
  el.classList.add('singing');
  $('status').textContent='door '+(i+1)+' sings…';
  playMelody(G.doors[i], function(){
    el.classList.remove('singing');
    if(i===G.correct){ unlock(el); }
    else{
      G.attempts++;
      el.classList.add('wrong');
      $('lantern').classList.add('flicker');
      $('status').textContent=['not this one — the doors are moving…','a beautiful lie — they rearrange…','close, but the hall reshuffles…'][G.attempts%3];
      $('attempts').textContent='WANDERINGS · '+G.attempts;
      setTimeout(function(){
        $('lantern').classList.remove('flicker');
        shuffleDoors();
        G.locked=false;
      }, 700);
    }
  });
}
function unlock(el){
  G.unlocked=true;
  el.classList.add('opening');
  $('status').textContent='the door remembers the song…';
  var A=ac(), t=A.currentTime+0.1;
  [0,2,4,6].forEach(function(d,k){ bell(noteF(d)*2, t+k*0.16, 0.09); });
  setTimeout(function(){
    var dr=$('dream');
    dr.classList.add('on'); dr.setAttribute('aria-hidden','false');
    $('dreamline').textContent= G.attempts===0
      ? 'first try — round '+G.round+' · the lantern is showing off on your behalf.'
      : 'round '+G.round+' unlocked after '+G.attempts+' wandering'+(G.attempts===1?'':'s')+' — the dream kept the door warm.';
    buildIsles();
    $('btn-deeper').focus();
  }, 900);
}
function buildIsles(){
  [].forEach.call(document.querySelectorAll('.isle'), function(n){ n.remove(); });
  for(var i=0;i<6;i++){
    var d=document.createElement('div');
    d.className='isle';
    var w=3+Math.random()*7;
    d.style.width=w+'rem'; d.style.height=(w*0.45)+'rem';
    d.style.left=(5+Math.random()*85)+'%'; d.style.top=(38+Math.random()*48)+'%';
    d.style.animationDelay=(Math.random()*4)+'s';
    d.style.animationDuration=(6+Math.random()*5)+'s';
    $('dream').appendChild(d);
  }
}
$('btn-deeper').addEventListener('click', function(){
  var dr=$('dream');
  dr.classList.remove('on'); dr.setAttribute('aria-hidden','true');
  G.round++;
  newRound();
  $('lanternhint').textContent='the lantern hums a new song — listen again';
});
$('lantern').addEventListener('click', function(){
  if(!G.target) return;
  $('lanternhint').textContent='the lantern sings…';
  playMelody(G.target, function(){ $('lanternhint').textContent='find the door that sang this'; });
});

newRound();
window.__DL={ get G(){ return G; }, chooseDoor:chooseDoor, newRound:newRound,
  perturb:perturb, randMelody:randMelody, sameMel:sameMel, shuffleDoors:shuffleDoors };
})();
</script>
</body>
</html>
