<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seedloom — weave generative art from layered code</title>
  <meta name="description" content="An endless wall of generative art: flow fields, stained glass, tartans, topography and more. Tap any piece, drag to morph it, stack layers and save it as a print-sized PNG.">
  <link rel="canonical" href="https://app.sloppy.live/seedloom/">
  <link rel="icon" href="https://emojicdn.elk.sh/🧶">
  <meta property="og:title" content="Seedloom — weave generative art from layered code">
  <meta property="og:description" content="An endless wall of generative art. Tap any piece, drag to morph it, make it yours.">
  <meta property="og:url" content="https://app.sloppy.live/seedloom/">
  <meta property="og:image" content="https://app.sloppy.live/seedloom/og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#121015">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@200;400;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Seedloom", "description": "Stack flow fields, circle packing, stained glass, topography and more into one generative artwork. Slide, reseed, blend and save it as a PNG.", "url": "https://app.sloppy.live/seedloom/", "image": "https://app.sloppy.live/seedloom/og.png", "applicationCategory": "DesignApplication", "operatingSystem": "Web browser", "isAccessibleForFree": true, "inLanguage": "en"}</script>
  <style>
    :root {
      --ink: #121015;
      --wall: #17141b;
      --rack: #1c1820;
      --card: #231e28;
      --line: #3a3240;
      --paper: #efe9e1;
      --muted: #a89fa8;
      --accent: #ff6a3d;
      --accent-ink: #1a0d08;
      --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      --name: 'Syne', 'Avenir Next', 'Futura', sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { font-size: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 700px at 30% 40%, rgba(255, 106, 61, 0.06), transparent 60%),
        radial-gradient(900px 600px at 80% 90%, rgba(120, 90, 200, 0.07), transparent 60%),
        var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 400;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    button, select, input { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 1fr 360px; min-height: 100dvh; }

    /* The stage: the artwork hung on a dark wall */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 56px);
      min-height: 60dvh;
    }
    .frame {
      position: relative;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      background: #000;
      line-height: 0;
      animation: hang 0.9s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes hang { from { opacity: 0; transform: translateY(18px) scale(0.985); } }
    #art { display: block; max-width: 100%; max-height: calc(100dvh - 170px); width: auto; height: auto; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    #art.dragging { cursor: grabbing; }
    .hud, .hint {
      position: absolute; left: 50%; transform: translateX(-50%); line-height: 1.2; white-space: nowrap; pointer-events: none;
      padding: 8px 14px; border-radius: 99px; background: rgba(18, 16, 21, 0.78); color: var(--paper);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 0.66rem; letter-spacing: 0.04em;
    }
    .hud { top: 14px; opacity: 0; transition: opacity .25s; }
    .hud.on { opacity: 1; }
    .hint { bottom: 16px; font-family: var(--serif); font-style: italic; font-size: 1rem; letter-spacing: 0; animation: hintin .8s 1.2s both; transition: opacity .5s; }
    .hint.gone { opacity: 0; animation: none; }
    @keyframes hintin { from { opacity: 0; transform: translate(-50%, 8px); } }
    .ghost { position: fixed; z-index: 30; transform-origin: 0 0; pointer-events: none; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
    .stage-foot { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 6px 24px; width: 100%; margin-top: 18px; }
    .stage-foot .label-card { margin-top: 0; }
    .aspects { gap: 2px 12px; }
    .aspects .chip { font-size: 0.66rem; }
    .busy {
      position: absolute; right: 10px; bottom: 10px;
      font-size: 0.65rem; letter-spacing: 0.1em; line-height: 1;
      padding: 6px 8px; border-radius: 99px;
      background: rgba(18, 16, 21, 0.75); color: var(--paper);
      opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .busy.on { opacity: 1; }

    /* The rack: every tool lives here */
    .rack {
      background: var(--rack);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      max-height: 100dvh;
      position: sticky;
      top: 0;
    }
    .rack-head { padding: 22px 20px 10px; }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 2.6rem;
      line-height: 0.9;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); font-style: normal; }

    .scroll { overflow-y: auto; padding: 0 22px 24px; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

    /* section titles: quiet serif, like a catalogue */
    h2 {
      font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.15rem;
      color: var(--muted); margin: 22px 0 10px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    h2 small { font-family: var(--mono); font-style: normal; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.04em; }

    /* palettes: little paint cards, the ground on top and its five inks below */
    .palettes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .pal {
      position: relative; aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 5px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--line); transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .2s;
    }
    .pal:hover { transform: translateY(-2px); }
    .pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--rack), 0 0 0 3.5px var(--paper); }

    /* chips and option words: text first, no boxes */
    .row { display: flex; gap: 2px 14px; flex-wrap: wrap; }
    .chip, .opt {
      min-height: 2.75rem; padding: 0 2px; background: none; border: 0; cursor: pointer; color: var(--muted);
      border-bottom: 1px solid transparent; font-weight: 200;
    }
    .opt { min-height: 2.25rem; font-size: 0.68rem; }
    .chip:hover, .opt:hover { color: var(--paper); }
    .chip[aria-pressed="true"], .opt[aria-pressed="true"] { color: var(--paper); border-bottom-color: var(--accent); font-weight: 400; }

    /* layers: hairlines between them, nothing boxed */
    .layers { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .layer { border-bottom: 1px solid var(--line); animation: fadein .35s ease both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
    .layer.hidden-layer .layer-name { opacity: 0.4; }
    .layer-head { display: flex; align-items: center; gap: 0; }
    .layer-name {
      flex: 1; text-align: left; background: none; border: 0; cursor: pointer; display: flex; align-items: center; gap: 10px;
      font-family: var(--name); font-weight: 700; font-size: 1.05rem; min-height: 3rem; padding: 0;
    }
    .layer-name small { font-family: var(--mono); font-style: normal; font-size: 0.58rem; color: var(--muted); font-weight: 200; }
    .icon {
      width: 2.75rem; height: 2.75rem; border: 0; background: none; cursor: pointer; border-radius: 50%;
      color: var(--muted); font-size: 1rem; display: grid; place-items: center; transition: color .2s, transform .3s;
    }
    .icon:hover { color: var(--paper); }
    .icon[data-a="dice"]:active { transform: rotate(90deg); }
    .icon:disabled { opacity: 0.2; cursor: default; }
    .layer-body { padding: 0 0 16px; display: grid; gap: 4px; }
    .layer:not(.open) .layer-body { display: none; }
    .layer-tools { display: flex; justify-content: flex-end; margin-top: 4px; }
    .layer-name > span { display: flex; align-items: baseline; gap: 10px; }
    .thumb { width: 2.4rem; height: 2.4rem; flex: none; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); transition: transform .3s; }
    .layer.open .thumb { transform: scale(1.08); box-shadow: 0 0 0 1px var(--paper); }
    .layer.hidden-layer .thumb { opacity: 0.35; }
    .axis { font-style: normal; color: var(--accent); margin-left: 6px; }
    .ctl.mix { grid-template-columns: 5.6rem 5.8rem 1fr 2.6rem; }
    .ctl.mix select { grid-column: auto; min-width: 0; }
    details.more > summary {
      list-style: none; cursor: pointer; min-height: 2.75rem; display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1rem; width: max-content;
    }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary::after { content: '+'; font-family: var(--mono); font-style: normal; font-size: 0.8rem; }
    details.more[open] > summary::after { content: '−'; }
    details.more > summary:hover { color: var(--paper); }
    details.more > div { display: grid; gap: 4px; }
    .layer-tools .icon { width: 2.5rem; font-size: 0.9rem; }

    .ctl { display: grid; grid-template-columns: 5.6rem 1fr 2.6rem; align-items: center; gap: 10px; min-height: 2.25rem; }
    .ctl.opts { grid-template-columns: 5.6rem 1fr; align-items: start; }
    .ctl label, .ctl .lbl { color: var(--muted); font-weight: 200; font-size: 0.68rem; }
    .ctl.opts .lbl { padding-top: 0.7rem; }
    .ctl output { text-align: right; font-size: 0.62rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ctl .row { gap: 0 12px; }
    .ctl select {
      grid-column: 2 / 4; min-height: 2.25rem; background: transparent; border: 0; border-bottom: 1px solid var(--line);
      border-radius: 0; padding: 0; color: var(--paper); font-weight: 200; cursor: pointer;
    }
    .ctl select option { background: var(--rack); }

    /* hairline sliders with a small paper bead */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2.25rem; margin: 0; background: none; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(90deg, var(--paper) var(--fill, 50%), var(--line) var(--fill, 50%)); }
    input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
    input[type=range]::-moz-range-progress { height: 1px; background: var(--paper); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; background: var(--paper); border: 0; transition: transform .15s; }
    input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 0; }
    input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { transform: scale(1.35); background: var(--accent); }
    input[type=range]:focus-visible { outline: none; }
    input[type=range]:focus-visible::-webkit-slider-runnable-track { box-shadow: 0 0 0 2px var(--accent); }

    .add-btn {
      width: 100%; min-height: 3rem; margin-top: 6px; cursor: pointer; background: none; border: 0; text-align: left; padding: 0;
      color: var(--paper); font-family: var(--serif); font-size: 1.3rem; font-style: italic;
    }
    .add-btn:hover { color: var(--accent); }
    .gen-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 4px; }
    .gen-tile {
      position: relative; background: #000; border: 0; padding: 0; cursor: pointer; aspect-ratio: 1; overflow: hidden; line-height: 0;
    }
    .gen-tile canvas { width: 100%; height: 100%; display: block; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
    .gen-tile span {
      position: absolute; left: 6px; right: 6px; bottom: 6px; line-height: 1.1; text-align: left;
      font-family: var(--name); font-weight: 700; font-size: 0.56rem; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
    }
    .gen-tile:hover canvas, .gen-tile:focus-visible canvas { transform: scale(1.08); }
    .gen-tile:focus-visible { outline-offset: -3px; }

    .actions {
      display: flex; align-items: center; gap: 18px;
      padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line); background: var(--rack);
    }
    .act {
      min-height: 2.75rem; cursor: pointer; border: 0; background: none; padding: 0 2px;
      font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--paper);
    }
    .act:hover { color: var(--accent); }
    .act.primary {
      margin-right: auto; padding: 0 22px; border-radius: 99px; background: var(--accent); color: var(--accent-ink);
      font-size: 1.25rem; transition: transform .15s;
    }
    .act.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
    .act:active { transform: scale(0.96); }

    /* museum label under the artwork */
    .label-card { margin-top: 18px; text-align: left; line-height: 1.35; max-width: 100%; }
    .label-card b { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.5rem; color: var(--paper); }
    .label-card span { font-size: 0.62rem; color: var(--muted); font-weight: 200; letter-spacing: 0.03em; }
    .stage { flex-direction: column; }
    .frame-wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
    .back-btn {
      float: right; min-height: 2.75rem; padding: 0 2px; cursor: pointer; border: 0; background: none; color: var(--muted);
      font-family: var(--serif); font-style: italic; font-size: 1.1rem;
    }
    .back-btn:hover { color: var(--accent); }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 99px;
      font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px);
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    #buildstamp { display: block; padding: 0 20px 10px; font-size: 0.6rem; color: #8a818a; font-weight: 200; }


    /* Landing: an endless wall of pieces, edge to edge, nothing but the art */
    .gallery { min-height: 100vh; min-height: 100dvh; background: #000; }
    .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46vw, 250px), 1fr)); }
    .g-tile {
      position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 0; background: #000; cursor: pointer; overflow: hidden;
    }
    .g-tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: transform 1.2s cubic-bezier(.2, .8, .2, 1), filter .5s, opacity .9s ease; }
    .g-tile.in canvas { opacity: 1; }
    .wall-end { height: 1px; }
    @supports not (aspect-ratio: 1) { .g-tile { height: 0; padding-bottom: 100%; } }
    @media (hover: hover) {
      .g-grid:hover .g-tile canvas { filter: brightness(0.6) saturate(0.8); }
      .g-grid .g-tile:hover canvas { transform: scale(1.06); filter: none; }
    }
    .g-grid .g-tile:focus-visible canvas { transform: scale(1.06); filter: none; }
    .g-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
    .g-label {
      position: absolute; left: 18px; bottom: 16px; font-family: var(--name); font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: #fff;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.7); opacity: 0; transform: translateY(8px); transition: .4s;
    }
    .g-tile:hover .g-label, .g-tile:focus-visible .g-label { opacity: 1; transform: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      /* the art stays pinned on top while the tools scroll underneath */
      .stage { min-height: auto; padding: 10px 16px 6px; position: sticky; top: 0; z-index: 4; background: var(--ink); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); }
      #art { max-height: 44dvh; }
      .frame-wrap { align-items: center; }
      .stage-foot { margin-top: 6px; align-items: center; }
      .label-card b { font-size: 1.15rem; }
      .label-card span { display: none; }
      .hint { font-size: 0.85rem; }
      .rack { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); }
      .rack-head { padding-top: 14px; }
      h1 { font-size: 2.6rem; }
      .scroll { overflow: visible; }
      .actions { position: sticky; bottom: 0; z-index: 5; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <section class="gallery" id="gallery" aria-labelledby="gTitle">
    <h1 class="sr-only" id="gTitle">Seedloom: pick any piece to start weaving</h1>
    <div class="g-grid" id="gGrid" role="list" aria-label="Pieces: the ten looms first, then endless remixes"></div>
    <div class="wall-end" id="wallEnd" aria-hidden="true"></div>
  </section>

  <main class="app" id="app" hidden>
    <section class="stage" aria-label="Artwork">
      <div class="frame-wrap">
        <div class="frame">
          <canvas id="art" role="img" aria-label="Generated artwork" title="Drag to morph the open layer, tap to reroll it"></canvas>
          <div class="busy" id="busy" aria-hidden="true">weaving…</div>
          <div class="hud" id="hud" aria-live="polite"></div>
          <div class="hint gone" id="hint" aria-hidden="true">drag on the art to morph · tap to reroll</div>
        </div>
        <div class="stage-foot">
          <p class="label-card" id="labelCard" aria-live="polite"><b id="artTitle">Untitled</b><span id="artMedium"></span></p>
          <div class="row aspects" id="aspects" role="group" aria-label="Canvas shape"></div>
        </div>
      </div>
    </section>

    <aside class="rack" aria-label="Tools">
      <header class="rack-head">
        <button type="button" class="back-btn" id="backBtn">← the wall</button>
        <h1>Seed<span>loom</span></h1>
      </header>
      <div class="scroll">
        <h2 id="palH">Palette</h2>
        <div class="palettes" id="palettes" role="group" aria-labelledby="palH"></div>

        <h2><span id="layH">Layers</span><small>top is drawn last</small></h2>
        <ul class="layers" id="layers" aria-labelledby="layH"></ul>
        <button type="button" class="add-btn" id="addBtn" aria-expanded="false" aria-controls="genMenu">+ add a layer</button>
        <div class="gen-menu" id="genMenu" hidden></div>
      </div>
      <div class="actions">
        <button type="button" class="act primary" id="remixBtn">✦ remix</button>
        <button type="button" class="act" id="undoBtn" hidden aria-label="Undo" title="Undo (Ctrl+Z)">↶</button>
        <button type="button" class="act" id="redoBtn" hidden aria-label="Redo" title="Redo (Ctrl+Shift+Z)">↷</button>
        <button type="button" class="act" id="saveBtn">save</button>
        <button type="button" class="act" id="shareBtn">share</button>
      </div>
      <span id="buildstamp" role="note" aria-label="Build information">build v1.3 · 2026-09-27</span>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="gens.js?v=1.3"></script>
  <script src="gens-textile.js?v=1.3"></script>
  <script src="app.js?v=1.3"></script>
</body>
</html>
