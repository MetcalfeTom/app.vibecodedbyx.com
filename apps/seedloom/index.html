<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seedloom — weave generative art from layered code</title>
  <meta name="description" content="Stack flow fields, circle packing, stained glass, topography and more into one artwork. Slide, reseed, blend and save it as a print-sized PNG.">
  <link rel="canonical" href="https://app.sloppy.live/seedloom/">
  <link rel="icon" href="https://emojicdn.elk.sh/🧶">
  <meta property="og:title" content="Seedloom — weave generative art from layered code">
  <meta property="og:description" content="Stack flow fields, circle packing, stained glass and topography into one artwork. Slide, reseed, blend, save.">
  <meta property="og:url" content="https://app.sloppy.live/seedloom/">
  <meta property="og:image" content="https://app.sloppy.live/seedloom/og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#121015">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@200;400;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Seedloom", "description": "Stack flow fields, circle packing, stained glass, topography and more into one generative artwork. Slide, reseed, blend and save it as a PNG.", "url": "https://app.sloppy.live/seedloom/", "image": "https://app.sloppy.live/seedloom/og.png", "applicationCategory": "DesignApplication", "operatingSystem": "Web browser", "isAccessibleForFree": true, "inLanguage": "en"}</script>
  <style>
    :root {
      --ink: #121015;
      --wall: #17141b;
      --rack: #1c1820;
      --card: #231e28;
      --line: #3a3240;
      --paper: #efe9e1;
      --muted: #a89fa8;
      --accent: #ff6a3d;
      --accent-ink: #1a0d08;
      --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { font-size: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 700px at 30% 40%, rgba(255, 106, 61, 0.06), transparent 60%),
        radial-gradient(900px 600px at 80% 90%, rgba(120, 90, 200, 0.07), transparent 60%),
        var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 400;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    button, select, input { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 1fr 360px; min-height: 100dvh; }

    /* The stage: the artwork hung on a dark wall */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 56px);
      min-height: 60dvh;
    }
    .frame {
      position: relative;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      background: #000;
      line-height: 0;
      animation: hang 0.9s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes hang { from { opacity: 0; transform: translateY(18px) scale(0.985); } }
    #art { display: block; max-width: 100%; max-height: calc(100dvh - 96px); width: auto; height: auto; }
    .busy {
      position: absolute; right: 10px; bottom: 10px;
      font-size: 0.65rem; letter-spacing: 0.1em; line-height: 1;
      padding: 6px 8px; border-radius: 99px;
      background: rgba(18, 16, 21, 0.75); color: var(--paper);
      opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .busy.on { opacity: 1; }

    /* The rack: every tool lives here */
    .rack {
      background: var(--rack);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      max-height: 100dvh;
      position: sticky;
      top: 0;
    }
    .rack-head { padding: 22px 20px 10px; }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 3.4rem;
      line-height: 0.9;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); font-style: normal; }
    .tag { margin: 8px 0 0; color: var(--muted); font-weight: 200; line-height: 1.5; }

    .scroll { overflow-y: auto; padding: 6px 20px 20px; flex: 1; }
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    h2 {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 8px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .palettes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pal {
      height: 2.75rem; border-radius: 8px; border: 2px solid transparent;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; align-content: center; overflow: hidden; cursor: pointer; padding: 0 6px;
      background: none;
    }
    .pal i { display: block; height: 1.35rem; border-radius: 3px; }
    .pal[aria-pressed="true"] { border-color: var(--paper); }
    .pal:hover { transform: translateY(-1px); }

    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      min-height: 2.75rem; padding: 0 12px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--line); cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    .chip:hover { border-color: var(--muted); }

    .layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .layer {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      animation: rise .35s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .layer.hidden-layer .layer-name { opacity: 0.45; text-decoration: line-through; }
    .layer-head { display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px; }
    .layer-name {
      flex: 1; text-align: left; background: none; border: 0; cursor: pointer;
      font-family: var(--serif); font-size: 1.35rem; font-style: italic; min-height: 2.75rem; padding: 0;
    }
    .icon {
      width: 2.5rem; height: 2.75rem; border: 0; background: none; cursor: pointer; border-radius: 8px;
      color: var(--muted); font-size: 0.95rem; display: grid; place-items: center;
    }
    .icon:hover { background: rgba(255, 255, 255, 0.06); color: var(--paper); }
    .icon:disabled { opacity: 0.25; cursor: default; }
    .layer-body { padding: 4px 12px 12px; display: grid; gap: 10px; }
    .layer:not(.open) .layer-body { display: none; }

    .ctl { display: grid; grid-template-columns: 6.2rem 1fr 2.6rem; align-items: center; gap: 8px; }
    .ctl label { color: var(--muted); font-weight: 200; }
    .ctl output { text-align: right; font-size: 0.65rem; color: var(--muted); }
    .ctl select {
      grid-column: 2 / 4; min-height: 2.25rem; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px;
    }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 1.6rem; margin: 0; cursor: pointer; }

    .add-btn {
      width: 100%; min-height: 3rem; margin-top: 8px; border-radius: 12px; cursor: pointer;
      background: none; border: 1px dashed var(--muted); color: var(--paper);
      font-family: var(--serif); font-size: 1.3rem; font-style: italic;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); }
    .gen-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .gen-menu[hidden] { display: none; }
    .gen-tile {
      background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; align-items: stretch; text-align: left;
    }
    .gen-tile canvas { width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; background: #000; }
    .gen-tile span { font-size: 0.6rem; line-height: 1.3; }
    .gen-tile:hover { border-color: var(--accent); }

    .actions {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line); background: var(--rack);
    }
    .act {
      min-height: 3rem; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card);
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.62rem;
    }
    .act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .act:hover { filter: brightness(1.1); }
    .act:active { transform: scale(0.97); }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 99px;
      font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px);
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    #buildstamp { display: block; padding: 0 20px 10px; font-size: 0.6rem; color: #8a818a; font-weight: 200; }


    /* Landing: the wall of looms, nothing but the art */
    .gallery { min-height: 100dvh; display: flex; flex-direction: column; }
    .g-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .g-tile {
      position: relative; padding: 0; border: 0; border-radius: 0; background: #000; aspect-ratio: 1; cursor: pointer; overflow: hidden;
      opacity: 0; animation: rise .8s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 70ms);
    }
    .g-tile canvas { width: 100%; height: 100%; display: block; transition: transform .8s cubic-bezier(.2, .8, .2, 1), filter .4s; }
    .g-grid:hover .g-tile canvas { filter: brightness(0.72) saturate(0.85); }
    .g-grid .g-tile:hover canvas, .g-grid .g-tile:focus-visible canvas { transform: scale(1.05); filter: none; }
    .g-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .g-label {
      position: absolute; left: 14px; bottom: 10px; font-family: var(--serif); font-style: italic; font-size: 1.7rem; color: #fff;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.8); opacity: 0; transform: translateY(8px); transition: .35s;
    }
    .g-tile:hover .g-label, .g-tile:focus-visible .g-label { opacity: 1; transform: none; }
    .g-foot {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 22px; padding: 18px clamp(16px, 3vw, 28px) 24px;
      opacity: 0; animation: rise .8s .9s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    .g-foot h1 { font-size: 2.2rem; }
    .g-foot p { margin: 0; color: var(--muted); font-weight: 200; flex: 1 1 16rem; }
    .g-link {
      background: none; border: 0; padding: 0 2px; min-height: 2.75rem; cursor: pointer; color: var(--paper);
      font-family: var(--serif); font-style: italic; font-size: 1.35rem; border-bottom: 1px solid transparent;
    }
    .g-link:hover { color: var(--accent); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .back-btn {
      float: right; min-height: 2.75rem; padding: 0 14px; border-radius: 99px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;
    }
    .back-btn:hover { border-color: var(--accent); }
    @media (max-width: 860px) { .g-grid { grid-template-columns: repeat(2, 1fr); } }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .stage { min-height: auto; padding: 16px 16px 8px; }
      #art { max-height: 70dvh; }
      .rack { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); }
      .rack-head { padding-top: 14px; }
      h1 { font-size: 2.6rem; }
      .scroll { overflow: visible; }
      .actions { position: sticky; bottom: 0; z-index: 5; }
      .palettes { grid-template-columns: repeat(4, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <section class="gallery" id="gallery" aria-labelledby="gTitle">
    <div class="g-grid" id="gGrid" role="list" aria-label="Pick a pattern to start with"></div>
    <footer class="g-foot">
      <h1 id="gTitle">Seed<span>loom</span></h1>
      <p>Ten patterns I wrote in code. Pick one, then stack, blend and reseed.</p>
      <button type="button" class="g-link" id="continueBtn" hidden>continue last piece →</button>
      <button type="button" class="g-link" id="surpriseBtn">surprise me ✦</button>
    </footer>
  </section>

  <main class="app" id="app" hidden>
    <section class="stage" aria-label="Artwork">
      <div class="frame">
        <canvas id="art" role="img" aria-label="Generated artwork"></canvas>
        <div class="busy" id="busy" aria-hidden="true">weaving…</div>
      </div>
    </section>

    <aside class="rack" aria-label="Tools">
      <header class="rack-head">
        <button type="button" class="back-btn" id="backBtn">← all looms</button>
        <h1>Seed<span>loom</span></h1>
        <p class="tag">Every pattern here is code I wrote. Stack layers, slide, reseed, blend.</p>
      </header>
      <div class="scroll">
        <h2 id="palH">Palette</h2>
        <div class="palettes" id="palettes" role="group" aria-labelledby="palH"></div>

        <h2 id="shapeH">Canvas</h2>
        <div class="row" id="aspects" role="group" aria-labelledby="shapeH"></div>

        <h2><span id="layH">Layers</span><span style="letter-spacing:0;font-weight:200;text-transform:none">top is drawn last</span></h2>
        <ul class="layers" id="layers" aria-labelledby="layH"></ul>
        <button type="button" class="add-btn" id="addBtn" aria-expanded="false" aria-controls="genMenu">+ add a layer</button>
        <div class="gen-menu" id="genMenu" hidden></div>
      </div>
      <div class="actions">
        <button type="button" class="act primary" id="remixBtn">✦ Remix</button>
        <button type="button" class="act" id="saveBtn">Save PNG</button>
        <button type="button" class="act" id="shareBtn">Share</button>
      </div>
      <span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-09-27 · new</span>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="gens.js"></script>
  <script src="app.js"></script>
</body>
</html>
