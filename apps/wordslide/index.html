<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordslide — a word hunt where the letters fall</title>
<meta name="description" content="Swipe snaking words out of a grid of wooden letters. Every word you take makes the letters above tumble down. Clear the board before you run dry.">
<link rel="canonical" href="https://app.sloppy.live/wordslide/">
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%8F%9C%EF%B8%8F">
<meta property="og:type" content="website">
<meta property="og:title" content="Wordslide">
<meta property="og:description" content="Swipe words out of a grid of wooden letters — and watch everything above them tumble down.">
<meta property="og:url" content="https://app.sloppy.live/wordslide/">
<meta property="og:image" content="https://app.sloppy.live/wordslide/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2c190e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400;1,6..72,700&family=Rye&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2e3c6; --paper-deep:#e4cea4; --ink:#2b1c12; --ink-soft:#5e4632;
  --rust:#b3401d; --rust-deep:#7e2a12; --tray:#3f2616; --tray-deep:#24140b;
  --face1:#fbf1dc; --face2:#ead6ae; --edge:#9c7246; --gold:#e0a526; --cell:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Newsreader',Georgia,serif; color:var(--ink);
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, #fff6de 0, transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, rgba(120,70,30,.28), transparent 70%),
    repeating-linear-gradient(0deg, rgba(90,60,30,.035) 0 2px, transparent 2px 5px),
    linear-gradient(#f3e5c9, #e6cfa6);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{max-width:1060px;margin:0 auto;padding:10px 16px 16px;display:grid;gap:8px;grid-template-columns:1fr;
  grid-template-areas:"head" "bar" "wanted" "reading" "stage"}
.head{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;animation:rise .6s both}
h1{font-family:'Rye',serif;font-weight:400;font-size:clamp(30px,8.4vw,58px);line-height:.95;letter-spacing:.01em;color:var(--ink);text-shadow:2px 2px 0 rgba(179,64,29,.18)}
h1 span{color:var(--rust)}
.score{text-align:right;line-height:1}
#score{display:block;font-family:'Alfa Slab One',serif;font-weight:400;font-size:30px;letter-spacing:.02em;transition:color .3s}
#score.bump{animation:bump .45s}
.score small{font-style:italic;font-size:13px;color:var(--ink-soft)}
.bar{grid-area:bar;display:flex;align-items:center;gap:8px;flex-wrap:wrap;animation:rise .6s .08s both}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 13px;min-height:36px;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:not([aria-pressed="true"]):hover{background:rgba(43,28,18,.08)}
.score small{white-space:nowrap}
.score small b{font-style:normal;color:var(--ink)}
.spacer{flex:1}
.score .pl{display:none}
.icon{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:16px;cursor:pointer;display:grid;place-items:center}
.icon:hover{background:rgba(43,28,18,.08)}
.icon[aria-pressed="true"]{opacity:.45}

.wanted{grid-area:wanted;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-height:34px;animation:rise .6s .16s both}
.wanted h2{font-family:'Rye',serif;font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--rust);margin-right:2px}
.wanted ul{display:contents;list-style:none}
.wanted li{font-family:'Alfa Slab One',serif;font-size:13px;letter-spacing:.09em;text-transform:uppercase;padding:4px 8px 3px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,248,230,.6);position:relative;transition:opacity .4s}
.wanted li.fresh{animation:pin .45s both}
.wanted li.got{color:var(--rust);text-decoration:line-through 2px;opacity:.55}
.wanted li.fell{text-decoration:line-through 2px;opacity:.45;border-style:dashed}
.wanted li.fell::after{content:'fell apart';font-family:'Newsreader',serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:11px;margin-left:5px}
.wanted .none{font-style:italic;font-size:14px;color:var(--ink-soft)}

.reading{grid-area:reading;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-style:italic;color:var(--ink-soft);padding:0 4px}
.reading .word{font-family:'Alfa Slab One',serif;font-style:normal;font-size:26px;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
.reading.ok .word{color:var(--rust)}
.reading .tag{font-family:'Newsreader',serif;font-size:14px;font-style:italic;letter-spacing:0;margin-left:10px;color:var(--rust);text-transform:none}
.reading b{font-style:normal;color:var(--ink)}

.stage{grid-area:stage;display:flex;justify-content:center;align-items:flex-start;animation:rise .6s .24s both}
.tray{padding:8px;border-radius:12px;background:
    repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 3px, transparent 3px 11px),
    linear-gradient(160deg, #57341d, var(--tray) 45%, var(--tray-deep));
  box-shadow:inset 0 2px 0 rgba(255,220,170,.18), inset 0 -3px 8px rgba(0,0,0,.45), 0 14px 30px -12px rgba(60,30,10,.65), 0 0 0 2px #1d0f07}
#grid{position:relative;overflow:hidden;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;
  background-image:linear-gradient(rgba(0,0,0,.28) 1px, transparent 1px),linear-gradient(90deg, rgba(0,0,0,.28) 1px, transparent 1px);
  background-size:var(--cell) var(--cell);background-color:rgba(0,0,0,.18);box-shadow:inset 0 3px 10px rgba(0,0,0,.5)}
.tile{position:absolute;left:0;top:0;width:calc(var(--cell) - 6px);height:calc(var(--cell) - 6px);margin:3px;border:0;border-radius:6px;cursor:pointer;
  background:linear-gradient(170deg,var(--face1),var(--face2));color:var(--ink);
  box-shadow:0 3px 0 var(--edge),0 5px 7px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 0 rgba(120,80,40,.15);
  font-family:'Alfa Slab One',serif;font-size:calc(var(--cell) * .5);line-height:1;text-transform:uppercase;
  display:grid;place-items:center;padding-top:2px;
  transition-property:transform,background,color;transition-timing-function:cubic-bezier(.3,1.35,.55,1),ease,ease;
  transition-duration:.4s,.12s,.12s;will-change:transform}
.tile.sel{background:linear-gradient(170deg,#d6592f,var(--rust));color:#fff4e2;box-shadow:0 3px 0 var(--rust-deep),0 5px 7px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,210,170,.6)}
.tile.sel.tip{background:linear-gradient(170deg,#e46a3c,#c24a22);box-shadow:0 3px 0 var(--rust-deep),0 5px 7px rgba(0,0,0,.38),inset 0 0 0 2px var(--gold)}
.tile.pop{animation:pop .34s ease-in forwards;pointer-events:none}
.tile.nope{animation:nope .38s}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:-1px;z-index:3}
#trail{position:absolute;inset:0;pointer-events:none;overflow:visible}
#trail polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.float{position:absolute;z-index:4;pointer-events:none;font-family:'Alfa Slab One',serif;font-size:22px;color:var(--gold);text-shadow:0 2px 0 var(--tray-deep),0 0 12px rgba(0,0,0,.6);transform:translate(-50%,-50%);animation:floatup 1.1s ease-out forwards;white-space:nowrap}

/* overlays */
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(36,20,11,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .3s both}
.card{position:relative;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px 24px 22px;border-radius:6px;text-align:center;
  background:radial-gradient(ellipse at 50% 0,#fff6df,transparent 70%),linear-gradient(#f5e7ca,#ead5ad);
  box-shadow:0 0 0 2px var(--ink),0 0 0 7px #f5e7ca,0 0 0 9px var(--ink),0 30px 60px -20px rgba(0,0,0,.6);animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
.card h2{font-family:'Rye',serif;font-weight:400;font-size:32px;line-height:1.05;margin-bottom:6px}
.card .kicker{font-family:'Alfa Slab One',serif;font-size:13px;letter-spacing:.3em;color:var(--rust);margin-bottom:8px}
.card p{font-size:17px;line-height:1.4;margin:8px 0}
.card ol{text-align:left;margin:14px 4px 6px 22px;font-size:16px;line-height:1.45}
.card ol li{margin:5px 0}
.card .big{font-family:'Alfa Slab One',serif;font-size:54px;line-height:1;margin:6px 0 2px;color:var(--rust)}
.card .sub{font-style:italic;color:var(--ink-soft);font-size:15px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;min-height:44px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.skyline{display:inline-grid;grid-template-columns:repeat(7,14px);gap:3px;margin:14px auto 4px;padding:8px;border-radius:6px;background:var(--tray)}
.skyline i{width:14px;height:14px;border-radius:2px;background:rgba(0,0,0,.25)}
.skyline i.on{background:linear-gradient(var(--face1),var(--face2));box-shadow:0 2px 0 var(--edge)}
.foundlist{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-top:10px;font-style:italic}
.foundlist b{font-family:'Alfa Slab One',serif;font-style:normal;font-weight:400;letter-spacing:.06em;color:var(--ink)}
#weed{position:fixed;left:0;bottom:6vh;z-index:30;pointer-events:none;display:none}
#weed.roll{display:block;animation:roll 2.6s linear forwards}
#weed svg{display:block;animation:hop .65s ease-in-out infinite}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-2deg)}}
@keyframes pin{from{opacity:0;transform:translateY(-6px) rotate(-4deg)}}
@keyframes bump{40%{transform:scale(1.18);color:var(--rust)}}
@keyframes pop{0%{scale:1}30%{scale:1.22;rotate:-7deg}100%{scale:0;rotate:16deg;opacity:0}}
@keyframes nope{20%,60%{translate:-5px 0}40%,80%{translate:5px 0}}
@keyframes floatup{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-54px}}
@keyframes roll{from{transform:translateX(-90px) rotate(0)}to{transform:translateX(calc(100vw + 90px)) rotate(900deg)}}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -22px}}

@media (min-width:900px){
  .app{grid-template-columns:320px 1fr;column-gap:40px;padding-top:28px;
    grid-template-areas:"head reading" "bar stage" "wanted stage" ". stage";grid-template-rows:auto auto auto 1fr}
  .head{flex-direction:column;align-items:flex-start;gap:14px}
  .score{text-align:left}
  #score{font-size:44px}
  .bar{align-content:flex-start}
  .spacer{display:none}
  .score .pl{display:inline}
  .wanted{flex-direction:column;align-items:flex-start;align-content:flex-start}
  .wanted h2{font-size:20px;margin-bottom:4px}
  .wanted li{font-size:16px}
  .reading{align-self:end}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Word<span>slide</span></h1>
    <div class="score" aria-live="off"><b id="score">0</b><small id="stats">0% cleared · 0 words</small></div>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Board">
      <button id="dailyBtn" aria-pressed="true">Daily</button>
      <button id="freeBtn" aria-pressed="false">New board</button>
    </div>
    <span class="spacer"></span>
    <button class="icon" id="helpBtn" aria-label="How to play">?</button>
    <button class="icon" id="muteBtn" aria-label="Mute sound" aria-pressed="false">♪</button>
  </div>
  <section class="wanted" aria-label="Wanted words, worth double">
    <h2>WANTED</h2>
    <ul id="wanted"></ul>
  </section>
  <div class="reading" id="reading"></div>
  <div class="stage" id="stage">
    <div class="tray"><div id="grid" role="group" aria-label="Letter board. Arrow keys move, Enter picks a letter, Enter on the last letter plays the word, Escape clears."></div></div>
  </div>
</div>
<div id="sr" class="sr" aria-live="polite"></div>
<div id="weed" aria-hidden="true"><svg viewBox="-32 -32 64 64" width="70" height="70"><g fill="none" stroke="#8a5a2b" stroke-width="1.7" stroke-linecap="round"><circle r="25" stroke-dasharray="11 5"/><ellipse rx="25" ry="12" transform="rotate(30)" stroke-dasharray="8 6"/><ellipse rx="25" ry="10" transform="rotate(-42)" stroke-dasharray="12 4"/><ellipse rx="11" ry="25" transform="rotate(12)" stroke-dasharray="6 5"/><path d="M-19 -8Q0 -21 17 -6M-15 12Q2 2 19 10M-6 -23Q-2 0 -9 21M8 -21Q15 0 6 23M-22 2Q0 8 22 -3" stroke="#a8743f"/></g></svg></div>

<script src="words.js"></script>
<script>
(function () {
  'use strict';
  var COLS = 7, ROWS = 9, MIN = 3, WANTED_N = 5;
  var WORDS = window.TW_WORDS || [];
  var DICT = new Set(WORDS), PREFIX = new Set();
  DICT.forEach(function (w) { for (var i = 1; i <= w.length; i++) PREFIX.add(w.slice(0, i)); });
  var PLANT = Array.from(DICT).filter(function (w) { return w.length >= 5 && w.length <= 7; });
  var LETTERS = 'eeeeeeeeeeeetttttttttaaaaaaaaaoooooooooiiiiiiiinnnnnnnsssssshhhhhrrrrrrddddlllllcccuuuummmwwffggyyppbbvk';
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var gridEl = $('grid'), readingEl = $('reading'), srEl = $('sr');

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---------- seeded randomness ----------
  function hashStr(s) { var h = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function todayKey() { var d = new Date(); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  function todayLabel() { try { return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); } catch (e) { return todayKey(); } }

  // ---------- sound (tiny, synthesized) ----------
  var AC = null, muted = store('wordslide_mute') === '1';
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
  var lastClack = 0;
  function clack(v) {
    if (muted || !AC) return; var now = performance.now(); if (now - lastClack < 35) return; lastClack = now;
    var a = AC, t = a.currentTime, len = Math.floor(a.sampleRate * 0.05), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
    var s = a.createBufferSource(); s.buffer = b; var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 700; f.Q.value = 4;
    var g = a.createGain(); g.gain.value = 0.5 * (v || 1); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
  }
  function chime(n) {
    if (muted || !AC) return; var a = AC, t = a.currentTime, steps = [0, 4, 7, 12, 16, 19, 24];
    for (var i = 0; i < Math.min(n, 7); i++) {
      var o = a.createOscillator(), g = a.createGain(), at = t + i * 0.055; o.type = 'triangle'; o.frequency.value = 392 * Math.pow(2, steps[i] / 12);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.13, at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.28);
      o.connect(g); g.connect(a.destination); o.start(at); o.stop(at + 0.3);
    }
  }
  function buzz() {
    if (muted || !AC) return; var a = AC, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(140, t); o.frequency.linearRampToValueAtTime(90, t + 0.16);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.2);
  }

  // ---------- state ----------
  var grid = [], cell = 48, path = [], busy = false, focus = { c: 0, r: ROWS - 1 };
  var S = null; // current game

  function points(n) { return 10 * n * (n - 1) / 2; }

  function genBoard(rng) {
    var g = [], r, c;
    for (r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
    var planted = 0, tries = 0;
    while (planted < 7 && tries < 800) {
      tries++;
      var w = PLANT[Math.floor(rng() * PLANT.length)], cells = [], used = {}, ok = true;
      r = Math.floor(rng() * ROWS); c = Math.floor(rng() * COLS);
      for (var i = 0; i < w.length && ok; i++) {
        if (i > 0) {
          var opts = DIRS.map(function (d) { return [r + d[0], c + d[1]]; }).filter(function (p) {
            return p[0] >= 0 && p[0] < ROWS && p[1] >= 0 && p[1] < COLS && !used[p[0] + ',' + p[1]] && (g[p[0]][p[1]] === null || g[p[0]][p[1]] === w[i]);
          });
          if (!opts.length) { ok = false; break; }
          var p = opts[Math.floor(rng() * opts.length)]; r = p[0]; c = p[1];
        } else if (g[r][c] !== null && g[r][c] !== w[0]) { ok = false; break; }
        used[r + ',' + c] = 1; cells.push([r, c]);
      }
      if (!ok) continue;
      cells.forEach(function (p, i) { g[p[0]][p[1]] = w[i]; });
      planted++;
    }
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) if (g[r][c] === null) {
      g[r][c] = rng() < 0.012 ? 'jxz'[Math.floor(rng() * 3)] : LETTERS[Math.floor(rng() * LETTERS.length)];
    }
    return g;
  }

  // ---------- layout & tiles ----------
  function layout() {
    var stage = $('stage'), top = stage.getBoundingClientRect().top + window.scrollY;
    var w = stage.clientWidth - 16, h = window.innerHeight - top - 30;
    var wide = window.innerWidth >= 900;
    cell = Math.floor(Math.min(w / COLS, Math.max(h, wide ? 420 : 300) / ROWS, wide ? 76 : 66));
    cell = Math.max(34, cell);
    gridEl.style.width = COLS * cell + 'px'; gridEl.style.height = ROWS * cell + 'px';
    document.documentElement.style.setProperty('--cell', cell + 'px');
    eachTile(function (t) { place(t, 0, 0); });
    drawTrail();
  }
  function eachTile(fn) { for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r] && grid[r][c]) fn(grid[r][c]); }
  function place(t, dur, delay) {
    var s = t.el.style;
    s.transitionDuration = (reduce ? 0 : dur) + 's,.12s,.12s';
    s.transitionDelay = (reduce ? 0 : delay || 0) + 's,0s,0s';
    s.transform = 'translate(' + (t.c * cell) + 'px,' + (t.r * cell) + 'px)';
    t.el.setAttribute('aria-label', t.ch.toUpperCase() + ', row ' + (t.r + 1) + ', column ' + (t.c + 1));
  }
  function makeTile(ch, c, r) {
    var el = document.createElement('button');
    el.type = 'button'; el.className = 'tile'; el.textContent = ch; el.tabIndex = -1;
    var t = { ch: ch, c: c, r: r, el: el }; el._t = t;
    gridEl.appendChild(el); return t;
  }

  // ---------- game flow ----------
  function newGame(mode) {
    var seed = mode === 'daily' ? hashStr('wordslide:' + todayKey()) : (Math.random() * 4294967296) >>> 0;
    var rng = mulberry(seed);
    S = { mode: mode, rng: rng, score: 0, found: [], wanted: [], over: false, total: COLS * ROWS, left: COLS * ROWS };
    $('dailyBtn').setAttribute('aria-pressed', mode === 'daily'); $('freeBtn').setAttribute('aria-pressed', mode !== 'daily');
    path = []; busy = false;
    gridEl.innerHTML = '<svg id="trail"><polyline id="rope" stroke="#caa06a" /><polyline id="rope2" stroke="#7a532c" stroke-dasharray="2 7" /></svg>';
    var g = genBoard(rng); grid = [];
    for (var r = 0; r < ROWS; r++) { var row = []; for (var c = 0; c < COLS; c++) row.push(makeTile(g[r][c], c, r)); grid.push(row); }

    eachTile(function (t) { t.el.style.transitionDuration = '0s'; t.el.style.transform = 'translate(' + (t.c * cell) + 'px,' + (-(ROWS - t.r + 1) * cell - 30) + 'px)'; });
    void gridEl.offsetWidth;
    eachTile(function (t) { place(t, 0.6, (ROWS - 1 - t.r) * 0.055 + t.c * 0.02 + Math.random() * 0.04); });
    if (!reduce) for (var i = 0; i < 9; i++) setTimeout(function () { clack(0.6); }, 480 + i * 60);
    focus = { c: 0, r: ROWS - 1 }; setRoving();
    score(0); stats(); refreshWanted();
    say(mode === 'daily' ? 'Daily board · ' + todayLabel() + ' — same letters for everyone today.' : 'A fresh board. Go lasso some words.');
  }

  function stats() {
    var pct = Math.round((S.total - S.left) / S.total * 100);
    $('stats').innerHTML = '<span class="pl">points · </span><b>' + pct + '%</b> cleared · <b>' + S.found.length + '</b> word' + (S.found.length === 1 ? '' : 's');
  }
  function score(add) {
    S.score += add; var el = $('score'); el.textContent = S.score;
    if (add) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
  function say(html, plain) { readingEl.className = 'reading'; readingEl.innerHTML = html; if (plain !== false) srEl.textContent = readingEl.textContent; }

  // every word currently on the board (orthogonal snaking paths, no tile twice)
  function findWords() {
    var out = new Map();

    return out;
  }

  function refreshWanted() {
    var all = findWords(); S.alive = all;
    S.wanted = S.wanted.filter(function (e) { return e.st === 'live'; });
    S.wanted.forEach(function (e) { e.fresh = false; if (!all.has(e.w)) e.st = 'fell'; });
    var live = S.wanted.filter(function (e) { return e.st === 'live'; }).length;
    var have = {}; S.wanted.forEach(function (e) { have[e.w] = 1; });
    var cands = Array.from(all.keys()).filter(function (w) { return !have[w]; })
      .map(function (w) { return { w: w, k: Math.min(w.length, 6) + S.rng() * 2.2 }; })
      .sort(function (a, b) { return b.k - a.k; });

    renderWanted();

  }
  function renderWanted() {
    var ul = $('wanted');
    if (!S.wanted.length) { ul.innerHTML = '<li class="none" style="border:0;background:none;font-family:Newsreader,serif;text-transform:none;letter-spacing:0">nobody left to chase</li>'; return; }
    ul.innerHTML = S.wanted.map(function (e) {
      return '<li class="' + e.st + (e.fresh ? ' fresh' : '') + '">' + e.w + '<span class="sr">' + (e.st === 'got' ? ' (caught)' : e.st === 'fell' ? ' (fell apart)' : '') + '</span></li>';
    }).join('');
  }

  // ---------- path building ----------
  function adjacent(a, b) { return Math.abs(a.c - b.c) + Math.abs(a.r - b.r) === 1; }
  function pathWord() { return path.map(function (t) { return t.ch; }).join(''); }
  function renderPath() {
    eachTile(function (t) { t.el.classList.remove('sel', 'tip'); });
    path.forEach(function (t, i) { t.el.classList.add('sel'); if (i === path.length - 1) t.el.classList.add('tip'); });
    drawTrail();
    if (!path.length) return;
    var w = pathWord(), ok = w.length >= MIN && DICT.has(w), bounty = ok && S.wanted.some(function (e) { return e.st === 'live' && e.w === w; });
    readingEl.className = 'reading' + (ok ? ' ok' : '');
    readingEl.innerHTML = '<span class="word">' + w + '</span>' + (ok ? '<span class="tag">' + (bounty ? 'bounty! ' : '') + '+' + points(w.length) * (bounty ? 2 : 1) + '</span>' : '');
  }
  function drawTrail() {
    var r1 = document.getElementById('rope'), r2 = document.getElementById('rope2'); if (!r1) return;
    var pts = path.map(function (t) { return ((t.c + 0.5) * cell) + ',' + ((t.r + 0.5) * cell); }).join(' ');
    [r1, r2].forEach(function (p, i) { p.setAttribute('points', path.length > 1 ? pts : ''); p.setAttribute('stroke-width', Math.max(4, cell * (i ? 0.1 : 0.16))); p.style.opacity = i ? 0.9 : 0.85; });
  }
  function clearPath(keepMsg) { path = []; renderPath(); if (!keepMsg) say(''); }

  function tapTile(t) {
    if (busy || S.over || !t) return;
    var i = path.indexOf(t);
    if (path.length && t === path[path.length - 1]) {
      if (path.length >= MIN) { submit(); return; }
      path.pop(); renderPath(); if (!path.length) say(''); return;
    }
    if (i >= 0) path.length = i + 1;
    else if (path.length && adjacent(t, path[path.length - 1])) path.push(t);
    else path = [t];
    renderPath();
    if (path.length === 1 && !store('wordslide_tapped')) { store('wordslide_tapped', '1'); say('<span class="word">' + t.ch + '</span><span class="tag">tap touching letters, then the last one again to play</span>'); }
  }

  function submit() {
    var w = pathWord();
    if (w.length < MIN) { if (path.length > 1) say('Words need at least three letters.'); clearPath(true); return; }
    if (!DICT.has(w)) {
      path.forEach(function (t) { t.el.classList.remove('nope'); void t.el.offsetWidth; t.el.classList.add('nope'); });
      buzz(); say('“<b>' + w.toUpperCase() + '</b>” isn’t in my word list.'); clearPath(true); return;
    }
    var entry = S.wanted.find(function (e) { return e.st === 'live' && e.w === w; });
    var pts = points(w.length) * (entry ? 2 : 1);
    if (entry) { entry.st = 'got'; renderWanted(); }
    S.found.push(w); score(pts); chime(w.length);
    var head = path[path.length - 1], fl = document.createElement('div');
    fl.className = 'float'; fl.textContent = '+' + pts; fl.style.left = (head.c + 0.5) * cell + 'px'; fl.style.top = (head.r + 0.5) * cell + 'px';
    gridEl.appendChild(fl); setTimeout(function () { fl.remove(); }, 1200);
    var gone = path.slice(); path = []; renderPath();
    say((entry ? 'Bounty caught: ' : '') + '<b>' + w.toUpperCase() + '</b> +' + pts + (w.length >= 6 ? ' — what a lasso!' : ''));
    gone.forEach(function (t) { grid[t.r][t.c] = null; t.el.classList.add('pop'); t.el.tabIndex = -1; setTimeout(function () { t.el.remove(); }, 380); });
    S.left -= gone.length; stats();
    busy = true;
    setTimeout(function () {
      var fall = gravity();
      setTimeout(function () { busy = false; settle(); }, reduce ? 0 : 300 + fall * 45 + 220);
    }, reduce ? 0 : 190);
  }

  function gravity() {
    var maxFall = 0;
    for (var c = 0; c < COLS; c++) {
      var col = [];
      for (var r = ROWS - 1; r >= 0; r--) if (grid[r][c]) col.push(grid[r][c]);
      for (r = ROWS - 1; r >= 0; r--) {
        var t = col[ROWS - 1 - r] || null; grid[r][c] = t;
        if (t && t.r !== r) {
          var d = r - t.r; maxFall = Math.max(maxFall, d); t.r = r;
          place(t, 0.34 + d * 0.045, c * 0.018);
          (function (d, c) { setTimeout(function () { clack(Math.min(1, 0.4 + d * 0.15)); }, (reduce ? 0 : (0.3 + d * 0.045 + c * 0.018) * 1000)); })(d, c);
        }
      }
    }
    return maxFall;
  }

  function settle() {
    var all = refreshWanted();
    var fell = S.wanted.filter(function (e) { return e.st === 'fell'; }).map(function (e) { return e.w.toUpperCase(); });
    if (fell.length) say(readingEl.innerHTML + ' <span class="tag">· ' + fell.join(', ') + ' fell apart</span>');
    fixFocus();
    if (!all.size) endGame();
  }

  // ---------- ending ----------
  function endGame() {
    S.over = true;
    var perfect = S.left === 0;
    if (perfect) score(500);
    var result = { score: S.score, cleared: S.total - S.left, words: S.found.length };
    if (S.mode === 'daily') {
      var prev = null; try { prev = JSON.parse(store('wordslide_daily') || 'null'); } catch (e) {}
      if (!prev || prev.date !== todayKey() || prev.score < S.score) store('wordslide_daily', JSON.stringify(Object.assign({ date: todayKey() }, result)));
    } else {
      var best = +(store('wordslide_best') || 0); if (S.score > best) store('wordslide_best', String(S.score)); S.best = Math.max(best, S.score);
    }

    if (!perfect && !reduce) {
      var weed = $('weed'); weed.classList.remove('roll'); void weed.offsetWidth; weed.classList.add('roll');
      setTimeout(function () { weed.classList.remove('roll'); showEnd(perfect); }, 2300);
    } else setTimeout(function () { showEnd(perfect); }, 500);
  }
  function skylineRows() {
    var rows = [];
    for (var r = 0; r < ROWS; r++) { var s = ''; for (var c = 0; c < COLS; c++) s += grid[r][c] ? '🟫' : '⬜'; rows.push(s); }
    while (rows.length > 1 && rows[0].indexOf('🟫') < 0 && rows[1].indexOf('🟫') < 0) rows.shift();
    return rows;
  }
  function shareText() {
    return 'Wordslide · ' + (S.mode === 'daily' ? 'Daily ' + todayLabel() : 'Free play') + '\n' +
      S.score + ' pts · ' + (S.total - S.left) + '/' + S.total + ' cleared · ' + S.found.length + ' words\n' +
      skylineRows().join('\n') + '\n' + location.origin + location.pathname;
  }
  function showEnd(perfect) {
    var longest = S.found.slice().sort(function (a, b) { return b.length - a.length; })[0] || '—';
    var sky = ''; for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) sky += '<i class="' + (grid[r][c] ? 'on' : '') + '"></i>';
    var extra = S.mode === 'daily' ? 'Today’s board is the same for everyone — compare skylines.' : (S.best ? 'Best free-play score: ' + S.best : '');
    openVeil(
      '<div class="kicker">' + (perfect ? 'CLEAN SWEEP' : 'THE TRAIL RUNS DRY') + '</div>' +
      '<h2 id="vt">' + (perfect ? 'Board cleared!' : 'Not a word left') + '</h2>' +
      '<div class="big">' + S.score + '</div><div class="sub">points' + (perfect ? ' · +500 clean-sweep bonus' : '') + '</div>' +
      '<div class="skyline" aria-hidden="true">' + sky + '</div>' +
      '<p>Cleared <b>' + (S.total - S.left) + '</b> of ' + S.total + ' letters with <b>' + S.found.length + '</b> words.</p>' +
      '<div class="foundlist">Longest lasso: <b>' + longest.toUpperCase() + '</b>' + (extra ? '<br>' + extra : '') + '</div>' +
      '<div class="btns"><button class="btn" id="shareBtn">Share skyline</button><button class="btn ghost" id="againBtn">New board</button><button class="btn ghost" id="lookBtn">Look at the board</button></div>'
    );
    $('shareBtn').onclick = function () {
      var txt = shareText(), btn = $('shareBtn');
      function done(m) { btn.textContent = m; setTimeout(function () { btn.textContent = 'Share skyline'; }, 2000); }
      if (navigator.share && matchMedia('(pointer: coarse)').matches) navigator.share({ text: txt }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { done('Copied!'); }, function () { done('Copy failed'); });
      else done('Copy not supported');
    };
    $('againBtn').onclick = function () { closeVeil(); newGame('free'); };
    $('lookBtn').onclick = closeVeil;
  }

  // ---------- overlays ----------
  var lastFocus = null;
  function openVeil(html) {
    closeVeil(); lastFocus = document.activeElement;
    var v = document.createElement('div'); v.className = 'veil'; v.id = 'veil';
    v.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-labelledby="vt">' + html + '</div>';
    document.body.appendChild(v);
    v.addEventListener('click', function (e) { if (e.target === v) closeVeil(); });
    var f = v.querySelector('button'); if (f) f.focus();
  }
  function closeVeil() { var v = $('veil'); if (v) { v.remove(); if (lastFocus && lastFocus.focus) lastFocus.focus(); } }
  function showHelp() {
    openVeil(
      '<div class="kicker">HOW TO PLAY</div><h2 id="vt">Lasso the words</h2>' +
      '<ol><li><b>Swipe through touching letters</b> — up, down, left or right, never the same tile twice — to spell a word of 3+ letters.</li>' +
      '<li>The word pops and <b>everything above it tumbles down</b>, making new words and breaking old ones.</li>' +
      '<li><b>WANTED</b> words pay double. Long words pay way more.</li>' +
      '<li>Clear as much of the board as you can before the words run dry.</li></ol>' +
      '<p class="sub">No swiping? Tap letters one by one, then tap the last one again.</p>' +
      '<div class="btns"><button class="btn" id="goBtn">Saddle up</button></div>'
    );
    $('goBtn').onclick = function () { store('wordslide_seen', '1'); closeVeil(); };
  }

  // ---------- pointer input ----------
  var drag = null;
  function tileAt(x, y, strict) {
    var rc = gridEl.getBoundingClientRect(), fx = (x - rc.left) / cell, fy = (y - rc.top) / cell;

    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;

    return grid[r][c];
  }
  gridEl.addEventListener('pointerdown', function (e) {
    ac();
    if (busy || S.over || e.button > 0) return;
    var t = tileAt(e.clientX, e.clientY, false); if (!t) return;
    e.preventDefault();

  });
  gridEl.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var hit = tileAt(e.clientX, e.clientY, true);
    if (!drag.moved) {
      if (!hit || hit === drag.start) return;
      drag.moved = true; path = [drag.start];
    }
    if (!hit) return;
    var last = path[path.length - 1];
    if (hit === last) return;
    if (path.length > 1 && hit === path[path.length - 2]) path.pop();
    else if (path.indexOf(hit) < 0 && adjacent(hit, last)) path.push(hit);
    else return;
    renderPath();
  });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (cancel) { clearPath(); return; }
    if (!d.moved) { focus = { c: d.start.c, r: d.start.r }; setRoving(); tapTile(d.start); return; }
    if (path.length >= MIN) submit();
    else { clearPath(); say('Words need at least three letters.'); }
  }
  gridEl.addEventListener('pointerup', function (e) { endDrag(e, false); });
  gridEl.addEventListener('pointercancel', function (e) { endDrag(e, true); });
  gridEl.addEventListener('click', function (e) { e.preventDefault(); });

  // ---------- keyboard ----------
  function setRoving() {
    eachTile(function (t) { t.el.tabIndex = -1; });
    var t = grid[focus.r] && grid[focus.r][focus.c]; if (t) t.el.tabIndex = 0;
  }
  function fixFocus() {
    if (grid[focus.r] && grid[focus.r][focus.c]) { setRoving(); return; }
    var best = null, bd = 1e9;
    eachTile(function (t) { var d = Math.abs(t.c - focus.c) + Math.abs(t.r - focus.r); if (d < bd) { bd = d; best = t; } });
    var had = gridEl.contains(document.activeElement) || document.activeElement === document.body;
    if (best) { focus = { c: best.c, r: best.r }; setRoving(); if (had && document.activeElement !== document.body) best.el.focus(); }
  }
  gridEl.addEventListener('keydown', function (e) {
    var k = e.key, dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (dir) {
      e.preventDefault();
      var r = focus.r + dir[0], c = focus.c + dir[1];
      while (r >= 0 && r < ROWS && c >= 0 && c < COLS && !grid[r][c]) { r += dir[0]; c += dir[1]; }
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) { focus = { c: c, r: r }; setRoving(); grid[r][c].el.focus(); }
    } else if (k === 'Enter' || k === ' ') {
      e.preventDefault(); ac(); tapTile(grid[focus.r][focus.c]);
    } else if (k === 'Escape') { clearPath(); }
    else if (k === 'Backspace' && path.length) { e.preventDefault(); path.pop(); renderPath(); if (!path.length) say(''); }
  });

  // ---------- chrome ----------
  $('dailyBtn').onclick = function () { closeVeil(); newGame('daily'); };
  $('freeBtn').onclick = function () { closeVeil(); newGame('free'); };
  $('helpBtn').onclick = showHelp;
  function syncMute() { var b = $('muteBtn'); b.setAttribute('aria-pressed', muted); b.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound'); b.textContent = muted ? '×' : '♪'; }
  $('muteBtn').onclick = function () { muted = !muted; store('wordslide_mute', muted ? '1' : '0'); syncMute(); if (!muted) { ac(); clack(1); } };
  syncMute();

  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 120); });

  layout();
  if (!WORDS.length) { say('The word list didn’t load — try refreshing.'); return; }
  var daily = null; try { daily = JSON.parse(store('wordslide_daily') || 'null'); } catch (e) {}
  newGame(daily && daily.date === todayKey() ? 'free' : 'daily');
  if (daily && daily.date === todayKey()) say('You already rode today’s daily (' + daily.score + ' pts). Here’s a free board.');
  if (!store('wordslide_seen')) setTimeout(showHelp, reduce ? 0 : 900);
  window.__tw = { get grid() { return grid; }, findWords: findWords, get S() { return S; }, tap: tapTile };
})();
