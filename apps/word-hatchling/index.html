<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Hatchling</title>
<meta name="description" content="A little creature in an egg that knows zero words. It can only talk with the words you teach it.">
<meta property="og:type" content="website">
<meta property="og:title" content="Word Hatchling">
<meta property="og:description" content="It knows zero words. Teach it yours and watch it hatch.">
<meta property="og:url" content="https://app.sloppy.live/word-hatchling/">
<meta property="og:image" content="https://app.sloppy.live/word-hatchling/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3ead7">
<link rel="icon" href="https://emojicdn.elk.sh/🐣">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@300;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--paper:#f3ead7;--paper2:#e9dcc0;--ink:#2b2a33;--soft:#5b5466;--nest:#8a5a35;--nest2:#5e3a20;--yolk:#ffd23f;--yolk2:#e9a90f;--beak:#f28c28;--teal:#17677a;--egg:#fbf6ea;--speck:#7fb3c8;
  --hand:'Gaegu',cursive;--disp:'Bagel Fat One',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--hand);display:flex;flex-direction:column;align-items:center;padding:clamp(1rem,3vh,2rem) 1rem 1rem;overflow-x:hidden;
  background:radial-gradient(40rem 26rem at 50% 42%,#fff8e6,transparent 70%),
  radial-gradient(circle at 20% 15%,rgba(23,103,122,.07) 0 2px,transparent 3px) 0 0/38px 38px,
  radial-gradient(circle at 70% 60%,rgba(138,90,53,.08) 0 1.5px,transparent 2.5px) 0 0/29px 29px,var(--paper)}
header{text-align:center}
h1{margin:0;font:400 clamp(2.3rem,9vw,3.6rem)/.95 var(--disp);color:var(--ink);letter-spacing:.01em}
h1 span{color:var(--teal)}
.sub{margin:.35rem 0 0;font:300 .78rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
main{width:100%;max-width:30rem;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:min(80vw,19rem);aspect-ratio:1/1;margin-top:5.2rem}
.bubble{position:absolute;left:50%;bottom:86%;transform:translateX(-50%);width:max-content;max-width:min(88vw,24rem);padding:.45rem 1rem .55rem;border-radius:1.2rem;background:#fff;border:2.5px solid var(--ink);
  font:700 clamp(1.45rem,6vw,1.9rem)/1.1 var(--hand);text-align:center;box-shadow:.25rem .3rem 0 rgba(43,42,51,.18);min-height:2.6rem;min-width:3.4rem}
.bubble::after{content:'';position:absolute;left:50%;bottom:-.72rem;width:1.1rem;height:1.1rem;background:#fff;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}to{transform:translateX(-50%) scale(1)}}
.bubble .nw{color:var(--teal);text-decoration:underline wavy rgba(23,103,122,.5);text-underline-offset:.2em}
svg.pet{width:100%;height:100%;overflow:visible}
.pet .egg,.pet .crack,.pet .chick,.pet .shellB,.pet .shellT,.pet .tuft,.pet .wings,.pet .hat{display:none}
[data-stage="0"] .pet .egg,[data-stage="1"] .pet .egg,[data-stage="1"] .pet .crack{display:inline}
[data-stage="2"] .pet .chick,[data-stage="2"] .pet .shellB,[data-stage="2"] .pet .shellT{display:inline}
[data-stage="3"] .pet .chick,[data-stage="3"] .pet .wings,[data-stage="3"] .pet .tuft{display:inline}
[data-stage="4"] .pet .chick,[data-stage="4"] .pet .wings,[data-stage="4"] .pet .tuft,[data-stage="4"] .pet .hat{display:inline}
[data-stage="2"] .pet .chick{transform:translateY(5px)}
.pet .body{transform-origin:100px 150px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
[data-stage="3"] .pet .body{transform:scale(1.06)}
[data-stage="4"] .pet .body{transform:scale(1.14)}
.wobble .pet .egg{animation:wob .6s ease-in-out 2;transform-origin:100px 165px}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.talk .pet .beakOpen{display:inline}.pet .beakOpen{display:none}
.talk .pet .beakShut{display:none}
.talk .pet .chick{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
[data-stage="2"].talk .pet .chick{animation:none}
.flap .wings path{animation:flap .25s ease-in-out 4 alternate}
.wings .wl{transform-origin:62px 150px}.wings .wr{transform-origin:138px 150px}
@keyframes flap{to{transform:rotate(-18deg)}}
.wings .wr{animation-direction:alternate-reverse}
form{display:flex;gap:.5rem;width:min(100%,24rem);margin-top:1.2rem}
input{flex:1;min-width:0;min-height:2.9rem;padding:.4rem 1rem;border-radius:999px;border:2.5px solid var(--ink);background:#fffdf6;color:var(--ink);font:700 1.3rem var(--hand)}
input::placeholder{color:#7b7386}
.btn{min-height:2.9rem;min-width:2.9rem;padding:.4rem 1.1rem;border-radius:999px;border:2.5px solid var(--ink);background:var(--yolk);color:var(--ink);font:600 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:.18rem .2rem 0 var(--ink)}
.btn:active{transform:translate(.12rem,.14rem);box-shadow:.06rem .06rem 0 var(--ink)}
.stat{margin:.9rem 0 0;font:300 .8rem var(--mono);color:var(--soft);text-align:center}
.stat b{font-weight:600;color:var(--ink)}
.hint{margin:.5rem 0 0;font:400 1.15rem var(--hand);color:var(--soft);text-align:center;max-width:22rem}
details{width:min(100%,24rem);margin-top:1rem;font:300 .8rem var(--mono);color:var(--soft)}
summary{cursor:pointer;min-height:2.75rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.dict{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;padding:.4rem 0 .6rem}
.dict span{padding:.1rem .55rem;border-radius:999px;background:#fffdf6;border:1.5px solid rgba(43,42,51,.35);font:400 .8rem var(--mono);color:var(--ink)}
.dict span.big{font-weight:600;border-color:var(--teal);color:var(--teal)}
ol.log{list-style:none;margin:.8rem 0 0;padding:0;width:min(100%,24rem);font:400 1.1rem/1.25 var(--hand)}
ol.log li{padding:.15rem .3rem}
ol.log li.you{color:var(--soft);text-align:right}
ol.log li.it{color:var(--ink)}
ol.log li.it::before{content:'';display:inline-block;width:.6em;height:.6em;margin-right:.4em;border-radius:50%;background:var(--yolk);border:2px solid var(--ink);vertical-align:.05em}
footer{margin-top:auto;padding-top:1.5rem;text-align:center;font:300 .68rem var(--mono);color:var(--soft)}
footer button{min-height:2.75rem;border:0;background:none;color:var(--teal);font:inherit;text-decoration:underline;cursor:pointer;padding:0 .3rem}
.ctl{position:fixed;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));display:flex;gap:.4rem}
.ctl button{width:2.9rem;height:2.9rem;border-radius:50%;border:2.5px solid var(--ink);background:#fffdf6;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ctl svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.party{position:absolute;inset:0;pointer-events:none}
.party i{position:absolute;left:50%;top:55%;width:.5rem;height:.5rem;border-radius:2px;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:.6rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Word <span>Hatchling</span></h1>
  <p class="sub">it only knows what you teach it</p>
</header>
<main>
  <div class="stage" id="stage" data-stage="0">
    <p class="bubble" id="say" aria-live="polite">…</p>
    <svg class="pet" viewBox="0 0 200 200" aria-hidden="true">
      <ellipse cx="100" cy="186" rx="78" ry="12" fill="rgba(43,42,51,.12)"/>
      <!-- nest -->
      <path d="M22 160 Q100 214 178 160 Q172 192 100 196 Q28 192 22 160Z" fill="#8a5a35" stroke="#2b2a33" stroke-width="3"/>
      <path d="M34 170 Q70 184 104 178 M52 184 Q96 194 150 176 M120 186 Q150 182 168 168" fill="none" stroke="#5e3a20" stroke-width="2.4" stroke-linecap="round"/>
      <g class="egg">
        <path d="M100 52 C136 52 152 104 150 134 C148 164 126 178 100 178 C74 178 52 164 50 134 C48 104 64 52 100 52Z" fill="#fbf6ea" stroke="#2b2a33" stroke-width="3.5"/>
        <g fill="#7fb3c8"><circle cx="82" cy="92" r="4.5"/><circle cx="118" cy="80" r="3"/><circle cx="126" cy="122" r="5"/><circle cx="76" cy="138" r="3.5"/><circle cx="104" cy="152" r="2.6"/></g>
        <path d="M68 72 Q74 60 84 56" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g class="crack">
        <path d="M58 112 L72 102 L82 116 L96 100 L108 116 L122 102 L134 114 L144 106" fill="none" stroke="#2b2a33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M74 106 L82 116 L96 100 L108 116 L122 104 L120 110 L108 122 L96 108 L82 122 L74 112Z" fill="#2b2a33"/>
        <circle cx="88" cy="112" r="2.6" fill="#fff"/><circle cx="111" cy="113" r="2.6" fill="#fff"/>
      </g>
      <g class="chick"><g class="body">
        <g class="wings"><path class="wl" d="M62 150 Q36 140 40 118 Q58 124 66 136Z" fill="#e9a90f" stroke="#2b2a33" stroke-width="3" stroke-linejoin="round"/>
          <path class="wr" d="M138 150 Q164 140 160 118 Q142 124 134 136Z" fill="#e9a90f" stroke="#2b2a33" stroke-width="3" stroke-linejoin="round"/></g>
        <path class="tuft" d="M96 70 Q90 52 100 46 Q98 58 104 62 Q108 50 118 50 Q108 60 106 72" fill="#ffd23f" stroke="#2b2a33" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="100" cy="122" rx="48" ry="54" fill="#ffd23f" stroke="#2b2a33" stroke-width="3.5"/>
        <path d="M70 96 Q76 84 88 80" fill="none" stroke="#fff3b8" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="78" cy="122" rx="7" ry="4" fill="#f7a58a" opacity=".7"/><ellipse cx="122" cy="122" rx="7" ry="4" fill="#f7a58a" opacity=".7"/>
        <circle cx="84" cy="108" r="5" fill="#2b2a33"/><circle cx="116" cy="108" r="5" fill="#2b2a33"/><circle cx="85.6" cy="106.2" r="1.6" fill="#fff"/><circle cx="117.6" cy="106.2" r="1.6" fill="#fff"/>
        <path class="beakShut" d="M92 118 L108 118 L100 128Z" fill="#f28c28" stroke="#2b2a33" stroke-width="2.6" stroke-linejoin="round"/>
        <g class="beakOpen"><path d="M91 115 L109 115 L100 121Z" fill="#f28c28" stroke="#2b2a33" stroke-width="2.6" stroke-linejoin="round"/><path d="M93 124 L107 124 L100 132Z" fill="#f28c28" stroke="#2b2a33" stroke-width="2.6" stroke-linejoin="round"/><path d="M95 121 L105 121 L100 124Z" fill="#7a2b1c"/></g>
        <g class="hat"><path d="M84 72 L100 30 L116 72Z" fill="#17677a" stroke="#2b2a33" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="30" r="5" fill="#f28c28" stroke="#2b2a33" stroke-width="2.4"/><path d="M88 62 L112 62" stroke="#ffd23f" stroke-width="3"/></g>
      </g></g>
      <path class="shellB" d="M50 140 L62 128 L74 142 L88 128 L100 142 L112 128 L126 142 L138 128 L150 140 C148 168 126 180 100 180 C74 180 52 168 50 140Z" fill="#fbf6ea" stroke="#2b2a33" stroke-width="3.5" stroke-linejoin="round"/>
      <g class="shellT"><path d="M72 58 C80 40 120 40 128 58 L118 66 L108 56 L98 68 L88 56 L78 66Z" fill="#fbf6ea" stroke="#2b2a33" stroke-width="3.5" stroke-linejoin="round"/><circle cx="110" cy="50" r="2.6" fill="#7fb3c8"/></g>
    </svg>
    <div class="party" id="party"></div>
  </div>
  <form id="f">
    <label class="sr" for="inp">Say something to it</label>
    <input id="inp" maxlength="160" autocomplete="off" placeholder="teach it a word…">
    <button class="btn" type="submit">say</button>
  </form>
  <p class="stat" id="stat" aria-live="polite"><b>0</b> words · still an egg</p>
  <p class="hint" id="hint">it knows nothing yet. say something to it.</p>
  <ol class="log" id="log" aria-label="What you said and what it said back"></ol>
  <details id="dd" hidden><summary>its dictionary</summary><div class="dict" id="dict"></div></details>
</main>
<div class="ctl"><button type="button" id="snd" aria-label="Voice" aria-pressed="false" title="Voice off"></button></div>
<footer>everything it learns stays on this device · <button type="button" id="forget">forget everything</button><br>
  <span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-10-03</span></footer>
<script>
'use strict';
const $ = id => document.getElementById(id), stage = $('stage'), say$ = $('say'), inp = $('inp'), logEl = $('log');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = n => Math.random() * n | 0, pick = a => a[rnd(a.length)];
const STAGES = [[0, 'still an egg'], [1, 'cracking'], [5, 'a hatchling'], [20, 'a chick'], [60, 'a chatterbox']];
const LEN = [0, 2, 4, 8, 14];

/* its whole brain: word counts, which word follows which, how you start and end sentences */
let M = { v: {}, nx: {}, st: {}, en: {}, said: 0 }, log = [];
try { const o = JSON.parse(localStorage.getItem('hatch-brain') || 'null'); if (o && o.v && o.nx) M = Object.assign(M, o); log = JSON.parse(localStorage.getItem('hatch-log') || '[]').slice(-8); } catch (e) {}
function save() { try { localStorage.setItem('hatch-brain', JSON.stringify(M)); localStorage.setItem('hatch-log', JSON.stringify(log.slice(-8))); } catch (e) {} }
const nWords = () => Object.keys(M.v).length;
function stageOf(n) { let s = 0; STAGES.forEach((x, i) => { if (n >= x[0]) s = i; }); return s; }
const bump = (o, k) => { o[k] = (o[k] || 0) + 1; };
function toks(s) { return s.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*|\p{Extended_Pictographic}/gu) || []; }
function learn(text) {
  const fresh = [];
  text.split(/[.!?\n]+/).forEach(sent => {
    const t = toks(sent).slice(0, 40); if (!t.length) return;
    t.forEach((w, i) => {
      if (!M.v[w]) { if (nWords() >= 3000) return; fresh.push(w); }
      bump(M.v, w); if (i === 0) bump(M.st, w); if (i === t.length - 1) bump(M.en, w);
      if (i < t.length - 1) bump(M.nx[w] || (M.nx[w] = {}), t[i + 1]);
    });
  });
  return [...new Set(fresh)];
}
function wpick(o) { let tot = 0; for (const k in o) tot += o[k]; let r = Math.random() * tot; for (const k in o) if ((r -= o[k]) < 0) return k; return Object.keys(o)[0]; }

/* talking back, with nothing but your words */
function babble(heard, fresh) {
  const n = nWords(), s = stageOf(n); if (!n) return [];
  const known = heard.filter(w => M.v[w]);
  if (s === 1) {   /* cracking: it parrots one or two words, over and over */
    const w = fresh.length ? pick(fresh) : known.length ? pick(known) : wpick(M.v), out = [w];
    if (Math.random() < .7) out.push(Math.random() < .5 ? w : wpick(M.v));
    return out;
  }
  const max = LEN[s] - rnd(Math.ceil(LEN[s] / 2));
  let w = fresh.length && Math.random() < .55 ? pick(fresh) : known.length && Math.random() < .5 ? pick(known) : wpick(M.st), out = [w];
  while (out.length < max) {
    if (out.length >= 2 && M.en[w] && Math.random() < .3) break;
    const nx = M.nx[w];
    w = nx && Math.random() > .15 ? wpick(nx) : wpick(M.v);
    out.push(w);
  }
  return out;
}
function render(words, fresh) {
  if (!words.length) return '…';
  const s = stageOf(nWords()), end = pick(s < 2 ? ['!', '?', '…', '!!'] : ['.', '!', '?', '…', '!']);
  const esc = w => w.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const html = words.map(w => fresh.includes(w) ? `<span class="nw">${esc(w)}</span>` : esc(w));
  return s === 1 ? html.join(end + ' ') + end : html.join(' ') + end;
}

/* the screen */
function ui(celebrate) {
  const n = nWords(), s = stageOf(n), prev = +stage.dataset.stage;
  stage.dataset.stage = s;
  $('stat').innerHTML = `<b>${n}</b> word${n === 1 ? '' : 's'} · ${STAGES[s][1]}`;
  const next = STAGES[s + 1];
  $('hint').textContent = !n ? 'it knows nothing yet. say something to it.' : next ? `${next[0] - n} more new word${next[0] - n === 1 ? '' : 's'} until it's ${next[1]}` : 'it can say anything you\'ve ever taught it.';
  const top = Object.entries(M.v).sort((a, b) => b[1] - a[1]).slice(0, 1000), hi = top.length ? top[Math.min(top.length - 1, 9)][1] : 0;
  $('dict').innerHTML = top.map(([w, c]) => `<span class="${c >= hi && c > 1 ? 'big' : ''}">${w.replace(/[&<>"]/g, '')}</span>`).join('');
  $('dd').hidden = !n; $('dd').querySelector('summary').textContent = `its dictionary (${n})`;
  logEl.innerHTML = log.slice(-6).reverse().map(([who, t]) => `<li class="${who}"></li>`).join('');
  [...logEl.children].forEach((li, i) => li.textContent = log.slice(-6).reverse()[i][1]);
  if (celebrate && s > prev) party(s);
}
function party(s) {
  if (reduce) return; const p = $('party'); p.innerHTML = '';
  for (let i = 0; i < 26; i++) { const c = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 90;
    c.style.cssText = `background:${pick(['#ffd23f', '#17677a', '#f28c28', '#7fb3c8', '#f7a58a'])};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 40}px;--r:${rnd(540)}deg`; p.append(c); }
  stage.classList.add('flap'); setTimeout(() => { p.innerHTML = ''; stage.classList.remove('flap'); }, 1300);
  setTimeout(() => sayHtml(s === 2 ? '<span class="nw">!!!</span>' : s === 4 ? '<span class="nw">♪ ♪ ♪</span>' : '<span class="nw">!</span>'), 200);
}
function sayHtml(h) { say$.innerHTML = h; say$.classList.remove('pop'); void say$.offsetWidth; if (!reduce) say$.classList.add('pop'); }

/* a tiny voice, off until you turn it on */
let voice = false; try { voice = localStorage.getItem('hatch-voice') === '1'; } catch (e) {}
function sndUi() { const b = $('snd'); b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3.5 9.5h3.5l4.5-4v13l-4.5-4H3.5z" fill="currentColor" stroke="none"/>' + (voice ? '<path d="M15 9.2a4 4 0 0 1 0 5.6M17.8 6.5a8 8 0 0 1 0 11"/>' : '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>') + '</svg>';
  b.setAttribute('aria-pressed', voice ? 'true' : 'false'); b.title = voice ? 'Voice on' : 'Voice off'; }
$('snd').addEventListener('click', () => { voice = !voice; try { localStorage.setItem('hatch-voice', voice ? '1' : '0'); } catch (e) {} sndUi(); if (!voice && 'speechSynthesis' in window) speechSynthesis.cancel(); });
function speak(words) {
  if (!voice || !('speechSynthesis' in window) || !words.length) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(words.join(' ')); u.pitch = 1.9; u.rate = 1.15 - stageOf(nWords()) * .03; speechSynthesis.speak(u); } catch (e) {}
}

/* a conversation */
let busy = false;
$('f').addEventListener('submit', e => {
  e.preventDefault(); const t = inp.value.trim().slice(0, 160); if (!t || busy) return; inp.value = '';
  const heard = toks(t), fresh = learn(t); M.said++;
  log.push(['you', t]); save(); ui(true);
  if (!heard.length) { sayHtml('…?'); return; }
  busy = true; sayHtml('<span aria-label="thinking">·  ·  ·</span>');
  if (stageOf(nWords()) < 2) { stage.classList.add('wobble'); setTimeout(() => stage.classList.remove('wobble'), 1300); }
  setTimeout(() => {
    const words = babble(heard, fresh), h = render(words, fresh);
    sayHtml(h); speak(words); busy = false;
    if (words.length) { log.push(['it', say$.textContent]); save(); ui(false); }
    stage.classList.add('talk'); setTimeout(() => stage.classList.remove('talk'), 450 + words.length * 260);
  }, 650 + rnd(500));
});
$('stage').addEventListener('click', () => {
  if (busy) return; const n = nWords();
  if (!n) { stage.classList.add('wobble'); setTimeout(() => stage.classList.remove('wobble'), 1300); sayHtml('…'); return; }
  const words = babble([], []); sayHtml(render(words, [])); speak(words);
  stage.classList.add('talk'); setTimeout(() => stage.classList.remove('talk'), 450 + words.length * 260);
});
let sure = 0;
$('forget').addEventListener('click', () => {
  const b = $('forget');
  if (!sure) { sure = 1; b.textContent = 'tap again to forget every word'; setTimeout(() => { sure = 0; b.textContent = 'forget everything'; }, 4000); return; }
  sure = 0; b.textContent = 'forget everything'; M = { v: {}, nx: {}, st: {}, en: {}, said: 0 }; log = [];
  try { localStorage.removeItem('hatch-brain'); localStorage.removeItem('hatch-log'); } catch (e) {}
  ui(false); sayHtml('…');
});
sndUi(); ui(false);
if (nWords()) { const w = babble([], []); say$.innerHTML = render(w, []); }
window.__WH = { M: () => M, babble, stageOf, nWords };
</script>
</body>
</html>
