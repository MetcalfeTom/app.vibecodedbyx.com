<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#07060d">
<meta property="og:type" content="website">

<meta property="og:description" content="Pool in deep space. Planets bend your shots. The pockets are black holes.">

<meta property="og:image" content="https://sloppy.live/black-hole-billiards/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%8E%B1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Martian+Mono:wght@200;400;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e3f5;--muted:#9a93b3;--neon:#ff5ad1;--cyan:#5ff2e6;--brass:#d6a55a;--night:#07060d;--panel:rgba(14,11,26,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:"Martian Mono",ui-monospace,monospace;overflow:hidden}
body{background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff6 50%,transparent 51%),
  radial-gradient(1px 1px at 38% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 66%,#fff7 50%,transparent 51%),
  radial-gradient(60% 50% at 80% 10%,#2a0f3a 0%,transparent 70%),radial-gradient(50% 60% at 10% 90%,#0b2b33 0%,transparent 70%),var(--night)}
.wrap{display:flex;flex-direction:column;height:100%;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(17px,2.6vw,28px);margin:0;color:var(--neon);letter-spacing:.04em;
  text-shadow:0 0 6px #ff5ad1aa,0 0 18px #ff5ad155;white-space:nowrap}
.hud{flex:1;display:flex;gap:14px;align-items:baseline;justify-content:center;font-size:12px;color:var(--muted);min-width:0}
.hud b{font-weight:800;color:var(--ink);font-size:14px}
.hud .lvl{color:var(--cyan);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
button{font:inherit;color:var(--ink);background:#15112a;border:1px solid #3a3160;border-radius:999px;min-height:40px;min-width:40px;padding:0 14px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--cyan)}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.stage{position:relative;flex:1;min-height:0;margin-top:6px}
canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:18px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid #3a3160;border-radius:12px;
  padding:8px 14px;font-size:12px;max-width:min(92%,520px);text-align:center;pointer-events:none;transition:opacity .5s}
.toast.off{opacity:0}
.panel[hidden]{display:none}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:var(--panel);border:1px solid #3a3160;border-radius:20px;padding:22px 22px 18px;width:min(94%,560px);max-height:94%;overflow:auto;
  box-shadow:0 0 0 1px #ff5ad122,0 30px 80px #000c;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.card h2{font-family:Monoton,cursive;font-weight:400;color:var(--neon);font-size:clamp(24px,5vw,40px);margin:0 0 4px;line-height:1.15}
.card p{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0 14px;font-weight:200}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid button{border-radius:14px;min-height:64px;text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.grid .n{font-size:10px;color:var(--muted)}
.grid .st{color:var(--brass);letter-spacing:2px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .main{background:var(--neon);border-color:var(--neon);color:#1a0616;font-weight:800}
.big{font-size:44px;color:var(--brass);letter-spacing:8px;margin:4px 0}
.stats{font-size:13px;margin:4px 0 8px}
.stats b{font-weight:800}
#buildstamp{display:block;margin-top:14px;font-size:10px;opacity:.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){header{gap:6px}.hud{order:3;flex-basis:100%;justify-content:space-between}.tools button{padding:0 10px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Black Hole Billiards</h1>
  <div class="hud" aria-label="Game status">
    <span class="lvl" id="lvlName">Flat Space</span>
    <span>shots <b id="shots">0</b> / par <b id="par">3</b></span>
    <span>left <b id="left">3</b></span>
  </div>
  <div class="tools">
    <button id="menuBtn" aria-label="Choose a table">Tables</button>
    <button id="resetBtn" aria-label="Restart this table">&#8634;</button>
    <button id="soundBtn" aria-label="Sound on" aria-pressed="true">&#9835;</button>
  </div>
</header>
<div class="stage" id="stage">
  <canvas id="table" tabindex="0" role="img" aria-label="Billiard table in space. Drag back from anywhere and release to shoot. Keyboard: arrows aim and set power, space shoots."></canvas>
  <div class="toast off" id="toast" aria-hidden="true"></div>
  <div class="panel" id="panel" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="card"></div>
  </div>
</div>
<div class="sr" aria-live="polite" id="live"></div>
</div>
<script>
(function(){
'use strict';
var W=1000,H=500,RAIL=46,BR=13,DT=1/480;
var MU=170,MUS=420,REST=6,ER=.94,EC=.76,VMAX=1750,PULL=300;
var POCKETS=[[0,0,30],[W/2,-9,26],[W,0,30],[0,H,30],[W/2,H+9,26],[W,H,30]],CM=34,SM=24;
var COL=['#f4f1e8','#f5c518','#2464e0','#e0352b','#7b46c9','#f07c1c','#1fa65f','#8a2433','#1a1a20','#f5c518'];

function rack(x,y,rows){var o=[],i,j,dx=BR*2*.866+.6;for(i=0;i<rows;i++)for(j=0;j<=i;j++)o.push([x+i*dx,y+(j-i/2)*(BR*2+.6)]);return o;}
var LV=[
 {name:'Flat Space',hint:'Pull back from anywhere on the table and let go to shoot.',par:3,cue:[240,250],balls:rack(700,250,2),bodies:[]},
 {name:'Pale Moon',hint:'Moons pull on passing balls. Slow shots bend the most.',par:5,cue:[190,250],balls:rack(770,250,2).concat([[640,95],[640,405]]),
  bodies:[{k:'moon',x:500,y:250,R:36,M:6e6}]},
 {name:'Binary Stars',hint:'Two suns, two pulls. Thread the gap or swing around the outside.',par:6,cue:[160,400],balls:rack(800,250,2).concat([[250,100],[720,440]]),
  bodies:[{k:'star',x:400,y:160,R:26,M:5e6,c:'#ffd27a'},{k:'star',x:600,y:340,R:26,M:5e6,c:'#9cc9ff'}]},
 {name:'Asteroid Belt',hint:'Rocks have no pull, but they bounce you hard.',par:7,cue:[200,250],balls:rack(730,250,3),
  bodies:[{k:'rock',x:470,y:62,R:18},{k:'rock',x:522,y:152,R:22},{k:'rock',x:478,y:250,R:16},{k:'rock',x:530,y:345,R:24},{k:'rock',x:468,y:440,R:17}]},
 {name:'Gas Giant',hint:'Big planet, big pull. A ball that stops close to it stays parked.',par:7,cue:[140,250],balls:[[820,100],[860,250],[820,400],[260,80],[260,420],[340,250]],
  bodies:[{k:'giant',x:580,y:250,R:62,M:1.2e7}]},
 {name:'Slingshot',hint:'No straight line to the pack. Swing around the star.',par:8,cue:[120,250],balls:rack(830,250,3),
  bodies:[{k:'star',x:500,y:250,R:44,M:1.6e7,c:'#ffb35c'}]},
 {name:'Event Horizon',hint:'A loose black hole sits mid-table. It eats balls too, the cue ball included.',par:7,cue:[150,250],hungry:1,
  balls:[[300,90],[300,410],[700,90],[700,410],[820,250],[843,237],[843,263]],bodies:[{k:'hole',x:500,y:250,R:16,M:7e6}]},
 {name:'Moon Cue',hint:'Your cue ball is a moon now. Balls it passes get tugged along behind it.',par:7,cue:[170,250],cueM:3e6,
  balls:[[470,130],[470,370],[640,250],[790,110],[790,390],[900,250]],bodies:[]}
];

/* ---------- state ---------- */
var st={lv:0,balls:[],bodies:[],shots:0,mode:'aim',roll:0,falling:[],scratch:false,ang:0,pow:.55,aiming:false,kbd:false,t:0},best={};
try{best=JSON.parse(localStorage.getItem('bhb.best')||'{}')||{};}catch(e){best={};}
var $=function(id){return document.getElementById(id);},cv=$('table'),g=cv.getContext('2d');

function load(i){var L=LV[i];st.lv=i;st.shots=0;st.mode='aim';st.falling=[];st.scratch=false;st.roll=0;
  st.bodies=L.bodies.map(function(b){var o={};for(var k in b)o[k]=b[k];o.M=o.M||0;o.seed=Math.round(o.x*7+o.y*13);return o;});
  st.pm=L.hungry?9e5:2.5e5;st.pr=L.hungry?110:80;
  st.balls=[mk(0,L.cue[0],L.cue[1])].concat(L.balls.map(function(p,j){return mk(j+1,p[0],p[1]);}));
  st.balls.forEach(function(b){var a=accel(b.x,b.y);b.rest=Math.hypot(a[0],a[1])<MUS;});
  var cue=st.balls[0],tgt=st.balls[1];st.ang=Math.atan2(tgt.y-cue.y,tgt.x-cue.x);st.pow=.55;
  bake();hud();toast(L.hint,7000);say('Table '+(i+1)+', '+L.name+'. '+L.hint);}
function mk(n,x,y){return {n:n,x:x,y:y,vx:0,vy:0,alive:true,rest:true};}

/* ---------- physics ---------- */
function accel(x,y){var ax=0,ay=0,i,o,dx,dy,d2,f;
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];if(!o.M)continue;dx=o.x-x;dy=o.y-y;d2=dx*dx+dy*dy+400;f=o.M/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}
  for(i=0;i<6;i++){dx=POCKETS[i][0]-x;dy=POCKETS[i][1]-y;d2=dx*dx+dy*dy;if(d2<st.pr*st.pr){d2+=100;f=st.pm/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}}
  return [ax,ay];}
function move(b,dt,pred){var a=accel(b.x,b.y),sp,dec,i,o,dx,dy,d,an,vn;
  /* resting on a planet: the surface holds it, so drop the inward pull and inward speed */
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];if(o.k==='hole')continue;dx=b.x-o.x;dy=b.y-o.y;d=Math.hypot(dx,dy);
    if(d<o.R+BR+1.5){dx/=d;dy/=d;an=a[0]*dx+a[1]*dy;if(an<0){a[0]-=an*dx;a[1]-=an*dy;}vn=b.vx*dx+b.vy*dy;if(vn<0&&vn>-40){b.vx-=vn*dx;b.vy-=vn*dy;}}}b.vx+=a[0]*dt;b.vy+=a[1]*dt;sp=Math.hypot(b.vx,b.vy);dec=MU*dt;
  if(sp>dec){b.vx*=(sp-dec)/sp;b.vy*=(sp-dec)/sp;}else{b.vx=0;b.vy=0;}
  if(sp<REST&&Math.hypot(a[0],a[1])+(b.ex||0)<MUS){b.vx=0;b.vy=0;b.rest=true;return 0;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;return sp;}
function cushions(b){var hit=0;
  if(b.y<BR&&!(b.x<CM||b.x>W-CM||Math.abs(b.x-W/2)<SM)){b.y=BR;if(b.vy<0){hit=-b.vy;b.vy=-b.vy*EC;}}
  if(b.y>H-BR&&!(b.x<CM||b.x>W-CM||Math.abs(b.x-W/2)<SM)){b.y=H-BR;if(b.vy>0){hit=b.vy;b.vy=-b.vy*EC;}}
  if(b.x<BR&&!(b.y<CM||b.y>H-CM)){b.x=BR;if(b.vx<0){hit=-b.vx;b.vx=-b.vx*EC;}}
  if(b.x>W-BR&&!(b.y<CM||b.y>H-CM)){b.x=W-BR;if(b.vx>0){hit=b.vx;b.vx=-b.vx*EC;}}
  return hit;}
function bodyHit(b){var i,o,dx,dy,d,nx,ny,vn;
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];dx=b.x-o.x;dy=b.y-o.y;d=Math.hypot(dx,dy);
    if(o.k==='hole'){if(d<o.R)return {hole:o};continue;}
    if(d<o.R+BR){nx=dx/d;ny=dy/d;b.x=o.x+nx*(o.R+BR);b.y=o.y+ny*(o.R+BR);vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+EC)*vn*nx;b.vy-=(1+EC)*vn*ny;return {bump:-vn};}}}
  return null;}
function pocketed(b){var i,p,dx,dy;for(i=0;i<6;i++){p=POCKETS[i];dx=b.x-p[0];dy=b.y-p[1];if(dx*dx+dy*dy<(p[2]-4)*(p[2]-4))return p;}
  if(b.x<-26||b.x>W+26||b.y<-26||b.y>H+26){var bi=0,bd=1e9;for(i=0;i<6;i++){p=POCKETS[i];dx=b.x-p[0];dy=b.y-p[1];if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;bi=i;}}return POCKETS[bi];}
  return null;}

function step(){var bs=st.balls,i,j,a,b,dx,dy,d,nx,ny,rel,jm,ov,h,p,moving=false,cm=LV[st.lv].cueM,c=bs[0],f;
  /* Tatum's moon cue: the cue ball pulls the others (a ball touching it is held by contact) */
  if(cm&&c.alive)for(i=1;i<bs.length;i++){b=bs[i];b.ex=0;if(!b.alive)continue;dx=c.x-b.x;dy=c.y-b.y;d=dx*dx+dy*dy;if(d<(2*BR+1.5)*(2*BR+1.5))continue;
    d+=400;f=cm/(d*Math.sqrt(d));b.ex=Math.sqrt(dx*dx+dy*dy)*f;if(b.rest){if(b.ex<MUS)continue;b.rest=false;}b.vx+=dx*f*DT;b.vy+=dy*f*DT;}
  for(i=0;i<bs.length;i++){b=bs[i];if(!b.alive||b.rest)continue;move(b,DT);if(!b.rest)moving=true;}
  for(i=0;i<bs.length;i++){a=bs[i];if(!a.alive)continue;
    for(j=i+1;j<bs.length;j++){b=bs[j];if(!b.alive)continue;dx=b.x-a.x;dy=b.y-a.y;d=dx*dx+dy*dy;if(d>=4*BR*BR||d===0)continue;d=Math.sqrt(d);
      nx=dx/d;ny=dy/d;ov=(2*BR-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel>0){jm=rel*(1+ER)/2;a.vx-=jm*nx;a.vy-=jm*ny;b.vx+=jm*nx;b.vy+=jm*ny;a.rest=b.rest=false;moving=true;sfx.clack(rel);}}}
  for(i=0;i<bs.length;i++){b=bs[i];if(!b.alive||b.rest)continue;
    h=cushions(b);if(h>40)sfx.thud(h);
    h=bodyHit(b);if(h&&h.hole){swallow(b,h.hole.x,h.hole.y);continue;}if(h&&h.bump>40)sfx.thud(h.bump);
    p=pocketed(b);if(p)swallow(b,p[0],p[1]);}
  return moving;}
function swallow(b,x,y){b.alive=false;b.rest=true;st.falling.push({n:b.n,x:b.x,y:b.y,cx:x,cy:y,t:0});sfx.gulp();
  if(b.n===0){st.scratch=true;say('Scratch. The cue ball fell in, plus one shot.');}
  else say('Ball '+b.n+' swallowed. '+left()+' left.');hud();}
function left(){var c=0;st.balls.forEach(function(b){if(b.n&&b.alive)c++;});return c;}

/* aim preview: the cue ball alone, to its first contact */
function predict(vx,vy){var b={x:st.balls[0].x,y:st.balls[0].y,vx:vx,vy:vy,rest:false},pts=[],len=0,lx=b.x,ly=b.y,i,k,o,dx,dy,cap=st.lv<4?620:420,dt=1/240;
  for(k=0;k<2600&&len<cap;k++){move(b,dt,1);if(b.rest)break;cushions(b);var bh=bodyHit(b);if(bh&&bh.hole)break;
    for(i=1;i<st.balls.length;i++){o=st.balls[i];if(!o.alive)continue;dx=o.x-b.x;dy=o.y-b.y;if(dx*dx+dy*dy<4*BR*BR){pts.push([b.x,b.y]);return {pts:pts,hit:{x:b.x,y:b.y,o:o}};}}
    if(pocketed(b))break;len+=Math.hypot(b.x-lx,b.y-ly);lx=b.x;ly=b.y;if(k%3===0)pts.push([b.x,b.y]);}
  return {pts:pts};}

/* ---------- turn flow ---------- */
function shoot(){if(st.mode!=='aim')return;var c=st.balls[0];sfx.init();
  c.vx=Math.cos(st.ang)*st.pow*VMAX;c.vy=Math.sin(st.ang)*st.pow*VMAX;c.rest=false;sfx.clack(st.pow*VMAX*.8);
  st.shots++;st.mode='roll';st.roll=0;st.kbd=false;hideToast();hud();}
function settle(){var c=st.balls[0];
  if(st.scratch){st.shots++;st.scratch=false;c.alive=true;c.vx=c.vy=0;c.rest=true;var L=LV[st.lv],sp=free(L.cue[0],L.cue[1]);c.x=sp[0];c.y=sp[1];toast('Scratch: +1 shot. The cue ball is back on its spot.',3500);}
  st.mode='aim';hud();
  if(!left())finish();}
function free(x,y){for(var r=0;r<400;r+=6)for(var a=0;a<6.28;a+=.5){var px=x+Math.cos(a)*r,py=y+Math.sin(a)*r,ok=px>BR&&px<W-BR&&py>BR&&py<H-BR;
  st.balls.forEach(function(b){if(b.n&&b.alive&&Math.hypot(b.x-px,b.y-py)<2*BR+2)ok=false;});
  st.bodies.forEach(function(o){if(Math.hypot(o.x-px,o.y-py)<o.R+BR+4)ok=false;});if(ok)return [px,py];}return [x,y];}
function stars(sh,par){return sh<=par?3:sh<=par+2?2:1;}
function finish(){var L=LV[st.lv],s=stars(st.shots,L.par),prev=best[st.lv];st.mode='done';
  if(!prev||st.shots<prev){best[st.lv]=st.shots;try{localStorage.setItem('bhb.best',JSON.stringify(best));}catch(e){}}
  sfx.win();var last=st.lv===LV.length-1;
  show('<h2 id="pTitle">Table cleared</h2><div class="big" aria-label="'+s+' of 3 stars">'+'★★★☆☆☆'.substr(3-s,3)+'</div>'+
    '<div class="stats">'+L.name+': <b>'+st.shots+'</b> shots, par <b>'+L.par+'</b>'+(prev&&st.shots<prev?' · new best':'')+'</div>'+
    '<p>'+(s===3?'Clean as a vacuum.':s===2?'Close. One tighter curve and it’s three stars.':'Cleared. The black holes thank you for the snack.')+'</p>'+
    '<div class="row">'+(last?'<button class="main" data-go="menu">All tables</button>':'<button class="main" data-go="next">Next table</button>')+'<button data-go="again">Play again</button>'+(last?'':'<button data-go="menu">All tables</button>')+'</div>');
  say('Table cleared in '+st.shots+' shots, '+s+' stars.');}

/* ---------- view ---------- */
var dpr=1,cw=0,ch=0,sc=1,rot=false,felt=null;
function resize(){var r=cv.getBoundingClientRect();cw=r.width;ch=r.height;dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.max(1,Math.round(ch*dpr));rot=ch>cw*1.05;
  var VW=W+2*RAIL+8,VH=H+2*RAIL+8;sc=rot?Math.min(cw/VH,ch/VW):Math.min(cw/VW,ch/VH);bake();}
function view(){g.setTransform(dpr,0,0,dpr,0,0);g.translate(cw/2,ch/2);if(rot)g.rotate(Math.PI/2);g.scale(sc,sc);g.translate(-W/2,-H/2);}
function toWorld(px,py){var x=px-cw/2,y=py-ch/2,t;if(rot){t=x;x=y;y=-t;}return [x/sc+W/2,y/sc+H/2];}
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}

function bake(){if(!sc)return;var k=sc*dpr,c=document.createElement('canvas'),x;c.width=Math.ceil((W+2*RAIL)*k);c.height=Math.ceil((H+2*RAIL)*k);
  x=c.getContext('2d');x.scale(k,k);x.translate(RAIL,RAIL);
  /* rails */
  var rg=x.createLinearGradient(0,-RAIL,0,H+RAIL);rg.addColorStop(0,'#3b2a18');rg.addColorStop(.5,'#1d140c');rg.addColorStop(1,'#3b2a18');
  x.fillStyle=rg;rr(x,-RAIL,-RAIL,W+2*RAIL,H+2*RAIL,26);x.fill();
  x.strokeStyle='#d6a55a55';x.lineWidth=1.5;rr(x,-RAIL+5,-RAIL+5,W+2*RAIL-10,H+2*RAIL-10,22);x.stroke();
  x.fillStyle='#e8c07a';for(var i=1;i<8;i++){if(i===4)continue;dia(x,W*i/8,-RAIL/2);dia(x,W*i/8,H+RAIL/2);}for(i=1;i<4;i++){dia(x,-RAIL/2,H*i/4);dia(x,W+RAIL/2,H*i/4);}
  /* space felt */
  var fg=x.createRadialGradient(W/2,H/2,20,W/2,H/2,W*.62);fg.addColorStop(0,'#123a44');fg.addColorStop(1,'#08161f');x.fillStyle=fg;x.fillRect(0,0,W,H);
  var R=rnd(7+st.lv*131),j;x.globalCompositeOperation='lighter';
  for(j=0;j<3;j++){var nx=R()*W,ny=R()*H,nb=x.createRadialGradient(nx,ny,0,nx,ny,180+R()*160);nb.addColorStop(0,j%2?'rgba(120,30,110,.22)':'rgba(30,110,140,.2)');nb.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=nb;x.fillRect(0,0,W,H);}
  for(j=0;j<260;j++){x.fillStyle='rgba(255,255,255,'+(.15+R()*.5).toFixed(2)+')';var s=R()<.93?.9:1.8;x.fillRect(R()*W,R()*H,s,s);}

  function warp(px,py){var ox=0,oy=0;st.bodies.forEach(function(o){if(!o.M)return;var dx=o.x-px,dy=o.y-py,d=Math.hypot(dx,dy)+1e-3,s=Math.min(d*.55,o.M/1e7*2600/(d+50));ox+=dx/d*s;oy+=dy/d*s;});return [px+ox,py+oy];}

  seg(x,CM,0,W/2-SM,0);seg(x,W/2+SM,0,W-CM,0);seg(x,CM,H,W/2-SM,H);seg(x,W/2+SM,H,W-CM,H);seg(x,0,CM,0,H-CM);seg(x,W,CM,W,H-CM);

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function dia(x,a,b){x.beginPath();x.moveTo(a,b-4);x.lineTo(a+3,b);x.lineTo(a,b+4);x.lineTo(a-3,b);x.closePath();x.fill();}

var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function hole(x,y,r,t){var sp=RM?0:t*1.6,i;
  var gl=g.createRadialGradient(x,y,r*.5,x,y,r*1.5);gl.addColorStop(0,'rgba(255,150,60,.35)');gl.addColorStop(.5,'rgba(255,90,209,.12)');gl.addColorStop(1,'rgba(255,90,209,0)');
  g.fillStyle=gl;g.beginPath();g.arc(x,y,r*1.5,0,7);g.fill();
  g.lineCap='round';for(i=0;i<3;i++){g.strokeStyle=i===1?'rgba(255,90,209,.6)':'rgba(255,190,110,.75)';g.lineWidth=r*(.1-.02*i);
    g.beginPath();g.arc(x,y,r*(.78+i*.13),sp*(1-i*.25)+i*2.1,sp*(1-i*.25)+i*2.1+2.4);g.stroke();}
  g.fillStyle='#000';g.beginPath();g.arc(x,y,r*.62,0,7);g.fill();g.strokeStyle='rgba(255,230,190,.9)';g.lineWidth=1.2;g.beginPath();g.arc(x,y,r*.64,0,7);g.stroke();}
function body(o,t){var x=o.x,y=o.y,R=o.R,gr,i,r;
  if(o.k==='hole'){hole(x,y,R*1.9,t);return;}
  if(o.k==='star'){var pul=RM?1:1+.04*Math.sin(t*3+o.x);gr=g.createRadialGradient(x,y,R*.3,x,y,R*2.6*pul);gr.addColorStop(0,o.c);gr.addColorStop(.35,o.c+'66');gr.addColorStop(1,o.c+'00');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,R*2.6*pul,0,7);g.fill();gr=g.createRadialGradient(x-R*.3,y-R*.3,1,x,y,R);gr.addColorStop(0,'#fff');gr.addColorStop(.6,o.c);gr.addColorStop(1,o.c);
    g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill();return;}
  if(o.k==='rock'){r=rnd(o.seed+3);g.fillStyle='#6b5d52';g.beginPath();for(i=0;i<11;i++){var a=i/11*6.283,rr2=R*(.86+r()*.28);i?g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2):g.moveTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}
    g.closePath();g.fill();gr=g.createRadialGradient(x-R*.4,y-R*.4,1,x,y,R*1.1);gr.addColorStop(0,'rgba(255,240,220,.35)');gr.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=gr;g.fill();
    g.fillStyle='rgba(0,0,0,.25)';for(i=0;i<3;i++){g.beginPath();g.arc(x+(r()-.5)*R,y+(r()-.5)*R,R*(.12+r()*.12),0,7);g.fill();}return;}
  g.save();g.beginPath();g.arc(x,y,R,0,7);g.clip();
  if(o.k==='giant'){var bands=['#d9a066','#b9774a','#e8c894','#a8603c','#dcb07a','#c98b58','#efd6a8'];for(i=0;i<14;i++){g.fillStyle=bands[i%7];g.fillRect(x-R,y-R+i*R/7,2*R,R/7+1);}
    g.fillStyle='rgba(170,70,40,.7)';g.beginPath();g.ellipse(x+R*.3,y+R*.25,R*.22,R*.11,0,0,7);g.fill();}
  else{g.fillStyle='#b9b6ae';g.fillRect(x-R,y-R,2*R,2*R);r=rnd(o.seed);g.fillStyle='rgba(80,78,74,.35)';for(i=0;i<9;i++){g.beginPath();g.arc(x+(r()-.5)*1.6*R,y+(r()-.5)*1.6*R,R*(.08+r()*.2),0,7);g.fill();}}
  gr=g.createRadialGradient(x-R*.45,y-R*.45,R*.1,x,y,R*1.05);gr.addColorStop(0,'rgba(255,255,255,.25)');gr.addColorStop(.7,'rgba(0,0,0,.15)');gr.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=gr;g.fillRect(x-R,y-R,2*R,2*R);
  g.restore();
  if(o.k==='giant'){g.strokeStyle='rgba(235,210,170,.55)';g.lineWidth=5;g.beginPath();g.ellipse(x,y,R*1.7,R*.42,-.35,0,7);g.stroke();
    g.strokeStyle='rgba(235,210,170,.25)';g.lineWidth=9;g.beginPath();g.ellipse(x,y,R*1.95,R*.52,-.35,0,7);g.stroke();}}
function ball(n,x,y,s,moving){var r=BR*(s==null?1:s),c=COL[n]||'#ccc',gr;
  if(n===0&&moving){var sp=Math.hypot(moving[0],moving[1]);if(sp>80){var tx=x-moving[0]/sp*r*4.5,ty=y-moving[1]/sp*r*4.5;gr=g.createLinearGradient(x,y,tx,ty);gr.addColorStop(0,'rgba(170,240,255,.5)');gr.addColorStop(1,'rgba(170,240,255,0)');
    g.strokeStyle=gr;g.lineWidth=r*1.4;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(tx,ty);g.stroke();}}
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+2,y+3,r,0,7);g.fill();
  g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  if(n===0&&LV[st.lv].cueM){var cr=rnd(99);g.fillStyle='#b9b6ae';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='rgba(80,78,74,.4)';
    for(var q=0;q<5;q++){g.beginPath();g.arc(x+(cr()-.5)*1.3*r,y+(cr()-.5)*1.3*r,r*(.12+cr()*.18),0,7);g.fill();}
    if(s==null||s===1){g.strokeStyle='rgba(200,220,255,.18)';g.setLineDash([2,6]);g.lineWidth=1;g.beginPath();g.arc(x,y,Math.sqrt(LV[st.lv].cueM/MUS),0,7);g.stroke();g.setLineDash([]);}}
  if(n>0&&r>5){g.fillStyle='#f7f3ea';g.beginPath();g.arc(x,y,r*.5,0,7);g.fill();g.fillStyle='#16121e';g.font='800 '+(r*.62).toFixed(1)+'px "Martian Mono",monospace';g.textAlign='center';g.textBaseline='middle';

  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}

function render(){var t=st.t,i,b,c=st.balls[0];g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);view();
  if(felt)g.drawImage(felt,-RAIL,-RAIL,W+2*RAIL,H+2*RAIL);
  for(i=0;i<6;i++)hole(POCKETS[i][0],POCKETS[i][1],POCKETS[i][2]+(i%3===1?2:4),t+i);
  st.bodies.forEach(function(o){body(o,t);});
  var showAim=st.mode==='aim'&&c.alive&&(st.aiming||st.kbd);
  if(showAim){var pr=predict(Math.cos(st.ang)*st.pow*VMAX,Math.sin(st.ang)*st.pow*VMAX);
    g.fillStyle='#5ff2e6';pr.pts.forEach(function(p,k){g.globalAlpha=Math.max(.08,.85-k/pr.pts.length*.8);g.beginPath();g.arc(p[0],p[1],1.9,0,7);g.fill();});g.globalAlpha=1;
    if(pr.hit){var h=pr.hit,dx=h.o.x-h.x,dy=h.o.y-h.y,d=Math.hypot(dx,dy);g.strokeStyle='rgba(95,242,230,.8)';g.lineWidth=1.3;g.setLineDash([3,3]);g.beginPath();g.arc(h.x,h.y,BR,0,7);g.stroke();g.setLineDash([]);
      g.strokeStyle='rgba(255,255,255,.45)';g.beginPath();g.moveTo(h.o.x,h.o.y);g.lineTo(h.o.x+dx/d*70,h.o.y+dy/d*70);g.stroke();}}
  for(i=0;i<st.balls.length;i++){b=st.balls[i];if(b.alive)ball(b.n,b.x,b.y,1,b.rest?null:[b.vx,b.vy]);}
  st.falling.forEach(function(f){var k=Math.min(1,f.t/.6),e=k*k,a=k*9;var x=f.cx+(f.x-f.cx)*(1-e)*Math.cos(a),y=f.cy+(f.y-f.cy)*(1-e)*Math.sin(a+1.57)*-1;
    x=f.cx+((f.x-f.cx)*Math.cos(a)-(f.y-f.cy)*Math.sin(a))*(1-e);y=f.cy+((f.x-f.cx)*Math.sin(a)+(f.y-f.cy)*Math.cos(a))*(1-e);ball(f.n,x,y,1-e*.9);});
  if(showAim){var ux=Math.cos(st.ang),uy=Math.sin(st.ang),back=BR+8+st.pow*46,sx=c.x-ux*back,sy=c.y-uy*back,ex=c.x-ux*(back+300),ey=c.y-uy*(back+300);
    var sg=g.createLinearGradient(sx,sy,ex,ey);sg.addColorStop(0,'#eafcff');sg.addColorStop(.02,'#5ff2e6');sg.addColorStop(.05,'#f1dcb2');sg.addColorStop(.6,'#c89454');sg.addColorStop(.62,'#ff5ad1');sg.addColorStop(.66,'#2a1a10');sg.addColorStop(1,'#140c07');
    g.strokeStyle=sg;g.lineCap='round';g.lineWidth=6;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke();
    g.strokeStyle='rgba(255,90,209,.9)';g.lineWidth=3;g.beginPath();g.arc(c.x,c.y,BR+7,-Math.PI/2,-Math.PI/2+st.pow*6.283);g.stroke();}
  g.setTransform(1,0,0,1,0,0);}

/* ---------- loop ---------- */
var last=0,acc=0;
function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;st.t+=dt;
  if(st.mode==='roll'){acc+=dt;st.roll+=dt;var n=0,mv=true;while(acc>=DT&&n<60){mv=step();acc-=DT;n++;}if(n>=60)acc=0;
    if(st.roll>22)st.balls.forEach(function(b){b.vx=b.vy=0;b.rest=true;});
    if(st.balls.every(function(b){return !b.alive||b.rest;})&&!st.falling.some(function(f){return f.t<.6;})){acc=0;settle();}}
  st.falling.forEach(function(f){f.t+=dt;});st.falling=st.falling.filter(function(f){return f.t<.7;});
  render();requestAnimationFrame(frame);}

/* ---------- input ---------- */
var drag=null;
function pos(e){var r=cv.getBoundingClientRect();return toWorld(e.clientX-r.left,e.clientY-r.top);}
cv.addEventListener('pointerdown',function(e){if(st.mode!=='aim')return;sfx.init();drag={p:pos(e),id:e.pointerId};st.aiming=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==drag.id)return;var p=pos(e),dx=drag.p[0]-p[0],dy=drag.p[1]-p[1],d=Math.hypot(dx,dy);
  if(d<8){st.aiming=false;return;}st.aiming=true;st.ang=Math.atan2(dy,dx);st.pow=Math.min(1,d/PULL);});
function up(e){if(!drag||e.pointerId!==drag.id)return;drag=null;if(st.aiming){st.aiming=false;shoot();}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(){drag=null;st.aiming=false;});
cv.addEventListener('keydown',function(e){if(st.mode!=='aim')return;var k=e.key,f=e.shiftKey?.2:1;
  if(k==='ArrowLeft'){st.ang-=f*Math.PI/180;}else if(k==='ArrowRight'){st.ang+=f*Math.PI/180;}
  else if(k==='ArrowUp'){st.pow=Math.min(1,st.pow+.05);}else if(k==='ArrowDown'){st.pow=Math.max(.05,st.pow-.05);}
  else if(k===' '||k==='Enter'){e.preventDefault();if(st.kbd)shoot();else st.kbd=true;return;}else return;
  e.preventDefault();st.kbd=true;});

/* ---------- ui ---------- */
function hud(){var L=LV[st.lv];$('lvlName').textContent=(st.lv+1)+'. '+L.name;$('shots').textContent=st.shots;$('par').textContent=L.par;$('left').textContent=left();}

function say(s){$('live').textContent=s;}
var lastFocus=null;
function show(html){lastFocus=document.activeElement;$('card').innerHTML=html;$('panel').hidden=false;var b=$('card').querySelector('button');if(b)b.focus();}
function hide(){$('panel').hidden=true;cv.focus();}
function menu(first){var h='<h2 id="pTitle">'+(first?'Black Hole Billiards':'Tables')+'</h2><p>Pool on a table adrift in space. Planets and stars bend every shot, and each pocket is a black hole. Clear the table in as few shots as you can.</p><div class="grid">';
  LV.forEach(function(L,i){var b=best[i],s=b?stars(b,L.par):0;h+='<button data-lv="'+i+'" aria-label="Table '+(i+1)+', '+L.name+(b?', best '+b+' shots, '+s+' stars':', not cleared yet')+'"><span class="n">TABLE '+(i+1)+(b?' · best '+b:'')+'</span>'+L.name+'<span class="st">'+(b?'★★★☆☆☆'.substr(3-s,3):'· · ·')+'</span></button>';});
  h+='</div><span id="buildstamp" role="note" aria-label="Build information">build v1.2 · 2026-09-28 · 1279d6fbf</span>';show(h);}
$('card').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.lv!=null){load(+b.dataset.lv);hide();return;}
  var go=b.dataset.go;if(go==='next'){load(st.lv+1);hide();}else if(go==='again'){load(st.lv);hide();}else if(go==='menu')menu();});
$('panel').addEventListener('keydown',function(e){if(e.key==='Escape'&&st.mode!=='done'){hide();}
  if(e.key==='Tab'){var f=$('card').querySelectorAll('button'),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
$('menuBtn').onclick=function(){menu();};
$('resetBtn').onclick=function(){load(st.lv);$('panel').hidden=true;};
$('soundBtn').onclick=function(){sfx.on=!sfx.on;this.setAttribute('aria-pressed',sfx.on);this.setAttribute('aria-label',sfx.on?'Sound on':'Sound off');this.style.opacity=sfx.on?1:.45;try{localStorage.setItem('bhb.snd',sfx.on?'1':'0');}catch(e){}};

/* ---------- sound ---------- */
var sfx={on:true,ctx:null,
  init:function(){if(this.ctx||!this.on)return;try{var A=window.AudioContext||window.webkitAudioContext;this.ctx=new A();}catch(e){}},
  env:function(freq,type,dur,vol,to){var c=this.ctx;if(!c||!this.on)return;var o=c.createOscillator(),v=c.createGain(),t=c.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+dur+.02);},
  lastC:0,clack:function(s){var c=this.ctx;if(!c||c.currentTime-this.lastC<.03)return;this.lastC=c.currentTime;var v=Math.min(.35,s/2500);this.env(1900+Math.random()*500,'triangle',.05,v);this.env(900,'sine',.04,v*.6);},
  thud:function(s){this.env(140,'sine',.09,Math.min(.25,s/3000));},
  gulp:function(){this.env(320,'sine',.55,.22,38);this.env(90,'triangle',.4,.12,30);},
  win:function(){var s=this;[523,659,784,1046].forEach(function(f,i){setTimeout(function(){s.env(f,'triangle',.28,.12);},i*110);});}};
try{if(localStorage.getItem('bhb.snd')==='0'){sfx.on=false;$('soundBtn').setAttribute('aria-pressed','false');$('soundBtn').setAttribute('aria-label','Sound off');$('soundBtn').style.opacity=.45;}}catch(e){}

window.addEventListener('resize',resize);
load(0);resize();menu(true);requestAnimationFrame(frame);
window.__bhb={st:st,LV:LV,load:load,step:step,accel:accel,predict:predict,shoot:shoot,MUS:MUS,toWorld:toWorld};
})();
