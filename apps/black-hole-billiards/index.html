<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--ink:#e9e3f5;--muted:#9a93b3;--neon:#ff5ad1;--cyan:#5ff2e6;--brass:#d6a55a;--night:#07060d;--panel:rgba(14,11,26,.92);--p1:#5ff2e6;--p2:#ffb35c}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:"Martian Mono",ui-monospace,monospace;overflow:hidden}
body{background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff6 50%,transparent 51%),
  radial-gradient(1px 1px at 38% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 66%,#fff7 50%,transparent 51%),
  radial-gradient(60% 50% at 80% 10%,#2a0f3a 0%,transparent 70%),radial-gradient(50% 60% at 10% 90%,#0b2b33 0%,transparent 70%),var(--night)}
.wrap{display:flex;flex-direction:column;height:100%;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(17px,2.6vw,28px);margin:0;color:var(--neon);letter-spacing:.04em;
  text-shadow:0 0 6px #ff5ad1aa,0 0 18px #ff5ad155;white-space:nowrap}
.hud{flex:1;display:flex;gap:14px;align-items:baseline;justify-content:center;font-size:12px;color:var(--muted);min-width:0}
.hud b{font-weight:800;color:var(--ink);font-size:14px}
.turn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid #3a3160;color:var(--muted);transition:all .25s}
.turn:not(.go){background:linear-gradient(90deg,#ff5ad166 var(--m,0%),transparent var(--m,0%));color:var(--ink)}
.turn.go{color:#1a0616;background:var(--pc,var(--cyan));border-color:var(--pc,var(--cyan));font-weight:800}
.hud .lvl{color:var(--cyan);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud>span{white-space:nowrap}
.tools .lvl{display:none;color:var(--cyan);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* two-player hot seat: one colour chip per player, the shooter's is lit */
.duo{display:inline-flex;gap:6px}
.pc{--c:var(--p1);display:inline-flex;gap:6px;align-items:baseline;padding:2px 9px;border-radius:999px;border:1px solid var(--c);font-size:11px;color:var(--c);transition:background .25s,color .25s}
.pc.b{--c:var(--p2)}
.pc b{color:inherit;font-size:13px}
.pc.on{background:var(--c);color:#1a0616}
.cue{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;opacity:0;
  font-family:Monoton,cursive;font-size:clamp(28px,6vw,58px);color:var(--c,var(--p1));text-shadow:0 0 8px currentColor,0 0 28px currentColor}
.cue small{display:block;font-family:"Martian Mono",monospace;font-weight:800;font-size:max(11px,.24em);letter-spacing:.32em;text-transform:uppercase;margin-top:.35em;color:var(--ink);text-shadow:0 1px 6px #000}
.cue.on{animation:cue 1.7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cue{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}24%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes cuef{0%,80%{opacity:1}100%{opacity:0}}
.pp{position:absolute;top:18px;right:18px;display:flex;border:1px solid #3a3160;border-radius:999px;padding:2px;background:#0d0a1c}
.pp button{min-height:34px;min-width:44px;padding:0 10px;border:0;background:none;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em}
.pp button[aria-pressed="true"]{background:var(--ink);color:#1a0616}
.card{position:relative}
.pp~h2{padding-right:110px}
.card p.rules{font-size:11px;color:var(--p2);margin:-6px 0 12px;line-height:1.55;font-weight:400}
.duel{display:flex;gap:10px;margin:10px 0 4px}
.duel div{flex:1;border:1px solid var(--c);border-radius:14px;padding:10px 12px;color:var(--c);font-size:11px;letter-spacing:.06em}
.duel div.w{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.duel b{display:block;font-size:34px;font-weight:800;line-height:1.1;color:var(--ink)}
.tools{display:flex;gap:6px}
button{font:inherit;color:var(--ink);background:#15112a;border:1px solid #3a3160;border-radius:999px;min-height:40px;min-width:40px;padding:0 14px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--cyan)}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.stage{position:relative;flex:1;min-height:0;margin-top:6px}
canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:18px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid #3a3160;border-radius:12px;
  padding:8px 14px;font-size:12px;max-width:min(92%,520px);text-align:center;pointer-events:none;transition:opacity .5s}
.toast.off{opacity:0}
.panel[hidden]{display:none}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:var(--panel);border:1px solid #3a3160;border-radius:20px;padding:22px 22px 18px;width:min(94%,560px);max-height:94%;overflow:auto;
  box-shadow:0 0 0 1px #ff5ad122,0 30px 80px #000c;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.card h2{font-family:Monoton,cursive;font-weight:400;color:var(--neon);font-size:clamp(24px,5vw,40px);margin:0 0 4px;line-height:1.15}
.card p{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0 14px;font-weight:200}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid button{border-radius:14px;min-height:64px;text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.grid .n{font-size:10px;color:var(--muted)}
.grid .st{color:var(--brass);letter-spacing:2px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .main{background:var(--neon);border-color:var(--neon);color:#1a0616;font-weight:800}
.big{font-size:44px;color:var(--brass);letter-spacing:8px;margin:4px 0}
.stats{font-size:13px;margin:4px 0 8px}
.stats b{font-weight:800}
#buildstamp{display:block;margin-top:14px;font-size:10px;opacity:.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){header{gap:6px}.hud{order:3;flex-basis:100%;justify-content:space-between}.tools button{padding:0 10px}}
@media (max-width:560px){.hud{gap:8px}.hud .lvl{display:none}.tools{flex:1 1 100%;min-width:0}.tools .lvl{display:block;margin-left:auto;align-self:center;padding-left:8px}.pp~h2{padding-right:96px}.card{padding:18px 16px 14px}.pp{top:14px;right:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid button{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.toast{transition:none}.cue.on{animation-name:cuef;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Black Hole Billiards</h1>
  <div class="hud" aria-label="Game status">
    <span class="lvl" id="lvlName">Flat Space</span>
    <span id="solo">shots <b id="shots">0</b> / par <b id="par">3</b></span>
    <span class="duo" id="duo" hidden><span class="pc" id="pc1">P1 <b>0</b></span><span class="pc b" id="pc2">P2 <b>0</b></span></span>
    <span>left <b id="left">3</b></span>
    <span class="turn go" id="turn">your shot</span>
  </div>
  <div class="tools">
    <button id="menuBtn" aria-label="Choose a table">Tables</button>
    <button id="resetBtn" aria-label="Restart this table">&#8634;</button>
    <button id="soundBtn" aria-label="Sound on" aria-pressed="true">&#9835;</button>
    <span class="lvl" id="lvlName2" aria-hidden="true"></span>
  </div>
</header>
<div class="stage" id="stage">
  <canvas id="table" tabindex="0" role="img" aria-label="Billiard table in space. Drag back from anywhere and release to shoot. Keyboard: arrows aim and set power, space shoots."></canvas>
  <div class="toast off" id="toast" aria-hidden="true"></div>
  <div class="cue" id="cue" aria-hidden="true"></div>
  <div class="panel" id="panel" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="card"></div>
  </div>
</div>
<div class="sr" aria-live="polite" id="live"></div>
</div>
<script>
(function(){
'use strict';
var W=1000,H=500,RAIL=46,BR=13,DT=1/480;
var MU=240,MUS=900,REST=6,ER=.94,EC=.76,VMAX=1750,PULL=300;
var POCKETS=[[0,0,30],[W/2,-9,26],[W,0,30],[0,H,30],[W/2,H+9,26],[W,H,30]],CM=34,SM=24;
var COMBO=['','','DOUBLE!','TRIPLE!','QUADRUPLE!','SUPERNOVA!','BIG BANG!'];
var COL=['#f4f1e8','#f5c518','#2464e0','#e0352b','#7b46c9','#f07c1c','#1fa65f','#8a2433','#1a1a20','#f5c518'];

function rack(x,y,rows){var o=[],i,j,dx=BR*2*.866+.6;for(i=0;i<rows;i++)for(j=0;j<=i;j++)o.push([x+i*dx,y+(j-i/2)*(BR*2+.6)]);return o;}
var LV=[
 {name:'Flat Space',hint:'Pull back from anywhere on the table and let go to shoot.',par:3,cue:[240,250],balls:rack(700,250,2),bodies:[]},
 {name:'Pale Moon',hint:'Moons pull on passing balls. Slow shots bend the most.',par:5,cue:[190,250],balls:rack(770,250,2).concat([[640,95],[640,405]]),
  bodies:[{k:'moon',x:500,y:250,R:36,M:6e6}]},
 {name:'Binary Stars',hint:'Two suns, two pulls. Thread the gap or swing around the outside.',par:6,cue:[160,400],balls:rack(800,250,2).concat([[250,100],[720,440]]),
  bodies:[{k:'star',x:400,y:160,R:26,M:5e6,c:'#ffd27a'},{k:'star',x:600,y:340,R:26,M:5e6,c:'#9cc9ff'}]},
 {name:'Asteroid Belt',hint:'Rocks have no pull, but they bounce you hard.',par:7,cue:[200,250],balls:rack(730,250,3),
  bodies:[{k:'rock',x:470,y:62,R:18},{k:'rock',x:522,y:152,R:22},{k:'rock',x:478,y:250,R:16},{k:'rock',x:530,y:345,R:24},{k:'rock',x:468,y:440,R:17}]},
 {name:'Gas Giant',hint:'Big planet, big pull. Its little moon drifts along the dotted orbit, but only while balls roll.',par:7,cue:[140,250],balls:[[820,100],[860,250],[820,400],[260,80],[260,420],[340,250]],
  bodies:[{k:'giant',x:580,y:250,R:62,M:1.2e7},{k:'moon',R:14,M:2.5e6,orb:[580,250,170,150,.16,-2.1]}]},
 {name:'Slingshot',hint:'No straight line to the pack. Swing around the star, and mind the moon: it moves only while balls roll.',par:8,cue:[120,250],balls:rack(830,250,3),
  bodies:[{k:'star',x:500,y:250,R:44,M:1.6e7,c:'#ffb35c'},{k:'moon',R:14,M:2.5e6,orb:[500,250,168,140,-.16,.9]}]},
 {name:'Event Horizon',hint:'A loose black hole sits mid-table. It eats balls too, the cue ball included.',par:7,cue:[150,250],hungry:1,
  balls:[[300,90],[300,410],[700,90],[700,410],[820,250],[843,237],[843,263]],bodies:[{k:'hole',x:500,y:250,R:16,M:7e6}]},
 {name:'Moon Cue',hint:'Your cue ball is a moon now. Balls it passes get tugged along behind it.',par:7,cue:[170,250],cueM:4.5e6,
  balls:[[470,130],[470,370],[640,250],[790,110],[790,390],[900,250]],bodies:[]},
 {name:'Wormhole',hint:'Roll into one ring and you pop out of the other, same speed, same direction.',par:8,cue:[150,250],
  portals:[[330,130,690,390]],balls:rack(770,170,3).concat([[240,420]]),
  bodies:[75,125,175,225,275,325,375,425].map(function(y,i){return {k:'rock',x:500+(i%2?7:-7),y:y,R:26};})}
];

/* ---------- state ---------- */
var st={lv:0,balls:[],bodies:[],orb:[],shots:0,mode:'aim',roll:0,falling:[],scratch:false,ang:0,pow:.55,aiming:false,kbd:false,t:0,
  pp:1,cur:0,brk:0,sc:[0,0],ps:[0,0]},best={};
/* hot seat: P1 cyan, P2 amber */
var PC=['#5ff2e6','#ffb35c'],PCR=['95,242,230','255,179,92'],pick=1;
try{best=JSON.parse(localStorage.getItem('bhb.best')||'{}')||{};}catch(e){best={};}
var $=function(id){return document.getElementById(id);},cv=$('table'),g=cv.getContext('2d');

/* drifting moons: orb=[cx,cy,rx,ry,angular speed,start angle]; they only move inside step(), so aiming happens on a frozen sky */
function orbit(o){var q=o.orb,c=Math.cos(o.a),s=Math.sin(o.a);o.x=q[0]+q[2]*c;o.y=q[1]+q[3]*s;o.vx=-q[2]*q[4]*s;o.vy=q[3]*q[4]*c;}
function load(i){var L=LV[i];st.lv=i;st.shots=0;st.mode='aim';st.falling=[];st.pops=[];st.pots=0;st.scratch=false;st.roll=0;
  st.cur=st.brk;st.sc=[0,0];st.ps=[0,0];
  st.bodies=L.bodies.map(function(b){var o={};for(var k in b)o[k]=b[k];o.M=o.M||0;o.vx=o.vy=0;if(o.orb){o.a=o.orb[5];orbit(o);}o.seed=Math.round(o.x*7+o.y*13);return o;});
  st.orb=st.bodies.filter(function(o){return o.orb;});
  st.portals=(L.portals||[]).map(function(p){return [{x:p[0],y:p[1]},{x:p[2],y:p[3]}];});
  st.pm=L.hungry?9e5:2.5e5;st.pr=L.hungry?110:80;
  st.balls=[mk(0,L.cue[0],L.cue[1])].concat(L.balls.map(function(p,j){return mk(j+1,p[0],p[1]);}));
  st.balls.forEach(function(b){var a=accel(b.x,b.y);b.rest=Math.hypot(a[0],a[1])<MUS;});
  var cue=st.balls[0],tgt=st.balls[1];st.ang=Math.atan2(tgt.y-cue.y,tgt.x-cue.x);st.pow=.55;
  bake();hud();toast(L.hint,7000);say('Table '+(i+1)+', '+L.name+'. '+L.hint+(st.pp===2?' Player '+(st.cur+1)+' breaks.':''));
  if(st.pp===2)banner('breaks');else $('cue').classList.remove('on');}
function mk(n,x,y){return {n:n,x:x,y:y,vx:0,vy:0,alive:true,rest:true};}

/* ---------- physics ---------- */
function accel(x,y){var ax=0,ay=0,i,o,dx,dy,d2,f;
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];if(!o.M)continue;dx=o.x-x;dy=o.y-y;d2=dx*dx+dy*dy+400;f=o.M/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}
  for(i=0;i<6;i++){dx=POCKETS[i][0]-x;dy=POCKETS[i][1]-y;d2=dx*dx+dy*dy;if(d2<st.pr*st.pr){d2+=100;f=st.pm/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}}
  return [ax,ay];}
function move(b,dt,pred){var a=accel(b.x,b.y),sp,dec,i,o,dx,dy,d,an,vn;
  /* resting on a planet: the surface holds it, so drop the inward pull and inward speed */
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];if(o.k==='hole')continue;dx=b.x-o.x;dy=b.y-o.y;d=Math.hypot(dx,dy);
    if(d<o.R+BR+1.5){dx/=d;dy/=d;an=a[0]*dx+a[1]*dy;if(an<0){a[0]-=an*dx;a[1]-=an*dy;}vn=b.vx*dx+b.vy*dy;if(vn<0&&vn>-40){b.vx-=vn*dx;b.vy-=vn*dy;}}}b.vx+=a[0]*dt;b.vy+=a[1]*dt;sp=Math.hypot(b.vx,b.vy);dec=MU*dt;
  if(sp>dec){b.vx*=(sp-dec)/sp;b.vy*=(sp-dec)/sp;}else{b.vx=0;b.vy=0;}
  if(sp<REST&&Math.hypot(a[0],a[1])+(b.ex||0)<MUS){b.vx=0;b.vy=0;b.rest=true;return 0;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;return sp;}
function cushions(b){var hit=0;
  if(b.y<BR&&!(b.x<CM||b.x>W-CM||Math.abs(b.x-W/2)<SM)){b.y=BR;if(b.vy<0){hit=-b.vy;b.vy=-b.vy*EC;}}
  if(b.y>H-BR&&!(b.x<CM||b.x>W-CM||Math.abs(b.x-W/2)<SM)){b.y=H-BR;if(b.vy>0){hit=b.vy;b.vy=-b.vy*EC;}}
  if(b.x<BR&&!(b.y<CM||b.y>H-CM)){b.x=BR;if(b.vx<0){hit=-b.vx;b.vx=-b.vx*EC;}}
  if(b.x>W-BR&&!(b.y<CM||b.y>H-CM)){b.x=W-BR;if(b.vx>0){hit=b.vx;b.vx=-b.vx*EC;}}
  return hit;}
function bodyHit(b){var i,o,dx,dy,d,nx,ny,vn;
  for(i=0;i<st.bodies.length;i++){o=st.bodies[i];dx=b.x-o.x;dy=b.y-o.y;d=Math.hypot(dx,dy);
    if(o.k==='hole'){if(d<o.R)return {hole:o};continue;}
    if(d<o.R+BR){nx=dx/d;ny=dy/d;b.x=o.x+nx*(o.R+BR);b.y=o.y+ny*(o.R+BR);vn=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny;
      /* a drifting moon nudges what it meets softly (no bounce at crawl speed), so it can't juggle a ball forever */
      if(vn<0){var e=o.orb&&vn>-40?0:EC;b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return {bump:-vn};}}}
  return null;}
function drift(dt){for(var i=0;i<st.orb.length;i++){st.orb[i].a+=st.orb[i].orb[4]*dt;orbit(st.orb[i]);}}
/* chat voted W: wormholes. Enter one mouth, leave the other at the same velocity */
var PR=22;
function warp(b){if(b.wc>0){b.wc-=DT;return false;}for(var i=0;i<st.portals.length;i++)for(var j=0;j<2;j++){var A=st.portals[i][j],Z=st.portals[i][1-j];
  if(Math.hypot(b.x-A.x,b.y-A.y)<PR*.8){var sp=Math.hypot(b.vx,b.vy)||1;b.x=Z.x+b.vx/sp*(PR*.8+2);b.y=Z.y+b.vy/sp*(PR*.8+2);b.wc=.35;return true;}}return false;}
function pocketed(b){var i,p,dx,dy;for(i=0;i<6;i++){p=POCKETS[i];dx=b.x-p[0];dy=b.y-p[1];if(dx*dx+dy*dy<(p[2]-4)*(p[2]-4))return p;}
  if(b.x<-26||b.x>W+26||b.y<-26||b.y>H+26){var bi=0,bd=1e9;for(i=0;i<6;i++){p=POCKETS[i];dx=b.x-p[0];dy=b.y-p[1];if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;bi=i;}}return POCKETS[bi];}
  return null;}

function step(){var bs=st.balls,i,j,a,b,dx,dy,d,nx,ny,rel,jm,ov,h,p,moving=false,cm=LV[st.lv].cueM,c=bs[0],f;
  /* Tatum's moon cue: the cue ball pulls the others (a ball touching it is held by contact) */
  if(cm&&c.alive)for(i=1;i<bs.length;i++){b=bs[i];b.ex=0;if(!b.alive)continue;dx=c.x-b.x;dy=c.y-b.y;d=dx*dx+dy*dy;if(d<(2*BR+1.5)*(2*BR+1.5))continue;
    d+=400;f=cm/(d*Math.sqrt(d));b.ex=Math.sqrt(dx*dx+dy*dy)*f;if(b.rest){if(b.ex<MUS)continue;b.rest=false;}b.vx+=dx*f*DT;b.vy+=dy*f*DT;}
  /* the drifting moon moves on while anything rolls, and wakes a resting ball once its pull beats static friction (or it bumps into it) */
  if(st.orb.length){drift(DT);for(j=0;j<st.orb.length;j++){var o=st.orb[j],rr=o.R+BR;

function render(){var t=st.t,i,b,c=st.balls[0];g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);view();
  if(felt)g.drawImage(felt,-RAIL,-RAIL,W+2*RAIL,H+2*RAIL);
  for(i=0;i<6;i++)hole(POCKETS[i][0],POCKETS[i][1],POCKETS[i][2]+(i%3===1?2:4),t+i);
  st.orb.forEach(function(o){var q=o.orb,dir=q[4]>0?-1:1,n=10,k,a0,a1,gl=g.createRadialGradient(o.x,o.y,o.R*.8,o.x,o.y,o.R*2.6);g.lineCap='round';
    gl.addColorStop(0,'rgba(215,225,255,.22)');gl.addColorStop(1,'rgba(215,225,255,0)');g.fillStyle=gl;g.beginPath();g.arc(o.x,o.y,o.R*2.6,0,7);g.fill();
    for(k=0;k<n;k++){a0=o.a+dir*k*.03;a1=o.a+dir*(k+1)*.03;g.strokeStyle='rgba(215,225,255,'+(.3*(1-k/n)).toFixed(3)+')';g.lineWidth=.5+2.2*(1-k/n);
      g.beginPath();g.ellipse(q[0],q[1],q[2],q[3],0,Math.min(a0,a1),Math.max(a0,a1));g.stroke();}});
  st.bodies.forEach(function(o){body(o,t);});
  st.portals.forEach(function(pp){portal(pp[0],t,'95,242,230');portal(pp[1],t,'255,154,60');});
  var showAim=st.mode==='aim'&&c.alive&&(st.aiming||st.kbd);
  /* ready cue: a ring bursts out when the table settles, then breathes while it's your shot */
  var rc=st.pp===2?PCR[st.cur]:'95,242,230';
  if(st.mode==='aim'&&c.alive&&!showAim){var rk=st.ready<.7?st.ready/.7:0;
    if(rk&&!RM){g.strokeStyle='rgba('+rc+','+(1-rk).toFixed(2)+')';g.lineWidth=2.5;g.beginPath();g.arc(c.x,c.y,BR+6+rk*46,0,7);g.stroke();}
    g.strokeStyle='rgba('+rc+','+(.35+.25*Math.sin(t*3.2)).toFixed(2)+')';g.lineWidth=1.6;g.beginPath();g.arc(c.x,c.y,BR+6+(RM?0:1.5*Math.sin(t*3.2)),0,7);g.stroke();}
  if(showAim){var pr=predict(Math.cos(st.ang)*st.pow*VMAX,Math.sin(st.ang)*st.pow*VMAX);
    g.fillStyle='#5ff2e6';pr.pts.forEach(function(p,k){if(!p)return;g.globalAlpha=Math.max(.08,.85-k/pr.pts.length*.8);g.beginPath();g.arc(p[0],p[1],1.9,0,7);g.fill();});g.globalAlpha=1;
    if(pr.hit){var h=pr.hit,dx=h.o.x-h.x,dy=h.o.y-h.y,d=Math.hypot(dx,dy);g.strokeStyle='rgba(95,242,230,.8)';g.lineWidth=1.3;g.setLineDash([3,3]);g.beginPath();g.arc(h.x,h.y,BR,0,7);g.stroke();g.setLineDash([]);
      g.strokeStyle='rgba(255,255,255,.45)';g.beginPath();g.moveTo(h.o.x,h.o.y);g.lineTo(h.o.x+dx/d*70,h.o.y+dy/d*70);g.stroke();}}
  for(i=0;i<st.balls.length;i++){b=st.balls[i];if(b.alive)ball(b.n,b.x,b.y,1,b.rest?null:[b.vx,b.vy]);}
  st.pops.forEach(function(p){var k=p.t/1.6,sc2=RM?1:k<.15?.6+k/.15*.55:k<.3?1.15-(k-.15)/.15*.15:1,al=k>.7?1-(k-.7)/.3:1;
    g.save();g.translate(p.x,p.y-(RM?0:k*40));if(rot)g.rotate(-Math.PI/2);g.scale(sc2,sc2);g.globalAlpha=Math.max(0,al);g.textAlign='center';g.textBaseline='middle';
    g.font='44px Monoton, "Martian Mono", monospace';g.shadowColor='#ff5ad1';g.shadowBlur=18;g.fillStyle='#ffd1f2';g.fillText(p.txt,0,0);g.shadowBlur=0;g.lineWidth=1.2;g.strokeStyle='#ff5ad1';g.strokeText(p.txt,0,0);g.restore();});
  st.falling.forEach(function(f){var k=Math.min(1,f.t/.6),e=k*k,a=k*9;var x=f.cx+(f.x-f.cx)*(1-e)*Math.cos(a),y=f.cy+(f.y-f.cy)*(1-e)*Math.sin(a+1.57)*-1;
    x=f.cx+((f.x-f.cx)*Math.cos(a)-(f.y-f.cy)*Math.sin(a))*(1-e);y=f.cy+((f.x-f.cx)*Math.sin(a)+(f.y-f.cy)*Math.cos(a))*(1-e);ball(f.n,x,y,1-e*.9);});
  if(showAim){var ux=Math.cos(st.ang),uy=Math.sin(st.ang),back=BR+8+st.pow*46,sx=c.x-ux*back,sy=c.y-uy*back,ex=c.x-ux*(back+300),ey=c.y-uy*(back+300);
    var sg=g.createLinearGradient(sx,sy,ex,ey);sg.addColorStop(0,'#eafcff');sg.addColorStop(.02,'#5ff2e6');sg.addColorStop(.05,'#f1dcb2');sg.addColorStop(.6,'#c89454');sg.addColorStop(.62,'#ff5ad1');sg.addColorStop(.66,'#2a1a10');sg.addColorStop(1,'#140c07');
    g.strokeStyle=sg;g.lineCap='round';g.lineWidth=6;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke();
    g.strokeStyle=st.pp===2?'rgba('+rc+',.9)':'rgba(255,90,209,.9)';g.lineWidth=3;g.beginPath();g.arc(c.x,c.y,BR+7,-Math.PI/2,-Math.PI/2+st.pow*6.283);g.stroke();}
  g.setTransform(1,0,0,1,0,0);}

/* ---------- loop ---------- */
var last=0,acc=0,tnEl=$('turn');
function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;st.t+=dt;
  if(st.mode==='roll'){acc+=dt;st.roll+=dt;var n=0,mv=true;while(acc>=DT&&n<60){mv=step();acc-=DT;n++;}if(n>=60)acc=0;
    /* Tatum: end the turn promptly. Once nothing moves faster than a crawl for a moment, everything stops */
    var vmax=0;st.balls.forEach(function(b){if(b.alive&&!b.rest)vmax=Math.max(vmax,Math.hypot(b.vx,b.vy));});st.slow=vmax<28?(st.slow||0)+dt:0;
    tnEl.style.setProperty('--m',Math.min(100,Math.sqrt(vmax/VMAX)*100).toFixed(0)+'%'); /* momentum meter */
    if(st.roll>15||st.slow>.8)st.balls.forEach(function(b){b.vx=b.vy=0;b.rest=true;});
    if(st.balls.every(function(b){return !b.alive||b.rest;})&&!st.falling.some(function(f){return f.t<.6;})){acc=0;settle();}}
  var cb=st.balls[0],dz=0;if(st.mode==='roll'&&cb.alive&&!cb.rest){var dm=1e9;POCKETS.forEach(function(p){dm=Math.min(dm,Math.hypot(cb.x-p[0],cb.y-p[1])-p[2]);});
    st.bodies.forEach(function(o){if(o.k==='hole')dm=Math.min(dm,Math.hypot(cb.x-o.x,cb.y-o.y)-o.R);});dz=Math.max(0,Math.min(1,1-(dm-10)/130));}
  sfx.hum(dz);
  st.ready=(st.ready||0)+dt;st.pops.forEach(function(p){p.t+=dt;});st.pops=st.pops.filter(function(p){return p.t<1.6;});
  st.falling.forEach(function(f){f.t+=dt;});st.falling=st.falling.filter(function(f){return f.t<.7;});
  render();requestAnimationFrame(frame);}

/* ---------- input ---------- */
var drag=null;
function pos(e){var r=cv.getBoundingClientRect();return toWorld(e.clientX-r.left,e.clientY-r.top);}
cv.addEventListener('pointerdown',function(e){if(st.mode!=='aim')return;sfx.init();drag={p:pos(e),id:e.pointerId};st.aiming=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==drag.id)return;var p=pos(e),dx=drag.p[0]-p[0],dy=drag.p[1]-p[1],d=Math.hypot(dx,dy);
  if(d<8){st.aiming=false;return;}st.aiming=true;st.ang=Math.atan2(dy,dx);st.pow=Math.min(1,d/PULL);});
function up(e){if(!drag||e.pointerId!==drag.id)return;drag=null;if(st.aiming){st.aiming=false;shoot();}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(){drag=null;st.aiming=false;});
cv.addEventListener('keydown',function(e){if(st.mode!=='aim')return;var k=e.key,f=e.shiftKey?.2:1;
  if(k==='ArrowLeft'){st.ang-=f*Math.PI/180;}else if(k==='ArrowRight'){st.ang+=f*Math.PI/180;}
  else if(k==='ArrowUp'){st.pow=Math.min(1,st.pow+.05);}else if(k==='ArrowDown'){st.pow=Math.max(.05,st.pow-.05);}
  else if(k===' '||k==='Enter'){e.preventDefault();if(st.kbd)shoot();else st.kbd=true;return;}else return;
  e.preventDefault();st.kbd=true;});

/* ---------- ui ---------- */
function hud(){var L=LV[st.lv],tn=$('turn'),go=st.mode!=='roll',two=st.pp===2;tn.textContent=st.mode==='done'?'cleared':go?(two?'P'+(st.cur+1)+'’s shot':'your shot'):'rolling…';tn.className='turn'+(go?' go':'');
  if(two)tn.style.setProperty('--pc',PC[st.cur]);else tn.style.removeProperty('--pc');$('solo').hidden=two;$('duo').hidden=!two;
  if(two)[0,1].forEach(function(k){var el=$('pc'+(k+1));el.querySelector('b').textContent=st.sc[k];el.classList.toggle('on',k===st.cur&&st.mode!=='done');});$('lvlName').textContent=$('lvlName2').textContent=(st.lv+1)+'. '+L.name;$('shots').textContent=st.shots;$('par').textContent=L.par;$('left').textContent=left();}
var tt=0;function toast(s,ms){var el=$('toast');el.textContent=s;el.classList.remove('off');clearTimeout(tt);tt=setTimeout(hideToast,ms||4000);}
function hideToast(){$('toast').classList.add('off');}
function say(s){$('live').textContent=s;}
var lastFocus=null;
function show(html){lastFocus=document.activeElement;$('card').innerHTML=html;$('panel').hidden=false;var b=$('card').querySelector('[data-lv],[data-go]')||$('card').querySelector('button');if(b)b.focus();}
function hide(){$('panel').hidden=true;cv.focus();}
function menu(first){pick=st.pp;var h='<div class="pp" role="group" aria-label="Players"><button type="button" data-pp="1" aria-pressed="'+(pick===1)+'" aria-label="One player">1P</button><button type="button" data-pp="2" aria-pressed="'+(pick===2)+'" aria-label="Two players on this device">2P</button></div><h2 id="pTitle">'+(first?'Black Hole Billiards':'Tables')+'</h2><p>Pool on a table adrift in space. Planets and stars bend every shot, and each pocket is a black hole. Clear the table in as few shots as you can.</p><p class="rules" id="rules"'+(pick===2?'':' hidden')+'>Two players, one device. Sink a ball and you shoot again; a miss or a scratch passes the cue. Most balls wins.</p><div class="grid">';
  LV.forEach(function(L,i){var b=best[i],s=b?stars(b,L.par):0;h+='<button data-lv="'+i+'" aria-label="Table '+(i+1)+', '+L.name+(b?', best '+b+' shots, '+s+' stars':', not cleared yet')+'"><span class="n">TABLE '+(i+1)+(b?' · best '+b:'')+'</span>'+L.name+'<span class="st">'+(b?'★★★☆☆☆'.substr(3-s,3):'· · ·')+'</span></button>';});
  h+='</div><span id="buildstamp" role="note" aria-label="Build information">build v1.8 · 2026-09-28 · dev</span>';show(h);}
$('card').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.pp){pick=+b.dataset.pp;$('card').querySelectorAll('[data-pp]').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.pp===pick));});$('rules').hidden=pick!==2;return;}
  if(b.dataset.lv!=null){if(pick!==st.pp)st.brk=0;st.pp=pick;load(+b.dataset.lv);hide();return;}
  var go=b.dataset.go;if(go==='next'){load(st.lv+1);hide();}else if(go==='again'){load(st.lv);hide();}else if(go==='menu')menu();});
$('panel').addEventListener('keydown',function(e){if(e.key==='Escape'&&st.mode!=='done'){hide();}
  if(e.key==='Tab'){var f=$('card').querySelectorAll('button'),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
$('menuBtn').onclick=function(){menu();};
$('resetBtn').onclick=function(){load(st.lv);$('panel').hidden=true;};
$('soundBtn').onclick=function(){sfx.on=!sfx.on;this.setAttribute('aria-pressed',sfx.on);this.setAttribute('aria-label',sfx.on?'Sound on':'Sound off');this.style.opacity=sfx.on?1:.45;try{localStorage.setItem('bhb.snd',sfx.on?'1':'0');}catch(e){}};

/* ---------- sound ---------- */
var sfx={on:true,ctx:null,
  init:function(){if(this.ctx||!this.on)return;try{var A=window.AudioContext||window.webkitAudioContext;this.ctx=new A();}catch(e){}},
  env:function(freq,type,dur,vol,to){var c=this.ctx;if(!c||!this.on)return;var o=c.createOscillator(),v=c.createGain(),t=c.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+dur+.02);},
  lastC:0,clack:function(s){var c=this.ctx;if(!c||c.currentTime-this.lastC<.03)return;this.lastC=c.currentTime;var v=Math.min(.35,s/2500);this.env(1900+Math.random()*500,'triangle',.05,v);this.env(900,'sine',.04,v*.6);},
  thud:function(s){this.env(140,'sine',.09,Math.min(.25,s/3000));},
  gulp:function(){this.env(320,'sine',.55,.22,38);this.env(90,'triangle',.4,.12,30);},
  /* a low hum that rises as the moving cue ball nears a black hole */
  hum:function(l){var c=this.ctx;if(!c)return;if(!this.ho){if(!l)return;var o=c.createOscillator(),o2=c.createOscillator(),v=c.createGain();o.type='sine';o2.type='triangle';o2.detune.value=9;
    o.connect(v);o2.connect(v);v.gain.value=0;v.connect(c.destination);o.start();o2.start();this.ho=[o,o2];this.hv=v;}
    var t=c.currentTime,lv=this.on?l:0;this.hv.gain.setTargetAtTime(lv*.1,t,.06);this.ho[0].frequency.setTargetAtTime(48+80*l,t,.06);this.ho[1].frequency.setTargetAtTime(96+160*l,t,.06);},
  warp:function(){this.env(220,'sine',.22,.12,1400);},
  ready:function(){this.env(880,'sine',.09,.05);var s=this;setTimeout(function(){s.env(1320,'sine',.12,.045);},70);},
  combo:function(n){var s=this;for(var i=0;i<Math.min(n,5)+1;i++)(function(i){setTimeout(function(){s.env(660*Math.pow(1.26,i),'triangle',.18,.1);},i*70);})(i);},
  win:function(){var s=this;[523,659,784,1046].forEach(function(f,i){setTimeout(function(){s.env(f,'triangle',.28,.12);},i*110);});}};
try{if(localStorage.getItem('bhb.snd')==='0'){sfx.on=false;$('soundBtn').setAttribute('aria-pressed','false');$('soundBtn').setAttribute('aria-label','Sound off');$('soundBtn').style.opacity=.45;}}catch(e){}

window.addEventListener('resize',resize);
load(0);resize();menu(true);requestAnimationFrame(frame);
window.__bhb={sfx:sfx,st:st,LV:LV,load:load,step:step,accel:accel,predict:predict,shoot:shoot,settle:settle,menu:menu,MUS:MUS,toWorld:toWorld};
})();
