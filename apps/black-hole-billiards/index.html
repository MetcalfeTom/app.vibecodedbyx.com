<style>
:root{--ink:#e9e3f5;--muted:#9a93b3;--neon:#ff5ad1;--cyan:#5ff2e6;--brass:#d6a55a;--night:#07060d;--panel:rgba(14,11,26,.92);--p1:#5ff2e6;--p2:#ffb35c}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:"Martian Mono",ui-monospace,monospace;overflow:hidden}
body{background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff6 50%,transparent 51%),
  radial-gradient(1px 1px at 38% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 66%,#fff7 50%,transparent 51%),
  radial-gradient(60% 50% at 80% 10%,#2a0f3a 0%,transparent 70%),radial-gradient(50% 60% at 10% 90%,#0b2b33 0%,transparent 70%),var(--night)}
.wrap{display:flex;flex-direction:column;height:100%;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(17px,2.6vw,28px);margin:0;color:var(--neon);letter-spacing:.04em;
  text-shadow:0 0 6px #ff5ad1aa,0 0 18px #ff5ad155;white-space:nowrap}
.hud{flex:1;display:flex;gap:14px;align-items:baseline;justify-content:center;font-size:12px;color:var(--muted);min-width:0}
.hud b{font-weight:800;color:var(--ink);font-size:14px}
.turn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid #3a3160;color:var(--muted);transition:all .25s}
.turn:not(.go){background:linear-gradient(90deg,#ff5ad166 var(--m,0%),transparent var(--m,0%));color:var(--ink)}
.turn.go{color:#1a0616;background:var(--pc,var(--cyan));border-color:var(--pc,var(--cyan));font-weight:800}
.hud .lvl{color:var(--cyan);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud>span{white-space:nowrap}
.tools .lvl{display:none;color:var(--cyan);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* two-player hot seat: one colour chip per player, the shooter's is lit */
.duo{display:inline-flex;gap:6px}
.pc{--c:var(--p1);display:inline-flex;gap:6px;align-items:baseline;padding:2px 9px;border-radius:999px;border:1px solid var(--c);font-size:11px;color:var(--c);transition:background .25s,color .25s}
.pc.b{--c:var(--p2)}
.pc b{color:inherit;font-size:13px}
.pc.on{background:var(--c);color:#1a0616}
.cue{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;opacity:0;
  font-family:Monoton,cursive;font-size:clamp(28px,6vw,58px);color:var(--c,var(--p1));text-shadow:0 0 8px currentColor,0 0 28px currentColor}
.cue small{display:block;font-family:"Martian Mono",monospace;font-weight:800;font-size:max(11px,.24em);letter-spacing:.32em;text-transform:uppercase;margin-top:.35em;color:var(--ink);text-shadow:0 1px 6px #000}
.cue.on{animation:cue 1.7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cue{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}24%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes cuef{0%,80%{opacity:1}100%{opacity:0}}
.pp{position:absolute;top:18px;right:18px;display:flex;border:1px solid #3a3160;border-radius:999px;padding:2px;background:#0d0a1c}
.pp button{min-height:34px;min-width:44px;padding:0 10px;border:0;background:none;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em}
.pp button[aria-pressed="true"]{background:var(--ink);color:#1a0616}
.card{position:relative}
.pp~h2{padding-right:110px}
.card p.rules{font-size:11px;color:var(--p2);margin:-6px 0 12px;line-height:1.55;font-weight:400}
.pc i{display:none;width:9px;height:9px;border-radius:50%;align-self:center;box-sizing:border-box;--ic:var(--c)}
.pc.on i{--ic:#1a0616}
.pc[data-g="s"] i{display:inline-block;background:var(--ic)}
.pc[data-g="t"] i{display:inline-block;border:1.5px solid var(--ic);background:linear-gradient(transparent 30%,var(--ic) 30% 70%,transparent 70%)}
.duel b.gw{font-size:24px;letter-spacing:.02em}
.rrow{display:flex;gap:10px;align-items:flex-start;margin:-4px 0 12px}
.rrow .rb{flex:none;min-height:32px;padding:0 11px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rrow .rb[aria-pressed="true"]{border-color:#ffd166;color:#ffd166}
.rrow .rb[aria-pressed="true"]::before{content:"✓ "}
.card .rrow p.rules{margin:0;flex:1}
@media (max-width:560px){.rrow{flex-direction:column;gap:6px}}
.duel{display:flex;gap:10px;margin:10px 0 4px}
.duel div{flex:1;border:1px solid var(--c);border-radius:14px;padding:10px 12px;color:var(--c);font-size:11px;letter-spacing:.06em}
.duel div.w{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.duel b{display:block;font-size:34px;font-weight:800;line-height:1.1;color:var(--ink)}
.tools{display:flex;gap:6px}
button{font:inherit;color:var(--ink);background:#15112a;border:1px solid #3a3160;border-radius:999px;min-height:40px;min-width:40px;padding:0 14px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--cyan)}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.stage{position:relative;flex:1;min-height:0;margin-top:6px}
canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:18px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid #3a3160;border-radius:12px;
  padding:8px 14px;font-size:12px;max-width:min(92%,520px);text-align:center;pointer-events:none;transition:opacity .5s}
.toast.off{opacity:0}
/* v1.9 phone shot bar: letting go locks the aim, fine-tune it here, then Shoot */
.shotbar{display:none;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.touch .shotbar{display:flex}
@media (pointer:coarse){.shotbar{display:flex}}
.shotbar .pair{display:flex;align-items:center;border:1px solid #3a3160;border-radius:999px;background:#0d0a1c;flex:none}
.shotbar .pair span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:28px;text-align:center;pointer-events:none}
.shotbar button{min-height:46px;min-width:46px;padding:0;border:0;background:none;font-size:20px;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.shotbar .pair button:active{color:var(--cyan)}
.shotbar .go{flex:1 1 150px;max-width:220px;min-width:96px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#1a0616;background:var(--pc,var(--p1));box-shadow:0 0 18px color-mix(in srgb,var(--pc,var(--p1)) 45%,transparent)}
.shotbar .go:disabled{background:#15112a;color:var(--muted);box-shadow:none;border:1px solid #3a3160;letter-spacing:.06em;text-transform:none;font-weight:400}
.shotbar button:disabled{cursor:default}
.tools .tonly{display:none}
.touch .tools .tonly{display:inline-block}
@media (pointer:coarse){.tools .tonly{display:inline-block}}
#lockBtn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px #5ff2e655}
#lockBtn[aria-pressed="false"]{opacity:.6}
.shotbar .pair button:disabled{opacity:.3}
.shotbar .go b{font-weight:800;opacity:.7;margin-left:.5em}
/* landscape phones: the bar stands on the right so the table keeps its height */
@media (orientation:landscape) and (max-height:520px){.wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:10px}
  header{grid-column:1/-1;gap:8px;min-height:40px}h1{display:none}.hud{gap:10px}.hud .lvl{display:none}.tools button{padding:0 10px;min-height:36px}
  header{grid-column:1/-1}.stage{grid-column:1}.shotbar{grid-column:2;grid-row:2;flex-direction:column;margin-top:6px;gap:8px}
  .shotbar .pair{flex-direction:column;padding:2px 0}.shotbar .pair:last-child{flex-direction:column-reverse}.shotbar .pair span{padding:2px 0}
  .shotbar button{min-height:42px}.shotbar .go{flex:1 1 auto;max-height:120px;min-width:0;width:84px;max-width:none;padding:0 6px;letter-spacing:.1em;line-height:1.5}.shotbar .go b{display:block;margin:0}}
.panel[hidden]{display:none}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:var(--panel);border:1px solid #3a3160;border-radius:20px;padding:22px 22px 18px;width:min(94%,560px);max-height:94%;overflow:auto;
  box-shadow:0 0 0 1px #ff5ad122,0 30px 80px #000c;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.card h2{font-family:Monoton,cursive;font-weight:400;color:var(--neon);font-size:clamp(24px,5vw,40px);margin:0 0 4px;line-height:1.15}
.card p{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0 14px;font-weight:200}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid button{border-radius:14px;min-height:64px;text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.grid .n{font-size:10px;color:var(--muted)}
.grid .st{color:var(--brass);letter-spacing:2px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .main{background:var(--neon);border-color:var(--neon);color:#1a0616;font-weight:800}
.big{font-size:44px;color:var(--brass);letter-spacing:8px;margin:4px 0}
.stats{font-size:13px;margin:4px 0 8px}
.stats b{font-weight:800}
#buildstamp{display:block;margin-top:14px;font-size:10px;opacity:.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){header{gap:6px}.hud{order:3;flex-basis:100%;justify-content:space-between}.tools button{padding:0 10px}}
@media (max-width:560px){.hud{gap:8px}.hud .lvl{display:none}.tools{flex:1 1 100%;min-width:0}.tools .lvl{display:block;margin-left:auto;align-self:center;padding-left:8px}.pp~h2{padding-right:96px}.card{padding:18px 16px 14px}.pp{top:14px;right:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid button{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.toast{transition:none}.cue.on{animation-name:cuef;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Black Hole Billiards</h1>
  <div class="hud" aria-label="Game status">
    <span class="lvl" id="lvlName">Flat Space</span>
    <span id="solo">shots <b id="shots">0</b> / par <b id="par">3</b></span>
    <span class="duo" id="duo" hidden><span class="pc" id="pc1">P1 <i aria-hidden="true"></i><b>0</b></span><span class="pc b" id="pc2">P2 <i aria-hidden="true"></i><b>0</b></span></span>
    <span>left <b id="left">3</b></span>
    <span class="turn go" id="turn">your shot</span>
  </div>
  <div class="tools">
    <button id="menuBtn" aria-label="Choose a table">Tables</button>
    <button id="resetBtn" aria-label="Restart this table">&#8634;</button>
    <button id="lockBtn" class="tonly" aria-pressed="false" aria-label="Lock aim: letting go locks your aim, then tap Shoot">&#128274;</button>
    <button id="soundBtn" aria-label="Sound on" aria-pressed="true">&#9835;</button>
    <span class="lvl" id="lvlName2" aria-hidden="true"></span>
  </div>
</header>
<div class="stage" id="stage">
  <canvas id="table" tabindex="0" role="img" aria-label="Billiard table in space. Drag back from anywhere and release to shoot; on touch screens the bar below nudges a shot, and the lock button makes letting go lock the aim instead of firing. Keyboard: arrows aim and set power, space shoots. Pool rules: on the 8, C calls a pocket; after a foul, H picks up the cue ball and arrows move it."></canvas>
  <div class="toast off" id="toast" aria-hidden="true"></div>
  <div class="cue" id="cue" aria-hidden="true"></div>
  <div class="panel" id="panel" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="card"></div>
  </div>
</div>
<div class="shotbar" id="shotbar" role="group" aria-label="Shot controls">
  <div class="pair"><button type="button" id="aimL" aria-label="Turn the aim anticlockwise">&#8249;</button><span aria-hidden="true">aim</span><button type="button" id="aimR" aria-label="Turn the aim clockwise">&#8250;</button></div>
  <button type="button" class="go" id="shootBtn" disabled>Pull back to aim</button>
  <div class="pair"><button type="button" id="powD" aria-label="Less power">&#8722;</button><span aria-hidden="true">pow</span><button type="button" id="powU" aria-label="More power">+</button></div>
</div>
<div class="sr" aria-live="polite" id="live"></div>
</div>
<script>
(function(){
'use strict';
var W=1000,H=500,RAIL=46,BR=13,DT=1/480;
var MU=240,MUS=900,REST=6,ER=.94,EC=.76,VMAX=1750,PULL=300;
var POCKETS=[[0,0,30],[W/2,-9,26],[W,0,30],[0,H,30],[W/2,H+9,26],[W,H,30]],CM=34,SM=24;
var COMBO=['','','DOUBLE!','TRIPLE!','QUADRUPLE!','SUPERNOVA!','BIG BANG!'];
var COL=['#f4f1e8','#f5c518','#2464e0','#e0352b','#7b46c9','#f07c1c','#1fa65f','#8a2433','#1a1a20','#f5c518'];
/* 8-ball: each table keeps its layout; one ball becomes the black 8 (E8 = its index in the table's balls), the rest alternate solids and stripes */
var E8=[2,2,2,4,1,4,5,5,4],PKN=['top left','top middle','top right','bottom left','bottom middle','bottom right','the loose black hole'];
var RULES=true;try{RULES=localStorage.getItem('bhb.rules')!=='0';}catch(e){}
function bcol(l){return l===8?'#1a1a20':COL[l>8?l-8:l]||'#ccc';}

function rack(x,y,rows){var o=[],i,j,dx=BR*2*.866+.6;for(i=0;i<rows;i++)for(j=0;j<=i;j++)o.push([x+i*dx,y+(j-i/2)*(BR*2+.6)]);return o;}
var LV=[
 {name:'Flat Space',hint:'Pull back from anywhere on the table. The further you pull, the harder you hit. Let go to shoot.',par:3,cue:[240,250],balls:rack(700,250,2),bodies:[]},
 {name:'Pale Moon',hint:'Moons pull on passing balls. Slow shots bend the most.',par:5,cue:[190,250],balls:rack(770,250,2).concat([[640,95],[640,405]]),
  bodies:[{k:'moon',x:500,y:250,R:36,M:6e6}]},
 {name:'Binary Stars',hint:'Two suns, two pulls. Thread the gap or swing around the outside.',par:6,cue:[160,400],balls:rack(800,250,2).concat([[250,100],[720,440]]),
  bodies:[{k:'star',x:400,y:160,R:26,M:5e6,c:'#ffd27a'},{k:'star',x:600,y:340,R:26,M:5e6,c:'#9cc9ff'}]},
 {name:'Asteroid Belt',hint:'Rocks have no pull, but they bounce you hard.',par:7,cue:[200,250],balls:rack(730,250,3),
  bodies:[{k:'rock',x:470,y:62,R:18},{k:'rock',x:522,y:152,R:22},{k:'rock',x:478,y:250,R:16},{k:'rock',x:530,y:345,R:24},{k:'rock',x:468,y:440,R:17}]},
 {name:'Gas Giant',hint:'Big planet, big pull. Its little moon drifts along the dotted orbit, but only while balls roll.',par:7,cue:[140,250],balls:[[820,100],[860,250],[820,400],[260,80],[260,420],[340,250]],
  bodies:[{k:'giant',x:580,y:250,R:62,M:1.2e7},{k:'moon',R:14,M:2.5e6,orb:[580,250,170,150,.16,-2.1]}]},
 {name:'Slingshot',hint:'No straight line to the pack. Swing around the star, and mind the moon: it moves only while balls roll.',par:8,cue:[120,250],balls:rack(830,250,3),
  bodies:[{k:'star',x:500,y:250,R:44,M:1.6e7,c:'#ffb35c'},{k:'moon',R:14,M:2.5e6,orb:[500,250,168,140,-.16,.9]}]},
 {name:'Event Horizon',hint:'A loose black hole sits mid-table. It eats balls too, the cue ball included.',par:7,cue:[150,250],hungry:1,
  balls:[[300,90],[300,410],[700,90],[700,410],[820,250],[843,237],[843,263]],bodies:[{k:'hole',x:500,y:250,R:16,M:7e6}]},
 {name:'Moon Cue',hint:'Your cue ball is a moon now. Balls it passes get tugged along behind it.',par:7,cue:[170,250],cueM:4.5e6,
  balls:[[470,130],[470,370],[640,250],[790,110],[790,390],[900,250]],bodies:[]},
 {name:'Wormhole',hint:'Roll into one ring and you pop out of the other, same speed, same direction.',par:8,cue:[150,250],
  portals:[[330,130,690,390]],balls:rack(770,170,3).concat([[240,420]]),
  bodies:[75,125,175,225,275,325,375,425].map(function(y,i){return {k:'rock',x:500+(i%2?7:-7),y:y,R:26};})}
];

/* ---------- state ---------- */
var st={lv:0,balls:[],bodies:[],orb:[],shots:0,mode:'aim',roll:0,falling:[],scratch:false,ang:0,pow:.55,aiming:false,kbd:false,t:0,
  pp:1,cur:0,brk:0,sc:[0,0],ps:[0,0]},best={};
/* hot seat: P1 cyan, P2 amber */
var PC=['#5ff2e6','#ffb35c'],PCR=['95,242,230','255,179,92'],pick=1;
try{best=JSON.parse(localStorage.getItem('bhb.best')||'{}')||{};}catch(e){best={};}
var $=function(id){return document.getElementById(id);},cv=$('table'),g=cv.getContext('2d');

/* drifting moons: orb=[cx,cy,rx,ry,angular speed,start angle]; they only move inside step(), so aiming happens on a frozen sky */
function orbit(o){var q=o.orb,c=Math.cos(o.a),s=Math.sin(o.a);o.x=q[0]+q[2]*c;o.y=q[1]+q[3]*s;o.vx=-q[2]*q[4]*s;o.vy=q[3]*q[4]*c;}
function load(i){var L=LV[i];st.lv=i;st.shots=0;st.mode='aim';st.kbd=false;st.falling=[];st.pops=[];st.pots=0;st.scratch=false;st.roll=0;
  st.cur=st.brk;st.sc=[0,0];st.ps=[0,0];
  st.bodies=L.bodies.map(function(b){var o={};for(var k in b)o[k]=b[k];o.M=o.M||0;o.vx=o.vy=0;if(o.orb){o.a=o.orb[5];orbit(o);}o.seed=Math.round(o.x*7+o.y*13);return o;});
  st.orb=st.bodies.filter(function(o){return o.orb;});
  st.portals=(L.portals||[]).map(function(p){return [{x:p[0],y:p[1]},{x:p[2],y:p[3]}];});
  st.pm=L.hungry?9e5:2.5e5;st.pr=L.hungry?110:80;
  st.balls=[mk(0,L.cue[0],L.cue[1])].concat(L.balls.map(function(p,j){return mk(j+1,p[0],p[1]);}));
  var ks=0;st.balls.forEach(function(b){if(!b.n)return;if(b.n-1===E8[i]){b.lab=8;b.g='8';}else{b.g=ks%2?'t':'s';b.lab=ks%2?9+(ks>>1):1+(ks>>1);ks++;}});
  st.call=null;st.bih=false;st.hand=null;st.kh=false;st.grp=[null,null];st.rs=0;st.first=null;st.rail=false;st.potted=[];st.fouls=0;st.lost=false;
  st.balls.forEach(function(b){var a=accel(b.x,b.y);b.rest=Math.hypot(a[0],a[1])<MUS;});
  var cue=st.balls[0],tgt=st.balls[1];st.ang=Math.atan2(tgt.y-cue.y,tgt.x-cue.x);st.pow=.55;
  bake();hud();toast(TOUCH&&!i&&LOCK?'Pull back from anywhere to aim. Let go, fine-tune with the bar below, then tap Shoot.':L.hint,7000);say('Table '+(i+1)+', '+L.name+'. '+L.hint+(st.pp===2?' Player '+(st.cur+1)+' breaks.':''));
  if(st.pp===2)banner('breaks');else $('cue').classList.remove('on');}
function mk(n,x,y){return {n:n,x:x,y:y,vx:0,vy:0,alive:true,rest:true};}

/* ---------- loop ---------- */
var last=0,acc=0,tnEl=$('turn');
function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;st.t+=dt;

  if(st.mode==='roll'){acc+=dt;st.roll+=dt;var n=0,mv=true;while(acc>=DT&&n<60){mv=step();acc-=DT;n++;}if(n>=60)acc=0;

    var vmax=0;st.balls.forEach(function(b){if(b.alive&&!b.rest)vmax=Math.max(vmax,Math.hypot(b.vx,b.vy));});st.slow=vmax<28?(st.slow||0)+dt:0;
    tnEl.style.setProperty('--m',Math.min(100,Math.sqrt(vmax/VMAX)*100).toFixed(0)+'%'); /* momentum meter */
    if(st.roll>15||st.slow>.8)st.balls.forEach(function(b){b.vx=b.vy=0;b.rest=true;});

    st.bodies.forEach(function(o){if(o.k==='hole')dm=Math.min(dm,Math.hypot(cb.x-o.x,cb.y-o.y)-o.R);});dz=Math.max(0,Math.min(1,1-(dm-10)/130));}

/* ---------- input ---------- */
var drag=null;

  /* ball in hand: grab the cue ball and put it anywhere */
  if(RULES&&st.bih&&Math.hypot(p[0]-c.x,p[1]-c.y)<(tch?42:BR+12)){st.hand={id:e.pointerId,ox:c.x-p[0],oy:c.y-p[1],gx:c.x,gy:c.y};st.kbd=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}sfx.env(660,'triangle',.05,.05);return;}

  if(RULES&&onEight(sh())){var q=nearPk(p,tch?64:48);if(q>=0)callPk(q);}
  drag={p:p,id:e.pointerId,tch:tch,h:[]};st.aiming=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(st.hand&&e.pointerId===st.hand.id){var hp=pos(e);place(hp[0]+st.hand.ox,hp[1]+st.hand.oy);return;}if(!drag||e.pointerId!==drag.id)return;var p=pos(e),dx=drag.p[0]-p[0],dy=drag.p[1]-p[1],d=Math.hypot(dx,dy);
  if(d<(drag.tch?22:8)){st.aiming=false;return;}st.aiming=true;st.ang=Math.atan2(dy,dx);var pw0=st.pow;st.pow=Math.min(1,d/PULL);
  if(Math.floor(st.pow*10)!==Math.floor(pw0*10))sfx.env(st.pow>=MINP?520+st.pow*700:300,'triangle',.03,.035);
  drag.h.push([e.timeStamp,st.ang,st.pow]);if(drag.h.length>12)drag.h.shift();});
function up(e){if(st.hand&&e.pointerId===st.hand.id){st.hand=null;st.ready=0;sfx.env(880,'triangle',.05,.04);say('Cue ball placed. Pull back from anywhere to shoot.');return;}if(!drag||e.pointerId!==drag.id)return;var dg=drag;drag=null;if(!st.aiming)return;st.aiming=false;

  for(var k=dg.h.length-1;k>=0;k--)if(e.timeStamp-dg.h[k][0]>=60){st.ang=dg.h[k][1];st.pow=dg.h[k][2];break;}

  st.kbd=true;sfx.ready();say('Aim locked at '+Math.round(st.pow*100)+' percent power. Fine-tune, then shoot.');}

cv.addEventListener('keydown',function(e){if(st.mode!=='aim')return;var k=e.key,f=e.shiftKey?.2:1;
  if(RULES&&(k==='c'||k==='C')&&onEight(sh())){callPk(st.call==null?0:(st.call+1)%(hole0()?7:6));e.preventDefault();return;}
  if(RULES&&(k==='h'||k==='H')&&st.bih){st.kh=!st.kh;say(st.kh?'Ball in hand: arrows move the cue ball. Press H again when it is in place.':'Cue ball placed.');e.preventDefault();return;}
  if(st.kh&&st.bih&&k.indexOf('Arrow')===0){var cb=st.balls[0],m=e.shiftKey?2:8;place(cb.x+(k==='ArrowLeft'?-m:k==='ArrowRight'?m:0),cb.y+(k==='ArrowUp'?-m:k==='ArrowDown'?m:0));e.preventDefault();return;}
  if(k==='ArrowLeft'){st.ang-=f*Math.PI/180;}else if(k==='ArrowRight'){st.ang+=f*Math.PI/180;}
  else if(k==='ArrowUp'){st.pow=Math.min(1,st.pow+.05);}else if(k==='ArrowDown'){st.pow=Math.max(.05,st.pow-.05);}
  else if(k===' '||k==='Enter'){e.preventDefault();if(st.kbd)strike();else st.kbd=true;return;}else return;
  e.preventDefault();st.kbd=true;});

/* ---------- phone shot bar ---------- */
var TOUCH=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches),LOCK=false;
/* v1.9.1: letting go shoots again by default (angienimo liked the flick); 🔒 makes it lock the aim for a Shoot tap. The nudges work either way: they pick up your last aim */
try{LOCK=localStorage.getItem('bhb.lock')==='1';}catch(_){}

  k=(LOCK?1:0)+'|'+(can?1:0)+'|'+(on?Math.round(st.pow*100):-1)+'|'+(st.pp===2?st.cur:-1)+'|'+st.mode;if(k===barK)return;barK=k;var b=$('shootBtn');
  b.disabled=!on;b.innerHTML=on?'Shoot<b>'+Math.round(st.pow*100)+'%</b>':st.mode==='roll'||st.mode==='stroke'?'rolling…':st.mode==='done'?'cleared':LOCK?'Pull back to aim':'Pull back, let go';
  if(st.pp===2)b.style.setProperty('--pc',PC[st.cur]);else b.style.removeProperty('--pc');['aimL','aimR','powD','powU'].forEach(function(id){$(id).disabled=!can;});}
/* tap = a hair (a quarter degree, 1% power); hold to sweep, faster the longer you hold */
function nudge(id,f){var el=$(id),rt=0,t0=0;
  function tick(){var h=(performance.now()-t0)/1000;f(h<1.2?1:h<2.4?3:6);barUI();}

    rt=setTimeout(function rep(){tick();rt=setTimeout(rep,45);},380);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){el.addEventListener(n,stop);});

nudge('aimL',aimBy(-1));nudge('aimR',aimBy(1));nudge('powD',powBy(-1));nudge('powU',powBy(1));
$('shootBtn').addEventListener('click',function(){if(st.kbd&&st.mode==='aim')strike();barUI();});
if(TOUCH)document.body.classList.add('touch');
$('lockBtn').addEventListener('click',function(){LOCK=!LOCK;try{localStorage.setItem('bhb.lock',LOCK?'1':'0');}catch(_){}lockUI();
  toast(LOCK?'Aim lock on: letting go locks your aim. Nudge it, then tap Shoot.':'Aim lock off: letting go shoots. The bar still nudges your last shot.',3500);});
lockUI();

/* ---------- ui ---------- */
function hud(){var L=LV[st.lv],tn=$('turn'),go=st.mode!=='roll',two=st.pp===2;var k8=RULES&&go&&st.mode!=='done'?(st.bih?(two?'in hand':'ball in hand'):onEight(sh())&&st.call==null?'call the 8':''):'';
  tn.textContent=st.mode==='done'?(st.lost&&!two?'rack lost':two?'game over':'cleared'):go?(two?'P'+(st.cur+1)+(k8?' · '+k8:'’s shot'):k8||'your shot'):'rolling…';tn.className='turn'+(go?' go':'');
  if(two)tn.style.setProperty('--pc',PC[st.cur]);else tn.style.removeProperty('--pc');$('solo').hidden=two;$('duo').hidden=!two;
  if(two)[0,1].forEach(function(k){var el=$('pc'+(k+1)),g8=RULES&&st.grp[k];el.querySelector('b').textContent=RULES?(g8?own(k)||'8':'·'):st.sc[k];if(g8)el.dataset.g=g8;else delete el.dataset.g;el.classList.toggle('on',k===st.cur&&st.mode!=='done');});$('lvlName').textContent=$('lvlName2').textContent=(st.lv+1)+'. '+L.name;$('shots').textContent=st.shots;$('par').textContent=L.par;$('left').textContent=left();}
var tt=0;function toast(s,ms){var el=$('toast');el.textContent=s;el.classList.remove('off');clearTimeout(tt);tt=setTimeout(hideToast,ms||4000);}

var lastFocus=null;

function menu(first){pick=st.pp;var h='<div class="pp" role="group" aria-label="Players"><button type="button" data-pp="1" aria-pressed="'+(pick===1)+'" aria-label="One player">1P</button><button type="button" data-pp="2" aria-pressed="'+(pick===2)+'" aria-label="Two players on this device">2P</button></div><h2 id="pTitle">'+(first?'Black Hole Billiards':'Tables')+'</h2><p>Pool on a table adrift in space. Planets and stars bend every shot, and each pocket is a black hole. Clear the table in as few shots as you can.</p><div class="rrow"><button type="button" class="rb" data-rules aria-pressed="'+RULES+'">Pool rules</button><p class="rules" id="rules">'+rtxt()+'</p></div><div class="grid">';
  LV.forEach(function(L,i){var b=best[i],s=b?stars(b,L.par):0;h+='<button data-lv="'+i+'" aria-label="Table '+(i+1)+', '+L.name+(b?', best '+b+' shots, '+s+' stars':', not cleared yet')+'"><span class="n">TABLE '+(i+1)+(b?' · best '+b:'')+'</span>'+L.name+'<span class="st">'+(b?'★★★☆☆☆'.substr(3-s,3):'· · ·')+'</span></button>';});
  h+='</div><span id="buildstamp" role="note" aria-label="Build information">build v1.11 · 2026-09-28 · dev</span>';show(h);}
$('card').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.pp){pick=+b.dataset.pp;$('card').querySelectorAll('[data-pp]').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.pp===pick));});$('rules').textContent=rtxt();return;}
