<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Box — a puzzle that shuffles itself</title>
<meta name="description" content="A warm little sliding puzzle under lamplight: the box rearranges itself while you watch, then waits. Click the tiles home, pull the lamp chain, no accounts, no assets, no hurry.">
<meta property="og:title" content="Cozy Box — a puzzle that shuffles itself">
<meta property="og:description" content="The box shuffles itself while you watch. Then it waits. Slide the picture home under warm lamplight.">
<meta property="og:url" content="https://sloppy.live/cozy-box/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/a%20warm%20wooden%20puzzle%20box%20with%20sliding%20tiles%20showing%20a%20cottage%20at%20dusk%2C%20single%20lamp%20glow%20from%20above%2C%20cozy%20dark%20room%2C%20soft%20illustration.png?width=1200&height=630&seed=8484&nologo=true">
<link rel="icon" href="https://emojicdn.elk.sh/🧩">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;700&family=Andika:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --room:#171310; --wood:#4a3220; --wood-hi:#6a4a2e; --wood-dark:#33220f;
  --lamp:#ffd9a0; --ink:#efe4d2; --dim:#a4917a; --glow:#ffb45c;
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:var(--room); color:var(--ink);
  font-family:'Andika', sans-serif; display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
}
/* the lamplight: one warm cone over everything */
#light{
  position:fixed; inset:0; pointer-events:none; z-index:1; transition:opacity 1.2s ease;
  background:
    radial-gradient(42rem 34rem at 50% 6rem, rgba(255,196,120,.22) 0%, rgba(255,180,92,.08) 45%, transparent 70%),
    radial-gradient(20rem 14rem at 50% 4rem, rgba(255,220,160,.18) 0%, transparent 60%);
}
body.dim #light{ opacity:.35; }
body.solved-glow #light{
  background:
    radial-gradient(46rem 38rem at 50% 6rem, rgba(255,205,130,.34) 0%, rgba(255,180,92,.14) 45%, transparent 72%),
    radial-gradient(22rem 15rem at 50% 4rem, rgba(255,228,170,.3) 0%, transparent 60%);
}
main{ position:relative; z-index:2; max-width:30rem; padding:1rem 1rem 3rem; text-align:center; }
h1{
  font-family:'Grandstander', cursive; font-weight:700; font-size:clamp(1.7rem,6vw,2.4rem);
  margin:.7rem 0 .1rem; color:var(--lamp);
  text-shadow:0 0 24px rgba(255,180,92,.35);
}
.sub{ color:var(--dim); font-size:.85rem; margin:0 0 .8rem; font-style:italic; }

/* the lamp + pull chain */
#lamp{
  width:5.5rem; height:2.6rem; margin:0 auto; position:relative;
  background:linear-gradient(180deg, #7a5a34, #593e20); border-radius:0 0 2.6rem 2.6rem;
  box-shadow:0 .5rem 2rem rgba(255,190,110,.35), inset 0 -0.6rem 1rem rgba(255,210,150,.55);
}
#lamp::before{ content:''; position:absolute; top:-3rem; left:50%; width:2px; height:3rem; background:#2a2018; }
#chain{
  position:absolute; right:-1rem; top:2rem; width:2.75rem; height:2.75rem; cursor:pointer;
  background:none; border:none; font-size:1.1rem; color:var(--dim); min-height:2.75rem;
}
#chain::before{ content:''; position:absolute; top:-1.4rem; left:50%; width:2px; height:1.5rem; background:#8a765c; }
#chain:hover{ color:var(--lamp); }
#chain:focus-visible{ outline:2px dashed var(--lamp); outline-offset:2px; border-radius:50%; }

/* the box */
#box-wrap{ margin-top:1.6rem; display:inline-block; position:relative; }
#box{
  position:relative; padding:1rem; border-radius:1.1rem;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.08) 0 4px, transparent 4px 11px),
    linear-gradient(160deg, var(--wood-hi), var(--wood) 40%, var(--wood-dark));
  box-shadow:0 1.4rem 3rem rgba(0,0,0,.55), inset 0 2px 4px rgba(255,220,170,.25), inset 0 -4px 8px rgba(0,0,0,.4);
}
#grid{
  position:relative; width:19.5rem; height:19.5rem; border-radius:.5rem;
  background:#241a10; box-shadow:inset 0 3px 9px rgba(0,0,0,.7);
}
.tile{
  position:absolute; left:0; top:0; width:6.1rem; height:6.1rem; padding:0; border:none; cursor:pointer;
  border-radius:.45rem; overflow:hidden;
  transition:transform .24s cubic-bezier(.25,1,.4,1), box-shadow .3s;
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,230,190,.25);
  background:#000;
}
.tile:hover{ box-shadow:0 5px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,230,190,.4), 0 0 12px rgba(255,180,92,.25); }
.tile:focus-visible{ outline:3px solid var(--lamp); outline-offset:-3px; }
.tile canvas{ display:block; width:100%; height:100%; }
.tile.wiggle{ animation:wiggle .3s ease; }
@keyframes wiggle{ 25%{ transform:var(--tf) translateX(.22rem);} 75%{ transform:var(--tf) translateX(-.22rem);} }
body.solved-glow .tile{ box-shadow:0 3px 10px rgba(0,0,0,.4), 0 0 18px rgba(255,190,110,.5); }
#motes{ position:absolute; inset:-2rem; pointer-events:none; overflow:visible; }
.mote{
  position:absolute; width:.3rem; height:.3rem; border-radius:50%;
  background:radial-gradient(circle, #ffe9c2, rgba(255,200,120,.0) 70%);
  animation:drift 5s ease-in-out forwards; opacity:0;
}
@keyframes drift{
  0%{ opacity:0; transform:translateY(0) scale(.7);}
  15%{ opacity:.9; }
  100%{ opacity:0; transform:translateY(-7rem) translateX(var(--dx)) scale(1.2);}
}
#status{ margin-top:.9rem; min-height:1.4rem; font-size:.92rem; }
#status b{ color:var(--lamp); font-weight:400; }
.btns{ display:flex; gap:.6rem; justify-content:center; margin-top:.7rem; flex-wrap:wrap; }
button.act{
  font-family:'Grandstander', cursive; font-size:.85rem; cursor:pointer; min-height:2.9rem;
  background:#2c2115; color:var(--ink); border:1.5px solid #5a4022; border-radius:.7rem; padding:.4rem 1.1rem;
}
button.act:hover{ border-color:var(--lamp); color:var(--lamp); }
button.act:focus-visible{ outline:3px solid var(--lamp); outline-offset:2px; }
button.act[disabled]{ opacity:.5; cursor:default; }
#moves{ color:var(--dim); font-size:.75rem; margin-top:.5rem; }
footer{ position:relative; z-index:2; color:#6a5b48; font-size:.72rem; margin:1rem 0 1.4rem; line-height:1.8; text-align:center; }
@media (prefers-reduced-motion: reduce){
  .tile{ transition:none !important; }
  .mote{ animation:none !important; display:none; }
  *{ animation-duration:.001s !important; }
}
</style>
</head>
<body>
<div id="light" aria-hidden="true"></div>
<main>
  <div id="lamp" aria-hidden="true">
    <button id="chain" type="button" aria-label="Pull the lamp chain to dim or brighten the light" aria-pressed="false">⛓</button>
  </div>
  <h1>cozy box</h1>
  <p class="sub">it shuffles itself. putting it back is your part.</p>

  <div id="box-wrap">
    <div id="box">
      <div id="grid" role="group" aria-label="Sliding picture puzzle, three by three. Use the tiles or arrow keys."></div>
    </div>
    <div id="motes" aria-hidden="true"></div>
  </div>

  <p id="status" role="status" aria-live="polite">the box is waking up…</p>
  <div class="btns">
    <button type="button" class="act" id="btn-shuffle">shuffle again</button>
    <button type="button" class="act" id="btn-reset">put it back (reset)</button>
  </div>
  <p id="moves"></p>
</main>
<footer>
  drawn entirely by the page — no images, no sounds fetched, nothing leaves this room.<br>
  arrow keys slide tiles into the gap, if clicking feels like too much reaching.
</footer>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };

/* ── the picture: a cottage at dusk, drawn once, split in nine ── */
var ART=document.createElement('canvas'); ART.width=468; ART.height=468;
(function paintScene(){
  var c=ART.getContext('2d');
  var sky=c.createLinearGradient(0,0,0,468);
  sky.addColorStop(0,'#1c2547'); sky.addColorStop(.55,'#3d3560'); sky.addColorStop(.8,'#7a4a55'); sky.addColorStop(1,'#a8663f');
  c.fillStyle=sky; c.fillRect(0,0,468,468);
  for(var i=0;i<40;i++){
    var sx=(i*137.5)%468, sy=(i*89.3)%260;
    c.fillStyle='rgba(255,244,214,'+(0.3+((i*7)%10)/16)+')';
    c.fillRect(sx,sy,2.4,2.4);
  }
  c.fillStyle='#f4e9c8';
  c.beginPath(); c.arc(360,96,44,0,7); c.fill();
  c.fillStyle='rgba(210,190,150,.5)';
  c.beginPath(); c.arc(345,88,9,0,7); c.fill();
  c.beginPath(); c.arc(372,110,6,0,7); c.fill();
  c.fillStyle='rgba(244,233,200,.16)';
  c.beginPath(); c.arc(360,96,64,0,7); c.fill();
  /* hills */
  c.fillStyle='#241f38';
  c.beginPath(); c.moveTo(0,330);
  for(var x=0;x<=468;x+=26){ c.lineTo(x,330-Math.sin(x/95)*26-((x*7)%13)); }
  c.lineTo(468,468); c.lineTo(0,468); c.fill();
  c.fillStyle='#191524';
  c.beginPath(); c.moveTo(0,392);
  for(var x2=0;x2<=468;x2+=22){ c.lineTo(x2,392-Math.sin(x2/60+2)*15); }
  c.lineTo(468,468); c.lineTo(0,468); c.fill();
  /* cottage */
  c.fillStyle='#2e2318'; c.fillRect(150,300,168,110);
  c.fillStyle='#1c1510';
  c.beginPath(); c.moveTo(132,304); c.lineTo(234,240); c.lineTo(336,304); c.closePath(); c.fill();
  c.fillStyle='#3a2c1c'; c.fillRect(292,252,22,42);
  /* smoke */
  c.strokeStyle='rgba(220,220,230,.35)'; c.lineWidth=7; c.lineCap='round';
  c.beginPath(); c.moveTo(303,246);
  c.quadraticCurveTo(316,220,303,196); c.quadraticCurveTo(290,176,306,152);
  c.stroke();
  /* the lit window — the heart of the scene */
  var wg=c.createRadialGradient(216,348,4,216,348,60);
  wg.addColorStop(0,'rgba(255,205,120,.9)'); wg.addColorStop(1,'rgba(255,205,120,0)');
  c.fillStyle=wg; c.fillRect(156,288,120,120);
  c.fillStyle='#ffcf7c'; c.fillRect(196,326,44,46);
  c.fillStyle='#2e2318'; c.fillRect(215,326,4,46); c.fillRect(196,346,44,4);
  /* the cat on the sill */
  c.fillStyle='#14100c';
  c.beginPath(); c.arc(228,364,7,0,7); c.fill();
  c.beginPath(); c.ellipse(220,370,9,5.5,0,0,7); c.fill();
  c.beginPath(); c.moveTo(223,358); c.lineTo(226,352); c.lineTo(229,358); c.fill();
  c.beginPath(); c.moveTo(229,358); c.lineTo(232,353); c.lineTo(234,359); c.fill();
  c.strokeStyle='#14100c'; c.lineWidth=2.4;
  c.beginPath(); c.moveTo(211,371); c.quadraticCurveTo(203,368,204,360); c.stroke();
  /* door */
  c.fillStyle='#4a3018'; c.fillRect(252,352,30,58);
  c.fillStyle='#c9a86a'; c.fillRect(274,380,4,4);
  /* foreground grass ticks */
  c.strokeStyle='rgba(90,72,48,.8)'; c.lineWidth=2;
  for(var g=0;g<50;g++){
    var gx=(g*61)%468, gy=430+((g*13)%30);
    c.beginPath(); c.moveTo(gx,gy); c.lineTo(gx+3,gy-9); c.stroke();
  }
})();

/* ── puzzle state: cells[pos] = tileIndex (0-7), 8 = gap ── */
var N=3, GAP=8, cells=[], tiles=[], moves=0, busy=false, everShuffled=false;
var TILE_REM=6.1, GAP_REM=0.35;   /* grid inner spacing: pos → rem offset */
function posRem(p){ var r=Math.floor(p/N), c2=p%N;
  return { x:.35+c2*(TILE_REM+.35), y:.35+r*(TILE_REM+.35) }; }
function isSolved(){ return cells.every(function(t,i){ return t===i; }); }
function gapPos(){ return cells.indexOf(GAP); }
function adjacent(a,b){
  var ar=Math.floor(a/N), ac=a%N, br=Math.floor(b/N), bc=b%N;
  return Math.abs(ar-br)+Math.abs(ac-bc)===1;
}
function layout(){
  cells.forEach(function(t,p){
    if(t===GAP) return;
    var el=tiles[t], r=posRem(p);
    el.style.setProperty('--tf','translate('+r.x+'rem,'+r.y+'rem)');
    el.style.transform='translate('+r.x+'rem,'+r.y+'rem)';
    el.setAttribute('aria-label','Piece '+(t+1)+' — row '+(Math.floor(p/N)+1)+', column '+(p%N+1)
      +(adjacent(p,gapPos())?'. Press to slide.':''));
  });
}
function tryMove(t, countIt){
  var p=cells.indexOf(t), g=gapPos();
  if(!adjacent(p,g)){
    var el=tiles[t];
    el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle');
    return false;
  }
  cells[g]=t; cells[p]=GAP;
  if(countIt){ moves++; $('moves').textContent=moves+' move'+(moves===1?'':'s')+' — no rush at all.'; }
  layout();
  tick();
  if(countIt && everShuffled && isSolved()) celebrate();
  return true;
}
/* soft slide tick (synth, quiet, no assets) */
var AC=null;
function tick(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle'; o.frequency.value=190+Math.random()*40;
    g.gain.setValueAtTime(0.018,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.1);
  }catch(e){}
}
function chord(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    [262,330,392,523].forEach(function(f,i){
      var t=AC.currentTime+i*0.09, o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.045,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+1.2);
    });
  }catch(e){}
}

/* ── self-rearranging: the box shuffles ITSELF, visibly ── */
function selfShuffle(n){
  if(busy) return;
  busy=true; everShuffled=true; moves=0;
  $('moves').textContent='';
  document.body.classList.remove('solved-glow');
  $('status').innerHTML='the box is <b>rearranging itself</b>… it does this. let it.';
  $('btn-shuffle').disabled=true; $('btn-reset').disabled=true;
  var last=-1, step=0;
  (function one(){
    if(step>=n){
      busy=false;
      $('btn-shuffle').disabled=false; $('btn-reset').disabled=false;
      $('status').innerHTML='there. your turn — <b>slide it home</b>.';
      return;
    }
    var g=gapPos();
    var opts=[];
    for(var p=0;p<9;p++){ if(cells[p]!==GAP && adjacent(p,g) && cells[p]!==last) opts.push(cells[p]); }
    var pick=opts[Math.floor(Math.random()*opts.length)];
    last=pick;
    tryMove(pick,false);
    step++;
    setTimeout(one, 130);
  })();
}
function celebrate(){
  document.body.classList.add('solved-glow');
  $('status').innerHTML='<b>home.</b> the picture breathes, the lamp leans closer, the cat pretends not to care.';
  chord();
  var mw=$('motes');
  for(var i=0;i<16;i++){
    var m=document.createElement('span'); m.className='mote';
    m.style.left=(10+Math.random()*80)+'%';
    m.style.top=(30+Math.random()*60)+'%';
    m.style.setProperty('--dx',(Math.random()*4-2)+'rem');
    m.style.animationDelay=(Math.random()*1.2)+'s';
    mw.appendChild(m);
  }
  setTimeout(function(){ mw.innerHTML=''; }, 7000);
}
function reset(){
  if(busy) return;
  cells=[0,1,2,3,4,5,6,7,GAP];
  moves=0; $('moves').textContent='';
  layout();
  document.body.classList.remove('solved-glow');
  $('status').innerHTML='back together, the easy way. <b>no judgement in this room.</b>';
}

/* ── build tiles ── */
(function build(){
  cells=[0,1,2,3,4,5,6,7,GAP];
  var grid=$('grid');
  for(var t=0;t<8;t++){
    (function(t2){
      var b=document.createElement('button');
      b.className='tile'; b.type='button';
      var cv=document.createElement('canvas'); cv.width=156; cv.height=156;
      cv.getContext('2d').drawImage(ART, (t2%N)*156, Math.floor(t2/N)*156, 156,156, 0,0,156,156);
      b.appendChild(cv);
      b.addEventListener('click', function(){ if(!busy) tryMove(t2,true); });
      grid.appendChild(b);
      tiles[t2]=b;
    })(t);
  }
  layout();
})();

/* ── keyboard: arrows slide the tile INTO the gap (RS of cozy) ── */
addEventListener('keydown', function(e){
  if(busy) return;
  var g=gapPos(), gr=Math.floor(g/N), gc=g%N, from=null;
  if(e.key==='ArrowUp'   && gr<N-1) from=g+N;      /* tile below slides up */
  if(e.key==='ArrowDown' && gr>0)   from=g-N;
  if(e.key==='ArrowLeft' && gc<N-1) from=g+1;
  if(e.key==='ArrowRight'&& gc>0)   from=g-1;
  if(from!==null){ e.preventDefault(); tryMove(cells[from],true); }
});

/* ── lamp chain ── */
$('chain').addEventListener('click', function(){
  var dim=document.body.classList.toggle('dim');
  this.setAttribute('aria-pressed', String(dim));
  $('status').innerHTML= dim? 'dimmer. the puzzle doesn\'t mind the dark.' : 'brighter. the wood remembers the sun.';
});

$('btn-shuffle').addEventListener('click', function(){ selfShuffle(24); });
$('btn-reset').addEventListener('click', reset);

/* wake up: the box rearranges itself on arrival */
setTimeout(function(){ selfShuffle(24); }, 900);

window.__CB={ get cells(){ return cells; }, tryMove:tryMove, isSolved:isSolved, selfShuffle:selfShuffle,
  reset:reset, gapPos:gapPos, adjacent:adjacent, get busy(){ return busy; }, get moves(){ return moves; },
  celebrate:celebrate };
})();
</script>
</body>
</html>
