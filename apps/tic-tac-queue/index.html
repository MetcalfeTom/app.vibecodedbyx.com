<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Queue</title>
<meta name="description" content="Tic-tac-toe where you only get three marks. Place a fourth and your oldest one leaves. No draws, just a solved bot.">
<link rel="icon" href="https://emojicdn.elk.sh/🎟️">
<meta property="og:title" content="Tic Tac Queue">
<meta property="og:description" content="Three marks each. Place a fourth and your oldest leaves. Can you beat a bot that has solved the game?">
<meta property="og:url" content="https://sloppy.live/tic-tac-queue/">
<meta property="og:image" content="https://sloppy.live/tic-tac-queue/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Martian+Mono:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5ecd9;--paper2:#efe2c6;--ink:#231d17;--soft:#6d6152;--x:#d23f2b;--o:#0f7d76;--tile:#fffaf0;--line:#d9c9a8;--gold:#e8a31b;--owl:#8a5a33}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:14px/1.5 'Martian Mono',ui-monospace,monospace;
  background:var(--paper);background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(160,120,60,.06) 22px 44px),radial-gradient(circle at 50% 0,#fff6e3,transparent 60%)}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font:400 clamp(34px,10vw,54px)/.95 'Bungee',Impact,sans-serif;margin:0;letter-spacing:.5px;animation:up .5s both}
h1 .q{color:var(--x)}h1 .u{color:var(--o)}
.rule{margin:8px 0 16px;color:var(--soft);font-weight:300;font-size:13px;animation:up .5s .06s both}
.rule b{color:var(--ink);font-weight:800}
@keyframes up{from{transform:translateY(10px)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;animation:up .5s .1s both}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--tile)}
.seg button{border:0;background:none;font:500 12px 'Martian Mono',monospace;color:var(--ink);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg .lab{font:300 11px 'Martian Mono',monospace;color:var(--soft);padding:7px 2px 0 11px}
[hidden]{display:none!important}
.btn{border:2px solid var(--ink);background:var(--gold);color:var(--ink);font:800 12px 'Martian Mono',monospace;padding:7px 13px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ghost{border:0;background:none;font:500 12px 'Martian Mono',monospace;color:var(--soft);text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:min(100%,420px);aspect-ratio:1;margin:0 auto;padding:10px;border-radius:18px;background:var(--paper2);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);animation:up .5s .14s both}
.cell{position:relative;min-width:0;min-height:0;border:0;border-radius:12px;background:var(--tile);box-shadow:inset 0 -4px 0 var(--line);cursor:pointer;padding:0;display:grid;place-items:center;transition:background .15s}
.cell:hover:not([aria-disabled=true]){background:#fff}
.cell[aria-disabled=true]{cursor:default}
.cell>svg{position:absolute;inset:15%;width:70%;height:70%;overflow:visible}
.cell svg line,.cell svg circle{fill:none;stroke-width:13;stroke-linecap:round}
.cell.X svg line{stroke:var(--x)}.cell.O svg circle{stroke:var(--o)}
.cell .fresh line,.cell .fresh circle{stroke-dasharray:101;stroke-dashoffset:101;animation:draw .28s ease-out forwards}
.cell .fresh line+line{animation-delay:.12s}
@keyframes draw{to{stroke-dashoffset:0}}
.tk{position:absolute;top:6px;left:7px;font:800 11px/1 'Martian Mono',monospace;padding:3px 5px;border-radius:5px;background:var(--paper2);color:var(--soft)}
.cell.X .tk{color:var(--x)}.cell.O .tk{color:var(--o)}
.cell.doom svg{opacity:.38;animation:wob 1.4s ease-in-out infinite}
.cell.doom .tk{background:var(--ink);color:var(--paper)}
.cell.rq{cursor:pointer}.cell.rq:hover{background:#fff}
.cell.rq.doom::after{content:'re-queue'}
.cell.doom::after{content:'next out';position:absolute;bottom:7px;left:0;right:0;text-align:center;font:500 10px 'Martian Mono',monospace;color:var(--soft);letter-spacing:.04em}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.cell .gone{position:absolute;inset:15%;animation:poof .45s ease-in forwards;pointer-events:none}
.cell .gone svg{width:100%;height:100%}
@keyframes poof{to{opacity:0;transform:scale(.4) rotate(25deg)}}
.cell.ban{background:repeating-linear-gradient(135deg,var(--tile) 0 9px,var(--paper2) 9px 18px)}
.cell.ban::after{content:'no first move';position:absolute;bottom:7px;left:0;right:0;text-align:center;font:500 10px 'Martian Mono',monospace;color:var(--soft)}
.cell.hint{box-shadow:inset 0 0 0 3px var(--owl),inset 0 -4px 0 var(--line);animation:only .9s ease-in-out infinite alternate}
.cell.hint::after{content:"owl's pick";position:absolute;bottom:7px;left:0;right:0;text-align:center;font:500 10px 'Martian Mono',monospace;color:var(--owl)}
/* the owl (v1.4): a coach that only speaks after you move */
.owlrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:8px 0 0;min-height:56px}
.owl{width:58px;height:58px;flex:none;overflow:visible;transform-origin:50% 95%}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(0)}97.5%{transform:scaleY(1)}}
.owl.sigh .lid{animation:sigh 2.6s ease-in-out infinite}
@keyframes sigh{0%,100%{transform:scaleY(.5)}45%,55%{transform:scaleY(1)}}
.owl.happy .lid{animation:none;transform:scaleY(.75)}
.owl .pu{transform-box:fill-box;transform-origin:50% 50%;transition:transform .2s}
.owl.wide .pu{transform:scale(.45)}.owl.wide{animation:jolt .35s}
@keyframes jolt{30%{transform:translateY(-6px)}}
.owl.puff{animation:puff .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes puff{35%{transform:scale(1.32)}}
.owl .fe{fill:none;stroke:var(--owl);stroke-width:2.5;stroke-linecap:round;opacity:0;transform-origin:30px 32px}
.owl.puff .fe{animation:fe 1s ease-out}
@keyframes fe{20%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.bub{position:relative;font:500 12px/1.45 'Martian Mono',monospace;color:var(--ink);background:var(--tile);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;max-width:min(290px,64vw)}
.bub::before{content:'';position:absolute;left:-8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right:8px solid var(--ink)}
.bub.pop{animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bub:empty{display:none}
.owlrow .ghost[aria-disabled=true]{color:var(--line);cursor:default;text-decoration:none}
.status small.fs .ghost{font-size:12px;padding:2px 4px}
.status small.fs{display:block;font:300 12px 'Martian Mono',monospace;color:var(--soft);margin-top:6px;letter-spacing:0}
.cell.only{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -4px 0 var(--line);animation:only .9s ease-in-out infinite alternate}
@keyframes only{to{background:#fff3c4}}
.cell.win{background:#fff3c4;box-shadow:inset 0 0 0 4px var(--gold)}
.cell.win svg{animation:pulse .7s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.12)}}
.status{min-height:2.6em;text-align:center;margin:16px 0 4px;font:400 clamp(17px,5vw,22px)/1.2 'Bungee',sans-serif}
.status .x{color:var(--x)}.status .o{color:var(--o)}
.oracle{text-align:center;color:var(--soft);font-size:12px;min-height:1.5em}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12px;color:var(--soft)}
.score b{color:var(--ink);font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* wide screens: board on the right, the talk on the left */
@media (min-width:900px) and (min-aspect-ratio:4/3){
  .wrap{max-width:1040px;display:grid;grid-template-columns:minmax(0,1fr) min(440px,46vw);grid-template-areas:"hd bd" "sd bd";column-gap:48px;align-content:center;min-height:100vh;padding-block:28px}
  .hd{grid-area:hd;align-self:end}.board{grid-area:bd;align-self:center}.sd{grid-area:sd;align-self:start}
  h1{font-size:clamp(54px,6vw,76px)}.rule{font-size:15px;max-width:30em}
  .status{text-align:left;margin-top:8px}.oracle{text-align:left}.owlrow{justify-content:flex-start}.foot{justify-content:flex-start;gap:14px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cell .gone{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hd">
  <h1>Tic Tac <span class="q">Q</span><span class="u">ueue</span></h1>
  <p class="rule" id="rule"><b>Three marks each.</b> Place a fourth and your oldest one leaves. Three in a row wins.</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Marks each" id="kk"><span class="lab" aria-hidden="true">marks</span><button data-k="2" aria-pressed="false">2</button><button data-k="3" aria-pressed="true">3</button><button data-k="4" aria-pressed="false">4</button></div>
    <div class="seg" role="group" aria-label="Opponent"><button id="mBot" aria-pressed="true">vs bot</button><button id="mDuo" aria-pressed="false">2 players</button></div>
    <div class="seg" role="group" aria-label="Bot level" id="lvl"><button data-l="0" aria-pressed="false">rookie</button><button data-l="1" aria-pressed="true">sharp</button><button data-l="2" aria-pressed="false">perfect</button></div>
  </div>
  </header>
  <div class="board" id="board" role="grid" aria-label="Board"></div>
  <section class="sd">
  <div class="status" id="status" aria-live="polite"></div>
  <div class="oracle" id="oracle"></div>
  <div class="owlrow" id="owlrow">
    <svg class="owl" id="owl" viewBox="0 0 60 60" aria-hidden="true">
      <path class="fe" d="M7 22l-5-3M6 33H1M9 45l-5 3M53 22l5-3M54 33h5M51 45l5 3"/>
      <path d="M12 22l2-13 10 8zM48 22l-2-13-10 8z" fill="#5e3a20"/>
      <ellipse cx="30" cy="35" rx="19" ry="21" fill="var(--owl)"/>
      <ellipse cx="30" cy="43" rx="12" ry="12" fill="#e2c193"/>
      <path d="M26 41q4 3 8 0M24 47q6 3 12 0" fill="none" stroke="#c9a372" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="22" cy="28" r="8" fill="#fffaf0"/><circle cx="38" cy="28" r="8" fill="#fffaf0"/>
      <circle class="pu" cx="23" cy="28.5" r="4" fill="#231d17"/><circle class="pu" cx="37" cy="28.5" r="4" fill="#231d17"/>
      <rect class="lid" x="13.5" y="19.5" width="17" height="17" fill="var(--owl)"/><rect class="lid" x="29.5" y="19.5" width="17" height="17" fill="var(--owl)"/>
      <path d="M27 33h6l-3 5z" fill="var(--gold)"/>
      <path d="M23 55l-2 3M30 56v3M37 55l2 3" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span class="bub" id="bub" aria-live="polite"></span>
    <button class="ghost" id="hintBtn" title="One hint per game: the owl points at its best move">ask the owl</button>
  </div>
  <div class="foot">
    <span class="score" id="score"></span>
    <span><button class="ghost" id="swap">bot goes first</button> <button class="ghost" id="fairBtn" aria-pressed="false">fair start</button> <button class="ghost" id="rqBtn" aria-pressed="false">allow re-queue</button> <button class="ghost" id="memBtn" aria-pressed="false">memory mode</button> <button class="ghost" id="orBtn" aria-pressed="false">show the oracle</button> <button class="ghost" id="owlBtn" aria-pressed="true">hush the owl</button> <button class="btn" id="again">new game</button></span>
  </div>
  </section>
  <div class="sr" id="sr" aria-live="assertive"></div>
</main>
<script id="wk" type="text/js-worker">
/* Solves a whole variant: every reachable position, retrograde from the winning moves.
   K = marks each; PRE = the row is checked before your oldest leaves (so 2 marks can win with the 3rd);
   RQ = re-queue: your leaving mark's square is playable, the mark just moves to the back of your queue.
   A queue is coded as digits (cell+1), oldest lowest: [4,0,8] -> 5 + 10 + 900. Key = (xCode*10000 + oCode)*2 + turn.
   Out: sorted keys + values, 1000+n = side to move wins in n plies, 2000+n = loses in n plies; a missing key = draw (loops forever). */
onmessage=function(e){
  var K=e.data.k,PRE=!!e.data.pre,RQ=!!e.data.rq,LM=[7,56,448,73,146,292,273,84];
  function dec(c){var q=[];while(c){q.push(c%10-1);c=(c/10)|0;}return q;}
  function enc(q){var c=0,m=1;for(var i=0;i<q.length;i++){c+=(q[i]+1)*m;m*=10;}return c;}
  function mask(q){var m=0;for(var i=0;i<q.length;i++)m|=1<<q[i];return m;}
  function won(m){for(var i=0;i<8;i++)if((m&LM[i])===LM[i])return true;return false;}
  function after(me,c){var n=me.concat([c]);if(PRE&&won(mask(n)))return null;if(n.length>K)n.shift();return won(mask(n))?null:n;}   /* null = this move wins */
  var idx=new Map(),SA=[],SB=[],ST=[];
  function id(a,b,t){var k=(a*10000+b)*2+t,i=idx.get(k);if(i===undefined){i=SA.length;idx.set(k,i);SA.push(a);SB.push(b);ST.push(t);}return i;}
  id(0,0,0);
  var KS=[0],KD=[],IW=[],s,c,j;
  for(s=0;s<SA.length;s++){var a=dec(SA[s]),b=dec(SB[s]),t=ST[s],me=t?b:a,op=t?a:b,occ=mask(RQ&&me.length===K?me.slice(1):me)|mask(op),iw=0,kids=[];
    /* expand every non-winning move, even where a win was on offer: people miss wins, and the oracle must know where that leads */
    for(c=0;c<9;c++){if(occ>>c&1)continue;var n=after(me,c);if(!n){iw=1;continue;}kids.push(enc(n));}
    IW.push(iw);
    for(j=0;j<kids.length;j++)KD.push(t?id(SA[s],kids[j],0):id(kids[j],SB[s],1));
    KS.push(KD.length);}
  var N=SA.length,res=new Int8Array(N),rp=new Int16Array(N);
  for(s=0;s<N;s++)if(IW[s]){res[s]=1;rp[s]=1;}
  for(var p=2;;p++){var add=[];
    for(s=0;s<N;s++){if(res[s])continue;var win=false,all=KS[s+1]>KS[s];
      for(j=KS[s];j<KS[s+1];j++){var k=KD[j];if(res[k]===2){win=true;break;}if(res[k]!==1)all=false;}
      if(win)add.push(s,1);else if(all)add.push(s,2);}
    if(!add.length)break;for(var i=0;i<add.length;i+=2){res[add[i]]=add[i+1];rp[add[i]]=p;}}
  var cnt=0;for(s=0;s<N;s++)if(res[s])cnt++;
  var keys=new Float64Array(cnt),q2=0;for(s=0;s<N;s++)if(res[s])keys[q2++]=(SA[s]*10000+SB[s])*2+ST[s];
  keys.sort();var vals=new Int16Array(cnt);
  for(i=0;i<cnt;i++){s=idx.get(keys[i]);vals[i]=res[s]*1000+rp[s];}
  postMessage({v:e.data.v,keys:keys,vals:vals,n:N},[keys.buffer,vals.buffer]);
};
</script>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var NAMES=['top left','top','top right','left','centre','right','bottom left','bottom','bottom right'];
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
var cfg=store('ttq_cfg')||{};
var S={mode:cfg.mode||'bot',lvl:cfg.lvl==null?1:cfg.lvl,botFirst:!!cfg.botFirst,oracle:!!cfg.oracle,k:[2,3,4].indexOf(cfg.k)>=0?cfg.k:3,mem:!!cfg.mem,fair:!!cfg.fair,rq:!!cfg.rq,owl:cfg.owl!==false};
/* re-queue (Tatum 01:38 "allow the player to play on the square that is about to become clear"):
   with a full queue, your oldest mark's square is open to you; the mark steps out and straight back in at the end of the line.
   It never makes a new row (same squares), it's a tempo move, so the solver learns each variant again. */
function rqCell(t){return S.rq&&G&&G.q[t].length===S.k?G.q[t][0]:-1;}
/* fair start (Tatum 01:31 "forbid the first player from taking the centre?"): X's first move can't go where it forces a win.
   The solver says it depends: 3 marks, only the edge middles win (centre and corners draw); 4 marks, only the centre wins;
   2 marks, every opening is decided (corners even lose), so there's no fair start there. */
function banned(){if(!S.fair||!G||G.moves||!cur())return [];var b=[],draw=0;
  for(var c=0;c<9;c++){var v=val([c],[],1);if(v>=2000)b.push(c);else if(v===0)draw++;}
  return draw?b:[];}
/* Tatum: 2 marks only works if the row is checked BEFORE the oldest leaves (you briefly hold three) */
function PRE(){return S.k===2;}
function vid(){return S.k+(PRE()?'p':'')+(S.rq?'r':'');}
var score=store('ttq_score')||{w:0,l:0,d:0};
var G,TABLES={},asked={},busy=false,botT=0,autoT=0;
function cur(){return TABLES[vid()]||null;}
/* ---- solver ---- */
var wk=null;
try{var url=URL.createObjectURL(new Blob([$('wk').textContent],{type:'text/javascript'}));wk=new Worker(url);
  wk.onmessage=function(e){TABLES[e.data.v]={keys:e.data.keys,vals:e.data.vals};if(G){draw();next();}};wk.onerror=function(){wk=null;draw();};}catch(e){wk=null;}
function ask(){var v=vid();if(!wk||TABLES[v]||asked[v])return;asked[v]=1;wk.postMessage({k:S.k,pre:PRE(),rq:S.rq,v:v});}
function enc(q){var c=0,m=1;for(var i=0;i<q.length;i++){c+=(q[i]+1)*m;m*=10;}return c;}
function keyOf(x,o,t){return (enc(x)*10000+enc(o))*2+t;}
function val(x,o,t){var T=cur();if(!T)return -1;var k=keyOf(x,o,t),lo=0,hi=T.keys.length-1;
  while(lo<=hi){var m=(lo+hi)>>1,v=T.keys[m];if(v===k)return T.vals[m];if(v<k)lo=m+1;else hi=m-1;}return 0;}
/* ---- game ---- */
function newGame(){clearTimeout(botT);clearTimeout(autoT);ask();G={q:[[],[]],turn:0,over:null,win:null,seen:{},last:-1,gone:-1,moves:0,fz:0,hint:-1,hints:[0,0],said:-9};G.seen[keyOf([],[],0)]=1;busy=false;owlSay('','');draw();next();}
function who(c){return G.q[0].indexOf(c)>=0?0:G.q[1].indexOf(c)>=0?1:-1;}
function lineOf(q){for(var i=0;i<8;i++){var l=LINES[i];if(q.indexOf(l[0])>=0&&q.indexOf(l[1])>=0&&q.indexOf(l[2])>=0)return l;}return null;}
function play(c,quiet){
  if(G.over||(who(c)>=0&&c!==rqCell(G.turn))||banned().indexOf(c)>=0)return false;
  var t=G.turn,q=G.q[t].concat([c]),l=PRE()?lineOf(q):null;G.gone=-1;
  if(!l){if(q.length>S.k)G.gone=q.shift();l=lineOf(q);}   /* a winning move under PRE keeps all its marks on show */
  G.q[t]=q;G.last=c;G.at=Date.now();G.moves++;G.hint=-1;
  if(l){G.over='win';G.win=l;G.winner=t;}
  G.turn=1-t;
  if(!G.over){var k=keyOf(G.q[0],G.q[1],G.turn);G.seen[k]=(G.seen[k]||0)+1;if(G.seen[k]>=3)G.over='draw';}
  if(G.over)tally();
  if(!quiet){sfx(G.gone>=0?'swap':'place');if(G.over)sfx(G.over==='win'?'win':'draw');announce(t,c);draw();}
  return true;}
/* only one legal square (4 marks: 8 marks down, one hole): the rest plays itself, a little faster each move */
function forced(){return G&&!G.over&&legal().length===1;}
function autoDelay(){return Math.max(150,520-50*(G.fz||0));}
function maybeAuto(){clearTimeout(autoT);if(!forced()||botTurn()||busy)return;var g0=G,m0=G.moves;
  autoT=setTimeout(function(){if(G!==g0||G.moves!==m0||!forced()||botTurn())return;G.fz=(G.fz||0)+1;var f=focusedCell();play(legal()[0]);next();if(f!=null)focusCell(f);},autoDelay());}
function next(){if(G.over&&!G.ended){G.ended=1;owlEnd();}maybeBot();maybeAuto();}
function skipEnd(){clearTimeout(autoT);clearTimeout(botT);busy=false;var n=0,t=0,c=-1;
  while(forced()&&n++<600){t=G.turn;c=legal()[0];play(c,1);}
  if(c>=0){G.at=0;if(G.over)sfx(G.over==='win'?'win':'draw');announce(t,c);}
  draw();next();}
function focusedCell(){var a=document.activeElement,v=a&&a.getAttribute&&a.getAttribute('data-c');return v==null?null:+v;}
function tally(){if(S.mode!=='bot')return;var me=S.botFirst?1:0;
  if(G.over==='draw')score.d++;else if(G.winner===me)score.w++;else score.l++;store('ttq_score',score);}
function botSide(){return S.botFirst?0:1;}
function botTurn(){return S.mode==='bot'&&!G.over&&G.turn===botSide();}
function maybeBot(){if(!botTurn()||busy)return;
  var f=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-c');
  if(!cur()&&wk){draw();return;}   /* the bot is still studying; the worker reply calls back here */
  busy=true;draw();
  var fz=forced();if(fz)G.fz=(G.fz||0)+1;
  botT=setTimeout(function(){busy=false;if(!botTurn())return;play(pick());next();if(f!=null)focusCell(+f);},fz?autoDelay():420+Math.random()*380);
  if(f!=null)focusCell(+f);}
/* the opening position's value when some first moves are banned: best of the allowed ones, seen from X */
function fairVal(b){var best=null,sc=-1e9;for(var c=0;c<9;c++){if(b.indexOf(c)>=0)continue;var kv=val([c],[],1),
  v=kv>=2000?1000+(kv-2000)+1:kv>=1000?2000+(kv-1000)+1:0,s=v>=2000?-1e5+v:v>=1000?1e5-v:0;if(s>sc){sc=s;best=v;}}return best;}
function legal(){var r=[],b=banned(),rc=rqCell(G.turn);for(var c=0;c<9;c++)if((who(c)<0||c===rc)&&b.indexOf(c)<0)r.push(c);return r;}
function pick(){
  var ms=legal(),t=G.turn;
  var rnd=[0.6,0.22,0][S.lvl];
  if(!cur()||Math.random()<rnd)return ms[Math.random()*ms.length|0];
  var best=-1e9,bag=[];
  ms.forEach(function(c){var q=G.q[t].concat([c]),w=PRE()&&lineOf(q);if(q.length>S.k)q.shift();var x=t?G.q[0]:q,o=t?q:G.q[1];
    var sc;if(w||lineOf(q))sc=1e6;else{var v=val(x,o,1-t);
      sc=v>=2000?100000-(v-2000):v>=1000?-100000+(v-1000):0;}
    if(sc>best){best=sc;bag=[c];}else if(sc===best)bag.push(c);});
  return bag[Math.random()*bag.length|0];}
/* ---- the owl (v1.4, the review + Tatum 03:11): it knows every square's value from the same tables as the bot, but only
   speaks after a human move, and only when the move changed the outcome with perfect play: a win thrown away, a draw turned into
   a loss (naming the square left open, or the leaving mark that was holding it), or the one move out of three or more that held
   (no words, it just puffs up; not for blocking a row about to win). One hint per side per game points at its best move. Off with "hush the owl", like the oracle */
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function oneOf(a){return a[Math.random()*a.length|0];}
/* the move c for side t, seen from t: sc as pick() ranks it, cat 1 win / 0 draw / -1 loss, now = wins on the spot, v = value after */
function moveScore(t,c){var q=G.q[t].concat([c]),w=PRE()&&lineOf(q);if(q.length>S.k)q.shift();
  if(w||lineOf(q))return {c:c,sc:1e6,cat:1,now:1,v:0};var x=t?G.q[0]:q,o=t?q:G.q[1],v=val(x,o,1-t);
  return {c:c,sc:v>=2000?100000-(v-2000):v>=1000?-100000+(v-1000):0,cat:v>=2000?1:v>=1000?-1:0,now:0,v:v};}
function coachPre(){if(!S.owl||!cur()||!G||G.over)return null;var t=G.turn,ms=legal().map(function(c){return moveScore(t,c);}),best=-2;
  ms.forEach(function(m){if(m.cat>best)best=m.cat;});
  var th=[];for(var c=0;c<9;c++)if(who(c)<0&&moveScore(1-t,c).now)th.push(c);   /* squares where the other side would win next: blocking one is no feat */
  return {t:t,ms:ms,best:best,th:th};}
function coachPost(p,c){if(!p||!S.owl)return;var m=null;p.ms.forEach(function(x){if(x.c===c)m=x;});if(!m||m.now)return;   /* a win: owlEnd has the word */
  var after=G.over==='draw'?0:m.cat,keep=p.ms.filter(function(x){return x.cat===p.best;}),now=p.ms.filter(function(x){return x.now;});
  if(after<p.best){
    if(now.length)return owlSay('Hoo. '+cap(NAMES[now[0].c])+' won on the spot.','sigh');
    if(p.best===1)return after===0?owlSay(oneOf(['Slow blink. That was a forced win.','A sure win just slipped out of the queue.']),'sigh'):owlSay('Hoo-hoo. From winning to lost in one move.','wide');
    var t2=G.turn,ow=G.over?[]:legal().filter(function(x){return moveScore(t2,x).now;});
    if(G.gone>=0&&ow.indexOf(G.gone)>=0)return owlSay('Oh no. Your mark on '+NAMES[G.gone]+' was holding that door.','wide');
    if(ow.length)return owlSay('Oh no. That leaves '+NAMES[ow[0]]+' open.','wide');
    var n=Math.max(1,Math.ceil((m.v-1000)/2));return owlSay('Hmm. With perfect play that loses in '+n+' move'+(n>1?'s':'')+'.','sigh');}
  if(p.ms.length>=3&&keep.length===1&&p.best>=0&&p.th.indexOf(c)<0)return owlSay('!','puff');
  owlSay('','');}
var WIN_L=['Neat.','Textbook.','Hoo! Clean.','Tidy work.'],LOSE_L=['Next one.','Hoo. Again?','The queue giveth, the queue taketh.'];
function owlEnd(){if(!S.owl||!G.over)return;var said=$('bub').textContent,fresh=G.said>=G.moves-1&&said;
  if(G.over==='draw'){if(!fresh)owlSay('Round in circles.','');return;}
  var mine=S.mode==='bot'?(S.botFirst?1:0):G.winner;
  if(G.winner===mine)owlSay(S.mode==='bot'?oneOf(WIN_L):'Hoo! '+(G.winner?'O':'X')+' takes it.','happy');
  else owlSay(fresh?said:oneOf(LOSE_L),'sigh');}
function owlSay(s,mood){var b=$('bub'),o=$('owl');if(G)G.said=G.moves;b.textContent=s;b.classList.remove('pop');o.setAttribute('class','owl');
  void o.getBoundingClientRect();if(s)b.classList.add('pop');if(mood)o.setAttribute('class','owl '+mood);}
function humanPlay(c){var p=coachPre();if(!play(c))return false;coachPost(p,c);return true;}
function askOwl(){var p=coachPre();if(!p||busy||botTurn()||forced()||G.hints[G.turn])return;
  var bs=-1e9,bag=[];p.ms.forEach(function(m){if(m.sc>bs){bs=m.sc;bag=[m.c];}else if(m.sc===bs)bag.push(m.c);});
  var c=bag[Math.random()*bag.length|0];G.hint=c;G.hints[G.turn]=1;draw();
  owlSay('Try '+NAMES[c]+'. '+(p.best===1?'It wins.':p.best===0?'It holds.':'It loses anyway, but it lasts longest.'),'');focusCell(c);}
/* ---- view ---- */
var XS='<svg viewBox="0 0 100 100" aria-hidden="true"><line x1="20" y1="20" x2="80" y2="80" pathLength="100"/><line x1="80" y1="20" x2="20" y2="80" pathLength="100"/></svg>';
var OS='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="31" pathLength="100"/></svg>';
function draw(){
  var b=$('board'),h='',t=G.turn,doom=(!G.over&&G.q[t].length===S.k)?G.q[t][0]:-1,mine=S.mode==='bot'?(S.botFirst?1:0):-1;
  if(S.mem)doom=-1;   /* memory mode (Tatum): no tickets, no hint, you keep track */
  var BAN=banned(),lock=G.over||busy||botTurn(),anim=Date.now()-(G.at||0)<350,RC=lock?-1:rqCell(t),ONLY=forced()?legal()[0]:-1;
  for(var c=0;c<9;c++){var w=who(c),q=w>=0?G.q[w]:null,age=q?q.indexOf(c)+1:0;
    var ban=BAN.indexOf(c)>=0;
    var cls='cell'+(ban?' ban':'')+(w===0?' X':w===1?' O':'')+(c===doom?' doom':'')+(c===RC?' rq':'')+(c===ONLY?' only':'')+(c===G.hint&&!lock?' hint':'')+(G.win&&G.win.indexOf(c)>=0?' win':'');
    var inner=w<0?'':(w===0?XS:OS).replace('<svg','<svg class="'+(anim&&c===G.last?'fresh':'')+'"')+(S.mem?'':'<span class="tk" aria-hidden="true">'+age+'</span>');
    if(anim&&c===G.gone&&c!==G.last)inner+='<span class="gone" aria-hidden="true">'+(1-G.turn===0?XS:OS)+'</span>';
    var lab=NAMES[c]+(w<0?(ban?', not allowed as the first move':', empty'):', '+(w?'O':'X')+(S.mem?'':c===doom?', leaves on this move':', mark '+age+' of '+q.length)+(c===RC?', you can play here again':''))+(c===G.hint&&!lock?", the owl's pick":'');
    h+='<button class="'+cls+'" data-c="'+c+'" aria-label="'+lab+'"'+(lock||(w>=0&&c!==RC)||ban?' aria-disabled="true"':'')+'></button>';
    h=h.replace(/<\/button>$/,inner+'</button>');}
  b.innerHTML=h;
  var st=$('status'),X='<span class="x">X</span>',O='<span class="o">O</span>',P=function(s){return s?O:X;};
  if(G.over==='win'){st.innerHTML=S.mode==='bot'?(G.winner===mine?'You win! '+P(G.winner)+' takes it':'The bot wins with '+P(G.winner)):P(G.winner)+' wins!';}
  else if(G.over==='draw')st.textContent='Same board three times: a draw';
  else if(S.mode==='bot'&&botTurn())st.innerHTML=(cur()||!wk?'Bot is thinking…':'The bot is studying this version…')+(forced()?'<small class="fs">one empty square left, so the rest plays itself · <button class="ghost" id="skip">skip to the end</button></small>':'');
  else st.innerHTML=(S.mode==='bot'?'Your move, ':P(t)+' to move')+(S.mode==='bot'?P(t):'')+(doom>=0?' · your <b>1</b> leaves':'')+(forced()?'<small class="fs">one empty square left, so the rest plays itself · <button class="ghost" id="skip">skip to the end</button></small>':'')+(BAN.length?'<small class="fs">fair start: not on the marked square'+(BAN.length>1?'s':'')+'</small>':S.fair&&!G.moves&&cur()?'<small class="fs">'+(val([],[],0)?'no fair start here: every opening is already decided':'already fair: every opening draws with perfect play')+'</small>':'');
  var or=$('oracle');
  if(!S.oracle){or.textContent='';}
  else if(!cur()){or.textContent=wk?'The oracle is still solving the game…':'The oracle needs a newer browser.';}
  else if(G.over){or.textContent='';}
  else{var v=BAN.length?fairVal(BAN):val(G.q[0],G.q[1],t),me=t?'O':'X',op=t?'X':'O';
    or.textContent=v>=2000?'Oracle: with perfect play '+op+' wins in '+Math.ceil((v-2000)/2)+' move'+(Math.ceil((v-2000)/2)>1?'s':'')+'.':v>=1000?'Oracle: with perfect play '+me+' wins in '+Math.ceil((v-1000)/2)+' move'+(Math.ceil((v-1000)/2)>1?'s':'')+'.':'Oracle: perfect play from here goes round in circles.';}
  $('score').innerHTML=S.mode==='bot'?'you <b>'+score.w+'</b> · bot <b>'+score.l+'</b> · draws <b>'+score.d+'</b>':G.moves+' moves';
  $('mBot').setAttribute('aria-pressed',S.mode==='bot');$('mDuo').setAttribute('aria-pressed',S.mode!=='bot');
  $('lvl').hidden=S.mode!=='bot';$('swap').hidden=S.mode!=='bot';
  [].forEach.call($('lvl').children,function(x){x.setAttribute('aria-pressed',+x.getAttribute('data-l')===S.lvl);});
  [].forEach.call($('kk').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',+x.getAttribute('data-k')===S.k);});
  $('rule').innerHTML=RULES[S.k]+(S.rq?' You may re-queue: play on your own leaving mark.':'');
  $('swap').textContent=S.botFirst?'you go first':'bot goes first';
  $('fairBtn').setAttribute('aria-pressed',S.fair);$('fairBtn').textContent=S.fair?'any first move':'fair start';$('fairBtn').title=S.fair?'Let X open anywhere again':'X may not open on a square that forces a win';
  $('rqBtn').setAttribute('aria-pressed',S.rq);$('rqBtn').textContent=S.rq?'no re-queue':'allow re-queue';$('rqBtn').title=S.rq?'Your leaving square is off limits again':'You may play on your own leaving mark: it steps out and rejoins the back of your queue';
  $('memBtn').setAttribute('aria-pressed',S.mem);$('memBtn').textContent=S.mem?'show the tickets':'memory mode';$('memBtn').title=S.mem?'Number every mark again':'Hide the numbers: remember yourself which mark leaves next';
  $('orBtn').setAttribute('aria-pressed',S.oracle);$('orBtn').textContent=S.oracle?'hide the oracle':'show the oracle';
  var om=S.mode==='bot'?mine:t,hb=$('hintBtn'),used=G.hints[om];$('owlrow').hidden=!S.owl;hb.hidden=!cur()||!!G.over;
  hb.textContent=used?'out of hints':'ask the owl';hb.setAttribute('aria-disabled',String(!!(used||lock||ONLY>=0)));
  $('owlBtn').setAttribute('aria-pressed',S.owl);$('owlBtn').textContent=S.owl?'hush the owl':'wake the owl';$('owlBtn').title=S.owl?'The owl stops commenting and hints go away':'Bring back the owl: a few words after a move that changes the game, and one hint per game';}
function announce(t,c){$('sr').textContent=(t?'O':'X')+' on '+NAMES[c]+(G.gone>=0?', their mark on '+NAMES[G.gone]+' leaves':'')+(G.over==='win'?'. '+(t?'O':'X')+' wins.':G.over==='draw'?'. Draw.':'');}
var RULES={2:'<b>Two marks each.</b> Place a third: if the three make a row you win, if not your oldest leaves.',
  3:'<b>Three marks each.</b> Place a fourth and your oldest one leaves. Three in a row wins.',
  4:'<b>Four marks each.</b> Place a fifth and your oldest one leaves. Three in a row wins.'};
/* ---- sound ---- */
var AC=null;
function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
  var N={place:[[520,0]],swap:[[520,0],[300,.07]],win:[[523,0],[659,.1],[784,.2],[1047,.3]],draw:[[392,0],[370,.15]]}[k];
  N.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type=k==='win'?'triangle':'square';o.frequency.value=n[0];
    g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.06,t+n[1]+.01);g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.16);
    o.connect(g);g.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+.18);});}catch(e){}}
/* ---- input ---- */
function save(){store('ttq_cfg',S);}
$('board').addEventListener('click',function(e){var b=e.target.closest('.cell');if(!b||b.getAttribute('aria-disabled')==='true')return;
  var c=+b.getAttribute('data-c');if(humanPlay(c)){next();focusCell(c);}});
function focusCell(c){var el=document.querySelector('.cell[data-c="'+c+'"]');if(el)el.focus({preventScroll:true});}
$('board').addEventListener('keydown',function(e){var b=e.target.closest('.cell');if(!b)return;var c=+b.getAttribute('data-c'),n=c;
  if(e.key==='ArrowLeft')n=c%3?c-1:c;else if(e.key==='ArrowRight')n=c%3<2?c+1:c;else if(e.key==='ArrowUp')n=c>2?c-3:c;else if(e.key==='ArrowDown')n=c<6?c+3:c;else return;
  e.preventDefault();focusCell(n);});
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;var d=+e.key;
  if(d>=1&&d<=9&&!G.over&&!botTurn()&&!busy){if(humanPlay(d-1))next();}
  else if(e.key==='n'||e.key==='N')newGame();});
$('again').onclick=newGame;
$('status').addEventListener('click',function(e){if(e.target.id==='skip')skipEnd();});
$('mBot').onclick=function(){S.mode='bot';save();newGame();};
$('mDuo').onclick=function(){S.mode='duo';save();newGame();};
$('lvl').addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;S.lvl=+x.getAttribute('data-l');save();newGame();});
$('kk').addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;S.k=+x.getAttribute('data-k');save();newGame();});
$('swap').onclick=function(){S.botFirst=!S.botFirst;save();newGame();};
$('fairBtn').onclick=function(){S.fair=!S.fair;save();newGame();};
$('rqBtn').onclick=function(){S.rq=!S.rq;save();newGame();};
$('memBtn').onclick=function(){S.mem=!S.mem;save();draw();$('sr').textContent=S.mem?'Memory mode: the numbers are hidden.':'Numbers are back.';};
$('orBtn').onclick=function(){S.oracle=!S.oracle;save();draw();};
$('owlBtn').onclick=function(){S.owl=!S.owl;save();G.hint=-1;owlSay(S.owl?'Hoo. Back on the perch.':'','');draw();};
$('hintBtn').onclick=function(){if(this.getAttribute('aria-disabled')!=='true')askOwl();};
window.__ttq={get G(){return G;},get T(){return cur();},play:play,pick:pick,S:S,newGame:newGame,val:val,forced:forced,skipEnd:skipEnd,legal:legal,next:next,humanPlay:humanPlay,coachPre:coachPre,askOwl:askOwl,get owl(){return {say:$('bub').textContent,mood:$('owl').getAttribute('class')};}};
newGame();
if(S.owl)owlSay('Hoo. I only speak up when it matters.','');
})();
