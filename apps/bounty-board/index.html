<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounty Board — bugs wanted, dead or fixed</title>
<meta name="description" content="Bugs are outlaws on wanted posters. Spot the bad line, pick the fix, and claim the gold before Rusty the AI bounty hunter does.">
<link rel="icon" href="https://emojicdn.elk.sh/🤠?style=apple&size=64">
<meta property="og:title" content="Bounty Board">
<meta property="og:description" content="Bugs are outlaws on wanted posters. Spot the bad line, pick the fix, and claim the gold before Rusty the AI bounty hunter does.">
<meta property="og:url" content="https://app.sloppy.live/bounty-board/">
<meta property="og:image" content="https://app.sloppy.live/bounty-board/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=IBM+Plex+Mono:wght@400;700&family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#6b3f22; --wood2:#5a331b; --wood3:#7d4b29; --nail:#2b1a10;
  --paper:#efdcae; --paper2:#e2c88d; --ink:#2a1a0e; --rust:#a3381d; --gold:#e9b43c; --sky:#f4c27a; --sage:#4e6b4a;
  --code:#1d1712; --code-ink:#f0e2c2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Zilla Slab',Georgia,serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,214,140,.35), transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 118px, rgba(0,0,0,.35) 118px 121px, transparent 121px 240px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 3px, transparent 3px 9px),
    linear-gradient(90deg, var(--wood) 0%, var(--wood3) 22%, var(--wood2) 48%, var(--wood3) 70%, var(--wood) 100%);
  background-color:var(--wood)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.2rem clamp(1rem,4vw,2.4rem) .6rem}
h1{font-family:'Rye',serif;font-weight:400;margin:0;font-size:clamp(2rem,7vw,3.6rem);color:var(--sky);text-shadow:0 3px 0 var(--nail),0 0 22px rgba(255,190,90,.35);letter-spacing:.02em;line-height:1}
h1 small{display:block;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.28em;color:#f3d9a8;text-shadow:none;margin-top:.4rem;opacity:.85}
.tally{display:flex;gap:.6rem;font-family:'IBM Plex Mono',monospace;font-weight:700}
.purse{background:var(--paper);padding:.45rem .8rem;border-radius:3px;box-shadow:0 4px 0 var(--nail);text-align:center;min-width:6.5rem;transform:rotate(-1.5deg)}
.purse.cl{transform:rotate(1.5deg);background:#cfd6d2}
.purse span{display:block;font-size:.66rem;letter-spacing:.14em;opacity:.75}
.purse b{font-size:1.35rem}
.day{font-family:'Rye',serif;color:#f3d9a8;font-size:1rem;text-align:center;margin:.2rem 0 0}
main{padding:.4rem clamp(.8rem,3vw,2rem) 7rem}
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.4rem 1.1rem;max-width:1000px;margin:0 auto}
.poster{position:relative;border:0;cursor:pointer;font:inherit;color:inherit;text-align:center;padding:1.1rem .9rem 1rem;
  background:radial-gradient(ellipse at 30% 20%, #f6e7c0, var(--paper) 45%, var(--paper2) 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.35), inset 0 0 30px rgba(120,80,30,.35);transform:rotate(var(--r,0deg));transition:transform .2s;
  clip-path:polygon(1% 2%,30% 0,62% 1.5%,99% 0,100% 40%,98.5% 70%,100% 99%,70% 98%,40% 100%,2% 98.5%,0 60%,1.5% 30%);animation:nailin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes nailin{from{transform:translateY(-40px) rotate(calc(var(--r,0deg) * 4))}}
.poster:hover{transform:rotate(0deg) scale(1.03)}
.poster:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.poster::before{content:'';position:absolute;left:50%;top:7px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#8a7a6a,var(--nail));box-shadow:0 1px 1px rgba(0,0,0,.5)}
.poster h2{font-family:'Rye',serif;font-weight:400;font-size:2rem;margin:.3rem 0 0;letter-spacing:.06em;color:var(--ink)}
.poster .sub{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.2em;margin:0 0 .3rem}
.poster svg{width:96px;height:84px;display:block;margin:.1rem auto;filter:sepia(.35)}
.poster .name{font-family:'Rye',serif;font-size:1.08rem;margin:.2rem 0 .1rem;line-height:1.15}
.poster .crime{font-size:.9rem;font-style:italic;margin:0 0 .5rem;min-height:2.3em}
.poster .reward{font-family:'Rye',serif;font-size:1.45rem;color:var(--rust)}
.poster .repo{font-family:'IBM Plex Mono',monospace;font-size:.66rem;opacity:.7;margin-top:.15rem}
.poster .race{position:absolute;left:10%;right:10%;bottom:6px;height:5px;border-radius:3px;background:rgba(42,26,14,.15);overflow:hidden}
.poster .race i{position:absolute;inset:0 auto 0 0;width:0;background:#61706a}
.poster .bot{position:absolute;right:-4px;top:30px;width:46px;height:46px;opacity:0;transition:opacity .3s;filter:none}
.poster.hunted .bot{opacity:1;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
.poster .stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-16deg) scale(2);opacity:0;font-family:'Rye',serif;font-size:1.5rem;padding:.2rem .6rem;border:4px double currentColor;border-radius:6px;white-space:nowrap;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.poster.done{cursor:default}
.poster.done .stamp{opacity:.9;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}
.poster.paid .stamp{color:var(--sage)}
.poster.lost .stamp{color:#4f5b60}
.poster.done > :not(.stamp){opacity:.55}

/* Rusty's corner */
#clank{position:fixed;right:clamp(.6rem,3vw,1.6rem);bottom:calc(.8rem + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:.4rem;z-index:5;pointer-events:none;max-width:min(92vw,420px)}
#clank svg{width:64px;height:72px;flex:0 0 auto}
#say{background:#d9dfdc;border:2px solid var(--nail);border-radius:10px 10px 2px 10px;padding:.45rem .65rem;font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
#say.on{opacity:1;transform:none}

/* the case file */
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,720px);width:100%;max-height:96vh}
dialog::backdrop{background:rgba(25,14,6,.72)}
.case{background:radial-gradient(ellipse at 20% 0%, #f6e7c0, var(--paper) 50%, var(--paper2));padding:1rem clamp(.8rem,3vw,1.4rem) 1.1rem;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:94vh;overflow:auto}
.case .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.case h3{font-family:'Rye',serif;font-weight:400;font-size:1.45rem;margin:0}
.case .meta{font-family:'IBM Plex Mono',monospace;font-size:.72rem;opacity:.75;margin:.2rem 0 0}
.case .x{border:2px solid var(--ink);background:transparent;font:700 1rem 'IBM Plex Mono',monospace;border-radius:50%;width:2.2rem;height:2.2rem;cursor:pointer;flex:0 0 auto}
.issue{background:#fff7e2;border-left:4px solid var(--rust);padding:.5rem .7rem;margin:.7rem 0;font-size:1rem}
.issue b{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;color:var(--rust);display:block}
.ask{font-family:'Rye',serif;font-size:1.05rem;margin:.6rem 0 .35rem}
.code{list-style:none;margin:0;padding:.5rem 0;background:var(--code);border-radius:4px;counter-reset:ln;overflow-x:auto}
.code li{counter-increment:ln}
.code button{display:block;width:100%;min-width:max-content;text-align:left;border:0;background:transparent;color:var(--code-ink);font:400 .9rem/1.55 'IBM Plex Mono',monospace;padding:.12rem .8rem .12rem 0;cursor:pointer;white-space:pre}
.code button::before{content:counter(ln);display:inline-block;width:2.4rem;text-align:right;padding-right:.8rem;color:#8a7a62}
.code button:hover:not(:disabled),.code button:focus-visible{background:rgba(233,180,60,.18);outline:none}
.code button.bad{background:rgba(163,56,29,.55);animation:shake .3s}
.code button.got{background:rgba(233,180,60,.3);box-shadow:inset 4px 0 0 var(--gold)}
.code button:disabled{cursor:default}
.code .kw{color:#e98f5b}.code .st{color:#b9cf86}.code .cm{color:#8a7a62;font-style:italic}.code .nu{color:#e9b43c}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fixes{display:grid;gap:.45rem;margin-top:.4rem}
.fixes button{text-align:left;border:2px solid var(--ink);background:#fff7e2;border-radius:4px;padding:.55rem .7rem;font:400 .85rem/1.45 'IBM Plex Mono',monospace;color:var(--ink);cursor:pointer;white-space:pre-wrap;word-break:break-word}
.fixes button:hover,.fixes button:focus-visible{background:#ffe9b5;outline:none;box-shadow:0 0 0 3px var(--gold)}
.fixes button.no{border-color:var(--rust);background:#f3c9b8;text-decoration:line-through}
.verdict{font-family:'Rye',serif;font-size:1.3rem;text-align:center;margin:.8rem 0 .2rem;min-height:1.6em}
.verdict.ok{color:var(--sage)}.verdict.bad{color:var(--rust)}
.why{font-size:.95rem;text-align:center;margin:0;min-height:1.2em}
.racebar{height:8px;border-radius:4px;background:rgba(42,26,14,.15);margin-top:.8rem;position:relative;overflow:hidden}
.racebar i{position:absolute;inset:0 auto 0 0;width:0;background:#61706a;transition:width .2s linear}
.racelbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;margin-top:.25rem;opacity:.75;display:flex;justify-content:space-between}

/* end of day */
#eod{position:fixed;inset:0;display:grid;place-items:center;background:rgba(25,14,6,.75);z-index:10;padding:1rem}
#eod[hidden]{display:none}
.eodc{background:var(--paper);max-width:420px;width:100%;padding:1.3rem 1.2rem;text-align:center;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.eodc h2{font-family:'Rye',serif;font-weight:400;margin:0 0 .4rem;font-size:1.8rem}
.eodc p{margin:.3rem 0}
.eodc button{margin-top:.8rem;font:400 1.1rem 'Rye',serif;background:var(--rust);color:#fff4dc;border:0;border-radius:4px;padding:.6rem 1.2rem;cursor:pointer;box-shadow:0 4px 0 var(--nail)}
.eodc button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  #board{grid-template-columns:1fr 1fr;gap:1rem .7rem}
  .poster{padding:.9rem .5rem .8rem}
  .poster h2{font-size:1.45rem}
  .poster svg{width:72px;height:62px}
  .poster .name{font-size:.92rem}
  .poster .crime{font-size:.78rem}
  .poster .reward{font-size:1.15rem}
  .purse{min-width:5.2rem;padding:.35rem .55rem}
  .code button{font-size:.78rem}
  #clank svg{width:50px;height:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Bounty Board<small>BUGS WANTED · DEAD OR FIXED</small></h1>
  <div>
    <div class="tally">
      <div class="purse"><span>YOUR GOLD</span><b id="you">0</b></div>
      <div class="purse cl"><span>RUSTY</span><b id="bot">0</b></div>
    </div>
    <p class="day" id="day">Day 1</p>
  </div>
</header>
<main><div id="board" aria-label="Wanted posters"></div></main>
<div id="clank" aria-hidden="true">
  <div id="say"></div>
  <svg viewBox="0 0 64 72"><path d="M10 20 Q32 2 54 20 L58 22 Q32 28 6 22Z" fill="#5a331b"/><rect x="20" y="8" width="24" height="12" rx="4" fill="#6b3f22"/><rect x="20" y="16" width="24" height="3" fill="#a3381d"/><rect x="14" y="24" width="36" height="24" rx="6" fill="#aab6b2" stroke="#2b1a10" stroke-width="2"/><rect x="19" y="30" width="26" height="11" rx="3" fill="#1d1712"/><circle cx="26" cy="35.5" r="2.6" fill="#e9b43c" id="eyeL"/><circle cx="38" cy="35.5" r="2.6" fill="#e9b43c"/><rect x="18" y="50" width="28" height="18" rx="4" fill="#8d9a96" stroke="#2b1a10" stroke-width="2"/><path d="M22 50 L32 58 L42 50" fill="#a3381d"/><rect x="6" y="52" width="10" height="5" rx="2" fill="#8d9a96" stroke="#2b1a10" stroke-width="1.5"/><rect x="48" y="52" width="10" height="5" rx="2" fill="#8d9a96" stroke="#2b1a10" stroke-width="1.5"/></svg>
</div>
<dialog id="dlg" aria-labelledby="cTitle"><div class="case">
  <div class="top"><div><h3 id="cTitle"></h3><p class="meta" id="cMeta"></p></div><button class="x" id="cX" type="button" aria-label="Back to the board">✕</button></div>
  <div class="issue"><b>ISSUE REPORTED</b><span id="cIssue"></span></div>
  <p class="ask" id="cAsk">Which line is the outlaw hiding in?</p>
  <ol class="code" id="cCode"></ol>
  <div class="fixes" id="cFixes"></div>
  <p class="verdict" id="cVerdict" aria-live="assertive"></p>
  <p class="why" id="cWhy"></p>
  <div class="racebar" aria-hidden="true"><i id="cRace"></i></div>
  <div class="racelbl"><span id="cRL">RUSTY IS ON THIS ONE TOO</span><span id="cPct"></span></div>
</div></dialog>
<div id="eod" hidden><div class="eodc" role="dialog" aria-labelledby="eodT"><h2 id="eodT"></h2><p id="eodL"></p><p id="eodS"></p><button id="eodGo" type="button">ride into the next day</button></div></div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  // the outlaws: code (one line per entry), the bad line, the fixes (first one is right), and why
  const BUGS = [
    { n: 'Off-by-One Ollie', g: 80, repo: 'posse-utils', crime: 'returns nobody at all', issue: 'lastCowboy(["Bo", "Jo"]) returns undefined.',
      code: ['function lastCowboy(posse) {', '  return posse[posse.length];', '}'], bad: 1,
      fix: ['  return posse[posse.length - 1];', '  return posse[posse.length + 1];', '  return posse.length;'], why: 'Arrays start at 0, so the last one lives at length - 1.' },
    { n: 'Loose Equals Lou', g: 90, repo: 'tin-star', crime: 'made everybody sheriff', issue: 'isSheriff("cook") says true. So does isSheriff("horse").',
      code: ['function isSheriff(badge) {', '  if (badge = "star") {', '    return true;', '  }', '  return false;', '}'], bad: 1,
      fix: ['  if (badge === "star") {', '  if (badge == star) {', '  if ("star") {'], why: 'One = assigns. Three === compares.' },
    { n: 'Silent Mae', g: 100, repo: 'gold-scales', crime: 'counts the gold, tells nobody', issue: 'totalGold([5, 10]) gives undefined instead of 15.',
      code: ['function totalGold(bags) {', '  let sum = 0;', '  for (const b of bags) sum += b;', '  sum;', '}'], bad: 3,
      fix: ['  return sum;', '  return 0;', '  sum = sum;'], why: 'A function hands back nothing unless it says return.' },
    { n: 'Endless Larry', g: 140, repo: 'stampede', crime: 'rides one horse forever', issue: 'The page freezes. The horses never stop riding.',
      code: ['let i = 0;', 'while (i < 10) {', '  ride(horses[i]);', '}'], bad: 2,
      fix: ['  ride(horses[i++]);', '  ride(horses[i--]);', '  ride(horses[10]);'], why: 'Nothing ever moved i forward, so the loop never ends.' },
    { n: 'Stringy Sam', g: 110, repo: 'wanted-math', crime: 'paid out 5025 dollars', issue: 'addBounty("50", 25) gives "5025".',
      code: ['function addBounty(a, b) {', '  return a + b;', '}', 'addBounty("50", 25); // "5025"'], bad: 1,
      fix: ['  return Number(a) + Number(b);', '  return a - b;', '  return a + b + 0;'], why: '+ glues strings together. Turn them into numbers first.' },
    { n: 'Impatient Annie', g: 160, repo: 'telegraph', crime: 'reads the letter before it arrives', issue: 'TypeError: res.json is not a function',
      code: ['async function getPosse() {', '  const res = fetch("/posse");', '  return res.json();', '}'], bad: 1,
      fix: ['  const res = await fetch("/posse");', '  const res = fetch("/posse").json;', '  const res = new fetch("/posse");'], why: 'fetch hands back a promise. await it to get the response.' },
    { n: 'Echo Cody', g: 120, repo: 'campfire', crime: 'shouts 3, 3, 3', issue: 'The posse should shout 0, 1, 2. It shouts 3, 3, 3.',
      code: ['for (var i = 0; i < 3; i++) {', '  setTimeout(() => shout(i), 100);', '}'], bad: 0,
      fix: ['for (let i = 0; i < 3; i++) {', 'for (var i = 1; i <= 3; i++) {', 'for (const i = 0; i < 3; i++) {'], why: 'var shares one i between all three. let gives each loop its own.' },
    { n: 'Sorta Mabel', g: 100, repo: 'rank-and-file', crime: 'ranks 10 below 1', issue: 'sortedRanks([10, 9, 1]) gives [1, 10, 9].',
      code: ['function sortedRanks(r) {', '  return r.sort();', '}'], bad: 1,
      fix: ['  return [...r].sort((a, b) => a - b);', '  return r.reverse();', '  return r.sort().sort();'], why: 'sort() compares numbers as text unless you give it a compare.' },
    { n: 'Hollow Nell', g: 130, repo: 'stable-hands', crime: 'crashes on riders with no horse', issue: "TypeError: Cannot read properties of undefined (reading 'name')",
      code: ['function horseName(rider) {', '  return rider.horse.name;', '}', 'horseName({ name: "Dusty" });'], bad: 1,
      fix: ['  return rider.horse?.name ?? "on foot";', '  return rider.name.horse;', '  return rider.horse.name || "";'], why: '?. stops quietly when the horse is missing.' },
    { n: 'Point-Three Flo', g: 90, repo: 'saloon-till', crime: 'never pays the barkeep', issue: 'The bill is 0.1 + 0.2, but payOut() never runs.',
      code: ['const bill = 0.1 + 0.2;', 'if (bill === 0.3) payOut();'], bad: 1,
      fix: ['if (Math.abs(bill - 0.3) < 1e-9) payOut();', 'if (bill === "0.3") payOut();', 'if (bill > 0.3) payOut();'], why: '0.1 + 0.2 is 0.30000000000000004. Compare with a tiny margin.' },
    { n: 'Skippin’ Wes', g: 100, repo: 'trail-map', crime: 'never visits Dry Gulch', issue: 'The tour visits Tumbleweed and Mesa, but never Dry Gulch.',
      code: ['const towns = ["Dry Gulch", "Tumbleweed", "Mesa"];', 'for (let i = 1; i < towns.length; i++) {', '  visit(towns[i]);', '}'], bad: 1,
      fix: ['for (let i = 0; i < towns.length; i++) {', 'for (let i = 1; i <= towns.length; i++) {', 'for (let i = 1; i < towns.length - 1; i++) {'], why: 'The first town sits at index 0.' },
    { n: 'Nameless Theo', g: 150, repo: 'tin-star', crime: "says Howdy, I'm undefined", issue: 'sheriff.greet() says "Howdy, I\'m undefined".',
      code: ['const sheriff = {', '  name: "Wyatt",', '  greet: () => "Howdy, I\'m " + this.name,', '};'], bad: 2,
      fix: ['  greet() { return "Howdy, I\'m " + this.name; },', '  greet: () => "Howdy, I\'m " + name,', '  greet: () => "Howdy, I\'m " + self.name,'], why: 'Arrow functions have no this of their own. A method does.' },
    { n: 'Fall-Through Frank', g: 110, repo: 'weather-vane', crime: 'hides AND rides in a dust storm', issue: 'In a dust storm the posse hides, then rides straight into it.',
      code: ['switch (weather) {', '  case "dust":', '    hide();', '  case "sun":', '    ride();', '    break;', '}'], bad: 2,
      fix: ['    hide(); break;', '    hide(); continue;', '    ride(); hide();'], why: 'Without break, a case falls into the next one.' },
    { n: 'Radix Pete', g: 120, repo: 'census', crime: 'says the ages are 8, NaN, 1', issue: '["08", "10", "12"].map(parseInt) gives [8, NaN, 1].',
      code: ['const ages = ["08", "10", "12"]', '  .map(parseInt);'], bad: 1,
      fix: ['  .map(s => parseInt(s, 10));', '  .map(parseInt, 10);', '  .map(parseFloat.bind(10));'], why: 'map passes the index too, and parseInt reads it as the number base.' },
  ];
  const BOT_LINES = {
    start: ['Howdy. I read the whole repo in 0.2 seconds.', 'I’ll take the big one, partner.', 'Beep. That bounty smells like gold.', 'I’ve seen this bug in 40,000 repos.'],
    win: ['Merged. Easy money, partner.', 'PR approved. Beep boop, yeehaw.', 'Another one for the robot.'],
    flop: ['Rejected?! I was so confident.', 'They say the function I called doesn’t exist. Rude.', 'Fine. I’ll try a different repo.'],
    yourWin: ['Nice shot. I’d have got it eventually.', 'Huh. A human did that.', 'Beep. I was 98% done.'],
    hallu: ['Rusty imported cowboy-utils, a package that doesn’t exist.', 'Rusty’s fix just deleted the failing test.', 'Rusty rewrote the whole repo in Rust.', 'Rusty fixed a different bug, in a different repo.', 'Rusty apologized 14 times in the commit message.', 'Rusty’s fix calls lasso.fixEverything(), which isn’t a function.'],
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const KEY = 'bounty-board-v1';
  let best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const G = { day: 1, you: 0, bot: 0, deck: [], posters: [], hunt: null, open: null, dayYou: 0, dayBot: 0, left: 0 };

  function bugSvg(hue, hat) {
    const c = `hsl(${hue} 45% 38%)`, d = `hsl(${hue} 45% 24%)`;
    return `<svg viewBox="0 0 96 84" aria-hidden="true"><g stroke="#2a1a0e" stroke-width="2.4" stroke-linecap="round">
      <path d="M30 52 L14 46 M30 60 L12 64 M34 68 L20 78 M66 52 L82 46 M66 60 L84 64 M62 68 L76 78" fill="none"/>
      <path d="M40 26 Q34 14 28 12 M56 26 Q62 14 68 12" fill="none"/></g>
      <ellipse cx="48" cy="60" rx="21" ry="19" fill="${c}" stroke="#2a1a0e" stroke-width="2.4"/>
      <path d="M48 42 L48 78" stroke="${d}" stroke-width="2"/>
      <circle cx="48" cy="36" r="12" fill="${d}" stroke="#2a1a0e" stroke-width="2.4"/>
      <path d="M38 42 Q48 50 58 42 L56 47 Q48 53 40 47Z" fill="#a3381d" stroke="#2a1a0e" stroke-width="1.5"/>
      <circle cx="43.5" cy="35" r="2.6" fill="#f6e7c0"/><circle cx="52.5" cy="35" r="2.6" fill="#f6e7c0"/>
      <path d="M40.5 31 L46 32.5 M55.5 31 L50 32.5" stroke="#2a1a0e" stroke-width="2"/>
      ${hat ? '<path d="M28 26 Q48 18 68 26 Q48 31 28 26Z" fill="#5a331b" stroke="#2a1a0e" stroke-width="2"/><path d="M38 25 Q38 12 48 12 Q58 12 58 25Z" fill="#6b3f22" stroke="#2a1a0e" stroke-width="2"/>' : '<path d="M36 27 Q48 20 60 27" stroke="#2a1a0e" stroke-width="3" fill="none"/>'}
    </svg>`;
  }
  const BOT_SVG = '<svg class="bot" viewBox="0 0 64 72" aria-hidden="true"><path d="M10 20 Q32 2 54 20 L58 22 Q32 28 6 22Z" fill="#5a331b"/><rect x="20" y="8" width="24" height="12" rx="4" fill="#6b3f22"/><rect x="14" y="24" width="36" height="24" rx="6" fill="#aab6b2" stroke="#2b1a10" stroke-width="2"/><rect x="19" y="30" width="26" height="11" rx="3" fill="#1d1712"/><circle cx="26" cy="35.5" r="2.6" fill="#e9b43c"/><circle cx="38" cy="35.5" r="2.6" fill="#e9b43c"/><rect x="18" y="50" width="28" height="18" rx="4" fill="#8d9a96" stroke="#2b1a10" stroke-width="2"/></svg>';

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function hl(line) { // tiny highlighter: strings, comments, numbers, keywords
    const parts = line.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);
    return parts.map(p => {
      if (!p) return '';
      if (p.startsWith('//')) return `<span class="cm">${esc(p)}</span>`;
      if (p.startsWith('"')) return `<span class="st">${esc(p)}</span>`;
      return esc(p).replace(/\b(function|return|const|let|var|for|while|if|of|async|await|new|switch|case|break|continue|this)\b/g, '<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?(?:e-?\d+)?)\b/g, '<span class="nu">$1</span>');
    }).join('');
  }

  let sayT = 0;
  function botSay(t) { const s = $('say'); s.textContent = t; s.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => s.classList.remove('on'), 3800); }
  const live = t => { $('live').textContent = ''; setTimeout(() => { $('live').textContent = t; }, 30); };

  function newDay() {
    const order = shuffle(BUGS.map((b, i) => i));
    G.deck = order.slice(0, 6); G.left = 6; G.dayYou = G.dayBot = 0; G.posters = []; G.hunt = null;
    $('day').textContent = 'Day ' + G.day; $('board').textContent = '';
    for (let k = 0; k < 3; k++) addPoster();
    setTimeout(startHunt, 2500);
  }
  function addPoster() {
    if (!G.deck.length) return;
    const bi = G.deck.shift(), b = BUGS[bi];
    const p = { bi, b, gold: b.g + 10 * (G.day - 1) * Math.ceil(b.g / 50), state: 'open', race: 0, tries: 0 };
    const el = document.createElement('button'); el.type = 'button'; el.className = 'poster';
    el.style.setProperty('--r', ((Math.random() * 6) - 3).toFixed(1) + 'deg');
    el.innerHTML = `<p class="sub">· DEAD OR FIXED ·</p><h2>WANTED</h2>${bugSvg((bi * 47) % 360, bi % 3 !== 1)}<p class="name"></p><p class="crime"></p><div class="reward"></div><div class="repo"></div><div class="race"><i></i></div>${BOT_SVG}<span class="stamp"></span>`;
    el.querySelector('.name').textContent = b.n; el.querySelector('.crime').textContent = 'for: ' + b.crime;
    el.querySelector('.reward').textContent = '$' + p.gold + ' REWARD'; el.querySelector('.repo').textContent = 'repo: ' + b.repo;
    el.setAttribute('aria-label', `Wanted: ${b.n}, ${b.crime}. Reward ${p.gold} gold.`);
    el.addEventListener('click', () => openCase(p));
    p.el = el; G.posters.push(p); $('board').appendChild(el);
  }

  // Rusty picks the richest open poster and works on it; the day makes him faster and sharper
  const botTime = () => Math.max(9, 28 - G.day * 2.5) * (0.85 + Math.random() * 0.3); // day 1 ~25 s per bounty, down to 9 s
  const botAcc = () => Math.min(0.85, 0.55 + G.day * 0.07);
  function startHunt() {
    if (G.hunt && G.hunt.state === 'open') return;
    const open = G.posters.filter(p => p.state === 'open');
    if (!open.length) { G.hunt = null; return; }
    const p = open.sort((a, b) => b.gold - a.gold)[0];
    p.race = 0; p.need = botTime(); G.hunt = p; p.el.classList.add('hunted');
    botSay(pick(BOT_LINES.start));
  }
  function settle(p, who) {
    p.state = who === 'you' ? 'paid' : 'lost';
    p.el.classList.remove('hunted'); p.el.classList.add('done', who === 'you' ? 'paid' : 'lost');
    p.el.querySelector('.stamp').textContent = who === 'you' ? 'PAID' : 'RUSTY’S';
    p.el.setAttribute('aria-label', `${p.b.n}: ${who === 'you' ? 'you got this one' : 'Rusty got this one'}.`);
    if (who === 'you') { G.you += p.gold; G.dayYou += p.gold; } else { G.bot += p.gold; G.dayBot += p.gold; }
    $('you').textContent = G.you; $('bot').textContent = G.bot;
    if (G.hunt === p) G.hunt = null;
    G.left--;
    setTimeout(() => { addPoster(); if (G.left <= 0) endDay(); else setTimeout(startHunt, 1200); }, 900);
  }
  function botSubmit(p) {
    if (Math.random() < botAcc()) {
      botSay(pick(BOT_LINES.win)); settle(p, 'bot');
      if (G.open === p) { verdict('bad', 'Rusty got there first.', 'The maintainer merged the robot’s fix.'); lockCase(); }
    } else {
      const h = pick(BOT_LINES.hallu); botSay(pick(BOT_LINES.flop));
      p.el.classList.remove('hunted'); G.hunt = null; p.race = 0; p.need = botTime() * 1.2; p.burned = (p.burned || 0) + 1;
      if (G.open === p) $('cWhy').textContent = 'PR rejected: ' + h;
      live('Rusty’s pull request was rejected. ' + h);
      setTimeout(() => { if (p.burned < 2 && p.state === 'open') { G.hunt = p; p.el.classList.add('hunted'); } else startHunt(); }, 1800);
    }
  }
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const p = G.hunt;
    if (p && p.state === 'open' && $('eod').hidden) {
      p.race += dt / p.need;
      const w = Math.min(100, p.race * 100).toFixed(1) + '%';
      p.el.querySelector('.race i').style.width = w;
      if (G.open === p) { $('cRace').style.width = w; $('cPct').textContent = Math.floor(Math.min(100, p.race * 100)) + '%'; $('cRL').textContent = 'RUSTY IS ON THIS ONE TOO'; }
      if (p.race >= 1) botSubmit(p);
    }
    if (G.open && G.hunt !== G.open) { $('cRace').style.width = '0%'; $('cPct').textContent = ''; $('cRL').textContent = 'Rusty is busy on another poster'; }
    requestAnimationFrame(tick);
  }

  // the case file: find the line, pick the fix
  function openCase(p) {
    if (p.state !== 'open') return;
    G.open = p; const b = p.b;
    $('cTitle').textContent = b.n; $('cMeta').textContent = `repo: ${b.repo} · reward $${p.gold}`;
    $('cIssue').textContent = b.issue; $('cAsk').textContent = 'Which line is the outlaw hiding in?';
    $('cVerdict').textContent = ''; $('cVerdict').className = 'verdict'; $('cWhy').textContent = '';
    $('cFixes').textContent = '';
    const ol = $('cCode'); ol.textContent = '';
    b.code.forEach((ln, i) => {
      const li = document.createElement('li'), bt = document.createElement('button'); bt.type = 'button';
      bt.innerHTML = hl(ln) || ' '; bt.setAttribute('aria-label', 'Line ' + (i + 1) + ': ' + ln);
      bt.addEventListener('click', () => pickLine(p, i, bt)); li.appendChild(bt); ol.appendChild(li);
    });
    $('dlg').showModal(); ol.querySelector('button').focus();
  }
  function pickLine(p, i, bt) {
    if (p.state !== 'open' || G.open !== p) return;
    if (i !== p.b.bad) {
      bt.classList.remove('bad'); void bt.offsetWidth; bt.classList.add('bad');
      if (G.hunt === p) p.race = Math.min(.97, p.race + .08);
      $('cWhy').textContent = 'Nope, that line’s an honest citizen.'; return;
    }
    $('cCode').querySelectorAll('button').forEach(x => { x.disabled = true; });
    bt.classList.add('got'); $('cWhy').textContent = '';
    $('cAsk').textContent = 'Got ’em. Now pick the fix for line ' + (i + 1) + ':';
    const opts = shuffle(p.b.fix.map((f, k) => ({ f, ok: k === 0 })));
    const box = $('cFixes'); box.textContent = '';
    opts.forEach(o => {
      const fb = document.createElement('button'); fb.type = 'button'; fb.textContent = o.f.trim();
      fb.addEventListener('click', () => pickFix(p, o, fb)); box.appendChild(fb);
    });
    box.querySelector('button').focus();
  }
  function verdict(cls, t, why) { $('cVerdict').className = 'verdict ' + cls; $('cVerdict').textContent = t; if (why != null) $('cWhy').textContent = why; }
  function lockCase() { $('dlg').querySelectorAll('.code button,.fixes button').forEach(x => { x.disabled = true; }); }
  function pickFix(p, o, fb) {
    if (p.state !== 'open' || G.open !== p) return;
    if (o.ok) {
      verdict('ok', 'MERGED! +$' + p.gold, p.b.why); lockCase(); settle(p, 'you');
      if (G.hunt === null || G.hunt === p) botSay(pick(BOT_LINES.yourWin));
      setTimeout(() => { if (G.open === p) closeCase(); }, 2300);
    } else {
      fb.classList.add('no'); fb.disabled = true; p.tries++;
      verdict('bad', 'PR REJECTED', 'The maintainer ran it. Still broken. Try another fix.');
      if (G.hunt === p) p.race = Math.min(.97, p.race + .12);
    }
  }
  function closeCase() { if ($('dlg').open) $('dlg').close(); }
  $('cX').addEventListener('click', closeCase);
  $('dlg').addEventListener('close', () => { G.open = null; });
  $('dlg').addEventListener('click', e => { if (e.target === $('dlg')) closeCase(); });

  function endDay() {
    closeCase();
    const won = G.dayYou >= G.dayBot;
    if (G.you > best) { best = G.you; try { localStorage.setItem(KEY, best); } catch (e) {} }
    $('eodT').textContent = won ? 'You run this town' : 'Rusty’s town today';
    $('eodL').textContent = `Day ${G.day}: you $${G.dayYou}, Rusty $${G.dayBot}.`;
    $('eodS').textContent = won ? 'Tomorrow Rusty comes back faster. And a little less wrong.' : 'It was fast, but you’re the one who reads the code. Saddle up.';
    $('eod').hidden = false; $('eodGo').focus();
  }
  $('eodGo').addEventListener('click', () => { $('eod').hidden = true; G.day++; newDay(); });

  newDay();
  requestAnimationFrame(tick);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('eod').hidden) $('eodGo').click(); });
})();
</script>
</body>
</html>
