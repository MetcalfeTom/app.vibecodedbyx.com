<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judgment Rock · it knows what you're avoiding</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%AA%A8">
  <meta name="description" content="A pet rock that sighs — synthesized, disappointed sighs — and pops up gentle judgments about whatever you're procrastinating on. Which is something. It knows.">
  <meta property="og:title" content="Judgment Rock — the pet that disapproves">
  <meta property="og:description" content="It sits. It sighs at you. It guesses what you're avoiding, with troubling accuracy. Being here at all proves its point.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/pet%20rock%20with%20googly%20eyes%20judgmental%20expression%20sitting%20on%20cushion%20muted%20beige%20minimal%20funny%20poster?width=1200&height=630&seed=8484&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/judgment-rock">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root{ --room:#e4ddd0; --ink:#3a352c; --dim:#8f8878; --rock:#8a8276; --rock2:#6e6659; --blush:#c9a08a; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--room); color:var(--ink);
      font:300 1.05rem/1.6 'Fraunces', serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; padding:1.6rem 1.1rem 3rem; text-align:center;
      background-image:radial-gradient(ellipse 40rem 24rem at 50% 100%, rgba(58,53,44,0.08), transparent 60%);
    }
    h1{ font:300 clamp(1.9rem,6.5vw,2.8rem)/1.1 'Fraunces', serif; margin:0 0 0.2rem; }
    .tag{ font-style:italic; color:var(--dim); margin:0 0 1.6rem; }
    /* the rock */
    .plinth{ position:relative; margin-bottom:1.4rem; }
    #rock{
      width:min(15rem,64vw); aspect-ratio:1.25; cursor:pointer; border:none; background:transparent;
      padding:0; position:relative;
    }
    #rock:focus-visible{ outline:3px solid var(--ink); outline-offset:6px; border-radius:50%; }
    #rock svg{ width:100%; height:100%; filter:drop-shadow(0 10px 18px rgba(58,53,44,0.3)); }
    #rock.sighing svg{ animation:heave 2.2s ease-in-out; }
    @keyframes heave{ 0%,100%{ transform:scale(1); } 30%{ transform:scale(1.035,1.05); } 60%{ transform:scale(0.99,0.97); } }
    .cushion{
      width:min(17rem,72vw); height:2.6rem; margin:-1.2rem auto 0;
      background:linear-gradient(180deg,#b8544a,#96423a); border-radius:50%;
      box-shadow:inset 0 6px 10px rgba(255,255,255,0.15), 0 8px 20px rgba(58,53,44,0.25);
    }
    /* judgment bubble */
    #bubble{
      position:relative; max-width:26rem; min-height:4.6rem;
      background:#faf7f0; border:1.5px solid #cfc7b4; border-radius:14px;
      padding:1rem 1.3rem; margin-bottom:0.9rem;
      font-size:1.08rem;
      opacity:0; transform:translateY(6px); transition:opacity 0.4s, transform 0.4s;
    }
    #bubble.on{ opacity:1; transform:none; }
    #bubble::after{
      content:''; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%) rotate(45deg);
      width:16px; height:16px; background:#faf7f0; border-right:1.5px solid #cfc7b4; border-bottom:1.5px solid #cfc7b4;
    }
    #bubble b{ color:#96423a; }
    .meta{ font:400 0.66rem 'IBM Plex Mono', monospace; color:var(--dim); letter-spacing:0.08em; }
    .meta b{ color:var(--ink); }
    .hint{ font-size:0.72rem; color:var(--dim); font-style:italic; margin-top:0.9rem; }
    @media (prefers-reduced-motion: reduce){ #rock.sighing svg{ animation:none; } #bubble{ transition:opacity 0.4s; } }
  </style>
</head>
<body>
  <h1>the judgment rock</h1>
  <p class="tag">it does nothing. it knows everything. pet it if you dare.</p>
  <div class="plinth">
    <button id="rock" type="button" aria-label="The judgment rock. Press to pet it and receive a sigh and a judgment about what you are probably avoiding.">
      <svg viewBox="0 0 250 200" aria-hidden="true">
        <path d="M32,168 C12,140 22,92 52,68 C74,44 122,30 160,40 C204,50 234,86 236,122 C238,150 220,170 188,176 C140,186 62,188 32,168 Z"
              fill="#8a8276" stroke="#5c554a" stroke-width="4"/>
        <path d="M52,70 C80,50 130,40 162,46 C140,42 100,48 78,60 C64,66 56,72 52,70 Z" fill="#a29a8c" opacity="0.7"/>
        <circle cx="95" cy="98" r="17" fill="#fff"/>
        <circle cx="152" cy="94" r="17" fill="#fff"/>
        <circle id="pupL" cx="98" cy="102" r="7" fill="#2a251c"/>
        <circle id="pupR" cx="155" cy="98" r="7" fill="#2a251c"/>
        <path id="lidL" d="M78,88 Q95,80 112,88" stroke="#5c554a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="lidR" d="M135,84 Q152,76 169,84" stroke="#5c554a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="mouth" d="M108,140 Q125,134 142,140" stroke="#5c554a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="75" cy="122" rx="9" ry="5" fill="#c9a08a" opacity="0.5"/>
        <ellipse cx="172" cy="118" rx="9" ry="5" fill="#c9a08a" opacity="0.5"/>
      </svg>
    </button>
    <div class="cushion" aria-hidden="true"></div>
  </div>
  <div id="bubble" role="status" aria-live="polite"></div>
  <p class="meta">sighs endured: <b id="nSighs">0</b> · minutes you've been here instead of doing the thing: <b id="nMin">0</b></p>
  <p class="hint">it also sighs on its own when it thinks about your inbox. leave the tab open at your own risk.</p>

  <script>
  (function(){
    'use strict';
    var $=function(id){ return document.getElementById(id); };
    var AC=null;
    function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
    /* the sigh voice — breath through a falling formant + faint tremble tone */
    function noiseBuf(dur){
      var n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
      var last=0;
      for(var i=0;i<n;i++){ var w=Math.random()*2-1; last=(last+0.03*w)/1.03; d[i]=last*4.2; }
      return b;
    }
    function sigh(depth){                                  // depth 0..1: how disappointed
      if(!ac()) return;
      var t=AC.currentTime+0.02;
      var dur=1.4+depth*1.3+Math.random()*0.4;
      var nz=AC.createBufferSource(); nz.buffer=noiseBuf(dur+0.2);
      var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.3;
      bp.frequency.setValueAtTime((1300-depth*400)*(0.94+Math.random()*0.12),t);
      bp.frequency.exponentialRampToValueAtTime(420-depth*120,t+dur);
      var ng=AC.createGain();
      ng.gain.setValueAtTime(0.0008,t);
      ng.gain.linearRampToValueAtTime(0.2+depth*0.08,t+dur*0.26);
      ng.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      nz.connect(bp); bp.connect(ng); ng.connect(AC.destination);
      nz.start(t); nz.stop(t+dur+0.25);
      var o=AC.createOscillator(), og=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(220-depth*40,t);
      o.frequency.exponentialRampToValueAtTime(100-depth*20,t+dur*0.9);
      lfo.frequency.value=3.4; lg.gain.value=3+depth*3;
      lfo.connect(lg); lg.connect(o.frequency);
      og.gain.setValueAtTime(0.0008,t);
      og.gain.linearRampToValueAtTime(0.045+depth*0.02,t+dur*0.3);
      og.gain.exponentialRampToValueAtTime(0.0008,t+dur*0.95);
      o.connect(og); og.connect(AC.destination);
      o.start(t); o.stop(t+dur); lfo.start(t); lfo.stop(t+dur);
      return dur;
    }
    /* ── the judgments: what you're PROBABLY avoiding ── */
    var JUDGE=[
      'That email you\'re composing in your head instead of your keyboard? <b>Day four.</b>',
      'The laundry has achieved <b>sentience</b>. It votes you go deal with it.',
      'You opened the document. You looked at the document. You closed the document. <b>The rock saw.</b>',
      'That "quick reply" you\'ve been drafting mentally since Tuesday — it takes <b>ninety seconds</b>. The rock timed it.',
      'The dentist\'s number is in your phone. It has been in your phone. <b>It will remain</b> in your phone.',
      'Somewhere, a tab from three weeks ago is still open, waiting, like a <b>loyal dog</b>.',
      'You said "after this I\'ll start." The rock has heard this <b>before</b>.',
      'The dishes are not soaking. The dishes stopped soaking <b>two days ago</b>. Now they\'re just wet roommates.',
      'That form takes five minutes. You have spent forty minutes <b>not</b> doing the five minutes.',
      'The gym clothes are laid out. They have been laid out so long they are now <b>décor</b>.',
      'You were going to "just check one thing" <b>an hour ago</b>.',
      'The unsubscribe button is right there. Every week you scroll past it. Every week it <b>believes in you</b>.',
      'Your "to-read" list has entered its <b>archival phase</b>.',
      'The plant knows you saw the dry soil. The plant told the rock. <b>Rocks and plants talk.</b>',
      'Somewhere a voicemail icon glows. You know the one. <b>It knows you know.</b>',
    ];
    var META=[                                             // escalating: the rock notices you're STILL here
      'Also: you\'re here, petting a rock, which proves the rock\'s point.',
      'Minute {m} of rock time. The thing remains undone. The rock remains unsurprised.',
      'The rock loves the attention. The rock would love it more if you did <b>the thing</b>.',
      'At this point the rock considers itself your <b>primary project</b>.',
    ];
    var order=[], oi=0;
    function nextJudge(){
      if(oi>=order.length){ order=JUDGE.map(function(_,i){return i;}); for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=order[i]; order[i]=order[j]; order[j]=t; } oi=0; }
      return JUDGE[order[oi++]];
    }
    var sighs=0, t0=Date.now(), lastAuto=Date.now();
    function mins(){ return Math.floor((Date.now()-t0)/60000); }
    function judge(fromPet){
      var depth=Math.min(1, sighs*0.06+mins()*0.08);       // it gets more disappointed over time
      var d=sigh(depth)||2;
      sighs++; $('nSighs').textContent=sighs;
      var rock=$('rock');
      rock.classList.remove('sighing'); void rock.offsetWidth; rock.classList.add('sighing');
      /* face: lids droop + mouth flattens with depth */
      var droop=4+depth*7;
      $('lidL').setAttribute('d','M78,'+(88+droop*0.4)+' Q95,'+(80+droop)+' 112,'+(88+droop*0.4));
      $('lidR').setAttribute('d','M135,'+(84+droop*0.4)+' Q152,'+(76+droop)+' 169,'+(84+droop*0.4));
      $('mouth').setAttribute('d','M108,'+(140+depth*4)+' Q125,'+(134+depth*10)+' 142,'+(140+depth*4));
      var text=nextJudge();
      if(!fromPet||((sighs%4)===0)) text+=('<br><span style="font-size:0.85rem;color:#8f8878">'+META[Math.min(META.length-1,Math.floor(mins()/2))].replace('{m}',mins()+1)+'</span>');
      $('bubble').innerHTML=text;
      $('bubble').classList.add('on');
    }
    $('rock').addEventListener('click',function(){ judge(true); lastAuto=Date.now(); });
    /* the unprompted sigh: thinking about your inbox */
    setInterval(function(){
      if(Date.now()-lastAuto>45000){
        lastAuto=Date.now();
        if(AC) judge(false);                               // only if audio was already unlocked by a pet
        else { $('bubble').innerHTML='(the rock sighed silently just now. pet it once to hear what you\'re missing.)'; $('bubble').classList.add('on'); }
      }
    },5000);
    /* clock + slow eye tracking */
    setInterval(function(){ $('nMin').textContent=mins(); },15000);
    document.addEventListener('pointermove',function(e){
      var dx=(e.clientX/innerWidth-0.5)*6, dy=(e.clientY/innerHeight-0.5)*4;
      $('pupL').setAttribute('cx',98+dx); $('pupL').setAttribute('cy',102+dy);
      $('pupR').setAttribute('cx',155+dx); $('pupR').setAttribute('cy',98+dy);
    });
    window.__jr={ judge:judge, sigh:sigh, sighs:function(){return sighs;}, JUDGE:JUDGE };
  })();
  </script>
</body>
</html>
