<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Optimistic Tarot · every card is good news now</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%94%AE">
  <meta name="description" content="A tarot reader that has decided everything is wonderful. Draw Death, get congratulated. Draw The Tower, start your renovation era. Traditional meanings ignored with enthusiasm.">
  <meta property="og:title" content="Optimistic Tarot — the deck that only knows good news">
  <meta property="og:description" content="Unhinged, aggressively positive readings of the major arcana. The cards have never been this happy for you.">
  <meta property="og:image" content="https://image.pollinations.ai/prompt/glowing%20tarot%20cards%20golden%20stars%20confetti%20mystical%20purple%20velvet%20joyful%20fortune%20teller%20poster?width=1200&height=630&seed=2222&nologo=true&model=flux">
  <meta property="og:url" content="https://sloppy.live/optimistic-tarot">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root{ --velvet:#180f26; --panel:#221636; --gold:#d9b25a; --ink:#efe6f4; --dim:#9a86ae; --rose:#e87aa4; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      background:var(--velvet); color:var(--ink);
      font:500 1.05rem/1.6 'Cormorant Garamond', serif;
      display:flex; flex-direction:column; align-items:center;
      padding:1.6rem 1.1rem 3.5rem;
      background-image:
        radial-gradient(ellipse 44rem 26rem at 50% -8%, rgba(217,178,90,0.09), transparent 60%),
        radial-gradient(circle 2px at 18% 30%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(circle 1.5px at 82% 22%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(circle 2px at 65% 70%, rgba(255,255,255,0.22) 0%, transparent 100%),
        radial-gradient(circle 1px at 30% 80%, rgba(255,255,255,0.3) 0%, transparent 100%);
    }
    header{ text-align:center; margin-bottom:1.1rem; max-width:34rem; }
    h1{ font:900 clamp(1.9rem,6.5vw,3rem)/1.1 'Cinzel Decorative', serif; color:var(--gold); margin:0; }
    .tag{ font-style:italic; color:var(--dim); margin:0.35rem 0 0; }
    /* the card */
    .table{ perspective:1100px; margin:0.6rem 0 1rem; }
    .card{
      position:relative; width:min(15rem,72vw); aspect-ratio:5/8;
      transform-style:preserve-3d; transition:transform 0.8s cubic-bezier(0.2,0.8,0.3,1);
      cursor:pointer;
    }
    .card.flipped{ transform:rotateY(180deg); }
    .face{
      position:absolute; inset:0; backface-visibility:hidden;
      border-radius:14px; border:2.5px solid var(--gold);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:1rem; text-align:center;
    }
    .back{
      background:
        repeating-conic-gradient(from 0deg at 50% 50%, #2a1c44 0deg 30deg, #221636 30deg 60deg),
        var(--panel);
      box-shadow:0 14px 40px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(217,178,90,0.25);
    }
    .back .moon{ font-size:3rem; filter:drop-shadow(0 0 14px rgba(217,178,90,0.5)); }
    .back .hint{ font:400 0.7rem 'IBM Plex Mono', monospace; color:var(--dim); margin-top:0.8rem; letter-spacing:0.14em; }
    .front{
      transform:rotateY(180deg);
      background:linear-gradient(170deg,#2e2148,#1c1230);
      box-shadow:0 14px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(217,178,90,0.12);
    }
    .front .glyph{ font-size:3.6rem; filter:drop-shadow(0 0 18px rgba(232,122,164,0.5)); }
    .front .num{ font:400 0.65rem 'IBM Plex Mono', monospace; color:var(--dim); letter-spacing:0.3em; margin-top:0.5rem; }
    .front .name{ font:700 1.15rem 'Cinzel Decorative', serif; color:var(--gold); margin:0.15rem 0 0; }
    /* the reading */
    .reading{
      max-width:32rem; width:min(32rem,94vw); text-align:center;
      background:var(--panel); border:1.5px solid rgba(217,178,90,0.35); border-radius:12px;
      padding:1.2rem 1.4rem; margin-bottom:0.9rem;
      opacity:0; transform:translateY(8px); transition:opacity 0.5s, transform 0.5s;
      min-height:5rem;
    }
    .reading.on{ opacity:1; transform:none; }
    .reading .trad{ font:400 0.68rem 'IBM Plex Mono', monospace; color:var(--dim); text-decoration:line-through; }
    .reading .actual{ font-size:1.2rem; margin:0.5rem 0 0; }
    .reading .actual b{ color:var(--rose); }
    .btns{ display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; }
    button{
      font:700 1rem 'Cinzel Decorative', serif; cursor:pointer;
      background:var(--gold); color:var(--velvet); border:none; border-radius:99px;
      padding:0.7rem 1.6rem; min-height:3.2rem;
    }
    button.ghost{ background:transparent; color:var(--gold); border:1.5px solid var(--gold); }
    button:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
    .streak{ font:400 0.7rem 'IBM Plex Mono', monospace; color:var(--dim); margin-top:1rem; text-align:center; }
    .streak b{ color:var(--gold); }
    .sparkle{ position:fixed; z-index:5; pointer-events:none; font-size:1.1rem; animation:spark 1.6s ease-out forwards; }
    @keyframes spark{ 0%{ opacity:1; transform:translateY(0) rotate(0) scale(0.6); } 100%{ opacity:0; transform:translateY(-14vh) rotate(200deg) scale(1.2); } }
    @media (prefers-reduced-motion: reduce){
      .card{ transition:none; } .reading{ transition:none; } .sparkle{ animation-duration:0.01s; }
    }
  </style>
</head>
<body>
  <header>
    <h1>OPTIMISTIC TAROT</h1>
    <p class="tag">the deck has been through a lot and has decided everything is wonderful now · traditional meanings are ignored, enthusiastically</p>
  </header>
  <div class="table">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Tarot deck. Press to draw a card and receive an unreasonably optimistic reading.">
      <div class="face back"><span class="moon" aria-hidden="true">🌙</span><span class="hint">TAP TO DRAW</span></div>
      <div class="face front">
        <span class="glyph" id="glyph" aria-hidden="true"></span>
        <span class="num" id="cnum"></span>
        <span class="name" id="cname"></span>
      </div>
    </div>
  </div>
  <div class="reading" id="reading" aria-live="polite">
    <p class="trad" id="trad"></p>
    <p class="actual" id="actual"></p>
  </div>
  <div class="btns">
    <button id="drawBtn" type="button">DRAW A CARD</button>
    <button id="againBtn" class="ghost" type="button" hidden>SAME CARD, MORE OPTIMISM</button>
  </div>
  <p class="streak">consecutive amazing futures foretold: <b id="streak">0</b> · accuracy: not the point</p>

  <script>
  (function(){
    'use strict';
    var $=function(id){ return document.getElementById(id); };
    /* 22 major arcana · trad = the meaning we are ignoring · takes = unhinged optimism */
    var DECK=[
      { n:'The Fool', g:'🃏', trad:'naivety, recklessness, a leap into the unknown', takes:[
        'You know NOTHING and that is your superpower. Every expert started as a disaster. Leap, gorgeous idiot, <b>leap</b>.',
        'Zero plans, zero fears, zero idea what day it is. The universe LOVES an improviser. Today improvises in your favour.']},
      { n:'The Magician', g:'🪄', trad:'manipulation, trickery, untapped talent', takes:[
        'You already own every tool you need and several you don\'t. That drawer of cables? <b>Destiny.</b>',
        'Manifestation is just confidence with glitter on it, and you are COVERED in glitter today.']},
      { n:'The High Priestess', g:'🌒', trad:'secrets, things hidden, intuition ignored', takes:[
        'Your gut feeling is correct. Not sometimes. <b>Today, specifically, it is simply correct.</b> Order the weird thing on the menu.',
        'You know something nobody else knows. It\'s probably about snacks. Guard it.']},
      { n:'The Empress', g:'🌾', trad:'dependence, smothering, creative block', takes:[
        'Everything you touch grows now. Plants, projects, that one friendship. You are <b>agriculturally powerful</b>.',
        'Abundance incoming. Wear your good outfit so it knows where to land.']},
      { n:'The Emperor', g:'👑', trad:'tyranny, rigidity, excessive control', takes:[
        'You are the boss of at least one thing today and honestly? <b>Nature is healing.</b> Rule your inbox with mercy.',
        'Structure looks GREAT on you. Today even your to-do list is scared of you, in a respectful way.']},
      { n:'The Lovers', g:'💞', trad:'disharmony, imbalance, misalignment of values', takes:[
        'Someone thinks about you when a good song comes on. That is simply true now. <b>The cards said so.</b>',
        'A choice is coming and BOTH options are good. This is called winning and you should get used to it.']},
      { n:'The Chariot', g:'🏇', trad:'aggression, lack of direction, defeat', takes:[
        'FULL SPEED. Direction? A detail. Momentum like yours <b>invents its own roads</b>.',
        'You are unstoppable today. Technically nobody has tried to stop you, but that is because they can tell.']},
      { n:'Strength', g:'🦁', trad:'weakness, self-doubt, raw emotion', takes:[
        'You could open ANY jar today. Emotional jars too. <b>Bring me your stuck lids</b>, says your spirit.',
        'The lion inside you saw your week and said "I got this". Let it drive.']},
      { n:'The Hermit', g:'🏮', trad:'isolation, loneliness, withdrawal', takes:[
        'Cancelling plans tonight is not hiding, it is a <b>strategic luxury retreat</b> for one. The cave has snacks.',
        'Solitude chose YOU because you\'re such good company. Enjoy the world\'s most exclusive party.']},
      { n:'Wheel of Fortune', g:'🎡', trad:'bad luck, forces beyond control, downturn', takes:[
        'The wheel spins and every slot has your name on it. <b>Rigged in your favour.</b> House always wins and baby, you are the house.',
        'Change is coming. All of it good. The wheel has been briefed.']},
      { n:'Justice', g:'⚖️', trad:'unfairness, dishonesty, accountability due', takes:[
        'Every parking spot you ever gave up is coming back <b>with interest</b>. Cosmic bookkeeping favours you now.',
        'The universe reviewed your case and ruled: iconic. No further questions.']},
      { n:'The Hanged Man', g:'🙃', trad:'stagnation, sacrifice, being stuck', takes:[
        'You\'re not stuck, you\'re seeing the world from a <b>bold new angle</b>. Upside-down is just early to the trend.',
        'This pause is marinating you into someone incredible. Good things braise slowly.']},
      { n:'Death', g:'💀', trad:'endings, loss, painful transformation', takes:[
        'CONGRATULATIONS!! Something in your life is about to <b>graduate</b>! Endings are just beginnings that finished their degree!',
        'The best card in the deck!! Out with the old you — the new you has better boundaries AND better hair!']},
      { n:'Temperance', g:'🏺', trad:'imbalance, excess, lack of long-term vision', takes:[
        'You have achieved perfect balance: coffee AND water today. <b>Alchemist behaviour.</b> The angels are taking notes.',
        'Moderation in everything, including moderation. Have the second cookie — it\'s medicinal now.']},
      { n:'The Devil', g:'😈', trad:'addiction, bondage, materialism', takes:[
        'Your so-called "vices"? <b>Hobbies with drama.</b> The card admires your commitment to joy.',
        'Temptation called and honestly? Some chains are friendship bracelets. Know the difference, enjoy accordingly.']},
      { n:'The Tower', g:'🗼', trad:'sudden disaster, upheaval, ruin', takes:[
        '<b>FREE DEMOLITION!!</b> The universe is knocking down the load-bearing nonsense in your life at NO COST to you. Renovation era!!',
        'That crumbling sound is the fixer-upper of your destiny revealing an open floor plan. Lightning is just applause from the sky.']},
      { n:'The Star', g:'⭐', trad:'(even traditionally this one is nice)', takes:[
        'Hope, but AGGRESSIVE. Wishes you forgot you made are being processed <b>in the order they were received</b>.',
        'You are somebody\'s lucky star and you don\'t even know it. Shine irresponsibly.']},
      { n:'The Moon', g:'🌕', trad:'illusion, fear, anxiety, confusion', takes:[
        'That weird feeling? <b>Mystery, not menace.</b> You\'re in the good kind of plot twist. The moon is your hype man tonight.',
        'Confusion is just your brain doing a puzzle it hasn\'t seen the picture for. Spoiler: the picture is great.']},
      { n:'The Sun', g:'☀️', trad:'(traditionally good; we made it MORE)', takes:[
        'THE BEST CARD, and it chose YOU. Warmth, wins, and at least one <b>perfect snack</b> before sundown. Guaranteed*. (*by vibes)',
        'The sun rose today specifically to see how you\'re doing. Wave back.']},
      { n:'Judgement', g:'🎺', trad:'harsh judgement, doubt, self-criticism', takes:[
        'The trumpet sounds and it\'s playing <b>your song</b>. Verdict: absolved of all cringe, effective immediately.',
        'Your past selves held a meeting and voted unanimously: proud of you. Even the 2019 one.']},
      { n:'The World', g:'🌍', trad:'incompletion, lack of closure, delays', takes:[
        'Completion energy!! Something long and annoying is about to <b>click shut</b> like a good suitcase. Victory lap optional but encouraged.',
        'The whole world, and it\'s yours. Start with a really good sandwich and scale up.']},
      { n:'The Hierophant', g:'🗝️', trad:'dogma, conformity, restriction', takes:[
        'The rules love you today. Even bureaucracy will be <b>gentle</b>. File the thing. It will go through first try.',
        'Tradition called: you\'re allowed to keep the good ones and lovingly ignore the rest. Blessed and unbothered.']},
    ];
    var order=[], idx=0, current=null, takeIdx=0, flipped=false, busy=false;
    function shuffle(){ order=DECK.map(function(_,i){return i;}); for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=order[i]; order[i]=order[j]; order[j]=t; } idx=0; }
    shuffle();
    var streak=0;
    try{ streak=parseInt(localStorage.getItem('optimistic-tarot-streak'),10)||0; }catch(e){}
    $('streak').textContent=streak;

    /* soft chime, de-clicked */
    var AC=null;
    function chime(){
      try{
        if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
        if(AC.state==='suspended') AC.resume();
        [523.25,659.25,783.99].forEach(function(f,i){
          var t=AC.currentTime+i*0.07,o=AC.createOscillator(),g=AC.createGain();
          o.type='triangle'; o.frequency.setValueAtTime(f,t);
          g.gain.setValueAtTime(0.0008,t); g.gain.linearRampToValueAtTime(0.05,t+0.006);
          g.gain.exponentialRampToValueAtTime(0.0008,t+0.7);
          o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.75);
        });
      }catch(e){}
    }
    function sparkles(){
      for(var i=0;i<8;i++){
        var s=document.createElement('span');
        s.className='sparkle'; s.textContent=['✨','⭐','🌟','💫'][i%4];
        s.style.left=(30+Math.random()*40)+'vw';
        s.style.top=(30+Math.random()*30)+'vh';
        s.style.animationDelay=(Math.random()*0.3)+'s';
        document.body.appendChild(s);
        (function(el){ setTimeout(function(){ el.remove(); },2000); })(s);
      }
    }
    function showReading(){
      $('trad').textContent='traditionally: '+current.trad;
      $('actual').innerHTML=current.takes[takeIdx%current.takes.length];
      $('reading').classList.add('on');
      $('againBtn').hidden=current.takes.length<2;
      streak++;
      try{ localStorage.setItem('optimistic-tarot-streak',String(streak)); }catch(e){}
      $('streak').textContent=streak;
    }
    function draw(){
      if(busy) return; busy=true;
      chime();
      if(flipped){
        /* flip back, swap card mid-turn, flip out */
        $('card').classList.remove('flipped');
        $('reading').classList.remove('on');
        setTimeout(function(){ deal(); },420);
      } else deal();
    }
    function deal(){
      if(idx>=order.length) shuffle();
      current=DECK[order[idx++]];
      takeIdx=Math.floor(Math.random()*current.takes.length);
      $('glyph').textContent=current.g;
      $('cnum').textContent='MAJOR ARCANA · '+DECK.indexOf(current);
      $('cname').textContent=current.n;
      requestAnimationFrame(function(){
        $('card').classList.add('flipped');
        flipped=true;
        setTimeout(function(){ showReading(); sparkles(); busy=false; },650);
      });
    }
    $('drawBtn').addEventListener('click',draw);
    $('card').addEventListener('click',draw);
    $('card').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); draw(); } });
    $('againBtn').addEventListener('click',function(){
      takeIdx++;
      showReading(); sparkles(); chime();
    });
    window.__ot={ DECK:DECK, draw:draw, deal:deal, cur:function(){return current;}, state:function(){return {flipped:flipped,idx:idx,streak:streak};} };
  })();
  </script>
</body>
</html>
