<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Multiple Choice Chess</title>
<meta name="description" content="Chess as a quiz show: every turn Stockfish deals you a few moves, and you pick one. Can you spot the gem among the traps?">
<link rel="icon" href="https://emojicdn.elk.sh/♟️">
<meta property="og:title" content="Multiple Choice Chess">
<meta property="og:description" content="Every turn Stockfish deals you a few moves. Pick the gem, dodge the traps.">
<meta property="og:url" content="https://app.sloppy.live/multiple-choice-chess/">
<meta property="og:image" content="https://app.sloppy.live/multiple-choice-chess/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://app.sloppy.live/multiple-choice-chess/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;900&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1030;--stage:#141a4a;--rim:#2b347a;--gold:#ffc83d;--goldD:#b8860b;--paper:#eef0ff;--mute:#9aa3d6;
  --lt:#e8dcc4;--dk:#5f7f8f;--hl:rgba(255,200,61,.45);--chk:#ff4d5e;
  --oA:#ff8a3d;--oB:#3ddc97;--oC:#4cc3ff;--oD:#ff6fd8;--oE:#c9f04a;
  --disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --pc:'Noto Sans Symbols 2','Segoe UI Symbol','DejaVu Sans',serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:
  radial-gradient(ellipse 60% 45% at 50% -5%,rgba(255,200,61,.22),transparent 70%),
  radial-gradient(ellipse 50% 40% at 0% 100%,rgba(76,195,255,.14),transparent 70%),
  radial-gradient(ellipse 50% 40% at 100% 100%,rgba(255,111,216,.12),transparent 70%),
  var(--night);color:var(--paper);font:400 14px/1.45 var(--mono);display:flex;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
main{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr;max-width:520px;gap:12px}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;animation:in .5s both}
h1{margin:0;font:900 clamp(28px,8.4vw,52px)/1 var(--disp);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold)}
.top{display:flex;gap:8px;margin-left:auto}
.ic{white-space:nowrap;min-width:42px;height:42px;border-radius:999px;border:2px solid var(--rim);background:var(--stage);color:var(--paper);font:600 13px var(--mono);cursor:pointer;padding:0 12px}
.ic:hover{border-color:var(--gold)}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.boardwrap{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 0 0 4px var(--rim),0 0 0 7px var(--night),0 0 0 9px rgba(255,200,61,.5),0 20px 50px rgba(0,0,0,.5);animation:in .5s .08s both}
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font:400 calc(min(92vw,520px)/8*.74)/1 var(--pc);user-select:none}
@media (min-width:821px){.sq{font-size:calc(520px/8*.74)}}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.last::before{content:'';position:absolute;inset:0;background:var(--hl)}
.sq.chk::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,var(--chk) 0,rgba(255,77,94,.4) 45%,transparent 72%)}
.sq .p{position:relative;z-index:1}
.sq .p.w{color:#fffaf0;text-shadow:0 0 1px #111,0 1px 0 #111,1px 0 0 #111,-1px 0 0 #111,0 -1px 0 #111,0 3px 3px rgba(0,0,0,.35)}
.sq .p.b{color:#1b1d2e;text-shadow:0 0 1px #fff3,0 3px 3px rgba(0,0,0,.3)}
.sq .co{position:absolute;font:600 9px/1 var(--mono);opacity:.6;z-index:1}
.sq .co.f{right:3px;bottom:2px}.sq .co.r{left:3px;top:3px}
.sq.l .co{color:var(--dk)}.sq.d .co{color:var(--lt)}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pcs{pointer-events:none}
.pcs .sq{background:none}
svg.arrows.m-hover .ar{opacity:0}
svg.arrows.m-hover.focus .ar.on{opacity:1}
svg.arrows.m-off{display:none}
svg.arrows .ar{opacity:.92;transition:opacity .2s}
svg.arrows.focus .ar{opacity:.18}
svg.arrows.focus .ar.on{opacity:1}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;animation:in .5s .16s both}
.host{background:linear-gradient(180deg,var(--stage),#0f1440);border:2px solid var(--rim);border-radius:14px;padding:12px 14px}
.host .q{font:900 22px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
.host .q b{color:var(--gold)}
.host .s{color:var(--mute);font-size:12px;margin:0;min-height:1.4em}
.opts{display:grid;gap:9px}
.opt{--c:var(--gold);position:relative;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;min-height:54px;padding:0 18px 0 8px;border:2px solid var(--c);background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.01));color:var(--paper);font:600 17px var(--mono);text-align:left;cursor:pointer;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);transition:background .15s,transform .08s;animation:deal .35s both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}.opt:nth-child(5){animation-delay:.28s}
.opt .k{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--night);display:flex;align-items:center;justify-content:center;font:900 18px var(--disp);margin-left:8px}
.opt .t{font:400 12px var(--mono);color:var(--mute)}
.opt:hover:not(:disabled),.opt.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent),rgba(255,255,255,.02))}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt.pick{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent),transparent)}
.opt.dim{opacity:.55}
.opt .v{font:600 12px var(--mono);text-align:right;white-space:nowrap}
.v.best{color:var(--gold)}.v.good{color:#7ef0b0}.v.ok{color:#c7d0ff}.v.bad{color:#ffb070}.v.blunder{color:#ff7083}
.wait{display:flex;align-items:center;gap:10px;color:var(--mute);padding:14px 4px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:4px;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.stats b{color:var(--paper)}
.trail{font-size:15px;letter-spacing:2px;min-height:1.2em;word-break:break-all}
.err{border-color:var(--chk)!important}
.err .q{color:#ffb3bb}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;border-radius:999px;border:2px solid var(--gold);background:var(--gold);color:var(--night);font:900 18px var(--disp);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:0 16px}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--rim)}
dialog{border:2px solid var(--rim);border-radius:16px;background:var(--stage);color:var(--paper);padding:18px;width:min(440px,calc(100vw - 32px));font:400 13px/1.5 var(--mono)}
dialog::backdrop{background:rgba(5,8,25,.7)}
dialog h2{margin:0 0 10px;font:900 26px/1 var(--disp);text-transform:uppercase;color:var(--gold)}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;margin-bottom:6px}
.ch{display:flex;flex-wrap:wrap;gap:6px}
/* styled on the span, not label:has(), so browsers without :has() still show the pick (Tatum 05:52: dark text on dark blue) */
.ch label{flex:1 1 auto;min-width:3.2em;text-align:center;cursor:pointer;position:relative}
.ch label span{display:block;border:2px solid var(--rim);border-radius:10px;padding:7px 9px;color:var(--paper)}
.ch label:hover span{border-color:var(--mute)}
.ch input{position:absolute;opacity:0;pointer-events:none}
.ch input:checked+span{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600}
.ch input:focus-visible+span{outline:3px solid var(--paper);outline-offset:2px}
.hint{color:var(--mute);font-size:11.5px;margin:6px 0 0;min-height:2.6em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes in{from{transform:translateY(10px)}}
@keyframes deal{from{opacity:0;transform:translateX(-14px)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Multiple Choice <em>Chess</em></h1>
    <div class="top"><button class="ic" id="setBtn" aria-haspopup="dialog">rules</button><button class="ic" id="newBtn">new game</button></div>
  </header>
  <div class="boardwrap" id="bw"><div class="board" id="board" aria-hidden="true"></div><svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg><div class="board pcs" id="pcs" role="img" aria-label="Chess board"></div><svg class="arrows tags" id="tags" viewBox="0 0 8 8" aria-hidden="true"></svg></div>
  <section class="side">
    <div class="host" id="host" aria-live="polite"><p class="q" id="q">Warming up the quizmaster…</p><p class="s" id="s">Stockfish is loading.</p></div>
    <div class="opts" id="opts"></div>
    <div class="stats" id="stats"></div>
    <div class="trail" id="trail" aria-label="Your picks so far"></div>
  </section>
</main>
<dialog id="dlg" aria-labelledby="dlgT">
  <form method="dialog" id="setForm">
    <h2 id="dlgT">House rules</h2>
    <fieldset><legend>How the options are dealt</legend><div class="ch" id="ruleCh"></div><p class="hint" id="ruleHint"></p></fieldset>
    <fieldset><legend>Options per turn</legend><div class="ch" id="nCh"></div></fieldset>
    <fieldset><legend>Arrows on the board</legend><div class="ch" id="arCh"></div></fieldset>
    <fieldset><legend>Opponent</legend><div class="ch" id="oppCh"></div></fieldset>
    <fieldset><legend>You play (new game)</legend><div class="ch" id="sideCh"></div></fieldset>
    <div class="row"><button class="btn" value="ok">Continue playing</button></div>
  </form>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var COLORS=['--oA','--oB','--oC','--oD','--oE'],LET='12345';/* numbers, easier on the hand than letters (Tatum 05:54) */
var GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
var NAME={k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'};
/* Each rule takes the engine's ranking of every legal move (best first) and deals n of them */
var RULES={
  mix:{label:'the mix',hint:'Tatum\'s deal: the best move, a random legal move, a move that loses a little, and the worst move on the board. With fewer options the random one goes first, then the slightly-off one.'},
  gem:{label:'one gem',hint:'The best move hides among traps: the others cost you at least a pawn and a half, and the tempting ones (captures, checks) go in first.'},
  top:{label:'top picks',hint:'Only the engine\'s top moves. Every option is decent, so it\'s all about finding the very best.'},
  spread:{label:'spread',hint:'From best to worst, evenly spaced through every legal move. Easy to spot the disasters, harder in the middle.'},
  chaos:{label:'chaos',hint:'Any legal moves at all, dealt at random. The best move might not even be there; pick the least bad.'}
};
var OPP={gentle:{label:'gentle',skill:1,mt:250},club:{label:'club',skill:8,mt:500},brutal:{label:'brutal',skill:20,mt:900}};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
var cfg=Object.assign({rule:'mix',n:4,opp:'club',side:'w',arrows:'all'},store('mcc_cfg')||{});
if(!RULES[cfg.rule])cfg.rule='mix';if(!OPP[cfg.opp])cfg.opp='club';cfg.n=Math.max(2,Math.min(5,cfg.n|0||4));if(cfg.side!=='b')cfg.side='w';if(['all','hover','off'].indexOf(cfg.arrows)<0)cfg.arrows='all';
var game,me,moves,picks,deal,phase='load',gen=0,lastMv=null;

/* ── Stockfish 10 in a worker, from cdnjs ── */
var SF={w:null,ok:false,h:null};
function sfInit(){return new Promise(function(res,rej){var w,done=false,t=setTimeout(function(){fail('it took too long to load');},30000);
  function fail(m){if(done)return;done=true;clearTimeout(t);rej(new Error(m));}
  try{w=new Worker(URL.createObjectURL(new Blob(["importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');"],{type:'application/javascript'})));}catch(e){fail('the browser would not start it');return;}
  w.onerror=function(){fail('the engine file did not load');};
  w.onmessage=function(e){var l=String(e.data);if(l.indexOf('uciok')>=0)w.postMessage('isready');else if(l.indexOf('readyok')>=0&&!done){done=true;clearTimeout(t);SF.w=w;SF.ok=true;w.onmessage=function(ev){if(SF.h)SF.h(String(ev.data));};res();}};
  w.postMessage('uci');});}
function score(l){var m=/score (cp|mate) (-?\d+)/.exec(l);if(!m)return null;var v=+m[2];return m[1]==='cp'?v:(v>0?100000-v*100:-100000-v*100);}
/* every legal move with its score for the side to move, best first */
function rankAll(fen,count){return new Promise(function(res){var by={},tm;
  SF.h=function(l){if(l.indexOf('info')===0&&l.indexOf(' pv ')>0){var k=/multipv (\d+)/.exec(l),s=score(l),pv=/ pv (\S+)/.exec(l);if(k&&s!==null&&pv)by[k[1]]={uci:pv[1],cp:s};}
    else if(l.indexOf('bestmove')===0){clearTimeout(tm);SF.h=null;var seen={},out=[];Object.keys(by).sort(function(a,b){return a-b;}).forEach(function(k){if(!seen[by[k].uci]){seen[by[k].uci]=1;out.push(by[k]);}});out.sort(function(a,b){return b.cp-a.cp;});res(out);}};
  SF.w.postMessage('setoption name Skill Level value 20');SF.w.postMessage('setoption name MultiPV value '+Math.min(count,60));
  SF.w.postMessage('position fen '+fen);SF.w.postMessage('go movetime '+(count>24?1600:1100));
  tm=setTimeout(function(){SF.w.postMessage('stop');},6000);});}
function engineMove(fen){var o=OPP[cfg.opp];return new Promise(function(res){var tm;
  SF.h=function(l){if(l.indexOf('bestmove')===0){clearTimeout(tm);SF.h=null;res(l.split(/\s+/)[1]);}};
  SF.w.postMessage('setoption name MultiPV value 1');SF.w.postMessage('setoption name Skill Level value '+o.skill);
  SF.w.postMessage('position fen '+fen);SF.w.postMessage('go movetime '+o.mt);tm=setTimeout(function(){SF.w.postMessage('stop');},5000);});}

/* ── dealing ── */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function verbose(uci){var mv=game.moves({verbose:true});for(var i=0;i<mv.length;i++){var m=mv[i];if(m.from+m.to===uci.slice(0,4)&&(!m.promotion||m.promotion===(uci[4]||'q')))return m;}return null;}
function dealFrom(rank,n,rule){var best=rank[0].cp,pick;n=Math.min(n,rank.length);
  if(rule==='mix'){/* best, worst, then a slightly-off move, then random ones */
    pick=[rank[0]];if(n>=2&&rank.length>1)pick.push(rank[rank.length-1]);
    if(n>=3){var mid=rank.filter(function(r){return pick.indexOf(r)<0&&best-r.cp>=20&&best-r.cp<=150;});
      if(!mid.length)mid=rank.filter(function(r){return pick.indexOf(r)<0&&r.cp<best;});
      mid.sort(function(a,b){return Math.abs(best-a.cp-60)-Math.abs(best-b.cp-60);});if(mid.length)pick.push(mid[0]);}
    var rest=shuffle(rank.filter(function(r){return pick.indexOf(r)<0;}));while(pick.length<n&&rest.length)pick.push(rest.pop());}
  else if(rule==='top')pick=rank.slice(0,n);
  else if(rule==='spread'){pick=[];for(var i=0;i<n;i++){var r=rank[Math.round(i*(rank.length-1)/Math.max(1,n-1))];if(pick.indexOf(r)<0)pick.push(r);}}
  else if(rule==='chaos')pick=shuffle(rank.slice()).slice(0,n);
  else{var traps=rank.slice(1).filter(function(r){return best-r.cp>=150;});
    var tempt=function(r){var m=verbose(r.uci);return m&&(m.captured||/[+#]/.test(m.san))?1:0;};
    traps=shuffle(traps).sort(function(a,b){return tempt(b)-tempt(a);});
    pick=[rank[0]].concat(traps.slice(0,n-1));
    for(var j=rank.length-1;pick.length<n&&j>0;j--)if(pick.indexOf(rank[j])<0)pick.push(rank[j]);}
  return shuffle(pick).map(function(r){return {uci:r.uci,cp:r.cp,loss:Math.max(0,best-r.cp),best:r.cp===best};});}
function verdict(o){if(o.best||o.loss<=10)return ['best','best'];if(o.loss<=50)return ['good','good'];if(o.loss<=150)return ['ok','inaccuracy'];if(o.loss<=300)return ['bad','mistake'];return ['blunder','blunder'];}
function fmtCp(cp){if(Math.abs(cp)>=90000){var n=Math.ceil((100000-Math.abs(cp))/200);return (cp>0?'mate in ':'mated in ')+Math.max(1,n);}return (cp>=0?'+':'−')+(Math.abs(cp)/100).toFixed(1);}

/* ── drawing ── */
function sqXY(sq){var f='abcdefgh'.indexOf(sq[0]),r=+sq[1]-1;return me==='w'?[f+.5,7-r+.5]:[7-f+.5,r+.5];}
function drawBoard(){var b=game.board(),h='',hp='',chk=game.in_check()?game.turn():null;
  for(var y=0;y<8;y++)for(var x=0;x<8;x++){var r=me==='w'?7-y:y,f=me==='w'?x:7-x,sq='abcdefgh'[f]+(r+1),pc=b[7-r][f],cls='sq '+((f+r)%2?'l':'d');
    if(lastMv&&(lastMv.from===sq||lastMv.to===sq))cls+=' last';if(pc&&pc.type==='k'&&pc.color===chk)cls+=' chk';
    h+='<div class="'+cls+'">'+(x===0?'<span class="co r">'+(r+1)+'</span>':'')+(y===7?'<span class="co f">'+'abcdefgh'[f]+'</span>':'')+'</div>';
    hp+='<div class="sq">'+(pc?'<span class="p '+pc.color+'">'+GLYPH[pc.type]+'</span>':'')+'</div>';}
  $('board').innerHTML=h;$('pcs').innerHTML=hp;
  $('pcs').setAttribute('aria-label','Chess board, you play '+(me==='w'?'white':'black')+'. '+(lastMv?'Last move '+lastMv.san+'.':''));}
function drawArrows(){var s=$('arrows'),h='<defs>';if(!deal||phase!=='pick'){s.innerHTML='';$('tags').innerHTML='';return;}
  deal.forEach(function(o,i){h+='<marker id="mh'+i+'" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var('+COLORS[i]+')"/></marker>';});h+='</defs>';
  var used={},CORN=[[-.33,-.33],[.33,-.33],[-.33,.33],[.33,.33]],tg='';
  deal.forEach(function(o,i){var fr=o.uci.slice(0,2),c=CORN[(used[fr]=(used[fr]||0)+1)-1]||CORN[0],a=sqXY(fr),b=sqXY(o.uci.slice(2,4)),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,ex=b[0]-ux*.32,ey=b[1]-uy*.32;
    h+='<g class="ar" data-i="'+i+'"><line x1="'+(a[0]+ux*.18)+'" y1="'+(a[1]+uy*.18)+'" x2="'+ex+'" y2="'+ey+'" stroke="var('+COLORS[i]+')" stroke-width=".15" stroke-linecap="round" marker-end="url(#mh'+i+')"/>'+
      '</g>';tg+='<g class="ar" data-i="'+i+'"><circle cx="'+(a[0]+c[0])+'" cy="'+(a[1]+c[1])+'" r=".16" fill="var('+COLORS[i]+')" stroke="#0b1030" stroke-width=".035"/><text x="'+(a[0]+c[0])+'" y="'+(a[1]+c[1]+.065)+'" text-anchor="middle" font-size=".2" font-weight="900" font-family="Big Shoulders Display,Impact,sans-serif" fill="#0b1030">'+LET[i]+'</text></g>';});
  s.innerHTML=h;s.setAttribute('class','arrows m-'+cfg.arrows);$('tags').innerHTML=tg;$('tags').setAttribute('class','arrows tags m-'+cfg.arrows);}
function say(q,s,err){$('q').innerHTML=q;$('s').innerHTML=s||'';$('host').classList.toggle('err',!!err);}
function describe(m){var t=NAME[m.piece]+' to '+m.to;if(m.captured)t=NAME[m.piece]+' takes '+NAME[m.captured]+' on '+m.to;if(m.flags.indexOf('k')>=0)t='castle kingside';if(m.flags.indexOf('q')>=0)t='castle queenside';if(m.promotion)t+=', becomes a '+NAME[m.promotion];if(/#/.test(m.san))t+=', checkmate';else if(/\+/.test(m.san))t+=', check';return t;}
function drawOpts(revealed,chosen){var box=$('opts');
  if(phase==='think'||phase==='opp'||phase==='load'){box.innerHTML='<div class="wait"><span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>'+(phase==='opp'?'Your opponent is thinking…':phase==='load'?'Loading the engine…':'Dealing your options…')+'</div>';return;}
  if(!deal||!deal.length){box.innerHTML='';return;}
  box.innerHTML=deal.map(function(o,i){var v=revealed?verdict(o):null;
    return '<button class="opt'+(revealed?(i===chosen?' pick':' dim'):'')+'" style="--c:var('+COLORS[i]+')" data-i="'+i+'"'+(revealed?' disabled':'')+' aria-label="Option '+LET[i]+': '+o.san+', '+o.say+(v?'. '+v[1]:'')+'"><span class="k">'+LET[i]+'</span><span>'+o.san+'<br><span class="t">'+o.say+'</span></span>'+
      (v?'<span class="v '+v[0]+'">'+v[1]+'<br>'+fmtCp(o.cp)+'</span>':'<span></span>')+'</button>';}).join('');}
function drawStats(){var n=picks.length,b=picks.filter(function(p){return p==='best';}).length,pts=picks.reduce(function(a,p){return a+({best:3,good:2,ok:1}[p]||0);},0);
  $('stats').innerHTML=n?'<span>picks <b>'+n+'</b></span><span>· best <b>'+b+'</b></span><span>· points <b>'+pts+'</b></span><span>· rule <b>'+RULES[cfg.rule].label+'</b></span>':'<span>rule <b>'+RULES[cfg.rule].label+'</b> · '+cfg.n+' options · '+OPP[cfg.opp].label+' opponent</span>';
  $('trail').textContent=picks.map(function(p){return {best:'🟨',good:'🟩',ok:'⬜',bad:'🟧',blunder:'🟥'}[p];}).join('');}
function draw(){drawBoard();drawArrows();drawStats();}

/* ── flow ── */
function save(){store('mcc_game',{v:1,me:me,moves:moves,picks:picks});store('mcc_cfg',cfg);}
function play(uci){var m=game.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'});if(m){moves.push(uci);lastMv=m;}return m;}
function over(){if(!game.game_over())return false;var t;
  if(game.in_checkmate())t=game.turn()===me?'Checkmate. The house wins this one.':'Checkmate! You win the grand prize.';
  else if(game.in_stalemate())t='Stalemate. Nobody wins, everybody shrugs.';else if(game.insufficient_material())t='Draw: not enough pieces left to mate.';else if(game.in_threefold_repetition())t='Draw by repetition.';else t='Draw.';
  phase='over';deal=null;say(t,'Tap <b>new game</b> for another round.');drawOpts();draw();return true;}
function next(){var g=++gen;if(over())return;
  if(game.turn()!==me){phase='opp';drawOpts();draw();say('Their move','');
    engineMove(game.fen()).then(function(u){if(g!==gen)return;var m=play(u);if(!m){say('The engine got confused','Tap new game to start over.',true);return;}save();next();});return;}
  phase='think';drawOpts();draw();say('Your move','The quizmaster is shuffling the cards.');
  var legal=game.moves().length;
  rankAll(game.fen(),legal).then(function(rank){if(g!==gen)return;
    if(!rank.length){say('Hmm, no ranking came back','Tap new game to try again.',true);return;}
    /* moves the engine skipped in its list count as the worst */
    var have={};rank.forEach(function(r){have[r.uci]=1;});game.moves({verbose:true}).forEach(function(m){var u=m.from+m.to+(m.promotion||'');if(!have[u])rank.push({uci:u,cp:rank[rank.length-1].cp-1});});
    deal=dealFrom(rank,cfg.n,cfg.rule).map(function(o){var m=verbose(o.uci);o.san=m?m.san:o.uci;o.say=m?describe(m):'';return o;});
    phase='pick';var bestIn=deal.some(function(o){return o.best;});
    say('Your move: pick <b>'+LET.slice(0,deal.length).split('').join(', ').replace(/, ([1-5])$/,' or $1')+'</b>',RULES[cfg.rule].label+(cfg.rule==='chaos'&&!bestIn?' · the best move might not be here':''));
    drawOpts();draw();});}
function choose(i){if(phase!=='pick')return;var o=deal[i],v=verdict(o);phase='reveal';
  picks.push(v[0]);var m=play(o.uci);if(!m)return;drawOpts(true,i);
  var best=deal.filter(function(x){return x.best;})[0];
  say(v[0]==='best'?'Correct!':v[0]==='good'?'Close enough':v[0]==='ok'?'Hmm, okay':'Ouch, '+v[1],
    v[0]==='best'?'That was the engine\'s favourite.':(best?'The best of these was <b>'+LET[deal.indexOf(best)]+'</b>, '+best.san+'.':'The best move wasn\'t even on the table.'));
  save();draw();var g=gen;setTimeout(function(){if(g===gen)next();},1700);}
function newGame(){gen++;game=new Chess();me=cfg.side;moves=[];picks=[];deal=null;lastMv=null;save();draw();if(SF.ok)next();}
function restore(){var s=store('mcc_game');if(!s||s.v!==1||!Array.isArray(s.moves))return false;game=new Chess();me=s.me==='b'?'b':'w';moves=[];picks=Array.isArray(s.picks)?s.picks:[];
  for(var i=0;i<s.moves.length;i++)if(!play(s.moves[i]))break;return true;}

$('opts').addEventListener('click',function(e){var b=e.target.closest('.opt');if(b&&!b.disabled)choose(+b.dataset.i);});
function focusOpt(b){[$('arrows'),$('tags')].forEach(function(s){if(!b||phase!=='pick'){s.classList.remove('focus');return;}s.classList.add('focus');[].forEach.call(s.querySelectorAll('.ar'),function(a){a.classList.toggle('on',a.dataset.i===b.dataset.i);});});}
$('opts').addEventListener('pointerover',function(e){focusOpt(e.target.closest('.opt'));});
$('opts').addEventListener('pointerleave',function(){focusOpt(null);});
$('opts').addEventListener('focusin',function(e){focusOpt(e.target.closest('.opt'));});
$('opts').addEventListener('focusout',function(){focusOpt(null);});
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey||$('dlg').open)return;var i=LET.indexOf(e.key);if(i<0)i='abcde'.indexOf(e.key.toLowerCase());if(i>=0&&deal&&i<deal.length&&phase==='pick'){e.preventDefault();choose(i);}});
$('newBtn').onclick=function(){newGame();};

/* settings */
function chips(id,name,list,val){$(id).innerHTML=list.map(function(o){return '<label><input type="radio" name="'+name+'" value="'+o[0]+'"'+(String(o[0])===String(val)?' checked':'')+'><span>'+o[1]+'</span></label>';}).join('');}
$('setBtn').onclick=function(){chips('ruleCh','rule',Object.keys(RULES).map(function(k){return [k,RULES[k].label];}),cfg.rule);chips('nCh','n',[[2,'2'],[3,'3'],[4,'4'],[5,'5']],cfg.n);
  chips('oppCh','opp',Object.keys(OPP).map(function(k){return [k,OPP[k].label];}),cfg.opp);chips('sideCh','side',[['w','white'],['b','black']],cfg.side);chips('arCh','arrows',[['all','all'],['hover','on hover'],['off','off']],cfg.arrows);$('ruleHint').textContent=RULES[cfg.rule].hint;$('dlg').showModal();};
$('ruleCh').addEventListener('change',function(e){$('ruleHint').textContent=RULES[e.target.value].hint;});
$('dlg').addEventListener('close',function(){var f=$('setForm'),get=function(n){var x=f.querySelector('input[name='+n+']:checked');return x?x.value:null;};
  var r=get('rule'),n=+get('n'),o=get('opp'),sd=get('side');if(!r)return;cfg.arrows=get('arrows')||cfg.arrows;drawArrows();var redeal=r!==cfg.rule||n!==cfg.n;cfg.rule=r;cfg.n=n;cfg.opp=o;cfg.side=sd;save();drawStats();
  if(sd!==me&&!moves.length){newGame();return;}if(sd!==me)say('Side switch saved','You\'ll play '+(sd==='w'?'white':'black')+' from the next new game.');
  if(redeal&&phase==='pick')next();});

window.__MCC={get game(){return game;},get deal(){return deal;},get phase(){return phase;},choose:choose,dealFrom:dealFrom,cfg:cfg,newGame:newGame};
if(typeof Chess!=='function'){say('The chess rules didn\'t load','Check your connection and refresh.',true);return;}
if(!restore()){game=new Chess();me=cfg.side;moves=[];picks=[];}
phase='load';draw();drawOpts();
sfInit().then(function(){next();},function(err){phase='err';drawOpts();say('The quizmaster didn\'t show up','Stockfish couldn\'t load ('+err.message+'). Refresh to try again.',true);$('opts').innerHTML='';});
})();
</script>
