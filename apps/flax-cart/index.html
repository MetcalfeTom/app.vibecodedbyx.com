<style>
:root{--ink:#16213a;--ink2:#22315a;--linen:#f5edd9;--straw:#f2c14e;--flax:#8fa9f5;--clay:#e4572e;--field:#3f7b4c;--mono:'Martian Mono',ui-monospace,monospace;--disp:'Bungee','Arial Black',Impact,sans-serif;--body:'Bricolage Grotesque','Trebuchet MS',sans-serif}
*{box-sizing:border-box}
html{font-size:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--linen);font-family:var(--body)}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--straw);outline-offset:3px}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(.6rem,env(safe-area-inset-top)) max(.7rem,env(safe-area-inset-right)) .6rem max(.7rem,env(safe-area-inset-left))}
.pill{background:rgba(22,33,58,.78);border:2px solid rgba(245,237,217,.18);border-radius:.9rem;padding:.35rem .7rem;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#hPos{position:absolute;left:max(.7rem,env(safe-area-inset-left));top:max(.6rem,env(safe-area-inset-top));font-family:var(--disp);line-height:1;display:flex;align-items:baseline;gap:.15rem}
#hPos b{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:400;color:var(--straw);text-shadow:3px 3px 0 var(--clay)}
#hPos i{font-style:normal;font-size:1.05rem;color:var(--straw)}
#hPos small{font-size:1rem;opacity:.85;margin-left:.3rem}
#mini{position:absolute;left:max(.7rem,env(safe-area-inset-left));top:calc(max(.6rem,env(safe-area-inset-top)) + 4.6rem);width:9.5rem;height:6.5rem;opacity:.95}
#hLap{position:absolute;right:max(.7rem,env(safe-area-inset-right));top:max(.6rem,env(safe-area-inset-top));text-align:right;min-width:8.5rem}
#hLap .l1{font-family:var(--disp);font-size:clamp(1.1rem,3.6vw,1.5rem);letter-spacing:.02em}
#hLap .l1 em{font-style:normal;color:var(--straw)}
#hLap .l2{font-family:var(--mono);font-size:clamp(.95rem,3vw,1.2rem);font-weight:700;margin-top:.1rem}
#hLap .l3{font-family:var(--mono);font-size:.72rem;opacity:.9;margin-top:.15rem;white-space:pre-line;line-height:1.45}
#hTop{position:absolute;top:max(.6rem,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:.5rem;pointer-events:auto}
.ib{min-width:2.75rem;min-height:2.75rem;border-radius:.8rem;border:2px solid rgba(245,237,217,.25);background:rgba(22,33,58,.7);font-size:1.1rem;display:grid;place-items:center}
.ib svg{width:1.35rem;height:1.35rem;fill:currentColor}
.ib:hover{border-color:var(--straw)}
#hMsg{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--disp);font-size:clamp(1.6rem,6.5vw,3.4rem);color:var(--linen);text-shadow:0 3px 0 var(--ink),0 0 18px rgba(22,33,58,.6);letter-spacing:.03em;padding:0 1rem}
#hMsg small{display:block;font-family:var(--body);font-weight:800;font-size:clamp(.95rem,3vw,1.25rem);letter-spacing:.06em;color:var(--straw);margin-top:.4rem;text-shadow:0 2px 0 var(--ink)}
#hMsg.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#hCount{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-size:clamp(4rem,20vw,9rem);color:var(--straw);text-shadow:6px 6px 0 var(--clay),0 0 30px rgba(22,33,58,.5);line-height:1}
#hCount.go{color:#9fe870;text-shadow:6px 6px 0 var(--field)}
#hCount.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
#hSpd{position:absolute;right:max(.8rem,env(safe-area-inset-right));bottom:max(.8rem,env(safe-area-inset-bottom));font-family:var(--disp);font-size:1.6rem;text-align:right;line-height:1;text-shadow:0 2px 0 var(--ink)}
#hSpd small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;opacity:.85}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:700 .72rem/1 var(--body);background:rgba(22,33,58,.72);color:var(--linen);padding:.2rem .45rem;border-radius:.5rem;white-space:nowrap;border-left:4px solid var(--c)}
.tag b{font-family:var(--disp);font-weight:400;margin-right:.3rem;color:var(--straw)}
body.boost #speedfx{opacity:1}
#speedfx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 50% 55%,transparent 52%,rgba(242,193,78,.18) 75%,rgba(228,87,46,.28) 100%)}
#fade{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
/* ---- touch ---- */
#touch{position:fixed;inset:0;pointer-events:none}
#tSteer{position:absolute;left:0;bottom:0;width:55%;height:62%;pointer-events:auto;touch-action:none}
#tSteer .rail{position:absolute;left:max(1rem,env(safe-area-inset-left));bottom:max(1.4rem,env(safe-area-inset-bottom));width:min(15rem,46vw);height:4.2rem;border-radius:2.2rem;background:rgba(22,33,58,.45);border:2px solid rgba(245,237,217,.3)}
#tSteer .rail::before,#tSteer .rail::after{content:'◀';position:absolute;top:50%;transform:translateY(-50%);left:.9rem;font-size:1.1rem;opacity:.7}
#tSteer .rail::after{content:'▶';left:auto;right:.9rem}
#tKnob{position:absolute;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;border-radius:50%;background:rgba(245,237,217,.85);border:3px solid var(--clay);left:0;top:0;opacity:0}
#tSteer.on #tKnob{opacity:1}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid rgba(245,237,217,.55);background:rgba(22,33,58,.55);font-family:var(--disp);font-size:.85rem;letter-spacing:.04em;touch-action:none;display:grid;place-items:center}
.tb.on{background:rgba(242,193,78,.75);color:var(--ink);border-color:var(--linen)}
#tDrift{right:max(1rem,env(safe-area-inset-right));bottom:max(1.4rem,env(safe-area-inset-bottom));width:6.2rem;height:6.2rem}
#tBrake{right:max(7.8rem,calc(env(safe-area-inset-right) + 6.8rem));bottom:max(1.6rem,env(safe-area-inset-bottom));width:4.4rem;height:4.4rem;font-size:.7rem}
#tReset{right:max(1.4rem,env(safe-area-inset-right));bottom:max(8.6rem,calc(env(safe-area-inset-bottom) + 7.8rem));width:3rem;height:3rem;font-size:1.05rem}
body.touch #hSpd{bottom:auto;top:calc(max(.6rem,env(safe-area-inset-top)) + 7.2rem)}
/* ---- cards ---- */
.card{position:fixed;z-index:5;background:linear-gradient(160deg,rgba(22,33,58,.94),rgba(34,49,90,.92));border:2px solid rgba(245,237,217,.16);border-radius:1.4rem;box-shadow:0 1.2rem 3rem rgba(8,12,24,.5);padding:1.4rem 1.5rem;color:var(--linen);overflow:auto;max-height:calc(100% - 2rem)}
#title{left:max(1.2rem,env(safe-area-inset-left));top:50%;transform:translateY(-50%);width:min(27rem,calc(100% - 2.4rem))}
#card{left:50%;top:50%;transform:translate(-50%,-50%);width:min(30rem,calc(100% - 2rem))}
.logo{margin:0;font-family:var(--disp);font-weight:400;line-height:.86;font-size:clamp(3.2rem,13vw,5.4rem);letter-spacing:.01em;transform:skewX(-8deg);transform-origin:left}
.logo span{display:block;color:var(--straw);text-shadow:4px 4px 0 var(--clay)}
.logo span+span{color:var(--linen);text-shadow:4px 4px 0 var(--flax);font-size:.8em;margin-top:.12em}
.tagline{font-weight:300;font-size:1.05rem;line-height:1.4;margin:.9rem 0 1.1rem;max-width:22rem}
.tagline b{font-weight:800;color:var(--straw)}
label.lb,legend.lb{display:block;font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--flax);margin:0 0 .35rem}
input[type=text]{width:100%;min-height:2.75rem;border-radius:.7rem;border:2px solid rgba(245,237,217,.25);background:rgba(8,12,24,.45);color:var(--linen);font:600 1.05rem var(--body);padding:.4rem .75rem}
input[type=text]:focus{border-color:var(--straw);outline:none}
fieldset{border:0;padding:0;margin:.9rem 0 1.1rem}
.sw{display:flex;flex-wrap:wrap;gap:.4rem}
.sw label{position:relative;width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;background:var(--c);border:3px solid rgba(8,12,24,.5)}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw label:has(input:checked){border-color:var(--linen);box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--straw)}
.sw label:has(input:focus-visible){outline:3px solid var(--straw);outline-offset:3px}
.swname{font-size:.85rem;margin:.35rem 0 0;opacity:.9}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.4rem}
.b{min-height:3rem;padding:.6rem 1.2rem;border-radius:.9rem;border:2px solid transparent;font-family:var(--disp);font-size:1.05rem;letter-spacing:.02em;background:var(--clay);color:#fff;box-shadow:0 4px 0 #9e3518;transition:transform .08s}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #9e3518}
.b.alt{background:transparent;border-color:rgba(245,237,217,.4);box-shadow:none;color:var(--linen)}
.b.alt:hover{border-color:var(--straw)}
.help{font-size:.82rem;line-height:1.5;opacity:.88;margin:1rem 0 0}
.help kbd{font-family:var(--mono);font-size:.72rem;background:rgba(245,237,217,.12);border-radius:.3rem;padding:.05rem .3rem}
#buildstamp{display:block;margin-top:.9rem;font-family:var(--mono);font-size:.62rem;opacity:.55}
.card h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,6vw,2.1rem);margin:0 0 .2rem;color:var(--straw);text-shadow:3px 3px 0 var(--clay)}
.card .sub{margin:0 0 .9rem;font-weight:600;opacity:.9}
table.res{width:100%;border-collapse:collapse;font-size:.92rem;margin:.4rem 0 1rem}
table.res th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--flax);text-align:left;padding:.25rem .3rem;font-weight:800}
table.res td{padding:.32rem .3rem;border-top:1px solid rgba(245,237,217,.1)}
table.res td.n{font-family:var(--disp);color:var(--straw);width:2.2rem}
table.res td.t{font-family:var(--mono);font-size:.78rem;text-align:right;white-space:nowrap}
table.res th.t{text-align:right}
table.res tr.me td{background:rgba(242,193,78,.16);font-weight:800}
.dot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:var(--c);margin-right:.45rem;vertical-align:-.05rem;border:2px solid rgba(8,12,24,.5)}
.auto{font-size:.8rem;opacity:.8;margin:.2rem 0 0}
@media (max-width:640px){
  #title{left:50%;top:auto;bottom:max(.8rem,env(safe-area-inset-bottom));transform:translateX(-50%);padding:1.1rem 1.1rem}
  .tagline{margin:.6rem 0 .8rem;font-size:.98rem}
  #mini{width:7rem;height:5rem}
  #hLap{min-width:0}
}
@media (max-height:520px){#title{top:.6rem;transform:none;bottom:auto}.tagline{display:none}}
@media (prefers-reduced-motion:reduce){#hMsg.pop,#hCount.pop{animation:none}#fade,#speedfx{transition:none}.b{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="application" aria-label="Flax Cart race view. Arrow keys or W A S D drive, Space drifts, R puts you back on the track, Escape pauses."></canvas>
<div id="speedfx" aria-hidden="true"></div>
<div id="tags" aria-hidden="true"></div>
<div id="hud" hidden>
  <div id="hPos" class="pill" aria-hidden="true"></div>
  <canvas id="mini" aria-hidden="true"></canvas>
  <div id="hLap" class="pill" aria-hidden="true"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>

  <div id="hMsg" aria-hidden="true"></div>
  <div id="hCount" aria-hidden="true"></div>
  <div id="hSpd" aria-hidden="true"></div>
</div>

  <div id="tSteer"><div class="rail"></div><div id="tKnob"></div></div>

  <button type="button" class="tb" id="tBrake" aria-label="Brake or reverse, hold">BRAKE</button>
  <button type="button" class="tb" id="tReset" aria-label="Back on the track">↺</button>
</div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<main>
<section id="title" class="card" aria-labelledby="logo">
  <h1 class="logo" id="logo"><span>FLAX</span><span>CART</span></h1>
  <p class="tagline"><b>Same kart for everyone.</b> One qualifying lap sets the grid, then 3 laps for the win.</p>
  <label class="lb" for="nm">Your name</label>
  <input type="text" id="nm" maxlength="16" autocomplete="nickname" spellcheck="false">
  <fieldset><legend class="lb">Kart colour</legend><div class="sw" id="sw"></div><p class="swname" id="swname" aria-hidden="true"></p></fieldset>
  <div class="btns"><button type="button" class="b" id="bSolo">Race solo</button></div>

</section>
<section id="card" class="card" hidden role="dialog" aria-modal="true" aria-labelledby="cardH"><div id="cardBody"></div></section>
</main>
<div id="fade" aria-hidden="true"></div>

function showGrid() {

function setupKarts() {

  G.me = newKart('me', name, ci, 'me'); G.karts.push(G.me);

function startSolo() {

}
function toMenu() { G.mode = 'solo'; setPhase('menu'); for (const k of G.karts) { k.hide = false; } placeGrid(); G.cd = 0; DYN.cheer.value = .15; }
// one AI lap at full skill, to set believable qualifying times for the bots
function simRefLap() {

}

/* ================= per-step update ================= */
const STEP = 1 / 60, CL = [];
function step(dt) {

  for (const k of G.karts) { k.px = k.x; k.py = k.y; k.pz = k.z; k.ph = k.h; }
  for (const k of G.karts) {
    if (k.ctrl === 'remote' || k.hide) continue;
    let inp;
    if (k.ctrl === 'me' && !k.done && (G.phase === 'race' || G.phase === 'quali' && k.qs !== 'done' || !live)) inp = readInput(k.inp);

function kartVisual(k, a, dt) {

  const sd = DYN.sunDir; sun.target.position.set(Math.round(fx), fy, Math.round(fz)); sun.position.copy(sun.target.position).addScaledVector(sd, 120);
}
function updLights() {
  const L = DYN.lights; if (!L) return; const ph = G.phase; let lit = 0, green = false;
  if (ph === 'grid' || ph === 'qcount') lit = clamp(3 - Math.ceil(G.cd) + 1, 0, 3); if ((ph === 'race' || ph === 'quali') && G.pt < 2) green = true;

  L.instanceColor.needsUpdate = true;
}
let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0, fpsChecked = 0;
const TS = { v: 1 };
function frame(now) {
  const real = Math.min((now - last) / 1000, .25); last = now;
  if (!G.paused) { acc += real * TS.v; let n = 0; while (acc >= STEP && n < 40) { step(STEP); acc -= STEP; n++; } if (n >= 40) acc = 0; }

  updCamera(real); updLights(); updHud(real); updTags(); engineSound(G.me, G.phase !== 'menu' && !G.paused && G.me && !G.me.hide);
  renderer.render(scene, cam);

}

/* ================= menu ================= */
function buildMenu() {
  const sw = $('sw'); sw.replaceChildren();
  G.myColor = clamp(store.get('color', 0) | 0, 0, COLORS.length - 1);
  COLORS.forEach(([n, c], i) => { const l = document.createElement('label'); l.style.setProperty('--c', c); l.title = n; const r = document.createElement('input'); r.type = 'radio'; r.name = 'kc'; r.value = i; r.setAttribute('aria-label', n); r.checked = i === G.myColor; r.addEventListener('change', () => { G.myColor = i; store.set('color', i); $('swname').textContent = n + ' kart'; menuKart(); }); l.appendChild(r); sw.appendChild(l); });
  $('swname').textContent = COLORS[G.myColor][0] + ' kart';
  const nm = $('nm'); nm.value = store.get('name', '') || ''; nm.placeholder = 'Racer ' + (100 + Math.floor(Math.random() * 900));
  nm.addEventListener('input', () => store.set('name', nm.value.trim().slice(0, 16)));

function menuKart() { if (G.me) { G.me.ci = G.myColor; G.me.col.set(COLORS[G.myColor][1]); if (G.me.label) G.me.label.style.setProperty('--c', COLORS[G.myColor][1]); } }
