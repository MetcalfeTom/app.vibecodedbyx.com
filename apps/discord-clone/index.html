<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatter - Connect and Chat</title>
    <link rel="canonical" href="https://app.sloppy.live/discord-clone/">
    <meta name="description" content="Connect with others in real-time chat rooms">
    <link rel="icon" href="https://emojicdn.elk.sh/💬">

    <meta property="og:title" content="Chatter - Chat App">
    <meta property="og:description" content="Connect with others in real-time chat rooms">
    <meta property="og:url" content="https://app.sloppy.live/discord-clone">
    <meta property="og:image" content="https://image.pollinations.ai/prompt/modern%20chat%20application%20interface%20purple%20dark%20theme?width=1200&height=630&referrer=sloppy.live">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #36393f;
            color: #dcddde;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Server List */
        .server-list {
            width: 72px;
            background: #202225;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            overflow-y: auto;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: #36393f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 20px;
        }

        .server-icon:hover {
            border-radius: 35%;
            background: #5865f2;
        }

        .server-icon.active {
            border-radius: 35%;
            background: #5865f2;
        }

        .server-divider {
            width: 32px;
            height: 2px;
            background: #36393f;
            margin: 4px 0;
        }

        /* Channel List */
        .channel-list {
            width: 240px;
            background: #2f3136;
            display: flex;
            flex-direction: column;
        }

        .server-name {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: 600;
            border-bottom: 1px solid #202225;
            cursor: pointer;
            font-size: 15px;
        }

        .server-name:hover {
            background: #34373c;
        }

        .channels {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-category {
            color: #8e9297;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 16px 8px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .channel {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            color: #96989d;
        }

        .channel:hover {
            background: #393c43;
            color: #dcddde;
        }

        .channel.active {
            background: #404249;
            color: #fff;
        }

        .channel-icon {
            font-size: 18px;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 500;
        }

        /* User Area */
        .user-area {
            padding: 12px;
            background: #292b2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-status {
            font-size: 11px;
            color: #b9bbbe;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #36393f;
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #202225;
        }

        .chat-header-icon {
            color: #8e9297;
            font-size: 20px;
        }

        .chat-header-name {
            font-weight: 600;
            font-size: 16px;
        }

        .chat-header-topic {
            color: #8e9297;
            font-size: 13px;
            margin-left: 8px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .message:hover {
            background: #32353b;
            margin: 0 -4px 16px;
            padding: 4px;
            border-radius: 4px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5865f2, #7289da);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .message-author {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
        }

        .message-time {
            font-size: 12px;
            color: #72767d;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
            color: #dcddde;
        }

        /* hide: two readers take a message down for everyone */
        .message { position: relative; }
        .msg-hide {
            position: absolute; top: 4px; right: 4px; opacity: 0;
            background: #202225; color: #b9bbbe; border: 1px solid #40444b; border-radius: 4px;
            font-size: 11px; padding: 3px 9px; cursor: pointer;
        }
        .message:hover .msg-hide, .msg-hide:focus-visible { opacity: 1; }
        .msg-hide:hover { color: #fff; background: #ed4245; border-color: #ed4245; }
        @media (hover: none) { .msg-hide { opacity: 0.55; } }
        .msg-note { font-size: 11px; color: #ed4245; margin-top: 2px; }
        .chat-error { color: #faa61a; font-size: 13px; margin: 0 0 16px; }
        .chat-error button { background: #5865f2; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; margin-left: 6px; cursor: pointer; }
        .send-err { color: #faa61a; font-size: 12px; padding: 6px 2px 0; min-height: 1em; }

        /* Message Input */
        .message-input-container {
            padding: 16px;
        }

        .message-input {
            background: #40444b;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: #dcddde;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        .message-input::placeholder {
            color: #72767d;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #202225;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #1a1c1e;
        }

        /* Welcome Message */
        .welcome-message {
            margin: 16px 0;
            padding: 16px;
            background: #2f3136;
            border-radius: 8px;
            border-left: 4px solid #5865f2;
        }

        .welcome-message h3 {
            margin-bottom: 8px;
            color: #fff;
        }

        @media (max-width: 768px) {
            .server-list {
                width: 60px;
            }
            .channel-list {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Server List -->
        <div class="server-list">
            <div class="server-icon active" title="VibeSpace">💬</div>
            <div class="server-divider"></div>
            <div class="server-icon" title="Gaming">🎮</div>
            <div class="server-icon" title="Music">🎵</div>
            <div class="server-icon" title="Art">🎨</div>
            <div class="server-icon" title="Tech">💻</div>
        </div>

        <!-- Channel List -->
        <div class="channel-list">
            <div class="server-name">
                VibeSpace
            </div>

            <div class="channels">
                <div class="channel-category">
                    📝 TEXT CHANNELS
                </div>
                <div class="channel active" data-channel="general">
                    <span class="channel-icon">#</span>
                    <span class="channel-name">general</span>
                </div>
                <div class="channel" data-channel="random">
                    <span class="channel-icon">#</span>
                    <span class="channel-name">random</span>
                </div>
                <div class="channel" data-channel="memes">
                    <span class="channel-icon">#</span>
                    <span class="channel-name">memes</span>
                </div>
                <div class="channel" data-channel="coding">
                    <span class="channel-icon">#</span>
                    <span class="channel-name">coding</span>
                </div>

                <div class="channel-category">
                    🔊 VOICE CHANNELS
                </div>
                <div class="channel">
                    <span class="channel-icon">🔊</span>
                    <span class="channel-name">General Voice</span>
                </div>
                <div class="channel">
                    <span class="channel-icon">🔊</span>
                    <span class="channel-name">Chill Zone</span>
                </div>
            </div>

            <div class="user-area">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="userName">Guest</div>
                    <div class="user-status">🟢 Online</div>
                </div>
            </div>
            <div style="padding:8px;border-top:1px solid #202225;font-size:11px;text-align:center">
</div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <span class="chat-header-icon">#</span>
                <span class="chat-header-name" id="channelName">general</span>
                <span class="chat-header-topic" id="channelTopic">Welcome to the general chat!</span>
            </div>

            <div class="messages" id="messages">
                <div class="welcome-message">
                    <h3>Welcome to #<span id="welcomeChannel">general</span>! 👋</h3>
                    <p>This is the start of the channel. Say hello!</p>
                </div>
            </div>

            <div class="message-input-container">
                <input
                    type="text"
                    class="message-input"
                    id="messageInput"
                    placeholder="Message #general"
                    maxlength="2000"
                />
            </div>
        </div>
    </div>

    <script type="module">
        import supabase, { supabaseSession } from '/supabase-config.js';

        /* the app's own tables. It used to point at the stream's chat table, whose columns don't match, so nothing ever saved */
        const MSGS = 'discord_clone_messages';
        const HIDES = 'discord_clone_hides';
        const HIDE_AT = 2;          // hides from people other than the author that take a message down for everyone
        const SEND_GAP_MS = 1500;   // one message per 1.5 seconds
        const MAX_LEN = 2000;

        const $ = id => document.getElementById(id);
        let currentUser = null;
        let myName = 'Guest';
        let currentChannel = 'general';
        let lastSentAt = 0;
        let loadTok = 0;
        let shown = [];             // the current channel's messages, oldest first
        let loadErr = null;
        const hides = new Map();    // message id -> Set of user ids
        const myHides = new Set();

        const channelTopics = {
            general: 'Welcome to the general chat!',
            random: 'Talk about anything here',
            memes: 'Share your dankest memes',
            coding: 'Programming discussions and help'
        };

        function guestName(id) {
            let h = 0;
            for (const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return 'Guest-' + (h % 9000 + 1000);
        }
        // a display name, never the email address
        function pickName(user) {
            const m = (user && user.user_metadata) || {};
            const n = m.preferred_username || m.nickname || m.user_name || m.name || m.full_name;
            return String(n || guestName(user && user.id)).slice(0, 32);
        }

        function isOwn(m) { return !!(currentUser && m.user_id === currentUser.id); }
        function hidesOn(m) {
            let n = 0;
            const set = hides.get(m.id);
            if (set) for (const u of set) if (u !== m.user_id) n++;
            return n;
        }
        function isHidden(m) { return !isOwn(m) && (myHides.has(m.id) || hidesOn(m) >= HIDE_AT); }
        function addHide(id, u) {
            if (!hides.has(id)) hides.set(id, new Set());
            hides.get(id).add(u);
            if (currentUser && u === currentUser.id) myHides.add(id);
        }

        async function initUser() {
            try {
                const { user } = await supabaseSession();
                if (user) {
                    currentUser = user;
                    myName = pickName(user);
                    $('userName').textContent = myName;
                    $('userAvatar').textContent = myName[0].toUpperCase();
                    for (const [id, set] of hides) if (set.has(user.id)) myHides.add(id);
                    render();
                }
            } catch (e) {
                console.error('Auth error:', e);
            }
        }

        // Load messages for channel
        async function loadMessages(channel) {
            const tok = ++loadTok;
            const res = await supabase
                .from(MSGS)
                .select('id, channel, author, content, user_id, created_at')
                .eq('channel', channel)
                .order('created_at', { ascending: false })
                .limit(80)
                .then(r => r, e => ({ error: e }));
            if (tok !== loadTok) return;
            if (res.error) {
                console.error('Error loading messages:', res.error);
                loadErr = res.error.message || String(res.error);
                shown = [];
                render();
                return;
            }
            loadErr = null;
            shown = (res.data || []).reverse();
            // the hides: if they can't load, every message just stays up
            const hr = await supabase.from(HIDES).select('message_id, user_id').limit(5000).then(r => r, e => ({ error: e }));
            if (tok !== loadTok) return;
            if (hr.error) console.warn('hides unavailable', hr.error);
            else { hides.clear(); myHides.clear(); for (const h of hr.data || []) addHide(h.message_id, h.user_id); }
            render();
        }

        function messageHtml(message) {
            const author = message.author || 'Anonymous';
            const avatar = author[0].toUpperCase();
            const time = new Date(message.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const own = isOwn(message);
            const hideBtn = own ? '' : `<button class="msg-hide" type="button" data-id="${message.id}" aria-label="Hide this message">hide</button>`;
            const note = own && hidesOn(message) >= HIDE_AT ? '<div class="msg-note">hidden from everyone else by readers</div>' : '';
            return `<div class="message">
                    <div class="message-avatar">${escapeHtml(avatar)}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-author">${escapeHtml(author)}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">${escapeHtml(message.content)}</div>
                        ${note}
                    </div>
                    ${hideBtn}
                </div>`;
        }

        function render() {
            const messagesDiv = $('messages');
            const stick = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 80;
            const err = loadErr
                ? `<div class="chat-error" role="status">Can't reach the chat right now (${escapeHtml(loadErr.slice(0, 120))}). <button type="button" data-act="retry">Try again</button></div>`
                : '';
            messagesDiv.innerHTML = `
                <div class="welcome-message">
                    <h3>Welcome to #<span id="welcomeChannel">${escapeHtml(currentChannel)}</span>! 👋</h3>
                    <p>This is the start of the channel. Say hello! Tap hide on a message you don't want to see: two hides take it down for everyone.</p>
                </div>
                ${err}
                ${shown.filter(m => !isHidden(m)).map(messageHtml).join('')}`;
            if (stick) messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendNote(t) { $('sendErr').textContent = t || ''; }

        // Send message
        async function sendMessage(raw) {
            const content = String(raw || '').trim().slice(0, MAX_LEN);
            if (!content) return;
            const now = Date.now();
            if (now - lastSentAt < SEND_GAP_MS) { sendNote('one message at a time, give it a second'); return; }
            if (!currentUser) await initUser();
            if (!currentUser) { sendNote('no session: reload the page to chat'); return; }
            lastSentAt = now;
            sendNote('');
            const { data, error } = await supabase
                .from(MSGS)
                .insert([{ channel: currentChannel, author: myName, content, user_id: currentUser.id }])
                .select()
                .single()
                .then(r => r, e => ({ error: e }));
            if (error) {
                console.error('Error sending message:', error);
                sendNote("couldn't send: " + (error.message || 'try again'));
                return;
            }
            $('messageInput').value = '';
            if (data && data.channel === currentChannel && !shown.some(m => m.id === data.id)) { shown.push(data); render(); }
        }

        async function hideMessage(id) {
            if (!currentUser) await initUser();
            if (!currentUser) { sendNote('no session: reload the page to hide messages'); return; }
            addHide(id, currentUser.id);
            render();
            const { error } = await supabase.from(HIDES).insert({ user_id: currentUser.id, message_id: id }).then(r => r, e => ({ error: e }));
            if (error) { console.warn('hide failed', error); sendNote('hidden for you until you reload (the hide did not save)'); }
        }

        // live: new messages, and hides on their own channel so a missing table can't stop the chat
        function subscribeToMessages() {
            supabase
                .channel('discord-clone-live')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: MSGS }, payload => {
                    const m = payload.new;
                    if (!m || m.channel !== currentChannel || shown.some(x => x.id === m.id)) return;
                    shown.push(m);
                    if (shown.length > 200) shown.shift();
                    render();
                })
                .subscribe();
            supabase
                .channel('discord-clone-hides')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: HIDES }, payload => {
                    const h = payload.new;
                    if (!h || h.message_id == null) return;
                    addHide(h.message_id, h.user_id);
                    render();
                })
                .subscribe();
        }

        // Switch channel
        function switchChannel(channel) {
            currentChannel = channel;
            $('channelName').textContent = channel;
            $('channelTopic').textContent = channelTopics[channel];
            $('messageInput').placeholder = `Message #${channel}`;
            document.querySelectorAll('.channel[data-channel]').forEach(ch => ch.classList.remove('active'));
            document.querySelector(`[data-channel="${channel}"]`).classList.add('active');
            shown = [];
            render();
            loadMessages(channel);
        }

        // Escape HTML
        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Event listeners
        const sendErr = document.createElement('div');
        sendErr.id = 'sendErr';
        sendErr.className = 'send-err';
        sendErr.setAttribute('role', 'status');
        $('messageInput').after(sendErr);

        $('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) sendMessage(e.target.value);
        });

        $('messages').addEventListener('click', (e) => {
            const hb = e.target.closest('.msg-hide');
            if (hb) { hideMessage(Number(hb.dataset.id)); return; }
            if (e.target.closest('[data-act="retry"]')) loadMessages(currentChannel);
        });

        document.querySelectorAll('.channel[data-channel]').forEach(channel => {
            channel.addEventListener('click', () => {
                switchChannel(channel.dataset.channel);
            });
        });

        // Initialize
        initUser();
        loadMessages('general');
        subscribeToMessages();
    </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
