<style>
:root{
  --paper:#f2efe9; --card:#faf8f4; --ink:#22201c; --dim:#8a857c; --line:#dcd7cd;
  --org:#e8641b; --org-dark:#b84a10; --ok:#4a7c3a; --danger:#b03b2e;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:var(--paper);
  background-image:radial-gradient(80% 40% at 50% 0%, rgba(232,100,27,.05), transparent 60%);
  color:var(--ink); font-family:'Spline Sans Mono', monospace; min-height:100vh;
}
main{ max-width:52rem; margin:0 auto; padding:1rem 1rem 3rem; }
header{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; padding:.5rem 0 1rem; }
h1{
  font-family:'Bricolage Grotesque', sans-serif; font-weight:800;
  font-size:clamp(2rem,6vw,3.2rem); letter-spacing:-.02em; line-height:.95;
}
h1 span{ color:var(--org); }
.tag{ font-size:.75rem; color:var(--dim); }
.toolrow{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; font-size:.75rem; }
.toolrow label{ color:var(--dim); display:flex; align-items:center; gap:.35rem; }
.toolrow select, .toolrow input{
  font-family:'Spline Sans Mono', monospace; font-size:.8rem; background:var(--card);
  border:1.5px solid var(--line); border-radius:.45rem; padding:.35rem .5rem; min-height:2.4rem; color:var(--ink);
}
.toolrow input{ width:4.5rem; }
section{ background:var(--card); border:1.5px solid var(--line); border-radius:.9rem; padding:1rem 1.1rem; margin-bottom:1rem; }
section h2{
  font-family:'Bricolage Grotesque', sans-serif; font-weight:800; font-size:1.05rem;
  margin-bottom:.7rem; display:flex; align-items:center; gap:.5rem;
}
section h2 small{ font-family:'Spline Sans Mono'; font-weight:400; font-size:.65rem; color:var(--dim); margin-left:auto; }
table{ width:100%; border-collapse:collapse; font-size:.85rem; }
th{ text-align:left; font-size:.62rem; letter-spacing:.1em; color:var(--dim); padding:.3rem .4rem; border-bottom:1.5px solid var(--line); }
td{ padding:.42rem .4rem; border-bottom:1px solid var(--line); vertical-align:middle; }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
input.cell, select.cell{
  font-family:'Spline Sans Mono', monospace; font-size:.85rem; color:var(--ink);
  background:transparent; border:1.5px solid transparent; border-radius:.4rem;
  padding:.25rem .35rem; width:100%; min-height:2.2rem;
}
input.cell:hover, select.cell:hover{ border-color:var(--line); }
input.cell:focus, select.cell:focus{ border-color:var(--org); outline:none; background:#fff; }
input.cell.num{ text-align:right; width:4.6rem; }
.wt{
  font-weight:600; color:var(--org-dark); cursor:pointer; text-decoration:underline dotted 1px;
  background:none; border:0; font-family:'Spline Sans Mono'; font-size:.9rem; padding:.2rem;
}
.plates{
  font-size:.68rem; color:var(--dim); display:none; padding:.2rem .4rem .4rem;
}
tr.showplates .plates{ display:block; }
button{
  font-family:'Bricolage Grotesque', sans-serif; font-weight:800; cursor:pointer; font-size:.8rem;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:.55rem;
  padding:.45rem .8rem; min-height:2.75rem;
}
button:hover{ border-color:var(--org); }
button.primary{ background:var(--org); border-color:var(--org); color:#fff; }
button.primary:hover{ background:var(--org-dark); }
button.ghost{ min-height:2.2rem; font-size:.7rem; padding:.2rem .5rem; color:var(--dim); }
button.ghost:hover{ color:var(--danger); border-color:var(--danger); }
.rowactions{ display:flex; gap:.5rem; margin-top:.7rem; flex-wrap:wrap; align-items:center; }
.volume{ margin-left:auto; font-size:.8rem; color:var(--dim); }
.volume b{ color:var(--ink); font-size:1rem; }
.done{ accent-color:var(--org); width:1.2rem; height:1.2rem; }
tr.isdone td{ opacity:.45; }
tr.isdone .wt{ text-decoration:line-through; }
.est{ font-size:.7rem; color:var(--dim); margin-top:.5rem; }
.est input{ width:4rem; font-family:inherit; font-size:.75rem; border:1.5px solid var(--line); border-radius:.4rem; padding:.2rem .35rem; min-height:2.2rem; text-align:right; }
.est b{ color:var(--org-dark); }
.hist{ font-size:.78rem; }
.hist .hrow{ display:flex; gap:.7rem; padding:.4rem 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.hist .hdate{ color:var(--dim); min-width:6.5rem; }
.hist .hvol{ margin-left:auto; color:var(--org-dark); font-weight:600; }
.empty{ color:var(--dim); font-size:.78rem; font-style:italic; }
.excard{ border:1.5px solid var(--line); border-radius:.7rem; padding:.6rem .7rem; margin-bottom:.8rem; background:#fff; }
.exhead{ display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; flex-wrap:wrap; }
.exhead select{ font-family:'Bricolage Grotesque'; font-weight:800; font-size:.95rem; border:1.5px solid transparent; border-radius:.4rem; background:transparent; min-height:2.4rem; }
.exhead select:hover{ border-color:var(--line); }
.exhead .exadd{ margin-left:auto; display:flex; gap:.3rem; }
.settype{ font-size:.62rem; letter-spacing:.06em; }
.settype.drop{ color:var(--danger); }
.settype.cluster{ color:var(--ok); }
.stamp{ position:fixed; right:.7rem; bottom:.6rem; font-size:.6rem; color:var(--dim); background:var(--card); border:1px solid var(--line); border-radius:.4rem; padding:.1rem .4rem; }
:focus-visible{ outline:3px solid var(--org); outline-offset:2px; }
@media (max-width:36rem){ th:nth-child(5), td:nth-child(5){ display:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>IRON<span>MATH</span></h1>
    <p class="tag">your maxes · your percentages · the exact plates to load</p>
  </header>

  <div class="toolrow">
    <label>units
      <select id="unitSel" aria-label="Units"><option value="kg">kg</option><option value="lb">lb</option></select>
    </label>
    <label>round to <input id="roundIn" type="number" step="0.25" min="0.25" aria-label="Rounding increment"></label>
    <label>bar <input id="barIn" type="number" step="0.5" min="0" aria-label="Bar weight"></label>
  </div>

  <section aria-labelledby="h-max">
    <h2 id="h-max">① TRAINING MAXES <small>overload scheme bumps the max after each completed session</small></h2>
    <table aria-label="Training maxes">
      <thead><tr><th>MOVEMENT</th><th class="num">1RM / TM</th><th>OVERLOAD</th><th></th></tr></thead>
      <tbody id="maxBody"></tbody>
    </table>
    <div class="rowactions">
      <select id="libSel" aria-label="Exercise library"></select>
      <button type="button" id="addMax">+ add</button>
      <span class="est">estimate: <input id="estW" type="number" placeholder="wt" aria-label="Weight lifted"> × <input id="estR" type="number" placeholder="reps" aria-label="Reps performed"> reps ≈ <b id="estOut">—</b> 1RM (Epley)</span>
    </div>
  </section>

  <section aria-labelledby="h-sess">
    <h2 id="h-sess">② TODAY'S SESSION <small id="todayLbl"></small></h2>
    <div id="exList"></div>
    <div class="rowactions">
      <button type="button" id="addEx">+ exercise</button>
      <button type="button" class="primary" id="finishBtn">✔ finish &amp; log session</button>
      <span class="volume">session volume <b id="volOut">0</b> <span id="volUnit">kg</span></span>
    </div>
    <label style="display:block;margin-top:.7rem;font-size:.7rem;color:var(--dim)">SESSION NOTES
      <textarea id="notesIn" rows="2" style="width:100%;font-family:'Spline Sans Mono';font-size:.8rem;border:1.5px solid var(--line);border-radius:.5rem;padding:.5rem;margin-top:.25rem;background:#fff;color:var(--ink)" placeholder="sleep, cues, how it moved…"></textarea>
    </label>
  </section>

  <section aria-labelledby="h-hist">
    <h2 id="h-hist">③ HISTORY <small id="histCount"></small></h2>
    <div class="hist" id="histList"></div>
  </section>
</main>
<span class="stamp" id="stamp"></span>
<script>
'use strict';
const VER = 'v1.0 · 8368aa4';
document.getElementById('stamp').textContent = VER;
const $ = id => document.getElementById(id);

/* ═══════════ pure iron math ═══════════ */
function epley1RM(w, reps){
  if(!(w > 0) || !(reps > 0)) return null;
  if(reps === 1) return w;
  return w * (1 + reps / 30);
}
function prescribe(max, pct, rnd){
  if(!(max > 0) || !(pct > 0) || !(rnd > 0)) return null;
  const raw = max * pct / 100;
  return Math.round((Math.round(raw / rnd) * rnd) * 100) / 100;
}
const PLATES = { kg:[25,20,15,10,5,2.5,1.25], lb:[45,35,25,10,5,2.5] };
function plateMath(total, bar, unit){
  if(!(total > 0)) return { ok:false, why:'no load' };
  if(total < bar) return { ok:false, why:'below bar weight ('+bar+')' };
  let side = (total - bar) / 2;
  const out = [];
  for(const p of PLATES[unit]){
    let n = 0;
    while(side >= p - 1e-9){ side -= p; n++; }
    if(n) out.push(n > 1 ? n + '×' + p : '' + p);
  }
  const leftover = Math.round(side * 100) / 100;
  return { ok:true, perSide:out.length ? out.join(' + ') : 'empty bar', leftover };
}
function convert(v, from, to){
  if(from === to) return v;
  const kg = from === 'kg' ? v : v / 2.20462;
  const out = to === 'kg' ? kg : kg * 2.20462;
  return Math.round(out * 2) / 2;   /* nearest 0.5 */
}
function rowVolume(row, maxes, rnd){
  const m = maxes.find(x => x.id === row.moveId);
  const w = m ? prescribe(m.max, row.pct, rnd) : null;
  return w ? Math.round(w * row.sets * row.reps) : 0;
}

/* ═══════════ rep targets: "8" or cluster "3+3+3" (pure) ═══════════ */
function parseReps(str){
  return String(str||'').split('+').reduce((a,t)=>{
    const n=parseInt(t.trim(),10);
    return a + (Number.isFinite(n)&&n>0 ? n : 0);
  }, 0);
}
/* overload: after a finished session, bump maxes whose scheme > 0 and that
   had at least one completed set (pure — returns new maxes + change list) */
function applyOverload(maxes, exercises){
  const touched = new Set();
  exercises.forEach(ex => { if(ex.sets.some(s=>s.done)) touched.add(ex.moveId); });
  const changes = [];
  const out = maxes.map(m => {
    if(!touched.has(m.id) || !(m.scheme > 0)) return m;
    const to = Math.round((m.max + m.scheme)*100)/100;
    changes.push({ name:m.name, from:m.max, to });
    return { ...m, max:to };
  });
  return { maxes:out, changes };
}

/* ═══════════ state ═══════════ */
const EXLIB = ['Back Squat','Front Squat','Bench Press','Incline Bench','Close-Grip Bench','Deadlift','Romanian DL','Overhead Press','Push Press','Barbell Row','Pendlay Row','Hip Thrust','Weighted Pull-up','Weighted Dip','Power Clean','Snatch'];
const DEFAULTS = { unit:'kg', round:2.5, bar:20, notes:'',
  maxes:[ {id:1,name:'Back Squat',max:140,scheme:2.5}, {id:2,name:'Bench Press',max:100,scheme:2.5}, {id:3,name:'Deadlift',max:180,scheme:5}, {id:4,name:'Overhead Press',max:60,scheme:1.25} ],
  ex:[ {moveId:1, sets:[ {type:'work',reps:'5',pct:75,done:false},{type:'work',reps:'5',pct:80,done:false},{type:'work',reps:'5',pct:85,done:false} ]} ],
  hist:[] };
let S = null;
function load(){
  try{ S = JSON.parse(localStorage.getItem('iron-math-v2')); }catch(e){}
  if(!S || !Array.isArray(S.maxes) || !Array.isArray(S.ex)) S = JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ try{ localStorage.setItem('iron-math-v2', JSON.stringify(S)); }catch(e){} }
function nextId(){ return S.maxes.reduce((a,m)=>Math.max(a,m.id),0)+1; }
function moveOf(id){ return S.maxes.find(x=>x.id===id); }

/* ═══════════ render ═══════════ */
function fmt(v){ return v === null ? '—' : (Math.round(v*100)/100).toString(); }
function schemeOptions(sel){
  const opts = [[0,'none'],[1.25,'+1.25 / session'],[2.5,'+2.5 / session'],[5,'+5 / session']];
  return opts.map(o=>'<option value="'+o[0]+'"'+(+sel===o[0]?' selected':'')+'>'+o[1]+' '+ (o[0]?S.unit:'') +'</option>').join('');
}
function renderMaxes(){
  const tb = $('maxBody'); tb.innerHTML = '';
  S.maxes.forEach(m => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><input class="cell" value="'+m.name.replace(/"/g,'&quot;')+'" aria-label="Movement name"></td>'+
      '<td class="num"><input class="cell num" type="number" step="0.5" value="'+m.max+'" aria-label="Training max"></td>'+
      '<td><select class="cell" aria-label="Overload scheme">'+schemeOptions(m.scheme)+'</select></td>'+
      '<td><button type="button" class="ghost" aria-label="Remove">×</button></td>';
    const [nameIn, maxIn] = tr.querySelectorAll('input');
    nameIn.addEventListener('change', () => { m.name = nameIn.value.trim() || m.name; save(); renderAll(); });
    maxIn.addEventListener('change', () => { m.max = +maxIn.value || m.max; save(); renderSession(); });
    tr.querySelector('select').addEventListener('change', e => { m.scheme = +e.target.value; save(); });
    tr.querySelector('button').addEventListener('click', () => {
      if(S.ex.some(x => x.moveId === m.id) && !confirm(m.name+' is in today\'s session — remove anyway?')) return;
      S.maxes = S.maxes.filter(x => x !== m);
      S.ex = S.ex.filter(x => x.moveId !== m.id);
      save(); renderAll();
    });
    tb.appendChild(tr);
  });
  const lib = $('libSel');
  lib.innerHTML = EXLIB.filter(n => !S.maxes.some(m=>m.name===n)).map(n=>'<option>'+n+'</option>').join('') + '<option value="__c">custom…</option>';
}
function setWeight(ex, set){
  const m = moveOf(ex.moveId);
  return m ? prescribe(m.max, set.pct, S.round) : null;
}
function exVolume(ex){
  return ex.sets.reduce((a,s)=>{
    const w = setWeight(ex, s);
    return a + (w ? Math.round(w * parseReps(s.reps)) : 0);
  }, 0);
}
function renderSession(){
  const wrap = $('exList'); wrap.innerHTML = '';
  S.ex.forEach(ex => {
    const card = document.createElement('div'); card.className = 'excard';
    const opts = S.maxes.map(x=>'<option value="'+x.id+'"'+(x.id===ex.moveId?' selected':'')+'>'+x.name+'</option>').join('');
    card.innerHTML = '<div class="exhead"><select aria-label="Exercise">'+opts+'</select>'+
      '<span class="settype" style="color:var(--dim)">'+exVolume(ex).toLocaleString()+' '+S.unit+' vol</span>'+
      '<span class="exadd">'+
      '<button type="button" class="ghost" data-a="set">+set</button>'+
      '<button type="button" class="ghost" data-a="drop">+drop</button>'+
      '<button type="button" class="ghost" data-a="cluster">+cluster</button>'+
      '<button type="button" class="ghost" data-a="kill" aria-label="Remove exercise">×</button></span></div>'+
      '<table><thead><tr><th>✓</th><th>SET</th><th>TYPE</th><th class="num">REP TARGET</th><th class="num">%1RM</th><th class="num">LOAD</th><th></th></tr></thead><tbody></tbody></table>';
    const tb = card.querySelector('tbody');
    ex.sets.forEach((st, si) => {
      const w = setWeight(ex, st);
      const tr = document.createElement('tr');
      if(st.done) tr.className = 'isdone';
      tr.innerHTML = '<td><input type="checkbox" class="done" '+(st.done?'checked':'')+' aria-label="Set done"></td>'+
        '<td>'+(si+1)+'</td>'+
        '<td><span class="settype '+st.type+'">'+(st.type==='work'?'WORK':st.type.toUpperCase())+'</span></td>'+
        '<td class="num"><input class="cell num" style="width:4.2rem" value="'+String(st.reps).replace(/"/g,'&quot;')+'" aria-label="Rep target (use 3+3+3 for clusters)"></td>'+
        '<td class="num"><input class="cell num" type="number" min="1" max="120" value="'+st.pct+'" aria-label="Percent of max"></td>'+
        '<td class="num"><button type="button" class="wt" aria-label="Load — tap for plate math">'+fmt(w)+'</button><div class="plates"></div></td>'+
        '<td><button type="button" class="ghost" aria-label="Remove set">×</button></td>';
      tr.querySelector('.done').addEventListener('change', e => { st.done = e.target.checked; save(); renderSession(); });
      const [repsIn, pctIn] = tr.querySelectorAll('input.cell');
      repsIn.addEventListener('change', () => { st.reps = repsIn.value.trim() || st.reps; save(); renderSession(); });
      pctIn.addEventListener('change', () => { st.pct = Math.max(1, Math.min(120, +pctIn.value || st.pct)); save(); renderSession(); });
      tr.querySelector('.wt').addEventListener('click', () => {
        const p = plateMath(w, S.bar, S.unit);
        tr.classList.toggle('showplates');
        tr.querySelector('.plates').textContent = p.ok
          ? 'per side: '+p.perSide+(p.leftover ? ' (+'+p.leftover+' unloadable)' : '')
          : p.why;
      });
      tr.querySelector('td:last-child .ghost').addEventListener('click', () => {
        ex.sets = ex.sets.filter(x => x !== st); save(); renderSession();
      });
      tb.appendChild(tr);
    });
    card.querySelector('select').addEventListener('change', e => { ex.moveId = +e.target.value; save(); renderSession(); });
    card.querySelectorAll('.exadd .ghost').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      const last = ex.sets[ex.sets.length-1] || { reps:'8', pct:75 };
      if(a==='set') ex.sets.push({ type:'work', reps:last.reps, pct:last.pct, done:false });
      else if(a==='drop') ex.sets.push({ type:'drop', reps:last.reps, pct:Math.max(30, (+last.pct||75)-10), done:false });
      else if(a==='cluster') ex.sets.push({ type:'cluster', reps:'3+3+3', pct:Math.min(120,(+last.pct||75)+5), done:false });
      else if(a==='kill'){ S.ex = S.ex.filter(x => x !== ex); }
      save(); renderSession();
    }));
    wrap.appendChild(card);
  });
  const vol = S.ex.reduce((a,ex)=>a+exVolume(ex), 0);
  $('volOut').textContent = vol.toLocaleString();
  $('volUnit').textContent = S.unit;
}
function renderHist(){
  const el = $('histList'); el.innerHTML = '';
  $('histCount').textContent = S.hist.length ? S.hist.length + ' logged' : '';
  if(!S.hist.length){ el.innerHTML = '<p class="empty">no sessions yet — finish one above and it lands here.</p>'; return; }
  S.hist.slice().reverse().forEach(h => {
    const d = document.createElement('div'); d.className = 'hrow';
    d.innerHTML = '<span class="hdate">'+h.date+'</span><span>'+String(h.summary).replace(/</g,'&lt;')+
      (h.notes?'<br><i style="color:var(--dim)">“'+String(h.notes).replace(/</g,'&lt;')+'”</i>':'')+
      (h.overload?'<br><span style="color:var(--ok)">📈 '+String(h.overload).replace(/</g,'&lt;')+'</span>':'')+
      '</span><span class="hvol">'+h.vol.toLocaleString()+' '+h.unit+'</span>';
    el.appendChild(d);
  });
}
function renderTools(){
  $('unitSel').value = S.unit; $('roundIn').value = S.round; $('barIn').value = S.bar;
  $('notesIn').value = S.notes || '';
  $('todayLbl').textContent = new Date().toISOString().slice(0,10);
}
function renderAll(){ renderTools(); renderMaxes(); renderSession(); renderHist(); }

/* ═══════════ events ═══════════ */
$('addMax').addEventListener('click', () => {
  let name = $('libSel').value;
  if(name === '__c'){ name = (prompt('movement name?')||'').trim(); if(!name) return; }
  S.maxes.push({ id:nextId(), name, max:60, scheme:0 }); save(); renderAll();
});
$('addEx').addEventListener('click', () => {
  if(!S.maxes.length) return;
  const used = new Set(S.ex.map(x=>x.moveId));
  const m = S.maxes.find(x=>!used.has(x.id)) || S.maxes[0];
  S.ex.push({ moveId:m.id, sets:[ {type:'work',reps:'8',pct:70,done:false} ] });
  save(); renderSession();
});
$('finishBtn').addEventListener('click', () => {
  if(!S.ex.length) return;
  const vol = S.ex.reduce((a,ex)=>a+exVolume(ex), 0);
  const summary = S.ex.map(ex => {
    const m = moveOf(ex.moveId);
    return (m?m.name:'?') + ' ×' + ex.sets.length + ' sets';
  }).join(' · ');
  const o = applyOverload(S.maxes, S.ex);
  S.maxes = o.maxes;
  const overload = o.changes.map(c => c.name+' '+c.from+'→'+c.to).join(' · ');
  S.hist.push({ date:new Date().toISOString().slice(0,10), summary, vol, unit:S.unit, notes:S.notes.trim(), overload });
  S.ex.forEach(ex => ex.sets.forEach(st => st.done = false));
  S.notes = '';
  save(); renderAll();
});
$('notesIn').addEventListener('input', e => { S.notes = e.target.value; save(); });
$('unitSel').addEventListener('change', e => {
  const to = e.target.value, from = S.unit;
  if(to === from) return;
  S.maxes.forEach(m => { m.max = convert(m.max, from, to); if(m.scheme) m.scheme = to==='kg' ? m.scheme/2 : m.scheme*2; });
  S.bar = convert(S.bar, from, to);
  S.round = to === 'kg' ? 2.5 : 5;
  S.unit = to;
  save(); renderAll();
});
$('roundIn').addEventListener('change', e => { S.round = +e.target.value > 0 ? +e.target.value : S.round; save(); renderAll(); });
$('barIn').addEventListener('change', e => { S.bar = +e.target.value >= 0 ? +e.target.value : S.bar; save(); renderSession(); });
function estUpd(){
  const w = +$('estW').value, r = +$('estR').value;
  const e = epley1RM(w, r);
  $('estOut').textContent = e ? (Math.round(e*10)/10) + ' ' + S.unit : '—';
}
$('estW').addEventListener('input', estUpd);
$('estR').addEventListener('input', estUpd);

load(); renderAll();
</script>
</body>
