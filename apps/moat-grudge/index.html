<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Grab the coins that fall, send tanks, archers, swordsmen and mages, and knock down the computer's smug moat castle before it flattens yours.">

<meta property="og:type" content="website">
<meta property="og:title" content="Moat Grudge">
<meta property="og:description" content="Grab falling coins, send your army, and flatten the computer's smug moat castle.">

<meta property="og:image" content="https://app.sloppy.live/moat-grudge/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#16182a;--panel:#232640;--panel2:#2e3253;--text:#f6ead2;--muted:#c9bfa8;--gold:#ffcf4a;--you:#4d8ef0;--cpu:#e0503f;--focus:#ffe27a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:100%}
body{margin:0;min-height:100dvh;background:var(--ink);color:var(--text);font-family:'Chivo Mono',ui-monospace,monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#000;padding:.5rem 1rem;z-index:20}
.skip:focus{left:.5rem}
main{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6rem;padding:.35rem .7rem;background:linear-gradient(#1d2036,#16182a)}
header h1{font-family:'Pirata One',serif;font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.02em;color:var(--gold);white-space:nowrap}
.hpw{flex:1;display:flex;align-items:center;gap:.4rem;min-width:0}
.hp{flex:1;height:.7rem;border-radius:1rem;background:#0c0d18;border:1px solid #4a4e74;overflow:hidden;min-width:2rem}
.hp i{display:block;height:100%;width:100%;transition:width .25s}
#hpY i{background:linear-gradient(90deg,#2f6bd0,#7fb0ff)}
#hpC i{background:linear-gradient(90deg,#ff8a7a,#c23a2c);margin-left:auto}
.lbl{font-size:.75rem;font-weight:800}
.lbl.y{color:#9cc2ff}.lbl.c{color:#ffb0a6}
#coins{font-weight:800;font-size:1.15rem;color:var(--gold);min-width:4.2rem;text-align:right;white-space:nowrap}
.ib{min-width:2.75rem;min-height:2.75rem;border-radius:.6rem;border:1px solid #4a4e74;background:var(--panel);color:var(--text);font:inherit;font-size:1.1rem;cursor:pointer}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;padding:.45rem .55rem calc(.5rem + env(safe-area-inset-bottom));background:#1b1d32;border-top:2px solid #2f3352}
.card{position:relative;overflow:hidden;min-height:4.6rem;border-radius:.8rem;border:2px solid #3f4570;background:var(--panel);color:var(--text);font:inherit;cursor:pointer;padding:.3rem .2rem .45rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;touch-action:manipulation}
.card canvas{width:2.6rem;height:2.6rem;image-rendering:auto;pointer-events:none}
.card .nm{font-weight:800;font-size:.8rem;line-height:1.1}
.card .co{font-weight:800;font-size:.85rem;color:var(--gold)}
.card .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--a,0)*100%);background:linear-gradient(#2e3a66,#34407a);z-index:-1;pointer-events:none}
.card{z-index:0}
.card .tr{position:absolute;left:0;bottom:0;height:.35rem;width:calc(var(--p,0)*100%);background:var(--gold);pointer-events:none}
.card[aria-disabled="true"]{border-style:dashed;border-color:#555a80}
.card[aria-disabled="true"] .co{color:#ffb3a3}
.card.ready{border-color:var(--you);box-shadow:0 0 0 1px #4d8ef0 inset,0 0 14px -4px #4d8ef0}
.card.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card kbd{position:absolute;top:.2rem;left:.35rem;font:inherit;font-size:.65rem;color:#b9b2c9}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(ellipse at 50% 40%,rgba(22,24,42,.55),rgba(22,24,42,.88));z-index:5}
.box{max-width:30rem;width:100%;text-align:center;background:rgba(35,38,64,.93);border:2px solid #4a4e74;border-radius:1.1rem;padding:1.2rem 1.1rem 1.1rem;box-shadow:0 20px 60px -20px #000}
.box h2{font-family:'Pirata One',serif;font-weight:400;font-size:clamp(2.6rem,10vw,4.2rem);line-height:.95;margin:.1rem 0 .5rem;color:var(--gold);text-shadow:0 3px 0 #7a4b10}
.box p{margin:.4rem 0;color:var(--text);line-height:1.45;font-size:.92rem}
.box .sm{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.9rem}
.go{min-height:2.9rem;min-width:6.5rem;border-radius:.8rem;border:2px solid #6a6fa0;background:var(--panel2);color:var(--text);font:inherit;font-weight:800;font-size:1rem;cursor:pointer;padding:.4rem .9rem}
.go.main{background:var(--gold);color:#2a1a00;border-color:#ffe9a6}
.go small{display:block;font-weight:400;font-size:.7rem;opacity:.9}
#st{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){header h1{font-size:1.2rem}.lbl{display:none}.card .nm{font-size:.72rem}}
@media (max-height:500px) and (orientation:landscape){.card{min-height:3.2rem;flex-direction:row;gap:.4rem}.card canvas{width:2rem;height:2rem}header{padding:.15rem .6rem}}
@media (prefers-reduced-motion:reduce){.card.nope{animation:none}.hp i{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#cards">Skip to unit cards</a>
<main>
<header>
 <h1>Moat Grudge</h1>
 <div class="hpw" aria-hidden="true"><span class="lbl y">YOU</span><div class="hp" id="hpY"><i></i></div><div class="hp" id="hpC"><i></i></div><span class="lbl c">CPU</span></div>
 <div id="coins" aria-label="coins">🪙 0</div>
 <button type="button" class="ib" id="mute" aria-pressed="false" aria-label="Mute sound">🔊</button>
</header>
<div id="stage">
 <canvas id="cv" aria-label="Battlefield. Your castle is on the left, the computer's moat castle on the right. Tap falling coins to collect them, drag to look around."></canvas>
 <div id="ov" role="dialog" aria-modal="true" aria-labelledby="ovT">
  <div class="box" id="box"></div>
 </div>
</div>
<nav id="cards" aria-label="Units to send"></nav>
<p id="st" aria-live="polite"></p>
</main>
<script>
'use strict';
(function(){
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=2200,GY=300,WH=360,$=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');let g=cv.getContext('2d');
const TEAM=[{col:'#4d8ef0',dark:'#1f3f80',light:'#a9caff',skin:'#f0c39a'},{col:'#d8473c',dark:'#6e1b1b',light:'#ffb0a6',skin:'#c9a07f'}];
const T={
 tank:{name:'Tank',cost:75,hp:460,dmg:11,rate:1.2,range:22,spd:20,train:7,ult:10,ultName:'Door Slam',ur:58,top:50},
 archer:{name:'Archer',cost:40,hp:72,dmg:11,rate:1.15,range:150,spd:30,train:3.5,ult:8,ultName:'Arrow Rain',ur:190,top:40},
 sword:{name:'Swordsman',cost:30,hp:130,dmg:14,rate:.8,range:20,spd:38,train:2.5,ult:6,ultName:'Whirlwind',ur:44,top:42},
 mage:{name:'Mage',cost:60,hp:85,dmg:15,rate:1.7,range:125,spd:24,train:5.5,ult:9,ultName:'Meteor',ur:240,top:48}
};
const ORDER=['tank','archer','sword','mage'];
const DIFF={easy:{inc:.72,drop:.4,smart:.25,name:'Easy'},normal:{inc:.95,drop:.6,smart:.7,name:'Normal'},hard:{inc:1.18,drop:.8,smart:1,name:'Hard'}};
let G=null,S=1,DPR=1,cssW=0,cssH=0,viewW=0,viewH=0,offY=0;
const cam={x:0,follow:0};
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
let SAVE={};try{SAVE=JSON.parse(localStorage.getItem('moat-grudge')||'{}')||{};}catch(e){}
function save(){try{localStorage.setItem('moat-grudge',JSON.stringify(SAVE));}catch(e){}}

/* ---------- sound ---------- */
let AC=null,muted=false;const lastS={};
function unlock(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
const SF={coin:[[988,.05,'square'],[1480,.09,'square']],buy:[[392,.05,'triangle'],[523,.07,'triangle']],spawn:[[262,.07,'triangle']],ult:[[523,.07,'square'],[659,.07,'square'],[784,.12,'square']],boom:[[70,.35,'sawtooth']],fall:[[140,.2,'sawtooth'],[90,.5,'sawtooth']],win:[[523,.12,'triangle'],[659,.12,'triangle'],[784,.12,'triangle'],[1047,.35,'triangle']],lose:[[392,.18,'triangle'],[330,.18,'triangle'],[262,.45,'triangle']],nope:[[160,.08,'square']]};
function sfx(k,vol){if(muted||!AC||!SF[k])return;const now=AC.currentTime;if(lastS[k]&&now-lastS[k]<.06)return;lastS[k]=now;let t=now;
 for(const [f,d,ty] of SF[k]){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(k==='boom'||k==='fall')o.frequency.exponentialRampToValueAtTime(f*.5,t+d);
  gn.gain.setValueAtTime((vol||.07),t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-pressed',String(muted));$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');};

/* ---------- game state ---------- */
function mkB(team,kind,x){const tw=kind==='tower';return{team,kind,x,hp:tw?560:1000,max:tw?560:1000,half:tw?22:44,h:tw?132:108,range:tw?175:150,dmg:tw?17:12,rate:tw?1.25:1,cd:1.5,hit:0,dead:false,smoke:0};}
function newGame(diff,mode){
 G={diff,D:DIFF[diff],t:0,state:mode||'play',teams:[{coins:60,train:{tank:0,archer:0,sword:0,mage:0}},{coins:60,train:{tank:0,archer:0,sword:0,mage:0}}],
  units:[],B:[mkB(0,'castle',110),mkB(0,'tower',370),mkB(1,'tower',W-370),mkB(1,'castle',W-110)],proj:[],fx:[],pops:[],coins:[],dropT:2.2,cloud:{x:cam.x+300,f:.5,puff:0},drops:0,
  ai:[{t:1,next:'sword'},{t:1,next:'sword'}],stats:{sent:0,lost:0,kills:0,coins:0},shake:0,slow:1,endT:0,uid:0,winner:-1};
 cam.x=0;cam.follow=0;
}
function buy(ti,type){const tm=G.teams[ti],d=T[type];if(G.state==='end'||tm.train[type]>0||tm.coins<d.cost)return false;
 tm.coins-=d.cost;tm.train[type]=d.train;if(ti===0&&G.state==='play'){G.stats.sent++;sfx('buy');}return true;}
function spawn(ti,type){const d=T[type],c=G.B.find(b=>b.team===ti&&b.kind==='castle'),dir=ti?-1:1;
 G.units.push({id:++G.uid,team:ti,type,d,dir,x:c.x+dir*24,lane:rnd(-11,7),hp:d.hp,max:d.hp,cd:.4,ultT:rnd(0,d.ult*.3),anim:rnd(0,5),moving:false,swing:0,hit:0,stun:0,shield:0,spin:0,spd:d.spd*rnd(.92,1.08),rng:d.range+rnd(-3,3)});
 if(ti===0&&G.state==='play')sfx('spawn',.05);}
function tgtX(t){return t.x;}
function tgtY(t){return t.kind?GY-t.h*.55:GY+t.lane-16;}
function ahead(u){let best=null,bd=1e9;
 for(const e of G.units){if(e.team===u.team||e.hp<=0)continue;const d=(e.x-u.x)*u.dir;if(d>-14&&d<bd){bd=d;best=e;}}
 for(const b of G.B){if(b.team===u.team||b.dead)continue;const d=(b.x-u.x)*u.dir-b.half;if(d>-30&&d<bd){bd=d;best=b;}}
 return [best,Math.max(0,bd)];}
function pop(x,y,text,col,size,life){G.pops.push({x,y,text,col,size:size||1,t:0,life:life||1.1});}
function burst(x,y,col,n,sp,grav,r){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(.3,1)*sp;G.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,life:rnd(.4,.9),max:.9,col,r:r||rnd(1.2,2.6),grav:grav==null?380:grav});}}
function ring(x,y,r0,r1,col,life,w){G.fx.push({k:'r',x,y,r0,r1,col,life,max:life,w:w||3});}
function hurt(t,dmg,by){
 if(t.kind){if(t.dead)return;if(G.ot)dmg*=1.6;t.hp-=dmg;t.hit=.12;if(t.hp<=0){t.hp=0;t.dead=true;fall(t,by);}return;}
 if(t.hp<=0)return;if(t.shield>0)dmg*=.45;t.hp-=dmg;t.hit=.12;if(t.hp<=0)die(t);}
function die(u){burst(u.x,GY+u.lane-14,TEAM[u.team].col,12,120);burst(u.x,GY+u.lane-14,'#e9e2d0',6,90);
 if(u.team===1){const v=Math.round(u.d.cost*.35);if(G.state==='play'){G.stats.kills++;dropCoin(u.x,v,GY+u.lane-30,-140);}else G.teams[0].coins+=v;}
 else{G.teams[1].coins+=Math.round(u.d.cost*.3*(G.state==='play'?G.D.drop/.6:1));if(G.state==='play')G.stats.lost++;}}
function fall(b,by){
 const top=GY-b.h;for(let i=0;i<26;i++)G.fx.push({k:'chunk',x:b.x+rnd(-b.half,b.half),y:top+rnd(0,b.h*.7),vx:rnd(-90,90),vy:rnd(-220,-40),life:rnd(1,1.6),max:1.6,col:b.team?'#7d8094':'#c8a676',r:rnd(3,7),rot:rnd(0,6),vr:rnd(-8,8),grav:520});
 for(let i=0;i<18;i++)G.fx.push({k:'dust',x:b.x+rnd(-b.half-10,b.half+10),y:GY-rnd(0,30),vx:rnd(-30,30),vy:rnd(-40,-10),life:rnd(1.2,2.2),max:2.2,r:rnd(10,22),col:'rgba(214,196,160,'});
 G.shake=Math.max(G.shake,RM?0:.6);sfx('fall',.09);
 const mine=b.team===0,what=b.kind==='tower'?'tower':'castle';
 if(G.state==='play'){pop(b.x,top-20,(mine?'Your ':'CPU ')+what+' fell!',mine?'#ffb0a6':'#ffe27a',1.6,2.2);say((mine?'Your ':'The computer’s ')+what+' fell.');}
 if(b.kind==='tower'){G.teams[1-b.team].coins+=50;if(!mine&&G.state==='play')pop(b.x,top,'+50 🪙','#ffcf4a',1.2,1.6);}
 if(b.kind==='castle'&&G.state!=='end'){if(G.state==='menu'){G.restartT=4;}else endGame(1-b.team);}}
function area(team,x,r,dmg,bmul,kb,stun){
 for(const e of G.units)if(e.team!==team&&e.hp>0&&Math.abs(e.x-x)<=r){hurt(e,dmg,team);if(kb&&e.hp>0){e.x=clamp(e.x+kb,70,W-70);e.stun=Math.max(e.stun,stun||0);}}
 if(bmul)for(const b of G.B)if(b.team!==team&&!b.dead&&Math.abs(b.x-x)<=r+b.half)hurt(b,dmg*bmul,team);}
function shoot(team,from,t,kind,dmg){const x0=from.x,y0=from.y,dist=Math.abs(tgtX(t)-x0);
 G.proj.push({kind,team,x0,y0,x1:tgtX(t),y1:tgtY(t),t:0,dur:Math.max(.22,dist/(kind==='orb'?250:360)),arc:kind==='orb'?dist*.06:Math.min(55,dist*.22),dmg,target:t,delay:0});}
function ult(u,t){const d=u.d,tc=TEAM[u.team];u.ultT=0;u.swing=.4;
 if(G.state==='play')pop(u.x,GY+u.lane-d.top-14,d.ultName+'!',u.team?'#ffb0a6':'#ffe27a',1,1.3);
 if(u.team===0&&G.state==='play')sfx('ult',.05);
 if(u.type==='sword'){u.spin=.5;area(u.team,u.x+u.dir*8,46,34,1);ring(u.x,GY+u.lane-14,8,48,tc.light,.4,4);}
 else if(u.type==='tank'){area(u.team,u.x+u.dir*22,62,24,1,u.dir*32,.7);u.shield=3.5;ring(u.x+u.dir*16,GY+u.lane-4,6,70,'#ffe9b0',.5,5);G.shake=Math.max(G.shake,RM?0:.25);burst(u.x+u.dir*22,GY,'#b89a6a',10,90);}
 else if(u.type==='archer'){const cx=tgtX(t);for(let i=0;i<9;i++)G.proj.push({kind:'rain',team:u.team,x0:cx+rnd(-46,46),y0:-offY-30,x1:0,y1:GY+rnd(-10,6),t:0,dur:.5,arc:0,dmg:13,delay:i*.07});G.proj.forEach(p=>{if(p.kind==='rain'&&p.x1===0)p.x1=p.x0+u.dir*30;});}
 else if(u.type==='mage'){let bx=tgtX(t),bc=0;for(const e of G.units){if(e.team===u.team||e.hp<=0)continue;const dd=(e.x-u.x)*u.dir;if(dd<-10||dd>d.ur)continue;let c=0;for(const f of G.units)if(f.team!==u.team&&f.hp>0&&Math.abs(f.x-e.x)<55)c++;if(c>bc){bc=c;bx=e.x;}}
  G.proj.push({kind:'meteor',team:u.team,x0:bx-u.dir*170,y0:-offY-60,x1:bx,y1:GY-4,t:0,dur:.85,arc:0,dmg:72,delay:0});}}
function cloudY(){return GY-190-offY*.4;}
function dropCoin(x,v,y,vy){G.coins.push({x:clamp(x,40,W-40),y:y==null?-offY-20:y,vy:vy||0,v,land:false,life:8,spin:rnd(0,6),big:v>=20});}
function collect(c){if(c.taken)return;c.taken=true;G.teams[0].coins+=c.v;G.stats.coins+=c.v;pop(c.x,c.y-16,'+'+c.v,'#ffcf4a',1.1,.9);burst(c.x,c.y,'#ffcf4a',8,110,200,1.6);sfx('coin',.05);}

/* ---------- AI ---------- */
function pickAI(ti){const c={sword:0,archer:0,tank:0,mage:0};for(const e of G.units)if(e.team!==ti)c[e.type]++;
 const s=G.state==='menu'?.6:G.D.smart,w={sword:3,archer:2.4,tank:1.5,mage:1.5};
 w.mage+=s*c.tank*1.6;w.tank+=s*(c.archer+c.mage)*.9;w.sword+=s*(c.archer+c.mage)*.6;w.archer+=s*c.sword*.8;w.tank+=s*c.sword*.4;
 if(G.t<18)w.tank*=.3;let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'sword';}
function upAI(ti,dt){const A=G.ai[ti],tm=G.teams[ti];A.t-=dt;if(A.t>0)return;A.t=.5;
 if(tm.train[A.next]>0)A.next=pickAI(ti);
 if(tm.coins>=T[A.next].cost&&!tm.train[A.next]){buy(ti,A.next);A.next=pickAI(ti);return;}
 const home=G.B.find(b=>b.team===ti&&b.kind==='tower').x;
 if(G.units.some(e=>e.team!==ti&&Math.abs(e.x-home)<420))for(const k of ['sword','archer','mage','tank'])if(!tm.train[k]&&tm.coins>=T[k].cost){buy(ti,k);break;}}

/* ---------- update ---------- */
function step(dt){G.t+=dt;const play=G.state==='play';
 if(G.state!=='end'){const inc=(4+Math.min(6,G.t/30))*dt;G.teams[0].coins+=inc*(G.B[1].dead?1.25:1);G.teams[1].coins+=inc*(play?G.D.inc:1)*(G.B[2].dead?1.25:1);
  if(play&&!G.ot&&G.t>=150){G.ot=1;pop(cam.x+viewW/2,GY-160,'OVERTIME: walls crumble faster','#ffe27a',1.3,2.6);say('Overtime: buildings take more damage.');sfx('ult',.06);}
  upAI(1,dt);if(!play)upAI(0,dt);
  const cl=G.cloud,tx=clamp(cam.x+cl.f*viewW,60,W-60);cl.x+=(tx-cl.x)*(1-Math.exp(-1.8*dt));cl.puff=Math.max(0,cl.puff-dt);
  if(play){G.dropT-=dt;if(G.dropT<=0){G.dropT=rnd(3.2,5.5);const v=Math.random()<.22?25:10;dropCoin(cl.x,v,cloudY()+14,-60);cl.puff=.35;cl.f=rnd(.14,.86);G.drops++;if(G.drops<=2)G.coins[G.coins.length-1].hint=1;G.teams[1].coins+=v*G.D.drop;}}
  for(let ti=0;ti<2;ti++){const tr=G.teams[ti].train;for(const k in tr)if(tr[k]>0){tr[k]-=dt;if(tr[k]<=0){tr[k]=0;spawn(ti,k);}}}}

    g.fillStyle='#7a5230';g.fillRect(-8,-24,3,9);}}}
 g.restore();}
function drawP(p){if(p.delay>0)return;const t=Math.min(1,p.t),x=p.x0+(p.x1-p.x0)*t,y=p.y0+(p.y1-p.y0)*t-p.arc*4*t*(1-t);
 const dx=(p.x1-p.x0),dy=(p.y1-p.y0)-p.arc*4*(1-2*t),a=Math.atan2(dy,dx);
 if(p.kind==='arrow'||p.kind==='bolt'||p.kind==='rain'){g.save();g.translate(x,y);g.rotate(a);g.strokeStyle=p.kind==='bolt'?'#3a2c20':'#e9e2d0';g.lineWidth=p.kind==='bolt'?2:1.4;g.beginPath();g.moveTo(-9,0);g.lineTo(3,0);g.stroke();g.fillStyle=TEAM[p.team].light;g.fillRect(-10,-1.5,3,3);g.fillStyle='#c3c7d4';g.beginPath();g.moveTo(5,0);g.lineTo(1,-2);g.lineTo(1,2);g.fill();g.restore();}
 else if(p.kind==='orb'){g.fillStyle='rgba(160,240,255,.3)';g.beginPath();g.arc(x,y,6,0,7);g.fill();g.fillStyle='#d9faff';g.beginPath();g.arc(x,y,3,0,7);g.fill();}
 else if(p.kind==='meteor'){for(let i=1;i<6;i++){const tt=Math.max(0,t-i*.03);g.fillStyle='rgba(255,'+(140+i*15)+',60,'+(.5-i*.08)+')';g.beginPath();g.arc(p.x0+(p.x1-p.x0)*tt,p.y0+(p.y1-p.y0)*tt,11-i,0,7);g.fill();}
  g.fillStyle='#ff6a2a';g.beginPath();g.arc(x,y,11,0,7);g.fill();g.fillStyle='#ffd27a';g.beginPath();g.arc(x-3,y-3,5,0,7);g.fill();}}
function drawFx(f){const a=clamp(f.life/f.max,0,1);
 if(f.k==='p'){g.globalAlpha=a;g.fillStyle=f.col;g.fillRect(f.x-f.r/2,f.y-f.r/2,f.r,f.r);g.globalAlpha=1;}
 else if(f.k==='r'){const r=f.r1-(f.r1-f.r0)*a;g.globalAlpha=a;g.strokeStyle=f.col;g.lineWidth=f.w;g.beginPath();g.ellipse(f.x,f.y,r,r*.4,0,0,7);g.stroke();g.globalAlpha=1;}
 else if(f.k==='chunk'){g.save();g.globalAlpha=Math.min(1,a*2);g.translate(f.x,f.y);g.rotate(f.rot);g.fillStyle=f.col;g.fillRect(-f.r/2,-f.r/2,f.r,f.r);g.restore();g.globalAlpha=1;}
 else if(f.k==='dust'){g.fillStyle=f.col+(a*.45).toFixed(3)+')';g.beginPath();g.arc(f.x,f.y,f.r*(1.6-a*.6),0,7);g.fill();}}
function drawMini(){g.setTransform(DPR,0,0,DPR,0,0);const x0=12,w=cssW-24,y=8,h=14,sx=w/W;
 g.fillStyle='rgba(14,15,30,.62)';rr(x0-3,y-3,w+6,h+6,6);g.fill();g.fillStyle='rgba(110,85,54,.8)';g.fillRect(x0,y+h-4,w,4);
 for(const b of G.B){g.fillStyle=b.dead?'#555':(b.team?'#ff7a6a':'#6ea5ff');g.fillRect(x0+b.x*sx-(b.kind==='castle'?4:2),y+(b.kind==='castle'?1:3),b.kind==='castle'?8:4,h-5-(b.kind==='castle'?0:2));}
 for(const u of G.units){g.fillStyle=u.team?'#ffb0a6':'#a9caff';g.fillRect(x0+u.x*sx-1,y+h-8,2,4);}
 for(const c of G.coins){g.fillStyle='#ffcf4a';g.fillRect(x0+c.x*sx-1,y+2,2,2);}
 g.strokeStyle='rgba(255,246,214,.85)';g.lineWidth=1.5;g.strokeRect(x0+Math.max(0,cam.x)*sx,y-1,Math.min(W,viewW)*sx,h+2);}

/* ---------- layout + input ---------- */
function resize(){const r=stage.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);DPR=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(cssW*DPR);cv.height=Math.round(cssH*DPR);S=Math.min(cssH/WH,cssW/280);viewW=cssW/S;viewH=cssH/S;offY=viewH-WH;}
addEventListener('resize',resize);
function toWorld(e){const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;return{px,py,x:px/S+cam.x,y:py/S-offY};}
let drag=null;
function tryCoins(w,rad){let hit=false;for(const c of G.coins){if(Math.hypot(c.x-w.x,(c.y-w.y)*.8)<rad){collect(c);hit=true;}}return hit;}
cv.addEventListener('pointerdown',e=>{unlock();if(!G||G.state==='menu')return;const w=toWorld(e);
 if(w.py<30){cam.x=w.px/(cssW-24)*W-viewW/2;cam.follow=6;return;}
 const rad=Math.max(24,30/S);if(tryCoins(w,rad))return;
 drag={x:w.px,c:cam.x,moved:false};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;const w=toWorld(e);if(Math.abs(w.px-drag.x)>4)drag.moved=true;cam.x=drag.c-(w.px-drag.x)/S;cam.follow=5;tryCoins(w,Math.max(20,24/S));});
const endDrag=()=>{drag=null;cv.style.cursor='grab';};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{if(!G||G.state==='menu')return;e.preventDefault();cam.x+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/S;cam.follow=5;},{passive:false});
addEventListener('keydown',e=>{unlock();if(!G||G.state!=='play')return;const i='1234'.indexOf(e.key);if(i>=0){tryBuy(ORDER[i]);e.preventDefault();}
 else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){cam.x+=(e.key==='ArrowLeft'?-1:1)*viewW*.35;cam.follow=5;e.preventDefault();}
 else if(e.key==='c'||e.key==='C'){for(const c of G.coins)if(c.x>cam.x&&c.x<cam.x+viewW)collect(c);}
 else if(e.key==='f'||e.key==='F'){cam.follow=0;}});

/* ---------- cards ---------- */
const cards={};
function mini(type){const c=document.createElement('canvas');c.width=c.height=84;c.setAttribute('aria-hidden','true');return c;}
function paintCard(type){const c=cards[type].cv,x=c.getContext('2d'),sv=g;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,84,84);
 const fake={team:0,type,d:T[type],dir:1,x:0,lane:-GY,hp:1,max:1,ultT:0,anim:0,moving:false,swing:0,hit:0,shield:0,spin:0,stun:0};
 g=x;x.setTransform(1.45,0,0,1.45,40,80);try{drawUnitCore(fake);}finally{g=sv;}}
ORDER.forEach((k,i)=>{const d=T[k],b=document.createElement('button');b.type='button';b.className='card';b.dataset.k=k;b.setAttribute('aria-keyshortcuts',String(i+1));
 b.innerHTML='<kbd aria-hidden="true">'+(i+1)+'</kbd><span class="fill"></span><span class="nm">'+d.name+'</span><span class="co">'+d.cost+' 🪙</span><span class="tr"></span>';
 const c=mini(k);b.insertBefore(c,b.querySelector('.nm'));cards[k]={b,cv:c,st:''};b.onclick=()=>{unlock();tryBuy(k);};$('cards').appendChild(b);});
function tryBuy(k){if(!G||G.state!=='play')return;const tm=G.teams[0];if(buy(0,k)){return;}
 const b=cards[k].b;b.classList.remove('nope');void b.offsetWidth;if(!RM)b.classList.add('nope');sfx('nope',.04);
 if(tm.train[k]>0)say(T[k].name+' is still getting ready.');else{const need=Math.ceil(T[k].cost-tm.coins);pop(cam.x+viewW/2,GY-150,'need '+need+' more 🪙','#ffb0a6',1.2,1);}}
let uiT=0,lastCoins=-1;
function ui(dt){uiT-=dt;if(uiT>0)return;uiT=.08;const tm=G.teams[0];const c=Math.floor(tm.coins);
 if(c!==lastCoins){lastCoins=c;$('coins').textContent='🪙 '+c;}
 for(const k of ORDER){const d=T[k],cd=cards[k],tr=tm.train[k],can=tm.coins>=d.cost&&!tr&&G.state==='play';
  cd.b.style.setProperty('--a',Math.min(1,tm.coins/d.cost).toFixed(3));cd.b.style.setProperty('--p',tr?(1-tr/d.train).toFixed(3):0);
  const st=(can?'r':'n')+(tr?'t':'');if(st!==cd.st){cd.st=st;cd.b.setAttribute('aria-disabled',String(!can));cd.b.classList.toggle('ready',can);
   cd.b.setAttribute('aria-label',d.name+', '+d.cost+' coins, '+(tr?'getting ready':can?'ready to send':'not enough coins')+'. Ultimate: '+d.ultName+'.');}}
 const yc=G.B[0],ct=G.B[1],et=G.B[2],ec=G.B[3];
 $('hpY').firstChild.style.width=(100*(yc.hp+ct.hp)/(yc.max+ct.max)).toFixed(1)+'%';$('hpC').firstChild.style.width=(100*(ec.hp+et.hp)/(ec.max+et.max)).toFixed(1)+'%';}
function say(t){$('st').textContent=t;}

/* ---------- screens ---------- */
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function menu(){newGame('normal','menu');const best=SAVE.best||{};
 const bl=['easy','normal','hard'].filter(k=>best[k]).map(k=>DIFF[k].name+' '+fmt(best[k])).join(' · ');
 $('box').innerHTML='<h2 id="ovT">Moat Grudge</h2><p>Coins fall from the sky. Tap them, spend them on soldiers, and knock down the computer’s tower and its smug moat castle before it knocks down yours.</p><p class="sm">Every soldier charges an ultimate on its own: Door Slam, Arrow Rain, Whirlwind, Meteor. Drag the field to look around.</p>'+(bl?'<p class="sm">Best wins: '+bl+'</p>':'')+
 '<div class="row"><button type="button" class="go" data-d="easy">Easy<small>sleepy CPU</small></button><button type="button" class="go main" data-d="normal">Normal<small>grudge mode</small></button><button type="button" class="go" data-d="hard">Hard<small>it saves up</small></button></div>';
 $('ov').hidden=false;$('box').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{unlock();start(b.dataset.d);});$('box').querySelector('.main').focus();}
function start(d){newGame(d,'play');$('ov').hidden=true;lastCoins=-1;say('Battle started on '+DIFF[d].name+'. Your coins: 60.');}
function endGame(win){G.state='end';G.winner=win;G.endT=0;cam.follow=0;const you=win===0;sfx(you?'win':'lose',.07);
 if(you){SAVE.best=SAVE.best||{};if(!SAVE.best[G.diff]||G.t<SAVE.best[G.diff])SAVE.best[G.diff]=Math.round(G.t);SAVE.wins=(SAVE.wins||0)+1;save();}
 setTimeout(()=>{if(!G||G.state!=='end')return;const s=G.stats;
  $('box').innerHTML='<h2 id="ovT">'+(you?'Moat drained!':'Your keep fell')+'</h2><p>'+(you?'The computer’s castle is a pile of grumpy rubble. ':'The computer will be unbearable about this. ')+'Time '+fmt(G.t)+' on '+G.D.name+'.</p><p class="sm">Sent '+s.sent+' soldiers · lost '+s.lost+' · beat '+s.kills+' · grabbed '+s.coins+' coins</p>'+
  '<div class="row"><button type="button" class="go main" id="again">Again</button><button type="button" class="go" id="back">Pick difficulty</button></div>';
  $('ov').hidden=false;$('again').onclick=()=>start(G.diff);$('back').onclick=menu;$('again').focus();say(you?'You won.':'You lost.');},2200);}
document.addEventListener('visibilitychange',()=>{last=performance.now();});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){acc+=dt;let n=0;while(acc>=1/60&&n<5){step(1/60);acc-=1/60;n++;}if(n>=5)acc=0;}
 ui(dt);draw();requestAnimationFrame(frame);}
/*TESTHOOK*/
resize();menu();ORDER.forEach(paintCard);requestAnimationFrame(frame);
})();
</script>
</body>
