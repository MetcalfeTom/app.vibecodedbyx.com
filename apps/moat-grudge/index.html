<header>
 <h1>Moat Grudge</h1>
 <div class="hpw" aria-hidden="true"><span class="lbl y">YOU</span><div class="hp" id="hpY"><i></i></div><div class="hp" id="hpC"><i></i></div><span class="lbl c">CPU</span></div>

 </div>

<script>
'use strict';
(function(){
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=1900,GY=300,WH=360,$=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');let g=cv.getContext('2d');
const TEAM=[{col:'#4d8ef0',dark:'#1f3f80',light:'#a9caff',skin:'#f0c39a'},{col:'#d8473c',dark:'#6e1b1b',light:'#ffb0a6',skin:'#c9a07f'}];
const T={
 tank:{name:'Tank',cost:75,hp:460,dmg:11,rate:1.2,range:22,spd:20,train:7,ult:10,ultName:'Door Slam',ur:58,top:50},
 archer:{name:'Archer',cost:40,hp:72,dmg:11,rate:1.15,range:150,spd:30,train:3.5,ult:8,ultName:'Arrow Rain',ur:190,top:40},
 sword:{name:'Swordsman',cost:30,hp:130,dmg:14,rate:.8,range:20,spd:38,train:2.5,ult:6,ultName:'Whirlwind',ur:44,top:42},
 mage:{name:'Mage',cost:60,hp:85,dmg:15,rate:1.7,range:125,spd:24,train:5.5,ult:9,ultName:'Meteor',ur:240,top:48}
};
const ORDER=['tank','archer','sword','mage'];
const DIFF={easy:{inc:.72,drop:.4,share:0,miss:.7,smart:.25,name:'Easy'},normal:{inc:1,drop:.6,share:.15,miss:1,smart:.7,name:'Normal'},hard:{inc:1.32,drop:.85,share:.3,miss:1,smart:1,name:'Hard'},frog:{inc:1.4,drop:.9,share:.3,miss:1,smart:1,name:'Secret'}};
let G=null,S=1,DPR=1,cssW=0,cssH=0,viewW=0,viewH=0,offY=0;
const cam={x:0,follow:0};
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
let SAVE={};try{SAVE=JSON.parse(localStorage.getItem('moat-grudge')||'{}')||{};}catch(e){}
function save(){try{localStorage.setItem('moat-grudge',JSON.stringify(SAVE));}catch(e){}}

/* ---------- sound ---------- */
let AC=null,muted=false;const lastS={};
function unlock(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
const SF={coin:[[988,.05,'square'],[1480,.09,'square']],buy:[[392,.05,'triangle'],[523,.07,'triangle']],spawn:[[262,.07,'triangle']],ult:[[523,.07,'square'],[659,.07,'square'],[784,.12,'square']],boom:[[70,.35,'sawtooth']],fall:[[140,.2,'sawtooth'],[90,.5,'sawtooth']],win:[[523,.12,'triangle'],[659,.12,'triangle'],[784,.12,'triangle'],[1047,.35,'triangle']],lose:[[392,.18,'triangle'],[330,.18,'triangle'],[262,.45,'triangle']],nope:[[160,.08,'square']],wave:[[196,.14,'sine'],[147,.2,'sine'],[98,.4,'sine']],mark:[[330,.08,'square'],[247,.16,'square']],croak:[[150,.06,'sawtooth'],[105,.12,'sawtooth']]};
function sfx(k,vol){if(muted||!AC||!SF[k])return;const now=AC.currentTime;if(lastS[k]&&now-lastS[k]<.06)return;lastS[k]=now;let t=now;
 for(const [f,d,ty] of SF[k]){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(k==='boom'||k==='fall')o.frequency.exponentialRampToValueAtTime(f*.5,t+d);
  gn.gain.setValueAtTime((vol||.07),t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;}}
/* ---------- music: a small siege march in D minor; faster in overtime, drums when Drizzleworth gets bored ---------- */
const MEL=[0,null,3,5,7,null,5,3,3,null,5,8,12,null,8,5,2,null,5,7,10,12,10,null,7,null,11,7,2,null,null,null],MBASS=[0,-4,-2,-5],MU={next:0,i:0};
function note(f,t,d,ty,v,f2){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function music(){if(muted||!AC||!G||G.state!=='play'||document.hidden){MU.next=0;return;}
 const bpm=G.bored?148:G.ot?130:108,e8=60/bpm/2,now=AC.currentTime;if(MU.next<now)MU.next=now+.05;
 while(MU.next<now+.2){const i=MU.i++,t=MU.next;MU.next+=e8;
  const m=MEL[i%32],root=MBASS[(i>>3)%4];
  if(((i>>5)&1)===0&&m!=null)note(293.66*Math.pow(2,m/12),t,e8*1.6,'square',.018);
  if(i%2===0)note(73.42*Math.pow(2,(root+(i%4?7:0))/12),t,e8*1.8,'triangle',.05);
  if((G.ot||G.bored)&&i%4===0)note(130,t,.13,'sine',.09,45);
  if(G.bored&&i%2===1)note(5200,t,.025,'square',.005);}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-pressed',String(muted));$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');};

/* ---------- game state ---------- */
function mkB(team,kind,x){const tw=kind==='tower';return{team,kind,x,hp:tw?560:1000,max:tw?560:1000,half:tw?22:44,h:tw?132:108,range:tw?175:150,dmg:tw?17:12,rate:tw?1.25:1,cd:1.5,hit:0,dead:false,smoke:0};}
/* the rival lords who hold the far castle, one per difficulty */
const LORD={easy:{name:'Lord Puddle',his:'his',skin:'#a9cdea',bias:{sword:1.2},
  hi:'Is it a siege? I was napping.',tower:'My tower! I only blinked.',gloat:'Oh! Did I win something?',lose:'will sleep through the repairs.',win:'is still asleep. He will be unbearable when he wakes up.'},
 normal:{name:'Baroness Grudge',his:'her',skin:'#f2c6ab',bias:{archer:.6},
  hi:'I remember EVERY coin you take.',tower:'That tower was a gift from my mother.',gloat:'Write that down. I will.',lose:'has started a list. You are on it.',win:'will be unbearable about this for a century.'},
 hard:{name:'the Drowned King',his:'his',skin:'#86bba4',bias:{tank:.6,mage:.6},
  hi:'My moat has teeth.',tower:'The sea takes, the sea gives back.',gloat:'Glub. Victory tastes like salt.',lose:'sinks back into his moat, sulking.',win:'gargles in triumph.'},
 frog:{name:'the Frog Duke',his:'his',skin:'#8fcf6a',bias:{sword:.6,archer:.6},
  hi:'I was a prince once. Then I kissed a moat.',tower:'Ribbit. That one was load-bearing.',gloat:'Ribbit. That is frog for checkmate.',lose:'hops back under the drawbridge, croaking about a rematch.',win:'croaks a victory song. It is long and off-key.'}};
const cap=t=>t[0].toUpperCase()+t.slice(1);
const REC_LINES={easy:{you:w=>'You again? I only just fixed the drawbridge. '+w+' times!',him:l=>'I have won '+l+' times. I do not remember any of them.'},
 normal:{you:w=>w+' wins for you. Every single one is on my list.',him:l=>l+' to me. It is in the ledger. In ink.'},
 hard:{you:w=>'You drained my moat '+w+' times. It refilled. So did my grudge.',him:l=>l+' wins to me. The moat remembers.'},
 frog:{you:w=>w+' wins for you. Every frog in the moat has heard about it.',him:l=>l+' to me. We sing about each one.'}};
function rec(k){const r=(SAVE.rec||{})[k];return r&&r[0]+r[1]>0?r:null;}
function recTxt(k){const r=rec(k);return r?'you '+r[0]+' · '+(LORD[k].his==='her'?'her':'him')+' '+r[1]:'';}
function hiLine(){const r=rec(G.diff),L=REC_LINES[G.diff];if(!r)return G.L.hi;if(r[0]>r[1])return L.you(r[0]);if(r[1]>r[0])return L.him(r[1]);return 'All square, '+r[0]+' each. Not for long.';}
function lordSay(text,at,fn){(G.lq=G.lq||[]).push({at:G.t+(at||0),text:cap(G.L.name)+': “'+text+'”',fn});}
function newGame(diff,mode){
 G={diff,D:DIFF[diff],L:LORD[diff],lmad:0,t:0,state:mode||'play',teams:[{coins:60,train:{tank:0,archer:0,sword:0,mage:0}},{coins:60,train:{tank:0,archer:0,sword:0,mage:0}}],
  units:[],B:[mkB(0,'castle',110),mkB(0,'tower',370),mkB(1,'tower',W-370),mkB(1,'castle',W-110)],proj:[],fx:[],pops:[],coins:[],dropT:2.2,cloud:{x:cam.x+300,f:.5,puff:0,fav:0,strike:null,flash:0},drops:0,
  ai:[{t:1,next:'sword'},{t:1,next:'sword'}],stats:{sent:0,lost:0,kills:0,coins:0},shake:0,slow:1,endT:0,uid:0,winner:-1};
 cam.x=0;cam.follow=0;
}
function buy(ti,type){const tm=G.teams[ti],d=T[type];if(G.state==='end'||tm.train[type]>0||tm.coins<d.cost)return false;
 tm.coins-=d.cost;tm.train[type]=d.train;if(ti===0&&G.state==='play'){G.stats.sent++;sfx('buy');}return true;}
function spawn(ti,type){const d=T[type],c=G.B.find(b=>b.team===ti&&b.kind==='castle'),dir=ti?-1:1;
 G.units.push({id:++G.uid,team:ti,type,d,dir,x:c.x+dir*24,lane:rnd(-11,7),hp:d.hp,max:d.hp,cd:.4,ultT:rnd(0,d.ult*.3),anim:rnd(0,5),moving:false,swing:0,hit:0,stun:0,shield:0,spin:0,spd:d.spd*rnd(.92,1.08),rng:d.range+rnd(-3,3)});
 if(ti===0&&G.state==='play')sfx('spawn',.05);}
function tgtX(t){return t.x;}
function tgtY(t){return t.kind?GY-t.h*.55:GY+t.lane-16;}
function ahead(u){let best=null,bd=1e9;
 for(const e of G.units){if(e.team===u.team||e.hp<=0)continue;const d=(e.x-u.x)*u.dir;if(d>-14&&d<bd){bd=d;best=e;}}
 for(const b of G.B){if(b.team===u.team||b.dead)continue;const d=(b.x-u.x)*u.dir-b.half;if(d>-30&&d<bd){bd=d;best=b;}}
 return [best,Math.max(0,bd)];}
function pop(x,y,text,col,size,life){G.pops.push({x,y,text,col,size:size||1,t:0,life:life||1.1});}
function burst(x,y,col,n,sp,grav,r){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(.3,1)*sp;G.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,life:rnd(.4,.9),max:.9,col,r:r||rnd(1.2,2.6),grav:grav==null?380:grav});}}
function ring(x,y,r0,r1,col,life,w){G.fx.push({k:'r',x,y,r0,r1,col,life,max:life,w:w||3});}
function tally(t,dmg,by){if(by===0&&G.src&&G.state==='play'){G.dmg=G.dmg||{};G.dmg[G.src]=(G.dmg[G.src]||0)+Math.min(dmg,Math.max(0,t.hp));}}
function hurt(t,dmg,by){
 if(t.kind){if(t.dead)return;if(G.ot)dmg*=1.6;tally(t,dmg,by);t.hp-=dmg;t.hit=.12;if(t.hp<=0){t.hp=0;t.dead=true;fall(t,by);}return;}
 if(t.hp<=0)return;if(t.shield>0)dmg*=.45;if(t.mark>0)dmg*=1.5;tally(t,dmg,by);t.hp-=dmg;t.hit=.12;if(t.hp<=0)die(t);}
function die(u){burst(u.x,GY+u.lane-14,TEAM[u.team].col,12,120);burst(u.x,GY+u.lane-14,'#e9e2d0',6,90);
 if(u.team===1){const v=Math.round(u.d.cost*.35);if(G.state==='play'){G.stats.kills++;dropCoin(u.x,v,GY+u.lane-30,-140);}else G.teams[0].coins+=v;}
 else{G.teams[1].coins+=Math.round(u.d.cost*.3*(G.state==='play'?G.D.drop/.6:1));if(G.state==='play')G.stats.lost++;}}
function fall(b,by){
 const top=GY-b.h;for(let i=0;i<26;i++)G.fx.push({k:'chunk',x:b.x+rnd(-b.half,b.half),y:top+rnd(0,b.h*.7),vx:rnd(-90,90),vy:rnd(-220,-40),life:rnd(1,1.6),max:1.6,col:b.team?'#7d8094':'#c8a676',r:rnd(3,7),rot:rnd(0,6),vr:rnd(-8,8),grav:520});
 for(let i=0;i<18;i++)G.fx.push({k:'dust',x:b.x+rnd(-b.half-10,b.half+10),y:GY-rnd(0,30),vx:rnd(-30,30),vy:rnd(-40,-10),life:rnd(1.2,2.2),max:2.2,r:rnd(10,22),col:'rgba(214,196,160,'});
 G.shake=Math.max(G.shake,RM?0:.6);sfx('fall',.09);
 const mine=b.team===0,what=b.kind==='tower'?'tower':'castle';
