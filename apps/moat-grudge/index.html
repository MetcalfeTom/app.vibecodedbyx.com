<script>
'use strict';
(function(){
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=2250,GY=300,WH=360,$=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');let g=cv.getContext('2d');
const TEAM=[{col:'#4d8ef0',dark:'#1f3f80',light:'#a9caff',skin:'#f0c39a'},{col:'#d8473c',dark:'#6e1b1b',light:'#ffb0a6',skin:'#c9a07f'}];
const T={
 tank:{name:'Tank',cost:75,hp:460,dmg:11,rate:1.2,range:22,spd:20,train:7,ult:10,ultName:'Door Slam',ur:58,top:50},
 archer:{name:'Archer',cost:40,hp:72,dmg:11,rate:1.15,range:150,spd:30,train:3.5,ult:8,ultName:'Arrow Rain',ur:190,top:40},
 sword:{name:'Swordsman',cost:30,hp:130,dmg:14,rate:.8,range:20,spd:38,train:2.5,ult:6,ultName:'Whirlwind',ur:44,top:42},
 mage:{name:'Mage',cost:60,hp:85,dmg:15,rate:1.7,range:125,spd:24,train:5.5,ult:9,ultName:'Meteor',ur:240,top:48}
};
const ORDER=['tank','archer','sword','mage'];
const DIFF={easy:{inc:.72,drop:.4,share:0,miss:.7,smart:.25,name:'Easy'},normal:{inc:1,drop:.6,share:.15,miss:1,smart:.7,name:'Normal'},hard:{inc:1.32,drop:.85,share:.3,miss:1,smart:1,name:'Hard'},frog:{inc:1.4,drop:.9,share:.3,miss:1,smart:1,name:'Secret'}};
let G=null,S=1,DPR=1,cssW=0,cssH=0,viewW=0,viewH=0,offY=0;
const cam={x:0,follow:0};
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
let SAVE={};try{SAVE=JSON.parse(localStorage.getItem('moat-grudge')||'{}')||{};}catch(e){}
function save(){try{localStorage.setItem('moat-grudge',JSON.stringify(SAVE));}catch(e){}}

/* ---------- sound ---------- */
let AC=null,muted=false;const lastS={};
function unlock(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
const SF={coin:[[988,.05,'square'],[1480,.09,'square']],buy:[[392,.05,'triangle'],[523,.07,'triangle']],spawn:[[262,.07,'triangle']],ult:[[523,.07,'square'],[659,.07,'square'],[784,.12,'square']],boom:[[70,.35,'sawtooth']],fall:[[140,.2,'sawtooth'],[90,.5,'sawtooth']],win:[[523,.12,'triangle'],[659,.12,'triangle'],[784,.12,'triangle'],[1047,.35,'triangle']],lose:[[392,.18,'triangle'],[330,.18,'triangle'],[262,.45,'triangle']],nope:[[160,.08,'square']],wave:[[196,.14,'sine'],[147,.2,'sine'],[98,.4,'sine']],mark:[[330,.08,'square'],[247,.16,'square']],croak:[[150,.06,'sawtooth'],[105,.12,'sawtooth']]};
function sfx(k,vol){if(muted||!AC||!SF[k])return;const now=AC.currentTime;if(lastS[k]&&now-lastS[k]<.06)return;lastS[k]=now;let t=now;
 for(const [f,d,ty] of SF[k]){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(k==='boom'||k==='fall')o.frequency.exponentialRampToValueAtTime(f*.5,t+d);
  gn.gain.setValueAtTime((vol||.07),t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;}}
/* ---------- music: a small siege march in D minor; faster in overtime, drums when Drizzleworth gets bored ---------- */
const MEL=[0,null,3,5,7,null,5,3,3,null,5,8,12,null,8,5,2,null,5,7,10,12,10,null,7,null,11,7,2,null,null,null],MBASS=[0,-4,-2,-5],MU={next:0,i:0};
function note(f,t,d,ty,v,f2){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function music(){if(muted||!AC||!G||G.state!=='play'||document.hidden){MU.next=0;return;}
 const bpm=G.bored?148:G.ot?130:108,e8=60/bpm/2,now=AC.currentTime;if(MU.next<now)MU.next=now+.05;
 while(MU.next<now+.2){const i=MU.i++,t=MU.next;MU.next+=e8;
  const m=MEL[i%32],root=MBASS[(i>>3)%4];
  if(((i>>5)&1)===0&&m!=null)note(293.66*Math.pow(2,m/12),t,e8*1.6,'square',.018);
  if(i%2===0)note(73.42*Math.pow(2,(root+(i%4?7:0))/12),t,e8*1.8,'triangle',.05);
  if((G.ot||G.bored)&&i%4===0)note(130,t,.13,'sine',.09,45);
  if(G.bored&&i%2===1)note(5200,t,.025,'square',.005);}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-pressed',String(muted));$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');};

/* ---------- game state ---------- */
function mkB(team,kind,x,o){const tw=kind==='tower',hp=tw?(o?470:540):1000;return{team,kind,x,outer:!!o,hp,max:hp,half:tw?(o?19:22):44,h:tw?(o?116:132):108,range:tw?175:150,dmg:tw?17:12,rate:tw?1.25:1,cd:1.5,hit:0,dead:false,smoke:0};}
function down(t){let n=0;for(const b of G.B)if(b.team===t&&b.kind==='tower'&&b.dead)n++;return n;}
function front(t){let f=null;for(const b of G.B)if(b.team===t&&!b.dead&&(!f||(t?b.x<f.x:b.x>f.x)))f=b;return f||G.B.find(b=>b.team===t&&b.kind==='castle');}
function awake(t){return down(t)>0||G.state==='end';}
/* the rival lords who hold the far castle, one per difficulty */
const LORD={easy:{name:'Lord Puddle',his:'his',skin:'#a9cdea',bias:{sword:1.2},
  hi:'Is it a siege? I was napping.',tower:'My tower! I only blinked.',tower2:'Not the other one too! Who keeps knocking these over?',gloat:'Oh! Did I win something?',lose:'will sleep through the repairs.',win:'is still asleep. He will be unbearable when he wakes up.'},
 normal:{name:'Baroness Grudge',his:'her',skin:'#f2c6ab',bias:{archer:.6},
  hi:'I remember EVERY coin you take.',tower:'That tower was a gift from my mother.',tower2:'Two towers. Two entries. Underlined twice.',gloat:'Write that down. I will.',lose:'has started a list. You are on it.',win:'will be unbearable about this for a century.'},
 hard:{name:'the Drowned King',his:'his',skin:'#86bba4',bias:{tank:.6,mage:.6},
  hi:'My moat has teeth.',tower:'The sea takes, the sea gives back.',tower2:'The tide is turning. Against me. Rude.',gloat:'Glub. Victory tastes like salt.',lose:'sinks back into his moat, sulking.',win:'gargles in triumph.'},
 frog:{name:'the Frog Duke',his:'his',skin:'#8fcf6a',bias:{sword:.6,archer:.6},
  hi:'I was a prince once. Then I kissed a moat.',tower:'Ribbit. That one was load-bearing.',tower2:'Ribbit. That one was ALSO load-bearing.',gloat:'Ribbit. That is frog for checkmate.',lose:'hops back under the drawbridge, croaking about a rematch.',win:'croaks a victory song. It is long and off-key.'}};
const cap=t=>t[0].toUpperCase()+t.slice(1);
const REC_LINES={easy:{you:w=>'You again? I only just fixed the drawbridge. '+w+' times!',him:l=>'I have won '+l+' times. I do not remember any of them.'},
 normal:{you:w=>w+' wins for you. Every single one is on my list.',him:l=>l+' to me. It is in the ledger. In ink.'},
 hard:{you:w=>'You drained my moat '+w+' times. It refilled. So did my grudge.',him:l=>l+' wins to me. The moat remembers.'},
 frog:{you:w=>w+' wins for you. Every frog in the moat has heard about it.',him:l=>l+' to me. We sing about each one.'}};
function rec(k){const r=(SAVE.rec||{})[k];return r&&r[0]+r[1]>0?r:null;}
function recTxt(k){const r=rec(k);return r?'you '+r[0]+' · '+(LORD[k].his==='her'?'her':'him')+' '+r[1]:'';}
function hiLine(){const r=rec(G.diff),L=REC_LINES[G.diff];if(!r)return G.L.hi;if(r[0]>r[1])return L.you(r[0]);if(r[1]>r[0])return L.him(r[1]);return 'All square, '+r[0]+' each. Not for long.';}
function lordSay(text,at,fn){(G.lq=G.lq||[]).push({at:G.t+(at||0),text:cap(G.L.name)+': “'+text+'”',fn});}
function newGame(diff,mode){
 G={diff,D:DIFF[diff],L:LORD[diff],lmad:0,t:0,state:mode||'play',teams:[{coins:60,train:{tank:0,archer:0,sword:0,mage:0},lv:{tank:0,archer:0,sword:0,mage:0}},{coins:60,train:{tank:0,archer:0,sword:0,mage:0},lv:{tank:0,archer:0,sword:0,mage:0}}],
  units:[],B:[mkB(0,'castle',110),mkB(0,'tower',370),mkB(0,'tower',680,1),mkB(1,'tower',W-680,1),mkB(1,'tower',W-370),mkB(1,'castle',W-110)],proj:[],fx:[],pops:[],coins:[],dropT:2.2,cloud:{x:cam.x+300,f:.5,puff:0,fav:0,strike:null,flash:0},drops:0,
  ai:[{t:1,next:'sword'},{t:1,next:'sword'}],stats:{sent:0,lost:0,kills:0,coins:0},shake:0,slow:1,endT:0,uid:0,winner:-1,clr:!!SAVE.clear};
 cam.x=0;cam.follow=0;
}

 '<div class="row r4"><button type="button" class="go" data-d="easy"><canvas class="lm" data-l="easy" width="144" height="96" aria-hidden="true"></canvas>Easy<small>Lord Puddle</small>'+(rec('easy')?'<small class="rec">'+recTxt('easy')+'</small>':'')+'</button><button type="button" class="go main" data-d="normal"><canvas class="lm" data-l="normal" width="144" height="96" aria-hidden="true"></canvas>Normal<small>Baroness Grudge</small>'+(rec('normal')?'<small class="rec">'+recTxt('normal')+'</small>':'')+'</button><button type="button" class="go" data-d="hard"><canvas class="lm" data-l="hard" width="144" height="96" aria-hidden="true"></canvas>Hard<small>the Drowned King</small>'+(rec('hard')?'<small class="rec">'+recTxt('hard')+'</small>':'')+'</button>'+(fr?'<button type="button" class="go frog" data-d="frog"><canvas class="lm" data-l="frog" width="144" height="96" aria-hidden="true"></canvas>Secret<small>the Frog Duke</small>'+(rec('frog')?'<small class="rec">'+recTxt('frog')+'</small>':'')+'</button>':'<button type="button" class="go lock" disabled aria-label="Secret lord, locked. Beat all three lords to unlock: '+nb+' of 3 done."><span class="lm lk" aria-hidden="true">?</span>???<small>beat all three · '+nb+'/3</small></button>')+'</div><div class="row">'+mBtn()+'</div><div class="row r2"><button type="button" class="go bkg" id="bkB">🛠 Barracks<small>rename · repaint · hats</small></button><button type="button" class="go bkg" id="skyB"></button></div>';

 $('ov').hidden=false;$('box').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{unlock();start(b.dataset.d);});$('bkB').onclick=()=>{unlock();barracks();};$('mB').onclick=()=>{unlock();camp();};skyBtn();$('skyB').onclick=()=>{SAVE.clear=!SAVE.clear;save();G.clr=!!SAVE.clear;skyBtn();};$('box').querySelector('.main').focus();}

 {SAVE.rec=SAVE.rec||{};const r=SAVE.rec[G.diff]=SAVE.rec[G.diff]||[0,0];r[you?0:1]++;save();}
 const had3=['easy','normal','hard'].every(k=>(SAVE.best||{})[k]);

 let mDone=0;if(G.march&&SAVE.march){const M=SAVE.march;if(you){M.lv=Object.assign({},G.teams[0].lv);M.t+=Math.round(G.t);M.st++;if(M.st>=MARCH.length){mDone=1;const b=SAVE.marchBest;G.mres={t:M.t,ret:M.ret,best:!b||M.ret<b.ret||M.ret===b.ret&&M.t<b.t};if(G.mres.best)SAVE.marchBest={t:M.t,ret:M.ret};SAVE.marchWins=(SAVE.marchWins||0)+1;SAVE.march=null;marchFw();}else mOffer();}else M.ret++;save();}
 setTimeout(()=>{if(!G||G.state!=='end')return;const s=G.stats;
  $('box').innerHTML='<canvas id="lordC" class="lordc" width="110" height="110" aria-hidden="true"></canvas><h2 id="ovT">'+(you?'Moat drained!':'Your keep fell')+'</h2><p>'+(you?cap(G.L.name)+'’s castle is a pile of grumpy rubble. '+cap(G.L.name)+' '+G.L.lose+' ':cap(G.L.name)+' '+G.L.win+' ')+'Time '+fmt(G.t)+' on '+G.D.name+'.</p><p class="sm">Your grudge with '+G.L.name+': '+recTxt(G.diff)+'</p>'+(G.unl?'<p class="unl">🐸 Something just croaked in the moat. '+(G.march?'The Frog Duke is next on your march.':'A secret fourth lord is waiting in the menu.')+'</p>':'')+'<p class="sm">Sent '+s.sent+' soldiers · lost '+s.lost+' · beat '+s.kills+' · grabbed '+s.coins+' coins</p>'+mvp()+
  '<div class="row"><button type="button" class="go main" id="again">Again</button><button type="button" class="go" id="back">Pick difficulty</button></div>';
  paintLord();$('ov').hidden=false;$('again').onclick=()=>start(G.diff);$('back').onclick=menu;$(G.unl?'back':'again').focus();if(G.march&&(SAVE.march||mDone))mEnd(you,mDone);say(you?'You won.'+(G.unl?' A secret fourth lord is unlocked in the menu.':''):'You lost.');},2200);}
document.addEventListener('visibilitychange',()=>{last=performance.now();});

let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){acc+=dt*(G?G.slow:1);let n=0;while(acc>=1/60&&n<5){step(1/60);acc-=1/60;n++;}if(n>=5)acc=0;}
 ui(dt);draw();music();requestAnimationFrame(frame);}

resize();menu();ORDER.forEach(paintCard);requestAnimationFrame(frame);
