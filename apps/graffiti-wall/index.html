  <style>
    :root { --ink: #ff00ff; --bg: #07070b; --panel: rgba(8, 8, 12, 0.86); --line: #2b2b36; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Bebas Neue', sans-serif;
      background:
        radial-gradient(ellipse at 50% 40%, #15131f 0%, var(--bg) 70%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      color: #ddd;
    }

    /* The wall is one fixed 1920×1080 canvas everyone shares; it is scaled and slid, never resized */
    .viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: none; }
    #wall { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; box-shadow: 0 0 80px rgba(0,0,0,0.9); }
    #wallCanvas { display: block; width: 1920px; height: 1080px; }

    .toolbar {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px; align-items: center;
      width: max-content; max-width: calc(100vw - 16px);
      background: var(--panel);
      padding: 10px 16px;
      border-radius: 28px;
      border: 2px solid var(--line);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      z-index: 100;
      animation: rise 0.6s cubic-bezier(.2,1.4,.4,1) both;
    }
    @keyframes rise { from { transform: translate(-50%, 140%); } }
    .group { display: flex; gap: 8px; align-items: center; }
    .toolbar button { touch-action: manipulation; font: inherit; }
    .color-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #1a1a22; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      background: var(--c);
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 16px var(--c); transform: scale(1.12); }
    .divider { width: 2px; height: 28px; background: var(--line); }
    .size-btn, .tool-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: #15151c; border: 2px solid var(--line); color: #bbb;
      display: grid; place-items: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .size-btn:hover, .tool-btn:hover { border-color: #777; }
    .size-btn[aria-pressed="true"] { border-color: #fff; background: #2a2a34; }
    .size-dot { background: #fff; border-radius: 50%; }
    .tool-btn { font-size: 1.1rem; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    .header {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 90; pointer-events: none;
      transition: opacity 0.6s, transform 0.6s;
    }
    .header.hidden { opacity: 0; transform: translate(-50%, -20px); }
    .title {
      font-family: 'Permanent Marker', cursive; font-weight: 400;
      font-size: clamp(2rem, 7vw, 4rem); line-height: 1;
      background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease infinite;
      filter: drop-shadow(0 0 14px rgba(255, 0, 255, 0.45));
      transform: rotate(-3deg);
    }
    @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .subtitle { font-size: clamp(0.9rem, 2.6vw, 1.2rem); color: #9a9aac; letter-spacing: 4px; margin-top: 6px; }

    .status {
      position: fixed; top: 52px; left: 14px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      font-size: 1rem; letter-spacing: 2px; color: #7ff;
      background: var(--panel); border: 1px solid var(--line);
      padding: 5px 12px; border-radius: 20px;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .status.live .dot { background: #0f6; box-shadow: 0 0 8px #0f6; animation: pulseDot 1.6s ease-in-out infinite; }
    .status.off { color: #aaa; }
    @keyframes pulseDot { 50% { opacity: 0.4; } }

    .spray-cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 95; will-change: transform; }
    .spray-ring { border: 2px dashed rgba(255, 255, 255, 0.6); border-radius: 50%; transform: translate(-50%, -50%); }
    .spraying .spray-ring { border-style: solid; }

    /* Other artists live inside the wall so they slide and scale with it */
    .other-cursor { position: absolute; pointer-events: none; transition: left 0.08s linear, top 0.08s linear; }
    .other-cursor-ring { border: 3px solid; border-radius: 50%; opacity: 0.75; transform: translate(-50%, -50%); }
    .other-cursor-name {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      transform: translate(-50%, 14px) scale(var(--inv, 1)); transform-origin: 50% 0;
      font-size: 15px; color: #fff; background: rgba(0,0,0,0.65); padding: 2px 8px; border-radius: 4px; letter-spacing: 1px;
    }

    .minimap {
      position: fixed; top: 52px; right: 14px; z-index: 100;
      width: 128px; height: 72px; border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
      background: #000; cursor: pointer; touch-action: none;
    }
    .minimap canvas { width: 100%; height: 100%; display: block; opacity: 0.85; }
    .minimap .view { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 999px rgba(0,0,0,0.35); pointer-events: none; }

    .toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 20px; z-index: 120; font-size: 1.2rem; letter-spacing: 2px; color: #eee;
      pointer-events: none; transition: opacity 0.4s; text-align: center;
    }
    .toast.fade { opacity: 0; }
    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      .toolbar { padding: 8px 10px; gap: 6px; border-radius: 22px; }
      .group { gap: 6px; }
      .color-btn { width: 30px; height: 30px; }
      .size-btn, .tool-btn { width: 34px; height: 34px; }
      .divider { display: none; }
      .minimap { width: 96px; height: 54px; }
      .header { top: 96px; }
    }
    @media (hover: none) { .spray-cursor { display: none; } .viewport { cursor: default; } }
    @media (prefers-reduced-motion: reduce) { .title, .status.live .dot, .toolbar { animation: none; } }

<body>
  <div class="viewport" id="viewport">
    <div id="wall">
      <canvas id="wallCanvas" width="1920" height="1080" role="img" aria-label="Shared graffiti wall"></canvas>
    </div>
  </div>

  <div class="header" id="header">
    <h1 class="title">GRAFFITI WALL</h1>
    <p class="subtitle">ONE WALL · EVERYONE ONLINE</p>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">connecting…</span></div>

  <div class="minimap" id="minimap" hidden aria-hidden="true"><canvas id="miniCanvas" width="192" height="108"></canvas><div class="view" id="miniView"></div></div>

  <div class="toolbar" role="toolbar" aria-label="Spray can">
    <div class="group" id="colors">
      <button class="color-btn" style="--c:#ff00ff" data-color="#ff00ff" aria-label="Magenta" aria-pressed="true"></button>
      <button class="color-btn" style="--c:#00ffff" data-color="#00ffff" aria-label="Cyan" aria-pressed="false"></button>
      <button class="color-btn" style="--c:#ffff00" data-color="#ffff00" aria-label="Yellow" aria-pressed="false"></button>
      <button class="color-btn" style="--c:#ff3300" data-color="#ff3300" aria-label="Red" aria-pressed="false"></button>
      <button class="color-btn" style="--c:#00ff66" data-color="#00ff66" aria-label="Green" aria-pressed="false"></button>
      <button class="color-btn" style="--c:#ff66cc" data-color="#ff66cc" aria-label="Pink" aria-pressed="false"></button>
      <button class="color-btn" style="--c:#ffffff" data-color="#ffffff" aria-label="White" aria-pressed="false"></button>
    </div>
    <div class="divider"></div>
    <div class="group" id="sizes">
      <button class="size-btn" data-size="15" aria-label="Thin spray" aria-pressed="false"><span class="size-dot" style="width:6px;height:6px"></span></button>
      <button class="size-btn" data-size="30" aria-label="Medium spray" aria-pressed="true"><span class="size-dot" style="width:12px;height:12px"></span></button>
      <button class="size-btn" data-size="55" aria-label="Fat spray" aria-pressed="false"><span class="size-dot" style="width:19px;height:19px"></span></button>
      <button class="tool-btn" id="saveBtn" aria-label="Save the wall as a picture">💾</button>
    </div>
  </div>

  <div class="spray-cursor" id="sprayCursor"><div class="spray-ring" id="sprayRing"></div></div>
  <div class="toast" id="toast" hidden></div>

<script type="module">
  const WW = 1920, WH = 1080;
  const $ = id => document.getElementById(id);
  const viewport = $('viewport'), wallEl = $('wall'), canvas = $('wallCanvas');
  const ctx = canvas.getContext('2d');
  const header = $('header'), sprayCursor = $('sprayCursor'), sprayRing = $('sprayRing');
  const COLORS = ['#ff00ff', '#00ffff', '#ffff00', '#ff3300', '#00ff66', '#ff66cc', '#ffffff'];

  let currentColor = '#ff00ff', brushSize = 30;
  let scale = 1, panX = 0, panY = 0, pannable = false;

  // ---------- The wall ----------
  function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function drawBricks() {
    const rnd = seeded(42);
    const g = ctx.createLinearGradient(0, 0, 0, WH);
    g.addColorStop(0, '#1b1a26'); g.addColorStop(1, '#0c0b12');
    ctx.fillStyle = g; ctx.fillRect(0, 0, WW, WH);
    const BW = 96, BH = 40;
    for (let row = 0; row * BH < WH; row++) {
      const off = row % 2 ? BW / 2 : 0;
      for (let x = -off; x < WW; x += BW) {
        const l = 9 + rnd() * 7;
        ctx.fillStyle = `hsl(${250 + rnd() * 25}, 12%, ${l}%)`;
        ctx.fillRect(x + 3, row * BH + 3, BW - 6, BH - 6);
        ctx.fillStyle = 'rgba(255,255,255,0.025)';
        ctx.fillRect(x + 3, row * BH + 3, BW - 6, 3);
      }
    }
    for (let i = 0; i < 9000; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rnd() * 0.035})`;
      ctx.fillRect(rnd() * WW, rnd() * WH, 1.5, 1.5);
    }
    const v = ctx.createRadialGradient(WW / 2, WH / 2, WH * 0.35, WW / 2, WH / 2, WW * 0.65);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, WW, WH);
  }

  function rgba(hex, a) {
    return `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  }
  // One puff of spray at a wall point
  function puff(x, y, color, size) {
    const n = Math.round(size * 1.6);
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = (Math.random() + Math.random()) * size * 0.5;
      const px = x + Math.cos(ang) * r, py = y + Math.sin(ang) * r;
      const a = Math.max(0, 1 - r / size) * 0.3;
      ctx.fillStyle = rgba(color, a);
      ctx.beginPath(); ctx.arc(px, py, Math.random() * 3 + 1, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(x, y, 0, x, y, size * 0.3);
    g.addColorStop(0, rgba(color, 0.1)); g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, size * 0.3, 0, Math.PI * 2); ctx.fill();
  }
  // Spray along a segment; returns the evenly spaced points it painted (these are what we save)
  function sprayLine(x1, y1, x2, y2, color, size, first) {
    const step = Math.max(4, size * 0.3);
    const d = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(1, Math.ceil(d / step));
    const pts = [];
    for (let i = first ? 0 : 1; i <= n; i++) {
      const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n;
      puff(x, y, color, size);
      pts.push(x, y);
    }
    return pts;
  }

  // Anything from the network gets checked before it touches the wall
  const okColor = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
  const clampSize = s => Math.max(5, Math.min(60, Number(s) || 30));
  const inWall = (x, y) => Number.isFinite(x) && Number.isFinite(y) && x > -80 && y > -80 && x < WW + 80 && y < WH + 80;

  // ---------- Fit and slide ----------
  function layout() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const contain = Math.min(vw / WW, vh / WH), cover = Math.max(vw / WW, vh / WH);
    // Landscape screens see the whole wall; tall phones zoom in and slide
    scale = Math.max(contain, Math.min(cover, 0.5));
    clampPan();
    pannable = WW * scale > vw + 1 || WH * scale > vh + 1;
    $('minimap').hidden = !pannable;
    wallEl.style.setProperty('--inv', (1 / scale).toFixed(3));
    sprayRing.style.width = sprayRing.style.height = brushSize * scale + 'px';
    updateMiniView();
  }
  function clampPan() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight, sw = WW * scale, sh = WH * scale;
    panX = sw <= vw ? (vw - sw) / 2 : Math.min(0, Math.max(vw - sw, panX));
    panY = sh <= vh ? (vh - sh) / 2 : Math.min(0, Math.max(vh - sh, panY));
    wallEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }
  function centerOn(wx, wy) {
    panX = viewport.clientWidth / 2 - wx * scale;
    panY = viewport.clientHeight / 2 - wy * scale;
    clampPan(); updateMiniView();
  }
  const toWall = (cx, cy) => ({ x: (cx - panX) / scale, y: (cy - panY) / scale });

  // ---------- Minimap (only when the wall is bigger than the screen) ----------
  const mini = $('miniCanvas').getContext('2d');
  function updateMiniView() {
    if (!pannable) return;
    const mm = $('minimap'), k = mm.clientWidth / WW, v = $('miniView');
    v.style.left = (-panX / scale) * k + 'px';
    v.style.top = (-panY / scale) * k + 'px';
    v.style.width = viewport.clientWidth / scale * k + 'px';
    v.style.height = viewport.clientHeight / scale * k + 'px';
  }
  function refreshMini() { if (pannable) mini.drawImage(canvas, 0, 0, 192, 108); }
  setInterval(refreshMini, 1200);
  function miniJump(e) {
    const r = $('minimap').getBoundingClientRect();
    centerOn((e.clientX - r.left) / r.width * WW, (e.clientY - r.top) / r.height * WH);
  }
  $('minimap').addEventListener('pointerdown', e => { miniJump(e); $('minimap').setPointerCapture?.(e.pointerId); });
  $('minimap').addEventListener('pointermove', e => { if (e.buttons) miniJump(e); });

  // ---------- Drawing: one finger / mouse sprays, two fingers or right-drag slide ----------
  const pointers = new Map();
  let drawing = null, panning = null, strokeNo = 0, hintShown = false;

  function setCursor(cx, cy) { sprayCursor.style.transform = `translate(${cx}px, ${cy}px)`; }
  function beginStroke(e) {
    const p = toWall(e.clientX, e.clientY);
    drawing = { id: e.pointerId, x: p.x, y: p.y };
    strokeNo++;
    const pts = sprayLine(p.x, p.y, p.x, p.y, currentColor, brushSize, true);
    queue(pts, true);
    sprayCursor.classList.add('spraying');
    header.classList.add('hidden');
  }
  function endStroke() { drawing = null; sprayCursor.classList.remove('spraying'); flushLive(); }
  function startPan() {
    if (drawing) endStroke();
    const pts = [...pointers.values()];
    const mx = pts.reduce((s, p) => s + p.x, 0) / pts.length, my = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    panning = { mx, my, px: panX, py: panY };
  }

  viewport.addEventListener('pointerdown', e => {
    try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    setCursor(e.clientX, e.clientY);
    if (e.pointerType === 'mouse' && e.button !== 0) { startPan(); return; }
    if (pointers.size >= 2) { startPan(); return; }
    beginStroke(e);
    if (offline && !warned) { warned = true; toast("you're offline · only you can see this paint", 2600); }
    else if (pannable && e.pointerType === 'touch' && !hintShown) { hintShown = true; toast('two fingers slide the wall', 2600); }
  });
  viewport.addEventListener('pointermove', e => {
    setCursor(e.clientX, e.clientY);
    sendCursor(e.clientX, e.clientY);
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (panning) {
      const pts = [...pointers.values()];
      const mx = pts.reduce((s, p) => s + p.x, 0) / pts.length, my = pts.reduce((s, p) => s + p.y, 0) / pts.length;
      panX = panning.px + (mx - panning.mx); panY = panning.py + (my - panning.my);
      clampPan(); updateMiniView();
      return;
    }
    if (drawing && drawing.id === e.pointerId) {
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (evs.length ? evs : [e])) {
        const p = toWall(ev.clientX, ev.clientY);
        if (Math.hypot(p.x - drawing.x, p.y - drawing.y) < Math.max(4, brushSize * 0.3)) continue;
        queue(sprayLine(drawing.x, drawing.y, p.x, p.y, currentColor, brushSize, false), false);
        drawing.x = p.x; drawing.y = p.y;
      }
    }
  });
  function pointerGone(e) {
    pointers.delete(e.pointerId);
    if (drawing && drawing.id === e.pointerId) endStroke();
    if (panning) { if (pointers.size === 0) panning = null; else startPan(); }
  }
  viewport.addEventListener('pointerup', pointerGone);
  viewport.addEventListener('pointercancel', pointerGone);
  viewport.addEventListener('contextmenu', e => e.preventDefault());
  viewport.addEventListener('wheel', e => {
    if (!pannable) return;
    e.preventDefault();
    panX -= e.shiftKey ? e.deltaY : e.deltaX; panY -= e.shiftKey ? 0 : e.deltaY;
    clampPan(); updateMiniView();
  }, { passive: false });
  viewport.addEventListener('pointerleave', () => { sprayCursor.hidden = true; });
  viewport.addEventListener('pointerenter', () => { sprayCursor.hidden = false; });

  // ---------- Toolbar ----------
  function pick(group, btn) {
    group.querySelectorAll('button[aria-pressed]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  }
  $('colors').addEventListener('click', e => {
    const b = e.target.closest('.color-btn'); if (!b) return;
    currentColor = b.dataset.color; pick($('colors'), b);
    sprayRing.style.borderColor = currentColor;
    document.documentElement.style.setProperty('--ink', currentColor);
  });
  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('.size-btn'); if (!b) return;
    brushSize = +b.dataset.size; pick($('sizes'), b);
    sprayRing.style.width = sprayRing.style.height = brushSize * scale + 'px';
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 7) $('colors').children[n - 1].click();
    if (e.key === '[' || e.key === ']') {
      const sizes = [...$('sizes').querySelectorAll('.size-btn')];
      const i = sizes.findIndex(b => b.getAttribute('aria-pressed') === 'true');
      sizes[Math.max(0, Math.min(2, i + (e.key === ']' ? 1 : -1)))].click();
    }
  });
  $('saveBtn').addEventListener('click', () => {
    try {
      const a = document.createElement('a');
      a.download = 'graffiti-wall-' + new Date().toISOString().slice(0, 10) + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('saved 📸', 1400);
    } catch (err) { toast("couldn't save the picture", 2200); }
  });

  let toastT = 0;
  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.hidden = false; t.classList.remove('fade');
    clearTimeout(toastT); toastT = setTimeout(() => { t.classList.add('fade'); setTimeout(() => { t.hidden = true; }, 400); }, ms || 2000);
  }
  function setStatus(text, mode) {
    $('statusText').textContent = text;
    $('status').className = 'status' + (mode ? ' ' + mode : '');
  }

  // ---------- Sync: live broadcast + saved strokes ----------
  const myId = 'a' + Math.random().toString(36).slice(2, 10);
  const ADJ = ['Neon', 'Cyber', 'Rad', 'Funky', 'Wild', 'Cosmic', 'Electric', 'Mystic', 'Urban', 'Shadow'];
  const NOUN = ['Painter', 'Bomber', 'Artist', 'Sprayer', 'Writer', 'Creator', 'Vandal', 'Master', 'Wizard', 'Ghost'];
  const myName = ADJ[Math.random() * 10 | 0] + NOUN[Math.random() * 10 | 0];
  let db = null, userId = null, channel = null, live = false;
  let liveBuf = [], liveStroke = 0, saveBuf = [];

  function queue(pts, fresh) {
    for (let i = 0; i < pts.length; i += 2) {
      const x = Math.round(pts[i]), y = Math.round(pts[i + 1]);
      liveBuf.push(x, y);
      saveBuf.push({ x, y, color: currentColor, size: brushSize });
    }
    if (saveBuf.length > 6000) saveBuf.splice(0, saveBuf.length - 6000);
    if (fresh) liveStroke = strokeNo;
  }
  function flushLive() {
    if (!liveBuf.length) return;
    if (channel && live) channel.send({ type: 'broadcast', event: 'paint', payload: { a: myId, s: liveStroke, c: currentColor, z: brushSize, p: liveBuf } });
    liveBuf = [];
  }
  setInterval(flushLive, 60);
  async function flushSave() {
    if (!db || !userId || !saveBuf.length) return;
    const rows = saveBuf.splice(0, 400).map(r => ({ ...r, artist_name: myName, user_id: userId }));
    const { error } = await db.from('graffiti_strokes').insert(rows);
    if (error) { console.warn('save failed', error.message); saveBuf = rows.map(({ x, y, color, size }) => ({ x, y, color, size })).concat(saveBuf).slice(0, 4000); }
  }
  setInterval(flushSave, 900);
  window.addEventListener('pagehide', flushSave);

  let lastCursorAt = 0;
  function sendCursor(cx, cy) {
    if (!channel || !live) return;
    const now = performance.now();
    if (now - lastCursorAt < 70) return;
    lastCursorAt = now;
    const p = toWall(cx, cy);
    channel.send({ type: 'broadcast', event: 'cursor', payload: { a: myId, n: myName, x: Math.round(p.x), y: Math.round(p.y), c: currentColor, z: brushSize } });
  }

  const others = {}, otherLast = {};
  function paintRemote(d) {
    if (!d || d.a === myId || !okColor(d.c) || !Array.isArray(d.p)) return;
    const size = clampSize(d.z), p = d.p.slice(0, 2000);
    let prev = otherLast[d.a] && otherLast[d.a].s === d.s ? otherLast[d.a] : null;
    for (let i = 0; i + 1 < p.length; i += 2) {
      const x = +p[i], y = +p[i + 1];
      if (!inWall(x, y)) continue;
      if (prev) sprayLine(prev.x, prev.y, x, y, d.c, size, false); else puff(x, y, d.c, size);
      prev = { s: d.s, x, y };
    }
    if (prev) otherLast[d.a] = prev;
  }
  function moveOther(d) {
    if (!d || d.a === myId || !inWall(+d.x, +d.y)) return;
    let el = others[d.a];
    if (!el) {
      el = document.createElement('div'); el.className = 'other-cursor';
      el.innerHTML = '<div class="other-cursor-ring"></div><div class="other-cursor-name"></div>';
      wallEl.appendChild(el); others[d.a] = el;
    }
    el.querySelector('.other-cursor-name').textContent = String(d.n || '').slice(0, 24);
    el.style.left = +d.x + 'px'; el.style.top = +d.y + 'px';
    const ring = el.querySelector('.other-cursor-ring'), z = clampSize(d.z);
    ring.style.width = ring.style.height = z + 'px';
    if (okColor(d.c)) ring.style.borderColor = d.c;
    el.dataset.seen = Date.now();
  }
  setInterval(() => { for (const id in others) if (Date.now() - others[id].dataset.seen > 8000) { others[id].remove(); delete others[id]; } }, 3000);

  async function loadWall() {
    setStatus('loading the wall…', 'live');
    const PAGE = 1000, MAX = 30000;
    let rows = [];
    for (let from = 0; from < MAX; from += PAGE) {
      const { data, error } = await db.from('graffiti_strokes').select('x,y,color,size').order('created_at', { ascending: false }).range(from, from + PAGE - 1);
      if (error) { toast("couldn't load older paint — live painting still works", 3200); break; }
      rows = rows.concat(data || []);
      if (!data || data.length < PAGE) break;
    }
    rows.reverse();
    if (rows.length) header.classList.add('hidden');
    // Paint in slices so the page never freezes on a busy wall
    let i = 0;
    await new Promise(done => {
      (function slice() {
        const end = Math.min(rows.length, i + 1500);
        for (; i < end; i++) {
          const r = rows[i];
          if (okColor(r.color) && inWall(r.x, r.y)) puff(r.x, r.y, r.color, clampSize(r.size));
        }
        if (i < rows.length) requestAnimationFrame(slice); else done();
      })();
    });
    refreshMini();
    return rows.length;
  }

  let offline = false, warned = false;
  function goOffline() { offline = true; live = false; setStatus('offline', 'off'); $('status').title = 'Not connected: only you can see new paint'; }
  function setCount(n) { setStatus(n + (n === 1 ? ' artist here' : ' artists here'), 'live'); }

  async function connect() {
    try {
      const mod = await import('/supabase-config-fixed.js');
      db = mod.default;
      try { const s = await mod.supabaseSession(); userId = s.user.id; } catch (e) { console.warn('no session', e.message); }
      channel = db.channel('graffiti-wall-v2', { config: { presence: { key: myId }, broadcast: { self: false } } });
      channel.on('broadcast', { event: 'paint' }, m => paintRemote(m.payload));
      channel.on('broadcast', { event: 'cursor' }, m => moveOther(m.payload));
      channel.on('presence', { event: 'sync' }, () => setCount(Object.keys(channel.presenceState()).length));
      channel.subscribe(status => {
        if (status === 'SUBSCRIBED') { live = true; channel.track({ id: myId, name: myName }); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { live = false; goOffline(); }
      });
      await loadWall();
      if (live) setCount(Object.keys(channel.presenceState()).length || 1);
      else if (!userId) goOffline();
      else setStatus('joining…', 'live');
    } catch (e) {
      console.warn('graffiti offline', e);
      goOffline();
    }
  }

  // ---------- Go ----------
  drawBricks();
  sprayRing.style.borderColor = currentColor;
  layout();
  centerOn(WW / 2, WH / 2);
  window.addEventListener('resize', layout);
  setTimeout(() => header.classList.add('hidden'), 6000);
  if (!window.__gwTest) connect(); else goOffline();
  window.__gw = { get state() { return { scale, panX, panY, pannable, strokeNo, saveBuf: saveBuf.length, liveBuf: liveBuf.length, color: currentColor, size: brushSize }; }, toWall, puff, sprayLine, paintRemote, moveOther, centerOn, layout, others, canvas, queue, set conn(v) { db = v.db; userId = v.userId; channel = v.channel; live = v.live; }, loadWall, flushSave, flushLive };
</script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
