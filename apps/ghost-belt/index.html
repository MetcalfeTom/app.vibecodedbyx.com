<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Belt — a haunted asteroid racer</title>
<meta name="description" content="Race three laps through a haunted asteroid belt: a calm opening lap, then the ghosts wake. Shield and fuel to manage, keyboard controls, accessible feedback.">
<meta property="og:title" content="Ghost Belt — a haunted asteroid racer">
<meta property="og:description" content="Lap one is peaceful. Lap two is not. Manage shield and fuel through the haunted belt.">
<meta property="og:url" content="https://sloppy.live/ghost-belt/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/small%20spaceship%20racing%20through%20glowing%20asteroid%20ring%20with%20ghostly%20wisps%2C%20deep%20violet%20space%2C%20retro%20arcade%20illustration?width=1200&height=630&seed=1313&nologo=true&model=flux">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0a16'/%3E%3Cpath d='M8 3 L11 11 L8 9.4 L5 11 Z' fill='%237fd4c9'/%3E%3Ccircle cx='12.5' cy='4.5' r='2' fill='%23b9a8e8' opacity='.8'/%3E%3Ccircle cx='12' cy='4.2' r='.5' fill='%230c0a16'/%3E%3C/svg%3E">
<style>
:root{
  --void:#0c0a16; --panel:#161226; --line:#2c2544;
  --ink:#eae6f5; --ink2:#9a91b3;
  --teal:#7fd4c9; --ghost:#b9a8e8; --danger:#e86a5a; --fuel:#e8c05a;
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
  background:
    radial-gradient(34rem 22rem at 15% -8%, rgba(185,168,232,.08), transparent 60%),
    radial-gradient(30rem 20rem at 90% 108%, rgba(127,212,201,.07), transparent 60%),
    var(--void);
  display:flex; flex-direction:column; align-items:center;
  padding:1rem .7rem 2.2rem;
}
main{ width:100%; max-width:42rem; display:flex; flex-direction:column; gap:.6rem; }
header{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
h1{ margin:0; font-size:1.5rem; color:var(--ghost); text-shadow:0 0 1.1rem rgba(185,168,232,.5); }
h1 .t{ color:var(--teal); text-shadow:0 0 1.1rem rgba(127,212,201,.5); }
#lapinfo{ margin-left:auto; font-size:.82rem; color:var(--ink2); }
#lapinfo b{ color:var(--ink); }
#race{
  width:100%; aspect-ratio:640/460; display:block;
  background:var(--panel); border:2px solid var(--line); border-radius:.8rem;
}
/* meters */
#meters{ display:flex; gap:.9rem; flex-wrap:wrap; }
.meter{ flex:1; min-width:12rem; }
.meter label{ font-size:.7rem; color:var(--ink2); letter-spacing:.12em; text-transform:uppercase; }
.mtrack{ height:.8rem; background:#0a0812; border:1px solid var(--line); border-radius:.4rem; overflow:hidden; margin-top:.2rem; }
.mfill{ height:100%; border-radius:.35rem; transition:width .15s linear; }
#shieldfill{ background:var(--teal); }
#fuelfill{ background:var(--fuel); }
.mtrack.low .mfill{ background:var(--danger); }
#status{ font-size:.78rem; color:var(--ink2); min-height:1.15rem; margin:0; }
#status.warn{ color:var(--danger); font-weight:700; }
#controls{ display:flex; gap:.5rem; flex-wrap:wrap; }
#controls button{
  font-family:inherit; font-size:.75rem; font-weight:700; min-height:2.75rem;
  padding:.4rem .8rem; border-radius:.6rem; cursor:pointer;
  background:transparent; color:var(--ink); border:2px solid var(--line);
}
#controls button:hover{ border-color:var(--teal); }
#controls button:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
#keys{ font-size:.68rem; color:var(--ink2); line-height:1.7; }
#keys kbd{ border:1px solid var(--line); border-radius:.3rem; padding:.05rem .35rem; background:var(--panel); font-family:inherit; }
#touchpads{ display:none; }
@media (pointer:coarse){
  #touchpads{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  #touchpads button{
    min-height:3.4rem; font-family:inherit; font-weight:700; font-size:.85rem;
    background:transparent; color:var(--ink); border:2px solid var(--line); border-radius:.7rem;
  }
  #touchpads button:active{ border-color:var(--ghost); color:var(--ghost); }
}
footer{ text-align:center; font-size:.68rem; color:var(--ink2); margin-top:.3rem; line-height:1.7; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
<header>
  <h1>GHOST<span class="t">·</span>BELT</h1>
  <div id="lapinfo">lap <b id="lap">1</b>/3 · <b id="time">0.0</b>s · best <b id="best">—</b></div>
</header>

<canvas id="race" width="640" height="460" role="application"
  aria-label="Asteroid racer. Left and right arrows steer, up arrow thrusts, R resets, M mutes. Lap one is calm; ghosts wake on lap two."></canvas>

<div id="meters">
  <div class="meter"><label for="shieldbar">shield</label>
    <div class="mtrack" id="shieldtrack"><div class="mfill" id="shieldfill" style="width:100%"></div></div>
    <span id="shieldbar" class="sr" role="status" aria-live="off"></span>
  </div>
  <div class="meter"><label for="fuelbar">fuel</label>
    <div class="mtrack" id="fueltrack"><div class="mfill" id="fuelfill" style="width:100%"></div></div>
    <span id="fuelbar" class="sr" role="status" aria-live="off"></span>
  </div>
</div>
<p id="status" role="status" aria-live="polite">a calm first lap awaits — the ghosts are still asleep. thrust when ready.</p>

<div id="touchpads">
  <button type="button" id="t-left" aria-label="Steer left">◀ turn</button>
  <button type="button" id="t-thrust" aria-label="Thrust">▲ thrust</button>
  <button type="button" id="t-right" aria-label="Steer right">turn ▶</button>
</div>

<div id="controls">
  <button type="button" id="reset">↺ restart race</button>
  <button type="button" id="mute" aria-pressed="false">♪ sound: on</button>
</div>
<p id="keys"><kbd>←→</kbd> steer · <kbd>↑</kbd> thrust · <kbd>R</kbd> restart · <kbd>M</kbd> mute</p>

<footer>drawn and synthesized in-page — no external assets · vote on sloppy.live if the ghosts got you<br>
<span id="buildstamp" role="note" aria-label="Build information" style="font-size:.62rem;opacity:.65;">build v1.0 · 2026-08-19 · 7bb3792ab</span></footer>
</main>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var cv=$('race'), cx=cv.getContext('2d');
var KEY='ghost-belt-best-v1';
var W=640, H=460, CXc=320, CYc=230, RX=240, RY=150;

var GATES=[0, Math.PI/2, Math.PI, Math.PI*1.5].map(function(a,i){
  return { a:a, x:CXc+Math.cos(a)*RX, y:CYc+Math.sin(a)*RY, i:i };
});
function seededPoly(n, r, seed){
  var pts=[];
  for(var i=0;i<n;i++){
    var jitter=0.72+((seed*31+i*57)%100)/100*0.55;
    pts.push([Math.cos(i/n*7)*r*jitter, Math.sin(i/n*7)*r*jitter]);
  }
  return pts;
}
var G={};
function reset(){
  G={
    ship:{ x:GATES[0].x, y:GATES[0].y, a:-Math.PI/2, vx:0, vy:0 },
    keys:{ left:false, right:false, thrust:false },
    shield:100, fuel:100, lap:1, nextGate:1, t:0, done:false,
    iframe:0, penalty:0, lastCk:GATES[0], muted:G.muted||false,
    asteroids:[], ghosts:[], said:{}, best:+localStorage.getItem(KEY)||0
  };
  for(var i=0;i<9;i++){
    var ang=i/9*Math.PI*2+0.35;
    var rr= (i%2? 1.32 : 0.62);
    G.asteroids.push({
      x:CXc+Math.cos(ang)*RX*rr, y:CYc+Math.sin(ang)*RY*rr,
      vx:(Math.random()-0.5)*22, vy:(Math.random()-0.5)*22,
      r:11+Math.random()*10, poly:seededPoly(8, 1, i*7+3), spin:Math.random()*2
    });
  }
  for(var g=0;g<3;g++){
    G.ghosts.push({ x:CXc+(g-1)*160, y:CYc, phase:g*2.1, awake:false });
  }
  hud(); say('a calm first lap awaits — the ghosts are still asleep. thrust when ready.');
}

/* ── audio ── */
function tone(f, dur, type, vol){
  if(G.muted) return;
  try{
    var a=tone.ac||(tone.ac=new (window.AudioContext||window.webkitAudioContext)());
    var o=a.createOscillator(), gn=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f, a.currentTime);
    gn.gain.setValueAtTime(vol||0.04, a.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(gn); gn.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.02);
  }catch(e){}
}

/* ── sim ── */
function step(dt){
  if(G.done) return;
  G.t+=dt;
  var s=G.ship;
  if(G.keys.left) s.a-=2.6*dt;
  if(G.keys.right) s.a+=2.6*dt;
  if(G.keys.thrust && G.fuel>0){
    s.vx+=Math.cos(s.a)*170*dt;
    s.vy+=Math.sin(s.a)*170*dt;
    G.fuel=Math.max(0, G.fuel-9*dt);
  }else{
    G.fuel=Math.min(100, G.fuel+3.5*dt);   /* slow trickle — drifting refuels, no softlock */
  }
  var drag=Math.pow(0.55, dt);
  s.vx*=drag; s.vy*=drag;
  s.x+=s.vx*dt; s.y+=s.vy*dt;
  if(s.x<8) s.x=8; if(s.x>W-8) s.x=W-8;
  if(s.y<8) s.y=8; if(s.y>H-8) s.y=H-8;
  if(G.iframe>0) G.iframe-=dt;
  G.shield=Math.min(100, G.shield+1.6*dt);

  G.asteroids.forEach(function(ast){
    var speedMul=G.lap===1? 0.35 : 1;
    ast.x+=ast.vx*speedMul*dt; ast.y+=ast.vy*speedMul*dt;
    if(ast.x<-20) ast.x=W+20; if(ast.x>W+20) ast.x=-20;
    if(ast.y<-20) ast.y=H+20; if(ast.y>H+20) ast.y=-20;
    ast.spin+=dt*0.6;
    var d=Math.hypot(s.x-ast.x, s.y-ast.y);
    if(d<ast.r+8 && G.iframe<=0){
      hitShield(20, 'asteroid strike');
      var nx=(s.x-ast.x)/d, ny=(s.y-ast.y)/d;
      s.vx+=nx*180; s.vy+=ny*180;
      tone(110, 0.25, 'sawtooth', 0.06);
    }
  });
  G.ghosts.forEach(function(gh){
    gh.phase+=dt;
    gh.awake=G.lap>=2;
    if(gh.awake){
      var vis=(Math.sin(gh.phase*0.9)+1)/2;
      var dx=s.x-gh.x, dy=s.y-gh.y, d=Math.hypot(dx,dy)||1;
      gh.x+=dx/d*26*dt; gh.y+=dy/d*26*dt;
      if(vis>0.55 && d<22 && G.iframe<=0){
        hitShield(12, 'a ghost passed through you');
        tone(660, 0.5, 'sine', 0.05);
        tone(590, 0.6, 'sine', 0.04);
      }
    }
  });

  /* gates */
  var gate=GATES[G.nextGate];
  if(Math.hypot(s.x-gate.x, s.y-gate.y)<34){
    G.lastCk=gate;
    G.nextGate=(G.nextGate+1)%4;
    tone(520+G.nextGate*60, 0.12, 'triangle', 0.05);
    if(G.nextGate===1){
      G.lap++;
      if(G.lap===2) say('lap 2 — the belt wakes. ghosts drift toward you; they are touchable only while bright.');
      else if(G.lap===3) say('final lap — hold your line.');
      if(G.lap>3){
        G.done=true;
        var total=Math.round((G.t+G.penalty)*10)/10;
        var isBest=!G.best||total<G.best;
        if(isBest){ G.best=total; try{ localStorage.setItem(KEY, String(total)); }catch(e){} }
        say('finished in '+total+'s'+(G.penalty? ' (incl. '+G.penalty+'s penalties)':'')+
          (isBest? ' — a new best. the ghosts are impressed.':' — best remains '+G.best+'s.'));
        tone(523,0.15,'triangle',0.06); tone(659,0.15,'triangle',0.06); tone(784,0.3,'triangle',0.06);
      }
    }
  }
  hud();
}
function hitShield(dmg, why){
  G.shield-=dmg;
  G.iframe=1.0;
  if(G.shield<=0){
    G.penalty+=5;
    G.shield=100; G.fuel=100;
    G.ship.x=G.lastCk.x; G.ship.y=G.lastCk.y;
    G.ship.vx=0; G.ship.vy=0;
    say('shield down ('+why+') — back to the last gate, +5s penalty. meters restored.');
    tone(90, 0.5, 'sawtooth', 0.07);
  }else if(G.shield<30 && !G.said.lowShield){
    G.said.lowShield=true;
    say('⚠ shield low — it regenerates if you avoid the rocks.');
  }
}
function say(t){
  $('status').textContent=t;
  $('status').className=/⚠|down/.test(t)? 'warn':'';
}
function hud(){
  $('lap').textContent=Math.min(G.lap,3);
  $('time').textContent=(Math.round((G.t+G.penalty)*10)/10).toFixed(1);
  $('best').textContent=G.best? G.best+'s':'—';
  $('shieldfill').style.width=G.shield+'%';
  $('fuelfill').style.width=G.fuel+'%';
  $('shieldtrack').className='mtrack'+(G.shield<30?' low':'');
  $('fueltrack').className='mtrack'+(G.fuel<25?' low':'');
  if(G.fuel<25 && !G.said.lowFuel){
    G.said.lowFuel=true;
    say('⚠ fuel low — coast a while; drifting trickles fuel back.');
  }
  if(G.fuel>50) G.said.lowFuel=false;
  if(G.shield>60) G.said.lowShield=false;
}

/* ── render ── */
function draw(){
  cx.clearRect(0,0,W,H);
  /* stars */
  cx.fillStyle='rgba(234,230,245,.25)';
  for(var i=0;i<40;i++) cx.fillRect((i*97)%W, (i*61)%H, 1.5, 1.5);
  /* track ring */
  cx.strokeStyle='rgba(127,212,201,.16)'; cx.lineWidth=30;
  cx.beginPath(); cx.ellipse(CXc,CYc,RX,RY,0,0,7); cx.stroke();
  /* gates */
  GATES.forEach(function(g2){
    var next=g2.i===G.nextGate;
    cx.save();
    cx.strokeStyle=next? '#7fd4c9':'#3a3358';
    cx.lineWidth=3;
    if(next){ cx.shadowColor='rgba(127,212,201,.7)'; cx.shadowBlur=10; }
    cx.beginPath(); cx.arc(g2.x, g2.y, 20, 0, 7); cx.stroke();
    cx.fillStyle=next? '#7fd4c9':'#5a527a';
    cx.font='11px ui-monospace, monospace'; cx.textAlign='center';
    cx.fillText(String(g2.i+1), g2.x, g2.y+4);
    cx.restore();
  });
  /* asteroids */
  G.asteroids.forEach(function(ast){
    cx.save();
    cx.translate(ast.x, ast.y); cx.rotate(ast.spin);
    cx.fillStyle='#4a4258'; cx.strokeStyle='#6a6080'; cx.lineWidth=1.5;
    cx.beginPath();
    ast.poly.forEach(function(p2,i2){
      var px=p2[0]*ast.r, py=p2[1]*ast.r;
      if(i2===0) cx.moveTo(px,py); else cx.lineTo(px,py);
    });
    cx.closePath(); cx.fill(); cx.stroke();
    cx.restore();
  });
  /* ghosts */
  G.ghosts.forEach(function(gh){
    var vis=gh.awake? (Math.sin(gh.phase*0.9)+1)/2 : 0.12;
    cx.save();
    cx.globalAlpha=0.15+vis*0.6;
    var grad=cx.createRadialGradient(gh.x,gh.y,2,gh.x,gh.y,18);
    grad.addColorStop(0,'#d8ccf5'); grad.addColorStop(1,'rgba(185,168,232,0)');
    cx.fillStyle=grad;
    cx.beginPath(); cx.arc(gh.x,gh.y,18,0,7); cx.fill();
    if(vis>0.3){
      cx.fillStyle='#1a1430';
      cx.beginPath(); cx.arc(gh.x-5,gh.y-2,2.4,0,7); cx.arc(gh.x+5,gh.y-2,2.4,0,7); cx.fill();
    }
    cx.restore();
  });
  /* ship */
  var s=G.ship;
  cx.save();
  cx.translate(s.x, s.y); cx.rotate(s.a);
  if(G.iframe>0 && Math.floor(G.iframe*10)%2===0) cx.globalAlpha=0.35;
  if(G.keys.thrust && G.fuel>0){
    cx.fillStyle='#e8c05a';
    cx.beginPath(); cx.moveTo(-8,0); cx.lineTo(-16-Math.random()*5,3); cx.lineTo(-16-Math.random()*5,-3); cx.closePath(); cx.fill();
  }
  cx.fillStyle='#7fd4c9';
  cx.shadowColor='rgba(127,212,201,.7)'; cx.shadowBlur=8;
  cx.beginPath(); cx.moveTo(11,0); cx.lineTo(-8,7); cx.lineTo(-4,0); cx.lineTo(-8,-7); cx.closePath(); cx.fill();
  cx.restore();
  if(G.done){
    cx.fillStyle='rgba(12,10,22,.7)'; cx.fillRect(0,0,W,H);
    cx.fillStyle='#b9a8e8'; cx.font='700 30px ui-monospace, monospace'; cx.textAlign='center';
    cx.fillText('RACE COMPLETE', CXc, CYc-10);
    cx.fillStyle='#7fd4c9'; cx.font='700 16px ui-monospace, monospace';
    cx.fillText((Math.round((G.t+G.penalty)*10)/10)+'s · R TO RACE AGAIN', CXc, CYc+22);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000||0.016);
  last=t;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ── input ── */
addEventListener('keydown', function(e){
  if(e.code==='ArrowLeft'){ e.preventDefault(); G.keys.left=true; }
  else if(e.code==='ArrowRight'){ e.preventDefault(); G.keys.right=true; }
  else if(e.code==='ArrowUp'){ e.preventDefault(); G.keys.thrust=true; }
  else if(e.key==='r'||e.key==='R'){ reset(); }
  else if(e.key==='m'||e.key==='M'){ $('mute').click(); }
});
addEventListener('keyup', function(e){
  if(e.code==='ArrowLeft') G.keys.left=false;
  else if(e.code==='ArrowRight') G.keys.right=false;
  else if(e.code==='ArrowUp') G.keys.thrust=false;
});
[['t-left','left'],['t-right','right'],['t-thrust','thrust']].forEach(function(p){
  var el=$(p[0]);
  ['pointerdown','touchstart'].forEach(function(ev){ el.addEventListener(ev, function(e){ e.preventDefault(); G.keys[p[1]]=true; }); });
  ['pointerup','pointercancel','touchend'].forEach(function(ev){ el.addEventListener(ev, function(){ G.keys[p[1]]=false; }); });
});
$('reset').addEventListener('click', reset);
$('mute').addEventListener('click', function(){
  G.muted=!G.muted;
  this.setAttribute('aria-pressed', String(G.muted));
  this.textContent=G.muted? '♪ sound: off':'♪ sound: on';
});

reset();
requestAnimationFrame(loop);
window.__GB={ G:function(){ return G; }, step:step, reset:reset, hitShield:hitShield, GATES:GATES, KEY:KEY };
})();
</script>
</body>
</html>
