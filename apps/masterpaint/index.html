<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterpaint — paint by numbers with the old masters</title>
<meta name="description" content="Paint by numbers at gallery scale: Rembrandt's earthy chiaroscuro, van Gogh's bold impasto, Vermeer's pearl light. Numbered regions, a magnifier, and real historical pigments.">
<link rel="icon" href="https://emojicdn.elk.sh/🎨">
<meta property="og:title" content="Masterpaint — paint by numbers">
<meta property="og:description" content="Three old-master palettes, one numbered canvas at a time. Magnifier included.">
<meta property="og:url" content="https://sloppy.live/masterpaint/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/paint%20by%20numbers%20canvas%20half%20painted%20showing%20a%20starry%20night%20swirl%2C%20numbered%20regions%2C%20artist%20palette%20with%20brushes%2C%20magnifying%20glass%2C%20warm%20gallery%20light%2C%20oil%20painting%20texture?width=1200&height=630&nologo=true&seed=1642&model=flux&format=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#efe7d8; --wall2:#e2d6c0; --ink:#2e2618; --frame:#8a6a3a; --frame2:#b08a4a;
  --parch:#f4edda; --accent:#8a2f1f;
}
html{ font-size:100%; }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; color:var(--ink); font-family:'Crimson Pro', serif;
  background:
    radial-gradient(46rem 20rem at 55% -4%, rgba(255,250,235,.9), transparent 60%),
    linear-gradient(180deg, var(--wall) 0%, var(--wall2) 100%);
}
.app{ display:grid; grid-template-columns:17rem minmax(0,1fr); gap:1.2rem; max-width:78rem; margin:0 auto; padding:1.2rem 1rem 3rem; }
@media (max-width:52rem){ .app{ grid-template-columns:1fr; } .side{ position:static; } }
/* ── sidebar ── */
.side{ position:sticky; top:.8rem; align-self:start; }
.side h1{
  font-family:'Italiana', serif; font-weight:400; font-size:1.9rem; letter-spacing:.12em; text-align:center;
}
.side .tag{ font-style:italic; color:#6a5c40; font-size:.85rem; text-align:center; margin-bottom:.8rem; }
.artist{
  background:rgba(255,252,242,.8); border:1px solid var(--frame); border-radius:.6rem;
  padding:.7rem .8rem; margin-bottom:.7rem; box-shadow:0 3px 10px rgba(60,40,10,.12);
}
.artist h2{ font-family:'Italiana', serif; font-weight:400; font-size:1.15rem; letter-spacing:.08em; }
.artist .style{ font-style:italic; font-size:.78rem; color:#6a5c40; margin-bottom:.45rem; }
.artist.current{ outline:2px solid var(--accent); outline-offset:2px; }
.sws{ display:grid; grid-template-columns:repeat(4,1fr); gap:.35rem; }
.sw{
  position:relative; border-radius:.4rem; cursor:pointer; border:1.5px solid rgba(46,38,24,.5);
  font-family:'Crimson Pro', serif; min-height:2.75rem; padding:.15rem;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.75); background:none;
}
.sw .num{ font-size:1rem; font-weight:600; line-height:1; }
.sw .left{ font-size:.58rem; opacity:.95; min-height:.7rem; }
.sw.sel{ outline:.2rem solid var(--accent); outline-offset:1px; }
.sw.done{ opacity:.4; }
.sw.flash{ animation:swflash .4s ease; }
@keyframes swflash{ 30%{ box-shadow:0 0 0 5px rgba(138,47,31,.65);} }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.pigname{ font-style:italic; font-size:.85rem; color:#6a5c40; min-height:1.1rem; text-align:center; margin:.2rem 0 .6rem; }
/* magnifier */
.lensbox{ background:rgba(255,252,242,.8); border:1px solid var(--frame); border-radius:.6rem; padding:.6rem; text-align:center; }
.lensbox h3{ font-family:'Italiana', serif; font-weight:400; font-size:.95rem; letter-spacing:.14em; margin-bottom:.4rem; }
canvas#lens{ display:block; margin:0 auto; background:var(--parch); border:1px solid rgba(46,38,24,.4); border-radius:.3rem; width:100%; max-width:12rem; height:auto; }
.lensbox .hint{ font-size:.72rem; font-style:italic; color:#6a5c40; margin-top:.35rem; }
/* ── main ── */
.mainpane{ text-align:center; min-width:0; }
.workline{ font-style:italic; font-size:.95rem; color:#6a5c40; min-height:1.3rem; margin-bottom:.6rem; }
.easel{ display:inline-block; padding:.8rem; max-width:100%;
  background:linear-gradient(135deg, var(--frame2), var(--frame) 40%, #6a4c24 100%);
  border-radius:.4rem; box-shadow:0 10px 30px rgba(60,40,10,.35), inset 0 0 0 2px rgba(255,235,200,.25);
}
.scrollwrap{ overflow:auto; max-height:78vh; border-radius:.15rem; }
canvas#board{ display:block; background:var(--parch); cursor:crosshair; }
canvas#board.shake{ animation:shk .3s ease; }
@keyframes shk{ 25%{ transform:translateX(-5px) rotate(-.3deg);} 70%{ transform:translateX(4px);} }
.progress{ margin:1rem auto 0; max-width:26rem; height:.8rem; background:rgba(46,38,24,.15);
  border-radius:.5rem; overflow:hidden; border:1px solid rgba(46,38,24,.3); }
.progress i{ display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--frame2), var(--accent)); transition:width .25s; }
.stats{ font-size:.9rem; color:#6a5c40; margin-top:.4rem; }
.done-card{
  margin:1rem auto 0; max-width:34rem; background:rgba(255,252,242,.95); border:1px solid var(--frame);
  border-radius:.6rem; padding:1rem 1.2rem; font-size:1.05rem; line-height:1.6;
  box-shadow:0 6px 20px rgba(60,40,10,.2);
}
.done-card[hidden]{ display:none; }
.done-card h2{ font-family:'Italiana', serif; font-weight:400; letter-spacing:.14em; font-size:1.4rem; }
.controls{ margin-top:1rem; }
.controls button{
  font-family:'Crimson Pro', serif; font-size:.95rem; color:#6a5c40; background:none;
  border:1px solid rgba(106,92,64,.5); border-radius:.4rem; padding:.45rem 1rem; min-height:2.75rem; cursor:pointer;
}
.controls button:hover{ color:var(--ink); border-color:var(--ink); }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (prefers-reduced-motion: reduce){ canvas#board.shake, .sw.flash{ animation:none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>MASTERPAINT</h1>
    <p class="tag">paint by numbers · pigments the masters actually used</p>
    <div id="artists"></div>
    <p class="pigname" id="pigname">pick a pigment</p>
    <div class="lensbox">
      <h3>THE MAGNIFIER</h3>
      <canvas id="lens" width="200" height="200" aria-hidden="true"></canvas>
      <p class="hint">hover (or tap) the canvas — small numbers get big here</p>
    </div>
  </aside>

  <main class="mainpane">
    <p class="workline" id="workline"></p>
    <div class="easel"><div class="scrollwrap">
      <canvas id="board" role="application" aria-label="Paint-by-numbers canvas. Pick a numbered pigment in the sidebar, then click regions with that number."></canvas>
    </div></div>
    <div class="progress" aria-hidden="true"><i id="progFill"></i></div>
    <p class="stats" id="stats"></p>
    <div class="done-card" id="doneCard" hidden>
      <h2>THE MASTERPIECE IS COMPLETE</h2>
      <p id="doneFact"></p>
    </div>
    <div class="controls">
      <button type="button" id="resetBtn">start this canvas over</button>
    </div>
    <p class="sr-only" role="status" aria-live="polite" id="sr"></p>
  </main>
</div>

<script>
'use strict';
/* ═══════════ ARTWORK BUILDERS ═══════════
   Compositions are authored in a coarse coordinate space, then supersampled
   by S so the canvas is gallery-huge with organic region boundaries. */
var S=2;
function makeGrid(w,h,fill){ var g=[]; for(var y=0;y<h;y++){ g.push(new Array(w).fill(fill)); } return g; }
function ell(g,cx,cy,rx,ry,v){
  cx*=S; cy*=S; rx*=S; ry*=S;
  for(var y=0;y<g.length;y++) for(var x=0;x<g[0].length;x++)
    if(((x-cx)*(x-cx))/(rx*rx)+((y-cy)*(y-cy))/(ry*ry)<=1) g[y][x]=v;
}
function rect(g,x0,y0,x1,y1,v){
  x0=Math.round(x0*S); y0=Math.round(y0*S); x1=Math.round(x1*S)+S-1; y1=Math.round(y1*S)+S-1;
  for(var y=Math.max(0,y0);y<=Math.min(g.length-1,y1);y++)
    for(var x=Math.max(0,x0);x<=Math.min(g[0].length-1,x1);x++) g[y][x]=v;
}
function blot(g,cx,cy,v){ rect(g,cx,cy,cx,cy,v); }
function line(g,x0,y0,x1,y1,v){
  var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*S*2;
  for(var i=0;i<=n;i++){
    var t=i/n, x=Math.round((x0+(x1-x0)*t)*S), y=Math.round((y0+(y1-y0)*t)*S);
    if(y>=0&&y<g.length&&x>=0&&x<g[0].length) g[y][x]=v;
  }
}
function buildVanGogh(){
  var W=28*S,H=20*S,g=makeGrid(W,H,1);
  for(var y=0;y<13*S;y++) for(var x=0;x<W;x++){
    var xs=x/S, ys=y/S;
    var v=Math.sin(xs*0.45+Math.sin(ys*0.8)*1.6)+Math.sin(ys*0.5+xs*0.08);
    g[y][x]= v>0.75?3 : v>-0.25?2 : 1;
  }
  for(var y2=12*S;y2<H;y2++) for(var x2=0;x2<W;x2++){
    var hill=(13.5+Math.sin((x2/S)*0.4)*1.4)*S;
    if(y2>hill) g[y2][x2]= y2>16.2*S?7:2;
  }
  [[9,2],[15,4],[20,7],[6,7],[12,9],[24,9]].forEach(function(st){
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(d){
      var nx=st[0]+d[0],ny=st[1]+d[1];
      if(nx>=0&&nx<28&&ny>=0&&ny<13) blot(g,nx,ny,3);
    });
    blot(g,st[0],st[1],4);
  });
  ell(g,24,2.6,2.6,2.4,4); ell(g,23.2,2.2,1.5,1.4,5);
  for(var y3=2*S;y3<H;y3++){
    var ys3=y3/S;
    var w=ys3<5?0.4:(ys3<9?1:(ys3<16?2:1));
    var cx=(3+Math.sin(ys3*0.9)*0.6)*S;
    for(var x3=Math.round(cx-w*S);x3<=Math.round(cx+w*S);x3++) if(x3>=0&&x3<W) g[y3][x3]=6;
  }
  rect(g,16,14,17,16,7); blot(g,16,13,7); blot(g,16,12,7);
  [[10,18],[13,18],[20,18],[23,17]].forEach(function(win){ blot(g,win[0],win[1],8); });
  return g;
}
function buildVermeer(){
  var W=20*S,H=26*S,g=makeGrid(W,H,1);
  ell(g,10,13,5.2,6.6,4);
  for(var y=8*S;y<20*S;y++) for(var x=0;x<W;x++)
    if(g[y][x]===4 && x<(8+Math.sin((y/S)*0.5))*S) g[y][x]=5;
  /* face detail: eyes, brows, lips, ear shadow — each its own region */
  ell(g,8.7,12,0.55,0.4,1);  ell(g,11.7,11.8,0.55,0.4,1);
  rect(g,8.2,10.8,9.2,10.9,5); rect(g,11.2,10.6,12.2,10.7,5);
  ell(g,10.2,15.6,0.95,0.5,5);
  ell(g,13.6,13.4,0.5,0.8,5);
  /* turban: crown, twin highlight bands, knot, hanging tail with stripe */
  ell(g,10,6.2,6.2,4.2,2);
  ell(g,8.4,5,3.2,1.8,3);
  ell(g,12.2,7.6,2.2,1,3);
  ell(g,6.4,7.8,1,0.8,3);
  rect(g,14,7,16,14,2); rect(g,15,9,15,12,3); rect(g,14.4,13,15.6,13.4,3);
  /* garment: alternating fold stripes of lead-tin yellow and ochre shadow */
  for(var y2=19*S;y2<H;y2++) for(var x2=0;x2<W;x2++){
    var sh=(19+Math.abs(x2/S-10)*0.55)*S;
    if(y2>sh) g[y2][x2]= (Math.floor(x2/(2.4*S)))%2? 6:7;
  }
  rect(g,9,19,12,20,8);
  rect(g,13,17,13,18,8);
  return g;
}
/* Rembrandt is now a NIGHT WATCH: landscape group scene — nothing like Vermeer's
   portrait. Captain in black with a vermilion sash, lieutenant in ochre, the
   glowing girl, background militia, crossed pikes, a banner and a drum. */
function buildRembrandt(){
  var W=30*S,H=22*S,g=makeGrid(W,H,1);
  ell(g,15,3,11,4.5,2);                       // dark arch overhead
  rect(g,0,17.5,29,21,6);                      // ground
  /* background militia: heads + hats between the leads */
  [[3.5,9],[7,8.2],[21,8.6],[24.5,8],[27,9]].forEach(function(m){
    ell(g,m[0],m[1],0.8,0.9,4);
    rect(g,m[0]-1.2,m[1]-1.9,m[0]+1.2,m[1]-1.3,2);
  });
  /* crossed pikes + banner */
  line(g,1.5,4.5,7.5,11,7); line(g,20,3.5,26.5,10.5,7); line(g,23,10.5,28.5,4,7);
  rect(g,21.5,1.5,23.5,5,8); line(g,21.5,1.5,21.5,8,7);
  /* the glowing girl (left of the captain) */
  ell(g,6.5,13.5,1.8,2.6,3);
  ell(g,6.5,10.8,0.9,1,4);
  /* captain: black coat, white collar, vermilion sash */
  rect(g,12,10.5,15,17,2);
  rect(g,12,9.6,15,10.2,5);
  ell(g,13.5,8.3,1.2,1.4,4);
  rect(g,11.8,6,15.2,7,2); rect(g,11,6.8,16,7,2);
  line(g,12.2,11,15,15,8); line(g,12.2,11.6,15,15.6,8);
  rect(g,12.5,17,13,19.5,6); rect(g,14.2,17,14.7,19.5,6);
  /* lieutenant: ochre suit, white collar, pale sash */
  rect(g,17.5,11.5,20,17,3);
  rect(g,17.5,10.7,20,11.3,5);
  ell(g,18.7,9.4,1.1,1.3,4);
  rect(g,17.2,7.2,20.4,8.2,3);
  line(g,17.8,12,20,15,5);
  rect(g,18,17,18.5,19.5,6); rect(g,19.4,17,19.9,19.5,6);
  /* drum, right corner */
  ell(g,26.5,16.5,2.2,2.6,7);
  rect(g,24.3,16,28.7,16.6,5);
  return g;
}
/* ═══════════ ARTISTS ═══════════ */
var ARTISTS={
  vangogh:{
    name:'van Gogh', style:'bold bright impasto',
    line:'a night sky study · after The Starry Night, 1889',
    build:buildVanGogh,
    colors:{ 1:['Prussian blue','#1c2a52'], 2:['cobalt blue','#2f4d8f'], 3:['zinc white','#9fb8d8'],
             4:['chrome yellow','#f5cf3d'], 5:['orange lead','#e8933a'], 6:['viridian','#1e3a2a'],
             7:['charcoal','#26202a'], 8:['lamp glow','#f0b95a'] },
    fact:'Vincent van Gogh painted The Starry Night in June 1889, looking out from his room at the Saint-Paul asylum in southern France. The pigments in this palette — Prussian blue, cobalt, chrome yellow — are the ones documented in his letters and canvases.'
  },
  vermeer:{
    name:'Vermeer', style:'soft pearl light',
    line:'a girl in a turban · after Girl with a Pearl Earring, c. 1665',
    build:buildVermeer,
    colors:{ 1:['deep shadow','#1c1812'], 2:['ultramarine','#2a4a8a'], 3:['pale ultramarine','#7a9ac8'],
             4:['warm flesh','#d8ab84'], 5:['shadow flesh','#a87a58'], 6:['lead-tin yellow','#c8a23c'],
             7:['ochre shadow','#8a6a28'], 8:['lead white','#ece4d4'] },
    fact:'Johannes Vermeer\'s blue was natural ultramarine — lapis lazuli carried from Afghanistan and ground to powder, at times more precious than gold. He spent it anyway, even on shadows.'
  },
  rembrandt:{
    name:'Rembrandt', style:'dark earthy chiaroscuro',
    line:'the company marches out · after The Night Watch, 1642',
    build:buildRembrandt,
    colors:{ 1:['raw umber','#3a2c1c'], 2:['bone black','#1d1a16'], 3:['yellow ochre','#c89a56'],
             4:['warm flesh','#b07848'], 5:['lead white','#e8e2d2'], 6:['Van Dyck brown','#2a1f14'],
             7:['gold ochre','#b98a2e'], 8:['vermilion','#9a3a28'] },
    fact:'Rembrandt\'s Night Watch of 1642 is over three and a half metres tall — a militia portrait that moves like a stage play. The glowing girl in the crowd carries the company\'s emblems, and the captain\'s sash is vermilion, a pigment Rembrandt reserved for moments that had to burn.'
  }
};
/* ═══════════ REGIONS ═══════════ */
function computeRegions(grid){
  var H=grid.length, W=grid[0].length;
  var id=makeGrid(W,H,-1), regions=[], next=0;
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){
    if(id[y][x]!==-1) continue;
    var v=grid[y][x], cells=[], stack=[[x,y]];
    id[y][x]=next;
    while(stack.length){
      var c=stack.pop(); cells.push(c);
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(d){
        var nx=c[0]+d[0], ny=c[1]+d[1];
        if(nx>=0&&nx<W&&ny>=0&&ny<H&&id[ny][nx]===-1&&grid[ny][nx]===v){ id[ny][nx]=next; stack.push([nx,ny]); }
      });
    }
    var sx=0,sy=0; cells.forEach(function(c2){ sx+=c2[0]; sy+=c2[1]; });
    regions.push({ idx:v, cells:cells, cx:sx/cells.length, cy:sy/cells.length, painted:false });
    next++;
  }
  return { id:id, regions:regions };
}
/* ═══════════ STATE + RENDER ═══════════ */
var CELL=14, current=null, curKey='';
var board=document.getElementById('board'), ctx=board.getContext('2d');
var lens=document.getElementById('lens'), lctx=lens.getContext('2d');
var selected=1, mistakes=0;
function saveKey(){ return 'masterpaint-'+curKey; }
function save(){
  try{ localStorage.setItem(saveKey(), JSON.stringify(current.regions.map(function(r){ return r.painted?1:0; }))); }catch(e){}
}
function restore(){
  try{
    var d=JSON.parse(localStorage.getItem(saveKey())||'null');
    if(d && d.length===current.regions.length) d.forEach(function(p,i){ current.regions[i].painted=!!p; });
  }catch(e){}
}
function loadArtist(key, keepPigment){
  curKey=key;
  var a=ARTISTS[key];
  var grid=a.build();
  current={ artist:a, grid:grid, W:grid[0].length, H:grid.length };
  var rr=computeRegions(grid);
  current.id=rr.id; current.regions=rr.regions;
  restore();
  board.width=current.W*CELL; board.height=current.H*CELL;
  document.getElementById('workline').textContent=a.name+' · '+a.line;
  if(!keepPigment) selected=1;
  mistakes=0;
  refreshSidebar(); autoAdvance(); render(); drawLens(current.W/2, current.H/2);
  document.getElementById('doneCard').hidden=!isComplete();
  if(isComplete()) document.getElementById('doneFact').textContent=a.fact;
}
function colorsLeft(n){
  return current.regions.filter(function(r){ return r.idx===n && !r.painted; }).length;
}
function isComplete(){ return current.regions.every(function(r){ return r.painted; }); }
function buildSidebar(){
  var wrap=document.getElementById('artists'); wrap.innerHTML='';
  Object.keys(ARTISTS).forEach(function(key){
    var a=ARTISTS[key];
    var div=document.createElement('div');
    div.className='artist'; div.id='artist-'+key;
    var h=document.createElement('h2'); h.textContent=a.name;
    var st=document.createElement('div'); st.className='style'; st.textContent=a.style;
    var sws=document.createElement('div'); sws.className='sws';
    Object.keys(a.colors).forEach(function(nStr){
      var n=+nStr, c=a.colors[n];
      var b=document.createElement('button');
      b.type='button'; b.className='sw'; b.style.background=c[1];
      b.dataset.artist=key; b.dataset.n=n;
      b.innerHTML='<span class="num">'+n+'</span><span class="left"></span>';
      b.addEventListener('click', function(){
        if(curKey!==key){ selected=n; loadArtist(key, true); }
        else{ selected=n; refreshSidebar(); }
        document.getElementById('pigname').textContent=a.name+' · №'+n+' · '+c[0];
      });
      sws.appendChild(b);
    });
    div.appendChild(h); div.appendChild(st); div.appendChild(sws);
    wrap.appendChild(div);
  });
}
function refreshSidebar(){
  document.querySelectorAll('.artist').forEach(function(d){ d.classList.toggle('current', d.id==='artist-'+curKey); });
  document.querySelectorAll('.sw').forEach(function(b){
    var mine=b.dataset.artist===curKey, n=+b.dataset.n;
    var left=mine? colorsLeft(n) : null;
    b.classList.toggle('sel', mine && n===selected);
    b.classList.toggle('done', mine && left===0);
    b.querySelector('.left').textContent= mine? (left? String(left):'✓') : '';
    var c=ARTISTS[b.dataset.artist].colors[n];
    b.setAttribute('aria-label', ARTISTS[b.dataset.artist].name+' pigment '+n+', '+c[0]+(mine? ', '+left+' regions left':''));
  });
  var done=current.regions.filter(function(r){return r.painted;}).length;
  document.getElementById('progFill').style.width=(100*done/current.regions.length)+'%';
  document.getElementById('stats').textContent=done+' / '+current.regions.length+' regions painted'+(mistakes?' · '+mistakes+' wrong dabs':'');
}
function render(){
  var W=current.W, H=current.H;
  ctx.clearRect(0,0,board.width,board.height);
  current.regions.forEach(function(r){
    ctx.fillStyle=r.painted? current.artist.colors[r.idx][1] : '#f4edda';
    r.cells.forEach(function(c){ ctx.fillRect(c[0]*CELL, c[1]*CELL, CELL, CELL); });
  });
  ctx.strokeStyle='rgba(74,66,56,.5)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){
    var me=current.id[y][x];
    if(x+1<W && current.id[y][x+1]!==me){ ctx.moveTo((x+1)*CELL, y*CELL); ctx.lineTo((x+1)*CELL,(y+1)*CELL); }
    if(y+1<H && current.id[y+1][x]!==me){ ctx.moveTo(x*CELL,(y+1)*CELL); ctx.lineTo((x+1)*CELL,(y+1)*CELL); }
  }
  ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  current.regions.forEach(function(r){
    if(r.painted) return;
    var size=r.cells.length>=24? 12 : (r.cells.length>=8? 10 : 8);
    ctx.font=size+'px "Crimson Pro", serif';
    ctx.fillStyle='rgba(74,66,56,.9)';
    ctx.fillText(String(r.idx), (r.cx+0.5)*CELL, (r.cy+0.5)*CELL);
  });
}
/* magnifier: 3.5× view around the pointed cell */
function drawLens(cellX, cellY){
  var Z=3.5, size=200, srcW=size/Z;
  var sx=cellX*CELL-srcW/2, sy=cellY*CELL-srcW/2;
  sx=Math.max(0, Math.min(board.width-srcW, sx));
  sy=Math.max(0, Math.min(board.height-srcW, sy));
  lctx.imageSmoothingEnabled=false;
  lctx.clearRect(0,0,size,size);
  lctx.drawImage(board, sx, sy, srcW, srcW, 0, 0, size, size);
  lctx.strokeStyle='rgba(138,47,31,.8)'; lctx.lineWidth=1.5;
  lctx.beginPath();
  lctx.moveTo(size/2-8,size/2); lctx.lineTo(size/2+8,size/2);
  lctx.moveTo(size/2,size/2-8); lctx.lineTo(size/2,size/2+8);
  lctx.stroke();
}
function autoAdvance(){
  if(colorsLeft(selected)>0) return;
  for(var n=1;n<=8;n++) if(colorsLeft(n)>0){
    selected=n;
    document.getElementById('pigname').textContent=current.artist.name+' · №'+n+' · '+current.artist.colors[n][0];
    refreshSidebar();
    return;
  }
}
function paintAt(cellX, cellY){
  if(cellX<0||cellY<0||cellX>=current.W||cellY>=current.H) return 'out';
  var rid=current.id[cellY][cellX];
  var r=current.regions[rid];
  if(r.painted) return 'already';
  if(r.idx!==selected){
    mistakes++;
    board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    var sw=document.querySelector('.sw[data-artist="'+curKey+'"][data-n="'+r.idx+'"]');
    if(sw){ sw.classList.remove('flash'); void sw.offsetWidth; sw.classList.add('flash'); }
    refreshSidebar();
    document.getElementById('sr').textContent='That region wants pigment number '+r.idx;
    return 'wrong';
  }
  r.painted=true;
  render(); refreshSidebar(); autoAdvance(); save();
  document.getElementById('sr').textContent='Region painted';
  if(isComplete()){
    document.getElementById('doneCard').hidden=false;
    document.getElementById('doneFact').textContent=current.artist.fact;
    document.getElementById('sr').textContent='The masterpiece is complete!';
  }
  return 'painted';
}
function eventCell(e){
  var r=board.getBoundingClientRect();
  return [ Math.floor((e.clientX-r.left)/r.width*current.W),
           Math.floor((e.clientY-r.top)/r.height*current.H) ];
}
board.addEventListener('click', function(e){
  var c=eventCell(e);
  paintAt(c[0], c[1]);
  drawLens(c[0], c[1]);
});
board.addEventListener('pointermove', function(e){
  var c=eventCell(e);
  drawLens(c[0], c[1]);
});
document.getElementById('resetBtn').addEventListener('click', function(){
  current.regions.forEach(function(r){ r.painted=false; });
  mistakes=0;
  try{ localStorage.removeItem(saveKey()); }catch(e){}
  document.getElementById('doneCard').hidden=true;
  selected=1; render(); refreshSidebar();
  document.getElementById('sr').textContent='Canvas reset';
});
buildSidebar();
loadArtist('vangogh');
window.__MP={ ARTISTS:ARTISTS, computeRegions:computeRegions, loadArtist:loadArtist, paintAt:paintAt,
  drawLens:drawLens, get current(){return current;}, get selected(){return selected;}, set selected(v){selected=v;},
  get curKey(){return curKey;}, isComplete:isComplete, colorsLeft:colorsLeft };
</script>
</body>
</html>
