<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Laughometer — live laugh counter</title>
<meta name="description" content="A live scoreboard that counts every hahaha, lol and KEKW in a Twitch chat. How funny is the stream, really?">
<link rel="icon" href="https://emojicdn.elk.sh/😂">
<meta property="og:title" content="The Laughometer">
<meta property="og:description" content="Counts every hahaha, lol and KEKW in chat, live. How funny is the stream, really?">
<meta property="og:url" content="https://sloppy.live/laughometer/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/giant%20retro%20arcade%20scoreboard%20displaying%20HA%20HA%20HA%20in%20glowing%20acid%20yellow%20neon%20on%20black%2C%20comedy%20club%20stage%20lights%2C%20hot%20pink%20accents%2C%20bold%20playful?width=1200&height=630&nologo=true&seed=5150&model=flux&format=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0c0a08; --panel:#171310; --edge:#332a1e;
  --ha:#f5d90a; --pink:#ff4f9a; --cream:#f5efdd; --dim:#8f8574; --live:#59d8a0;
}
html{ font-size:100%; }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; background:var(--void); color:var(--cream);
  font-family:'IBM Plex Mono', monospace;
  background-image:
    radial-gradient(48rem 26rem at 50% -8%, rgba(245,217,10,.08), transparent 60%),
    radial-gradient(30rem 18rem at 88% 100%, rgba(255,79,154,.07), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.35) 3px 4px);
}
main{ max-width:56rem; margin:0 auto; padding:1.2rem 1rem 3rem; }
header{ text-align:center; margin-bottom:.6rem; }
h1{
  font-family:'Luckiest Guy', cursive; font-weight:400; letter-spacing:.04em;
  font-size:clamp(2rem,6vw,3.4rem); color:var(--ha);
  text-shadow:0 0 24px rgba(245,217,10,.35), 0 3px 0 #7a6a00;
}
h1 .pk{ color:var(--pink); text-shadow:0 0 24px rgba(255,79,154,.4), 0 3px 0 #7a1040; }
.tag{ color:var(--dim); font-size:.85rem; }
/* connect row */
.connectrow{
  display:flex; gap:.5rem; justify-content:center; align-items:center; flex-wrap:wrap; margin:.9rem 0;
}
.connectrow input{
  background:var(--panel); border:1px solid var(--edge); border-radius:.5rem; color:var(--cream);
  font-family:inherit; font-size:.9rem; padding:.5rem .7rem; min-height:2.75rem; width:14rem;
}
.connectrow input:focus{ border-color:var(--ha); outline:none; }
button{
  font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:.85rem;
  background:var(--ha); color:#231d00; border:none; border-radius:.5rem;
  padding:.5rem .9rem; min-height:2.75rem; cursor:pointer;
}
button.ghost{ background:var(--panel); color:var(--dim); border:1px solid var(--edge); }
button.ghost:hover{ color:var(--cream); border-color:var(--ha); }
button:hover{ filter:brightness(1.08); }
:focus-visible{ outline:3px solid var(--pink); outline-offset:2px; }
.pill{ font-size:.75rem; color:var(--dim); display:inline-flex; align-items:center; gap:.35rem; }
.pill i{ width:.55rem; height:.55rem; border-radius:50%; background:#c99a2e; display:inline-block; }
.pill.live i{ background:var(--live); box-shadow:0 0 8px var(--live); }
.pill.err i{ background:#e85a5a; }
/* the big board */
.board{
  text-align:center; background:var(--panel); border:2px solid var(--edge); border-radius:1.2rem;
  padding:1.6rem 1rem 1.2rem; margin:0 0 1rem;
  box-shadow:0 0 0 6px rgba(245,217,10,.04), inset 0 0 60px rgba(0,0,0,.5);
}
.bignum{
  font-family:'Luckiest Guy', cursive; font-size:clamp(4.5rem,17vw,10rem); line-height:1;
  color:var(--ha); text-shadow:0 0 40px rgba(245,217,10,.45), 0 5px 0 #7a6a00;
}
.bignum.bump{ animation:bump .3s ease; }
@keyframes bump{ 40%{ transform:scale(1.13) rotate(-1.2deg); } }
.board .lbl{ font-size:.8rem; letter-spacing:.35em; color:var(--dim); text-transform:uppercase; }
.substats{ display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
.sub{
  background:rgba(0,0,0,.3); border:1px solid var(--edge); border-radius:.8rem;
  padding:.5rem .9rem; min-width:7.5rem;
}
.sub .v{ font-family:'Luckiest Guy', cursive; font-size:1.5rem; color:var(--pink); }
.sub .k{ font-size:.65rem; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
/* columns */
.cols{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
@media (max-width:44rem){ .cols{ grid-template-columns:1fr; } }
.card{
  background:var(--panel); border:1px solid var(--edge); border-radius:1rem; padding:.9rem 1rem;
}
.card h2{
  font-family:'Luckiest Guy', cursive; font-weight:400; font-size:1.05rem; color:var(--cream);
  letter-spacing:.05em; margin-bottom:.5rem;
}
ul.lb{ list-style:none; padding:0; }
ul.lb li{
  display:flex; justify-content:space-between; gap:.5rem; padding:.3rem 0;
  border-bottom:1px dashed rgba(255,255,255,.06); font-size:.85rem;
}
ul.lb li .n{ color:var(--ha); font-weight:700; }
#ticker{ font-size:.82rem; line-height:1.6; max-height:14rem; overflow-y:auto; scrollbar-width:thin; }
#ticker .t{ margin-bottom:.25rem; overflow-wrap:anywhere; }
#ticker .t .who{ font-weight:700; }
#ticker .t .ha{ color:var(--ha); }
.tryrow{ display:flex; gap:.5rem; margin-top:.7rem; }
.tryrow input{
  flex:1; min-width:0; background:var(--void); border:1px solid var(--edge); border-radius:.5rem;
  color:var(--cream); font-family:inherit; font-size:.85rem; padding:.5rem .6rem; min-height:2.75rem;
}
.tryrow input:focus{ border-color:var(--pink); outline:none; }
/* floating HAs */
.flyha{
  position:fixed; z-index:5; pointer-events:none; font-family:'Luckiest Guy', cursive;
  color:var(--ha); text-shadow:0 0 14px rgba(245,217,10,.5);
  animation:flyup var(--dur,1.4s) ease-out forwards;
}
@keyframes flyup{
  from{ transform:translate(-50%,0) scale(.6) rotate(var(--r0,0deg)); opacity:1; }
  to{ transform:translate(calc(-50% + var(--dx,0px)), -32vh) scale(1.15) rotate(var(--r1,0deg)); opacity:0; }
}
footer{ text-align:center; margin-top:1.4rem; color:var(--dim); font-size:.75rem; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (prefers-reduced-motion: reduce){
  .flyha{ display:none; }
  .bignum.bump{ animation:none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>THE LAUGH<span class="pk">OMETER</span></h1>
    <p class="tag">every hahaha, lol and KEKW in chat — counted live</p>
  </header>

  <div class="connectrow">
    <input id="chanIn" placeholder="twitch channel" aria-label="Twitch channel to count laughs in" autocomplete="off">
    <button type="button" id="connectBtn">count this chat</button>
    <span class="pill" id="pill"><i></i><span id="pillTxt">not connected</span></span>
  </div>

  <section class="board" aria-label="Session laugh count">
    <div class="lbl">session laughs</div>
    <div class="bignum" id="bigNum" aria-hidden="true">0</div>
    <p class="sr-only" role="status" aria-live="polite" id="sr"></p>
    <div class="substats">
      <div class="sub"><div class="v" id="lpm">0</div><div class="k">laughs/min</div></div>
      <div class="sub"><div class="v" id="haUnits">0</div><div class="k">ha's harvested</div></div>
      <div class="sub"><div class="v" id="laughers">0</div><div class="k">laughers</div></div>
      <div class="sub"><div class="v" id="best">—</div><div class="k">top laugher</div></div>
    </div>
  </section>

  <div class="cols">
    <section class="card" aria-label="Leaderboard">
      <h2>WHO'S LAUGHING</h2>
      <ul class="lb" id="lb"><li><span class="who">nobody yet</span><span class="n">—</span></li></ul>
    </section>
    <section class="card" aria-label="Recent laughs">
      <h2>FRESH HA'S</h2>
      <div id="ticker" role="log" aria-live="off"></div>
      <div class="tryrow">
        <input id="tryIn" placeholder="type a hahahaha to test…" aria-label="Type a laugh to test the counter" maxlength="200">
        <button type="button" id="tryBtn">HA</button>
      </div>
    </section>
  </div>

  <footer>
    session resets on refresh · <button type="button" class="ghost" id="resetBtn">reset counter</button>
  </footer>
</main>

<script>
'use strict';
/* ═══════════ PURE ═══════════ */
var LAUGH_RE=/\b(l(o+l)+z?|lmf?ao+|rofl+|ha(\s*ha)+h*|he(he)+h*|hah+a*|jaja(ja)*|kek(w|lol)?|lul+|omegalul|xd+)\b|😂|🤣|💀/i;
function isLaugh(text){ return LAUGH_RE.test(String(text||'')); }
function haUnitsOf(text){
  var t=String(text||'').toLowerCase(), units=0, m;
  var re=/(ha|he|ja|lo|ke|xd|lul|😂|🤣|💀)/g;
  while((m=re.exec(t))) units++;
  return Math.max(1, Math.min(60, units));
}
function fmtLpm(times, now){
  var n=0;
  for(var i=times.length-1;i>=0;i--){ if(now-times[i]<=60000) n++; else break; }
  return n;
}
/* ═══════════ STATE ═══════════ */
var S={ total:0, haUnits:0, users:{}, times:[] };
var els={
  big:document.getElementById('bigNum'), lpm:document.getElementById('lpm'),
  ha:document.getElementById('haUnits'), laughers:document.getElementById('laughers'),
  best:document.getElementById('best'), lb:document.getElementById('lb'),
  ticker:document.getElementById('ticker'), pill:document.getElementById('pill'),
  pillTxt:document.getElementById('pillTxt'), sr:document.getElementById('sr')
};
function nameColor(name){
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return 'hsl('+(h%360)+',70%,68%)';
}
var AC=null;
function haSound(units){
  if(!AC) return;
  try{
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.setValueAtTime(500+Math.min(units,20)*22, t);
    o.frequency.exponentialRampToValueAtTime(320, t+0.1);
    g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+0.12);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.14);
  }catch(e){}
}
var REDUCED=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyHa(units){
  if(REDUCED) return;
  var n=Math.min(4, 1+Math.floor(units/6));
  for(var i=0;i<n;i++){
    var s=document.createElement('span'); s.className='flyha';
    s.textContent=units>18?'HAHAHA':'HA';
    s.style.left=(20+Math.random()*60)+'vw';
    s.style.top=(55+Math.random()*25)+'vh';
    s.style.fontSize=(0.9+Math.min(units,24)*0.06+Math.random()*0.5)+'rem';
    s.style.setProperty('--dx',(Math.random()*160-80)+'px');
    s.style.setProperty('--r0',(Math.random()*20-10)+'deg');
    s.style.setProperty('--r1',(Math.random()*40-20)+'deg');
    s.style.setProperty('--dur',(1.1+Math.random()*0.7)+'s');
    document.body.appendChild(s);
    setTimeout(function(el){ return function(){ el.remove(); }; }(s), 1900);
  }
}
var MILESTONES=[10,25,50,100,250,500,1000];
function recordLaugh(user, text){
  if(!isLaugh(text)) return false;
  var units=haUnitsOf(text), now=Date.now();
  S.total++; S.haUnits+=units; S.times.push(now);
  if(S.times.length>4000) S.times.splice(0, 2000);
  S.users[user]=(S.users[user]||0)+1;
  render();
  var line=document.createElement('div'); line.className='t';
  var who=document.createElement('span'); who.className='who'; who.style.color=nameColor(user); who.textContent=user;
  var what=document.createElement('span'); what.className='ha'; what.textContent=' '+String(text).slice(0,60);
  line.appendChild(who); line.appendChild(what);
  els.ticker.prepend(line);
  while(els.ticker.children.length>40) els.ticker.lastChild.remove();
  els.big.classList.remove('bump'); void els.big.offsetWidth; els.big.classList.add('bump');
  flyHa(units); haSound(units);
  if(MILESTONES.indexOf(S.total)>=0){
    els.sr.textContent=S.total+' laughs this session!';
    flyHa(30); flyHa(30);
  }
  return true;
}
function render(){
  els.big.textContent=S.total;
  els.lpm.textContent=fmtLpm(S.times, Date.now());
  els.ha.textContent=S.haUnits;
  var names=Object.keys(S.users);
  els.laughers.textContent=names.length;
  names.sort(function(a,b){ return S.users[b]-S.users[a]; });
  els.best.textContent=names.length?names[0].slice(0,12):'—';
  els.lb.innerHTML='';
  if(!names.length){
    els.lb.innerHTML='<li><span class="who">nobody yet</span><span class="n">—</span></li>';
  } else {
    names.slice(0,8).forEach(function(n){
      var li=document.createElement('li');
      var who=document.createElement('span'); who.className='who'; who.style.color=nameColor(n); who.textContent=n;
      var c=document.createElement('span'); c.className='n'; c.textContent=S.users[n];
      li.appendChild(who); li.appendChild(c); els.lb.appendChild(li);
    });
  }
}
setInterval(function(){ els.lpm.textContent=fmtLpm(S.times, Date.now()); }, 3000);
document.getElementById('resetBtn').addEventListener('click', function(){
  S.total=0; S.haUnits=0; S.users={}; S.times=[];
  els.ticker.innerHTML=''; render();
  els.sr.textContent='Counter reset';
});
/* ---------- local test laugh ---------- */
function tryLaugh(){
  var inp=document.getElementById('tryIn'), t=inp.value.trim()||'hahahaha';
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  var counted=recordLaugh('you', t);
  if(!counted){ els.sr.textContent='that did not parse as a laugh'; inp.placeholder='not a laugh — try hahaha'; }
  inp.value='';
}
document.getElementById('tryBtn').addEventListener('click', tryLaugh);
document.getElementById('tryIn').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLaugh(); });
/* ---------- twitch bridge (repo-proven anonymous IRC) ---------- */
var ws=null, wsChan='', wsGen=0, retryN=0;
function setPill(cls, txt){ els.pill.className='pill '+(cls||''); els.pillTxt.textContent=txt; }
function connectTwitch(chan){
  chan=String(chan||'').trim().toLowerCase().replace(/^#/,'');
  if(!chan) return;
  wsGen++;
  var gen=wsGen;
  if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  wsChan=chan;
  try{ localStorage.setItem('laughometer-chan', chan); }catch(e){}
  setPill('','connecting…');
  var sock=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws=sock;
  sock.onopen=function(){
    sock.send('PASS SCHMOOPIIE');
    sock.send('NICK justinfan'+(1000+Math.floor(Math.random()*80000)));
    sock.send('JOIN #'+chan);
  };
  sock.onmessage=function(ev){
    String(ev.data).split('\r\n').forEach(function(raw){
      if(!raw) return;
      if(raw.indexOf('PING')===0){ sock.send('PONG :tmi.twitch.tv'); return; }
      if(raw.indexOf(' 366 ')>=0){ setPill('live','live · #'+chan); retryN=0; return; }
      var m=raw.match(/^:([^!\s]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
      if(m) recordLaugh(m[1], m[2]);
    });
  };
  sock.onclose=function(){
    if(gen!==wsGen) return;
    retryN++;
    var delay=Math.min(30000, 3500*Math.pow(2, retryN-1));
    setPill('err','reconnecting ×'+retryN);
    setTimeout(function(){ if(gen===wsGen) connectTwitch(chan); }, delay);
  };
  sock.onerror=function(){};
}
document.getElementById('connectBtn').addEventListener('click', function(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  connectTwitch(document.getElementById('chanIn').value);
});
document.getElementById('chanIn').addEventListener('keydown', function(e){ if(e.key==='Enter') connectTwitch(e.target.value); });
(function boot(){
  var saved='';
  try{ saved=localStorage.getItem('laughometer-chan')||''; }catch(e){}
  document.getElementById('chanIn').value=saved||'sloppy_ai';
  if(saved) setTimeout(function(){ if(wsGen===0) connectTwitch(saved); }, 400);
})();
render();
window.__LOL={ isLaugh:isLaugh, haUnitsOf:haUnitsOf, fmtLpm:fmtLpm, recordLaugh:recordLaugh, S:S, connectTwitch:connectTwitch };
</script>
</body>
</html>
