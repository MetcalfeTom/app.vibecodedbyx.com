<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluescreen Roulette — fate decides your crash</title>
<meta name="description" content="One click, one random seed, one personalized bluescreen. Every spin is a different crash — every link replays it exactly.">
<link rel="icon" href="https://emojicdn.elk.sh/💀">
<meta property="og:title" content="Bluescreen Roulette — fate decides your crash">
<meta property="og:description" content="One click, one random seed, one personalized bluescreen. Every spin is a different crash — every link replays it exactly.">
<meta property="og:url" content="https://sloppy.live/bluescreen-roulette/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/glowing%20skull%20emoji%20on%20windows%20bluescreen%20blue%20background%2C%20roulette%20wheel%20of%20error%20codes%2C%20dramatic%20minimal%20poster%2C%20pixel%20glitch%20edges.png?width=1200&height=630&nologo=true&seed=404&model=flux">
<meta property="og:type" content="website">
<style>
:root{ --blue:#0067c0; --deep:#003e7c; }
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:linear-gradient(160deg, var(--blue), var(--deep));
  color:#fff; min-height:100vh;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:'Segoe UI', system-ui, sans-serif;
}
main{ padding:1rem; }
.skull{ font-size:clamp(4rem,18vw,7rem); display:block; animation:tumble 1.1s ease-in-out infinite; }
@keyframes tumble{ 0%,100%{ transform:rotate(-12deg) scale(1); } 50%{ transform:rotate(12deg) scale(1.08); } }
h1{ font-weight:300; font-size:clamp(1.4rem,5vw,2.2rem); margin:.8rem 0 .3rem; letter-spacing:.02em; }
p{ opacity:.75; font-size:.95rem; }
.seed{ font-family:'Consolas', monospace; margin-top:1rem; font-size:.85rem; opacity:.6; }
a{ color:#fff; }
@media (prefers-reduced-motion: reduce){ .skull{ animation:none; } }
</style>
</head>
<body>
<main>
  <span class="skull" aria-hidden="true">💀</span>
  <h1>Bluescreen Roulette</h1>
  <p role="status" aria-live="polite" id="line">fate is compiling your crash…</p>
  <p class="seed" id="seed"></p>
  <noscript><p>JavaScript is off — <a href="/windows-11-recall-nightmare/">walk to your doom manually</a>.</p></noscript>
</main>
<script>
'use strict';
try{
  const seed=Math.random().toString(36).slice(2,8);
  const r=1+Math.floor(Math.random()*9), s=1+Math.floor(Math.random()*9);
  const url='/windows-11-recall-nightmare/?bsod='+seed+'-'+r+'-'+s;
  document.getElementById('seed').textContent='seed: '+seed+'-'+r+'-'+s;
  setTimeout(()=>{ location.replace(url); }, 1600);
}catch(e){
  document.getElementById('line').innerHTML='the wheel jammed — <a href="/windows-11-recall-nightmare/">enter unseeded</a>.';
}
</script>
</body>
</html>
