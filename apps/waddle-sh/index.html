<style>
:root{ --ph:#33ff66; --ph-dim:#1a8f3c; --ph-dark:#0c4a20; --bg:#020604; }
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:#000; color:var(--ph);
  font-family:'VT323', monospace;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:.5rem;
}
.crt{
  position:relative; width:min(60rem,100%);
  background:radial-gradient(ellipse at 50% 40%, #04140a, var(--bg) 75%);
  border:3px solid #1a241c; border-radius:.8rem;
  box-shadow:0 0 4rem rgba(51,255,102,.12), inset 0 0 6rem rgba(0,0,0,.7);
  padding:1rem 1.2rem 0.8rem; overflow:hidden;
}
.crt::before{ /* scanlines */
  content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}
.crt::after{ /* vignette */
  content:''; position:absolute; inset:0; pointer-events:none; z-index:6;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55));
  border-radius:.8rem;
}
pre{
  font-family:inherit; font-size:clamp(.6rem, 1.55vw, 1.05rem); line-height:1.06;
  color:var(--ph); text-shadow:0 0 6px rgba(51,255,102,.55);
  white-space:pre; overflow-x:auto;
}
pre .dim{ color:var(--ph-dim); text-shadow:0 0 4px rgba(26,143,60,.4); }
.statusline{
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-size:clamp(.7rem, 1.6vw, 1rem); color:var(--ph-dim);
  border-top:1px solid var(--ph-dark); margin-top:.4rem; padding-top:.35rem;
  text-shadow:0 0 4px rgba(26,143,60,.4);
}
.inputline{
  display:flex; align-items:baseline; gap:.4rem;
  font-size:clamp(.85rem, 2vw, 1.15rem); margin-top:.2rem;
}
.prompt{ color:var(--ph); text-shadow:0 0 6px rgba(51,255,102,.55); white-space:nowrap; }
#cmd{
  flex:1; background:none; border:0; outline:none;
  font-family:inherit; font-size:inherit; color:var(--ph);
  text-shadow:0 0 6px rgba(51,255,102,.55);
  caret-color:transparent; min-height:2.75rem;
}
.cursor{
  display:inline-block; width:.55em; height:1em; margin-left:-.45em;
  background:var(--ph); vertical-align:text-bottom;
  animation:blink 1.06s steps(2) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }
.hint{ font-size:clamp(.65rem,1.4vw,.85rem); color:var(--ph-dark); text-align:center; margin-top:.3rem; }
/* mobile d-pad */
.dpad{ display:none; gap:.4rem; justify-content:center; margin-top:.5rem; flex-wrap:wrap; }
.dpad button{
  font-family:inherit; font-size:1.3rem; color:var(--ph); background:none;
  border:1px solid var(--ph-dark); border-radius:.4rem;
  min-width:3rem; min-height:2.75rem; cursor:pointer;
}
@media (pointer:coarse){ .dpad{ display:flex; } }
button:focus-visible, #cmd:focus-visible{ outline:2px solid var(--ph); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ .cursor{ animation:none; } }
</style>
</head>
<body>
<main class="crt">
  <pre id="screen" role="application" aria-label="South pole terminal world. Move with arrow keys or WASD, type commands like help, ls, cd dojo, say hello."></pre>
  <div class="statusline">
    <span id="st-left">booting…</span>
    <span id="st-right"></span>
  </div>
  <div class="inputline">
    <span class="prompt" id="prompt">penguin@south-pole:/plaza$</span>
    <input id="cmd" type="text" maxlength="90" autocomplete="off" spellcheck="false" aria-label="Terminal command input">
    <span class="cursor" aria-hidden="true"></span>
  </div>
  <p class="hint">arrows/wasd waddle · t = snowball (mind the wind) · try: help · ls · cd dojo · say hello · throw Pingu · dance</p>
  <div class="dpad" aria-label="Touch controls">
    <button type="button" data-d="up">▲</button>
    <button type="button" data-d="left">◀</button>
    <button type="button" data-d="down">▼</button>
    <button type="button" data-d="right">▶</button>
    <button type="button" data-d="dance">☺</button>
    <button type="button" data-d="snow" aria-label="Throw snowball">☄</button>
  </div>
  <p class="sr" role="status" aria-live="polite" id="announce" style="position:absolute;left:-999rem;"></p>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm";
const SUPABASE_URL='https://yjyxteqzhhmtrgcaekgz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqeXh0ZXF6aGhtdHJnY2Fla2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczNTg3NDIsImV4cCI6MjA3MjkzNDc0Mn0.G8SRde7IN2QFW1EnASM8IS32IUYR2eenCCjdDdioiBU';

/* ── world ──────────────────────────────────────────────────────────── */
const W=72, H=20;
const IGLOO=[
"   .-^^-.   ",
"  /______\\  ",
"  |  __  |  ",
"__|_|  |_|__"
];
function blank(){ return Array.from({length:H},()=>Array(W).fill(' ')); }
function stamp(grid, art, x, y){
  art.forEach((row,j)=>{ for(let i=0;i<row.length;i++){
    const gy=y+j, gx=x+i;
    if(gy>=0&&gy<H&&gx>=0&&gx<W&&row[i]!==' ') grid[gy][gx]=row[i];
  }});
}
function scatter(grid, ch, seedN, count){
  let s=seedN;
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let k=0;k<count;k++){
    const x=Math.floor(rnd()*W), y=Math.floor(rnd()*(H-3))+2;
    if(grid[y][x]===' ') grid[y][x]=ch;
  }
}
/* rooms = igloo directories. doors: tile region → target room */
const ROOMS={
  plaza:{
    title:'/plaza — the town square', spawn:[36,14],
    build(g){
      stamp(g,['*** WELCOME TO /plaza *** igloos are folders. walk into a door ***'],3,0);
      stamp(g,IGLOO,4,3);  stamp(g,['dojo/'],7,8);
      stamp(g,IGLOO,30,2); stamp(g,['pizza_parlor/'],29,7);
      stamp(g,IGLOO,56,3); stamp(g,['iceberg/'],57,8);
      scatter(g,'.',7,40); scatter(g,'*',13,14);
      stamp(g,['~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~'],12,19);
    },
    doors:[ {x:9,y:6,w:4,h:1,to:'dojo'}, {x:35,y:5,w:4,h:1,to:'pizza_parlor'}, {x:61,y:6,w:4,h:1,to:'iceberg'} ]
  },
  dojo:{
    title:'/dojo — silence, grasshopper', spawn:[36,15],
    build(g){
      stamp(g,['================[ /dojo ]================'],15,1);
      stamp(g,['  _____',' |     |','(| o o |)',' |  ^  |',' \\_===_/',' sensei'],8,4);
      stamp(g,['[mat]','[mat]'],30,8); stamp(g,['[mat]','[mat]'],44,8);
      stamp(g,['< cd .. to leave >'],27,18);
      scatter(g,'\'',21,10);
    },
    doors:[ {x:0,y:0,w:0,h:0,to:''} ]
  },
  pizza_parlor:{
    title:'/pizza_parlor — anchovies optional', spawn:[36,15],
    build(g){
      stamp(g,['============[ /pizza_parlor ]============'],15,1);
      stamp(g,['________________','|  ()  ()  ()  |','|______________|','   counter'],8,4);
      stamp(g,['(pizza)','  \\_/'],48,5);
      stamp(g,['< cd .. to leave >'],27,18);
      scatter(g,'.',31,8);
    },
    doors:[]
  },
  iceberg:{
    title:'/iceberg — do not tip', spawn:[36,14],
    build(g){
      stamp(g,['==============[ /iceberg ]=============='],15,1);
      stamp(g,['      /\\','     /  \\','    / __ \\','   /_/  \\_\\'],30,4);
      stamp(g,['~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~'],1,17);
      stamp(g,['< cd .. to leave >'],27,18);
      scatter(g,'\'',43,12);
    },
    doors:[]
  }
};
const backdrops={};
for(const [k,r] of Object.entries(ROOMS)){ const g=blank(); r.build(g); backdrops[k]=g; }

/* ── state ── */
const $=id=>document.getElementById(id);
const LSN='waddle-sh-name';
function sanitizeName(n){ return (n||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,14); }
let me={
  id:Math.random().toString(36).slice(2,10),
  name:sanitizeName(localStorage.getItem(LSN))||('penguin_'+Math.floor(Math.random()*900+100)),
  room:'plaza', x:36, y:14, face:1, emote:'', emoteUntil:0, bubble:'', bubbleUntil:0
};
let peers={};              // id → {name,room,x,y,face,emote,bubble,bubbleUntil,seen}
let online=false, chan=null;
let log=[];                // terminal log lines (say history) shown under title

/* bot so the pole never feels empty */
const BOT={ id:'bot', name:'Aunt_Arctic_bot', room:'plaza', x:18, y:12, face:1, emote:'', bubble:'', bubbleUntil:0, tx:18, ty:12, next:0,
  lines:['brr.','have you seen the iceberg?','the dojo is quiet today.','waddle on, friend.','pizza_parlor/ has no queue!'] };

/* ── penguin sprites ── */
function penguinArt(face, emote, tick){
  if(emote==='hit') return (tick%2===0)?[' (x< ',' //\\ ',' V_/ ']:[' (+< ',' //\\ ',' V_/ '];
  if(emote==='dance') return (tick%2===0)?['\\(o)/',' //\\ ',' V_/ ']:[' (o) ','/ //\\','  V_/'];
  if(emote==='sit') return [' (o< ',' \\_/)',''];
  if(emote==='wave') return (tick%2===0)?[' (o<_',' //\\ ',' V_/ ']:[' (o</',' //\\ ',' V_/ '];
  return face>0?[' (o< ',' //\\ ',' V_/ ']:[' >o) ',' /\\\\ ',' \\_V '];
}

/* ── render ── */
let tick=0;
function draw(){
  tick++;
  stepSnow();
  const g=backdrops[me.room].map(r=>r.slice());
  const now=Date.now();
  const everyone=[...Object.values(peers).filter(p=>p.room===me.room), ...(BOT.room===me.room?[BOT]:[]), me];
  everyone.sort((a,b)=>a.y-b.y);
  const dims=new Set();
  for(const p of everyone){
    const art=penguinArt(p.face??1, (p.emoteUntil||p===me&&me.emoteUntil)>now?p.emote:(p.emote&&p!==me?p.emote:'') , tick);
    const label=p.name.slice(0,14);
    const lx=Math.max(0,Math.min(W-label.length, Math.round(p.x-label.length/2)+2));
    if(p.y-4>=0){ for(let i=0;i<label.length;i++){ if(p.y-4<H) { g[p.y-4][lx+i]=label[i]; if(p!==me) dims.add((p.y-4)*W+lx+i); } } }
    stamp(g, art, Math.round(p.x), p.y-3);
    if(p!==me){ for(let j=0;j<3;j++) for(let i=0;i<5;i++){ dims.add((p.y-3+j)*W+Math.round(p.x)+i); } }
    if(p.bubble && p.bubbleUntil>now){
      const b='['+p.bubble.slice(0,40)+']';
      const bx=Math.max(0,Math.min(W-b.length, Math.round(p.x-b.length/2)+2));
      const by=p.y-5;
      if(by>=0){ for(let i=0;i<b.length;i++){ g[by][bx+i]=b[i]; } }
    }
  }
  /* snowballs + splats over everything */
  for(const b of snowballs){
    const bx=Math.round(b.x), by=Math.round(b.y);
    if(by>=0&&by<H&&bx>=0&&bx<W) g[by][bx]='o';
  }
  for(const s of splats){
    if(s.y>=0&&s.y<H&&s.x>=0&&s.x<W) g[s.y][s.x]='*';
    if(s.y>=0&&s.y<H&&s.x+1<W&&g[s.y][s.x+1]===' ') g[s.y][s.x+1]='·';
  }
  /* to HTML: self bright, others dim */
  let out='';
  for(let y=0;y<H;y++){
    let row='';
    for(let x=0;x<W;x++){
      const ch=g[y][x].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      row+=dims.has(y*W+x)?('<span class="dim">'+ch+'</span>'):ch;
    }
    out+=row+'\n';
  }
  $('screen').innerHTML=out;
  const here=[...Object.values(peers).filter(p=>p.room===me.room)].length+(BOT.room===me.room?1:0);
  $('st-left').textContent=ROOMS[me.room].title+'  ·  '+(here+1)+' penguin'+(here?'s':'')+' here  ·  '+windLabel();
  $('st-right').textContent=(online?'● online':'○ offline — waddling solo')+'  ·  '+me.name+(myHits?'  ·  ☄'+myHits:'');
  $('prompt').textContent=me.name+'@south-pole:/'+me.room+'$';
}

/* ── movement + doors ── */
function tryMove(dx,dy){
  const nx=Math.max(0,Math.min(W-6, me.x+dx));
  const ny=Math.max(5,Math.min(H-1, me.y+dy));
  me.x=nx; me.y=ny; me.face=dx!==0?(dx>0?1:-1):me.face;
  me.emote=''; me.emoteUntil=0;
  const r=ROOMS[me.room];
  for(const d of (r.doors||[])){
    if(d.to && me.x+2>=d.x && me.x+2<d.x+d.w+1 && me.y-2<=d.y+d.h && me.y-2>=d.y-1){ enterRoom(d.to); return; }
  }
  sendState();
}
function enterRoom(room){
  if(!ROOMS[room]) return;
  me.room=room;
  const [sx,sy]=ROOMS[room].spawn; me.x=sx; me.y=sy;
  echo('cd /'+room);
  $('announce').textContent='Entered '+room;
  sendState();
}

/* ── terminal ── */
function echo(line){ log.push(line); if(log.length>3) log.shift(); }
function say(msg){
  msg=msg.replace(/[\x00-\x1f<>&]/g,'').slice(0,60).trim();
  if(!msg) return;
  me.bubble=msg; me.bubbleUntil=Date.now()+4500;
  if(chan&&online) chan.send({type:'broadcast',event:'say',payload:{id:me.id,room:me.room,name:me.name,msg}});
  if(BOT.room===me.room && /hi|hello|hey/i.test(msg)){
    setTimeout(()=>{ BOT.bubble='hello, '+me.name+'.'; BOT.bubbleUntil=Date.now()+4000; },900);
  }
}
function emote(kind){
  me.emote=kind; me.emoteUntil=Date.now()+3200;
  sendState();
}

/* ── snowballs: wind physics + collision ─────────────────────────────
   Wind is derived from the wall clock (sine drift + hashed gusts), so
   every client computes the SAME wind without any sync traffic — a
   broadcast throw follows the same arc on every screen. ── */
let snowballs=[], splats=[], lastThrow=0, myHits=0;
function hash01(n){ n=(n^61)^(n>>>16); n=(n+(n<<3))|0; n^=n>>>4; n=Math.imul(n,0x27d4eb2d); n^=n>>>15; return (n>>>0)/4294967295; }
function windNow(){
  const t=Date.now()/1000;
  const gust=(hash01(Math.floor(t/6))*2-1)*1.7;
  return Math.sin(t/14)*2.1+gust;   /* columns per second² of drift */
}
function windLabel(){
  const w=windNow(), a=Math.abs(w);
  const ch=w<0?'←':'→';
  return 'wind '+ch.repeat(a>2.4?3:a>1.2?2:1)+' '+a.toFixed(1);
}
function throwSnow(vx,vy){
  const now=Date.now();
  if(now-lastThrow<1500){ me.bubble='(packing snow…)'; me.bubbleUntil=now+900; return null; }
  lastThrow=now;
  const b={ id:Math.random().toString(36).slice(2,8), from:me.id, room:me.room,
            x:me.x+2+(vx>=0?3:-2), y:me.y-2, vx, vy, landY:me.y, born:now };
  snowballs.push(b);
  if(chan&&online) chan.send({type:'broadcast',event:'snow',payload:b});
  return b;
}
function aimAt(target){
  const T=1.1, G=14;
  const vx=(target.x-me.x)/T;
  const vy=-G*T/2 + ((target.y)-(me.y))/T;
  return throwSnow(vx,vy);
}
function botHit(){
  BOT.emote='hit'; BOT.emoteUntil=Date.now()+1600;
  BOT.bubble='hey!!'; BOT.bubbleUntil=Date.now()+2400;
  myHits++;
}
function gotHit(by){
  me.emote='hit'; me.emoteUntil=Date.now()+1600;
  me.bubble='*pof*'; me.bubbleUntil=Date.now()+1500;
  if(chan&&online) chan.send({type:'broadcast',event:'hit',payload:{victim:me.id,by}});
  sendState(true);
}
function addSplat(x,y){
  splats.push({x:Math.round(x), y:Math.max(0,Math.min(H-1,Math.round(y))), until:Date.now()+800});
}
function stepSnow(){
  const dt=0.11, G=14, w=windNow(), now=Date.now();
  for(const b of snowballs){
    b.vx+=w*dt*0.55; b.vy+=G*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    /* collision — each client is authoritative for its OWN penguin;
       the thrower's client is authoritative for the bot */
    if(!b.dead && b.from!==me.id && b.y>=me.y-3 && b.y<=me.y && b.x>=me.x && b.x<=me.x+4){
      b.dead=true; addSplat(b.x,b.y); gotHit(b.from);
    }
    if(!b.dead && b.from===me.id && BOT.room===me.room && b.y>=BOT.y-3 && b.y<=BOT.y && b.x>=BOT.x && b.x<=BOT.x+4){
      b.dead=true; addSplat(b.x,b.y); botHit();
    }
    if(!b.dead && b.y>=b.landY){ b.dead=true; addSplat(b.x,b.landY); }
    if(b.x<-1||b.x>=W+1||now-b.born>6000) b.dead=true;
  }
  snowballs=snowballs.filter(b=>!b.dead);
  splats=splats.filter(s=>s.until>now);
}
const COMMANDS={
  help(){ say('try: ls · cd <igloo> · say <msg> · throw [name] · dance · wave · sit · who · name <n>'); },
  ls(){
    const dirs=Object.keys(ROOMS).filter(r=>r!==me.room).map(r=>r+'/').join('  ');
    const here=[...Object.values(peers).filter(p=>p.room===me.room).map(p=>p.name),(BOT.room===me.room?BOT.name:null)].filter(Boolean);
    say('igloos: '+dirs+(here.length?' · here: '+here.join(', '):''));
  },
  who(){
    const all=[...Object.values(peers).map(p=>p.name+' in /'+p.room), BOT.name+' in /'+BOT.room];
    say(all.length?all.slice(0,4).join(' · '):'just you and the snow.');
  },
  cd(arg){
    arg=(arg||'').replace(/\/$/,'').replace(/^\//,'');
    if(arg==='..'||arg==='') return enterRoom('plaza');
    if(ROOMS[arg]) return enterRoom(arg);
    say('cd: no such igloo: '+arg.slice(0,20));
  },
  dance(){ emote('dance'); }, wave(){ emote('wave'); }, sit(){ emote('sit'); },
  name(arg){
    const n=sanitizeName(arg);
    if(!n){ say('usage: name <letters_numbers>'); return; }
    me.name=n; localStorage.setItem(LSN,n); sendState(); say('now waddling as '+n);
  },
  say(arg){ say(arg||''); },
  clear(){ log=[]; },
  pwd(){ say('/'+me.room); },
  throw(arg){
    arg=(arg||'').trim().toLowerCase();
    if(arg){
      const targets=[...Object.values(peers).filter(p=>p.room===me.room), ...(BOT.room===me.room?[BOT]:[])];
      const t=targets.find(p=>p.name.toLowerCase()===arg);
      if(!t){ say('throw: no penguin named '+arg.slice(0,14)+' here'); return; }
      aimAt(t);
    }else{
      throwSnow(me.face*15,-7);
    }
  }
};
function runCommand(raw){
  const line=raw.trim(); if(!line) return;
  echo('$ '+line);
  const sp=line.indexOf(' ');
  const cmd=(sp<0?line:line.slice(0,sp)).toLowerCase();
  const arg=sp<0?'':line.slice(sp+1);
  if(COMMANDS[cmd]) COMMANDS[cmd](arg);
  else say(line.slice(0,60)); /* bare text = chat, club penguin style */
}

/* ── input ── */
const cmd=$('cmd');
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ runCommand(cmd.value); cmd.value=''; }
});
document.addEventListener('keydown',e=>{
  if(document.activeElement===cmd && e.key.length===1) return; /* typing */
  const k=e.key.toLowerCase();
  let dx=0,dy=0;
  if(k==='arrowup'||k==='w') dy=-1;
  else if(k==='arrowdown'||k==='s') dy=1;
  else if(k==='arrowleft'||k==='a') dx=-2;
  else if(k==='arrowright'||k==='d') dx=2;
  else if(k==='t'&&document.activeElement!==cmd){ e.preventDefault(); COMMANDS.throw(''); return; }
  else return;
  e.preventDefault();
  tryMove(dx,dy);
});
document.querySelectorAll('.dpad button').forEach(b=>{
  b.addEventListener('click',()=>{
    const d=b.dataset.d;
    if(d==='up') tryMove(0,-1); else if(d==='down') tryMove(0,1);
    else if(d==='left') tryMove(-2,0); else if(d==='right') tryMove(2,0);
    else if(d==='dance') emote('dance');
    else if(d==='snow') COMMANDS.throw('');
  });
});
/* keep focus in the terminal like a real tty */
document.addEventListener('click',e=>{ if(!e.target.closest('.dpad')) cmd.focus(); });

/* ── multiplayer: presence + broadcast, no DB writes ── */
let lastSent=0, sendTrailer=null;
function sendState(force){
  const now=Date.now();
  if(!force && now-lastSent<250){
    /* trailing send so the FINAL position/room/name always lands */
    if(!sendTrailer) sendTrailer=setTimeout(()=>{ sendTrailer=null; sendState(true); },260);
    return;
  }
  lastSent=now;
  if(chan&&online) chan.track({name:me.name,room:me.room,x:me.x,y:me.y,face:me.face,emote:me.emote,eu:me.emoteUntil});
}
async function connect(){
  try{
    const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
    chan=supabase.channel('waddle-sh-v1',{config:{presence:{key:me.id},broadcast:{self:false}}});
    chan.on('presence',{event:'sync'},()=>{
      const st=chan.presenceState();
      const next={};
      for(const [id,arr] of Object.entries(st)){
        if(id===me.id||!arr.length) continue;
        const p=arr[arr.length-1];
        const prev=peers[id]||{};
        next[id]={name:sanitizeName(p.name)||'penguin',room:ROOMS[p.room]?p.room:'plaza',
          x:Math.max(0,Math.min(W-6,p.x|0)), y:Math.max(5,Math.min(H-1,p.y|0)),
          face:p.face>=0?1:-1, emote:['dance','wave','sit','hit'].includes(p.emote)?p.emote:'', emoteUntil:p.eu||0,
          bubble:prev.bubble||'', bubbleUntil:prev.bubbleUntil||0};
      }
      peers=next;
    });
    chan.on('broadcast',{event:'say'},({payload})=>{
      if(!payload||payload.id===me.id) return;
      const p=peers[payload.id]; if(!p) return;
      p.bubble=String(payload.msg||'').replace(/[\x00-\x1f<>&]/g,'').slice(0,60);
      p.bubbleUntil=Date.now()+4500;
    });
    chan.on('broadcast',{event:'snow'},({payload})=>{
      if(!payload||payload.from===me.id||payload.room!==me.room) return;
      const num=v=>typeof v==='number'&&isFinite(v)?v:0;
      snowballs.push({ id:String(payload.id||'').slice(0,8), from:String(payload.from||'').slice(0,10),
        room:me.room, x:Math.max(-1,Math.min(W,num(payload.x))), y:Math.max(-2,Math.min(H,num(payload.y))),
        vx:Math.max(-40,Math.min(40,num(payload.vx))), vy:Math.max(-40,Math.min(40,num(payload.vy))),
        landY:Math.max(5,Math.min(H-1,num(payload.landY))), born:Date.now() });
    });
    chan.on('broadcast',{event:'hit'},({payload})=>{
      if(!payload) return;
      if(payload.by===me.id) myHits++;
      const v=peers[payload.victim];
      if(v){ v.emote='hit'; v.emoteUntil=Date.now()+1600; v.bubble='*pof*'; v.bubbleUntil=Date.now()+1500; }
    });
    chan.subscribe(status=>{
      online=status==='SUBSCRIBED';
      if(online) sendState(true);
    });
  }catch(e){ online=false; }
}
connect();

/* bot wander */
setInterval(()=>{
  const now=Date.now();
  if(now>BOT.next){
    BOT.next=now+2600+Math.random()*4000;
    BOT.tx=8+Math.floor(Math.random()*(W-16));
    BOT.ty=8+Math.floor(Math.random()*(H-10));
    if(Math.random()<0.16){ BOT.bubble=BOT.lines[Math.floor(Math.random()*BOT.lines.length)]; BOT.bubbleUntil=now+3800; }
    if(Math.random()<0.1){ BOT.room=['plaza','plaza','pizza_parlor','iceberg','dojo'][Math.floor(Math.random()*5)]; }
  }
  BOT.x+=Math.sign(BOT.tx-BOT.x); BOT.face=BOT.tx>=BOT.x?1:-1;
  BOT.y+=Math.sign(BOT.ty-BOT.y);
},420);

/* render loop ~9fps: authentic terminal cadence */
setInterval(draw,110);
draw();
cmd.focus();
</script>
