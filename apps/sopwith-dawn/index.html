<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sopwith Dawn</title>
<meta name="description" content="Fly a four-colour CGA biplane through four missions: bomb factories, dodge the flak, bring down a zeppelin, slip out of the searchlights.">
<link rel="icon" href="https://emojicdn.elk.sh/%E2%9C%88%EF%B8%8F">
<meta property="og:type" content="website">
<meta property="og:title" content="Sopwith Dawn">
<meta property="og:description" content="A CGA biplane, four missions, a zeppelin heading for your airfield and searchlights in the dark. Bomb, dodge, bring it down.">
<meta property="og:url" content="https://sloppy.live/sopwith-dawn/">
<meta property="og:image" content="https://sloppy.live/sopwith-dawn/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
[hidden]{ display:none !important; }
:root{ --k:#000; --c:#55ffff; --m:#ff55ff; --w:#fff; }
*{ box-sizing:border-box; }
html, body{ margin:0; height:100%; background:#000; color:var(--w); }
body{ font-family:'VT323', 'Courier New', monospace; font-size:1.25rem; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
main{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; }
#stage{ position:relative; flex:none; }
#game{ display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
.hud{ position:absolute; inset:0; pointer-events:none; font-family:'Silkscreen', monospace; font-size:clamp(.6rem, 1.9vmin, .9rem); line-height:1; }
.hrow{ position:absolute; top:.45em; display:flex; align-items:center; gap:.7em; padding:.35em .55em; background:#000; border:2px solid var(--c); }
.hl{ left:.45em; } .hr{ right:.45em; border-color:var(--m); }
@media (max-width: 560px){ .hr{ top:2.6em; } }   /* a narrow phone: the score row sits under the fuel row instead of on top of it */
.lab{ color:var(--c); } .hr .lab{ color:var(--m); }
.bar{ display:inline-block; width:4.5em; height:.7em; border:2px solid var(--w); padding:1px; }
.bar i{ display:block; height:100%; width:100%; background:var(--c); }
.bar i.low{ background:var(--m); }
#hBombs{ letter-spacing:.05em; }
.msg{ position:absolute; left:50%; top:22%; transform:translateX(-50%); margin:0; padding:.3em .7em; background:#000; color:var(--w); border:2px solid var(--w); white-space:nowrap; font-size:1.1em; }
.panel{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); width:min(26rem, calc(100% - 1.5rem)); max-height:calc(100% - 1rem); overflow:auto; background:#000; border:3px solid var(--c); box-shadow:0 0 0 3px #000, 0 0 0 6px var(--m); padding:1rem 1.2rem 1.1rem; text-align:center; }
.panel h1, .panel h2{ font-family:'Silkscreen', monospace; font-weight:700; margin:0 0 .3rem; line-height:1; letter-spacing:.04em; }
.panel h1{ font-size:clamp(1.6rem, 6vmin, 2.6rem); color:var(--w); text-shadow:3px 3px 0 var(--m); }
.panel h1 span{ color:var(--c); }
.panel h2{ font-size:clamp(1.2rem, 4.5vmin, 1.8rem); color:var(--c); }
.panel p{ margin:.35rem 0; line-height:1.15; }
.keys{ list-style:none; padding:0; margin:.6rem 0; display:grid; grid-template-columns:auto 1fr; gap:.1rem .7rem; text-align:left; }
.keys dt{ color:var(--c); font-family:'Silkscreen', monospace; font-size:.8rem; align-self:center; text-align:right; }
.keys dd{ margin:0; }
.btn{ font-family:'Silkscreen', monospace; font-weight:700; font-size:1rem; color:#000; background:var(--c); border:0; min-height:2.75rem; min-width:2.75rem; padding:.4rem 1.2rem; cursor:pointer; box-shadow:4px 4px 0 var(--m); }
.btn:hover{ background:var(--w); }
.btn:active{ transform:translate(2px, 2px); box-shadow:2px 2px 0 var(--m); }
.btn.alt{ background:#000; color:var(--c); border:2px solid var(--c); box-shadow:none; }
:focus-visible{ outline:3px solid var(--w); outline-offset:3px; }
.small{ color:var(--m); font-size:1rem; }
.mis{ display:flex; gap:.5rem; justify-content:center; margin:.55rem 0 .2rem; }
.mis button{ font-family:'Silkscreen', monospace; font-weight:700; font-size:1.05rem; min-width:2.75rem; min-height:2.75rem; background:#000; color:var(--c); border:2px solid var(--c); cursor:pointer; }
.mis button[aria-pressed="true"]{ background:var(--c); color:#000; box-shadow:3px 3px 0 var(--m); }
.mis button.done::after{ content:'✓'; font-size:.7em; margin-left:.15em; }
.mis button:disabled{ color:#555; border-color:#555; cursor:not-allowed; }
.mname{ font-family:'Silkscreen', monospace; color:var(--w); font-size:1rem; letter-spacing:.05em; }
.endb{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:.5rem; }
#pad{ display:none; width:100%; justify-content:space-between; gap:.5rem; padding:0 max(.6rem, env(safe-area-inset-left)) max(.4rem, env(safe-area-inset-bottom)); pointer-events:none; }
body.touch #pad{ display:flex; }
body.touch.over #pad{ position:absolute; left:0; right:0; bottom:0; }
.pg{ display:flex; gap:.5rem; align-items:flex-end; }
.pb{ pointer-events:auto; touch-action:none; font-family:'Silkscreen', monospace; font-weight:700; font-size:.85rem; width:4.2rem; height:4.2rem; border-radius:0; background:rgba(0,0,0,.55); color:var(--c); border:3px solid var(--c); }
.pb.m{ color:var(--m); border-color:var(--m); }
.pb[data-k="l"], .pb[data-k="r"]{ font-size:1.9rem; line-height:1; }
.pb[data-k="boost"], .pb[data-k="bomb"]{ font-size:.64rem; letter-spacing:0; padding:0; }
.pb.w{ color:var(--w); border-color:var(--w); width:5rem; height:5rem; }
.pb.on{ background:var(--c); color:#000; }
.pb.m.on{ background:var(--m); } .pb.w.on{ background:var(--w); }
.mute{ position:absolute; right:.45em; bottom:.45em; pointer-events:auto; min-height:2.75rem; min-width:2.75rem; font-family:'Silkscreen', monospace; background:#000; color:var(--c); border:2px solid var(--c); cursor:pointer; }
body.touch.over .mute{ bottom:auto; top:3.2em; }
@media (prefers-reduced-motion: reduce){ .btn:active{ transform:none; } }
/* a tall phone: the game strip is short, so the menus use the whole screen instead of scrolling inside the strip */
@media (max-aspect-ratio: 1/1){ .panel{ position:fixed; max-height:calc(100% - 1.5rem); } }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="game" width="320" height="200" role="application" aria-label="Sopwith Dawn. Left and right arrows turn the plane, up arrow boosts, space fires, down arrow drops a bomb, P pauses. Land on your runway to refuel."></canvas>
    <div class="hud">
      <div class="hrow hl"><span class="lab">FUEL</span><span class="bar" aria-hidden="true"><i id="hFuel"></i></span><span class="lab">AMMO</span><b id="hAmmo">0</b><span class="lab">BOMBS</span><b id="hBombs">0</b></div>
      <div class="hrow hr"><span class="lab">SCORE</span><b id="hScore">0</b><span class="lab" id="hLeftL">LEFT</span><b id="hLeft">0</b><b id="hLives" aria-label="lives"></b></div>
      <p class="msg" id="msg" role="status" aria-live="polite" hidden></p>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Sound off">SND</button>
    </div>
    <section class="panel" id="title" role="dialog" aria-modal="true" aria-labelledby="ttl">
      <h1 id="ttl">SOPWITH <span>DAWN</span></h1>
      <div class="mis" id="mis" role="group" aria-label="Missions"></div>
      <p class="mname" id="mname"></p>
      <p id="mbrief"></p>
      <dl class="keys">
        <dt>← →</dt><dd>turn the plane</dd>
        <dt>↑</dt><dd>boost (burns fuel)</dd>
        <dt>SPACE</dt><dd>machine gun</dd>
        <dt>↓</dt><dd>drop a bomb</dd>
        <dt>RUNWAY</dt><dd>glide in level and slow to land</dd>
      </dl>
      <button class="btn" id="go" type="button">▶ FLY</button>
      <p class="small" id="best"></p>
    </section>
    <section class="panel" id="end" role="dialog" aria-modal="true" aria-labelledby="endh" hidden>
      <h2 id="endh">MISSION COMPLETE</h2>
      <p id="ends"></p>
      <div class="endb"><button class="btn" id="next" type="button" hidden>▶ NEXT MISSION</button><button class="btn" id="again" type="button">▶ FLY AGAIN</button><button class="btn alt" id="menu" type="button">MISSIONS</button></div>
    </section>
    <section class="panel" id="paused" role="dialog" aria-modal="true" aria-labelledby="ph" hidden>
      <h2 id="ph">PAUSED</h2>
      <button class="btn" id="resume" type="button">▶ RESUME</button>
    </section>
  </div>
  <div id="pad" aria-label="Touch controls">
    <div class="pg"><button class="pb" type="button" data-k="l" aria-label="Turn left">↺</button><button class="pb" type="button" data-k="r" aria-label="Turn right">↻</button></div>
    <div class="pg"><button class="pb m" type="button" data-k="bomb" aria-label="Bomb">BOMB</button><button class="pb" type="button" data-k="boost" aria-label="Boost">BOOST</button><button class="pb w" type="button" data-k="fire" aria-label="Fire">FIRE</button></div>
  </div>
</main>
<script>
(() => {
'use strict';
// ── CGA PALETTE 1, HIGH INTENSITY: nothing on the canvas uses any other colour ──
const K = '#000000', C = '#55ffff', M = '#ff55ff', W = '#ffffff';
const U = { K: 0xff000000, C: 0xffffff55, M: 0xffff55ff, W: 0xffffffff };
const H = 200, WW = 3000, GY = 165;
const RUN0 = [60, 300], RUN1 = [2600, 2840];   // home runway, enemy airfield
let VW = 320;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const dith = (x, y, t) => BAYER[y & 3][x & 3] < t * 16;   // true on a t share of the pixels
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ── SPRITES: strings, one char per pixel, outlined in black, pre-rotated with nearest sampling ──
function grid(rows, key){
  const w = rows[0].length;
  rows.forEach(r => { if (r.length !== w) throw new Error('sprite row ' + r); });
  return { w, h: rows.length, px: rows.map(r => [...r].map(ch => ch === '.' ? null : key[ch])) };
}
function outline(g){
  const w = g.w + 2, h = g.h + 2, at = (x, y) => (g.px[y] || [])[x] || null, px = [];
  for (let y = 0; y < h; y++){ const row = []; for (let x = 0; x < w; x++){
    const c = at(x - 1, y - 1);
    row.push(c || (at(x, y - 1) || at(x - 2, y - 1) || at(x - 1, y) || at(x - 1, y - 2) ? K : null));
  } px.push(row); }
  return { w, h, px };
}
const flipV = g => ({ w: g.w, h: g.h, px: g.px.slice().reverse() });
function paint(g){ const c = mk(g.w, g.h), x = c.getContext('2d'); g.px.forEach((r, y) => r.forEach((col, i) => { if (col){ x.fillStyle = col; x.fillRect(i, y, 1, 1); } })); return c; }
function rotFrames(g, n){
  const S = Math.ceil(Math.hypot(g.w, g.h)) + 1, cx = g.w / 2, cy = g.h / 2, out = [];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a), c = mk(S, S), x = c.getContext('2d');
    for (let oy = 0; oy < S; oy++) for (let ox = 0; ox < S; ox++){
      const dx = ox + .5 - S / 2, dy = oy + .5 - S / 2;
      const col = (g.px[Math.floor(cy - dx * sa + dy * ca)] || [])[Math.floor(cx + dx * ca + dy * sa)];
      if (col){ x.fillStyle = col; x.fillRect(ox, oy, 1, 1); }
    }
    out.push(c);
  }
  return out;
}
const PLANE = [
  '......WWWWWWW...',
  'r.....wwwwwww...',
  'rx.....s...s...P',
  'rxbFFFFFFFFFFeeP',
  'rxffffbxrxbffeeP',
  '...ddddddddddd.P',
  '......LLLLLLL..P',
  '.......g...g....',
  '......oo..oo....',
];
const KEY_P = { W: W, w: C, s: K, F: W, f: W, d: C, e: C, P: C, L: C, g: K, o: W, r: M, x: W, b: C };
const KEY_E = { W: M, w: M, s: K, F: W, f: M, d: M, e: W, P: W, L: M, g: K, o: W, r: K, x: W, b: K };
const NF = 32;
function planeSet(key){ const g = outline(grid(PLANE, key)); return { up: rotFrames(g, NF), inv: rotFrames(flipV(g), NF) }; }
let SPR_P, SPR_E, BIRD, COW, PUFF_W, PUFF_M, PUFF_S, ZEP;
function buildSprites(){
  SPR_P = planeSet(KEY_P); SPR_E = planeSet(KEY_E);
  BIRD = [grid(['w...w', '.w.w.', '..w..'], { w: W }), grid(['.....', 'wwwww', '..w..'], { w: W })].map(g => paint(outline(g)));
  const cow = outline(grid([
    '........k.k',
    '.wwwkkwwkkk',
    'twkkkwwwkpk',
    '.wwwwwkwwpp',
    '.wwwwwwww..',
    '.k.k..k.k..',
    '.k.k..k.k..',
  ], { w: W, k: K, t: K, p: M }));
  COW = [paint(cow), paint({ w: cow.w, h: cow.h, px: cow.px.map(r => r.slice().reverse()) })];
  PUFF_W = puff(5, W, C); PUFF_M = puff(5, M, K); PUFF_S = puff(2, W, C);
  ZEP = zepSprite();
}
function zepSprite(){   // 100 x 32, the body's middle at (50, 12), nose to the left
  const c = mk(100, 32), x = c.getContext('2d'), dot = (i, j, col) => { x.fillStyle = col; x.fillRect(i, j, 1, 1); };
  for (let i = 84; i < 99; i++){ const k = (i - 84) / 14, h = Math.round(3 + k * 7);   // tail fins, top and bottom
    for (let j = 0; j < h; j++){ dot(i, 12 - 4 - j + (k > .9 ? 1 : 0), j === h - 1 || i === 98 ? W : dith(i, j, .45) ? K : M); dot(i, 12 + 4 + j - (k > .9 ? 1 : 0), j === h - 1 || i === 98 ? M : dith(i, j, .7) ? K : M); } }
  for (let i = 2; i < 97; i++){ const u = (i - 50) / 47, ry = 11 * Math.sqrt(Math.max(0, 1 - u ** 4 * (u > 0 ? 1.15 : 1))) ** .9;
    for (let j = -Math.round(ry); j <= Math.round(ry); j++){
      const t = j / Math.max(ry, 1), rib = (i - 6) % 11 === 0;
      let col = t < -.72 ? (dith(i, j, .35) ? M : W) : t < -.45 ? (dith(i, j, .7) ? M : W) : t > .55 ? (dith(i, j, (t - .55) * 1.6) ? K : M) : M;
      if (rib && t > -.75 && dith(i, j, .5)) col = K;
      if (Math.abs(j) === Math.round(ry) && t < 0) col = W;
      dot(i, 12 + j, col);
    }
  }
  for (let j = 6; j < 19; j++) for (let i = 67; i < 80; i++){ const a = Math.abs(i - 73), b = Math.abs(j - 12), inK = (a <= 1 && b <= 5) || (b <= 1 && a <= 5);   // the cross on its flank, black edged in white
    if (inK) dot(i, j, K); else if ((a <= 2 && b <= 6) || (b <= 2 && a <= 6)) dot(i, j, W); }
  for (let i = 34; i < 54; i++){ dot(i, 23, K); for (let j = 24; j < 29; j++) dot(i, j, i === 34 || i === 53 || j === 28 ? K : j === 24 ? W : (i - 36) % 4 < 2 && j < 27 ? C : W); }   // gondola
  dot(36, 23, W); dot(51, 23, W); dot(54, 26, W); dot(55, 26, W);
  return c;
}
function puff(r, a, b){   // a dithered smoke puff: colour a on top, b creeping in toward the bottom
  const c = mk(r * 2 + 1, r * 2 + 1), x = c.getContext('2d');
  for (let y = -r; y <= r; y++) for (let i = -r; i <= r; i++) if (i * i + y * y <= r * r + 1){
    x.fillStyle = dith(i + r, y + r, (y + r) / (2 * r) * .7) ? b : a; x.fillRect(i + r, y + r, 1, 1);
  }
  return c;
}
function frameOf(set, a){
  const i = ((Math.round(a / (Math.PI * 2) * NF) % NF) + NF) % NF;
  return (Math.cos(a) < 0 ? set.inv : set.up)[i];   // flying left: the mirrored set keeps the wings on top
}

// ── TEXT: drawn once into a canvas, snapped to one CGA colour with a black rim ──
const TXT = new Map();
function textSprite(s, col){
  const k = s + col; if (TXT.has(k)) return TXT.get(k);
  const t = mk(s.length * 8 + 8, 14), x = t.getContext('2d');
  x.font = '8px Silkscreen, monospace'; x.textBaseline = 'top'; x.fillStyle = '#fff'; x.fillText(s, 2, 3);
  const w = Math.ceil(x.measureText(s).width) + 4, d = x.getImageData(0, 0, t.width, 14).data;
  const on = (i, y) => i >= 0 && y >= 0 && i < t.width && y < 14 && d[(y * t.width + i) * 4 + 3] > 110;
  const c = mk(w, 14), y2 = c.getContext('2d');
  for (let y = 0; y < 14; y++) for (let i = 0; i < w; i++){
    if (on(i, y)){ y2.fillStyle = col; y2.fillRect(i, y, 1, 1); }
    else if (on(i + 1, y) || on(i - 1, y) || on(i, y + 1) || on(i, y - 1)){ y2.fillStyle = K; y2.fillRect(i, y, 1, 1); }
  }
  TXT.set(k, c); return c;
}

// ── WORLD: a height map painted into one wide canvas; bombs dig craters into it ──
const hgt = new Int16Array(WW), scar = new Uint8Array(WW);
const tc = mk(WW, H), tx = tc.getContext('2d');
let tid = null, tu = null;
const SPOTS1 = [
  { kind: 'factory', x: 640 }, { kind: 'tank', x: 860 }, { kind: 'factory', x: 1120 }, { kind: 'tank', x: 1420 },
  { kind: 'factory', x: 1690 }, { kind: 'tank', x: 1980 }, { kind: 'factory', x: 2240 }, { kind: 'hangar', x: 2540 }, { kind: 'hangar', x: 2900 },
];
const SIZE = { factory: [26, 18, 10, 100], tank: [16, 12, 6, 150], hangar: [30, 14, 14, 250], aa: [14, 9, 6, 175], light: [10, 8, 4, 125] };   // w, h, hp, score
/* v1.2: three missions, each unlocked by clearing the one before. Mission 2 adds anti-aircraft guns whose shells
   burst at your height; mission 3 is a zeppelin crossing toward your airfield */
const MIS = [
  { name: 'DAWN PATROL', brief: 'Bomb every factory, fuel tank and hangar. Duel the magenta planes. Land on your runway to refuel.', seed: 1917, spots: SPOTS1,
    cows: [520, 1290, 1880, 2380], birds: [[1000, 86], [2100, 64], [1560, 110]] },
  { name: 'FLAK ALLEY', brief: 'Anti-aircraft guns guard the valley. Their shells burst at your height: climb, dive, or bomb the guns first.', seed: 1918,
    spots: [{ kind: 'factory', x: 600 }, { kind: 'aa', x: 830 }, { kind: 'tank', x: 1010 }, { kind: 'factory', x: 1250 }, { kind: 'aa', x: 1460 }, { kind: 'tank', x: 1670 },
      { kind: 'factory', x: 1910 }, { kind: 'aa', x: 2160 }, { kind: 'tank', x: 2340 }, { kind: 'hangar', x: 2540 }, { kind: 'hangar', x: 2900 }],
    cows: [470, 1130, 1790, 2250], birds: [[920, 70], [1740, 96]] },
  { name: 'THE ZEPPELIN', brief: 'A zeppelin is crossing the valley toward your airfield, bombing as it comes. Bring it down before it gets there.', seed: 1916, zep: true,
    spots: [{ kind: 'aa', x: 880 }, { kind: 'factory', x: 1240 }, { kind: 'aa', x: 1650 }, { kind: 'tank', x: 1980 }, { kind: 'aa', x: 2330 }, { kind: 'hangar', x: 2700 }],
    cows: [560, 1420, 2120], birds: [[1180, 120], [2240, 80]] },
  { name: 'NIGHT RAID', brief: 'Searchlights sweep the dark. Get caught in a beam and every gun nearby can see you: shoot out the lights, or turn hard out of the beam.', seed: 1915, night: true,
    spots: [{ kind: 'light', x: 690 }, { kind: 'factory', x: 900 }, { kind: 'aa', x: 1070 }, { kind: 'light', x: 1290 }, { kind: 'tank', x: 1490 }, { kind: 'aa', x: 1700 },
      { kind: 'light', x: 1890 }, { kind: 'factory', x: 2090 }, { kind: 'aa', x: 2290 }, { kind: 'light', x: 2470 }, { kind: 'hangar', x: 2650 }, { kind: 'hangar', x: 2900 }],
    cows: [520, 1180, 1980], birds: [[1600, 70]] },
];
let MI = 0, SPOTS = SPOTS1;
const onRunway = x => (x >= RUN0[0] && x <= RUN0[1]) || (x >= RUN1[0] && x <= RUN1[1]);
function buildTerrain(){
  const r = rng(MIS[MI].seed), p1 = r() * 6, p2 = r() * 6, p3 = r() * 6, f = new Float32Array(WW);
  for (let x = 0; x < WW; x++) f[x] = GY - 8 + 13 * Math.sin(x / 160 + p1) + 7 * Math.sin(x / 61 + p2) + 2.5 * Math.sin(x / 19 + p3);
  const flat = (a, b, y) => { for (let x = Math.max(0, a - 36); x < Math.min(WW, b + 36); x++){ const k = x < a ? (x - a + 36) / 36 : x > b ? (b + 36 - x) / 36 : 1, s = k * k * (3 - 2 * k); f[x] = f[x] * (1 - s) + y * s; } };
  flat(RUN0[0] - 40, RUN0[1], GY); flat(RUN1[0], RUN1[1] + 160, GY);
  SPOTS.forEach(s => { const w = SIZE[s.kind][0]; flat(s.x - w / 2 - 4, s.x + w / 2 + 4, Math.round(f[s.x])); });

function beep(pri, dur, f){ SFX.push({ pri, t: 0, dur, f }); }
function speaker(dt){
  for (let i = SFX.length - 1; i >= 0; i--){ SFX[i].t += dt; if (SFX[i].t >= SFX[i].dur) SFX.splice(i, 1); }
  if (!AC || !OSC) return;
  let hz = 0, top = null;
  for (const s of SFX) if (!top || s.pri >= top.pri) top = s;
  if (top) hz = top.f(top.t / top.dur, top.t);
  else if (G.state === 'play' && !P.dead && P.fuel > 0 && !(P.ground && P.v < 1 && !P.taxi)) hz = (55 + P.v * .55 + (P.boost ? 25 : 0)) * ((G.tick & 3) < 2 ? 1 : 1.12);
  const on = hz > 0 && !muted && G.state === 'play';
  const now = AC.currentTime;
  if (on) OSC.frequency.setValueAtTime(clamp(hz, 30, 4000), now);
  AMP.gain.setValueAtTime(on ? (top ? .045 : .022) : 0, now);
}
const S_GUN = () => beep(3, .03, () => 1500);
const S_BOOM = big => beep(5, big ? .7 : .4, () => 60 + Math.random() * (big ? 260 : 400));
const S_WHISTLE = () => beep(2, 1.1, k => 2200 - 1500 * k);
const S_MOO = () => beep(4, .55, k => 140 - 50 * k + (k > .2 && k < .3 ? 30 : 0));
const S_HIT = () => beep(4, .08, k => k < .5 ? 900 : 300);
const S_LIT = () => beep(3, .3, k => k < .33 ? 1200 : k < .66 ? 1500 : 1200);
const S_FLAK = () => beep(4, .2, k => 70 + Math.random() * 260 * (1 - k));
const S_THUMP = () => beep(2, .05, k => 180 - 100 * k);
const S_LAND = () => beep(3, .3, k => k < .33 ? 660 : k < .66 ? 880 : 1320);
const S_WIN = () => beep(6, 1.6, k => [523, 659, 784, 1047, 784, 1047][Math.min(5, k * 6 | 0)]);

// ── GAME STATE ──
let G = null, P = null, camX = 0, frozen = false;
const KEYS = new Set(), TAPS = new Set();
const TURN = 3.1, THR = 92, BOOST = 150, DRAG = .95, GRAV = 105, STALL = 34, VMAX = 210;
function newWorld(state){
  buildTerrain();
  G = { state, t: 0, tick: 0, score: 0, lives: 3, enemies: [], pb: [], eb: [], bombs: [], parts: [], pops: [], spawnT: 4, awake: false, wonT: 0, shake: 0, kills: 0,
    targets: SPOTS.map((s, i) => ({ kind: s.kind, x: s.x, w: SIZE[s.kind][0], h: SIZE[s.kind][1], hp: SIZE[s.kind][2], score: SIZE[s.kind][3], fallT: 0, burn: 0, cool: 2 + i * .37, ang: -Math.PI / 2, recoil: 0, beam: -Math.PI / 2, lock: 0, lost: 0 })),
    flak: [], zb: [], mi: MI, lit: false, litSaid: -9, zep: MIS[MI].zep ? { x: WW - 150, y: 58, hp: 100, max: 100, v: 11, bombT: 7, gunT: 3, burst: 0, a: 0, vy: 0, dead: false, flash: 0, warn: 0, lostT: 0 } : null,
    cows: MIS[MI].cows.map((x, i) => ({ x, home: x, dir: i % 2 ? -1 : 1, oy: 0, vy: 0, rest: i, air: false })),
    birds: [] };
  MIS[MI].birds.forEach(([x, y], f) => { for (let i = 0; i < 6; i++) G.birds.push({ hx: x + (i % 3) * 9 - 9, hy: y + (i / 3 | 0) * 7 + (i % 2) * 3, x: 0, y: 0, ph: f * 2 + i, vx: 0, vy: 0, gone: 0, scare: 0 }); });
  G.birds.forEach(b => { b.x = b.hx; b.y = b.hy; });
  resetPlayer(); camX = 0;
}
function resetPlayer(){
  P = { x: 100, y: GY - 5, a: 0, v: 0, fall: 0, ground: true, dir: 1, fuel: 100, ammo: 150, bombs: 8, bombAcc: 0, hp: 5, dead: 0, down: false, gunT: 0, bombT: 0, boost: false, taxi: false, turnLock: false };
}
const alive = () => G.targets.filter(t => t.hp > 0).length;
function pop(x, y, s, col){ G.pops.push({ x, y, s, col: col || W, t: 0 }); }
let msgT = 0;
function say(s, sec){ const m = document.getElementById('msg'); m.textContent = s; m.hidden = false; msgT = sec || 2.2; }

// ── PARTICLES ──
function part(x, y, vx, vy, life, kind, g){ if (G.parts.length < 700) G.parts.push({ x, y, vx, vy, t: 0, life, kind, g: g == null ? GRAV : g }); }
function boom(x, y, big){
  const n = big ? 70 : 34;
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = (big ? 50 : 30) + Math.random() * (big ? 110 : 70); part(x, y, Math.cos(a) * s, Math.sin(a) * s - 30, .5 + Math.random() * .7, 'fire'); }
  for (let i = 0; i < (big ? 14 : 7); i++) part(x + (Math.random() - .5) * 10, y - 4, (Math.random() - .5) * 20, -12 - Math.random() * 18, 1.4 + Math.random() * 1.6, 'smoke', -6);
  for (let i = 0; i < (big ? 12 : 5); i++) part(x, y, (Math.random() - .5) * 160, -60 - Math.random() * 120, 1.6, 'debris');
  G.shake = Math.max(G.shake, big ? 5 : 3); S_BOOM(big);
}

// ── HITTING THINGS ──
function hitTarget(t, dmg, x, y){
  if (t.hp <= 0) return;
  if (!G.awake){ G.awake = true; G.spawnT = Math.min(G.spawnT, 6); }   // varj1: the airfield wakes up when you start blowing things up
  t.hp -= dmg; part(x, y, (Math.random() - .5) * 60, -40, .3, 'spark');
  if (t.hp > 0) return;
  G.score += t.score; pop(t.x, groundAt(t.x) - t.h - 8, '+' + t.score, C);
  boom(t.x, groundAt(t.x) - t.h / 2, t.kind !== 'factory'); t.burn = 14;
  if (t.kind === 'tank') G.targets.forEach(o => { if (o !== t && Math.abs(o.x - t.x) < 50) hitTarget(o, 6, o.x, groundAt(o.x) - 4); });
  const left = alive();
  if (G.mi === 2){ if (!left && G.zep) say('THE GROUND IS CLEAR. NOW THE ZEPPELIN!', 2.4); }
  else if (left) say(left + (left === 1 ? ' TARGET LEFT' : ' TARGETS LEFT'), 1.6);
  else { G.wonT = 2.2; say('ALL TARGETS DOWN!', 3); }
}
function targetAt(x, y, pad){
  for (const t of G.targets){ if (t.hp <= 0) continue; const g = groundAt(t.x); if (Math.abs(x - t.x) <= t.w / 2 + pad && y >= g - t.h - (t.kind === 'factory' ? 4 : 0) - pad && y <= g + 2) return t; }
  return null;
}
function launchCows(x, r){
  G.cows.forEach(c => { if (Math.abs(c.x - x) < r && !c.air){ c.air = true; c.vy = -120 - Math.random() * 50; c.spin = Math.random() < .5 ? -1 : 1; S_MOO(); pop(c.x, groundAt(c.x) - 18, 'MOO!', M); } });
}
function bombBlast(x, y){
  boom(x, y, false); crater(x, 9);
  G.targets.forEach(t => { if (t.hp > 0 && Math.abs(t.x - x) < t.w / 2 + 12 && y > groundAt(t.x) - t.h - 16) hitTarget(t, 12, t.x, y); });
  launchCows(x, 34);
  G.enemies.forEach(e => { if (e.ground && Math.abs(e.x - x) < 16){ e.hp = 0; downEnemy(e); } });
}
function crash(){
  if (P.dead) return;
  boom(P.x, P.y, true); P.dead = 2.6; G.lives--; P.down = false;
  say(G.lives > 0 ? 'CRASHED · ' + G.lives + ' PLANE' + (G.lives > 1 ? 'S' : '') + ' LEFT' : 'NO PLANES LEFT', 2.4);
}
function downEnemy(e){ if (e.down) return; e.down = true; e.spin = Math.random() < .5 ? -2.6 : 2.6; G.score += 200; G.kills++; pop(e.x, e.y - 10, '+200', C); S_HIT(); }

// ── PLAYER ──
function input(){
  const k = c => KEYS.has(c);
  return { rot: (k('l') ? -1 : 0) + (k('r') ? 1 : 0), boost: k('boost'), fire: k('fire'), bomb: TAPS.has('bomb') };
}
function stepPlayer(dt, I){
  if (P.dead){ P.dead -= dt; if (P.dead <= 0){ if (G.lives > 0){ resetPlayer(); say('NEW PLANE ON THE RUNWAY', 1.6); } else end(false); } return; }
  P.gunT -= dt; P.bombT -= dt; P.boost = I.boost && P.fuel > 0;
  if (P.down) I = { rot: 0, boost: false, fire: false, bomb: false };
  if (P.ground){
    const noseUp = I.rot === -P.dir, noseDown = I.rot === P.dir;
    P.taxi = P.fuel > 0 && (I.boost || noseUp);
    if (P.taxi) P.v += (BOOST - 1.1 * P.v) * dt; else P.v = Math.max(0, P.v - 70 * dt);
    if (noseDown && P.v < 6 && !P.turnLock){ P.dir = -P.dir; P.turnLock = true; }
    if (!noseDown) P.turnLock = false;
    P.x += P.dir * P.v * dt;
    const lo = RUN0[0] + 8, hi = RUN0[1] - 8;
    const lift = (noseUp && P.v > 55) || ((P.x <= lo || P.x >= hi) && P.v > 55);
    if (P.x < lo){ P.x = lo; if (!lift) P.v = 0; }
    if (P.x > hi){ P.x = hi; if (!lift) P.v = 0; }
    P.a = P.dir > 0 ? 0 : Math.PI; P.y = groundAt(P.x) - 5;
    if (lift){ P.ground = false; P.a = P.dir > 0 ? -.3 : Math.PI + .3; P.y -= 2; P.liftT = .45; return; }
    if (P.v < 15){
      const was = P.fuel < 99.5 || P.ammo < 150 || P.bombs < 8 || P.hp < 5;
      P.fuel = Math.min(100, P.fuel + 30 * dt); P.ammo = Math.min(150, P.ammo + 60 * dt); P.hp = Math.min(5, P.hp + 1.2 * dt);
      if (P.bombs < 8){ P.bombAcc += dt; if (P.bombAcc > .45){ P.bombAcc = 0; P.bombs++; } }
      if (was && P.fuel >= 99.5 && P.ammo >= 150 && P.bombs >= 8 && P.hp >= 5) say('REFUELLED · READY', 1.4);
      P.refuel = was;
    } else P.refuel = false;
    return;
  }
  P.refuel = false;
  P.liftT = Math.max(0, (P.liftT || 0) - dt);   // just off the runway: a held pull-up key doesn't flip the plane into a loop
  P.a += I.rot * TURN * dt * (P.v < STALL ? .5 : 1) * (P.liftT > 0 ? .25 : 1);
  if (P.down) P.a += angDiff(P.a, Math.PI / 2) * Math.min(1, 1.4 * dt) + 2.2 * dt * Math.sign(Math.cos(P.a) || 1);
  const thrust = P.fuel > 0 && !P.down ? (P.boost ? BOOST : THR) : 0;
  P.fuel = Math.max(0, P.fuel - (P.boost ? 2.6 : .75) * dt);
  if (P.fuel === 0 && !P.noFuelSaid){ P.noFuelSaid = true; say('OUT OF FUEL · GLIDE HOME', 2.5); }
  P.v = clamp(P.v + (thrust - DRAG * P.v + GRAV * Math.sin(P.a)) * dt, 0, VMAX);
  if (P.v < STALL){ P.fall += GRAV * dt; P.a += angDiff(P.a, Math.PI / 2) * Math.min(1, 1.5 * dt); } else P.fall *= Math.exp(-2.5 * dt);
  P.x += Math.cos(P.a) * P.v * dt; P.y += Math.sin(P.a) * P.v * dt + P.fall * dt;
  if (P.y < 4){ P.y = 4; P.fall = 0; if (Math.sin(P.a) < 0) P.v *= Math.exp(-1.5 * dt); }
  if (P.x < 4 || P.x > WW - 4){ P.x = clamp(P.x, 4, WW - 4); P.a = Math.PI - P.a; }
  if (P.hp <= 2 && Math.random() < (P.hp <= 1 ? .5 : .25)) part(P.x - Math.cos(P.a) * 6, P.y, 0, 0, 1.2, 'smoke', -10);
  if (P.y + 4 >= groundAt(P.x)){
    const levelish = Math.abs(Math.sin(P.a)) < .32;
    if (!P.down && P.x > RUN0[0] && P.x < RUN0[1] && levelish && P.v < 135 && P.fall < 50){
      P.ground = true; P.dir = Math.cos(P.a) > 0 ? 1 : -1; P.v = Math.min(P.v, 80); P.fall = 0; P.noFuelSaid = false; S_LAND(); say('LANDED · REFUELLING', 1.6);
    } else crash();
    return;
  }
  for (const c of G.cows) if (!c.air && Math.abs(c.x - P.x) < 7 && P.y > groundAt(c.x) - 10){ crash(); return; }
  if (I.fire && P.gunT <= 0 && P.ammo >= 1){
    P.gunT = .085; P.ammo--; const ca = Math.cos(P.a), sa = Math.sin(P.a), s = 290 + P.v;
    G.pb.push({ x: P.x + ca * 10, y: P.y + sa * 10, vx: ca * s, vy: sa * s, t: 0 }); part(P.x + ca * 11, P.y + sa * 11, 0, 0, .05, 'flash', 0); S_GUN();
  }
  if (I.bomb && P.bombT <= 0 && P.bombs > 0){
    P.bombT = .3; P.bombs--;
    G.bombs.push({ x: P.x, y: P.y + 4, vx: Math.cos(P.a) * P.v * .9, vy: Math.sin(P.a) * P.v * .9 + P.fall, t: 0 }); S_WHISTLE();
  } else if (I.bomb && P.bombs <= 0) say('NO BOMBS · LAND TO RE-ARM', 1.4);
}

// ── ENEMY PLANES: take off from their airfield while a hangar stands ──
function stepEnemies(dt){
  G.spawnT -= dt;
  const hangar = G.targets.some(t => t.kind === 'hangar' && t.hp > 0);
  if (G.state === 'play' && hangar && G.spawnT <= 0 && G.enemies.filter(e => !e.down).length < (G.t > 120 ? 3 : 2) && (G.awake || P.x > 1900)){
    G.spawnT = 13; G.enemies.push({ x: RUN1[1] - 10, y: GY - 5, a: Math.PI, v: 0, hp: 3, gunT: 1.5, ground: true, down: false, fall: 0, burst: 0, seed: Math.random() * 9 });
    if (!G.warned){ G.warned = true; say('ENEMY PLANE TAKING OFF!', 2); }
  }
  for (const e of G.enemies){
    e.gunT -= dt;
    if (e.ground){ e.v += (130 - e.v) * 1.3 * dt; e.x -= e.v * dt; e.y = groundAt(e.x) - 5; if (e.v > 62){ e.ground = false; e.a = Math.PI + .35; } continue; }
    if (e.down){
      e.a += e.spin * dt; e.fall += GRAV * dt * .8; e.x += Math.cos(e.a) * e.v * .5 * dt; e.y += e.fall * dt;
      if (Math.random() < .6) part(e.x, e.y, 0, 0, 1.3, 'smoke', -10);
      if (e.y + 3 >= groundAt(e.x)){ e.dead = true; boom(e.x, e.y, false); crater(e.x, 6); launchCows(e.x, 26); const t = targetAt(e.x, e.y - 4, 4); if (t) hitTarget(t, 8, e.x, e.y); }
      continue;
    }
    let tx, ty;
    const chase = !P.dead && !P.ground && G.state === 'play';
    if (chase){ tx = P.x + Math.cos(P.a) * P.v * .45; ty = P.y + Math.sin(P.a) * P.v * .45 + Math.sin(G.t * 1.3 + e.seed) * 14; }
    else { tx = 1700 + Math.sin(G.t * .2 + e.seed) * 700; ty = 60 + Math.sin(G.t * .5 + e.seed) * 20; }
    let want = Math.atan2(ty - e.y, tx - e.x);
    const lx = e.x + Math.cos(e.a) * 46, ly = e.y + Math.sin(e.a) * 46;
    if (ly > groundAt(lx) - 24 || e.y > groundAt(e.x) - 28) want = Math.cos(e.a) > 0 ? -.9 : Math.PI + .9;
    if (e.y < 16) want = Math.cos(e.a) > 0 ? .35 : Math.PI - .35;
    e.a += clamp(angDiff(e.a, want), -2.25 * dt, 2.25 * dt);
    e.v = clamp(e.v + (THR + 12 - DRAG * e.v + GRAV * Math.sin(e.a)) * dt, 62, 190);
    e.x += Math.cos(e.a) * e.v * dt; e.y += Math.sin(e.a) * e.v * dt;
    if (e.x < 4 || e.x > WW - 4){ e.x = clamp(e.x, 4, WW - 4); e.a = Math.PI - e.a; }
    if (e.hp <= 1 && Math.random() < .3) part(e.x, e.y, 0, 0, 1, 'smoke', -10);
    if (chase){
      const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy);
      if (d < 165 && Math.abs(angDiff(e.a, Math.atan2(dy, dx))) < .13 && e.gunT <= 0){
        const ca = Math.cos(e.a), sa = Math.sin(e.a), s = 250 + e.v;
        G.eb.push({ x: e.x + ca * 10, y: e.y + sa * 10, vx: ca * s, vy: sa * s, t: 0 });
        e.burst++; e.gunT = e.burst % 5 ? .13 : 1.1; S_GUN();
      }
      if (!P.dead && d < 9){ downEnemy(e); e.dead = true; boom(e.x, e.y, false); crash(); }
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}

// ── BULLETS, BOMBS, BIRDS, COWS ──
function stepShots(dt){
  for (const b of G.pb){
    b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y >= groundAt(b.x)){ b.t = 9; part(b.x, b.y - 1, (Math.random() - .5) * 40, -30, .25, 'dust'); continue; }
    const t = targetAt(b.x, b.y, 0); if (t){ hitTarget(t, 1, b.x, b.y); b.t = 9; continue; }
    if (zepIn(b.x, b.y, 0)){ zepHurt(1, b.x, b.y); b.t = 9; if (G.tick % 3 === 0) S_HIT(); continue; }
    for (const e of G.enemies) if (!e.down && Math.abs(e.x - b.x) < 7 && Math.abs(e.y - b.y) < 6){ e.hp--; b.t = 9; part(b.x, b.y, 0, -20, .2, 'spark'); if (e.hp <= 0) downEnemy(e); else S_HIT(); break; }
    for (const c of G.cows) if (!c.air && Math.abs(c.x - b.x) < 6 && b.y > groundAt(c.x) - 9){ c.air = true; c.vy = -60; c.spin = 0; b.t = 9; pop(c.x, groundAt(c.x) - 16, 'MOO?', M); S_MOO(); }
    for (const bd of G.birds) if (!bd.gone && !bd.scare && Math.abs(bd.x - b.x) < 6 && Math.abs(bd.y - b.y) < 5){ bd.scare = 1; bd.vx = (Math.random() - .5) * 90; bd.vy = -80; }
  }
  G.pb = G.pb.filter(b => b.t < .62);
  for (const b of G.eb){
    b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y >= groundAt(b.x)){ b.t = 9; continue; }
    if (!P.dead && Math.abs(P.x - b.x) < 6 && Math.abs(P.y - b.y) < 5){
      b.t = 9; P.hp--; part(b.x, b.y, 0, -20, .2, 'spark'); S_HIT(); G.shake = Math.max(G.shake, 1.5);
      if (P.hp <= 0 && !P.ground && !P.down){ P.down = true; say('SHOT DOWN!', 1.6); } else if (P.hp <= 0 && P.ground) crash();
    }
  }
  G.eb = G.eb.filter(b => b.t < .7);
  for (const b of G.bombs){
    b.t += dt; b.vy += GRAV * 1.25 * dt; b.vx *= Math.exp(-.25 * dt); b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 0 || b.x >= WW){ b.t = 99; continue; }
    if (zepIn(b.x, b.y, 1)){ b.t = 99; boom(b.x, b.y, false); zepHurt(12, b.x, b.y); continue; }
    if (b.y >= groundAt(b.x) || targetAt(b.x, b.y, 0)){ b.t = 99; bombBlast(b.x, Math.min(b.y, groundAt(b.x))); }
  }
  G.bombs = G.bombs.filter(b => b.t < 99);
}
function stepCritters(dt){
  for (const b of G.birds){
    if (b.gone){ b.gone -= dt; if (b.gone <= 0){ b.gone = 0; b.scare = 0; b.x = b.hx; b.y = b.hy - 60; } continue; }
    b.ph += dt * (b.scare ? 18 : 7);
    if (b.scare){ b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 20 * dt; if (b.y < -10){ b.gone = 8; } }
    else {
      b.x += (b.hx + Math.sin(G.t * .7 + b.ph * .1) * 14 - b.x) * Math.min(1, dt * 1.5); b.y += (b.hy + Math.sin(G.t * 1.1 + b.ph * .2) * 4 - b.y) * Math.min(1, dt * 1.5);
      if (!P.dead && !P.ground){
        const d = Math.hypot(P.x - b.x, P.y - b.y);
        if (d < 30) b.startle = (b.startle || 0) + dt; else b.startle = 0;
        if (b.startle > .22){ b.scare = 1; b.vx = (b.x - P.x) * 3; b.vy = -70 - Math.random() * 40; }
        if (d < 6){ b.gone = 10; P.hp--; S_HIT(); pop(b.x, b.y - 8, 'BIRD STRIKE', W); for (let i = 0; i < 8; i++) part(b.x, b.y, (Math.random() - .5) * 60, (Math.random() - .5) * 60, .9, 'feather', 25); if (P.hp <= 0 && !P.down){ P.down = true; } }
      }
    }
  }
  for (const c of G.cows){
    if (c.air){ c.vy += GRAV * 1.6 * dt; c.oy += c.vy * dt; if (c.oy >= 0){ c.oy = 0; c.vy = 0; c.air = false; c.rest = 1.5; } continue; }
    c.rest -= dt;
    if (c.rest < 0){ c.x += c.dir * 6 * dt; if (Math.abs(c.x - c.home) > 34 || Math.random() < .002){ c.dir = -c.dir; } if (Math.random() < .004) c.rest = 2 + Math.random() * 3; }
  }
  for (const p of G.parts){ p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'smoke'){ p.vx *= .98; p.x += 6 * dt; } if ((p.kind === 'debris' || p.kind === 'fire') && p.y > groundAt(p.x)){ p.y = groundAt(p.x); p.vy *= -.3; p.vx *= .6; } }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const t of G.targets){
    if (t.hp <= 0){ t.fallT += dt; if (t.burn > 0){ t.burn -= dt; if (Math.random() < .5) part(t.x + (Math.random() - .5) * t.w * .7, groundAt(t.x) - 3, (Math.random() - .5) * 10, -25 - Math.random() * 20, .6, 'fire', -5); } if (Math.random() < .08) part(t.x, groundAt(t.x) - 5, 0, -10, 2.5, 'smoke', -4); }
    else if (t.kind === 'factory' && Math.random() < .03) part(t.x + 8, groundAt(t.x) - 27, 4, -10, 2.4, 'chimney', -2);
  }
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < 1.2);
}

// ── ONE FIXED STEP ──
function step(dt){
  G.t += dt; G.tick++;
  const I = G.state === 'play' ? input() : { rot: 0, boost: false, fire: false, bomb: false };
  TAPS.clear();
  if (G.state === 'play') stepPlayer(dt, I);
  stepEnemies(dt); stepLights(dt); stepAA(dt); stepZep(dt); stepShots(dt); stepCritters(dt);
  if (G.wonT > 0 && G.state === 'play'){ G.wonT -= dt; if (G.wonT <= 0) end(true); }
  G.shake = Math.max(0, G.shake - dt * 8);
  if (msgT > 0){ msgT -= dt; if (msgT <= 0) document.getElementById('msg').hidden = true; }
  const goal = G.state === 'title' ? (G.t * 30) % (WW - VW) : clamp(P.x - VW / 2 + Math.cos(P.a) * VW * .16 * (P.ground ? .3 : 1), 0, WW - VW);
  camX = G.state === 'title' ? goal : camX + (goal - camX) * (1 - Math.exp(-4 * dt));
  for (const c of CLOUDS){ c.x -= c.v * dt; if (c.x < -80) c.x += WW * .6 + VW + 80; }
  speaker(dt);
}

// ── DRAW ──
function draw(){
  const sh = G.shake > 0 && !RM ? Math.round((Math.random() - .5) * G.shake * 2) : 0, cx = Math.round(camX) + sh, sy = sh ? Math.round((Math.random() - .5) * G.shake) : 0;
  ctx.setTransform(1, 0, 0, 1, 0, sy);
  ctx.drawImage(sky, 0, 0);
  ctx.drawImage(FAR, Math.round(-camX * .2), 0);
  if (!MIS[G.mi].night) for (const c of CLOUDS) ctx.drawImage(c.c, Math.round(c.x - camX * .55), Math.round(c.y));
  ctx.drawImage(MID, Math.round(-camX * .45), 0);
  ctx.drawImage(tc, cx, 0, VW, H, 0, 0, VW, H);
  const vis = (x, m) => x > cx - m && x < cx + VW + m;
  if (vis(40, 40)) drawHangar({ x: 40 }, 40 - cx, true);
  if (vis(320, 10)) drawWindsock(320 - cx, 0, G.t);
  for (const t of G.targets) if (t.kind === 'light' && t.hp > 0 && vis(t.x, BEAM_L)) drawBeam(t, Math.round(t.x - cx));
  for (const t of G.targets) if (vis(t.x, 40)){ const sx = Math.round(t.x - cx); t.kind === 'factory' ? drawFactory(t, sx) : t.kind === 'tank' ? drawTank(t, sx) : t.kind === 'aa' ? drawAA(t, sx) : t.kind === 'light' ? drawLight(t, sx) : drawHangar(t, sx, false); }
  for (const c of G.cows) if (vis(c.x, 12)){
    const img = COW[c.dir > 0 ? 0 : 1], x = Math.round(c.x - cx - img.width / 2), y = Math.round(groundAt(c.x) - img.height + 1 + c.oy);
    if (c.air && c.spin){ ctx.save(); ctx.translate(x + img.width / 2, y + img.height / 2); ctx.rotate(Math.round(c.oy / 12) * c.spin * Math.PI / 2); ctx.drawImage(img, -img.width / 2 | 0, -img.height / 2 | 0); ctx.restore(); }
    else ctx.drawImage(img, x, y);
  }
  for (const b of G.birds) if (!b.gone && vis(b.x, 8)) ctx.drawImage(BIRD[(b.ph | 0) % 2], Math.round(b.x - cx - 3), Math.round(b.y - 2));
  for (const p of G.parts){
    if (!vis(p.x, 8)) continue;
    const x = Math.round(p.x - cx), y = Math.round(p.y), k = p.t / p.life;
    if (p.kind === 'fire') px(x, y, k < .3 ? 2 : 1, k < .3 ? 2 : 1, k < .25 ? W : k < .6 ? C : M);
    else if (p.kind === 'smoke' || p.kind === 'chimney' || p.kind === 'flak') { const img = p.kind === 'chimney' ? PUFF_S : (k < .3 ? PUFF_W : PUFF_M); ctx.drawImage(img, x - (img.width >> 1) + (k > .6 ? 1 : 0), y - (img.height >> 1)); }
    else if (p.kind === 'debris') px(x, y, 2, 2, K), px(x, y, 1, 1, W);
    else if (p.kind === 'flash') px(x - 1, y - 1, 3, 3, W);
    else if (p.kind === 'feather') px(x, y, 2, 1, W);
    else px(x, y, 1, 1, p.kind === 'dust' ? M : W);
  }
  for (const b of G.bombs){ const x = Math.round(b.x - cx), y = Math.round(b.y), a = Math.atan2(b.vy, b.vx); px(x - 1, y - 1, 3, 3, K); px(x, y, 1, 1, W); px(Math.round(x - Math.cos(a) * 2), Math.round(y - Math.sin(a) * 2), 1, 1, M); }
  for (const b of G.pb){ const x = Math.round(b.x - cx), y = Math.round(b.y); px(x, y, 1, 1, W); px(Math.round(x - b.vx * .008), Math.round(y - b.vy * .008), 1, 1, C); }
  for (const f of G.flak){ const x = Math.round(f.x - cx), y = Math.round(f.y); px(x, y, 1, 1, W); px(Math.round(x - f.vx * .01), Math.round(y - f.vy * .01), 1, 1, M); }
  for (const b of G.eb){ const x = Math.round(b.x - cx), y = Math.round(b.y); px(x, y, 1, 1, M); px(Math.round(x - b.vx * .008), Math.round(y - b.vy * .008), 1, 1, W); }
  drawZep(cx);
  for (const e of G.enemies) if (vis(e.x, 16)){ const f = frameOf(SPR_E, e.a); ctx.drawImage(f, Math.round(e.x - cx - f.width / 2), Math.round(e.y - f.height / 2)); }
  if (P && !P.dead && G.state !== 'title'){ const f = frameOf(SPR_P, P.a); ctx.drawImage(f, Math.round(P.x - cx - f.width / 2), Math.round(P.y - f.height / 2)); }
  if (G.state === 'title'){ for (const e of [{ x: camX + VW * .3 + Math.sin(G.t) * 20, y: 70 + Math.sin(G.t * 1.3) * 10, a: Math.sin(G.t * .9) * .25 }]){ const f = frameOf(SPR_P, e.a); ctx.drawImage(f, Math.round(e.x - cx - f.width / 2), Math.round(e.y - f.height / 2)); } }
  for (const p of G.pops){ const img = textSprite(p.s, p.col); ctx.drawImage(img, Math.round(p.x - cx - img.width / 2), Math.round(p.y - p.t * 14)); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawMap();
}
function drawMap(){   // the classic strip map in the ground: you in white, targets in magenta, enemies in cyan
  const mw = 150, mh = 16, x0 = Math.round((VW - mw) / 2), y0 = H - mh - 2, s = WW / mw;
  px(x0 - 2, y0 - 2, mw + 4, mh + 4, W); px(x0 - 1, y0 - 1, mw + 2, mh + 2, K);
  for (let i = 0; i < mw; i++){ const g = hgt[Math.floor(i * s)]; px(x0 + i, y0 + Math.round((g - 120) / 70 * mh), 1, 1, M); }
  const dot = (x, y, col, w) => px(x0 + Math.round(x / s) - (w >> 1), y0 + clamp(Math.round((y - 120) / 70 * mh), -1, mh - 1) - (w >> 1), w, w, col);
  px(x0 + Math.round(RUN0[0] / s), y0 + mh - 4, Math.round((RUN0[1] - RUN0[0]) / s), 1, W);
  for (const t of G.targets) if (t.hp > 0) dot(t.x, groundAt(t.x) - 6, M, 2);
  for (const e of G.enemies) dot(e.x, Math.min(e.y, 185), C, 2);
  if (G.zep && !G.zep.dead && (G.tick >> 3) % 2){ dot(G.zep.x - 25, G.zep.y, W, 2); dot(G.zep.x, G.zep.y, W, 2); dot(G.zep.x + 25, G.zep.y, W, 2); }
  if (P && !P.dead && G.state !== 'title' && (G.tick >> 4) % 4) dot(P.x, Math.min(P.y, 185), W, 2);
  px(x0 + Math.round(camX / s), y0 - 1, Math.round(VW / s), 1, C);
}

// ── HUD, SCREENS, INPUT ──
const $ = id => document.getElementById(id);
let hudT = 0;
function hud(dt){
  hudT -= dt; if (hudT > 0 || !P) return; hudT = .1;
  const f = $('hFuel'); f.style.width = Math.round(P.fuel) + '%'; f.classList.toggle('low', P.fuel < 25);
  $('hAmmo').textContent = Math.floor(P.ammo); $('hBombs').textContent = P.bombs;
  $('hScore').textContent = G.score; const zp = G.mi === 2; $('hLeftL').textContent = zp ? 'ZEPPELIN' : 'LEFT';
  $('hLeft').textContent = zp ? (G.zep && !G.zep.dead ? Math.max(1, Math.ceil(G.zep.hp / G.zep.max * 100)) + '%' : 'DOWN') : alive();
  $('hLives').textContent = '✈'.repeat(Math.max(0, G.lives)); $('hLives').setAttribute('aria-label', G.lives + ' planes left');
}
/* progress: which missions are open, and the best score/time on each (mission 1's old record carries over) */
let PROG = { open: 1, best: [] };
try { const o = JSON.parse(localStorage.getItem('sopwith-dawn-prog') || 'null'); if (o && o.best) PROG = o;
  else { const b = JSON.parse(localStorage.getItem('sopwith-dawn-best') || 'null'); if (b) PROG.best[0] = b; if (b && b.time) PROG.open = 2; } } catch(e){}
const saveProg = () => { try { localStorage.setItem('sopwith-dawn-prog', JSON.stringify(PROG)); } catch(e){} };
let BEST = PROG.best[0] || null;
function showBest(){ BEST = PROG.best[MI] || null; $('best').textContent = BEST ? 'Best: ' + BEST.score + ' points' + (BEST.time ? ' · cleared in ' + fmt(BEST.time) : '') : ''; }
function pickMission(i, fly){
  MI = clamp(i, 0, Math.min(PROG.open, MIS.length) - 1); SPOTS = MIS[MI].spots;
  $('mis').querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-pressed', String(k === MI)));
  $('mname').textContent = 'MISSION ' + (MI + 1) + ' · ' + MIS[MI].name; $('mbrief').textContent = MIS[MI].brief; showBest();
  if (!fly && G && G.state === 'title') newWorld('title');
}
function misButtons(){
  const box = $('mis'); box.innerHTML = '';
  MIS.forEach((m, k) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = k + 1;
    const open = k < PROG.open; b.disabled = !open; if (PROG.best[k] && PROG.best[k].time) b.classList.add('done');
    b.setAttribute('aria-label', 'Mission ' + (k + 1) + ', ' + m.name + (open ? '' : ', locked: clear mission ' + k + ' first'));
    b.title = open ? m.name : 'Clear mission ' + k + ' to open it';
    b.addEventListener('click', () => pickMission(k)); box.append(b); });
  pickMission(MI);
}
function toTitle(){ $('end').hidden = true; $('paused').hidden = true; newWorld('title'); misButtons(); $('title').hidden = false; $('go').focus({ preventScroll: true }); }
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function start(){ audioOn(); SPOTS = MIS[MI].spots; newWorld('play'); $('title').hidden = true; $('end').hidden = true; $('paused').hidden = true; say(MI ? 'MISSION ' + (MI + 1) + ' · ' + MIS[MI].name : document.body.classList.contains('touch') ? 'HOLD BOOST, THEN ↺ TO LIFT OFF' : 'HOLD ↑, THEN ← TO LIFT OFF', 3); cv.focus(); }
function end(won){
  if (G.state !== 'play') return;
  G.state = 'over'; if (won) S_WIN();
  const sc = G.score + (won ? G.lives * 300 : 0);
  $('endh').textContent = won ? 'MISSION COMPLETE' : G.mi === 2 && G.zep && G.zep.lostT ? 'AIRFIELD BOMBED' : 'GROUNDED';
  $('ends').textContent = won ? 'All ' + G.targets.length + ' targets down in ' + fmt(G.t) + ' with ' + G.lives + ' plane' + (G.lives === 1 ? '' : 's') + ' to spare (+' + G.lives * 300 + '). Score ' + sc + '.' : (G.targets.length - alive()) + ' of ' + G.targets.length + ' targets down, ' + G.kills + ' planes shot down. Score ' + sc + '.';
  BEST = PROG.best[MI] || null;
  if (!BEST || sc > BEST.score || (won && (!BEST.time || G.t < BEST.time))){ BEST = PROG.best[MI] = { score: Math.max(sc, BEST ? BEST.score : 0), time: won ? Math.min(G.t, BEST && BEST.time || 1e9) : BEST && BEST.time }; }
  const opened = won && MI + 1 < MIS.length && PROG.open < MI + 2; if (won) PROG.open = Math.max(PROG.open, Math.min(MIS.length, MI + 2)); saveProg();
  if (G.mi === 2) $('ends').textContent = won ? 'The zeppelin came down in ' + fmt(G.t) + ' with ' + G.lives + ' plane' + (G.lives === 1 ? '' : 's') + ' to spare (+' + G.lives * 300 + '). Score ' + sc + '.'
    : (G.zep && G.zep.lostT ? 'The zeppelin got through with ' : 'Out of planes, with the zeppelin still at ') + (G.zep ? Math.max(1, Math.ceil(G.zep.hp / G.zep.max * 100)) : 0) + '% of its hull. Score ' + sc + '.';
  if (opened) $('ends').textContent += ' Mission ' + (MI + 2) + ' is open: ' + MIS[MI + 1].name + '.';
  $('next').hidden = !(won && MI + 1 < MIS.length); $('again').textContent = won ? '▶ FLY AGAIN' : '▶ TRY AGAIN';
  $('end').hidden = false; ($('next').hidden ? $('again') : $('next')).focus();
}
function pause(on){ if (!G || (G.state !== 'play' && G.state !== 'paused')) return; G.state = on ? 'paused' : 'play'; $('paused').hidden = !on; if (on) $('resume').focus(); else cv.focus(); }
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'boost', KeyW: 'boost', Space: 'fire', KeyJ: 'fire', KeyF: 'fire', ArrowDown: 'bomb', KeyS: 'bomb', KeyB: 'bomb', KeyK: 'bomb' };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Enter' || e.code === 'Space') && G.state !== 'play') return;
  const k = KMAP[e.code];
  if (k){ e.preventDefault(); if (!KEYS.has(k)) TAPS.add(k); KEYS.add(k); audioOn(); }
  if (e.code === 'KeyP' || e.code === 'Escape') pause(G.state === 'play');
  if (e.code === 'KeyM') toggleMute();
  if ((e.code === 'Enter' || e.code === 'Space') && G.state === 'title') { e.preventDefault(); start(); }
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) KEYS.delete(k); });
addEventListener('blur', () => { KEYS.clear(); pause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ KEYS.clear(); pause(true); } });
document.querySelectorAll('.pb').forEach(b => {
  const k = b.dataset.k, on = e => { e.preventDefault(); audioOn(); if (!KEYS.has(k)) TAPS.add(k); KEYS.add(k); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch(_){} }, off = () => { KEYS.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function toggleMute(){ muted = !muted; $('mute').setAttribute('aria-pressed', String(muted)); $('mute').textContent = muted ? 'MUTE' : 'SND'; $('mute').setAttribute('aria-label', muted ? 'Sound on' : 'Sound off'); if (AMP) AMP.gain.value = 0; if (!muted) audioOn(); }
$('mute').addEventListener('click', toggleMute);
$('go').addEventListener('click', () => start()); $('again').addEventListener('click', () => start());
$('next').addEventListener('click', () => { pickMission(MI + 1, true); start(); }); $('menu').addEventListener('click', toTitle);
$('resume').addEventListener('click', () => pause(false));
addEventListener('pointerdown', e => { if (e.pointerType === 'touch') document.body.classList.add('touch'), fit(); }, { once: true });
if (matchMedia('(hover: none) and (pointer: coarse)').matches) document.body.classList.add('touch');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── SIZE: 200 pixels tall like the old CGA screen, as wide as the window allows ──
function fit(){
  const touch = document.body.classList.contains('touch'), aw = innerWidth, ah = innerHeight;
  const portrait = ah > aw * 1.1, padH = touch && portrait ? 120 : 0;
  const nv = clamp(Math.round(H * aw / (ah - padH)), 300, 400);
  if (nv !== VW){ VW = nv; cv.width = VW; cv.height = H; ctx.imageSmoothingEnabled = false; buildSky(); }
  const sc = Math.min(aw / VW, (ah - padH) / H), st = $('stage');
  st.style.width = Math.floor(VW * sc) + 'px'; st.style.height = Math.floor(H * sc) + 'px';
  document.body.classList.toggle('over', touch && !portrait);
}
addEventListener('resize', fit);

// ── LOOP ──
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!frozen && G.state !== 'paused'){ acc += dt; let n = 0; while (acc >= 1 / 60 && n < 6){ step(1 / 60); acc -= 1 / 60; n++; } if (n === 6) acc = 0; }
  draw(); hud(dt);
  requestAnimationFrame(frame);
}
buildSprites(); buildClouds(); MI = Math.min(PROG.open, MIS.length) - 1; SPOTS = MIS[MI].spots; newWorld('title'); fit(); buildSky(); misButtons();
document.fonts && document.fonts.load('8px Silkscreen').then(() => TXT.clear()).catch(() => {});
requestAnimationFrame(frame);
$('go').focus({ preventScroll: true });
window.__S = { G: () => G, P: () => P, zepHurt, inBeam, start, pick: i => { PROG.open = Math.max(PROG.open, i + 1); misButtons(); pickMission(i); }, prog: () => PROG, end, step: (n, keys) => { KEYS.clear(); (keys || []).forEach(k => { KEYS.add(k); TAPS.add(k); }); for (let i = 0; i < (n || 1); i++) step(1 / 60); KEYS.clear(); }, freeze: b => { frozen = b; }, draw, cam: () => camX };

})();
