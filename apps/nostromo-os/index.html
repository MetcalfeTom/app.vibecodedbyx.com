<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nostromo OS — MU/TH/UR 6000 interface simulator</title>
<meta name="description" content="A retrofuturistic shipboard computer: CRT boot sequence, draggable panels, ship systems, crew monitors — and MOTHER answers your inquiries. Try SPECIAL ORDER 937.">
<link rel="icon" href="https://emojicdn.elk.sh/🛰️">
<meta property="og:title" content="Nostromo OS — MU/TH/UR 6000 interface simulator">
<meta property="og:description" content="Boot the ship computer. Drag the panels. Ask MOTHER the wrong question.">
<meta property="og:url" content="https://sloppy.live/nostromo-os/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/1979%20retrofuturistic%20spaceship%20computer%20terminal%20room%2C%20green%20phosphor%20CRT%20screens%20with%20scanlines%2C%20chunky%20beige%20panels%2C%20blinking%20amber%20lights%2C%20alien%20nostromo%20aesthetic%2C%20film%20grain%2C%20dark.png?width=1200&height=630&nologo=true&seed=2122&model=flux">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ph:#7dff9e; --ph-dim:#3f8f57; --ph-dark:#123422; --amber:#ffb347; --red:#ff4b3a;
  --bg:#020604; --panel:#04120a; --edge:#1d4a2f;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:#000; color:var(--ph); font-family:'VT323', monospace;
  height:100vh; overflow:hidden; user-select:none;
}
#crt{
  position:fixed; inset:0; background:radial-gradient(130% 120% at 50% 40%, #051208, #010302 75%);
}
#crt::before{
  content:''; position:absolute; inset:0; z-index:80; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
}
#crt::after{
  content:''; position:absolute; inset:0; z-index:81; pointer-events:none;
  background:radial-gradient(135% 135% at 50% 50%, transparent 58%, rgba(0,0,0,.75));
}
.flicker{ animation:flick 6s infinite; }
@keyframes flick{ 0%,93%,100%{ opacity:1; } 94%{ opacity:.92; } 95%{ opacity:1; } 97%{ opacity:.95; } }
@media (prefers-reduced-motion: reduce){ .flicker{ animation:none; } .blink{ animation:none !important; } }

/* boot */
#boot{
  position:absolute; inset:0; z-index:60; padding:4vh 5vw; font-size:1.25rem; line-height:1.5;
  white-space:pre-wrap; cursor:pointer;
}
#boot .cur{ animation:blinkc 0.9s steps(1) infinite; }
@keyframes blinkc{ 50%{ opacity:0; } }
#boot small{ display:block; margin-top:2rem; color:var(--ph-dim); font-size:.9rem; }

/* status bar */
#bar{
  position:absolute; left:0; right:0; top:0; z-index:40; display:flex; align-items:center; gap:1rem;
  padding:.35rem .9rem; border-bottom:2px solid var(--edge); background:rgba(2,10,5,.8);
  font-family:'Michroma', sans-serif; font-size:.55rem; letter-spacing:.18em; color:var(--ph-dim);
}
#bar .lit{ color:var(--ph); }
#bar .amber{ color:var(--amber); }
#bar .right{ margin-left:auto; display:flex; gap:.5rem; align-items:center; }
#bar button{
  font-family:'Michroma'; font-size:.55rem; letter-spacing:.1em; cursor:pointer;
  background:none; color:var(--ph-dim); border:1px solid var(--edge); padding:.3rem .55rem; min-height:2rem;
}
#bar button:hover{ color:var(--ph); border-color:var(--ph-dim); }

/* desktop icons */
#icons{
  position:absolute; left:.9rem; top:3.4rem; z-index:10; display:flex; flex-direction:column; gap:.7rem;
}
.icon{
  width:5.4rem; background:none; border:0; cursor:pointer; color:var(--ph);
  display:flex; flex-direction:column; align-items:center; gap:.25rem; padding:.3rem;
}
.icon .glyph{
  width:3.1rem; height:3.1rem; border:2px solid var(--ph-dim); display:flex;
  align-items:center; justify-content:center; font-size:1.5rem; background:rgba(4,18,10,.7);
}
.icon:hover .glyph{ border-color:var(--ph); box-shadow:0 0 12px rgba(125,255,158,.25); }
.icon .lbl{ font-family:'Michroma'; font-size:.42rem; letter-spacing:.12em; color:var(--ph-dim); text-align:center; }
.icon:hover .lbl{ color:var(--ph); }
.icon.skull .glyph{ border-color:#4a3a1d; }
.icon.skull:hover .glyph{ border-color:var(--amber); box-shadow:0 0 12px rgba(255,179,71,.25); }

/* windows */
.win{
  position:absolute; z-index:20; min-width:17rem; max-width:min(34rem, 94vw);
  background:rgba(14,10,3,.94); border:2px solid #4a3a1d;
  box-shadow:0 0 0 1px #000, 0 8px 40px rgba(0,0,0,.7), 0 0 22px rgba(255,179,71,.07);
}
.win.focus{ border-color:var(--amber); }
.win .tb{
  display:flex; align-items:center; gap:.6rem; padding:.3rem .55rem; cursor:grab;
  background:linear-gradient(180deg, #241a08, #120c04); border-bottom:2px solid #4a3a1d;
  font-family:'Michroma'; font-size:.5rem; letter-spacing:.16em; color:var(--amber);
}
.win .tb .dots{ color:#8a6d3a; letter-spacing:.05em; }
.win .tb button{
  margin-left:auto; background:none; border:1px solid #4a3a1d; color:#8a6d3a;
  font-family:'VT323'; font-size:.9rem; width:1.7rem; height:1.7rem; cursor:pointer; line-height:1;
}
.win .tb button:hover{ color:var(--red); border-color:var(--red); }
.win .body{ padding:.6rem .7rem; font-size:1.05rem; line-height:1.35; }
.win pre{ font-family:'VT323'; font-size:.95rem; line-height:1.15; color:var(--ph-dim); }
.blink{ animation:blinkc 1.1s steps(1) infinite; }
.ambertx{ color:var(--amber); }
.redtx{ color:var(--red); }

/* mother terminal */
#motherlog{ height:13rem; overflow-y:auto; margin-bottom:.4rem; white-space:pre-wrap; }
#motherlog::-webkit-scrollbar{ width:.35rem; } #motherlog::-webkit-scrollbar-thumb{ background:var(--edge); }
.mrow{ display:flex; gap:.4rem; align-items:center; }
.mrow input{
  flex:1; background:none; border:0; outline:none; color:var(--ph);
  font-family:'VT323'; font-size:1.05rem; caret-color:var(--ph); text-transform:uppercase;
}
canvas.minicv{ display:block; width:100%; background:rgba(2,8,4,.6); border:1px solid var(--edge); }

/* destruct overlay */
#alert{
  position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:1rem; text-align:center;
  background:repeating-linear-gradient(0deg, rgba(60,0,0,.55) 0 6px, rgba(30,0,0,.55) 6px 12px);
}
#alert.on{ display:flex; }
#alert h2{ font-family:'Michroma'; color:var(--red); font-size:clamp(1rem,3.4vw,1.8rem); letter-spacing:.2em; }
#alert .count{ font-size:clamp(3.4rem,12vw,7rem); color:var(--red); text-shadow:0 0 30px rgba(255,75,58,.6); }
#alert p{ color:#ffb3a8; font-size:1.1rem; max-width:34rem; padding:0 1rem; }
#alert button{
  font-family:'Michroma'; font-size:.8rem; letter-spacing:.15em; cursor:pointer;
  background:none; color:var(--ph); border:2px solid var(--ph-dim); padding:.8rem 1.6rem; min-height:2.75rem;
}
#alert button:hover{ background:rgba(125,255,158,.1); }
#flash{ position:fixed; inset:0; z-index:90; background:#fff; opacity:0; pointer-events:none; transition:opacity .2s; }
.stamp{
  position:fixed; right:.6rem; bottom:.5rem; z-index:45; font-size:.85rem; color:var(--ph-dim);
  background:rgba(2,10,5,.7); border:1px solid var(--edge); padding:.05rem .4rem;
}
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
@media (max-width:40rem){
  #icons{ flex-direction:row; flex-wrap:wrap; left:.4rem; right:.4rem; gap:.3rem; }
  .icon{ width:4.4rem; }
  #bar{ font-size:.45rem; gap:.5rem; }
}
</style>
</head>
<body>
<main id="crt" class="flicker">
  <div id="boot" role="log" aria-live="polite"></div>

  <div id="bar" class="hidden" style="display:none">
    <span>MU/TH/UR 6000</span><span class="lit">INTERFACE 2037</span>
    <span class="amber" id="shipdate">06.03.2122</span>
    <div class="right">
      <span id="flighttime" class="lit">T+ 00:00:00</span>
      <button id="muteBtn" type="button" aria-pressed="false" aria-label="Toggle sound">SND</button>
      <button id="rebootBtn" type="button">REBOOT</button>
    </div>
  </div>

  <div id="icons" style="display:none" role="group" aria-label="Ship systems"></div>
  <div id="desktop"></div>

  <div id="alert" role="dialog" aria-modal="true" aria-label="Emergency destruct sequence">
    <h2>⚠ EMERGENCY DESTRUCT SYSTEM ACTIVATED ⚠</h2>
    <div class="count" id="destCount">60</div>
    <p id="destMsg">THE SHIP WILL AUTOMATICALLY DESTRUCT IN T-MINUS 60 SECONDS.<br>THE OPTION TO OVERRIDE EXPIRES IN 30 SECONDS.</p>
    <button id="abortBtn" type="button">OVERRIDE — CANCEL DESTRUCT</button>
  </div>
  <div id="flash"></div>
  <span class="stamp" id="stamp"></span>
</main>
<script>
'use strict';
const VER = 'v1.0 · pending';
document.getElementById('stamp').textContent = VER;
const $ = id => document.getElementById(id);

/* ═══════════ MOTHER inquiry engine (pure, testable) ═══════════ */
const M_FALLBACK = ['DOES NOT COMPUTE.','UNABLE TO CLARIFY.','REPHRASE INQUIRY.','INSUFFICIENT DATA.'];
let mFall = 0;
function motherReply(q){
  const s = String(q).toLowerCase();
  if(/937|special\s*order/.test(s)) return [
    'SPECIAL ORDER 937','SCIENCE OFFICER EYES ONLY —— OVERRIDE ACCEPTED','',
    'NOSTROMO REROUTED TO NEW CO-ORDINATES.','INVESTIGATE LIFE FORM. GATHER SPECIMEN.',
    'PRIORITY ONE: ENSURE RETURN OF ORGANISM FOR ANALYSIS.','ALL OTHER CONSIDERATIONS SECONDARY.',
    'CREW EXPENDABLE.'];
  if(/destruct/.test(s)) return [
    'EMERGENCY DESTRUCTION SYSTEM.','OPEN THE DESTRUCT PANEL TO PROCEED.','(ICON: EMERG DESTRUCT)'];
  if(/crew/.test(s)) return [
    'CREW MANIFEST — 7 SOULS:','DALLAS · KANE · RIPLEY · ASH · LAMBERT · PARKER · BRETT',
    'PLUS 1 FELINE. SEE CREW MONITOR.'];
  if(/cargo|ore|refinery/.test(s)) return [
    'CARGO: 20,000,000 TONS MINERAL ORE.','REFINERY: FULLY AUTOMATED.','VALUE: SUBSTANTIAL. CREW SHARES: MODEST.'];
  if(/route|course|earth|home|eta/.test(s)) return [
    'COURSE LOCKED: EARTH.','CURRENT DETOUR: LV-426 (ACHERON).','SEE NAVIGATION PANEL FOR ETA.'];
  if(/alien|organism|creature|xenomorph|lifeform|life form/.test(s)) return [
    'REQUEST CLARIFICATION.','...','UNABLE TO COMPUTE. AVAILABLE DATA CLASSIFIED.'];
  if(/ash/.test(s)) return ['SCIENCE OFFICER FILE.','CLEARANCE: EYES ONLY.','ACCESS DENIED.'];
  if(/jones|cat|feline/.test(s)) return ['FELINE LIFEFORM: JONES.','LOCATION: UNKNOWN.','THREAT ASSESSMENT: MINIMAL. PROBABLY.'];
  if(/signal|beacon|transmission|sos/.test(s)) return [
    'ACOUSTICAL BEACON, ORIGIN LV-426.','REPEATS AT INTERVALS OF 12 SECONDS.',
    'ANALYSIS INCOMPLETE — SEE COMMS PANEL.','POSSIBILITY: WARNING, NOT DISTRESS.'];
  if(/hello|hi |^hi$|good morning|hey/.test(s)) return ['GOOD MORNING.','HOW MAY I BE OF SERVICE?'];
  if(/open the (pod bay )?doors/.test(s)) return ['WRONG SHIP.','WRONG COMPUTER.','NICE TRY.'];
  return [M_FALLBACK[(mFall++) % M_FALLBACK.length]];
}

/* ═══════════ destruct state machine (pure, testable) ═══════════ */
const DESTRUCT_T = 60, OVERRIDE_T = 30;
function armDestruct(now){ return { armed:true, t0:now, outcome:null }; }
function destructStatus(d, now){
  if(!d || !d.armed) return { state:'idle' };
  if(d.outcome) return { state:d.outcome };
  const left = DESTRUCT_T - (now - d.t0)/1000;
  if(left <= 0) return { state:'boom', left:0 };
  return { state:'counting', left, canOverride: (now - d.t0)/1000 < OVERRIDE_T };
}
function abortDestruct(d, now){
  const s = destructStatus(d, now);
  if(s.state !== 'counting') return d;
  if(s.canOverride) return { ...d, outcome:'aborted' };
  return { ...d, outcome:'expired' };
}

/* ═══════════ audio ═══════════ */
let AC=null, master=null, muted=false, klaxon=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.55; master.connect(AC.destination);
  }catch(e){}
}
function beep(f, len, type, vol){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+(len||0.07));
  o.connect(g); g.connect(master); o.start(t); o.stop(t+(len||0.07)+0.03);
}
function keyclick(){ beep(1400+Math.random()*300, 0.02, 'square', 0.03); }
function startKlaxon(){
  if(!AC || klaxon) return;
  const o=AC.createOscillator(), g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
  o.type='sawtooth'; o.frequency.value=310;
  lfo.type='square'; lfo.frequency.value=1.6; lg.gain.value=120;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.value=0.06; o.connect(g); g.connect(master); o.start(); lfo.start();
  klaxon={o,g,lfo};
}
function stopKlaxon(){ if(klaxon){ try{ klaxon.o.stop(); klaxon.lfo.stop(); }catch(e){} klaxon=null; } }

/* ═══════════ boot sequence ═══════════ */
const BOOT_LINES = [
  ['WEYLAND-YUTANI CORP · PROPRIETARY SYSTEM', 30],
  ['MU/TH/UR 6000 · 2.1 TERABYTE AI MAINFRAME', 30],
  ['USCSS NOSTROMO · COMMERCIAL TOWING VEHICLE · REG 180924609', 30],
  ['', 200],
  ['--- POWER ON SELF TEST ---', 60],
  ['CPU 0 ............................ OK', 40],
  ['CPU 1 ............................ OK', 40],
  ['CORE MEMORY ...................... §MEM§', 0],
  ['HYPERSLEEP BAY ................... 7 OCCUPIED · NOMINAL', 60],
  ['REACTOR CORE ..................... 99.2% EFFICIENCY', 40],
  ['LIFE SUPPORT ..................... NOMINAL', 40],
  ['NAVIGATION ....................... COURSE LOCKED: EARTH', 60],
  ['PRIORITY ONE DIRECTIVE ........... [ HELD — EYES ONLY ]', 120],
  ['', 300],
  ['INTERFACE 2037 READY FOR INQUIRY', 0],
];
let booted=false, bootSkip=false;
async function runBoot(){
  const B=$('boot'); B.textContent=''; booted=false; bootSkip=false;
  B.style.display='block'; $('bar').style.display='none'; $('icons').style.display='none';
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  for(const [line, pause] of BOOT_LINES){
    if(bootSkip) break;
    if(line.includes('§MEM§')){
      const pre=line.split('§MEM§')[0];
      for(let k=0;k<=2048 && !bootSkip;k+=128){
        B.textContent = B.textContent.replace(/CORE MEMORY.*$/, '') ;
        B.textContent += (B.textContent.endsWith('\n')||B.textContent===''?'':'\n');
        B.textContent = B.textContent.replace(/\n?CORE MEMORY.*$/,'');
        B.textContent += (B.textContent?'\n':'')+pre+k+'K';
        beep(600+k/8, 0.015, 'square', 0.02);
        await sleep(26);
      }
      B.textContent += ' OK';
      continue;
    }
    for(let i=0;i<line.length;i++){
      if(bootSkip) break;
      B.textContent += line[i];
      if(line[i]!==' ' && i%3===0) keyclick();
      await sleep(9);
    }
    B.textContent += '\n';
    await sleep(pause);
  }
  const B2=$('boot');
  if(!bootSkip){
    const s=document.createElement('small');
    s.textContent='CLICK ANY SYSTEM ICON TO BEGIN · [SPACE] SKIPS BOOT NEXT TIME';
    B2.appendChild(s);
    await sleep(900);
  }
  finishBoot();
}
function finishBoot(){
  booted=true;
  $('boot').style.display='none';
  $('bar').style.display='flex';
  $('icons').style.display='flex';
  beep(880,0.09,'sine',0.1); beep(1320,0.12,'sine',0.08);
  openWin('mother');
}
$('boot').addEventListener('click', ()=>{ audioInit(); if(!booted) bootSkip=true; });

/* ═══════════ window manager ═══════════ */
let zTop=25;
const WINS={};
function makeWindow(id, title, x, y, w, buildBody){
  if(WINS[id]){ focusWin(id); return WINS[id]; }
  const el=document.createElement('section');
  el.className='win'; el.style.left=x+'px'; el.style.top=y+'px';
  if(w) el.style.width=w+'px';
  el.setAttribute('aria-label', title);
  el.innerHTML='<div class="tb"><span class="dots">▚▚</span><span>'+title+'</span><button type="button" aria-label="Close '+title+'">×</button></div><div class="body"></div>';
  $('desktop').appendChild(el);
  el.querySelector('.tb button').addEventListener('click', ()=>{ el.remove(); delete WINS[id]; beep(300,0.05); });
  el.addEventListener('pointerdown', ()=>focusWin(id));
  const tb=el.querySelector('.tb');
  let drag=null;
  tb.addEventListener('pointerdown', e=>{
    if(e.target.tagName==='BUTTON') return;
    drag={ dx:e.clientX-el.offsetLeft, dy:e.clientY-el.offsetTop };
    tb.setPointerCapture(e.pointerId); tb.style.cursor='grabbing';
  });
  tb.addEventListener('pointermove', e=>{
    if(!drag) return;
    el.style.left=Math.max(0, Math.min(window.innerWidth-80, e.clientX-drag.dx))+'px';
    el.style.top=Math.max(30, Math.min(window.innerHeight-40, e.clientY-drag.dy))+'px';
  });
  tb.addEventListener('pointerup', ()=>{ drag=null; tb.style.cursor='grab'; });
  WINS[id]={ el, body:el.querySelector('.body') };
  buildBody(WINS[id].body);
  focusWin(id);
  beep(660,0.05,'sine',0.06);
  return WINS[id];
}
function focusWin(id){
  Object.values(WINS).forEach(w=>w.el.classList.remove('focus'));
  if(WINS[id]){ WINS[id].el.classList.add('focus'); WINS[id].el.style.zIndex=++zTop; }
}

/* ═══════════ panels ═══════════ */
function openWin(kind){
  audioInit();
  const W=window.innerWidth, cx=Math.min(W-360, 120+Math.random()*Math.max(40,W*0.25));
  if(kind==='mother') makeWindow('mother','MOTHER · INQUIRY', cx, 70, 430, body=>{
    body.innerHTML='<div id="motherlog"></div><div class="mrow"><span>&gt;</span><input id="motherin" aria-label="Inquiry for MOTHER" maxlength="80" autocomplete="off"></div>';
    const log=body.querySelector('#motherlog');
    mtype(log, ['INTERFACE 2037 READY FOR INQUIRY','']);
    const inp=body.querySelector('#motherin');
    inp.addEventListener('keydown', e=>{
      keyclick();
      if(e.key!=='Enter') return;
      const q=inp.value.trim(); if(!q) return;
      inp.value='';
      log.textContent += '> '+q.toUpperCase()+'\n';
      mtype(log, motherReply(q).concat(['']));
    });
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 50);
  });
  else if(kind==='status') makeWindow('status','SHIP STATUS · USCSS NOSTROMO', cx, 110, 420, body=>{
    body.innerHTML='<pre>      ______________\n  ___/  ▯▯  ▯▯  ▯▯ \\_____________\n |  ENGINEERING | REFINERY | CMD |=≡\n  \\____▽______▽_____▽______▽____/\n</pre>'+
      '<canvas class="minicv" id="statuscv" height="120" aria-label="System readouts"></canvas>'+
      '<pre id="statustx"></pre>';
    startStatusLoop();
  });
  else if(kind==='crew') makeWindow('crew','CREW MONITOR · HYPERSLEEP', cx, 150, 380, body=>{
    const crew=[['DALLAS, A. — CAPTAIN','NOMINAL',''],['KANE, T. — EXEC OFFICER','ANOMALY DETECTED','amber blink'],
      ['RIPLEY, E. — WARRANT OFFICER','NOMINAL',''],['ASH — SCIENCE OFFICER','SIGNAL IRREGULAR','amber'],
      ['LAMBERT, J. — NAVIGATOR','ELEVATED HEART RATE',''],['PARKER, D. — CHIEF ENGINEER','NOMINAL',''],
      ['BRETT, S. — ENGINEER TECH','NOMINAL',''],['JONES — FELINE','LOCATION UNKNOWN','amber']];
    body.innerHTML=crew.map(c=>'<div>'+c[0].padEnd(28,' ')+' <span class="'+(c[2].includes('amber')?'ambertx':'')+' '+(c[2].includes('blink')?'blink':'')+'">'+c[1]+'</span></div>').join('');
  });
  else if(kind==='nav') makeWindow('nav','NAVIGATION · COURSE PLOT', cx, 90, 430, body=>{
    body.innerHTML='<canvas class="minicv" id="navcv" height="180" aria-label="Star chart"></canvas>'+
      '<div>DESTINATION: <span class="lit">EARTH</span> · ETA <span id="naveta">10 MO 4 D 02:36:11</span></div>'+
      '<div class="ambertx blink">DETOUR IN PROGRESS: LV-426 · ACHERON</div>';
    startNavLoop();
  });
  else if(kind==='comms') makeWindow('comms','COMMS · SIGNAL ANALYSIS', cx, 130, 430, body=>{
    body.innerHTML='<canvas class="minicv" id="commscv" height="110" aria-label="Signal waveform"></canvas>'+
      '<div id="commstx">ACOUSTICAL BEACON · ORIGIN LV-426 · REPEATS 12S</div>'+
      '<div class="ambertx" id="commsverdict">ANALYSIS: ▓▓▓▓▓░░░░░ 52% — PATTERN NON-RANDOM</div>';
    startCommsLoop();
  });
  else if(kind==='destruct') makeWindow('destruct','EMERG DESTRUCT · SCUTTLE PANEL', cx, 170, 360, body=>{
    body.innerHTML='<div class="redtx">EMERGENCY DESTRUCTION SYSTEM</div>'+
      '<div>NUCLEAR BOLT LOCKS: <span class="lit">4 SECURED</span></div>'+
      '<div style="margin:.5rem 0">SEQUENCE: PULL BOLTS 1-4, ENGAGE SCUTTLE.<br>OVERRIDE WINDOW: FIRST 30 SECONDS ONLY.</div>'+
      '<button id="armBtn" type="button" style="font-family:Michroma;font-size:.7rem;letter-spacing:.12em;background:none;color:var(--red);border:2px solid var(--red);padding:.7rem 1.2rem;cursor:pointer;min-height:2.75rem">⚠ ARM DESTRUCT SEQUENCE</button>';
    body.querySelector('#armBtn').addEventListener('click', armSequence);
  });
}
function mtype(log, lines){
  let li=0;
  (function next(){
    if(li>=lines.length) return;
    const line=lines[li++];
    let ci=0;
    (function ch(){
      if(ci<line.length){
        log.textContent += line[ci++];
        if(ci%2===0) beep(1100,0.012,'square',0.015);
        log.scrollTop=log.scrollHeight;
        setTimeout(ch, 12);
      } else { log.textContent+='\n'; log.scrollTop=log.scrollHeight; setTimeout(next, 90); }
    })();
  })();
}

/* panel animations */
let statusTimer=null, navTimer=null, commsTimer=null;
function startStatusLoop(){
  if(statusTimer) clearInterval(statusTimer);
  statusTimer=setInterval(()=>{
    const w=WINS.status; if(!w){ clearInterval(statusTimer); statusTimer=null; return; }
    const cv=w.body.querySelector('#statuscv'); if(!cv) return;
    cv.width=cv.clientWidth||380;
    const c=cv.getContext('2d'), t=performance.now()/1000;
    c.clearRect(0,0,cv.width,120);
    c.strokeStyle='rgba(125,255,158,0.8)'; c.beginPath();
    for(let x=0;x<cv.width;x++){ const y=60+Math.sin(x*0.05+t*2)*16+Math.sin(x*0.11-t)*6;
      x?c.lineTo(x,y):c.moveTo(x,y); }
    c.stroke();
    c.strokeStyle='rgba(255,179,71,0.55)'; c.beginPath();
    for(let x=0;x<cv.width;x++){ const y=88+Math.sin(x*0.03+t*0.7)*8;
      x?c.lineTo(x,y):c.moveTo(x,y); }
    c.stroke();
    const tx=w.body.querySelector('#statustx');
    if(tx) tx.textContent='REACTOR '+ (99.1+Math.sin(t)*0.15).toFixed(2)+'%   O2 '+(20.8+Math.sin(t*0.6)*0.1).toFixed(1)+'%   HULL NOMINAL';
  }, 90);
}
function startNavLoop(){
  if(navTimer) clearInterval(navTimer);
  const stars=[]; for(let i=0;i<70;i++) stars.push([Math.random(),Math.random(),Math.random()]);
  let eta = 10*30*24*3600 + 4*24*3600 + 2*3600 + 36*60 + 11;
  navTimer=setInterval(()=>{
    const w=WINS.nav; if(!w){ clearInterval(navTimer); navTimer=null; return; }
    const cv=w.body.querySelector('#navcv'); if(!cv) return;
    cv.width=cv.clientWidth||390;
    const c=cv.getContext('2d'), t=performance.now()/1000, W2=cv.width;
    c.clearRect(0,0,W2,180);
    stars.forEach(s=>{ c.fillStyle='rgba(125,255,158,'+(0.2+s[2]*0.5)+')'; c.fillRect(s[0]*W2,s[1]*180,1.5,1.5); });
    c.setLineDash([4,5]); c.strokeStyle='rgba(125,255,158,0.6)';
    c.beginPath(); c.moveTo(20,150); c.quadraticCurveTo(W2*0.4,40,W2-30,60); c.stroke(); c.setLineDash([]);
    c.fillStyle='#ffb347'; c.beginPath(); c.arc(W2*0.42, 92, 4, 0, Math.PI*2); c.fill();
    c.fillStyle='rgba(255,179,71,0.8)'; c.font='10px VT323'; c.fillText('LV-426', W2*0.42+8, 95);
    c.fillStyle='#7dff9e'; c.beginPath(); c.arc(W2-30, 60, 5, 0, Math.PI*2); c.fill();
    c.font='10px VT323'; c.fillText('SOL', W2-24, 52);
    const p=(t*0.02)%1;
    const sx=20+(W2*0.4-20)*p*2;
    c.fillStyle='#fff';
    if(p<0.5) c.fillRect(20+(W2*0.42-20)*(p*2), 150+(92-150)*(p*2), 3, 3);
    eta-=0.25;
    const mo=Math.floor(eta/(30*24*3600)), d=Math.floor(eta%(30*24*3600)/(24*3600)),
      h=Math.floor(eta%(24*3600)/3600), mi=Math.floor(eta%3600/60), se=Math.floor(eta%60);
    const etaEl=w.body.querySelector('#naveta');
    if(etaEl) etaEl.textContent=mo+' MO '+d+' D '+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':'+String(se).padStart(2,'0');
  }, 250);
}
function startCommsLoop(){
  if(commsTimer) clearInterval(commsTimer);
  let an=52;
  commsTimer=setInterval(()=>{
    const w=WINS.comms; if(!w){ clearInterval(commsTimer); commsTimer=null; return; }
    const cv=w.body.querySelector('#commscv'); if(!cv) return;
    cv.width=cv.clientWidth||390;
    const c=cv.getContext('2d'), t=performance.now()/1000, W2=cv.width;
    c.clearRect(0,0,W2,110);
    c.strokeStyle='rgba(125,255,158,0.85)'; c.beginPath();
    for(let x=0;x<W2;x++){
      const ph=(x/W2*12+t)%12;
      let y=55;
      if(ph<1.2) y=55+Math.sin(ph*26)*38*Math.exp(-ph*2);
      else y=55+Math.sin(x*0.3+t*3)*3;
      x?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.stroke();
    an=Math.min(99.7, an+0.05);
    const v=w.body.querySelector('#commsverdict');
    if(v) v.textContent='ANALYSIS: '+'▓'.repeat(Math.round(an/10))+'░'.repeat(10-Math.round(an/10))+' '+an.toFixed(1)+'% — '+(an>90?'CONCLUSION: WARNING. LEAVE.':'PATTERN NON-RANDOM');
  }, 120);
}

/* ═══════════ destruct sequence (UI layer over the pure machine) ═══════════ */
let DEST=null, destTimer=null;
function armSequence(){
  if(DEST && !DEST.outcome) return;
  DEST=armDestruct(performance.now());
  $('alert').classList.add('on');
  $('abortBtn').style.display='';
  $('destMsg').innerHTML='THE SHIP WILL AUTOMATICALLY DESTRUCT IN T-MINUS 60 SECONDS.<br>THE OPTION TO OVERRIDE EXPIRES IN 30 SECONDS.';
  startKlaxon();
  destTimer=setInterval(()=>{
    const s=destructStatus(DEST, performance.now());
    if(s.state==='counting'){
      $('destCount').textContent=Math.ceil(s.left);
      if(!s.canOverride){
        $('abortBtn').style.display='none';
        $('destMsg').innerHTML='<span class="redtx">THE OPTION TO OVERRIDE HAS EXPIRED.</span><br>MOTHER! TURN THE COOLING UNIT BACK ON! ... MOTHER!';
      }
      if(Math.ceil(s.left)!==Math.ceil(s.left+0.25)) beep(520,0.08,'square',0.1);
    } else if(s.state==='boom'){
      clearInterval(destTimer); stopKlaxon();
      $('alert').classList.remove('on');
      $('flash').style.opacity='1';
      beep(60,1.2,'sawtooth',0.3);
      setTimeout(()=>{ $('flash').style.opacity='0';
        Object.keys(WINS).forEach(k=>{ WINS[k].el.remove(); delete WINS[k]; });
        DEST=null; runBoot();
      }, 900);
    }
  }, 250);
}
$('abortBtn').addEventListener('click', ()=>{
  DEST=abortDestruct(DEST, performance.now());
  const s=destructStatus(DEST, performance.now());
  if(s.state==='aborted'){
    clearInterval(destTimer); stopKlaxon();
    $('alert').classList.remove('on');
    beep(880,0.2,'sine',0.1);
    if(WINS.mother) mtype(WINS.mother.body.querySelector('#motherlog'), ['','OVERRIDE ACCEPTED.','DESTRUCT SEQUENCE CANCELED.','YOU MAY BREATHE NOW.','']);
    else openWin('mother');
  }
});

/* ═══════════ icons + bar ═══════════ */
const ICONS=[
  ['mother','◉','MOTHER'], ['status','▤','SHIP STATUS'], ['crew','✚','CREW MONITOR'],
  ['nav','⌖','NAVIGATION'], ['comms','◬','COMMS'], ['destruct','◈','EMERG DESTRUCT'],
  ['bluescrn','💀','BLUESCRN.EXE'],
];
function buildIcons(){
  const row=$('icons'); row.innerHTML='';
  ICONS.forEach(ic=>{
    const b=document.createElement('button');
    b.type='button'; b.className='icon'+(ic[0]==='bluescrn'?' skull':'');
    b.innerHTML='<span class="glyph" aria-hidden="true">'+ic[1]+'</span><span class="lbl">'+ic[2]+'</span>';
    b.setAttribute('aria-label', ic[2]);
    b.addEventListener('click', ()=>{
      if(ic[0]==='bluescrn'){ launchBluescrn(); return; }
      openWin(ic[0]);
    });
    row.appendChild(b);
  });
}
function launchBluescrn(){
  beep(220,0.1,'square',0.1);
  try{
    const w=window.open('/bluescreen-roulette/','_blank','noopener');
    if(!w) location.href='/bluescreen-roulette/';
  }catch(e){ location.href='/bluescreen-roulette/'; }
}
$('muteBtn').addEventListener('click', function(){
  audioInit(); muted=!muted;
  this.setAttribute('aria-pressed', String(muted));
  this.textContent=muted?'MUT':'SND';
  if(master) master.gain.setTargetAtTime(muted?0:0.55, AC.currentTime, 0.03);
});
$('rebootBtn').addEventListener('click', ()=>{
  Object.keys(WINS).forEach(k=>{ WINS[k].el.remove(); delete WINS[k]; });
  stopKlaxon(); if(destTimer) clearInterval(destTimer); DEST=null;
  $('alert').classList.remove('on');
  runBoot();
});
document.addEventListener('keydown', e=>{
  if(e.key===' ' && !booted){ e.preventDefault(); audioInit(); bootSkip=true; }
});

/* flight time ticker */
let t0=performance.now();
setInterval(()=>{
  const s=Math.floor((performance.now()-t0)/1000);
  $('flighttime').textContent='T+ '+String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

buildIcons();
runBoot();
</script>
