  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Orbitron', sans-serif;
      background: #030712;
      color: #fff;
    }

    .game-wrap {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* phones: keep the touch pads above the browser toolbar */
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .bg-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #030712 0%, #0a1628 50%, #030712 100%);
      z-index: 0;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 32px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0, 255, 255, 0.6);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 900;
      color: #22c55e;
      text-shadow: 0 0 20px #22c55e, 0 0 40px #22c55e;
    }

    .stat-value.combo {
      color: #ef4444;
      text-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444;
    }

    .hud-right {
      margin-left: auto;
      display: flex;
      gap: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #22c55e;
      padding: 12px 20px;
      min-height: 44px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .btn:focus-visible, .touch-btn:focus-visible {
      outline: 3px solid #0ff;
      outline-offset: 3px;
    }

    /* Power chips */
    .power-chips {
      position: absolute;
      top: 90px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .power-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid;
      border-radius: 4px;
      font-size: 12px;
      letter-spacing: 1px;
      animation: chipGlow 1s ease-in-out infinite alternate;
    }

    .power-chip.double { border-color: #0f0; color: #0f0; }
    .power-chip.slow { border-color: #ff0; color: #ff0; }
    .power-chip.boost { border-color: #f0f; color: #f0f; }

    @keyframes chipGlow {
      from { box-shadow: 0 0 5px currentColor; }
      to { box-shadow: 0 0 15px currentColor; }
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      overflow-y: auto;
    }

    .overlay.show { display: flex; }

    .modal {
      text-align: center;
      padding: 48px;
      max-width: 420px;
      margin: auto;
    }

    /* short phones: the game-over card has to fit without cutting off Try Again */
    @media (max-height: 720px) {
      .overlay .modal { padding: 20px 18px; }
      .overlay .modal-icon { font-size: 44px; margin-bottom: 6px; }
      .overlay .modal h1 { font-size: 40px; margin-bottom: 6px; }
      .overlay .score-display { font-size: 54px; margin: 8px 0 16px; }
      .overlay .modal-buttons { margin-top: 16px; }
    }

    .modal-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: iconFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .modal h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #0ff 0%, #00f 50%, #f0f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: none;
    }

    .modal p {
      color: rgba(255, 255, 255, 0.6);

      margin: 24px 0;

      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);

    .modal-controls kbd {
      background: rgba(0, 255, 255, 0.15);

      margin: 0 4px;

    .modal-buttons {

    .btn-primary {

    .daily-btn:hover { background: rgba(159, 227, 255, 0.14); border-color: #9fe3ff; }
    .daily-btn:active { transform: scale(0.97); }
    .daily-btn:focus-visible { outline: 2px solid #9fe3ff; outline-offset: 3px; }
    .daily-title { font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; }
    .daily-sub { font-size: 11px; color: #9fe3ff; letter-spacing: 0.04em; }

    .zone-line {
      margin: -12px 0 18px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9fe3ff;

    .zone-line b { color: #fff; font-weight: 900; }
    .score-display {
      font-size: 72px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd700;

    .neon-input {

      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 4px;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      text-align: center;
      transition: all 0.2s;
    }

    .neon-input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .error-text {
      color: #f66;
      font-size: 12px;
      margin-top: 8px;
    }

    /* Toast */
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ffd700;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Mobile controls */
    .touch-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      z-index: 20;
    }

    @media (max-width: 768px) {
      .touch-controls { display: grid; }
      .hud-right { display: none; }
    }
    /* Tablets are wider than 768px but still need the pads */
    @media (pointer: coarse) {
      .touch-controls { display: grid; }
    }
    .touch-hint { display: none; }
    @media (pointer: coarse) {
      .key-hint { display: none; }
      .touch-hint { display: inline; }
    }

    .touch-btn {
      height: 80px;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      color: #ef4444;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-btn:active {
      background: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
      transform: scale(0.95);
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(0, 0, 0, 0.5);
      border-left: 1px solid rgba(0, 255, 255, 0.1);

      border: 1px solid rgba(0, 255, 255, 0.1);

    .lb-row {
      display: grid;
      grid-template-columns: 32px 1fr 50px;

    .lb-row:last-child { border-bottom: none; }
    .lb-row.header { background: rgba(0, 255, 255, 0.05); color: rgba(255,255,255,0.4); }

    .lb-rank { color: #0ff; font-weight: 700; }
    .lb-rank.gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }

    .lb-score { text-align: right; color: #0ff; font-weight: 700; }

  <script type="module">
    import supabase, { supabaseSession } from './supabase-config.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);

    function resize() {
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    const game = {
      running: false,
      paused: false,
      muted: false,
      floor: 0,
      lastFloor: 0,
      best: parseInt(localStorage.getItem('icy-best') || '0'),
      combo: 1,
      comboTimer: 0,
      cameraY: 0,
      cameraTargetY: 0,
      lastTime: 0,
      particles: [],
      snowflakes: [],
      platforms: [],
      powerups: [],
      effects: { double: 0, slow: 0, boost: 0 },
    };

    const player = {
      x: 0, y: 0, vx: 0, vy: 0,
      width: 28, height: 38,
      grounded: false, jumpsLeft: 1,
      facingRight: true,
      trail: [],
      glowIntensity: 0,
    };

    const PHYSICS = {
      gravity: 0.52,
      jumpForce: -14,
      moveAccel: 1.1,
      moveDecel: 0.88,
      maxSpeed: 9,
      runUp: 0.12,
      airControl: 0.7,
      cameraSmooth: 0.08,
    };

    // Audio
    let audioCtx;
    function playSound(freq, dur = 0.1, type = 'sine', vol = 0.12) {
      if (game.muted) return;
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    // Initialize snowflakes
    function initSnowflakes() {
      game.snowflakes = [];
      for (let i = 0; i < 50; i++) {
        game.snowflakes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: 1 + Math.random() * 3,
          speed: 0.3 + Math.random() * 0.5,
          drift: (Math.random() - 0.5) * 0.5,
        });
      }
    }

    // Particles
    function spawnParticle(x, y, vx, vy, color, life = 0.8, size = 4, glow = true) {
      game.particles.push({ x, y, vx, vy, color, life, maxLife: life, size, glow });
    }

    function spawnJumpBurst(x, y) {
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const speed = 3 + Math.random() * 4;
        spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 2, '#0ff', 0.6, 3 + Math.random() * 3);
      }
    }

    function spawnLandingParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        const angle = Math.PI + (Math.random() - 0.5) * 1.5;
        const speed = 2 + Math.random() * 3;
        spawnParticle(x + (Math.random() - 0.5) * 30, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 'rgba(0, 255, 255, 0.8)', 0.4, 2 + Math.random() * 2);
      }
    }

    function spawnPowerupBurst(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const speed = 4 + Math.random() * 3;
        spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, 0.8, 4);
      }
    }

    // Tower layout randomness. Classic: a fresh tower every run. Daily: one seed per UTC day, so
    // everyone climbs the same tower today and your ghost replays on the same platforms.
    let rand = Math.random;
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const todayKey = () => new Date().toISOString().slice(0, 10);
    function loadDaily() {
      try {
        const d = JSON.parse(localStorage.getItem('icy-daily') || 'null');
        if (d && d.day === todayKey() && Array.isArray(d.pts)) return d;
      } catch {}
      return null;
    }

    // Platforms - progressive difficulty
    function getDifficulty(y) {
      // Calculate difficulty based on height (more negative y = higher = harder)
      // Start easy, get harder as player climbs
      const height = Math.max(0, H * 0.6 - y); // Distance climbed from start
      const difficulty = Math.min(1, height / 8000); // Max difficulty at ~8000 pixels up
      return difficulty;
    }

    function createPlatform(y, n) {
      const difficulty = getDifficulty(y);

      // Platform width: starts wide (15-30% of screen), shrinks to (8-15% of screen)
      const minWStart = W * 0.15, maxWStart = W * 0.30;
      const minWEnd = W * 0.08, maxWEnd = W * 0.15;
      const minW = Math.max(50, minWStart - (minWStart - minWEnd) * difficulty);
      const maxW = Math.max(70, maxWStart - (maxWStart - maxWEnd) * difficulty);

      const w = minW + rand() * (maxW - minW);
      const x = rand() * (W - w);
      const type = rand() < 0.12 ? 'special' : 'normal';
      const hue = 180 + rand() * 40; // Cyan-blue range
      return { x, y, w, h: 12, type, hue, glow: 0, n, bumps: [rand() * 2, rand() * 2, rand() * 2] };
    }

    function getPlatformGap(y) {
      const difficulty = getDifficulty(y);
      // Gap starts at 50-90, increases to 70-130 at max difficulty
      const baseGap = 50 + difficulty * 20;
      const gapVariance = 40 + difficulty * 20;
      return baseGap + rand() * gapVariance;
    }

    // Every 50 floors the tower changes material, like the original's wood, ice, bones and candy
    const ZONE_H = 50;
    const ZONES = [
      { name: 'SNOWY PINES', sky: '#0a1929', tint: ['rgba(20,60,40,.4)', 'rgba(40,20,30,.3)', 'rgba(20,60,40,.4)'],
        wall: '170,225,255', flake: [255, 255, 255], top: 'snow',
        plat: [['#dc2626', '#991b1b', '#ff4444'], ['#16a34a', '#166534', '#44ff44']] },
      { name: 'TIMBER HALL', sky: '#150b05', tint: ['rgba(90,45,10,.35)', 'rgba(40,15,5,.25)', 'rgba(120,60,15,.4)'],
        wall: '255,180,100', flake: [255, 170, 70], top: 'grain',
        plat: [['#c68a3f', '#7a4a1c', '#ffb347'], ['#a0612a', '#5e3413', '#ff9a3c']] },
      { name: 'NEON CIRCUIT', sky: '#04020e', tint: ['rgba(0,120,160,.3)', 'rgba(30,0,60,.3)', 'rgba(150,0,140,.3)'],
        wall: '0,229,255', flake: [0, 229, 255], top: 'wire',
        plat: [['#253449', '#0f172a', '#00e5ff'], ['#2e2350', '#140b2e', '#e040fb']] },
      { name: 'CANDY CLOUDS', sky: '#2a0d26', tint: ['rgba(255,120,200,.25)', 'rgba(120,60,200,.2)', 'rgba(255,170,120,.25)'],
        wall: '255,170,225', flake: [255, 205, 238], top: 'sprinkles',
        plat: [['#f472b6', '#be185d', '#ff8fd0'], ['#a78bfa', '#6d28d9', '#c4b5fd']] },
      { name: 'BONE CRYPT', sky: '#080a06', tint: ['rgba(40,90,30,.35)', 'rgba(10,20,10,.2)', 'rgba(60,120,40,.35)'],
        wall: '150,255,130', flake: [160, 255, 140], top: 'bone',
        plat: [['#ece5cf', '#a39b83', '#7dff6a'], ['#d9d1b7', '#8a826a', '#7dff6a']] },
      { name: 'STARLIGHT', sky: '#060318', tint: ['rgba(60,40,140,.35)', 'rgba(10,5,40,.2)', 'rgba(140,90,20,.3)'],
        wall: '255,225,140', flake: [255, 236, 170], top: 'stars',
        plat: [['#fcd34d', '#b45309', '#ffd700'], ['#e0e7ff', '#6366f1', '#c7d2fe']] },
    ];
    const zoneAt = i => ZONES[((i % ZONES.length) + ZONES.length) % ZONES.length];
    const zoneOfFloor = n => zoneAt(Math.floor(Math.max(0, n) / ZONE_H));

    function enterZone(zi) {
      game.zonePrev = game.zoneIdx;
      game.zoneIdx = zi;
      game.zoneFade = 0;
      const z = zoneAt(zi);
      game.zoneBanner = { title: 'ZONE ' + (zi + 1), name: z.name, t: 2600 };
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playSound(f, 0.14, 'triangle', 0.07), i * 90));
      const c = z.flake;
      spawnPowerupBurst(player.x + player.width / 2, player.y - game.cameraY, 'rgb(' + c.join(',') + ')');
      if (zi >= 1) unlock('zone2');
      if (zi >= 5) unlock('zone6');
    }

    function mixRgb(a, b, k) {
      return a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',');
    }

    function resetWorld() {
      const day = todayKey();
      rand = game.mode === 'daily' ? mulberry32(+day.replace(/-/g, '')) : Math.random;
      game.ghost = game.mode === 'daily' ? loadDaily() : null;
      game.rec = [];
      game.recClock = 0;
      game.groundY = H * 0.75;
      game.floor = 0;
      game.zoneIdx = 0;
      game.zonePrev = 0;
      game.zoneFade = 1;
      game.zoneBanner = null;
      game.combo = 1;
      game.comboTimer = 0;
      game.cameraY = 0;
      game.cameraTargetY = 0;
      game.particles = [];
      game.platforms = [];
      game.powerups = [];
      game.effects = { double: 0, slow: 0, boost: 0 };

      player.x = W / 2 - player.width / 2;
      player.y = H * 0.6;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.jumpsLeft = 1;
      player.trail = [];
      player.glowIntensity = 0;

      game.platforms.push({ x: 0, y: H * 0.75, w: W, h: 16, type: 'ground', hue: 200, glow: 0, n: 0, bumps: [1, 0.5, 1.5] });
      game.landedN = 0;
      game.topN = 40;
      game.scroll = 0;
      game.scrollLevel = 0;
      game.scrollClock = 0;
      game.hurryT = 0;
      game.bestCombo = 1;
      game.runTime = 0;
      game.comboFloors = 0;
      game.praise = null;

      // First platform at fixed height above ground (easily reachable with basic jump)
      const groundY = H * 0.75;
      let y = groundY - 70; // ~70px above ground, well within jump range
      const firstPlat = createPlatform(y, 1);
      game.platforms.push(firstPlat);

      // Generate remaining platforms with progressive difficulty
      for (let i = 0; i < 39; i++) {
        y -= getPlatformGap(y);
        const plat = createPlatform(y, i + 2);
        game.platforms.push(plat);
        if (rand() < 0.1 && y < H - 100) {
          const types = ['double', 'slow', 'boost'];
          game.powerups.push({
            x: plat.x + plat.w / 2,
            y: plat.y - 15,
            type: types[Math.floor(rand() * 3)],
            bob: rand() * Math.PI * 2,
            pulse: 0,
          });
        }
      }

      initSnowflakes();
      updateUI();
    }

    // Input
    const input = { left: false, right: false, jump: false, jumpPressed: false };
    const SCROLL_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    let restartAfter = 0; // a jump key only restarts once the game-over screen has been up a moment

    window.addEventListener('keydown', (e) => {
      const t = e.target;
      // typing a name in the save box must not steer, jump or restart the game
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      // on menus a focused button keeps its own Space/Enter
      if (!game.running && t && t.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
      // while climbing, Space/arrows belong to the game, not to a focused Pause/Sound button
      if (game.running && SCROLL_KEYS.includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (!game.running && performance.now() < restartAfter) return;
        input.jump = true;
        input.jumpPressed = true;
        if (!game.running) startGame();
      }
      if (e.code === 'KeyP') togglePause();
    });

    window.addEventListener('keyup', (e) => {
      if (game.running && SCROLL_KEYS.includes(e.code) && e.target && e.target.tagName === 'BUTTON') e.preventDefault();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.jump = false;
    });

    // Touch
    function bindTouch(el, onStart, onEnd) {
      const start = (e) => { e.preventDefault(); onStart(); };
      const end = (e) => { e.preventDefault(); onEnd(); };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('touchcancel', end, { passive: false }); // a system gesture must not leave you running
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }
    bindTouch(document.getElementById('leftPad'), () => input.left = true, () => input.left = false);
    bindTouch(document.getElementById('rightPad'), () => input.right = true, () => input.right = false);
    bindTouch(document.getElementById('jumpPad'), () => {
      input.jump = true;
      input.jumpPressed = true;
      if (!game.running) startGame();
    }, () => input.jump = false);

    // Update
    // A combo that ends after 3+ multi-floor jumps gets a shout, bigger for more floors
    const PRAISE = ['GOOD!', 'SWEET!', 'GREAT!', 'SUPER!', 'WOW!', 'AMAZING!', 'EXTREME!', 'FANTASTIC!', 'SPLENDID!', 'NO WAY!'];
    function endCombo() {
      if (game.combo >= 3) {
        const text = PRAISE[Math.min(PRAISE.length - 1, Math.floor(game.comboFloors / 6))];
        game.praise = { text, sub: game.comboFloors + ' FLOOR COMBO', t: 1700 };
        playSound(520, 0.08, 'triangle', 0.08);
        playSound(780, 0.14, 'triangle', 0.08);
      }
      game.combo = 1;
      game.comboTimer = 0;
      game.comboFloors = 0;
    }

    function update(dt) {
      const dtNorm = dt / 16.67;
      game.runTime += dt;
      if (game.mode === 'daily' && game.rec.length < 9000) {
        game.recClock += dt;
        while (game.recClock >= 100) {
          game.recClock -= 100;
          game.rec.push(Math.round((player.x + player.width / 2) / W * 1000), Math.round(player.y + player.height - game.groundY));
        }
      }

      // Combo decay
      if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) endCombo();
      }

      // Effects decay
      for (const key of Object.keys(game.effects)) {
        game.effects[key] = Math.max(0, game.effects[key] - dt);
      }
      renderPowerChips();

      // Player movement
      const accel = PHYSICS.moveAccel * (player.grounded ? 1 : PHYSICS.airControl);
      // past cruise speed you only gain slowly (and barely in the air): a real run-up buys the big jumps
      const cruise = PHYSICS.maxSpeed * 0.62;
      const push = (dir) => {
        const fast = Math.sign(player.vx) === dir && Math.abs(player.vx) >= cruise;
        player.vx += dir * (fast ? PHYSICS.runUp * (player.grounded ? 1 : 0.3) : accel) * dtNorm;
      };
      if (input.left) { push(-1); player.facingRight = false; }
      else if (input.right) { push(1); player.facingRight = true; }
      else { player.vx *= Math.pow(PHYSICS.moveDecel, dtNorm); }

      const maxSpd = PHYSICS.maxSpeed * (game.effects.boost > 0 ? 1.25 : 1);
      player.vx = Math.max(-maxSpd, Math.min(maxSpd, player.vx));

      // Jump
      if (input.jumpPressed) {
        const jumpMod = game.effects.boost > 0 ? 1.25 : 1;
        if (player.grounded) {
          const run = Math.max(0, Math.min(1, (Math.abs(player.vx) - 4) / 5));
          player.vy = PHYSICS.jumpForce * jumpMod * (1 + 0.4 * run);
          player.grounded = false;
          player.jumpsLeft = game.effects.double > 0 ? 1 : 0;
          player.glowIntensity = 1;
          playSound(440, 0.12, 'sine');
          playSound(660, 0.08, 'triangle');
          spawnJumpBurst(player.x + player.width / 2, player.y + player.height);
        } else if (game.effects.double > 0 && player.jumpsLeft > 0) {
          player.vy = PHYSICS.jumpForce * jumpMod * 0.9;
          player.jumpsLeft--;
          player.glowIntensity = 1;
          playSound(550, 0.1, 'sine');
          spawnJumpBurst(player.x + player.width / 2, player.y + player.height / 2);
        }
        input.jumpPressed = false;
      }

      // Gravity
      const gravMod = game.effects.slow > 0 ? 0.65 : 1;
      player.vy += PHYSICS.gravity * gravMod * dtNorm;
      player.x += player.vx * dtNorm;
      player.y += player.vy * dtNorm;

      // Walls: in the air you bounce off and keep your speed, on the ground you just stop
      if (player.x < 0 || player.x > W - player.width) {
        const hitLeft = player.x < 0;
        player.x = hitLeft ? 0 : W - player.width;
        if (!player.grounded && Math.abs(player.vx) > 2.5) {
          player.vx = -player.vx * 0.92;
          player.facingRight = player.vx > 0;
          player.glowIntensity = 0.7;
          playSound(260, 0.05, 'triangle', 0.08);
          for (let i = 0; i < 6; i++) spawnParticle(hitLeft ? 2 : W - 2, player.y + player.height / 2, (hitLeft ? 1 : -1) * (1 + Math.random() * 3), (Math.random() - 0.5) * 4, 'rgba(180, 235, 255, 0.9)', 0.4, 2 + Math.random() * 2);
        } else {
          player.vx = 0;
        }
      }

      // Trail
      if (Math.abs(player.vy) > 3 || Math.abs(player.vx) > 4) {
        player.trail.push({
          x: player.x + player.width / 2,
          y: player.y + player.height / 2,
          alpha: 0.6,
          size: player.width * 0.4,
        });
        if (player.trail.length > 12) player.trail.shift();
      }
      for (const t of player.trail) t.alpha *= 0.9;
      player.trail = player.trail.filter(t => t.alpha > 0.05);

      // Glow decay
      player.glowIntensity *= 0.95;

      // Platform collision
      let landed = false;
      for (const plat of game.platforms) {
        if (player.vy >= 0 &&
            player.x + player.width > plat.x && player.x < plat.x + plat.w &&
            player.y + player.height >= plat.y && player.y + player.height <= plat.y + plat.h + player.vy * dtNorm + 5) {
          player.y = plat.y - player.height;
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = game.effects.double > 0 ? 2 : 1;
          landed = true;
          plat.glow = 1;

          if (plat.n > game.landedN) {
            const jumped = plat.n - game.landedN;
            game.landedN = plat.n;
            game.floor = Math.max(game.floor, plat.n);
            const zi = Math.floor(game.floor / ZONE_H);
            if (zi > game.zoneIdx) enterZone(zi);
            if (jumped >= 2) {
              game.comboFloors = (game.combo > 1 ? game.comboFloors : 0) + jumped;
              game.combo = Math.min(10, game.combo + 1);
              game.bestCombo = Math.max(game.bestCombo, game.combo);
              game.comboTimer = 3000;
              playSound(300 + game.combo * 50, 0.06, 'sine');
            } else {
              endCombo();
              playSound(300, 0.04, 'sine', 0.06);
            }
            spawnLandingParticles(player.x + player.width / 2, player.y + player.height);
            checkAchievements();
          } else if (plat.n < game.landedN) {
            game.landedN = plat.n;
            endCombo();
          }
          break;
        }
      }
      if (!landed && player.grounded) player.grounded = false;

      // Platform glow decay
      for (const plat of game.platforms) {
        plat.glow *= 0.92;
      }

      // Powerup collection
      for (let i = game.powerups.length - 1; i >= 0; i--) {
        const pu = game.powerups[i];
        const dx = (player.x + player.width / 2) - pu.x;
        const dy = (player.y + player.height / 2) - pu.y;
        if (Math.sqrt(dx * dx + dy * dy) < 28) {
          applyPowerup(pu.type, pu.x, pu.y);
          game.powerups.splice(i, 1);
        }
      }

      // The tower starts sinking once you are a few floors up, and speeds up every 30 s
      if (game.floor >= 5) {
        game.scrollClock += dt;
        const level = 1 + Math.floor(game.scrollClock / 30000);
        if (level !== game.scrollLevel) {
          game.scrollLevel = level;
          if (level > 1 && level <= 8) { game.hurryT = 1800; playSound(880, 0.08, 'square', 0.06); playSound(660, 0.12, 'square', 0.06); }
        }
        game.scroll = Math.min(3.6, 0.55 + (game.scrollLevel - 1) * 0.45);
      }
      if (game.hurryT > 0) game.hurryT -= dt;
      if (game.praise && (game.praise.t -= dt) <= 0) game.praise = null;
      if (game.zoneFade < 1) game.zoneFade = Math.min(1, game.zoneFade + dt / 1600);
      if (game.zoneBanner && (game.zoneBanner.t -= dt) <= 0) game.zoneBanner = null;
      game.cameraTargetY -= game.scroll * (game.effects.slow > 0 ? 0.5 : 1) * dtNorm;

      // Camera
      game.cameraTargetY = Math.min(game.cameraTargetY, player.y - H * 0.45);
      game.cameraY += (game.cameraTargetY - game.cameraY) * PHYSICS.cameraSmooth * dtNorm;

      // Recycle
      const cutoff = game.cameraY + H + 100;
      game.platforms = game.platforms.filter(p => p.y < cutoff);
      game.powerups = game.powerups.filter(p => p.y < cutoff);

      while (game.platforms.length < 45) {
        const topY = Math.min(...game.platforms.map(p => p.y));
        const newY = topY - getPlatformGap(topY);
        const plat = createPlatform(newY, ++game.topN);
        game.platforms.push(plat);
        if (rand() < 0.1) {
          const types = ['double', 'slow', 'boost'];
          game.powerups.push({
            x: plat.x + plat.w / 2,
            y: plat.y - 15,
            type: types[Math.floor(rand() * 3)],
            bob: rand() * Math.PI * 2,
            pulse: 0,
          });
        }
      }

      // Death
      if (player.y - game.cameraY > H + 50) endGame();

      // Update particles
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx * dtNorm;
        p.y += p.vy * dtNorm;
        p.vy += 0.15 * dtNorm;
        p.life -= dt / 1000;
        if (p.life <= 0) game.particles.splice(i, 1);
      }

      // Update snowflakes
      for (const s of game.snowflakes) {
        s.y += s.speed * dtNorm;
        s.x += s.drift * dtNorm;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        if (s.x < 0) s.x = W;
        if (s.x > W) s.x = 0;
      }
    }

    function applyPowerup(type, x, y) {
      game.effects[type] = 8000;
      const colors = { double: '#0f0', slow: '#ff0', boost: '#f0f' };
      const msgs = { double: 'DOUBLE JUMP', slow: 'TIME WARP', boost: 'HYPER BOOST' };
      playSound(523, 0.1, 'sine');
      playSound(784, 0.15, 'sine');
      spawnPowerupBurst(x, y - game.cameraY, colors[type]);
      showToast(msgs[type]);
      unlock('firstPower');
    }

    // What sits on top of a platform: snow, wood grain, circuit lights, frosting, bone knobs or stars
    function drawTopping(z, plat, py, pc) {
      const x = plat.x, w = plat.w, h = plat.h, b = plat.bumps;
      if (z.top === 'snow') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, py, w / 2 + 4, 5, 0, Math.PI, 0);
        ctx.fill();
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(x + (w / 4) * (i + 0.5), py - 2, 4 + b[i], 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (z.top === 'grain') {
        ctx.fillStyle = 'rgba(255, 225, 170, 0.35)';
        ctx.fillRect(x + 2, py + 1, w - 4, 2);
        ctx.fillStyle = 'rgba(60, 25, 5, 0.55)';
        const plank = 26 + b[0] * 6;
        for (let px = x + plank * (0.4 + b[1] * 0.3); px < x + w - 6; px += plank) ctx.fillRect(px, py + 2, 2, h - 3);
        ctx.fillStyle = 'rgba(40, 15, 0, 0.7)';
        for (let px = x + 5; px < x + w - 4; px += plank) ctx.fillRect(px, py + h / 2 - 1, 2, 2);
      } else if (z.top === 'wire') {
        ctx.strokeStyle = pc[2];
        ctx.lineWidth = 2;
        ctx.shadowColor = pc[2];
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x + 2, py + 1);
        ctx.lineTo(x + w - 2, py + 1);
        ctx.stroke();
        ctx.shadowBlur = 0;
        const t = performance.now() / 300;
        for (let i = 0; i < 4; i++) {
          const on = Math.sin(t + i * 1.7 + b[i % 3] * 3) > 0;
          ctx.fillStyle = on ? '#fff' : 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(x + (w / 5) * (i + 1) - 1.5, py + h / 2, 3, 3);
        }
      } else if (z.top === 'sprinkles') {
        ctx.fillStyle = '#ffe4f1';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, py + 1, w / 2 + 2, 4, 0, Math.PI, 0);
        ctx.fill();
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(x + (w / 4) * (i + 0.5), py + 2, 4, 3 + b[i % 3] * 1.5, 0, 0, Math.PI);
          ctx.fill();
        }
        const cols = ['#22d3ee', '#facc15', '#f43f5e', '#4ade80', '#fff'];
        for (let i = 0; i < 7; i++) {
          ctx.save();
          ctx.translate(x + 6 + ((i * 37 + b[i % 3] * 23) % Math.max(1, w - 12)), py - 1 + (i % 3));
          ctx.rotate(i * 1.3 + b[0]);
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillRect(-2.5, -1, 5, 2);
          ctx.restore();
        }
      } else if (z.top === 'bone') {
        ctx.fillStyle = pc[0];
        for (const ex of [x + 1, x + w - 1]) {
          ctx.beginPath();
          ctx.arc(ex, py + 3, 5, 0, Math.PI * 2);
          ctx.arc(ex, py + h - 3, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(70, 60, 40, 0.35)';
        ctx.fillRect(x + 8, py + h - 4, w - 16, 2);
      } else if (z.top === 'stars') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(x + 3, py + 1, w - 6, 1.5);
        const t = performance.now() / 500;
        for (let i = 0; i < 3; i++) {
          const sx = x + (w / 4) * (i + 0.5) + b[i] * 4, sy = py - 5 - b[(i + 1) % 3] * 3;
          const r = 2.5 + Math.sin(t + i * 2 + b[i] * 5) * 1.2;
          ctx.fillStyle = i === 1 ? '#fff' : pc[2];
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = k * Math.PI / 4, rr = k % 2 ? r * 0.4 : r;
            ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
          }
          ctx.fill();
        }
      }
    }

    // Your best daily run, replayed on the same tower
    function drawGhost(cam) {
      const g = game.ghost;
      if (!g || !game.running) return;
      const n = g.pts.length / 2;
      const f = game.runTime / 100;
      const i = Math.min(n - 1, Math.floor(f)), j = Math.min(n - 1, i + 1), k = Math.min(1, f - i);
      const gx = (g.pts[i * 2] + (g.pts[j * 2] - g.pts[i * 2]) * k) / 1000 * W;
      const gy = g.pts[i * 2 + 1] + (g.pts[j * 2 + 1] - g.pts[i * 2 + 1]) * k + game.groundY - cam;
      const done = f >= n - 1;
      const a = done ? Math.max(0, 1 - (f - n + 1) / 15) : 1;
      if (a <= 0) return;
      if (gy < -60) {
        // Ghost is above the screen: a little marker at the top edge
        ctx.save();
        ctx.globalAlpha = 0.8 * a;
        ctx.fillStyle = '#bfefff';
        ctx.beginPath();
        ctx.moveTo(gx, 58); ctx.lineTo(gx - 7, 70); ctx.lineTo(gx + 7, 70);
        ctx.fill();
        ctx.font = '700 9px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GHOST', gx, 82);
        ctx.restore();
        return;
      }
      if (gy > H + 60) return;
      const t = performance.now() / 300;
      ctx.save();
      ctx.globalAlpha = 0.5 * a;
      ctx.translate(gx, gy);
      ctx.scale(1.35, 1.35);
      ctx.fillStyle = '#bfefff';
      ctx.shadowColor = '#9fe3ff';
      ctx.shadowBlur = 14;
      // body: a round top with a wavy hem
      ctx.beginPath();
      ctx.arc(0, -22, 13, Math.PI, 0);
      ctx.lineTo(13, -4);
      for (let w = 0; w < 4; w++) {
        const x = 13 - (w + 1) * 6.5;
        ctx.quadraticCurveTo(x + 3.25, -4 + ((w + Math.floor(t)) % 2 ? 5 : -1), x, -4);
      }
      ctx.closePath();
      ctx.fill();
      // santa hat, because it's still you
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff9aa8';
      ctx.beginPath();
      ctx.moveTo(-11, -31); ctx.lineTo(11, -31); ctx.lineTo(8, -44 + Math.sin(t) * 1.5);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-12, -33, 24, 4);
      ctx.fillStyle = '#0a1929';
      ctx.fillRect(-6, -24, 3, 4);
      ctx.fillRect(3, -24, 3, 4);
      ctx.globalAlpha = 0.75 * a;
      ctx.font = '700 9px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e8fbff';
      ctx.fillText('BEST ' + g.floor, 0, -52);
      ctx.restore();
    }

    // Draw
    function draw() {
      // The sky of the zone you're in, fading over from the one below
      const zNow = zoneAt(game.zoneIdx), zWas = zoneAt(game.zonePrev), zk = game.zoneFade;
      const paintSky = z => {
        ctx.fillStyle = z.sky;
        ctx.fillRect(0, 0, W, H);
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, z.tint[0]);
        bgGrad.addColorStop(0.5, z.tint[1]);
        bgGrad.addColorStop(1, z.tint[2]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
      };
      if (zk < 1) paintSky(zWas);
      ctx.globalAlpha = zk;
      paintSky(zNow);
      ctx.globalAlpha = 1;

      // Snow, embers, sparks or stardust, depending on the zone
      ctx.fillStyle = 'rgba(' + mixRgb(zWas.flake, zNow.flake, zk) + ', 0.6)';
      for (const s of game.snowflakes) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      const cam = game.cameraY;

      // Tower walls: you bounce off these
      const wallRgb = zk < 1 ? mixRgb(zWas.wall.split(',').map(Number), zNow.wall.split(',').map(Number), zk) : zNow.wall;
      const wallGrad = ctx.createLinearGradient(0, 0, 7, 0);
      wallGrad.addColorStop(0, 'rgba(' + wallRgb + ', 0.45)');
      wallGrad.addColorStop(1, 'rgba(' + wallRgb + ', 0)');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, 7, H);
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      ctx.fillRect(0, 0, 7, H);
      ctx.restore();

      // Christmas platforms with snow
      for (const plat of game.platforms) {
        const py = plat.y - cam;
        if (py < -30 || py > H + 30) continue;

        const glowAmount = 6 + plat.glow * 15;

        // Each platform is built from its own zone's material, so the next zone shows up above you
        const pz = zoneOfFloor(plat.n);
        const isRed = Math.floor(plat.hue) % 2 === 0;
        const pc = pz.plat[isRed ? 0 : 1];
        ctx.shadowColor = plat.type === 'special' ? '#ffd700' : pc[2];
        ctx.shadowBlur = glowAmount;

        // Platform body - wood/brick style
        const grad = ctx.createLinearGradient(plat.x, py, plat.x, py + plat.h);
        if (plat.type === 'special') {
          grad.addColorStop(0, '#ffd700');
          grad.addColorStop(1, '#b8860b');
        } else if (plat.type === 'ground') {
          grad.addColorStop(0, '#8b4513');
          grad.addColorStop(1, '#654321');
        } else {
          grad.addColorStop(0, pc[0]);
          grad.addColorStop(1, pc[1]);
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(plat.x, py, plat.w, plat.h, 3);
        ctx.fill();

        ctx.shadowBlur = 0;
        drawTopping(plat.type === 'ground' ? ZONES[0] : pz, plat, py, pc);

        // Every tenth floor carries its number
        if (plat.n > 0 && plat.n % 10 === 0) {
          ctx.font = '900 10px Orbitron, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 3;
          ctx.fillText(String(plat.n), plat.x + plat.w / 2, py + plat.h / 2 + 1);
          ctx.shadowBlur = 0;
        }
      }

      // Powerups as Christmas ornaments/gifts
      for (const pu of game.powerups) {
        const py = pu.y - cam;
        if (py < -30 || py > H + 30) continue;

        pu.bob += 0.06;
        pu.pulse += 0.1;
        const bobY = py + Math.sin(pu.bob) * 5;
        const pulseScale = 1 + Math.sin(pu.pulse) * 0.1;

        let color1, color2, icon;
        if (pu.type === 'double') { color1 = '#22c55e'; color2 = '#166534'; icon = '🎁'; }
        else if (pu.type === 'slow') { color1 = '#fbbf24'; color2 = '#b45309'; icon = '⭐'; }
        else { color1 = '#ef4444'; color2 = '#991b1b'; icon = '🎄'; }

        ctx.shadowColor = color1;
        ctx.shadowBlur = 15 + Math.sin(pu.pulse) * 5;

        const puGrad = ctx.createRadialGradient(pu.x, bobY, 0, pu.x, bobY, 14 * pulseScale);
        puGrad.addColorStop(0, color1);
        puGrad.addColorStop(1, color2);
        ctx.fillStyle = puGrad;
        ctx.beginPath();
        ctx.arc(pu.x, bobY, 12 * pulseScale, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.font = '14px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, pu.x, bobY);
      }

      // Particles - festive red/green/white
      for (const p of game.particles) {
        const alpha = p.life / p.maxLife;
        if (p.glow) {
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y - cam, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      drawGhost(cam);

      // Player trail - red/green alternating
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        ctx.globalAlpha = t.alpha * 0.5;
        ctx.shadowColor = i % 2 === 0 ? '#ff4444' : '#44ff44';
        ctx.shadowBlur = 15;
        ctx.fillStyle = i % 2 === 0 ? '#ff4444' : '#44ff44';
        ctx.beginPath();
        ctx.arc(t.x, t.y - cam, t.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Player (Santa's helper!)
      const px = player.x;
      const py = player.y - cam;

      ctx.save();
      ctx.translate(px + player.width / 2, py + player.height / 2);
      const tilt = Math.max(-0.15, Math.min(0.15, player.vx * 0.025));
      ctx.rotate(tilt);

      // Glow
      const glowSize = 15 + player.glowIntensity * 25;
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = glowSize;

      // Body - red Christmas outfit
      const bodyGrad = ctx.createLinearGradient(-14, -19, 14, 19);
      bodyGrad.addColorStop(0, '#ef4444');
      bodyGrad.addColorStop(0.5, '#dc2626');
      bodyGrad.addColorStop(1, '#b91c1c');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 6);
      ctx.fill();

      ctx.shadowBlur = 0;

      // White fur trim on outfit
      ctx.fillStyle = '#fff';
      ctx.fillRect(-player.width / 2, -player.height / 2 + player.height - 10, player.width, 6);
      ctx.fillRect(-player.width / 2, player.height / 2 - 20, player.width, 4);

      // Belt
      ctx.fillStyle = '#000';
      ctx.fillRect(-player.width / 2, 2, player.width, 5);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-4, 1, 8, 7);

      // Face area
      ctx.fillStyle = '#fcd9b6';
      ctx.beginPath();
      ctx.roundRect(-player.width / 2 + 3, -player.height / 2 + 6, player.width - 6, 12, 3);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#000';
      const eyeOff = player.facingRight ? 2 : -2;
      ctx.fillRect(-5 + eyeOff, -player.height / 2 + 9, 3, 4);
      ctx.fillRect(3 + eyeOff, -player.height / 2 + 9, 3, 4);

      // Rosy cheeks
      ctx.fillStyle = 'rgba(255, 150, 150, 0.5)';
      ctx.beginPath();
      ctx.arc(-8, -player.height / 2 + 14, 3, 0, Math.PI * 2);
      ctx.arc(8, -player.height / 2 + 14, 3, 0, Math.PI * 2);
      ctx.fill();

      // Santa Hat
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(-player.width / 2 - 2, -player.height / 2 + 4);
      ctx.lineTo(player.width / 2 + 2, -player.height / 2 + 4);
      ctx.lineTo(player.width / 2 + 8, -player.height / 2 - 20);
      ctx.lineTo(-player.width / 2 + 5, -player.height / 2 - 8);
      ctx.closePath();
      ctx.fill();

      // Hat fur trim
      ctx.fillStyle = '#fff';
      ctx.fillRect(-player.width / 2 - 3, -player.height / 2 + 2, player.width + 6, 5);

      // Hat pompom
      ctx.beginPath();
      ctx.arc(player.width / 2 + 10, -player.height / 2 - 22, 6, 0, Math.PI * 2);
      ctx.fill();

      // Boots
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(-player.width / 2 + 2, player.height / 2 - 8, 8, 8);
      ctx.fillRect(player.width / 2 - 10, player.height / 2 - 8, 8, 8);

      ctx.restore();

      // HURRY UP! when the tower speeds up
      if (game.hurryT > 0) {
        const k = Math.min(1, game.hurryT / 400, (1800 - game.hurryT) / 150);
        ctx.save();
        ctx.globalAlpha = Math.max(0, k);
        ctx.font = '900 ' + Math.round(Math.min(44, W * 0.1)) + 'px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 18;
        ctx.fillText('HURRY UP!', W / 2, H * 0.2 + Math.sin(game.hurryT / 60) * 3);
        ctx.restore();
      }

      if (game.praise) {
        const pr = game.praise, age = 1700 - pr.t;
        const k = Math.max(0, Math.min(1, pr.t / 350, age / 120));
        const pop = 1 + Math.max(0, 1 - age / 220) * 0.5;
        ctx.save();
        ctx.globalAlpha = k;
        ctx.translate(W / 2, H * 0.34 - age * 0.02);
        ctx.scale(pop, pop);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(Math.min(40, W * 0.09)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#e8fbff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 16;
        ctx.fillText(pr.text, 0, 0);
        ctx.font = '700 ' + Math.round(Math.min(14, W * 0.034)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#9fe3ff';
        ctx.shadowBlur = 6;
        ctx.fillText(pr.sub, 0, Math.min(34, W * 0.075));
        ctx.restore();
      }

      if (game.zoneBanner) {
        const zb = game.zoneBanner, age = 2600 - zb.t;
        const k = Math.max(0, Math.min(1, zb.t / 500, age / 200));
        const z = zoneAt(game.zoneIdx);
        ctx.save();
        ctx.globalAlpha = k;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const y0 = H * 0.27;
        ctx.font = '700 ' + Math.round(Math.min(15, W * 0.036)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = 'rgb(' + z.flake.join(',') + ')';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 6;
        ctx.fillText(zb.title, W / 2, y0 - Math.min(30, W * 0.07));
        const grow = Math.min(1, age / 400);
        ctx.font = '900 ' + Math.round(Math.min(46, W * 0.1) * (0.85 + 0.15 * grow)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgb(' + z.wall + ')';
        ctx.shadowBlur = 22;
        ctx.fillText(zb.name, W / 2, y0 + 6);
        ctx.restore();
      }

      // Frozen in time: say so, and how to get going again
      if (game.running && game.paused) {
        ctx.save();
        ctx.fillStyle = 'rgba(3, 7, 18, 0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(Math.min(48, W * 0.11)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#e8fbff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 18;
        ctx.fillText('PAUSED', W / 2, H * 0.42);
        ctx.font = '700 ' + Math.round(Math.min(13, W * 0.032)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#9fe3ff';
        ctx.shadowBlur = 0;
        ctx.fillText('TAP OR PRESS P TO RESUME', W / 2, H * 0.42 + Math.min(44, W * 0.1));
        ctx.restore();
      }

      // HUD
      document.getElementById('floor').textContent = game.floor;
      document.getElementById('best').textContent = game.best;
      document.getElementById('combo').textContent = 'x' + game.combo;
    }

    // Loop
    function gameLoop(ts) {
      const dt = Math.min(32, ts - game.lastTime || 16);
      game.lastTime = ts;
      if (game.running && !game.paused) update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // UI
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    document.getElementById('playBtn').onclick = () => startGame('classic');
    document.getElementById('dailyBtn').onclick = () => startGame('daily');
    document.getElementById('modeSwapBtn').onclick = () => {
      gameOverOverlay.classList.remove('show');
      startGame(game.mode === 'daily' ? 'classic' : 'daily');
    };
    function refreshDailySub() {
      const d = loadDaily();
      document.getElementById('dailySub').textContent = d
        ? 'Your ghost from floor ' + d.floor + ' is waiting · same tower for everyone today'
        : 'Same tower for everyone today · race your ghost';
    }
    refreshDailySub();
    document.getElementById('playAgainBtn').onclick = () => { gameOverOverlay.classList.remove('show'); startGame(); };
    document.getElementById('pauseBtn').onclick = togglePause;
    canvas.addEventListener('click', () => { if (game.running && game.paused) togglePause(); });

    const muteBtn = document.getElementById('muteBtn');
    muteBtn.onclick = () => { game.muted = !game.muted; muteBtn.textContent = game.muted ? 'Sound Off' : 'Sound On'; };

    document.getElementById('shareBtn').onclick = () => {
      const text = encodeURIComponent(`I reached floor ${game.lastFloor} in Icy Tower! 🧊❄️`);
      const url = encodeURIComponent('https://app.sloppy.live/icy-tower');
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
    };

    function startGame(mode) {
      if (game.running) return;
      if (mode === 'daily' || mode === 'classic') game.mode = mode;
      startOverlay.classList.remove('show');
      gameOverOverlay.classList.remove('show');
      resetWorld();
      game.running = true;
      game.paused = false;
    }

    function togglePause() {
      if (!game.running) return;
      game.paused = !game.paused;
      const pb = document.getElementById('pauseBtn');
      pb.textContent = game.paused ? 'Resume' : 'Pause';
      if (!game.paused) input.jumpPressed = false; // no surprise jump from keys mashed while paused
    }

    function endGame() {
      game.running = false;
      restartAfter = performance.now() + 800; // a jump mashed while falling must not skip this screen
      game.lastFloor = game.floor;
      game.lastCombo = game.bestCombo;
      game.lastSecs = Math.max(1, Math.round(game.runTime / 1000));
      game.best = Math.max(game.best, game.floor);
      localStorage.setItem('icy-best', game.best);
      document.getElementById('finalFloor').textContent = game.floor;
      let dailyNote = '';
      document.getElementById('modeSwapText').textContent = game.mode === 'daily' ? 'Classic tower' : '❄ Daily Tower';
      if (game.mode === 'daily') {
        const prev = loadDaily();
        if (!prev || game.floor > prev.floor) {
          try { localStorage.setItem('icy-daily', JSON.stringify({ day: todayKey(), floor: game.floor, pts: game.rec })); } catch {}
          dailyNote = prev ? '<br><b>New daily best</b> · you beat your ghost by ' + (game.floor - prev.floor) : '<br>Your ghost will race you next time';
        } else {
          dailyNote = '<br>Your ghost still leads at floor ' + prev.floor;
        }
        refreshDailySub();
      }
      // Where you froze, and how far the next world is
      const zi = Math.floor(game.floor / ZONE_H), nextAt = (zi + 1) * ZONE_H;
      document.getElementById('finalZone').innerHTML = 'Zone ' + (zi + 1) + ' · <b>' + zoneAt(zi).name + '</b><br>' +
        zoneAt(zi + 1).name + ' in ' + (nextAt - game.floor) + ' floors' + dailyNote;
      gameOverOverlay.classList.add('show');
      document.getElementById('saveBlock').style.display = 'block';
      if (game.floor >= game.best && game.floor > 0) unlock('newPB');
    }

    function updateUI() {
      document.getElementById('floor').textContent = game.floor;
      document.getElementById('best').textContent = game.best;
      document.getElementById('combo').textContent = 'x' + game.combo;
    }

    // Power chips
    const chipsEl = document.getElementById('powerChips');
    function renderPowerChips() {
      const chips = [];
      if (game.effects.double > 0) chips.push({ type: 'double', label: 'DOUBLE JUMP', time: Math.ceil(game.effects.double / 1000) });
      if (game.effects.slow > 0) chips.push({ type: 'slow', label: 'TIME WARP', time: Math.ceil(game.effects.slow / 1000) });
      if (game.effects.boost > 0) chips.push({ type: 'boost', label: 'HYPER BOOST', time: Math.ceil(game.effects.boost / 1000) });
      chipsEl.innerHTML = chips.map(c => `<div class="power-chip ${c.type}">${c.label} · ${c.time}s</div>`).join('');
    }

    // Toast
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    // Achievements
    const ACHIEVEMENTS = [
      { key: 'floor20', name: 'First Steps', check: () => game.floor >= 20 },
      { key: 'floor50', name: 'Climber', check: () => game.floor >= 50 },
      { key: 'floor100', name: 'Ice Master', check: () => game.floor >= 100 },
      { key: 'combo7', name: 'Combo x7', check: () => game.combo >= 7 },
      { key: 'combo10', name: 'Combo x10', check: () => game.combo >= 10 },
      { key: 'firstPower', name: 'Powered', check: () => false },
      { key: 'savedScore', name: 'Ranked', check: () => false },
      { key: 'newPB', name: 'New Record', check: () => false },
      { key: 'zone2', name: 'Timber!', check: () => false },
      { key: 'zone6', name: 'Starlight', check: () => false },
    ];
    let unlocked = {};
    try { unlocked = JSON.parse(localStorage.getItem('icy-achievements') || '{}'); } catch {}
    function saveAch() { localStorage.setItem('icy-achievements', JSON.stringify(unlocked)); }
    function unlock(key) {
      if (unlocked[key]) return;
      unlocked[key] = true;
      saveAch();
      const a = ACHIEVEMENTS.find(x => x.key === key);
      if (a) showToast('🏆 ' + a.name);
    }
    function checkAchievements() { for (const a of ACHIEVEMENTS) if (!unlocked[a.key] && a.check()) unlock(a.key); }

    // Leaderboard
    let currentUser = null;
    const leaderboardEl = document.getElementById('leaderboard');

    async function initAuth() {
      try { const { user } = await supabaseSession(); currentUser = user; } catch (e) {}
      loadLeaderboard();
    }

    async function loadLeaderboard() {
      try {
        const { data: rows, error } = await supabase.from('icy_tower_season_two').select('score, display_name, best_combo, secs, user_id').order('score', { ascending: false }).limit(100);
        // Season 2 (the sinking tower): one row per player, and only climbs a human could make
        const seen = new Set();
        const data = (rows || []).filter(r => {
          const ok = r.score > 0 && r.score <= 5000 && r.secs > 0 && r.score <= r.secs * 5 + 10;
          const who = r.user_id || r.display_name;
          if (!ok || seen.has(who)) return false;
          seen.add(who);
          return true;
        }).slice(0, 8);
        if (error) throw error;
        const header = '<div class="lb-row header"><span>#</span><span>Player</span><span>Floor</span></div>';
        if (!data || data.length === 0) {
          leaderboardEl.innerHTML = header + '<div class="lb-row"><span></span><span style="opacity:0.4">Season 2 just started. Be the first!</span><span></span></div>';
          return;
        }
        leaderboardEl.innerHTML = header + data.map((r, i) => {
          const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          return `<div class="lb-row"><span class="lb-rank ${rankClass}">${i + 1}</span><span>${escapeHtml(r.display_name || 'Anon')}</span><span class="lb-score">${r.score}</span></div>`;
        }).join('');
      } catch (e) {}
    }

    document.getElementById('refreshBtn').onclick = loadLeaderboard;

    const saveScoreBtn = document.getElementById('saveScoreBtn');
    const skipSaveBtn = document.getElementById('skipSaveBtn');
    const saveError = document.getElementById('saveError');
    const playerNameInput = document.getElementById('playerName');
    const saveBlock = document.getElementById('saveBlock');

    skipSaveBtn.onclick = () => saveBlock.style.display = 'none';
    saveScoreBtn.onclick = async () => {
      saveError.style.display = 'none';
      try {
        const name = (playerNameInput.value || 'Player').slice(0, 20);
        const { error } = await supabase.from('icy_tower_season_two').insert([{ score: game.lastFloor, display_name: name, best_combo: game.lastCombo, secs: game.lastSecs, user_id: currentUser?.id }]);
        if (error) throw error;
        saveBlock.style.display = 'none';
        unlock('savedScore');
        loadLeaderboard();
      } catch (e) {
        saveError.textContent = 'Error: ' + e.message;
        saveError.style.display = 'block';
      }
    };

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    resetWorld();
    draw();
    initAuth();
  </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
