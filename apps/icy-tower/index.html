<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Orbitron', sans-serif;
      background: #030712;
      color: #fff;
    }

    .game-wrap {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* phones: keep the touch pads above the browser toolbar */
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .bg-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #030712 0%, #0a1628 50%, #030712 100%);
      z-index: 0;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 32px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0, 255, 255, 0.6);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 900;
      color: #22c55e;
      text-shadow: 0 0 20px #22c55e, 0 0 40px #22c55e;
    }

    .stat-value.combo {
      color: #ef4444;
      text-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444;
    }

    .hud-right {
      margin-left: auto;
      display: flex;
      gap: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #22c55e;
      padding: 12px 20px;
      min-height: 44px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .btn:focus-visible, .touch-btn:focus-visible {
      outline: 3px solid #0ff;
      outline-offset: 3px;
    }

    /* Power chips */
    .power-chips {
      position: absolute;
      top: 90px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .power-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid;
      border-radius: 4px;
      font-size: 12px;
      letter-spacing: 1px;
      animation: chipGlow 1s ease-in-out infinite alternate;
    }

    .power-chip.double { border-color: #0f0; color: #0f0; }
    .power-chip.slow { border-color: #ff0; color: #ff0; }
    .power-chip.boost { border-color: #f0f; color: #f0f; }

    @keyframes chipGlow {
      from { box-shadow: 0 0 5px currentColor; }
      to { box-shadow: 0 0 15px currentColor; }
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      overflow-y: auto;
    }

    .overlay.show { display: flex; }

    .modal {
      text-align: center;
      padding: 48px;
      max-width: 420px;
      margin: auto;
    }

    /* short phones: the game-over card has to fit without cutting off Try Again */
    @media (max-height: 720px) {
      .overlay .modal { padding: 20px 18px; }
      .overlay .modal-icon { font-size: 44px; margin-bottom: 6px; }
      .overlay .modal h1 { font-size: 40px; margin-bottom: 6px; }
      .overlay .score-display { font-size: 54px; margin: 8px 0 16px; }
      .overlay .modal-buttons { margin-top: 16px; }
    }

    .modal-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: iconFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }

    .modal h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;

    .modal p {

    .input-wrap {

    .input-wrap label {
      display: block;

      letter-spacing: 1px;

    /* Toast */

    .toast.show {

    /* Mobile controls */
    .touch-controls {
      display: none;

      bottom: 20px;

      grid-template-columns: 1fr 1fr 1fr;

    .touch-btn {

      background: rgba(239, 68, 68, 0.15);

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(0, 0, 0, 0.5);
      border-left: 1px solid rgba(0, 255, 255, 0.1);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 1;
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }

    .section-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0, 255, 255, 0.5);
      text-transform: uppercase;

    .lb-tabs { display: flex; gap: 6px; margin-bottom: 12px; }

    .leaderboard {

    .lb-row {

    .lb-row:last-child { border-bottom: none; }
    .lb-row.header { background: rgba(0, 255, 255, 0.05); color: rgba(255,255,255,0.4); }

    .lb-rank { color: #0ff; font-weight: 700; }

    .lb-score { text-align: right; color: #0ff; font-weight: 700; }

  <script type="module">
    import supabase, { supabaseSession } from './supabase-config.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);

    function resize() {
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    const game = {
      running: false,
      paused: false,
      muted: false,
      floor: 0,
      lastFloor: 0,
      best: parseInt(localStorage.getItem('icy-best') || '0'),
      combo: 1,
      comboTimer: 0,
      cameraY: 0,
      cameraTargetY: 0,
      lastTime: 0,
      particles: [],
      snowflakes: [],
      platforms: [],
      powerups: [],
      effects: { double: 0, slow: 0, boost: 0 },
    };

    const player = {
      x: 0, y: 0, vx: 0, vy: 0,
      width: 28, height: 38,
      grounded: false, jumpsLeft: 1,
      facingRight: true,
      trail: [],
      glowIntensity: 0,
      land: 0,
    };

    const PHYSICS = {
      gravity: 0.52,
      jumpForce: -14,
      moveAccel: 1.1,
      moveDecel: 0.88,
      maxSpeed: 9,
      runUp: 0.12,
      airControl: 0.7,
      cameraSmooth: 0.08,
    };

    // Audio
    let audioCtx;
    function playSound(freq, dur = 0.1, type = 'sine', vol = 0.12) {
      if (game.muted) return;
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    // Initialize snowflakes
    function initSnowflakes() {
      game.snowflakes = [];
      for (let i = 0; i < 50; i++) {
        game.snowflakes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: 1 + Math.random() * 3,
          speed: 0.3 + Math.random() * 0.5,
          drift: (Math.random() - 0.5) * 0.5,
        });
      }
    }

    // Particles
    function spawnParticle(x, y, vx, vy, color, life = 0.8, size = 4, glow = true) {
      game.particles.push({ x, y, vx, vy, color, life, maxLife: life, size, glow });
    }

    function spawnJumpBurst(x, y) {
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const speed = 3 + Math.random() * 4;
        spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 2, '#0ff', 0.6, 3 + Math.random() * 3);
      }
    }

    function spawnLandingParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        const angle = Math.PI + (Math.random() - 0.5) * 1.5;
        const speed = 2 + Math.random() * 3;

    // Power-up art. double = two chevrons (jump twice), slow = hourglass, boost = lightning bolt.

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';

      ctx.translate(x, y);

      ctx.fillStyle = '#fff';

      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 2;

      if (type === 'double') {
        ctx.moveTo(-5.5, 1); ctx.lineTo(0, -4.5); ctx.lineTo(5.5, 1);
        ctx.moveTo(-5.5, 6.5); ctx.lineTo(0, 1); ctx.lineTo(5.5, 6.5);
        ctx.stroke();
      } else if (type === 'slow') {
        ctx.moveTo(-5, -6.5); ctx.lineTo(5, -6.5);

    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);

    // Platforms - progressive difficulty
    function getDifficulty(y) {
      // Calculate difficulty based on height (more negative y = higher = harder)
      // Start easy, get harder as player climbs
      const height = Math.max(0, H * 0.6 - y); // Distance climbed from start
      const difficulty = Math.min(1, height / 8000); // Max difficulty at ~8000 pixels up
      return difficulty;
    }

      const minWStart = W * 0.15, maxWStart = W * 0.30;
      const minWEnd = W * 0.08, maxWEnd = W * 0.15;
      const minW = Math.max(50, minWStart - (minWStart - minWEnd) * difficulty);
      const maxW = Math.max(70, maxWStart - (maxWStart - maxWEnd) * difficulty);

      const w = minW + rand() * (maxW - minW);
      const x = rand() * (W - w);
      const type = rand() < 0.12 ? 'special' : 'normal';
      const hue = 180 + rand() * 40; // Cyan-blue range
      return { x, y, w, h: 12, type, hue, glow: 0, n, bumps: [rand() * 2, rand() * 2, rand() * 2] };
    }

    function getPlatformGap(y) {
      const difficulty = getDifficulty(y);
      // Gap starts at 50-90, increases to 70-130 at max difficulty
      const baseGap = 50 + difficulty * 20;

      return baseGap + rand() * gapVariance;

        b.fillStyle = g; b.beginPath(); b.arc(px, py, pr, 0, Math.PI * 2); b.fill();
        b.strokeStyle = 'rgba(255,225,140,0.3)'; b.lineWidth = 3;
        b.beginPath(); b.ellipse(px, py, pr * 1.7, pr * 0.42, -0.3, 0, Math.PI * 2); b.stroke();
      },
    ];
    function backTile(zi) {
      // faint scenery doesn't need full retina sharpness, and only the last few tiles are kept (phones' memory)
      const k = ((zi % ZONES.length) + ZONES.length) % ZONES.length, q = Math.min(dpr, 1.5), key = k + ':' + W + ':' + q;
      if (backCache.has(key)) return backCache.get(key);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(W * q));
      c.height = Math.round(BACK_H * q);
      const b = c.getContext('2d');
      b.scale(q, q);
      try { BACKDROPS[k](b, W, mulberry32(4242 + k * 977)); } catch (e) { /* a missing backdrop only costs the scenery */ }
      backCache.set(key, c);
      if (backCache.size > 3) backCache.delete(backCache.keys().next().value);
      return c;
    }
    function paintBack(zi) {
      const t = backTile(zi), off = ((-game.cameraY * 0.33) % BACK_H + BACK_H) % BACK_H;
      for (let y = off - BACK_H; y < H; y += BACK_H) ctx.drawImage(t, 0, y, W, BACK_H);
    }

    // The tower's side walls: bricks that scroll with you; you bounce off their inner edge
    const wallW = () => (W < 600 ? 9 : 15);
    function drawWalls(cam, rgb) {
      const ww = wallW(), rowH = 18, off = ((-cam) % (rowH * 2) + rowH * 2) % (rowH * 2);
      [0, 1].forEach(side => {
        ctx.save();
        if (side) { ctx.translate(W, 0); ctx.scale(-1, 1); }
        ctx.fillStyle = 'rgba(8,10,20,0.92)';
        ctx.fillRect(0, 0, ww, H);
        for (let y = off - rowH * 2, row = 0; y < H + rowH; y += rowH, row++) {
          const shift = row % 2 ? -ww * 0.5 : 0;
          ctx.fillStyle = 'rgba(' + rgb + ',' + (row % 3 ? 0.16 : 0.22) + ')';
          ctx.fillRect(shift + 1, y + 1, ww - 2, rowH - 2);
          if (shift) ctx.fillRect(shift + ww + 1, y + 1, ww - 2, rowH - 2);
        }
        ctx.fillStyle = 'rgba(' + rgb + ', 0.7)';
        ctx.fillRect(ww - 1.5, 0, 1.5, H);
        const g = ctx.createLinearGradient(ww, 0, ww + 9, 0);
        g.addColorStop(0, 'rgba(' + rgb + ', 0.35)');
        g.addColorStop(1, 'rgba(' + rgb + ', 0)');
        ctx.fillStyle = g;
        ctx.fillRect(ww, 0, 9, H);
        ctx.restore();
      });
    }
    const zoneOfFloor = n => zoneAt(Math.floor(Math.max(0, n) / ZONE_H));

    function enterZone(zi) {
      game.zonePrev = game.zoneIdx;
      game.zoneIdx = zi;
      game.zoneFade = 0;
      const z = zoneAt(zi);
      game.zoneBanner = { title: 'ZONE ' + (zi + 1), name: z.name, t: 2600 };
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playSound(f, 0.14, 'triangle', 0.07), i * 90));
      const c = z.flake;
      spawnPowerupBurst(player.x + player.width / 2, player.y - game.cameraY, 'rgb(' + c.join(',') + ')');
      if (zi >= 1) unlock('zone2');
      if (zi >= 5) unlock('zone6');
    }

    function mixRgb(a, b, k) {
      return a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',');
    }

    function resetWorld() {
      const day = todayKey();
      game.runDay = day;
      rand = game.mode === 'daily' ? mulberry32(+day.replace(/-/g, '')) : Math.random;
      game.ghost = game.mode === 'daily' ? loadDaily() : null;
      game.ghost3 = game.mode === 'daily' && friendGhost && friendGhost.day === day ? friendGhost : null;
      game.ghost2 = game.mode === 'daily' && leaderGhost && leaderGhost.day === day && leaderGhost.user_id !== myUserId ? leaderGhost : null;
      game.rec = [];
      game.recClock = 0;
      game.groundY = H * 0.75;
      game.floor = 0;
      game.zoneIdx = 0;
      game.zonePrev = 0;
      game.zoneFade = 1;
      game.zoneBanner = null;
      game.combo = 1;
      game.comboTimer = 0;
      game.cameraY = 0;
      game.cameraTargetY = 0;
      game.particles = [];
      game.platforms = [];
      game.powerups = [];
      game.effects = { double: 0, slow: 0, boost: 0 };

      player.x = W / 2 - player.width / 2;
      player.y = H * 0.6;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.jumpsLeft = 1;
      player.trail = [];
      player.glowIntensity = 0;

      game.platforms.push({ x: 0, y: H * 0.75, w: W, h: 16, type: 'ground', hue: 200, glow: 0, n: 0, bumps: [1, 0.5, 1.5] });
      game.landedN = 0;
      game.topN = 40;
      game.scroll = 0;
      game.scrollLevel = 0;
      game.scrollClock = 0;
      game.hurryT = 0;
      game.bestCombo = 1;
      game.runTime = 0;
      game.comboFloors = 0;
      game.praise = null;

      // First platform at fixed height above ground (easily reachable with basic jump)
      const groundY = H * 0.75;
      let y = groundY - 70; // ~70px above ground, well within jump range
      const firstPlat = createPlatform(y, 1);
      game.platforms.push(firstPlat);

      // Generate remaining platforms with progressive difficulty
      for (let i = 0; i < 39; i++) {
        y -= getPlatformGap(y);
        const plat = createPlatform(y, i + 2);
        game.platforms.push(plat);
        if (rand() < 0.1 && y < H - 100) {
          const types = ['double', 'slow', 'boost'];
          game.powerups.push({
            x: plat.x + plat.w / 2,
            y: plat.y - 15,
            type: types[Math.floor(rand() * 3)],
            bob: rand() * Math.PI * 2,
            pulse: 0,
          });
        }
      }

      initSnowflakes();
      updateUI();
    }

    // Input
    const input = { left: false, right: false, jump: false, jumpPressed: false };
    const SCROLL_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    let restartAfter = 0; // a jump key only restarts once the game-over screen has been up a moment

    window.addEventListener('keydown', (e) => {
      const t = e.target;
      // typing a name in the save box must not steer, jump or restart the game
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      // on menus a focused button keeps its own Space/Enter
      if (!game.running && t && t.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
      // while climbing, Space/arrows belong to the game, not to a focused Pause/Sound button
      if (game.running && SCROLL_KEYS.includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (!game.running && performance.now() < restartAfter) return;
        input.jump = true;
        input.jumpPressed = true;
        if (!game.running) startGame();
      }
      if (e.code === 'KeyP') togglePause();
    });

    window.addEventListener('keyup', (e) => {
      if (game.running && SCROLL_KEYS.includes(e.code) && e.target && e.target.tagName === 'BUTTON') e.preventDefault();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.jump = false;
    });

    // Touch
    function bindTouch(el, onStart, onEnd) {
      const start = (e) => { e.preventDefault(); onStart(); };
      const end = (e) => { e.preventDefault(); onEnd(); };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('touchcancel', end, { passive: false }); // a system gesture must not leave you running
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }
    bindTouch(document.getElementById('leftPad'), () => input.left = true, () => input.left = false);
    bindTouch(document.getElementById('rightPad'), () => input.right = true, () => input.right = false);
    bindTouch(document.getElementById('jumpPad'), () => {
      input.jump = true;
      input.jumpPressed = true;
      if (!game.running) startGame();
    }, () => input.jump = false);

    // Update
    // A combo that ends after 3+ multi-floor jumps gets a shout, bigger for more floors
    const PRAISE = ['GOOD!', 'SWEET!', 'GREAT!', 'SUPER!', 'WOW!', 'AMAZING!', 'EXTREME!', 'FANTASTIC!', 'SPLENDID!', 'NO WAY!'];
    function endCombo() {
      if (game.combo >= 3) {
        const text = PRAISE[Math.min(PRAISE.length - 1, Math.floor(game.comboFloors / 6))];
        game.praise = { text, sub: game.comboFloors + ' FLOOR COMBO', t: 1700 };
        playSound(520, 0.08, 'triangle', 0.08);
        playSound(780, 0.14, 'triangle', 0.08);
      }
      game.combo = 1;
      game.comboTimer = 0;
      game.comboFloors = 0;
    }

    function update(dt) {
      const dtNorm = dt / 16.67;
      game.runTime += dt;
      if (game.mode === 'daily' && game.rec.length < 9000) {
        game.recClock += dt;
        while (game.recClock >= 100) {
          game.recClock -= 100;
          game.rec.push(Math.round((player.x + player.width / 2) / W * 1000), Math.round(player.y + player.height - game.groundY));
        }
      }

      // Combo decay
      if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) endCombo();
      }

      // Effects decay
      for (const key of Object.keys(game.effects)) {
        game.effects[key] = Math.max(0, game.effects[key] - dt);
      }
      renderPowerChips();

      // Player movement
      const accel = PHYSICS.moveAccel * (player.grounded ? 1 : PHYSICS.airControl);
      // past cruise speed you only gain slowly (and barely in the air): a real run-up buys the big jumps
      const cruise = PHYSICS.maxSpeed * 0.62;
      const push = (dir) => {
        const fast = Math.sign(player.vx) === dir && Math.abs(player.vx) >= cruise;
        player.vx += dir * (fast ? PHYSICS.runUp * (player.grounded ? 1 : 0.3) : accel) * dtNorm;
      };
      if (input.left) { push(-1); player.facingRight = false; }
      else if (input.right) { push(1); player.facingRight = true; }
      else { player.vx *= Math.pow(PHYSICS.moveDecel, dtNorm); }

      const maxSpd = PHYSICS.maxSpeed * (game.effects.boost > 0 ? 1.25 : 1);
      player.vx = Math.max(-maxSpd, Math.min(maxSpd, player.vx));

      // Jump
      if (input.jumpPressed) {
        const jumpMod = game.effects.boost > 0 ? 1.25 : 1;
        if (player.grounded) {
          const run = Math.max(0, Math.min(1, (Math.abs(player.vx) - 4) / 5));
          player.vy = PHYSICS.jumpForce * jumpMod * (1 + 0.4 * run);
          player.grounded = false;
          player.jumpsLeft = game.effects.double > 0 ? 1 : 0;
          player.glowIntensity = 1;
          playSound(440, 0.12, 'sine');
          playSound(660, 0.08, 'triangle');
          spawnJumpBurst(player.x + player.width / 2, player.y + player.height);
        } else if (game.effects.double > 0 && player.jumpsLeft > 0) {
          player.vy = PHYSICS.jumpForce * jumpMod * 0.9;
          player.jumpsLeft--;
          player.glowIntensity = 1;
          playSound(550, 0.1, 'sine');
          spawnJumpBurst(player.x + player.width / 2, player.y + player.height / 2);
        }
        input.jumpPressed = false;
      }

      // Gravity
      const gravMod = game.effects.slow > 0 ? 0.65 : 1;
      player.vy += PHYSICS.gravity * gravMod * dtNorm;
      player.x += player.vx * dtNorm;
      player.y += player.vy * dtNorm;

      // Walls: in the air you bounce off and keep your speed, on the ground you just stop
      const WW = wallW();
      if (player.x < WW || player.x > W - WW - player.width) {
        const hitLeft = player.x < WW;
        player.x = hitLeft ? WW : W - WW - player.width;
        if (!player.grounded && Math.abs(player.vx) > 2.5) {
          player.vx = -player.vx * 0.92;
          player.facingRight = player.vx > 0;
          player.glowIntensity = 0.7;
          playSound(260, 0.05, 'triangle', 0.08);
          for (let i = 0; i < 6; i++) spawnParticle(hitLeft ? WW + 2 : W - WW - 2, player.y + player.height / 2, (hitLeft ? 1 : -1) * (1 + Math.random() * 3), (Math.random() - 0.5) * 4, 'rgba(180, 235, 255, 0.9)', 0.4, 2 + Math.random() * 2);
        } else {
          player.vx = 0;
        }
      }

      // Trail
      if (Math.abs(player.vy) > 3 || Math.abs(player.vx) > 4) {
        player.trail.push({
          x: player.x + player.width / 2,
          y: player.y + player.height / 2,
          alpha: 0.6,
          size: player.width * 0.4,
        });
        if (player.trail.length > 12) player.trail.shift();
      }
      for (const t of player.trail) t.alpha *= 0.9;
      player.trail = player.trail.filter(t => t.alpha > 0.05);

      // Glow decay
      player.glowIntensity *= 0.95;

      // Platform collision
      let landed = false;
      for (const plat of game.platforms) {
        if (player.vy >= 0 &&
            player.x + player.width > plat.x && player.x < plat.x + plat.w &&
            player.y + player.height >= plat.y && player.y + player.height <= plat.y + plat.h + player.vy * dtNorm + 5) {
          player.y = plat.y - player.height;
          if (!player.grounded) player.land = Math.min(1, 0.3 + player.vy / 20);
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = game.effects.double > 0 ? 2 : 1;
          landed = true;
          plat.glow = 1;

          if (plat.n > game.landedN) {
            const jumped = plat.n - game.landedN;
            game.landedN = plat.n;
            game.floor = Math.max(game.floor, plat.n);
            const zi = Math.floor(game.floor / ZONE_H);
            if (zi > game.zoneIdx) enterZone(zi);
            if (jumped >= 2) {
              game.comboFloors = (game.combo > 1 ? game.comboFloors : 0) + jumped;
              game.combo = Math.min(10, game.combo + 1);
              game.bestCombo = Math.max(game.bestCombo, game.combo);
              game.comboTimer = 3000;
              playSound(300 + game.combo * 50, 0.06, 'sine');
            } else {
              endCombo();
              playSound(300, 0.04, 'sine', 0.06);
            }
            spawnLandingParticles(player.x + player.width / 2, player.y + player.height);
            checkAchievements();
          } else if (plat.n < game.landedN) {
            game.landedN = plat.n;
            endCombo();
          }
          break;
        }
      }
      if (!landed && player.grounded) player.grounded = false;

      // Platform glow decay
      for (const plat of game.platforms) {
        plat.glow *= 0.92;
      }

      // Powerup collection
      for (let i = game.powerups.length - 1; i >= 0; i--) {
        const pu = game.powerups[i];
        const dx = (player.x + player.width / 2) - pu.x;
        const dy = (player.y + player.height / 2) - pu.y;
        if (Math.sqrt(dx * dx + dy * dy) < 28) {
          applyPowerup(pu.type, pu.x, pu.y);
          game.powerups.splice(i, 1);
        }
      }

      // The tower starts sinking once you are a few floors up, and speeds up every 30 s
      if (game.floor >= 5) {
        game.scrollClock += dt;
        const level = 1 + Math.floor(game.scrollClock / 30000);
        if (level !== game.scrollLevel) {
          game.scrollLevel = level;
          if (level > 1 && level <= 8) { game.hurryT = 1800; playSound(880, 0.08, 'square', 0.06); playSound(660, 0.12, 'square', 0.06); }
        }
        game.scroll = Math.min(3.6, 0.55 + (game.scrollLevel - 1) * 0.45);
      }
      if (game.hurryT > 0) game.hurryT -= dt;
      if (game.praise && (game.praise.t -= dt) <= 0) game.praise = null;
      if (game.zoneFade < 1) game.zoneFade = Math.min(1, game.zoneFade + dt / 1600);
      if (player.land > 0) player.land = Math.max(0, player.land - dt / 170);
      if (game.zoneBanner && (game.zoneBanner.t -= dt) <= 0) game.zoneBanner = null;
      game.cameraTargetY -= game.scroll * (game.effects.slow > 0 ? 0.5 : 1) * dtNorm;

      // Camera
      game.cameraTargetY = Math.min(game.cameraTargetY, player.y - H * 0.45);
      game.cameraY += (game.cameraTargetY - game.cameraY) * PHYSICS.cameraSmooth * dtNorm;

      // Recycle
      const cutoff = game.cameraY + H + 100;
      game.platforms = game.platforms.filter(p => p.y < cutoff);
      game.powerups = game.powerups.filter(p => p.y < cutoff);

      while (game.platforms.length < 45) {
        const topY = Math.min(...game.platforms.map(p => p.y));
        const newY = topY - getPlatformGap(topY);
        const plat = createPlatform(newY, ++game.topN);
        game.platforms.push(plat);
        if (rand() < 0.1) {
          const types = ['double', 'slow', 'boost'];
          game.powerups.push({
            x: plat.x + plat.w / 2,
            y: plat.y - 15,
            type: types[Math.floor(rand() * 3)],
            bob: rand() * Math.PI * 2,
            pulse: 0,
          });
        }
      }

      // Death
      if (player.y - game.cameraY > H + 50) endGame();

      // Update particles
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx * dtNorm;
        p.y += p.vy * dtNorm;
        p.vy += 0.15 * dtNorm;
        p.life -= dt / 1000;
        if (p.life <= 0) game.particles.splice(i, 1);
      }

      // Update snowflakes
      for (const s of game.snowflakes) {
        s.y += s.speed * dtNorm;
        s.x += s.drift * dtNorm;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        if (s.x < 0) s.x = W;
        if (s.x > W) s.x = 0;
      }
    }

    function applyPowerup(type, x, y) {
      game.effects[type] = 8000;
      const colors = { double: '#0f0', slow: '#ff0', boost: '#f0f' };
      const msgs = { double: 'DOUBLE JUMP', slow: 'TIME WARP', boost: 'HYPER BOOST' };
      playSound(523, 0.1, 'sine');
      playSound(784, 0.15, 'sine');
      spawnPowerupBurst(x, y - game.cameraY, colors[type]);
      showToast(msgs[type]);
      unlock('firstPower');
    }

    // What sits on top of a platform: snow, wood grain, circuit lights, frosting, bone knobs or stars
    function drawTopping(z, plat, py, pc) {
      const x = plat.x, w = plat.w, h = plat.h, b = plat.bumps;
      if (z.top === 'snow') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, py, w / 2 + 4, 5, 0, Math.PI, 0);
        ctx.fill();
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(x + (w / 4) * (i + 0.5), py - 2, 4 + b[i], 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (z.top === 'grain') {
        ctx.fillStyle = 'rgba(255, 225, 170, 0.35)';
        ctx.fillRect(x + 2, py + 1, w - 4, 2);
        ctx.fillStyle = 'rgba(60, 25, 5, 0.55)';
        const plank = 26 + b[0] * 6;
        for (let px = x + plank * (0.4 + b[1] * 0.3); px < x + w - 6; px += plank) ctx.fillRect(px, py + 2, 2, h - 3);
        ctx.fillStyle = 'rgba(40, 15, 0, 0.7)';
        for (let px = x + 5; px < x + w - 4; px += plank) ctx.fillRect(px, py + h / 2 - 1, 2, 2);
      } else if (z.top === 'wire') {
        ctx.strokeStyle = pc[2];
        ctx.lineWidth = 2;
        ctx.shadowColor = pc[2];
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x + 2, py + 1);
        ctx.lineTo(x + w - 2, py + 1);
        ctx.stroke();
        ctx.shadowBlur = 0;
        const t = performance.now() / 300;
        for (let i = 0; i < 4; i++) {
          const on = Math.sin(t + i * 1.7 + b[i % 3] * 3) > 0;
          ctx.fillStyle = on ? '#fff' : 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(x + (w / 5) * (i + 1) - 1.5, py + h / 2, 3, 3);
        }
      } else if (z.top === 'sprinkles') {
        ctx.fillStyle = '#ffe4f1';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, py + 1, w / 2 + 2, 4, 0, Math.PI, 0);
        ctx.fill();
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(x + (w / 4) * (i + 0.5), py + 2, 4, 3 + b[i % 3] * 1.5, 0, 0, Math.PI);
          ctx.fill();
        }
        const cols = ['#22d3ee', '#facc15', '#f43f5e', '#4ade80', '#fff'];
        for (let i = 0; i < 7; i++) {
          ctx.save();
          ctx.translate(x + 6 + ((i * 37 + b[i % 3] * 23) % Math.max(1, w - 12)), py - 1 + (i % 3));
          ctx.rotate(i * 1.3 + b[0]);
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillRect(-2.5, -1, 5, 2);
          ctx.restore();
        }
      } else if (z.top === 'bone') {
        ctx.fillStyle = pc[0];
        for (const ex of [x + 1, x + w - 1]) {
          ctx.beginPath();
          ctx.arc(ex, py + 3, 5, 0, Math.PI * 2);
          ctx.arc(ex, py + h - 3, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(70, 60, 40, 0.35)';
        ctx.fillRect(x + 8, py + h - 4, w - 16, 2);
      } else if (z.top === 'stars') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(x + 3, py + 1, w - 6, 1.5);
        const t = performance.now() / 500;
        for (let i = 0; i < 3; i++) {
          const sx = x + (w / 4) * (i + 0.5) + b[i] * 4, sy = py - 5 - b[(i + 1) % 3] * 3;
          const r = 2.5 + Math.sin(t + i * 2 + b[i] * 5) * 1.2;
          ctx.fillStyle = i === 1 ? '#fff' : pc[2];
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = k * Math.PI / 4, rr = k % 2 ? r * 0.4 : r;
            ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
          }
          ctx.fill();
        }
      }
    }

    // Your best daily run, replayed on the same tower (lead: today's #1 run from the shared board, in gold)
    // Drawn around the feet (fx, fy) so squash and stretch keep the boots on the platform.
    // The hitbox stays player.width x player.height; the art only fills it.
    function drawClimber(fx, fy) {
      const P = player, air = !P.grounded, fr = P.facingRight ? 1 : -1;
      const now = performance.now();
      let sx = 1, sy = 1;
      if (P.land > 0) { sy = 1 - 0.22 * P.land; sx = 1 + 0.2 * P.land; }
      else if (air) { const k = Math.max(-0.16, Math.min(0.12, -P.vy * 0.011)); sy = 1 + k; sx = 1 - k * 0.7; }
      const step = P.grounded && Math.abs(P.vx) > 0.6 ? Math.sin(P.x * 0.21) : 0;
      const bob = P.grounded ? Math.abs(step) * 1.5 : 0;
      const falling = air && P.vy > 9;

      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(Math.max(-0.15, Math.min(0.15, P.vx * 0.025)));
      ctx.scale(sx, sy);
      ctx.translate(0, -bob);

      // the scarf streams behind: the other way from where you're going, lifting when you fall
      const tail = Math.abs(P.vx) > 0.8 ? -Math.sign(P.vx) : -fr;
      const flap = Math.sin(now / 90) * 3, lift = air ? Math.max(-10, Math.min(12, -P.vy * 0.9)) : 3;
      const reach = 17 + Math.min(11, Math.abs(P.vx) * 1.5 + (air ? 6 : 0));
      const hang = P.grounded ? Math.max(0, 1 - Math.abs(P.vx) / 4) : 0;  // standing still, it drapes down your back
      ctx.lineCap = 'round';
      const sp = a => [tail * (8 + a * reach * (1 - hang * 0.75)), -27 + a * (lift * (1 - hang) + hang * 17) + Math.sin(now / 90 - a * 5) * a * 4 * (1 - hang * 0.8) + (a === 1 ? flap * 0.4 * (1 - hang) : 0)];
      for (let s = 0; s < 5; s++) {
        const p0 = sp(s / 5), p1 = sp((s + 1) / 5);
        ctx.strokeStyle = s % 2 ? '#ffd23a' : '#ff4d5e';
        ctx.lineWidth = 5.5 - s * 0.5;
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      }
      const e = sp(1);
      ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 1.2;
      for (let f = -1; f <= 1; f++) { ctx.beginPath(); ctx.moveTo(e[0], e[1] + f * 1.5); ctx.lineTo(e[0] + tail * 3.5, e[1] + f * 2.2 + 1); ctx.stroke(); }

      // boots: run cycle on the ground, tucked in the air
      ctx.fillStyle = '#1b2233';
      const leg = (side, lift0, fwd) => {
        ctx.beginPath();
        ctx.roundRect(side * 5 - 4 + fwd, -8 - lift0, 9, 8, 3);
        ctx.fill();
      };
      if (air) { leg(-1, P.vy < 0 ? 5 : 1, fr * -1); leg(1, P.vy < 0 ? 1 : 4, fr * 2); }
      else { leg(-1, Math.max(0, step) * 3, step * 3 * fr); leg(1, Math.max(0, -step) * 3, -step * 3 * fr); }

      // parka
      ctx.shadowColor = '#4fd8ff';
      ctx.shadowBlur = 10 + P.glowIntensity * 25;
      const coat = ctx.createLinearGradient(0, -30, 0, -6);
      coat.addColorStop(0, '#3fb6ff');
      coat.addColorStop(1, '#1f6fd6');
      ctx.fillStyle = coat;
      ctx.beginPath();
      ctx.roundRect(-13, -29, 26, 23, 9);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-11, -19); ctx.quadraticCurveTo(0, -16.5, 11, -19); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(0, -8); ctx.stroke();
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath(); ctx.roundRect(-13, -10, 26, 4, 2); ctx.fill();

      // mittens: swinging on the ground, reaching up in the air
      ctx.fillStyle = '#ff4d5e';
      const arm = (side, y) => { ctx.beginPath(); ctx.arc(side * 14, y, 3.6, 0, Math.PI * 2); ctx.fill(); };
      if (air && P.vy < 2) { arm(-1, -33); arm(1, -35); }
      else if (falling) { arm(-1, -30 - Math.sin(now / 50) * 3); arm(1, -30 + Math.sin(now / 50) * 3); }
      else { arm(-1, -16 + step * 2.5); arm(1, -16 - step * 2.5); }

      // scarf knot on top of the coat
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath(); ctx.roundRect(-11, -30, 22, 5, 2.5); ctx.fill();
      ctx.fillStyle = '#ffd23a';
      ctx.fillRect(-4, -30, 3, 5); ctx.fillRect(4, -30, 3, 5);

      // face
      ctx.fillStyle = '#ffd9b8';
      ctx.beginPath(); ctx.arc(0, -36.5, 9.5, 0, Math.PI * 2); ctx.fill();
      const look = fr * 2, up = air ? (P.vy < 0 ? -1 : 1) : 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-3.4 + look, -37 + up * 0.5, 2.6, falling ? 3.4 : 3, 0, 0, Math.PI * 2); ctx.ellipse(3.4 + look, -37 + up * 0.5, 2.6, falling ? 3.4 : 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10182a';
      ctx.beginPath(); ctx.arc(-3 + look * 1.3, -37 + up, 1.5, 0, Math.PI * 2); ctx.arc(3.8 + look * 1.3, -37 + up, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,140,0.45)';
      ctx.beginPath(); ctx.arc(-6 + look * 0.5, -33.5, 2, 0, Math.PI * 2); ctx.arc(6 + look * 0.5, -33.5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7a3b3b'; ctx.fillStyle = '#7a3b3b'; ctx.lineWidth = 1.3;
      if (falling) { ctx.beginPath(); ctx.ellipse(look * 0.6, -32.2, 1.8, 2.2, 0, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(look * 0.6, -33.6, 2.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }

      // bobble hat, the bobble lagging behind the jump
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath(); ctx.arc(0, -41.5, 9.8, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(-10.5, -43, 21, 4.5, 2); ctx.fill();
      ctx.strokeStyle = 'rgba(160,20,40,0.35)'; ctx.lineWidth = 1;
      for (let x = -6; x <= 6; x += 4) { ctx.beginPath(); ctx.moveTo(x, -44); ctx.lineTo(x * 0.7, -50); ctx.stroke(); }
      const bx = -fr * 2 - P.vx * 0.3, by = -52 + (air ? Math.max(-3, Math.min(1.5, P.vy * 0.35)) : 0);
      ctx.fillStyle = '#ffd23a';
      ctx.beginPath(); ctx.arc(bx, by, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawGhost(cam, g = game.ghost, lead = false) {
      if (!g || !game.running) return;
      const fr = lead === 'friend';
      const n = g.pts.length / 2;
      const f = game.runTime / 100;
      const i = Math.min(n - 1, Math.floor(f)), j = Math.min(n - 1, i + 1), k = Math.min(1, f - i);
      const gx = (g.pts[i * 2] + (g.pts[j * 2] - g.pts[i * 2]) * k) / 1000 * W;
      const gy = g.pts[i * 2 + 1] + (g.pts[j * 2 + 1] - g.pts[i * 2 + 1]) * k + game.groundY - cam;
      const done = f >= n - 1;
      const a = done ? Math.max(0, 1 - (f - n + 1) / 15) : 1;
      if (a <= 0) return;
      if (gy < -60) {
        // Ghost is above the screen: a little marker at the top edge
        ctx.save();
        ctx.globalAlpha = 0.8 * a;
        ctx.fillStyle = fr ? '#ff9ad5' : lead ? '#ffd76a' : '#bfefff';
        ctx.beginPath();
        ctx.moveTo(gx, 58); ctx.lineTo(gx - 7, 70); ctx.lineTo(gx + 7, 70);
        ctx.fill();
        ctx.font = '700 9px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(fr ? g.name.toUpperCase().slice(0, 12) : lead ? '#1 TODAY' : 'GHOST', gx, 82);
        ctx.restore();
        return;
      }
      if (gy > H + 60) return;
      const t = performance.now() / 300;
      ctx.save();
      ctx.globalAlpha = 0.5 * a;
      ctx.translate(gx, gy);
      ctx.scale(1.35, 1.35);
      ctx.fillStyle = fr ? '#ff9ad5' : lead ? '#ffd76a' : '#bfefff';
      ctx.shadowColor = fr ? '#ff5fb8' : lead ? '#ffb82e' : '#9fe3ff';
      ctx.shadowBlur = 14;
      // body: a round top with a wavy hem
      ctx.beginPath();
      ctx.arc(0, -22, 13, Math.PI, 0);
      ctx.lineTo(13, -4);
      for (let w = 0; w < 4; w++) {
        const x = 13 - (w + 1) * 6.5;
        ctx.quadraticCurveTo(x + 3.25, -4 + ((w + Math.floor(t)) % 2 ? 5 : -1), x, -4);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      if (fr) {
        // a bow for the friend who sent the link
        ctx.fillStyle = '#ffe3f3';
        ctx.beginPath();
        ctx.moveTo(0, -36); ctx.lineTo(-10, -42 + Math.sin(t) * 1.5); ctx.lineTo(-10, -30); ctx.closePath();
        ctx.moveTo(0, -36); ctx.lineTo(10, -42 - Math.sin(t) * 1.5); ctx.lineTo(10, -30); ctx.closePath();
        ctx.fill();
        ctx.beginPath(); ctx.arc(0, -36, 3, 0, Math.PI * 2); ctx.fill();
      } else if (lead) {
        // a crown for today's leader
        ctx.fillStyle = '#fff3c4';
        ctx.beginPath();
        ctx.moveTo(-10, -32); ctx.lineTo(-10, -42); ctx.lineTo(-5, -37); ctx.lineTo(0, -44 + Math.sin(t) * 1.5); ctx.lineTo(5, -37); ctx.lineTo(10, -42); ctx.lineTo(10, -32);
        ctx.closePath();
        ctx.fill();
      } else {
        // the bobble hat, because it's still you
        ctx.fillStyle = '#ff9aa8';
        ctx.beginPath(); ctx.arc(0, -32, 10, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-11, -33, 22, 4);
        ctx.fillStyle = '#ffe9a8';
        ctx.beginPath(); ctx.arc(0, -44 + Math.sin(t) * 1.5, 3.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#0a1929';
      ctx.fillRect(-6, -24, 3, 4);
      ctx.fillRect(3, -24, 3, 4);
      ctx.globalAlpha = 0.75 * a;
      ctx.font = '700 9px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = fr ? '#ffe3f3' : lead ? '#fff3c4' : '#e8fbff';
      ctx.fillText((fr ? g.name.slice(0, 12) + ' · ' : lead ? '#1 · ' : 'BEST ') + g.floor, 0, -52);
      ctx.restore();
    }

    // Draw
    function draw() {
      // The sky of the zone you're in, fading over from the one below
      const zNow = zoneAt(game.zoneIdx), zWas = zoneAt(game.zonePrev), zk = game.zoneFade;
      const paintSky = (z, zi) => {
        ctx.fillStyle = z.sky;
        ctx.fillRect(0, 0, W, H);
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, z.tint[0]);
        bgGrad.addColorStop(0.5, z.tint[1]);
        bgGrad.addColorStop(1, z.tint[2]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        paintBack(zi);
      };
      if (zk < 1) paintSky(zWas, game.zonePrev);
      ctx.globalAlpha = zk;
      paintSky(zNow, game.zoneIdx);
      ctx.globalAlpha = 1;

      // Snow, embers, sparks or stardust, depending on the zone
      ctx.fillStyle = 'rgba(' + mixRgb(zWas.flake, zNow.flake, zk) + ', 0.6)';
      for (const s of game.snowflakes) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      const cam = game.cameraY;

      // Tower walls: drawn after the platforms, so the platforms tuck into them
      const wallRgb = zk < 1 ? mixRgb(zWas.wall.split(',').map(Number), zNow.wall.split(',').map(Number), zk) : zNow.wall;

      // Christmas platforms with snow
      for (const plat of game.platforms) {
        const py = plat.y - cam;
        if (py < -30 || py > H + 30) continue;

        const glowAmount = 6 + plat.glow * 15;

        // Each platform is built from its own zone's material, so the next zone shows up above you
        const pz = zoneOfFloor(plat.n);
        const isRed = Math.floor(plat.hue) % 2 === 0;
        const pc = pz.plat[isRed ? 0 : 1];
        ctx.shadowColor = plat.type === 'special' ? '#ffd700' : pc[2];
        ctx.shadowBlur = glowAmount;

        // Platform body - wood/brick style
        const grad = ctx.createLinearGradient(plat.x, py, plat.x, py + plat.h);
        if (plat.type === 'special') {
          grad.addColorStop(0, '#ffd700');
          grad.addColorStop(1, '#b8860b');
        } else if (plat.type === 'ground') {
          grad.addColorStop(0, '#8b4513');
          grad.addColorStop(1, '#654321');
        } else {
          grad.addColorStop(0, pc[0]);
          grad.addColorStop(1, pc[1]);
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(plat.x, py, plat.w, plat.h, 3);
        ctx.fill();

        ctx.shadowBlur = 0;
        drawTopping(plat.type === 'ground' ? ZONES[0] : pz, plat, py, pc);

        // Every tenth floor carries its number
        if (plat.n > 0 && plat.n % 10 === 0) {
          ctx.font = '900 10px Orbitron, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 3;
          ctx.fillText(String(plat.n), plat.x + plat.w / 2, py + plat.h / 2 + 1);
          ctx.shadowBlur = 0;
        }
      }

      drawWalls(cam, wallRgb);

      // Power-ups: ice orbs with a drawn icon (no emoji, so every device shows the same art)
      for (const pu of game.powerups) {
        const py = pu.y - cam;
        if (py < -30 || py > H + 30) continue;
        pu.bob += 0.06;
        pu.pulse += 0.1;
        drawPowerOrb(pu.type, pu.x, py + Math.sin(pu.bob) * 5, 1 + Math.sin(pu.pulse) * 0.08, pu.pulse);
      }

      // Particles - festive red/green/white
      for (const p of game.particles) {
        const alpha = p.life / p.maxLife;
        if (p.glow) {
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y - cam, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      drawGhost(cam, game.ghost3, 'friend');
      drawGhost(cam, game.ghost2, true);
      drawGhost(cam);

      // Player trail in the scarf's colours
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        ctx.globalAlpha = t.alpha * 0.5;
        ctx.shadowColor = i % 2 === 0 ? '#ff4d5e' : '#ffd23a';
        ctx.shadowBlur = 15;
        ctx.fillStyle = i % 2 === 0 ? '#ff4d5e' : '#ffd23a';
        ctx.beginPath();
        ctx.arc(t.x, t.y - cam, t.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Player: a climber in a puffy parka, a bobble hat and a long striped scarf
      drawClimber(player.x + player.width / 2, player.y + player.height - cam);

      // HURRY UP! when the tower speeds up
      if (game.hurryT > 0) {
        const k = Math.min(1, game.hurryT / 400, (1800 - game.hurryT) / 150);
        ctx.save();
        ctx.globalAlpha = Math.max(0, k);
        ctx.font = '900 ' + Math.round(Math.min(44, W * 0.1)) + 'px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 18;
        ctx.fillText('HURRY UP!', W / 2, H * 0.2 + Math.sin(game.hurryT / 60) * 3);
        ctx.restore();
      }

      if (game.praise) {
        const pr = game.praise, age = 1700 - pr.t;
        const k = Math.max(0, Math.min(1, pr.t / 350, age / 120));
        const pop = 1 + Math.max(0, 1 - age / 220) * 0.5;
        ctx.save();
        ctx.globalAlpha = k;
        ctx.translate(W / 2, H * 0.34 - age * 0.02);
        ctx.scale(pop, pop);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(Math.min(40, W * 0.09)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#e8fbff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 16;
        ctx.fillText(pr.text, 0, 0);
        ctx.font = '700 ' + Math.round(Math.min(14, W * 0.034)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#9fe3ff';
        ctx.shadowBlur = 6;
        ctx.fillText(pr.sub, 0, Math.min(34, W * 0.075));
        ctx.restore();
      }

      if (game.zoneBanner) {
        const zb = game.zoneBanner, age = 2600 - zb.t;
        const k = Math.max(0, Math.min(1, zb.t / 500, age / 200));
        const z = zoneAt(game.zoneIdx);
        ctx.save();
        ctx.globalAlpha = k;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const y0 = H * 0.27;
        ctx.font = '700 ' + Math.round(Math.min(15, W * 0.036)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = 'rgb(' + z.flake.join(',') + ')';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 6;
        ctx.fillText(zb.title, W / 2, y0 - Math.min(30, W * 0.07));
        const grow = Math.min(1, age / 400);
        ctx.font = '900 ' + Math.round(Math.min(46, W * 0.1) * (0.85 + 0.15 * grow)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgb(' + z.wall + ')';
        ctx.shadowBlur = 22;
        ctx.fillText(zb.name, W / 2, y0 + 6);
        ctx.restore();
      }

      // Frozen in time: say so, and how to get going again
      if (game.running && game.paused) {
        ctx.save();
        ctx.fillStyle = 'rgba(3, 7, 18, 0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(Math.min(48, W * 0.11)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#e8fbff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 18;
        ctx.fillText('PAUSED', W / 2, H * 0.42);
        ctx.font = '700 ' + Math.round(Math.min(13, W * 0.032)) + 'px Orbitron, sans-serif';
        ctx.fillStyle = '#9fe3ff';
        ctx.shadowBlur = 0;
        ctx.fillText('TAP OR PRESS P TO RESUME', W / 2, H * 0.42 + Math.min(44, W * 0.1));
        ctx.restore();
      }

      // HUD
      document.getElementById('floor').textContent = game.floor;
      document.getElementById('best').textContent = game.best;
      document.getElementById('combo').textContent = 'x' + game.combo;
    }

    // Loop
    function gameLoop(ts) {
      const dt = Math.min(32, ts - game.lastTime || 16);
      game.lastTime = ts;
      if (game.running && !game.paused) update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // UI
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    document.getElementById('playBtn').onclick = () => startGame('classic');
    document.getElementById('dailyBtn').onclick = () => startGame('daily');
    document.getElementById('modeSwapBtn').onclick = () => {
      gameOverOverlay.classList.remove('show');
      startGame(game.mode === 'daily' ? 'classic' : 'daily');
    };
    function refreshDailySub() {
      const d = loadDaily();
      const top = dailyTop ? "Today's top: floor " + dailyTop.score + ' by ' + (dailyTop.display_name || 'Anon').slice(0, 20) : '';
      document.getElementById('dailySub').textContent = [
        friendGhost ? '👻 Race ' + friendGhost.name + ': floor ' + friendGhost.floor : '',
        d ? 'Your ghost: floor ' + d.floor : 'Same tower for everyone today',
        top || (d ? 'same tower for everyone today' : 'race your ghost'),
        leaderGhost && leaderGhost.user_id !== myUserId ? '👑 a gold ghost to race' : '',
      ].filter(Boolean).join(' · ');
    }
    refreshDailySub();
    document.getElementById('playAgainBtn').onclick = () => { gameOverOverlay.classList.remove('show'); startGame(); };
    document.getElementById('pauseBtn').onclick = togglePause;
    canvas.addEventListener('click', () => { if (game.running && game.paused) togglePause(); });

    const muteBtn = document.getElementById('muteBtn');
    muteBtn.onclick = () => { game.muted = !game.muted; muteBtn.textContent = game.muted ? 'Sound Off' : 'Sound On'; };

    document.getElementById('shareBtn').onclick = async () => {
      const base = 'https://app.sloppy.live/icy-tower/';
      const race = game.mode === 'daily' && game.rec.length >= 20 && game.runDay === todayKey();
      const nm = (document.getElementById('playerName').value || '').trim().slice(0, 16) || 'A friend';
      const url = race ? base + '#race=' + game.runDay + '~' + game.lastFloor + '~' + encodeURIComponent(nm) + '~' + vlqEnc(game.rec) : base;
      const text = race ? `I reached floor ${game.lastFloor} on today's Daily Icy Tower. Race my ghost:` : `I reached floor ${game.lastFloor} in Icy Tower!`;
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        try { await navigator.share({ title: 'Icy Tower', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      try { await navigator.clipboard.writeText(text + ' ' + url); showToast(race ? 'Race link copied: whoever opens it races your ghost today' : 'Link copied'); }
      catch (e) { showToast("Couldn't copy the link"); }
    };

    function startGame(mode) {
      if (game.running) return;
      if (mode === 'daily' || mode === 'classic') game.mode = mode;
      startOverlay.classList.remove('show');
      gameOverOverlay.classList.remove('show');
      resetWorld();
      game.running = true;
      game.paused = false;
    }

    function togglePause() {
      if (!game.running) return;
      game.paused = !game.paused;
      const pb = document.getElementById('pauseBtn');
      pb.textContent = game.paused ? 'Resume' : 'Pause';
      if (!game.paused) input.jumpPressed = false; // no surprise jump from keys mashed while paused
    }

    function endGame() {
      game.running = false;
      restartAfter = performance.now() + 800; // a jump mashed while falling must not skip this screen
      game.lastFloor = game.floor;
      game.lastCombo = game.bestCombo;
      game.lastSecs = Math.max(1, Math.round(game.runTime / 1000));
      game.best = Math.max(game.best, game.floor);
      localStorage.setItem('icy-best', game.best);
      document.getElementById('finalFloor').textContent = game.floor;
      let dailyNote = '';
      document.getElementById('modeSwapText').textContent = game.mode === 'daily' ? 'Classic tower' : '❄ Daily Tower';
      document.querySelector('label[for="playerName"]').textContent = game.mode === 'daily' ? "Save to today's tower" : 'Enter your name';
      if (game.mode === 'daily') {
        const prev = loadDaily();
        if (!prev || game.floor > prev.floor) {
          try { localStorage.setItem('icy-daily', JSON.stringify({ day: todayKey(), floor: game.floor, pts: game.rec })); } catch {}
          dailyNote = prev ? '<br><b>New daily best</b> · you beat your ghost by ' + (game.floor - prev.floor) : '<br>Your ghost will race you next time';
        } else {
          dailyNote = '<br>Your ghost still leads at floor ' + prev.floor;
        }
        if (game.ghost3) {
          const gap = game.floor - game.ghost3.floor, who = escHtml(game.ghost3.name), fl = n => n + (n === 1 ? ' floor' : ' floors');
          dailyNote += '<span class="race-result">' + (gap > 0 ? '👻 You beat ' + who + ' by <b>' + fl(gap) + '</b>! Send them your ghost back'
            : gap === 0 ? '👻 A dead heat with ' + who + ' at floor ' + game.floor + '. One more try?'
            : '👻 ' + who + ' wins by <b>' + fl(-gap) + '</b> (floor ' + game.ghost3.floor + ')' + (gap === -1 ? '. So close!' : '')) + '</span>';
        }
        if (game.ghost2 && game.floor > game.ghost2.floor) dailyNote += '<br><b>You passed today\'s gold ghost!</b> Save your run and yours becomes the one everyone races';
        refreshDailySub();
      }
      // Where you froze, and how far the next world is
      const zi = Math.floor(game.floor / ZONE_H), nextAt = (zi + 1) * ZONE_H;
      document.getElementById('finalZone').innerHTML = 'Zone ' + (zi + 1) + ' · <b>' + zoneAt(zi).name + '</b><br>' +
        zoneAt(zi + 1).name + ' in ' + (nextAt - game.floor) + ' floors' + dailyNote;
      gameOverOverlay.classList.add('show');
      document.getElementById('shareBtn').textContent = game.mode === 'daily' && game.rec.length >= 20 ? 'Send your ghost' : 'Share';
      document.getElementById('saveBlock').style.display = 'block';
      if (game.floor >= game.best && game.floor > 0) unlock('newPB');
    }

    function updateUI() {
      document.getElementById('floor').textContent = game.floor;
      document.getElementById('best').textContent = game.best;
      document.getElementById('combo').textContent = 'x' + game.combo;
    }

    // Power chips
    const chipsEl = document.getElementById('powerChips');
    function renderPowerChips() {
      const chips = [];
      if (game.effects.double > 0) chips.push({ type: 'double', label: 'DOUBLE JUMP', time: Math.ceil(game.effects.double / 1000) });
      if (game.effects.slow > 0) chips.push({ type: 'slow', label: 'TIME WARP', time: Math.ceil(game.effects.slow / 1000) });
      if (game.effects.boost > 0) chips.push({ type: 'boost', label: 'HYPER BOOST', time: Math.ceil(game.effects.boost / 1000) });
      chipsEl.innerHTML = chips.map(c => `<div class="power-chip ${c.type}">${c.label} · ${c.time}s</div>`).join('');
    }

    // Toast
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    // Achievements
    const ACHIEVEMENTS = [
      { key: 'floor20', name: 'First Steps', check: () => game.floor >= 20 },
      { key: 'floor50', name: 'Climber', check: () => game.floor >= 50 },
      { key: 'floor100', name: 'Ice Master', check: () => game.floor >= 100 },
      { key: 'combo7', name: 'Combo x7', check: () => game.combo >= 7 },
      { key: 'combo10', name: 'Combo x10', check: () => game.combo >= 10 },
      { key: 'firstPower', name: 'Powered', check: () => false },
      { key: 'savedScore', name: 'Ranked', check: () => false },
      { key: 'newPB', name: 'New Record', check: () => false },
      { key: 'zone2', name: 'Timber!', check: () => false },
      { key: 'zone6', name: 'Starlight', check: () => false },
    ];
    let unlocked = {};
    try { unlocked = JSON.parse(localStorage.getItem('icy-achievements') || '{}'); } catch {}
    function saveAch() { localStorage.setItem('icy-achievements', JSON.stringify(unlocked)); }
    function unlock(key) {
      if (unlocked[key]) return;
      unlocked[key] = true;
      saveAch();
      const a = ACHIEVEMENTS.find(x => x.key === key);
      if (a) showToast('🏆 ' + a.name);
    }
    function checkAchievements() { for (const a of ACHIEVEMENTS) if (!unlocked[a.key] && a.check()) unlock(a.key); }

    // Leaderboard
    let currentUser = null;
    const leaderboardEl = document.getElementById('leaderboard');

    async function initAuth() {
      try { const { user } = await supabaseSession(); currentUser = user; myUserId = user && user.id; } catch (e) {}
      loadLeaderboard();
    }

    // Season 2 and Today's Tower share one panel. Both keep one row per player and only climbs a
    // human could make (a real climb tops out around 3.5 floors a second).
    let lbMode = 'season';
    async function fetchBoard(mode) {
      let q = supabase.from(mode === 'daily' ? 'icy_tower_daily' : 'icy_tower_season_two').select('score, display_name, best_combo, secs, user_id');
      if (mode === 'daily') q = q.eq('day', todayKey());
      const { data: rows, error } = await q.order('score', { ascending: false }).limit(100);
      if (error) throw error;
      const seen = new Set();
      return (rows || []).filter(r => {
        const ok = r.score > 0 && r.score <= 5000 && r.secs > 0 && r.score <= r.secs * 5 + 10;
        const who = r.user_id || r.display_name;
        if (!ok || seen.has(who)) return false;
        seen.add(who);
        return true;
      });
    }
    function setLbMode(mode) {
      lbMode = mode;
      document.querySelectorAll('.lb-tab').forEach(b => {
        const on = b.dataset.lb === mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on);
      });
      loadLeaderboard();
    }
    document.querySelectorAll('.lb-tab').forEach(b => b.onclick = () => setLbMode(b.dataset.lb));

    async function loadLeaderboard() {
      try {
        const mode = lbMode;
        const all = await fetchBoard(mode);
        if (mode !== lbMode) return;
        const data = all.slice(0, 8);
        if (mode === 'daily') showDailyTop(all);
        const header = '<div class="lb-row header"><span>#</span><span>Player</span><span>Floor</span></div>';
        if (!data || data.length === 0) {
          leaderboardEl.innerHTML = header + '<div class="lb-row"><span></span><span style="opacity:0.4">' + (mode === 'daily' ? "Nobody has climbed today's tower yet. Be the first!" : 'Season 2 just started. Be the first!') + '</span><span></span></div>';
          return;
        }
        leaderboardEl.innerHTML = header + data.map((r, i) => {
          const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          return `<div class="lb-row"><span class="lb-rank ${rankClass}">${i + 1}</span><span>${escapeHtml(r.display_name || 'Anon')}</span><span class="lb-score">${r.score}</span></div>`;
        }).join('');
      } catch (e) {}
    }

    document.getElementById('refreshBtn').onclick = loadLeaderboard;

    // Today's leader on the Daily Tower button, so phones (no sidebar) see it too
    function showDailyTop(rows) {
      dailyTop = rows && rows.length ? rows[0] : null;
      refreshDailySub();
    }
    // Today's #1 run, shared as a path of deltas "dx,dy,dx,dy,..." sampled every 100 ms
    const ghostEnc = pts => {
      const out = [];
      for (let i = 0, px = 0, py = 0; i < pts.length; i += 2) { out.push(pts[i] - px, pts[i + 1] - py); px = pts[i]; py = pts[i + 1]; }
      return out.join(',');
    };
    function ghostDec(str) {
      if (typeof str !== 'string' || str.length > 60000) return null;
      const d = str.split(',').map(Number);
      if (d.length < 20 || d.length > 9000 || d.length % 2 || d.some(v => !Number.isInteger(v))) return null;
      const pts = [];
      for (let i = 0, x = 0, y = 0; i < d.length; i += 2) {
        x += d[i]; y += d[i + 1];
        if (x < -50 || x > 1050) return null;
        pts.push(x, y);
      }
      return pts;
    }
    // race links: a whole Daily run packed into the URL (#race=day~floor~name~path), the deltas as zigzag VLQ in base64url
    const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    function vlqEnc(pts) {
      let s = '';
      for (let i = 0, px = 0, py = 0; i < pts.length; i += 2) {
        for (const d of [pts[i] - px, pts[i + 1] - py]) {
          let z = d < 0 ? -d * 2 - 1 : d * 2;
          do { let c = z & 31; z = Math.floor(z / 32); if (z) c |= 32; s += B64[c]; } while (z);
        }
        px = pts[i]; py = pts[i + 1];
      }
      return s;
    }
    function vlqDec(s) {
      const out = [];
      let z = 0, mul = 1;
      for (const ch of s) {
        const c = B64.indexOf(ch);
        if (c < 0) return null;
        z += (c & 31) * mul;
        if (c & 32) { mul *= 32; if (mul > 2 ** 25) return null; }
        else { out.push(z % 2 ? -(z + 1) / 2 : z / 2); z = 0; mul = 1; }
      }
      return mul === 1 ? out : null;
    }
    const escHtml = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    function readRace() {
      const m = /^#race=(\d{4}-\d{2}-\d{2})~(\d{1,4})~([^~]{0,160})~([A-Za-z0-9_-]{20,40000})$/.exec(location.hash);
      if (!m) return;
      let name = 'A friend';
      try { name = decodeURIComponent(m[3]).replace(/[^\p{L}\p{N} _.'-]/gu, '').trim().slice(0, 16) || name; } catch (e) {}
      const d = vlqDec(m[4]), pts = d && ghostDec(d.join(',')), floor = +m[2];
      const note = document.getElementById('raceNote');
      if (!pts || floor > pts.length / 20 * 5 + 10) note.textContent = "That race link got cut off somewhere, so there's no ghost in it. Today's tower is still waiting!";
      else if (m[1] !== todayKey()) note.textContent = name + "'s race was on " + m[1] + ". Every day has a new Daily Tower, so their ghost can't climb this one. Set a floor and send yours back!";
      else {
        friendGhost = { day: m[1], floor, pts, name };
        note.innerHTML = '👻 <b>' + escHtml(name) + '</b> reached floor <b>' + floor + "</b> on today's Daily Tower. Their ghost climbs next to you.";
        document.getElementById('dailyBtn').classList.add('race');
      }
      note.hidden = false;
      refreshDailySub();
    }
    async function loadLeaderGhost() {
      try {
        const { data, error } = await supabase.from('icy_tower_ghosts').select('day, floor, pts, user_id').eq('day', todayKey()).order('floor', { ascending: false }).limit(5);
        if (error) throw error;
        for (const r of data || []) {
          const pts = ghostDec(r.pts);
          // the same "a human could climb this" rule as the boards: about 5 floors a second at most
          if (pts && r.floor > 0 && r.floor <= 5000 && r.floor <= pts.length / 20 * 5 + 10) {
            leaderGhost = { day: r.day, floor: r.floor, pts, user_id: r.user_id };
            refreshDailySub();
            return;
          }
        }
      } catch (e) {}
    }
    async function loadDailyTop() {
      try { showDailyTop(await fetchBoard('daily')); } catch (e) {}
    }

    const saveScoreBtn = document.getElementById('saveScoreBtn');
    const skipSaveBtn = document.getElementById('skipSaveBtn');
    const saveError = document.getElementById('saveError');
    const playerNameInput = document.getElementById('playerName');
    const saveBlock = document.getElementById('saveBlock');

    skipSaveBtn.onclick = () => saveBlock.style.display = 'none';
    saveScoreBtn.onclick = async () => {
      saveError.style.display = 'none';
      try {
        const name = (playerNameInput.value || 'Player').slice(0, 20);
        const row = { score: game.lastFloor, display_name: name, best_combo: game.lastCombo, secs: game.lastSecs, user_id: currentUser?.id };
        const daily = game.mode === 'daily';
        if (daily) row.day = game.runDay;
        const { error } = await supabase.from(daily ? 'icy_tower_daily' : 'icy_tower_season_two').insert([row]);
        if (error) throw error;
        saveBlock.style.display = 'none';
        unlock('savedScore');
        // a run that beats today's gold ghost becomes the new one
        if (daily && game.rec.length >= 20 && game.lastFloor > (leaderGhost && leaderGhost.day === game.runDay ? leaderGhost.floor : 0)) {
          try {
            const { error: gErr } = await supabase.from('icy_tower_ghosts').insert([{ day: game.runDay, floor: game.lastFloor, pts: ghostEnc(game.rec), user_id: currentUser?.id }]);
            if (!gErr) {
              leaderGhost = { day: game.runDay, floor: game.lastFloor, pts: game.rec.slice(), user_id: currentUser?.id };
              document.getElementById('finalZone').insertAdjacentHTML('beforeend', '<br><b>Your run is today\'s gold ghost</b> · everyone on the Daily Tower races it now');
            }
          } catch (e) {}
        }
        if (daily) {
          // Where you landed on today's board, right on the game-over card
          try {
            const rows = await fetchBoard('daily');
            showDailyTop(rows);
            const rank = rows.filter(r => r.score > game.lastFloor).length + 1;
            document.getElementById('finalZone').insertAdjacentHTML('beforeend', '<br><b>#' + rank + '</b> on today\'s tower of ' + Math.max(rank, rows.length));
          } catch (e) {}
          if (lbMode !== 'daily') { setLbMode('daily'); return; }
        }
        loadLeaderboard();
      } catch (e) {
        saveError.textContent = 'Error: ' + e.message;
        saveError.style.display = 'block';
      }
    };

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    resetWorld();
    draw();
    initAuth();
    loadDailyTop();
    readRace();
    loadLeaderGhost();
  </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
