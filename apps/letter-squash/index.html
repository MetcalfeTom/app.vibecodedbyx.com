<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Squash</title>
<meta name="description" content="Paste words, one per line: each one gets squashed to its different letters and counted. TERRIERS → TERIS, 5.">
<link rel="icon" href="https://emojicdn.elk.sh/🗜️">
<meta property="og:title" content="Letter Squash">
<meta property="og:description" content="Paste words, each one squashed to its different letters and counted. TERRIERS → TERIS, 5.">
<meta property="og:url" content="https://sloppy.live/letter-squash/">
<meta property="og:image" content="https://sloppy.live/letter-squash/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe0;--line:#d5e0cf;--ink:#1d2b22;--green:#1f6b45;--red:#b8372b;--soft:#56645a;--card:#fbf9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'IBM Plex Mono',ui-monospace,monospace;
  background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{font:400 clamp(44px,9vw,84px)/.9 'DM Serif Display',Georgia,serif;margin:0 0 6px;letter-spacing:-1px;animation:up .5s both}
h1 em{color:var(--green)}
.sub{color:var(--soft);font-weight:300;margin:0 0 22px;animation:up .5s .08s both}
.sub b{font-weight:700;color:var(--ink)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}textarea{height:180px}}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);padding:14px;animation:up .5s .16s both;min-width:0}
.h{display:block;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
textarea{width:100%;height:340px;resize:vertical;border:1px solid #bdb8a4;border-radius:3px;background:#fff;color:var(--ink);font:14px/1.6 'IBM Plex Mono',monospace;padding:10px}
textarea:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border-bottom:2px solid var(--ink);padding-bottom:4px}
.stat b{display:block;font:400 clamp(30px,6vw,44px)/1 'DM Serif Display',serif}
.stat span{font-size:11px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.stat.g b{color:var(--green)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
button{font:500 13px 'IBM Plex Mono',monospace;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:6px 10px;cursor:pointer}
button.main{background:var(--ink);color:var(--paper)}
button:active{transform:translate(1px,1px)}
.tbl{max-height:420px;overflow:auto;border-top:1px dashed #bdb8a4}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:500;padding:6px 4px;border-bottom:1.5px solid var(--ink)}
td{padding:3px 4px;border-bottom:1px dashed #e0dccb;word-break:break-all;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
td.n{font:400 20px/1.1 'DM Serif Display',serif;color:var(--green)}
td.sq{font-weight:700;letter-spacing:.08em}
td.w s{color:var(--red);text-decoration-thickness:2px}
td.empty{color:var(--soft);font-style:italic;padding:10px 4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:3px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Letter <em>Squash</em></h1>
  <p class="sub">one word per line · repeated letters get squashed out · <b>terriers → teris, 5</b></p>
  <div class="grid">
    <section class="card" aria-label="Your words">
      <label class="h" for="in">your words</label>
      <textarea id="in" spellcheck="false" autocomplete="off" placeholder="terriers&#10;eerie&#10;relations"></textarea>
      <div class="opts">
        <label><input type="checkbox" id="oCase" checked> A and a are the same letter</label>
        <label><input type="checkbox" id="oAz" checked> count letters only</label>
      </div>
    </section>
    <section class="card" aria-label="Squashed words">
      <div class="stats" aria-live="polite">
        <div class="stat"><b id="sW">0</b><span>words</span></div>
        <div class="stat g"><b id="sL">0</b><span>letters left</span></div>
        <div class="stat"><b id="sX">0</b><span>squashed out</span></div>
      </div>
      <div class="bar">
        <button class="main" id="cN">copy the counts</button>
        <button id="cS">copy squashed words</button>
        <button id="cT">copy both</button>
      </div>
      <div class="tbl"><table><thead><tr><th>word</th><th>left</th><th class="n">count</th></tr></thead><tbody id="out"></tbody></table></div>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var IN=$('in'),T=0,rows=[];
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},1800);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var LET=/[\p{L}\p{N}]/u;
/* keep the first of each letter, in order; the struck-through copies show what went */
function squash(w){var seen={},keep='',html='',ci=$('oCase').checked,az=$('oAz').checked;
  for(var ch of w){var k=ci?ch.toLowerCase():ch;
    if(az&&!LET.test(ch)){html+=esc(ch);continue;}
    if(seen[k]){html+='<s>'+esc(ch)+'</s>';continue;}
    seen[k]=1;keep+=ci?k:ch;html+=esc(ch);}
  return {keep:keep,n:[...keep].length,html:html,len:[...w].filter(function(c){return !az||LET.test(c);}).length};}
function run(){
  rows=IN.value.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(w){var s=squash(w);s.w=w;return s;});
  var L=0,X=0;rows.forEach(function(r){L+=r.n;X+=r.len-r.n;});
  $('sW').textContent=rows.length.toLocaleString();$('sL').textContent=L.toLocaleString();$('sX').textContent=X.toLocaleString();
  var max=3000;
  $('out').innerHTML=rows.length?rows.slice(0,max).map(function(r){return '<tr><td class="w">'+r.html+'</td><td class="sq">'+esc(r.keep)+'</td><td class="n">'+r.n+'</td></tr>';}).join('')+(rows.length>max?'<tr><td colspan="3" class="empty">…and '+(rows.length-max).toLocaleString()+' more lines (the copy buttons get them all)</td></tr>':''):'<tr><td colspan="3" class="empty">paste some words on the left</td></tr>';
  store('ls_text',IN.value.length<400000?IN.value:'');}
function later(){clearTimeout(T);T=setTimeout(run,IN.value.length>200000?300:60);}
IN.addEventListener('input',later);
['oCase','oAz'].forEach(function(id){$(id).addEventListener('change',run);});
function copy(t,what){if(!rows.length){toast('paste some words first');return;}
  var ok=function(){toast('copied '+rows.length.toLocaleString()+' '+what);},bad=function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){toast('copy failed: select the table by hand');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,bad);else bad();}
$('cN').onclick=function(){copy(rows.map(function(r){return r.n;}).join('\n'),'counts, one per line');};
$('cS').onclick=function(){copy(rows.map(function(r){return r.keep;}).join('\n'),'squashed words');};
$('cT').onclick=function(){copy(rows.map(function(r){return r.w+'\t'+r.keep+'\t'+r.n;}).join('\n'),'lines, tab separated for a spreadsheet');};
var saved=store('ls_text');if(saved)IN.value=saved;
if(new URLSearchParams(location.search).get('demo'))IN.value='terriers\neerie\nrelations\nannotates\nsilentlies\nMississippi\nbookkeeper\nore';
run();
})();
</script>
</body>
</html>
