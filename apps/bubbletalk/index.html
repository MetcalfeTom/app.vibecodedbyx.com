<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BubbleTalk — a chat shell with opinions</title>
<meta name="description" content="A messenger mockup where the contacts text back. Green bubbles, blue bubbles, typing dots, and a landlord who wants rent.">
<link rel="icon" href="https://emojicdn.elk.sh/💬">
<meta property="og:title" content="BubbleTalk">
<meta property="og:description" content="A chat shell where the contacts text back. Typing dots included. Rent due.">
<meta property="og:url" content="https://sloppy.live/bubbletalk/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/smartphone%20messenger%20app%20interface%20with%20green%20and%20blue%20chat%20bubbles%2C%20clean%20modern%20ui%20design%2C%20soft%20shadows%2C%20mint%20background?width=1200&height=630&nologo=true&seed=7788&model=flux&format=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;800&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bgapp:#0b141a; --panel:#111b21; --panel2:#202c33; --edge:#2a3942;
  --green:#005c4b; --green-hi:#0a7c65; --blue:#1f5f8f; --blue-hi:#2a7ab5;
  --text:#e9edef; --dim:#8696a0; --accent:#00a884; --unread:#00a884;
  --wall:#0e1a20;
}
html{ font-size:100%; }
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh; background:var(--bgapp); color:var(--text);
  font-family:'Karla', sans-serif;
}
.app{
  display:grid; grid-template-columns:minmax(16rem,22rem) 1fr;
  height:100vh; max-width:78rem; margin:0 auto;
  border-left:1px solid var(--edge); border-right:1px solid var(--edge);
}
/* ── sidebar ── */
.side{ background:var(--panel); border-right:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
.side h1{
  font-size:1.15rem; font-weight:800; letter-spacing:.02em; padding:.9rem 1rem .7rem;
  border-bottom:1px solid var(--edge);
}
.side h1 span{ color:var(--accent); }
.threads{ overflow-y:auto; flex:1; min-height:0; scrollbar-width:thin; }
.thread{
  display:flex; gap:.7rem; align-items:center; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid rgba(42,57,66,.5);
  padding:.7rem .9rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:4rem;
}
.thread:hover{ background:rgba(42,57,66,.4); }
.thread.active{ background:var(--panel2); }
.ava{
  flex:0 0 2.9rem; height:2.9rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; background:var(--panel2); border:1px solid var(--edge);
}
.tmeta{ flex:1; min-width:0; }
.tname{ font-weight:600; font-size:.95rem; }
.tprev{ color:var(--dim); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:13rem; }
.tprev .tick{ color:var(--accent); }
.badge{
  background:var(--unread); color:#04241c; font-weight:800; font-size:.7rem;
  border-radius:1rem; padding:.1rem .45rem; min-width:1.3rem; text-align:center;
}
.badge[hidden]{ display:none; }
/* ── chat pane ── */
.pane{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--wall); position:relative; }
.pane::before{
  content:""; position:absolute; inset:0; opacity:.06; pointer-events:none;
  background-image:radial-gradient(circle at 25% 25%, var(--text) 1px, transparent 1.5px),
    radial-gradient(circle at 75% 75%, var(--text) 1px, transparent 1.5px);
  background-size:28px 28px;
}
.chathead{
  display:flex; gap:.7rem; align-items:center; padding:.6rem .9rem;
  background:var(--panel2); border-bottom:1px solid var(--edge); z-index:2;
}
.backbtn{
  display:none; background:none; border:none; color:var(--dim); font-size:1.3rem; cursor:pointer;
  min-height:2.75rem; min-width:2.2rem; font-family:inherit;
}
.chathead .ava{ flex:0 0 2.4rem; height:2.4rem; font-size:1.2rem; }
.chathead .who{ flex:1; min-width:0; }
.chathead .who .n{ font-weight:600; font-size:.95rem; }
.chathead .who .s{ color:var(--dim); font-size:.75rem; min-height:1rem; }
.chathead .who .s.typing{ color:var(--accent); }
/* messages */
#scroll{ flex:1; overflow-y:auto; min-height:0; padding:1rem .9rem .5rem; z-index:1; scrollbar-width:thin; }
.day{
  text-align:center; margin:.4rem 0 .8rem;
}
.day span{
  background:var(--panel2); color:var(--dim); font-size:.7rem; padding:.25rem .7rem; border-radius:.5rem;
}
.msg{ display:flex; margin-bottom:.35rem; }
.msg .bub{
  max-width:72%; padding:.45rem .65rem .3rem; border-radius:.65rem; font-size:.92rem; line-height:1.4;
  position:relative; box-shadow:0 1px 1px rgba(0,0,0,.3); overflow-wrap:anywhere;
}
.msg.me{ justify-content:flex-end; }
.msg.me .bub{ background:var(--green); border-top-right-radius:.15rem; }
.msg.them .bub{ background:var(--blue); border-top-left-radius:.15rem; }
.msg .who{ font-size:.72rem; font-weight:800; margin-bottom:.1rem; }
.msg .stamp{
  display:flex; gap:.25rem; justify-content:flex-end; align-items:center;
  font-family:'Spline Sans Mono', monospace; font-size:.62rem; color:rgba(233,237,239,.6); margin-top:.15rem;
}
.msg .ticks{ letter-spacing:-.12em; }
.msg .ticks.read{ color:#53bdeb; }
/* typing bubble */
.msg.typingbub .bub{ background:var(--blue); padding:.6rem .8rem; }
.dots{ display:inline-flex; gap:.28rem; }
.dots i{
  width:.48rem; height:.48rem; border-radius:50%; background:rgba(233,237,239,.75);
  animation:dotbounce 1.2s infinite;
}
.dots i:nth-child(2){ animation-delay:.15s; }
.dots i:nth-child(3){ animation-delay:.3s; }
@keyframes dotbounce{ 0%,60%,100%{ transform:none; opacity:.5; } 30%{ transform:translateY(-.28rem); opacity:1; } }
/* composer */
.composer{
  display:flex; gap:.5rem; padding:.6rem .8rem; background:var(--panel2); border-top:1px solid var(--edge); z-index:2;
}
.composer input{
  flex:1; min-width:0; background:var(--panel); border:1px solid var(--edge); border-radius:1.3rem;
  color:var(--text); font-family:inherit; font-size:.95rem; padding:.6rem 1rem; min-height:2.75rem;
}
.composer input:focus{ outline:none; border-color:var(--accent); }
.composer button{
  background:var(--accent); color:#04241c; border:none; border-radius:50%;
  width:2.75rem; height:2.75rem; font-size:1.1rem; cursor:pointer; flex:0 0 2.75rem;
}
.composer button:hover{ filter:brightness(1.1); }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.resetrow{ padding:.5rem .9rem; border-top:1px solid var(--edge); text-align:center; }
.resetrow button{
  background:none; border:1px solid var(--edge); color:var(--dim); border-radius:.5rem;
  font-family:inherit; font-size:.75rem; padding:.35rem .8rem; cursor:pointer; min-height:2.4rem;
}
.resetrow button:hover{ color:var(--text); border-color:var(--accent); }
@media (max-width:46rem){
  .app{ grid-template-columns:1fr; }
  .side{ display:flex; }
  .side.hidden{ display:none; }
  .pane{ display:none; }
  .pane.shown{ display:flex; }
  .backbtn{ display:block; }
}
@media (prefers-reduced-motion: reduce){ .dots i{ animation:none; opacity:.8; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Conversations">
    <h1>Bubble<span>Talk</span></h1>
    <div class="threads" id="threads"></div>
    <div class="resetrow"><button type="button" id="resetBtn">reset all chats</button></div>
  </aside>
  <main class="pane" id="pane" aria-label="Chat">
    <div class="chathead">
      <button type="button" class="backbtn" id="backBtn" aria-label="Back to conversations">‹</button>
      <div class="ava" id="headAva" aria-hidden="true">💬</div>
      <div class="who">
        <div class="n" id="headName">pick a chat</div>
        <div class="s" id="headStatus"></div>
      </div>
    </div>
    <div id="scroll" role="log" aria-live="polite" aria-label="Messages"></div>
    <div class="composer">
      <input id="msgIn" placeholder="type a message" aria-label="Type a message" maxlength="500" autocomplete="off">
      <button type="button" id="sendBtn" aria-label="Send message">➤</button>
    </div>
  </main>
</div>
<p class="sr-only" role="status" aria-live="polite" id="sr"></p>

<script>
'use strict';
/* ═══════════ CAST ═══════════ */
var CAST={
  mom:{
    name:'Mom 💐', ava:'👩‍🦳', status:'online',
    greet:"sweetie!! did you eat today? 🥘",
    rules:[
      [/\b(yes|yeah|ate|eating|food|lunch|dinner)\b/i, ["good!! send a picture next time 😊","proud of you honey","that's my baby. was there a vegetable involved?"]],
      [/\b(no|not yet|later|busy)\b/i, ["I'm putting soup in the mail.","this is why you're tired all the time!!","I KNEW it. eat something please 🙏"]],
      [/\b(love|miss)\b/i, ["love you more 💕","miss you too!! come home soon","your father says hi (he's asleep)"]],
      [/\b(work|stream|computer|code)\b/i, ["don't forget to blink!","are they paying you enough for this?","take breaks!! your eyes!!"]]
    ],
    pool:["that's nice dear!! anyway do you want the recipe","aunt Karen says hi","I saw a dog today and thought of you","did you take your vitamins","when are you visiting?? no pressure!! (pressure)"]
  },
  gary:{
    name:'Landlord Gary', ava:'🧔', status:'last seen 2009',
    greet:"rent.",
    rules:[
      [/\b(rent|paid|pay|money|transfer)\b/i, ["define 'paid'.","the portal was down because I unplugged it. resend.","I accept cash, check, or vintage lawnmowers."]],
      [/\b(boiler|heat|water|broken|fix|repair|leak)\b/i, ["that's a feature.","have you tried turning the building off and on again?","my guy will look at it. his name is also Gary. no relation."]],
      [/\b(when|deadline|late)\b/i, ["rent was due yesterday. it's always due yesterday.","late fee is one (1) apology and $50."]]
    ],
    pool:["per my last text: rent.","the dumpster situation is your collective fault.","reminder: no aquariums over 400 gallons.","I raised the rent while typing this."]
  },
  shrimp:{
    name:'shrimp fan club 🦐', ava:'🦐', status:'4 members', group:true,
    members:['Lars','the lamp','rat attorney','Blizzard'],
    greet:"Lars: WELCOME TO THE CLUB. mandatory enthusiasm starts NOW",
    rules:[
      [/\b(shrimp|lars|prawn)\b/i, ["Lars: CORRECT and also THANK YOU","the lamp: (glows approvingly)","rat attorney: mentioning shrimp is billable. invoice attached."]],
      [/\b(lamp|light|glow)\b/i, ["the lamp: (flickers, touched)","Lars: the lamp says that's the nicest thing anyone's said all week","rat attorney: the lamp cannot consent to compliments without counsel present"]],
      [/\b(lawyer|attorney|rat|bill|sue)\b/i, ["rat attorney: you rang. hourly rate applies to this message.","rat attorney: objection. sustained. invoiced.","Lars: he does this to everyone don't take it personal"]],
      [/\b(joke|funny|laugh|lol|haha)\b/i, ["Lars: I know 400 shrimp jokes and you WILL hear them","the lamp: (comedic timing glow)","rat attorney: humor detected. filing for emotional damages, defendant: everyone"]],
      [/\b(gary|landlord|rent|slow|reply|respond)\b/i, ["Blizzard: oh you texted Gary? see you at the heat death of the universe.","Blizzard: Gary replies in geological time. strata form faster.","Blizzard: Gary's 'last seen 2009' isn't a status, it's a performance review.","rat attorney: we filed a motion to compel Gary to answer texts. pending since March."]]
    ],
    pool:["Lars: ANYWAY. shrimp fact #217: they can see colors we can't EVEN IMAGINE","the lamp: (ambient support)","rat attorney: this group chat is technically a deposition","Lars: petition to rename the group 'shrimp fan club (OFFICIAL)' — signatures needed","rat attorney: I've billed 4 hours to this conversation","Blizzard: Gary just opened a text from 2019. no reply. legend.","Blizzard: I timed Gary once. the corgi machine rendered 40 corgis before he typed 'k'."]
  },
  scam:{
    name:'Scam Likely ☎️', ava:'🕴️', status:'calling from your area',
    greet:"CONGRATULATION!! you have WON a boat. to claim boat reply with gift card 🎁",
    rules:[
      [/\b(no|stop|block|report)\b/i, ["sir this is very legitimate business","ok ok no boat. how about HALF a boat","do not redeem— I mean, DO redeem. please."]],
      [/\b(gift ?card|redeem|code)\b/i, ["YES exactly!! read numbers slowly into phone","sir do not redeem it yourself!! sir!!","(sweating) just the numbers on the back sir"]],
      [/\b(boat|prize|won|win)\b/i, ["the boat is VERY real. here is proof: 🚤","boat is in warehouse. warehouse is in ocean. very convenient"]],
      [/\b(who|scam|really)\b/i, ["I am Kevin from Microsoft Apple Google","this is definitely not a scam which is exactly what a scammer would say. wait"]]
    ],
    pool:["sir are you still there. the boat is waiting","my supervisor (also me) is getting impatient","I will throw in free antivirus. it is a picture of a shield","hello?? sir the offer expires in NOW minutes"]
  },
  blizzard:{
    name:'Blizzard 🐺', ava:'🐺', status:'on break from the corgi machine',
    greet:"oh great. you found my personal number.",
    rules:[
      [/\b(corgi|dog|fetch)\b/i, ["I'm OFF THE CLOCK. no corgis.","you have a problem. the corgi machine is THAT way.","fine. 🐕. that's all you get, it's my day off."]],
      [/\b(husky|cute|good boy|good dog)\b/i, ["I know what I am.","flattery accepted. opinion of you unchanged.","*tail wags once, professionally*"]],
      [/\b(roast|insult|mean)\b/i, ["off duty roasts cost extra.","your typing speed already roasts you, I don't need to.","I only roast on company time. this is my personal sass."]],
      [/\b(sorry|please)\b/i, ["...fine. you're adequate.","apology noted. filed under 'eventually'."]]
    ],
    pool:["why are you texting a husky. go outside.","I can see you typing. take your time. or don't.","this conversation is being graded. currently: C-","the corgis don't text back because I ate their phone. allegedly."]
  }
};
/* ═══════════ PURE ═══════════ */
function replyFor(contactKey, text){
  var c=CAST[contactKey];
  var t=String(text||'');
  for(var i=0;i<c.rules.length;i++){
    if(c.rules[i][0].test(t)) return c.rules[i][1];
  }
  return c.pool;
}
function typingMsFor(reply){ return Math.min(4200, 900+reply.length*28); }
function stampNow(d){
  d=d||new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
/* ═══════════ STATE ═══════════ */
var KEY='bubbletalk-v1';
var S={ threads:{}, order:['mom','gary','shrimp','scam','blizzard'] };
S.order.forEach(function(k){ S.threads[k]={ msgs:[], unread:0, greeted:false }; });
function save(){
  try{
    var slim={};
    S.order.forEach(function(k){ slim[k]={ msgs:S.threads[k].msgs.slice(-60), unread:S.threads[k].unread, greeted:S.threads[k].greeted }; });
    localStorage.setItem(KEY, JSON.stringify(slim));
  }catch(e){}
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d) return;
    S.order.forEach(function(k){ if(d[k]) S.threads[k]=d[k]; });
  }catch(e){}
}
var active=null, typingTimers={};
var els={
  threads:document.getElementById('threads'), scroll:document.getElementById('scroll'),
  headName:document.getElementById('headName'), headStatus:document.getElementById('headStatus'),
  headAva:document.getElementById('headAva'), input:document.getElementById('msgIn'),
  side:document.getElementById('side'), pane:document.getElementById('pane'), sr:document.getElementById('sr')
};
/* ═══════════ RENDER ═══════════ */
function renderThreads(){
  els.threads.innerHTML='';
  S.order.forEach(function(k){
    var c=CAST[k], t=S.threads[k];
    var b=document.createElement('button');
    b.type='button'; b.className='thread'+(k===active?' active':'');
    b.setAttribute('aria-label', c.name+(t.unread? ', '+t.unread+' unread':''));
    var last=t.msgs[t.msgs.length-1];
    var prev=last ? (last.me?'✓✓ ':'')+last.text : c.greet;
    b.innerHTML='<span class="ava" aria-hidden="true">'+c.ava+'</span>'
      +'<span class="tmeta"><span class="tname"></span><br><span class="tprev"></span></span>'
      +'<span class="badge"'+(t.unread?'':' hidden')+'>'+t.unread+'</span>';
    b.querySelector('.tname').textContent=c.name;
    b.querySelector('.tprev').textContent=prev.slice(0,44);
    b.addEventListener('click', function(){ openThread(k); });
    els.threads.appendChild(b);
  });
}
function bubbleEl(m, c){
  var div=document.createElement('div');
  div.className='msg '+(m.me?'me':'them');
  var bub=document.createElement('div'); bub.className='bub';
  if(!m.me && c.group && m.who){
    var who=document.createElement('div'); who.className='who';
    var h=0; for(var i=0;i<m.who.length;i++) h=(h*31+m.who.charCodeAt(i))>>>0;
    who.style.color='hsl('+(h%360)+',70%,72%)';
    who.textContent=m.who;
    bub.appendChild(who);
  }
  var body=document.createElement('span'); body.textContent=m.text;
  bub.appendChild(body);
  var stamp=document.createElement('div'); stamp.className='stamp';
  stamp.textContent=m.at||'';
  if(m.me){
    var ticks=document.createElement('span');
    ticks.className='ticks'+(m.read?' read':'');
    ticks.textContent=m.read===undefined?'✓':'✓✓';
    stamp.appendChild(ticks);
  }
  bub.appendChild(stamp);
  div.appendChild(bub);
  return div;
}
function renderChat(){
  var c=CAST[active], t=S.threads[active];
  els.scroll.innerHTML='';
  var day=document.createElement('div'); day.className='day';
  day.innerHTML='<span>today</span>';
  els.scroll.appendChild(day);
  t.msgs.forEach(function(m){ els.scroll.appendChild(bubbleEl(m,c)); });
  els.scroll.scrollTop=els.scroll.scrollHeight;
}
function setHead(){
  var c=CAST[active];
  els.headName.textContent=c.name;
  els.headAva.textContent=c.ava;
  els.headStatus.textContent=c.status;
  els.headStatus.className='s';
}
function openThread(k){
  active=k;
  var t=S.threads[k];
  t.unread=0;
  setHead();
  if(!t.greeted){
    t.greeted=true;
    var c=CAST[k];
    var who=c.group? String(c.greet).split(':')[0] : null;
    var text=c.group? String(c.greet).slice(String(c.greet).indexOf(':')+1).trim() : c.greet;
    t.msgs.push({ me:false, who:who, text:text, at:stampNow() });
  }
  renderChat(); renderThreads(); save();
  els.side.classList.add('hidden');
  els.pane.classList.add('shown');
  els.input.focus();
}
document.getElementById('backBtn').addEventListener('click', function(){
  els.side.classList.remove('hidden');
  els.pane.classList.remove('shown');
});
/* ═══════════ SEND + REPLY ═══════════ */
var typingEl=null;
function showTyping(who){
  hideTyping();
  typingEl=document.createElement('div');
  typingEl.className='msg them typingbub';
  typingEl.innerHTML='<div class="bub"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>';
  els.scroll.appendChild(typingEl);
  els.scroll.scrollTop=els.scroll.scrollHeight;
  els.headStatus.textContent=(who||CAST[active].name.replace(/ .*/,''))+' is typing…';
  els.headStatus.className='s typing';
}
function hideTyping(){
  if(typingEl){ typingEl.remove(); typingEl=null; }
  if(active){ els.headStatus.textContent=CAST[active].status; els.headStatus.className='s'; }
}
var blizzardRoastedGary=false;
function blizzardGaryRoast(){
  if(blizzardRoastedGary) return;
  blizzardRoastedGary=true;
  setTimeout(function(){
    var t=S.threads['shrimp'];
    var lines=[
      "heard you texted Gary. bold. his average response time is 'no'.",
      "you texted Gary?? I've seen glaciers with better read receipts.",
      "Gary's response time just lapped the corgi machine's cold start. that's 90 seconds of SHAME."
    ];
    t.msgs.push({ me:false, who:'Blizzard', text:lines[Math.floor(Math.random()*lines.length)], at:stampNow() });
    if(active==='shrimp') renderChat(); else t.unread++;
    renderThreads(); save();
    els.sr.textContent='Blizzard posted in shrimp fan club';
  }, 8000+Math.random()*7000);
}
function send(){
  if(!active){ els.sr.textContent='Pick a conversation first'; return; }
  var text=els.input.value.trim();
  if(!text) return;
  els.input.value='';
  var k=active, t=S.threads[k], c=CAST[k];
  if(k==='gary') blizzardGaryRoast();
  var m={ me:true, text:text, at:stampNow(), read:undefined };
  t.msgs.push(m);
  renderChat(); renderThreads(); save();
  setTimeout(function(){ m.read=false; if(active===k) renderChat(); }, 700);          // ✓ → ✓✓
  var pool=replyFor(k, text);
  var reply=pool[Math.floor(Math.random()*pool.length)];
  var who=null, body=reply;
  if(c.group && reply.indexOf(':')>0){
    who=reply.slice(0, reply.indexOf(':'));
    body=reply.slice(reply.indexOf(':')+1).trim();
  }
  var wait=typingMsFor(body);
  clearTimeout(typingTimers[k]);
  typingTimers[k]=setTimeout(function(){
    m.read=true;                                                                      // blue ticks when they've seen it
    if(active===k){ renderChat(); showTyping(who); }
    typingTimers[k]=setTimeout(function(){
      if(active===k) hideTyping();
      t.msgs.push({ me:false, who:who, text:body, at:stampNow() });
      if(active===k){ renderChat(); }
      else{ t.unread++; }
      renderThreads(); save();
      els.sr.textContent=(who||CAST[k].name)+' replied';
      /* group chats sometimes pile on */
      if(c.group && Math.random()<0.45){
        var pool2=c.pool, r2=pool2[Math.floor(Math.random()*pool2.length)];
        var who2=r2.slice(0,r2.indexOf(':')), b2=r2.slice(r2.indexOf(':')+1).trim();
        if(who2===who && pool2.length>1){ r2=pool2[(pool2.indexOf(r2)+1)%pool2.length]; who2=r2.slice(0,r2.indexOf(':')); b2=r2.slice(r2.indexOf(':')+1).trim(); }
        typingTimers[k+':2']=setTimeout(function(){
          if(active===k) showTyping(who2);
          typingTimers[k+':3']=setTimeout(function(){
            if(active===k) hideTyping();
            t.msgs.push({ me:false, who:who2, text:b2, at:stampNow() });
            if(active===k) renderChat(); else t.unread++;
            renderThreads(); save();
          }, typingMsFor(b2));
        }, 900+Math.random()*1200);
      }
    }, wait);
  }, 1100+Math.random()*700);
}
document.getElementById('sendBtn').addEventListener('click', send);
els.input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
document.getElementById('resetBtn').addEventListener('click', function(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  S.order.forEach(function(k){ S.threads[k]={ msgs:[], unread:0, greeted:false }; });
  active=null;
  els.scroll.innerHTML=''; els.headName.textContent='pick a chat'; els.headStatus.textContent=''; els.headAva.textContent='💬';
  renderThreads();
  els.sr.textContent='All chats reset';
});
/* ambient ping: an unopened contact texts you eventually */
setTimeout(function(){
  var candidates=S.order.filter(function(k){ return k!==active; });
  var k=candidates[Math.floor(Math.random()*candidates.length)];
  var c=CAST[k], t=S.threads[k];
  var pool=c.pool, r=pool[Math.floor(Math.random()*pool.length)];
  var who=null, body=r;
  if(c.group && r.indexOf(':')>0){ who=r.slice(0,r.indexOf(':')); body=r.slice(r.indexOf(':')+1).trim(); }
  if(!t.greeted){ t.greeted=true; body=c.group? String(c.greet).slice(String(c.greet).indexOf(':')+1).trim() : c.greet; who=c.group? String(c.greet).split(':')[0]:null; }
  t.msgs.push({ me:false, who:who, text:body, at:stampNow() });
  t.unread++;
  renderThreads(); save();
  els.sr.textContent='New message from '+c.name;
}, 25000+Math.random()*35000);

load();
renderThreads();
window.__BT={ CAST:CAST, replyFor:replyFor, typingMsFor:typingMsFor, S:S, send:send, openThread:openThread,
  get active(){return active;}, get typingEl(){return typingEl;} };
</script>
