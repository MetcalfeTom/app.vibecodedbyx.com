<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack 6 7</title>
<meta name="description" content="Hit the target number with blocks of 6 and 7, in as few blocks as you can. Some numbers can't be made: call them out.">
<link rel="icon" href="https://emojicdn.elk.sh/🤷">
<meta property="og:title" content="Stack 6 7">
<meta property="og:description" content="Hit the target with blocks of 6 and 7. Some numbers can't be made: call them out.">
<meta property="og:url" content="https://app.sloppy.live/stack-67/">
<meta property="og:image" content="https://app.sloppy.live/stack-67/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://app.sloppy.live/stack-67/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b1e;--ink2:#132a2e;--line:#244247;--paper:#e9f3ef;--mute:#7fa19c;
  --six:#ff7a1a;--sixD:#b84c00;--sev:#b6f23a;--sevD:#5f8a00;--bad:#ff4f6d;--skin:#f4cfa4;--skinD:#c9946a;
  --disp:'Bungee',Impact,'Arial Black',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:
  radial-gradient(circle at 15% 110%,rgba(255,122,26,.18),transparent 45%),
  radial-gradient(circle at 90% -10%,rgba(182,242,58,.14),transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 27px,rgba(255,255,255,.025) 27px 28px),
  var(--ink);color:var(--paper);font:500 14px/1.45 var(--mono);display:flex;justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;animation:in .5s both}
h1{margin:0;font:400 clamp(30px,9vw,40px)/1 var(--disp);letter-spacing:.02em}
h1 .s6{color:var(--six)}h1 .s7{color:var(--sev)}
.meta{font-size:11px;color:var(--mute);text-align:right;line-height:1.5}
.meta b{color:var(--paper);font-weight:800}
.target{display:flex;align-items:center;justify-content:space-between;background:var(--ink2);border:2px solid var(--line);border-radius:18px;padding:12px 16px;animation:in .5s .08s both}
.target .lab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.target .n{font:400 clamp(52px,16vw,72px)/1 var(--disp);color:var(--paper)}
.target .sum{text-align:right}
.target .sum b{display:block;font:400 30px/1 var(--disp)}
.target .sum b.over{color:var(--bad)}
.target .sum b.hit{color:var(--sev)}
.tower{position:relative;height:clamp(260px,46vh,400px);border-radius:18px;border:2px dashed var(--line);display:flex;flex-direction:column-reverse;align-items:center;padding:8px 6px;overflow:hidden}
.tower .goal{position:absolute;left:0;right:0;border-top:3px dotted rgba(233,243,239,.55);pointer-events:none;transition:bottom .3s}
.tower .goal span{position:absolute;right:8px;top:-20px;font-size:10px;color:var(--mute);letter-spacing:.1em}
.tower .empty{margin:auto;color:var(--mute);font-size:12px;text-align:center;max-width:16rem}
.blk{flex:none;width:min(88%,230px);border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:400 20px/1 var(--disp);color:var(--ink);cursor:pointer;animation:drop .32s cubic-bezier(.3,1.5,.5,1) both;position:relative}
.blk small{font:800 10px/1 var(--mono);opacity:.65}
.blk.b6{background:var(--six);box-shadow:inset 0 -5px 0 var(--sixD);width:min(78%,205px)}
.blk.b7{background:var(--sev);box-shadow:inset 0 -5px 0 var(--sevD)}
.blk:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.tower.shake{animation:shake .35s}
.stage{display:grid;grid-template-columns:minmax(72px,92px) 1fr minmax(72px,92px);align-items:center;gap:4px;animation:in .5s .16s both}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hand{background:none;border:0;padding:10px 0;display:flex;justify-content:center;touch-action:manipulation}
.hand .hw{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;transform-origin:20% 70%}
.hand.h7 .hw{transform-origin:80% 70%}
.hand svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.hand.h7 svg{transform:scaleX(-1)}
.hand .cube{font:400 26px/1 var(--disp);color:var(--ink);width:52px;height:40px;border-radius:9px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:-14px;position:relative;z-index:1}
.hand.h6 .cube{background:var(--six);box-shadow:inset 0 -5px 0 var(--sixD);margin-left:14px}
.hand.h7 .cube{background:var(--sev);box-shadow:inset 0 -5px 0 var(--sevD);margin-right:14px;width:58px}
.hand .lab{font-size:10px;color:var(--mute);letter-spacing:.12em;margin-top:2px}
.hand:disabled{cursor:default}
.hand:disabled .hw{opacity:.3}
.hand.bob .hw{animation:bob .55s cubic-bezier(.3,1.4,.5,1)}
.hand.jug .hw{animation:jug .3s 5 alternate ease-in-out}
.hand.h7.jug .hw{animation-delay:.15s}
.hand.h6.shrug .hw{animation:shrugL 1s ease-in-out}
.hand.h7.shrug .hw{animation:shrugR 1s ease-in-out}
.row{display:flex;gap:8px}
.ghost{flex:1;min-height:46px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:13px}
.ghost:hover{border-color:var(--paper)}
.ghost.nope{border-color:var(--bad);color:#ffd0d8}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.msg{min-height:2.9em;text-align:center;font-size:13px;color:var(--paper)}
.msg b{color:var(--sev)}.msg .bad{color:var(--bad);font-weight:800}
.tip{font-size:11px;color:var(--mute);text-align:center}
.next{display:none}
.done .next{display:block}
.done .nope,.done #undo{display:none}
.hands{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:9;opacity:0}
.hands.on{animation:flash 1.3s both}
.hands .big{font:400 clamp(54px,18vw,96px)/1 var(--disp);text-shadow:0 6px 0 rgba(0,0,0,.45)}
.hands .big .s6{color:var(--six)}.hands .big .s7{color:var(--sev)}
.end{background:var(--ink2);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.end h2{margin:0 0 6px;font:400 30px/1.1 var(--disp)}
.end p{margin:4px 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes flash{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes bob{0%{transform:none}35%{transform:translateY(18px) rotate(4deg)}70%{transform:translateY(-6px)}100%{transform:none}}
@keyframes jug{from{transform:translateY(-20px)}to{transform:translateY(20px)}}
@keyframes shrugL{30%,70%{transform:translateY(-22px) rotate(-16deg)}}
@keyframes shrugR{30%,70%{transform:translateY(-22px) rotate(16deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hands.on{opacity:1}}
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>STACK <span class="s6">6</span> <span class="s7">7</span></h1>
    <div class="meta" aria-live="polite"><span id="rnd">round <b>1</b>/10</span><br><span id="sc">perfect <b>0</b> · best <b>–</b></span></div>
  </header>
  <section class="target" aria-label="Target">
    <div><div class="lab">target</div><div class="n" id="tgt">–</div></div>
    <div class="sum"><div class="lab">stacked</div><b id="sum">0</b><span class="lab" id="cnt">0 blocks</span></div>
  </section>
  <div class="stage">
    <button class="hand h6" id="add6" aria-label="Add a 6 block"><span class="hw"><span class="cube">6</span><svg viewBox="0 0 100 56" aria-hidden="true"><rect x="1" y="21" width="20" height="30" rx="5" fill="#2c5a60" stroke="#0d1b1e" stroke-width="3"/><path d="M17 29Q18 22 28 22L80 22Q90 22 94 15Q99 11 99 19Q98 30 88 36Q80 42 68 43L28 46Q17 46 17 38Z" fill="var(--skin)" stroke="#0d1b1e" stroke-width="3" stroke-linejoin="round"/><path d="M29 23Q27 9 39 8Q48 8 48 15Q48 21 44 23" fill="var(--skin)" stroke="#0d1b1e" stroke-width="3" stroke-linejoin="round"/><path d="M31 35Q48 39 64 34M70 27L84 26M72 32L88 30M70 37L82 37" stroke="var(--skinD)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><span class="lab">SIX</span></span></button>
    <section class="tower" id="tower" aria-label="Your tower, tap a block to take it off"><div class="goal" id="goal"><span>target</span></div></section>
    <button class="hand h7" id="add7" aria-label="Add a 7 block"><span class="hw"><span class="cube">7</span><svg viewBox="0 0 100 56" aria-hidden="true"><rect x="1" y="21" width="20" height="30" rx="5" fill="#2c5a60" stroke="#0d1b1e" stroke-width="3"/><path d="M17 29Q18 22 28 22L80 22Q90 22 94 15Q99 11 99 19Q98 30 88 36Q80 42 68 43L28 46Q17 46 17 38Z" fill="var(--skin)" stroke="#0d1b1e" stroke-width="3" stroke-linejoin="round"/><path d="M29 23Q27 9 39 8Q48 8 48 15Q48 21 44 23" fill="var(--skin)" stroke="#0d1b1e" stroke-width="3" stroke-linejoin="round"/><path d="M31 35Q48 39 64 34M70 27L84 26M72 32L88 30M70 37L82 37" stroke="var(--skinD)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><span class="lab">SEVEN</span></span></button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="row">
    <button class="ghost" id="undo">↶ take one off</button>
    <button class="ghost nope" id="nope" title="Some numbers can't be made from 6s and 7s">can't be done 🤷</button>
    <button class="ghost next" id="next">next ▸</button>
  </div>
  <p class="tip" id="tip">Fewest blocks wins the round. Keys: 6, 7, backspace, enter.</p>
</main>
<div class="hands" id="hands" aria-hidden="true"><div class="big"><span class="s6">SIX</span> <span class="s7">SEVEN</span></div></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var ROUNDS=10;
/* fewest blocks of 6 and 7 that make n, or null when no mix can (the biggest such n is 6*7-6-7 = 29) */
function best(n){var b=null;for(var s=0;7*s<=n;s++){var r=n-7*s;if(r%6===0){var t=s+r/6;if(!b||t<b.t)b={six:r/6,sev:s,t:t};}}return b;}
var IMPOSSIBLE=[];for(var i=1;i<=29;i++)if(!best(i))IMPOSSIBLE.push(i);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
var G,T,stack,locked,hb=0;
function pickTarget(r){
  /* a few impossible ones in every game, and the numbers climb as the rounds go on */
  if(r>0&&Math.random()<.28){var big=IMPOSSIBLE.filter(function(x){return x>=8;});return big[Math.floor(Math.random()*big.length)];}
  var lo=12+r*6,hi=30+r*9,n;do{n=lo+Math.floor(Math.random()*(hi-lo+1));}while(n===G.last||(r<2&&!best(n)));return n;}
function newGame(){G={r:0,perfect:0,points:0,last:0,log:[]};startRound();}
function startRound(){T=pickTarget(G.r);G.last=T;stack=[];locked=false;$('app').classList.remove('done');
  $('tgt').textContent=T;$('msg').innerHTML=G.r===0?'Stack 6s and 7s to hit <b>'+T+'</b> exactly. Or, if no mix can make it, call it.':'';draw();}
function sum(){return stack.reduce(function(a,b){return a+b;},0);}
function draw(){var s=sum(),tw=$('tower'),bl=tw.querySelectorAll('.blk,.empty');[].forEach.call(bl,function(x){x.remove();});
  if(!stack.length){var e=document.createElement('p');e.className='empty';e.textContent='Your tower goes here. Tap a block to take it off.';tw.appendChild(e);}
  var H=tw.clientHeight-16,unit=Math.max(1.2,Math.min(9,H/Math.max(T,s,1)));
  stack.forEach(function(v,i){var b=document.createElement('button');b.className='blk b'+v;b.style.height=Math.max(20,v*unit-2)+'px';b.style.marginTop='2px';
    var run=stack.slice(0,i+1).reduce(function(a,c){return a+c;},0);b.innerHTML=v+'<small>'+run+'</small>';b.setAttribute('aria-label',v+' block, total '+run+' so far. Take it off');b.dataset.i=i;
    if(i<stack.length-1){b.tabIndex=-1;b.style.animation='none';}tw.appendChild(b);});
  $('goal').style.bottom=(8+T*unit)+'px';$('goal').hidden=T*unit>H+4;
  var sb=$('sum');sb.textContent=s;sb.className=s>T?'over':s===T?'hit':'';$('cnt').textContent=stack.length+' block'+(stack.length===1?'':'s');
  $('add6').disabled=locked||s+6>T;$('add7').disabled=locked||s+7>T;$('undo').disabled=locked||!stack.length;
  $('rnd').innerHTML='round <b>'+Math.min(G.r+(locked?0:1),ROUNDS)+'</b>/'+ROUNDS;var bs=store('stack67_best');$('sc').innerHTML='points <b>'+G.points+'</b> · best <b>'+(bs==null?'–':bs)+'</b>';}
function add(v){if(locked)return;if(sum()+v>T){$('tower').classList.remove('shake');void $('tower').offsetWidth;$('tower').classList.add('shake');$('msg').innerHTML='<span class="bad">too tall</span> · that '+v+' would go past '+T+'.';return;}
  var prev=stack[stack.length-1];stack.push(v);draw();if(prev===6&&v===7)meme();else poke(v===6?'add6':'add7','bob');
  if(sum()===T)finish(false);else $('msg').textContent='';}
function poke(id,c){var h=$(id);h.classList.remove('bob','jug','shrug');void h.offsetWidth;h.classList.add(c);}
function meme(){poke('add6','jug');poke('add7','jug');var h=$('hands');if(Date.now()-hb<4000)return;hb=Date.now();h.classList.remove('on');void h.offsetWidth;h.classList.add('on');}
function finish(called){locked=true;var b=best(T),pts=0,txt;if(called){poke('add6','shrug');poke('add7','shrug');}
  if(called){if(!b){pts=3;txt='<b>Right, '+T+' can\'t be made.</b> No mix of 6s and 7s lands on it. +3';}
    else txt='<span class="bad">It can be made:</span> '+recipe(b)+' = '+T+'. No points.';}
  else{var n=stack.length;if(n===b.t){pts=3;G.perfect++;txt='<b>Perfect, '+n+' block'+(n>1?'s':'')+'.</b> Nobody does it in fewer. +3';}
    else{pts=1;txt='Made it in '+n+'. The fewest is '+b.t+': '+recipe(b)+'. +1';}}
  G.points+=pts;G.log.push(pts===3?'🟩':pts===1?'🟨':'🟥');$('msg').innerHTML=txt;G.r++;
  $('next').textContent=G.r>=ROUNDS?'see score ▸':'next ▸';$('app').classList.add('done');draw();$('next').focus({preventScroll:true});}
function recipe(b){var p=[];if(b.sev)p.push(b.sev+' × 7');if(b.six)p.push(b.six+' × 6');return p.join(' + ');}
function endGame(){var bs=store('stack67_best');if(bs==null||G.points>bs){bs=G.points;store('stack67_best',bs);}
  var m=$('msg');m.innerHTML='';var tw=$('tower');[].forEach.call(tw.querySelectorAll('.blk,.empty'),function(x){x.remove();});
  var e=document.createElement('div');e.className='end empty';e.innerHTML='<h2>'+G.points+' / '+ROUNDS*3+'</h2><p>'+G.log.join('')+'</p><p>'+G.perfect+' perfect stack'+(G.perfect===1?'':'s')+' · best '+bs+'</p><p style="margin-top:10px;font-size:11px">Every number past 29 can be made. Below that, '+IMPOSSIBLE.filter(function(x){return x>5;}).length+' can\'t.</p>';
  tw.appendChild(e);$('goal').hidden=true;$('next').textContent='play again ▸';G.over=true;$('sc').innerHTML='points <b>'+G.points+'</b> · best <b>'+bs+'</b>';}
$('add6').onclick=function(){add(6);};$('add7').onclick=function(){add(7);};
$('undo').onclick=function(){if(locked||!stack.length)return;stack.pop();draw();$('msg').textContent='';};
$('nope').onclick=function(){if(!locked)finish(true);};
$('next').onclick=function(){if(G.over){newGame();return;}if(G.r>=ROUNDS)endGame();else startRound();};
$('tower').addEventListener('click',function(e){var b=e.target.closest('.blk');if(!b||locked)return;stack.splice(+b.dataset.i,1);draw();$('msg').textContent='';});
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='6'){e.preventDefault();add(6);}else if(e.key==='7')add(7);else if(e.key==='Backspace'&&!locked){e.preventDefault();$('undo').click();}
  else if(e.key==='Enter'&&locked&&document.activeElement!==$('next')){e.preventDefault();$('next').click();}});
addEventListener('resize',function(){if(!G.over)draw();});
window.__S67={best:best,IMPOSSIBLE:IMPOSSIBLE,get T(){return T;},set T(v){T=v;},add:add,get stack(){return stack;},finish:finish,get G(){return G;},draw:draw};
newGame();
})();
</script>
</body>
</html>
