<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Haunted Toaster</title>

<style>
  :root{
    --night:#171021;
    --night-2:#211631;
    --plum:#2c1d40;
    --cream:#f4e8d4;
    --cream-dim:#cdbfa8;
    --teal:#79c7bb;
    --teal-deep:#3d7e74;
    --amber:#ffb454;
    --ember:#ff7a3c;
    --toast:#e0a960;
    --toast-dark:#b97f3e;
    --burnt:#5a4130;
    --line:#0c0714;
    --focus:#ffd98a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:100%}
  body{
    min-height:100svh;
    color:var(--cream);
    font-family:'IBM Plex Mono',monospace;
    background:
      radial-gradient(60rem 34rem at 50% -12rem, rgba(121,199,187,.10), transparent 60%),
      radial-gradient(38rem 26rem at 82% 108%, rgba(255,122,60,.08), transparent 65%),
      radial-gradient(30rem 22rem at 8% 96%, rgba(140,90,220,.09), transparent 60%),
      linear-gradient(180deg,var(--night) 0%,var(--night-2) 58%,var(--plum) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  /* faint midnight tiles at the bottom of the kitchen */
  body::after{
    content:"";
    position:fixed;left:0;right:0;bottom:0;height:9rem;
    background:
      linear-gradient(180deg,transparent, rgba(0,0,0,.28)),
      repeating-linear-gradient(45deg, rgba(244,232,212,.028) 0 1.6rem, transparent 1.6rem 3.2rem),
      repeating-linear-gradient(-45deg, rgba(244,232,212,.028) 0 1.6rem, transparent 1.6rem 3.2rem);
    pointer-events:none;
  }
  main{
    width:100%;
    max-width:34rem;
    padding:2.2rem 1.1rem 4.5rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }
  header{text-align:center;margin-bottom:1.6rem}
  .eyebrow{
    font-size:.66rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:.5rem;
  }
  h1{
    font-family:'Amarante',serif;
    font-weight:400;
    font-size:clamp(2.5rem,9vw,3.6rem);
    line-height:1.02;
    text-shadow:0 0 2.2rem rgba(255,180,84,.25);
  }
  h1 em{font-style:normal;color:var(--amber)}
  .tagline{
    font-family:'Special Elite',cursive;
    color:var(--cream-dim);
    font-size:.92rem;
    margin-top:.6rem;
  }

  /* ── scene ─────────────────────────────── */
  .scene{
    position:relative;
    width:min(21rem,88vw);
    margin-top:2.6rem;
  }
  .halo{
    position:absolute;
    left:50%;top:-1rem;
    width:130%;height:120%;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,180,84,.16), transparent 70%);
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
  }
  .scene.toasting .halo,
  .scene.popped .halo{opacity:1}

  /* toast rises inside a masked column above the toaster */
  .slot-mask{
    position:absolute;
    left:50%;bottom:7.4rem;
    transform:translateX(-50%);
    width:11.5rem;height:12rem;
    overflow:hidden;
    pointer-events:none;
  }
  .toast{
    position:absolute;
    left:50%;bottom:0;
    width:8.6rem;height:8.6rem;
    transform:translate(-50%,105%) rotate(0deg);
    background:
      radial-gradient(120% 90% at 50% 8%, var(--toast) 62%, var(--toast-dark) 100%);
    border:.28rem solid var(--toast-dark);
    border-radius:2.6rem 2.6rem 1.1rem 1.1rem;
    box-shadow:inset 0 -0.9rem 1.4rem rgba(0,0,0,.16);
  }
  .toast.up{
    transform:translate(-50%,6%) rotate(-2deg);
    transition:transform .55s cubic-bezier(.2,1.6,.35,1);
  }
  .toast.retract{
    transform:translate(-50%,105%) rotate(0deg);
    transition:transform .22s ease-in;
  }
  .toast.burnt{
    background:radial-gradient(120% 90% at 50% 8%, #7a5a41 55%, var(--burnt) 100%);
    border-color:#3f2c1e;
  }
  .toast .eye,.toast .mouth{position:absolute;background:var(--line);border-radius:50%}
  .toast .eye{width:.85rem;height:1.15rem;top:2.7rem}
  .toast .eye.l{left:2.3rem}
  .toast .eye.r{right:2.3rem}
  .toast .mouth{
    width:1.7rem;height:.95rem;
    left:50%;top:4.6rem;
    transform:translateX(-50%);
    border-radius:0 0 1.7rem 1.7rem;
  }
  .toast.burnt .mouth{border-radius:1.7rem 1.7rem 0 0;top:4.9rem}

  /* smoke for burnt fate */
  .smoke{
    position:absolute;
    bottom:9rem;left:50%;
    width:.8rem;height:.8rem;
    border-radius:50%;
    background:rgba(205,191,168,.4);
    filter:blur(2px);
    pointer-events:none;
    animation:smoke-rise 1.9s ease-out forwards;
  }
  @keyframes smoke-rise{
    from{transform:translate(-50%,0) scale(1);opacity:.7}
    to{transform:translate(calc(-50% + var(--drift,1rem)),-7rem) scale(2.6);opacity:0}
  }
  /* ghost wisp */
  .ghost{
    position:absolute;
    bottom:9.5rem;left:50%;
    width:2.4rem;height:2.9rem;
    pointer-events:none;
    animation:ghost-rise 2.3s ease-out forwards;
  }
  .ghost::before{
    content:"";
    position:absolute;inset:0;
    background:rgba(244,232,212,.85);
    border-radius:1.2rem 1.2rem .35rem .35rem;
    clip-path:polygon(0 0,100% 0,100% 88%,83% 100%,66% 88%,50% 100%,34% 88%,17% 100%,0 88%);
  }
  .ghost::after{
    content:"";
    position:absolute;
    top:.85rem;left:.55rem;
    width:.34rem;height:.5rem;
    border-radius:50%;
    background:var(--line);
    box-shadow:.95rem 0 0 var(--line);
  }
  @keyframes ghost-rise{
    0%{transform:translate(-50%,.5rem) rotate(0deg);opacity:0}
    18%{opacity:.9}
    100%{transform:translate(calc(-50% + var(--drift,-2rem)),-9rem) rotate(var(--tilt,-8deg));opacity:0}
  }

  /* ── the toaster itself ────────────────── */
  .toaster{
    position:relative;
    height:8rem;
    background:linear-gradient(180deg,#8fd3c7 0%,var(--teal) 34%,var(--teal-deep) 100%);
    border:.3rem solid var(--line);
    border-radius:2.4rem 2.4rem 1.4rem 1.4rem;
    box-shadow:
      inset 0 .5rem .8rem rgba(255,255,255,.35),
      inset 0 -1.2rem 1.6rem rgba(12,7,20,.35),
      0 1.4rem 2.4rem rgba(0,0,0,.45);
  }
  .toaster::before{ /* chrome band */
    content:"";
    position:absolute;left:.8rem;right:.8rem;top:-.05rem;height:1.7rem;
    background:linear-gradient(180deg,#fdf6e6,#c9bda6);
    border:.22rem solid var(--line);
    border-radius:1.6rem;
  }
  .slots{
    position:absolute;
    left:50%;top:-.62rem;
    transform:translateX(-50%);
    display:flex;gap:.9rem;
    z-index:2;
  }
  .slot{
    width:9.6rem;height:.85rem;
    background:linear-gradient(180deg,#0a0510,#241531);
    border-radius:.5rem;
    box-shadow:inset 0 .25rem .4rem #000;
    transition:box-shadow .4s ease;
  }
  .scene.toasting .slot,
  .scene.popped .slot{
    box-shadow:inset 0 .25rem .4rem #000, 0 0 1.1rem rgba(255,140,60,.85), inset 0 -.15rem .5rem rgba(255,140,60,.9);
  }
  .dial{
    position:absolute;
    right:1.5rem;top:3.4rem;
    width:2.3rem;height:2.3rem;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fdf6e6,#b9ac93 70%);
    border:.24rem solid var(--line);
  }
  .dial::after{
    content:"";
    position:absolute;
    left:50%;top:.18rem;
    width:.26rem;height:.85rem;
    background:var(--line);
    border-radius:.2rem;
    transform-origin:50% 350%;
    transform:translateX(-50%) rotate(28deg);
    transition:transform .5s ease;
  }
  .scene.toasting .dial::after{transform:translateX(-50%) rotate(160deg)}
  .lever{
    position:absolute;
    left:-1.05rem;top:2.2rem;
    width:1.05rem;height:2.9rem;
  }
  .lever::before{ /* track */
    content:"";
    position:absolute;right:0;top:0;bottom:0;width:.35rem;
    background:var(--line);
    border-radius:.2rem;
  }
  .lever::after{ /* knob */
    content:"";
    position:absolute;
    left:0;top:0;
    width:1.15rem;height:.95rem;
    background:linear-gradient(180deg,#fdf6e6,#c9bda6);
    border:.22rem solid var(--line);
    border-radius:.45rem;
    transition:top .25s ease;
  }
  .scene.toasting .lever::after{top:1.9rem}
  .feet{
    position:absolute;left:1.6rem;right:1.6rem;bottom:-.85rem;
    display:flex;justify-content:space-between;
  }
  .feet span{
    width:1.5rem;height:.85rem;
    background:var(--line);
    border-radius:0 0 .5rem .5rem;
  }
  .scene.toasting .toaster{animation:rumble .16s linear infinite}
  @keyframes rumble{
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(.06rem,-.05rem) rotate(.22deg)}
    50%{transform:translate(-.05rem,.04rem) rotate(-.2deg)}
    75%{transform:translate(.04rem,.05rem) rotate(.14deg)}
    100%{transform:translate(0,0) rotate(0)}
  }

  /* ── controls & fortune ────────────────── */
  .controls{
    margin-top:2.6rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.9rem;
    width:100%;
  }
  .summon{
    font-family:'Amarante',serif;
    font-size:1.35rem;
    letter-spacing:.04em;
    color:var(--night);
    background:linear-gradient(180deg,#ffd08a,var(--amber) 55%,var(--ember));
    border:.24rem solid var(--line);
    border-radius:1.2rem;
    padding:.85rem 2.1rem;
    min-height:2.9rem;
    cursor:pointer;
    box-shadow:0 .45rem 0 var(--line), 0 .9rem 1.8rem rgba(255,122,60,.3);
    transition:transform .12s ease, box-shadow .12s ease, filter .2s ease;
  }
  .summon:hover{filter:brightness(1.06)}
  .summon:active{transform:translateY(.3rem);box-shadow:0 .15rem 0 var(--line)}
  .summon[disabled]{
    cursor:wait;
    filter:saturate(.5) brightness(.85);
    transform:translateY(.3rem);
    box-shadow:0 .15rem 0 var(--line);
  }
  .mute{
    background:none;
    border:.13rem solid rgba(244,232,212,.35);
    border-radius:2rem;
    color:var(--cream-dim);
    font-family:inherit;
    font-size:.72rem;
    letter-spacing:.14em;
    padding:.55rem 1rem;
    min-height:2.75rem;
    cursor:pointer;
    transition:color .2s,border-color .2s;
  }
  .mute:hover{color:var(--cream);border-color:var(--cream-dim)}
  .mute[aria-pressed="false"]{opacity:.6}

  .slip{
    margin-top:1.9rem;
    width:100%;
    max-width:26rem;
    min-height:6.4rem;
    background:linear-gradient(180deg,#fbf3df,#efe2c6);
    color:#3a2b1c;
    border-radius:.35rem;
    padding:1.15rem 1.3rem 1.05rem;
    font-family:'Special Elite',cursive;
    font-size:1.02rem;
    line-height:1.5;
    box-shadow:0 .9rem 1.8rem rgba(0,0,0,.4);
    position:relative;
    opacity:0;
    transform:translateY(.6rem);
    transition:opacity .5s ease .15s, transform .5s ease .15s;
  }
  .slip.show{opacity:1;transform:translateY(0)}
  .slip::before{
    content:"";
    position:absolute;left:0;right:0;top:-.45rem;height:.5rem;
    background:repeating-linear-gradient(90deg,transparent 0 .55rem,#efe2c6 .55rem 1.1rem);
  }
  .slip .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:.62rem;
    font-weight:600;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:#9a6a2c;
    margin-bottom:.45rem;
  }
  .slip.burnt-slip .kicker{color:#8a3a2a}
  .hint{
    margin-top:1.4rem;
    font-size:.72rem;
    color:var(--cream-dim);
    text-align:center;
    transition:opacity .6s ease;
  }
  .hint.gone{opacity:0}

  footer{
    margin-top:auto;
    padding:1rem 0 1.4rem;
    text-align:center;
    position:relative;
    z-index:1;
  }
  #buildstamp{
    font-size:.62rem;
    color:rgba(244,232,212,.4);
    letter-spacing:.08em;
  }
  .visually-hidden{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }
  :focus-visible{
    outline:.22rem solid var(--focus);
    outline-offset:.2rem;
    border-radius:.4rem;
  }
  @media (prefers-reduced-motion: reduce){
    .scene.toasting .toaster{animation:none}
    .toast.up,.toast.retract{transition:none}
    .slip{transition:opacity .2s ease}
    .ghost,.smoke{display:none}
  }
  @media (max-width:26rem){
    .scene{margin-top:1.8rem}
    .summon{font-size:1.15rem;padding:.8rem 1.5rem}
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">appliance of the beyond</p>
    <h1>The <em>Haunted</em> Toaster</h1>
    <p class="tagline">it burned out in 1959. it never stopped predicting.</p>
  </header>

  <div class="scene" id="scene" aria-hidden="true">
    <div class="halo"></div>
    <div class="slot-mask">
      <div class="toast" id="toast">
        <span class="eye l"></span><span class="eye r"></span><span class="mouth"></span>
      </div>
    </div>
    <div class="toaster">
      <div class="slots"><span class="slot"></span><span class="slot"></span></div>
      <div class="dial"></div>
      <div class="lever"></div>
      <div class="feet"><span></span><span></span></div>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="summon" id="summon">consult the toaster</button>
    <button type="button" class="mute" id="mute" aria-pressed="true">sound: on</button>
  </div>

  <div class="slip" id="slip" role="status" aria-live="polite">
    <p class="kicker" id="kicker" aria-hidden="true"></p>
    <p id="slipText"></p>
  </div>

  <p class="hint" id="hint">press the button · the bread knows things</p>
</main>

<footer>
  <span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-08-28 · ed2763f</span>
</footer>

<script>
(function(){
  'use strict';

  var FORTUNES = [
    "You will find the thing you lost in a pocket you already checked twice. Check a third time.",
    "A stranger will compliment you this week. Accept it. The toaster insists.",
    "Beware of a Wednesday that feels suspiciously like a Tuesday.",
    "Someone is thinking about you right now. It is probably the toaster. But maybe not.",
    "You will soon open a snack at the exact perfect level of hunger. Savor it.",
    "The next song you hear will be stuck in your head for three days. Choose wisely.",
    "An email you are dreading turns out to be completely fine. Almost friendly, even.",
    "You will win a small argument by simply not replying. Legendary.",
    "A houseplant near you is rooting for you. Literally.",
    "The sock will return. Not the way it left, but it will return.",
    "You will laugh at something you should not laugh at. It will be worth it.",
    "Soon you will nail the parallel park of your life while nobody is watching. The toaster will know.",
    "Your future holds a nap of historic quality. Do not schedule anything against it.",
    "Someone will say your name today and mean it kindly.",
    "A door you thought was locked was only sticky. Push again.",
    "You will remember the word you forgot at 2:41 in the morning. Write it down.",
    "The crumbs you leave behind tell a story of joy. Also of toast.",
    "You will soon be early for something and have no idea what to do with the extra minutes. Loiter proudly.",
    "A tiny act of kindness you did months ago is still echoing. It found a good home.",
    "Do not trust the microwave. It knows nothing. It merely reheats.",
    "You will make exactly the right amount of pasta. Once. Cherish it.",
    "The answer is yes, but only if you also stretch your shoulders.",
    "A book you abandoned misses you. Chapter four is where it gets good.",
    "You will find money in a coat. It was always your money. Still counts.",
    "Someone will lend you a pen and you will actually give it back. Character growth.",
    "Your Wi-Fi will hold through the important part. After that, no promises.",
    "You are one good breakfast away from your best idea this month.",
    "The weird noise the fridge makes is just applause. Keep going.",
    "You will step on zero LEGO bricks this week. The spirits have cleared a path.",
    "An old friend resurfaces with a story that starts with the phrase: so anyway.",
    "The queue you choose will finally be the fast one. Just once. Enjoy it.",
    "You will wave at someone who was waving at the person behind you, and you will style it out beautifully.",
    "Rain is coming, but so is the exact right hood for it.",
    "Your leftovers will taste better than the original meal. Science cannot explain this.",
    "A decision you are overthinking is already made. You know which one.",
    "You will hold the door for someone important. Everyone is someone important.",
    "The plant on your windowsill has seen your dance moves and approves.",
    "Soon, a perfect avocado. Do not hesitate. Hesitation is how the darkness wins.",
    "You will finally unsubscribe from that newsletter and feel eleven percent lighter.",
    "Tomorrow you will be somebody's good example. Dress accordingly."
  ];

  var BURNT = [
    "The toast is dark. The omen is mild: you will hit every red light exactly once, then never again.",
    "Scorched crumbs foretell a minor inconvenience — a slow website — and your graceful triumph over it.",
    "Burnt, yes. Doomed, no. You will briefly forget why you walked into a room. The room forgives you.",
    "A dark slice. Someone will spoil the weather forecast for you: it was going to be rain anyway.",
    "Charred prophecy: your phone will hit 1% at a dramatic moment and survive it, as will you.",
    "The bread has seen the void. The void said your posture could be better. That is all it said."
  ];

  var KICKERS = ["the toast has spoken","fate, lightly buttered","prophecy no.","crumbs of destiny","the slot reveals"];

  var scene = document.getElementById('scene');
  var toastEl = document.getElementById('toast');
  var summon = document.getElementById('summon');
  var muteBtn = document.getElementById('mute');
  var slip = document.getElementById('slip');
  var slipText = document.getElementById('slipText');
  var kicker = document.getElementById('kicker');
  var hint = document.getElementById('hint');

  var busy = false;
  var count = 0;
  var lastIdx = -1;
  var reduceMotion = false;
  try{ reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  /* ── tiny synth ─────────────────────────── */
  var soundOn = true;
  try{ soundOn = localStorage.getItem('haunted-toaster-sound') !== 'off'; }catch(e){}
  var actx = null;
  function audio(){
    if(!soundOn) return null;
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  function blip(freq, endFreq, dur, type, vol, when){
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (when || 0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function sndLever(){ blip(320, 180, 0.09, 'square', 0.07); }
  function sndTick(when){ blip(1250, 900, 0.03, 'square', 0.025, when); }
  function sndPop(){
    var ac = audio(); if(!ac) return;
    blip(420, 940, 0.16, 'triangle', 0.14);
    blip(940, 1500, 0.22, 'sine', 0.09, 0.05);
    try{
      var t = ac.currentTime;
      var len = Math.floor(ac.sampleRate * 0.09);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
      var src = ac.createBufferSource(); src.buffer = buf;
      var f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=1.2;
      var g = ac.createGain(); g.gain.value = 0.08;
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t);
    }catch(e){}
  }
  function sndBurnt(){
    blip(220, 90, 0.5, 'sawtooth', 0.05);
    blip(660, 620, 0.35, 'sine', 0.05, 0.1);
  }

  muteBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    muteBtn.setAttribute('aria-pressed', String(soundOn));
    muteBtn.textContent = soundOn ? 'sound: on' : 'sound: off';
    try{ localStorage.setItem('haunted-toaster-sound', soundOn ? 'on' : 'off'); }catch(e){}
    if(soundOn) blip(700, 900, 0.08, 'triangle', 0.08);
  });
  muteBtn.setAttribute('aria-pressed', String(soundOn));
  muteBtn.textContent = soundOn ? 'sound: on' : 'sound: off';

  /* ── ephemeral wisps ────────────────────── */
  function spawnWisp(cls, drift, tilt){
    if(reduceMotion) return;
    var el = document.createElement('div');
    el.className = cls;
    el.style.setProperty('--drift', drift + 'rem');
    if(tilt !== undefined) el.style.setProperty('--tilt', tilt + 'deg');
    scene.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  /* ── fortune picking ────────────────────── */
  function pickFortune(){
    var burnt = Math.random() < 0.14;
    var pool = burnt ? BURNT : FORTUNES;
    var idx;
    do { idx = Math.floor(Math.random() * pool.length); }
    while(pool.length > 1 && !burnt && idx === lastIdx);
    if(!burnt) lastIdx = idx;
    return { text: pool[idx], burnt: burnt };
  }

  /* ── the ritual ─────────────────────────── */
  function beginToasting(){
    busy = true;
    summon.disabled = true;
    hint.classList.add('gone');
    slip.classList.remove('show');
    scene.classList.remove('popped');
    scene.classList.add('toasting');
    sndLever();
    var cookMs = reduceMotion ? 350 : 1300 + Math.random() * 900;
    if(!reduceMotion){
      for(var i = 0; i < Math.floor(cookMs / 260); i++) sndTick(0.25 + i * 0.26);
    }
    setTimeout(pop, cookMs);
  }

  function pop(){
    var f = pickFortune();
    scene.classList.remove('toasting');
    scene.classList.add('popped');
    toastEl.classList.remove('retract');
    toastEl.classList.toggle('burnt', f.burnt);
    toastEl.classList.add('up');

    if(f.burnt){
      sndBurnt();
      spawnWisp('smoke', 1.2); spawnWisp('smoke', -1.5); spawnWisp('smoke', 0.4);
    }else{
      sndPop();
      spawnWisp('ghost', (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 2), (Math.random() * 16 - 8));
    }

    count++;
    kicker.textContent = f.burnt
      ? 'slightly burnt omen'
      : KICKERS[count % KICKERS.length] + (KICKERS[count % KICKERS.length] === 'prophecy no.' ? ' ' + count : '');
    slip.classList.toggle('burnt-slip', f.burnt);
    slipText.textContent = f.text;
    slip.classList.add('show');

    summon.textContent = 'toast another fate';
    summon.disabled = false;
    busy = false;
  }

  summon.addEventListener('click', function(){
    if(busy) return;
    if(toastEl.classList.contains('up')){
      toastEl.classList.remove('up');
      toastEl.classList.add('retract');
      busy = true;
      summon.disabled = true;
      setTimeout(beginToasting, reduceMotion ? 30 : 240);
    }else{
      beginToasting();
    }
  });
})();
</script>
</body>
</html>
