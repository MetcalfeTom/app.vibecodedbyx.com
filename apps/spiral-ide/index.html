<html lang="en">
<head>

<style>
:root{
  --void:#06030f; --panel:rgba(16,10,32,.86); --edge:rgba(140,120,255,.18);
  --txt:#d8e6ff; --dim:#7a6fa8; --cyan:#66e6ff; --ember:#ff8a3d; --err:#ff5f7a; --ok:#8be05a;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:100%; }
body{
  background:var(--void);
  background-image:
    radial-gradient(60% 80% at 70% 40%, rgba(120,80,255,.10), transparent 60%),
    radial-gradient(40% 50% at 25% 75%, rgba(255,138,61,.06), transparent 60%);
  color:var(--txt); font-family:'Fira Code', monospace; min-height:100vh;
}
main{ max-width:78rem; margin:0 auto; padding:.9rem 1rem 2rem; }
header{ display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; padding:.3rem 0 .8rem; }
h1{
  font-family:'Monofett', monospace; font-weight:400;
  font-size:clamp(2rem, 5vw, 3.2rem); letter-spacing:.02em; color:var(--cyan);
  text-shadow:0 0 24px rgba(102,230,255,.35);
}
h1 em{ font-style:normal; color:var(--ember); text-shadow:0 0 24px rgba(255,138,61,.4); }
.tag{ font-size:.78rem; color:var(--dim); }
.layout{ display:grid; grid-template-columns: minmax(20rem, 30rem) 1fr; gap:1rem; align-items:stretch; }
@media (max-width:56rem){ .layout{ grid-template-columns:1fr; } }
.pane{
  background:var(--panel); border:1px solid var(--edge); border-radius:.9rem;
  display:flex; flex-direction:column; overflow:hidden; backdrop-filter:blur(4px);
}
.pane .bar{
  display:flex; align-items:center; gap:.5rem; padding:.5rem .7rem;
  border-bottom:1px solid var(--edge); font-size:.7rem; color:var(--dim); letter-spacing:.12em;
}
.bar .dotr{ width:.5rem; height:.5rem; border-radius:50%; background:var(--ember); box-shadow:0 0 8px var(--ember); }
textarea{
  flex:1; min-height:20rem; resize:vertical; background:transparent; border:0; outline:none;
  color:var(--txt); font-family:'Fira Code', monospace; font-size:.85rem; line-height:1.55;
  padding:.8rem .9rem; caret-color:var(--ember); tab-size:2;
}
textarea::selection{ background:rgba(102,230,255,.25); }
.controls{ display:flex; gap:.5rem; padding:.6rem .7rem; border-top:1px solid var(--edge); align-items:center; flex-wrap:wrap; }
button, select{
  font-family:'Fira Code', monospace; cursor:pointer; font-size:.8rem;
  background:rgba(140,120,255,.10); color:var(--txt); border:1px solid var(--edge);
  border-radius:.55rem; min-height:2.75rem; padding:.4rem .8rem;
}
button:hover{ background:rgba(140,120,255,.2); }
#runBtn{
  background:var(--ember); color:#160a02; border:0; font-weight:600; letter-spacing:.06em;
  box-shadow:0 0 22px rgba(255,138,61,.35); flex:1;
}
#runBtn:disabled{ opacity:.5; cursor:wait; box-shadow:none; }
#runBtn:hover:not(:disabled){ background:#ffa060; }
.kbd{ font-size:.65rem; color:var(--dim); }
.stagewrap{ position:relative; min-height:26rem; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.status{
  position:absolute; left:50%; top:.6rem; transform:translateX(-50%);
  font-size:.68rem; color:var(--dim); letter-spacing:.15em; pointer-events:none;
  background:rgba(6,3,15,.6); padding:.2rem .7rem; border-radius:1rem;
}
.out{
  position:absolute; left:.7rem; right:.7rem; bottom:.6rem; max-height:42%;
  overflow-y:auto; font-size:.78rem; line-height:1.5; pointer-events:auto;
  background:rgba(6,3,15,.72); border:1px solid var(--edge); border-radius:.6rem;
  padding:.45rem .65rem; backdrop-filter:blur(3px);
}
.out:empty{ display:none; }
.out div{ white-space:pre-wrap; overflow-wrap:anywhere; animation:oin .3s; }
.out .l{ color:var(--cyan); }
.out .e{ color:var(--err); }
.out .s{ color:var(--ok); }
@keyframes oin{ from{ opacity:0; transform:translateX(-6px); } }
.out::-webkit-scrollbar{ width:.35rem; } .out::-webkit-scrollbar-thumb{ background:var(--edge); }
.stamp{
  position:fixed; right:.7rem; bottom:.6rem; font-size:.6rem; color:var(--dim);
  background:var(--panel); border:1px solid var(--edge); border-radius:.4rem; padding:.12rem .45rem; z-index:5;
}
:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ .out div{ animation:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>SPIR<em>A</em>L</h1>
    <p class="tag">an IDE with ceremony — code orbits into the singularity before it runs, output spirals back out</p>
  </header>
  <div class="layout">
    <section class="pane" aria-label="Code editor">
      <div class="bar"><span class="dotr" aria-hidden="true"></span>ORBIT-1 · UNTITLED.JS</div>
      <textarea id="editor" spellcheck="false" aria-label="JavaScript source code">// everything you log comes back out of the center
const fib = n => n < 2 ? n : fib(n-1) + fib(n-2);

for(let i = 1; i <= 10; i++){
  console.log('fib(' + i + ') =', fib(i));
}

console.log('the spiral remembers.');</textarea>
      <div class="controls">
        <button id="runBtn" type="button">▶ RUN&nbsp;&nbsp;— feed the spiral</button>
        <select id="examples" aria-label="Load example program">
          <option value="">examples…</option>
          <option value="fib">fibonacci</option>
          <option value="stars">ascii starfield</option>
          <option value="primes">prime storm</option>
          <option value="err">a beautiful crash</option>
        </select>
        <button id="muteBtn" type="button" aria-pressed="false" aria-label="Toggle sound">🔊</button>
        <span class="kbd">Ctrl+Enter runs · 3s limit</span>
      </div>
    </section>
    <section class="pane stagewrap" aria-label="Spiral stage">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="status" id="status">IDLE · THE CENTER IS PATIENT</div>
      <div class="out" id="out" role="log" aria-live="polite"></div>
    </section>
  </div>
</main>
<span class="stamp" id="stamp"></span>
<script>
'use strict';
const VER = 'v1.2 · 67b4046';
document.getElementById('stamp').textContent = VER;
const $ = id => document.getElementById(id);

/* ============ examples ============ */
const EXAMPLES = {
  fib:`const fib = n => n < 2 ? n : fib(n-1) + fib(n-2);\nfor(let i = 1; i <= 10; i++){\n  console.log('fib(' + i + ') =', fib(i));\n}`,
  stars:`// a tiny starfield, drawn in text\nfor(let y = 0; y < 10; y++){\n  let row = '';\n  for(let x = 0; x < 34; x++){\n    const v = Math.sin(x*12.9898 + y*78.233) * 43758.5453;\n    row += (v - Math.floor(v)) > 0.93 ? '✦' : (v - Math.floor(v)) > 0.86 ? '·' : ' ';\n  }\n  console.log(row);\n}`,
  primes:`const isPrime = n => { for(let i=2; i*i<=n; i++) if(n%i===0) return false; return n>1; };\nconst primes = [];\nfor(let n=2; primes.length<20; n++) if(isPrime(n)) primes.push(n);\nconsole.log('first 20 primes:');\nconsole.log(primes.join(' '));`,
  err:`console.log('reaching for something that was never there…');\nconst ghost = undefined;\nghost.speak();`,
};

/* ============ orbit planner (pure, testable) ============ */
function planOrbiters(source){
  // every visible CHARACTER becomes an orbiter, in source order; whitespace
  // doesn't fly (nothing to see) but the full source still executes verbatim.
  // No entry deadline: each character orbits as long as it wants — its own
  // duration and lap count from a deterministic hash (testable, still 'free').
  const chars = [...source].filter(ch => ch.trim().length);
  const rnd = i => { const v = Math.sin(i*12.9898 + 78.233)*43758.5453; return v - Math.floor(v); };
  return chars.map((text, i) => ({
    text, i, delay: i*0.012,
    dur: 1.4 + rnd(i)*3.2,           // 1.4s sprinters … 4.6s lingerers
    laps: 3.5 + rnd(i*7.13)*6,       // how much it swirls on the way down
    absorbed:false }));
}

/* ============ spiral stage ============ */
const cv = $('cv'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, CX=0, CY=0;
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2 - H*0.06;
}
window.addEventListener('resize', resize); resize();

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STARS = [];
for(let i=0;i<110;i++) STARS.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, ph:Math.random()*Math.PI*2 });

const RUN = {
  active:false, phase:'idle',      // idle | infall | burn | outflow
  orbiters:[], t:0, sparks:[],
  outQueue:[], outFlying:[], done:false, workerDone:false,
  spinBoost:0,
};

function draw(t, dt){
  ctx.clearRect(0,0,W,H);
  /* stars */
  for(const s of STARS){
    const tw = REDUCED ? 0.7 : 0.45+0.55*Math.abs(Math.sin(t*0.8+s.ph));
    ctx.fillStyle = 'rgba(216,230,255,'+(0.5*tw)+')';
    ctx.fillRect(s.x*W, s.y*H, s.r, s.r);
  }
  /* singularity */
  const spin = t*(0.7 + RUN.spinBoost);
  const pulse = 1 + Math.sin(t*3)*0.08 + RUN.spinBoost*0.06;
  for(let a=0;a<3;a++){
    ctx.strokeStyle = 'rgba(255,138,61,'+(0.28 - a*0.07)+')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let k=0;k<=40;k++){
      const p = k/40, ang = spin + a*(Math.PI*2/3) + p*3.4;
      const rr = (6 + p*46)*pulse;
      const x = CX + Math.cos(ang)*rr, y = CY + Math.sin(ang)*rr*0.86;
      k ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  const core = ctx.createRadialGradient(CX,CY,0,CX,CY,26*pulse);
  core.addColorStop(0,'rgba(255,220,180,0.95)');
  core.addColorStop(0.4,'rgba(255,138,61,0.55)');
  core.addColorStop(1,'rgba(255,138,61,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(CX,CY,26*pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(20,8,2,0.95)';
  ctx.beginPath(); ctx.arc(CX,CY,5*pulse,0,Math.PI*2); ctx.fill();

  const R0 = Math.min(W,H)*0.46;
  /* infalling code */
  if(RUN.phase==='infall'){
    let allDone = true;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const o of RUN.orbiters){
      if(o.absorbed) continue;
      const p = Math.max(0, Math.min(1, (RUN.t - o.delay)/o.dur));
      if(p < 1) allDone = false;
      if(p <= 0){ allDone = false; continue; }
      if(p >= 1){ absorb(o); continue; }
      const th = o.i*2.39996 + p*o.laps;       // golden-angle start + its own swirl
      const rr = R0 * Math.pow(1-p, 1.3) + 6;
      const x = CX + Math.cos(th)*rr, y = CY + Math.sin(th)*rr*0.86;
      const sc = 0.5 + (1-p)*0.6;
      ctx.save();
      ctx.translate(x,y); ctx.rotate(REDUCED?0:(th+p*2)*0.12); ctx.scale(sc,sc);
      ctx.font = '15px "Fira Code", monospace';
      ctx.fillStyle = 'rgba(102,230,255,'+(0.4+0.6*(1-p*0.5))+')';
      if(RUN.orbiters.length<=400){ ctx.shadowColor = 'rgba(102,230,255,0.6)'; ctx.shadowBlur = 6*(1-p); }
      ctx.fillText(o.text, 0, 0);
      ctx.restore();
    }
    if(allDone && RUN.orbiters.every(o=>o.absorbed)){
      RUN.phase = 'burn';
      $('status').textContent = 'EXECUTING · INSIDE THE SINGULARITY';
      RUN.spinBoost = 6;
      maybeFinish();
    }
  }
  /* outflowing results — characters, one at a time.
     Dock strictly in launch order: iterate forward, splice afterwards —
     reverse iteration scrambled same-frame arrivals ('alpah'). */
  const arrived = [];
  for(let i=0;i<RUN.outFlying.length;i++){
    const f = RUN.outFlying[i];
    f.p += dt/0.9;
    if(f.p>=1){ arrived.push(i); continue; }
    if(!f.ch.trim()) continue;                 // spaces fly invisibly (order keepers)
    const th = f.gi*1.1 + (1-f.p)*4.2 + Math.PI;
    const rr = R0*0.62*Math.pow(f.p,0.8) + 8;
    const x = CX + Math.cos(th)*rr, y = CY + Math.sin(th)*rr*0.86;
    ctx.font = '15px "Fira Code", monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = (f.kind==='err'?'rgba(255,95,122,':'rgba(139,224,90,')+(0.4+0.6*f.p)+')';
    if(RUN.outFlying.length<300){
      ctx.shadowColor = f.kind==='err'?'rgba(255,95,122,0.6)':'rgba(139,224,90,0.6)';
      ctx.shadowBlur = 8*(1-f.p);
    }
    ctx.fillText(f.ch, x, y);
    ctx.shadowBlur = 0;
  }
  for(const idx of arrived) dockOut(RUN.outFlying[idx]);
  for(let k=arrived.length-1;k>=0;k--) RUN.outFlying.splice(arrived[k],1);
  /* sparks */
  for(let i=RUN.sparks.length-1;i>=0;i--){
    const s = RUN.sparks[i];
    s.t += dt;
    const k = s.t/0.5;
    if(k>=1){ RUN.sparks.splice(i,1); continue; }
    ctx.strokeStyle = 'rgba(255,200,140,'+(0.8*(1-k))+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX,CY,8+k*34,0,Math.PI*2); ctx.stroke();
  }
  /* outflow pump: decompose lines into a character stream */
  if((RUN.phase==='burn'||RUN.phase==='outflow') && RUN.workerDone){
    if(RUN.phase!=='outflow'){ RUN.phase='outflow'; $('status').textContent='OUTFLOW · CHARACTERS RETURNING'; }
    if(!RUN.stream && RUN.outQueue.length){
      const msg = RUN.outQueue.shift();
      RUN.stream = { chars:[...msg.text], kind:msg.kind, pos:0, line:{ el:null, kind:msg.kind } };
      if(!RUN.stream.chars.length) RUN.stream.chars = [' '];
    }
    if(RUN.stream){
      const backlog = (RUN.stream.chars.length - RUN.stream.pos) +
        RUN.outQueue.reduce((a,m)=>a+m.text.length, 0);
      const rate = Math.max(25, Math.min(400, backlog/6));   // whole outflow lands within ~6s
      RUN.emitAcc = (RUN.emitAcc||0) + rate*dt;
      while(RUN.emitAcc >= 1 && RUN.stream){
        RUN.emitAcc -= 1;
        const ch = RUN.stream.chars[RUN.stream.pos++];
        RUN.outCount = (RUN.outCount||0)+1;
        RUN.outFlying.push({ ch, kind:RUN.stream.kind, gi:RUN.outCount, p:0, line:RUN.stream.line });
        if(ch.trim() && RUN.outCount % 6 === 0) blip(480 + (RUN.outCount%24)*14, RUN.stream.kind==='err'?'sawtooth':'sine');
        if(RUN.stream.pos >= RUN.stream.chars.length) RUN.stream = null;
      }
    }
    if(!RUN.outQueue.length && !RUN.stream && !RUN.outFlying.length) endRun();
  }
  RUN.spinBoost = Math.max(0, RUN.spinBoost - dt*3);
}
function absorb(o){
  o.absorbed = true;
  const N = RUN.orbiters.length || 1;
  if(o.i % Math.max(1, Math.round(N/24)) === 0) RUN.sparks.push({ t:0 });
  if(o.i % Math.max(1, Math.round(N/40)) === 0)
    blip(240 + (o.i/N)*520, 'triangle');     // pitch climbs as the source drains
}
function dockOut(f){
  if(!f.line.el){
    f.line.el = document.createElement('div');
    f.line.el.className = f.kind==='err' ? 'e' : 'l';
    $('out').appendChild(f.line.el);
  }
  f.line.el.textContent += f.ch;
  $('out').scrollTop = $('out').scrollHeight;
}

/* ============ execution (worker, 3s kill) ============ */
const WORKER_SRC = `
  const fmt = a => a.map(x => { try{ return (typeof x==='object' && x!==null) ? JSON.stringify(x) : String(x); }catch(e){ return String(x); } }).join(' ');
  const post = (kind, text) => postMessage({ kind, text: String(text).slice(0, 400) });
  console.log = console.info = (...a) => post('log', fmt(a));
  console.warn = (...a) => post('log', '⚠ ' + fmt(a));
  console.error = (...a) => post('err', fmt(a));
  onmessage = e => {
    try{
      const r = (0, eval)(e.data);
      if(r !== undefined) post('log', '→ ' + fmt([r]));
      post('done', '');
    }catch(err){
      post('err', '✖ ' + (err && err.message ? err.message : String(err)));
      post('done', '');
    }
  };
`;
let worker = null, killT = null;
function execute(source){
  RUN.workerDone = false;
  let outCount = 0;
  try{
    const blob = new Blob([WORKER_SRC], { type:'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
  }catch(e){
    RUN.outQueue.push({ kind:'err', text:'✖ worker refused to spawn: '+e.message });
    RUN.workerDone = true;
    return;
  }
  worker.onmessage = ev => {
    const { kind, text } = ev.data||{};
    if(kind==='done'){ finishWorker(true); return; }
    if(outCount++ < 200) RUN.outQueue.push({ kind, text });
    else if(outCount===201) RUN.outQueue.push({ kind:'err', text:'… output truncated at 200 lines' });
  };
  worker.onerror = ev => {
    RUN.outQueue.push({ kind:'err', text:'✖ '+(ev.message||'unknown error') });
    finishWorker(true);
  };
  killT = setTimeout(()=>{
    RUN.outQueue.push({ kind:'err', text:'⏱ terminated — spiraled deeper than 3 seconds' });
    finishWorker(false);
  }, 3000);
  worker.postMessage(source);
}
function finishWorker(clean){
  if(killT){ clearTimeout(killT); killT = null; }
  if(worker){ worker.terminate(); worker = null; }
  if(!RUN.outQueue.length && clean) RUN.outQueue.push({ kind:'log', text:'∅ silence. the spiral consumed everything and said nothing.' });
  RUN.workerDone = true;
  maybeFinish();
}
function maybeFinish(){ /* outflow starts when burn-phase drawing sees workerDone */ }
function endRun(){
  RUN.active = false; RUN.phase = 'idle';
  $('runBtn').disabled = false;
  $('status').textContent = 'IDLE · THE CENTER IS PATIENT';
  const d = document.createElement('div');
  d.className = 's'; d.textContent = '— run complete —';
  $('out').appendChild(d); $('out').scrollTop = $('out').scrollHeight;
}
function runCode(){
  if(RUN.active) return;
  const source = $('editor').value;
  if(!source.trim()) return;
  audioInit();
  $('out').innerHTML = '';
  RUN.active = true; RUN.t = 0;
  RUN.orbiters = planOrbiters(source);
  RUN.outQueue = []; RUN.outFlying = []; RUN.sparks = [];
  RUN.outCount = 0; RUN.pumpT = 0; RUN.stream = null; RUN.emitAcc = 0;
  RUN.phase = REDUCED ? 'burn' : 'infall';
  if(REDUCED) RUN.orbiters.forEach(o=>o.absorbed=true);
  RUN.spinBoost = 2;
  $('runBtn').disabled = true;
  $('status').textContent = 'INFALL · '+RUN.orbiters.length+' CHARACTERS ORBITING FREELY';
  execute(source);
}

/* ============ loop ============ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if(RUN.active) RUN.t += dt;
  draw(now/1000, dt);
  requestAnimationFrame(frame);
}

/* ============ audio ============ */
let AC=null, master=null, muted=false;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.6; master.connect(AC.destination);
  }catch(e){}
}
function blip(f, type){
  if(!AC) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(60,f*0.6), t0+0.12);
  g.gain.setValueAtTime(0.001,t0); g.gain.exponentialRampToValueAtTime(0.08,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t0+0.15);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.17);
}

/* ============ ui ============ */
$('runBtn').addEventListener('click', runCode);
$('editor').addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); runCode(); }
  if(e.key==='Tab'){
    e.preventDefault();
    const el=e.target, s=el.selectionStart;
    el.value = el.value.slice(0,s)+'  '+el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = s+2;
  }
});
$('examples').addEventListener('change', e=>{
  if(EXAMPLES[e.target.value]) $('editor').value = EXAMPLES[e.target.value];
  e.target.value = '';
});
$('muteBtn').addEventListener('click', function(){
  muted=!muted; this.textContent=muted?'🔇':'🔊';
  this.setAttribute('aria-pressed', String(muted));
  if(master) master.gain.setTargetAtTime(muted?0:0.6, AC.currentTime, 0.03);
});
requestAnimationFrame(t=>{ last=t; frame(t); });
</script>
</body>
</html>
