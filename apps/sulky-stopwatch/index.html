<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulky Stopwatch</title>
<meta name="description" content="A stopwatch with feelings. Ignore it and it covers its numbers with its hands until you say something nice.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sulky Stopwatch">
<meta property="og:description" content="A stopwatch with feelings. Ignore it and it hides the time until you say something nice.">
<meta property="og:url" content="https://app.sloppy.live/sulky-stopwatch/">
<meta property="og:image" content="https://app.sloppy.live/sulky-stopwatch/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#24474b">
<link rel="icon" href="https://emojicdn.elk.sh/⏱️">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,400..900,100,1&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --teal:#24474b; --teal2:#1a3538; --enamel:#d9482b; --enamel2:#a8321b; --dial:#f6ecd8; --ink:#2a1c14; --brass:#d8b25a; --brass2:#9c7a2c;
  --cream:#fff7e6; --blush:#f28b7a; --mono:'Azeret Mono',ui-monospace,monospace; --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--cream);font-family:var(--serif);background:
  radial-gradient(60rem 40rem at 50% 30%,rgba(255,231,180,.10),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px),
  repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 14px,transparent 14px 28px),var(--teal);
  display:flex;flex-direction:column;align-items:center;padding:clamp(1rem,4vh,2.5rem) 1rem 1rem;overflow-x:hidden}
h1{margin:0;font:italic 900 clamp(2.2rem,8vw,3.6rem)/.95 var(--serif);font-variation-settings:'SOFT' 100,'WONK' 1;letter-spacing:-.02em;text-align:center;color:var(--cream)}
h1 span{color:#ffb39f}
.sub{margin:.4rem 0 0;font:300 .78rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#cfe3df;text-align:center}
main{display:flex;flex-direction:column;align-items:center;width:100%;max-width:30rem;margin-top:clamp(1rem,3vh,2rem)}
/* the watch */
.watch{position:relative;width:min(78vw,22rem);aspect-ratio:1;margin-top:2.6rem}
.crown{position:absolute;left:50%;top:-2.55rem;transform:translateX(-50%);width:3.6rem;height:2.9rem;border:0;padding:0;cursor:pointer;background:none}
.crown::before{content:'';position:absolute;left:50%;top:.2rem;width:2.4rem;height:1.25rem;transform:translateX(-50%);border-radius:.5rem .5rem .3rem .3rem;
  background:linear-gradient(90deg,var(--brass2),var(--brass) 30%,#f4dd9a 50%,var(--brass) 70%,var(--brass2));box-shadow:0 .2rem 0 var(--brass2);transition:transform .08s}
.crown::after{content:'';position:absolute;left:50%;top:1.45rem;width:1.1rem;height:1.2rem;transform:translateX(-50%);background:linear-gradient(90deg,var(--brass2),var(--brass),var(--brass2))}
.crown:active::before{transform:translate(-50%,.35rem)}
.side{position:absolute;right:-.2rem;top:8%;width:3rem;height:2.9rem;transform:rotate(45deg);border:0;padding:0;cursor:pointer;background:none}
.side::before{content:'';position:absolute;left:.7rem;top:.5rem;width:1.7rem;height:1rem;border-radius:.35rem;background:linear-gradient(var(--brass),var(--brass2));transition:transform .08s}
.side:active::before{transform:translateY(.3rem)}
.case{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,#f0705a,var(--enamel) 42%,var(--enamel2) 100%);
  box-shadow:0 1.2rem 2.4rem rgba(0,0,0,.45),inset 0 -.6rem 1.4rem rgba(0,0,0,.25),inset 0 .5rem 1rem rgba(255,255,255,.2)}
.dial{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fffaf0,var(--dial) 60%,#e8d9bb);overflow:hidden;cursor:pointer;
  box-shadow:inset 0 .35rem .8rem rgba(0,0,0,.25);border:0;padding:0;color:var(--ink)}
.ticks{position:absolute;inset:0;pointer-events:none}
.face{position:absolute;inset:0;pointer-events:none}
.eye{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.lid{transition:transform .4s ease}
.pupil{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.blush{opacity:0;transition:opacity .6s}
.mouth{transition:d .4s ease}
.digits{position:absolute;left:0;right:0;top:44%;text-align:center;font:300 clamp(2rem,10vw,3.1rem)/1 var(--mono);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform .3s,opacity .5s}
.digits small{font-size:.55em;font-weight:200}
.hands{position:absolute;left:0;right:0;top:36%;height:34%;pointer-events:none}
.hand{position:absolute;bottom:0;width:52%;height:100%;transition:transform .55s cubic-bezier(.3,1.45,.5,1)}
.hand.l{left:4%;transform:translate(-30%,185%) rotate(-25deg)}
.hand.r{right:4%;transform:translate(30%,185%) rotate(25deg)}
.mood-sulk .hand.l{transform:translate(8%,0) rotate(9deg)}
.mood-sulk .hand.r{transform:translate(-8%,0) rotate(-9deg)}
.mood-peek .hand.l{transform:translate(-8%,52%) rotate(-12deg)}
.mood-peek .hand.r{transform:translate(8%,8%) rotate(-3deg)}
.mood-sulk .watch,.mood-spite .watch{animation:huff 2.6s ease-in-out infinite}
@keyframes huff{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}60%{transform:rotate(-2deg)}}
.mood-spite .digits{color:#b3261e}
.mood-sulk .digits{opacity:0}
.mood-bored .digits{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg) translateY(.08em)}75%{transform:rotate(2deg)}}
.mood-sleep .digits{opacity:.45}
.zz{position:absolute;right:12%;top:12%;font:italic 900 1.6rem var(--serif);color:var(--ink);opacity:0;pointer-events:none}
.mood-sleep .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:.8}100%{opacity:0;transform:translate(.8rem,-1.6rem) scale(1.1)}}
/* the bubble and the nice box */
.bubble{position:relative;margin-top:1.6rem;min-height:3.4rem;max-width:22rem;padding:.75rem 1.1rem;border-radius:1.2rem;background:var(--cream);color:var(--ink);
  font:italic 600 clamp(1.05rem,4.4vw,1.3rem)/1.3 var(--serif);font-variation-settings:'SOFT' 100,'WONK' 1;text-align:center;box-shadow:0 .4rem 0 rgba(0,0,0,.25)}
.bubble::before{content:'';position:absolute;left:50%;top:-.55rem;width:1.1rem;height:1.1rem;background:var(--cream);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
form.nice{display:flex;gap:.5rem;margin-top:1rem;width:min(100%,22rem)}
form.nice input{flex:1;min-width:0;min-height:2.75rem;padding:.5rem .9rem;border-radius:999px;border:2px solid var(--brass);background:var(--teal2);color:var(--cream);font:400 1rem var(--serif)}
form.nice input::placeholder{color:#a9c4bf}
.btn{min-height:2.75rem;min-width:2.75rem;padding:.5rem 1.1rem;border-radius:999px;border:2px solid var(--brass);background:var(--brass);color:var(--ink);font:700 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream)}
.row{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap;justify-content:center}
ol.laps{list-style:none;margin:1rem 0 0;padding:0;width:min(100%,18rem);font:300 .9rem var(--mono);color:#e7f1ef}
ol.laps li{display:flex;justify-content:space-between;padding:.3rem .2rem;border-bottom:1px dashed rgba(231,241,239,.3)}
ol.laps li b{font-weight:700;color:#ffd4c9}
.keys{margin-top:1.4rem;font:300 .72rem var(--mono);letter-spacing:.06em;color:#cfe3df;text-align:center;transition:opacity 1s}
footer{margin-top:auto;padding-top:1.5rem}
#buildstamp{font:300 .66rem var(--mono);color:#a9c4bf;letter-spacing:.05em}
:focus-visible{outline:3px solid #ffe08a;outline-offset:3px;border-radius:.6rem}
.dial:focus-visible{border-radius:50%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="mood-ok">
<header>
  <h1>Sulky <span>Stopwatch</span></h1>
  <p class="sub">it counts. it has feelings.</p>
</header>
<main>
  <div class="watch">
    <button type="button" class="crown" id="go" aria-label="Start"></button>
    <button type="button" class="side" id="lap" aria-label="Lap"></button>
    <div class="case" aria-hidden="true"></div>
    <button type="button" class="dial" id="dial" aria-label="The stopwatch's face. Pat it.">
      <svg class="ticks" viewBox="0 0 100 100" aria-hidden="true" id="ticks"></svg>
      <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
        <g class="eye" id="eyeL"><ellipse cx="37" cy="30" rx="5.2" ry="6.4" fill="#fff" stroke="#2a1c14" stroke-width="1.4"/><circle class="pupil" cx="37" cy="31" r="2.6" fill="#2a1c14"/>
          <rect class="lid" x="30" y="22.5" width="14" height="15" fill="#f1e4c9" transform="scale(1,0)"/></g>
        <g class="eye" id="eyeR"><ellipse cx="63" cy="30" rx="5.2" ry="6.4" fill="#fff" stroke="#2a1c14" stroke-width="1.4"/><circle class="pupil" cx="63" cy="31" r="2.6" fill="#2a1c14"/>
          <rect class="lid" x="56" y="22.5" width="14" height="15" fill="#f1e4c9" transform="scale(1,0)"/></g>
        <ellipse class="blush" cx="27" cy="39" rx="5" ry="2.6" fill="#f28b7a"/><ellipse class="blush" cx="73" cy="39" rx="5" ry="2.6" fill="#f28b7a"/>
        <path class="mouth" id="mouth" d="M42 75 Q50 81 58 75" fill="none" stroke="#2a1c14" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="digits" id="digits" role="timer" aria-live="off">00:00<small>.00</small></div>
      <div class="hands" aria-hidden="true">
        <svg class="hand l" viewBox="0 0 60 60"><path d="M8 58 C2 40 4 22 14 14 C18 4 28 2 30 10 C34 2 44 4 44 14 C52 12 58 20 54 32 C52 44 46 52 40 58Z" fill="#fff4dc" stroke="#2a1c14" stroke-width="2.4" stroke-linejoin="round"/><path d="M30 10 C30 18 30 24 29 30 M44 14 C42 22 40 26 38 31" fill="none" stroke="#2a1c14" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="hand r" viewBox="0 0 60 60"><path d="M52 58 C58 40 56 22 46 14 C42 4 32 2 30 10 C26 2 16 4 16 14 C8 12 2 20 6 32 C8 44 14 52 20 58Z" fill="#fff4dc" stroke="#2a1c14" stroke-width="2.4" stroke-linejoin="round"/><path d="M30 10 C30 18 30 24 31 30 M16 14 C18 22 20 26 22 31" fill="none" stroke="#2a1c14" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <span class="zz" aria-hidden="true">z</span>
    </button>
  </div>
  <p class="bubble" id="say" aria-live="polite">hi! press my crown and I'll count for you.</p>
  <form class="nice" id="nice" hidden>
    <label class="sr" for="niceIn">Say something nice to it</label>
    <input id="niceIn" maxlength="120" autocomplete="off" placeholder="say something nice…">
    <button class="btn" type="submit">say it</button>
  </form>
  <div class="row">
    <button type="button" class="btn" id="go2">start</button>
    <button type="button" class="btn ghost" id="lap2">lap</button>
  </div>
  <ol class="laps" id="laps" aria-label="Laps"></ol>
  <p class="keys" id="keys">space: start/stop · L: lap · R: reset</p>
</main>
<footer><span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-10-03</span></footer>
<script>
'use strict';
const $ = id => document.getElementById(id), B = document.body;
const say$ = $('say'), dig = $('digits'), nice = $('nice'), niceIn = $('niceIn'), lapsEl = $('laps');
const pick = a => a[Math.random() * a.length | 0];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* dial ticks */
(() => { let h = ''; for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r1 = i % 5 ? 45 : 42.5;
  h += `<line x1="${50 + Math.sin(a) * r1}" y1="${50 - Math.cos(a) * r1}" x2="${50 + Math.sin(a) * 47}" y2="${50 - Math.cos(a) * 47}" stroke="#2a1c14" stroke-width="${i % 5 ? .5 : 1.1}" stroke-linecap="round"/>`; }
  $('ticks').innerHTML = h; })();

/* time: integrated from real-clock deltas, so it can (briefly, out of spite) run backwards */
let el = 0, last = 0, running = false, rate = 1, spiteUntil = 0, laps = [];
function now() { return performance.now(); }
function advance() { const t = now(); if (running) el = Math.max(0, el + (t - last) * rate); last = t; }
function fmt(ms, plain) {
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
  const p = n => String(n).padStart(2, '0'), main = (h ? h + ':' : '') + p(m) + ':' + p(s);
  return plain ? main + '.' + p(cs) : main + '<small>.' + p(cs) + '</small>';
}

/* moods: ok · bored · sulk · peek · spite · sleep */
let mood = 'ok', idle = 0, grudge = 0, pats = [], peekT = 0, hiddenAt = 0;
const EYES = { ok: [0, 0], bored: [0, .55], sulk: [6, .35], peek: [3, .2], spite: [7, .45], sleep: [0, 1] };
const MOUTH = { ok: 'M42 75 Q50 81 58 75', bored: 'M43 77 L57 77', sulk: 'M42 79 Q50 73 58 79', peek: 'M44 77 Q50 80 56 76', spite: 'M41 80 Q50 71 59 80', sleep: 'M46 77 Q50 79 54 77' };
function setMood(m) {
  mood = m; B.className = 'mood-' + m; const [look, lid] = EYES[m];
  document.querySelectorAll('.pupil').forEach(p => p.setAttribute('transform', `translate(${look} ${m === 'sulk' || m === 'spite' ? -1 : 0})`));
  document.querySelectorAll('.lid').forEach(l => l.setAttribute('transform', `translate(0 22.5) scale(1 ${lid}) translate(0 -22.5)`));
  $('mouth').setAttribute('d', MOUTH[m]);
  document.querySelectorAll('.blush').forEach(b => b.style.opacity = m === 'peek' ? 1 : 0);
  const covered = m === 'sulk';
  nice.hidden = !(covered || m === 'spite');
  dig.setAttribute('aria-label', covered ? 'covered by its hands' : '');
}
function say(t) { say$.textContent = t; say$.classList.remove('pop'); void say$.offsetWidth; if (!reduce) say$.classList.add('pop'); }
function touch() { idle = 0; if (mood === 'sleep') { setMood('ok'); say(pick(['huh? oh! I was resting my eyes.', 'I wasn\'t asleep. I was counting… sheep.'])); } else if (mood === 'bored') setMood('ok'); }

const LINES = {
  start: ['off we go!', 'counting! I love counting.', 'tick tock, I\'ve got this.', 'ooh, what are we timing?'],
  stop: t => pick([`stopped at ${t}. nice one.`, `${t}! I counted every bit of it.`, `there: ${t}. was that good?`]),
  bored: ['…still here, by the way.', 'are we timing something important?', 'I\'ve counted all this by myself, you know.', 'hello? anyone?'],
  sulk: ['fine. FINE. you don\'t get to see the numbers.', 'hmph. I\'m still counting. it\'s private now.', 'nobody looks at me, so nobody gets to look.'],
  sulkStopped: ['hmph. stopped. I\'m not telling you the time.', 'stopped. guess how long. go on, guess.'],
  forgive: ['…okay. you can look.', 'i-it\'s not like I WANTED to show you or anything.', 'you mean it? …fine. here. don\'t make it weird.', 'hmph. only because you asked nicely.'],
  more: ['that\'s it? last time you said more.', 'one compliment? after all I\'ve counted?', 'keep going…'],
  neutral: ['that\'s not a compliment, that\'s just words.', 'hmm. try nicer words.', 'is that supposed to be nice?'],
  spite: ['oh yeah? I\'m counting BACKWARDS now.', 'rude. enjoy losing some seconds.', 'wow. backwards it is.'],
  spiteEnd: ['okay, I\'m done being petty. mostly.', 'fine, forwards again. still hurt though.'],
  pat: ['…that tickles. still mad though.', 'hey. stop that. (don\'t stop.)', 'one peek. ONE.'],
  back: ['oh, NOW you\'re back.', 'look who remembered me.', 'you left. I counted the whole time. alone.'],
  reset: ['fresh start. I like fresh starts.', 'back to zero. clean slate.', 'zero! my favourite number.'],
  sleep: ['zzz…'],
};
const lap = (n, d) => d < 0 ? pick([`lap ${n}! faster than the last one, show-off.`, `lap ${n}. ooh, quicker!`]) : pick([`lap ${n}. slower than the last one. just saying.`, `lap ${n}. take your time, I guess.`]);

/* start / stop / lap / reset */
function startStop() {
  advance();
  if (mood === 'sulk' || mood === 'spite') {   /* it obeys, but it won't show you */
    running = !running; last = now(); goUi();
    say(running ? 'counting. not that you care.' : pick(LINES.sulkStopped)); idle = 0; return;
  }
  touch(); running = !running; last = now(); goUi();
  if (running) say(pick(LINES.start)); else say(LINES.stop(fmt(el, true)));
}
function lapReset() {
  advance(); if (mood === 'sulk' || mood === 'spite') { say('no laps for you. hmph.'); idle = 0; return; }
  touch();
  if (running) {
    const prev = laps.length ? laps[laps.length - 1].at : 0, split = el - prev, d = laps.length ? split - laps[laps.length - 1].split : 0;
    laps.push({ at: el, split }); say(laps.length > 1 ? lap(laps.length, d) : 'lap 1! I\'ll remember that one.'); drawLaps();
  } else if (el > 0) { el = 0; laps = []; drawLaps(); say(pick(LINES.reset)); }
  else say('nothing to reset. we haven\'t even started!');
  goUi();
}
function goUi() {
  const lbl = running ? 'stop' : el > 0 ? 'resume' : 'start';
  $('go2').textContent = lbl; $('go').setAttribute('aria-label', lbl);
  const l2 = running ? 'lap' : 'reset'; $('lap2').textContent = l2; $('lap').setAttribute('aria-label', l2);
  $('lap2').disabled = !running && el === 0;
}
function drawLaps() {
  const best = laps.length > 1 ? Math.min(...laps.map(l => l.split)) : -1;
  lapsEl.innerHTML = laps.slice().reverse().map((l, i) => `<li><span>lap ${laps.length - i}</span>${l.split === best ? '<b>' + fmt(l.split, true) + '</b>' : '<span>' + fmt(l.split, true) + '</span>'}</li>`).join('');
}
['go', 'go2'].forEach(id => $(id).addEventListener('click', startStop));
['lap', 'lap2'].forEach(id => $(id).addEventListener('click', lapReset));
addEventListener('keydown', e => {
  if (e.target === niceIn) { idle = 0; return; }
  if (e.code === 'Space') { e.preventDefault(); startStop(); hideKeys(); }
  else if (e.key === 'l' || e.key === 'L') { lapReset(); hideKeys(); }
  else if ((e.key === 'r' || e.key === 'R') && !running) { if (el > 0) lapReset(); hideKeys(); }
});
let keysT = 0; function hideKeys() { if (!keysT) keysT = setTimeout(() => $('keys').style.opacity = 0, 4000); }

/* pat the face: three quick pats while it sulks gets you one peek */
$('dial').addEventListener('click', () => {
  if (mood === 'sulk') {
    const t = now(); pats = pats.filter(p => t - p < 1500); pats.push(t); idle = 0;
    if (pats.length >= 3) { pats = []; setMood('peek'); say(pick(LINES.pat)); peekT = t + 2200; }
    else say(pats.length === 1 ? 'hmph.' : 'hmmph.');
  } else if (mood === 'spite') say('don\'t touch me. I\'m busy being petty.');
  else { touch(); if (!running && el === 0) say('press my crown to start! (that\'s the gold bit on top)'); else say(pick(['hee.', 'that tickles!', 'hi!'])); }
});

/* saying something nice */
const NICE = /\b(nice|love|lovely|great|good|best|beautiful|pretty|cute|sweet|amazing|awesome|wonderful|brilliant|thanks?|thank you|please|sorry|kind|smart|clever|cool|perfect|adorable|friend|buddy|hero|legend|appreciate|proud|favou?rite|precious|gorgeous|fantastic|excellent|star|handsome|charming|lovable|incredible|magnificent|splendid|delightful|wow)\b|❤|♥|<3|💖|💕|🥺|😊|🥰|😍/gi;
const MEAN = /\b(stupid|dumb|hate|ugly|bad|useless|idiot|broken|trash|garbage|worst|shut up|annoying|lame|boring|slow|loser|terrible|awful)\b|🖕|💩/gi;
nice.addEventListener('submit', e => {
  e.preventDefault(); const t = niceIn.value.trim(); niceIn.value = ''; if (!t) return; idle = 0; advance();
  const n = (t.match(NICE) || []).length, m = (t.match(MEAN) || []).length, need = Math.min(3, grudge);
  if (m > n) { rate = -1; spiteUntil = now() + 5000; setMood('spite'); say(pick(LINES.spite)); return; }
  if (!n) { say(pick(LINES.neutral)); return; }
  if (n < need) { say(pick(LINES.more) + (need > 1 ? ` (${need - n} more nice word${need - n > 1 ? 's' : ''})` : '')); return; }
  setMood('peek'); say(pick(LINES.forgive)); peekT = 0; setTimeout(() => { if (mood === 'peek') { setMood('ok'); } }, 1600);
});

/* leaving the tab while it counts */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = now(); return; }
  advance(); if (running && hiddenAt && now() - hiddenAt > 15000 && mood !== 'sulk') { grudge++; setMood('sulk'); say(pick(LINES.back)); }
});

/* the loop: real-time idle, so a slow machine sulks on the same schedule */
let prevT = now();
function frame() {
  const t = now(), dt = Math.min(500, t - prevT); prevT = t; advance(); idle += dt;
  if (mood === 'spite' && t > spiteUntil) { rate = 1; setMood('sulk'); say(pick(LINES.spiteEnd)); }
  if (mood === 'peek' && peekT && t > peekT) { peekT = 0; setMood('sulk'); say('peek over.'); }
