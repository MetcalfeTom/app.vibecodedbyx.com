<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstallInject — a tiny stick-figure story</title>
<meta name="description" content="A minimalist stick-figure animation: one hero, one very large syringe, one very old computer. Fourteen seconds of software installation the hard way.">
<meta property="og:title" content="InstallInject">
<meta property="og:description" content="How updates actually get installed: a stick figure, a giant syringe labelled v2.0, and one brave old computer.">
<meta property="og:url" content="https://sloppy.live/installinject/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/minimalist%20stick%20figure%20injecting%20a%20giant%20syringe%20into%20an%20old%20computer%2C%20paper%20background%2C%20single%20line%20art%2C%20charming?width=1200&height=630&nologo=true&seed=2288">
<link rel="icon" href="https://emojicdn.elk.sh/💉">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{ --paper:#f7f3ea; --ink:#21201d; --accent:#e2552e; --soft:#8b8578; }
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:
    radial-gradient(50rem 30rem at 50% -20%, rgba(226,85,46,.06), transparent 60%), var(--paper);
  color:var(--ink); font-family:'Gochi Hand', 'Comic Sans MS', cursive;
  display:flex; flex-direction:column; align-items:center; padding:1.2rem .8rem 2rem;
}
header{ width:100%; max-width:52rem; display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; }
h1{ margin:0; font-weight:400; font-size:clamp(1.8rem,5vw,2.6rem); }
h1 b{ color:var(--accent); font-weight:400; }
.tag{ font-size:.95rem; color:var(--soft); }
.stage{
  width:100%; max-width:52rem; margin-top:.8rem; position:relative;
  border:3px solid var(--ink); border-radius:1rem; background:#fffdf7; overflow:hidden;
  box-shadow:.5rem .5rem 0 rgba(33,32,29,.12);
}
#film{ width:100%; display:block; }
.controls{
  width:100%; max-width:52rem; display:flex; gap:.6rem; margin-top:.8rem; align-items:center; flex-wrap:wrap;
}
button{
  font:inherit; font-size:1.05rem; min-height:2.9rem; padding:.3rem 1.1rem; cursor:pointer;
  background:#fffdf7; color:var(--ink); border:3px solid var(--ink); border-radius:.7rem;
  box-shadow:.25rem .25rem 0 rgba(33,32,29,.25);
}
button:active{ transform:translate(2px,2px); box-shadow:none; }
button:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
button[aria-pressed="true"]{ background:var(--ink); color:#fffdf7; }
.controls .spacer{ flex:1; }
footer{ width:100%; max-width:52rem; margin-top:.9rem; display:flex; gap:.8rem; flex-wrap:wrap; font-size:.8rem; color:var(--soft); }
footer #buildstamp{ margin-left:auto; opacity:.75; font-size:.72rem; font-family:ui-monospace, monospace; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <h1>Install<b>Inject</b></h1>
  <span class="tag">how updates really get installed. fourteen seconds, one brave computer.</span>
</header>
<main class="stage">
  <canvas id="film" width="960" height="540" role="img" aria-label="Animation: a stick figure wheels in a giant syringe labelled v2.0 and injects it into a grumpy old computer, which installs the update and cheers up."></canvas>
</main>
<div class="controls">
  <button type="button" id="replay">↻ replay</button>
  <button type="button" id="snd" aria-pressed="false">sound: off</button>
  <span class="spacer"></span>
  <span class="tag" id="scene" role="status" aria-live="polite"></span>
</div>
<footer>
  <span>standalone · hand-keyed canvas · nothing here talks to any other app</span>
  <span id="buildstamp" role="note" aria-label="Build information">build v1.0 · 2026-09-11 · 8a503afd7</span>
</footer>

<script>
(function(){
'use strict';
var cv = document.getElementById('film'), cx = cv.getContext('2d');
var W = 960, H = 540, GROUND = 440;
var DUR = 14, t = 0, playing = true, muted = true;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── keyframe helpers ── */
function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function seg(a, b){ return clamp01((t - a) / (b - a)); }                 /* 0→1 across [a,b] */
function ease(v){ return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; }
function lerp(a, b, v){ return a + (b - a) * v; }

/* ── audio: tiny synth, ONLY after the sound toggle (that click is the gesture) ── */
var AC = null;
function blip(f0, f1, dur, type, vol){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var tt = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, tt);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), tt + dur);
    g.gain.setValueAtTime(vol || 0.1, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + dur);
    o.connect(g); g.connect(AC.destination); o.start(tt); o.stop(tt + dur + 0.02);
  }catch(e){}
}
/* sound cues fire when the timeline crosses marks */
var CUES = [
  { at: 0.6, f: function(){ blip(180, 140, 0.08, 'triangle', 0.06); } },   /* footsteps */
  { at: 1.2, f: function(){ blip(180, 140, 0.08, 'triangle', 0.06); } },
  { at: 1.8, f: function(){ blip(190, 150, 0.08, 'triangle', 0.06); } },
  { at: 3.0, f: function(){ blip(520, 470, 0.25, 'sine', 0.05); } },       /* hmm */
  { at: 4.6, f: function(){ blip(90, 240, 0.35, 'sawtooth', 0.05); } },    /* heft squeak */
  { at: 6.0, f: function(){ blip(300, 80, 0.5, 'sine', 0.07); } },         /* plunger */
  { at: 6.8, f: function(){ blip(880, 880, 0.06, 'square', 0.04); } },     /* install beeps */
  { at: 7.4, f: function(){ blip(988, 988, 0.06, 'square', 0.04); } },
  { at: 8.0, f: function(){ blip(1047, 1047, 0.06, 'square', 0.04); } },
  { at: 8.8, f: function(){ [523, 659, 784, 1047].forEach(function(fq, i){ setTimeout(function(){ blip(fq, fq, 0.22, 'triangle', 0.08); }, i * 110); }); } },
  { at: 11.2, f: function(){ blip(660, 990, 0.3, 'sine', 0.06); } }        /* bow whistle */
];
var fired = {};
function runCues(prev, now){
  CUES.forEach(function(c, i){
    if (prev <= c.at && now > c.at && !fired[i]){ fired[i] = true; c.f(); }
  });
}

/* ── drawing primitives ── */
function ln(x1, y1, x2, y2, w){
  cx.lineWidth = w || 4; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
}
function circle(x, y, r, fill){
  cx.beginPath(); cx.arc(x, y, r, 0, 7);
  if (fill){ cx.fill(); } else cx.stroke();
}
/* the hero: joint angles per phase */
function figure(x, y, o){
  /* o: {lean, armL, armR, legPhase, walk, bow} — angles in radians from vertical */
  o = o || {};
  var lean = o.lean || 0, bow = o.bow || 0;
  cx.save();
  cx.translate(x, y);
  cx.rotate(lean);
  cx.strokeStyle = '#21201d';
  var hipY = 0, shY = -52, headY = -78;
  /* legs */
  var lp = o.walk ? Math.sin(o.legPhase || 0) * 0.5 : (o.legSpread || 0.18);
  ln(0, hipY, Math.sin(lp) * 26, hipY + 44);
  ln(0, hipY, Math.sin(-lp) * 26, hipY + 44);
  /* torso (bow bends it) */
  cx.save();
  cx.rotate(bow);
  ln(0, hipY, 0, shY);
  /* arms */
  var aL = o.armL == null ? 0.5 : o.armL, aR = o.armR == null ? -0.5 : o.armR;
  ln(0, shY + 6, Math.sin(aL) * 34, shY + 6 + Math.cos(aL) * 34);
  ln(0, shY + 6, Math.sin(aR) * 34, shY + 6 + Math.cos(aR) * 34);
  /* head */
  cx.beginPath(); cx.arc(0, headY + 12, 14, 0, 7); cx.stroke();
  cx.restore();
  cx.restore();
}
function computer(x, y, mood, progress, glow){
  /* a big old CRT: mood -1 grumpy, 0 flat, 1 happy */
  cx.save();
  cx.translate(x, y);
  cx.strokeStyle = '#21201d'; cx.lineWidth = 5;
  if (glow > 0){
    var g = cx.createRadialGradient(0, -70, 20, 0, -70, 190);
    g.addColorStop(0, 'rgba(226,85,46,' + 0.22 * glow + ')'); g.addColorStop(1, 'rgba(226,85,46,0)');
    cx.fillStyle = g; cx.fillRect(-200, -270, 400, 400);
  }
  cx.fillStyle = '#fffdf7';
  cx.strokeRect(-90, -150, 180, 150);                       /* monitor */
  cx.strokeRect(-60, 0, 120, 26);                            /* base */
  cx.strokeRect(-104, -60, 14, 26);                          /* THE PORT */
  cx.lineWidth = 3;
  /* face */
  var m = mood;
  circle(-32, -105, 6); circle(32, -105, 6);
  if (progress == null){                     /* a computer mid-install is too busy for a mouth */
    cx.beginPath();
    if (m < -0.2) cx.arc(0, -55, 22, Math.PI * 1.2, Math.PI * 1.8);          /* frown */
    else if (m > 0.2) cx.arc(0, -75, 26, Math.PI * 0.15, Math.PI * 0.85);    /* smile */
    else { cx.moveTo(-22, -62); cx.lineTo(22, -62); }
    cx.stroke();
  }
  /* progress bar during install */
  if (progress != null){
    cx.lineWidth = 3;
    cx.strokeRect(-62, -38, 124, 16);
    cx.fillStyle = '#e2552e';
    cx.fillRect(-60, -36, 120 * clamp01(progress), 12);
    cx.fillStyle = '#21201d'; cx.font = '15px Gochi Hand, cursive'; cx.textAlign = 'center';
    cx.fillText('INSTALLING… ' + Math.round(clamp01(progress) * 100) + '%', 0, -46);
  }
  cx.restore();
}
function syringe(x, y, ang, fill, plunger){
  /* barrel with accent liquid; plunger 0 (out) → 1 (pushed) */
  cx.save();
  cx.translate(x, y); cx.rotate(ang);
  cx.strokeStyle = '#21201d'; cx.lineWidth = 4;
  cx.fillStyle = 'rgba(226,85,46,.85)';
  var L = 150, Hh = 34;
  cx.fillRect(-L / 2 + (1 - fill) * L * 0, -Hh / 2 + 3, L * fill, Hh - 6);   /* liquid drains with fill */
  cx.strokeRect(-L / 2, -Hh / 2, L, Hh);
  ln(L / 2, 0, L / 2 + 34, 0, 5);                                            /* needle */
  var px = -L / 2 - 26 + plunger * 40;
  ln(px, -Hh / 2 - 8, px, Hh / 2 + 8, 5);                                    /* plunger tee */
  ln(px, 0, -L / 2, 0, 5);
  cx.fillStyle = '#21201d'; cx.font = '17px Gochi Hand, cursive'; cx.textAlign = 'center';
  cx.fillText('v2.0', 8, -Hh / 2 - 8);
  cx.restore();
}
function wheels(x, y){
  cx.strokeStyle = '#21201d'; cx.lineWidth = 4;
  circle(x - 34, y, 12); circle(x + 34, y, 12);
  ln(x - 50, y - 14, x + 50, y - 14, 4);
}
function confetti(n, seedT){
  for (var i = 0; i < n; i++){
    var a = i * 2.399 + 1, sp = 40 + (i % 7) * 22;
    var life = clamp01((t - 10.4) / 2.2);
    var fx2 = 660 + Math.cos(a) * sp * (0.4 + life), fy = 240 + Math.sin(a) * sp * (0.4 + life) + life * life * 90 - 60;
    cx.fillStyle = i % 3 === 0 ? '#e2552e' : i % 3 === 1 ? '#21201d' : '#c9a227';
    cx.save(); cx.translate(fx2, fy); cx.rotate(a + life * 5); cx.fillRect(-4, -2, 8, 4); cx.restore();
  }
}

var SCENES = [
  [0, 'our hero arrives (with cargo)'],
  [2.5, 'a computer with a problem'],
  [4.2, 'lining up the update'],
  [6, 'injecting version 2.0…'],
  [8.6, 'installation complete'],
  [10.4, 'take a bow'],
  [13.2, 'fin — replay?']
];
function sceneName(){
  for (var i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i][0]) return SCENES[i][1];
  return '';
}

function render(){
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, W, H);
  cx.fillStyle = '#fffdf7'; cx.fillRect(0, 0, W, H);
  /* ground */
  cx.strokeStyle = '#21201d'; ln(30, GROUND, W - 30, GROUND, 4);
  /* computer lives at x=660 */
  var mood = t < 8.6 ? -1 : (t < 9.2 ? lerp(-1, 1, ease(seg(8.6, 9.2))) : 1);
  var installing = t >= 6 && t < 8.6 ? seg(6, 8.6) : (t >= 8.6 && t < 10 ? 1 : null);
  var glow = t >= 8.6 ? Math.min(1, seg(8.6, 9.6)) : 0;
  computer(660, GROUND, mood, installing, glow);

  /* hero + syringe choreography */
  var hx, sx, sy, sang, sfill = 1, splunge = 0;
  if (t < 2.5){                              /* walk in, pulling the wagon */
    var wsg = ease(seg(0, 2.5));
    hx = lerp(-60, 420, wsg);
    figure(hx, GROUND - 44, { walk: true, legPhase: t * 9, armL: 0.9, armR: -0.6 });
    wheels(hx - 120, GROUND - 12);
    syringe(hx - 120, GROUND - 46, 0, 1, 0);
  } else if (t < 4.2){                       /* size up the patient */
    hx = 420;
    var think = Math.sin((t - 2.5) * 4) * 0.18;
    figure(hx, GROUND - 44, { armL: 1.5 + think, armR: -0.3, legSpread: 0.2 });
    wheels(hx - 120, GROUND - 12);
    syringe(hx - 120, GROUND - 46, 0, 1, 0);
  } else if (t < 6){                         /* heft + aim at the port */
    var lift = ease(seg(4.2, 5.4));
    hx = lerp(420, 480, lift);
    sx = lerp(hx - 120, hx + 62, lift);
    sy = lerp(GROUND - 46, GROUND - 60, lift);
    sang = lerp(0, -0.06, lift);
    figure(hx, GROUND - 44, { armL: lerp(0.9, 1.35, lift), armR: lerp(-0.6, 1.1, lift), lean: lerp(0, 0.08, lift), legSpread: 0.3 });
    if (lift < 1) wheels(420 - 120, GROUND - 12);
    syringe(sx, sy, sang, 1, 0);
  } else if (t < 8.6){                       /* THE INJECTION */
    var push = seg(6, 8.6);
    hx = 480;
    figure(hx, GROUND - 44, { armL: 1.35, armR: 1.15, lean: 0.1 + Math.sin(t * 18) * 0.008, legSpread: 0.34 });
    syringe(hx + 62, GROUND - 60, -0.06, 1 - push, push);
  } else if (t < 10.4){                      /* wipe brow, admire */
    hx = 470;
    var wipe = Math.sin((t - 8.6) * 3.2) * 0.4;
    figure(hx, GROUND - 44, { armL: 1.6 + wipe * 0.3, armR: -0.5, legSpread: 0.2 });
    syringe(hx + 66, GROUND - 60, -0.06, 0, 1);
  } else {                                   /* the bow + confetti */
    hx = 470;
    var bowT = t < 11.6 ? ease(seg(10.4, 11.6)) : (t < 12.8 ? 1 : ease(1 - seg(12.8, 13.6)));
    figure(hx, GROUND - 44, { bow: bowT * 0.9, armL: 0.3, armR: -0.3, legSpread: 0.16 });
    syringe(hx + 66, GROUND - 60, -0.06, 0, 1);
    confetti(26, t);
    if (t > 12){
      cx.fillStyle = '#21201d'; cx.font = '34px Gochi Hand, cursive'; cx.textAlign = 'center';
      cx.fillText('INSTALL COMPLETE ✓', 480, 120);
    }
  }
  /* title card early on */
  if (t < 1.4){
    cx.fillStyle = 'rgba(33,32,29,' + (1 - seg(0.8, 1.4)) + ')';
    cx.font = '30px Gochi Hand, cursive'; cx.textAlign = 'center';
    cx.fillText('one update. one syringe.', 480, 110);
  }
  document.getElementById('scene').textContent = sceneName();
}

/* timer-driven loop (probe-friendly) */
var last = Date.now();
(function loop(){
  setTimeout(loop, 33);
  var now = Date.now(), dt = Math.min(0.08, (now - last) / 1000);
  last = now;
  if (!playing) return;
  var prev = t;
  t = Math.min(DUR, t + dt);
  runCues(prev, t);
  if (t >= DUR) playing = false;
  render();
})();
function replay(){
  t = 0; fired = {}; playing = true; last = Date.now();
  render();
}
document.getElementById('replay').addEventListener('click', replay);
var sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', function(){
  muted = !muted;
  sndBtn.setAttribute('aria-pressed', String(!muted));
  sndBtn.textContent = muted ? 'sound: off' : 'sound: on';
  if (!muted) blip(660, 880, 0.12, 'sine', 0.08);
});
if (REDUCED){ t = DUR; playing = false; }
render();
window.__I = { get t(){ return t; }, set t(v){ t = v; fired = {}; render(); }, get playing(){ return playing; },
  set playing(v){ playing = v; }, replay: replay, DUR: DUR, render: render, sceneName: sceneName,
  get muted(){ return muted; }, get AC(){ return AC; } };
})();
</script>
</body></html>
