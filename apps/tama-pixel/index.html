   case 'hatch':{const e=ART.egg.r;spr(e,18,31-e.length);if(p>.3){px(21,20);px(22,21);px(23,20);px(24,21);px(25,20);px(26,21);px(27,20);}if(p>.7&&(A.t*8|0)%2)rect(0,0,W,HT);ground();break;}
   case 'evolve':{const on=(A.t*5|0)%2,f=p<.6?(on?A.d.from:A.d.to):A.d.to,b=ART[f];petAt(f,Math.round((W-b.r[0].length)/2),31-b.r.length,'happy',0);if(p<.6&&on){for(let i=0;i<buf.length;i++)buf[i]^=1;}ground();break;}
   case 'ball':{petAt(P.form,Math.max(0,cx-8),31-h,'happy',1);const bx=Math.round(Math.max(0,cx-8)+w+2+Math.sin(p*Math.PI*2)*4),by=Math.round(26-Math.abs(Math.sin(p*Math.PI*3))*10);spr(BALL5,bx,by);ground();break;}
   case 'gone':{const y=Math.round(31-h-p*34);petAt(P.form,cx,y,'happy',0);txt('<',cx-4,y+4);txt('>',cx+w+1,y+4);if(p>.4)ctxt(lw('bye'),24);break;}
  }}
function draw(){clr();let dark=false;
  if(A)drawAnim();else if(mode==='feed')drawFeed();else if(mode==='games')drawGames();else if(mode==='shop')drawShop();else if(mode==='jump')drawJump();else if(mode==='stats')drawStats();else if(mode==='game')drawGame();else if(mode==='clock')drawClock();
  else if(P.stage==='egg'){const e=ART.egg.r,late=P.stageLife>STAGE_END.egg-8,wob=late?(tick%2?1:-1):((tick%8)===0?1:0);spr(e,18+wob,31-e.length);ground();}
  else if(P.asleep&&!P.light){drawDark();dark=true;}
  else drawMain();
  flush(dark);}
/* ---------- input ---------- */
function press(b){beep(b==='C'?900:1300,.035);const el=$('b'+b);if(el){el.classList.add('down');setTimeout(()=>el.classList.remove('down'),110);}
  if(A||P.stage==='gone')return;
  if(mode==='game')return gameKey(b);
  if(mode==='jump')return jumpKey(b);
  if(mode==='feed'){const L=feedList();if(b==='A')sub=(sub+1)%L.length;else if(b==='B'){mode='main';eat(L[sub]);}else mode='main';return;}
  if(mode==='games'){const L=gameList();if(b==='A')sub=(sub+1)%L.length;else if(b==='B'){mode='main';play(L[sub]);}else mode='main';return;}
  if(mode==='shop'){if(b==='A')sub=(sub+1)%SHOP.length;else if(b==='B')shopBuy(SHOP[sub]);else mode='main';return;}
  if(mode==='stats'){if(b==='C'){mode='main';return;}page=(page+1)%4;if(b==='B'&&page===0)mode='main';return;}
  if(mode==='clock'){mode='main';return;}
  if(P.stage==='egg'&&b==='B'&&sel<0){P.stageLife=Math.min(STAGE_END.egg,P.stageLife+2.5);say(tr('warm'));return;}
  if(b==='A'){sel=(sel+1)%(KEYS.length-1);paintIcons();return;}
  if(b==='B'){if(sel<0){sel=0;paintIcons();return;}use(KEYS[sel]);return;}
  if(b==='C'){if(sel>=0){sel=-1;paintIcons();}else{mode='clock';clockT=0;}}}
function use(k){if(k==='diary'){toggleDiary();return;}if(k==='shop'){mode='shop';sub=0;say(tr('shopHelp'));return;}
  if(P.stage==='egg'){if(k==='stats'){mode='stats';page=0;}else say(tr('egg'));return;}
  switch(k){
   case 'feed':if(P.asleep)return say(tr('sleepingNo',nm()));mode='feed';sub=0;break;
   case 'light':if(P.asleep){P.light=!P.light;say(tr(P.light?'lightOn':'lightOff'));}else if(P.energy<60){P.asleep=true;P.light=false;P.whine=false;say(tr('lightOff'));}else say(tr('notTired',nm()));break;
   case 'play':if(P.asleep)return say(tr('sleepingNo',nm()));if(P.sick)return say(tr('tooSick',nm()));if(P.energy<10)return say(tr('tooTired',nm()));
     mode='games';sub=0;break;
   case 'med':if(!P.sick){say(tr('medNo',nm()));anim('no',1.2);return;}anim('med',1.4,()=>{P.dose++;if(P.dose>=2){P.sick=false;P.dose=0;P.sickT=0;logE('d_cured',P.name);say(tr('cured',nm()));anim('happy',1.4);}else say(tr('dose'));});break;
   case 'bath':if(!P.poop)return say(tr('already'));anim('flush',1.6,()=>{P.poop=0;say(tr('clean'));});break;
   case 'stats':mode='stats';page=0;break;
   case 'scold':if(P.asleep)return say(tr('sleepingNo',nm()));if(P.whine){P.whine=false;P.call=null;P.disc=Math.min(100,P.disc+25);say(tr('scoldOk'));}else{P.happy=Math.max(0,P.happy-1);say(tr('scoldBad',nm()));}anim('scold',1.2);break;
   case 'call':{const n=needNow();say(n?tr('needs',nm(),tr('need'+cap(n))):tr('callNone',nm()));break;}}
  save();}
function play(k){if(k==='lr'){mode='game';G={round:0,wins:0,phase:'ask',t:0,dir:0,win:false};say(tr('gameHelp'));}else if(k==='jump')startJump();
  else if(k==='ball'){if(nowS()-P.ballT<60){say(tr('ballWait',nm()));anim('no',1.2);return;}P.ballT=nowS();say(tr('ballPlay',nm()));anim('ball',2.6,()=>{P.happy=Math.min(4,P.happy+1);save();});tune([[988,.06,0],[1319,.06,.3],[988,.06,.6]]);}}
function startJump(){mode='jump';J={y:0,air:false,jt:0,obs:[],next:1.4,sp:26,score:0,over:0,hit:false};say(tr('jumpHelp'));clearInterval(jIv);jIv=setInterval(jumpTick,40);}
function jumpKey(b){if(!J)return;if(b==='C'){endJump();return;}if(J.over||J.air)return;J.air=true;J.jt=0;beep(1760,.04);}
function jumpTick(){if(!J||mode!=='jump'){clearInterval(jIv);return;}const dt=.04;
  if(J.over){J.over+=dt;if(J.over>2.2)endJump();else draw();return;}
  if(J.air){J.jt+=dt;J.y=Math.round(11*Math.sin(Math.PI*Math.min(1,J.jt/.8)));if(J.jt>=.8){J.air=false;J.y=0;}}
  J.next-=dt;if(J.next<=0){J.obs.push({x:W,s:J.score>4&&Math.random()<.4?SPIKE:ROCK,done:false});J.next=rnd(30,54)/J.sp;}
  const w=ART[P.form].r[0].length,h0=2+(w>>1)-2,h1=h0+4;
  for(const o of J.obs){o.x-=J.sp*dt;const ow=o.s[0].length,x0=Math.round(o.x),x1=x0+ow-1;
    if(!o.done&&x1>=h0&&x0<=h1&&J.y<o.s.length){J.over=.001;J.hit=true;tune([[330,.14,0],[220,.25,.12]]);break;}
    if(!o.done&&x1<h0){o.done=true;J.score++;J.sp=Math.min(44,26+J.score*1.2);beep(2093,.03);if(J.score>=20){J.over=.001;tune([[784,.1,0],[988,.1,.1],[1175,.2,.2]]);break;}}}
  J.obs=J.obs.filter(o=>o.x>-6);draw();}
function endJump(){clearInterval(jIv);if(!J)return;const s=J.score,c=s+(s>=10?5:0);J=null;mode='main';
  if(s>0){P.coins+=c;P.energy=Math.max(0,P.energy-8);P.weight=Math.max(1,P.weight-1);if(s>=6){P.happy=Math.min(4,P.happy+1);say(tr('jumpWin',s,c));}else say(tr('jumpEnd',s,c));logE('d_jump',P.name,s);save();}}
function shopBuy(it){const k=it.k,name=cap(lw(k).toLowerCase());
  if(it.t==='hat'&&P.hats.indexOf(k)>=0){if(P.stage==='egg'){say(tr('egg'));return;}P.hat=P.hat===k?null:k;say(tr(P.hat?'wear':'unwear',nm(),name.toLowerCase()));beep(1568,.05);save();return;}
  if(it.t==='toy'&&P.ball){say(tr('haveBall'));return;}
  if(P.coins<it.p){say(tr('poor'));tune([[330,.12,0],[247,.18,.1]]);return;}
  P.coins-=it.p;if(it.t==='food')P.inv.cake++;else if(it.t==='toy')P.ball=true;else{P.hats.push(k);if(P.stage!=='egg')P.hat=k;}
  say(tr('buy',name,P.coins));logE('d_buy','@'+k);tune([[1319,.06,0],[1760,.06,.07],[2637,.12,.14]]);save();}
function eat(which){if(which==='cake'){if(P.inv.cake<1)return;if(P.hunger>=3.6&&P.happy>=3.6){say(tr('full',nm()));anim('no',1.2);return;}P.inv.cake--;say(tr('cakeAte'));
    anim('eat',2.4,()=>{P.hunger=Math.min(4,P.hunger+1);P.happy=Math.min(4,P.happy+2);P.weight+=3;P.snacks+=2;save();},{food:CAKE});return;}
  if(which==='meal'){if(P.hunger>=3.6){say(tr('full',nm()));anim('no',1.2);return;}say(tr('ate'));anim('eat',2.4,()=>{P.hunger=Math.min(4,P.hunger+1);P.weight+=1;P.poopT=Math.min(P.poopT,rnd(50,110));save();},{food:MEAL});}
  else{say(tr('snack'));anim('eat',2.4,()=>{P.happy=Math.min(4,P.happy+1);P.weight+=2;P.snacks++;save();},{food:SNACK});}}
function gameKey(b){if(b==='C'){mode='main';G=null;return;}if(G.phase!=='ask')return;
  G.dir=Math.random()<.5?-1:1;const guess=b==='A'?-1:1;G.win=guess===G.dir;if(G.win)G.wins++;G.phase='show';G.t=0;
  if(G.win)tune([[1320,.07,0],[1760,.1,.08]]);else tune([[330,.14,0],[247,.2,.12]]);}
function gameTick(dt){if(!G)return;G.t+=dt;
  if(G.phase==='show'&&G.t>1.1){G.round++;G.t=0;G.phase=G.round>=5?'end':'ask';
    if(G.phase==='end'){const w=G.wins,c=w*2+(w>=3?5:0);P.coins+=c;P.energy=Math.max(0,P.energy-6);P.weight=Math.max(1,P.weight-1);logE('d_lr',P.name,w);if(w>=3){P.happy=Math.min(4,P.happy+1);say(tr('gameWin',w,c));tune([[784,.1,0],[988,.1,.1],[1175,.2,.2]]);}else say(tr('gameLose',w,c));save();}}
  else if(G.phase==='end'&&G.t>2.2){mode='main';G=null;}}
/* icons */
function buildIcons(){[[TOPK,'icTop'],[BOTK,'icBot']].forEach(([L,id])=>{const el=$(id);el.innerHTML='';L.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='ic';b.dataset.k=k;
  const im=document.createElement('img');im.alt='';im.src=iconURL(ICONS[k],'#d6e8c8');b.appendChild(im);b.setAttribute('aria-label',WORDS[LANG].icons[k]);
  b.addEventListener('click',()=>{beep(1300,.035);if(A||P.stage==='gone')return;if(mode!=='main'&&mode!=='clock'){if(mode==='game')G=null;if(mode==='jump'){endJump();}mode='main';}sel=KEYS.indexOf(k);paintIcons();use(k);});el.appendChild(b);});});paintIcons();}
function paintIcons(){document.querySelectorAll('.ic').forEach(b=>{const k=b.dataset.k,i=KEYS.indexOf(k);b.classList.toggle('sel',i===sel);b.classList.toggle('call',k==='call'&&!!P.call);b.setAttribute('aria-pressed',i===sel?'true':'false');});}
/* sound */
let SND=ls(KEY+'-snd')!=='0',AC=null;
function beep(f,d,when,type){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+(when||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||'square';o.frequency.value=f;gn.gain.setValueAtTime(.035,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
function tune(n){n.forEach(q=>beep(q[0],q[1],q[2]));}
function alarm(){tune([[2093,.07,0],[2093,.07,.13],[2093,.07,.26]]);const t=$('toy');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){t.classList.remove('buzz');void t.offsetWidth;t.classList.add('buzz');}}
function say(s){$('say').textContent=s;}
function toggleDiary(){const d=$('diary');d.hidden=!d.hidden;if(!d.hidden){renderDiary();d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}}
function dArg(v){return typeof v==='string'&&v[0]==='@'?cap(lw(v.slice(1)).toLowerCase()):typeof v==='string'&&/^[A-Z0-9]+$/.test(v)?cap(v.toLowerCase()):v;}
function renderDiary(){const d=$('diary');d.innerHTML='';const hd=document.createElement('div');hd.className='dh';const st=document.createElement('strong');st.textContent=tr('diaryT',nm());
  const x=document.createElement('button');x.type='button';x.className='chip';x.textContent='✕';x.setAttribute('aria-label',tr('close'));x.addEventListener('click',()=>{d.hidden=true;});hd.append(st,x);
  const f=document.createElement('form'),lb=document.createElement('label'),inp=document.createElement('input'),bt=document.createElement('button');lb.htmlFor='nmIn';lb.textContent=tr('nameL');
  inp.id='nmIn';inp.maxLength=6;inp.autocomplete='off';inp.spellcheck=false;inp.value=P.name;bt.type='submit';bt.className='chip';bt.textContent=tr('nameB');f.append(lb,inp,bt);
  f.addEventListener('submit',e=>{e.preventDefault();const v=inp.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if(v&&v!==P.name){P.name=v;logE('d_name',v);save();say(tr('renamed',nm()));renderDiary();}});
  const ol=document.createElement('ol'),L=P.log.slice().reverse(),today=new Date().toDateString();
  if(!L.length){const li=document.createElement('li');li.textContent=tr('diaryEmpty');ol.appendChild(li);}
  L.forEach(e=>{const li=document.createElement('li'),tm=document.createElement('time'),dt=new Date(e.t);tm.dateTime=dt.toISOString();
    tm.textContent=(dt.toDateString()===today?'':dt.toLocaleDateString(LANG,{day:'numeric',month:'short'})+' · ')+dt.toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'});
    li.append(tm,document.createTextNode(tr(e.k,...(e.a||[]).map(dArg))));ol.appendChild(li);});
  d.append(hd,f,ol);}
/* ---------- loop ---------- */
function loop(){const ms=Date.now();let dt=Math.min(3600,(ms-lastMs)/1000);lastMs=ms;tick++;
  while(dt>0){const d=Math.min(5,dt);step(d,false);dt-=d;if(A){A.t+=d;if(A.t>=A.dur){const f=A.onEnd;A=null;if(f)f();}}gameTick(d);}
  if(mode==='clock'&&(clockT+=.2)>4)mode='main';
  if(tick%3===0&&!A&&mode==='main'&&!P.asleep&&P.stage!=='egg'){const r=Math.random();if(r<.35){pX+=dir;look=dir;}else if(r<.45){dir=-dir;look=dir;}else if(r<.6)look=0;bob=bob?0:1;}
  blink=(tick%17===0)?1:0;
  if(tick%5===0)paintIcons();if(tick%25===0)save();
  draw();}
/* ---------- away time ---------- */
(function(){const el=Math.min(nowS()-(P.lastT||nowS()),12*3600);if(el>30){P.offMist=0;let r=el;while(r>0){const d=Math.min(5,r);step(d,true);r-=d;}
  const h=Math.floor(el/3600),m=Math.floor(el%3600/60);say(tr('back',h?h+' h '+m+' min':m+' min'));}
  else say(P.stage==='egg'?tr('egg'):tr(P.happy>=2?'callNone':'bored',nm()));})();
/* ---------- wiring ---------- */
['A','B','C'].forEach(b=>$('b'+b).addEventListener('click',()=>press(b)));
addEventListener('keydown',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' ')))return;const k=e.key;
  if(mode==='jump'&&(k==='ArrowUp'||k===' '||k==='Enter'||k==='a'||k==='A'||k==='b'||k==='B')){e.preventDefault();press('B');return;}
  if(mode==='game'&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();press(k==='ArrowLeft'?'A':'B');}
  else if(k==='ArrowLeft'&&mode==='main'&&!A){e.preventDefault();sel=sel<=0?KEYS.length-2:sel-1;paintIcons();beep(1300,.035);}
  else if(k==='a'||k==='A'||k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();press('A');}
  else if(k==='b'||k==='B'||k==='Enter'||k===' '){e.preventDefault();press('B');}
  else if(k==='c'||k==='C'||k==='Escape'||k==='Backspace'){e.preventDefault();press('C');}});
cv.addEventListener('pointerdown',e=>{if(mode==='jump'){e.preventDefault();press('B');}});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(mode==='jump')return;
  if(mode==='game'){press(x<.5?'A':'B');return;}
  if(mode!=='main'||A||P.stage==='egg'||P.asleep||P.stage==='gone')return;
  if(nowS()-P.patT>20){P.patT=nowS();P.happy=Math.min(4,P.happy+.25);say(tr('pet',nm()));anim('happy',1.2);beep(1568,.06);save();}});
$('langBtn').addEventListener('click',()=>{LANG=LANG==='es'?'en':'es';ls(KEY+'-lang',LANG);document.documentElement.lang=LANG;$('help').innerHTML=tr('help');if(!$('diary').hidden)renderDiary();buildIcons();say(tr(P.stage==='egg'?'egg':'callNone',nm()));});
$('sndBtn').addEventListener('click',()=>{SND=!SND;ls(KEY+'-snd',SND?'1':'0');$('sndBtn').setAttribute('aria-pressed',String(SND));if(SND)beep(1300,.05);});
$('helpBtn').addEventListener('click',()=>{const h=$('help'),o=h.hidden;h.hidden=!o;$('helpBtn').setAttribute('aria-expanded',String(o));});
addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
document.documentElement.lang=LANG;$('help').innerHTML=tr('help');$('sndBtn').setAttribute('aria-pressed',String(SND));$('sndBtn').setAttribute('aria-label','Sound');$('helpBtn').setAttribute('aria-label','Help');$('langBtn').setAttribute('aria-label','Idioma / Language');
buildIcons();draw();setInterval(loop,200);
window.__T={get P(){return P;},set P(v){P=v;},press:press,use:use,step:step,grow:grow,get mode(){return mode;},get A(){return A;},get G(){return G;},get J(){return J;},needNow:needNow,play:play,shopBuy:shopBuy,SHOP:SHOP};
