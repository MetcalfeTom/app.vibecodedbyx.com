<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loose Leaf — a paper planner that breaks big tasks into small steps</title>
<meta name="description" content="A handwritten paper planner. Break homework and work into nested steps, run focus timers, and earn tally marks for every session.">
<meta property="og:title" content="Loose Leaf — paper planner with focus timers">
<meta property="og:description" content="Break big tasks into small handwritten steps, run focus timers, earn tally marks.">
<meta property="og:url" content="https://sloppy.live/loose-leaf/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/cozy%20cream%20ruled%20notebook%20page%20planner%20on%20warm%20wooden%20desk%2C%20handwritten%20tasks%2C%20red%20margin%20line%2C%20washi%20tape%2C%20pencil%2C%20soft%20light%2C%20flat%20illustration?width=1200&height=630&seed=8341&nologo=true&model=flux">
<link rel="icon" href="https://emojicdn.elk.sh/📝">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#3f4a44; --paper:#f7f1df; --paper2:#f2ead2; --rule:#b9cbd8; --margin:#d96c5f;
  --ink:#26323f; --ink2:#51606f; --blue:#2d5aa8; --red:#b8442f; --green:#43703c;
  --tape:rgba(214,177,96,.55);
}
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:'Kalam',cursive;
  background:
    radial-gradient(80rem 40rem at 50% -10%, rgba(255,255,255,.07), transparent 60%),
    repeating-linear-gradient(94deg, transparent 0 7rem, rgba(0,0,0,.05) 7rem 7.2rem),
    var(--desk);
  display:flex; flex-direction:column; align-items:center;
  padding:1.2rem .6rem 2.5rem;
}
main{ width:100%; max-width:46rem; }
/* ── the sheet ── */
#sheet{
  position:relative; background:var(--paper); border-radius:.2rem;
  transform:rotate(-.35deg);
  box-shadow:0 .3rem 0 rgba(0,0,0,.12), 0 1.2rem 2.4rem rgba(0,0,0,.35);
  padding:1.4rem 1.6rem 2.2rem 4.2rem; min-height:34rem;
}
#sheet::before{ /* red margin */
  content:''; position:absolute; top:0; bottom:0; left:3.3rem; width:2px; background:var(--margin); opacity:.55;
}
#sheet::after{ /* punched holes */
  content:''; position:absolute; left:1.05rem; top:6rem; width:1.05rem; height:1.05rem; border-radius:50%;
  background:var(--desk); box-shadow:inset 0 2px 3px rgba(0,0,0,.4), 0 11rem 0 var(--desk), 0 22rem 0 var(--desk);
}
.tape{
  position:absolute; top:-.8rem; left:50%; width:8.5rem; height:1.7rem; background:var(--tape);
  transform:translateX(-50%) rotate(-2deg); border-radius:.15rem;
  box-shadow:0 1px 3px rgba(0,0,0,.15); pointer-events:none;
}
header h1{
  font-family:'Caveat',cursive; font-weight:700; font-size:3.2rem; line-height:1; margin:0;
  color:var(--ink);
}
header h1 em{ font-style:normal; color:var(--blue); }
#dateline{ margin:.1rem 0 0; color:var(--ink2); font-size:1rem; }
/* ── divider tabs ── */
#tabs{ display:flex; gap:.5rem; margin:1.1rem 0 .2rem; padding:0; list-style:none; }
#tabs button{
  font-family:'Caveat',cursive; font-weight:600; font-size:1.35rem; letter-spacing:.02em;
  min-height:2.75rem; padding:.3rem 1.1rem; cursor:pointer;
  color:var(--ink2); background:var(--paper2); border:1.5px solid #d8ceb2; border-bottom:none;
  border-radius:.6rem .6rem 0 0; transform:translateY(2px);
}
#tabs button[aria-selected="true"]{
  color:var(--ink); background:var(--paper); transform:translateY(0);
  border-color:#c9bd9c; box-shadow:0 -2px 4px rgba(0,0,0,.05);
}
#tabs button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
#tabs .hw[aria-selected="true"]{ border-top:3px solid var(--blue); }
#tabs .wk[aria-selected="true"]{ border-top:3px solid var(--red); }
#pagerule{ border:none; border-top:1.5px solid #c9bd9c; margin:0 0 .6rem; }
/* ── add line ── */
#addform{ display:flex; gap:.5rem; align-items:center; margin:.4rem 0 .8rem; }
#addform input{
  flex:1; font-family:'Caveat',cursive; font-size:1.5rem; color:var(--blue);
  background:transparent; border:none; border-bottom:2px dashed #b6a982; padding:.25rem .2rem;
  min-height:2.75rem;
}
#addform input::placeholder{ color:#a29a7f; }
#addform input:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; border-radius:.2rem; }
#addform button{
  font-family:'Caveat',cursive; font-weight:700; font-size:1.4rem; color:var(--paper);
  background:var(--blue); border:none; border-radius:.5rem; min-height:2.75rem; min-width:2.75rem;
  padding:.2rem .9rem; cursor:pointer; transform:rotate(1deg);
}
#addform button:hover{ filter:brightness(1.1); }
#addform button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
/* ── task list ── */
ul.tlist{ list-style:none; margin:0; padding:0; }
ul.tlist ul.tlist{ margin-left:1.7rem; }
.trow{
  display:flex; align-items:center; gap:.45rem;
  border-bottom:1px solid var(--rule); padding:.22rem 0;
}
ul.tlist ul.tlist .trow{ border-bottom-style:dotted; }
.tcheck{
  appearance:none; -webkit-appearance:none; width:1.5rem; height:1.5rem; min-width:1.5rem; margin:0;
  border:2px solid var(--ink2); border-radius:.3rem .5rem .3rem .55rem; background:transparent;
  cursor:pointer; position:relative; transform:rotate(-2deg);
}
.tcheck:checked::after{
  content:''; position:absolute; inset:-6px -8px -2px -2px;
  background:
    linear-gradient(58deg, transparent 46%, var(--green) 46% 54%, transparent 54%) no-repeat 18% 78% / 45% 60%,
    linear-gradient(-55deg, transparent 46%, var(--green) 46% 54%, transparent 54%) no-repeat 78% 30% / 75% 95%;
}
.tcheck:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
.ttext{
  flex:1; font-size:1.25rem; line-height:1.25; color:var(--ink); cursor:text;
  background:transparent; border:none; font-family:'Kalam',cursive; padding:.15rem .2rem; min-width:0;
}
.ttext:focus-visible{ outline:3px solid var(--blue); outline-offset:1px; border-radius:.2rem; }
li.done > .trow .ttext{ color:#96917e; text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--ink2); }
.frac{ font-size:.85rem; color:var(--ink2); white-space:nowrap; }
.tally{ display:flex; align-items:center; gap:.2rem; }
.tally svg{ display:block; }
.tbtn{
  font-family:'Kalam',cursive; font-size:1rem; color:var(--ink2); background:transparent;
  border:none; cursor:pointer; min-width:2.75rem; min-height:2.75rem; border-radius:.4rem;
  display:inline-flex; align-items:center; justify-content:center; padding:0;
}
.tbtn:hover{ background:rgba(0,0,0,.06); color:var(--ink); }
.tbtn:focus-visible{ outline:3px solid var(--blue); outline-offset:1px; }
.tbtn.del:hover{ color:var(--red); }
#empty{ color:var(--ink2); font-family:'Caveat',cursive; font-size:1.5rem; transform:rotate(-1deg); margin:1.4rem .2rem; }
/* ── footer stats ── */
#stats{
  margin:1.4rem 0 0; color:var(--ink2); font-size:.95rem; display:flex; gap:1.2rem; flex-wrap:wrap; align-items:center;
}
#mutebtn{ margin-left:auto; }
/* ── focus overlay ── */
#focus[hidden]{ display:none !important; }
#focus{
  position:fixed; inset:0; z-index:20; background:rgba(30,36,33,.78);
  display:flex; align-items:center; justify-content:center; padding:1rem;
}
#focuscard{
  background:var(--paper); border-radius:.3rem; padding:2rem 2.4rem; max-width:26rem; width:100%;
  transform:rotate(.5deg); text-align:center; position:relative;
  box-shadow:0 1.4rem 3rem rgba(0,0,0,.5);
}
#focuscard .tape{ width:6.5rem; }
#focustask{ font-family:'Caveat',cursive; font-size:1.7rem; margin:.2rem 0 0; color:var(--ink); overflow-wrap:break-word; }
#focuslabel{ font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); margin:0; }
#clock{ font-family:'Caveat',cursive; font-weight:700; font-size:5.5rem; line-height:1.1; color:var(--blue); margin:.6rem 0 .2rem; }
#focusbar{ height:.45rem; background:#e4dcc2; border-radius:.3rem; overflow:hidden; margin:0 0 1.1rem; }
#focusbar div{ height:100%; width:0%; background:var(--blue); border-radius:.3rem; }
#focusbtns{ display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; }
#focusbtns button{
  font-family:'Caveat',cursive; font-weight:600; font-size:1.25rem; min-height:2.75rem; padding:.3rem 1rem;
  border-radius:.5rem; border:2px solid var(--ink2); background:transparent; color:var(--ink); cursor:pointer;
}
#focusbtns button:hover{ background:rgba(0,0,0,.06); }
#focusbtns button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
#focusbtns .go{ background:var(--blue); border-color:var(--blue); color:var(--paper); }
#focusnote{ min-height:1.4rem; font-family:'Caveat',cursive; font-size:1.3rem; color:var(--green); margin:.6rem 0 0; }
.lenrow{ display:flex; gap:.5rem; justify-content:center; margin:0 0 .9rem; }
.lenrow button{
  font-family:'Kalam',cursive; font-size:1rem; min-height:2.75rem; padding:.3rem .8rem;
  border:1.5px solid var(--ink2); border-radius:.45rem; background:transparent; color:var(--ink); cursor:pointer;
}
.lenrow button:hover{ background:rgba(0,0,0,.06); }
.lenrow button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
.lenrow button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (max-width:600px){
  #sheet{ padding-left:3.4rem; padding-right:1rem; transform:none; }
  header h1{ font-size:2.6rem; }
  #clock{ font-size:4.2rem; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
<div id="sheet">
  <span class="tape" aria-hidden="true"></span>
  <header>
    <h1>Loose <em>Leaf</em></h1>
    <p id="dateline"></p>
  </header>
  <nav aria-label="Planner sections">
    <div id="tabs" role="tablist">
      <button type="button" class="hw" role="tab" id="tab-homework" aria-selected="true" aria-controls="pane">homework</button>
      <button type="button" class="wk" role="tab" id="tab-work" aria-selected="false" aria-controls="pane">work</button>
    </div>
  </nav>
  <hr id="pagerule">
  <div id="pane" role="tabpanel" aria-labelledby="tab-homework">
    <form id="addform">
      <label class="visually-hidden" for="addinput">Write a task</label>
      <input id="addinput" type="text" maxlength="140" placeholder="write a task, press enter…" autocomplete="off">
      <button type="submit" aria-label="Add task">＋ add</button>
    </form>
    <ul class="tlist" id="rootlist"></ul>
    <p id="empty" hidden>a blank page. write something down —</p>
  </div>
  <div id="stats" aria-live="polite">
    <span id="st-done"></span>
    <span id="st-focus"></span>
    <button type="button" class="tbtn" id="mutebtn" aria-pressed="false" title="chime on focus finish">🔔</button>
  </div>
</div>
</main>

<div id="focus" role="dialog" aria-modal="true" aria-labelledby="focustask" hidden>
  <div id="focuscard">
    <span class="tape" aria-hidden="true"></span>
    <p id="focuslabel">focusing on</p>
    <p id="focustask"></p>
    <div class="lenrow" id="lenrow">
      <button type="button" data-min="15" aria-pressed="false">15 min</button>
      <button type="button" data-min="25" aria-pressed="true">25 min</button>
      <button type="button" data-min="45" aria-pressed="false">45 min</button>
    </div>
    <p id="clock" aria-live="off">25:00</p>
    <div id="focusbar" aria-hidden="true"><div id="focusfill"></div></div>
    <p id="focusnote" aria-live="polite"></p>
    <div id="focusbtns">
      <button type="button" class="go" id="f-start">start</button>
      <button type="button" id="f-pause" hidden>pause</button>
      <button type="button" id="f-quit">close</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var KEY='loose-leaf-v1', MAX_DEPTH=3;

/* ── state ── */
var S={ tasks:[], nextId:1, tab:'homework', focusDone:0, mute:false };
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw);
      if(d && Array.isArray(d.tasks)){ S=d; if(!S.tab) S.tab='homework'; }
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ── task model: {id, text, cat, done, pomos, subs:[]} ── */
function makeTask(text, cat){ return { id:S.nextId++, text:text, cat:cat, done:false, pomos:0, subs:[] }; }
function addTask(text, cat){
  var t=makeTask(text, cat||S.tab);
  S.tasks.push(t); save(); render(); return t;
}
function findTask(id, list, depth){
  list=list||S.tasks; depth=depth||1;
  for(var i=0;i<list.length;i++){
    if(list[i].id===id) return { t:list[i], list:list, i:i, depth:depth };
    var hit=findTask(id, list[i].subs, depth+1);
    if(hit) return hit;
  }
  return null;
}
function addSub(parentId, text){
  var hit=findTask(parentId);
  if(!hit || hit.depth>=MAX_DEPTH) return null;
  var t=makeTask(text, hit.t.cat);
  hit.t.subs.push(t);
  hit.t.done=false;
  save(); render(); return t;
}
function setDone(id, done){
  var hit=findTask(id); if(!hit) return;
  function cascade(t, v){ t.done=v; t.subs.forEach(function(s){ cascade(s,v); }); }
  cascade(hit.t, done);
  autoComplete(S.tasks);
  save(); render();
}
function autoComplete(list){
  list.forEach(function(t){
    autoComplete(t.subs);
    if(t.subs.length) t.done=t.subs.every(function(s){ return s.done; });
  });
}
function editTask(id, text){
  var hit=findTask(id); if(!hit) return;
  hit.t.text=text; save();
}
function delTask(id){
  var hit=findTask(id); if(!hit) return;
  hit.list.splice(hit.i,1);
  autoComplete(S.tasks);
  save(); render();
}
function countDone(list){
  var n=0;
  list.forEach(function(t){ if(t.done) n++; n+=countDone(t.subs); });
  return n;
}
function countAll(list){
  var n=0;
  list.forEach(function(t){ n+=1+countAll(t.subs); });
  return n;
}

/* ── render ── */
function tallySVG(n){
  var wrap=document.createElement('span'); wrap.className='tally';
  if(!n) return wrap;
  wrap.setAttribute('title', n+' focus session'+(n>1?'s':''));
  var groups=Math.floor(n/5), rest=n%5, gi;
  function grp(count, slash){
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','22'); svg.setAttribute('height','16'); svg.setAttribute('aria-hidden','true');
    for(var i=0;i<count;i++){
      var l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',3+i*5); l.setAttribute('y1',2+(i%2)); l.setAttribute('x2',2.4+i*5); l.setAttribute('y2',14-(i%2));
      l.setAttribute('stroke','#b8442f'); l.setAttribute('stroke-width','1.7'); l.setAttribute('stroke-linecap','round');
      svg.appendChild(l);
    }
    if(slash){
      var sl=document.createElementNS('http://www.w3.org/2000/svg','line');
      sl.setAttribute('x1','0'); sl.setAttribute('y1','12'); sl.setAttribute('x2','20'); sl.setAttribute('y2','4');
      sl.setAttribute('stroke','#b8442f'); sl.setAttribute('stroke-width','1.7'); sl.setAttribute('stroke-linecap','round');
      svg.appendChild(sl);
    }
    return svg;
  }
  for(gi=0;gi<groups;gi++) wrap.appendChild(grp(4,true));
  if(rest) wrap.appendChild(grp(rest,false));
  return wrap;
}
function renderList(list, depth, ul){
  list.forEach(function(t){
    var li=document.createElement('li');
    if(t.done) li.className='done';
    li.dataset.id=t.id;
    var row=document.createElement('div'); row.className='trow';

    var cb=document.createElement('input');
    cb.type='checkbox'; cb.className='tcheck'; cb.checked=t.done;
    cb.setAttribute('aria-label', (t.done?'Mark not done: ':'Mark done: ')+t.text);
    cb.addEventListener('change', function(){ setDone(t.id, cb.checked); });
    row.appendChild(cb);

    var tx=document.createElement('input');
    tx.type='text'; tx.className='ttext'; tx.value=t.text; tx.maxLength=140;
    tx.setAttribute('aria-label','Edit task text');
    tx.addEventListener('change', function(){
      var v=tx.value.trim();
      if(v) editTask(t.id, v); else tx.value=t.text;
    });
    tx.addEventListener('keydown', function(e){ if(e.key==='Enter') tx.blur(); });
    row.appendChild(tx);

    if(t.subs.length){
      var fr=document.createElement('span'); fr.className='frac';
      fr.textContent=t.subs.filter(function(s){return s.done;}).length+'/'+t.subs.length;
      row.appendChild(fr);
    }
    row.appendChild(tallySVG(t.pomos));

    if(depth<MAX_DEPTH){
      var plus=document.createElement('button');
      plus.type='button'; plus.className='tbtn'; plus.textContent='↳＋';
      plus.title='break into a smaller step';
      plus.setAttribute('aria-label','Add a step under: '+t.text);
      plus.addEventListener('click', function(){
        var txt=prompt('smaller step for “'+t.text+'”:');
        if(txt && txt.trim()) addSub(t.id, txt.trim().slice(0,140));
      });
      row.appendChild(plus);
    }
    var fo=document.createElement('button');
    fo.type='button'; fo.className='tbtn'; fo.textContent='⏱';
    fo.title='focus on this task';
    fo.setAttribute('aria-label','Start a focus timer for: '+t.text);
    fo.addEventListener('click', function(){ openFocus(t.id); });
    row.appendChild(fo);

    var del=document.createElement('button');
    del.type='button'; del.className='tbtn del'; del.textContent='✕';
    del.title='cross it out forever';
    del.setAttribute('aria-label','Delete: '+t.text);
    del.addEventListener('click', function(){ delTask(t.id); });
    row.appendChild(del);

    li.appendChild(row);
    if(t.subs.length){
      var sub=document.createElement('ul'); sub.className='tlist';
      renderList(t.subs, depth+1, sub);
      li.appendChild(sub);
    }
    ul.appendChild(li);
  });
}
function render(){
  var root=$('rootlist'); root.textContent='';
  var vis=S.tasks.filter(function(t){ return t.cat===S.tab; });
  renderList(vis, 1, root);
  $('empty').hidden=vis.length>0;
  ['homework','work'].forEach(function(c){
    $('tab-'+c).setAttribute('aria-selected', String(S.tab===c));
  });
  $('pane').setAttribute('aria-labelledby','tab-'+S.tab);
  var doneN=countDone(S.tasks), allN=countAll(S.tasks);
  $('st-done').textContent='✎ '+doneN+'/'+allN+' crossed off';
  $('st-focus').textContent='⏱ '+S.focusDone+' focus session'+(S.focusDone===1?'':'s');
  $('mutebtn').textContent=S.mute?'🔕':'🔔';
  $('mutebtn').setAttribute('aria-pressed', String(S.mute));
}

/* ── tabs ── */
['homework','work'].forEach(function(c){
  $('tab-'+c).addEventListener('click', function(){ S.tab=c; save(); render(); });
});

/* ── add form ── */
$('addform').addEventListener('submit', function(e){
  e.preventDefault();
  var v=$('addinput').value.trim();
  if(!v) return;
  addTask(v.slice(0,140), S.tab);
  $('addinput').value='';
  $('addinput').focus();
});

/* ── focus timer ── */
var FO={ open:false, taskId:null, total:25*60, left:25*60, running:false };
function fmt(sec){
  sec=Math.max(0, Math.ceil(sec));
  var m=Math.floor(sec/60), s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function focusUI(){
  $('clock').textContent=fmt(FO.left);
  $('focusfill').style.width=(100*(1-FO.left/FO.total))+'%';
  $('f-start').hidden=FO.running || FO.left<=0;
  $('f-pause').hidden=!FO.running;
}
function openFocus(taskId){
  var hit=findTask(taskId); if(!hit) return;
  FO.open=true; FO.taskId=taskId; FO.running=false;
  var min=+(document.querySelector('#lenrow [aria-pressed="true"]').dataset.min);
  FO.total=FO.left=min*60;
  $('focustask').textContent=hit.t.text;
  $('focusnote').textContent='';
  $('f-start').textContent='start';
  $('focus').hidden=false;
  focusUI();
  $('f-start').focus();
}
function closeFocus(){
  FO.open=false; FO.running=false;
  $('focus').hidden=true;
}
function finishFocus(){
  FO.running=false; FO.left=0;
  var hit=findTask(FO.taskId);
  if(hit){ hit.t.pomos++; }
  S.focusDone++;
  save(); render(); focusUI();
  $('focusnote').textContent='session done — one more tally ✓';
  $('f-start').textContent='again';
  $('f-start').hidden=false;
  chime();
}
function tickFocus(dt){
  if(!FO.open || !FO.running) return;
  FO.left-=dt;
  if(FO.left<=0){ finishFocus(); return; }
  focusUI();
}
var lastTick=null;
setInterval(function(){
  var now=Date.now();
  if(lastTick!==null && FO.running) tickFocus((now-lastTick)/1000);
  lastTick=now;
}, 250);
$('lenrow').addEventListener('click', function(e){
  var b=e.target.closest('button[data-min]'); if(!b) return;
  Array.prototype.forEach.call(document.querySelectorAll('#lenrow button'), function(x){
    x.setAttribute('aria-pressed', String(x===b));
  });
  if(!FO.running){ FO.total=FO.left=(+b.dataset.min)*60; focusUI(); }
});
$('f-start').addEventListener('click', function(){
  if(FO.left<=0){ var min=+(document.querySelector('#lenrow [aria-pressed="true"]').dataset.min); FO.total=FO.left=min*60; $('focusnote').textContent=''; }
  FO.running=true; lastTick=Date.now(); focusUI();
});
$('f-pause').addEventListener('click', function(){ FO.running=false; focusUI(); });
$('f-quit').addEventListener('click', closeFocus);

/* ── chime ── */
var AC=null;
function chime(){
  if(S.mute) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    /* calm chime (chat request): low sine bell tones, slow spacing, quiet peak,
       long soft decay, warmed by a gentle lowpass — no bright attack */
    var lp=AC.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=1100; lp.Q.value=0.4;
    lp.connect(AC.destination);
    [220.0,329.63,440.0].forEach(function(f,i){
      var t0=AC.currentTime+i*0.45;
      [[f,0.045],[f*2,0.012]].forEach(function(v){
        var o=AC.createOscillator(), g=AC.createGain();
        o.type='sine'; o.frequency.value=v[0];
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(v[1], t0+0.09);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+2.6);
        o.connect(g); g.connect(lp);
        o.start(t0); o.stop(t0+2.7);
      });
    });
  }catch(e){}
}
