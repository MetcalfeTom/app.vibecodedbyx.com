<style>
:root{ --sky:#2faee0; --sky2:#8fd8f5; --night:#071425; --ink:#f4f8fb; --gold:#ffd23f; --red:#ff4d4d; --disp:'Big Shoulders Display', 'Arial Narrow', sans-serif; --body:'Familjen Grotesk', 'Trebuchet MS', sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--night); color:var(--ink); font-family:var(--body); overflow:hidden; -webkit-tap-highlight-color:transparent; }
canvas#gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
.vig{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,8,18,.55) 100%); }
button{ font:inherit; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
#hud{ position:fixed; left:50%; top:max(.6rem, env(safe-area-inset-top)); transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:.7rem; padding:.45rem .9rem; border-radius:.6rem;
  background:linear-gradient(180deg, rgba(7,20,37,.88), rgba(4,12,24,.92)); border:1px solid rgba(143,216,245,.25); box-shadow:0 .4rem 1.6rem rgba(0,0,0,.45); pointer-events:none; white-space:nowrap; }
#hud[hidden]{ display:none; }
#hud.fk #dotsB, #hud.fk #rvName{ display:none; }
.team{ font:900 1.05rem/1 var(--disp); letter-spacing:.08em; }
.team.om{ color:var(--sky2); } .team.rv{ color:#e8a3b8; }
.score{ font:900 2.1rem/1 var(--disp); font-variant-numeric:tabular-nums; color:#fff; min-width:4.2rem; text-align:center; }
.dots{ display:flex; gap:.22rem; }
.dots i{ width:.58rem; height:.58rem; border-radius:50%; border:1.5px solid rgba(244,248,251,.45); display:block; }
.dots i.y{ background:#4be08a; border-color:#4be08a; } .dots i.n{ background:var(--red); border-color:var(--red); }
#hint{ position:fixed; left:50%; bottom:max(1.1rem, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; padding:.5rem 1rem; border-radius:999px; background:rgba(4,12,24,.72);
  font:600 .98rem/1.2 var(--body); color:var(--ink); pointer-events:none; transition:opacity .3s; max-width:calc(100vw - 7.5rem); width:max-content; text-align:center; }
#hint:empty{ opacity:0; }
#call{ position:fixed; left:0; right:0; top:30%; z-index:6; text-align:center; font:900 clamp(3rem, 14vw, 7.5rem)/.9 var(--disp); letter-spacing:.02em; color:var(--gold);
  -webkit-text-stroke:2px #071425; text-shadow:0 .3rem 0 #071425, 0 0 2.5rem rgba(255,210,63,.45); opacity:0; transform:scale(.6); pointer-events:none; padding:0 .5rem; }
#call.on{ animation:pop 1.7s cubic-bezier(.2,1.4,.4,1) forwards; }
#call.good{ color:var(--gold); } #call.bad{ color:#fff; text-shadow:0 .3rem 0 #071425, 0 0 2rem rgba(255,77,77,.5); }
#rp{ position:fixed; top:4.6rem; left:1rem; z-index:6; padding:.3rem .7rem .3rem .55rem; border-radius:.3rem; background:#e8001f; color:#fff; font:900 1.05rem/1 var(--disp); letter-spacing:.12em; pointer-events:none;
  box-shadow:0 .2rem 0 #071425; animation:rpblink 1s steps(2, start) infinite; }
#rp::before{ content:'▶ '; } #rp[hidden]{ display:none; }
@keyframes rpblink{ 50%{ opacity:.55; } }
@media (prefers-reduced-motion: reduce){ #rp{ animation:none; } }
.dres{ display:flex; gap:.4rem; justify-content:center; margin-top:1rem; } .dres[hidden]{ display:none; }
.dres i{ width:2.5rem; height:2.5rem; border-radius:.5rem; display:grid; place-items:center; font-style:normal; font-size:1.35rem; line-height:1; box-shadow:0 .22rem 0 rgba(0,0,0,.4); }
.dres .goal{ background:#2fbf71; } .dres .web{ background:#2fbf71; box-shadow:0 .22rem 0 rgba(0,0,0,.4), inset 0 0 0 3px #ffd23f; } .dres .wall{ background:#8a2447; } .dres .save{ background:#e0ad17; } .dres .post{ background:#9fb3c4; } .dres .miss{ background:#d6453a; }
.card .row + .row{ margin-top:.75rem; }
.card button.back{ margin-top:.9rem; min-height:2.75rem; padding:.4rem 1rem; background:none; border:0; color:var(--ink); opacity:.75; font:600 1rem var(--body); text-decoration:underline; text-underline-offset:.25em; cursor:pointer; }
.card button.back:hover, .card button.back:focus-visible{ opacity:1; }
.card .row button.daily{ background:var(--sky2); box-shadow:0 .35rem 0 #3d8fb3; min-width:min(100%, 22rem); }
#call.small{ font-size:clamp(1.8rem, 7vw, 3.4rem); color:var(--sky2); }
@keyframes pop{ 0%{ opacity:0; transform:scale(.6) rotate(-3deg); } 14%{ opacity:1; transform:scale(1.06) rotate(0); } 75%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(1.04); } }
.corner{ position:fixed; left:max(.6rem, env(safe-area-inset-left)); bottom:max(.9rem, env(safe-area-inset-bottom)); z-index:7; display:flex; flex-direction:column; gap:.4rem; }
.corner button{ display:grid; place-items:center; }
#mute [hidden]{ display:none; }
.corner button, #magic{ min-width:2.75rem; min-height:2.75rem; border-radius:.6rem; border:1px solid rgba(143,216,245,.35); background:rgba(4,12,24,.7); color:var(--ink); font:800 .95rem var(--disp); letter-spacing:.06em; cursor:pointer; }
#magic{ position:fixed; left:50%; bottom:calc(max(1.1rem, env(safe-area-inset-bottom)) + 3rem); transform:translateX(-50%); z-index:7; padding:0 1rem; font:700 .95rem var(--body); border-color:rgba(255,210,63,.6); color:var(--gold); }
#magic[aria-pressed="true"]{ background:var(--gold); color:#071425; box-shadow:0 0 1.4rem rgba(255,210,63,.6); }
#magic[hidden]{ display:none; }
.card{ position:fixed; inset:0; z-index:8; display:grid; place-items:center; padding:1.2rem; background:radial-gradient(ellipse at 50% 40%, rgba(7,20,37,.35), rgba(4,10,20,.86) 70%); }
.card[hidden]{ display:none; }
.card .in{ max-width:30rem; text-align:center; }
.card h1, .card h2{ margin:0; font:900 clamp(4rem, 19vw, 8.5rem)/.82 var(--disp); text-transform:uppercase; letter-spacing:-.01em; color:#fff; text-shadow:0 .35rem 0 var(--sky), 0 0 3rem rgba(47,174,224,.45); }
.card h2{ font-size:clamp(3rem, 14vw, 6rem); }
.card .kick{ font:800 .9rem var(--disp); letter-spacing:.32em; text-transform:uppercase; color:var(--gold); margin-bottom:.6rem; }
.card p{ font:400 1.06rem/1.45 var(--body); margin:.9rem auto 0; max-width:26rem; color:#dbe8f2; }
.card p.small{ font-size:.92rem; color:#a9c0d3; }
.card .row{ display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin-top:1.4rem; }
.card .row button{ min-height:3rem; padding:.7rem 1.8rem; border-radius:999px; border:0; background:var(--gold); color:#071425; font:900 1.35rem var(--disp); letter-spacing:.08em; text-transform:uppercase; cursor:pointer; box-shadow:0 .35rem 0 #b38f12; }
.card .row button.ghost{ background:transparent; color:var(--ink); border:2px solid rgba(244,248,251,.5); box-shadow:none; }
.card .in > *{ animation:rise .7s both; } .card .in > :nth-child(2){ animation-delay:.08s; } .card .in > :nth-child(3){ animation-delay:.16s; } .card .in > :nth-child(4){ animation-delay:.24s; } .card .in > :nth-child(5){ animation-delay:.32s; }
@keyframes rise{ from{ transform:translateY(1rem); } to{ transform:none; } }
@media (max-width: 430px){ #hud{ gap:.4rem; padding:.4rem .6rem; } .team{ font-size:.88rem; letter-spacing:.04em; } .score{ font-size:1.8rem; min-width:3.4rem; } .dots{ gap:.16rem; } .dots i{ width:.48rem; height:.48rem; } }
@media (prefers-reduced-motion: reduce){ #call.on{ animation:none; opacity:1; transform:none; } .card .in > *{ animation:none; } }
</style>
</head>
<body>
<canvas id="gl" role="application" aria-label="Penalties and free kicks. Tap or click a spot in the goal to shoot there, or to dive there when you're the keeper. Free kicks: press on the goal, slide sideways to curl, release to shoot. Keys: Q W E for top left, middle, right, A S D for low; left and right arrows set the curl."></canvas>
<div class="vig" aria-hidden="true"></div>
<div id="hud" hidden role="status" aria-live="polite" aria-label="OM 0, RIVAUX 0"><span class="team om">OM</span><span class="dots" id="dotsA"></span><span class="score"><span id="sA">0</span><span id="sep">–</span><span id="sB">0</span></span><span class="dots" id="dotsB"></span><span class="team rv" id="rvName">RIVAUX</span></div>
<div id="call" aria-live="assertive"></div>
<div id="rp" hidden></div>
<div id="hint" aria-live="polite"></div>
<button id="magic" hidden aria-pressed="false">✨ Pied magique</button>
<div class="corner"><button id="lang" aria-label="Language / langue">EN</button><button id="mute" aria-pressed="false" aria-label="Mute"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="muteW" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="muteX" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden/></svg></button></div>
<section class="card" id="title" role="dialog" aria-labelledby="tH"><div class="in">
  <div class="kick">Vélodrome · 21h00</div>
  <h1 id="tH">La Lucarne</h1>
  <p id="sub"></p>
  <p class="small" id="how"></p>
  <div class="row"><button id="go">Tirs au but</button><button id="goFk">Coups francs</button></div>
  <div class="row"><button id="goD" class="daily">Défi du jour</button></div>
</div></section>
<section class="card" id="end" role="dialog" aria-labelledby="endH" hidden><div class="in">
  <div class="kick" id="endK">Tirs au but</div>
  <h2 id="endH"></h2>
  <div id="dres" class="dres" role="img" hidden></div>
  <p id="endP"></p>

  <button id="modes" class="back">Autres modes</button>
</div></section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $ = id => document.getElementById(id);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const PHONE = matchMedia('(pointer: coarse)').matches;

/* ---------- renderer, scene, camera ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, PHONE ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#0a1a30', 60, 140);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 300);

/* night sky: a vertex-coloured dome */
(function(){ const g = new THREE.SphereGeometry(200, 24, 12), p = g.attributes.position, c = [];
  const lo = new THREE.Color('#1b3556'), mid = new THREE.Color('#0b1d36'), hi = new THREE.Color('#030a16'), t = new THREE.Color();
  for (let i = 0; i < p.count; i++){ const h = p.getY(i) / 200; if (h < .12) t.copy(lo).lerp(mid, Math.max(0, h) / .12); else t.copy(mid).lerp(hi, Math.min(1, (h - .12) / .5)); c.push(t.r, t.g, t.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
})();

/* floodlight: one shadow-casting key from high behind the camera, a cool fill, a hemisphere */
scene.add(new THREE.HemisphereLight('#9cc8ff', '#1d3a1c', 1.1));
const key = new THREE.DirectionalLight('#fff6e6', 2.6); key.position.set(14, 30, 28); key.target.position.set(0, 0, 4);
key.castShadow = true; key.shadow.mapSize.setScalar(PHONE ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 18, bottom: -10, near: 5, far: 80 }); key.shadow.bias = -.0005; key.shadow.camera.updateProjectionMatrix();
scene.add(key, key.target);
const fill = new THREE.DirectionalLight('#7fb6ff', .8); fill.position.set(-20, 18, -10); scene.add(fill);

/* ---------- the pitch: mown stripes and the lines of the penalty area, painted on one canvas ---------- */
const PW = 70, PL = 60;   /* the painted patch: x -35..35, z -6..54 (the goal line at z = 0, the spot at z = 11) */
(function(){ const S = 2048, cv = document.createElement('canvas'); cv.width = cv.height = S; const x = cv.getContext('2d');
  const mx = v => (v + PW / 2) / PW * S, mz = v => (v + 6) / PL * S;
  for (let i = 0; i < 12; i++){ x.fillStyle = i % 2 ? '#2f7d33' : '#38893b'; x.fillRect(0, mz(-6 + i * 5), S, mz(-1 + i * 5) - mz(-6 + i * 5) + 1); }
  for (let k = 0; k < 9000; k++){ x.fillStyle = Math.random() < .5 ? 'rgba(20,60,20,.10)' : 'rgba(120,180,90,.08)'; x.fillRect(Math.random() * S, Math.random() * S, 2, 6); }
  x.strokeStyle = 'rgba(245,250,245,.92)'; x.lineWidth = .12 / PW * S; x.lineCap = 'round';
  const line = (a, b, c, d) => { x.beginPath(); x.moveTo(mx(a), mz(b)); x.lineTo(mx(c), mz(d)); x.stroke(); };
  line(-35, 0, 35, 0);
  line(-20.16, 0, -20.16, 16.5); line(20.16, 0, 20.16, 16.5); line(-20.16, 16.5, 20.16, 16.5);
  line(-9.16, 0, -9.16, 5.5); line(9.16, 0, 9.16, 5.5); line(-9.16, 5.5, 9.16, 5.5);
  x.beginPath(); const r = 9.15 / PW * S, a0 = Math.acos(5.5 / 9.15); x.arc(mx(0), mz(11), r, Math.PI / 2 - a0, Math.PI / 2 + a0); x.stroke();
  x.fillStyle = 'rgba(245,250,245,.95)'; x.beginPath(); x.arc(mx(0), mz(11), .14 / PW * S, 0, 7); x.fill();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(PW, PL), new THREE.MeshLambertMaterial({ map: tex }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, 0, -6 + PL / 2); m.receiveShadow = true; scene.add(m);
  const out = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshLambertMaterial({ color: '#25642a' }));
  out.rotation.x = -Math.PI / 2; out.position.y = -.01; scene.add(out);
})();

/* ---------- the goal: posts, bar, and a net that bulges where the ball hits ---------- */
const GW = 3.66, GH = 2.44, GD = 1.9, POST = .06;
const NET = {};
(function(){ const white = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .35, metalness: .1 });
  const post = h => new THREE.Mesh(new THREE.CylinderGeometry(POST, POST, h, 12), white);
  const l = post(GH + POST), r = post(GH + POST); l.position.set(-GW, (GH + POST) / 2, 0); r.position.set(GW, (GH + POST) / 2, 0);
  const bar = post(2 * GW + 2 * POST); bar.rotation.z = Math.PI / 2; bar.position.set(0, GH, 0);
  [l, r, bar].forEach(m => { m.castShadow = true; scene.add(m); });
  const back = new THREE.MeshStandardMaterial({ color: '#d8dde2', roughness: .8 });
  [[-GW, GD], [GW, GD]].forEach(([x]) => { const s = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, GD, 6), back); s.rotation.x = Math.PI / 2; s.position.set(x, .03, -GD / 2); scene.add(s); });
  const nm = new THREE.MeshBasicMaterial({ color: '#e9eef2', wireframe: true, transparent: true, opacity: .42 });
  /* the back net: hangs from the bar line pulled back to the ground at -GD */
  const bg = new THREE.PlaneGeometry(2 * GW, Math.hypot(GH, GD), 36, 14);
  const bn = new THREE.Mesh(bg, nm); bn.position.set(0, GH / 2, -GD / 2); bn.rotation.x = Math.atan2(GD, GH); scene.add(bn);
  NET.back = bn; NET.base = Float32Array.from(bg.attributes.position.array); NET.hit = null;
  const side = s => { const g = new THREE.BufferGeometry(), v = []; const n = 10;
    for (let i = 0; i <= n; i++){ const u = i / n; v.push(s * GW, GH * (1 - u), -GD * u * 0, s * GW, 0, -GD * u * 0); }
    for (let i = 0; i <= n; i++){ const u = i / n; v.push(s * GW, GH * (1 - u) * 1, -GD * u, s * GW, GH, 0); }
    g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: '#e9eef2', transparent: true, opacity: .35 })); };
  scene.add(side(-1), side(1));
})();

/* cobwebs in the two top corners: a shot into la lucarne knocks them out ("faire tomber les toiles d'araignée") */
const WEB_TEX = (() => { const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N; const x = cv.getContext('2d');
  const gr = x.createRadialGradient(0, 0, 0, 0, 0, N * .95); gr.addColorStop(0, 'rgba(236,242,255,.55)'); gr.addColorStop(.7, 'rgba(236,242,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.beginPath(); x.moveTo(0, 0); x.lineTo(N, 0); x.quadraticCurveTo(N * .62, N * .62, 0, N); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineCap = 'round'; const SP = 6, P = (r, k) => { const a = k / SP * Math.PI / 2; return [Math.cos(a) * r, Math.sin(a) * r]; };
  x.lineWidth = 10; for (let k = 0; k <= SP; k++){ const [px, py] = P(N * (k % 2 ? .86 : .99), k); x.beginPath(); x.moveTo(0, 0); x.lineTo(px, py); x.stroke(); }
  x.lineWidth = 8; [.2, .38, .56, .74, .9].forEach(f => { x.beginPath(); for (let k = 0; k <= SP; k++){ const [px, py] = P(N * f * (k % 2 ? .93 : 1), k); if (k){ const [mx, my] = P(N * f * .86, k - .5); x.quadraticCurveTo(mx, my, px, py); } else x.moveTo(px, py); } x.stroke(); });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; })();
const WEBS = [-1, 1].map(s => { const R = 1.1, g = new THREE.PlaneGeometry(R, R); g.translate(-s * R / 2, -R / 2, 0);
  const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, s < 0 ? uv.getX(i) : 1 - uv.getX(i), uv.getY(i));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: WEB_TEX, transparent: true, opacity: .9, depthWrite: false, side: THREE.DoubleSide }));
  const b = V3(s * (GW - POST * .6), GH - POST * .6, -.06); m.position.copy(b); m.renderOrder = 2; scene.add(m); return { s, m, b, f: -1 }; });
function webReset(){ WEBS.forEach(w => { w.f = -1; w.m.visible = true; w.m.position.copy(w.b); w.m.rotation.set(0, 0, 0); w.m.scale.setScalar(1); w.m.material.opacity = .9; }); }
function webKnock(s){ const w = WEBS[s > 0 ? 1 : 0]; if (w.f < 0) w.f = 0; }
function webStep(dt){ WEBS.forEach(w => { if (w.f < 0 || !w.m.visible) return; w.f += dt; const f = w.f;
  w.m.position.set(w.b.x - w.s * .5 * f, w.b.y + .5 * f - 2.2 * f * f, w.b.z - 1.5 * f); w.m.rotation.set(-1.4 * f, w.s * .6 * f, w.s * 2.2 * f);
  w.m.scale.setScalar(1 + .6 * f); w.m.material.opacity = .9 * Math.max(0, 1 - f / 1.3); if (f > 1.3) w.m.visible = false; }); }
const websTxt = () => G.webs ? ' · 🕸️ ' + G.webs + ' ' + t_(G.webs > 1 ? 'websN' : 'webs1') : '';
const isWeb = T => Math.abs(T.x) > GW - .78 && T.y > GH - .66;

/* ---------- the stadium: tiers, a crowd that jumps, the wavy white roof ---------- */
const CROWD = { uTime: { value: 0 }, uAmp: { value: .06 } };
(function(){ const conc = new THREE.MeshLambertMaterial({ color: '#4a5566' }), dark = new THREE.MeshLambertMaterial({ color: '#1a2230' });
  const seats = [];
  /* a stand: a run of tiers along a line, rising away from the pitch */
  function stand(cx, cz, len, rot, rows, d0){ const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = rot; scene.add(g);
    for (let r = 0; r < rows; r++){ const y = 1.1 + r * .62, d = d0 + r * .85;
      const step = new THREE.Mesh(new THREE.BoxGeometry(len, .62, .85), r % 2 ? conc : dark); step.position.set(0, y - .31, -d); g.add(step);
      const n = Math.floor(len / .58); for (let i = 0; i < n; i++) if (Math.random() < .93) seats.push({ g, x: -len / 2 + (i + .5) * len / n + (Math.random() - .5) * .12, y, z: -d + .1, r, v: cz === -13 }); }
