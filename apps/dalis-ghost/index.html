<style>
:root{
  --sky0:#1d3b40; --sky1:#3f6f6a; --sky2:#e9b37a; --sand0:#d9a35f; --sand1:#b9763e; --sand2:#8a4f2a;
  --gold:#e0b14a; --gold2:#a87a22; --cream:#f6ecd6; --ink:#24160f; --rust:#b5532a; --frost:#9fd3e6;
  --serif:'Cormorant Garamond', Georgia, serif; --mono:'Courier Prime', 'Courier New', monospace;
  --heat: transparent;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:560px;height:100dvh;min-height:480px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--frost);outline-offset:2px}

/* the cover being won back */
#cover{flex:0 0 auto;margin:.55rem .7rem .35rem;padding:.4rem .5rem;border-radius:6px;background:linear-gradient(#7a5418,#5a3c10);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 5px var(--gold2),0 4px 14px #0008;display:flex;align-items:center;gap:.5rem}
#cover h1{margin:0;font:600 italic 1.05rem/1 var(--serif);color:var(--cream);white-space:nowrap;letter-spacing:.01em}
#slots{display:flex;gap:.25rem;flex:1;justify-content:flex-end}
.slot{width:2.05rem;height:2.05rem;border-radius:50%;background:#2c1c08;box-shadow:inset 0 2px 4px #000a;display:grid;place-items:center;opacity:.95}
.slot svg{width:72%;height:72%;opacity:.16;filter:grayscale(1);transition:opacity .4s,filter .4s,transform .4s}
.slot.got svg{opacity:1;filter:none;transform:scale(1.08)}
.slot.lost{background:repeating-linear-gradient(45deg,#2c1c08 0 4px,#1a1005 4px 8px)}
.slot.lost svg{opacity:.08}

/* the dream desert */
#stage{position:relative;flex:1 1 auto;margin:0 .7rem;border-radius:10px;overflow:hidden;
  background:
    radial-gradient(60% 18% at 70% 38%, #ffd9a066, transparent 70%),
    linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 22%,var(--sky2) 37%,var(--sand0) 37.2%,var(--sand1) 70%,var(--sand2) 100%);
  box-shadow:inset 0 0 0 1px #0006}
#stage::before{content:'';position:absolute;left:-10%;right:-10%;top:37%;height:2px;background:#fff3;filter:blur(1px)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 18px var(--heat);transition:box-shadow .5s}
.cloud{position:absolute;height:.7rem;border-radius:1rem;background:#f6ecd655;filter:blur(1px)}
.field{position:absolute;transform:translate(-50%,-100%);width:var(--w);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;z-index:2}
.field svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px #0005)}
.field .shadow{position:absolute;left:20%;right:-25%;bottom:-3%;height:12%;border-radius:50%;background:#3a1d0c55;transform:skewX(-35deg);z-index:-1}
.field.tapped svg{animation:shake .45s}
.field.dim svg{opacity:.45;filter:grayscale(.6)}
.field .mark{position:absolute;left:50%;top:-.2rem;transform:translate(-50%,-100%);font:700 .62rem/1 var(--mono);letter-spacing:.08em;padding:.15rem .3rem;border-radius:3px;background:#000a;white-space:nowrap;pointer-events:none}
@keyframes shake{20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
@keyframes wob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
#stage.shuffle .field svg{animation:wob .5s 2}
#ghost{position:absolute;width:30%;max-width:9rem;aspect-ratio:1;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);transition:left .5s,top .5s,transform .45s cubic-bezier(.3,1.6,.5,1),opacity .4s;z-index:5;pointer-events:none;opacity:0}
#ghost.on{transform:translate(-50%,-50%) scale(1);opacity:1}
#ghost svg{width:100%;height:100%;overflow:visible;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5%) rotate(2deg)}}
#bubble{position:absolute;left:4%;right:4%;top:3%;z-index:6;padding:.55rem .75rem;border-radius:12px;background:var(--cream);color:var(--ink);font:600 italic 1.08rem/1.2 var(--serif);box-shadow:0 4px 12px #0006;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
#bubble.on{opacity:1;transform:none}
#bubble small{display:block;font:400 .72rem/1.3 var(--mono);font-style:normal;color:#5a4636;margin-top:.25rem}
#thermo{position:absolute;right:.45rem;top:24%;bottom:8%;width:.6rem;border-radius:1rem;background:#0005;box-shadow:inset 0 0 0 1px #fff3;z-index:3;overflow:hidden}
#thermo i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:1rem;background:linear-gradient(0deg,var(--frost),#f4c86a,#e2552b);background-size:100% 40vh;background-position:bottom;transition:height .5s}
#tries{position:absolute;left:.6rem;bottom:.5rem;z-index:3;display:flex;gap:.3rem}
#tries b{width:.65rem;height:.65rem;border-radius:50%;background:var(--cream);box-shadow:0 0 6px #fff8;transition:background .3s,box-shadow .3s}
#tries b.used{background:#0006;box-shadow:none}
#hand{position:absolute;z-index:7;font-size:2rem;pointer-events:none;opacity:0;transform:translate(-30%,-10%);transition:opacity .4s}
#hand.on{opacity:1;animation:tap 1s infinite}
@keyframes tap{50%{transform:translate(-30%,6%) scale(.92)}}
.fly{position:absolute;z-index:20;width:2rem;height:2rem;pointer-events:none;transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,-.6,.3,1),transform .8s}

/* what the ghost says and asks */
#panel{flex:0 0 auto;min-height:8.6rem;margin:.45rem .7rem calc(.6rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.4rem;justify-content:center}
#heat{font:700 .78rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;min-height:.8rem}
#fact{font:400 .86rem/1.4 var(--mono);color:#ecdcb6;min-height:2.4rem}
#fact i{font-family:var(--serif);font-size:1.05em;color:var(--cream)}
#answers{display:grid;gap:.35rem}
#answers button,.big{border:1px solid var(--gold);background:#3a2710;border-radius:8px;padding:.7rem .8rem;text-align:left;font:600 1rem/1.2 var(--serif);cursor:pointer;touch-action:manipulation}
#answers button:active,.big:active{transform:scale(.98)}
#answers button.right{background:#2f6f3f;border-color:#8fe0a0}
#answers button.wrong{background:#6f2f2a;border-color:#f0a090}
.big{display:block;width:100%;text-align:center;font:700 italic 1.35rem/1 var(--serif);background:linear-gradient(#e7bd57,#b8862a);color:var(--ink);border:0;box-shadow:0 4px 0 #6d4b12,0 8px 18px #0007;padding:.85rem}
#mute{position:absolute;right:.4rem;top:.4rem;z-index:8;border:0;background:#0004;border-radius:50%;width:2.1rem;height:2.1rem;font-size:1rem;cursor:pointer}

/* title and end cards */
.card{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:1.4rem;text-align:center;background:radial-gradient(80% 60% at 50% 40%,#1d3b40ee,#0d0806f5)}
.card[hidden]{display:none}
.card h2{margin:0;font:300 clamp(2.8rem,14vw,4.4rem)/.9 var(--serif);color:var(--cream)}
.card h2 i{font-weight:600;color:var(--gold)}
.card p{margin:0;max-width:22rem;font:400 .92rem/1.45 var(--mono);color:#ecdcb6}
.card .ghostart{width:9rem;height:9rem}
.card .ghostart svg{width:100%;height:100%;animation:float 2.4s ease-in-out infinite}
.stars{font-size:2rem;letter-spacing:.3rem;color:var(--gold)}
.row{display:flex;gap:.6rem;width:100%;max-width:22rem}
.row .big{flex:1;font-size:1.1rem}
.ghostbtn{background:none;border:1px solid #f6ecd666;color:var(--cream);border-radius:8px;padding:.7rem;font:700 .85rem/1 var(--mono);cursor:pointer;flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition-duration:.01s!important}
}
@media (min-height:760px){ #panel{min-height:9.5rem} #fact{font-size:.92rem} }
</style>
</head>
<body>
<div id="app">
  <header id="cover" aria-label="The Apocalypse cover: pieces won back">
    <h1>Dalí's Ghost</h1>
    <div id="slots"></div>
  </header>
  <main id="stage" aria-label="The dream desert. Dalí's ghost hides behind one of these things">
    <div class="cloud" style="left:8%;top:12%;width:26%"></div>
    <div class="cloud" style="left:58%;top:7%;width:18%"></div>
    <div id="thermo" aria-hidden="true"><i></i></div>
    <div id="tries" aria-hidden="true"></div>
    <div id="bubble" role="status" aria-live="polite"></div>
    <div id="ghost" aria-hidden="true"></div>
    <div id="hand" aria-hidden="true">👆</div>
    <button id="mute" type="button" aria-label="Sound off" aria-pressed="false">🔊</button>
  </main>
  <section id="panel" aria-live="polite">
    <div id="heat"></div>
    <div id="fact"></div>
    <div id="answers"></div>
  </section>
  <div class="card" id="title">
    <div class="ghostart" aria-hidden="true"></div>
    <h2>Dalí's <i>Ghost</i></h2>
    <p>He stole the Apocalypse cover and broke it into seven pieces.</p>
    <button class="big" id="go" type="button" style="max-width:22rem">Catch him</button>
  </div>
  <div class="card" id="end" hidden>
    <div class="ghostart" aria-hidden="true"></div>
    <h2 id="endH"></h2>
    <div class="stars" id="endS"></div>
    <p id="endP"></p>
    <div class="row"><button class="big" id="again" type="button">Again</button><button class="ghostbtn" id="share" type="button">Share</button></div>
  </div>
</div>
