<script>
'use strict';
/* Terruño: an endless editable top-down pixel world, for arianmartiz. Low-res buffer LO (1 px = one art pixel) scaled up crisp. */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LANG=(localStorage.getItem('terruno-lang')||((navigator.language||'es').toLowerCase().startsWith('es')?'es':'en'));
const L=(es,en)=>LANG==='es'?es:en;
let W=0,H=0,SC=3,VW=0,VH=0;
const LO=document.createElement('canvas'),lx=LO.getContext('2d');

/* ---------- noise ---------- */
function h2(x,y,s){let n=(x*374761393+y*668265263+s*1442695041)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,s+i*101);n+=a;a*=.5;f*=2;}return t/n;}

/* ---------- ids ---------- */
const DEEP=0,WATER=1,SAND=2,GRASS=3,FOREST=4,DIRT=5,ROCKG=6,SNOW=7,PATH=8,WOOD=9,FARM=10,DSAND=11,BRIDGE=12,DITCH=13;
const NONE=0,OAK=1,PINE=2,BUSH=3,ROCK=4,FLOWER=5,TGRASS=6,CACTUS=7,WALLS=8,WALLW=9,DOOR=10,FENCE=11,TORCH=12,WHEAT=13;
const SOLID=new Set([OAK,PINE,BUSH,ROCK,CACTUS,WALLS,WALLW,FENCE]);
const WET=g=>g===DEEP||g===WATER;
const WILD=new Set([OAK,PINE,BUSH,ROCK,FLOWER,TGRASS,CACTUS,WHEAT]),WALLISH=new Set([WALLS,WALLW,DOOR]);

/* ---------- world ---------- */
let SEED=0;
const edits=new Map();/* turned fences / bridges: 'f'|'b' + 'x,y' -> 1 east-west only, 2 north-south only */const TURN=new Map();
function gen(x,y){
  let e=(fbm(x/72,y/72,SEED,5)-.5)*2.1+.5;const near=.75*Math.exp(-(x*x+y*y)/1800);e=e*(1-near)+.55*near;
  const m=(fbm(x/60+300,y/60-200,SEED+7,4)-.5)*2+.5,r=h2(x,y,SEED+3);
  if(e<.27)return[DEEP,0];
  if(e<.35)return[WATER,0];
  if(e<.385)return[SAND,r<.012?ROCK:0];
  if(e<.70){
    const rv=fbm(x/110,y/110,SEED+13,3);
    if(Math.abs(rv-.5)<.0065&&(x*x+y*y)>90)return[WATER,0];
    if(m<.2)return[DSAND,r<.022?CACTUS:r<.03?ROCK:0];
    if(m>.6)return[FOREST,r<.40?(r<.07?PINE:OAK):r<.46?BUSH:r<.56?TGRASS:r<.58?FLOWER:0];
    return[GRASS,r<.03?OAK:r<.09?TGRASS:r<.13?FLOWER:r<.145?BUSH:r<.152?ROCK:0];
  }
  if(e<.86)return[ROCKG,r<.06?ROCK:r<.12?PINE:r<.14?TGRASS:0];
  return[SNOW,r<.08?PINE:r<.11?ROCK:0];
}
const chunks=new Map();
function chunk(cx,cy){
  const k=cx+','+cy;let c=chunks.get(k);if(c)return c;
  c={g:new Uint8Array(1024),o:new Uint8Array(1024)};
  for(let j=0;j<32;j++)for(let i=0;i<32;i++){const x=cx*32+i,y=cy*32+j,ed=edits.get(x+','+y),t=ed||gen(x,y);c.g[j*32+i]=t[0];c.o[j*32+i]=t[1];}
  if(chunks.size>600)chunks.clear();
  chunks.set(k,c);return c;
}
function getG(x,y){const cx=x>>5,cy=y>>5;return chunk(cx,cy).g[((y&31)<<5)|(x&31)];}
function getO(x,y){const cx=x>>5,cy=y>>5;return chunk(cx,cy).o[((y&31)<<5)|(x&31)];}
function setT(x,y,g,o){roomC.clear();roofC.clear();const c=chunk(x>>5,y>>5),i=((y&31)<<5)|(x&31);c.g[i]=g;c.o[i]=o;edits.set(x+','+y,[g,o]);if(TURN.size){const k=x+','+y;if(g!==BRIDGE)TURN.delete('b'+k);if(o!==FENCE)TURN.delete('f'+k);}}

/* ---------- rooms: four walls (doors count) close a room, and a room gets a roof ---------- */
const roomC=new Map(),roofC=new Map();
function roomOf(x,y){const k=x+','+y;let r=roomC.get(k);if(r!==undefined)return r;
  if(WALLISH.has(getO(x,y))){roomC.set(k,null);return null;}
  const q=[[x,y]],seen=new Set([k]);let i=0,open=false;
  while(i<q.length){const[cx,cy]=q[i++];if(q.length>320){open=true;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,nk=nx+','+ny;if(seen.has(nk)||WALLISH.has(getO(nx,ny)))continue;seen.add(nk);q.push([nx,ny]);}}
  if(open){seen.forEach(kk=>roomC.set(kk,null));return null;}
  let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const[qx,qy]of q){if(qx<a)a=qx;if(qx>b)b=qx;if(qy<c)c=qy;if(qy>d)d=qy;}
  let st=0,wd=0;for(let yy=c-1;yy<=d+1;yy++)for(let xx=a-1;xx<=b+1;xx++){const o=getO(xx,yy);if(o===WALLS)st++;else if(o===WALLW)wd++;}
  r={x0:a,x1:b,y0:c,y1:d,n:q.length,stone:st>wd};seen.forEach(kk=>roomC.set(kk,r));return r;}
function roofAt(x,y){const k=x+','+y;let r=roofC.get(k);if(r!==undefined)return r;r=null;
  if(WALLISH.has(getO(x,y))){for(let j=-1;j<=1&&!r;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;if(!WALLISH.has(getO(x+i,y+j))){const m=roomOf(x+i,y+j);if(m){r=m;break;}}}}
  else r=roomOf(x,y);
  roofC.set(k,r);return r;}

/* ---------- art ---------- */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const P=(X,Y,col)=>{x.fillStyle=col;x.fillRect(X,Y,1,1);},R=(X,Y,a,b,col)=>{x.fillStyle=col;x.fillRect(X,Y,a,b);};f(x,P,R);return c;}
function shadow(c,cx,cy,rx,ry){c.fillStyle='rgba(16,24,12,.32)';c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,7);c.fill();}
/* a blob drawn pixel by pixel: inside(x,y) -> outline + 4-step light from the top left */
function blob(P,w,h,inside,cols,ol,seed){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!inside(x,y))continue;
    if(!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1)){P(x,y,ol);continue;}
    const s=cols.s(x,y)+(h2(x,y,seed)-.5)*.18;P(x,y,s<-.42?cols[0]:s<.05?cols[1]:s<.45?cols[2]:cols[3]);}
}
function groundTile(base,marks,seed){return mk(16,16,(c,P,R)=>{R(0,0,16,16,base);marks(P,R,(i)=>h2(i,seed,77));});}
const G=[];
const tufts=(P,dark,light,n,s)=>{for(let i=0;i<n;i++){const x=1+Math.floor(h2(i,s,1)*13),y=2+Math.floor(h2(i,s,2)*13);P(x,y,dark);P(x+2,y,dark);P(x+1,y-1,light);}};
G[GRASS]=[0,1,2].map(v=>groundTile('#5c9f3c',(P,R)=>{tufts(P,'#4b8932','#75b94d',3+v,v+10);if(v===2){R(9,10,2,1,'#6aae45');R(3,4,2,1,'#6aae45');}},v));
G[FOREST]=[0,1,2].map(v=>groundTile('#3e7733',(P,R)=>{tufts(P,'#33662b','#4f8d3e',3,v+20);if(v){P(4+v*3,9,'#8a8a2e');P(5+v*3,9,'#6f7a28');}},v));
G[SAND]=[0,1,2].map(v=>groundTile('#e8cf93',(P,R)=>{for(let i=0;i<4;i++){const x=Math.floor(h2(i,v,31)*14),y=Math.floor(h2(i,v,32)*15);R(x,y,2,1,i&1?'#d8bb7b':'#f4e2b2');}},v));
G[DSAND]=[0,1,2].map(v=>groundTile('#e7b874',(P,R)=>{for(let i=0;i<3;i++){const y=2+i*5+v%2,x=Math.floor(h2(i,v,33)*8);R(x,y,5,1,'#d6a35f');R(x+1,y-1,3,1,'#f1cb8c');}},v));
G[DIRT]=[0,1,2].map(v=>groundTile('#97683f',(P,R)=>{for(let i=0;i<4;i++){const x=Math.floor(h2(i,v,41)*14),y=Math.floor(h2(i,v,42)*14);R(x,y,2,2,'#7e5534');P(x,y,'#ad7e53');}},v));
G[ROCKG]=[0,1,2].map(v=>groundTile('#8c8a84',(P,R)=>{for(let i=0;i<3;i++){const x=Math.floor(h2(i,v,51)*12),y=Math.floor(h2(i,v,52)*14);R(x,y,4,1,'#74726c');R(x+1,y+1,2,1,'#74726c');R(x,y-1,3,1,'#a3a19a');}},v));
G[SNOW]=[0,1,2].map(v=>groundTile('#edf2f7',(P,R)=>{for(let i=0;i<3;i++){const x=Math.floor(h2(i,v,61)*13),y=Math.floor(h2(i,v,62)*14);R(x,y,3,1,'#d5dfea');}P(3+v*4,5+v*2,'#ffffff');},v));
G[PATH]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#8a7f6d');const st=[[0,0,7,5],[8,0,8,5],[0,6,4,5],[5,6,6,5],[12,6,4,5],[0,12,8,4],[9,12,7,4]];
  for(const[x,y,w,h]of st){R(x,y,w-1,h-1,'#ab9f8a');R(x,y,w-1,1,'#c2b7a1');R(x+w-2,y+1,1,h-2,'#978c78');}})];
G[WOOD]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#b27b45');for(let y=0;y<16;y+=4){R(0,y+3,16,1,'#86582b');R(0,y,16,1,'#c58f5b');const s=(y/4)%2?5:11;R(s,y,1,3,'#86582b');}})];
G[FARM]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#6b472a');for(let y=1;y<16;y+=4){R(0,y,16,1,'#553620');R(0,y+1,16,1,'#80563a');}})];
G[BRIDGE]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#a87445');for(let y=0;y<16;y+=3)R(0,y,16,1,'#7d5228');R(0,0,2,16,'#5e3b1b');R(14,0,2,16,'#5e3b1b');R(2,0,1,16,'#c08a55');})];

    const RW=[['#d36a44','#94402d','#ea8a60'],['#b5523b','#7a3324','#cf6a4c'],['#93402f','#62271b','#a94b37']],RS=[['#8794a6','#525d6d','#a3b0c1'],['#6b7889','#434d5b','#8794a5'],['#556070','#363e4a','#677383']],
      SB=['#e9eff5','#dbe3ec','#c4cfdc'],SH=['#ffffff','#f2f6f9','#d4dde8'],sr=(t,q,k)=>recol(t,{[q[0]]:SB[k],[q[1]]:mixHex(q[1],SB[k],.5),[q[2]]:SH[k]});
    S.rw=B.rw.map((t,k)=>sr(t,RW[k],k));S.rs=B.rs.map((t,k)=>sr(t,RS[k],k));

const SNAP=document.createElement('canvas'),snx=SNAP.getContext('2d');let snapU=0,snapX=0,snapY=0;

  const cp=(d,a)=>{for(let i=0;i<a.length;i++)d[i]=a[i];};cp(FLOWERS,S.fl);cp(TGR,S.tg);cp(FENCEC,S.fc);cp(ROOF.w,S.rw);cp(ROOF.s,S.rs);cp(DOOR2,S.d2);cp(DEEPF,S.df);

const clkN=$('clkN'),clkI=$('clkI').getContext('2d'),clkD=$('clkD');
function seaLabel(){const d=Math.floor(Math.max(0,clock)/DAY),k=d%SDAYS;seaDay=d;clkN.textContent=L(SEAN[season][0],SEAN[season][1]);clkI.clearRect(0,0,7,7);clkI.drawImage(SICON[season],0,0);[...clkD.children].forEach((e,i)=>{e.className=i<=k?'on':'';});}
function seasonTick(dt){const s=seasonOf(clock);if(s!==season)setSeason(s,season<0);else if(Math.floor(Math.max(0,clock)/DAY)!==seaDay)seaLabel();wxTick(dt);russTick(dt);}
/* weather: snowflakes in screen space (they follow the world as the camera moves), breath puffs in the cold. Capped, nothing with reduced motion */
const WX=[];let snowAmt=0,snowGoal=0,wxCX=0,wxCY=0,wxT=0,breathT=0,leafT=0;
function snowGoalNow(){const d=Math.floor(Math.max(0,clock)/DAY),p=(clock%DAY)/DAY,q=d*4+Math.floor(p*4);
  if(season===3)return h2(q,17,SEED)<.6?.45+.55*h2(q,18,SEED):0;
  if(season===2&&d%(SDAYS*4)===SDAYS*3-1&&p>.7)return .5;
  return 0;}
function breathAt(x,y,dir){if(dir==='u')return;const dx=dir==='r'?1:dir==='l'?-1:0;let n=0;for(const p of WX)if(p.k)n++;if(n>45)return;
  for(let i=0;i<3;i++)WX.push({k:1,x:x+dx*4+(Math.random()-.5)*2,y:y+(Math.random()-.5)*2,vx:dx*(7+Math.random()*5)+(Math.random()-.5)*4,vy:dx?-3-Math.random()*3:3+Math.random()*2,t:.8+Math.random()*.4,t0:1.2,s:i?1:2});}
function wxTick(dt){if(RM){WX.length=0;return;}
  const dx=camX-wxCX,dy=camY-wxCY,jump=Math.abs(dx)>200||Math.abs(dy)>200;wxCX=camX;wxCY=camY;
  wxT-=dt;if(wxT<=0){wxT=2;snowGoal=snowGoalNow();}
  snowAmt+=(snowGoal-snowAmt)*Math.min(1,dt*.3);if(snowAmt<.004&&!snowGoal)snowAmt=0;
  const want=Math.round(Math.min(90,VW*VH/1300)*snowAmt);let n=0;for(const p of WX)if(!p.k)n++;
  for(let i=WX.length-1;i>=0;i--){const p=WX[i];
    if(!p.k){if(jump){p.x=Math.random()*VW;p.y=Math.random()*VH;}p.x+=Math.sin(now/1000*p.f+p.ph)*p.sw*dt-dx;p.y+=p.vy*dt-dy;if(p.a<1)p.a=Math.min(1,p.a+dt);
      if(p.y>VH+2){if(n>want){WX.splice(i,1);n--;continue;}p.y-=VH+5;p.x=Math.random()*VW;}else if(p.y<-4)p.y+=VH+5;
      if(p.x<-3)p.x+=VW+6;else if(p.x>VW+3)p.x-=VW+6;continue;}
    p.t-=dt;if(p.t<=0){WX.splice(i,1);continue;}if(p.k===2){p.x+=(p.vx+Math.sin(now/1000*2.3+p.ph)*10)*dt;p.y+=p.vy*dt;continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*1.5;}
  while(n<want){const big=Math.random()<.25;WX.push({k:0,x:Math.random()*VW,y:Math.random()*VH,vy:big?24+Math.random()*8:11+Math.random()*8,sw:4+Math.random()*8,f:.8+Math.random()*1.2,ph:Math.random()*7,s:big?2:1,a:0});n++;}
  if(LEAFC){leafT-=dt;if(leafT<=0){leafT=season===2?.07:.16;let n=0;for(const p of WX)if(p.k===2)n++;
    if(n<(season===2?36:22))for(let k=0;k<6;k++){const tx=Math.floor((camX+Math.random()*VW)/16),ty=Math.floor((camY+Math.random()*(VH+32))/16);if(getO(tx,ty)!==OAK)continue;const C=LEAFC[Math.floor(h2(tx,ty,SEED+11)*LEAFC.length)];if(!C)continue;
      WX.push({k:2,x:tx*16+2+Math.random()*12,y:ty*16-13+Math.random()*12,vx:(Math.random()-.5)*5,vy:7+Math.random()*6,t:2.4+Math.random()*1.6,t0:4,c:C[Math.random()<.5?0:1],ph:Math.random()*7});break;}}}
  if(season===3){breathT-=dt;if(breathT<=0){breathT=.25;
    if(now>(me.br||0)){me.br=now+1700+Math.random()*900;breathAt(me.x+(me.dir==='r'?2:me.dir==='l'?-2:0),me.y-10,me.dir);}
    const inR=roofAt(Math.floor(me.x/16),Math.floor((me.y-3)/16));
    for(const v of folk){if(now<(v.br||0)||(v.st==='sleep'&&!v.path.length)||Math.abs(v.x-me.x)>VW/2+16||Math.abs(v.y-me.y)>VH/2+24)continue;const rf=roofAt(Math.floor(v.x/16),Math.floor((v.y-1)/16));if(rf&&rf!==inR)continue;
      v.br=now+1900+Math.random()*1300;breathAt(v.x+(v.dir==='r'?2:v.dir==='l'?-2:0),v.y-10,v.dir);}
    for(const m of mobs){if(m.k!=='sheep'&&m.k!=='deer'&&m.k!=='lamb')continue;if(now<(m.br||0)||Math.abs(m.x-me.x)>VW/2+16||Math.abs(m.y-me.y)>VH/2+24)continue;const A=ANI[m.k];
      m.br=now+2400+Math.random()*1800;breathAt(m.x+m.dir*(A.w/2-1),m.y-A.h+(m.k==='deer'?5:4),m.dir>0?'r':'l');}}}}
function drawSnow(){if(!WX.length)return;const a=darkness();lx.fillStyle='#ffffff';
  for(const p of WX){if(p.k===2)continue;if(p.k){lx.globalAlpha=Math.max(0,p.t/p.t0)*(.42+a*.25);lx.fillStyle='#eef4fb';lx.fillRect(Math.round(p.x)-camX,Math.round(p.y)-camY,p.s,p.s);continue;}
    const fx2=Math.round(p.x),fy2=Math.round(p.y);lx.globalAlpha=p.a*(1-a*.6)*.4;lx.fillStyle='#5a6a8c';lx.fillRect(fx2+1,fy2+p.s,p.s,1);
    lx.globalAlpha=p.a*(p.s>1?.95:.85)*(1-a*.35);lx.fillStyle='#ffffff';lx.fillRect(fx2,fy2,p.s,p.s);}
  lx.globalAlpha=1;}
function drawLeaves(){if(!LEAFC)return;for(const p of WX){if(p.k!==2)continue;const x=Math.round(p.x)-camX,y=Math.round(p.y)-camY;if(x<-2||y<-2||x>VW||y>VH)continue;
  lx.globalAlpha=Math.min(1,p.t*2);lx.fillStyle=p.c;const w=Math.sin(now/170+p.ph)>0;lx.fillRect(x,y,w?2:1,w?1:2);}lx.globalAlpha=1;}

/* seasons step 3 (v1.18): lambs and chicks follow their mothers in spring, sheep huddle in winter, scarves in the cold, Russ has opinions about the weather */
function babies(M,kind){if(Math.random()<.3)return;const nb=kind==='chick'?1+Math.floor(Math.random()*3):Math.random()<.7?1:2;
  for(let i=0;i<nb;i++){const x=M.x+Math.random()*18-9,y=M.y+Math.random()*8-4;if(!mobOk(x,y))continue;mobs.push({k:kind,x,y,vx:0,vy:0,t:Math.random()*2,dir:M.dir,f:0,ft:Math.random()*3,run:0,hop:0,mom:M});}}
function herd(m,A,d){if(m.run||d<A.fear)return;
  if(m.mom){const M=m.mom;if(!mobs.includes(M)){m.mom=null;return;}const gx=M.x-M.dir*6-m.x,gy=M.y-m.y,gd=Math.hypot(gx,gy);if(gd>16*10){m.mom=null;return;}
    if(gd>18){const s=A.sp*(gd>40?2.2:1.4);m.vx=gx/gd*s;m.vy=gy/gd*s;m.t=Math.max(m.t,.25);}return;}
  if(m.hT>now)return;m.hT=now+900;let o=null,bd=16*9;for(const q of mobs)if(q!==m&&q.k==='sheep'){const e=Math.hypot(q.x-m.x,q.y-m.y);if(e<bd){bd=e;o=q;}}
  if(!o)return;if(bd<14){if(Math.random()<.75){m.vx=m.vy=0;m.t=Math.max(m.t,1.6);}return;}
  const s=A.sp*.9;m.vx=(o.x-m.x)/bd*s;m.vy=(o.y-m.y)/bd*s;m.t=Math.min(.8,Math.max(.1,(bd-12)/s));}
const BODYW={d:BODY.d.map((r,i)=>i===1?'ktttttttwttk':i===2?'ksttttttwtsk':r),r:BODY.r.map((r,i)=>i===1?'.wkttttttk..':i===2?'.wkttttstk..':r)};BODYW.u=BODYW.d;
const SCARF=['#c8303a','#d9a030','#8a3a6a','#2f8a8a','#3f6fb8','#c8303a'];let FOLKW=null,HEROW=null;
function mkFolkW(pal){const K=Object.assign({},HK,pal),S={};
  for(const d of['d','u','r'])S[d]=[0,1,2,3].map(f=>mk(12,17,(c,P)=>{const rows=HEAD[d].concat(BODYW[d],LEGS[d][f]),bob=(f===1||f===3)?0:1;
    rows.forEach((r,y)=>{for(let x=0;x<12;x++){const ch=r[x];if(ch!=='.')P(x,y+bob,K[ch]);}});}));
  S.l=S.r.map(sp=>mk(12,17,c=>{c.translate(12,0);c.scale(-1,1);c.drawImage(sp,0,0);}));return S;}
function winterFolk(){if(FOLKW)return;FOLKW=FOLKP.map((p,i)=>mkFolkW(Object.assign({},p,{w:SCARF[i%SCARF.length]})));HEROW=mkFolkW({w:'#2f8a8a'});}
/* Russ talks through the tutorial panel (top of the screen, no dots or buttons), never while the tutorial runs */
const RUSSL=[['Primavera. Todo florece, todo zumba, y yo estornudo. Kikirikí.','Spring. Everything blooms, everything buzzes, and I sneeze. Cock-a-doodle-doo.'],
  ['Verano. Hace calor. Que nadie me pida que cante más fuerte.','Summer. It’s hot. Nobody ask me to crow any louder.'],
  ['Otoño. Los árboles tiran sus hojas por todas partes. Y luego el desordenado soy yo.','Autumn. The trees drop their leaves all over the place. And they call me messy.'],
  ['¿Nieve? Nadie me consultó. Kiki… brrr… rikí.','Snow? Nobody asked me. Cock-a… brrr… doodle-doo.']],
  RUSSX={intro:['Novedad: ahora el año da la vuelta. Primavera, verano, otoño, invierno, tres días cada uno. Yo no lo pedí. Ahora toca: ','News: the year turns now. Spring, summer, autumn, winter, three days each. I didn’t ask for this. Right now: '],
  ice:['El estanque se ha helado. Patina si quieres. Si te caes, yo no he visto nada.','The pond froze. Skate if you must. If you fall, I saw nothing.'],
  kids:['Corderitos y pollitos. Más gente a la que despertar al alba.','Lambs and chicks. More folk to wake at dawn.'],
  snow:['Huele a nieve. Lo noto en la cresta. Nunca me equivoco. Casi nunca.','Smells like snow. I can feel it in my comb. I’m never wrong. Almost never.']};
let rsU=0,rsFr=-1,rsT=2,seaF=0;
function russSay(es,en){const t=L(es,en);tutEl.classList.add('rsay');tutDots.hidden=true;$('tutSkip').hidden=true;$('tutOk').hidden=true;tutEl.setAttribute('aria-label','Russ');
  tutTx.textContent=t;tutEl.hidden=false;tutCr=now+900;rsFr=-1;rsU=now+Math.max(6500,t.length*80);if(AC&&AC.state==='running')sfx('bok');}
function russHide(){rsU=0;tutEl.classList.remove('rsay');tutDots.hidden=false;tutEl.setAttribute('aria-label','Tutorial');if(!tut)tutEl.hidden=true;}
tutEl.addEventListener('click',()=>{if(rsU)russHide();});
function russTick(dt){
  if(rsU){if(tut||now>rsU)russHide();else{const fr=now<tutCr?2:0;if(fr!==rsFr){rsFr=fr;tutFr=-1;tutRx.clearRect(0,0,11,10);tutRx.drawImage(ANI.rooster.R[fr],0,0);}}}
  rsT-=dt;if(rsT>0)return;rsT=1;if(tut||rsU||menu.open)return;const ph=(clock%DAY)/DAY;
  if(seaSaid!==season){if(seaSaid!=null&&ph<.035)return;const x=RUSSX.intro,l=seaSaid==null?[x[0]+SEAN[season][0]+'.',x[1]+SEAN[season][1]+'.']:RUSSL[season];seaSaid=season;russSay(l[0],l[1]);dirty();return;}
  if(season===2&&!(seaF&4)&&snowAmt>.05){seaF|=4;russSay(...RUSSX.snow);return;}
  if(season===0&&!(seaF&2)&&mobs.some(m=>(m.k==='lamb'||m.k==='chick')&&Math.abs(m.x-me.x)<VW/2-8&&Math.abs(m.y-me.y)<VH/2-8)){seaF|=2;russSay(...RUSSX.kids);dirty();return;}
  if(season===3&&!(seaF&1)&&me.onIce){seaF|=1;russSay(...RUSSX.ice);dirty();}}

/* ---------- loop ---------- */
let last=performance.now();
let lastF=0;
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;lastF=performance.now();now=t-T0;DT=dt;clock+=dt;moveHero(dt);updMobs(dt);updFolk(dt);runFlow();tutTick();seasonTick(dt);render();updClock();updPlace();updHint();if(now>selT)selEl.classList.add('gone');if(!FR){FR=1;requestAnimationFrame(f2);}}
let FR=0;function f2(t){FR=0;frame(t);}
setInterval(()=>{const t=performance.now();if(!document.hidden&&t-lastF>500){last=t-50;frame(t);}},300);
function spawn(){for(let r=0;r<160;r++)for(let a=0;a<Math.max(1,r*8);a++){const x=Math.round(Math.cos(a/(r*8||1)*6.283)*r),y=Math.round(Math.sin(a/(r*8||1)*6.283)*r);

const hadSave=load();if(!hadSave){SEED=Math.floor(Math.random()*1e6);spawn();seaSaid=seasonOf(clock);}
