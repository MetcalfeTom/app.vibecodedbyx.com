<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--ink:#1c1622;--panel:#2a2033;--panel2:#382a44;--cream:#f7ecd4;--gold:#f2b94b;--leaf:#8fd16a;--line:#5b4870}
html{font-size:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Pixelify Sans','Silkscreen',ui-monospace,monospace;overflow:hidden;height:100vh;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none}
main{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair}
.pix{background:var(--panel);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 #0008}
#place{position:absolute;left:50%;top:calc(3.4rem + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:.35rem .9rem;font-size:1.05rem;letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .6s;white-space:nowrap}
#place.on{opacity:1}
#place small{display:block;font-family:Silkscreen,monospace;font-size:.62rem;color:#d9c9ef;text-align:center;letter-spacing:.08em}
#hint{position:absolute;left:50%;bottom:calc(6.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:.55rem .9rem;font-size:.95rem;line-height:1.35;text-align:center;max-width:min(30rem,92vw);transition:opacity .8s;pointer-events:none}
#hint b{color:var(--gold);font-weight:700}
#hint.gone{opacity:0}
#hint:empty{display:none}
#bar{position:absolute;left:50%;bottom:calc(.6rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:.2rem;padding:.3rem;max-width:calc(100vw - 1rem);overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x proximity}
#bar button{flex:0 0 auto;width:2.9rem;height:2.9rem;padding:0;border:2px solid transparent;background:var(--panel2);border-radius:0;display:grid;place-items:center;cursor:pointer;scroll-snap-align:center;position:relative}
#bar button canvas{width:2rem;height:2rem;image-rendering:pixelated}
#bar button[aria-pressed=true]{border-color:var(--gold);background:#4a3858;box-shadow:0 0 0 2px var(--ink)}
#bar button .k{position:absolute;left:2px;top:0;font-family:Silkscreen,monospace;font-size:.55rem;color:#d9c9ef}
#bar .sep{flex:0 0 2px;background:var(--line);margin:.3rem .1rem}
#selname{position:absolute;left:50%;bottom:calc(4.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:.15rem .6rem;font-size:.95rem;pointer-events:none;transition:opacity .5s;white-space:nowrap}
#selname.gone{opacity:0}
#menuBtn{position:absolute;right:.6rem;top:calc(3.2rem + env(safe-area-inset-top,0px));width:2.9rem;height:2.9rem;font:inherit;font-size:1.3rem;color:var(--cream);cursor:pointer;display:grid;place-items:center}
#clock{position:absolute;left:.6rem;top:calc(3.2rem + env(safe-area-inset-top,0px));padding:.3rem .6rem;font-size:.9rem;pointer-events:none}
#joy{position:absolute;left:calc(1rem + env(safe-area-inset-left,0px));bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));width:7.5rem;height:7.5rem;border-radius:50%;background:radial-gradient(circle,#ffffff14 0 55%,#ffffff22 56% 60%,transparent 61%);border:2px solid #ffffff30;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:2.8rem;height:2.8rem;margin:-1.4rem;border-radius:50%;background:#f7ecd4cc;border:3px solid var(--ink);box-shadow:0 3px 0 #0008}
@media (pointer:coarse){#joy{display:block}}
dialog{border:0;padding:0;background:transparent;color:var(--cream);max-width:min(26rem,94vw)}
dialog::backdrop{background:#120d18b0}
.card{padding:1.1rem 1.2rem}
.card h2{margin:0 0 .2rem;font-size:2rem;font-weight:700;color:var(--gold);letter-spacing:.03em}
.card p{margin:.4rem 0;line-height:1.4;font-size:1rem}
.card .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.card button{font:inherit;font-size:1rem;color:var(--ink);background:var(--cream);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:.5rem .8rem;min-height:2.75rem;cursor:pointer}
.card button.warn{background:#f0a08a}
.card .seed{font-family:Silkscreen,monospace;font-size:.75rem;color:#d9c9ef}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){#place,#hint,#selname{transition:none}}
</style>

<body>
<main>
<canvas id="cv" role="application" aria-label="Mundo pixel. Muévete con WASD o las flechas; en el móvil, arrastra el círculo de la izquierda."></canvas>
<div id="place" class="pix" aria-live="polite"></div>
<p id="hint" class="pix"></p>
<div id="clock" class="pix" aria-hidden="true"></div>
<div id="selname" class="pix gone" aria-live="polite"></div>
<nav id="bar" class="pix" aria-label="Materiales"></nav>
<div id="joy" aria-hidden="true"><i></i></div>
<button id="menuBtn" class="pix" type="button" aria-label="Menú" aria-haspopup="dialog">☰</button>
<dialog id="menu" aria-labelledby="mTitle"><div class="card pix">
<h2 id="mTitle">Terruño</h2>
<p id="mHelp"></p>
<p class="seed" id="mSeed"></p>
<div class="row"><button type="button" id="mHome"></button><button type="button" id="mLang"></button></div>
<div class="row"><button type="button" class="warn" id="mNew"></button><button type="button" id="mClose"></button></div>
</div></dialog>
</main>
<script>
'use strict';
/* Terruño: an endless editable top-down pixel world, for arianmartiz. Low-res buffer LO (1 px = one art pixel) scaled up crisp. */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LANG=(localStorage.getItem('terruno-lang')||((navigator.language||'es').toLowerCase().startsWith('es')?'es':'en'));
const L=(es,en)=>LANG==='es'?es:en;
let W=0,H=0,SC=3,VW=0,VH=0;
const LO=document.createElement('canvas'),lx=LO.getContext('2d');

/* ---------- noise ---------- */
function h2(x,y,s){let n=(x*374761393+y*668265263+s*1442695041)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,s+i*101);n+=a;a*=.5;f*=2;}return t/n;}

/* ---------- ids ---------- */
const DEEP=0,WATER=1,SAND=2,GRASS=3,FOREST=4,DIRT=5,ROCKG=6,SNOW=7,PATH=8,WOOD=9,FARM=10,DSAND=11,BRIDGE=12,DITCH=13;
const NONE=0,OAK=1,PINE=2,BUSH=3,ROCK=4,FLOWER=5,TGRASS=6,CACTUS=7,WALLS=8,WALLW=9,DOOR=10,FENCE=11,TORCH=12,WHEAT=13;
const SOLID=new Set([OAK,PINE,BUSH,ROCK,CACTUS,WALLS,WALLW,FENCE]);
const WET=g=>g===DEEP||g===WATER;
const WILD=new Set([OAK,PINE,BUSH,ROCK,FLOWER,TGRASS,CACTUS,WHEAT]),WALLISH=new Set([WALLS,WALLW,DOOR]);

/* ---------- world ---------- */
let SEED=0;
const edits=new Map();
function gen(x,y){
  let e=(fbm(x/72,y/72,SEED,5)-.5)*2.1+.5;const near=.75*Math.exp(-(x*x+y*y)/1800);e=e*(1-near)+.55*near;
  const m=(fbm(x/60+300,y/60-200,SEED+7,4)-.5)*2+.5,r=h2(x,y,SEED+3);
  if(e<.27)return[DEEP,0];
  if(e<.35)return[WATER,0];
  if(e<.385)return[SAND,r<.012?ROCK:0];
  if(e<.70){
    const rv=fbm(x/110,y/110,SEED+13,3);
    if(Math.abs(rv-.5)<.0065&&(x*x+y*y)>90)return[WATER,0];
    if(m<.2)return[DSAND,r<.022?CACTUS:r<.03?ROCK:0];
    if(m>.6)return[FOREST,r<.40?(r<.07?PINE:OAK):r<.46?BUSH:r<.56?TGRASS:r<.58?FLOWER:0];
    return[GRASS,r<.03?OAK:r<.09?TGRASS:r<.13?FLOWER:r<.145?BUSH:r<.152?ROCK:0];
  }
  if(e<.86)return[ROCKG,r<.06?ROCK:r<.12?PINE:r<.14?TGRASS:0];
  return[SNOW,r<.08?PINE:r<.11?ROCK:0];
}
const chunks=new Map();
function chunk(cx,cy){
  const k=cx+','+cy;let c=chunks.get(k);if(c)return c;
  c={g:new Uint8Array(1024),o:new Uint8Array(1024)};
  for(let j=0;j<32;j++)for(let i=0;i<32;i++){const x=cx*32+i,y=cy*32+j,ed=edits.get(x+','+y),t=ed||gen(x,y);c.g[j*32+i]=t[0];c.o[j*32+i]=t[1];}
  if(chunks.size>600)chunks.clear();
  chunks.set(k,c);return c;
}
function getG(x,y){const cx=x>>5,cy=y>>5;return chunk(cx,cy).g[((y&31)<<5)|(x&31)];}
function getO(x,y){const cx=x>>5,cy=y>>5;return chunk(cx,cy).o[((y&31)<<5)|(x&31)];}
function setT(x,y,g,o){roomC.clear();roofC.clear();const c=chunk(x>>5,y>>5),i=((y&31)<<5)|(x&31);c.g[i]=g;c.o[i]=o;edits.set(x+','+y,[g,o]);}

/* ---------- rooms: four walls (doors count) close a room, and a room gets a roof ---------- */
const roomC=new Map(),roofC=new Map();
function roomOf(x,y){const k=x+','+y;let r=roomC.get(k);if(r!==undefined)return r;
  if(WALLISH.has(getO(x,y))){roomC.set(k,null);return null;}
  const q=[[x,y]],seen=new Set([k]);let i=0,open=false;
  while(i<q.length){const[cx,cy]=q[i++];if(q.length>320){open=true;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,nk=nx+','+ny;if(seen.has(nk)||WALLISH.has(getO(nx,ny)))continue;seen.add(nk);q.push([nx,ny]);}}
  if(open){seen.forEach(kk=>roomC.set(kk,null));return null;}
  let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const[qx,qy]of q){if(qx<a)a=qx;if(qx>b)b=qx;if(qy<c)c=qy;if(qy>d)d=qy;}
  let st=0,wd=0;for(let yy=c-1;yy<=d+1;yy++)for(let xx=a-1;xx<=b+1;xx++){const o=getO(xx,yy);if(o===WALLS)st++;else if(o===WALLW)wd++;}
  r={x0:a,x1:b,y0:c,y1:d,n:q.length,stone:st>wd};seen.forEach(kk=>roomC.set(kk,r));return r;}
function roofAt(x,y){const k=x+','+y;let r=roofC.get(k);if(r!==undefined)return r;r=null;
  if(WALLISH.has(getO(x,y))){for(let j=-1;j<=1&&!r;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;if(!WALLISH.has(getO(x+i,y+j))){const m=roomOf(x+i,y+j);if(m){r=m;break;}}}}
  else r=roomOf(x,y);
  roofC.set(k,r);return r;}

/* ---------- art ---------- */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const P=(X,Y,col)=>{x.fillStyle=col;x.fillRect(X,Y,1,1);},R=(X,Y,a,b,col)=>{x.fillStyle=col;x.fillRect(X,Y,a,b);};f(x,P,R);return c;}
function shadow(c,cx,cy,rx,ry){c.fillStyle='rgba(16,24,12,.32)';c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,7);c.fill();}
/* a blob drawn pixel by pixel: inside(x,y) -> outline + 4-step light from the top left */
function blob(P,w,h,inside,cols,ol,seed){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!inside(x,y))continue;
    if(!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1)){P(x,y,ol);continue;}
    const s=cols.s(x,y)+(h2(x,y,seed)-.5)*.18;P(x,y,s<-.42?cols[0]:s<.05?cols[1]:s<.45?cols[2]:cols[3]);}
}
function groundTile(base,marks,seed){return mk(16,16,(c,P,R)=>{R(0,0,16,16,base);marks(P,R,(i)=>h2(i,seed,77));});}
const G=[];
const tufts=(P,dark,light,n,s)=>{for(let i=0;i<n;i++){const x=1+Math.floor(h2(i,s,1)*13),y=2+Math.floor(h2(i,s,2)*13);P(x,y,dark);P(x+2,y,dark);P(x+1,y-1,light);}};
G[GRASS]=[0,1,2].map(v=>groundTile('#5c9f3c',(P,R)=>{tufts(P,'#4b8932','#75b94d',3+v,v+10);if(v===2){R(9,10,2,1,'#6aae45');R(3,4,2,1,'#6aae45');}},v));
G[FOREST]=[0,1,2].map(v=>groundTile('#3e7733',(P,R)=>{tufts(P,'#33662b','#4f8d3e',3,v+20);if(v){P(4+v*3,9,'#8a8a2e');P(5+v*3,9,'#6f7a28');}},v));
G[SAND]=[0,1,2].map(v=>groundTile('#e8cf93',(P,R)=>{for(let i=0;i<4;i++){const x=Math.floor(h2(i,v,31)*14),y=Math.floor(h2(i,v,32)*15);R(x,y,2,1,i&1?'#d8bb7b':'#f4e2b2');}},v));
G[DSAND]=[0,1,2].map(v=>groundTile('#e7b874',(P,R)=>{for(let i=0;i<3;i++){const y=2+i*5+v%2,x=Math.floor(h2(i,v,33)*8);R(x,y,5,1,'#d6a35f');R(x+1,y-1,3,1,'#f1cb8c');}},v));
G[DIRT]=[0,1,2].map(v=>groundTile('#97683f',(P,R)=>{for(let i=0;i<4;i++){const x=Math.floor(h2(i,v,41)*14),y=Math.floor(h2(i,v,42)*14);R(x,y,2,2,'#7e5534');P(x,y,'#ad7e53');}},v));
G[ROCKG]=[0,1,2].map(v=>groundTile('#8c8a84',(P,R)=>{for(let i=0;i<3;i++){const x=Math.floor(h2(i,v,51)*12),y=Math.floor(h2(i,v,52)*14);R(x,y,4,1,'#74726c');R(x+1,y+1,2,1,'#74726c');R(x,y-1,3,1,'#a3a19a');}},v));
G[SNOW]=[0,1,2].map(v=>groundTile('#edf2f7',(P,R)=>{for(let i=0;i<3;i++){const x=Math.floor(h2(i,v,61)*13),y=Math.floor(h2(i,v,62)*14);R(x,y,3,1,'#d5dfea');}P(3+v*4,5+v*2,'#ffffff');},v));
G[PATH]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#8a7f6d');const st=[[0,0,7,5],[8,0,8,5],[0,6,4,5],[5,6,6,5],[12,6,4,5],[0,12,8,4],[9,12,7,4]];
  for(const[x,y,w,h]of st){R(x,y,w-1,h-1,'#ab9f8a');R(x,y,w-1,1,'#c2b7a1');R(x+w-2,y+1,1,h-2,'#978c78');}})];
G[WOOD]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#b27b45');for(let y=0;y<16;y+=4){R(0,y+3,16,1,'#86582b');R(0,y,16,1,'#c58f5b');const s=(y/4)%2?5:11;R(s,y,1,3,'#86582b');}})];
G[FARM]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#6b472a');for(let y=1;y<16;y+=4){R(0,y,16,1,'#553620');R(0,y+1,16,1,'#80563a');}})];
G[BRIDGE]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#a87445');for(let y=0;y<16;y+=3)R(0,y,16,1,'#7d5228');R(0,0,2,16,'#5e3b1b');R(14,0,2,16,'#5e3b1b');R(2,0,1,16,'#c08a55');})];
G[DITCH]=[mk(16,16,(c,P,R)=>{R(0,0,16,16,'#5a3b22');R(0,0,16,3,'#3a2414');R(0,3,16,1,'#46301c');R(1,13,14,2,'#6e4a2c');P(4,8,'#7a5434');P(11,6,'#7a5434');P(8,11,'#4a311c');})];
const WATERF=[0,1,2].map(f=>mk(16,16,(c,P,R)=>{R(0,0,16,16,'#3d86c6');for(let i=0;i<3;i++){const x=(Math.floor(h2(i,9,71)*12)+f*2)%14,y=2+i*5;R(x,y,3,1,'#69ade3');R(x+1,y+1,2,1,'#3577b5');}}));
const DEEPF=[0,1,2].map(f=>mk(16,16,(c,P,R)=>{R(0,0,16,16,'#27599b');for(let i=0;i<2;i++){const x=(Math.floor(h2(i,8,72)*12)+f*2)%14,y=4+i*7;R(x,y,3,1,'#3a73b8');}}));

const OS=[];/* object sprites: {c, ox, oy} drawn at tile*16 + (ox,oy) */
OS[OAK]={ox:0,oy:-16,c:mk(16,32,(c,P,R)=>{shadow(c,8,29.5,6.5,2.2);R(6,20,4,10,'#6b4528');R(6,20,1,10,'#80573a');R(9,20,1,10,'#4f3219');
  const ins=(x,y)=>{const dx=x-7.5,dy=y-11,a=Math.atan2(dy,dx),r=7.6+Math.sin(a*5+1)*.75;return x>=0&&x<16&&y>=0&&Math.hypot(dx,dy*1.1)<r;};
  blob(P,16,24,ins,Object.assign(['#7cc35a','#57a443','#438a3a','#336d2e'],{s:(x,y)=>((x-7.5)*.55+(y-11)*.8)/7.6}),'#244f22',5);P(5,7,'#9bd876');P(6,6,'#9bd876');})};
function pineSprite(snow){return mk(16,32,(c,P,R)=>{shadow(c,8,29.5,5.5,2);R(7,25,2,5,'#5a3a20');R(7,25,1,5,'#71492a');
  const T=[[3,12,4.2],[9,19,5.6],[15,26,7]];
  const ins=(x,y)=>{if(x<0||x>15||y<0)return false;for(const[t,b,w]of T){if(y>=t&&y<b){const hw=(y-t+1)/(b-t)*w;if(Math.abs(x-7.5)<hw+.01)return true;}}return false;};
  blob(P,16,27,ins,Object.assign(['#4f9e66','#3a8052','#2d6b43','#22553a'],{s:(x,y)=>(x-7.5)/5}),'#173d29',9);
  if(snow)for(const[t,b,w]of T){for(let y=t;y<t+2;y++)for(let x=0;x<16;x++)if(ins(x,y)&&x<9)P(x,y,y===t?'#ffffff':'#dfe8f0');}})}
OS[PINE]={ox:0,oy:-16,c:pineSprite(0)};const PINE_SNOW={ox:0,oy:-16,c:pineSprite(1)};
OS[BUSH]={ox:0,oy:0,c:mk(16,16,(c,P,R)=>{shadow(c,8,14,6,1.8);const ins=(x,y)=>Math.hypot(x-7.5,(y-9)*1.15)<6+Math.sin(Math.atan2(y-9,x-7.5)*4)*.5;
  blob(P,16,16,ins,Object.assign(['#6fb851','#4d9a3d','#3c8034','#2f662b'],{s:(x,y)=>((x-7.5)*.6+(y-9)*.8)/6}),'#21481f',3);P(5,9,'#d8434a');P(9,7,'#d8434a');P(10,11,'#d8434a');P(5,8,'#f08a8e');})};

    if(g===DITCH||WET(g))return false;setT(x,y,DITCH,0);puff(x,y,'#7a5434',6);sfx('dig');if(nearWet(x,y))flow.push([x,y,clock+.35]);return true;}

  o.type='sawtooth';bp.type='bandpass';bp.Q.value=2.4;o.connect(bp);bp.connect(g);g.connect(AC.destination);lfo.frequency.value=26;lg.gain.value=0;lfo.connect(lg);lg.connect(o.frequency);
  const f=o.frequency,G=g.gain,B=bp.frequency,P=pr||1,V=(vol||1)*.1;G.setValueAtTime(0,t0);
  [[0,.1,540,600,1500],[.14,.08,600,660,1700],[.27,.15,740,800,1900],[.46,.11,780,840,2000]].forEach(([s,d,fa,fb,fc])=>{const a=t0+s;f.setValueAtTime(fa*P,a);f.linearRampToValueAtTime(fb*P,a+d*.5);f.linearRampToValueAtTime(fb*P*.93,a+d);B.setValueAtTime(fc,a);G.setValueAtTime(0,a);G.linearRampToValueAtTime(V,a+.015);G.setValueAtTime(V,a+d-.025);G.linearRampToValueAtTime(0,a+d);});
  const a=t0+.62;f.setValueAtTime(820*P,a);f.linearRampToValueAtTime(1010*P,a+.2);f.linearRampToValueAtTime(960*P,a+.5);f.linearRampToValueAtTime(640*P,a+.82);B.setValueAtTime(2100,a);B.linearRampToValueAtTime(1500,a+.82);
  G.setValueAtTime(0,a);G.linearRampToValueAtTime(V*1.1,a+.03);G.setValueAtTime(V,a+.55);G.linearRampToValueAtTime(0,a+.84);lg.gain.setValueAtTime(0,a+.15);lg.gain.linearRampToValueAtTime(18*P,a+.4);
  o.start(t0);lfo.start(t0);o.stop(t0+1.6);lfo.stop(t0+1.6);}catch(e){}}
function ribbit(vol){try{if(!AC||AC.state!=='running')return;const t0=AC.currentTime+.01,o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='square';lp.type='lowpass';lp.frequency.value=850;o.connect(lp);lp.connect(g);g.connect(AC.destination);
  const V=.045*Math.max(.15,vol),P=.85+Math.random()*.3;g.gain.setValueAtTime(0,t0);[[0,.07],[.12,.1]].forEach(([s0,d])=>{const a=t0+s0;o.frequency.setValueAtTime(140*P,a);o.frequency.linearRampToValueAtTime(220*P,a+d);g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(V,a+.012);g.gain.setValueAtTime(V,a+d-.02);g.gain.linearRampToValueAtTime(0,a+d);});o.start(t0);o.stop(t0+.3);}catch(e){}}
let AC=null;function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const f={bok:[700,520,.035],tap:[520,380,.05],dig:[150,70,.09],splash:[900,300,.08],trickle:[1300,700,.03],bad:[200,150,.06]}[k]||[400,300,.05];
  o.type=k==='dig'?'sawtooth':k==='splash'||k==='trickle'?'sine':'square';o.frequency.setValueAtTime(f[0],t);o.frequency.exponentialRampToValueAtTime(f[1],t+.09);
  g.gain.setValueAtTime(f[2]*(k==='dig'?.5:.6),t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.start(t);o.stop(t+.13);}catch(e){}}

/* ---------- pointer: paint by tile, right button clears, joystick on phones ---------- */
const joyEl=document.getElementById('joy'),knob=joyEl.firstElementChild;let hov=null,paint=null,lastT=null;
function tileAt(cx,cy){return[Math.floor((camX+cx/SC)/16),Math.floor((camY+cy/SC)/16)];}
function line(a,b,f){let[x0,y0]=a;const[x1,y1]=b,dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let n=0;n<200;n++){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
let painted=0;
function stroke(cx,cy){const t=tileAt(cx,cy);hov=t;if(!paint)return;line(lastT||t,t,(x,y)=>{if(apply(x,y,paint.erase)){painted++;dirty();}});lastT=t;}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);paint={id:e.pointerId,erase:e.button===2};lastT=null;stroke(e.clientX,e.clientY);hint(1);});
cv.addEventListener('pointermove',e=>{if(paint&&paint.id!==e.pointerId)return;stroke(e.clientX,e.clientY);});
const endPaint=e=>{if(paint&&paint.id===e.pointerId){paint=null;lastT=null;}};
cv.addEventListener('pointerup',endPaint);cv.addEventListener('pointercancel',endPaint);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hov=null;});
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);const r=joyEl.getBoundingClientRect();joy.on=true;joy.id=e.pointerId;joy.x0=r.left+r.width/2;joy.y0=r.top+r.height/2;jmove(e);hint(1);});
function jmove(e){if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x0,dy=e.clientY-joy.y0;const m=Math.hypot(dx,dy),R=joyEl.clientWidth*.42;if(m>R){dx*=R/m;dy*=R/m;}joy.dx=dx;joy.dy=dy;knob.style.transform='translate('+dx+'px,'+dy+'px)';}
joyEl.addEventListener('pointermove',jmove);
const jend=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.dx=joy.dy=0;knob.style.transform='';};
joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
cv.addEventListener('wheel',e=>{e.preventDefault();pick(sel+(e.deltaY>0?1:-1));},{passive:false});
addEventListener('keydown',e=>{if(menu.open)return;const k=e.key;if(/^[0-9]$/.test(k)){pick((+k+9)%10);}else if(k==='q'||k==='Q')pick(sel-1);else if(k==='e'||k==='E')pick(sel+1);
  else if(k===' '||k==='Enter'){if(document.activeElement===cv||document.activeElement===document.body){const f={d:[0,1],u:[0,-1],l:[-1,0],r:[1,0]}[me.dir];const tx=Math.floor(me.x/16)+f[0],ty=Math.floor((me.y-4)/16)+f[1];if(apply(tx,ty,false))dirty();}}
  if(/^(w|a|s|d|arrow)/i.test(k))hint(1);});

/* ---------- save ---------- */
const KEY='terruno-v1';let saveT=0;
function dirty(){clearTimeout(saveT);saveT=setTimeout(save,700);}
function save(){try{const e=[];edits.forEach((v,k)=>{const[x,y]=k.split(',');e.push([+x,+y,v[0],v[1]]);});
  localStorage.setItem(KEY,JSON.stringify({v:1,seed:SEED,x:Math.round(me.x),y:Math.round(me.y),sel,clock:Math.round(clock),e}));}catch(err){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||!d.seed&&d.seed!==0)return false;SEED=d.seed;edits.clear();for(const[x,y,g,o]of d.e||[])edits.set(x+','+y,[g,o]);
  chunks.clear();me.x=d.x;me.y=d.y;sel=d.sel||2;clock=d.clock||DAY*.3;return true;}catch(err){return false;}}
setInterval(save,8000);addEventListener('pagehide',save);

/* ---------- place names + hint + menu ---------- */
const placeEl=document.getElementById('place'),hintEl=document.getElementById('hint');let curBiome='',bT=0,placeT=0;
const BIO={[GRASS]:['Pradera','Meadow'],[FOREST]:['Bosque','Forest'],[SAND]:['Playa','Beach'],[DSAND]:['Desierto','Desert'],[ROCKG]:['Montaña','Mountains'],[SNOW]:['Cumbres nevadas','Snowy peaks'],[WATER]:['Agua','Water']};
function biomeAt(){let n=0;const c={};for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){const tx=Math.floor(me.x/16)+i,ty=Math.floor(me.y/16)+j,e=edits.get(tx+','+ty);if(e)n++;const g=gen(tx,ty)[0];const b=g===DEEP?WATER:g;if(BIO[b])c[b]=(c[b]||0)+1;}
  const myR=roofAt(Math.floor(me.x/16),Math.floor((me.y-3)/16));if(myR){const v=folk.find(f=>f.key===homeKey(myR));return v?['Casa de '+v.name,v.name+'\u2019s house']:['En casa','At home'];}if(n>=8)return['Tu pueblo','Your village'];let best=-1,bk=null;for(const k in c)if(c[k]>best){best=c[k];bk=k;}return BIO[bk]||BIO[GRASS];}
function updPlace(){if(now<bT)return;bT=now+900;const b=biomeAt(),n=L(b[0],b[1]);if(n!==curBiome){curBiome=n;placeEl.textContent=n;placeEl.classList.add('on');placeT=now+2600;}if(now>placeT)placeEl.classList.remove('on');}
const touch=matchMedia('(pointer:coarse)').matches;let hintDone=0,hintT=0;
function showHint(){hintEl.innerHTML=touch?L('Muévete con el <b>círculo</b> · <b>toca</b> o arrastra para construir · elige abajo','Move with the <b>circle</b> · <b>tap</b> or drag to build · pick below')
  :L('<b>WASD</b> para caminar · <b>clic</b> para construir · <b>clic derecho</b> quita · <b>rueda</b> o <b>1-0</b> cambia','<b>WASD</b> to walk · <b>click</b> to build · <b>right click</b> clears · <b>wheel</b> or <b>1-0</b> to switch');}
function hint(n){hintDone+=n;if(hintDone>=2&&!hintT)hintT=now+5000;}
function updHint(){if(hintT&&now>hintT&&!hintEl.classList.contains('gone'))hintEl.classList.add('gone');}
const menu=document.getElementById('menu'),$=id=>document.getElementById(id);let newArm=0;
function fillMenu(){$('mHelp').innerHTML=L('Un mundo sin final que es tuyo. Cava zanjas desde el río y el agua las seguirá. Por la noche, las <b>antorchas</b> iluminan tu pueblo. Todo se guarda en este navegador.','An endless world that is yours. Dig ditches from the river and the water follows. At night, <b>torches</b> light your village. Everything saves in this browser.');
  $('mSeed').textContent=L('semilla ','seed ')+SEED+' · '+edits.size+L(' cambios',' changes');$('mHome').textContent=L('Volver al inicio','Back to start');$('mLang').textContent=LANG==='es'?'English':'Español';
  $('mNew').textContent=newArm?L('¿Seguro? Se borra este mundo','Sure? This world is erased'):L('Mundo nuevo','New world');$('mClose').textContent=L('Seguir','Keep playing');}
$('menuBtn').addEventListener('click',()=>{newArm=0;fillMenu();menu.showModal();$('mClose').focus();});
$('mClose').addEventListener('click',()=>menu.close());
$('mHome').addEventListener('click',()=>{spawn();mobs.length=0;menu.close();save();});
$('mLang').addEventListener('click',()=>{try{localStorage.setItem('terruno-lang',LANG==='es'?'en':'es');}catch(e){}save();location.reload();});
$('mNew').addEventListener('click',()=>{if(!newArm){newArm=1;fillMenu();return;}edits.clear();chunks.clear();flow.length=0;mobs.length=0;folk.length=0;homesInit=0;SEED=Math.floor(Math.random()*1e6);spawn();save();menu.close();curBiome='';});
menu.addEventListener('close',()=>cv.focus&&cv.focus());

/* ---------- loop ---------- */
let last=performance.now();
let lastF=0;
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;lastF=performance.now();now=t-T0;DT=dt;clock+=dt;moveHero(dt);updMobs(dt);updFolk(dt);runFlow();render();updClock();updPlace();updHint();if(now>selT)selEl.classList.add('gone');if(!FR){FR=1;requestAnimationFrame(f2);}}
let FR=0;function f2(t){FR=0;frame(t);}
setInterval(()=>{const t=performance.now();if(!document.hidden&&t-lastF>500){last=t-50;frame(t);}},300);
function spawn(){for(let r=0;r<160;r++)for(let a=0;a<Math.max(1,r*8);a++){const x=Math.round(Math.cos(a/(r*8||1)*6.283)*r),y=Math.round(Math.sin(a/(r*8||1)*6.283)*r);
  let ok=getG(x,y)===GRASS&&!getO(x,y);for(let j=-2;j<=2&&ok;j++)for(let i=-2;i<=2;i++){const g2=getG(x+i,y+j);if(g2!==GRASS&&g2!==FOREST){ok=false;break;}}if(ok){me.x=x*16+8;me.y=y*16+12;return;}}}
if(!load()){SEED=Math.floor(Math.random()*1e6);spawn();}
buildBar();showHint();cv.tabIndex=0;spawnMobs(4,14,6);
requestAnimationFrame(f2);
</script>
