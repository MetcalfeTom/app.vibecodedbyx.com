<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neigh or Yay — horse tinder</title>
<meta name="description" content="Swipe through eligible horses: real stats, questionable quirks, dramatic match animations. Your stable, your rules.">
<meta property="og:title" content="Neigh or Yay — horse tinder">
<meta property="og:description" content="14 eligible horses. Speed, chonk, drama, vibes. Swipe right to fill your stable.">
<meta property="og:url" content="https://sloppy.live/horse-tinder/">
<meta property="og:image" content="https://image.pollinations.ai/prompt/cute%20cartoon%20horse%20winking%20on%20a%20dating%20app%20card%2C%20hearts%2C%20pasture%20background%2C%20playful%20flat%20illustration.png?width=1200&height=630&seed=1001&nologo=true">
<link rel="icon" href="https://emojicdn.elk.sh/🐴">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ --grass:#7fb069; --cream:#fdf6e3; --card:#ffffff; --ink:#3a3226; --pink:#e8537a; --green:#57a05f; --gold:#e8b94d; }
html{ font-size:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; font-family:'Quicksand',sans-serif; color:var(--ink);
  background:linear-gradient(#bfe0f5 0%, #d8ecd4 55%, var(--grass) 100%);
  display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
}
h1{ font-family:'Lilita One',cursive; font-size:clamp(1.8rem,6vw,2.6rem); margin:.7rem 0 0; color:#fff;
  text-shadow:2px 3px 0 rgba(58,50,38,.35); letter-spacing:.02em; }
h1 .neigh{ color:#ffd9e4; } h1 .yay{ color:#e7ffd9; }
.sub{ font-size:.78rem; color:#3a5a40; margin:.1rem 0 .5rem; font-weight:700; }
#filters{ display:flex; gap:.4rem; margin:.2rem 0 .7rem; flex-wrap:wrap; justify-content:center; padding:0 .6rem; }
#filters button{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.72rem; cursor:pointer; min-height:2.75rem;
  background:rgba(255,255,255,.75); color:var(--ink); border:2px solid transparent; border-radius:2rem; padding:.4rem 1rem;
}
#filters button[aria-pressed="true"]{ background:#fff; border-color:var(--pink); color:var(--pink); }
#filters button:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

#stack{ position:relative; width:min(92vw,24rem); height:min(72vh,34rem); touch-action:none; }
.hcard{
  position:absolute; inset:0; background:var(--card); border-radius:1.4rem; overflow:hidden;
  box-shadow:0 12px 30px rgba(58,50,38,.28); user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column;
}
.hcard.under{ transform:scale(.95) translateY(12px); filter:brightness(.94); }
.hcard .photo{ flex:1.25; position:relative; background:linear-gradient(140deg,#cfe6c2,#a8cfa0); min-height:0;
  display:flex; align-items:center; justify-content:center; }
.hcard .photo .fallback{ font-size:5rem; }
.hcard .photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hcard .stamp{
  position:absolute; top:1.2rem; font-family:'Lilita One',cursive; font-size:2rem; padding:.2rem .8rem;
  border:4px solid; border-radius:.6rem; opacity:0; transform:rotate(-14deg); pointer-events:none; z-index:2;
}
.stamp.yay{ left:1rem; color:var(--green); border-color:var(--green); background:rgba(255,255,255,.8); }
.stamp.neigh{ right:1rem; color:var(--pink); border-color:var(--pink); background:rgba(255,255,255,.8); transform:rotate(14deg); }
.hcard .info{ padding:.8rem 1rem 1rem; }
.hcard h2{ font-family:'Lilita One',cursive; font-size:1.4rem; margin:0; }
.hcard h2 small{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:.85rem; color:#8a7d6b; }
.hcard .breed{ font-size:.72rem; font-weight:700; color:var(--green); margin:.05rem 0 .35rem; }
.hcard .bio{ font-size:.76rem; line-height:1.55; margin:0 0 .5rem; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-bottom:.45rem; }
.stat{ text-align:center; }
.stat .lab{ font-size:.55rem; font-weight:700; letter-spacing:.08em; color:#8a7d6b; text-transform:uppercase; }
.stat .bar{ height:.45rem; background:#efe6d2; border-radius:.3rem; overflow:hidden; margin-top:.15rem; }
.stat .bar i{ display:block; height:100%; border-radius:.3rem; background:var(--gold); }
.stat:nth-child(1) .bar i{ background:#5aa8e0; }
.stat:nth-child(2) .bar i{ background:var(--gold); }
.stat:nth-child(3) .bar i{ background:var(--pink); }
.stat:nth-child(4) .bar i{ background:var(--green); }
.quirk{ font-size:.68rem; background:#fdf1d7; border-radius:.5rem; padding:.35rem .6rem; font-weight:700; }
.quirk::before{ content:"⚠ quirk: "; color:#b3782c; }

#actions{ display:flex; gap:1.6rem; margin:.9rem 0 1rem; align-items:center; }
#actions button{
  width:4.2rem; height:4.2rem; border-radius:50%; border:none; cursor:pointer; font-size:1.7rem;
  box-shadow:0 6px 14px rgba(58,50,38,.3); transition:transform .1s;
}
#actions button:active{ transform:scale(.9); }
#actions button:focus-visible{ outline:4px solid #fff; outline-offset:2px; }
#btn-nope{ background:#fff; color:var(--pink); }
#btn-like{ background:var(--pink); color:#fff; }
#counts{ font-size:.72rem; color:#28421f; font-weight:700; }

/* match overlay */
#match{ position:fixed; inset:0; background:rgba(232,83,122,.93); display:none; z-index:20;
  align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:1rem; }
#match.on{ display:flex; }
#match h2{ font-family:'Lilita One',cursive; color:#fff; font-size:clamp(2.2rem,9vw,3.6rem); margin:0;
  animation:matchpop .6s cubic-bezier(.2,1.6,.4,1) both; text-shadow:3px 4px 0 rgba(58,50,38,.3); }
#match .pair{ font-size:4rem; margin:.6rem 0; animation:matchpop .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
#match p{ color:#ffe3ec; font-weight:700; margin:.2rem 0 1.2rem; }
#match button{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:.9rem; cursor:pointer; min-height:2.75rem;
  background:#fff; color:var(--pink); border:none; border-radius:2rem; padding:.6rem 1.8rem; }
#match button:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
@keyframes matchpop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
.heart{ position:fixed; font-size:1.6rem; pointer-events:none; z-index:21; animation:heartfly 1.6s ease-out forwards; }
@keyframes heartfly{ from{ transform:translateY(0) scale(.6) rotate(0); opacity:1; } to{ transform:translateY(-40vh) scale(1.4) rotate(40deg); opacity:0; } }

#empty{ display:none; text-align:center; background:rgba(255,255,255,.85); border-radius:1.2rem; padding:2rem 1.6rem; width:min(92vw,24rem); }
#empty.on{ display:block; }
#empty h2{ font-family:'Lilita One',cursive; margin:0 0 .4rem; }
#empty p{ font-size:.8rem; }
#empty button{ font-family:'Quicksand',sans-serif; font-weight:700; cursor:pointer; min-height:2.75rem;
  background:var(--pink); color:#fff; border:none; border-radius:2rem; padding:.55rem 1.6rem; font-size:.85rem; }
footer{ font-size:.68rem; color:#28421f; font-weight:700; margin:0 0 1.2rem; text-align:center; padding:0 1rem; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<h1><span class="neigh">NEIGH</span> or <span class="yay">YAY</span> 🐴</h1>
<p class="sub">the premium equine connection experience</p>

<div id="filters" role="group" aria-label="Filter horses by vibe">
  <button type="button" data-f="all" aria-pressed="true">all horses</button>
  <button type="button" data-f="pony" aria-pressed="false">🍬 smol</button>
  <button type="button" data-f="draft" aria-pressed="false">💪 absolute units</button>
  <button type="button" data-f="fancy" aria-pressed="false">👑 fancy</button>
  <button type="button" data-f="chaos" aria-pressed="false">🔥 chaos</button>
</div>

<div id="stack" aria-label="Horse profiles — drag right to like, left to pass"></div>
<div id="empty"><h2>the pasture is empty 🌾</h2><p>you've judged every eligible horse in your area.<br>they'll pretend not to care.</p><button type="button" id="btn-again">re-open the pasture</button></div>

<div id="actions">
  <button type="button" id="btn-nope" aria-label="Pass on this horse">✖</button>
  <span id="counts">stable: 0</span>
  <button type="button" id="btn-like" aria-label="Like this horse">🤎</button>
</div>
<footer>drag cards or use ← → · matches are decided by the horses, who have standards<br>like it? vote on sloppy.live</footer>

<div id="match" role="dialog" aria-modal="true" aria-hidden="true" aria-label="It's a match">
  <h2>IT'S A MATCH!</h2>
  <div class="pair">🧑‍🌾💞🐴</div>
  <p id="matchline"></p>
  <button type="button" id="btn-keep">keep swiping</button>
</div>

<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var HORSES=[
  {n:'Butterscotch', a:7, breed:'Shetland Pony', cat:'pony', bio:'Petite icon. Will fit through your cat flap and WILL use it.', q:'bites exclusively landlords', s:[3,8,6,9], seed:2001, p:'cute shetland pony portrait golden mane'},
  {n:'Thunderhoof Magnificent III', a:9, breed:'Friesian', cat:'fancy', bio:'Hair-flip in slow motion at all times. Owns a wind machine.', q:'refuses puddles, demands bridges', s:[7,6,9,8], seed:2002, p:'majestic black friesian horse flowing mane dramatic portrait'},
  {n:'Greg', a:12, breed:'Quarter Horse', cat:'chaos', bio:'Just Greg. No notes. Greg has seen things.', q:'opens every gate. every. gate.', s:[6,5,2,10], seed:2003, p:'plain brown quarter horse deadpan expression portrait'},
  {n:'Duchess Clip-Clop', a:5, breed:'Andalusian', cat:'fancy', bio:'Dances better than you. Knows it. Charges appearance fees.', q:'only drinks sparkling water from troughs', s:[8,4,10,6], seed:2004, p:'elegant white andalusian horse dancing dressage portrait'},
  {n:'Meatball', a:8, breed:'Clydesdale', cat:'draft', bio:'2,000 pounds of gentle. Will lean on you affectionately (fatal).', q:'thinks he is a lap horse', s:[3,10,3,10], seed:2005, p:'huge fluffy clydesdale draft horse gentle eyes portrait'},
  {n:'Karen', a:10, breed:'Appaloosa', cat:'chaos', bio:'Would like to speak to the stable manager. About everything.', q:'files complaints via aggressive snorting', s:[6,6,10,3], seed:2006, p:'spotted appaloosa horse judgmental expression portrait'},
  {n:'Sir Reginald Trotworth', a:6, breed:'Arabian', cat:'fancy', bio:'Old money. Older opinions. Monocle-shaped birthmark.', q:'will not be perceived before 9am', s:[9,3,8,5], seed:2007, p:'refined grey arabian horse aristocratic portrait'},
  {n:'Potato', a:4, breed:'Miniature Horse', cat:'pony', bio:'Round. Fast for no reason. Local legend at the county fair.', q:'steals hats, wears hats, keeps hats', s:[7,7,4,10], seed:2008, p:'chubby miniature horse wearing tiny hat cute portrait'},
  {n:'Nightmare Fuel', a:11, breed:'Mustang', cat:'chaos', bio:'Untamed. Unbothered. Stares at the horizon dramatically.', q:'only catchable on leap years', s:[10,5,7,4], seed:2009, p:'wild dark mustang horse windswept dramatic portrait'},
  {n:'Big Susan', a:9, breed:'Percheron', cat:'draft', bio:'Could pull a house. Has pulled a house. Ask about the house.', q:'emotional support horse for other horses', s:[4,10,2,9], seed:2010, p:'grey percheron draft horse kind giant portrait'},
  {n:'Glitter Tornado', a:3, breed:'Welsh Pony', cat:'pony', bio:'Youthful energy of seventeen espressos. Jumps everything.', q:'allergic to standing still', s:[9,4,6,8], seed:2011, p:'energetic welsh pony mid jump sparkle portrait'},
  {n:'The Baron', a:14, breed:'Lipizzaner', cat:'fancy', bio:'Retired ballet professional. Teaches masterclasses to pigeons.', q:'bows before entering any room', s:[6,5,7,7], seed:2012, p:'white lipizzaner horse levade classical portrait'},
  {n:'Waffle Iron', a:6, breed:'Belgian Draft', cat:'draft', bio:'Named for the incident. We do not discuss the incident.', q:'afraid of butterflies, only orange ones', s:[3,10,5,8], seed:2013, p:'blonde belgian draft horse sheepish expression portrait'},
  {n:'Beyoncneigh', a:7, breed:'Akhal-Teke', cat:'fancy', bio:'Literally metallic. Blinds paparazzi. Insured mane.', q:'requires a hype-squad to enter the paddock', s:[9,4,9,7], seed:2014, p:'golden akhal-teke horse metallic shine glamour portrait'}
];
var MATCHLINES=[
  'NAME thinks you have kind eyes and probably carrots.',
  'NAME has already planned your first trail ride.',
  'NAME super-liked you back. This is not a drill.',
  'NAME saw you from across the pasture and liked your vibe.',
  'NAME says the quirk is negotiable. (It is not.)'
];
var STATL=['speed','chonk','drama','vibes'];
var deck=[], filter='all', stable=0, judged=0;

function buildDeck(){
  deck=HORSES.filter(function(h){ return filter==='all'||h.cat===filter; })
    .map(function(h){ return h; });
  /* light shuffle */
  for(var i=deck.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  paintStack();
}
function cardHTML(h){
  return '<div class="photo"><span class="fallback" aria-hidden="true">🐴</span>'+
    '<img alt="" loading="lazy" src="https://image.pollinations.ai/prompt/'+encodeURIComponent(h.p+', warm flat illustration, dating profile photo style')+'?width=480&height=520&seed='+h.seed+'&nologo=true" onerror="this.remove()">'+
    '<span class="stamp yay">YAY</span><span class="stamp neigh">NEIGH</span></div>'+
    '<div class="info"><h2>'+h.n+' <small>· '+h.a+'</small></h2>'+
    '<div class="breed">'+h.breed+'</div>'+
    '<p class="bio">'+h.bio+'</p>'+
    '<div class="stats">'+h.s.map(function(v,i){
      return '<div class="stat"><div class="lab">'+STATL[i]+'</div><div class="bar"><i style="width:'+(v*10)+'%"></i></div></div>';
    }).join('')+'</div>'+
    '<div class="quirk">'+h.q+'</div></div>';
}
function paintStack(){
  var host=$('stack'); host.innerHTML='';
  $('empty').classList.toggle('on', deck.length===0);
  host.style.display=deck.length? 'block':'none';
  deck.slice(0,2).reverse().forEach(function(h,i,arr){
    var c=document.createElement('article');
    c.className='hcard'+(i<arr.length-1?' under':'');
    c.innerHTML=cardHTML(h);
    host.appendChild(c);
  });
  var top=host.querySelector('.hcard:not(.under)');
  if(top) bindDrag(top);
}

/* ── drag ── */
function bindDrag(el){
  var sx=0, sy=0, dx=0, dragging=false;
  el.addEventListener('pointerdown', function(e){
    dragging=true; sx=e.clientX; sy=e.clientY; el.setPointerCapture(e.pointerId);
    el.style.transition='none';
  });
  el.addEventListener('pointermove', function(e){
    if(!dragging) return;
    dx=e.clientX-sx;
    var dy=e.clientY-sy;
    el.style.transform='translate('+dx+'px,'+(dy*0.4)+'px) rotate('+(dx*0.06)+'deg)';
    var y=el.querySelector('.stamp.yay'), n=el.querySelector('.stamp.neigh');
    y.style.opacity=Math.max(0,Math.min(1,dx/90));
    n.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  el.addEventListener('pointerup', function(){ endDrag(el,dx); dragging=false; dx=0; });
  el.addEventListener('pointercancel', function(){ endDrag(el,0); dragging=false; dx=0; });
}
function endDrag(el,dx){
  if(dx>110){ decide(true, el); }
  else if(dx<-110){ decide(false, el); }
  else{
    el.style.transition='transform .25s'; el.style.transform='';
    var y=el.querySelector('.stamp.yay'), n=el.querySelector('.stamp.neigh');
    if(y) y.style.opacity=0; if(n) n.style.opacity=0;
  }
}
function decide(liked, el){
  if(!deck.length) return;
  var h=deck.shift(); judged++;
  if(el){
    el.style.transition='transform .45s ease-in';
    el.style.transform='translate('+(liked?120:-120)+'vw,-8vh) rotate('+(liked?40:-40)+'deg)';
    setTimeout(paintStack, 240);
  } else paintStack();
  if(liked){
    stable++;
    $('counts').textContent='stable: '+stable;
    /* the horse decides: charm = drama low + vibes high → but everyone has a shot */
    var odds=0.25 + h.s[3]*0.04 - h.s[2]*0.015;
    if(Math.random()<odds) showMatch(h);
  }
}
function showMatch(h){
  $('matchline').textContent=MATCHLINES[Math.floor(Math.random()*MATCHLINES.length)].replace('NAME',h.n);
  var m=$('match'); m.classList.add('on'); m.setAttribute('aria-hidden','false');
  $('btn-keep').focus();
  for(var i=0;i<14;i++){
    var s=document.createElement('span'); s.className='heart';
    s.textContent=['💚','🐴','💞','🥕'][i%4];
    s.style.left=(8+Math.random()*84)+'vw'; s.style.top=(55+Math.random()*35)+'vh';
    s.style.animationDelay=(Math.random()*0.7)+'s';
    document.body.appendChild(s);
    (function(sp){ setTimeout(function(){ sp.remove(); },2600); })(s);
  }
}
$('btn-keep').addEventListener('click', function(){
  var m=$('match'); m.classList.remove('on'); m.setAttribute('aria-hidden','true');
});
$('btn-like').addEventListener('click', function(){ decide(true, document.querySelector('#stack .hcard:not(.under)')); });
$('btn-nope').addEventListener('click', function(){ decide(false, document.querySelector('#stack .hcard:not(.under)')); });
addEventListener('keydown', function(e){
  if($('match').classList.contains('on')) return;
  if(e.key==='ArrowRight') decide(true, document.querySelector('#stack .hcard:not(.under)'));
  if(e.key==='ArrowLeft') decide(false, document.querySelector('#stack .hcard:not(.under)'));
});
[].forEach.call(document.querySelectorAll('#filters button'), function(b){
  b.addEventListener('click', function(){
    filter=b.dataset.f;
    [].forEach.call(document.querySelectorAll('#filters button'), function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
    buildDeck();
  });
});
$('btn-again').addEventListener('click', buildDeck);

buildDeck();
window.__HT={ HORSES:HORSES, get deck(){ return deck; }, decide:decide, buildDeck:buildDeck,
  get stable(){ return stable; }, showMatch:showMatch, set filter(f){ filter=f; }, get filter(){ return filter; } };
})();
</script>
</body>
</html>
