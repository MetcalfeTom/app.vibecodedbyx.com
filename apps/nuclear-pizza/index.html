<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Neon Nuclear Pizza</title>
  <link rel="canonical" href="https://app.sloppy.live/nuclear-pizza/">
  <link rel="icon" href="https://emojicdn.elk.sh/🍕">
  <meta name="description" content="Deliver pizza through a glowing wasteland. Dodge mutant squirrels, don't max out your rads.">
  <meta property="og:title" content="Neon Nuclear Pizza">
  <meta property="og:description" content="Deliver pizza through a glowing wasteland. Dodge mutant squirrels, don't max out your rads.">
  <meta property="og:image" content="https://app.sloppy.live/nuclear-pizza/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://app.sloppy.live/nuclear-pizza/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://app.sloppy.live/nuclear-pizza/og.png">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root { --green: #39ff14; --orange: #ff6600; --red: #ff3b3b; --bg: #0a0a0a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 50% 120%, rgba(57,255,20,0.10), transparent 60%),
        radial-gradient(ellipse at 50% -20%, rgba(255,102,0,0.08), transparent 55%),
        var(--bg);
      color: var(--green);
      font-family: 'VT323', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      -webkit-user-select: none;
      user-select: none;
    }
    header { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    h1 {
      font-family: 'Bungee', cursive;
      font-weight: 400;
      font-size: clamp(1.1rem, 4.2vw, 1.8rem);
      color: var(--orange);
      text-shadow: 0 0 18px var(--orange), 0 0 40px #ff3300;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .hud { display: flex; align-items: center; gap: clamp(12px, 4vw, 34px); font-size: clamp(1.15rem, 4vw, 1.5rem); text-shadow: 0 0 10px var(--green); }
    .hud b { font-weight: 400; color: #eaffdf; }
    .rads { display: flex; align-items: center; gap: 8px; color: var(--red); text-shadow: 0 0 10px var(--red); }
    .meter { width: clamp(70px, 18vw, 140px); height: 12px; border: 2px solid var(--red); box-shadow: 0 0 8px rgba(255,59,59,0.6); }
    .meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ffcc00, var(--red)); transition: width 0.15s linear; }
    .rads.hot .meter { animation: throb 0.5s ease-in-out infinite alternate; }
    @keyframes throb { to { box-shadow: 0 0 18px var(--red); } }
    .combo { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; min-width: 2.5em; }
    .stage { position: relative; }
    #gameCanvas {
      display: block;
      border: 3px solid var(--green);
      box-shadow: 0 0 30px var(--green), inset 0 0 30px rgba(57, 255, 20, 0.1);
      touch-action: none;
      cursor: crosshair;
    }
    .panel {
      position: absolute; inset: 3px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: rgba(4, 6, 4, 0.86);
      text-align: center; padding: 18px;
      z-index: 5;
    }
    .panel h2 { font-family: 'Bungee', cursive; font-weight: 400; font-size: clamp(1.5rem, 6vw, 2.8rem); line-height: 1.05; }
    .panel p { font-size: clamp(1.1rem, 3.6vw, 1.5rem); color: #cfeec4; max-width: 30em; }
    .panel .big { font-size: clamp(1.4rem, 5vw, 2rem); color: #eaffdf; }
    .panel .best { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: clamp(1rem, 3.4vw, 1.3rem); color: #cfeec4; }
    #startPanel h2 { color: var(--orange); text-shadow: 0 0 22px var(--orange); }
    #overPanel h2 { color: var(--red); text-shadow: 0 0 28px #ff0000; }
    #pausePanel h2 { color: var(--green); text-shadow: 0 0 20px var(--green); }
    .btn {
      padding: 12px 34px;
      font-family: 'Bungee', cursive;
      font-size: clamp(1rem, 4vw, 1.4rem);
      background: linear-gradient(180deg, var(--green) 0%, #20aa0a 100%);
      border: none; color: #000; cursor: pointer; border-radius: 6px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: scale(1.06); box-shadow: 0 0 26px var(--green); }
    .btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .hint { font-size: 1.1rem; opacity: 0.65; }
    .new-best { color: #ffcc00; animation: blink 0.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
    .icon-btn {
      position: absolute; top: 10px; right: 10px; z-index: 6;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: 2px solid var(--green); color: var(--green);
      font-size: 1.1rem; cursor: pointer; display: grid; place-items: center;
    }
    #pauseBtn { right: 56px; }
    [hidden] { display: none !important; }
    .touch-only { display: none; }
    @media (pointer: coarse) { .touch-only { display: inline; } .key-only { display: none; } }
    @media (prefers-reduced-motion: reduce) { .new-best, .rads.hot .meter { animation: none; } }
  </style>
</head>
<body>
  <header>
    <h1>☢ NEON NUCLEAR PIZZA ☢</h1>
    <div class="hud" aria-live="off">
      <div>SCORE <b id="score">0</b></div>
      <div>🍕 <b id="pizzas">0</b></div>
      <div class="combo" id="combo" aria-hidden="true"></div>
      <div class="rads" id="radsBox" role="meter" aria-label="Radiation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">☢ <span class="meter"><i id="radBar"></i></span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="gameCanvas" role="img" aria-label="Scooter delivering pizza on a glowing wasteland road"></canvas>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute sound" aria-pressed="false">🔊</button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause" hidden>⏸</button>

    <div class="panel" id="startPanel">
      <h2>NEON NUCLEAR<br>PIZZA</h2>
      <div class="legend">
        <span>🏠 deliver = +100, rads down</span>
        <span>🐿️ mutant squirrels bite</span>
        <span>☢ potholes glow</span>
      </div>
      <p>Hit 100 rads and you're toast.</p>
      <p class="best" id="startBest" hidden></p>
      <button class="btn" id="startBtn" type="button">🍕 RIDE</button>
      <p class="hint"><span class="key-only">WASD / arrows to steer · P pause</span><span class="touch-only">Hold and drag on the road to steer</span></p>
    </div>

    <div class="panel" id="pausePanel" hidden>
      <h2>PAUSED</h2>
      <button class="btn" id="resumeBtn" type="button">▶ KEEP RIDING</button>
    </div>

    <div class="panel" id="overPanel" hidden role="dialog" aria-labelledby="overTitle">
      <h2 id="overTitle">☠ IRRADIATED ☠</h2>
      <p class="big">You delivered <span id="finalPizzas">0</span> pizzas</p>
      <p class="big">Score <span id="finalScore">0</span></p>
      <p class="best" id="overBest"></p>
      <button class="btn" id="restartBtn" type="button">🍕 TRY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);

    // Fixed world, scaled to fit. Portrait phones get a narrower, taller world so nothing is tiny
    let W = 800, H = 500, ROAD_TOP = 100, ROAD_BOT = 450;
    let scale = 1, dpr = 1;
    function pickWorld() {
      const portrait = window.innerHeight > window.innerWidth * 1.15 && window.innerWidth < 700;
      W = portrait ? 520 : 800;
      H = portrait ? 620 : 500;
      ROAD_TOP = H * 0.2; ROAD_BOT = H * 0.9;
    }

    function resize() {
      if (!running && !paused) pickWorld();
      const head = document.querySelector('header').getBoundingClientRect().height;
      const availW = window.innerWidth - 30;
      const availH = window.innerHeight - head - 44;
      scale = Math.max(0.3, Math.min(availW / W, availH / H, 1.4));
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = Math.round(W * scale) + 'px';
      canvas.style.height = Math.round(H * scale) + 'px';
      canvas.width = Math.round(W * scale * dpr);
      canvas.height = Math.round(H * scale * dpr);
      ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
      if (!running) render();
    }

    // Game state
    let score = 0, pizzasDelivered = 0, radiation = 0, difficulty = 1, frameCount = 0;
    let running = false, paused = false, over = false;
    let combo = 0, roadDist = 0, shake = 0, hurtTimer = 0;
    let best = 0;
    try { best = parseInt(localStorage.getItem('nuclearPizzaBest') || '0', 10) || 0; } catch (e) {}

    const player = { x: 120, y: H * 0.55, speed: 5, vx: 0, vy: 0 };
    // Hitbox centred on the drawn scooter (the old one sat below-right of it)
    const hitbox = () => ({ x: player.x - 16, y: player.y - 16, width: 36, height: 32 });

    let squirrels = [], potholes = [], deliveryPoints = [], particles = [], floaters = [];

    // Keyboard: only the game keys are kept from the page
    const keys = {};
    const GAME_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '];
    document.addEventListener('keydown', e => {
      const tgt = e.target instanceof Element ? e.target : null;
      if (tgt && tgt.closest('input, textarea, [contenteditable]')) return;
      const k = e.key.toLowerCase();
      if (k === 'p' || k === 'escape') { if (running) togglePause(); return; }
      if (k === 'm') { toggleMute(); return; }
      if ((k === ' ' || k === 'enter') && !running && !(tgt && tgt.closest('button'))) { e.preventDefault(); startGame(); return; }
      if (GAME_KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; steer = null; });

    // Touch / mouse: hold on the road and the scooter rides toward your finger (a bit above it, so you can see it)
    let steer = null;
    // Fingers steer from ~60px above the touch point so the scooter isn't hidden under the thumb
    const lift = e => e.pointerType === 'mouse' ? 0 : 60 / (canvas.getBoundingClientRect().height / H);
    function toWorld(e) {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
    }
    canvas.addEventListener('pointerdown', e => {
      if (!running || paused) return;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const p = toWorld(e);
      steer = { id: e.pointerId, x: p.x, y: p.y - lift(e) };
    });
    canvas.addEventListener('pointermove', e => {
      if (!steer || steer.id !== e.pointerId) return;
      const p = toWorld(e);
      steer.x = p.x; steer.y = p.y - lift(e);
    });
    const endSteer = e => { if (steer && steer.id === e.pointerId) steer = null; };
    canvas.addEventListener('pointerup', endSteer);
    canvas.addEventListener('pointercancel', endSteer);

    // Sound: tiny WebAudio blips, created on first interaction
    let actx = null, muted = false;
    try { muted = localStorage.getItem('nuclearPizzaMuted') === '1'; } catch (e) {}
    function audio() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
      if (muted) return;
      const a = audio(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    const sfx = {
      deliver: n => { beep(660, 0.09, 'square', 0.05); setTimeout(() => beep(880 + n * 60, 0.14, 'square', 0.05), 80); },
      bite: () => { beep(180, 0.22, 'sawtooth', 0.08, -120); },
      geiger: () => beep(1800 + Math.random() * 900, 0.012, 'square', 0.03),
      over: () => { beep(300, 0.5, 'sawtooth', 0.07, -240); setTimeout(() => beep(120, 0.6, 'triangle', 0.08, -60), 250); }
    };
    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem('nuclearPizzaMuted', muted ? '1' : '0'); } catch (e) {}
      $('muteBtn').textContent = muted ? '🔇' : '🔊';
      $('muteBtn').setAttribute('aria-pressed', String(muted));
      $('muteBtn').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    }

    const rand = (a, b) => a + Math.random() * (b - a);
    const roadSpeed = () => 3 + (difficulty - 1) * 0.6;

    // Mutant Squirrel
    class Squirrel {
      constructor() {
        this.x = W + 50;
        this.width = 35;
        this.height = 30;
        this.y = rand(ROAD_TOP + 22, ROAD_BOT - 22);
        this.speed = rand(2, 4) + difficulty * 0.3;
        this.wobble = Math.random() * Math.PI * 2;
        this.glowHue = rand(80, 140);
        this.mutantLevel = Math.floor(Math.random() * Math.min(3, 1 + difficulty));
      }
      update() {
        this.x -= this.speed;
        this.wobble += 0.1;
        this.y += Math.sin(this.wobble) * 2;
        if (this.mutantLevel > 0 && this.x > player.x - 20) {
          const dy = player.y - this.y;
          this.y += Math.sign(dy) * Math.min(Math.abs(dy), 0.45 * this.mutantLevel);
        }
        this.y = Math.max(ROAD_TOP + 18, Math.min(ROAD_BOT - 18, this.y));
        return this.x > -50;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowColor = `hsl(${this.glowHue}, 100%, 50%)`;
        ctx.shadowBlur = 15;
        // Fluffy tail behind
        ctx.fillStyle = `hsl(${this.glowHue}, 70%, 50%)`;
        ctx.beginPath();
        ctx.ellipse(this.width / 2 + 5, -8 + Math.sin(this.wobble * 2) * 2, 12, 15, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Body
        ctx.fillStyle = `hsl(${this.glowHue}, 80%, 40%)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Ears
        ctx.beginPath();
        ctx.moveTo(-12, -10); ctx.lineTo(-8, -20); ctx.lineTo(-4, -12);
        ctx.moveTo(-2, -12); ctx.lineTo(2, -21); ctx.lineTo(5, -11);
        ctx.fill();
        // Extra eyes for mutants
        const eyes = 2 + this.mutantLevel * 2;
        ctx.fillStyle = '#ff2020';
        ctx.shadowColor = '#ff0000';
        for (let i = 0; i < eyes; i++) {
          const eyeX = -10 + (i % 2) * 9 + Math.floor(i / 2) * 2;
          const eyeY = -5 + Math.floor(i / 2) * 7;
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        // Teeth
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.fillRect(-15, 7, 3, 4); ctx.fillRect(-11, 7, 3, 4);
        ctx.restore();
      }
    }

    // Radioactive Pothole: sits on the road, so it rides at road speed
    class Pothole {
      constructor() {
        this.radius = rand(18, 30);
        this.x = W + 40;
        this.y = rand(ROAD_TOP + this.radius + 6, ROAD_BOT - this.radius - 6);
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.damage = rand(5, 15);
      }
      update() {
        this.x -= roadSpeed();
        this.pulsePhase += 0.1;
        return this.x > -60;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        const pulse = Math.sin(this.pulsePhase) * 0.25 + 1;
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 1.5 * pulse);
        gradient.addColorStop(0, 'rgba(57, 255, 20, 0.8)');
        gradient.addColorStop(0.5, 'rgba(57, 255, 20, 0.3)');
        gradient.addColorStop(1, 'rgba(57, 255, 20, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 1.5 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0d120b';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius, this.radius * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#39ff14';
        for (let i = 0; i < 3; i++) {
          const bx = Math.sin(this.pulsePhase + i * 2) * this.radius * 0.5;
          const by = Math.cos(this.pulsePhase * 1.5 + i) * this.radius * 0.4;
          const br = 3 + Math.sin(this.pulsePhase + i) * 2;
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(0.5, br), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.font = `${Math.round(this.radius * 0.8)}px Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☢', 0, 1);
        ctx.restore();
      }
    }

    // Delivery house: also parked on the road side of the world
    class DeliveryPoint {
      constructor() {
        this.x = W + 40;
        this.y = rand(ROAD_TOP + 34, ROAD_BOT - 34);
        this.radius = 25;
        this.pulsePhase = 0;
      }
      update() {
        this.x -= roadSpeed() * 0.8;
        this.pulsePhase += 0.15;
        return this.x > -50;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        const pulse = Math.sin(this.pulsePhase) * 0.2 + 1;
        ctx.strokeStyle = '#ff6600';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 20;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ff9900';
        ctx.beginPath();
        ctx.moveTo(0, -15); ctx.lineTo(15, 0); ctx.lineTo(10, 0); ctx.lineTo(10, 12);
        ctx.lineTo(-10, 12); ctx.lineTo(-10, 0); ctx.lineTo(-15, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#663300';
        ctx.fillRect(-4, 2, 8, 10);
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color, type) {
        this.x = x; this.y = y; this.color = color; this.type = type;
        this.vx = rand(-3, 3); this.vy = rand(-3, 3);
        this.life = 30; this.size = rand(4, 8);
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vx *= 0.95; this.vy *= 0.95;
        return --this.life > 0;
      }
      draw() {
        ctx.globalAlpha = this.life / 30;
        ctx.fillStyle = this.color;
        if (this.type === 'pizza') {
          ctx.font = `${Math.round(this.size * 3)}px Arial, sans-serif`;
          ctx.fillText('🍕', this.x, this.y);
        } else {
          ctx.fillRect(this.x, this.y, this.size, this.size);
        }
        ctx.globalAlpha = 1;
      }
    }

    function spawnParticles(x, y, color, count, type = 'square') {
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, type));
    }
    function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 50 }); }

    function drawPlayer() {
      if (hurtTimer > 0 && Math.floor(hurtTimer / 4) % 2 === 0) return; // blink while shaken
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(Math.max(-0.18, Math.min(0.18, player.vy * 0.03)));
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 15;
      // Wheels
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(-12, 12, 8, 0, Math.PI * 2);
      ctx.arc(15, 12, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      const spin = roadDist * 0.12;
      [-12, 15].forEach(wx => {
        ctx.beginPath(); ctx.arc(wx, 12, 8, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(wx + Math.cos(spin) * 7, 12 + Math.sin(spin) * 7); ctx.lineTo(wx - Math.cos(spin) * 7, 12 - Math.sin(spin) * 7); ctx.stroke();
      });
      // Body
      ctx.fillStyle = '#ff3300';
      ctx.fillRect(-15, -5, 35, 15);
      // Pizza box stack
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.fillRect(-14, -18, 20, 12);
      ctx.fillStyle = '#cc8800';
      ctx.fillRect(-14, -13, 20, 2);
      // Driver
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff6600';
      ctx.beginPath();
      ctx.arc(10, -8, 8, 0, Math.PI * 2);
      ctx.fill();
      // Helmet
      ctx.fillStyle = '#39ff14';
      ctx.beginPath();
      ctx.arc(10, -10, 7, Math.PI, 0);
      ctx.fill();
      ctx.restore();
      // Exhaust puffs
      if (running && !paused && frameCount % 5 === 0) particles.push(Object.assign(new Particle(player.x - 24, player.y + 6, 'rgba(160,255,140,0.5)'), { vx: -2 - Math.random(), vy: rand(-0.6, 0.6), size: 4 }));
    }

    // Distant ruined skyline, drawn once per resize into its own layer
    const SKY = Array.from({ length: 14 }, (_, i) => ({ w: 34 + (i * 37) % 30, h: 28 + (Math.sin(i * 1.7) * 0.5 + 0.5) * 42, lit: [(i * 7) % 3 === 0, (i * 5) % 4 === 1, (i * 3) % 5 === 2] }));
    function drawBackground() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);
      // Sickly moon
      const mx = W * 0.62;
      const g = ctx.createRadialGradient(mx, 34, 4, mx, 34, 70);
      g.addColorStop(0, 'rgba(200,255,150,0.55)');
      g.addColorStop(0.25, 'rgba(120,255,80,0.18)');
      g.addColorStop(1, 'rgba(57,255,20,0)');
      ctx.fillStyle = g;
      ctx.fillRect(mx - 80, 0, 160, 100);
      ctx.fillStyle = '#d8ffc4';
      ctx.beginPath(); ctx.arc(mx, 34, 13, 0, Math.PI * 2); ctx.fill();
      // Buildings (slow parallax)
      const span = 14 * 62;
      for (let i = 0; i < SKY.length; i++) {
        const b = SKY[i];
        const bx = ((i * 62 - roadDist * 0.15) % span + span) % span - 60;
        ctx.fillStyle = '#121512';
        ctx.fillRect(bx, ROAD_TOP - b.h, b.w, b.h);
        ctx.fillStyle = '#1b1f1a';
        ctx.fillRect(bx + b.w - 6, ROAD_TOP - b.h, 6, b.h);
        for (let k = 0; k < 3; k++) {
          const flick = b.lit[k] && ((frameCount >> 5) + i + k) % 7 !== 0;
          ctx.fillStyle = flick ? '#39ff14' : '#1d2a17';
          ctx.fillRect(bx + 5 + (k % 2) * 14, ROAD_TOP - b.h + 6 + Math.floor(k / 2) * 14, 7, 7);
        }
      }
      // Road
      ctx.fillStyle = '#171a16';
      ctx.fillRect(0, ROAD_TOP, W, ROAD_BOT - ROAD_TOP);
      // Cracks drifting with the road
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 157 - roadDist) % 940 + 940) % 940 - 70;
        const cy = ROAD_TOP + 30 + (i * 97) % (ROAD_BOT - ROAD_TOP - 60);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 18, cy + 6); ctx.lineTo(cx + 30, cy + 2); ctx.lineTo(cx + 44, cy + 10); ctx.stroke();
      }
      // Centre line
      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 2;
      ctx.setLineDash([30, 20]);
      ctx.beginPath();
      ctx.moveTo(-(roadDist % 50), (ROAD_TOP + ROAD_BOT) / 2);
      ctx.lineTo(W + 50, (ROAD_TOP + ROAD_BOT) / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      // Edge glow
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, ROAD_TOP); ctx.lineTo(W, ROAD_TOP);
      ctx.moveTo(0, ROAD_BOT); ctx.lineTo(W, ROAD_BOT);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Toxic shoulder
      ctx.fillStyle = '#0c140a';
      ctx.fillRect(0, ROAD_BOT + 2, W, H - ROAD_BOT);
      ctx.fillStyle = 'rgba(57,255,20,0.25)';
      for (let i = 0; i < 12; i++) {
        const gx = ((i * 71 - roadDist) % 850 + 850) % 850 - 30;
        ctx.fillRect(gx, ROAD_BOT + 12 + (i * 13) % 26, 3, 6 + (i % 3) * 3);
      }
    }

    function checkCollision(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }
    function nearCircle(circle, pad) {
      const dx = (player.x + 2) - circle.x, dy = player.y - circle.y;
      return Math.hypot(dx, dy) < circle.radius + pad;
    }

    function update() {
      frameCount++;
      difficulty = 1 + frameCount / 3600 * 1.2; // +1.2 every minute
      roadDist += roadSpeed();

      // Player movement: keys first, then pointer steering
      let ix = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
      let iy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
      if (ix || iy) {
        const n = Math.hypot(ix, iy);
        player.vx = ix / n * player.speed;
        player.vy = iy / n * player.speed;
      } else if (steer) {
        const dx = steer.x - player.x, dy = steer.y - player.y, d = Math.hypot(dx, dy);
        const sp = Math.min(player.speed * 1.2, d * 0.25);
        player.vx = d > 1 ? dx / d * sp : 0;
        player.vy = d > 1 ? dy / d * sp : 0;
      } else {
        player.vx *= 0.8;
        player.vy *= 0.8;
      }
      player.x = Math.max(26, Math.min(W - 30, player.x + player.vx));
      player.y = Math.max(ROAD_TOP + 20, Math.min(ROAD_BOT - 22, player.y + player.vy));

      // Spawns
      if (frameCount % Math.max(34, Math.round(110 - difficulty * 12)) === 0) squirrels.push(new Squirrel());
      if (frameCount % Math.max(55, Math.round(150 - difficulty * 12)) === 0) potholes.push(new Pothole());
      if (frameCount % 170 === 60) deliveryPoints.push(new DeliveryPoint());

      const hb = hitbox();
      squirrels = squirrels.filter(s => {
        const alive = s.update();
        if (hurtTimer <= 0 && checkCollision(hb, { x: s.x - s.width / 2 + 3, y: s.y - s.height / 2 + 3, width: s.width - 6, height: s.height - 6 })) {
          radiation += 15 + s.mutantLevel * 5;
          spawnParticles(s.x, s.y, '#39ff14', 14);
          floatText(s.x, s.y - 20, 'CHOMP', '#ff3b3b');
          if (combo > 1) floatText(player.x, player.y - 44, 'combo lost', '#ffcc00');
          combo = 0;
          hurtTimer = 45;
          shake = 10;
          sfx.bite();
          return false;
        }
        return alive;
      });

      let inPuddle = false;
      potholes = potholes.filter(p => {
        const alive = p.update();
        if (nearCircle(p, 10)) {
          inPuddle = true;
          radiation += p.damage * 0.045;
          if (frameCount % 4 === 0) spawnParticles(player.x, player.y + 10, '#39ff14', 1);
        }
        return alive;
      });
      if (inPuddle) { shake = Math.max(shake, 2); if (frameCount % 3 === 0) sfx.geiger(); }

      deliveryPoints = deliveryPoints.filter(d => {
        const alive = d.update();
        if (nearCircle(d, 16)) {
          combo = Math.min(5, combo + 1);
          const pts = 100 * combo;
          pizzasDelivered++;
          score += pts;
          radiation = Math.max(0, radiation - 12);
          spawnParticles(d.x, d.y, '#ff6600', 16, 'pizza');
          floatText(d.x, d.y - 30, combo > 1 ? `+${pts} x${combo}` : `+${pts}`, '#ffcc00');
          sfx.deliver(combo);
          return false;
        }
        if (!alive && combo > 0) { combo = 0; floatText(30, d.y, 'missed!', '#ff9900'); }
        return alive;
      });

      particles = particles.filter(p => p.update());
      floaters = floaters.filter(f => { f.y -= 0.7; return --f.life > 0; });
      if (hurtTimer > 0) hurtTimer--;
      if (shake > 0) shake *= 0.85;
      if (shake < 0.3) shake = 0;

      if (frameCount % 6 === 0) score++;
      radiation = Math.max(0, radiation - 0.04);
      if (radiation > 60 && Math.random() < (radiation - 60) / 250) sfx.geiger();

      if (radiation >= 100) { radiation = 100; gameOver(); }
    }

    let lastHud = '';
    function updateHud() {
      const r = Math.floor(radiation);
      const key = score + '|' + pizzasDelivered + '|' + r + '|' + combo;
      if (key === lastHud) return;
      lastHud = key;
      $('score').textContent = score;
      $('pizzas').textContent = pizzasDelivered;
      $('combo').textContent = combo > 1 ? 'x' + combo : '';
      $('radBar').style.width = r + '%';
      $('radsBox').setAttribute('aria-valuenow', r);
      $('radsBox').classList.toggle('hot', r >= 70);
    }

    function render() {
      ctx.save();
      if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
      drawBackground();
      potholes.forEach(p => p.draw());
      deliveryPoints.forEach(d => d.draw());
      squirrels.forEach(s => s.draw());
      particles.forEach(p => p.draw());
      drawPlayer();
      ctx.textAlign = 'center';
      ctx.font = '26px VT323, monospace';
      floaters.forEach(f => {
        ctx.globalAlpha = Math.min(1, f.life / 20);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
      ctx.restore();
      if (radiation > 50) {
        ctx.fillStyle = `rgba(57, 255, 20, ${(radiation - 50) / 260})`;
        ctx.fillRect(0, 0, W, H);
      }
      if (hurtTimer > 36) {
        ctx.fillStyle = 'rgba(255, 40, 40, 0.18)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    // Fixed 60 steps per second, whatever the screen's refresh rate
    const STEP = 1000 / 60;
    let acc = 0, last = 0;
    function loop(t) {
      requestAnimationFrame(loop);
      if (!last) last = t;
      acc += Math.min(250, t - last);
      last = t;
      if (running && !paused) {
        while (acc >= STEP) { update(); acc -= STEP; if (!running) break; }
        updateHud();
      } else {
        acc = 0;
      }
      if (running || over) render();
    }

    function resetWorld() {
      score = 0; pizzasDelivered = 0; radiation = 0; difficulty = 1; frameCount = 0;
      combo = 0; roadDist = 0; shake = 0; hurtTimer = 0; lastHud = '';
      player.x = 120; player.y = (ROAD_TOP + ROAD_BOT) / 2; player.vx = player.vy = 0;
      squirrels = []; potholes = []; deliveryPoints = []; particles = []; floaters = [];
      for (const k in keys) keys[k] = false;
      steer = null;
      updateHud();
    }

    function startGame() {
      audio();
      pickWorld();
      resize();
      resetWorld();
      running = true; paused = false; over = false;
      $('startPanel').hidden = true;
      $('overPanel').hidden = true;
      $('pausePanel').hidden = true;
      $('pauseBtn').hidden = false;
      canvas.focus && canvas.focus();
    }

    function togglePause(force) {
      if (!running) return;
      paused = force !== undefined ? force : !paused;
      $('pausePanel').hidden = !paused;
      $('pauseBtn').textContent = paused ? '▶' : '⏸';
      $('pauseBtn').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
      for (const k in keys) keys[k] = false;
      steer = null;
      if (paused) $('resumeBtn').focus();
    }

    function gameOver() {
      running = false; over = true;
      $('pauseBtn').hidden = true;
      updateHud();
      sfx.over();
      const isBest = score > best;
      if (isBest) { best = score; try { localStorage.setItem('nuclearPizzaBest', String(best)); } catch (e) {} }
      $('finalPizzas').textContent = pizzasDelivered;
      $('finalScore').textContent = score;
      $('overBest').innerHTML = '';
      const b = document.createElement('span');
      b.textContent = isBest && score > 0 ? '★ NEW BEST ★' : 'Best ' + best;
      if (isBest && score > 0) b.className = 'new-best';
      $('overBest').appendChild(b);
      setTimeout(() => { $('overPanel').hidden = false; $('restartBtn').focus(); }, 500);
    }

    $('startBtn').addEventListener('click', startGame);
    $('restartBtn').addEventListener('click', startGame);
    $('resumeBtn').addEventListener('click', () => togglePause(false));
    $('pauseBtn').addEventListener('click', () => togglePause());
    $('muteBtn').addEventListener('click', toggleMute);
    document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) togglePause(true); });

    if (best > 0) { $('startBest').hidden = false; $('startBest').textContent = 'Best ' + best; }
    if (muted) { muted = false; toggleMute(); muted = true; try { localStorage.setItem('nuclearPizzaMuted', '1'); } catch (e) {} }

    window.addEventListener('resize', resize);
    resetWorld();
    resize();
    render();
    requestAnimationFrame(loop);
    window.__np = { get state() { return { running, paused, over, score, radiation, combo, pizzasDelivered, difficulty }; }, player, squirrels: () => squirrels, potholes: () => potholes, deliveryPoints: () => deliveryPoints, startGame, togglePause, update, get W() { return W; }, get H() { return H; }, get ROAD_TOP() { return ROAD_TOP; }, get ROAD_BOT() { return ROAD_BOT; }, spawn: { Squirrel, Pothole, DeliveryPoint }, set: (k, v) => { if (k === 'radiation') radiation = v; if (k === 'hurt') hurtTimer = v; } };
  </script>
<script src="/sloppy-header/sloppy-bar.js"></script>
</body>
</html>
